abstract:
- language: en
  script: Latn
  content: |-
    IEC 60335-2-67:2012+A1:2016 deals with the safety of powered floor treatment machines intended for commercial indoor or outdoor use for the following applications:<br/>
    - scrubbing,<br/>
    - wet or dry pick-up,<br/>
    - polishing and dry buffing,<br/>
    - application of wax, sealing products and powder based detergents,<br/>
    - shampooing,<br/>
    - stripping, grinding and scarifying of floors with an artificial surface. Their cleaning motion is more lateral or periodic than linear. This standard applies to machines for commercial use. The following list, although not comprehensive, gives an indication of locations that are included in the scope:<br/>
    - public use areas such as hotels, schools, hospitals;<br/>
    - industrial locations, for example factories and manufacturing shops;<br/>
    - retail outlets, for example shops and supermarkets;<br/>
    - business premises, for example offices and banks;<br/>
    - all uses other than normal housekeeping purposes.<br/>
    They are not equipped with a traction drive. The following power systems are covered:<br/>
    - internal combustion engines,<br/>
    - mains powered motors up to a rated voltage of 250 V for single-phase appliances and 480 V for other appliances,<br/>
    - battery-powered motors.<br/>
    Battery powered machines may be equipped with a built-in battery charger. This fourth edition cancels and replaces the third edition published in 2002 and its Amendment 1 (2005). It constitutes a technical revision. The principal changes in this edition as compared with the third edition of IEC 60335-2-67 are as follows (minor changes are not listed):<br/>
    - the title has been changed for better distinction with regard to IEC 60335-2-72;<br/>
    - the scope has been revised editorially to avoid misunderstandings;<br/>
    - terms and definitions has been revised with regard to the requirements revised;<br/>
    - the standard has been revised in general and updated regarding state-of-the-art, as far as necessary, in particular some changes have been made to Clauses 15, 22 and 25;<br/>
    - a new Annex BB (LPG requirements) was added;<br/>
    - a new Annex CC 'Emission of acoustical noise' was added;<br/>
    - and a new Annex DD 'Emission of vibration' was added. Keywords: Floor treatment machine; Water-suction cleaning machine<br/>
    <br/>
    This publication is to be read in conjunction with IEC 60335-1:2010. This consolidated version consists of the fourth edition (2012) and its amendment 1 (2016).
- language: fr
  script: Latn
  content: |-
    L'IEC 60335-2-67:2012+A1:2016 traite de la sécurité des machines detraitement des sols à usage commercial, intérieur ou extérieur, pour les applications suivantes:<br/>
    - brossage,<br/>
    - ramassage à sec ou en présence d'eau,<br/>
    - lustrage et polissage à sec,<br/>
    - application de cire, de produits d'étanchéité et de détergents à base de poudre,<br/>
    - nettoyage par shampouineuse,<br/>
    - décapage, ponçage et scarification de sols avec une surface artificielle. Leur mouvement de nettoyage est plus latéral ou périodique que linéaire. La présente norme s'applique aux machines à usage commercial. La liste suivante, sans être exhaustive, donne une indication des emplacements compris dans le domaine d'application:<br/>
    - espaces publics tels que les hôtels, les écoles, les hôpitaux;<br/>
    - sites industriels, par exemple les usines et les ateliers de fabrication;<br/>
    - commerces, par exemple les magasins de détail et les supermarchés;<br/>
    - établissements commerciaux, par exemple les bureaux et les banques;<br/>
    - toute utilisation autre que les utilisations domestiques normales. Ces machines ne possèdent pas de dispositif de transmission. Les systèmes d'alimentation électrique suivants sont couverts:<br/>
    - moteurs à combustion interne,<br/>
    - moteurs alimentés par le réseau jusqu'à une tension assignée de 250 V pour les appareils monophasés et 480 V pour les autres appareils,<br/>
    - moteurs alimentés par batteries.<br/>
    Les machines alimentées par batterie peuvent être équipées d'un chargeur de batterie incorporé. Cette quatrième édition annule et remplace la troisième édition publiée en 2002 et son Amendement 1 (2005). Elle constitue une révision technique. Les principales modifications de la présente édition par rapport à la troisième édition de la CEI 60335-2-67 sont les suivantes (les changements mineurs ne sont pas listés):<br/>
    - le titre a été modifié pour une meilleure distinction d'avec la CEI 60335-2-72;<br/>
    - le domaine d'application a fait l'objet d'une révision éditoriale afin d'éviter toute erreur d'interprétation;<br/>
    - les termes et définitions ont été révisés par rapport aux exigences révisées;<br/>
    - la norme a été révisée de manière générale et mise à jour au regard de l'état de l'art, dans la mesure du nécessaire;<br/>
    - certaines modifications, en particulier, ont été apportées aux Articles 15, 22, et 25;<br/>
    - une nouvelle Annexe BB (exigences liées au GPL) a été ajoutée;<br/>
    - une nouvelle Annexe CC 'Emission de bruit acoustique' a été ajoutée;<br/>
    - et une nouvelle Annexe DD 'Emission de vibrations' a été ajoutée. Mots clé: machines de traitement des sols; appareils de nettoyage à aspiration d'eau.<br/>
    <br/>
    Cette publication doit être lue conjointement avec la CEI 60335-1:2010.  Cette version consolidée comprend la quatrième édition (2012) et son amendement 1 (2016).
