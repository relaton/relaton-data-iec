abstract:
- language: en
  script: Latn
  content: |-
    IEC 61298-2:2026 RLV contains both the official IEC International Standard and its Redline version. The Redline version is available in English only and provides you with a quick and easy way to compare all the changes between the official IEC Standard and its previous edition.<br/>
    <br/>
    IEC 61298-2:2026 specifies general methods and procedures for conducting tests and reporting on the functional and performance characteristics of process instrumentation except process measurement transmitters (PMT) which are standardized by IEC 62828 series. The tests are applicable to any such devices characterized by their own specific input and output variables, and by the specific relationship (transfer function) between the inputs and outputs and include analogue and digital devices. For devices that require special tests, this standard can be used, together with any product specific standard specifying special tests. This document covers tests made under reference conditions.<br/>
    This third edition cancels and replaces the second edition published in 2008. This edition constitutes a technical revision.<br/>
    This edition includes the following significant technical changes with respect to the previous edition:<br/>
    a) Process measurement transmitters (PMT) have been removed from the scope of this standard
