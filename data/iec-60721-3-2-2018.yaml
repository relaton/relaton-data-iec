abstract:
- language: en
  script: Latn
  content: |-
    IEC 60721-3-2:2018 classifies the groups of environmental parameters and their severities to which a product is subjected while being transported and handled. The most commonly used methods of transportation and handling have been taken into account, including the following:<br/>
    - road transport: cars, trucks;<br/>
    - rail transport: trains, trams;<br/>
    - water transport, inland and maritime: ships;<br/>
    - air transport: aircraft, jet, propeller, helicopter;<br/>
    - handling equipment: cranes, transport lifts, cableways, persons;<br/>
    - conveyors;<br/>
    - hand trollies.<br/>
    This third edition cancels and replaces the second edition, published in 1997, and constitutes a technical revision. This edition includes the following significant technical changes with respect to the previous edition:<br/>
    a. Clause 1: reworded and added handling.<br/>
    b. Clause 2: updated normative references.<br/>
    c. Clause 3: updated definitions.<br/>
    d. Clause 4: reworded and simplified.<br/>
    e. Clause 5: revised and updated. Several classes have been replaced by completely new classes based on the use of new information obtained from referenced Technical Reports.<br/>
    f. Table 1 through Table 5: updated.<br/>
    g. Table 6 added.<br/>
    h. Old annexes A to C removed except Clause A.3 that is incorporated in Clause 5.<br/>
    i. New Annex A.<br/>
    The contents of the corrigenda of November 2018, June 2022 and May 2024 have been included in this copy.
- language: fr
  script: Latn
  content: |-
    L’IEC 60721-3-2:2018 classifie les groupements d’agents d’environnement et de leurs sévérités auxquelles un produit est soumis lors de son transport et de sa manutention. Il a été tenu compte des moyens de transport les plus couramment employés, y compris les moyens suivants:<br/>
    - transports routiers: voitures, camions;<br/>
    - transports ferroviaires: trains, tramways;<br/>
    - transport par voies navigables, fluviales et maritimes: navires;<br/>
    - transports aériens: avions (à propulsion, à hélice), hélicoptères;<br/>
    - matériel de manutention: grues, monte-charges, téléphériques, personnes;<br/>
    - courroies transporteuses;<br/>
    - chariots manuels.<br/>
    Cette troisième édition annule et remplace la deuxième édition, parue en 1997. Elle constitue une révision technique. Cette édition inclut les modifications techniques majeures suivantes par rapport à l’édition précédente:<br/>
    a. Article 1: reformulation et ajout de la manutention.<br/>
    b. Article 2: mise à jour des références normatives.<br/>
    c. Article 3: mise à jour des définitions.<br/>
    d. Article 4: reformulé et simplifié.<br/>
    e. Article 5: révisé et mis à jour. Plusieurs catégories ont été remplacées par des catégories complètement nouvelles sur la base de nouvelles informations obtenues à partir des rapports techniques référencés.<br/>
    f. Tableau 1 au Tableau 5: mise à jour.<br/>
    g. Tableau 6 ajouté.<br/>
    h. Suppression des anciennes annexes A à C à l’exception de l’Article A.3 qui est intégré dans l’Article 5.<br/>
    i. Nouvelle Annexe A.<br/>
    Le contenu des corrigendum de novembre 2018, juin 2022 et mai 2024 a été pris en considération dans cet exemplaire.
