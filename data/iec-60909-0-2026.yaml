abstract:
- language: en
  script: Latn
  content: |-
    IEC 60909-0:2026 This part of IEC 60909 is applicable to the calculation of short-circuit currents in low-voltage three-phase AC systems, in high-voltage three-phase AC systems, and operating at a nominal frequency of 50 Hz or 60 Hz.<br/>
    Systems at highest voltages of 550 kV and above with long transmission lines are outside the scope of this document.
- language: fr
  script: Latn
  content: |-
    IEC 60909-0:2026 La présente partie de l’IEC 60909 est applicable au calcul des courants de court-circuit dans les réseaux triphasés basse tension en courant alternatif, dans les réseaux triphasés haute tension en courant alternatif, et fonctionnant à une fréquence nominale de 50 Hz ou de 60 Hz.<br/>
    Les réseaux soumis aux tensions les plus élevées (550 kV et plus) et associés à des lignes de transport de grande longueur ne relèvent pas du domaine d’application du présent document.
