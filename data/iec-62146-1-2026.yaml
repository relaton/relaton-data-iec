abstract:
- language: en
  script: Latn
  content: "<!-- NEW! -->IEC 62146-1:2026 is available as <a href=\"https://webstore.iec.ch/publication/115244\">IEC
    62146-1:2026 RLV</a> which contains the International Standard and its Redline
    version, showing all changes of the technical content compared to the previous
    edition.</br></br>IEC 62146-1:2026 includes generalities of capacitors used on
    alternating current circuit-breakers and introduces specifications for grading
    capacitors. Regarding grading capacitors, their function is to control the voltage
    distribution across the individual interrupter units of a multi-break circuit-breaker.<br
    />\r\nThis document applies to grading capacitors falling into one or both of
    the following categories for:<br />\r\n- mounting on air-insulated circuit-breakers.<br
    />\r\n- mounting on enclosed circuit-breakers (for example immersed in insulating
    gas, in oil, etc.).<br />\r\nThe object of this document is:<br />\r\n- to define
    uniform rules regarding performances, testing and rating;<br />\r\n- to define
    specific safety rules;<br />\r\n- to provide a guidance for installation and operation.<br
    />\r\nThis document does not apply to capacitors not directly associated with
    high-voltage alternating current circuit-breakers."
- language: fr
  script: Latn
  content: "<!-- NEW! -->IEC 62146-1:2026 est disponible sous forme de <a href=\"https://webstore.iec.ch/publication/115244\">IEC
    62146-1:2026 RLV</a> qui contient la Norme internationale et sa version Redline,
    illustrant les modifications du contenu technique depuis l'�dition pr�c�dente.</br></br>L’IEC
    62146-1:2026 expose des généralités concernant les condensateurs utilisés sur
    les disjoncteurs à courant alternatif et présente des spécifications relatives
    aux condensateurs de répartition. Les condensateurs de répartition ont pour fonction
    de contrôler la répartition de la tension entre chaque interrupteur d'un disjoncteur
    à coupure multiple.<br />\r\nLe présent document s'applique aux condensateurs
    de répartition relevant de l'une des catégories suivantes, ou des deux:<br />\r\n-
    condensateurs montés sur des disjoncteurs isolés dans l’air;<br />\r\n- condensateurs
    montés sur des disjoncteurs protégés (par exemple, immergés dans du gaz isolant,
    dans l'huile, etc.).<br />\r\nL'essai applicable à chacune des applications susmentionnées
    est différent dans certains cas.<br />\r\nLe présent document a pour objet de:<br
    />\r\n- définir des règles uniformes concernant les performances, les essais et
    les caractéristiques assignées;<br />\r\n- définir des règles de sécurité spécifiques;<br
    />\r\n- fournir des recommandations pour l’installation et le fonctionnement.<br
    />\r\nLe présent document ne s’applique pas aux condensateurs qui ne sont pas
    directement associés aux disjoncteurs à courant alternatif haute tension."
