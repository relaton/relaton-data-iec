abstract:
- language: en
  script: Latn
  content: |-
    IEC 60086-2-1:2026 is applicable to primary batteries which are based on standardised electrochemical systems using aqueous electrolytes.<br/>
    It specifies:<br/>
    - the physical dimensions,<br/>
    - the discharge test conditions and discharge performance requirements.<br/>
    IEC 60086-2-1: 2026 cancels and replaces the fourteenth edition of IEC 60086 2 published in 2021. This edition constitutes a technical revision.<br/>
    This edition includes the following significant technical changes with respect to the previous edition:<br/>
    a) separation of lithium batteries into IEC 60086-2-2: Physical and electrical specifications;<br/>
    b) in Clause 3, terms were reordered according to their functions: electrochemical systems, electrical characteristics and specifications;<br/>
    c) TR03 and TR6 were added in Category 1, Round batteries;<br/>
    d) load of digital audio test for LR03, TR03 and R03 was changed from 50 mA to 75 mA and MAD was modified;<br/>
    e) personal grooming test of LR6 was added instead of high drain application test;<br/>
    f) high drain application test was added for TR6;<br/>
    g) radio /clock /remote control test was added for R6S;<br/>
    h) CD, digital audio, wireless gaming and accessories test was removed for LR6, R6P and R6S;<br/>
    i) 4,5 V of common designation was added for 3LR12, 3R12P and 3R12S;<br/>
    j) Annex D for common designation of IEC 60086 2:2021 was moved to IEC 60086 1:2026, as Annex H;<br/>
    k) Annex E for Compliance checklist of IEC 60086 2:2021 was removed and merged into Annex J of IEC 60086 1:2026.
- language: fr
  script: Latn
  content: |-
    L'IEC 60086-2-1:2026 s’applique aux piles électriques qui sont basées sur des systèmes électrochimiques normalisés, utilisant des électrolytes aqueux.<br/>
    Elle spécifie :<br/>
    - les dimensions physiques;<br/>
    - les conditions d’essai de décharge et les exigences relatives aux performances de décharge.<br/>
    IEC 60086-2-1: 2026 annule et remplace la quatorzième édition de l’IEC 60086 2 parue en 2021. Cette édition constitue une révision technique.<br/>
    Cette édition inclut les modifications techniques majeures suivantes par rapport à l’édition précédente:<br/>
    a) séparation des piles au lithium dans l’IEC 60086-2-2: Spécifications physiques et électriques;<br/>
    b) dans l’Article 3, les termes ont été réorganisés selon leurs fonctions: systèmes électrochimiques, caractéristiques électriques et spécifications;<br/>
    c) ajout des désignations TR03 et TR6 dans la Catégorie 1, Piles rondes;<br/>
    d) modification de 50 mA à 75 mA de la charge de l’essai audionumérique pour les désignations LR03, TR03 et R03, et modification de la MAD;<br/>
    e) ajout de l’essai d’accessoires de toilette pour la désignation LR6, à la place de l’essai d’application à courant de décharge fort;<br/>
    f) ajout de l’essai d’application à courant de décharge fort pour la désignation TR6;<br/>
    g) ajout de l’essai radio/horloge/télécommande pour la désignation R6S;<br/>
    h) suppression de l’essai CD, audionumérique, jeux sans fil et accessoires pour les désignations LR6, R6P et R6S;<br/>
    i) ajout de la désignation commune de 4,5 V pour les désignations 3LR12, 3R12P et 3R12S;<br/>
    j) déplacement dans l’IEC 60086 1:2026, en qualité d’Annexe H, de l’Annexe D de l’IEC 60086 2:2021 donnant les désignations communes;<br/>
    k) suppression de l’Annexe E Liste de contrôle de conformité de l’IEC 60086 2:2021 et fusion avec l’Annexe J de l’IEC 60086 1:2026.
