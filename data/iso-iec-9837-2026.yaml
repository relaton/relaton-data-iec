abstract:
- language: en
  script: Latn
  content: |-
    <p>This document establishes concepts for understanding and improving systems resilience. Systems resilience addresses the capabilities of systems under adversity.</p>
    <p>This document is applicable to human-created systems that can be either physical or conceptual, or a combination of both. It applies to systems as defined in ISO/IEC/IEEE 15288, including services and products. It is not intended to apply to naturally occurring systems.</p>
