abstract:
- content: "IEC 63369-1:2026 addresses general requirements and methodology, whereas
    intended IEC 63369-2 and intended IEC 63369-3 address applications of the methodology
    and default values of the CFF parameters by geographic area (see Annex B).<br
    />\r\nThis document provides a comprehensive methodology for the calculation of
    carbon footprint of industrial type Li-ion battery systems from cradle to grave.<br
    />\r\nSecond life and/or usage that was not intended when the battery was put
    on the market is not taken into account in this document.<br />\r\nThis document,
    along with the other parts of this series, does not apply to batteries for portable,
    SLI and electric road vehicle traction applications. The definition of the parameters
    used for the carbon footprint calculation allows for comparability of results
    for all rechargeable Li-ion chemistries.<br />\r\nClasses of representative products
    are defined in this document to allow comparison inside each class.<br />\r\nThis
    methodology, based on the data provided by the battery manufacturer, is mainly
    intended to allow a carbon footprint assessment of several battery solutions over
    the Cumulated Requested Service (CRS). This assessment can be used in the selection
    process of the battery purchaser.<br />\r\nThe methodology can also be used for
    a variety of purposes such as battery system development, eco-design and participation
    in voluntary or mandatory programs.<br />\r\nThe methodology in this document
    is based exclusively on attributional life cycle assessment (LCA).<br />\r\nThe
    carbon footprint calculation of charging equipment and power conversion equipment
    not necessary for battery functions is not covered in this document."
  language:
