  format: text/html
- content: "IEC 63369-1:2026 traite des exigences générales et de la méthodologie,
    tandis que l’IEC 63369-2 et l’IEC 63369-3 prévues traitent des applications de
    la méthodologie et des valeurs par défaut des paramètres de la FEC par zone géographique
    (voir Annexe B).<br />\r\nLe présent document fournit une méthodologie complète
    permettant de calculer l’empreinte carbone pour des batteries Li-ion de type industriel,
    \"du berceau à la tombe\".<br />\r\nLe présent document ne tient toutefois pas
    compte d’une éventuelle seconde vie et/ou de toute utilisation qui n’était pas
    prévue lors de la mise sur le marché de la batterie.<br />\r\nLe présent document,
    ainsi que les autres parties de cette série, ne s’applique pas aux batteries pour
    applications portables, SLI et de traction de véhicules routiers électriques.
    La définition des paramètres utilisés pour le calcul permet la comparabilité des
    résultats pour toutes les chimies Li-ion rechargeables. Des classes de produits
    représentatifs sont définies dans le présent document pour permettre une comparaison
    à l’intérieur de chaque classe.<br />\r\nCette méthodologie, basée sur les données
    fournies par les fabricants de batteries, vise principalement à permettre une
    évaluation de l’empreinte carbone de différentes solutions de batterie pendant
    tout le service demandé cumulé (SDC). Cette évaluation peut être utilisée par
    l’acheteur de la batterie durant son processus de sélection.<br />\r\nLa méthodologie
    peut également être utilisée à d’autres fins telles que le développement et l’écoconception
    de systèmes de batterie, ainsi que la participation à des programmes volontaires
    ou obligatoires.<br />\r\nLa méthodologie du présent document repose exclusivement
    sur l’analyse du cycle de vie attributionnelle (ACV-A).<br />\r\nLe calcul de
    l’empreinte carbone des équipements de recharge et des équipements de conversion
    de puissance non nécessaires pour les fonctions d’une batterie n’est pas couvert
    par le présent document."
