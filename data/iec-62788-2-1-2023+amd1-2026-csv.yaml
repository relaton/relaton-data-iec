abstract:
- language: en
  script: Latn
  content: IEC 62788-2-1:2023+AMD1:2026 CSV specifies the safety requirements for
    flexible polymeric front- and backsheet constructions, which are intended for
    use as relied-upon insulation in photovoltaic (PV) modules. The specifications
    in this document define the specific requirements of polymeric front- or backsheet
    constructions on the component level and cover mechanical, electrical, visual
    and thermal characterization in an unexposed state and/or after ageing. This document
    covers class II and class 0 modules, as defined in IEC 61730-1. Class III modules
    are out of scope. This document provides the requirements for qualification of
    front- and backsheets to be used in module safety qualification according to IEC
    61730-1. Test method descriptions are provided in IEC TS 62788-2, along with additional
    characterization methods useful for performance or quality assurance.
