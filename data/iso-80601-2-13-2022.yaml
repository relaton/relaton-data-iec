abstract:
- language: en
  script: Latn
  content: |-
    ISO 80601-2-13:2022 This document is applicable to the basic safety and essential performance of an anaesthetic workstation for administering inhalational anaesthesia whilst continuously attended by a professional operator.<br/>
    This document specifies particular requirements for a complete anaesthetic workstation and the following anaesthetic workstation components which, although considered as individual devices in their own right, may be utilized, in conjunction with other relevant anaesthetic workstation components, to form an anaesthetic workstation to a given specification:<br/>
    - anaesthetic gas delivery system;<br/>
    - anaesthetic breathing system;<br/>
    - anaesthetic gas scavenging system (AGSS);<br/>
    - anaesthetic vapour delivery system;<br/>
    - anaesthetic ventilator;<br/>
    - monitoring equipment;<br/>
    - alarm system;<br/>
    - protection device.<br/>
    NOTE 1 Monitoring equipment, alarm systems and protection devices are summarized in Table AA.1.<br/>
    An anaesthetic workstation supplied complete and its individual components are considered as ME equipment or ME systems with regard to the general standard.<br/>
    NOTE 2 The applicability of this document is indicated in Table AA.2.<br/>
    This document is also applicable to those accessories intended by their manufacturer to be connected to an anaesthetic workstation where the characteristics of those accessories can affect the basic safety and essential performance of the anaesthetic workstation.<br/>
    If a clause or subclause is specifically intended to be applicable to anaesthetic workstation components or its accessories only, the title and content of that clause or subclause will say so. If that is not the case, the clause or subclause applies both to an anaesthetic workstation and its individual components including accessories, as relevant.<br/>
    Hazards inherent in the intended physiological function of an anaesthetic workstation and its individual components including accessories within the scope of this document are not covered by specific requirements in this document except in IEC 60601-1:2005+AMD1:2012+AMD2:2020, 7.2.13 and 8.4.1.<br/>
    NOTE 3 See also IEC 60601-1:2005+AMD1:2012+AMD2:2020, 4.2.<br/>
    This document is not applicable to any anaesthetic workstation intended for use with flammable anaesthetic agents, as determined by Annex BB.
- language: fr
  script: Latn
  content: |-
    ISO 80601-2-13:2022 Le présent document s’applique à la sécurité de base et aux performances essentielles d’un poste de travail d’anesthésie pour l’administration d’un anesthésiant par inhalation tout en étant assisté en continu par un opérateur professionnel.<br/>
    Le présent document spécifie les exigences particulières pour un poste de travail d’anesthésie complet et les composants suivants d’un poste de travail d’anesthésie qui, bien qu’ils soient considérés comme des dispositifs individuels à part entière, peuvent être utilisés en association avec d’autres composants appropriés d’un poste de travail d’anesthésie afin de former un poste de travail d’anesthésie selon une spécification donnée:<br/>
    - système d’administration de gaz anesthésique;<br/>
    - système d’anesthésie par voie respiratoire;<br/>
    - système d’évacuation des gaz anesthésiques (SEGA);<br/>
    - système d’administration de vapeur anesthésique;<br/>
    - ventilateur d’anesthésie;<br/>
    - appareil de surveillance;<br/>
    - système d’alarme;<br/>
    - dispositif de protection.<br/>
    NOTE 1 Les appareils de surveillance, les systèmes d’alarme et les dispositifs de protection font l’objet d’un récapitulatif dans le Tableau AA.1.<br/>
    Un poste de travail d’anesthésie fourni en tant qu’ensemble complet et ses composants individuels sont considérés comme un équipement EM ou des systèmes EM en ce qui concerne la norme générale.<br/>
    NOTE 2 L’applicabilité du présent document est indiquée dans le Tableau AA.2.<br/>
    Le présent document s’applique également aux accessoires destinés, selon leur fabricant, à être raccordés à un poste de travail d’anesthésie lorsque les caractéristiques de ces accessoires peuvent affecter la sécurité de base et les performances essentielles du poste de travail d’anesthésie.<br/>
    Si un article ou un paragraphe est spécifiquement destiné à être appliqué aux composants d’un poste de travail d’anesthésie ou à ses accessoires uniquement, le titre et le contenu de cet article ou de ce paragraphe le mentionneront. Si cela n’est pas le cas, l’article ou le paragraphe s’applique à la fois à un poste de travail d’anesthésie et à ses composants individuels, y compris ses accessoires, comme il se doit.<br/>
    Les dangers inhérents à la fonction physiologique prévue d’un poste de travail d’anesthésie et de ses composants individuels, y compris ses accessoires, dans le cadre du domaine d’application du présent document ne sont pas couverts par des exigences particulières contenues dans le présent document, à l’exception de l’IEC 60601-1:2005+AMD1:2012+AMD2:2020, 7.2.13 et 8.4.1.<br/>
    NOTE 3 Voir également l’IEC 60601-1:2005+AMD1:2012+AMD2:2020, 4.2.<br/>
    Le présent document ne s’applique pas aux postes de travail d’anesthésie destinés à être utilisés avec des agents anesthésiques inflammables, comme déterminé par l’Annexe BB.
