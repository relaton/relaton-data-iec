abstract:
- language: en
  script: Latn
  content: |-
    IEC 61000-4-18: 2019 focuses on the immunity requirements and test methods for electrical and electronic equipment, under operational conditions, with regard to:<br/>
    a) repetitive slow damped oscillatory waves occurring mainly in power, control and signal cables installed in high voltage and medium voltage (HV/MV) substations;<br/>
    b) repetitive fast damped oscillatory waves occurring mainly in power, control and signal cables installed in gas insulated substations (GIS) and in some cases also air insulated substations (AIS) or in any installation due to high-altitude electromagnetic pulse (HEMP) phenomena.<br/>
    The object of this document is to establish a common and reproducible reference for evaluating the immunity of electrical and electronic equipment when subjected to damped oscillatory waves on supply, signal, control and earth ports. The test method documented in this part of IEC 61000 describes a consistent method to assess the immunity of an equipment or system against a defined phenomenon. NOTE As described in IEC Guide 107, this is a basic EMC publication for use by product committees of the IEC. As also stated in Guide 107, the IEC product committees are responsible for determining whether this immunity test standard is applied or not, and if applied, they are responsible for determining the appropriate test levels and performance criteria. The document defines:<br/>
    test voltage and current waveforms;<br/>
    ranges of test levels;<br/>
    test equipment;<br/>
    calibration and verification procedures of test equipment;<br/>
    test setups;<br/>
    test procedure.<br/>
    This second edition cancels and replaces the first edition published in 2006 and its Amendment 1:2010. This edition constitutes a technical revision. This edition includes the following significant technical changes with respect to the previous edition:<br/>
    a) addition of a mathematical modelling of damped oscillatory wave waveform;<br/>
    b) new Annex B on measurement uncertainty;<br/>
    c) addition high speed CDN;<br/>
    d) addition of calibration procedures for CDNs;<br/>
    e) addition of the use of the capacitive coupling clamp on interconnection lines for fast damped oscillatory waves;<br/>
    f) addition of a test procedure for DC/DC converters in case the CDN does not work;<br/>
    g) new Annex C on issues relating to powering EUTs having DC/DC converters at the input.<br/>
    Keywords: immunity requirements and test methods for electrical and electronic equipment<br/>
    The contents of the corrigendum of August 2019 have been included in this copy.
- language: fr
  script: Latn
  content: |-
    IEC 61000-4-18: 2019 traite des exigences d'immunité et des méthodes d'essai des matériels électriques et électroniques dans des conditions d'exploitation, vis-à-vis:<br/>
    a) des ondes oscillatoires amorties lentes répétitives se manifestant principalement sur les câbles d’alimentation, de commande et de signal installés dans les postes à haute et à moyenne tension (HT/MT);<br/>
    b) des ondes oscillatoires amorties rapides répétitives se produisant principalement sur les câbles d'alimentation, de commande et de signal installés dans les postes métalliques sous enveloppes à isolation gazeuse (GIS) et dans certains cas également dans les postes à isolation par air (AIS) ou toute installation du fait des phénomènes d’impulsion électromagnétique à haute altitude (IEMN-HA).<br/>
    Le présent document a pour objet d'établir une référence commune reproductible dans le but d'évaluer l’immunité des matériels électriques et électroniques, quand ils sont soumis aux ondes oscillatoires amorties sur des accès d’alimentation, de signal, de commande et par les bornes de terre. La méthode d'essai documentée dans cette partie de l’IEC 61000 décrit une méthode logique en vue d'évaluer l'immunité d'un équipement ou d'un système vis-à-vis d'un phénomène donné.NOTE Comme décrit dans le Guide 107 de l’IEC, il s’agit d’une publication fondamentale en CEM pour une utilisation par les comités de produits de l’IEC. Comme indiqué également dans le Guide 107, les comités de produits de l’IEC sont chargés de déterminer si cette norme d’essai d’immunité est appliquée ou non. Si tel est le cas, il leur incombe de déterminer les niveaux d’essai et les critères d’aptitude à la fonction appropriés. Le document définit:<br/>
    la tension d'essai et les formes d'ondes de courant;<br/>
    les plages de niveaux d'essais;<br/>
    le matériel d'essai;<br/>
    les procédures d’étalonnage et de vérification du matériel d'essai;<br/>
    les montages d'essai;<br/>
    une procédure d’essai.<br/>
    Cette deuxième édition annule et remplace la première édition parue en 2006 et l'Amendement 1:2010. Cette édition constitue une révision technique. Cette édition inclut les modifications techniques majeures suivantes par rapport à l'édition précédente:<br/>
    a) ajout d’une modélisation mathématique de la forme d’onde oscillatoire amortie;<br/>
    b) nouvelle Annexe B sur l’incertitude de mesure;<br/>
    c) ajout d’un CDN à grande vitesse;<br/>
    d) ajout des procédures d’étalonnage pour les CDN;<br/>
    e) ajout de l’utilisation de la pince de couplage capacitive sur les lignes d’interconnexion pour les ondes oscillatoires amorties rapides;<br/>
    f) ajout d’une procédure d'essai pour les convertisseurs continu/continu en cas de non-fonctionnement du CDN;<br/>
    g) nouvelle Annexe C sur les problèmes liés à l’alimentation des EUT équipés de convertisseurs continu/continu en entrée.<br/>
    Mots clés : exigences d'immunité et des méthodes d'essai des matériels électriques et électroniques<br/>
    Le contenu du corrigendum d'août 2019 a été pris en considération dans cet exemplaire.
