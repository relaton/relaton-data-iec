abstract:
- language: en
  script: Latn
  content: |-
    IEC 62561-8:2026 specifies the requirements and tests for components used for electrically insulated LPS. These components, which can reduce the separation distance, are as follows:<br/>
    - insulating stand-offs, used in conjunction with an air-termination system and down-conductors with the aim of maintaining the proper separation distance;<br/>
    - insulating down‑conductors, including their specific fasteners.<br/>
    Testing of insulating stand-offs and insulating down-conductor components for an explosive atmosphere is not covered by this document. This first edition cancels and replaces IEC TS 62561-8 published in 2018. This edition constitutes a technical revision.<br/>
    This edition includes the following significant technical changes with respect to IEC TC 62561-8:2018:<br/>
    a) title and scope of the standard has been adjusted;<br/>
    b) the document has been updated in line with IEC 60068-2-52:2017 on salt mist treatment;<br/>
    c) the document has been updated in line with ISO 22479:2019 on humid sulphureous atmosphere treatment;<br/>
    d) two different possible example configurations for pull out tests have been introduced;<br/>
    e) additional information on pollution has been included;<br/>
    f) an alternate test arrangement for high voltage impulse test has been included;<br/>
    g) a new normative Annex H for applicability of previous tests has been introduced;<br/>
    h) pass criteria for high voltage impulse testing updated;<br/>
    i) explanation on high voltage impulse testing with negative polarity has been added.
- language: fr
  script: Latn
  content: |-
    L'IEC 62561-8:2026 spécifie les exigences et les essais pour les composants utilisés pour les systèmes électriquement isolés de protection contre la foudre. Ces composants peuvent réduire la distance de séparation, notamment:<br/>
    - les supports isolants, utilisés conjointement avec un dispositif de capture et des conducteurs de descente afin de maintenir une distance de séparation appropriée;<br/>
    - les conducteurs de descente isolants, y compris leurs fixations spécifiques.<br/>
    Les essais réalisés sur les composants des supports isolants et des conducteurs de descente isolants pour une atmosphère explosive ne sont pas couverts par le présent document. Cette première édition annule et remplace l'IEC TS 62561‑8 parue en 2018. Cette édition constitue une révision technique.<br/>
    Cette édition inclut les modifications techniques majeures suivantes par rapport à l'IEC TS 62561‑8:2018:<br/>
    a) le titre et le domaine d'application de la norme ont été adaptés;<br/>
    b) le document a été mis à jour conformément à l'IEC 60068‑2‑52:2017 concernant le traitement au brouillard salin;<br/>
    c) le document a été mis à jour conformément à l'ISO 22479:2019 concernant le traitement en atmosphère humide sulfureuse;<br/>
    d) deux exemples de configurations différentes possibles pour les essais d'arrachement ont été ajoutés;<br/>
    e) des informations supplémentaires concernant la pollution ont été ajoutées;<br/>
    f) un dispositif d'essai alternatif pour l'essai de choc à haute tension a été ajouté;<br/>
    g) une nouvelle Annexe H normative concernant l'applicabilité d'essais précédents a été ajoutée;<br/>
    h) les critères d'acceptation pour les essais de choc à haute tension ont été mis à jour;<br/>
    i) une explication concernant les essais de choc à haute tension avec une polarité négative a été ajoutée.
