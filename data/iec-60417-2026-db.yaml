abstract:
- language: en
  script: Latn
  content: |-
    12-month initial subscription to IEC 60417 Database - Annual subscription renewal: CHF 330.-<br/>
    <br/>
    IEC 60417 DB contains more than 1400 graphical symbols used to identify equipment or a part of equipment, indicate functional states, designate connections, provide information on packaging or provide instruction for the operation of the equipment. The symbols are available in GIF and vectorized PDF formats. The database provides classified views by shape, function, and application, as well as a search facility.<br/>
    <br/>
    For all graphical symbols published in IEC 60417 and ISO 7000 please click here.<br/>
    <br/>
    IEC 60417:2002 DB has the status of a horizontal standard in accordance with IEC Guide 108.
