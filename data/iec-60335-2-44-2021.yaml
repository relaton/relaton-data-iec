abstract:
- language: en
  script: Latn
  content: |-
    IEC 60335-2-44:2021 deals with the safety of electric ironers for both commercial and household and similar purposes, their rated voltage being not more than 250 V for single-phase appliances and 480 V for other appliances. Appliances not intended for normal household, but which nevertheless can be a source of danger to the public, such as appliances intended to be used by laymen in shops, in light industry and on farms, are within the scope of this standard. Examples of appliances within the scope of this standard are:<br/>
    – ironing presses for one-person operation;<br/>
    – mangles;<br/>
    – rotary ironers for one-person operation;<br/>
    – trouser presses.<br/>
    As far as is practicable, this standard deals with the common hazards presented by appliances that are encountered by all persons in and around the home. However, in general, it does not take into account:<br/>
    – persons (including children) whose physical, sensory or mental capabilities or lack of experience and knowledge prevents them from using the appliance safely without supervision or instruction;<br/>
    – children playing with the appliance.<br/>
    Attention is drawn to the fact that:<br/>
    – for appliances intended to be used in vehicles or on board ships or aircraft, additional requirements can be necessary;<br/>
    – in many countries additional requirements are specified by the national health authorities, the national authorities responsible for the protection of labour and similar authorities.<br/>
    This standard does not apply to:<br/>
    – rotary ironers for operation by more than one person. The roller length of such appliances normally exceeds 1,6 m in length;<br/>
    – appliances intended exclusively for industrial purposes;<br/>
    – appliances intended to be used in locations where special conditions prevail, such as the presence of a corrosive or explosive atmosphere (dust, vapour or gas);<br/>
    – electric irons (IEC 60335-2-3);<br/>
    – battery-operated appliances.<br/>
    This fourth edition cancels and replaces the third edition published in 2002, Amendment 1:2008 and Amendment 2:2011. This edition constitutes a technical revision.<br/>
    This edition includes the following significant technical changes with respect to the previous edition:<br/>
    a) the text has been aligned with IEC 60335-1:2020;<br/>
    b) some notes have been converted to normative text (1, 20.1, 22.103);<br/>
    c) exclusion of battery-operated appliances (Clause 1);<br/>
    d) introduction of accessible surface temperature limits (Clause 11).<br/>
    This Part 2 is to be used in conjunction with the latest edition of IEC 60335-1 and its amendments unless that edition precludes it; in that case, the latest edition that does not preclude it is used. It was established on the basis of the sixth edition (2020) of that standard.
- language: fr
  script: Latn
  content: |-
    L'IEC 60335-2-44:2021 traite de la sécurité des machines à repasser électriques destinées à un usage commercial, domestique et analogue, dont la tension assignée est inférieure ou égale à 250 V pour les appareils monophasés et à 480 V pour les autres appareils. Les appareils non destinés à un usage domestique normal, mais qui peuvent néanmoins constituer une source de danger pour le public, tels que les appareils destinés à être utilisés par des usagers non avertis dans des magasins, chez des artisans et dans des fermes, sont compris dans le domaine d'application de la présente norme. La liste suivante répertorie les exemples d'appareils qui relèvent du domaine d'application de la présente norme:<br/>
    – les presses à repasser dont le fonctionnement nécessite une seule personne;<br/>
    – les machines à lisser le linge;<br/>
    – les machines à repasser à rouleau dont le fonctionnement nécessite une seule personne;<br/>
    – les presse-pantalons.<br/>
    Dans la mesure du possible, la présente norme traite des dangers courants que présentent les appareils et auxquels sont exposés tous les individus situés à l'intérieur et autour de l'habitation. Cependant, elle ne tient en général pas compte:<br/>
    – des personnes (y compris des enfants) dont les capacités physiques, sensorielles ou mentales; ou le manque d'expérience et de connaissance<br/>
    les empêchent d'utiliser l'appareil en toute sécurité sans surveillance ou instruction;<br/>
    – de l'utilisation de l'appareil comme jouet par des enfants.<br/>
    L'attention est attirée sur le fait que:<br/>
    – pour les appareils destinés à être utilisés dans des véhicules ou à bord de navires ou d'avions, des exigences supplémentaires peuvent être nécessaires;<br/>
    – dans de nombreux pays, des exigences supplémentaires sont spécifiées par les organismes nationaux de la santé, par les organismes nationaux responsables de la protection des travailleurs et par des organismes similaires.<br/>
    La présente norme ne s'applique pas:<br/>
    – aux machines à repasser à rouleau destinées à être utilisées par plusieurs personnes. La longueur du rouleau de ces appareils est généralement supérieure à 1,6 m;<br/>
    – aux appareils prévus exclusivement pour des usages industriels;<br/>
    – aux appareils destinés à être utilisés dans des locaux qui présentent des conditions particulières, telles que la présence d'une atmosphère corrosive ou explosive (poussière, vapeur ou gaz);<br/>
    – aux fers à repasser électriques (IEC 60335-2-3);<br/>
    – aux appareils alimentés par batteries.<br/>
    Cette quatrième édition annule et remplace la troisième édition parue en 2002, l'Amendement 1:2008 et l'Amendement 2:2011. Cette édition constitue une révision technique.<br/>
    Cette édition inclut les modifications techniques majeures suivantes par rapport à l'édition précédente:<br/>
    a) alignement du texte sur l'IEC 60335-1:2020;<br/>
    b) conversion en texte normatif de certaines notes (Article 1, 20.1, 22.103);<br/>
    c) exclusion des appareils alimentés par batteries (Article 1);<br/>
    d) introduction des limites de température des surfaces accessibles (Article 11).<br/>
    La présente Partie 2 doit être utilisée conjointement avec la dernière édition de l'IEC 60335-1 et ses amendements, sauf si cette édition l'exclut. Dans ce cas, la dernière édition qui n'exclut pas la présente Partie 2 est utilisée. Elle a été établie sur la base de la sixième édition (2020) de cette norme.
