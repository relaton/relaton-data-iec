abstract:
- language: en
  script: Latn
  content: |-
    CORRECTED VERSION 2026-03<br/>
    <br/>
    IEC 62127-3:2022+AMD1:2026 CSV specifies relevant hydrophone characteristics. This document is applicable to:<br/>
    - hydrophones employing piezoelectric sensor elements, designed to measure the pulsed and continuous wave ultrasonic fields generated by ultrasonic equipment;<br/>
    - hydrophones used for measurements made in water;<br/>
    - hydrophones with or without an associated pre-amplifier.<br/>
    IEC 62127-3:2022 cancels and replaces the first edition published in 2007 and Amendment 1:2013. This edition constitutes a technical revision. This edition includes the following significant technical changes with respect to the previous edition.<br/>
    a) The upper frequency limit of 40 MHz has been removed.<br/>
    b) Hydrophone sensitivity definitions have been changed to recognize sensitivities as complex-valued quantities.<br/>
    c) Procedures to determine the effective hydrophone size have been changed according to the rationale outlined in Annex B.<br/>
    d) Requirements on the frequencies for which the effective hydrophone size shall be provided have been changed to achieve practicality for increased frequency bands.<br/>
    e) The new Annex B and Annex C have been added.<br/>
    f) Annex A has been updated to reflect the changes of the normative parts.
