abstract:
- language: en
  script: Latn
  content: |-
    IEC 60695-11-2:2026 RLV contains both the official IEC International Standard and its Redline version. The Redline version is available in English only and provides you with a quick and easy way to compare all the changes between the official IEC Standard and its previous edition.<br/>
    <br/>
    IEC 60695-11-2:2026 gives the requirements for the production and confirmation of a nominal 1 kW propane/air pre-mixed flame for use in fire hazard testing. This basic safety publication focusing on safety test method(s) is primarily intended for use by technical committees in the preparation of safety publications in accordance with the principles laid down in IEC GUIDE 104 and ISO/IEC Guide 51. One of the responsibilities of a technical committee is, wherever applicable, to make use of basic safety publications in the preparation of its publications. The requirements, test methods or test conditions of this basic safety publication will not apply unless specifically referred to or included in the relevant publications. This fourth edition cancels and replaces the third edition published in 2017. This edition constitutes a technical revision.<br/>
    This edition includes the following significant technical changes with respect to the previous edition:<br/>
    a) correction of errors in notes of Subclauses 5.2 and 5.3
