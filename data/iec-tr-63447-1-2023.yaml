abstract:
- language: en
  script: Latn
  content: |-
    IEC TR 63447-1:2023 introduces various form factors of smart mobile devices and their impact on multimedia services.<br/>
    It does not deal with:<br/>
    a) SMD performance to process multimedia services;<br/>
    b) hardware performance and technology for each part, such as the battery, the antenna, the display, the main processor, various sensors;<br/>
    c) the characteristics of the SMD's operating system (Android, iPhone OS etc.);<br/>
    d) the generation characteristics of telecommunication and radio frequency (including wireless);<br/>
    e) wearable devices, like smart watch, AR (augmented reality), VR (virtual reality) and so on.
