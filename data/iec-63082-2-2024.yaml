abstract:
- language: en
  script: Latn
  content: |-
    IEC 63082-2:2024 specifies requirements and recommendations for establishing and maintaining intelligent device management (IDM) as outlined in IEC TR 63082-1 in an enterprise having one or more facilities.<br/>
    The following topics are included in the scope of this document:<br/>
    - optimizing functionality and performance of intelligent devices for their use;<br/>
    - managing information related to IDM;<br/>
    - integrating intelligent devices into industrial automation and control systems (IACS) in facilities;<br/>
    - exchanging information between stakeholders that achieve and sustain IDM;<br/>
    - coordinating multiple asynchronous IDM life cycles.<br/>
    The following topics are outside the scope of this document:<br/>
    - defining and determining the function and performance of intelligent devices;<br/>
    - defining and specifying technologies and tools that provide, preserve and manage information related to IDM such as FDT, FDI, portable on-line and off-line tools, configuration tools, historians, and maintenance planning tools;<br/>
    - defining and specifying technologies and tools that are used to design intelligent devices;<br/>
    - defining and specifying communication network architecture, communication technologies, cybersecurity requirements, and network management requirements.
- language: fr
  script: Latn
  content: |-
    IEC 63082-2:2024 spécifie les exigences et les recommandations qui permettent d’établir et de maintenir la gestion des appareils intelligents (IDM) telle que décrite dans l’IEC TR 63082‑1 dans une entreprise qui comporte une ou plusieurs installations.<br/>
    Les sujets suivants relèvent du domaine d’application du présent document:<br/>
    - l’optimisation des fonctionnalités et des performances des appareils intelligents pour leur utilisation;<br/>
    - la gestion des informations liées à l’IDM;<br/>
    - l’intégration d’appareils intelligents dans les systèmes d’automatisation et de commande industrielles (IACS ‑ industrial automation and control systems) des installations;<br/>
    - l’échange d’informations entre les parties prenantes qui réalisent et maintiennent l’IDM;<br/>
    - la coordination de plusieurs cycles de vie asynchrones de l’IDM.<br/>
    Les sujets suivants ne relèvent pas du domaine d’application du présent document:<br/>
    la définition et la détermination de la fonction et des performances des appareils intelligents;<br/>
    - la définition et la spécification des technologies et des outils qui fournissent, préservent et gèrent les informations liées à l’IDM, comme les outils FDT, FDI, outils portables en ligne et hors ligne, outils de configuration, historiques et outils de planification de la maintenance;<br/>
    - la définition et la spécification des technologies et des outils de conception des appareils intelligents;<br/>
    - la définition et la spécification de l’architecture des réseaux de communication, des technologies de communication, des exigences en matière de cybersécurité et des exigences en matière de gestion des réseaux.
