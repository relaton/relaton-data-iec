abstract:
- language: en
  script: Latn
  content: |-
    IEC 62828-1:2026 establishes a general framework for defining reference conditions and test procedures applicable for assessing the measurement performances of all types of industrial and process measurement transmitters (PMTs) used in measuring and control systems for industrial process and machinery. For the purpose of this document, an analogue PMT is a process measurement transmitter with only analogue current and/or voltage output(s), irrespective the technology adopted and the complexity of the circuitry. All the other process measurement transmitters, with digital output(s) only or with hybrid analogue and digital output(s), are considered to be digital PMTs. This document constitutes a common reference for the other parts of the IEC 62828 series. Specific test procedures and additional requirements for given types of PMTs (pressure, temperature, level, flow, etc.) are covered by other parts of this series. Sensing devices according to the IEC 60947 series are excluded from the scope of this document.<br/>
    NOTE 1 In industrial and process applications, to indicate the process measurement transmitters, it is common also to use the terms "industrial transmitters", or "process transmitters".<br/>
    NOTE 2 For better clarity, when the complete definition "industrial and process measurement transmitter" makes the sentence too long in this document, the short term "transmitter", or PMT, is used instead.<br/>
    This second edition cancels and replaces the first edition published in 2017. This edition constitutes a technical revision.<br/>
    This edition includes the following significant technical changes with respect to the previous edition:<br/>
    a) informative Annexes E, F, G and H have been removed;<br/>
    b) a new informative Annex G “Example of signal current for a 4 mA to 20 mA PMT” has been introduced (it has been moved from IEC 62828-2:2017 to this document);<br/>
    c) the definitions of warm-up time, settling time and output signal have been moved from IEC 62828-4:2020 to this document;<br/>
    d) The definitions of “inaccuracy” and “accuracy” have been reworked;<br/>
    e) The clause regarding test report has been reworked.
- language: fr
  script: Latn
  content: |-
    <!-- NEW! -->IEC 62828-1:2026 est disponible sous forme de IEC 62828-1:2026 RLV qui contient la Norme internationale et sa version Redline, illustrant les modifications du contenu technique depuis l'édition précédente.<br/>
    <br/>
    L'IEC 62828-1:2026 établit un cadre général pour définir les conditions de référence et les procédures d'essai applicables à l'évaluation des performances de mesure de tous les types de transmetteurs de mesure industrielle et de processus (PMT, Process Measurement Transmitter) utilisés dans les systèmes de mesure et de commande des processus et machines industriels. Pour les besoins du présent document, un PMT analogique est un transmetteur de mesure de processus à courant et/ou tension de sortie analogique uniquement, quelles que soient la technologie adoptée et la complexité du circuit. Tous les autres transmetteurs de mesure de processus, à sortie numérique uniquement ou à sortie hybride analogique et numérique sont considérés comme des PMT numériques. Le présent document constitue une référence commune pour les autres parties de la série IEC 62828. Les procédures d'essai spécifiques et les exigences supplémentaires applicables à d'autres types de PMT (pression, température, niveau, débit, etc.) sont traitées dans les autres parties de cette série de normes.<br/>
    Les dispositifs de détection conformes à la série IEC 60947 sont exclus du domaine d'application du présent document.<br/>
    NOTE 1 Dans les applications industrielles et de processus, les termes "transmetteurs industriels" ou "transmetteurs de processus" sont souvent utilisés pour désigner les transmetteurs de mesure de processus.<br/>
    NOTE 2 Pour plus de clarté, lorsque la définition complète "transmetteur de mesure industrielle et de processus" rallonge la phrase de manière trop importante dans le présent document, l'abréviation "transmetteur" ou PMT est utilisée à la place.<br/>
    Cette deuxième édition annule et remplace la première édition parue en 2017. Cette édition constitue une révision technique.<br/>
    Cette édition inclut les modifications techniques majeures suivantes par rapport à l'édition précédente:<br/>
    a) les annexes informatives E, F, G et H ont été supprimées;<br/>
    b) une nouvelle Annexe G informative "Exemple de courant de signal d'un PMT 4 mA à 20 mA" a été ajoutée (elle a été déplacée de l'IEC 62828‑2:2017 dans le présent document);<br/>
    c) les définitions de la durée de préchauffage, de la durée d'établissement et du signal de sortie ont été déplacées de l'IEC 62828‑4:2020 dans le présent document;<br/>
    d) les définitions de "inexactitude" et de "exactitude" ont été retravaillées;<br/>
    e) l'article relatif au rapport d'essai a été retravaillé.
