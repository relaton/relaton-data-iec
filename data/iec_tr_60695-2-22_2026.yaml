abstract:
- content: "IEC TR 60695-2-22:2026 summarizes the round robin tests performed by the
    IEC/TC 89/PT 60695-2-15, \"Fire containment test on finished units\" during the
    development of IEC TS 60695-2-21:2023, Fire containment test on finished units.<br
    />\r\nThis document aims to serve as knowledge retention, describing the methodologies,
    investigation, and verification techniques, as well as providing a compendium
    of the different verification results, of the development of IEC TS 60695-2-21:2023
    as new test method.<br />\r\nIEC/TC 89 and other IEC Technical Committees can
    benefit from this document, when developing new test methodologies or planning
    and executing round robin tests."
