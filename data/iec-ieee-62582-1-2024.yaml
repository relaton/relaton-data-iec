abstract:
- language: en
  script: Latn
  content: |-
    IEC/IEEE 62582-1:2024 contains requirements for application of the other parts of IEC/IEEE 62582 related to specific methods for condition monitoring in electrical equipment important to safety of nuclear power plants. It also includes requirements which are common to all methods. The procedures defined in IEC/IEEE 62582 are intended for detailed condition monitoring.<br/>
    IEC/IEEE 62582 specifies condition monitoring methods in sufficient detail to enhance the accuracy and repeatability, and provide standard formats for reporting the results. The methods specified are applicable to electrical equipment containing polymeric materials. Some methods are especially designed for the measurement of condition of a limited range of equipment whilst others can be applied to all types of equipment for which the polymeric parts are accessible.
- language: fr
  script: Latn
  content: |-
    IEC/IEEE 62582-1:2024 contient les exigences pour l'application des autres parties de l'IEC/IEEE 62582 correspondant aux méthodes de surveillance de l'état des matériels électriques importants pour la sûreté utilisés dans les centrales nucléaires. Elle contient aussi des exigences qui sont communes à toutes les méthodes. Les procédures définies dans l'IEC/IEEE 62582 ont pour objectif la surveillance détaillée de l'état des matériels.<br/>
    L'IEC/IEEE 62582 spécifie suffisamment en détail les méthodes de surveillance de l'état des matériels pour améliorer l'exactitude et la répétabilité, et indique les formats normalisés à utiliser pour rendre compte des résultats. Les méthodes spécifiées s'appliquent aux matériels électriques qui contiennent des matériaux polymères. Certaines méthodes ont été conçues spécifiquement pour mesurer l'état d'une gamme de matériels limitée alors que d'autres peuvent être appliquées à tous les types de matériels pour lesquels les parties en polymère sont accessibles.<br/>
    Même si le domaine d'application de l'IEC/IEEE 62582 se limite à l'application de celles ci aux systèmes d'instrumentation et de contrôle commande importants pour la sûreté, ces méthodes de surveillance de l'état des matériels peuvent également s'appliquer à d'autres composants qui contiennent des matériaux polymères.<br/>
    Les différentes parties de l'IEC/IEEE 62582 sont des normes de mesure, qui sont principalement destinées à être utilisées pour la gestion du vieillissement dans le cadre de la qualification initiale et après installation. Concernant le contexte technique associé aux méthodes de surveillance de l'état des matériels, il est fait référence à d'autres normes IEC standards, par exemple l'IEC 60544 5 [1]. L'IEC/IEEE 60780 323 fournit des informations concernant le rôle de la surveillance de l'état dans la qualification des matériels électriques importants pour la sûreté. Des informations à caractère général sur la gestion du vieillissement peuvent être trouvées dans l'IEC 62342 [5] et l'IEEE 1205 [6].<br/>
    Cette deuxième édition annule et remplace la première édition parue en 2011. Cette édition constitue une révision technique.<br/>
    Cette édition inclut les modifications techniques majeures suivantes par rapport à l'édition précédente:<br/>
    a) intégration du retour d'expérience issu des travaux sur la publication IAEA TECDOC 1825:2017 "Benchmark analysis for condition monitoring test techniques of low voltage cables in nuclear power plants. Final results of a Coordinated Research Project";<br/>
    b) référence à l'IEC/IEEE 60780 323 en lieu et place de l'IEC 60780 et l'IEEE 323.
