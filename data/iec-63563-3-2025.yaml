  script: Latn
  content: |-
    CORRECTED VERSION 2026-03<br/>
    <br/>
    IEC 63563-3:2025 identifies basic physical design requirements and guidelines for Power Transmitter and Power Receiver Products, including product and system dimensions, alignment of the products, surface temperature rise, and indications to the user.<br/>
    <br/>
    This corrected version of IEC 63563-3:2025 incorporates the following correction:<br/>
    - correction of the publication date on the cover page.
- language: fr
  script: Latn
  content: |-
    VERSION CORRIGEE 2026-03<br/>
    <br/>
    IEC 63563-3:2025 identifie les exigences et lignes directrices de base en matière de conception physique pour les produits émetteurs et récepteurs de puissance, y compris les dimensions du produit et du système, l'alignement des produits, l'élévation de la température de surface et les indications destinées à l'usager.<br/>
    <br/>
    Cette version corrigée de l’IEC 63563-3:2025 contient la correction suivante:<br/>
    - correction de la date de publication sur la page de couverture.
