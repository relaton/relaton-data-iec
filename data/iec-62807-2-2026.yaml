abstract:
- language: en
  script: Latn
  content: |-
    IEC 62807-2:2026 is a sectional specification for hybrid communication cables used for indoor applications. It specifies terms, definitions, and abbreviated terms, the design and construction, rated values and characteristics, performance requirements and test methods, packaging and quality assurance.<br/>
    Hybrid cables are designed for networks and customer premises cabling that transmit data, control and signalling services over optical fibres, copper conductors, for example coaxial element, wire/pair/quad element, and can have the option of supplying electrical current to remote equipment.<br/>
    In the IEC 62807 series, the current carrying elements are used only to supply power to the equipment within the communication network. They are not used for power supply main. The specific uses are defined in the relevant specification.<br/>
    The MICE classifications specified in ISO/IEC 11801-1 are fully considered when determining the performance requirements and test methods for a hybrid cable application.
