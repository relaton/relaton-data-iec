abstract:
- language: en
  script: Latn
  content: |-
    IEC 60721-2-2:2012 presents fundamental properties, quantities for characterization, and a classification of environmental conditions dependent on precipitation and wind relevant for electrotechnical products. This second edition cancels and replaces the first edition, published in 1988, and constitutes a technical revision. The main changes with regard to the previous edition are as follows:<br/>
    - subclause Precipitation: simplified;<br/>
    - data not possible to validate are removed;<br/>
    - subclause Wind: text rewritten;<br/>
    - Table 1 simplified and aligned with definition used by [1];<br/>
    - subclause Hail: data added;<br/>
    - formula changed;<br/>
    - formula for impact energy added;<br/>
    - subclause Snow: text changed and aligned with definitions used by [1];<br/>
    - Table 3 removed;<br/>
    - subclause Normal rain: text has been modified and numeric values removed;<br/>
    - subclause Driving rain: text has been modified and numeric values removed;<br/>
    - subclause Formation of ice: text has been modified and numeric values removed;<br/>
    - subclause Drifting snow: text added;<br/>
    - subclause Wind force: formula changed;<br/>
    - Figure 1 to 5 removed.
- language: fr
  script: Latn
  content: |-
    La CEI 60721-2-2:2012 présente les propriétés fondamentales, les grandeurs de caractérisation et une classification des conditions d'environnement dépendant des précipitations et du vent en ce qui concerne les produits électrotechniques. Cette deuxième édition annule et remplace la première édition, publiée en 1988, et constitue une révision technique. Les modifications principales par rapport à l'édition précédente sont les suivantes:<br/>
    - paragraphe Précipitations: simplifié et les données dont la validation est impossible sont supprimées;<br/>
    - paragraphe Vent: texte de nouveau rédigé;<br/>
    - Tableau 1 simplifié et aligné avec la définition utilisée par [1];<br/>
    - paragraphe Grêle: données ajoutées; modification de formule;<br/>
    - ajout d'une formule de l'énergie d'impact;<br/>
    - paragraphe Neige: texte modifié et aligné avec les définitions utilisées par [1];<br/>
    - Tableau 3 retiré;<br/>
    - paragraphe Pluie normale: modification du texte et suppression de valeurs numériques;<br/>
    - paragraphe Pluie battante: modification du texte et suppression de valeurs numériques;<br/>
    - paragraphe Formation de glace: modification du texte et suppression de valeurs numériques;<br/>
    - paragraphe Neige transportée: ajout de texte;<br/>
    - paragraphe Force du vent: modification de formule;<br/>
    - suppression des Figures 1 à 5.
