abstract:
- language: en
  script: Latn
  content: |-
    IEC 60076-15:2015 applies to three-phase and single-phase gas-filled power transformers (including auto-transformers) with the exception of certain categories of small and special transformers such as:<br/>
    - single-phase transformers with rated power less than 1 kVA and three-phase transformers less than 5 kVA;<br/>
    - transformers, which have no windings with rated voltage higher than 1 000 V;<br/>
    - instrument transformers;<br/>
    - traction transformers mounted on rolling stock;<br/>
    - starting transformers;<br/>
    - testing transformers;<br/>
    - welding transformers. This second edition of IEC 60076-15 cancels and replaces the first edition published in 2008 and constitutes a technical revision. The following main technical changes from the first edition are:<br/>
    - Modified in accordance with the related revised standards of IEC 60076-1, IEC 60076-2, IEC 60076-3 and related items of SF6 gas in the revised standard of "High-voltage switchgear and controlgear;<br/>
    - Added the clause "minimum power under alternative cooling modes";<br/>
    - Added the clause "safety, environmental and other requirements";<br/>
    - Added the clause "d.c. currents in neutral circuits";<br/>
    - Added the clause "electromagnetic compatibility (EMC)";<br/>
    - Added the clause "high frequency switching transients".
- language: fr
  script: Latn
  content: |-
    L'IEC 60076-15:2015 s'applique aux transformateurs de puissance à isolation gazeuse triphasés et monophasés (y compris les autotransformateurs) à l'exception de certaines catégories de petits transformateurs et de transformateurs spéciaux, tels que:<br/>
    - les transformateurs monophasés de puissance assignée inférieure à 1 kVA et aux transformateurs triphasés de puissance assignée inférieure à 5 kVA;<br/>
    - les transformateurs dépourvus d'enroulements présentant une tension assignée supérieure à 1 000 V;<br/>
    - les transformateurs de mesure;<br/>
    - les transformateurs de traction montés sur équipement roulant;<br/>
    - les transformateurs de démarrage;<br/>
    - les transformateurs d'essai;<br/>
    - les transformateurs de soudage. Cette seconde édition de l'IEC 60076-15 annule et remplace la première édition, parue en 2008, dont elle constitue une révision technique. Les principales modifications techniques suivantes ont été apportées depuis la première édition:<br/>
    - Modification conforme aux normes révisées apparentées IEC 60076-1, IEC 60076-2, IEC 60076-3 et éléments apparentés du gaz SF6 dans la norme révisée "Appareillage à haute tension";<br/>
    - Ajout du paragraphe "Puissance minimale dans les modes de refroidissement alternatifs";<br/>
    - Ajout de l'Article "Exigences de sécurité, exigences environnementales et autres exigences";<br/>
    - Ajout du paragraphe "Courants continus dans les circuits de neutre";<br/>
    - Ajout de l'Article "Compatibilité électromagnétique (CEM)";<br/>
    - Ajout de l'Article "Transitoires de commutation à haute fréquence".
