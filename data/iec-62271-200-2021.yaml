abstract:
- language: en
  script: Latn
  content: |-
    IEC 62271-200:2021 is applicable to prefabricated metal‑enclosed switchgear and controlgear assemblies designed for:<br/>
    – alternating current;<br/>
    – rated voltages above 1 kV and up to and including 52 kV;<br/>
    – service frequencies up to and including 60 Hz;<br/>
    – indoor and outdoor installation.<br/>
    The assembly can include air-insulated and/or fluid-filled compartments.<br/>
    This third edition cancels and replaces the second edition published in 2011. This edition constitutes a technical revision.<br/>
    This edition includes the following significant technical changes with respect to the previous edition:<br/>
    a) clause numbering aligned with IEC 62271‑1:2017, including the adoption of the subclause names of Clause 3;<br/>
    b) in Clause 3 specific definitions are added for "in service", "normal operating condition" and "normal use";<br/>
    c) internal arc testing on pole-mounted switchgear is taken out of this document, as it is now covered by the specific standard IEC 62271‑214:2019;<br/>
    d) a more precise description of earthing circuit is given with the inclusion of ratings and test requirements;<br/>
    e) number of mechanical tests on interlocks is reduced for type testing; a more precise description of forces to apply during type testing is given (refer to 7.102);<br/>
    f) resistance measuring on main circuit is only needed before continuous current tests (as reference for routine tests) and no longer needed after this continuous current test. Rationale for this deletion is that this measured resistance does not mean anything; as the temperature rise test was just finished, a new temperature rise test will not give new information;<br/>
    g) IEC 62271-100:2021, IEC 62271-103:2021, IEC 62271-105:2021 and IEC 62271-106:2021 are referred to in the document;<br/>
    h) IEC 62271‑107:2019 and IEC IEEE 62271‑37‑013:2015 are also considered in 7.101.2;<br/>
    i) a more precise description of LSC category is given with the inclusion of an explanatory flowchart (Annex D);<br/>
    j) examples not covered by the IAC test are transferred from Clause 6 to 9.103;<br/>
    k) the term "assembly" is defined in Clause 3 and used as synonym for "metal-enclosed switchgear and controlgear" in this document;<br/>
    l) "metallic" is replaced by "metal" where applicable;<br/>
    m) 6.105 is now covered by 7.7;<br/>
    n) a 1 s rule was introduced for Criterion 4 during IAC tests regarding hot gases versus glowing particles as cause of ignition;<br/>
    o) a more precise description of internal arc tests for switchgear with protrusions is given in Annex A.
- language: fr
  script: Latn
  content: |-
    L’IEC 62271-200:2021 est applicable aux ensembles d'appareillages préfabriqués sous enveloppe métallique conçus pour:<br/>
    - le courant alternative;<br/>
    - des tensions assignées supérieures à 1 kV et inférieures ou égales à 52 kV;<br/>
    - des fréquences de service jusqu’à 60 Hz inclus;<br/>
    - une installation à l'intérieur et à l'extérieur.<br/>
    L’ensemble peut comprendre des compartiments isolés dans l’air et/ou remplis de fluide.<br/>
    Cette troisième édition annule et remplace la deuxième édition publiée en 2011. Cette édition constitue une révision technique.<br/>
    Cette édition inclut les modifications techniques majeures suivantes par rapport à l'édition précédente:<br/>
    a) numérotation des articles alignée sur l’IEC 62271‑1:2017, y compris l'adoption des noms des paragraphes de l’Article 3;<br/>
    b) des définitions spécifiques sont ajoutées à l'Article 3 pour "en service", "condition normale de fonctionnement" et "utilisation normale";<br/>
    c) l'essai d'arc interne sur les appareillages montés sur poteau est exclu du présent document, car il est maintenant couvert par la norme spécifique IEC 62271‑214:2019;<br/>
    d) une description plus exacte du circuit de terre est donnée avec l'inclusion des valeurs assignées et des exigences d'essai;<br/>
    e) réduction du nombre d'essais mécaniques sur les verrouillages pour les essais de type; meilleure description des forces à appliquer lors des essais de type (voir 7.102);<br/>
    f) le mesurage de la résistance sur le circuit principal n'est nécessaire qu'avant les essais au courant permanent (comme référence pour les essais individuels de série) et n'est plus nécessaire après cet essai au courant permanent. La raison de cette suppression est que cette résistance mesurée ne signifie rien; comme l'essai d’échauffement vient de se terminer, un nouvel essai d’échauffement n’apporterait pas de nouvelles informations;<br/>
    g) l’IEC 62271-100:2021, l’IEC 62271-103:2021, l’IEC 62271-105:2021 et l’IEC 62271‑106:2021 sont citées dans le present document;<br/>
    h) l’IEC 62271‑107:2012 et l’IEC 62271‑37‑013:2015 sont également prises en considération en 7.101.2;<br/>
    i) une description plus précise de la catégorie LSC est donnée avec l'inclusion d'un ordinogramme explicatif (Annexe D);<br/>
    j) les exemples non couverts par l’essai IAC sont transférés de l’Article 6 au paragraphe 9.103;<br/>
    k) le terme "ensemble" est défini à l'Article 3 et est utilisé comme synonyme d'"appareillage sous enveloppe métallique" dans le présent document;<br/>
    l) "métallique" est remplacé par "en métal" le cas échéant;<br/>
    m) le paragraphe 6.105 est maintenant couvert par le paragraphe 7.7;<br/>
    n) une règle de 1 s a été introduite pour le Critère No 4 lors des essais IAC concernant les gaz chauds par rapport aux particules incandescentes comme cause d'amorçage;<br/>
    o) une description plus précise des essais d'arc interne pour les appareillages avec des protubérances est donnée à l’Annexe A.<br/>
    La présente version bilingue (2021-07) correspond à la version anglaise monolingue publiée en 2021-05.<br/>
    La version française de cette norme n'a pas été soumise au vote.
