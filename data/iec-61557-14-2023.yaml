abstract:
- language: en
  script: Latn
  content: |-
    IEC 61557-14:2023 defines special requirements for test and measurement equipment used to determine the electrical safety of electrical equipment of machinery in accordance with IEC 60204-1.<br/>
    This International Standard is to be used in conjunction with IEC 61557-1:2019.<br/>
    IEC 61557-14:2023 cancels and replaces the first edition published in 2013. This edition constitutes a technical revision.<br/>
    This edition includes the following significant technical changes with respect to the previous edition:<br/>
    a) clarifying the introduction;<br/>
    b) replaced "dielectric strength" by "voltage test";<br/>
    c) requirement for maximum output current has been added in 4.2.6.1;<br/>
    d) tripping time at electrical switching activated by two-hand operation has been added in 4.2.6.1;<br/>
    e) additional time limiting capability for the protection against electric shock for test persons and bystanders in 4.2.6.2;<br/>
    f) updated references for safety testing;<br/>
    g) alignment of the structure with that of the whole IEC 61557 series.
- language: fr
  script: Latn
  content: |-
    L'IEC 61557-14:2023 définit les exigences particulières applicables aux dispositifs de contrôle et de mesure destinés à déterminer la sécurité électrique des appareils électriques sur machines conformément à l’IEC 60204-1.<br/>
    L'IEC 61557-14:2023 annule et remplace la première édition parue en 2013. Cette édition constitue une révision technique.<br/>
    Cette édition inclut les modifications techniques majeures suivantes par rapport à l’édition précédente:<br/>
    a) clarification de l’introduction;<br/>
    b) remplacement de "rigidité diélectrique" par "essai de tension";<br/>
    c) ajout de l’exigence de courant de sortie maximal en 4.2.6.1;<br/>
    d) ajout du temps de déclenchement lors de la commutation électrique activée par une opération à deux mains en 4.2.6.1;<br/>
    e) ajout d’une capacité de limitation de temps supplémentaire pour la protection contre les chocs électriques pour les personnes soumises à essai et les personnes présentes en 4.2.6.2;<br/>
    f) mise à jour des références pour les essais de sécurité;<br/>
    g) alignement de la structure sur celle de l’ensemble de la série IEC 61557.
