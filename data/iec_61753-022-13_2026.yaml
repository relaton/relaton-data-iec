abstract:
- content: "IEC 61753-022-13:2026 defines the minimum initial test and measurement
    requirements, and severities which multimode fibre optic connectors terminated
    as a pigtail or a patchcord satisfy in order to be categorized as meeting the
    IEC standard category OP+HP (Extended outdoor protected environment with additional
    heat dissipation), as defined in IEC 61753-1.<br />\r\nIf tests are performed
    on the connectors terminated as pigtails or patchcords for category OP+HP, and
    the product pass, the product will be automatically qualified or categorized as
    meeting the IEC standard for categories OP+, OP, OPHD, C and CHD."
  language:
  - en
  script:
  - Latn
  format: text/html
- content: "L'IEC 61753-022-13:2026 définit les exigences minimales initiales d’essai
    et de mesure, ainsi que les sévérités auxquelles les connecteurs à fibres optiques
    multimodales raccordés comme des fibres amorces ou des cordons de brassage satisfont
    afin d’être considérés comme satisfaisant aux critères de la catégorie OP+HD (environnement
    extérieur protégé étendu avec dissipation de chaleur supplémentaire) des normes
    IEC, telle que définie dans l’IEC 61753-1.<br />\r\nSi des essais sont réalisés
    sur les connecteurs raccordés comme des fibres amorces ou des cordons de brassage
    pour la catégorie OP+HD et que le produit satisfait aux exigences, le produit
    est automatiquement qualifié ou classé comme satisfaisant à la norme IEC pour
    les catégories OP+, OP, OPHD, C et CHD."
