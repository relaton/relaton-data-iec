abstract:
- language: en
  script: Latn
  content: |-
    IEC TS 62607-6-24:2026 which is a Technical Specification, establishes a standardized method to determine the key control characteristic (KCC)<br/>
    • number of layer distribution<br/>
    for CVD graphene film by<br/>
    • optical contrast measurement<br/>
    The number of layers and number of layer distribution of CVD graphene film is derived by G‑channel contrast values.<br/>
    This method is applicable for clean CVD graphene film without twisted multilayer structures on a SiO2/Si substrate.
