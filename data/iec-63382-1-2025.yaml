abstract:
- language: en
  script: Latn
  content: |-
    IEC 63382-1:2025 series specifies the management of distributed energy storage systems, composed of electrically chargeable vehicle batteries (ECV-DESS), which are handled by an aggregator/flexibility operator (FO) to provide energy flexibility services to grid operators.<br/>
    IEC 63382-1:2025 describes the technical characteristics and architectures of ECV-DESS, including:<br/>
    – EV charging stations configurations, comprising several AC-EVSEs and/or DC-EVSEs;<br/>
    – individual EVs connected to grid via an EVSE and managed by an aggregator/FO.<br/>
    The focus of this document is on the interface between the FO and the FCSBE and the data exchange at this interface, necessary to perform energy flexibility services (FS).<br/>
    The data exchange between FO and FCSBE typically includes:<br/>
    – flexibility service request and response;<br/>
    – flexibility services parameters;<br/>
    – EV charging station configuration and technical capabilities;<br/>
    – credentials check of parties involved in the flexibility service;<br/>
    – FS execution related notifications;<br/>
    – event log, detailed service record, proof of work.<br/>
    The exchange of credentials has the purpose to identify, authenticate and authorize the actors involved in the flexibility service transaction, to check the validity of a FS contract and to verify the technical capabilities of the system EV + CS, and conformity to applicable technical standards to provide the requested flexibility service.<br/>
    This document also describes the technical requirements of ECV-DESS, the use cases, the information exchange between the EV charging station operator (CSO) and the aggregator/FO, including both technical and business data.<br/>
    It covers many aspects associated to the operation of ECV-DESS, including:<br/>
    – privacy issues consequent to GDPR application (general data protection regulation);<br/>
    – cybersecurity issues;<br/>
    – grid code requirements, as set in national guidelines, to include ancillary services, mandatory functions and remunerated services;<br/>
    – grid functions associated to V2G operation, including new services, as fast frequency response;<br/>
    – authentication/authorization/transactions relative to charging sessions, including roaming, pricing and metering information;<br/>
    – management of energy transfers and reporting, including information interchange, related to power/energy exchange, contractual data, metering data;<br/>
    – demand response, as smart charging (V1G).<br/>
    It makes a distinction between mandatory grid functions and market driven services, taking into account the functions which are embedded in the FW control of DER smart inverters.<br/>
    This document deals with use cases, requirements and architectures of the ECV-DESSs with the associated EV charging stations.<br/>
    Some classes of energy flexibility services (FS) have been identified and illustrated in dedicated use cases:<br/>
    – following a dynamic setpoint from FO;<br/>
    – automatic execution of a droop curve provided by FO, according to local measurements of frequency, voltage and power;<br/>
    – demand response tasks, stimulated by price signals from FO;<br/>
    – fast frequency response.<br/>
    Furthermore, some other more specific flexibility service use cases include:<br/>
    – V2G for tertiary control with reserve market;<br/>
    – V2H with dynamic pricing linked to the wholesale market price;<br/>
    – distribution grid congestion by EV charging and discharging.<br/>
    FS are performed under flexibility service contracts (FSC) which can be stipulated between:<br/>
    – FO and EV owner (EVU or EV fleet manager);<br/>
    – FO and CSP;<br/>
    – FO and CSO.<br/>
    Any flexibility service is requested by the aggregator/FO with a flexibility service request (FSR) communicated through the FCSBE interface to the available resources.<br/>
    The actors EVU, CSO, CSP have always the right to choose opt-in or opt-out options in case of a FSR, unless it is mandatory for safety or grid stability reasons.<br/>
    A use case shows how to discover flexibility service contract (FSC) holders.<br/>
    This document describes many use cases, some of them are dedicated to special applications such as as: EV service station, energy community, fast frequency response, EV fleet, onboard bidirectional inverter, mobile app.
- language: fr
  script: Latn
  content: |-
    IEC 63382-1:2025 spécifie la gestion des systèmes de stockage d’énergie décentralisés, composés de batteries de véhicules électriques rechargeables (ECV-DESS), qui sont gérés par un agrégateur/opérateur de flexibilité (OF) pour fournir des services de flexibilité énergétique aux opérateurs de réseau.<br/>
    IEC 63382-1:2025 décrit les caractéristiques techniques et les architectures de l’ECV-DESS, notamment:<br/>
    – les configurations des bornes de charge pour VE, composées de plusieurs SAVE à courant alternatif et/ou continu;<br/>
    – les VE individuels connectés au réseau électrique par l’intermédiaire d’un SAVE et gérés par un agrégateur/OF.<br/>
    Le présent document se concentre sur l’interface entre l’OF et le FCSBE ainsi que sur l’échange de données au niveau de cette interface, nécessaire pour la fourniture des services de flexibilité (FS) énergétique.<br/>
    L’OF/agrégateur convertit les services de réseau électrique et/ou les fonctions de support réseau demandés par les gestionnaires de réseau (DSO ou TSO) en plusieurs services de flexibilité à fournir par un certain nombre de CS, en utilisant leurs propres algorithmes d’optimisation et d’allocation de ressources.<br/>
    La communication entre l’OF et les opérateurs de réseau (DSO, TSO), les algorithmes d’optimisation adoptés par l’OF et les procédures d’appel d’offres pour des services de flexibilité ne sont pas traités dans le présent document.<br/>
    L’échange de données entre l’OF et le FCSBE comprend généralement:<br/>
    – la demande et la réponse de service de flexibilité;<br/>
    – les paramètres des services de flexibilité;<br/>
    – la configuration et les capacités techniques des bornes de charge pour VE;<br/>
    – le contrôle des identifiants des parties impliquées dans le service de flexibilité;<br/>
    – les notifications associées à l’exécution du FS;<br/>
    – le journal d’événements, le relevé de service détaillé et la preuve de travail.<br/>
    L’échange d’identifiants a pour objectif d’identifier, d’authentifier et d’autoriser les acteurs impliqués dans la transaction du service de flexibilité, de contrôler la validité d’un contrat de FS et de vérifier les capacités techniques du système EV + CS, et la conformité aux normes techniques applicables pour fournir le service de flexibilité demandé.<br/>
    Le présent document décrit également les exigences techniques de l’ECV-DESS, les cas d’utilisation, l’échange d’informations entre l’opérateur de bornes de charge pour VE (CSO) et l’agrégateur/OF, y compris les données techniques et commerciales.<br/>
    Il couvre de nombreux aspects associés au fonctionnement de l’ECV-DESS, notamment:<br/>
    – les problèmes de confidentialité consécutifs à l’application du Règlement général sur la protection des données (RGPD);<br/>
    – les questions de cybersécurité;<br/>
    – les exigences des codes de réseau, telles que définies dans les lignes directrices nationales, pour inclure les services système, les fonctions obligatoires et les services rémunérés;<br/>
    – les fonctions de réseau associées au fonctionnement V2G, y compris les nouveaux services, comme la réponse rapide en fréquence;<br/>
    – l’authentification/l’autorisation/les transactions relatives aux sessions de charge, y compris les informations d’itinérance, de tarification et de comptage;<br/>
    – la gestion des transferts d’énergie et des rapports, y compris l’échange d’informations, liés à l’échange d’énergie/de puissance, aux données contractuelles, aux données de comptage;<br/>
    – la gestion de la demande, comme la charge intelligente (V1G).<br/>
    Le présent document établit une distinction entre les fonctions de réseau obligatoires et les services axés sur le marché, en tenant compte des fonctions intégrées dans la commande du micrologiciel des onduleurs intelligents DER.<br/>
    Le présent document couvre les cas d’utilisation, les exigences et les architectures des ECV DESS avec les bornes de charge pour VE associées.<br/>
    Plusieurs classes de services de flexibilité (FS) énergétique ont été identifiées et expliquées dans des cas d’utilisation spécifiques:<br/>
    – le suivi d’un point de consigne dynamique fourni par un OF;<br/>
    – l’exécution automatique d’une courbe de statisme fournie par l’OF, en fonction de mesures locales de fréquence, tension et puissance;<br/>
    – les tâches de gestion de la demande, stimulées par les signaux de prix de l’OF;<br/>
    – la réponse rapide en fréquence.<br/>
    En outre, plusieurs autres cas plus spécifiques d’utilisation du service de flexibilité concernent:<br/>
    – V2G pour contrôle tertiaire avec marché de réserve;<br/>
    – V2H avec tarification dynamique liée au prix du marché de gros;<br/>
    – gestion de la congestion du réseau de distribution par charge et décharge des VE.<br/>
    Les FS sont fournis dans le cadre de contrats de service de flexibilité (FSC) qui peuvent être stipulés entre:<br/>
    – OF et propriétaire de VE (UVE ou gestionnaire de flotte de VE);<br/>
    – OF et CSP;<br/>
    – OF et CSO.<br/>
    Tout service de flexibilité est demandé par l’agrégateur/OF avec une demande de service de flexibilité (FSR) communiquée par l’intermédiaire de l’interface du FCSBE aux ressources disponibles.<br/>
    Les acteurs UVE, CSO, CSP ont toujours le droit d’accepter ou de refuser en cas de FSR, sauf si une option est obligatoire pour des raisons de sécurité ou de stabilité du réseau.<br/>
    Un cas d’utilisation indique la façon de découvrir les titulaires de contrats de service de flexibilité (FSC).<br/>
    Le présent document décrit de nombreux cas d’utilisation, dont certains sont consacrés à des applications spéciales telles que: station-service avec borne de charge, communauté énergétique, réponse rapide en fréquence, flotte de VE, onduleur bidirectionnel embarqué, appli mobile.
