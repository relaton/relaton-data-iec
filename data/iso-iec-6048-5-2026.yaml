abstract:
- language: en
  script: Latn
  content: |-
    <p class="MsoNormal">This document specifies container file formats for JPEG AI codestreams as specified in Rec. ITU-T T.840.1 | ISO/IEC 6048-1 and Rec. ITU-T T.840.2 | ISO/IEC 6048-2. It defines file formats for working with image and motion sequence files on computer platforms, allowing Internet-based and other communications.</p>
    <p class="MsoNormal">This document  uses already existing specifications for file formats and extends them for the embedding of JPEG AI codestreams.</p>
