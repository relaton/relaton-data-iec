abstract:
- language: en
  script: Latn
  content: |-
    IEC 60068-2-17:2023 deals with seal tests applicable to the external and internal detection in container sealing of gross leaks and fine leaks to determine the effectiveness of seals of specimens. For further tests to verify the ability of enclosures, covers and seals to maintain components and equipment in good working order, IEC 60068‑2‑18 can be helpful.<br/>
    This fifth edition cancels and replaces the fourth edition published in 1994. This edition constitutes a technical revision.<br/>
    This edition includes the following significant technical changes with respect to the previous edition:<br/>
    a) "Survey of sealing tests" has been deleted and the relevant content moved to a new Clause 4 "General";<br/>
    b) the Scope has been revised;<br/>
    c) the figures have been updated for clarification purposes;<br/>
    d) all non-SI units have been removed;<br/>
    e) the information to be given in the relevant specification has been revised.
- language: fr
  script: Latn
  content: |-
    L'IEC 60068-2-17:2023 traite des essais d'étanchéité relatifs à la détection externe et interne des fuites graves et légères dans l'étanchéité des conteneurs, afin de déterminer l'efficacité des joints des spécimens. Pour les autres essais visant à vérifier l'aptitude des enveloppes, des capots et des joints à maintenir les composants et matériels en bon état de fonctionnement, l'IEC 60068‑2‑18 peut être pertinente.<br/>
    Cette cinquième édition annule et remplace la quatrième édition parue en 1994. Cette édition constitue une révision technique.<br/>
    Cette édition inclut les modifications techniques majeures suivantes par rapport à l'édition précédente:<br/>
    a) le "Contrôle des essais d'étanchéité" a été supprimé et le contenu correspondant a été déplacé dans un nouvel Article 4 "Généralités";<br/>
    b) le Domaine d'application a été révisé;<br/>
    c) les figures ont été mises à jour à des fins de clarification;<br/>
    d) toutes les unités non SI ont été supprimées;<br/>
    e) les renseignements à fournir dans la spécification pertinente ont été révisés.
