abstract:
- language: en
  script: Latn
  content: |-
    IEC TS 63444:2026 RLV contains both the official IEC International Standard and its Redline version. The Redline version is available in English only and provides you with a quick and easy way to compare all the changes between the official IEC Standard and its previous edition.<br/>
    <br/>
    IEC TS 63444:2026 is applicable to process automation equipment using a 10BASE-T1L compliant Physical Layer (PHY). Ethernet-APL intrinsically safe profiles with different predefined entity or limitation parameters (for example voltage, current, power, capacitance, inductance, cable length) simplify the examination of the interconnection of different Ethernet-APL ports. Furthermore, this document is also applicable to factory and building automation and control equipment using a 10BASE-T1L compliant, and Power over Data Lines (PoDL) compliant Physical Layer (PHY) for non-intrinsically safe Ethernet installations.<br/>
    NOTE In this document the term Ethernet-SPE is used for PoDL compliant PHY.<br/>
    The following technical features are part of this document:<br/>
    - topology with trunk and spur installation capability;<br/>
    - 2-wire technology (full-duplex communication data rate of 10 Mbit/s);<br/>
    - long distance (refers to cable lengths of several hundred meters, with spans up to 1 000 m);<br/>
    - intrinsic safety (installation of Ethernet-capable field devices in hazardous areas);<br/>
    - power supply to field devices over the same 2-wire cable used for data communication;<br/>
    - non-intrinsically safe Ethernet installation in factory and building automation.<br/>
    This second edition cancels and replaces the first edition published in 2023. This edition constitutes a technical revision.<br/>
    This edition includes the following significant technical changes with respect to the previous edition:<br/>
    a) new power class for Ethernet-APL;<br/>
    b) addition of Ethernet-SPE;<br/>
    c) clarification of usability of Ethernet-APL in non-hazardous locations.
