abstract:
- language: en
  script: Latn
  content: |-
    <p class="MsoNormal">This document specifies controls, purpose, and guidance for implementing controls, to meet the requirements identified by a risk and impact assessment related to the protection of personally identifiable information (PII).</p>
    <p class="MsoNormal">In particular, this document specifies requirements and guidance based on ISO/IEC 27002, taking into consideration the controls for processing PII that can be applicable within the context of an organization's information security risk environment(s).</p>
    <p class="MsoNormal">This document is applicable to all types and sizes of organizations acting as PII controllers (as defined in ISO/IEC 29100), including public and private companies, government entities and not-for-profit organizations that process PII, in particular, organizations that do not establish or operate a privacy information management system.</p>
- language: fr
  script: Latn
  content: |-
    <p class="MsoNormal">Le présent document définit un certain nombre de buts et de mesures de contrôle, et contient des recommandations permettant de mettre ces mesures en œuvre. Elle vise à répondre aux besoins recensés dans le cadre des évaluations de risque et d'impact effectuées dans le domaine de la protection des informations d'identification personnelle (IIP).</p>
    <p class="MsoNormal">En particulier, la présente Recommandation | Norme internationale définit des prescriptions et des recommandations qui sont fondées sur la norme ISO/CEI 27002, compte tenu des mesures de contrôle prises dans le cadre du traitement des IIP qui peuvent être pertinentes au regard des risques de sécurité pesant sur les informations d'une organisation particulière.</p>
    <p class="MsoNormal">La présente Recommandation | Norme internationale s'applique aux organisations de tout type et de toute taille ayant pour mission de contrôler les IIP (au sens de la norme ISO/CEI 29100), qu'il s'agisse d'entreprises publiques ou privées, d'organismes publics ou d'ONG, dès lors qu'elles effectuent un traitement des IIP. Elle s'applique en particulier aux organisations dépourvues de système de gestion des informations personnelles.</p>
