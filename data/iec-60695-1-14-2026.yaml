abstract:
- language: en
  script: Latn
  content: |-
    IEC 60695-1-14:2026 provides guidance about the levels of power and energy that could cause ignition and fire in a low voltage electrotechnical product. It can be used by Product Committees to determine what fire hazard safeguards can be used, based on the electrical energy that could be dissipated as heat.<br/>
    This document deals with products used in normal atmospheres commonly available in the home and does not deal with special locations such as those in explosive atmospheres. It is intended as guidance to IEC committees, and is intended be used with respect to their individual applications.<br/>
    This basic safety publication, focusing on safety guidance, is primarily intended for use by TCs in the preparation of safety publications in accordance with the principles laid down in IEC GUIDE 104 and ISO/IEC Guide 51.<br/>
    This first edition cancels and replaces the first edition of IEC TS 60695-1-14 published in 2017.<br/>
    This edition constitutes a technical revision. This edition includes the following significant technical changes with respect to the previous edition:<br/>
    a) Conversion from a Technical Specification to an International Standard;<br/>
    b) Improved clarification on when the classification of Figure 1 (power/time limits) and Figure<br/>
    2 (time limits) can be used;<br/>
    c) Updated normative references.
- language: fr
  script: Latn
  content: |-
    L'IEC 60695-1-14:2026 fournit des recommandations concernant les niveaux de puissance et d'énergie qui peuvent provoquer une inflammation et un incendie dans un produit électrotechnique à basse tension. Elle peut être utilisée par les Comités de produits pour déterminer quelles protections contre le danger d'incendie peuvent être utilisées, en fonction de l'énergie électrique susceptible d'être dissipée sous forme de chaleur.<br/>
    Le présent document traite des produits utilisés dans les atmosphères normales communément rencontrées dans les habitations et ne traite pas des emplacements spéciaux tels que ceux dans les atmosphères explosives. Il est destiné à servir de guide aux comités de l'IEC et est prévu pour être utilisé dans le respect de leurs applications particulières.<br/>
    La présente publication fondamentale de sécurité qui porte sur des recommandations de sécurité est principalement destinée à être utilisée par les comités d'études dans le cadre de l'élaboration de publications de sécurité conformément aux principes établis dans le Guide 104 de l'IEC et le Guide 51 de l'ISO/IEC.<br/>
    Cette deuxième édition annule et remplace la première édition parue en 2017. Cette édition constitue une révision technique. Cette édition inclut les modifications techniques significatives suivantes par rapport à l'édition précédente:<br/>
    a) Conversion d’une spécification technique en Norme internationale;<br/>
    b) Clarification améliorée des cas où la classification de la Figure 1 (limites de puissance/temps) et de la Figure 2 (limites de temps) peut être utilisée;<br/>
    c) Mise à jour des références normatives
