abstract:
- language: en
  script: Latn
  content: |-
    IEC PAS 63693:2026 provides the common elements for basic time-critical messaging communications between devices in an automation environment and user programs with a means to access the fieldbus communication environment.<br/>
    The term “time-critical” is used to represent the presence of a time-window, within which one or more specified actions are required to be completed with some defined level of certainty. Failure to complete specified actions within the time window risks failure of the applications requesting the actions, with attendant risk to equipment, plant and possibly human life.<br/>
    This document defines in an abstract way:<br/>
    a) The externally visible services provided by the WiTSnet in terms of:<br/>
    1) an abstract model for defining application resources (objects) capable of being manipulated by users via the use of the FAL services;<br/>
    2) the primitive actions and events of the services;<br/>
    3) the parameters associated with each primitive action and event, and the form which they take;<br/>
    4) the interrelationship between these actions and events, and their valid sequences.<br/>
    b) The externally visible behavior provided by the WiTSnet in terms of:<br/>
    1) the abstract syntax defining the data-link layer and application layer protocol data units conveyed between communicating data-link and application entities;<br/>
    2) the transfer syntax defining encoding rules that are applied to the data-link layer and the application layer protocol data units;<br/>
    3) the data-link and the application context state machines defining the data-link and the application service behaviors visible between communicating data-link and application entities; and<br/>
    4) the data-link and the application relationship state machines defining the data-link and the application service behaviors visible between communicating data-link and application entities.<br/>
    The purpose of this document is to define the services provided to:<br/>
    c) the WiTSnet fieldbus application layer at the boundary between the application and data-link layers of the Fieldbus Reference Model;<br/>
    d) systems management at the boundary between the data-link layer and systems management of the Fieldbus Reference Model;<br/>
    e) the FAL user at the boundary between the user and the application layer of the Fieldbus Reference Model, and<br/>
    f) systems management at the boundary between the application layer and systems management of the Fieldbus Reference Model.<br/>
    The purpose of this document is to define the protocol provided to:<br/>
    g) define the wire-representation of the service primitives defined in clause 7; and<br/>
    h) define the externally visible behavior associated with their transfer.
