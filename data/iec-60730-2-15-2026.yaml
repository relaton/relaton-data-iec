abstract:
- language: en
  script: Latn
  content: |-
    IEC 60730-2-15:2026 applies to automatic electrical air flow, water flow and water level sensing controls<br/>
    - for use in, on, or in association with boilers with a maximum pressure rating of 2 000 kPA (20 bar) and equipment for general household and similar use including controls for heating, air-conditioning and similar applications;<br/>
    NOTE 1 Throughout this document, the word "equipment" means "appliance and equipment" and "controls" means "automatic electrical air flow, water flow and water level sensing controls".<br/>
    EXAMPLE 1 Water flow and water level sensing controls of the float or electrode-sensor type used in boiler applications and air flow, water flow and water level sensing controls for swimming pool pumps, water tank pumps, cooling towers, dishwashers, washing machines, air conditioning chillers and ventilation applications.<br/>
    - for building automation within the scope of ISO 16484 series and IEC 63044 series (HBES/BACS);<br/>
    EXAMPLE 2 Independently mounted air flow, water flow and water level sensing controls in smart grid systems and controls for building automation systems within the scope of ISO 16484-2.<br/>
    - for equipment that is used by the public, such as equipment intended to be used in shops, offices, hospitals, farms and commercial and industrial applications;<br/>
    EXAMPLE 3 Controls for commercial boilers, heating and air-conditioning equipment.<br/>
    - that are smart enabled controls;<br/>
    EXAMPLE 4 Smart grid control, remote interfaces/control of energy-consuming equipment including computer or smart phone.<br/>
    - that are AC or DC powered controls with a rated voltage not exceeding 690 V AC or 600 V DC;<br/>
    - used in, on, or in association with equipment that use electricity, gas, oil, solid fuel, solar thermal energy, etc., or a combination thereof;<br/>
    - utilized as part of a control system or controls which are mechanically integral with multifunctional controls having non-electrical outputs;<br/>
    - using NTC or PTC thermistors and to discrete thermistors, requirements for which are contained in Annex J;<br/>
    - that are mechanically or electrically operated, responsive to or controlling air flow, water flow and water level;<br/>
    - as well as manual controls when such are electrically and/or mechanically integral with automatic controls.<br/>
    NOTE 2 Requirements for manually actuated mechanical switches not forming part of an automatic control are contained in IEC 61058-1-1.<br/>
    This document applies to<br/>
    - the inherent safety of automatic electrical air flow, water flow and water level sensing controls, and<br/>
    - functional safety of automatic air flow, water flow and water level sensing electrical controls and safety related systems,<br/>
    - controls where the performance (for example the effect of EMC phenomena) of the product can impair the overall safety and performance of the controlled system,<br/>
    - the operating values, operating times, and operating sequences where such are associated with equipment safety.<br/>
    This document specifies the requirements for construction, operation and testing of automatic electrical air flow, water flow and water level sensing controls used in, on, or in association with an equipment.<br/>
    This document takes into account the response value of an automatic action of a control where such a response value is dependent upon the method of mounting the control. Where a response value is of significant purpose for the protection of the user, or surroundings, the value defined in the appropriate household equipment standard or as determined by the manufacturer applies.<br/>
    This document does not<br/>
    - apply to air flow, water flow and water level sensing controls intended exclusively for industrial process applications unless explicitly mentioned in the relevant part 2 or the equipment standard. However, this document can be applied to evaluate air flow, water flow and water level sensing controls intended specifically for industrial applications in cases where no relevant safety standard exists;<br/>
    - address the integrity of the output signal to the network devices, such as interoperability with other devices unless it has been evaluated as part of the control system;<br/>
    - apply to pressure sensing controls, the requirements for which are contained in<br/>
    IEC 60730-2-6.<br/>
    This fourth edition cancels and replaces the third edition published in 2017. This edition constitutes a technical revision.<br/>
    This edition includes the following significant technical changes with respect to the previous edition:<br/>
    a) adoption to IEC 60730-1:2022 with all of its significant changes to IEC 60730-1:2013, IEC 60730-1:2013/AMD1:2015 and IEC 60730-1:2013/AMD2:2020.
- language: fr
  script: Latn
  content: |-
    L'IEC 60730-2-15:2026 s'applique aux dispositifs de commande électrique automatiques détecteurs de débit d'air, de débit d'eau et de niveau d'eau<br/>
    - pour usage dans, sur ou en association avec des chaudières dont la pression maximale assignée est de 2 000 kPA (20 bar) et des matériels à usage domestique général et analogue, y compris des dispositifs de commande pour le chauffage, l'air conditionné et les applications analogues;<br/>
    NOTE 1 Dans le présent document, le terme "matériel" signifie "appareil et matériel" et "dispositifs de commande" signifie "dispositifs de commande électrique automatiques détecteurs de débit d'air, de débit d'eau et de niveau d'eau".<br/>
    EXEMPLE 1 Les dispositifs de commande détecteurs de débit d'eau et de niveau d'eau du type à flotteur ou à électrode utilisés dans les applications de chaudières et les dispositifs de commande détecteurs de débit d'air, de débit d'eau et de niveau d'eau pour les pompes de piscine, les pompes de réservoir d'eau, les tours de refroidissement, les lave-vaisselles, les machines à laver le linge, les réfrigérants de conditionnement d'air et les applications de ventilation.<br/>
    - pour l'automatisation des bâtiments qui relèvent du domaine d'application de la série ISO 16484 et de la série IEC 63044 (HBES/BACS);<br/>
    EXEMPLE 2 Dispositifs de commande détecteurs de débit d'air, de débit d'eau et de niveau d'eau montés indépendamment, les dispositifs de commande des systèmes de réseau intelligent et les dispositifs de commande des systèmes d'automatisation des bâtiments qui relèvent du domaine d'application de l'ISO 16484-2.<br/>
    - pour des matériels utilisés par le public, tels que les matériels destinés à être utilisés dans des magasins, des bureaux, des hôpitaux, des fermes et des applications commerciales et industrielles;<br/>
    EXEMPLE 3 Les dispositifs de commande pour les installations de chaudière, de chauffage et d'air conditionné.<br/>
    - qui sont des dispositifs de commande activés intelligents;<br/>
    EXEMPLE 4 Les dispositifs de commande de réseau intelligent, les interfaces distantes/dispositifs de commande de matériels utilisateurs d'énergie électrique, y compris les ordinateurs ou les mobiles multifonctions.<br/>
    - qui sont des dispositifs de commande à courant alternatif ou continu dont la tension assignée ne dépasse pas 690 V en courant alternatif ou 600 V en courant continu;<br/>
    - qui sont utilisés dans, sur ou avec des matériels qui utilisent l'électricité, le gaz, le pétrole, des combustibles solides, l'énergie thermique solaire, etc. ou une combinaison de ces sources d'énergie;<br/>
    - qui sont utilisés dans le cadre d'un système de commande ou de dispositifs de commande qui sont mécaniquement intégrés à des dispositifs de commande multifonctions comportant des sorties non électriques;<br/>
    - qui utilisent des thermistances CTN ou CTP ainsi qu'aux dispositifs à thermistances discrètes, dont les exigences sont fournies à l'Annexe J;<br/>
    - qui sont actionnés mécaniquement ou électriquement, qui sont sensibles à, ou commandent, un débit d'air, un débit d'eau et un niveau d'eau;<br/>
    - ainsi qu'aux dispositifs de commande manuels qui sont électriquement et/ou mécaniquement intégrés à des dispositifs de commande automatique.<br/>
    NOTE 2 Les exigences relatives aux interrupteurs mécaniques à action manuelle qui ne font pas partie d'un dispositif de commande automatique sont contenues dans l'IEC 61058-1-1.<br/>
    Le présent document s'applique<br/>
    - à la sécurité intrinsèque des dispositifs de commande électrique automatiques détecteurs de débit d'air, de débit d'eau et de niveau d'eau; et<br/>
    - à la sécurité fonctionnelle des dispositifs de commande électrique automatiques détecteurs de débit d'air, de débit d'eau et de niveau d'eau et des systèmes de sécurité;<br/>
    - aux dispositifs de commande pour lesquels les performances (par exemple, l'effet des phénomènes CEM) du produit peuvent compromettre la sécurité et les performances globales du système commandé;<br/>
    - aux valeurs de fonctionnement, aux temps de fonctionnement et aux séquences de fonctionnement lorsque ces éléments interviennent dans la sécurité du matériel;<br/>
    Le présent document spécifie les exigences relatives à la construction, au fonctionnement et aux essais des dispositifs de commande électrique automatiques détecteurs de débit d'air, de débit d'eau et de niveau d'eau utilisés dans, sur ou avec du matériel.<br/>
    Le présent document prend en compte la valeur de réponse d'une action automatique d'un dispositif de commande lorsque cette valeur de réponse dépend de la méthode de montage du dispositif de commande. Dans le cas où une telle valeur de réponse est importante du point de vue de la protection de l'utilisateur ou de l'environnement, la valeur spécifiée dans la norme appropriée du matériel domestique ou déterminée par le fabricant s'applique.<br/>
    Le présent document<br/>
    - ne s'applique pas aux dispositifs de commande détecteurs de débit d'air, de débit d'eau et de niveau d'eau destinés exclusivement à des applications de processus industriels, sauf mention particulière dans la partie 2 applicable ou la norme du matériel. Toutefois, le présent document peut être utilisé pour évaluer les dispositifs de commande détecteurs de débit d'air, de débit d'eau et de niveau d'eau destinés spécifiquement aux applications industrielles lorsqu'il n'existe aucune norme de sécurité pertinente;<br/>
    - ne traite pas de l'intégrité du signal de sortie transmis aux dispositifs de réseau, comme l'interopérabilité avec d'autres dispositifs, à moins qu'elle ait été évaluée comme partie intégrante du système de commande;<br/>
    - ne s'applique pas aux dispositifs de commande sensibles à la pression, dont les exigences sont fournies dans l'IEC 60730-2-6.<br/>
    Cette quatrième édition annule et remplace la troisième édition parue en 2017. Cette édition constitue une révision technique.<br/>
    Cette édition inclut les modifications techniques majeures suivantes par rapport à l'édition précédente:<br/>
    a) adoption de l'IEC 60730-1:2022 avec toutes les modifications majeures par rapport à l'IEC 60730-1:2013, l'IEC 60730-1:2013/AMD1:2015 et l'IEC 60730-1:2013/AMD2:2020.
