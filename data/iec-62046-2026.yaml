abstract:
- language: en
  script: Latn
  content: |-
    IEC 62046: 2026 specifies requirements for the selection, positioning, configuration and commissioning of sensitive protective equipment (SPE) to detect the momentary or continued presence of persons in order to protect those persons from dangerous part(s) of machinery in industrial applications. This document covers the application of electro-sensitive protective equipment (ESPE) specified in the IEC 61496 series and pressure-sensitive mats and floors specified in ISO 13856‑1. It takes into account the characteristics of the machinery, the sensitive protective equipment, the environment and human interaction by persons of 14 years and older. This document includes informative annexes to provide guidance on the application of sensitive protective equipment to detect the presence of persons. These annexes contain examples to illustrate the principles of this document. These examples are not intended to be the only solutions to a given application and are not intended to restrict innovation or advancement of technology. The examples are provided only as representative solutions to illustrate some of the concepts of integration of sensitive protective equipment, and have been simplified for clarity, so they can be incomplete. It is intended that this document is used in conjunction with ISO 13855. This second edition cancels and replaces the first edition published in 2018. This edition constitutes a technical revision.<br/>
    This edition includes the following significant technical changes with respect to the first edition:<br/>
    a) restructuring of the document to aid the user;<br/>
    b) additional information on vision and radar systems;<br/>
    c) muting requirements have been updated;<br/>
    d) information on whole body access has been added;<br/>
    e) whole body access has also been covered in more detail;<br/>
    f) alignment to changes in ISO 13855.
- language: fr
  script: Latn
  content: |-
    IEC 62046: 2026 spécifie les exigences pour le choix, le positionnement, la configuration et la mise en service des équipements de protection sensibles (SPE) prévus pour détecter la présence momentanée ou permanente de personnes afin de protéger celles‑ci contre les parties dangereuses des machines dans des applications industrielles. Le présent document couvre l'application des équipements de protection électrosensibles (ESPE) spécifiés dans la série IEC 61496 ainsi que des tapis et planchers sensibles à la pression spécifiés dans l'ISO 13856‑1. Il tient compte des caractéristiques des machines, des équipements de protection sensibles, de l'environnement et de l'interaction humaine par des personnes de 14 ans et plus. Le présent document inclut des annexes informatives qui fournissent des recommandations sur l'application des équipements de protection sensibles pour détecter la présence de personnes. Ces annexes contiennent des exemples pour expliquer les principes définis dans le présent document. Ces exemples ne sont pas réputés représenter des solutions uniques à une application donnée ni constituer une limitation à l'innovation ou aux avancées technologiques. Ces exemples sont fournis uniquement comme des solutions représentatives destinées à expliquer certaines des notions d'intégration d'équipements de protection sensibles et ont été simplifiés par souci de clarté. De ce fait, ils peuvent être incomplets. Le présent document est destiné à être utilisé conjointement avec l'ISO 13855. Cette deuxième édition annule et remplace la première édition parue en 2018. Cette édition constitue une révision technique.<br/>
    Cette édition inclut les modifications techniques majeures suivantes par rapport à la première édition:<br/>
    a) le document a été restructuré pour guider l'utilisateur;<br/>
    b) des informations supplémentaires ont été ajoutées pour les systèmes de vision et les systèmes radars;<br/>
    c) les exigences d'inhibition ont été mises à jour;<br/>
    d) des informations sur l'accès au corps entier ont été ajoutées;<br/>
    e) l'accès au corps entier est également traité de manière plus détaillée;<br/>
    f) le document a été aligné sur les modifications apportées à l'ISO 13855.
