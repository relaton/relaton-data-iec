abstract:
- language: en
  script: Latn
  content: <p class="MsoBodyText">This document specifies the security assurance requirements
    of the ISO/IEC 15408 series. It includes the individual assurance components from
    which the evaluation assurance levels and other packages contained in ISO/IEC
    15408-5 are composed, and the criteria for evaluation of Protection Profiles (PPs),
    PP-Configurations, PP-Modules and Security Targets (STs).</p>
- language: fr
  script: Latn
  content: <p class="MsoBodyText">Le présent document spécifie les exigences d'assurance
    de sécurité de la série ISO/IEC 15408. Il comprend les éléments d'assurance individuels
    à partir desquels sont composés les niveaux d'assurance de l'évaluation et les
    autres paquets contenus dans l'ISO/IEC 15408-5, ainsi que les critères d'évaluation
    des profils de protection (PP), des configurations de PP, des modules de PP et
    des cibles de sécurité (ST).</p>
