abstract:
- language: en
  script: Latn
  content: |-
    <p>IEC 60695-2-10:2026 CMV contains both the official standard and its commented version. The commented version provides you with a quick and easy way to compare all the changes between IEC 60695-2-10:2026 edition 4.0 and the previous IEC 60695-2-10:2021 edition 3.0. Furthermore, comments from IEC TC 89 experts are provided to explain the reasons of the most relevant changes, or to clarify any part of the content.<br/>
    <br/>
    IEC 60695-2-10:2026 specifies the glow-wire apparatus and common test procedure to simulate the effects of thermal stresses which may be produced by heat sources such as glowing elements or overloaded resistors, for short periods, in order to assess the fire hazard by a simulation technique. The test procedure described in this document is a common test procedure intended for the small-scale tests in which a standardized electrically heated wire is used as a source of ignition. It is a common part of the test procedures applied to end products and to solid electrical insulating materials or other solid combustible materials. A detailed description of each particular test procedure is given in IEC 60695-2-11, IEC 60695-2-12 and IEC 60695-2-13.<br/>
    This fourth edition cancels and replaces the third edition published in 2021. This edition constitutes a technical revision.<br/>
    This edition includes the following significant technical changes with respect to the previous edition:<br/>
    a) revision of 4.3 to add reference to new Annex D;<br/>
    b) addition of new normative Annex D on "Use of pyrometer for glow-wire test";<br/>
    c) revision of Clause 3 references to align with ISO 13943:2017.<br/>
    It has the status of a basic safety publication in accordance with IEC Guide 104. This International Standard is to be used in conjunction with IEC 60695-2-11, IEC 60695-2-12, and IEC 60695-2-13.</p>
