abstract:
- language: en
  script: Latn
  content: |-
    IEC 61267:2026 CMV contains both the official standard and its commented version. The commented version provides you with a quick and easy way to compare all the changes between IEC 61267:2025 edition 3.0 and the previous IEC 61267:2005 edition 2.0. Furthermore, comments from IEC SC 62C experts are provided to explain the reasons of the most relevant changes, or to clarify any part of the content.<br/>
    <br/>
    IEC 61267:2025 applies to test procedures which, for the determination of characteristics of systems or components of medical diagnostic X-ray equipment, require well-defined X-ray radiation conditions. This document deals with methods for generating X-ray radiation conditions which can be used under test conditions typically found in test laboratories or in manufacturing facilities for the determination of characteristics of medical diagnostic X-ray equipment.<br/>
    IEC 61267:2025 cancels and replaces the second edition published 2005. This edition constitutes a technical revision. This edition includes the following significant technical changes with respect to the previous edition:<br/>
    a) removing former Annex C “Measurement of the practical peak voltage”;<br/>
    b) inserting informative “Tabulated values for the squared signal-to-noise ratio per air kerma (SNR2in)” and normative “Additional X-ray radiation conditions as used in mammography and determination of the corresponding nominal aluminium half-value layers”;<br/>
    c) revision of X-ray radiation conditions;<br/>
    d) new method for verification of X-ray radiation conditions;<br/>
    e) change of term definitions.
