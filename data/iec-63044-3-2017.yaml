abstract:
- language: en
  script: Latn
  content: |-
    IEC 63044-3:2017 provides the electrical safety requirements related to the HBES/BACS network in addition to the product safety standards for HBES/BACS devices. It also applies to devices used within an HBES/BACS network for which no specific HBES/BACS product safety standard exists. In addition, it defines safety requirements for the interface of equipment intended to be connected to an HBES/BACS network. It does not apply to interfaces to other networks.<br/>
    NOTE An example of other networks is a dedicated ICT network covered by IEC 62949. This document is applicable to<br/>
    operator stations and other human–system interface devices,<br/>
    devices for management functions,<br/>
    control devices, automation stations and application-specific controllers,<br/>
    field devices and their interfaces, and<br/>
    cabling and interconnection of devices<br/>
    used within a dedicated HBES/BACS network. This document covers the following requirements and compliance criteria:<br/>
    protection from hazards in the device;<br/>
    protection from overvoltages on the network;<br/>
    protection from touch current;<br/>
    protection from hazards caused by different types of circuit;<br/>
    protection of the communication wiring from overheating caused by excessive current.
- language: fr
  script: Latn
  content: |-
    L'IEC 63044-3:2017 fournit les exigences de sécurité électrique relatives au réseau HBES/SGTB outre les normes de sécurité de produits applicables aux dispositifs HBES/SGTB. Elle s'applique également aux dispositifs utilisés dans un réseau HBES/SGTB pour lequel il n'existe aucune norme de sécurité de produit HBES/SGTB spécifique. De plus, elle spécifie des exigences de sécurité relatives à l'interface des équipements destinés à être connectés à un réseau HBES/SGTB. Elle ne s'applique pas aux interfaces avec d'autres réseaux.<br/>
    NOTE Un réseau TIC dédié traité par l'IEC 62949 constitue un exemple d'autres réseaux. Le présent document est applicable aux<br/>
    postes d’opérateur et autres dispositifs d’interface homme-système,<br/>
    dispositifs pour des fonctions de gestion,<br/>
    dispositifs de commande, postes d’automatisation et contrôleurs spécifiques à une application,<br/>
    dispositifs de terrain et leurs interfaces, et<br/>
    câblage et interconnexion des dispositifs<br/>
    utilisés dans un réseau HBES/SGTB dédié. Le présent document couvre les exigences et critères de conformité suivants:<br/>
    protection contre les dangers dans le dispositif;<br/>
    protection contre les surtensions sur le réseau;<br/>
    protection contre le courant de contact;<br/>
    protection contre les dangers provoqués par différents types de circuits;<br/>
    protection du câblage de communication contre les températures excessives provoquées par un courant trop élevé.<br/>
    Mots clé: domotique
