abstract:
- language: en
  script: Latn
  content: |-
    CORRECTED VERSION 2025-07<br/>
    <br/>
    IEC 60268-16:2020 defines the STI model, test signals, measurement and prediction methods.<br/>
    The objective of this document is to provide a comprehensive manual for all types of users of the STI model in the fields of audio, communications and acoustics.<br/>
    This document does not provide STI criteria for certification of transmission channels (e.g. criteria for a voice-alarm system), but some typical application values are provided in Annex G.<br/>
    Every measurement method has limitations, and the reader is referred to clauses relating to limitations such as speech privacy, echo and systems using digital voice compression (vocoders).<br/>
    This document does not cover the case of fluctuating noise on the STI, although some general comments on dealing with this complex issue are provided in 7.13 and 8.9.3.<br/>
    IEC 60268-16:2020 cancels and replaces the fourth edition published in 2011. This edition constitutes a technical revision.<br/>
    This edition includes the following significant technical changes with respect to the previous edition:<br/>
    a) the spectrum of the male speech test signal has been changed, with significant reductions in the 125 Hz and 250 Hz bands being implemented;<br/>
    b) some corrections to formulae have been made;<br/>
    c) additional information has been included on prediction and measurement procedures;<br/>
    d) spectrum and weighting factors for female speech have been removed;<br/>
    e) verification information for STI measurement devices added;<br/>
    f) the relationships between STI and number of other speech intelligibility measures have been updated in Annex E;<br/>
    g) greater information is given in Annex M about adjustments to the measured STI results to simulate effects of alternative ambient noise and speech levels.<br/>
    The content of the corrigendum 1 (2025-07) has been included in this copy.
- language: fr
  script: Latn
  content: |-
    VERSION CORRIGEE 2025-07<br/>
    <br/>
    L'IEC 60268-16:2020 définit le modèle, les signaux d'essai, la mesure et les méthodes de prévision STI.<br/>
    L'objectif du présent document est de mettre un manuel complet à la disposition de tous les types d'utilisateurs du modèle STI dans les domaines de l'audio, des communications et de l'acoustique.<br/>
    Le présent document ne donne pas de critères STI destinés à la certification des canaux de transmission (par exemple, critères pour un système d'alarme vocale), mais certaines valeurs d'application courante sont fournies dans l'Annexe G.<br/>
    Chaque méthode de mesure présente ses limites, et le lecteur est prié de se référer aux articles correspondants, par exemple concernant la confidentialité des conversations, l'écho et les systèmes qui utilisent la compression vocale numérique (vocodeurs).<br/>
    Le présent document ne couvre pas les cas du bruit fluctuant sur le STI, bien que certains commentaires généraux qui traitent de cette question complexe soient fournis en 7.13 et 8.9.3.<br/>
    L'IEC 60268-16:2020 annule et remplace la quatrième édition parue en 2011. Cette édition constitue une révision technique.<br/>
    Cette édition inclut les modifications techniques majeures suivantes par rapport à l'édition précédente:<br/>
    a) le spectre du signal d'essai de la parole masculine a été modifié pour appliquer des réductions significatives au niveau des bandes de 125 Hz et 250 Hz;<br/>
    b) certaines formules ont été corrigées;<br/>
    c) des informations supplémentaires relatives aux modes opératoires de prédiction et de mesure ont été incluses;<br/>
    d) le spectre et les facteurs de pondération pour la parole féminine ont été supprimés;<br/>
    e) des informations de vérification pour les dispositifs de mesure STI ont été ajoutées;<br/>
    f) les relations entre le STI et plusieurs autres mesures de l'intelligibilité de la parole ont été mises à jour en Annexe E;<br/>
    g) des informations supplémentaires sont données en Annexe M concernant les ajustements des résultats STI mesurés afin de simuler les effets d'autres niveaux de bruit ambiant et de parole.<br/>
    Le contenu du corrigendum 1 (2025-07) a été pris en considération dans cet exemplaire.
