abstract:
- language: en
  script: Latn
  content: |-
    IEC 60851-5:2026 RLV contains both the official IEC International Standard and its Redline version. The Redline version is available in English only and provides you with a quick and easy way to compare all the changes between the official IEC Standard and its previous edition.
    <p>IEC 60851-5:2026 specifies the following tests:<br/>
    Test 5: Electrical resistance;<br/>
    Test 13: Breakdown voltage;<br/>
    Test 14: Continuity of insulation;<br/>
    Test 19: Dielectric dissipation factor;<br/>
    Test 23: Pin hole.<br/>
    For definitions and general notes on methods of test, Clause 3 of IEC 60851-1:2021 applies. This IEC 60851-5:2026 also specifies methods for determining the dissipation factor of enamelled winding wire, provided in Annex A. This fifth edition cancels and replaces the fourth edition published in 2008, Amendment 1:2011 and Amendment 2:2019. This edition constitutes a technical revision.<br/>
    This edition includes the following significant technical changes with respect to the previous edition:<br/>
    a) Subclauses 5.3.1 and 5.3.2 modified to expand the conductor size range for the loads applied during cylinder method testing for dielectric breakdown voltage of enameled wires and for fully insulated wires.<br/>
    b) Addition of subclause 6.5 for inline continuity testing of rectangular wire (under consideration).</p>
