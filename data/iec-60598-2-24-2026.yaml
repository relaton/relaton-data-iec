abstract:
- language: en
  script: Latn
  content: |-
    IEC 60598-2-24:2026 specifies requirements for luminaires for which limited surface temperatures are provided to counteract risks from combustible dusts (conductive or non‑conductive) or ignition of materials that can be deposited on luminaires. The luminaires are for use with electric light sources on supply voltages not exceeding 1 000 V. This document specifically excludes requirements for luminaires for use in explosive gas atmospheres and explosive dust atmospheres. This third edition cancels and replaces the second edition, published in 2013. This edition constitutes a technical revision.<br/>
    This edition includes the following significant technical changes with respect to the previous edition:<br/>
    a) the clause numbers and structure have been aligned with those of IEC 60598‑1;<br/>
    b) improved terms and definitions;<br/>
    c) more detailed classification of luminaires;<br/>
    d) indication of luminaire mounting positions and use locations;<br/>
    e) thermal protection of built-in controlgear and other built-in devices required.
- language: fr
  script: Latn
  content: |-
    L'IEC 60598-2-24:2026, spécifie les exigences applicables aux luminaires dont les surfaces ont des températures limitées dans le but de réduire les risques dus aux poussières combustibles (conductrices ou non conductrices) ou les risques d'inflammation des matériaux qui peuvent se déposer sur ces luminaires. Ces luminaires sont destinés à être utilisés avec des sources de lumière électriques dont les tensions d'alimentation ne dépassent pas 1 000 V. Cette troisième édition annule et remplace la deuxième édition parue en 2013. Cette édition constitue une révision technique.<br/>
    Cette édition inclut les modifications techniques significatives suivantes par rapport à l'édition précédente:<br/>
    a) alignement de la numérotation des articles et de la structure sur l'IEC 60598-1;<br/>
    b) amélioration des termes et définitions;<br/>
    c) classification plus détaillée des luminaires;<br/>
    d) indication des positions de montage et des emplacements d'utilisation des luminaires;<br/>
    e) protection thermique exigée pour les appareillages de commande de lampes incorporés et les autres dispositifs incorporés.
