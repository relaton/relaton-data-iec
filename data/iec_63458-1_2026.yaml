- content: "L'IEC 63458-1:2026 établit les exigences relatives à la sécurité pour
    les unités à jet d'eau à haute pression équipées de mécanismes de commande de
    tous types (moteur électrique, moteur à combustion interne, moteur pneumatique
    et moteur hydraulique, par exemple) dans lesquelles la pression est générée par
    des pompes. Le présent document traite de l'ensemble des phénomènes dangereux
    significatifs, situations dangereuses et événements dangereux qui surviennent
    lors de l'assemblage, du montage, du fonctionnement et de l'entretien des unités
    à jet d'eau à haute pression, lorsque celles-ci sont utilisées dans les conditions
    prévues et dans les conditions de mauvais usage raisonnablement prévisible établies
    par le fabricant. Dans le présent document, toutes les références aux unités à
    jet d'eau à haute pression concernent les machines destinées à une ou plusieurs
    des applications industrielles suivantes:<br />\r\n– nettoyage;<br />\r\n– préparation
    de surfaces;<br />\r\n– enlèvement de matériaux;<br />\r\n– ragréage du béton;<br
    />\r\n– découpe.<br />\r\nLe présent document s'applique aux unités à jet d'eau
    à haute pression mobiles et fixes, dans lesquelles la pression d'eau est générée
    par une pompe/un générateur de pression et la pression de service maximale admissible
    est supérieure à la limite supérieure fixée dans le domaine d'application de l'IEC
    60335-2-79 (La limite supérieure pour les machines couvertes par l'IEC 60335-2-79
    est actuellement de 35 MPa).<br />\r\nLe présent document ne couvre pas:<br />\r\n–
    les appareils de nettoyage à haute pression qui sont traités dans l'IEC 60335-2-54;<br
    />\r\n– les autres dangers liés à l'incorporation d'unités à jet d'eau à haute
    pression dans d'autres machines de technologie de procédé;<br />\r\n– les dangers
    spécifiques liés aux atmosphères explosives, à l'utilisation à bord de navires
    ou à des températures ambiantes en dehors de la plage 5 °C à 40 °C;<br />\r\n–
    les dangers dus à la nature des liquides utilisés pour les jets, autres que les
    dangers dus à la pression;<br />\r\n– les dangers liés aux mécanismes de commande
    ou les dangers spécifiques dus aux fonctions de production de chaleur. Toutefois,
    les dangers dus aux températures élevées des surfaces pouvant être touchées sont
    couverts;<br />\r\n– les unités à jet d'eau à haute pression qui ont été fabriquées
    avant la date de publication du présent document en tant que norme de l'IEC;<br
    />\r\n– les flexibles à jet d'eau à haute pression couverts par l'IEC 63458-2;<br
    />\r\n– les dispositifs pulvérisateurs à jet d'eau à haute pression couverts par
    l'IEC 63458-3.<br />\r\nLes essais conformes au présent document sont des essais
    de type, sauf s'ils concernent des essais individuels de série (informatifs) qui
    doivent être effectués au cours de la fabrication en série.<br />\r\nLa conformité
    à l'IEC 63458-1, à l'IEC 63458-2 et à l'IEC 63458-3 fournit les exigences complètes
    pour les machines à jet d'eau à haute pression."
