abstract:
- language: en
  script: Latn
  content: |-
    IEC 60335-2-32:2019 deals with the safety of electric massage appliances for household and similar purposes, their rated voltage being not more than 250 V for single phase appliances and 480 V for other appliances. Examples of appliances within the scope of this standard are:<br/>
    - foot massagers;<br/>
    - water filled foot massagers;<br/>
    - hand-held massagers;<br/>
    - massage beds;<br/>
    - massage belts;<br/>
    - massage chairs;<br/>
    - massage pads.<br/>
    Appliances not intended for normal household use but that nevertheless may be a source of danger to the public, such as appliances intended to be used by laymen in shops, in light industry and on farms, are within the scope of this standard. As far as is practicable, this standard deals with the common hazards presented by appliances that are encountered by all persons in and around the home. However, in general, it does not take into account:<br/>
    - persons (including children) whose physical, sensory or mental capabilities or lack of experience and knowledge prevents them from using the appliance safely without supervision or instruction;<br/>
    - children playing with the appliance.<br/>
    Attention is drawn to the fact that:<br/>
    - for appliances intended to be used in vehicles or on board ships or aircraft, additional requirements can be necessary;<br/>
    - in many countries additional requirements are specified by the national health authorities, the national authorities responsible for the protection of labour and similar authorities.<br/>
    This standard does not apply to<br/>
    - appliances intended exclusively for industrial purposes;<br/>
    - appliances intended to be used in locations where special conditions prevail, such as the presence of a corrosive or explosive atmosphere (dust, vapour or gas);<br/>
    - electric foot care appliances that do not contain motors and other electric appliances for the care of skin or hair (IEC 60335-2-23)<br/>
    - electric appliances for beauty care of persons and intended for household, commercial and similar purposes (IEC 60335-2-115).<br/>
    This fifth edition cancels and replaces the fourth edition published in 2002, Amendment 1: 2008 and Amendment 2:2013. This edition constitutes a technical revision.<br/>
    This edition includes the following significant technical changes with respect to the previous edition:<br/>
    - aligns the text with IEC 60335-1, Ed 5, and its Amendments 1 and 2;<br/>
    - note is converted to normative text (11.8);<br/>
    - additional requirements for temperatures of external accessible surfaces (Clause 11);<br/>
    - alternative stability requirements for hand-held appliances (20.2);<br/>
    - new mechanical strength test for hand-held appliances (21.1, 21.101).<br/>
    This part 2 is to be used in conjunction with the latest edition of IEC 60335-1 and its amendments. It was established on the basis of the fifth edition (2010) of that standard.
- language: fr
  script: Latn
  content: |-
    L'IEC 60335-2-32:2019 traite de la sécurité des appareils électriques de massage pour usages domestiques et analogues, dont la tension assignée n'est pas supérieure à 250 V pour les appareils monophasés et à 480 V pour les autres appareils. Exemples d’appareils relevant du domaine d'application de la présente norme:<br/>
    - appareils de massage des pieds;<br/>
    - appareils de massage des pieds remplis d’eau;<br/>
    - appareils de massage portatifs;<br/>
    - lits de massage;<br/>
    - ceintures de massage;<br/>
    - chaises de massage;<br/>
    - coussins de massage.<br/>
    Les appareils non destinés à un usage domestique normal mais qui peuvent néanmoins constituer une source de danger pour le public, par exemple les appareils destinés à être utilisés par des utilisateurs non avertis dans des magasins, chez des artisans et dans des exploitations agricoles, relèvent du domaine d'application de la présente norme.<br/>
    Dans la mesure du possible, la présente norme traite des dangers ordinaires présentés par les appareils et encourus par tous les individus à l'intérieur et autour de l'habitation. Cependant, elle ne tient généralement pas compte:<br/>
    - des personnes (y compris des enfants) dont les capacités physiques, sensorielles ou mentales ou le manque d’expérience et de connaissance les empêchent d’utiliser l’appareil en toute sécurité sans surveillance ou instruction;<br/>
    - de l’utilisation de l’appareil comme jouet par des enfants.<br/>
    L’attention est attirée sur le fait que:<br/>
    - pour les appareils destinés à être utilisés dans des véhicules ou à bord de navires ou d'avions, des exigences supplémentaires peuvent être nécessaires;<br/>
    - dans de nombreux pays, des exigences supplémentaires sont spécifiées par les organismes nationaux de la santé, par les organismes nationaux responsables de la protection des travailleurs, par les organismes nationaux responsables de l'alimentation en eau et par des organismes similaires.<br/>
    La présente norme ne s’applique pas:<br/>
    - aux appareils exclusivement destinés à un usage industriel;<br/>
    - aux appareils destinés à être utilisés dans des locaux présentant des conditions particulières, telles que la présence d'une atmosphère corrosive ou explosive (poussières, vapeur ou gaz);<br/>
    - aux appareils électriques de soins des pieds sans moteur et aux autres appareils électriques de soins de la peau ou des cheveux (IEC 60335-2-23);<br/>
    - aux appareils électriques de soins de beauté destinés à un usage domestique, commercial ou analogue (IEC 60335-2-115).<br/>
    Cette cinquième édition annule et remplace la quatrième édition parue en 2002, l'Amendement 1:2008 et l'Amendement 2:2013. Cette édition constitue une révision technique. Cette édition inclut les modifications techniques majeures suivantes par rapport à l'édition précédente:<br/>
    - alignement du texte sur l’IEC 60335-1, Ed 5 et ses Amendements 1 et 2;<br/>
    - conversion d’une note en texte normatif (11.8);<br/>
    - ajout d’exigences relatives aux surfaces accessibles extérieures (Article 11);<br/>
    - ajout d’exigences de stabilité alternatives relatives aux appareils portatifs (20.2);<br/>
    - ajout d’un nouvel essai de résistance mécanique pour les appareils portatifs (21.1, 21.101).<br/>
    La présente partie 2 doit être utilisée conjointement avec la dernière édition de l’IEC 60335-1 et ses amendements. Elle a été établie sur la base de la cinquième édition (2010) de cette norme.
