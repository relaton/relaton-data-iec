abstract:
- language: en
  script: Latn
  content: |-
    IEC TR 61390:2022 describes representative methods of measuring the performance of complete real-time medical ultrasonic imaging equipment in the frequency range 0,5 MHz to 23 MHz.<br/>
    This document is relevant for real-time ultrasonic scanners based on the pulse-echo principle, for the types listed below:<br/>
    - mechanical sector scanner;<br/>
    - electronic phased array sector scanner;<br/>
    - electronic linear array scanner;<br/>
    -electronic curved array sector scanner;<br/>
    - water-bath scanner based on any of the above four scanning mechanisms;<br/>
    - plane-wave/fast imaging scanners;<br/>
    - combination of several of the above methods (e.g. a linear array phased at the edge to produce a sector there to enlarge the field of view.<br/>
    The methods described are based on evaluation of:<br/>
    - sonograms obtained by scanning of tissue mimicking objects (phantoms);<br/>
    - sonograms obtained by scanning of artificial, low- or highly reflective targets in suitable environments;<br/>
    - parameters of the ultrasound field transmitted by the measured scanner.<br/>
    This document does not relate to methods for measuring electrical parameters of the scanner’s electronic systems.<br/>
    IEC TR 61390:2022 cancels and replaces the first edition published in 1996. This edition constitutes a technical revision.<br/>
    This edition includes the following significant technical changes with respect to the previous edition:<br/>
    a) Several additional phantom designs are included in the main body of the document;<br/>
    b) Several additional transducer types are included in the Scope;<br/>
    c) Methods of analysis are presented in new Annex B.
