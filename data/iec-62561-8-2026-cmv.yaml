abstract:
- language: en
  script: Latn
  content: |-
    This commented version (CMV) of the official IEC Standard allows the user to identify the changes made to the previous edition IEC TS 62561-8:2018. A vertical bar appears in the margin wherever a change has been made. Additions are in green text, deletions are in strikethrough red text.<br/>
    <br/>
    IEC 62561-8:2026 specifies the requirements and tests for components used for electrically insulated LPS. These components, which can reduce the separation distance, are as follows:<br/>
    - insulating stand-offs, used in conjunction with an air-termination system and down-conductors with the aim of maintaining the proper separation distance;<br/>
    - insulating down‑conductors, including their specific fasteners.<br/>
    Testing of insulating stand-offs and insulating down-conductor components for an explosive atmosphere is not covered by this document. This first edition cancels and replaces IEC TS 62561-8 published in 2018. This edition constitutes a technical revision.<br/>
    This edition includes the following significant technical changes with respect to IEC TC 62561-8:2018:<br/>
    a) title and scope of the standard has been adjusted;<br/>
    b) the document has been updated in line with IEC 60068-2-52:2017 on salt mist treatment;<br/>
    c) the document has been updated in line with ISO 22479:2019 on humid sulphureous atmosphere treatment;<br/>
    d) two different possible example configurations for pull out tests have been introduced;<br/>
    e) additional information on pollution has been included;<br/>
    f) an alternate test arrangement for high voltage impulse test has been included;<br/>
    g) a new normative Annex H for applicability of previous tests has been introduced;<br/>
    h) pass criteria for high voltage impulse testing updated;<br/>
    i) explanation on high voltage impulse testing with negative polarity has been added.
