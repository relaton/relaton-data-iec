abstract:
- language: en
  script: Latn
  content: |-
    IEC TS 63222-1:2026 is intended to provide provisions associated to the main use cases regarding recognized engineering practices applicable to power quality management in public electric power supply networks. It summarizes the operation in power quality management and investigates the current standards, for requirement of power quality assessment work, as well as to promote the development of power quality management best practices. The power quality management domain groups use cases and associated power quality requirement common to network management, including customer support network operation, network and extension planning. This document captures possible "common and repeated usage" of power quality management under the format of "use case". Use case implementations are given for information purpose only. This document derives the common requirement as provisions by further standardization activities, in terms of actors interacting with the given system. The interface requirement is considered for later standardization activities. The relationship of the stakeholders in power quality management, such as network operator, network user, etc, are discussed in the document.<br/>
    This second edition cancels and replaces the first edition published in 2022. This edition includes the following significant technical changes with respect to the previous edition:<br/>
    - this document completes the use cases planned in IEC 63222-1:2022: four business use cases and three system use cases are added;<br/>
    - this document makes adjustments to the wording of certain phrases and technical details in IEC 63222-1:2022.
