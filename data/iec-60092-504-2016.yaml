abstract:
- language: en
  script: Latn
  content: |-
    IEC 60092-504:2016 specifies electrical, electronic and programmable equipment intended for automation, control, monitoring, alert, and safety and protection systems for use in ships. This edition includes the following significant technical changes with respect to the previous edition:<br/>
    a) the part title has been changed, the term "Automation" was added;<br/>
    b) the contents of the corrigendum of January 2011 have been included;<br/>
    c) a new subclause 5.1 "General" with general requirements for type testing has been added;<br/>
    d) Table 1 contents aligned with current version of document IACS Req. 1991/Rev. 5, 2006;<br/>
    e) the revised IMO Resolution A.1021(26), Code on alerts and indicators:2009 has been taken into account;<br/>
    f) IMO Resolution MSC.302(87) has been taken into account. As a consequence, the term "alert" has been used where the generic term applies. This concerns, in particular, the text in 8.4 and 9.3;<br/>
    g) a new subclause 8.2.4: The revised IMO Resolution MSC.145(77), Performance standards for water level detectors on bulk carriers:2003 has been taken into account;<br/>
    h) subclause 9.1 about fire detection and alarm systems has been completely revised, IMO Resolution MSC.98(73) (FSS Code) with amendment MSC.292(87): 2010 has been taken into account;<br/>
    i) a new subclause 9.2 "Bilge systems" has been added;<br/>
    j) the subclauses 9.4 "Automatic control installations for electrical power supply" and 9.5 "Automatic starting installations for electrical motor-driven auxiliaries" have been completely revised;<br/>
    k) Clause 10 "Computer based systems" has been completely revised;<br/>
    l) a new subclause 10.3.6 about wireless data communication has been added;<br/>
    m) a new subclause 10.5 about remote access has been added.
- language: fr
  script: Latn
  content: |-
    L'IEC 60092-504:2016 définit les équipements électriques, électroniques et programmables destinés aux systèmes d'automatisation, de commande, de surveillance, d'alerte, et de sécurité et de protection utilisés à bord des navires. Cette édition inclut les modifications techniques majeures suivantes par rapport à l'édition précédente:<br/>
    a) le titre de la partie a été modifié avec addition du terme "Automatisation";<br/>
    b) le contenu du corrigendum de janvier 2011 a été intégré;<br/>
    c) un nouveau paragraphe 5.1 "Généralités" contenant les exigences générales applicables aux essais de type a été ajouté;<br/>
    d) le Tableau 1 a été aligné sur la dernière version du document IACS Req. 1991/Rev. 5, 2006;<br/>
    e) la version révisée de la Résolution OMI A.1021(26), Recueil de règles relatives aux alertes et aux indicateurs:2009, a été prise en compte;<br/>
    f) la Résolution OMI MSC.302(87) a été prise en compte. Par conséquent, le terme "alerte" a été utilisé lorsqu'il est question du terme générique. Cela concerne notamment le texte de 8.4 et 9.3;<br/>
    g) un nouveau paragraphe 8.2.4: la version révisée de la Résolution OMI MSC.145(77) Normes de fonctionnement des détecteurs de niveau d'eau à bord des vraquiers: 2003 a été pris en compte;<br/>
    h) le paragraphe 9.1 relatif aux systèmes de détection et d'alarme d'incendie a été entièrement révisé; la Résolution OMI MSC.98(73) (Recueil FSS) et son amendement MSC.292(87): 2010 ont été pris en compte;<br/>
    i) un nouveau paragraphe 9.2 "Systèmes de cales" a été ajouté;<br/>
    j) le paragraphe 9.4 "Installations de commande automatique pour alimentation électrique" et le paragraphe 9.5 "Installations de démarrage automatique pour systèmes auxiliaires à motorisation électrique" ont été intégralement révisés;<br/>
    k) l'Article 10 "Systèmes informatiques" a été intégralement révisé;<br/>
    l) un nouveau paragraphe 10.3.6 "Communication de données sans fil" a été ajouté;<br/>
    m) un nouveau paragraphe 10.5 "Accès à distance" a été ajouté.
