abstract:
- language: en
  script: Latn
  content: |-
    IEC 62002-1:2008 is a radio access specification for mobile, portable and hand-held portable devices capable of receiving DVB-T/H services. It includes informative system aspects as well as specifications for minimum RF-performance. It covers terminals in three main classes, namely integrated car terminals, portable digital TV sets and hand-held portable convergence terminals. Interoperability with integrated cellular radios is also considered. This second edition cancels and replaces the first edition, published in 2005 and constitutes a technical revision. The main changes with respect to the previous edition are:<br/>
    - DVB-H has been included as a part of the main specification;<br/>
    - All the performance figures have bee revised as new simulation results have been made available as well as new reference receivers for DVB-H have been developed;<br/>
    - DVB-H now includes all the different MPE-FEC code rates;<br/>
    - New portable indoor and portable outdoor channel models have been included as well as performance figures for those;<br/>
    - A new 2x TU-6 mobile SFN test channel has been included;<br/>
    - A new L4 linearity pattern has been added;<br/>
    - Dedicated performance figures for DVB-H for S1, S2, L1 to L4 interference patterns have been included;<br/>
    - A new GSM-interference measurement method has been added. The contents of the corrigendum of July 2008 have been included in this copy.<br/>
    The content of the corrigendum 1 (2008-07) has been included in this copy.
- language: fr
  script: Latn
  content: |-
    L'IEC 62002-1:2008 est une spécification d'accès radio pour les dispositifs mobiles, portables et portatifs capables de recevoir des services DVB-T/H. Elle inclut des aspects informatifs relatifs au système, ainsi que des spécifications relatives aux performances RF minimales. Elle couvre les terminaux de trois catégories principales, à savoir les terminaux intégrés aux véhicules automobiles, les téléviseurs numériques portables et les terminaux convergents portatifs. L'interopérabilité avec les radios cellulaires intégrées est également prise en considération. La spécification couvre les domaines suivants.<br/>
    - Plages de fréquences<br/>
    - Modes pris en charge<br/>
    - Définition des conditions de réception<br/>
    - Définition du modèle de référence RF du récepteur<br/>
    - Définition des critères de dégradation<br/>
    - Caractéristiques de l'antenne<br/>
    - Modèles de canaux<br/>
    - Performances C/N avec différents canaux<br/>
    - Niveaux d'entrée minimal et maximal<br/>
    - Immunité aux signaux brouilleurs<br/>
    - Définition d'un ensemble de types d'interférences<br/>
    - Tolérance au brouillage impulsif<br/>
    - Performances SFN<br/>
    - Performances minimales de l'émetteur<br/>
    - Interopérabilité des radios cellulaires<br/>
    - Aspects CEM<br/>
    L'IEC 62002-1:2008 annule et remplace la première édition parue en 2005. Elle constitue une révision technique.<br/>
    Les principales modifications par rapport à l'édition précédente sont indiquées ci-dessous.<br/>
    Le DVB-H a été intégré dans la spécification principale.<br/>
    Tous les chiffres relatifs aux performances ont été révisés pour tenir compte des nouveaux résultats de simulation et du développement de nouveaux récepteurs de référence DVB-H.<br/>
    Le DVB-H inclut à présent l'ensemble des différents débits de code MPE-FEC.<br/>
    De nouveaux types de canaux de propagation "portable en intérieur" et "portable en extérieur" ont été ajoutés ainsi que les performances chiffrées avec ces canaux.<br/>
    Un nouveau canal d'essai SFN mobile 2x TU-6 a été inclus.<br/>
    Un nouveau type de linéarité L4 a été ajouté.<br/>
    De nouveaux chiffres qui décrivent les performances particulières du DVB-H pour les types d'interférences S1, S2, L1 à L4 ont été intégrés.<br/>
    Une nouvelle méthode de mesure des interférences GSM a été ajoutée.<br/>
    Le contenu du corrigendum 1 (2008-07) a été pris en considération dans cet exemplaire.
