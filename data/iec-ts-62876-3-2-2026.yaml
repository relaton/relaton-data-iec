abstract:
- language: en
  script: Latn
  content: "IEC TS 62876-3-2:2026 which is a Technical Specification, establishes
    a standardized method to determine<br />\r\n• volume fraction<br />\r\nfor graphene
    by<br />\r\n• ellipsometry.<br />\r\nThickness/composition measurements are evaluated
    by ellipsometry before and after the stability test. By model calculation, the
    volume fraction of graphene can be evaluated. Since the test method is non‑destructive,
    it can be used to assess the reliability and durability of graphene films on production
    lines.<br />\r\n• For graphene-capped copper for Cu interconnects in a semiconductor
    engineering, for example, the reliability and durability of the capping layer
    are evaluated.<br />\r\n• Gas sensors, gas barriers, transparent electrodes for
    solar cells, etc. are being researched and developed.<br />\r\n• This method is
    useful for non-destructive and quantitative evaluation of the volume fraction
    of graphene to assess the reliability and durability."
