abstract:
- language: en
  script: Latn
  content: |-
    IEC 60335-2-101:2024 deals with the safety of electric vaporizers for household and similar use, their rated voltage being not more than 250 V including direct current (DC) supplied appliances and battery-operated appliances.<br/>
    Examples of appliances that are within the scope of this standard are:<br/>
    - air fresheners;<br/>
    - insect repellers.<br/>
    They can be plugged directly into a socket-outlet or connected to the supply mains by means of a flexible cord and plug.<br/>
    Appliances not intended for normal household use but which nevertheless can be a source of danger to the public, such as appliances intended to be used by laypersons in shops, in light industry and on farms, are within the scope of this standard.<br/>
    As far as is practicable, this standard deals with the common hazards presented by appliances that are encountered by all persons in and around the home. However, in general, it does not take into account<br/>
    - persons (including children) whose physical, sensory or mental capabilities; or lack of experience and knowledge prevents them from using the appliance safely without supervision or instruction;<br/>
    - children playing with the appliance.<br/>
    Attention is drawn to the fact that<br/>
    - for appliances to be used in vehicles or on board ships or aircraft, additional requirements can be necessary;<br/>
    - in many countries additional requirements are specified by the national health authorities, the national authorities responsible for the protection of labour, and similar authorities.<br/>
    This standard does not apply to<br/>
    - appliances intended exclusively for industrial purposes;<br/>
    - appliances intended to be used in locations where special conditions prevail, such as the presence of corrosive or explosive atmosphere (dust, vapour or gas);<br/>
    - appliances for heating liquids (IEC 60335-2-15);<br/>
    - insect killers (IEC 60335-2-59);<br/>
    - fabric steamers (IEC 60335-2-85);<br/>
    - humidifiers (IEC 60335-2-98).<br/>
    This second edition cancels and replaces the first edition published in 2002, Amendment 1:2008 and Amendment 2:2014. This edition constitutes a technical revision.<br/>
    This edition includes the following significant technical changes with respect to the previous edition:<br/>
    a) alignment with IEC 60335-1:2020;<br/>
    b) conversion of some notes to normative text (Clause 1, 7.1);<br/>
    c) application of test probe 19 has been introduced (8.1.1, 8.1.3, 20.2, B.22.3, B.22.4);<br/>
    d) addition of external accessible surface temperatures (Clause 11).<br/>
    This part 2 is to be used in conjunction with the latest edition of IEC 60335-1 and its amendments unless that edition precludes it; in that case, the latest edition that does not preclude it is used. It was established on the basis of the sixth edition (2020) of that standard.
- language: fr
  script: Latn
  content: |-
    L’IEC 60335-2-101:2024 traite de la sécurité des vaporisateurs électriques pour usages domestiques et analogues dont la tension assignée est inférieure ou égale à 250 V, y compris les appareils alimentés en courant continu et les appareils alimentés par batteries.<br/>
    Exemples d’appareils relevant du domaine d’application de la présente norme:<br/>
    - diffuseurs;<br/>
    - appareils insectifuges.<br/>
    Ils peuvent être branchés directement dans un socle de prise de courant ou raccordés au réseau d’alimentation au moyen d’un câble souple et d’une fiche de prise de courant.<br/>
    Les appareils non destinés à un usage domestique normal mais qui peuvent néanmoins constituer une source de danger pour le public, par exemple les appareils destinés à être utilisés par des utilisateurs non avertis dans des magasins, chez des artisans et dans des fermes, relèvent du domaine d’application de la présente norme.<br/>
    Dans la mesure du possible, la présente norme traite des dangers courants que présentent les appareils et auxquels sont exposés tous les individus à l’intérieur et autour de l’habitation. Cependant, elle ne tient en général pas compte<br/>
    - des personnes (y compris des enfants) dont les capacités physiques, sensorielles ou mentales; ou le manque d’expérience et de connaissance les empêchent d’utiliser l’appareil en toute sécurité sans surveillance ou instruction;<br/>
    - de l’utilisation de l’appareil comme jouet par des enfants.<br/>
    L’attention est attirée sur le fait que<br/>
    - pour les appareils utilisés dans des véhicules ou à bord de navires ou d’avions, des exigences supplémentaires peuvent être nécessaires;<br/>
    - dans de nombreux pays, des exigences supplémentaires sont spécifiées par les organismes nationaux de la santé, par les organismes nationaux responsables de la protection des travailleurs et par des organismes similaires.<br/>
    La présente norme ne s’applique pas:<br/>
    - aux appareils prévus exclusivement pour des usages industriels;<br/>
    - aux appareils destinés à être utilisés dans des locaux qui présentent des conditions particulières, telles que la présence d’une atmosphère corrosive ou explosive (poussière, vapeur ou gaz);<br/>
    - aux appareils de chauffage des liquides (IEC 60335-2-15);<br/>
    - aux destructeurs d’insectes (IEC 60335-2-59);<br/>
    - aux appareils à vapeur pour tissus (IEC 60335-2-85);<br/>
    - aux humidificateurs (IEC 60335-2-98).<br/>
    Cette deuxième édition annule et remplace la première édition parue en 2002, son Amendement 1:2008 et son Amendement 2:2014. La présente édition constitue une révision technique.<br/>
    Cette édition inclut les modifications techniques majeures suivantes par rapport à l’édition précédente:<br/>
    a) alignement sur l’IEC 60335-1:2020;<br/>
    b) transformation de certaines notes en texte normatif (Article 1, 7.1);<br/>
    c) introduction de l’application du calibre d’essai 19 (8.1.1, 8.1.3, 20.2, B.22.3, B.22.4);<br/>
    d) ajout d’exigences relatives aux températures des surfaces accessibles extérieures (Article 11).<br/>
    La présente Partie 2 doit être utilisée conjointement avec la dernière édition de l’IEC 60335-1 et ses amendements sauf si cette édition l’exclut; dans ce cas, la dernière édition qui n’exclut pas la présente Partie 2 est utilisée. Elle a été établie sur la base de la sixième édition (2020) de cette norme.
