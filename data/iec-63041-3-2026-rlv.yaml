abstract:
- language: en
  script: Latn
  content: |-
    IEC 63041-3:2026 RLV contains both the official IEC International Standard and its Redline version. The Redline version is available in English only and provides you with a quick and easy way to compare all the changes between the official IEC Standard and its previous edition.<br/>
    <br/>
    IEC 63041-3:2026 is applicable to piezoelectric physical sensors mainly used in the field of process control, wireless monitoring, dynamics, thermodynamics, vacuum engineering, and environmental sciences. This document provides users with technical guidelines as well as basic knowledge of common physical sensors. Piezoelectric sensors covered herein are those applied to the detection and measurement of physical quantities such as force, pressure, torque, viscosity, temperature, film thickness, acceleration, vibration, and tilt angle.<br/>
    This edition includes the following significant technical changes with respect to the previous edition:<br/>
    a) Some terms in Clause 3 have been updated to be consistent with IEC TS 61994-5:2023.
