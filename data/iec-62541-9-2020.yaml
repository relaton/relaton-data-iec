abstract:
- language: en
  script: Latn
  content: |-
    IEC 62541-9:2020 specifies the representation of Alarms and Conditions in the OPC Unified Architecture. Included is the Information Model representation of Alarms and Conditions in the OPC UA address space. Other aspects of alarm systems such as alarm philosophy, life cycle, alarm response times, alarm types and many other details are captured in documents such as IEC 62682 and ISA 18.2. The Alarms and Conditions Information Model in this specification is designed in accordance with IEC 62682 and ISA 18.2.<br/>
    This third edition cancels and replaces the second edition published in 2015. This edition constitutes a technical revision.<br/>
    This edition includes the following significant technical changes with respect to the previous edition:<br/>
    a) added optional engineering units to the definition of RateOfChange alarms;<br/>
    b) to fulfill the IEC 62682 model, the following elements have been added:<br/>
    - AlarmConditionType States: Suppression, Silence, OutOfService, Latched;<br/>
    - AlarmConditionType Properties: OnDelay, OffDelay, FirstInGroup, ReAlarmTime;<br/>
    - New alarm types: DiscrepencyAlarm, DeviationAlarm, InstrumentDiagnosticAlarm, SystemDiagnosticAlarm.<br/>
    c) added Annex that specifies how the concepts of this OPC UA part maps to IEC 62682 and ISA 18.2;<br/>
    d) added new ConditionClasses: Safety, HighlyManaged, Statistical, Testing, Training;<br/>
    e) added CertificateExpiration AlarmType;<br/>
    f) added Alarm Metrics model.
- language: fr
  script: Latn
  content: |-
    L'IEC 62541-9:2020 spécifie la représentation des Alarmes et des Conditions dans l'Architecture unifiée OPC. Il comprend la représentation par le Modèle d'information des Alarmes et des Conditions dans l'espace d'adressage OPC UA. Les autres aspects des systèmes d'alarme tels que la philosophie d'alarme, le cycle de vie, le temps de réponse de l'alarme, les types d'alarmes et de nombreux autres détails figurent dans des documents tels que l'IEC 62682 et l'ISA 18.2. Le Modèle d'information sur les Alarmes et les Conditions de la présente spécification est conçu conformément à l'IEC 62682 et à l'ISA 18.2. Cette troisième édition annule et remplace la deuxième édition parue en 2015. Cette édition constitue une révision technique. Cette édition inclut les modifications techniques majeures suivantes par rapport à l'édition précédente:<br/>
    a) des unités techniques facultatives ont été ajoutées à la définition des alarmes RateOfChange;<br/>
    b) afin de respecter le modèle IEC 62682, les éléments suivants ont été ajoutés:<br/>
    - états d'AlarmConditionType: Suppression, Silence, OutOfService, Latched;<br/>
    - Propriétés d'AlarmConditionType: OnDelay, OffDelay, FirstInGroup, ReAlarmTime;<br/>
    - nouveaux types d'alarmes: DiscrepencyAlarm, DeviationAlarm, InstrumentDiagnosticAlarm, SystemDiagnosticAlarm;<br/>
    c) ajout d'une annexe qui spécifie la manière dont les concepts de cette partie d'OPC UA assurent la correspondance avec l'IEC 62682 et l'ISA 18.2;<br/>
    d) nouvelles ConditionClasses ajoutées: Safety, HighlyManaged, Statistical, Testing, Training;<br/>
    e) ajout de l'AlarmType CertificateExpiration;<br/>
    f) ajout d'un modèle de Mesures d'Alarme.
