abstract:
- language: en
  script: Latn
  content: |-
    CISPR 14-2:2020 specifies the electromagnetic immunity requirements in the frequency range 0 Hz to 400 GHz that apply to appliances, electric tools and similar equipment as specified below, whether powered by AC or DC (including a battery). This document specifies immunity requirements for continuous and transient electromagnetic disturbances, both conducted and radiated. Unless otherwise specified, this document is applicable to all equipment in the scope of CISPR 14-1, namely:<br/>
    - household appliances or similar equipment;<br/>
    - electric tools;<br/>
    - similar equipment;<br/>
    - Refer to the Scope of the document for examples of equipment.<br/>
    Included in the scope of this document are also microwave ovens for domestic use or catering.<br/>
    Equipment which incorporate radio transmit/receive functions are included in the scope of this document. NOTE: For handling cases where equipment under the scope of this document is combined with transmit and/or receive radio functions, see Clause 8.<br/>
    Excluded from the scope of this document are:<br/>
    - equipment for which all electromagnetic immunity requirements are explicitly formulated in other CISPR or IEC standards;<br/>
    - equipment intended to be part of the fixed electrical installation of buildings (e.g. fuses, circuit breakers, cables and switches);<br/>
    - medical electrical equipment, including those in the scope of CISPR 14-1;<br/>
    - equipment used only in industrial environment;<br/>
    - equipment intended to be used exclusively in locations where special electromagnetic conditions exist (e.g. high electromagnetic fields nearby broadcast transmitting stations or high energy pulses nearby power generation stations);<br/>
    - equipment intended to be used exclusively on a vehicle, ship, boat or aircraft;<br/>
    - the effects of electromagnetic phenomena relating to the safety of apparatus (see IEC 60335 series);<br/>
    Also excluded from the scope of this document is AC single-phase equipment with a rated voltage higher than 250 V between phase and neutral and AC multi-phase equipment with rated voltage higher than 480 V. Abnormal operation of the equipment, such as simulated faults in the electric circuitry for testing purposes, is not taken into consideration.<br/>
    This third edition cancels and replaces the second edition published in 2015. This edition constitutes a technical revision. This edition includes the following significant technical changes with respect to the previous edition:<br/>
    a) extension of the frequency range for radiated immunity above 1 GHz;<br/>
    b) an advanced categorisation of equipment;<br/>
    c) revision of general test conditions and addition of new specific test conditions (e.g. for robotic equipment);<br/>
    d) clarification of requirements applicable to equipment incorporating radio functions;<br/>
    e) addition of requirements for wired network ports;<br/>
    f) revision of definitions and addition of new ones;<br/>
    g) delete requirements referring to statistical evaluation.
- language: fr
  script: Latn
  content: |-
    CISPR 14-2:2020 spécifie les exigences d’immunité aux perturbations électromagnétiques dans la plage de fréquences comprise entre 0 Hz et 400 GHz qui s’appliquent aux appareils, outils électriques et appareils analogues définis ci-après, alimentés par un réseau d'alimentation en courant alternatif ou en courant continu (y compris une pile ou un accumulateur). Le présent document spécifie les exigences d’immunité pour les perturbations électromagnétiques continues et transitoires, conduites ou rayonnées. Sauf spécification contraire, le présent<br/>
    document s’applique à tous les équipements qui relèvent du domaine d’application de la CISPR 14-1, à savoir:<br/>
    - les appareils électrodomestiques ou appareils analogues;<br/>
    - les outils électriques;<br/>
    - les appareils analogues;<br/>
    Se référer au domaine d'application pour des exemples d'équipements.<br/>
    Les fours à micro-ondes à usage domestique ou à usage des collectivités relèvent du domaine d’application du présent document. De même, les équipements qui comportent des fonctions d’émission/réception radioélectrique relèvent du domaine d'application du présent document. NOTE: Voir l’Article 8 pour les cas de manutention pour lesquels les équipements qui relèvent du domaine d’application du présent document sont combinés avec les fonctions radiofréquences d’émission et/ou de réception.<br/>
    Sont exclus du domaine d’application du présent document:<br/>
    - les équipements pour lesquels toutes les exigences d’immunité aux perturbations électromagnétiques sont formulées explicitement dans d’autres normes CISPR ou normes IEC;<br/>
    - les équipements destinés à faire partie de l’installation électrique fixe de bâtiments (par exemple, fusibles, disjoncteurs, câbles et interrupteurs);<br/>
    - les équipements électromédicaux, y compris ceux qui relèvent du domaine d’application de la CISPR 14-1;<br/>
    - les équipements utilisés uniquement dans un environnement industriel;<br/>
    - les équipements conçus pour être utilisés exclusivement dans des emplacements dans lesquels existent des conditions électromagnétiques particulières (par exemple, des champs électromagnétiques élevés à proximité de stations de radiodiffusion ou des impulsions énergétiques élevées près de centrales électriques);<br/>
    - les équipements destinés à être utilisés exclusivement dans un véhicule, un navire, un bateau ou un avion;<br/>
    - les effets des phénomènes électromagnétiques liés à la sécurité des appareillages (voir la série IEC 60335);<br/>
    Sont également exclus du domaine d’application du présent document les équipements monophasés en courant alternatif ayant une tension assignée supérieure à 250 V entre phase et neutre et les équipements multiphasés en courant alternatif ayant une tension assignée supérieure à 480 V.<br/>
    Le fonctionnement anormal des équipements, par exemple des défauts simulés dans les circuits électriques à des fins d'essai, n'est pas pris en considération.<br/>
    Cette troisième édition annule et remplace la deuxième édition parue en 2015. Cette édition constitue une révision technique. Cette édition inclut les modifications techniques majeures suivantes par rapport à l'édition précédente:<br/>
    a) extension de la plage de fréquences de l’immunité des perturbations rayonnées supérieures à 1 GHz;<br/>
    b) catégorisation avancée des équipements;<br/>
    c) révision des conditions d’essai générales et ajout de nouvelles conditions d’essai spécifiques (par exemple, pour les équipements robotisés);<br/>
    d) clarification des exigences applicables aux équipements intégrant des fonctions radiofréquences;<br/>
    e) ajout d’exigences concernant les accès de réseaux câblés;<br/>
    f) révision des définitions et ajout de nouvelles définitions;<br/>
    g) suppression des exigences faisant référence à l’évaluation statistique;<br/>
    h) alignement sur la CISPR 14-1.
