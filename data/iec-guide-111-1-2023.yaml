abstract:
- language: en
  script: Latn
  content: "IEC Guide 111-1:2023 is a horizontal publication which gives guidance
    for the harmonization of product and system standards for HV substations (higher
    than 1 kV). It addresses AC equipment which is found in high-voltage (HV) substations
    in most cases.<br/>\nThis document contains recommendations for common specifications
    for all HV substation product and system standards, each of which is augmented
    by the technical background specific to each technical committee, which naturally
    retains freedom in its technical choices.<br/>\nThis document is applicable when
    developing product and systems standards for HV power electronic equipment for
    the AC part of the substation.<br/>\nThis first edition of IEC Guide 111-1, together
    with IEC Guide 111-2, cancels and replaces the second edition of IEC Guide 111
    published in 2004.<br/>\nThe main changes with respect to the previous edition
    are as follows:\n\n\tIEC Guide 111 is revised into two parts – Part 1 for AC and
    Part 2 for DC (Part 2 to be prepared);\n\tthe scope of the document has been expanded
    to cover electric equipment in AC high-voltage substations;\n\tnew definitions
    have been included;\n\tnormal conditions have been revised;\n\ta general revision
    of other clauses.\n"
- language: fr
  script: Latn
  content: "L'IEC Guide 111-1:2023 est une publication horizontale qui fournit des
    recommandations pour l'harmonisation des normes de produits et de réseaux relatives
    aux postes HT (de tension supérieure à 1 kV). Elle traite des matériels en courant
    alternatif qui équipent essentiellement les postes haute tension (HT).<br/>\nLe
    présent document contient des recommandations pour les spécifications communes
    des normes de produits et de réseaux pour l'ensemble des postes HT; chaque recommandation
    est enrichie par le contexte technique spécifique à chaque comité d'études, qui
    conserve bien entendu toute sa latitude dans ses choix techniques.<br/>\nLe présent
    document est applicable lors de l'élaboration de normes de produits et de réseaux
    pour les matériels électroniques de puissance HT qui sont liés à la partie en
    courant alternatif des postes.<br/>\nLes modifications principales par rapport
    à l'édition précédente sont indiquées ci-dessous:\n\n\tl'IEC Guide 111 a été révisé
    en deux parties – la Partie 1 relative au courant alternatif et la Partie 2 relative
    au courant continu (Partie 2 à élaborer);\n\tle domaine d'application du document
    a été élargi afin d'inclure les matériels électriques utilisés dans les postes
    haute tension en courant alternatif;\n\tde nouvelles définitions ont été ajoutées;\n\tles
    conditions normales ont été révisées;\n\tles autres articles ont fait l'objet
    d'une révision générale.\n"
