abstract:
- language: en
  script: Latn
  content: |-
    IEC 61254:2026 applies to men's electric shavers and their trimmers for household use.<br/>
    This document deals with the methods for evaluating user experience and user satisfaction, in a subjective way, for men's electric shavers and their trimmers with a rated voltage not greater than 250 V.<br/>
    This document does not specify safety or performance requirements.<br/>
    This second edition cancels and replaces the first edition published in 1993. This edition constitutes a technical revision.<br/>
    This edition includes the following significant technical changes with respect to the previous edition:<br/>
    a) change in standard title and scope (Title and Clause 1);<br/>
    b) addition of the definition of user experience and user satisfaction (3.5, 3.6);<br/>
    c) modification of the list of evaluations (Clause 4);<br/>
    d) introduction of evaluation of user satisfaction for a particular electric shaver (Clause 6);<br/>
    e) removal of testing measurement in objective way, such as measuring methods for dimensions, operation time and gravimetric analysis of the difference in closeness of shave;<br/>
    f) modification of questionnaires in Annex A.
- language: fr
  script: Latn
  content: |-
    L'IEC 61254:2026 s'applique aux rasoirs électriques pour hommes et à leurs tondeuses destinés à une utilisation domestique.<br/>
    Le présent document traite des méthodes d'évaluation de l'expérience de l'utilisateur et de la satisfaction de l'utilisateur, de manière subjective, pour les rasoirs électriques pour hommes et leurs tondeuses dont la tension nominale n'est pas supérieure à 250 V.<br/>
    Le présent document ne spécifie pas d'exigences en matière de sécurité ou de performances.<br/>
    Cette deuxième édition annule et remplace la première édition publiée en 1993. Cette édition constitue une révision technique.<br/>
    Cette édition inclut les modifications techniques majeures suivantes par rapport à l'édition précédente:<br/>
    a) modification du titre et du champ d'application de la norme (Domaine d'application et Article 1);<br/>
    b) ajout de la définition de l'expérience et de la satisfaction de l'utilisateur (3.5, 3.6);<br/>
    c) modification de la liste des évaluations (Article 4)<br/>
    d) introduction de l'évaluation de la satisfaction de l'utilisateur pour un rasoir électrique donné (Article 6);<br/>
    e) élimination des mesures de contrôle de manière objective, telles que les méthodes de mesure des dimensions, du temps de fonctionnement et l'analyse gravimétrique de la différence de proximité du rasage;<br/>
    f) modification des questionnaires à l'Annexe A.
