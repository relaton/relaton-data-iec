abstract:
- language: en
  script: Latn
  content: |-
    IEC 61196-1-305:2026 applies to coaxial communication cables. It specifies the test methods to determine solderability and the resistance to soldering of inner and outer conductors of cables used in analogue and digital communication systems.<br/>
    This second edition cancels and replaces the first edition published in 2015. This edition constitutes a technical revision.<br/>
    This edition includes the following significant technical changes with respect to the previous edition:<br/>
    a) 4.1 Preparation of test specimen was added;<br/>
    b) 4.2 Procedure, 4.3 Requirements and 4.4 Test report were revised;<br/>
    c) 4.5 Information to be given in the relevant specification was added;<br/>
    d) 5.1 Preparation of the specimen was added;<br/>
    e) 5.2 Procedure was revised;<br/>
    f) 5.5 Information to be given in the relevant specification was added;<br/>
    g) Figure 1 to Figure 5 were added.
