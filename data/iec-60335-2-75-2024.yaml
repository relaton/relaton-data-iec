abstract:
- language: en
  script: Latn
  content: |-
    IEC 60335-2-75:2024 deals with the safety of electric commercial dispensing appliances and vending machines for preparation or delivery of food, drinks and consumer products, their rated voltage being not more than 250 V for single-phase appliances and 480 V for other appliances including direct current (DC) supplied appliances and battery-operated appliances.<br/>
    Examples of appliances that are within the scope of this standard are:<br/>
    – bulk tea or coffee brewing machines;<br/>
    – cigarette vending machines;<br/>
    – coffee grinders for use in areas open to the public;<br/>
    – commercial liquid heaters;<br/>
    – coffee makers with or without integrated coffee grinder;<br/>
    – coffee makers with cooling systems;<br/>
    – hot and cold beverage vending machines;<br/>
    – hot water dispensers;<br/>
    – ice cream and whipped cream dispensers;<br/>
    – ice dispensers;<br/>
    – newspaper, audio or video tape or disc vending machines;<br/>
    – packaged food and drink vending machines;<br/>
    – refrigerated merchandisers;<br/>
    – appliances incorporating electrode-type liquid heaters.<br/>
    Appliances can have more than one function.<br/>
    Other standards can be applicable for some functions such as:<br/>
    – refrigeration (IEC 60335-2-89);<br/>
    – heating by microwaves (IEC 60335-2-90);<br/>
    – professional ice cream makers (IEC 60335-2-118).<br/>
    This standard also deals with the hygiene aspects of appliances.<br/>
    As far as is practicable, this standard deals with the common hazards presented by appliances that are encountered by users and maintenance persons. However, in general, it does not take into account young children playing with the appliance.<br/>
    Attention is drawn to the fact that:<br/>
    – for appliances intended to be used in vehicles or on board ships or aircraft, additional requirements can be necessary;<br/>
    – in many countries, additional requirements for appliances incorporating pressure vessels are specified;<br/>
    – in many countries, additional requirements are specified by the national health authorities, the national authorities responsible for the protection of labour, the national water supply authorities and similar authorities.<br/>
    This standard does not apply to:<br/>
    – appliances intended to be used exclusively for household purposes;<br/>
    – appliances intended to be used exclusively for industrial purposes;<br/>
    – appliances intended to be used in locations where special conditions prevail, such as the presence of a corrosive or explosive atmosphere (dust, vapour or gas);<br/>
    – commercial coffee grinders for use in areas not open to the public (IEC 60335-2-64);<br/>
    – commercial electric boiling pans (IEC 60335-2-47);<br/>
    – commercial electric bains-marie (IEC 60335-2-50);<br/>
    – amusement machines and personal service machines (IEC 60335-2-82);<br/>
    – commercial refrigerating appliances (IEC 60335-2-89);<br/>
    – appliances solely used for dispensing money;<br/>
    – display cabinets;<br/>
    – requirements for dispensed potentially hazardous food (these are covered by national health regulations in many countries).<br/>
    This fourth edition cancels and replaces the third edition published in 2012, Amendment 1:2015 and Amendment 2:2018. This edition constitutes a technical revision.<br/>
    This edition includes the following significant technical changes with respect to the previous edition:<br/>
    a) alignment with IEC 60335-1:2020;<br/>
    b) conversion of some notes to normative text (Clause 1, 7.1, 19.2, 19.101);<br/>
    c) addition of requirements for electrode-type liquid heaters (Clause 1, 3.1.9, 3.6.101, 3.7.103, 13.2, 13.3, 16.2, 16.3, 19.1, 19.103 to 19.106, 22.6, 22.33, 22.115 to 22.118, 24.1.2, 27.1, Annex BB);<br/>
    d) addition of test requirements for appliances with a recommended ambient temperature above 25 °C (5.7);<br/>
    e) application of test probes 18 and 19 (8.1.1, 20.2, 22.101, B.22.3, B.22.4);<br/>
    f) addition of accessible surface temperature limits including marking of hot surfaces (7.1, 7.6, 7.12, 7.14, 7.15, 11.3, 11.8);<br/>
    g) addition of requirements to prevent simultaneous operation of multiple loads (22.114, Annex R);<br/>
    h) clarification of requirements for thermal cut-outs located in a service area (24.103).<br/>
    This part 2 is to be used in conjunction with the latest edition of IEC 60335-1 and its amendments unless that edition precludes it; in that case, the latest edition that does not preclude it is used. It was established on the basis of the sixth edition (2020) of that standard.
- language: fr
  script: Latn
  content: |-
    L'IEC 60335-2-75:2024 traite de la sécurité des distributeurs commerciaux électriques avec ou sans moyen de paiement, destinés à la préparation et à la distribution d'aliments, de boissons et de produit de consommation, dont la tension assignée est inférieure ou égale à 250 V pour les appareils monophasés et à 480 V pour les autres appareils, y compris les appareils alimentés en courant continu et les appareils alimentés par batteries.<br/>
    La liste suivante répertorie les exemples d'appareils qui relèvent du domaine d'application de la présente norme:<br/>
    – les machines à thé ou à café en vrac;<br/>
    – les distributeurs avec moyen de paiement de cigarettes;<br/>
    – les moulins à café destinés à être utilisés dans des lieux ouverts au public;<br/>
    – les appareils de chauffage des liquides à usage commercial;<br/>
    – les cafetières avec ou sans moulin à café intégré;<br/>
    – les cafetières avec système réfrigérant;<br/>
    – les distributeurs avec moyen de paiement de boissons chaudes ou froides;<br/>
    – les distributeurs d'eau chaude;<br/>
    – les distributeurs de crème glacée ou de crème fouettée;<br/>
    – les distributeurs de glace;<br/>
    – les distributeurs avec moyen de paiement de journaux, de bandes ou disques audio ou vidéo;<br/>
    – les distributeurs avec moyen de paiement de boissons et de nourriture sous emballage;<br/>
    – les présentoirs réfrigérés;<br/>
    – les appareils qui comportent des appareils de chauffage des liquides du type à électrodes.<br/>
    Les appareils peuvent avoir plusieurs fonctions.<br/>
    D'autres normes peuvent s'appliquer pour certaines fonctions telles que:<br/>
    – la réfrigération (IEC 60335-2-89);<br/>
    – le chauffage par micro-ondes (IEC 60335-2-90);<br/>
    – les fabriques de crème glacée à usage professionnel (IEC 60335-2-118).<br/>
    La présente norme traite également des aspects liés à hygiène de ces appareils.<br/>
    Dans la mesure du possible, la présente norme traite des dangers ordinaires présentés par les appareils, encourus par les utilisateurs et les agents d'entretien. Cependant, elle ne tient pas compte en général de l'utilisation des appareils comme jouet par des jeunes enfants.<br/>
    L'attention est attirée sur le fait que:<br/>
    – pour les appareils destinés à être utilisés dans des véhicules ou à bord de navires ou d'avions, des exigences supplémentaires peuvent être nécessaires;<br/>
    – dans de nombreux pays, des exigences supplémentaires sont spécifiées pour les appareils qui comportent des récipients sous pression;<br/>
    – dans de nombreux pays, des exigences supplémentaires sont spécifiées par les organismes nationaux de la santé, par les organismes nationaux responsables de la protection des travailleurs, par les organismes nationaux responsables de l'alimentation en eau et par des organismes similaires.<br/>
    La présente norme ne s'applique pas:<br/>
    – aux appareils prévus exclusivement pour des usages domestiques;<br/>
    – aux appareils prévus exclusivement pour des usages industriels;<br/>
    – aux appareils destinés à être utilisés dans des locaux qui présentent des conditions particulières, telles que la présence d'une atmosphère corrosive ou explosive (poussière, vapeur ou gaz);<br/>
    – aux moulins à café à usage commercial destinés à être utilisés dans des lieux non ouverts au public (IEC 60335-2-64);<br/>
    – aux marmites électriques à usage commercial (IEC 60335-2-47);<br/>
    – aux bains-marie électriques à usage commercial (IEC 60335-2-50);<br/>
    – aux machines de service et machines de divertissement (IEC 60335-2-82);<br/>
    – aux appareils de fabrication de glaces à usage commercial (IEC 60335-2-89);<br/>
    – aux appareils utilisés uniquement pour distribuer de l'argent;<br/>
    – aux meubles d'exposition;<br/>
    – aux exigences pour les distributeurs de denrées alimentaires potentiellement dangereuses (celles-ci sont couvertes par des réglementations sanitaires nationales dans de nombreux pays).<br/>
    Cette quatrième édition annule et remplace la troisième édition parue en 2012, l'Amendement 1:2015 et l'Amendement 2:2018. Cette édition constitue une révision technique.<br/>
    Cette édition inclut les modifications techniques majeures suivantes par rapport à l'édition précédente:<br/>
    a) alignement du texte sur l'IEC 60335-1:2020;<br/>
    b) certaines notes ont été converties en texte normatif (Article 1, 7.1, 19.2, 19.101);<br/>
    c) ajout d'exigences pour les appareils de chauffage des liquides du type à électrodes (Article 1, 3.1.9, 3.6.101, 3.7.103, 13.2, 13.3, 16.2, 16.3, 19.1, 19.103 à 19.106, 22.6, 22.33, 22.115 à 22.118, 24.1.2, 27.1, Annexe BB);<br/>
    d) ajout d'exigences d'essai pour les appareils dont la température ambiante recommandée est supérieure à 25 °C (5.7);<br/>
    e) application des calibres d'essai 18 et 19 (8.1.1, 20.2, 22.101, B.22.3, B.22.4);<br/>
    f) ajout de limites de température pour les surfaces accessibles, y compris le marquage des surfaces chaudes (7.1, 7.6, 7.12, 7.14, 7.15, 11.3, 11.8);<br/>
    g) ajout d'exigences pour empêcher le fonctionnement simultané de plusieurs charges (22.114, Annexe R);<br/>
    h) clarification des exigences applicables aux coupe-circuit thermiques situés dans une zone de service (24.103).<br/>
    La présente partie 2 doit être utilisée conjointement avec la dernière édition de l'IEC 60335-1 et ses amendements sauf si cette édition l'exclut. Dans ce cas, la dernière édition qui n'exclut pas la présente partie 2 est utilisée. Elle a été établie sur la base de la sixième édition (2020) de cette norme.
