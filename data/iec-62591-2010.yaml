abstract:
- language: en
  script: Latn
  content: |-
    IEC 62591:2010 specifies an additional Type 20 communication network to IEC 61158-5-20, IEC 61158-6-20 and a Communication Profile CP 9/2 in addition to IEC 61784-1 CPF 9. This standard specifies the following:<br/>
    - Physical layer service definition and protocol specification,<br/>
    - Data-link layer service and protocol,<br/>
    - Application layer service and protocol,<br/>
    - Network management,<br/>
    - Security,<br/>
    - Communication profile,<br/>
    - Wireless procedures and Gateway. It cancels and replaces IEC/PAS 62591 published in 2009. This first edition constitutes a technical revision. The French version of this standard has not been voted upon. This bilingual version, published in 2011-07, corresponds to the English version.
- language: fr
  script: Latn
  content: |-
    La CEI 62591:2010 spécifie un réseau de communication type 20 supplémentaire en ajout à la IEC 61158-5-20 et à la IEC 61158-6-20 ainsi qu'un Profil de communication CP 9/2 en ajout à la famille de profils de communications CPF 9 de la IEC 61784-1. La présente norme spécifie ce qui suit:<br/>
    - Définition de service de la couche physique et spécification de protocole,<br/>
    - Service et protocole de la couche liaison de données,<br/>
    - Service et protocole de la couche application,<br/>
    - Gestion de réseau,<br/>
    - Sécurité,<br/>
    - Profil de communication,<br/>
    - Procédures sans fil et Passerelle. Elle annule et remplace le IEC/PAS 62591 publiée en 2009. Cette première édition constitue une révision technique. La présente version bilingue, publiée en 2011-07 correspond à la version anglaise. La version française de cette norme n'a pas été soumise au vote.
