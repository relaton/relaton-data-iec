abstract:
- language: en
  script: Latn
  content: "<p>This document provides a metamodel to describe the structure and semantics
    of an implemented form devoid of any specific, domain semantics, e.g. in healthcare,
    social science, e-government and e-business, or representation format so that
    data can be faithfully exchanged between systems and system components, and associations
    expressed between sets of form designs whose data can be compared, joined or composed
    for analysis.</p>"
