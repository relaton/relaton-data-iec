abstract:
- language: en
  script: Latn
  content: |-
    IEC 60335-2-97:2023 deals with the safety of electric drives for shutters, blinds and awnings, intended for household and similar purposes, their rated voltage being not more than 250 V for single-phase drives and 480 V for other drives, including direct current (DC) supplied appliances and battery-operated appliances.<br/>
    Examples of equipment that can be driven are<br/>
    – spring controlled folding arm awnings;<br/>
    – curtains;<br/>
    – grilles covering doors and windows;<br/>
    – projection screens;<br/>
    – shutters covering doors and windows;<br/>
    – draperies.<br/>
    Drives can be supplied with a driven part.<br/>
    Drives not intended for normal household use but that nevertheless can be a source of danger to the public, such as drives intended to be used by laymen in shops, in light industry, on farms and on industrial premises, are within the scope of this standard.<br/>
    As far as is practicable, this standard deals with the common hazards presented by drives that are encountered by all persons in and around the home. However, in general, it does not take into account<br/>
    – persons (including children) whose physical, sensory or mental capabilities; or lack of experience and knowledge prevents them from using the drive safely without supervision or instruction;<br/>
    – children playing with the drive.<br/>
    For appliances intended to be used in vehicles or on board ships or aircraft, additional requirements can be necessary. In many countries, additional requirements are specified by the national health authorities, the national authorities responsible for the protection of labour, the national water supply authorities and similar authorities.<br/>
    This standard does not apply to<br/>
    – drives intended to be used in locations where special conditions prevail, such as the presence of a corrosive or explosive atmosphere (dust, vapour or gas);<br/>
    – drives for vertically moving garage doors for residential use (IEC 60335-2-95);<br/>
    – drives for gates, doors and windows (IEC 60335-2-103);<br/>
    – drives used in premises such as hangars or in heavy industry;<br/>
    – drives for theatre curtains.<br/>
    This fourth edition cancels and replaces the third edition published in 2016 and Amendment 1: 2019. This edition constitutes a technical revision.<br/>
    This edition includes the following significant technical changes with respect to the previous edition:<br/>
    a) the text has been aligned with IEC 60335-1:2020;<br/>
    b) scope includes DC-supplied appliances and battery-operated appliances (Clause 1);<br/>
    c) some notes have been converted to normative text (Clause 1, 5.10, 20.101, 20.103);<br/>
    d) use of artificial loads is introduced (5.10);<br/>
    e) application of test probe 19 has been introduced (8.1.1, 20.2);<br/>
    f) addition of surface temperatures for external accessible surfaces (11.3, 11.8);<br/>
    g) requirements are added for drives intended for permanent connection delivered with a connector to ease the installation (22.102, 24.1.101, 25.3);<br/>
    h) clarification for connectors that are non-detachable once engaged (24.1.5).<br/>
    i) added requirements for instructions for parts of class III construction supplied from a detachable power supply part (7.12, 7.12.1).<br/>
    This part 2 is to be used in conjunction with the latest edition of IEC 60335-1 and its amendments unless that edition precludes it; in that case, the latest edition that does not preclude it is used. It was established on the basis of the sixth edition (2020) of that standard.
- language: fr
  script: Latn
  content: |-
    L'IEC 60335-2-97:2023 traite de la sécurité des motorisations électriques pour les volets, les rideaux et les stores pour usage domestique et analogue, dont la tension assignée est inférieure ou égale à 250 V pour les motorisations monophasées et à 480 V pour les autres motorisations, y compris les appareils alimentés en courant continu et les appareils alimentés par batteries.<br/>
    Des exemples d'équipements qui peuvent être motorisés sont:<br/>
    – les stores bannes à ressorts;<br/>
    – les rideaux;<br/>
    – les grilles qui protègent les portes et les fenêtres;<br/>
    – les écrans de projection;<br/>
    – les volets qui protègent les portes et les fenêtres;<br/>
    – les draperies.<br/>
    Des exemples sont représentés à la Figure 101.<br/>
    Les motorisations peuvent être livrées avec une partie entraînée.<br/>
    Les motorisations qui ne sont pas destinées à un usage domestique normal, mais qui néanmoins peuvent constituer une source de danger pour le public, telle que les motorisations destinées à être utilisées par des utilisateurs non avertis dans des magasins, chez des artisans, dans des fermes et dans des locaux industriels, sont comprises dans le domaine d'application de la présente norme.<br/>
    Dans la mesure du possible, la présente norme traite des dangers ordinaires présentés par les motorisations, encourus par toutes les personnes à l'intérieur et autour de l'habitation. Cependant, elle ne tient pas compte en général<br/>
    – des personnes (y compris des enfants) dont les capacités physiques, sensorielles ou mentales; ou le manque d'expérience et de connaissance les empêchent d'utiliser la motorisation en toute sécurité sans surveillance ou instruction;<br/>
    – de l'utilisation de la motorisation comme jouet par des enfants.<br/>
    Pour les appareils destinés à être utilisés dans des véhicules ou à bord de navires ou d'avions, des exigences supplémentaires peuvent être nécessaires. Dans de nombreux pays, des exigences supplémentaires sont spécifiées par les organismes nationaux de la santé, par les organismes nationaux responsables de la protection des travailleurs, par les organismes nationaux responsables de l'alimentation en eau et par des organismes similaires.<br/>
    La présente norme ne s'applique pas<br/>
    – aux motorisations destinées à être utilisées dans des locaux qui présentent des conditions particulières, telles que la présence d'une atmosphère corrosive ou explosive (poussière, vapeur ou gaz);<br/>
    – aux motorisations de portes de garage à ouverture verticale pour usage résidentiel (IEC 60335-2-95);<br/>
    – aux motorisations de portails, portes et fenêtres (IEC 60335-2-103);<br/>
    – aux motorisations utilisées dans des locaux tels que les hangars d'avions ou dans l'industrie lourde;<br/>
    – aux motorisations pour rideaux de théâtres.<br/>
    Cette quatrième édition annule et remplace la troisième édition parue en 2016 et l'Amendement 1:2019. Cette édition constitue une révision technique.<br/>
    Cette édition inclut les modifications techniques majeures suivantes par rapport à l'édition précédente:<br/>
    a) le texte a été aligné sur l'IEC 60335-1:2020;<br/>
    b) le domaine d'application comprend les appareils alimentés en courant continu et les appareils alimentés par batteries (Article 1);<br/>
    c) certaines notes ont été converties en texte normatif (Article 1, 5.10, 20.101, 20.103);<br/>
    d) l'utilisation de charges artificielles a été introduite (5.10);<br/>
    e) l'application du calibre d'essai 19 a été introduite (8.1.1, 20.2);<br/>
    f) des températures de surface ont été ajoutées pour les surfaces accessibles extérieures (11.3, 11.8);<br/>
    g) des exigences ont été ajoutées pour les motorisations destinées à être raccordées de façon permanente livrées avec un connecteur afin de faciliter l'installation (22.102, 24.1.101, 25.3);<br/>
    h) une clarification a été apportée pour les connecteurs qui ne sont pas amovibles lorsqu'ils sont engagés (24.1.5);<br/>
    i) des exigences relatives aux instructions pour les parties de la classe III alimentées par une partie d'alimentation amovible ont été ajoutées (7.12, 7.12.1).<br/>
    La présente partie 2 doit être utilisée conjointement avec la dernière édition de l'IEC 60335-1 et ses amendements sauf si cette édition l'exclut. Dans ce cas, la dernière édition qui n'exclut pas la présente partie 2 est utilisée. Elle a été établie sur la base de la sixième édition (2020) de cette norme.
