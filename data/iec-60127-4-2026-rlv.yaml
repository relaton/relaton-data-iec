abstract:
- language: en
  script: Latn
  content: |-
    IEC 60127-4:2026 RLV contains both the official IEC International Standard and its Redline version. The Redline version is available in English only and provides you with a quick and easy way to compare all the changes between the official IEC Standard and its previous edition.<br/>
    <br/>
    IEC 60127-4:2026 relates to universal modular fuse-links (UMF) for printed circuits and other substrate systems, used for the protection of electric appliances, electronic equipment, and component parts thereof, normally intended to be used indoors. It does not apply to fuse-links for appliances intended to be used under special conditions, such as in a corrosive or explosive atmosphere. These fuses are normally intended to be mounted or replaced only by appropriately skilled persons using specialized equipment. This document applies in addition to the requirements of IEC 60127-1. The objectives of this part of IEC 60127 are as given in IEC 60127-1, with the additional requirement of a degree of non-interchangeability. This fourth edition cancels and replaces the third edition published in 2005, Amendment 1:2008 and Amendment 2:2012. This edition constitutes a technical revision.<br/>
    This edition includes the following significant technical changes with respect to the previous edition:<br/>
    a) align to IEC 60127-1:2023, third edition;<br/>
    b) enhance the rated current of UMFs to 100A and provide the corresponding maximum voltage drop and maximum sustained dissipation;<br/>
    c) modify the figures;<br/>
    d) update the normative references to the latest version.<br/>
    This International Standard is to be used in conjunction with IEC 60127-1:2023
