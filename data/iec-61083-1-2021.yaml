abstract:
- language: en
  script: Latn
  content: |-
    IEC 61083-1:2021 is applicable to digital recorders, including digital oscilloscopes, used for measurements during tests with high impulse voltages and high impulse currents. It specifies the measuring characteristics and calibrations required to meet the measuring uncertainties and procedures specified in IEC 60060-2 and IEC 62475.<br/>
    This document<br/>
    • defines the terms specifically related to digital recorders;<br/>
    • specifies the necessary requirements for such instruments to ensure their compliance with the requirements for high-voltage and high-current impulse tests;<br/>
    • establishes the tests and procedures necessary to demonstrate their compliance;<br/>
    • covers digital recorders that permit access to raw data from permanent or temporary storage;<br/>
    • covers peak meters used for measuring the extreme value of lightning impulses, the peak value of switching or current impulses.<br/>
    It has the status of a horizontal standard in accordance with IEC Guide 108.<br/>
    This horizontal standard is primarily intended for use by technical committees in the preparation of standards in accordance with the principles laid down in IEC Guide 108. One of the responsibilities of a technical committee is, wherever applicable, to make use of horizontal standards in the preparation of its publications. The contents of this horizontal standard will not apply unless specifically referred to or included in the relevant publications.<br/>
    This third edition cancels and replaces the second edition published in 2001. This edition constitutes a technical revision.<br/>
    This edition includes the following significant technical changes with respect to the previous edition:<br/>
    a) Requirements for static integral non-linearity and static differential non-linearity have been removed.<br/>
    b) Requirement for impulse scale factor non-linearity has been added.<br/>
    c) Uncertainty requirements for impulse calibrators have been revised.<br/>
    d) Requirements for peak voltmeter have been revised.
- language: fr
  script: Latn
  content: |-
    IEC 61083-1:2021 s’applique aux enregistreurs numériques, y compris les oscilloscopes numériques, utilisés pour les mesures lors de tests avec des tensions d’impulsion élevées et des courants d’impulsion élevés. Il précise les caractéristiques de mesure et les étalonnages nécessaires pour répondre aux incertitudes et procédures de mesure spécifiées dans la CEI 60060-2 et l’IEC 62475.<br/>
    Ce document<br/>
    • définit les termes spécifiquement liés aux enregistreurs numériques;<br/>
    • précise les exigences nécessaires à ces instruments pour s’assurer qu’ils sont conformes aux exigences relatives aux tests impulsifs à haute tension et à courant élevé;<br/>
    • établit les tests et les procédures nécessaires pour démontrer leur conformité;<br/>
    • couvre les enregistreurs numériques qui permettent l’accès aux données brutes provenant d’un stockage permanent ou temporaire;<br/>
    • couvre les compteurs de pointe utilisés pour mesurer la valeur extrême des impulsions de foudre, la valeur maximale de la commutation ou des impulsions actuelles.<br/>
    Il a le statut d’une norme horizontale conformément au Guide 108 de la CEI.<br/>
    Cette norme horizontale est principalement destinée aux comités techniques dans l’préparation des normes conformément aux principes énoncés dans le Guide 108 de la CEI. L’une des responsabilités d’un comité technique est, le cas échéant, d’utiliser des normes horizontales dans la préparation de ses publications. Le contenu de cette norme horizontale ne s’appliquera pas à moins qu’il ne soit expressément mentionné ou inclus dans les publications pertinentes.<br/>
    Cette troisième édition annule et remplace la deuxième édition publiée en 2001. Cette édition constitue une révision technique.<br/>
    Cette édition comprend les changements techniques importants suivants par rapport à l’édition précédente :<br/>
    a) Les exigences relatives à la non-linéarité intégrale statique et à la non-linéarité différentielle statique ont été supprimées.<br/>
    b) L’exigence de non-linéarité du facteur d’échelle d’impulsion a été ajoutée.<br/>
    c) Les exigences en matière d’incertitude pour les étalonneurs impulsifs ont été révisées.<br/>
    d) Les exigences relatives aux voltmètres de pointe ont été révisées.
