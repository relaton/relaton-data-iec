abstract:
- language: en
  script: Latn
  content: |-
    IEC 61753-1:2018 provides guidance for the drafting of performance standards for all passive fibre optic products. This document defines the tests and severities which form the performance categories or general operating service environments and identifies those tests which are considered to be product specific. Test and severity details are given in Annex A. This second edition cancels and replaces the first edition published in 2007. It constitutes a technical revision. This edition includes the following significant technical changes with respect to the previous edition:<br/>
    a) definitions updated with new products: wall outlets, wall or pole mounted boxes, splices, ODF modules, street cabinets, hardened connectors and field mountable connectors;<br/>
    b) categories U and O are replaced by categories OP and OP+. No mandatory sequence in category OP+. Category OP+ contains the tests from category OP with the addition of only 4 other tests;<br/>
    c) addition of Category I (Industrial);<br/>
    d) temperature ranges added (with the HD suffix to the categories C, OP, OP+ and I) in case passive optical components are placed in a housing together with active electronics (HD stands for “heat dissipation”);<br/>
    e) the height of category A changed from 3 m to ground level (0 m);<br/>
    f) the lower level height of category G environment changed from ground level (0 m) to –1 m below ground level. Upper level remains at 3 m above ground level;<br/>
    g) addition of performance tests, test severities and performance criteria for new products: Wall outlet, wall or pole mounted boxes, mechanical splices, fusion splice protectors, ODF modules, street cabinets, field mountable connectors and hardened optical connectors;<br/>
    h) test severity of "Mating durability" test for connectors in categories C, OP ,OP+ and I is reduced to 200 cycles for connectors with cylindrical ferrules and 50 cycles for connectors with rectangular ferrules;<br/>
    i) test severity of "Change of temperature" test for connectors and passive optical components in category I is reduced from 20 cycles to 12 cycles (harmonized with connectors and components from other categories);<br/>
    j) test severity of "Flexing of strain relief" test for connectors in categories C, OP and OP+ is reduced to 50 cycles;<br/>
    k) test severities of "Assembly and disassembly of fibre optic mechanical splices, fibre management systems and closures" test for all enclosures is reduced to 5 cycles;<br/>
    l) test severities of "Change of temperature" test for all protective housings in categories C, A, G and S is reduced from 20 cycles to 12 cycles (harmonized with connectors and components);<br/>
    m) test severities of "Resistance to solvents and contaminating fluids" test for closures in categories G and S changed – kerosene is removed, diesel oil exposure reduced to 1 h immersion and 24 h drying at room temperature;<br/>
    n) sealing performance criteria of sealed closures for categories G and A are reduced to 20 kPa overpressure.<br/>
    o) the change in attenuation criterion for connectors has changed from peak-to-peak into a +/- deviation from the original value of the transmitted power at the start of the test (harmonized with the change in attenuation criterion for components, splices and protective housings).<br/>
    Keywords: performance standards for all passive fibre optic products<br/>
    The contents of the corrigendum of May 2019 have been included in this copy.
- language: fr
  script: Latn
  content: |-
    L'IEC 61753-1:2018 fournit des recommandations pour la rédaction de normes de qualité de fonctionnement applicables à tous les produits passifs fibroniques. Le présent document définit les essais et les sévérités qui constituent les catégories de qualité de fonctionnement ou les environnements de service ou de fonctionnement général et elle identifie les essais qui sont considérés comme spécifiques à un produit. Les informations détaillées concernant les essais et les sévérités sont données à l’Annexe A. Cette deuxième édition annule et remplace la première édition parue en 2007. Elle constitue une révision technique. Cette édition inclut les modifications techniques majeures suivantes par rapport à l’édition précédente:<br/>
    a) définitions mises à jour avec de nouveaux produits: prises murales, coffrets à montage mural ou sur poteau, épissures, modules ODF, armoires d’environnement urbain, connecteurs renforcés et connexions montables sur le terrain;<br/>
    b) les catégories U et O ont été remplacées par les catégories OP et OP+. Pas de séquence obligatoire dans la catégorie OP+. La catégorie OP+ contient les essais de la catégorie OP avec l’ajout de seulement 4 autres essais;<br/>
    c) ajout de la catégorie I (industriel);<br/>
    d) ajout des plages de température (avec le suffixe HD aux catégories C, OP, OP+ et I) au cas où des composants optiques passifs sont placés dans un boîtier avec des composants électroniques actifs (HD signifie Heat Dissipation, dissipation thermique);<br/>
    e) la hauteur de la catégorie A a été modifiée de 3 m au niveau du sol (0 m);<br/>
    f) la hauteur du niveau inférieur de l’environnement de catégorie G a été modifiée du niveau du sol (0 m) à –1 m en dessous du niveau du sol. Le niveau supérieur reste à 3 m au-dessus du niveau du sol;<br/>
    g) ajout d’essais de performance, de sévérités d’essai et de critères de qualité de fonctionnement pour de nouveaux produits: prises murales, coffrets à montage mural ou sur poteau, épissures mécaniques, protecteurs d’épissures par fusion, modules ODF, armoires d’environnement urbain, connexions montables sur le terrain et connecteurs optiques renforcés;<br/>
    h) la sévérité de l’essai «Durabilité de l’accouplement» pour les connecteurs des catégories C, OP, OP+ et I a été ramenée à 200 cycles pour les connecteurs avec férules cylindriques et à 50 cycles pour les connecteurs avec férules rectangulaires;<br/>
    i) la sévérité de l’essai «Variations de température» pour les connecteurs et les composants optiques passifs de la catégorie I a été ramenée de 20 cycles à 12 cycles (harmonisée avec les connecteurs et les composants d’autres catégories);<br/>
    j) la sévérité de l’essai «Flexion du serre-câble» pour les connecteurs des catégories C, OP et OP+ a été ramenée à 50 cycles;<br/>
    k) les sévérités de l’essai «Montage et démontage des épissures mécaniques fibroniques, des systèmes de gestion des fibres et des boîtiers» pour tous les boîtiers ont été ramenées à 5 cycles;<br/>
    l) les sévérités de l’essai «Variations de température» pour tous les boîtiers de protection des catégories C, A, G et S ont été ramenées de 20 cycles à 12 cycles (harmonisées avec les connecteurs et les composants);<br/>
    m) les sévérités de l’essai «Résistance aux solvants et aux fluides contaminants» pour les boîtiers des catégories G et S ont été modifiées: le kérosène a été supprimé, l’exposition au gasoil a été ramenée à 1 h d’immersion et à 24 h de séchage à température ambiante;<br/>
    n) les critères de performance d’étanchéité des boîtiers étanches pour les catégories G et A ont été ramenés à une surpression de 20 kPa;<br/>
    o) le critère de variations de l’affaiblissement pour les connecteurs a été modifié de crête-à-crête à une divergence +/- par rapport à la valeur d’origine de la puissance transmise au début de l’essai (harmonisée avec les critères de variations de l’affaiblissement pour les composants, épissures et boîtiers de protection).<br/>
    Mots-clés: normes de qualité de fonctionnement applicables à tous les produits passifs fibroniques<br/>
    Le contenu du corrigendum de mai 2019 a été pris en considération dans cet exemplaire.
