abstract:
- language: en
  script: Latn
  content: |-
    IEC 60704-2-1:2026 specifies the determination of airborne acoustical noise of mains operated and cordless dry vacuum cleaners including their accessories and docking stations for household use or under conditions similar to those in households. For wet and dry vacuum cleaners, the dry cleaning function applies. The wet cleaning function is measured in accordance with IEC 60704-2-20. Particular requirements for floor cleaning robots are specified in IEC 60704-2-17 . This document describes the determination of the noise emission of dry vacuum cleaners under normal operating conditions on carpet and hard floor in accordance with IEC 62885-2. This fifth edition cancels and replaces the fourth edition published in 2020. This edition constitutes a technical revision.<br/>
    This edition includes the following significant technical changes with respect to the previous edition:<br/>
    a) alignment with IEC 60704 1:2021;<br/>
    b) addressing consumer relevant testing aspects;<br/>
    c) robustness of standards and closing potential loopholes<br/>
    d) enlarged scope to include noise measurement on docking stations.<br/>
    This document is intended to be used in conjunction with IEC 60704-1:2021, Household and similar electrical appliances - Test code for the determination of airborne acoustical noise - Part 1: General requirements.
- language: fr
  script: Latn
  content: |-
    L'IEC 60704-2-1:2026 spécifie la détermination du bruit aérien des aspirateurs à sec qui fonctionnent sur secteur et des aspirateurs à sec sans cordon, y compris leurs accessoires et les stations d'accueil, destinés à un usage domestique ou dans des conditions analogues à celles des foyers domestiques. Pour les aspirateurs humides et à sec, la fonction de nettoyage à sec s'applique. La fonction de nettoyage avec de l'eau est mesurée conformément à l'IEC 60704-2-20. Les exigences particulières pour les robots de nettoyage humide sont spécifiées dans l'IEC 60704-2-17. Le présent document décrit la méthode utilisée pour déterminer le bruit émis par les aspirateurs à sec qui fonctionnent dans les conditions normales d'utilisation sur tapis et sur sol dur conformément à l'IEC 62885-2. Cette cinquième édition annule et remplace la quatrième édition parue en 2020. Cette édition constitue une révision technique.<br/>
    Cette édition inclut les modifications techniques majeures suivantes par rapport à l'édition précédente:<br/>
    a) alignement sur l'IEC 60704 1:2021;<br/>
    b) traitement des aspects des essais pertinents pour les consommateurs;<br/>
    c) robustesse des normes et élimination des éventuelles failles;<br/>
    d) élargissement du domaine d'application pour inclure le mesurage du bruit sur les stations d'accueil.<br/>
    Le présent document est destiné à être utilisé conjointement avec l'IEC 60704 1:2021, Appareils électrodomestiques et analogues - Code d'essai pour la détermination du bruit aérien - Partie 1: Exigences générales.
