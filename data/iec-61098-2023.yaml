abstract:
- language: en
  script: Latn
  content: |-
    IEC 61098:2023 applies to contamination monitors that include warning assembles and meters used for the monitoring of radioactive contamination on the surface of personnel whether they be clothed or not. The document is applicable only to that type of equipment where the user stays at the monitor. This document is applicable to the monitoring of the whole body (including the head), hands and feet, but parts of this document can be used for monitors designed for the monitoring of radioactive contamination on the hands and/or feet only. This document does not include tritium measurement.<br/>
    This third edition cancels and replaces the second edition published in 2003. This edition includes the following significant technical changes with respect to the previous edition:<br/>
    a. Title is modified.<br/>
    b. As an alternative of small area sources, area sources are added to be used for methods of test with respect to the variation of response with source position, effective instrument efficiency, detection limit (DL), and variation of response with energy.<br/>
    c. Detection limit (DL) complies with the ISO 11929 series.<br/>
    d. Descriptions of influence quantities of type F and type S are added.<br/>
    e. Consistency with IEC 62706 is promoted for environmental requirements, mechanical requirements, electromagnetic compatibility and methods of test.<br/>
    f. Descriptions of overhead detectors are added.<br/>
    g. Descriptions of friskers are added with respect to the hand and foot monitoring.<br/>
    h. Figures are made easier to understand the relation between the detector position and the response, and the positional relation between the detector surface and the source.
- language: fr
  script: Latn
  content: "IEC 61098:2023 s'applique aux moniteurs qui comprennent des ensembles
    de prévention et appareils de mesure utilisés pour la surveillance de la contamination
    radioactive en surface des personnels, que ceux-ci soient habillés ou non. Le
    document ne s'applique qu'aux équipements dont les utilisateurs restent au niveau
    du moniteur. Le présent document s'applique à la surveillance du corps entier
    (y compris la tête), des mains et des pieds, mais certaines parties du présent
    document peuvent être utilisées pour des moniteurs conçus uniquement pour la surveillance
    de la contamination radioactive des mains et/ou des pieds.<br/>\nCette troisième
    édition annule et remplace la deuxième édition parue en 2003. Cette édition inclut
    les modifications techniques majeures suivantes par rapport à l'édition précédente:<br/>\na.
    le titre a été modifié;<br/>\nb. en lieu et place des petites sources zonales,
    des sources zonales ont été ajoutées pour les méthodes d'essai concernant les
    variations de la réponse en fonction de la position de la source, le rendement
    réel d'un instrument, la limite de détection (DL, Detection Limit) et la variation
    de la réponse en fonction de l'énergie;<br/>\nc. la limite de détection (DL) est
    conforme à la série ISO 11929;<br/>\nd. les descriptions des grandeurs d'influence
    de type F et de type S ont été ajoutées;<br/>\ne. la cohérence avec l'IEC 62706
    a été améliorée pour les exigences d'environnement, les exigences mécaniques,
    la compatibilité électromagnétique et les méthodes d'essai;<br/>\nf. des descriptions
    de détecteurs aériens ont été ajoutées;<br/>\ng. des descriptions de Friskers
    ont été ajoutées pour la surveillance des mains et des pieds;<br/>\nh. les figures
    ont été simplifiées pour comprendre la relation entre la position du détecteur
    et la réponse, ainsi que la relation de position entre la surface du détecteur
    et la source\n "
