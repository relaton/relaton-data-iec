abstract:
- language: en
  script: Latn
  content: |-
    IEC 62133-1:2026 specifies requirements and tests for the safe operation of portable sealed secondary nickel cells and batteries containing alkaline electrolyte, under intended use and reasonably foreseeable misuse. This second edition cancels and replaces the first edition of IEC 62133-1 published in 2017. It constitutes a technical revision.<br/>
    This edition includes the following significant technical changes with respect to IEC 62133 1:2017:<br/>
    a) removal of the definition "secondary battery";<br/>
    b) removal of the definition "portable battery";<br/>
    c) "removal of the definition "portable cell";<br/>
    d) replacement of the single term "room temperature" with 20 °C ± 5 °C in 7.2.3;<br/>
    e) modification of Figure 1.
- language: fr
  script: Latn
  content: |-
    L'IEC 62133-1:2026 spécifie les exigences et les essais pour le fonctionnement en toute sécurité des accumulateurs portables étanches au nickel contenant un électrolyte alcalin dans des conditions d’utilisations prévues et dans des conditions d’utilisation abusive raisonnablement prévisible. Cette deuxième édition annule et remplace la première édition de l’IEC 62133-1 parue en 2017. Cette édition constitue une révision technique.<br/>
    Cette édition inclut les modifications techniques majeures suivantes par rapport à l’IEC 62133 1:2017:<br/>
    a) suppression de la définition "batterie d’accumulateurs";<br/>
    b) suppression de la définition "batterie portable";<br/>
    c) suppression de la définition "élément portable";<br/>
    d) remplacement du terme unique "température ambiante" par 20 °C ± 5 °C au 7.2.3;<br/>
    e) modification de la Figure 1.
