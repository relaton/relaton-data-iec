abstract:
- language: en
  script: Latn
  content: |-
    IEC 62717:2014+A1:2015+A2:2019 specifies the performance requirements for LED modules, together with the test methods and conditions, required to show compliance with this standard. This first edition cancels and replaces IEC PAS 62717 published in 2011. This edition constitutes a technical revision. This edition includes the following significant technical changes with respect to IEC PAS 62717:<br/>
    - all terms and definitions are aligned with IEC 62504 and relevant documents of CIE. For example, general terms like "rated value" are shifted to IEC 62504.<br/>
    - a statement on the applicability on a population is included.<br/>
    - the normative references are completed and cleaned from standards that are not in use.<br/>
    - with regard to EMC, references to harmonic currents are given.<br/>
    - the change, which has an effect on most parts of the standard, is the split of failure mechanisms into abrupt failures and luminous flux depreciation. Consequently, new terms and definitions, new requirements for lumen maintenance and a complete new structure and contents of Annex C are introduced.<br/>
    - transition from tpmax to tprated is made, with the background that there is not one tpmax, but a choice of tp(rated) values, in combination with lifetime.<br/>
    - places where to mark (product, packaging, data sheets) are changed, and as a consequence of the split of failure mechanisms, new parameters are listed. Further, changes in the endurance test (ramping speed of temperature) are reflected in marking.<br/>
    - the concept of displacement factor instead of power factor is introduced. This led to new definitions, requirements and Annexes E and F.<br/>
    - the requirements on luminous efficacy are changed.<br/>
    - the requirements, associated with the family concept are reviewed.<br/>
    - statistics, based on confidence intervals are removed. This concerns requirements and limits for LED module power and luminous flux and deletion of Annex E.<br/>
    - new requirements for lumen maintenance are introduced.<br/>
    - as part of the endurance test, the maximum light decrease after accelerated operation life test is now fixed.<br/>
    - with regard to the discussion on type test and sample size, the number of pieces in a test sample is drastically reduced, see Table 7.<br/>
    - Annex A on measuring methods is completely restructured and reviewed, for example for ambient temperature and for shortening of stabilisation time when conducting subsequent light output measurements.<br/>
    - for electrical characteristics, the ageing time may be chosen as 500 h.<br/>
    - for photometric data file formats, reference is given to IEC 62722-1.<br/>
    - mistakes in the photometric code (Annex D) are corrected.<br/>
    - Annex G on optimised test duration is removed; instead, an INF sheet shall be published.<br/>
    - from the luminaire standard, a new Annex H on "Test equipment for temperature measurement" is taken over.<br/>
    - finally, the Bibliography is updated.<br/>
    <strong>This consolidated version consists of the first edition (2017), its amendment 1 (2015) and its amendment 2 (2019). Therefore, no need to order amendment in addition to this publication.</strong>
- language: fr
  script: Latn
  content: |-
    L'IEC 62717:2014+A1:2015+A2:2019 spécifie les exigences de performance pour les modules de LED, ainsi que les méthodes et les conditions d'essai, nécessaires pour démontrer la conformité à la présente norme. Cette première édition annule et remplace l'IEC PAS 62717 paru en 2011. Cette édition constitue une révision technique. Cette édition inclut les modifications techniques majeures suivantes par rapport à l'IEC PAS 62717:<br/>
    - tous les termes et définitions sont alignés avec l'IEC 62504 et les documents pertinents de la CIE. Par exemple, les termes généraux comme "valeur nominale" sont décalés par rapport à l'IEC 62504;<br/>
    - une déclaration sur l'applicabilité d'une population est incluse;<br/>
    - les références normatives sont complétées et nettoyées des normes qui ne sont pas en usage;<br/>
    - en ce qui concerne la CEM, les références aux courants harmoniques sont données;<br/>
    - le changement, qui a un effet sur la plupart des parties de la norme, est la scission du mécanisme de défaillance sur les défaillances brutales et la baisse du flux lumineux. Par conséquent, de nouveaux termes et définitions, de nouvelles exigences pour la conservation du flux lumineux, une nouvelle structure complète et le contenu de l'annexe C sont introduits;<br/>
    - la transition de tpmax à tprated est faite, avec le fond qu'il n'y a pas un tpmax, mais un choix de tp (classé) des valeurs, en rapport avec la durée de vie;<br/>
    - les endroits où marquer (produits, emballages, feuilles de données) sont modifiés, en conséquence de la scission des mécanismes de défaillance, de nouveaux paramètres sont répertoriés. En outre, les changements dans l'essai d'endurance (vitesse de montée en température) sont pris en compte dans le marquage;<br/>
    - la notion de facteur de déplacement à la place du facteur de puissance est introduite. Cela a conduit à de nouvelles définitions, des exigences et les Annexes E et F;<br/>
    - les exigences en matière d'efficacité lumineuse sont modifiées;<br/>
    - les exigences associées à la notion de famille sont passés en revue;<br/>
    - les statistiques, basées sur des intervalles de confiance sont supprimés. Cela concerne les exigences et les limites de la puissance du module LED et du flux lumineux ainsi que la suppression de l'Annexe E;<br/>
    - de nouvelles exigences relatives à la conservation du flux lumineux sont introduites;<br/>
    - dans le cadre de l'essai d'endurance, la diminution maximum de lumière après l'essai accéléré de durée de fonctionnement est maintenant corrigée;<br/>
    - en ce qui concerne la discussion sur l'essai de type et la taille de l'échantillon, le nombre de pièces dans un échantillon de test est fortement réduite, voir Tableau 7;<br/>
    - l'Annexe A sur les méthodes de mesure est complètement restructurée et révisée, par exemple pour la température ambiante, raccourcir le temps de stabilisation lors des mesures de sortie de la lumière ultérieures;<br/>
    - pour les caractéristiques électriques, le temps de vieillissement peut être choisi comme 500 h;<br/>
    - pour les formats de fichiers de données photométriques référence est faite à l'IEC 62722-1;<br/>
    - les erreurs dans le code photométrique (Annexe D) sont corrigées;<br/>
    - l'Annexe G de la durée d'essai optimisée est supprimée; à la place, un bulletin INF est publiée;<br/>
    - depuis la norme du luminaire, une nouvelle Annexe H sur "l'équipement d'essai pour la mesure de la température" est prise en charge;<br/>
    - enfin, la bibliographie est mise à jour.<br/>
    <strong>Cette version consolidée comprend la première édition (2014), son amendement 1 (2015) et son amendement 2 (2019). Il n'est donc pas nécessaire de commander l'amendement avec cette publication.</strong>
