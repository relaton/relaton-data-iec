abstract:
- language: en
  script: Latn
  content: |-
    IEC 60127-7:2015 covers requirements for miniature fuse-links for special applications. This part of IEC 60127 is applicable to fuse-links with a rated voltage not exceeding 1 000 V, a rated current not exceeding 20 A and a rated breaking capacity not exceeding 50 kA. It does not apply to fuses completely covered by the subsequent parts of IEC 60269-1. It does not apply to miniature fuse-links for appliances intended to be used under special conditions, such as in corrosive or explosive atmospheres. This part of IEC 60127 applies in addition to the requirements of IEC 60127-1. Miniature fuse-links for special applications are not intended to be replaced by the end-user of an electrical/electronic appliance. The object of this part of IEC 60127 is to establish uniform test methods for miniature fuse-links for special applications, so as to allow verification of the values (for example melting time and breaking capacity values) specified by the manufacturer. This second edition cancels and replaces the first edition published in 2013. This edition includes the following significant technical changes with respect to the previous edition:<br/>
    - defining a test board for surface mount fuse-links, Figure 2;<br/>
    - defining test schedules for homogenous series.<br/>
    <br/>
    This publication is to be read in conjunction with IEC 60127-1:2006. Keywords: fuse-links with a rated voltage not exceeding 1 000 V, a rated current not exceeding 20 A and a rated breaking capacity not exceeding 50 kA.
- language: fr
  script: Latn
  content: |-
    IEC 60127-7:2015 couvre des exigences pour des éléments de remplacement miniatures pour applications spéciales.<br/>
    La présente partie de l'IEC 60127 est applicable aux éléments de remplacement de tension assignée ne dépassant pas 1 000 V, de courant assigné ne dépassant pas 20 A et de pouvoir de coupure assigné ne dépassant pas 50 kA.<br/>
    Elle ne s'applique pas aux coupe-circuit complètement couverts par les autres parties de l'IEC 60269-1.<br/>
    Elle n'est pas applicable aux éléments de remplacement miniatures placés dans des appareils destinés à être employés dans des conditions particulières, comme dans des atmosphères corrosives ou explosives.<br/>
    La présente partie de l'IEC 60127 s'applique en complément des exigences de l'IEC 60127-1.<br/>
    Les éléments de remplacement miniatures pour applications spéciales ne sont pas destinés à être remplacés par l'utilisateur final d'un appareil électronique ou électrique.<br/>
    L’objet de la présente partie de l'IEC 60127 est d'établir des méthodes d'essai uniformes pour des éléments de remplacement miniatures pour applications spéciales, pour permettre de vérifier les valeurs (par exemple la durée de fusion et le pouvoir de coupure) spécifiées par le fabricant.<br/>
    Cette deuxième édition annule et remplace la première édition, parue en 2013.<br/>
    Cette édition inclut les modifications techniques majeures suivantes par rapport à l'édition précédente:<br/>
    - définition d'une carte d'essai pour éléments de remplacement à montage en surface, Figure 2;<br/>
    - définition des programmes d'essai pour les séries homogènes.<br/>
    La présente Norme internationale doit être utilisée conjointement avec l'IEC 60127-1:2006<br/>
    Mots clés: éléments de remplacement de tension assignée ne dépassant pas 1 000 V, courant assigné ne dépassant pas 20 A et de pouvoir de coupure assigné ne dépassant pas 50 kA.
