abstract:
- language: en
  script: Latn
  content: |-
    IEC 62590-2-2:2026 describes functions and working principles, specifies requirements, interfaces, and test methods for controlled converters for DC electric traction power supply systems:<br/>
    – AC/DC converters:<br/>
    • rectifiers,<br/>
    • inverters,<br/>
    • combinations.<br/>
    – DC converters.<br/>
    The purpose of the converters can be a power connection to other power networks or energy storages.<br/>
    The common characteristic of this equipment is the possibility to influence the power flow in the DC electric traction power supply system. The converters can be:<br/>
    – line-commutated;<br/>
    – self-commutated.<br/>
    This document applies to fixed installations of the following electric traction systems:<br/>
    – railway networks,<br/>
    – metropolitan transport networks including metros, tramways, trolleybuses and fully automated transport systems, magnetic levitated transport systems, and electric road systems.
- language: fr
  script: Latn
  content: |-
    IEC 62590-2-2:2026 La présente partie décrit les fonctions et les principes de fonctionnement, spécifie les exigences, les interfaces et les méthodes d'essai des convertisseurs commandés pour les systèmes d'alimentation électrique de traction en courant continu :<br/>
    – Convertisseurs alternatif/continu :<br/>
    • redresseurs,<br/>
    • onduleurs,<br/>
    • dispositifs combinés.<br/>
    – Convertisseurs à courant continu.<br/>
    L'objectif des convertisseurs peut être d'établir une connexion électrique avec d'autres réseaux ou systèmes de stockage de l'énergie.<br/>
    Ces équipements ont comme caractéristique commune la possibilité d'influencer la circulation de la puissance dans le système d'alimentation électrique de traction en courant continu. Les convertisseurs peuvent être :<br/>
    – commutés par le réseau;<br/>
    – autocommutés.<br/>
    Le présent document s'applique aux installations fixes des systèmes de traction électrique suivants :<br/>
    – réseaux ferroviaires,<br/>
    – réseaux de transport métropolitains, y compris métros, tramways, trolleybus et systèmes de transport entièrement automatiques, systèmes de transport à sustentation magnétique et systèmes routiers électriques.<br/>
    Cette première édition annule partiellement et remplace l'IEC 62589 et l'IEC 62590. Cette édition constitue une révision technique.
