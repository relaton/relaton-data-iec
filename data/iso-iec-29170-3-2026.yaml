  content: |-
    <p>This document specifies a subjective image quality assessment methodology that covers a range from good quality up to mathematically lossless.</p>
    <p>This document is applicable to the assessment of distortions due to image coding (i.e. lossy compression) and not necessarily other kinds of distortions (e.g. capture, sensor or rendering artefacts).</p>
