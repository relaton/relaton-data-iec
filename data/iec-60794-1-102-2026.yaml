abstract:
- language: en
  script: Latn
  content: |-
    IEC 60794-1-102:2026 specifies the test procedures used to establish uniform requirements on abrasion resistance for optical fibre cables.<br/>
    This document applies to optical fibre cables for use with telecommunication equipment and devices employing similar techniques, and to cables having a combination of both optical fibres and electrical conductors.<br/>
    Method E2A evaluates the ability of the sheath to resist abrasion; method E2B evaluates the ability of cable markings (include text or graphic markers, and continuous coloured lines on cable) to resist abrasion.<br/>
    This first edition of IEC 60794-1-102 cancels and replaces Method E2 of the first edition of IEC 60794-1-21 published in 2015.<br/>
    This edition includes the following significant technical changes with respect to the previous edition:<br/>
    a) addition of sample surface cleaning requirements;<br/>
    b) addition of the number of tests to be performed for method E2B;<br/>
    c) addition of details to be reported.
- language: fr
  script: Latn
  content: |-
    L'IEC 60794-1-102:2026 spécifie les procédures d'essais utilisées pour établir des exigences uniformes relatives à la résistance à l'abrasion des câbles à fibres optiques.<br/>
    Le présent document s’applique aux câbles à fibres optiques destinés à être utilisés dans les équipements de télécommunications et les dispositifs qui utilisent des techniques analogues, ainsi qu'aux câbles constitués de fibres optiques d'une part et de conducteurs électriques d'autre part.<br/>
    La méthode E2A évalue l'aptitude de la gaine à résister à l'abrasion; la méthode E2B évalue l'aptitude des marquages de câbles (texte, graphique et liseré continu en couleur) à résister à l'abrasion.<br/>
    Cette première édition de l'IEC 60794-1-102 annule et remplace la Méthode E2 de la première édition de l'IEC 60794-1-21 parue en 2015.<br/>
    Cette édition inclut les modifications techniques significatives suivantes par rapport à l'édition précédente:<br/>
    a) ajout d'exigences relatives au nettoyage de la surface de l'échantillon;<br/>
    b) ajout du nombre d'essais à réaliser pour la méthode E2B;<br/>
    c) ajout d'informations détaillées à consigner.
