abstract:
- language: en
  script: Latn
  content: |-
    <p>This document provides a framework for data use in smart cities, based on five dimensions:</p>

    data availability (data are available);
    data quality assurance (data are useful);
    ease of data use (data are easy to use);
    data use security (data are used securely);
    data-enabled innovation (data are used for enabling intelligent applications and services).

    <p>This framework is intended to facilitate effective, sustainable, comprehensive and innovative use of data as citywide strategic resources and assets.</p>
