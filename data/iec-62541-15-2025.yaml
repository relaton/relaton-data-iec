abstract:
- language: en
  script: Latn
  content: |-
    IEC 62541-15:2025 describes a safety communication layer (services and a protocol) for the exchange of SafetyData using IEC 62541 mechanisms. It identifies the principles for functional safety communications defined in IEC 61784‑3 that are relevant for this safety communication layer. This safety communication layer is intended for implementation in safety devices only.<br/>
    NOTE 1 This document targets controller-to-controller communication. However, easy expandability to other use-cases (e.g. OPC UA field level communication) has already been considered in the design of this document.<br/>
    NOTE 2 This document does not cover electrical safety and intrinsic safety aspects. Electrical safety relates to hazards such as electrical shock. Intrinsic safety relates to hazards associated with potentially explosive atmospheres.<br/>
    This document defines mechanisms for the transmission of safety-relevant messages among participants within a network using OPC UA technology in accordance with the requirements of the IEC 61508 series and IEC 61784-3 for functional safety. These mechanisms can be used in various industrial applications such as process control, manufacturing, automation, and machinery.<br/>
    This document provides guidelines for both developers and assessors of compliant devices and systems.<br/>
    NOTE 3 The resulting SIL claim of a system depends on the implementation of this document within the system – implementation of this document in a standard device is not sufficient to qualify it as a safety device.
- language: fr
  script: Latn
  content: |-
    IEC 62541-15:2025 décrit une couche de communication de sécurité (services et protocole) pour l'échange de SafetyData à l'aide des mécanismes de l'IEC 62541. Il identifie les principes qui s'appliquent aux communications de sécurité fonctionnelle définies dans l'IEC 61784‑3, associés à cette couche de communication de sécurité. Cette couche de communication de sécurité est destinée à être mise en œuvre sur les appareils de sécurité uniquement.<br/>
    NOTE 1 Le présent document cible la communication de contrôleur à contrôleur. Cependant, la facilité d'extension à d'autres cas d'utilisation (par exemple, communication au niveau du terrain OPC UA) a déjà été prise en compte dans la conception du présent document.<br/>
    NOTE 2 Le présent document ne traite pas des aspects relatifs à la sécurité électrique et à la sécurité intrinsèque. La sécurité électrique concerne les dangers comme les chocs électriques. La sécurité intrinsèque concerne les dangers associés aux atmosphères explosibles.<br/>
    Le présent document définit les mécanismes de transmission des messages relatifs à la sécurité entre les participants d'un réseau, en utilisant la technologie OPC UA conformément aux exigences de la série IEC 61508 et de l'IEC 61784-3 concernant la sécurité fonctionnelle. Ces mécanismes peuvent être utilisés dans différentes applications industrielles, par exemple la commande de processus, la fabrication, l'automatisation et les machines.<br/>
    Le présent document fournit des lignes directrices aux développeurs, ainsi qu'aux évaluateurs d'appareils et de systèmes conformes.<br/>
    NOTE 3 Le SIL ainsi revendiqué pour un système dépend de la mise en œuvre du présent document au sein du système (la mise en œuvre du présent document dans un appareil normal ne suffit pas à le qualifier d'appareil de sécurité).
