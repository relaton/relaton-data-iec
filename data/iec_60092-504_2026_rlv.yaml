abstract:
- content: "IEC 60092-504:2026 RLV contains both the official IEC International Standard
    and its Redline version. The Redline version is available in English only and
    provides you with a quick and easy way to compare all the changes between the
    official IEC Standard and its previous edition.<br /><br />\r\nIEC 60092-504:2026
    specifies requirements for electrical, electronic and programmable equipment supporting
    essential services intended for automation, control, monitoring, alert, safety
    and protection systems. This fifth edition cancels and replaces the fourth edition
    published in 2016. This edition constitutes a technical revision.<br />\r\nThis
    edition includes the following significant technical changes with respect to the
    previous edition:<br />\r\na) aligned bridge and machinery alert references throughout
    the document;<br />\r\nb) transfer of EMC items to IEC 60533 throughout the document;<br
    />\r\nc) update of power management and energy management (9.5 and 9.6)."
