abstract:
- language: en
  script: Latn
  content: |-
    IEC 63402-2-2:2026 specifies the fundamental aspects of semantic interoperability for the S2 interface and the related data exchange between a CEM and the resource managers within the premises. It provides a technology independent set of data models and interaction patterns in order to enable applications for energy management within the premises. This document does not include:<br/>
    – mappings to concrete data representations (XML, JSON and similar);<br/>
    – mappings to application protocols for the message passing;<br/>
    – security related aspects.<br/>
    This group EE publication is primarily intended to be used as an EE standard for the products mentioned in the scope, but is also intended to be used by TCs in the preparation of publications for products which are included in the boundary mentioned in the scope of this document
- language: fr
  script: Latn
  content: |-
    L'IEC 63402-2-2:2026 spécifie les aspects fondamentaux de l'interopérabilité sémantique de l'interface S2 et l'échange de données connexe entre un CEM et les gestionnaires de ressources à l'intérieur des locaux. Il fournit un ensemble de modèles de données et de modèles d'interaction indépendant de la technologie afin de prévoir des applications de gestion de l'énergie à l'intérieur des locaux. Le présent document n'inclut pas:<br/>
    - les mappings vers les représentations de données concrètes (XML, JSON et apparentés);<br/>
    - les mappings vers des protocoles d'application pour l'envoi de messages;<br/>
    - les aspects relatifs à la sécurité.<br/>
    La présente publication groupée d'efficacité énergétique est principalement destinée à être utilisée comme norme d'efficacité énergétique pour les produits mentionnés dans le domaine d'application, mais elle est également destinée à être utilisée par les CE dans le cadre de l'élaboration de publications concernant les produits compris dans les limites mentionnées dans le domaine d'application du présent document.
