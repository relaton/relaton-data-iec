abstract:
- language: en
  script: Latn
  content: |-
    IEC 61400-25-3:2015 specifies an abstract communication service interface describing the information exchange between a client and a server for:<br/>
    - data access and retrieval,<br/>
    - device control,<br/>
    - event reporting and logging,<br/>
    - self-description of devices (device data dictionary),<br/>
    - data typing and discovery of data types.<br/>
    Main changes with respect to the previous edition consist of:<br/>
    - harmonization with newer editions of IEC 61850 standards;<br/>
    - reduction of overlap between standards and simplification by increased referencing, etc.
- language: fr
  script: Latn
  content: |-
    L'IEC 61400-25-3:2015 spécifie une interface abstraite pour les services de communication qui décrit l'échange d'information entre un client et un serveur pour:<br/>
    - l'accès et la récupération des données,<br/>
    - la commande des dispositifs,<br/>
    - les rapports et journalisations d'événements,<br/>
    - l'autodescription des dispositifs (dictionnaire de données de dispositif),<br/>
    - l'établissement de types de données et la découverte de types de données. Cette nouvelle édition comporte les changements importants suivants par rapport à l'édition précédente:<br/>
    - l'harmonisation avec de nouvelles éditions de la série IEC 61850;<br/>
    - la réduction de l'écart entre les normes et la simplification par un référencement amélioré, etc.
