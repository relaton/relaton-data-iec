abstract:
- content: "IEC 61254:2026 applies to men's electric shavers and their trimmers for
    household use.<br />\r\nThis document deals with the methods for evaluating user
    experience and user satisfaction, in a subjective way, for men's electric shavers
    and their trimmers with a rated voltage not greater than 250 V.<br />\r\nThis
    document does not specify safety or performance requirements.<br />\r\nThis second
    edition cancels and replaces the first edition published in 1993. This edition
    constitutes a technical revision.<br />\r\nThis edition includes the following
    significant technical changes with respect to the previous edition:<br />\r\na)
    change in standard title and scope (Title and Clause 1);<br />\r\nb) addition
    of the definition of user experience and user satisfaction (3.5, 3.6);<br />\r\nc)
    modification of the list of evaluations (Clause 4);<br />\r\nd) introduction of
    evaluation of user satisfaction for a particular electric shaver (Clause 6);<br
    />\r\ne) removal of testing measurement in objective way, such as measuring methods
    for dimensions, operation time and gravimetric analysis of the difference in closeness
    of shave;<br />\r\nf) modification of questionnaires in Annex A."
  language:
  - en
  script:
  - Latn
  format: text/html
- content: "L'IEC 61254:2026 s'applique aux rasoirs électriques pour hommes et à leurs
    tondeuses destinés à une utilisation domestique.<br />\r\nLe présent document
    traite des méthodes d'évaluation de l'expérience de l'utilisateur et de la satisfaction
    de l'utilisateur, de manière subjective, pour les rasoirs électriques pour hommes
    et leurs tondeuses dont la tension nominale n'est pas supérieure à 250 V.<br />\r\nLe
    présent document ne spécifie pas d'exigences en matière de sécurité ou de performances.<br
    />\r\nCette deuxième édition annule et remplace la première édition publiée en
    1993. Cette édition constitue une révision technique.<br />\r\nCette édition inclut
    les modifications techniques majeures suivantes par rapport à l'édition précédente:<br
    />\r\na) modification du titre et du champ d'application de la norme (Domaine
    d'application et Article 1);<br />\r\nb) ajout de la définition de l'expérience
    et de la satisfaction de l'utilisateur (3.5, 3.6);<br />\r\nc) modification de
    la liste des évaluations (Article 4)<br />\r\nd) introduction de l'évaluation
    de la satisfaction de l'utilisateur pour un rasoir électrique donné (Article 6);<br
    />\r\ne) élimination des mesures de contrôle de manière objective, telles que
    les méthodes de mesure des dimensions, du temps de fonctionnement et l'analyse
    gravimétrique de la différence de proximité du rasage;<br />\r\nf) modification
    des questionnaires à l'Annexe A."
