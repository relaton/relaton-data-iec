abstract:
- language: en
  script: Latn
  content: |-
    IEC 62321-13:2026 specifies three techniques for the determination of free Bisphenol A (BPA) in plastics of electrotechnical products.<br/>
    This document describes the use of liquid chromatography–diode array detector (LC-DAD), liquid chromatography mass spectrometry (LC-MS), liquid chromatography tandem mass spectrometry (LC-MS/MS) with these test methods detailed in Annex A and Annex B.<br/>
    These test methods have been evaluated for use with PC, PC/ABS, PP matrices containing free BPA between 20 mg/kg to 500 mg/kg as shown in the Pre-IIS 13 results in Annex C and IIS 13 results in Annex D. The use of these methods for BPA concentration ranges of plastics, other than those specified in Annex C and Annex D, has not been evaluated.<br/>
    WARNING – Persons using this document should be familiar with normal laboratory practice. This document does not purport to address all of the safety problems, if any, associated with its use. It is the responsibility of the user to establish appropriate safety and health practices and to ensure compliance with any national regulatory conditions.
- language: fr
  script: Latn
  content: |-
    L'IEC 62321-13:2026 spécifie trois techniques de détermination du bisphénol A (BPA) libre présent dans des plastiques des produits électrotechniques.<br/>
    Le présent document décrit l'utilisation de la chromatographie en phase liquide avec détecteur à barrettes de diodes (LC-DAD), la chromatographie en phase liquide avec spectrométrie de masse (LC-MS) et la chromatographie en phase liquide avec spectrométrie de masse en tandem (LC-MS/MS) dans le cadre des méthodes d'essai décrites en détail à l'Annexe A et à l'Annexe B.<br/>
    Ces méthodes d'essai ont été évaluées pour une utilisation avec des matrices PC, PC/ABS et PP contenant entre 20 mg/kg et 500 mg/kg de BPA libre, comme cela est indiqué dans les résultats de l'Annexe C relative au Pre-IIS 13 et de l'Annexe D relative à l'IIS 13. L'utilisation de ces méthodes pour des plages de concentration de BPA dans les plastiques, autres que celles spécifiées à l'Annexe C et à l'Annexe D, n'a pas été évaluée.<br/>
    AVERTISSEMENT – Il convient que les personnes qui utilisent le présent document aient une bonne connaissance des pratiques normales de laboratoire. Le présent document ne prétend pas traiter tous les problèmes de sécurité éventuels associés à son utilisation. Il incombe à l'utilisateur de mettre en place les pratiques adéquates en matière de sécurité et de santé, mais aussi d'assurer la conformité aux conditions réglementaires nationales.
