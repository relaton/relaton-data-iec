abstract:
- language: en
  script: Latn
  content: |-
    IEC 62052-41:2022 applies only to newly manufactured multi-energy and/or multi-rate static meters and it applies to their type tests only.<br/>
    This document applies to electricity metering equipment designed to:<br/>
    • measure and control electrical energy on networks with voltage up to 1 000 V AC, or 1 500 V DC;<br/>
    • have all functional elements, including add-on modules, enclosed in, or forming a single meter case with exception of indicating displays;<br/>
    • operate with integrated displays;<br/>
    • operate with detached indicating displays, or without an indicating display;<br/>
    • be installed in a specified matching socket or rack;<br/>
    • optionally, provide additional functions other than those for measurement of electrical energy.<br/>
    Meters designed for operation with Low Power Instrument Transformers (LPITs as defined in the IEC 61869 series) may be tested for compliance with this document and the relevant IEC 62053 series documents only if such meters and their LPITs are tested together as directly connected meters.<br/>
    This document does not apply to:<br/>
    • meters for which the voltage line-to-neutral derived from nominal voltages exceeds 1 000 V AC, or 1 500 V DC;<br/>
    • meters intended for connection with low power instrument transformers (LPITs as defined in the IEC 61869 series of standards) when tested without such transformers;<br/>
    • metering systems comprising multiple devices (except for LPITs) physically remote from one another;<br/>
    • portable meters;<br/>
    • meters used in rolling stock, vehicles, ships and airplanes;<br/>
    • laboratory and meter test equipment;<br/>
    • reference standard meters;<br/>
    • data interfaces to the register of the meter;<br/>
    • matching sockets or racks used for installation of electricity metering equipment.<br/>
    This document does not cover measures for the detection and prevention of fraudulent attempts to compromise a meter’s performance (tampering).
- language: fr
  script: Latn
  content: |-
    IEC 62052-41:2022 s’applique uniquement aux compteurs statiques à tarifs multiples et/ou à énergies multiples nouvellement fabriqués ainsi qu’à leurs essais de type.<br/>
    Le présent document s’applique aux équipements de comptage de l’électricité conçus pour:<br/>
    • le comptage et le pilotage de l’énergie électrique sur les réseaux électriques de tension jusqu’à 1 000 V en courant alternatif ou 1 500 V en courant continu;<br/>
    • avoir tous les éléments fonctionnels, y compris les modules complémentaires, incorporés dans ou formant un boîtier de compteur unique, à l’exception des afficheurs;<br/>
    • fonctionner avec des afficheurs intégrés;<br/>
    • fonctionner avec des afficheurs séparés, ou sans afficheur;<br/>
    • être installés dans une embase ou un rack correspondant spécifié;<br/>
    • de façon facultative, assurer des fonctions autres que celles relatives au comptage de l’énergie électrique.<br/>
    Les compteurs conçus pour fonctionner avec des transformateurs de mesure de faible puissance (LPIT tels que définis dans la série IEC 61869) ne peuvent être soumis à des essais de conformité au présent document et aux documents pertinents de la série IEC 62053 uniquement que si ces compteurs et leurs LPIT sont soumis à l’essai ensemble en tant que compteurs à branchement direct.<br/>
    Le présent document ne s’applique pas:<br/>
    • aux compteurs dont la tension phase-neutre déduite des tensions nominales dépasse 1 000 V en courant alternatif ou 1 500 V en courant continu;<br/>
    • aux compteurs destinés à être connectés à des transformateurs de mesure de faible puissance (LPIT, définis dans la série de normes IEC 61869) lorsqu’ils sont soumis à l’essai sans ces transformateurs;<br/>
    • aux systèmes de comptage comprenant plusieurs appareils (à l’exception des LPIT) physiquement éloignés les uns des autres;<br/>
    • aux compteurs portatifs;<br/>
    • aux compteurs utilisés dans le matériel roulant, les véhicules, les navires et les avions;<br/>
    • aux équipements de laboratoire et d’essai des compteurs;<br/>
    • aux compteurs étalons de référence;<br/>
    • aux interfaces de données avec le registre du compteur;<br/>
    • aux embases ou aux racks correspondants utilisés pour l’installation des équipements de comptage de l’électricité.<br/>
    Le présent document ne couvre pas les mesures de détection et de prévention des tentatives de fraude visant à compromettre les performances du compteur (falsification).
