abstract:
- language: en
  script: Latn
  content: |-
    <p>This document describes a standard operating procedure (SOP) for the curation and quality control of test data, consisting of 3D scanned data and its corresponding label data, for the evaluation of modelling from 3D scanned data.</p>
    <p>This document classifies the main task phases and defines the required tasks in each phase of the 3D scanned and labelled data SOP.</p>
    <p>This document defines essential requirements for test data for evaluating modelling from 3D scanned data and describes how to verify conformance to these requirements.</p>
