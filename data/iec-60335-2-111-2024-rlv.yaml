abstract:
- language: en
  script: Latn
  content: |-
    IEC 60335-2-111:2024 RLV contains both the official IEC International Standard and its Redline version. The Redline version is available in English only and provides you with a quick and easy way to compare all the changes between the official IEC Standard and its previous edition.<br/>
    <br/>
    IEC 60335-2-111:2024 deals with the safety of electric ondol-mattresses for household and similar purposes, their rated voltage being not more than 250 V including direct current (DC) supplied appliances and battery-operated appliances. This standard also applies to control units supplied with the appliance.<br/>
    Appliances not intended for normal household use, but that nevertheless can be a source of danger to the public, such as appliances intended to be used in community spas or by persons in cold ambient temperatures, are within the scope of this standard.<br/>
    As far as is practicable, this standard deals with the common hazards presented by appliances that are encountered by all persons in and around the home. However, in general, it does not take into account:<br/>
    - persons (including children) whose physical, sensory or mental capabilities; or lack of experience and knowledge prevents them from using the appliance safely without supervision or instruction;<br/>
    - children playing with the appliance.<br/>
    This standard does not apply to<br/>
    - appliances intended exclusively for industrial purposes;<br/>
    - appliances intended to be used in locations where special conditions prevail, such as the presence of a corrosive or explosive atmosphere (dust, vapour or gas);<br/>
    - blankets, pads and similar flexible heating appliances (IEC 60335-2-17);<br/>
    - room heaters (IEC 60335-2-30);<br/>
    - water bed heaters (IEC 60335-2-66);<br/>
    - heating appliances for breeding and rearing animals (IEC 60335-2-71);<br/>
    - foot warmers and heating mats (IEC 60335-2-81);<br/>
    - flexible sheet heating elements for room heating (IEC 60335-2-96);<br/>
    - heated carpets and heating units for room heating installed under removable floor coverings (IEC 60335 2 106);<br/>
    - appliances specifically intended for use under medical supervision (IEC 80601-2-35).<br/>
    This second edition cancels and replaces the first edition published in 2015. This edition constitutes a technical revision<br/>
    This edition includes the following significant technical changes with respect to the previous edition:<br/>
    a) alignment with IEC 60335-1:2020;<br/>
    b) conversion of some notes to normative text (Clause 1);<br/>
    c) application of test probe 19 has been introduced (8.1.1, 20.2, B.22.3, B.22.4).<br/>
    This part 2 is to be used in conjunction with the latest edition of IEC 60335-1 and its amendments unless that edition precludes it; in that case, the latest edition that does not preclude it is used. It was established on the basis of the sixth edition (2020) of that standard.
