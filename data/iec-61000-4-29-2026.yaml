abstract:
- language: en
  script: Latn
  content: |-
    IEC 61000-4-29:2026 defines test methods for immunity to voltage dips, short interruptions and voltage variations at the DC input power port of electrical or electronic equipment. This document is applicable to equipment and systems whose DC input power ports are intended to be connected to low voltage DC networks external to the equipment and systems. The object of this document is to establish a common and reproducible basis for testing electrical and electronic equipment when subjected to voltage dips, short interruptions or voltage variations on DC input power ports.<br/>
    This document defines:<br/>
    - the range of test levels;<br/>
    - the test generator;<br/>
    - the test set-up;<br/>
    - the test procedure.<br/>
    The test described hereinafter applies to electrical and electronic equipment and systems. It also applies to modules or subsystems whenever the equipment under test’s (EUT) rated power is greater than the test generator capacity specified in Clause 6. The ripple at the DC input power port is not included in the scope of this document. It is covered by IEC 61000‑4‑17. This document does not specify the tests to be applied to particular apparatus or systems. Its main aim is to give a general basic reference to IEC product committees. These product committees (or users and manufacturers of equipment) remain responsible for the appropriate choice of the tests and the severity level to be applied to their equipment. This second edition cancels and replaces the first edition published in 2000. This edition constitutes a technical revision.<br/>
    This edition includes the following significant technical changes with respect to the previous edition:<br/>
    a) Increase of the output voltage of the test generator to take into account new DC networks voltages;<br/>
    b) provision of tolerances for the duration of the voltage changes;<br/>
    c) limitation of the current when applying short interruptions in low impedance condition;<br/>
    d) general technical clarifications for the specifications of the test generator and their verification;<br/>
    e) clarifications regarding the loads used to verify the switching characteristics and the peak inrush current drive capability of the test generator;<br/>
    f) clarifications regarding the evaluation of test results and test reports;<br/>
    g) description of the DC environment.
- language: fr
  script: Latn
  content: |-
    L'IEC 61000-4-29:2026 définit les méthodes d'essais d'immunité aux creux de tension, aux coupures brèves et aux variations de tension sur les accès d'alimentation d'entrée en courant continu des matériels électriques ou électroniques. Le présent document s'applique aux matériels et systèmes dont les accès d'alimentation d'entrée en courant continu sont destinés à être raccordés à des réseaux à courant continu à basse tension externes aux matériels et systèmes. L'objet du présent document est d'établir une référence commune et reproductible pour les essais des matériels électriques et électroniques lorsqu'ils sont soumis à des creux de tension, des coupures brèves et des variations de tension au niveau des accès d'alimentation d'entrée en courant continu.<br/>
    Le présent document définit:<br/>
    - l'étendue des niveaux d'essai;<br/>
    - le générateur d'essai;<br/>
    - le montage d'essai;<br/>
    - la procédure d'essai.<br/>
    L'essai décrit ci-après s'applique aux matériels et systèmes électriques et électroniques. Il s'applique également aux modules ou sous-systèmes lorsque la puissance assignée du matériel à l'essai (MAE) est supérieure à la capacité du générateur d'essai spécifiée à l'Article 6. L'ondulation au niveau de l'accès d'alimentation d'entrée en courant continu n'est pas comprise dans le domaine d'application du présent document. Elle est couverte par l'IEC 61000‑4‑17. Le présent document ne précise pas les essais à appliquer à des appareils ou systèmes particuliers. Son objectif principal est de fournir une référence de base générale aux comités de produits de l'IEC. Ces comités de produits (ou les utilisateurs et les fabricants de matériels) restent responsables du choix approprié des essais et du niveau de sévérité à appliquer à leurs matériels. Cette deuxième édition annule et remplace la première édition parue en 2000. Cette édition constitue une révision technique.<br/>
    Cette édition inclut les modifications techniques majeures suivantes par rapport à l'édition précédente:<br/>
    a) augmentation de la tension de sortie du générateur d'essai pour prendre en compte les nouvelles tensions des réseaux à courant continu;<br/>
    b) indication de tolérances sur la durée des variations de tension;<br/>
    c) limitation du courant lors de l'application de coupures brèves en condition de basse impédance;<br/>
    d) clarifications techniques générales pour les spécifications du générateur d'essai et leur vérification;<br/>
    e) clarifications concernant les charges utilisées pour vérifier les caractéristiques de commutation et les possibilités d'attaque du courant d'appel de crête du générateur d'essai;<br/>
    f) clarifications concernant l'évaluation des résultats d'essai et des rapports d'essai;<br/>
    g) description de l'environnement à courant continu.
