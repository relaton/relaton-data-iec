abstract:
- content: "IEC 60444-11:2026 defines the standard method of measuring load resonance
    frequency fL at the nominal value of CL, and the determination of the effective
    load capacitance CLeff at the nominal frequency for crystals with the figure of
    merit M > 4.<br />\r\nThis edition includes the following significant technical
    changes with respect to the previous edition:<br />\r\na) key content of withdrawn
    IEC TR 60444-4 is reproduced as Annex A;<br />\r\nb) some formulae in the first
    edition have been corrected."
  language:
  - en
  script:
  - Latn
  format: text/html
- content: "L'IEC 60444-11:2026 définit la méthode normalisée de mesure de la fréquence
    de résonance à la charge fL à la valeur nominale de CL et la détermination de
    la capacité de charge efficace CLeff à la fréquence nominale pour des résonateurs
    de facteur de mérite M > 4.<br />\r\nCette édition inclut les modifications techniques
    majeures suivantes par rapport à l'édition précédente:<br />\r\na) l'essentiel
    du contenu de l'IEC TR 60444-4 qui a été annulé est reproduit dans l'Annexe A;<br
    />\r\nb) certaines formules de la première édition ont été corrigées."
