abstract:
- language: en
  script: Latn
  content: |-
    IEC 60947-5-5:2026 This edition includes the following significant technical changes with respect to the previous edition:<br/>
    a) re-shaping the document with the clause numbers and names to be in line with other documents of the 60947 series;<br/>
    b) review of the test method to reasonably determine that the latch mechanism meets the requirements of the document;<br/>
    c) new Annex B for special requirements for illuminated push-button type emergency stop devices, including the reference to a function to distinguish between "active and inactive" by changing the colour of the push-button depending on the illumination.<br/>
    This part of IEC 60947-5 provides detailed specifications relating to the electrical and mechanical construction of emergency stop devices with mechanical latching function and to their testing.<br/>
    This document is applicable to electrical control circuit devices and switching elements which are used to initiate an emergency stop signal. Such devices can be provided with their own enclosure and will be installed according to the product documentation.<br/>
    This document does not apply to:<br/>
    – emergency stop devices for non-electrical control applications, for example hydraulic or pneumatic;<br/>
    – emergency stop devices without mechanical latching function.<br/>
    An emergency stop device conforming to this document can also be used as part of an emergency switching off means in compliance with IEC 60364-5-53.<br/>
    NOTE See also IEC 60204-1:2016 and IEC 60204-1:2016/AMD1:2021, 9.2.3.4.<br/>
    This document does not address specific requirements on acoustic noise as the noise emission of electrical emergency stop devices with mechanical latching function is not considered to be a relevant hazard.<br/>
    This second edition cancels and replaces the first edition published in 1997. This edition constitutes a technical revision.
- language: fr
  script: Latn
  content: |-
    IEC 60947-5-5:2026 Cette édition inclut les modifications techniques majeures suivantes par rapport à l'édition précédente:<br/>
    a) le document a été restructuré en s'alignant sur les numéros et intitulés d'articles et de paragraphes des autres documents de la série IEC 60947;<br/>
    b) la méthode d'essai a été revue afin de déterminer de manière raisonnable que le mécanisme de verrouillage respecte les exigences du document;<br/>
    c) la nouvelle Annexe B définit les exigences particulières pour les appareils d'arrêt d'urgence à bouton-poussoir lumineux en faisant notamment référence à la fonction qui permet de distinguer les états "actif" et "inactif" en faisant varier la couleur d'illumination du bouton-poussoir.<br/>
    La présente partie de l'IEC 60947-5 fournit des spécifications détaillées concernant la construction électrique et mécanique des appareils d'arrêt d'urgence avec accrochage mécanique et leurs essais.<br/>
    Le présent document s'applique aux appareils et éléments de commutation pour circuits de commande électriques, qui sont utilisés pour générer un signal d'arrêt d'urgence. Ces appareils peuvent être équipés de leur propre enveloppe et sont installés conformément à la documentation du produit.<br/>
    Le présent document ne s'applique pas:<br/>
    – appareils d'arrêt d'urgence pour applications de commande non électriques, par exemple hydrauliques ou, pneumatiques;<br/>
    – appareils d'arrêt d'urgence sans accrochage mécanique.<br/>
    Un appareil d'arrêt d'urgence conforme au présent document peut également être utilisé dans le cadre d'un moyen de coupure d'urgence conformément à l'IEC 60364-5-53.<br/>
    NOTE Voir aussi le 9.2.3.4 de l'IEC 60204-1:2016 et de l'IEC 60204-1:2016/AMD1:2021.<br/>
    Le présent document ne traite pas des exigences spécifiques relatives au bruit acoustique, car l'émission de bruit des appareils d'arrêt d'urgence électriques avec accrochage mécanique n'est pas considérée comme constituant un danger pertinent.<br/>
    Cette seconde édition annule et remplace la première édition parue en 1997. Cette édition constitue une révision technique.
