abstract:
- language: en
  script: Latn
  content: |-
    <p>IEC 62282-3-201:2025 provides test methods for the electrical, thermal, and environmental performance of small stationary fuel cell power systems that meet the following criteria:<br/>
    - output: rated electric power output of less than 10 kW;<br/>
    - output mode: grid-connected/independent operation or stand-alone operation with single-phase AC output or 3-phase AC output not exceeding 1 000 V, or DC output not exceeding 1 500 V;<br/>
    - operating pressure: maximum allowable working pressure of 0,1 MPa (gauge) for the fuel and oxidant passages;<br/>
    - fuel: gaseous fuel (natural gas, liquefied petroleum gas, propane, butane, hydrogen, etc.) or liquid fuel (kerosene, methanol, etc.);<br/>
    - oxidant: air.<br/>
    This document describes type tests and their test methods only. No routine tests are required or identified, and no performance targets are set in this document.<br/>
    This document provides test methods to be carried out under laboratory conditions.<br/>
    This document covers fuel cell power systems whose primary purpose is the production of electric power and whose secondary purpose can be the utilization of heat. Accordingly, fuel cell power systems for which the use of heat is primary, and the use of electric power is secondary are outside the scope of this document.<br/>
    This third edition cancels and replaces the second edition published in 2017 and Amendment 1:2022. This edition includes the following significant technical changes with respect to the previous edition:<br/>
    - revision of Introduction;<br/>
    - revision of terms and definitions;<br/>
    - revision of Table 1;<br/>
    - revision of Figure 1, Figure 2, Figure 3 and Figure 4;<br/>
    - revision of measurement instruments (10.2);<br/>
    - revision of minimum required measurement systematic uncertainty (10.4);<br/>
    - revision of test conditions (Clause 11);<br/>
    - revision of operating process (Clause 12);<br/>
    - revision of fuel consumption test (14.2);<br/>
    - revision of heat recovery test (14.4);<br/>
    - revision of Figure 13 and Figure 14;<br/>
    - revision of calculation of results (14.14.4);<br/>
    - revision of Annex A and Annex B.</p>
- language: fr
  script: Latn
  content: |-
    L'IEC 62282-3-201:2025 fournit des méthodes d’essai relatives aux performances électriques, thermiques et environnementales des petits systèmes à piles à combustible stationnaires qui satisfont aux critères suivants:<br/>
    - puissance de sortie: la puissance électrique de sortie assignée est inférieure à 10 kW;<br/>
    - mode de sortie: fonctionnement raccordé au réseau/indépendant ou fonctionnement autonome avec une sortie en courant alternatif monophasé ou une sortie en courant alternatif triphasé ne dépassant pas 1 000 V ou une sortie en courant continu ne dépassant pas 1 500 V;<br/>
    - pression de fonctionnement: pression de fonctionnement admissible maximale 0,1 MPa (G) pour les passages du combustible et de l’agent oxydant;<br/>
    - combustible: combustible gazeux (gaz naturel, gaz de pétrole liquéfié, propane, butane, hydrogène, etc.) ou combustible liquide (kérosène, méthanol, etc.);<br/>
    - agent oxydant: air.<br/>
    Le présent document décrit uniquement les essais de type et leurs méthodes d’essai. Aucun essai individuel de série n’est exigé ou identifié, et aucune cible de performance n’est définie dans le présent document.<br/>
    Le présent document fournit des méthodes d’essai à appliquer dans des conditions de laboratoire.<br/>
    Le présent document traite des systèmes à piles à combustible dont le but principal est de produire du courant électrique et dont le but secondaire peut être d’utiliser de la chaleur. Par conséquent, les systèmes à piles à combustible dont le but principal est l’utilisation de la chaleur et dont le but secondaire est l’utilisation du courant électrique ne relèvent pas du domaine d’application du présent document.<br/>
    Cette troisième édition annule et remplace la deuxième édition parue en 2017 et son Amendement 1:2022. Cette édition constitue une révision technique. Cette édition inclut les modifications techniques majeures suivantes par rapport à l’édition précédente:<br/>
    - révision de l’Introduction,<br/>
    - révision des termes et définitions,<br/>
    - révision du Tableau 1,<br/>
    - révision de la Figure 1, Figure 2, Figure 3 et Figure 4;<br/>
    - révision des appareils de mesure (10.2),<br/>
    - révision de l’incertitude de mesure systématique minimale exigée (10.4),<br/>
    - révision des conditions d’essai (Article 11),<br/>
    - révision du processus de fonctionnement (Article 12),<br/>
    - révision de l’essai de consommation de combustible (14.2),<br/>
    - révision de l’essai d’énergie thermique récupérée (14.4),<br/>
    - révision de la Figure 13 et de la Figure 14,<br/>
    - révision du calcul des résultats (14.14.4),<br/>
    - révision de l’Annexe A et de l’Annexe B.
