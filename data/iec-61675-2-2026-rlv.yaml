abstract:
- language: en
  script: Latn
  content: |-
    IEC 61675-2:2026 RLV contains both the official IEC International Standard and its Redline version. The Redline version is available in English only and provides you with a quick and easy way to compare all the changes between the official IEC Standard and its previous edition.<br/>
    <br/>
    IEC 61675-2:2026 specifies terminology and test methods for describing the characteristics of GAMMA CAMERAS equipped with PARALLEL HOLE COLLIMATORS that are capable of planar imaging. Additional tests are specified for those GAMMA CAMERAS that are capable of SINGLE PHOTON EMISSION COMPUTED TOMOGRAPHY (SPECT) or planar wholebody imaging (PLANAR WHOLEBODY IMAGING EQUIPMENT) or SPECT wholebody imaging. SPECT systems can also be equipped with a CT system for hybrid imaging. These GAMMA CAMERAS consist of a gantry, single or multiple DETECTOR HEADS, and a computer for data acquisition, processing, storage, and display. The DETECTOR HEADS can contain single or multiple scintillation crystals or solid state detectors. Novel camera designs with multiple DETECTOR HEADS that are not capable of planar acquisition are not included in the scope of this document. IEC 61675-2:2026 cancels and replaces the second edition published in 2015. This edition constitutes a technical revision.<br/>
    This edition includes the following significant technical changes with respect to the previous edition:<br/>
    a) addition of systems based on pixelated semi-conductor detectors;<br/>
    b) addition of tests for wholebody SPECT performance and quantitative SPECT image accuracy;<br/>
    c) alignment with NEMA NU 1-2018;<br/>
    d) deletion of tests for SPECT-systems operated in coincidence mode due to the lack of market share of these systems.
