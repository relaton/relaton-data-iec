abstract:
- language: en
  script: Latn
  content: |-
    IEC 60335-2-103:2023 deals with the safety of electric drives for horizontally and vertically moving gates, doors, garage doors and windows for household and similar purposes, their rated voltage being not more than 250 V for single-phase drives and 600 V for other drives including direct current (DC) supplied appliances and battery-operated appliances. It also covers the hazards associated with the movement of the driven part.<br/>
    Drives not intended for normal household use but which nevertheless can be a source of danger to the public, such as drives intended to be used by laymen in shops, offices, hotels, restaurants, hospitals, in industry and on farms, are within the scope of this standard.<br/>
    Requirements for drives for doors that can be used in emergency routes and exits are given in normative Annex AA.<br/>
    Examples of drives within the scope of this standard are drives for<br/>
    – folding doors;<br/>
    – revolving doors;<br/>
    – rolling doors;<br/>
    – roof windows;<br/>
    – sectional overhead doors;<br/>
    – swinging and sliding gates or doors.<br/>
    Drives can be supplied with a driven part.<br/>
    As far as is practicable, this standard deals with the common hazards presented by drives that are encountered by all persons in and around the home. However, in general, it does not take into account<br/>
    – persons (including children) whose physical, sensory or mental capabilities; or lack of experience and knowledge prevents them from using the drive safely without supervision or instruction;<br/>
    – children playing with the drive.<br/>
    For appliances intended to be used in vehicles or on board ships or aircraft, additional requirements can be necessary. In many countries, additional requirements are specified by the national health authorities, the national authorities responsible for the protection of labour, the national water supply authorities and similar authorities.<br/>
    This standard does not apply to drives<br/>
    – for vertically moving garage doors for residential use (60335-2-95);<br/>
    – for shutters covering doors and windows (including locations where the door is set back from the shutter), awnings, blinds and similar equipment (60335-2-97);<br/>
    – intended exclusively to be used by trained persons in commercial and industrial premises;<br/>
    – for specific purposes, such as fire doors;<br/>
    – for natural smoke exhaust ventilators not used as windows (ISO 21927-2);<br/>
    – intended to be used in locations where special conditions prevail, such as the presence of a corrosive or explosive atmosphere (dust, vapour or gas).<br/>
    This standard does not apply to movement of a pedestrian door where such movement is based solely on stored energy.<br/>
    This fourth edition cancels and replaces the third edition published in 2015, Amendment 1:2017 and Amendment 2:2019. This edition constitutes a technical revision.<br/>
    This edition includes the following significant technical changes with respect to the previous edition:<br/>
    a) the text has been aligned with IEC 60335-1:2020;<br/>
    b) scope includes DC-supplied appliances and battery-operated appliances (Clause 1);<br/>
    c) some notes have been converted to normative text (Clause 1);<br/>
    d) additional requirements for installation instructions have been incorporated (7.12);<br/>
    e) application of test probe 18 and test probe 19 have been introduced (8.1.1, 20.2, Annexes BB, CC and DD);<br/>
    f) addition of surface temperatures for external accessible surfaces (11.3, 11.8);<br/>
    g) requirements for loading accessible appliance outlets and socket outlets have been added (11.7);<br/>
    h) requirements for appliances incorporating integral batteries or separable batteries have been added (11.7);<br/>
    i) requirements have been added for drives intended for permanent connection delivered with a connector to ease the installation (22.108, 24.101, 25.3).<br/>
    This part 2 is to be used in conjunction with the latest edition of IEC 60335-1 and its amendments unless that edition precludes it; in that case, the latest edition that does not preclude it is used. It was established on the basis of the sixth edition (2020) of that standard.
- language: fr
  script: Latn
  content: |-
    L'IEC 60335-2-103:2023 traite de la sécurité des motorisations électriques de portails, portes et portes de garage et fenêtres, à déplacement horizontal ou vertical pour usage domestique et analogue, dont la tension assignée n'est pas supérieure à 250 V pour les motorisations monophasées et à 600 V pour les autres motorisations, y compris les appareils alimentés en courant continu et les appareils alimentés par batteries. Elle couvre également les dangers liés au mouvement de la partie entraînée.<br/>
    Les motorisations non destinées à un usage domestique normal, mais qui néanmoins peuvent constituer une source de danger pour le public, telle que les motorisations destinées à être utilisées par des utilisateurs non avertis dans des magasins, des bureaux, des hôtels, des restaurants, des hôpitaux, dans l'industrie et dans des fermes, sont comprises dans le domaine d'application de la présente norme.<br/>
    Les motorisations applicables aux éléments suivants sont des exemples de motorisations qui entrent dans le domaine d'application de la présente norme:<br/>
    – portes pliantes;<br/>
    – portes tournantes;<br/>
    – portes à enroulement;<br/>
    – fenêtres de toit;<br/>
    – portes sectionnelles relevantes;<br/>
    – portails ou portes de type battant et coulissant.<br/>
    Dans la mesure du possible, la présente norme traite des dangers ordinaires présentés par les motorisations, encourus par toutes les personnes à l'intérieur et autour de l'habitation. Cependant, elle ne tient pas compte en général<br/>
    – des personnes (y compris des enfants) dont les capacités physiques, sensorielles ou mentales; ou le manque d'expérience et de connaissance les empêchent d'utiliser la motorisation en toute sécurité sans surveillance ou instruction;<br/>
    – de l'utilisation de la motorisation comme jouet par des enfants.<br/>
    Pour les appareils destinés à être utilisés dans des véhicules ou à bord de navires ou d'avions, des exigences supplémentaires peuvent être nécessaires. Dans de nombreux pays, des exigences supplémentaires sont spécifiées par les organismes nationaux de la santé, par les organismes nationaux responsables de la protection des travailleurs, par les organismes nationaux responsables de l'alimentation en eau et par des organismes similaires.<br/>
    La présente norme ne s'applique pas aux motorisations<br/>
    – des portes de garage à ouverture verticale pour usage résidentiel (IEC 60335-2-95);<br/>
    – des volets qui couvrent les portes et les fenêtres (y compris dans les cas où la porte est en retrait par rapport au volet), des stores, des rideaux et des équipements analogues (IEC 60335-2-97);<br/>
    – destinées exclusivement à une utilisation par des personnes averties dans des locaux à usage commercial et industriel;<br/>
    – pour des usages spécifiques, comme les portes coupe-feu;<br/>
    – pour des dispositifs d'évacuation naturelle des fumées non utilisés comme fenêtres (ISO 21927-2);<br/>
    – destinées à être utilisées dans des locaux présentant des conditions particulières, telles que la présence d'une atmosphère corrosive ou explosive (poussière, vapeur ou gaz).<br/>
    La présente norme ne s'applique pas au mouvement d'une porte piétonne lorsque ce mouvement repose uniquement sur l'énergie stockée.<br/>
    Cette quatrième édition annule et remplace la troisième édition parue en 2015, l'Amendement 1:2017 et l'Amendement 2:2019. Cette édition constitue une révision technique.<br/>
    Cette édition inclut les modifications techniques majeures suivantes par rapport à l'édition précédente:<br/>
    a) le texte a été aligné sur l'IEC 60335-1:2020;<br/>
    b) le domaine d'application comprend les appareils alimentés en courant continu et les appareils alimentés par batteries (Article 1);<br/>
    c) certaines notes ont été converties en texte normatif (Article 1);<br/>
    d) des exigences supplémentaires relatives aux instructions d'installation ont été incorporées (7.12);<br/>
    e) l'application du calibre d'essai 18 et du calibre d'essai 19 a été introduite (8.1.1, 20.2, Annexes BB, CC et DD);<br/>
    f) des températures de surface ont été ajoutées pour les surfaces accessibles extérieures (11.3, 11.8);<br/>
    g) des exigences relatives au chargement des socles femelles de connecteurs et socles de prises de courant accessibles ont été ajoutées (11.7);<br/>
    h) des exigences ont été ajoutées pour les appareils qui comportent des batteries intégrées ou des batteries séparables (11.7);<br/>
    i) des exigences ont été ajoutées pour les motorisations destinées à être raccordées de façon permanente livrées avec un connecteur afin de faciliter l'installation (22.108, 24.101, 25.3).<br/>
    La présente partie 2 doit être utilisée conjointement avec la dernière édition de l'IEC 60335-1 et ses amendements sauf si cette édition l'exclut. Dans ce cas, la dernière édition qui n'exclut pas la présente partie 2 est utilisée. Elle a été établie sur la base de la sixième édition (2020) de cette norme.
