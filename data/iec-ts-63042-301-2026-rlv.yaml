abstract:
- language: en
  script: Latn
  content: |-
    IEC TS 63042-301:2026 RLV contains both the official IEC International Standard and its Redline version. The Redline version is available in English only and provides you with a quick and easy way to compare all the changes between the official IEC Standard and its previous edition.<br/>
    <br/>
    IEC TS 63042-301:2026, which is a technical specification, applies to on-site acceptance tests of electrical equipment with the highest voltages of AC transmission system exceeding 800 kV and its protection and control system.<br/>
    The electrical equipment exceeding 800 kV includes the following items:<br/>
    - power transformers;<br/>
    - circuit-breakers;<br/>
    - gas insulated switchgear (GIS);<br/>
    - gas insulated transmission line (GIL);<br/>
    - surge arresters;<br/>
    - voltage and current transformers;<br/>
    - shunt reactors;<br/>
    - series compensators;<br/>
    - insulators;<br/>
    - disconnectors and earthing switches;<br/>
    - high-speed earthing switches (HSES).<br/>
    This second edition cancels and replaces the first edition published in 2018. This edition constitutes a technical revision.<br/>
    This edition includes the following significant technical changes with respect to the previous edition:<br/>
    a) new subclause with measurement of short-circuit impedance and load loss for on-site assembly transformer has been added;<br/>
    b) new subclause with measurement of no-load loss and current for on-site assembly transformer has been added;<br/>
    c) on-site acceptance test requirement for GIL has been added;<br/>
    d) new clause with protection and control system on-site acceptance tests has been added.
