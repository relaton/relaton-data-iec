abstract:
- language: en
  script: Latn
  content: |-
    IEC 62960:2020 provides guidance on a review methodology for dependability from a technical perspective that is applicable at all stages of a system life cycle. Its application can improve the dependability of a system throughout its life cycle by triggering appropriate actions at appropriate times to address potential dependability problems.<br/>
    It provides guidance for developers, manufacturers, users and third-party independent reviewers such as consulting organizations.<br/>
    This document describes a dependability review methodology focusing on:<br/>
    - coherence of review activities across life cycle stages and their impact on dependability;<br/>
    - stakeholder identification and how this affects dependability review activities;<br/>
    - the relationships between different types of reviews;<br/>
    - procedures for effective dependability reviews;<br/>
    - examples of dependability review activities.
- language: fr
  script: Latn
  content: |-
    IEC 62960:2020 fournit, sous un angle technique, des recommandations relatives à une méthodologie de revue de la sûreté de fonctionnement applicable à toutes les phases du cycle de vie d'un système. Son application permet d'améliorer la sûreté de fonctionnement d'un système tout au long de son cycle de vie, en déclenchant au moment opportun des mesures adéquates pour traiter les éventuels problèmes de sûreté de fonctionnement.<br/>
    Il fournit des recommandations à l'attention des développeurs, des fabricants, des utilisateurs et des vérificateurs tiers indépendants, tels que des organismes de conseil.<br/>
    Le présent document décrit une méthodologie de revue de la sûreté de fonctionnement portant sur:<br/>
    - la cohérence des activités de revue au cours des différentes étapes du cycle de vie et leur impact sur la sûreté de fonctionnement;<br/>
    - l'identification des parties prenantes et leurs effets sur les activités de revue de la sûreté de fonctionnement;<br/>
    - les relations entre les différents types de revues;<br/>
    - les procédures garantissant l'efficacité des revues de la sûreté de fonctionnement;<br/>
    - des exemples d'activités réalisées dans le cadre de revues de la sûreté de fonctionnement.
