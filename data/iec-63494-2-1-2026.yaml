abstract:
- language: en
  script: Latn
  content: |-
    IEC 63494‑2-1:2026 specifies the interchangeability requirements of an electro-mechanical interface with four-pin extra-low-voltage (ELV) twist-lock interface – type ZB18 for use in lighting systems. This twist-lock interface has four electrical contacts that are suitable for ELV voltages. Two connections are intended for supply power and two are intended for digital communication. This document specifies interchangeability related requirements for mechanical, electrical, ambient conditions, positional orientation, communication protocol and pin assignments for the interface. Specific requirements for the devices that can utilize the interface such as sensors, communication modules, cameras, etc., are not within the scope of this document. This document does not specify the following aspects:<br/>
    - the lighting technology,<br/>
    - the illumination performance,<br/>
    - electromagnetic compatibility (EMC).
- language: fr
  script: Latn
  content: |-
    L'IEC 63494‑2-1:2026 spécifie les exigences d'interchangeabilité d'une interface électromécanique avec une interface très basse tension (TBT) à verrouillage rotatif (twist-lock) à quatre broches de type ZB18 destinée à être utilisée dans les systèmes d'éclairage. Cette interface à verrouillage rotatif comporte quatre contacts électriques adaptés aux tensions TBT. Deux connexions sont destinées à l'alimentation et deux sont destinées à la communication numérique. Le présent document spécifie les exigences d'interchangeabilité relatives aux conditions mécaniques, électriques et ambiantes, à l'orientation de position, au protocole de communication et à l'affectation des broches pour l'interface. Les exigences spécifiques aux dispositifs qui peuvent utiliser l'interface, tels que les capteurs, les modules de communication, les caméras, etc., ne relèvent pas du domaine d'application du présent document. Le présent document ne spécifie pas les aspects suivants:<br/>
    - la technologie d'éclairage;<br/>
    - les performances d'éclairement;<br/>
    - la compatibilité électromagnétique (CEM).
