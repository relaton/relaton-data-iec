abstract:
- language: en
  script: Latn
  content: |-
    IEC 81346-1:2022 establishes general principles for the structuring of systems including structuring of information about systems.<br/>
    Based on these principles, rules and guidance are given for the formulation of unambiguous reference designations for objects in any system.<br/>
    The reference designation identifies objects for the purpose of creation and retrieval of information about an object and, where realized, about its corresponding component.<br/>
    A reference designation labelled at a component is the key to finding information about that object among different kinds of documents.<br/>
    The principles are general and are applicable to all technical areas (for example mechanical engineering, electrical engineering, construction engineering, process engineering). They can be used for systems based on different technologies or for systems combining several technologies.<br/>
    This document is also a horizontal publication intended for use by technical committees in preparation of publications related to reference designations in accordance with the principles laid down in IEC Guide 108.<br/>
    IEC 81346-1:2022 cancels and replaces the first edition published in 2009. This edition constitutes a technical revision.<br/>
    This edition includes the following significant technical changes with respect to the previous edition:<br/>
    a) the scope includes a reference to IEC Guide 108 for being a horizontal publication;<br/>
    b) synchronization with IEC 81346-2:2019 and ISO 81346-12:2018;<br/>
    c) the introduction of the type aspect;<br/>
    d) introduction of an information model of the reference designation system;<br/>
    e) introduction of an information model for the framework of reference designation system to comply with International Standard 81346 series;<br/>
    f) introduction of recommendation for metadata for design structure management;<br/>
    g) introduction of rules and method for designation of relations between objects;<br/>
    h) introduction of requirements for development of sector-specific parts of the International Standard 81346 series;<br/>
    i) introduction of requirements for incorporation of sub-object in object structures;<br/>
    j) introduction of recommendations for documentation of the application of the International Standard 81346 series;<br/>
    k) introduced definition of new terms used;<br/>
    l) new rules added and existing rules modified;<br/>
    m) notes related to rules are converted to normative text as "Comment to Rule nn".
- language: fr
  script: Latn
  content: |-
    L'IEC 81346-1:2022 établit les principes généraux pour la structuration des systèmes, y compris la structuration des informations sur ces systèmes.<br/>
    Sur la base de ces principes, des règles et des recommandations sont données pour la formulation de désignations de référence non ambiguës applicables aux objets d’un système, quel qu’il soit.<br/>
    La désignation de référence identifie des objets dans le but de créer et de récupérer des informations sur un objet et, lorsqu’elle est réalisée, au sujet de son composant correspondant.<br/>
    Une désignation de référence rattachée à un composant est la clef qui permet de trouver des informations sur cet objet parmi différentes sortes de documents.<br/>
    Les principes énoncés sont généraux et applicables à tous les domaines techniques (par exemple génie mécanique, électrique, civil ou des procédés). Ils peuvent être utilisés pour des systèmes basés sur des technologies différentes, ou pour des systèmes combinant plusieurs technologies.<br/>
    Le présent document est également une publication horizontale destinée à être utilisée par les comités techniques pour l’établissement de publications liées aux désignations de référence conformément aux principes exposés dans l’IEC Guide 108.<br/>
    L'IEC 81346-1:2022 annule et remplace la première édition, publiée en 2009. Cette édition constitue une révision technique.<br/>
    Cette édition inclut les modifications techniques majeures suivantes par rapport à l’édition précédente:<br/>
    a) ajout d’une référence au Guide IEC 108 dans le domaine d’application, en tant que publication horizontale;<br/>
    b) alignement sur l’IEC 81346-2:2019 et l’ISO 81346-12:2018;<br/>
    c) introduction de l’aspect de type;<br/>
    d) introduction d’un modèle d’information du système de désignation de référence;<br/>
    e) introduction d’un modèle d’information dans le cadre du système de désignation de référence conformément à la série de Normes internationales 81346;<br/>
    f) introduction d’une recommandation relative aux métadonnées pour la gestion de la structure de conception;<br/>
    g) introduction de règles et d’une méthode pour la désignation des relations entre les objets;<br/>
    h) introduction d’exigences relatives au développement de parties de la série de Normes internationales 81346 spécifiques à certains secteurs;<br/>
    i) introduction d’exigences concernant l’incorporation de sous-objets dans les structures à objets;<br/>
    j) introduction de recommandations sur la documentation de l’application de la série de Normes internationales 81346;<br/>
    k) ajout de définitions de nouveaux termes utilisés;<br/>
    l) ajout de nouvelles règles et modification des règles existantes;<br/>
    m) conversion des notes relatives aux règles en texte normatif en tant que "Commentaire à la règle nn".
