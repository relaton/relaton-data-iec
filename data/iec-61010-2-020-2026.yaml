abstract:
- language: en
  script: Latn
  content: |-
    IEC 61010-2-020:2026 is applicable to electrically powered laboratory centrifuges. It is possible that all or part of the equipment falls within the scope of one or more other Part 2 standards of IEC 61010 as well as within the scope of this document. In that case, the requirements of those other Part 2 standards will also apply. This fourth edition cancels and replaces the third edition published in 2016. This edition constitutes a technical revision.<br/>
    This edition includes the following significant technical changes with respect to the previous edition:<br/>
    a) alignment with changes introduced by Amendment 1:2016 of IEC 61010-1:2010.<br/>
    It has the status of a product safety publication in accordance with IEC Guide 104.<br/>
    This Part 2-020 is intended to be used in conjunction with the latest edition of IEC 61010-1. It was established on the basis of the third edition (2010) and its Amendment 1 (2016), hereinafter referred to as Part 1.<br/>
    This Part 2-020 supplements or modifies the corresponding clauses in IEC 61010-1 so as to convert that publication into the IEC standard: Particular requirements for laboratory centrifuges.<br/>
    Where a particular subclause of IEC 61010-1 is not mentioned in this Part 2-020, that subclause applies as far as is reasonable. Where this Part 2-020 states "addition", "modification" or "replacement", the relevant requirement, test specification or note in IEC 61010-1 shall be adapted accordingly.
- language: fr
  script: Latn
  content: |-
    IEC 61010-2-020:2026 s’applique aux centrifugeuses de laboratoire alimentées en énergie électrique. Il est possible qu’une ou toutes les parties de l’appareil relèvent du domaine d’application d’une ou plusieurs autres Parties 2 de l’IEC 61010, ainsi que du domaine d’application du présent document. Si tel est le cas, les exigences de ces autres Parties 2 s’appliquent également. Cette quatrième édition annule et remplace la troisième édition parue en 2016. Cette édition constitue une révision technique.<br/>
    Cette édition inclut les modifications techniques majeures suivantes par rapport à l’édition précédente:<br/>
    a) alignement sur les modifications introduites dans l’Amendement 1:2016 de l’IEC 61010‑1:2010.<br/>
    Elle a le statut d’une publication de sécurité de produit conformément au Guide IEC 104.<br/>
    La présente Partie 2-020 est destinée à être utilisée conjointement avec la dernière édition de l’IEC 61010-1. Elle a été établie sur la base de la troisième édition (2010) et de son Amendement 1 (2016), ci-après désignés Partie 1.<br/>
    La présente Partie 2-020 complète ou modifie les articles correspondants de l’IEC 61010-1, de façon à transformer cette publication en norme IEC: Exigences particulières pour centrifugeuses de laboratoire.<br/>
    Lorsqu’un paragraphe particulier de la Partie 1 n’est pas mentionné dans cette Partie 2-020, ce paragraphe s’applique pour autant que cela soit raisonnable. Lorsque cette Partie 2-020 spécifie "addition", "modification" ou "remplacement", l’exigence correspondante, la spécification d’essai correspondante ou la note correspondante de la Partie 1 doit être adaptée en conséquence.
