abstract:
- language: en
  script: Latn
  content: |-
    <!-- NEW! -->IEC 60079-0:2026 is available as IEC 60079-0:2026 RLV which contains the International Standard and its Redline version, showing all changes of the technical content compared to the previous edition.
    <p>IEC 60079-0:2026 specifies the general requirements for construction, testing and marking of Ex Equipment and Ex Components intended for use in or associated with explosive atmospheres.<br/>
    The standard atmospheric conditions (relating to the explosion characteristics of the atmosphere) for Ex Equipment are:<br/>
    - temperature −20 °C to +60 °C;<br/>
    - pressure 80 kPa (0,8 bar) to 110 kPa (1,1 bar); and<br/>
    - air with normal oxygen content, typically a volume fraction of 21 %.<br/>
    This IEC 60079-0:2026 and other documents supplementing this document specify additional test requirements for Ex Equipment operating outside the standard temperature range, but in some cases, further additional consideration and additional testing is required for Ex Equipment operating outside the standard atmospheric pressure range and standard oxygen content. Such additional testing is particularly relevant with respect to Types of Protection that depend on quenching of a flame such as 'flameproof enclosures "d"' (IEC 60079-1) or limitation of energy, 'intrinsic safety "i"' (IEC 60079-11). This eighth edition cancels and replaces the seventh edition, published in 2017. This edition constitutes a technical revision. Refer to the Foreword of the document for a complete listing of the technical changes between edition 8.0 and the previous edition of the document.</p>
- language: fr
  script: Latn
  content: |-
    <!-- NEW! -->IEC 60079-0:2026 est disponible sous forme de IEC 60079-0:2026 RLV qui contient la Norme internationale et sa version Redline, illustrant les modifications du contenu technique depuis l'édition précédente.
    <p>L’IEC 60079-0: 2026 spécifie les exigences générales de construction, d’essais et de marquage des appareils Ex et des composants Ex destinés à être utilisés dans des atmosphères explosives ou à être associés à de telles atmosphères.<br/>
    Les conditions atmosphériques normales (relatives aux caractéristiques d’explosion de l’atmosphère) pour l’appareil Ex sont les suivantes:<br/>
    - température comprise entre -20 °C et +60 °C,<br/>
    - pression de 80 kPa (0,8 bar) à 110 kPa (1,1 bar), et<br/>
    - air avec teneur normale en oxygène, typiquement un titre volumique de 21 %.<br/>
    L’IEC 60079-0: 2026 et les autres documents qui complètent le présent document spécifient des exigences d’essai supplémentaires pour les appareils Ex fonctionnant hors de la plage normale de températures, une attention supplémentaire ultérieure et des essais supplémentaires étant toutefois exigés dans certains cas pour les appareils Ex fonctionnant hors de la plage normale de pressions atmosphériques et de la teneur normale en oxygène. De tels essais supplémentaires se révèlent pertinents, notamment pour les modes de protection qui dépendent de l’extinction d’une flamme, tels qu’une "enveloppe antidéflagrante "d"" (IEC 60079-1), ou de la limitation de l’énergie, tels que la "sécurité intrinsèque "i"" (IEC 60079‑11). Cette huitième édition annule et remplace la septième édition parue en 2017. Cette édition constitue une révision technique. Reportez-vous à l'avant-propos du document pour une liste complète des modifications techniques entre l'édition 8.0 et édition précédente du document.</p>
