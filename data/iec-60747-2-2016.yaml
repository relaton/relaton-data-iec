abstract:
- language: en
  script: Latn
  content: |-
    IEC 60747-2:2016 provides standards for the following categories or sub-categories of rectifier diodes, including:<br/>
    - line rectifier diodes;<br/>
    - avalanche rectifier diodes;<br/>
    - fast-switching rectifier diodes;<br/>
    - Schottky barrier diodes.<br/>
    This edition includes the following significant technical changes with respect to the previous edition:<br/>
    a) Schottky barrier diodes and its properties are added;<br/>
    b) Clauses 3, 4, 5 and 7 were amended with some deletions of information no longer in use or already included in other parts of the IEC 60747 series, and with some necessary additions;<br/>
    c) Clause 6 was moved and added to Clause 7 of this third edition;<br/>
    d) some parts of Clause 7 were moved and added to Clause 7 of this third edition;<br/>
    e) Annex A was deleted.<br/>
    <br/>
    This publication is to be read in conjunction with IEC 60747-1:2006.
- language: fr
  script: Latn
  content: |-
    L'IEC 60747-2:2016 donne les normes pour les catégories et sous-catégories suivantes de diodes de redressement, comprenant:<br/>
    - diodes de redressement de ligne;<br/>
    - diodes de redressement à avalanche;<br/>
    - diodes de redressement à commutation rapide;<br/>
    - diodes à barrière de Schottky.<br/>
    Cette édition inclut les modifications techniques majeures suivantes par rapport à l'édition précédente:<br/>
    a) les diodes à barrière de Schottky et leurs propriétés ont été ajoutées;<br/>
    b) les Articles 3, 4, 5 et 7 ont été modifiés en procédant d'une part à des suppressions d'informations ne faisant plus l'objet d'une application ou figurant déjà dans d'autre parties de la série IEC 60747, et d'autre part à des ajouts nécessaires;<br/>
    c) l'Article 6 a été déplacé et ajouté à l'Article 7 de la présente troisième édition;<br/>
    d) certaines parties de l'Article 7 ont été déplacées et ajoutées à l'Article 7 de la présente troisième édition;<br/>
    e) l'Annexe A a été supprimée.<br/>
    <br/>
    Cette publication doit être lue conjointement avec la IEC 60747-1:2006.
