abstract:
- language: en
  script: Latn
  content: |-
    IEC 60477-1:2022 applies to resistors intended for use as laboratory DC resistors (hereinafter referred to as "resistors") comprising standard resistors, single or multiple resistors of accuracy Classes 0,000 05 to 10 and single or multi-dial resistors of accuracy Classes 0,000 5 to 10.<br/>
    This document does not apply to:<br/>
    1) resistors which are intended for use solely as permanently mounted circuit components,<br/>
    2) resistors used on alternating current or on pulsed current,<br/>
    3) active resistors,<br/>
    4) series resistors and shunts which are considered as accessories of electrical measuring instruments in the relevant IEC document (examples of these are as follows).<br/>
    IEC 60477-1:2022 cancels and replaces the first edition of IEC 60477 published in 1974, and its Amendment 1:1997. This edition constitutes a technical revision.<br/>
    This edition includes the following significant technical changes with respect to the previous edition:<br/>
    a) extended the resistor accuracy classes;<br/>
    b) deleted the resistor accuracy class expression in parts per million (ppm);<br/>
    c) excluded the active resistor from the scope of this document;<br/>
    d) updated the terms and definitions according to new IEC 60050 series;<br/>
    e) changed the term "resistance decade" to "resistance dial" to cover the multi-dial resistors with other resistance step values;<br/>
    f) updated the intrinsic error to intrinsic uncertainty according to IEC 60359;<br/>
    g) added the limits of relative stability for resistors of classes 0,000 05 to 0,01;<br/>
    h) added the requirements of high voltage resistors;<br/>
    i) updated the safety symbols and requirements according to the new IEC 61010 series;<br/>
    j) updated the insulation resistance requirements of resistors;<br/>
    k) added the requirements of temperature coefficient;<br/>
    l) updated the temperature requirements for transport and storage of resistors.
- language: fr
  script: Latn
  content: |-
    L'IEC 60477-1:2022 s’applique aux résistances destinées à être utilisées comme résistances de laboratoire à courant continu (ci-après désignées "résistances"), comprenant des résistances étalons, des résistances simples ou multiples des classes de précision 0,000 05 à 10 et des résistances à commutateurs simples ou multiples des classes de précision 0,000 5 à 10.<br/>
    Le présent document ne s’applique pas:<br/>
    1) aux résistances qui sont destinées à être utilisées seulement comme composants, branchées de façon permanente dans des circuits;<br/>
    2) aux résistances utilisées en courant alternatif ou en courant impulsionnel;<br/>
    3) aux résistances actives;<br/>
    4) aux résistances additionnelles et aux shunts qui sont considérés comme accessoires des appareils de mesure électriques dans le document correspondant de l’IEC (en voici des exemples).<br/>
    L'IEC 60477-1:2022 annule et remplace la première édition de l’IEC 60477 parue en 1974 et son Amendement 1:1997. Cette édition constitue une révision technique.<br/>
    Cette édition inclut les modifications techniques majeures suivantes par rapport à l’édition précédente:<br/>
    a) extension des classes de précision des résistances;<br/>
    b) suppression de l’expression classe de précision d’une résistance en parties par million (ppm);<br/>
    c) exclusion de la résistance active du domaine d’application du présent document;<br/>
    d) mise à jour des termes et définitions conformément à la nouvelle série IEC 60050;<br/>
    e) remplacement du terme "résistance à décade" par "commutateur de résistance" pour couvrir les résistances à commutateurs multiples avec d’autres valeurs d’échelon de résistance;<br/>
    f) mise à jour de l’erreur intrinsèque à l’incertitude intrinsèque conformément à l’IEC 60359;<br/>
    g) ajout des limites de stabilité relative pour les résistances de classes 0,000 05 à 0,01;<br/>
    h) ajout des exigences relatives aux résistances haute tension;<br/>
    i) mise à jour des symboles de sécurité et des exigences conformément à la nouvelle série IEC 61010;<br/>
    j) mise à jour des exigences de résistance d’isolement d’une résistance;<br/>
    k) ajout des exigences relatives au coefficient de température;<br/>
    l) mise à jour des exigences de température pour le transport et le stockage des résistances.
