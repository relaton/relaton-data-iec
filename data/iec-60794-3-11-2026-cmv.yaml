abstract:
- language: en
  script: Latn
  content: |-
    IEC 60794-3-11:2026 CMV contains both the official standard and its commented version. The commented version provides you with a quick and easy way to compare all the changes between IEC 60794-3-11:2026 edition 3.0 and the previous IEC 60794-3-11:2010 edition 2.0. Furthermore, comments from IEC SC 86A experts are provided to explain the reasons of the most relevant changes, or to clarify any part of the content.<br/>
    <br/>
    IEC 60794-3-11:2026 sets forth detailed requirements and characteristics specific to this type of optical fibre cables for duct, direct buried, and lashed installation. This document includes functional, mechanical, environmental and optical requirements, recommended features and test methods for assessing the product against the stated requirements. The specified test methods, where applicable, are those referenced in IEC 60794-1-1 and IEC 60794-1-2. The requirements of this document supplement those of the sectional specification IEC 60794‑3 and the family specification IEC 60794-3-10. This edition includes the following significant technical changes with respect to the previous edition:<br/>
    a) subclause 5.2.2 has been enlarged to include fibre type B-657.B2;<br/>
    b) this document has been updated to include multimode optical fibres.
