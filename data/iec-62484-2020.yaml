abstract:
- language: en
  script: Latn
  content: |-
    IEC 62484:2020 defines the performance requirements of installed monitors used for the detection and identification of gamma emitters and the detection of neutron radiation emitters. These monitors are commonly known as spectrometric radiation portal monitors or SRPMs. They are used to monitor vehicles, cargo containers, people, or packages and are typically used at national and international border crossings and ports of entry. SRPMs may be used at any location where there is a need for this type of monitoring.<br/>
    This document establishes the general, radiological, climatic, mechanical, electric and electromagnetic and documentation requirements and associated test methods. A summary of the performance requirements and informative listing of environmental requirements from IEC 62706 is provided.<br/>
    This edition includes the following significant technical changes with respect to the previous edition:<br/>
    - title modified;<br/>
    - making the standard consistent with the new standards for detection of illicit trafficking of radioactive material (see the Introduction);<br/>
    - creating unformed functionality test for all environmental, electromagnetic and mechanical tests and a requirement for the coefficient of variation of each nominal mean reading;<br/>
    - reference to IEC 62706 for the environmental, electromagnetic and mechanical test conditions;<br/>
    - adding information regarding climatic exposures.
- language: fr
  script: Latn
  content: |-
    IEC 62484:2020 définit les exigences de performances des moniteurs installés, qui sont utilisés pour la détection et l'identification des émetteurs de rayonnements gamma et pour la détection des émetteurs de rayonnements neutroniques. Ces moniteurs sont souvent appelés portiques spectrométriques de détection des rayonnements ou SRPMs (Spectrometric Radiation Portal Monitors). Ils sont utilisés pour surveiller des véhicules, des conteneurs de fret, des personnes ou des colis et généralement employés aux frontières nationales et internationales, ainsi qu'aux ports d'entrée. Les SRPMs peuvent être utilisés à tous les emplacements, où ce type de surveillance est nécessaire.<br/>
    Le présent document établit les exigences générales, radiologiques, climatiques, mécaniques, électriques et électromagnétiques, ainsi que les exigences de documentation et les méthodes d'essai associées. Le Tableau 11 fournit un récapitulatif des exigences de performances. Une liste informative des exigences d'environnement de l'IEC 62706 est fournie.<br/>
    Cette édition inclut les modifications techniques majeures suivantes par rapport à l'édition précédente:<br/>
    - modification du titre;<br/>
    - cohérence de la norme avec les nouvelles normes relatives à la détection du trafic illicite de matières radioactives (voir l'Introduction);<br/>
    - création d'un essai de fonctionnalité brut pour tous les essais environnementaux, électromagnétiques et mécaniques, et d'une exigence relative au coefficient de variation de chaque relevé de moyenne nominal;<br/>
    - référence à l'IEC 62706 pour les conditions d'essais environnementaux, électromagnétiques et mécaniques;<br/>
    - ajout d'informations concernant l'exposition aux conditions climatiques.
