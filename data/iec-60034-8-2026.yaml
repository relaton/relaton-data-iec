abstract:
- language: en
  script: Latn
  content: |-
    CORRECTED VERSION 2026-07<br/>
    <br/>
    IEC 60034-8:2026 applies to AC and DC machines and specifies:<br/>
    a) rules for the identification of winding connection points;<br/>
    b) marking of winding terminals;<br/>
    c) direction of rotation;<br/>
    d) relationship between terminal markings and direction of rotation;<br/>
    e) terminal marking of auxiliary devices;<br/>
    f) connection diagrams of machines for common applications.<br/>
    This fourth edition cancels and replaces the third edition published in 2007 and Amendment 1:2014. This edition constitutes a technical revision. This edition includes the following significant technical changes with respect to the previous edition:<br/>
    a) The inclusion of turbine-type synchronous machines in the scope.<br/>
    The content of the corrigendum 1 (2026-07) has been included in this copy.
- language: fr
  script: Latn
  content: |-
    VERSION CORRIGEE 2026-07<br/>
    <br/>
    L'IEC 60034-8:2026 s'applique aux machines à courant alternatif et à courant continu et spécifie<br/>
    a) les règles d'identification des points de couplage;<br/>
    b) le marquage des bornes d'enroulement;<br/>
    c) le sens de rotation;<br/>
    d) la relation entre les marquages des bornes et le sens de rotation;<br/>
    e) les marquages des bornes des appareils auxiliaires;<br/>
    f) les schémas de connexion des machines pour applications communes.<br/>
    Cette quatrième édition annule et remplace la troisième édition parue en 2007 et son Amendement 1:2014. Cette édition constitue une révision technique. Cette édition constitue une révision technique.<br/>
    Cette édition inclut les modifications techniques majeures suivantes par rapport à l'édition précédente:<br/>
    L'inclusion des turbomachines synchrones dans le domaine d'application.<br/>
    Le contenu du corrigendum 1 (2026-07) a été pris en considération dans cet exemplaire.
