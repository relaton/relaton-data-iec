abstract:
- content: "IEC 61754-2: 2026 defines the standard interface dimensions for type BFOC/2,5
    family of connectors.<br />\r\nThis second edition cancels and replaces the first
    edition published in 1996. This edition constitutes a technical revision. This
    edition includes the following significant technical changes with respect to the
    previous edition:<br />\r\na) addition of Clause 2, Clause 3 and the Bibliography;<br
    />\r\nb) addition of the active device receptacle interface type;<br />\r\nc)
    revision of the ferrule grades to refer to the connector optical interfaces specified
    in the IEC 61755-3 series;<br />\r\nd) revision of the ferrule end face geometry
    to refer to the connector optical interfaces specified in the IEC 61755‑3 series
    and IEC 63267‑3 series;<br />\r\ne) improvement of the description of the characteristics
    of the resilient alignment sleeve for adaptor and rigid bore sleeve for active
    device receptacle;<br />\r\nf) harmonisation of the dimensions of reference A
    for the rigid bore sleeve with other connector interface standards in IEC 61754
    series."
  language:
  - en
  script:
  - Latn
  format: text/html
- content: "L'IEC 61754-2:2026 définit les dimensions d'interface normalisées pour
    la famille de connecteurs de type BFOC/2,5.<br />\r\nCette deuxième édition annule
    et remplace la première édition parue en 1996. Cette édition constitue une révision
    technique. Cette édition inclut les modifications techniques significatives suivantes
    par rapport à l'édition précédente:<br />\r\na) ajout de l'Article 2, de l'Article
    3 et de la Bibliographie;<br />\r\nb) ajout du type d'interface d'embase d'un
    dispositif actif;<br />\r\nc) révision des classes de férules pour faire référence
    aux interfaces optiques de connecteurs spécifiées dans la série IEC 61755-3;<br
    />\r\nd) révision de la géométrie de l'extrémité de la férule pour faire référence
    aux interfaces optiques de connecteurs spécifiées dans la série IEC 61755‑3 et
    dans la série IEC 63267‑3;<br />\r\ne) amélioration de la description des caractéristiques
    du manchon d'alignement élastique pour le raccord et du manchon creux rigide pour
    l'embase d'un dispositif actif;<br />\r\nf) harmonisation des dimensions de la
    référence A pour le manchon creux rigide par rapport aux autres normes d'interfaces
    de connecteurs de la série IEC 61754."
