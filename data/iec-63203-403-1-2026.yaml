abstract:
- language: en
  script: Latn
  content: IEC 63203-403-1:2026 specifies test methods for surface electromyography
    (sEMG) sensors by evaluating the quality of sEMG signals obtained from contracting
    the muscles of the forearm and hand for wearable applications. It is applicable
    to sEMG sensors that are used to decipher movement intentions and use them as
    control signals in situations such as virtual reality, game, unmanned aerial vehicles
    (UAV), robot control, and home automation. This document does not apply to sEMG
    sensors intended for medical diagnosis or treatment. For medical devices, national
    requirements can apply.
- language: fr
  script: Latn
  content: L'IEC 63203-403-1:2026 spécifie des méthodes d’essai pour les capteurs
    d'électromyographie de surface (EMGs) en évaluant la qualité des signaux d’EMGs
    obtenus à partir de la contraction des muscles de l’avant-bras et de la main pour
    les applications prêtes-à-porter. Il s’applique aux capteurs d’EMGs qui sont utilisés
    pour déchiffrer les intentions de mouvement et les utiliser comme signaux de commande
    dans des situations telles que la réalité virtuelle, les jeux, les véhicules aériens
    sans pilote (UAV, unmanned aerial vehicles), la commande de robot et la domotique.
    Le présent document ne s'applique pas aux capteurs d’EMGs destinés à un diagnostic
    ou à un traitement médical. Pour les dispositifs médicaux, des exigences nationales
    peuvent s'appliquer.
