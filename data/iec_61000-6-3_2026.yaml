- content: "L'IEC 61000-6-3:2026 s'applique uniquement si aucune norme CEM d'émission
    pertinente dédiée à un produit ou une famille de produits n'a été publiée. La
    présente partie de l'IEC 61000 concernant les exigences d'émissions s'applique
    aux appareils électriques et électroniques destinés à être utilisés dans des environnements
    résidentiels (voir le 3.1.21). La présente partie de l'IEC 61000 s'applique également
    aux appareils électriques et électroniques destinés à être utilisés dans des environnements
    n'entrant pas dans le domaine d'application de l'IEC 61000-6-8 ou de l'IEC 61000-6-4.
    L'objectif est que tous les appareils utilisés dans les environnements résidentiels,
    commerciaux et de l'industrie légère soient couverts par l'IEC 61000-6-3 ou l'IEC
    61000-6-8. Les exigences dans l'IEC 61000-6-3 s'appliquent en présence du moindre
    doute. Les appareils qui possèdent une fonction radio (3.1.20) sont inclus dans
    le domaine d'application du présent document. Toutefois, les exigences d'émissions
    spécifiées dans le présent document ne sont pas destinées à s'appliquer aux transmissions
    intentionnelles issues de ces émetteurs radioélectriques, à leurs harmoniques
    et à leurs émissions hors bande. Tous les phénomènes de perturbation n'ont pas
    été inclus pour les besoins de l'essai. Seuls l'ont été ceux considérés comme
    pertinents pour les appareils destinés à fonctionner dans l'environnement couvert
    par le présent document.<br />\r\nLes objectifs du présent document sont les suivants:<br
    />\r\n- établir des exigences qui procurent un niveau adéquat de protection de
    la réception radioélectrique dans la plage de fréquences de 9 kHz à 400 GHz;<br
    />\r\n- établir des exigences qui procurent un niveau adéquat de protection contre
    les perturbations électromagnétiques conduites et rayonnées émises par les appareils
    qui relèvent du domaine d'application du présent document;<br />\r\n- assurer
    la reproductibilité du mesurage et la répétabilité des résultats.<br />\r\nNOTE
    1 Dans certains cas particuliers, des situations sont susceptibles de se produire,
    pour lesquelles les niveaux spécifiés dans le présent document n'offrent pas le
    niveau de protection adéquat; par exemple lorsqu'un récepteur sensible est utilisé
    très proche d'un appareil. Dans de tels cas, des mesures particulières d'atténuation
    peuvent être employées.<br />\r\nNOTE 2 Les perturbations générées dans les conditions
    de défaut de l'appareil ne sont pas couvertes par le présent document.<br />\r\nNOTE
    3 Les exigences du présent document sont plus strictes ou équivalentes aux exigences
    spécifiées dans l'IEC 61000-6-4 et l'IEC 61000-6-8.<br />\r\nCette quatrième édition
    annule et remplace la troisième édition parue en 2020. Cette édition constitue
    une révision technique. Cette édition inclut les modifications techniques majeures
    suivantes par rapport à l'édition précédente:<br />\r\na) ajout d'exigences relatives
    aux émissions de champ magnétique, y compris la mesure de la fonction WPT;<br
    />\r\nb) extension des exigences relatives à l'alimentation secteur en courant
    alternatif basse tension pour couvrir la plage de 9 kHz à 150 kHz;<br />\r\nc)
    ajout des produits avec une fonction radio au domaine d'application;<br />\r\nd)
    ajout de limites dans une FAR pour les appareils montés sur bâti."
