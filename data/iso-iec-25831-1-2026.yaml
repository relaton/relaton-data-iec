abstract:
- language: en
  script: Latn
  content: |-
    <p class="MsoNormal" style="line-height: 115%; background: transparent;">This document is a definition of the technical mechanism to allow a relying party to request one or more verified claims about the end-user and to enable an OpenID provider to provide a relying party with a verified claim ("the tools").</p>
    <p class="MsoNormal" style="line-height: 115%; background: transparent;">Additional facets needed to deploy a complete solution for identity assurance, such as legal aspects (including liability), trust frameworks, or commercial agreements are out of scope. It is up to the particular deployment to complement the technical solution based on this document with the respective definitions ("the rules").</p>
    <p class="MsoNormal" style="line-height: 115%; background: transparent;">Note: Although such aspects are out of scope, the aim of the specification is to enable implementations of the technical mechanism to be flexible enough to fulfill different legal and commercial requirements in jurisdictions around the world. Consequently, such requirements will be discussed in this document as examples.</p>
