abstract:
- language: en
  script: Latn
  content: |-
    IEC 61853-2:2026 establishes IEC requirements for evaluating PV module performance based on power (watts), energy (joule or watthours) and performance ratio. It is written to be applicable to all PV technologies, including bifacial PV modules, but can be unsuitable for any technology where the module performance changes with time (e.g. modules change their behaviour with light or thermal exposure), or which experience significant non-linearities in any of their characteristics used for the modelling.<br/>
    The purpose of document is to define procedures for measuring the effects of angle of incidence of the irradiance on the output power of the device, to determine the operating temperature of a module for a specific set of ambient and mounting conditions and measure the spectral responsivity of the module.
- language: fr
  script: Latn
  content: |-
    IEC 61853-2:2026 établit les exigences de l'IEC relatives à l'évaluation de la performance des modules photovoltaïques en fonction de la puissance (watts), de l'énergie (joules ou watts‑heures) et du coefficient de performance. Cette série est rédigée de façon à pouvoir s'appliquer à toutes les technologies photovoltaïques, y compris les modules photovoltaïques bifaces, mais elle peut ne pas convenir à toute technologie avec laquelle la performance des modules varie avec le temps (par exemple, les modules modifient leur comportement avec l'exposition à la lumière ou l'exposition thermique), ou qui connait des non‑linéarités importantes dans l'une de ses caractéristiques utilisées pour la modélisation.<br/>
    Cette deuxième partie de l'IEC 61853 a pour objet de définir des méthodes pour mesurer les effets de l'angle d'incidence de l'éclairement sur la puissance de sortie du dispositif, de déterminer la température de fonctionnement d'un module pour un ensemble spécifique de conditions ambiantes et de montage, et de mesurer la réponse spectrale du module.
