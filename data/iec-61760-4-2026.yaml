abstract:
- language: en
  script: Latn
  content: |-
    IEC 61760-4:2026 specifies the classification of moisture sensitive device into moisture sensitivity level related to soldering heat, and provisions for packaging, labelling and handling. It extends the classification and packaging methods to such components, where currently existing standards are not required or not appropriate. For such cases, this document introduces additional moisture sensitivity levels and an alternative method for packaging. This document applies to devices intended for reflow soldering, like surface mount devices, including specific through-hole devices (where the device supplier has specifically documented support for reflow soldering), but not to semiconductor devices, and devices for flow (wave) soldering.<br/>
    NOTE Background of this document and its relation to currently existing standards, e.g. IEC 60749‑20 or J-STD-020F and J-STD-033, are described in the Introduction.<br/>
    This edition includes the following significant technical changes with respect to the previous edition:<br/>
    a) The content is updated to cover the classification conditions given in the new editions of J-STD-020F and IEC 60068-2-58.
- language: fr
  script: Latn
  content: |-
    L'IEC 61760-4:2026 spécifie la classification du dispositif sensible à l'humidité en niveau de sensibilité à l'humidité relatif à la chaleur de brasage, et les dispositions relatives à l'emballage, à l'étiquetage et à la manipulation. Elle étend la classification et les méthodes d'emballage à ces composants, lorsque les normes existantes ne sont pas requises ou ne sont pas appropriées. Dans de tels cas, le présent document introduit des niveaux supplémentaires de sensibilité à l'humidité et une méthode alternative d'emballage. Le présent document s'applique aux dispositifs destinés au brasage par refusion, tels que les dispositifs pour montage en surface, y compris les dispositifs spécifiques à trous traversants (lorsque le fournisseur du dispositif dispose d'un support spécifiquement documenté pour le brasage par refusion), mais pas aux dispositifs suivants dispositifs à semiconducteurs,<br/>
    dispositifs de brasage par flux (à la vague).<br/>
    NOTE Le contexte du présent document et sa relation avec les normes existantes, par exemple l'IEC 60749‑20 ou la J-STD-020F et la J-STD-033, sont décrits dans l'Introduction.<br/>
    Cette édition inclut modifications techniques significatives suivantes par rapport à l'édition précédente:<br/>
    a) Le contenu est mis à jour pour couvrir les conditions de classification données dans les nouvelles éditions de la J-STD-020F et de l'IEC 60068-2-58.
