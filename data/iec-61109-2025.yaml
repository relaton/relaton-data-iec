abstract:
- language: en
  script: Latn
  content: |-
    IEC 61109:2025 applies to composite insulators for overhead lines consisting of a load-bearing cylindrical insulating solid core consisting of fibres - usually glass - in a resin-based matrix, a housing (surrounding the insulating core) made of polymeric material and metal end fittings permanently attached to the insulating core. Composite insulators covered by this document are intended for use as suspension/tension line insulators, but these insulators could occasionally be subjected to compression or bending, for example when used as interphase-spacers. Guidance on such loads is outlined in Annex C.<br/>
    The object of this document is to:<br/>
    - define the terms used,<br/>
    - specify test methods,<br/>
    - specify acceptance criteria.<br/>
    This third edition cancels and replaces the second edition published in 2008. This edition constitutes a technical revision.<br/>
    This edition includes the following significant technical changes with respect to the previous edition:<br/>
    - extension of this document to apply both to AC and DC systems;<br/>
    - modifications of Clause 3, Terms, definitions and abbreviations;<br/>
    - removal of Clause 7, Hybrid insulators, from this document;<br/>
    - modifications of tests procedures recently included in IEC 62217 (hydrophobicity transfer test, stress corrosion, water diffusion test on the core with housing);<br/>
    - modifications on environmental conditions;<br/>
    - modifications on classification of tests and include the relevance of the interfaces;<br/>
    - clarification and modification of the parameters determining the need to repeat design and type tests;<br/>
    - revision of Table 1;<br/>
    - revision of electrical type tests;<br/>
    - revision of re-testing procedure of sample test;<br/>
    - addition of a new Annex D on electric field control for AC;<br/>
    - addition of a new Annex E on typical sketch for composite insulators assembly;<br/>
    - addition of a new Annex F on mechanical evaluation of the adhesion between core and housing;<br/>
    - addition of a new Annex G on applicability of design- and type tests for DC applications.
- language: fr
  script: Latn
  content: |-
    L'IEC 61109:2025 s'applique aux isolateurs composites pour lignes aériennes qui sont constitués d'un noyau isolant plein cylindrique réalisé en fibres - généralement de verre - qui supporte les charges. Ces isolateurs possèdent une matrice en résine, un revêtement (recouvrant le noyau isolant) en matériau élastomère et des armatures d'extrémité métalliques fixées au noyau isolant. Les isolateurs composites couverts par le présent document sont destinés à être utilisés pour la suspension ou l'ancrage de lignes, mais ces isolateurs peuvent parfois être sollicités en compression ou en flexion, par exemple lorsqu'ils sont utilisés comme entretoises interphases. L'Annexe C fournit des recommandations pour ces types de charges.<br/>
    L'objet du présent document est de:<br/>
    - définir les termes utilisés;<br/>
    - spécifier les méthodes d'essai;<br/>
    - spécifier les critères acceptation.<br/>
    Cette troisième édition annule et remplace la deuxième édition parue en 2008. Cette édition constitue une révision technique.<br/>
    Cette édition inclut les modifications techniques majeures suivantes par rapport à l'édition précédente:<br/>
    - élargissement du présent document pour inclure les systèmes à courant alternatif et à courant continu;<br/>
    - modifications de l'Article 3, Termes, définitions et abréviations;<br/>
    - suppression de l'Article 7, Isolateurs hybrides, dans le présent document;<br/>
    - modifications des procédures d'essai récemment incluses dans l'IEC 62217 (essai de transfert d'hydrophobie, essai de corrosion sous contrainte, essai de pénétration d'eau - sur le noyau avec le revêtement);<br/>
    - modifications des conditions d'environnement;<br/>
    - modifications de la classification des essais et ajout de la pertinence des interfaces;<br/>
    - clarification et modification des paramètres qui déterminent la nécessité de répéter les essais de conception et de type;<br/>
    - révision du Tableau 1;<br/>
    - révision des essais électriques de type;<br/>
    - révision de la procédure de contre-épreuve de l'essai sur prélèvement;<br/>
    - ajout d'une nouvelle Annexe D sur la maîtrise des champs électriques pour les applications en courant alternatif;<br/>
    - ajout d'une nouvelle Annexe E sur les croquis types pour l'assemblage des isolateurs composites;<br/>
    - ajout d'une nouvelle Annexe F sur l'évaluation mécanique de l'adhérence entre le noyau et le revêtement;<br/>
    - ajout d'une nouvelle Annexe G sur l'applicabilité des essais de conception et de type pour les applications en courant continu.
