abstract:
- language: en
  script: Latn
  content: |-
    IEC 61892-4:2019 is applicable to the selection of electrical cables intended for fixed electrical systems in mobile and fixed offshore units, including pipeline, pumping or "pigging" stations, compressor stations and single buoy moorings, used in the offshore petroleum industry for drilling, production, accommodation, processing, storage and offloading purposes.<br/>
    This document specifies requirements such as those concerning<br/>
    – types of cables,<br/>
    – voltage rating of cables,<br/>
    – cables and wiring for interconnection of equipment,<br/>
    – current-carrying capacities for continuous service,<br/>
    – correction factors for different ambient temperature and for short time duty, and<br/>
    – short-circuit withstand capacity.<br/>
    This document also gives information on the jet fire test for hydrocarbon (HCF) fire resistant cables.<br/>
    The reference to fixed electrical systems includes those subjected to vibration due to the movement of the unit, for example, cables installed on a drag chain, and not those intended for repeated flexing. This document does not cover flexible cables, for example, those used on drilling decks for top-drive, or cables for portable equipment.<br/>
    This document is applicable for cables with a rated voltage up to and including 18/30 kV AC and makes reference to cable standards developed by SC 18A.<br/>
    For higher voltages, relevant standards developed by TC 20 are applicable.<br/>
    This document does not apply to<br/>
    – optical fibre cables,<br/>
    – sub-sea and umbilical cables;,<br/>
    – cables supplying downhole pumps, and<br/>
    – data, telecommunication and radio frequency cables.<br/>
    This second edition cancels and replaces the first edition published in 2007. This edition constitutes a technical revision.<br/>
    This edition includes the following significant technical changes with respect to the previous edition:<br/>
    a) construction requirements for cables have been removed; reference is made to relevant standards from Subcommittee (SC) 18A;<br/>
    b) reference is made to standards from IEC TC 20 for cables with rated voltage above 30 kV;<br/>
    c) tables for current-carrying capacities for defined installations have been removed; reference is made to relevant standards from IEC TC 64;<br/>
    d) requirements as to the sizes of earth continuity conductors not contained in a cable have been moved to IEC 61892-6;<br/>
    e) requirements as to fire stops have been deleted;<br/>
    f) requirements as to tests for cables exposed to drilling fluids have been removed; reference is made to relevant standards from IEC SC 18A;<br/>
    g) the procedure for tests of jet fire resistant cables has been updated;<br/>
    h) requirements as to the design of cable systems have been moved to IEC 61892-2;<br/>
    i) requirements in relation to the installation of cables have been moved to IEC 61892-6.
- language: fr
  script: Latn
  content: |-
    L'IEC 61892-4:2019 s'applique au choix des câbles électriques destinés aux systèmes électriques fixes dans les unités mobiles et fixes en mer, y compris les canalisations, les stations de pompage ou de raclage, les stations de compression et les systèmes d'amarrage à point unique, qui sont utilisés dans l'industrie pétrolière en mer (offshore) pour le forage, la production, les lieux d'habitation, le traitement, le stockage et le déchargement.<br/>
    Le présent document spécifie des exigences pour<br/>
    – les types de câbles,<br/>
    – la tension assignée des câbles,<br/>
    – les câbles et le câblage d'interconnexion des équipements,<br/>
    – les courants admissibles pour le service permanent,<br/>
    – les facteurs de correction pour une température ambiante différente et pour le service temporaire, et<br/>
    – la capacité de tenue au court-circuit.<br/>
    Le présent document fournit également des informations sur l'essai au feu propulsé des câbles résistants aux hydrocarbures (HCF).<br/>
    La référence aux systèmes électriques fixes inclut ceux qui subissent des vibrations dues au mouvement de l'unité (les câbles installés sur une chaîne de halage, par exemple), mais pas ceux destinés à une flexion répétée. Le présent document ne concerne pas les câbles flexibles (ceux utilisés sur un pont de forage, pour les mécanismes d'entraînement supérieur, ou les câbles pour matériel portable, par exemple).<br/>
    Le présent document s'applique aux câbles de tension assignée allant jusqu'à 18/30 kV en courant alternatif inclus et fait référence aux normes de câble développées par le Sous-comité 18A.<br/>
    Pour les tensions supérieures, les normes correspondantes développées par le Comité d'études 20 s'appliquent.<br/>
    Le présent document ne s'applique pas<br/>
    – aux câbles à fibres optiques,<br/>
    – aux câbles sous-marins et câbles ombilicaux,<br/>
    – aux câbles alimentant les pompes de fond, et<br/>
    – aux câbles de données, de télécommunication et haute fréquence.<br/>
    Cette deuxième édition annule et remplace la première édition parue en 2007. Cette édition constitue une révision technique.<br/>
    Cette édition inclut les modifications techniques majeures suivantes par rapport à l'édition précédente:<br/>
    a) les exigences de construction des câbles ont été retirées; il est fait référence aux normes pertinentes du Sous-comité 18A;<br/>
    b) il est fait référence aux normes du Comité d'études 20 de l'IEC pour les câbles dont la tension assignée est supérieure à 30 kV;<br/>
    c) les tableaux relatifs aux courants admissibles pour les installations définies ont été retirés; il est fait référence aux normes pertinentes du Comité d'études 64 de l'IEC;<br/>
    d) les exigences en matière de taille des conducteurs de terre non inclus dans un câble sont déplacées vers l'IEC 61892-6;<br/>
    e) les exigences en matière de coupe-feu ont été supprimées;<br/>
    f) les exigences en matière d'essai des câbles exposés à des boues de forage sont supprimées; il est fait référence aux normes pertinentes du Sous-comité 18A de l'IEC;<br/>
    g) la procédure d'essai des câbles résistants au feu propulsé a été mise à jour;<br/>
    h) les exigences en matière de conception des systèmes de câbles ont été déplacées vers l'IEC 61892-2;<br/>
    i) les exigences d'installation des câbles ont été déplacées vers l'IEC 61892-6.
