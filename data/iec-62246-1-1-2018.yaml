abstract:
- language: en
  script: Latn
  content: |-
    IEC 62246-1-1:2018 is a blank detail specification which defines requirements and tests for reed switches for use in general and industrial applications.<br/>
    This document is intended to be used in conjunction with IEC 62246-1:2015 and specific products standards applying as switching elements.<br/>
    This document selects from IEC 62246-1:2015 and from other sources the appropriate test procedures to be used in detail specifications derived from this specification.<br/>
    Reed switch types are specified depending on characteristic values including functional ratings for safety and tests.<br/>
    This second edition cancels and replaces the first edition published in 2013. This edition constitutes a technical revision.<br/>
    This edition includes the following significant technical changes with respect to the previous editions:<br/>
    a) update of the scope, references and terms and definitions;<br/>
    b) inclusion of guidelines for the preparation of blank detail and detail specifications;<br/>
    c) update of characteristics values including functional ratings for safety;<br/>
    d) update of the quality conformance inspection procedures;<br/>
    e) update of typical applications.
- language: fr
  script: Latn
  content: |-
    L'IEC 62246-1-1:2018 est une spécification particulière-cadre qui définit les exigences et les essais des contacts à lames souples utilisables dans les applications générales et industrielles.<br/>
    Le présent document est destiné à être utilisé conjointement avec l’IEC 62246-1:2015 et des normes de produits spécifiques qui s’appliquent comme des éléments de commutation.<br/>
    Le présent document sélectionne dans l’IEC 62246-1:2015 et dans d'autres sources les procédures d'essai appropriées à utiliser dans le cadre des spécifications particulières dérivées de la présente spécification.<br/>
    Les types de contact à lames souples sont spécifiés en fonction des valeurs caractéristiques, y compris les valeurs assignées de fonctionnement pour la sécurité et les essais.<br/>
    Cette deuxième édition annule et remplace la première édition parue en 2013. Cette édition constitue une révision technique.<br/>
    Cette édition inclut les modifications techniques majeures suivantes par rapport aux éditions précédentes:<br/>
    a) mise à jour du domaine d’application, des références et des termes et définitions;<br/>
    b) inclusion de lignes directrices pour l’élaboration des spécifications particulières-cadres et des spécifications particulières;<br/>
    c) mise à jour des valeurs caractéristiques dont les valeurs assignées de fonctionnement pour la sécurité;<br/>
    d) mise à jour des procédures de contrôle de conformité de la qualité;<br/>
    e) mise à jour d’applications types.
