abstract:
- language: en
  script: Latn
  content: |-
    IEC 60335-2-89:2019 specifies safety requirements for electrically operated commercial refrigerating appliances and ice-makers that have an incorporated motor-compressor or that are supplied in two units for assembly as a single appliance in accordance with the instructions (split system).<br/>
    Examples of appliances that are within the scope of this standard are<br/>
    - refrigerated display and storage cabinets;<br/>
    - refrigerated trolley cabinets;<br/>
    - service counters and self-service counters;<br/>
    - blast chillers and blast freezers;<br/>
    - commercial ice-makers.<br/>
    As far as is practicable, this standard deals with the common hazards presented by these types of appliances including those that use flammable refrigerants and appliances employing R 744 refrigerant.<br/>
    This International Standard is not applicable to appliances with a mass of flammable refrigerant exceeding the limits specified in 22.110 or to appliances with that use refrigerants with a toxicity classification of B according to ISO 817.<br/>
    It does not cover those features of construction and operation of refrigerating appliances that are dealt with in ISO standards.<br/>
    Attention is drawn to the fact that<br/>
    - for appliances intended to be used in vehicles or aboard ships or aircraft, additional requirements can be necessary;<br/>
    - in many countries, additional requirements are specified by national health authorities, the national authorities responsible for the protection of labour, the national water supply authorities and similar authorities.<br/>
    This standard does not apply to<br/>
    - appliances using flammable refrigerant in transcritical refrigeration systems;<br/>
    - domestic refrigerating appliances (IEC 60335-2-24);<br/>
    - split systems having a refrigerant charge of flammable refrigerant exceeding 150 g in any refrigerating circuit;<br/>
    - industrial refrigerating systems;<br/>
    - motor-compressors (IEC 60335-2-34);<br/>
    - commercial dispensing appliances and vending machines (IEC 60335-2-75);<br/>
    - commercial ice-cream appliances;<br/>
    - cold temperature rooms;<br/>
    - multiple refrigerated chambers with a remote motor-compressor.<br/>
    This third edition cancels and replaces the second edition published in 2010, Amendment 1:2012 and Amendment 2:2015. This edition constitutes a technical revision.<br/>
    This edition includes the following significant technical changes with respect to the previous edition:<br/>
    - the text has been aligned with Ed 5.2 of Part 1;<br/>
    - some notes have been deleted or converted to normative text (4, 5.2, 7.6, 22.111, 22.111.1);<br/>
    - some subclauses have been renumbered (22.103, 22.104, 22.105, 22.106, 22.107, 22.109, 22.110, 22.111, 22.112, 22.113, 22.114, 22.115);<br/>
    - requirements for commercial ice-makers have been added (5.7, 5.101, 7.1, 11.8, 19.102);<br/>
    - installation of appliances with a remote refrigerant unit or motor-compressor has been clarified (5.10, 11.2);<br/>
    - installation instructions for appliances with a remote refrigerant unit employing R-744 refrigerant in a transcritical refrigeration system have been added (7.12.1);<br/>
    - a pressure test for appliances employing R-744 refrigerant has been added (22.7);<br/>
    - additional refrigerants have been added to Table 102 and it has been updated to reference only ISO 817 and ISO 5149-1 data;<br/>
    - additional requirements for appliances with a refrigerant charge exceeding 150 g of flammable refrigerant within each refrigerating circuit have been added (7.1, 21.103, 22.108, 22.110, 22.116, 22.117, 22.118, 22.119, 22.120, 22.121, Annex CC);<br/>
    - Annex AA has been modified to cover motors that are supplied at a voltage that is different from the rated voltage of the appliance;<br/>
    - Annex BB has been updated to align with the latest edition of IEC 60079-15.<br/>
    This part 2 is to be used in conjunction with the latest edition of IEC 60335-1 and its amendments. It was established on the basis of the fifth edition (2010) of that standard.<br/>
    The contents of the corrigendum 1 of September 2019, corrigendum 2 of August 2021 and corrigendum 3 of September 2023 have been included in this copy.
- language: fr
  script: Latn
  content: |-
    L'IEC 60335-2-89:2019 spécifie des exigences de sécurité concernant les appareils de réfrigération électriques et les fabriques de glace à usage commercial qui ont un motocompresseur incorporé ou qui sont fournis sous forme de deux unités en vue d'un assemblage en un seul appareil conformément aux instructions (système split).<br/>
    Exemples d'appareils relevant du domaine d'application de la présente norme<br/>
    - meubles frigorifiques de vente et de stockage;<br/>
    - chariots roulants réfrigérés;<br/>
    - comptoirs de service et comptoirs de self-service;<br/>
    - refroidisseurs à jet d'air et congélateurs à jet d'air;<br/>
    - fabriques de glace à usage commercial.<br/>
    Dans la mesure où la pratique le permet, la présente norme traite des dangers courants présentés par ces types d'appareils, y compris ceux qui utilisent des fluides frigorigènes inflammables et les appareils utilisant le fluide frigorigène R 744.<br/>
    La présente Norme internationale n'est pas applicable aux appareils dont la masse de fluide frigorigène inflammable est supérieure aux limites spécifiées en 22.110, ou aux appareils qui utilisent des fluides frigorigènes de classification de toxicité B selon l'ISO 817.<br/>
    Elle ne traite pas des caractéristiques de construction et de fonctionnement des appareils de réfrigération qui font l'objet de normes ISO.<br/>
    L'attention est attirée sur le fait que<br/>
    - pour les appareils destinés à être utilisés dans des véhicules ou à bord de navires ou d'avions, des exigences supplémentaires peuvent être nécessaires;<br/>
    - dans de nombreux pays, des exigences complémentaires sont spécifiées par les organismes nationaux de la santé, par les organismes nationaux responsables de la protection des travailleurs, par les organismes nationaux responsables de l'alimentation en eau et par des organismes similaires.<br/>
    La présente norme ne s'applique pas aux<br/>
    - appareils utilisant des fluides frigorigènes inflammables dans des systèmes de réfrigération transcritiques;<br/>
    - appareils de réfrigération à usage domestique (IEC 60335-2-24);<br/>
    - systèmes split ayant une charge de fluide frigorigène inflammable dépassant 150 g dans tout circuit de réfrigération;<br/>
    - systèmes de réfrigération industriels;<br/>
    - motocompresseurs (IEC 60335-2-34);<br/>
    - distributeurs commerciaux avec ou sans moyen de paiement (IEC 60335-2-75);<br/>
    - sorbetières à usage commercial;<br/>
    - chambres froides;<br/>
    - chambres réfrigérées multiples à motocompresseur à distance.<br/>
    Cette troisième édition annule et remplace la deuxième édition parue en 2010, son Amendement 1:2012 et son Amendement 2:2015. Cette édition constitue une révision technique.<br/>
    Cette édition inclut les modifications techniques majeures suivantes par rapport à l'édition précédente:<br/>
    - le texte a été aligné sur l'Édition 5.2 de la Partie 1;<br/>
    - certaines notes ont été supprimées ou converties en texte normatif (4, 5.2, 7.6, 22.111, 22.111.1);<br/>
    - certains paragraphes ont été renumérotés (22.103, 22.104, 22.105, 22.106, 22.107, 22.109, 22.110, 22.111, 22.112, 22.113, 22.114, 22.115);<br/>
    - des exigences concernant les fabriques de glace à usage commercial ont été ajoutées (5.7, 5.101, 7.1, 11.8, 19.102);<br/>
    - l'installation des appareils avec une unité de fluide frigorigène ou un motocompresseur à distance a été clarifiée (5.10, 11.2);<br/>
    - des instructions d'installation des appareils avec une unité de fluide frigorigène à distance utilisant du R-744 dans un système de réfrigération transcritique ont été ajoutées (7.12.1);<br/>
    - un essai de pression pour les appareils utilisant du fluide frigorigène R-744 a été ajouté (22.7);<br/>
    - des fluides frigorigènes supplémentaires ont été ajoutés au Tableau 102, qui a été mis à jour et ne référence plus que les données de l'ISO 817 et de l'ISO 5149-1;<br/>
    - des exigences complémentaires ont été ajoutées concernant les appareils dont la charge frigorigène est supérieure à 150 g de fluide frigorigène inflammable dans chaque circuit de réfrigération (7.1, 21.103, 22.108, 22.110, 22.116, 22.117, 22.118, 22.119, 22.120, 22.121, Annexe CC);<br/>
    - l'Annexe AA a été modifiée afin de couvrir les moteurs alimentés à une tension différente de la tension assignée de l'appareil;<br/>
    - l'Annexe BB a été mise à jour en vue de son alignement sur la dernière édition de l'IEC 60079-15.<br/>
    La présente partie 2 doit être utilisée conjointement avec la dernière édition de l'IEC 60335-1 et ses amendements. Elle a été établie sur la base de la cinquième édition (2010) de cette norme.<br/>
    Le contenu du corrigendum 1 de septembre 2019, le corrigendum 2 d'août 2021 et le corrigendum 3 de septembre 2023 a été pris en considération dans cet exemplaire.
