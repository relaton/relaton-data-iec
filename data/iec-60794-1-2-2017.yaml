abstract:
- language: en
  script: Latn
  content: "IEC 60794-1-2: 2017 applies to optical fibre cables for use with telecommunications
    equipment and devices employing similar techniques, and to cables having a combination
    of both optical fibres and electrical conductors. The prime objective of this
    document is to provide the end user with an overview about the content of different
    parts of the IEC 60794-1 series numbered -2X. Table 1 shows the different parts.
    <br/>\nTable 1 – Document overview\n\n\t\n\t\t\n\t\t\t<strong>Test methods</strong>\n\t\t\t<strong>IEC
    reference</strong>\n\t\t\n\t\t\n\t\t\tGeneral guidance\n\t\t\tIEC 60794-1-2\n\t\t\n\t\t\n\t\t\tMethods
    E – Mechanical\n\t\t\tIEC 60794-1-21\n\t\t\n\t\t\n\t\t\tMethods F – Environmental\n\t\t\tIEC
    60794-1-22\n\t\t\n\t\t\n\t\t\tMethods G – Cable elements\n\t\t\tIEC 60794-1-23\n\t\t\n\t\t\n\t\t\tMethods
    H – Electrical\n\t\t\tIEC 60794-1-24\n\t\t\n\t\t\n\t\t\tNOTE Several numbers in
    the test method numbering sequence are missing. The reasons for these omissions
    are historical. To avoid confusion, the existing numbering sequence has been retained.\n\t\t\n\t\n\n\n
    \nThese documents define test procedures to be used in establishing uniform requirements
    for the geometrical, transmission, material, mechanical, ageing (environmental
    exposure) and climatic properties of optical fibre cables, and electrical requirements
    where appropriate. Throughout the documents, the wording \"optical cable\" can
    also include optical fibre units, microduct fibre units, etc.  The secondary objective
    of this document is to provide the end user with useful guidance when testing
    optical fibre cables.  This fourth edition cancels and replaces the third edition
    published in 2013 and IEC 60794­-1­-20 published in 2014. This edition constitutes
    a technical revision. This edition includes the following significant technical
    changes with respect to the previous edition and to IEC 60794-1-20:<br/>\n- the
    multiple cross-reference tables have been deleted and replaced with a higher level
    one related to the generic standards;<br/>\n- all pertinent text from IEC 60794-1-20
    has been included;<br/>\n- standard optical test wavelengths have been introduced;<br/>\n-
    this document has been streamlined by cross-referencing IEC 60794-1-1;<br/>\n-
    the \"No change in attenuation\" definitions contained in IEC 60794-1-20 have
    been transferred to IEC 60794-1-1;<br/>\n- the title has been modified to reflect
    the contents of the new edition.<br/>\nThis publication is to be read in conjunction
    with IEC 60794-1-1:2015."
- language: fr
  script: Latn
  content: "IEC 60794-1-2: 2017 s’applique aux câbles à fibres optiques destinés à
    être utilisés avec les équipements de télécommunications et les dispositifs utilisant
    des techniques analogues, ainsi qu'aux câbles constitués d'une combinaison de
    fibres optiques et de conducteurs électriques.  L'objectif principal du présent
    document est de fournir à l'utilisateur final une vue d'ensemble sur le contenu
    des différentes parties de la série IEC 60794-1 portant le numéro -2X. Le Tableau
    1 présente les différentes parties. <br/>\nTableau 1– Vue d'ensemble des documents\n\n\t\n\t\t\n\t\t\t<strong>Méthodes
    d'essai</strong>\n\t\t\t<strong>Référence IEC</strong>\n\t\t\n\t\t\n\t\t\tLignes
    directrices générales\n\t\t\tIEC 60794-1-2\n\t\t\n\t\t\n\t\t\tMéthodes E – Essais
    mécaniques\n\t\t\tIEC 60794-1-21\n\t\t\n\t\t\n\t\t\tMéthodes F – Essais environnementaux\n\t\t\tIEC
    60794-1-22\n\t\t\n\t\t\n\t\t\tMéthodes G – Eléments du câble\n\t\t\tIEC 60794-1-23\n\t\t\n\t\t\n\t\t\tMéthodes
    H – Essais électriques\n\t\t\tIEC 60794-1-24\n\t\t\n\t\t\n\t\t\tNOTE Plusieurs
    numéros de la séquence de numérotation de la méthode d'essai sont manquants. Les
    raisons de ces omissions sont historiques. Afin d'éviter toute confusion, la séquence
    de numérotation existante a été retenue.\n\t\t\n\t\n\n\n \nCes documents définissent
    les procédures d’essai à utiliser pour établir des exigences uniformes relatives
    aux caractéristiques géométriques, de transmission, de matériaux, mécaniques,
    de vieillissement (exposition à l'environnement) et climatiques des câbles à fibres
    optiques, ainsi que des exigences électriques, le cas échéant. Tout au long des
    documents, l'expression \"câble optique\" peut également inclure des unités de
    fibres optiques, des unités de fibres en microconduits, etc.  Le deuxième objectif
    de ce document est de fournir à l'utilisateur final des lignes directrices utiles
    lors de l'essai de câbles à fibres optiques. Cette quatrième édition annule et
    remplace la troisième édition publiée en 2013 et l'IEC 60794-1-20 publiée en 2014.
    Cette édition constitue une révision technique. Cette édition inclut les modifications
    techniques majeures suivantes par rapport à l'édition précédente et à l'IEC 60794-1-20:<br/>\n-
    suppression des tableaux des références croisées multiples et remplacement par
    un table plus général en lien avec les normes génériques;<br/>\n- insertion de
    tout le texte pertinent de l'IEC 60794-1-20;<br/>\n- introduction de longueurs
    d'ondes d'essais optiques normalisées;<br/>\n- simplification du présent document
    par établissement de correspondances avec l'IEC 60794‑1­1;<br/>\n- transfert dans
    l'IEC 60794-1-1 des définitions \"Absence de variation de l'affaiblissement\"
    contenues dans l'IEC 60794-1-20;<br/>\n- modification du titre pour refléter le
    contenu de la nouvelle édition.<br/>\nCette publication doit être lue conjointement
    avec l’IEC 60794-1-1:2015.<br/>\nMots clés : fibres optiques destinés à être utilisés
    avec les équipements de télécommunications"
