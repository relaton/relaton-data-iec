abstract:
- language: en
  script: Latn
  content: |-
    IEC TR 63388:2021 introduces the widely used technical scheme of cogeneration (also known as combined heat and power (CHP)), and gives the corresponding cases. The technical schemes of cogeneration covered in this technical report can be divided into two categories. One is cogeneration based on steam turbine, which is generally applied in thermal power plants; The other is cogeneration based on other prime movers, such as fuel cell, micro gas turbine, internal combustion engine, Stirling engine, ORC, etc.<br/>
    This document gives some cases of cogeneration, mainly including:<br/>
    • CHP based on extraction turbine;<br/>
    • CHP based on back pressure turbine;<br/>
    • Low-vacuum heating mode;<br/>
    • LP cylinder steam bypassed heating mode;<br/>
    • CHP based on steam turbine with synchro-self-shift clutches;<br/>
    • Gas-steam combined cycle CHP;<br/>
    • Micro gas turbine CHP;<br/>
    • Stirling engine CHP;<br/>
    • Fuel cell CHP; and<br/>
    • ORC CHP.<br/>
    The characteristics, components and technical requirements of these technical schemes are introduced in this document.<br/>
    By collecting existing standards of CHP, this document also identifies the gaps of CHP standardization and put forward a roadmap for future CHP standards.<br/>
    This document is prepared based on limited expert resources. Thus, some cogeneration cases could not be covered in this document, such as:<br/>
    • Solar cogeneration; and<br/>
    • Internal combustion engine cogeneration.
