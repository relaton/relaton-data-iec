abstract:
- language: en
  script: Latn
  content: |-
    IEC 61514-2:2026 specifies design reviews and tests intended to measure and determine the static and dynamic performance, the degree of intelligence and the communication capabilities of single-acting or double-acting intelligent valve positioners. The tests can be applied to positioners which receive standard analogue electrical input signals (as specified in IEC 60381-1 or IEC 60381-2) and/or digital signals via a data communication link (for example Fieldbus) and have a pneumatic output. An intelligent valve positioner as defined in Clause 3 is an instrument that uses for performing its functions digital techniques for data processing, decision-making and bi-directional communication. It can be equipped with additional sensors and additional functionality supporting the main function. The performance testing of an intelligent valve positioner is conducted with the positioner mounted on and connected to the actuator/valve assembly the positioner is used on. The specific characteristic parameters of the actuator/valve combination such as size, stroke, friction, type of packing, spring package and supply pressure for the pneumatic part has significant impact on the performance of a positioner. The methods of evaluation given in this document are intended for testing laboratories to verify equipment performance specifications. The manufacturers of intelligent positioners are urged to apply this document at an early stage of development.<br/>
    This document is intended to provide guidance for designing evaluations of intelligent valve positioners by providing:<br/>
    - a checklist for reviewing their hardware and software design in a structured way;<br/>
    - test methods for measuring and qualifying their performance under various environmental and operational conditions;<br/>
    - methods for reporting the data obtained.<br/>
    When a full evaluation, in accordance with this document, is not required or possible, the tests which are required are performed and the results reported in accordance with the relevant clauses of this document. In such cases, the test report will state that it does not cover the full number of tests specified herein. Furthermore, the items omitted are mentioned, to give the reader of the report a clear overview. This document is also applicable for non-intelligent microprocessor-based valve positioners without means for bi-directional communication. In that case an evaluation will be reduced to a limited programme of performance testing and a review of the construction. This third edition cancels and replaces the second edition published in 2013. This edition constitutes a technical revision.<br/>
    This edition includes the following significant technical changes with respect to the previous edition:<br/>
    a) in 5.5.2, the standard for the measurements of influence quantities has been changed to IEC 62828-1:2026;<br/>
    b) all references to IEC 61514 have been updated to IEC 61514:2026;<br/>
    c) the aspect of cyber-security has been added in 4.2.7 and 4.2.9.<br/>
    This document is to be used in conjunction with IEC 61514:2026.
- language: fr
  script: Latn
  content: |-
    L'IEC 61514-2:2026 spécifie les revues de conception et les essais destinés à mesurer et déterminer les performances statiques et dynamiques, le niveau d'intelligence et les capacités de communication des positionneurs de vanne intelligents à simple ou double effet. Les essais peuvent s’appliquer aux positionneurs qui reçoivent des signaux d’entrée électriques analogiques normalisés (tels que ceux spécifiés dans l’IEC 60381‑1 ou l’IEC 60381‑2) et/ou des signaux numériques par l’intermédiaire d’une liaison de communication de données (par exemple Fieldbus) et qui comportent une sortie pneumatique. Un positionneur de vanne intelligent tel que défini à l'Article 3 est un instrument qui utilise, pour remplir ses fonctions, des techniques numériques de traitement des données, de prise de décision et de communication bidirectionnelle. Il peut être équipé de capteurs et de fonctionnalités supplémentaires venant à l’appui de la fonction principale. Les essais de performance d’un positionneur de vanne intelligent sont effectués avec le positionneur monté et connecté à l’ensemble actionneur/vanne sur lequel le positionneur est utilisé. Les paramètres caractéristiques spécifiques de la combinaison actionneur/vanne, tels que la taille, la course, le frottement, le type de garniture, le bloc ressort et la pression d'alimentation pour la partie pneumatique, ont un impact significatif sur les performances d’un positionneur. Les méthodes d’évaluation spécifiées dans le présent document sont destinées aux laboratoires d'essai afin de vérifier les spécifications de performance du matériel. Les fabricants de positionneurs intelligents sont invités à appliquer le présent document à un stade de développement précoce.<br/>
    Le présent document est destiné à donner des recommandations pour la conception des évaluations de positionneurs de vanne intelligents et fournit à cet effet:<br/>
    - une liste de contrôle permettant de revoir la conception de leurs matériels et logiciels de manière structurée;<br/>
    - des méthodes d'essai pour mesurer et qualifier leurs performances dans diverses conditions environnementales et opérationnelles;<br/>
    - des méthodes de compte-rendu des données obtenues.<br/>
    Lorsqu’une évaluation complète conforme au présent document n’est ni exigée ni possible, les essais exigés sont effectués et leurs résultats sont rapportés conformément aux articles pertinents du présent document. Dans ces cas, le rapport d’essai précisera qu’il ne couvre pas la totalité des essais spécifiés ici. En outre, les éléments omis sont mentionnés afin de donner au lecteur du rapport une vue d'ensemble claire. Le présent document s'applique également aux positionneurs de vanne à microprocesseurs non intelligents, sans moyens de communication bidirectionnelle. Dans ce cas, l'évaluation sera réduite à un programme limité d'essais de performance et à une revue de la construction. Cette troisième édition annule et remplace la deuxième édition parue en 2013. Cette édition constitue une révision technique.<br/>
    Cette édition inclut les modifications techniques majeures suivantes par rapport à l’édition précédente:<br/>
    a) en 5.5.2, la norme relative aux mesurages des grandeurs d’influence a été remplacée par l’IEC 62828‑1:2026;<br/>
    b) toutes les références à l’IEC 61514 ont été mises à jour et remplacées par IEC 61514:2026;<br/>
    c) l’aspect de cybersécurité a été ajouté en 4.2.7 et 4.2.9.<br/>
    Le présent document doit être utilisé conjointement avec l’IEC 61514:2026.
