abstract:
- language: en
  script: Latn
  content: |-
    IEC 60695-1-12:2026 specifies methodologies of fire safety engineering for electrotechnical products by providing:<br/>
    - an explanation of the principles and uses of fire safety engineering;<br/>
    - guidance on the use of fire safety engineering in the design of electrotechnical products;<br/>
    - fire safety engineering terminology, and concepts;<br/>
    - an indication of properties, data and tests needed for input into fire safety engineering assessment; and<br/>
    - informative references.<br/>
    This document is intended to provide guidance for product committees on fire safety engineering methods and performance-based tests for use in performance-based designs and fire hazard assessments of electrotechnical materials, assemblies, products and systems. More detailed information on fire safety engineering is contained in ISO 23932‑1. This basic safety publication focusing on safety guidance is primarily intended for use by committees in the preparation of safety publications in accordance with the principles laid down in IEC Guide 104 and ISO/IEC Guide 51. This second edition cancels and replaces the first edition published in 2015. This edition constitutes a technical revision.<br/>
    This edition includes the following significant technical changes with respect to the previous edition:<br/>
    a) whole text is renewed to contain the most recent technologies of fire safety engineering mainly developed by ISO/TC92 Fire safety SC4 Fire safety engineering.<br/>
    b) Annex A is changed to show example of application of FSE in an international standard.
- language: fr
  script: Latn
  content: |-
    L'IEC 60695-1-12:2026 spécifie les méthodes d'ingénierie de la sécurité incendie pour les produits électrotechniques, en fournissant notamment:<br/>
    - une explication des principes et des usages de l'ingénierie de la sécurité incendie;<br/>
    - des recommandations relatives à l'usage de l'ingénierie de la sécurité incendie dans la conception des produits électrotechniques;<br/>
    - la terminologie et les concepts relatifs à l'ingénierie de la sécurité incendie;<br/>
    - une indication des propriétés, données et essais nécessaires pour alimenter les évaluations d'ingénierie de la sécurité incendie; et<br/>
    - des références informatives.<br/>
    Le présent document vise à fournir des recommandations aux comités de produits concernant les méthodes d'ingénierie de la sécurité incendie et les essais axés sur les performances utilisables pour les conceptions axées sur les performances et les évaluations des risques du feu des matériaux, ensembles, produits et systèmes électrotechniques. L'ISO 23932-1 fournit des informations plus détaillées sur l'ingénierie de la sécurité incendie. La présente publication fondamentale de sécurité qui porte sur des recommandations de sécurité est principalement destinée à être utilisée par les comités dans le cadre de l'élaboration de publications de sécurité conformément aux principes établis dans le Guide 104 de l'IEC et le Guide 51 de l'ISO/IEC. Cette deuxième édition annule et remplace la première édition parue en 2015. Cette édition constitue une révision technique.<br/>
    Cette édition inclut les modifications techniques significatives suivantes par rapport à l'édition précédente:<br/>
    a) l'ensemble du texte est actualisé pour contenir les technologies les plus récentes en matière d'ingénierie de la sécurité incendie principalement développées par l'ISO/TC 92 Sécurité au feu SC4 Ingénierie de la sécurité incendie.<br/>
    b) L'Annexe A est modifiée pour illustrer un exemple d'application de l'ISI dans une norme internationale.
