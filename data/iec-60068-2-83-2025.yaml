  content: |-
    <!-- NEW! -->IEC 60068-2-83:2025 is available as IEC 60068-2-83:2025 RLV which contains the International Standard and its Redline version, showing all changes of the technical content compared to the previous edition.<br/>
    <br/>
    IEC 60068-2-83:2025 provides methods for comparative investigation of the wettability of the metallic terminations or metallized terminations of SMDs with solder paste. Data obtained by these methods are not intended to be used as absolute quantitative data for pass/fail purposes.<br/>
    NOTE Different solderability test methods for SMD are described in IEC 60068‑2‑58 and IEC 60068‑2‑69. IEC 60068‑2‑58 specifies visual evaluation using solder bath and reflow method, IEC 60068‑2‑69 specifies wetting balance evaluation using solder bath and solder globule method.<br/>
    This edition includes the following significant technical change with respect to the previous edition:<br/>
    a) revise Clause 5 to align with that in IEC 60068‑2‑20:2021.
- language: fr
  script: Latn
  content: |-
    <!-- NEW! -->IEC 60068-2-83:2025 est disponible sous forme de IEC 60068-2-83:2025 RLV qui contient la Norme internationale et sa version Redline, illustrant les modifications du contenu technique depuis l'�dition pr�c�dente.<br/>
    <br/>
    L’IEC 60068-2-83:2025 fournit des méthodes d’enquêtes comparatives sur la mouillabilité des terminaisons métalliques ou métallisées des composants montés en surface (CMS) avec de la pâte à braser. Ces méthodes ne servent pas à fournir des données quantitatives absolues utilisées dans le cadre d’acceptations ou de rejets.<br/>
    NOTE Différentes méthodes d’essai de brasabilité pour composants montés en surface (CMS) sont décrites dans l’IEC 60068‑2‑58 et dans l’IEC 60068‑2‑69. L’IEC 60068‑2‑58 spécifie une évaluation visuelle utilisant un bain de brasage et la méthode de refusion, l’IEC 60068‑2‑69 spécifie une évaluation par balance de mouillage utilisant la méthode du bain de brasage et des gouttelettes/globules de brasure.<br/>
    Cette édition inclut la modification technique majeure suivante par rapport à l’édition précédente:<br/>
    a) révision de l’Article 5 pour l’aligner sur celui de l’IEC 60068‑2‑20:2021.
