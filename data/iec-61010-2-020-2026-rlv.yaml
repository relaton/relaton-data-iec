abstract:
- language: en
  script: Latn
  content: |-
    IEC 61010-2-020:2026 RLV contains both the official IEC International Standard and its Redline version. The Redline version is available in English only and provides you with a quick and easy way to compare all the changes between the official IEC Standard and its previous edition.<br/>
    <br/>
    IEC 61010-2-020:2026 is applicable to electrically powered laboratory centrifuges. It is possible that all or part of the equipment falls within the scope of one or more other Part 2 standards of IEC 61010 as well as within the scope of this document. In that case, the requirements of those other Part 2 standards will also apply. This fourth edition cancels and replaces the third edition published in 2016. This edition constitutes a technical revision.<br/>
    This edition includes the following significant technical changes with respect to the previous edition:<br/>
    a) alignment with changes introduced by Amendment 1:2016 of IEC 61010-1:2010.<br/>
    It has the status of a product safety publication in accordance with IEC Guide 104.<br/>
    This Part 2-020 is intended to be used in conjunction with the latest edition of IEC 61010-1. It was established on the basis of the third edition (2010) and its Amendment 1 (2016), hereinafter referred to as Part 1.<br/>
    This Part 2-020 supplements or modifies the corresponding clauses in IEC 61010-1 so as to convert that publication into the IEC standard: Particular requirements for laboratory centrifuges.<br/>
    Where a particular subclause of IEC 61010-1 is not mentioned in this Part 2-020, that subclause applies as far as is reasonable. Where this Part 2-020 states "addition", "modification" or "replacement", the relevant requirement, test specification or note in IEC 61010-1 shall be adapted accordingly.
