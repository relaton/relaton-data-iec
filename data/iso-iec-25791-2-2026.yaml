abstract:
- language: en
  script: Latn
  content: |-
    <p>This part of the document specifies the method of</p>
    <ul>
    <li>applications to obtain the OAuth tokens in an appropriately secure manner for higher risk access to data;</li>
    <li>applications to use OpenID Connect to identify the customer; and</li>
    <li>using tokens to interact with the REST endpoints that provides protected data.</li>
    </ul>
    <p>This document is applicable to higher risk use cases which includes commercial and investment banking and other similar industries.</p>
