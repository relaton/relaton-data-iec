abstract:
- language: en
  script: Latn
  content: |-
    IEC 60335-2-27:2024 EXV contains both the international standard and its extended version (EXV). This extended version of the official IEC Standard is available in English only and provides the user with a comprehensive content of the Standard. IEC 60335-2-27:2024 EXV includes the content of the references made to IEC 60335-1:2020.<br/>
    <br/>
    IEC 60335-2-27:2024 deals with the safety of electrical appliances incorporating emitters for exposing the skin to optical radiation (wavelength 100 nm to 1 mm), for household and similar use, their rated voltage being not more than 250 V for single-phase appliances and 480 V for other appliances including direct current (DC) supplied appliances and battery-operated appliances. As far as practicable, this standard deals with the common hazards presented by appliances that are encountered by all persons using the appliances in tanning salons, beauty parlours and similar premises or at home. However, in general, it does not take into account<br/>
    - persons (including children) whose physical, sensory or mental capabilities; or lack of experience and knowledge prevents them from using the appliance safely without supervision or instruction;<br/>
    - children playing with the appliance.<br/>
    Attention is drawn to the fact that<br/>
    - for appliances intended to be used in vehicles or on board ships or aircraft, additional requirements can be necessary;<br/>
    - in many countries, additional requirements are specified by the national health authorities, the national authorities responsible for the protection of labour and similar authorities.<br/>
    This standard does not apply to<br/>
    - appliances for skin or hair care (IEC 60335-2-23);<br/>
    - sauna heating appliances and infrared cabins (IEC 60335-2-53);<br/>
    - cosmetic and beauty care appliances incorporating lasers and intense light sources (IEC 60335-2-113);<br/>
    - appliances for medical purposes (IEC 60601);<br/>
    - appliances that use UV radiation for purposes other than tanning the skin;<br/>
    - appliances intended to be used in locations where special conditions prevail, such as the presence of a corrosive or explosive atmosphere (dust, vapour or gas).<br/>
    This seventh edition cancels and replaces the sixth edition published in 2019. This edition constitutes a technical revision.<br/>
    This edition includes the following significant technical changes with respect to the previous edition:<br/>
    a) alignment with IEC 60335-1:2020;<br/>
    b) modification or conversion of some notes to normative text (Clause 1, 7.1);<br/>
    c) clarification of product risk and liability (7.1);<br/>
    d) modification of Annex DD as a normative annex, and modification of relevant text (7.12, Annex DD);<br/>
    e) clarification of requirement for product use links provided (7.12.9);<br/>
    f) clarification of the application of test probe 18 for appliances for use in tanning salons, beauty parlours and similar premises (8.1.1, 20.2);<br/>
    g) introduction of accessible surface temperature limits (Clause 11);<br/>
    h) removal of redundancy between 22.113 and 22.114;<br/>
    i) clarification that 32.2 is not applicable for UV emitted for the tanning function of the appliance.<br/>
    This part 2 is to be used in conjunction with the latest edition of IEC 60335-1 and its amendments unless that edition precludes it; in that case, the latest edition that does not preclude it is used. It was established on the basis of the sixth edition (2020) of that standard.<br/>
    The content of the corrigendum 1 (2025-12) has been included in this copy.
