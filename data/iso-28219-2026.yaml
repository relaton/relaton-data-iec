abstract:
- language: en
  script: Latn
  content: |-
    <p class="MsoBodyText">The purpose of this document is to establish the machine-readable (linear, two-dimensional, and composite symbols) and human-readable content for direct marking and labelling of items, parts, and components.</p>
    <p class="MsoBodyText">This document provides a means for items, parts and components to be marked, and read in either fixtured or hand-held scanning environments at any manufacturer’s facility and then read by customers purchasing items for subsequent manufacturing operations or for final end use. Intended applications include, but are not limited to, supply chain applications, e.g. inventory, distribution, manufacturing, quality control, acquisition, transportation, supply, repair and disposal.</p>
