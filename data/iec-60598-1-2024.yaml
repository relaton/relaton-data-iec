abstract:
- language: en
  script: Latn
  content: |-
    IEC 60598-1:2024 specifies general safety requirements for luminaires, incorporating electric light sources for operation from supply voltages up to 1 000 V. Requirements for semi-luminaires are included in this document.<br/>
    This tenth edition cancels and replaces the ninth edition published in 2020. This edition constitutes a technical revision.<br/>
    This edition includes the following significant technical changes with respect to the previous edition:<br/>
    a) new structure to comply with the ISO/IEC Directives, Part 2;<br/>
    b) addition of a new Annex V for comparison with the previous edition;<br/>
    c) revision of 7.32 for SPDs and for SPCs;<br/>
    d) the terms "live part" and "active part" were reviewed and aligned with the definitions of "live part" and "hazardous live part" given in IEC 60050-195;<br/>
    e) revision of 7.14.2 for conductor mechanical stress;<br/>
    f) revision of 14.5.2, Item 4 to include controlgear;<br/>
    g) revision of 9.2.1 (Earthing) with the deletion of the word "permanently";<br/>
    h) revision of Annex N: earth continuity test time;<br/>
    i) revision of 7.11.4; 7.14.1; Table 22 (14.4.3): Introduction of requirements for suspension by magnets;<br/>
    j) addition of a new Annex W for luminaires using batteries;<br/>
    k) clarification of Clause 6 for marking requirements for nature of supply;<br/>
    l) addition of a new Subclause 7.31.5: Additional requirements for luminaires using controllable controlgear providing SELV output(s);<br/>
    m) revision of 6.4.16: Information to be provided for luminaire having protective earth current &gt; 10 mA;<br/>
    n) revision of 6.3.23; 6.4.18; 6.4.24; 7.30 and 10.2.1 for serviceable, non-user serviceable and non-serviceable components;<br/>
    o) revision of Annex D: Draught-proof enclosure;<br/>
    p) revision of 8.2.1 and 13.2.1: Inconsistencies in the inclusion of the limits of voltage ranges;<br/>
    q) revision of 9.2.10 for looping-in;<br/>
    r) Revision of Clause 2 and 7.8: update of the reference to IEC 61058-1-1, IEC 61058-1-2 and IEC 61058­2­1. Update of temperature limits in Table 21 (14.4.3) for luminaires incorporating switches according to IEC 60669-1 or IEC 60669-2-1;<br/>
    s) revision of 6.3.22 and 7.24 for photobiological safety;<br/>
    t) addition of a new Subclause 6.3.27 for marking of mains socket outlet moved from information requirements.
- language: fr
  script: Latn
  content: |-
    L'IEC 60598-1:2024 spécifie les exigences de sécurité générales pour les luminaires qui incorporent des sources de lumière électriques destinées à fonctionner avec des tensions d'alimentation jusqu'à 1 000 V. Les exigences relatives aux semi-luminaires sont incluses dans le présent document.<br/>
    Cette dixième édition annule et remplace la neuvième édition parue en 2020. Cette édition constitue une révision technique.<br/>
    Cette édition inclut les modifications techniques majeures suivantes par rapport à l'édition précédente:<br/>
    a) nouvelle structure conforme aux Directives ISO/IEC, Partie 2;<br/>
    b) ajout d'une nouvelle Annexe V pour comparaison à l'édition précédente;<br/>
    c) révision du 7.32 pour SPD et pour SPC;<br/>
    d) examen et alignement des termes "partie sous-tension" et "partie active" sur les définitions des termes "parties actives" et "parties actives dangereuses" données dans l'IEC 60050‑195;<br/>
    e) révision du 7.14.2 pour la contrainte mécanique des conducteurs;<br/>
    f) révision du 14.5.2, Point 4 pour inclure l'appareillage de commande;<br/>
    g) révision du 9.2.1 (Mise à la terre) avec suppression de l'expression "de manière permanente";<br/>
    h) révision de l'Annexe N: temps d'essai de continuité de la terre;<br/>
    i) révision du 7.11.4, du 7.14.1 et du Tableau 22 (14.4.3): introduction d'exigences relatives à la suspension par des aimants;<br/>
    j) ajout d'une nouvelle Annexe W pour les luminaires qui utilisent des batteries;<br/>
    k) clarification de l'6 pour les exigences de marquage du type d'alimentation;<br/>
    l) ajout d'un nouveau 7.31.5: exigences supplémentaires pour les luminaires qui utilisent des appareillages commandables qui fournissent une ou plusieurs sorties TBTS;<br/>
    m) révision du 6.4.16: informations à fournir pour un luminaire qui a un courant de terre de protection &gt; 10 mA;<br/>
    n) révision du 6.3.23, du 6.4.18, du 6.4.24, du 7.30 et du 10.2.1 pour les composants remplaçables, non remplaçable par l'utilisateur final et non remplaçables;<br/>
    o) révision du Annexe D: enceinte à air calme;<br/>
    p) révision du 8.2.1 et du 13.2.1: incohérences dans l'inclusion des limites des plages de tensions;<br/>
    q) révision du 9.2.10 pour le repiquage;<br/>
    r) révision de l'Article 2 et du 7.8: mise à jour de la référence à l'IEC 61058-1-1, à l'IEC 61058‑1-2 et à l'IEC 61058­2­1. Mise à jour des limites de température du Tableau 21 (14.4.3) pour les luminaires qui comportent des interrupteurs conformément à l'IEC 60669‑1 ou à l'IEC 60669-2-1;<br/>
    s) révision du 6.3.22 et du 7.24 pour la sécurité photobiologique;<br/>
    t) ajout d'un nouveau 6.3.27 pour le marquage des socles de prise de courant réseau, déplacé des exigences relatives aux informations.
