  content: |-
    <p class="MsoBodyText">This document describes the properties, related risk factors, available methods and processes relating to:</p>
    <p class="ListContinue1" style="mso-list: l0 level1 lfo1;"><!-- [if !supportLists]-->—     <!--[endif]-->use of AI inside a safety related function to realize the functionality;</p>
    <p class="ListContinue1" style="mso-list: l0 level1 lfo1;"><!-- [if !supportLists]-->—     <!--[endif]-->use of non-AI safety related functions to ensure safety for an AI controlled equipment;</p>
    <p class="ListContinue1" style="mso-list: l0 level1 lfo1;"><!-- [if !supportLists]-->—     <!--[endif]-->use of AI systems to design and develop safety related functions.</p>
