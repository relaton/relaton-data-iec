abstract:
- language: en
  script: Latn
  content: |-
    IEC 62784:2017 covers electrical mobile motor-operated vacuum cleaners Equipment Protection Level (EPL) Dc.<br/>
    This includes dust extractors, for wet suction or dry suction, intended for commercial indoor use with or without attachments, to collect combustible dust in an explosive dust atmosphere.<br/>
    The requirements for the construction and testing covered by this document are applied in addition to the requirements for commercial and industrial vacuum cleaners in IEC 60335-2-69.<br/>
    This document supplements and modifies the requirements of IEC 60079-0. Whenever a requirement of this standard is in conflict with a requirement of IEC 60079-0 the requirement of this standard will take precedence.<br/>
    The following power systems are covered:<br/>
    - mains powered motors up to a rated voltage of 250 V for single-phase appliances and 480 V for other appliances.<br/>
    This document does not cover specific hazards associated with extreme ambient temperatures (less than –20 °C or higher than 40 °C) unless otherwise marked by the manufacturer as given in IEC 60079-0. The temperatures shall not exceed the temperature range of –20 °C to +60 °C.<br/>
    This document does not cover motorized cleaning heads for which additional requirements are under consideration.<br/>
    This document does not apply to:<br/>
    - back-pack vacuum cleaners;<br/>
    - vacuum cleaners with a traction drive;<br/>
    - vacuum cleaners and water-suction cleaning appliances for household use (IEC 60335-2-2);<br/>
    - floor treatment machines for commercial use (IEC 60335-2-67, IEC 60335-2-72);<br/>
    - spray extraction machines for commercial use (IEC 60335-2-68);<br/>
    - hand-held mains-operated electrical garden blowers, vacuums and blower vacuums (IEC 60335-2-100);<br/>
    - hand-held and transportable motor-operated electric tools (IEC 62841 series);<br/>
    - appliances for medical purposes (IEC 60601-1);<br/>
    - machines designed for use in corrosive environments;<br/>
    - machines designed for picking up flammable liquids;<br/>
    - machines designed for use in explosive environments due to the presence of explosive substances or pyrotechnical products, or unstable chemical substances.
- language: fr
  script: Latn
  content: |-
    IEC 62784:2017 couvre les aspirateurs à moteur électrique transportables, procurant un niveau de protection des matériels Dc.<br/>
    Il couvre ainsi les extracteurs de poussières, pour l’aspiration de liquides ou de poussières, destinés à un usage commercial à l’intérieur, avec ou sans accessoires, pour la collecte des poussières combustibles dans une atmosphère explosive contenant des poussières.<br/>
    Les exigences relatives à la construction et aux essais du présent document sont appliquées en complément des exigences relatives aux aspirateurs à usage industriel et commercial donnés par l'IEC 60335-2-69.<br/>
    Le présent document complète et modifie les exigences de l’IEC 60079-0. Lorsqu’une exigence de la présente norme est en contradiction avec une exigence de l’IEC 60079-0, c’est l’exigence de la présente norme qui prévaut.<br/>
    Les systèmes d’alimentation suivants sont couverts: moteurs alimentés par le secteur jusqu’à une tension assignée de 250 V pour les appareils monophasés et 480 V pour les autres appareils.<br/>
    Le présent document ne couvre pas les dangers spécifiques associés aux températures ambiantes extrêmes (inférieures à –20 °C ou supérieures à 40 °C), sauf indication contraire fournie par le marquage apposé par le fabricant, conformément à l’IEC 60079-0. La température ne doit pas dépasser la plage de températures comprise entre –20 °C et +60 °C.<br/>
    Le présent document ne couvre pas les têtes de nettoyage à moteur pour lesquelles des exigences complémentaires sont à l’étude.<br/>
    Le présent document ne s’applique pas:<br/>
    - aux aspirateurs dorsaux;<br/>
    - aspirateurs autotractés;<br/>
    - aspirateurs et appareils de nettoyage à aspiration d’eau, à usage domestique (IEC 60335-2-2);<br/>
    - machines de traitement des sols, à usage commercial (IEC 60335-2-67, IEC 60335-2-72);<br/>
    - machines de nettoyage par pulvérisation et aspiration, à usage commercial (IEC 60335-2-68);<br/>
    - souffleurs, aspirateurs et aspiro-souffleurs portatifs pour le jardin, alimentés par le secteur (IEC 60335-2-100);<br/>
    - outils électroportatifs à moteur et outils portables (série IEC 62841);<br/>
    - appareils destinés à un usage médical (IEC 60601-1);<br/>
    - machines conçues pour être utilisées dans des environnements corrosifs;<br/>
    - machines conçues pour la collecte des liquides inflammables;<br/>
    - machines conçues pour être utilisées dans des environnements explosifs en raison de la présence de substances explosives, ou de produits pyrotechniques ou de substances chimiques instables.<br/>
    Mots clés: aspirateurs, extracteurs de poussières, poussières combustibles
