abstract:
- language: en
  script: Latn
  content: "IEC TS 62607-6-5:2022(E) establishes a standardized method to determine
    the key control characteristics\n\n\tcontact resistance, and\n\tsheet resistance\n\nfor
    graphene-based materials and other two-dimensional materials by a\n\n\n\ttransmission
    line measurement.\n\nThe method uses test structures applied to the 2D material
    by photolithographic methods consisting of several metal electrodes with increasing
    spacing between the electrodes. By a measurement of the voltage drop between different
    pairs of electrodes, sheet resistance and contact resistance can be calculated.\n\n\n\tThe
    method can be applied to any other two-dimensional materials which are subject
    to electrical metal contact on top of the materials.\n\tThe method provides accurate
    and reproducible results, if the electrical contact formed between the two-dimensional
    material and the metal electrodes provides ohmic contact property.\n"
