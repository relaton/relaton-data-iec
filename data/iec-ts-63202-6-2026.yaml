abstract:
- language: en
  script: Latn
  content: |-
    IEC TS 63202:2026 defines a hot water soaking test to determine whether crystalline silicon photovoltaic (PV) cells have metallization that is durable enough to be used in PV modules.<br/>
    It is applied to crystalline silicon PV cells whose metallization is made with conductive metal pastes.<br/>
    Hot water soaking test is an accelerated aging test carried out using conditions of high temperature and humidity. This test can be used to identify cells with poor metal adhesion. Such cells shed some of their metal during delivery and storage, causing visual defects and potential risk of module reliability issues.
