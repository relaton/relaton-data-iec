abstract:
- language: en
  script: Latn
  content: |-
    IEC 60695-6-1:2021 gives guidance on:<br/>
    a) the optical measurement of obscuration of smoke;<br/>
    b) general aspects of optical smoke test methods;<br/>
    c) consideration of test methods;<br/>
    d) expression of smoke test data;<br/>
    e) the relevance of optical smoke data to hazard assessment.<br/>
    This basic safety publication focusing on safety guidance is primarily intended for use by technical committees in the preparation of safety publications in accordance with the principles laid down in IEC Guide 104 and ISO/IEC Guide 51.<br/>
    One of the responsibilities of a technical committee is, wherever applicable, to make use of basic safety publications in the preparation of its publications.<br/>
    This third edition cancels and replaces the second edition of IEC 60695-6-1 published in 2005 and Amendment 1:2010. It constitutes a technical revision.<br/>
    This edition includes the following significant technical changes with respect to the previous edition:<br/>
    - References to IEC TS 60695-6-30 (withdrawn in 2016) have been removed.<br/>
    - References to IEC TS 60695-6-31 (withdrawn in 2016) have been removed.<br/>
    - References to ISO 5659-2 have been inserted.<br/>
    - The scope contains some additional text.<br/>
    - Terms and definitions have been updated.<br/>
    - Subclause 3.2 has been updated.<br/>
    - Subclause 7.1 has been updated.<br/>
    It has the status of a basic safety publication in accordance with IEC Guide 104 and ISO/IEC Guide 51. This International Standard is to be used in conjunction with IEC 60695-6-2.
- language: fr
  script: Latn
  content: |-
    L'IEC 60695-6-1 fournit des recommandations relatives:<br/>
    a) au mesurage optique de l'obscurcissement de la lumière par la fumée;<br/>
    b) aux aspects généraux des méthodes d’essais optiques de la fumée;<br/>
    c) aux considérations concernant les méthodes d’essai;<br/>
    d) à l’expression des résultats d’essais de fumée;<br/>
    e) à la pertinence des résultats des mesurages optiques de la fumée pour l’évaluation du danger.<br/>
    La présente publication fondamentale de sécurité portant sur des recommandations de sécurité est avant tout destinée à être utilisée par les comités d'études dans le cadre de l'élaboration de publications de sécurité, conformément aux principes établis dans le Guide 104 de l’IEC et dans le Guide ISO/IEC 51.<br/>
    L'une des responsabilités d'un comité d'études consiste, le cas échéant, à utiliser les publications fondamentales de sécurité dans le cadre de l'élaboration de ses publications.<br/>
    Cette troisième édition annule et remplace la deuxième édition de l’IEC 60695-6-1 parue en 2005 et l’Amendement 1:2010. Elle constitue une révision technique.<br/>
    Cette édition inclut les modifications techniques majeures suivantes par rapport à l'édition précédente:<br/>
    - Les références à l’IEC TS 60695-6-30 (annulée en 2016) ont été supprimées.<br/>
    - Les références à l’IEC TS 60695-6-31 (annulée en 2016) ont été supprimées.<br/>
    - Des références à l’ISO 5659-2 ont été ajoutées.<br/>
    - Le domaine d’application contient du texte supplémentaire.<br/>
    - Les termes et définitions ont été mis à jour.<br/>
    - Le paragraphe 3.2 a été mis à jour.<br/>
    - Le paragraphe 7.1 a été mis à jour.<br/>
    Elle a le statut de publication fondamentale de sécurité, conformément au Guide IEC 104 et au Guide ISO/IEC 51. Cette Norme internationale doit être utilisée conjointement avec l’IEC 60695-6-2.
