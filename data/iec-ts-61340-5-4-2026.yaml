abstract:
- language: en
  script: Latn
  content: |-
    IEC 61340-5-4:2026 describes compliance verification testing for technical items included in ESD control programs, such as those specified in IEC 61340-5-1.<br/>
    Test methods are based on those specified in IEC 61340-5-1 and other parts of the IEC 61340 series and are simplified, where appropriate, for the purposes of compliance verification.<br/>
    This document describes compliance verification procedures intended for use by competent personnel familiar with the operation of test equipment and knowledgeable about the ESD control items being verified.<br/>
    Organizations can, by reference to this document in their compliance verification plan, adopt the necessary compliance verification procedures described herein without change or addition. Alternatively, compliance verification procedures described in this document can be adapted to match the organization's ESD control program requirements, provided deviations in test equipment and compliance verification procedures are documented in their compliance verification plan.<br/>
    Product qualification is excluded from the scope of this document.<br/>
    This edition includes the following significant technical changes with respect to the previous edition:<br/>
    a) significant new revision;<br/>
    b) document has been updated and reformatted.
