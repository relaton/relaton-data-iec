abstract:
- language: en
  script: Latn
  content: |-
    <p>1.1 This International Standard establishes requirements for certifying an assessment that an Ada language</p>
    <p>processor conforms to the requirements of the Ada language standard, ISO/IEC 8652. It places requirements</p>
    <p>on the organization that performs the assessment, the assessment procedures, and the test suite used in the</p>
    <p>assessment. Finally, it places requirements on the form for the certificate of conformity.</p>
    <p>1.2 This International Standard concerns only the assessment of conformity to the language requirements of</p>
    <p>ISO/IEC 8652. It does not concern the assessment of any other characteristics of a language processor or of the</p>
    <p>construction process used by the manufacturer of the language processor.</p>
    <p>NOTE In the sense of [ISO/IEC Guide 23], the Ada language standard, ISO/IEC 8652, is to be regarded as a standard for</p>
    <p>a specific property rather than a comprehensive product standard.</p>
    <p>1.3 This International Standard is intended to be primarily suitable for use by a third party authority although</p>
    <p>portions of it may also be applied by a supplier (first party) or by a user or purchaser (second party).</p>
    <p>1.4 An Ada language processor may be claimed to conform to the requirements of ISO/IEC 8652 regardless of</p>
    <p>the application of this International Standard. This International Standard prescribes the method for obtaining a</p>
    <p>certification that an Ada language processor conforms to ISO/IEC 8652. Customers desiring to acquire a</p>
    <p>language processor certified as conforming should explicitly require that certification by citing this International</p>
    <p>Standard.</p>
    <p>1.5 Certification should not be construed as guaranteeing that the certified product is free of non-conformities or</p>
    <p>defects; it only certifies that no evidence of non-conformity was found during the certification process.</p>
