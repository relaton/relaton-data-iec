abstract:
- content: "IEC 61753-021-03:2026 defines minimum initial test and measurement requirements
    and severities which single-mode fibre optic connectors terminated as a pigtail
    or a patchcord satisfy in order to be categorized as meeting the IEC standard
    category OP (outdoor protected environment), as defined in IEC 61753-1. If tests
    are performed on the connectors terminated as pigtails or patchcords for category
    OPHD, OP+ or OP+HD and the product passes these tests, the product will be automatically
    qualified or categorized as meeting the IEC standard for category OP. If tests
    are performed on the connectors terminated as pigtails or patchcords for category
    OP, and the product passes these tests, the product will be automatically qualified
    or categorized as meeting the IEC standard for category C or CHD.<br />\r\nThis
    first edition cancels and replaces the first edition of IEC 61753-021-3 published
    in 2012.<br />\r\nThis edition constitutes a technical revision. This edition
    includes the following significant technical changes with respect to the previous
    edition:<br />\r\na) update of environmental categories (from U to OP), tests
    and their severities in accordance with IEC 61753‑1;<br />\r\nb) changes in the
    terms and definitions of the different types of test samples (pigtail test samples
    and patchcord test samples) used in the various tests to avoid confusion;<br />\r\nc)
    update of fibre naming conventions in accordance with IEC 60793‑2‑50 and addition
    of provisions for B‑657 fibres;<br />\r\nd) addition of all the attenuation and
    return loss grades defined in IEC 61753‑1;<br />\r\ne) deletion of the static
    side load test;<br />\r\nf) addition of provisions for rectangular ferrule connectors;<br
    />\r\ng) addition of the fibre optic connector proof test with static load – side
    pull;<br />\r\nh) update of the flexing of the strain relief test to use change
    of attenuation instead of transient loss;<br />\r\ni) addition of Annex B for
    visual examination of the outer cable sheath movement of reinforced cables as
    an additional requirement for change of temperature, cable retention and flexing
    of the strain relief tests."
  language:
