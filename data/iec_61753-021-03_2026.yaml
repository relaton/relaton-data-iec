  format: text/html
- content: "L’IEC 61753-021-03:2026 définit les exigences minimales d’essai et de
    mesures initiales et les sévérités auxquelles les connecteurs fibroniques unimodaux
    raccordés à des fibres amorces et des cordons de brassage satisfont pour être
    classés comme répondant à la catégorie OP (environnement extérieur protégé) de
    la norme IEC, telle qu’elle est définie dans l’IEC 61753-1.<br />\r\nSi les essais
    sont effectués sur les connecteurs raccordés à des fibres amorces et des cordons
    de brassage pour la catégorie OPHD, OP+ ou OP+HD et que le produit satisfait aux
    essais, il est automatiquement qualifié ou classé comme répondant à la catégorie
    OP de la norme IEC. Si les essais sont effectués sur les connecteurs raccordés
    à des fibres amorces et des cordons de brassage pour la catégorie OP, et que le
    produit satisfait aux essais, il est automatiquement qualifié ou classé comme
    répondant à la catégorie C ou CHD de la norme IEC.<br />\r\nCette première édition
    annule et remplace la première édition de l'IEC 61753-021-3 parue en 2012.<br
    />\r\nCette édition constitue une révision technique.Cette édition inclut les
    modifications techniques significatives suivantes par rapport à l'édition précédente:<br
    />\r\na) mise à jour des catégories d’environnement (de U à OP), des essais et
    de leurs sévérités conformément à l’IEC 61753-1;<br />\r\nb) modification des
    termes et définitions des différents types d’échantillons d’essai (échantillons
    d’essai de fibres amorces et échantillons d’essai de cordons de brassage) utilisés
    dans les différents essais afin d’éviter toute confusion;<br />\r\nc) mise à jour
    des conventions de nommage des fibres, conformément à l’IEC 60793­2­50 et ajout
    de dispositions pour les fibres B-657;<br />\r\nd) ajout de toutes les classes
    d’affaiblissement et d’affaiblissement de réflexion définies dans l’IEC 61753-1;<br
    />\r\nsuppression de l’essai de charge latérale statique;<br />\r\nf) ajout de
    dispositions pour les connecteurs à férule rectangulaire;<br />\r\ng) ajout de
    l’essai de résistance des connecteurs fibroniques avec charge statique – traction
    latérale;<br />\r\nh) mise à jour de la flexion de l'essai des serre-câbles pour
    utiliser les variations d'affaiblissement à la place des pertes transitoires;<br
    />\r\ni) ajout de l’Annexe B relative à l’examen visuel du mouvement de la gaine
    extérieure du câble des câbles renforcés comme exigence supplémentaire pour les
    essais de variations de température, de rétention du câble et de flexion des serre-câbles."
