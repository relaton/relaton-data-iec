abstract:
- language: en
  script: Latn
  content: |-
    <p>This document outlines key factors affecting machine learning model training efficiency and presents corresponding optimization approaches.</p>
    <p>It provides guidance for AI providers and producers through a structured set of characteristics and related optimizations to improve training efficiency. This information can support the evaluation and comparison of various ML training strategies.</p>
    <p>This document does not specify any training accelerating mechanisms provided and implemented within machine learning computing device described in ISO/IEC TR 17903.</p>
