abstract:
- language: en
  script: Latn
  content: |-
    IEC TS 60364-8-3:2020 (E) specifies requirements and recommendations for the safe and proper functioning of prosumers' electrical installations.<br/>
    It is intended for use by contractors, users, facility managers and similar of electrical low-voltage installations.<br/>
    This document also provides requirements and recommendations on technical parameters and their limiting values influencing:<br/>
    a) safety:<br/>
    – protection;<br/>
    – alarm;<br/>
    b) proper functioning:<br/>
    – stability (voltage, frequency, etc);<br/>
    – reliability (power quality, interoperability of communication, etc);<br/>
    – energy management (power, power factor, current, stored energy, etc);<br/>
    – ability to ensure correct operation of equipment.<br/>
    This document also provides requirements and recommendations on data exchange models, and test procedures for the prosumer’s electrical installations that could include the following applications:<br/>
    – local generating sources (e.g. photovoltaic systems, rotating generators, wind turbines);<br/>
    – energy storage units (e.g. stationary secondary batteries);<br/>
    – electric vehicle charging and/or discharging;<br/>
    – prosumer’s energy measurement unit (PEMU);<br/>
    – control and monitoring system;<br/>
    – loads which can be controlled.<br/>
    This part of IEC 60364 is intended to be applied in conjunction with the other parts of IEC 60364.
