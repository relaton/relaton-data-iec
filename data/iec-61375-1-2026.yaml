abstract:
- language: en
  script: Latn
  content: |-
    IEC 61375-1:2026 applies to the architecture of data communication systems in open trains, i.e. it covers the architecture of a communication system for the data communication between vehicles of the said open trains, the data communication within the vehicles and the data communication from train to the ground. The applicability of IEC 61375-1 to the train network technologies allows for interoperability of individual vehicles within open trains in international traffic. The data communication systems inside vehicles are given as recommended solutions to cope with the said TCN. In any case, proof of compatibility between a proposed train backbone and a proposed consist network will have to be brought by the supplier. IEC 61375-1 might be additionally applicable to closed trains and multiple unit trains when so agreed between purchaser and supplier. This fourth edition cancels and replaces the third edition published in 2012. This edition constitutes a technical revision.<br/>
    This edition includes the following significant technical changes with respect to the previous edition:<br/>
    a) Extension of train backbone topologies: aggregated and segregated topology;<br/>
    b) Added independent consist orientation check with segregated train backbone topology;<br/>
    c) Introduction of wireless technologies: wireless train backbone and wireless consist network;<br/>
    d) Possibility of virtual networks;<br/>
    e) Definition of data classes and protocol requirements suitable for the OMTS domain;<br/>
    f) New clause about cybersecurity in train communication networks.
- language: fr
  script: Latn
  content: |-
    L'IEC 61375-1:2026 s’applique à l’architecture des systèmes de communication de données dans les trains à composition variable, c’est-à-dire qu’elle couvre l’architecture d’un système de communication de données entre les véhicules des trains considérés, les communications de données dans les véhicules et les communications de données train-sol. L'application de IEC 61375-1 aux technologies de réseau de train permet l'interopérabilité de véhicules individuels dans des trains à composition variable en trafic international. Les systèmes de communication de données dans les véhicules sont donnés comme solutions recommandées pour fonctionner avec ledit TCN. Dans tous les cas, le fournisseur devra apporter la preuve de la compatibilité entre un réseau central de train proposé et un réseau de rame proposé. Par ailleurs, IEC 61375-1 pourrait s'appliquer aux rames non modifiables et aux trains à unités multiples après accord entre acheteur et fournisseur. Cette quatrième édition annule et remplace la troisième édition publiée en 2012. Cette édition constitue une révision technique.<br/>
    Cette édition inclut également les modifications techniques majeures suivantes par rapport à l'édition précédente:<br/>
    a) Extension des topologies de réseau central de train: topologie agrégée et séparée<br/>
    b) Ajout d'une vérification indépendante de l'orientation de la rame avec une topologie séparée de réseau central de train<br/>
    c) Introduction des technologies sans fil: réseau central de train sans fil et réseau de rame sans fil<br/>
    d) Possibilité de réseaux virtuels<br/>
    e) Définition des classes de données et des exigences de protocole adaptées au domaine OMTS<br/>
    f) Nouvel article sur la cybersécurité dans les réseaux embarqués de train
