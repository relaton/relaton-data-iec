abstract:
- language: en
  script: Latn
  content: |-
    ISO 80601-2-84:2023 This document applies to the basic safety and essential performance of an EMS ventilator in combination with its accessories, hereafter also referred to as ME equipment:<br/>
    - intended for patients who need differing levels of support from artificial ventilation including ventilator-dependent patients;<br/>
    - intended to be operated by a healthcare professional operator;<br/>
    - intended for use in the EMS environment; and<br/>
    - intended for invasive or non-invasive ventilation.<br/>
    NOTE 2 An EMS ventilator can also be used for transport within a professional healthcare facility.<br/>
    An EMS ventilator is not considered to use a physiologic closed loop-control system unless it uses a physiological patient variable to adjust the artificial ventilation therapy settings.<br/>
    This document is also applicable to those accessories intended by their manufacturer to be connected to the ventilator breathing system, or to an EMS ventilator, where the characteristics of those accessories can affect the basic safety or essential performance of the EMS ventilator.<br/>
    NOTE 3 If a clause or subclause is specifically intended to be applicable to ME equipment only, or to ME systems only, the title and content of that clause or subclause will say so. If that is not the case, the clause or subclause applies both to ME equipment and to ME systems, as relevant.<br/>
    Hazards inherent in the intended physiological function of ME equipment or ME systems within the scope of this document are not covered by specific requirements in this document except in IEC 60601‑1:2005+AMD1:2012+AMD2:2020, 7.2.13 and 8.4.1.<br/>
    NOTE 4 Additional information can be found in IEC 60601-1:2005+AMD1:2012+AMD2:2020, 4.2.<br/>
    This document does not specify the requirements for the following:<br/>
    NOTE 5 See ISO/TR 21954 for guidance on the selection of the appropriate ventilator for a given patient.<br/>
    - ventilators or accessories intended for ventilator-dependent patients in critical care applications, which are given in ISO 80601-2-12.<br/>
    - ventilators or accessories intended for ventilator-dependent patients in the home healthcare environment, which are given in ISO 80601-2-72.<br/>
    - ventilators or accessories intended for anaesthetic applications, which are given in ISO 80601‑2‑13.<br/>
    - ventilators or accessories intended for ventilatory support equipment (intended only to augment the ventilation of spontaneously breathing patients), which are given in ISO 80601‑2-79 and ISO 80601-2-80.<br/>
    - obstructive sleep apnoea therapy ME equipment, which are given in ISO 80601‐2‐70.<br/>
    - user-powered resuscitators, which are given in ISO 10651‐4.<br/>
    - gas-powered emergency resuscitators, which are given in ISO 10651‐5.<br/>
    - continuous positive airway pressure (CPAP) ME equipment.<br/>
    - high‐frequency jet ventilators (HFJVs), which are given in ISO 80601-2-87.<br/>
    - high‐frequency oscillatory ventilators (HFOVs)[44], which are given in ISO 80601-2-87.<br/>
    NOTE 6 An EMS ventilator can incorporate high-frequency jet or high-frequency oscillatory ventilation-modes.<br/>
    - respiratory high-flow therapy equipment, which are given in ISO 80601-2-90.<br/>
    NOTE 7 An EMS ventilator can incorporate high-flow therapy operational mode, but such a mode is only for spontaneously breathing patients.<br/>
    - oxygen therapy constant flow ME equipment.<br/>
    - cuirass or “iron‐lung” ventilators.
- language: fr
  script: Latn
  content: |-
    ISO 80601-2-84:2023 Le présent document s'applique à la sécurité de base et aux performances essentielles d'un ventilateur SMU associé à ses accessoires, appelés ci-après appareil EM :<br/>
    - destinés aux patients ayant besoin de différents niveaux d'assistance par ventilation artificielle, y compris aux patients ventilo-dépendants ;<br/>
    - destinés à être utilisés par un opérateur professionnel de soins de santé ;<br/>
    - destinés à être utilisés dans l'environnement SMU ; et<br/>
    - destinés à la ventilation invasive ou non invasive.<br/>
    NOTE 2 Un ventilateur SMU peut également être utilisé lors d'un transport dans un établissement de soins professionnel.<br/>
    Un ventilateur SMU n'est pas censé utiliser un système physiologique de commande en boucle fermée, sauf s'il utilise une variable physiologique du patient pour ajuster les paramètres de thérapie par ventilation artificielle.<br/>
    Le présent document s'applique également aux accessoires conçus par leur fabricant pour être connectés au système respiratoire du ventilateur, ou à un ventilateur SMU, lorsque les caractéristiques de ces accessoires peuvent affecter la sécurité de base et les performances essentielles du ventilateur SMU.<br/>
    NOTE 3 Si un article ou un paragraphe est spécifiquement destiné à être appliqué uniquement aux appareils EM ou aux systèmes EM, le titre et le contenu dudit article ou paragraphe l'indiqueront. Dans le cas contraire, l'article ou le paragraphe s'applique à la fois aux appareils EM et aux systèmes EM, selon le cas.<br/>
    Les dangers inhérents à la fonction physiologique prévue des appareils EM ou des systèmes EM dans le cadre du domaine d'application du présent document ne sont pas couverts par des exigences spécifiques contenues dans le présent document, à l'exception de l'IEC 60601‑1:2005+AMD1:2012+AMD2:2020, 7.2.13 et 8.4.1.<br/>
    NOTE 4 Des informations supplémentaires peuvent être trouvées dans l'IEC 60601‑1:2005+AMD1:2012+AMD2:2020, 4.2<br/>
    Le présent document ne spécifie pas les exigences applicables aux :<br/>
    NOTE 5 Voir l'ISO/TR 21954 pour des recommandations relatives à la sélection du ventilateur approprié pour un patient donné.<br/>
    - ventilateurs ou accessoires prévus pour les patients ventilo-dépendants dans les applications de soins intensifs. Celles-ci sont données dans l'ISO 80601-2-12 ;<br/>
    - ventilateurs ou accessoires prévus pour les patients ventilo-dépendants dans l'environnement des soins à domicile. Celles-ci sont données dans l'ISO 80601-2-72 ;<br/>
    - ventilateurs ou accessoires prévus pour les applications en anesthésie. Celles-ci sont données dans l'ISO 80601‑2‑13 ;<br/>
    - ventilateurs ou accessoires prévus pour les équipements d'assistance respiratoire (uniquement destinés à augmenter la ventilation des patients qui respirent spontanément). Celles-ci sont données dans l'ISO 80601‑2‑79 et l'ISO 80601‑2‑80 ;<br/>
    - appareils EM de traitement de l'apnée du sommeil. Celles-ci sont données dans l'ISO 80601‐2‐70 ;<br/>
    - ressuscitateurs à puissance motrice manuelle. Celles-ci sont données dans l'ISO 10651‐4 ;<br/>
    - ressuscitateurs d'urgence alimentés par gaz. Celles-ci sont données dans l'ISO 10651‐5 ;<br/>
    - appareils EM à pression positive continue des voies aériennes (PPC) ;<br/>
    - ventilateurs de jet haute fréquence (VJHF). Celles-ci sont données dans l'ISO 80601-2-87 ;<br/>
    - ventilateurs à oscillation haute fréquence (VOHF)[44]. Celles-ci sont données dans l'ISO 80601-2-87 ;<br/>
    NOTE 6 Un ventilateur SMU peut incorporer des modes de ventilation à jet haute fréquence ou à oscillation haute fréquence.<br/>
    - équipements de thérapie respiratoire à haut débit. Celles-ci sont données dans l'ISO 80601-2-90 ;<br/>
    NOTE 7 Un ventilateur SMU peut intégrer un mode de fonctionnement de thérapie à haut débit, mais ce mode est réservé aux patients qui respirent spontanément.<br/>
    - appareils EM délivrant un débit constant d'oxygénothérapie ;<br/>
    - cuirasses ou « poumons d'acier ».
