abstract:
- language: en
  script: Latn
  content: "<p>This document specifies an extension of evaluation methods and activities
    for cryptographic protocols based on ISO/IEC 15408-4, which provides a framework
    for evaluation methods and activities. This document provides a mapping between
    the work items for cryptographic protocol evaluation and the associated evaluation
    activities or evaluation methods. Additionally, this document also provides security
    assurance classification based on the cryptographic assessment performed by automated
    provers in four different levels of increasing assurance.</p>"
