abstract:
- language: en
  script: Latn
  content: IEC 62024-3:2026 specifies test methods for AC losses of high-frequency
    inductive components for power supplies used in DC-to-DC converters and similar
    devices at currents close to actual operation and introduces the measurement principle,
    scope of application and matters to be noted for each method. This document is
    applicable to leaded and surface mount inductors with dimensions in accordance
    with IEC 62024-2.
