abstract:
- language: en
  script: Latn
  content: |-
    IEC 60193:2019 applies to laboratory models of any type of impulse or reaction hydraulic turbine, storage pump or pump-turbine.<br/>
    This document applies to models of prototype machines either with unit power greater than 5 MW or with reference diameter greater than 3 m. Full application of the procedures herein prescribed is not generally justified for machines with smaller power and size. Nevertheless, this document may be used for such machines by agreement between the purchaser and the supplier.<br/>
    This document excludes all matters of purely commercial interest, except those inextricably bound up with the conduct of the tests.<br/>
    This document is concerned with neither the structural details of the machines nor the mechanical properties of their components, so long as these do not affect model performance or the relationship between model and prototype performances.<br/>
    This document covers the arrangements for model acceptance tests to be performed on hydraulic turbines, storage pumps and pump-turbines to determine if the main hydraulic performance contract guarantees (see 4.2) have been satisfied.<br/>
    It contains the rules governing test conduct and prescribes measures to be taken if any phase of the tests is disputed.<br/>
    The main objectives of this document are:<br/>
    – to define the terms and quantities used;<br/>
    – to specify methods of testing and of measuring the quantities involved, in order to ascertain the hydraulic performance of the model;<br/>
    – to specify the methods of computation of results and of comparison with guarantees;<br/>
    – to determine if the contract guarantees that fall within the scope of this document have been fulfilled;<br/>
    – to define the extent, content and structure of the final report.<br/>
    The guarantees can be given in one of the following ways:<br/>
    – guarantees for prototype hydraulic performance, computed from model test results considering scale effects;<br/>
    – guarantees for model hydraulic performance.<br/>
    This third edition cancels and replaces the second edition published in 1999. This edition constitutes a technical revision.<br/>
    This edition includes the following significant technical changes with respect to the previous edition:<br/>
    a) update to methods/measuring tools currently used for checking dimensions on both model and prototype;<br/>
    b) update to requirements of accuracy in the dimensional check procedure as a result of new technology;<br/>
    c) merging of tables/sections with redundant information in dimension check in 5.2;<br/>
    d) update to methods of measuring discharge;<br/>
    e) update to pressure fluctuation methods and terminology;<br/>
    f) specification of measuring times for accurate pressure fluctuation analyses in the model;<br/>
    g) redefine definition for the transposition of pressure fluctuations to prototype;<br/>
    h) update to surface waviness requirements in prototype;<br/>
    i) redefining methods/references in clause on cavitation nuclei content (5.7.3.2.2);<br/>
    j) update to 7.3 and review of methods on radial thrust measurements;<br/>
    k) update to 7.4 (Hydraulic loads on control components);<br/>
    l) update and develop methodology in 7.5 for testing in the extended operating range;<br/>
    m) update to 7.6 concerning index testing;<br/>
    n) update to methods for measuring roughness;<br/>
    o) updates to references;<br/>
    p) updates to figures;<br/>
    q) revision of sigma definition;<br/>
    r) reference to new method of transposition in accordance with IEC 62097.<br/>
    Key Words: Hydraulic Turbines, Storage Pumps, Pump Turbines
- language: fr
  script: Latn
  content: |-
    IEC 60193:2019 est applicable aux modèles de laboratoire de tout type de turbine hydraulique à action ou à réaction, de pompe d'accumulation ou de pompe-turbine.<br/>
    Il s'applique aux modèles de machines prototypes ayant une puissance unitaire supérieure à 5 MW ou un diamètre de référence supérieur à 3 m. Bien que l'application intégrale des procédures prescrites ne soit généralement pas justifiée pour des machines de puissance et de dimension inférieures, le présent document peut néanmoins être utilisé pour de telles machines après accord entre l'acheteur et le fournisseur.<br/>
    Dans ce document, le terme "turbine" inclut une pompe-turbine fonctionnant en turbine et le terme "pompe" inclut une pompe-turbine fonctionnant en pompe.<br/>
    Ce document exclut tous les sujets à caractère purement commercial, excepté ceux intimement liés à la bonne conduite des essais.<br/>
    Ce document ne concerne ni les détails de construction des machines, ni les propriétés mécaniques de leurs différentes parties pour autant que ces éléments n'affectent pas le fonctionnement du modèle ni la relation entre les performances du modèle et celles du prototype.<br/>
    Le présent document régit les modalités des essais de réception sur modèle des turbines hydrauliques, pompes d'accumulation et pompes-turbines en vue de déterminer si les garanties contractuelles de performances hydrauliques principales (voir 4.2) sont respectées.<br/>
    Il fixe les règles qui gouvernent la conduite de ces essais et prescrit les mesures à prendre en cas de contestation d'une phase quelconque des essais.<br/>
    Les objectifs principaux du présent document sont:<br/>
    - de définir les termes et les grandeurs utilisés;<br/>
    - de prescrire les méthodes d'essai et les façons de mesurer les grandeurs permettant d'évaluer les performances hydrauliques du modèle;<br/>
    - de prescrire les méthodes de calcul des résultats et de comparaison aux garanties;<br/>
    - de déterminer si les garanties contractuelles qui sont du domaine de ce document sont respectées;<br/>
    - de définir l'étendue, le contenu et la présentation du rapport final.<br/>
    - Les garanties peuvent être données de l'une des façons suivantes:<br/>
    - garanties reposant sur les performances hydrauliques du prototype, calculées à partir des résultats d'essai du modèle en tenant compte des effets d'échelle;<br/>
    - garanties reposant sur les performances hydrauliques du modèle.<br/>
    Cette troisième édition annule et remplace la seconde édition publiée en 1999. Cette édition constitue une révision technique.<br/>
    Cette édition inclut les modifications techniques majeures suivantes par rapport à l'édition précédente:<br/>
    a) mise à jour des méthodes/appareils de mesures utilisés actuellement pour les contrôles dimensionnels sur modèle et sur prototype;<br/>
    b) mise à jour des exigences de précision pour les procédures de contrôle dimensionnels tenant compte des nouvelles technologies;<br/>
    c) fusion des tableaux/sections présentant des informations redondantes dans la section contrôles dimensionnels;<br/>
    d) mise à jour des méthodes de mesurage du débit;<br/>
    e) mise à jour des méthodes et de la terminologie relatives aux fluctuations de pression;<br/>
    f) définition des temps de mesurages pour des analyses précises des fluctuations de pression sur modèle;<br/>
    g) nouvelle définition de la transposition des fluctuations de pression au prototype;<br/>
    h) mise à jour des exigences d'ondulations de surface sur prototype;<br/>
    i) nouvelle définition des méthodes/références dans la section sur la teneur en germes de cavitation (5.7.3.2.2);<br/>
    j) mise à jour du 7.3 et révision des méthodes de mesurage de poussée radiale;<br/>
    k) mise à jour du 7.4 (Efforts hydrauliques sur les organes de réglage);<br/>
    l) mise à jour et développement de méthodologie des essais dans le domaine de fonctionnement élargi, Paragraphe 7.5;<br/>
    m) mise à jour du 7.6 concernant les essais indiciels;<br/>
    n) mise à jour des mesurages de rugosité;<br/>
    o) mise à jour des références;<br/>
    p) mise à jour des figures;<br/>
    q) révision de la définition de sigma;<br/>
    r) reference à la nouvelle méthode de transposition conformément à l'IEC 62097.<br/>
    Mots clés: Turbines hydrauliques, pompe d'accumulation, pompe-turbine
