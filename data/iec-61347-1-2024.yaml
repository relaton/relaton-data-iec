abstract:
- language: en
  script: Latn
  content: |-
    IEC 61347-1:2024 specifies general safety requirements for controlgear for electric light sources for use on DC supplies up to 1 500 V or AC supplies up to 1 000 V at 50 Hz or 60 Hz.<br/>
    This fourth edition cancels and replaces the third edition published in 2015 and Amendment 1:2017. This edition constitutes a technical revision.<br/>
    This edition includes the following significant technical changes with respect to the previous edition:<br/>
    a) complete review of document structure, including but not limited to what is individually described under items b) to s);<br/>
    b) removal of requirements for electromagnetic controlgear;<br/>
    c) addition of more specific requirements for control circuit insulation and corresponding marking;<br/>
    d) merging of thermal test requirements for transformers into a new Clause 16;<br/>
    e) clarification of specifications for the moisture resistance test;<br/>
    f) update of the normative reference to standards of the transformer series IEC 61558;<br/>
    g) correction of the normative reference for PCB testing with respect to flames and fire;<br/>
    h) update of further normative references where appropriate;<br/>
    i) allowance of an alternative DC electric strength test;<br/>
    j) addition of specific provisions for the use of bridging capacitors;<br/>
    k) update of fire hazard testing requirements;<br/>
    l) introduction of requirements for PELV applications;<br/>
    m) clearance distances now generally based on peak instead of RMS voltage values;<br/>
    n) introduction of a new type of protected emergency lighting controlgear;<br/>
    o) review and clarification of touch current and voltage requirements;<br/>
    p) clarification of the test sequence for independent controlgear with respect to the application of the IEC 60598 series versus the IEC 61347 series;<br/>
    q) introduction of reduced touch voltages and currents for interrupted DC voltage applications or pulse width modulation (PWM);<br/>
    r) changes concerning the recommendations for electric strength routine testing;<br/>
    s) merging of requirements for safety isolating controlgear from former Annex L into the main body of the document;<br/>
    t) introduction of Annex N intended to address touch current measurement;<br/>
    u) introduction of Annex O intended to provide information on document reorganization.
- language: fr
  script: Latn
  content: |-
    L'IEC 61347-1:2024 spécifie les exigences de sécurité générales des appareillages pour sources de lumière électriques destinés à être utilisés avec des alimentations inférieures ou égales à 1 500 V en courant continu ou avec des alimentations inférieures ou égales à 1 000 V en courant alternatif à 50 Hz ou 60 Hz.<br/>
    Cette quatrième édition annule et remplace la troisième édition parue en 2015 et l'Amendement 1:2017. Cette édition constitue une révision technique.<br/>
    Cette édition inclut les modifications techniques majeures suivantes par rapport à l'édition précédente:<br/>
    a) revue complète de la structure du document, notamment les points b) à s) ci-dessous;<br/>
    b) suppression des exigences relatives aux appareillages électromagnétiques;<br/>
    c) ajout d'exigences plus spécifiques pour l'isolation du circuit de commande et le marquage correspondant;<br/>
    d) fusion des exigences relatives aux essais thermiques des transformateurs dans un nouvel Article 16;<br/>
    e) clarification des spécifications pour l'essai de résistance à l'humidité;<br/>
    f) mise à jour des références normatives avec l'ajout de la série IEC 61558 relative aux transformateurs;<br/>
    g) correction de la référence normative pour les essais des cartes de circuits imprimés, notamment pour l'évaluation de la résistance aux flammes et au feu;<br/>
    h) mise à jour d'autres références normatives, le cas échéant;<br/>
    i) ajout d'une variante pour l'essai de rigidité électrique sous un courant continu;<br/>
    j) ajout de dispositions spécifiques au raccordement en pont de condensateurs;<br/>
    k) mise à jour des exigences d'essais relatifs aux risques du feu;<br/>
    l) ajout d'exigences pour les applications TBTP;<br/>
    m) les distances d'isolement sont désormais déterminées généralement à partir des tensions de crête et non des valeurs de tension efficace;<br/>
    n) ajout d'un nouveau type d'appareillage protégé pour l'éclairage de secours;<br/>
    o) examen et clarification des exigences relatives au courant et à la tension de contact;<br/>
    p) clarification de la séquence des essais pour les appareillages indépendants, selon la série IEC 60598 ou la série IEC 61347 appliquée;<br/>
    q) ajout de valeurs de tension et de courant de contact inférieures pour les tensions continues interrompues ou la modulation de largeur d'impulsions (MLI);<br/>
    r) modification des recommandations relatives aux essais individuels de série de rigidité électrique;<br/>
    s) fusion des exigences relatives aux appareillages de sécurité de l'ancienne Annexe L dans le corps du document;<br/>
    t) ajout de l'Annexe N afin de couvrir le mesurage des courants de contact;<br/>
    u) ajout de l'Annexe O afin de fournir des informations sur la réorganisation des documents.
