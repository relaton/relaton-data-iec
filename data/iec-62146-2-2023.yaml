abstract:
- language: en
  script: Latn
  content: |-
    IEC 62146-2:2023 is applicable to TRV capacitors used on high-voltage alternating current circuit-breakers with rated voltages above 100 kV with 50 Hz or 60 Hz.<br/>
    TRV capacitors are installed phase to earth, either in parallel to the bushing on dead tank circuit-breakers, or immersed inside the circuit-breaker, or freestanding close to the circuit-breaker. Their function is to limit the transient recovery voltage (TRV) and the rate of rise of recovery voltage (RRRV) on the circuit-breaker. Capacitors in compliance with this document can be used as TRV capacitor.<br/>
    This document applies to TRV capacitors falling into one or both of the following categories for:<br/>
    - mounting on or close to air insulated switchgear (AIS) dead tank and live tank circuit-breakers, or<br/>
    - mounting on gas insulated switchgear (GIS) circuit-breakers.<br/>
    The testing for each of the above applications is in some cases different.<br/>
    This document does not apply to grading capacitors installed in parallel to the chambers of the circuit-breaker, which are specified in IEC 62146-1.<br/>
    This document does not apply to capacitors not directly associated with high-voltage alternating current circuit-breakers.<br/>
    The object of this document is:<br/>
    - to define uniform rules regarding performances, testing and rating<br/>
    - to define specific safety rules<br/>
    - to provide a guidance for installation and operation<br/>
    The TRV capacitor is a sub-component for the circuit-breaker and is specified in accordance with the circuit-breaker specifications according to IEC 62271-1, IEC 62271-100, and if applicable to IEC 62271-203.<br/>
    TRV capacitors are commonly built with composite or ceramic housings (insulators). Those insulators follow IEC 61462 or IEC 62155. Other housings can be used if they can sustain applicable type tests according to IEC 61462 and IEC 62155.<br/>
    This International Standard is to be used in conjunction with IEC 62146-1:2013 and IEC 62146-1:2013/AMD1:2016.
- language: fr
  script: Latn
  content: |-
    IEC 62146-2:2023 s’applique aux condensateurs TTR utilisés sur les disjoncteurs à courant alternatif haute tension dont les tensions assignées sont supérieures à 100 kV à 50 Hz ou 60 Hz.<br/>
    Les condensateurs TTR à neutre reliés à la terre sont installés soit parallèlement à la traversée sur les disjoncteurs à cuve mise à la terre, soit immergés à l’intérieur du disjoncteur, soit de façon autonome à proximité du disjoncteur. Leur fonction est de limiter la tension transitoire de rétablissement (TTR) et la vitesse d’accroissement de la tension de rétablissement (VATR) sur le disjoncteur. Les condensateurs conformes au présent document peuvent être utilisés comme condensateur TTR.<br/>
    Le présent document s’applique aux condensateurs TTR relevant de l’une ou l’autre des catégories suivantes pour:<br/>
    – montage sur ou à proximité de disjoncteurs à cuve mise à la terre ou à cuve sous tension des appareillages isolés dans l’air (AIS); ou<br/>
    – montage sur des disjoncteurs à isolation gazeuse (GIS).<br/>
    Les essais pour chacune des applications ci-dessus sont, dans certains cas, différents.<br/>
    Le présent document ne s’applique pas aux condensateurs installés en parallèle aux chambres du disjoncteur, qui sont spécifiés dans l’IEC 62146-1.<br/>
    Le présent document ne s’applique pas aux condensateurs qui ne sont pas directement associés aux disjoncteurs à courant alternatif haute tension.<br/>
    Le présent document a pour objet de:<br/>
    – définir des règles uniformes concernant les performances, les essais et les caractéristiques assignées;<br/>
    – définir des règles de sécurité spécifiques;<br/>
    – fournir des recommandations pour l’installation et le fonctionnement.<br/>
    Le condensateur TTR est un sous-composant du disjoncteur et il est spécifié conformément aux spécifications des disjoncteurs de l’IEC 62271-1, de l’IEC 62271-100 et, le cas échéant, de l’IEC 62271-203.<br/>
    Les condensateurs TTR sont généralement construits avec des boîtiers composites ou céramiques (isolateurs). Ces isolateurs sont conformes à l’IEC 61462 ou l’IEC 62155. D’autres boîtiers peuvent être utilisés s’ils peuvent supporter les essais de type applicables conformément à l’IEC 61462 et à l’IEC 62155.<br/>
    This International Standard is to be used in conjunction with IEC 62146-1:2013 and IEC 62146-1:2013/AMD1:2016.
