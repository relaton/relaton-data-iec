abstract:
- language: en
  script: Latn
  content: |-
    IEC 62896:2024 applies to hybrid insulators for AC and DC applications greater than 1 000 V AC and 1 500 V DC consisting of a load-bearing insulating solid or hollow core consisting of ceramic or glass, a housing (defined geometry, outside the insulating core) made of polymeric material and end fittings permanently attached to the insulating core.<br/>
    Hybrid insulators covered by this document are intended for use as suspension/tension long rod and cap and pin type insulators, line post insulators, station post insulators and hollow core insulators for apparatus.<br/>
    The object of this document is to:<br/>
    - define the terms used;<br/>
    - prescribe test methods;<br/>
    - prescribe acceptance criteria<br/>
    This document does not include requirements dealing with the choice of insulators for specific operating conditions. This first edition cancels and replaces the IEC TS 62896 published in 2015. This edition includes the following significant technical changes with respect to the previous edition:<br/>
    - modifications of terms and definitions;<br/>
    - modifications of tests procedures included in IEC TR 62039 and IEC 62217 (Hydrophobicity transfer test);<br/>
    - harmonization of Table 1 (Tests to be carried out after design and type changes) with other product standards and IEC 62217.
- language: fr
  script: Latn
  content: |-
    L’IEC 62896:2024 s’applique aux isolateurs hybrides pour applications en courant alternatif et en courant continu supérieures à 1 000 V en courant alternatif et 1 500 V en courant continu, constitués d’un noyau isolant supportant la charge mécanique, plein ou creux, fabriqué en matière céramique ou en verre, d’un revêtement (de géométrie définie, à l’extérieur du noyau isolant) en matériau polymère et d’armatures d’extrémité fixées de façon permanente au noyau isolant.<br/>
    Les isolateurs hybrides couverts par le présent document sont destinés à être utilisés comme isolateurs de suspension/d’ancrage de type à long fût et de type capot et tige, isolateurs rigides à socle, isolateurs supports et isolateurs à noyau creux, pour l’appareillage.<br/>
    Le présent document a pour objets:<br/>
    - de définir les termes employés;<br/>
    - de prescrire des méthodes d’essai;<br/>
    - de prescrire les critères d’acceptation.<br/>
    Cette première édition annule et remplace l’IEC TS 62896 parue en 2015. Cette édition inclut les modifications techniques majeures suivantes par rapport à l’édition précédente:<br/>
    - modifications des termes et définitions;<br/>
    - modifications des procédures d’essai incluses dans l’IEC TR 62039 et l’IEC 62217 (Essai de transfert d’hydrophobicité);<br/>
    - harmonisation du Tableau 1 (Essais à réaliser après les modifications de conception et de type) avec d’autres normes de produit l’IEC 62217.
