abstract:
- language: en
  script: Latn
  content: |-
    This pack contains IEC 60335-2-32:2024 EXV and IEC 60355-2-32:2024 CMV.<br/>
    <br/>
    IEC 60335-2-32:2024 deals with the safety of electric massage appliances for household and similar purposes, their rated voltage being not more than 250 V for single phase appliances and 480 V for other appliances including direct current (DC) supplied appliances and battery-operated appliances.<br/>
    Examples of appliances within the scope of this standard are<br/>
    - foot massagers;<br/>
    - water filled foot massagers;<br/>
    - hand-held massagers;<br/>
    - massage beds;<br/>
    - massage belts;<br/>
    - massage chairs;<br/>
    - massage pads.<br/>
    Appliances not intended for normal household use but that nevertheless can be a source of danger to the public, such as appliances intended to be used by laypersons in shops, in light industry and on farms, are within the scope of this standard.<br/>
    As far as is practicable, this standard deals with the common hazards presented by appliances that are encountered by all persons in and around the home.<br/>
    Attention is drawn to the fact that<br/>
    - for appliances intended to be used in vehicles or on board ships or aircraft, additional requirements can be necessary;<br/>
    - in many countries additional requirements are specified by the national health authorities, the national authorities responsible for the protection of labour and similar authorities.<br/>
    This standard does not apply to<br/>
    - appliances intended exclusively for industrial purposes;<br/>
    - appliances intended to be used in locations where special conditions prevail, such as the presence of a corrosive or explosive atmosphere (dust, vapour or gas);<br/>
    - electric foot care appliances that do not contain motors and other electric appliances for the care of skin or hair (IEC 60335-2-23);<br/>
    - electric appliances for beauty care of persons and intended for household, commercial and similar purposes (IEC 60335-2-115).<br/>
    This sixth edition cancels and replaces the fifth edition published in 2019. This edition constitutes a technical revision.<br/>
    This edition includes the following significant technical changes with respect to the previous edition:<br/>
    a) alignment with IEC 60335-1:2020;<br/>
    b) conversion of some notes to normative text (Clause 1);<br/>
    c) application of test probe 19 (8.1.1, 20.2, B.22.3, B.22.4).<br/>
    This part 2 is to be used in conjunction with the latest edition of IEC 60335-1 and its amendments unless that edition precludes it; in that case, the latest edition that does not preclude it is used. It was established on the basis of the sixth edition (2020) of that standard.
