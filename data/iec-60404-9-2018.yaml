abstract:
- language: en
  script: Latn
  content: |-
    IEC 60404-9:2018 specifies the measurement and test methods for the determination of the following geometrical characteristics of electrical steel strip and sheet:<br/>
    –    edge wave (wave factor);<br/>
    –    residual curvature;<br/>
    –    edge camber;<br/>
    –    deviation from the shearing line (internal stress);<br/>
    –    burr height.<br/>
    This document applies to electrical steel strip and sheet intended for the construction of magnetic circuits and corresponding to Classes B2, C21, C22 and C23 of IEC 60404-1.<br/>
    This edition includes the following significant technical changes with respect to the previous edition:<br/>
    a. revision of terms and definitions;<br/>
    b. specification of the length of test specimens for the determinations of edge wave (wave factor) and edge camber;<br/>
    c. addition of the horizontal method for the determination of residual curvature, and a note that informs about a safety concern of the vertical method;<br/>
    d. clarification that the burr height was characterized by the maximum value;<br/>
    e. addition of the measuring procedure using a hand-held micrometer to determine the burr height.
- language: fr
  script: Latn
  content: |-
    L'IEC 60404-9:2018 spécifie les méthodes de mesure et d'essai pour la détermination des caractéristiques géométriques suivantes des bandes et tôles magnétiques en acier:<br/>
    –    onde de surface (facteur d'ondulation);<br/>
    –    courbure résiduelle;<br/>
    –    rectitude;<br/>
    –    écart par rapport à la ligne de cisaillage (contrainte interne);<br/>
    -    hauteur de bavure.<br/>
    Le présent document s'applique aux bandes et tôles magnétiques en acier destinées à la construction de circuits magnétiques et correspondant aux Classes B2, C21, C22 et C23 de l'IEC 60404-1.<br/>
    Cette édition inclut les modifications techniques majeures suivantes par rapport à l'édition précédente:<br/>
    a. révision des termes et définitions;<br/>
    b. spécification de la longueur des éprouvettes d'essai pour la détermination de l'onde de surface (facteur d'ondulation) et de la rectitude;<br/>
    c. ajout de la méthode horizontale pour la détermination de la courbure résiduelle et une note informative sur une question de sécurité concernant la méthode verticale;<br/>
    d. clarification sur le fait que la hauteur de bavure a été caractérisée par la valeur maximale;<br/>
    e. ajout de la procédure de mesure à l'aide d'un micromètre manuel pour déterminer la hauteur de bavure.
