abstract:
- language: en
  script: Latn
  content: |-
    IEC 60364-7-7-704:2017 lays down requirements which apply to installations for construction and demolition sites for use during the period of the construction or demolition work which are intended to be taken out of service upon completion of the works. Examples include the following:<br/>
    - construction work of new buildings;<br/>
    - repair, alteration, extension or demolition of existing buildings or parts of existing buildings;<br/>
    - engineering works;<br/>
    - earthworks;<br/>
    - work of similar nature. The requirements apply to fixed or moveable installations. This new edition includes the following significant technical changes with respect to the previous edition:<br/>
    - clarification of the scope;<br/>
    - clarification of compliance with standards;<br/>
    - clarification of devices for isolation.
- language: fr
  script: Latn
  content: |-
    IEC 60364-7-7-704:2017 s’applique aux installations pour chantiers de construction et de démolition utilisées lors des travaux de construction ou de démolition et destinées à être retirées du service à l’achèvement des travaux. Ces travaux comprennent par exemple:<br/>
    - les travaux de construction de nouveaux bâtiments;<br/>
    - les travaux de réparation, de modification, d’extension ou de démolition de bâtiments existants ou de parties de ces bâtiments;<br/>
    - les travaux publics;<br/>
    - les travaux de terrassement; et<br/>
    - les travaux analogues.<br/>
    Les exigences s’appliquent aux installations fixes ou mobiles.<br/>
    Les exigences ne sont pas applicables aux installations de locaux administratifs des chantiers (par exemple bureaux, vestiaires, salles de réunion, cantines, restaurants, dortoirs et locaux sanitaires).<br/>
    Cette édition inclut les modifications techniques majeures suivantes par rapport à l'édition précédente:<br/>
    - clarification du domaine d’application;<br/>
    - clarification de la conformité aux normes;<br/>
    - clarification des dispositifs de sectionnement.
