abstract:
- language: en
  script: Latn
  content: |-
    <p class="MsoBodyText">This document provides the logical data structure of a mobile Vehicle Certificate (mVC) in conformity with ISO/IEC TS 23220-2 that serves as a confirmation of vehicle register data and confirmation of conformity with issuance requirements.</p>
    <p class="MsoBodyText">Other documents related to vehicle administration, such as a document that proves ownership of a vehicle and is designed to be used for ownership transfer, are out of scope of this document.</p>
