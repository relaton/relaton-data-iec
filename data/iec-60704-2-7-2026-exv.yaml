abstract:
- language: en
  script: Latn
  content: |-
    IEC 60704-2-7:2026 EXV contains both the international standard and its extended version (EXV). This extended version of the official IEC Standard is available in English only and provides the user with a comprehensive content of the Standard. IEC 60704-2-7:2026 EXV includes the content of the references made to IEC 60704-1:2021.<br/>
    <br/>
    IEC 60704-2-7:2026 applies to electrical fans (including their accessories and their component parts) for household and similar use, designed for AC or DC supply.<br/>
    The motor, the impeller and their housing, if any, form a single unit.<br/>
    These particular requirements apply to:<br/>
    – comfort fans (conventional and bladeless),<br/>
    – table fans,<br/>
    – pedestal fans,<br/>
    – ceiling fans,<br/>
    – wall bracket fans,<br/>
    – ceiling bracket fans,<br/>
    – louvre fans,<br/>
    – tower fans,<br/>
    – handheld fans,<br/>
    – neckband fans,<br/>
    – embedded fans,<br/>
    – ventilating fans.<br/>
    This document does not apply to:<br/>
    – fans that are part of a central ventilation system,<br/>
    – fans that are part of an appliance (for example cooling fans),<br/>
    – fans with additional functions (for example heating, humidifying).<br/>
    This third edition cancels and replaces the second edition published in 2020. This edition constitutes a technical revision.<br/>
    This edition includes the following significant technical changes with respect to the previous edition:<br/>
    a) alignment with IEC 60704-1:2021;<br/>
    b) scope has been expanded to handheld, neckband and embedded fans;<br/>
    c) positioning and mounting have been reworked;<br/>
    d) test concept of partition ventilating fans has changed to measure both inlet and outlet side together.<br/>
    This Part 2-7 is to be used in conjunction with IEC 60704-1:2021, Household and similar electrical appliances - Test code for the determination of airborne acoustical noise - Part 1: General requirements.
