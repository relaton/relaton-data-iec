abstract:
- language: en
  script: Latn
  content: "IEC 62271-102:2018 applies to alternating current disconnectors and earthing
    switches, designed for indoor and outdoor installations for nominal voltages above
    1 000 V and for service frequencies up to and including 60 Hz.<br/>\nThis second
    edition cancels and replaces the first edition published in 2001, Amendment 1:2011
    and Amendment 2:2013. This edition constitutes a technical revision.<br/>\nThis
    edition includes the following significant technical changes with respect to the
    previous edition:\n\n\tnew numbering according to IEC 17/1025/RQ to harmonize
    with ISO/IEC Directives, Part 2, and IEEE Std. C37.100.1;\n\tclause numbering
    has been aligned with IEC 62271-1:2017;\n\tthe Scope has been extended to cover
    all indoor and outdoor installations. Consideration of switching devices having
    disconnecting and/or earthing switch functionalities, apart from other functions,
    are also covered by this document;\n\tratings have been moved from Annexes B,
    C and E to Clause 5; the order of the subclauses now corresponds to the order
    of subclauses in Clause 7;\n\tnew rating values for bus-transfer current and bus-transfer
    voltage have been assigned;\n\tnew class of mechanical endurance for earthing
    switches has been added (M1);\n\tsubclause \"Rated values of electrical endurance
    for earthing switches\" is now called \"Classification of earthing switches for
    short-circuit making capability\";\n\tnew subclause with ratings for ice-coating
    has been added;\n\tnew subclause with classification of bus-charging switching
    capability has been added;\n\tnew withstand requirements for interlocking devices
    have been added;\n\tthe way to comply with the requirements of the isolating distance
    of disconnectors has been modified;\n\tdesign and construction requirements for
    position-indicating devices have been modified, aligning the requirements for
    position indication and signalling;\n\tthe value of the operating force has been
    changed;\n\tthe test procedures and validation criteria have been revised and
    modified where necessary;\n\trequirements for applied voltage during single-phase
    test on non-simultaneous closing earthing switches have been changed;\n\tnon-verifiable
    requirements have been deleted;\n\ta new subclause has been added for testing
    mechanical interlocking devices;\n\tthe high- and low-temperature test is mandatory
    if the temperature limits for the service conditions of the apparatus (defined
    by the manufacturer) are above +40 °C or below −5 °C, and a more detailed testing
    procedure is given;\n\tthe testing procedure to verify the proper functioning
    of the position-indicating device allows a more practicable testing for every
    technology used;\n\ta new Annex B has been added with title: \"Current-switching
    capability required of disconnectors and earthing switches\";\n\ta new Annex C
    has been added with title: \"Tolerances on test quantities for type tests\";\n\ta
    new Annex E has been added with title: \"Extension of validity of type tests\".\n"
- language: fr
  script: Latn
  content: "L’IEC 62271-102:2018 s’applique aux sectionneurs et aux sectionneurs de
    terre à courant alternatif, conçus pour être installés à l’intérieur et à l’extérieur,
    pour des tensions nominales supérieures à 1 000 V et des fréquences de service
    inférieures ou égales à 60 Hz.<br/>\nCette deuxième édition annule et remplace
    la première édition parue en 2001, l’Amendement 1:2011 et l’Amendement 2:2013.
    Cette édition constitue une révision technique.<br/>\nCette édition inclut les
    modifications techniques majeures suivantes par rapport à l'édition précédente:\n\n\tadoption
    d’une nouvelle numérotation conformément à l’IEC 17/1025/RQ pour se conformer
    aux Directives ISO/IEC, Partie 2, et à l’IEEE C37.100.1;\n\talignement de la numérotation
    des articles avec l’IEC 62271-1:2017:\n\textension du Domaine d’application pour
    couvrir toutes les installations pour l’intérieur et pour l’extérieur. Prise en
    compte des appareils de connexion comportant, en plus d’autres fonctions, des
    fonctionnalités de déconnexion et/ou de mise à la terre couvertes par le présent
    document;\n\ttransfert des caractéristiques assignées des Annexes B, C et E à
    l’Article 5; l’ordre des paragraphes correspond désormais à l’ordre des paragraphes
    de l’Article 7:\n\taffectation de nouvelles valeurs assignées au courant de transfert
    de barres et à la tension de transfert de barres;\n\tajout d’une nouvelle classe
    d’endurance mécanique pour les sectionneurs de terre (M1);\n\tle paragraphe \"Valeurs
    assignées d’endurance électrique pour les sectionneurs de terre\" s’intitule désormais
    \"Classification des sectionneurs de terre pour le pouvoir de fermeture en court-circuit;\n\tajout
    d’un nouveau paragraphe avec des caractéristiques assignées pour la couche de
    glace;\n\tajout d’un nouveau paragraphe avec classification du pouvoir d’établissement
    et de coupure de jeux de barres à vide;\n\tajout de nouvelles exigences en matière
    de tenue pour les dispositifs de verrouillage;\n\tmodification de la manière de
    se conformer aux exigences de la distance de sectionnement des sectionneurs;\n\tmodification
    des exigences de conception et de construction des indicateurs de position, en
    alignant les exigences pour l’indication et la signalisation de position;\n\tmodification
    de la valeur de l’effort de manœuvre;\n\trévision et modification si nécessaire
    des procédures d’essai et des critères de validation;\n\tmodification des exigences
    relatives à la tension appliquée lors des essais monophasés sur les sectionneurs
    de terre à fermeture non simultanée;\n\tsuppression des exigences non vérifiables;\n\tajout
    d’un nouveau paragraphe pour soumettre à l’essai les dispositifs de verrouillage
    mécanique;\n\tréalisation obligatoire de l’essai aux températures haute et basse
    si les limites de température pour les conditions de service de l’appareil (définies
    par le constructeur) sont supérieures à 40 °C ou inférieures à -5 °C, et fourniture
    d’une procédure d’essai plus détaillée;\n\tréalisation d’essai matériellement
    possible sur chacune des technologies utilisées, favorisée par la procédure d’essai
    de vérification du bon fonctionnement de l’indicateur de position;\n\tajout d’une
    nouvelle Annexe B intitulée: \"Pouvoir d’établissement et de coupure de courant
    exigé des sectionneurs et des sectionneurs de terre\";\n\tajout d’une nouvelle
    Annexe C intitulée: \"Tolérances sur les grandeurs d’essai pour les essais de
    type\"\n\tajout d’une nouvelle Annexe E intitulée: \"Extension de la validité
    des essais de type\".\n"
