abstract:
- content: "IEC 60245-8:2026 RLV contains both the official IEC International Standard
    and its Redline version. The Redline version is available in English only and
    provides you with a quick and easy way to compare all the changes between the
    official IEC Standard and its previous edition.<p>IEC 60245-8:2026 defines the
    particular requirements for rubber insulated and textile braid covered cords of
    rated voltage 300/300 V, for use in applications where high flexibility is required,
    for example iron cords, which apply in addition to the general requirements specified
    in IEC 60245-1, which apply to all cables. The tests for cables specified in the
    IEC 60245 series are described in IEC 63294.<br />\r\nIEC 60245-8:2026 includes
    the following significant technical changes with respect to the previous edition:<br
    />\r\na) reference to IEC 60245-2 for the tests has been deleted and replaced
    by IEC 63294;<br />\r\nb) reference to lift cable according to IEC 60245-5 has
    been deleted;<br />\r\nc) normative references have been updated.<br />\r\nThis
    document is to be used in conjunction with IEC 60245-1.</p><!--EndFragment -->"
