abstract:
- language: en
  script: Latn
  content: |-
    IEC 62933-5-4:2026 primarily describes the safety test methods and procedures for grid-connected energy storage systems where a lithium ion battery-based subsystem is used.<br/>
    This document provides test methods and procedures to validate safety issues specifically related to the use of a lithium-ion battery-based subsystem, primarily based on IEC 62933-5-1, which establishes criteria for ensuring the safe applications and use of electrical energy storage systems of any type or size, and IEC 62933-5-2, which further specifies safety provisions arising from the use of an electrochemical storage subsystems in EES systems. All test methods and procedures are based on the requirements of IEC 62933-5-2 Ed 2.0. This standard includes only the test methods specifically related to lithium ion battery-based BESS and is based on by actual tests.<br/>
    The scope of this document is limited to some representative actual test method and procedure for lithium-ion battery-based BESS, but does not include all tests method and procedure.
