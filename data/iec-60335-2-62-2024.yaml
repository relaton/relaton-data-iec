abstract:
- language: en
  script: Latn
  content: |-
    IEC 60335-2-62:2024 deals with the safety of electrically operated commercial rinsing sinks used in commercial kitchens, their rated voltage being not more than 250 V for single-phase appliances connected between one phase and neutral, and 480 V for other appliances. These appliances are not intended for household and similar purposes. They are used in areas not open to the public, for example in kitchens of restaurants, canteens, hospitals and commercial enterprises such as bakeries and butcheries.<br/>
    The electrical part of appliances making use of other forms of energy is also within the scope of this standard. As far as is practicable, this standard deals with the common hazards presented by these types of appliances.<br/>
    Attention is drawn to the fact that<br/>
    - for appliances intended to be used in vehicles or on board ships or aircraft, additional requirements can be necessary;<br/>
    - for appliances intended to be used in tropical countries, special requirements can be necessary;<br/>
    - in many countries, additional requirements are specified by the national health authorities, the national authorities responsible for the protection of labour, the national water supply authorities and similar authorities.<br/>
    This standard does not apply to<br/>
    - appliances designed primarily for sterilizing to clinical standards;<br/>
    - dishwashers (IEC 60335-2-58);<br/>
    - appliances designed exclusively for industrial purposes;<br/>
    - appliances intended to be used in locations where special conditions prevail, such as the presence of a corrosive or explosive atmosphere (dust, vapour or gas).<br/>
    This fifth edition cancels and replaces the fourth edition published in 2019. This edition constitutes a technical revision.<br/>
    This edition includes the following significant technical changes with respect to the previous edition:<br/>
    a) alignment with IEC 60335-1:2020;<br/>
    b) deletion or conversion of some notes to normative text (Clause 1, 7.15, 11.7, 22.103, 27.2);<br/>
    c) clarification that commercial electric rinsing sinks are not intended to be used in areas open to the public (Clause 1);<br/>
    d) alignment of some requirements with the standards for commercial catering appliances (Clause 1, 5.101, 11.4, 11.7, 15.1.1, 22.101, 22.102, 22.103, 23.3, 25.3, 27.2).<br/>
    This part 2 is to be used in conjunction with the latest edition of IEC 60335-1 and its amendments unless that edition precludes it; in that case, the latest edition that does not preclude it is used. It was established on the basis of the sixth edition (2020) of that standard.
- language: fr
  script: Latn
  content: |-
    L'IEC 60335-2-62:2024 traite de la sécurité des plonges électriques à usage commercial, utilisées dans les cuisines commerciales et dont la tension assignée est inférieure ou égale à 250 V pour les appareils monophasés alimentés entre phase et neutre, et à 480 V pour les autres appareils. Ces appareils ne sont pas destinés à un usage domestique ou analogue. Ils sont utilisés dans des endroits fermés au public, par exemple les cuisines des restaurants, des cantines, des hôpitaux et des entreprises artisanales, telles que les boulangeries et les boucheries. La partie électrique des appareils utilisant d’autres formes d’énergie relève également du domaine d’application de la présente norme. Dans la mesure du possible, la présente norme traite des dangers courants que présentent ces types d'appareils.<br/>
    L’attention est attirée sur le fait que<br/>
    - Pour les appareils destinés à être utilisés dans des véhicules ou à bord de navires ou d'avions, des exigences supplémentaires peuvent être nécessaires.<br/>
    - Pour les appareils destinés à être utilisés dans les pays tropicaux, des exigences spéciales peuvent être nécessaires.<br/>
    - Dans de nombreux pays, des exigences supplémentaires sont spécifiées par les organismes nationaux de la santé, par les organismes nationaux responsables de la protection des travailleurs, par les organismes nationaux responsables de l'alimentation en eau et par des organismes similaires.<br/>
    La présente norme ne s'applique pas<br/>
    - Aux appareils destinés principalement à la stérilisation conforme aux normes cliniques.<br/>
    - Aux lave-vaisselle (IEC 60335-2-58).<br/>
    - Aux appareils prévus exclusivement pour des usages industriels.<br/>
    - Aux appareils destinés à être utilisés dans des locaux qui présentent des conditions particulières, telles que la présence d’une atmosphère corrosive ou explosive (poussière, vapeur ou gaz).<br/>
    Cette cinquième édition annule et remplace la quatrième édition parue en 2019. Cette édition constitue une révision technique.<br/>
    Cette édition inclut les modifications techniques majeures suivantes par rapport à l'édition précédente:<br/>
    a) texte aligné sur l'IEC 60335-1:2020;<br/>
    b) suppression ou transformation de certaines notes en texte normatif (Article 1 et paragraphes 7.15, 11.7, 22.103, 27.2);<br/>
    c) précisions relatives au fait que les plonges électriques à usage commercial ne sont pas destinées aux endroits ouverts au public (Article 1);<br/>
    d) alignement de certaines exigences sur les normes relatives aux appareils de restauration commerciale (Article 1 et paragraphes 5.101, 11.4, 11.7, 15.1.1, 22.101, 22.102, 22.103, 23.3, 25.3, 27.2).<br/>
    La présente partie 2 doit être utilisée conjointement avec la dernière édition de l'IEC 60335-1 et ses amendements sauf si cette édition l'exclut; dans ce cas, la dernière édition qui n'exclut pas la présente partie 2 est utilisée. Elle a été établie sur la base de la sixième édition (2020) de cette norme.
