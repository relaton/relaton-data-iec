abstract:
- language: en
  script: Latn
  content: This part of IEC 61076 specifies circular connectors with bayonet locking
    size B12, B17, B23 and B40, typically used for power, signal and data transmissions
    in industrial applications. These connectors consist of fixed and free connectors
    either rewirable or non-rewirable.
- language: fr
  script: Latn
  content: La présente partie de l’IEC 61076 spécifie les connecteurs circulaires
    avec verrouillage à baïonnette des tailles B12, B17, B23 et B40, qui sont généralement
    utilisés pour la transmission de signaux, de puissance et de données dans des
    applications industrielles. Ces connecteurs se composent d’embases et de fiches
    démontables ou non.
