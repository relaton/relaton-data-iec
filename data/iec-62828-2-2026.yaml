abstract:
- language: en
  script: Latn
  content: |-
    IEC 62828-2:2026 establishes specific procedures for testing pressure process measurement transmitters (PMT) used in measuring and control systems for industrial processes and for machinery. A pressure PMT can feature a remote seal to bring the process variable to the sensing element in the PMT. When the remote seal cannot be separated from the PMT, the complete device is tested. For general test procedures, reference is made to IEC 62828-1, which is applicable to all types of process measurement transmitters.<br/>
    NOTE In industrial and process applications, to indicate the process measurement transmitters, it is common also to use the terms "industrial transmitters", or "process transmitters".<br/>
    This second edition cancels and replaces the first edition published in 2017. This edition constitutes a technical revision.<br/>
    This edition includes the following significant technical changes with respect to the previous edition:<br/>
    a) revision according to the latest IEC rules;<br/>
    b) comparison with the general part of IEC 62828-1;<br/>
    c) additions and more precise definitions in the “Terms and definitions” clause;<br/>
    d) correction of the calculation formulas for the measurement error;<br/>
    e) more precise formulation of long-term drift;<br/>
    f) extension of additional tests;<br/>
    g) transfer of the annex “Example of signal current range for a 4 to 20 mA PMT” in IEC 62828-1;<br/>
    h) new Annex C “Main characteristics for pressure transmitters”.
- language: fr
  script: Latn
  content: |-
    <!-- NEW! -->IEC 62828-2:2026 est disponible sous forme de IEC 62828-2:2026 RLV qui contient la Norme internationale et sa version Redline, illustrant les modifications du contenu technique depuis l'édition précédente.<br/>
    <br/>
    L'IEC 62828-2:2026 établit les procédures d'essai spécifiques des transmetteurs de mesure de processus (PMT, Process Measurement Transmitter) de pression utilisés dans les systèmes de mesure et de commande des processus industriels et des machines. Un PMT de pression peut être équipé d'un joint distant pour amener la variable de processus à l'élément de détection dans le PMT. Si le joint distant ne peut pas être séparé du PMT, l'appareil complet est soumis à l'essai. Pour les procédures d'essai générales, il est fait référence à l'IEC 62828‑1 qui s'applique à tous les types de transmetteurs de mesure de processus.<br/>
    NOTE Dans des applications industrielles et de processus, les termes "transmetteurs industriels" ou "transmetteurs de processus" sont souvent utilisés pour désigner les transmetteurs de mesure de processus.<br/>
    Cette deuxième édition annule et remplace la première édition parue en 2017. Cette édition constitue une révision technique.<br/>
    Cette édition inclut les modifications techniques majeures suivantes par rapport à l'édition précédente:<br/>
    a) révision selon les dernières règles de l'IEC;<br/>
    b) comparaison avec la partie générale de l'IEC 62828‑1;<br/>
    c) ajouts et définitions plus précises à l'article "Termes et définitions";<br/>
    d) correction des formules de calcul pour l'erreur de mesure;<br/>
    e) formulation plus précise de la dérive à long terme;<br/>
    f) extension des essais supplémentaires;<br/>
    g) transfert de l'annexe "Exemple de plage de courant de signal d'un PMT 4 mA à 20 mA" dans l'IEC 62828‑1;<br/>
    f) ajout d'une nouvelle Annexe C intitulée "Caractéristiques principales des transmetteurs de pression".
