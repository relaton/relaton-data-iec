abstract:
- language: en
  script: Latn
  content: |-
    IEC 81355-1:2024 provides rules and guidelines for the classification and designation of information containers based on their inherent content. This document is applicable for information used in the life cycle of a system, e.g., industrial plants, construction entities and equipment.<br/>
    This document defines classes of information and their information kind classification code (ICC). The defined classes and codes provided are used as values associated with metadata, e.g., in information management systems (see IEC 82045-1 and IEC 82045-2).<br/>
    The rules, guidelines and classes are general and are applicable to all technical areas, for example, mechanical engineering, electrical engineering, construction engineering and process engineering. They can be used for systems based on different technologies or for systems combining several technologies.<br/>
    This document also has the status of a horizontal publication in accordance with IEC Guide 108. It is intended for use by technical committees in preparation of publications related to classification and designation of information.<br/>
    IEC 81355-1:2024 cancels and replaces the second edition of IEC 61355-1 published in 2008. This edition constitutes a technical revision.<br/>
    This edition includes the following significant technical changes with respect to IEC 61355-1:2008:<br/>
    a) focusing on classification of information rather that classification of document kinds;<br/>
    b) introduced a classification scheme based on inherent content of information;<br/>
    c) introduced a distinction between an information container and a document, the latter being for human perception;<br/>
    d) introduction of information kind classification code (ICC), replacing document kind classification code (DCC);<br/>
    e) introduced structuring of information containers;<br/>
    f) introduced an information model of the concepts dealt with;<br/>
    g) introduced a conversion table for merging from the use of DCC to the use of ICC.
- language: fr
  script: Latn
  content: |-
    L’IEC 81355-1:2024 fournit des règles et des lignes directrices pour la classification et la désignation des conteneurs d’information en fonction de leur contenu intrinsèque. Le présent document est applicable aux informations utilisées dans le cycle de vie d'un système, par exemple, les installations industrielles, les entités de construction et les matériels.<br/>
    Le présent document définit des classes d’information et leur code de classification des types d'information (ICC - Information kind Classification Code). Les classes et codes définis fournis sont utilisés comme valeurs associées aux métadonnées, par exemple, dans les systèmes de gestion de l’information (voir l’IEC 82045-1 et l’IEC 82045-2).<br/>
    Les règles, lignes directrices et classes énoncées sont générales et s’appliquent à tous les domaines techniques (par exemple, génie mécanique, génie électrique, génie civil et génie des procédés). Elles peuvent être utilisées pour des systèmes fondés sur des technologies différentes, ou pour des systèmes qui combinent plusieurs technologies.<br/>
    Le présent document a aussi le statut d’une publication horizontale conformément au Guide 108 de l’IEC. Il est destiné à être utilisé par les comités d’études pour l’établissement de publications liées à la classification et à la désignation des informations.<br/>
    L’IEC 81355-1:2024 annule et remplace la deuxième édition de l’IEC 61355-1 parue en 2008. Cette édition constitue une révision technique.<br/>
    Cette édition inclut les modifications techniques majeures suivantes par rapport à l’IEC 61355-1:2008:<br/>
    a) mise de l’accent sur la classification des informations plutôt que sur la classification des types de document;<br/>
    b) introduction d’un système de classification fondé sur le contenu intrinsèque de l’information;<br/>
    c) introduction d’une distinction entre un conteneur d’information et un document, celui-ci étant destiné à être perçu par l’homme;<br/>
    d) introduction d’un code de classification des types d’information (ICC), qui remplace le code de classification des sortes de documents (DCC);<br/>
    e) introduction d’une structuration des conteneurs d’information;<br/>
    f) introduction d’un modèle d’information des concepts traités;<br/>
    g) introduction d’une table de conversion pour passer de l’utilisation du DCC à l’utilisation de l’ICC.
