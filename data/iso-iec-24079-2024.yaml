     <w:data>08D0C9EA79F9BACE118C8200AA004BA90B02000000080000000D0000005F00520065006600390039003100390030003600350030000000</w:data>
    </xml><![endif]--><!-- [if supportFields]><span lang=EN-GB
    style='mso-ansi-language:EN-GB'><span style='mso-element:field-end'></span></span><![endif]--> identifies. Two of these references are particularly relevant:</p>

    <!-- [if !supportLists]-->DMTF DSP0222, <em style="mso-bidi-font-style: normal;">Network Controller Sideband Interface (NC-SI) Specification</em>, provides the NC‑SI base control that is to be bound over MCTP by this specification.
     <!--[endif]-->DMTF DSP0236, <em style="mso-bidi-font-style: normal;">Management Component Transport Protocol (MCTP) Base Specification</em>, defines the MCTP transport on which the NC-SI Control and Pass-through packets are to be conveyed.
