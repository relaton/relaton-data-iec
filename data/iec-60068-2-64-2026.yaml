abstract:
- language: en
  script: Latn
  content: |-
    IEC 60068-2-64:2026 demonstrates the adequacy of a specimen to resist dynamic loads without unacceptable degradation of its functional and structural integrity (or either of them) when subjected to the specified random vibration test requirements. Broadband random vibration can be used to identify accumulated stress effects and the resulting mechanical weakness and degradation in the specified performance. This information, in conjunction with the relevant specification, can be used to assess the acceptability of specimens. This third edition cancels and replaces the second edition, published in 2008, and Amendment 1:2019. This edition constitutes a technical revision.<br/>
    This edition includes the following significant technical changes with respect to the previous edition:<br/>
    a) update of Annex A with references to examples;<br/>
    b) introduction of an organizational deviation treatment;<br/>
    c) clarification on requirements.
- language: fr
  script: Latn
  content: |-
    L'IEC 60068-2-64:2026 démontre la capacité d'un spécimen à résister aux charges dynamiques sans dégradation inacceptable de son intégrité fonctionnelle et/ou structurelle, lorsqu'il est soumis à des exigences d'essais de vibrations aléatoires spécifiées. Les vibrations aléatoires à large bande peuvent être utilisées pour mettre en évidence les effets de l'accumulation des contraintes ainsi que les faiblesses mécaniques et les dégradations des performances spécifiées. Ces informations, conjointement avec la spécification pertinente, peuvent être utilisées pour évaluer l'acceptabilité des spécimens. Cette troisième édition annule et remplace la deuxième édition parue en 2008 et l'Amendement 1:2019. Cette édition constitue une révision technique.<br/>
    Cette édition inclut les modifications techniques majeures suivantes par rapport à l'édition précédente:<br/>
    a) mise à jour de l'Annexe A avec des références à des exemples;<br/>
    b) ajout du traitement des écarts organisationnels;<br/>
    c) clarification des exigences.
