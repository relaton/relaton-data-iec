abstract:
- language: en
  script: Latn
  content: |-
    IEC 62282-3-200:2025 RLV contains both the official IEC International Standard and its Redline version. The Redline version is available in English only and provides you with a quick and easy way to compare all the changes between the official IEC Standard and its previous edition.<br/>
    <br/>
    IEC 62282-3-200:2025 covers operational and environmental aspects of the stationary fuel cell power systems performance. The test methods apply as follows:<br/>
    - power output under specified operating and transient conditions;<br/>
    - electrical and heat recovery efficiency under specified operating conditions;<br/>
    - environmental characteristics, for example, exhaust gas emissions, noise, under specified operating and transient conditions.<br/>
    This document applies to all kinds of stationary fuel cell technologies, such as:<br/>
    - alkaline fuel cells (AFC);<br/>
    - phosphoric acid fuel cells (PAFC);<br/>
    - polymer electrolyte fuel cells (PEFC);<br/>
    - molten carbonate fuel cells (MCFC);<br/>
    - solid oxide fuel cells (SOFC).<br/>
    This third edition cancels and replaces the second edition published in 2015. This edition includes the following significant technical changes with respect to the previous edition:<br/>
    - revision of the Introduction, Scope and Clause 3;<br/>
    - revision of the symbols in Table 1;<br/>
    - revision of Figure 2 (symbol diagram);<br/>
    - revision of measurement methods (8.3);<br/>
    - revision of the efficiency test (10.2);<br/>
    - revision of the electric power and thermal power response characteristics test (10.3);<br/>
    - revision of the start-up and shutdown characteristics test (10.4);<br/>
    - revision of Annex C.
