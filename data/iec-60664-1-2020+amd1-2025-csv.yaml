abstract:
- language: en
  script: Latn
  content: |-
    IEC 60664-1:2020+AMD1:2025 CSV deals with insulation coordination for equipment having a rated voltage up to AC 1 000 V or DC 1 500 V connected to low-voltage supply systems. This document applies to frequencies up to 30 kHz. It applies to equipment for use up to 2 000 m above sea level and provides guidance for use at higher altitudes. It provides requirements for technical committees to determine clearances, creepage distances and criteria for solid insulation. It includes methods of electrical testing with respect to insulation coordination. The minimum clearances specified in this document do not apply where ionized gases are present. Special requirements for such situations can be specified at the discretion of the relevant technical committee. This document does not deal with distances:<br/>
    – through liquid insulation;<br/>
    – through gases other than air;<br/>
    – through compressed air.<br/>
    This edition includes the following significant technical changes with respect to the previous edition:<br/>
    update of the Scope, Clauses 2 and 3,<br/>
    addition of 1 500 V DC into tables,<br/>
    new structure for Clauses 4 and 5,<br/>
    addition of Annex G with a flowchart for clearances,<br/>
    addition of Annex H with a flowchart for creepage distances,<br/>
    update of distances altitude correction in a new Table F.10.<br/>
    It has the status of a basic safety publication in accordance with IEC Guide 104.
