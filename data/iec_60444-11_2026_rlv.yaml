abstract:
- content: "IEC 60444-11:2026 RLV contains both the official IEC International Standard
    and its Redline version. The Redline version is available in English only and
    provides you with a quick and easy way to compare all the changes between the
    official IEC Standard and its previous edition.<br /><br />\r\nIEC 60444-11:2026
    defines the standard method of measuring load resonance frequency fL at the nominal
    value of CL, and the determination of the effective load capacitance CLeff at
    the nominal frequency for crystals with the figure of merit M > 4.<br />\r\nThis
    edition includes the following significant technical changes with respect to the
    previous edition:<br />\r\na) key content of withdrawn IEC TR 60444-4 is reproduced
    as Annex A;<br />\r\nb) some formulae in the first edition have been corrected."
