abstract:
- language: en
  script: Latn
  content: "IEC 61788-15:2026 describes measurements of the intrinsic surface impedance
    (Zs) of HTS films at microwave frequencies by a modified two-resonance mode dielectric
    resonator method. The object of measurement is to obtain the temperature dependence
    of the intrinsic Zs at the resonant frequency f0.<br />\r\nThe frequency and thickness
    range and the measurement resolution for the Zs of HTS films are as follows:<br
    />\r\n- frequency: up to 40 GHz;<br />\r\n- film thickness: greater than 50 nm;<br
    />\r\n- measurement resolution: 0,01 mΩ at 10 GHz.<br />\r\nIt is crucial that
    the Zs data at the measured frequency, and that scaled to 10 GHz be reported for
    comparison, assuming the f2 rule for the intrinsic surface resistance, Rs (f <
    40 GHz), and the f rule for the intrinsic surface reactance, Xs. This second edition
    cancels and replaces the first edition published in 2011. This edition constitutes
    a technical revision.<br />\r\nThis edition includes the following significant
    technical changes with respect to the previous edition:<br />\r\n- informative
    Annex B, combined relative standard uncertainty in the intrinsic surface impedance
    is added;<br />\r\n- the terms, ‘precision and accuracy’, are replaced with uncertainty;<br
    />\r\n- results from a round robin test are added."
- language: fr
  script: Latn
  content: "L'IEC 61788-15:2026 décrit les mesures de l'impédance de surface intrinsèque
    (Zs) des films HTS aux fréquences micro-ondes par une méthode modifiée du résonateur
    diélectriques en mode deux résonances. L'objet de la mesure est d'obtenir la dépendance
    de l'impédance intrinsèque Zs vis-à-vis de la température à la fréquence de résonance
    f0.<br />\r\nLa plage de fréquences et d'épaisseurs et la résolution de mesure
    pour l'impédance Zs des films HTS sont les suivantes:<br />\r\n- fréquence: jusqu'à
    40 GHz;<br />\r\n- épaisseur du film: supérieure à 50 nm;<br />\r\n- résolution
    de mesure: 0,01 mΩ à 10 GHz.<br />\r\nIl est crucial que les données Zs à la fréquence
    mesurée et celles normalisées à 10 GHz soient consignées à des fins de comparaison,
    en prenant pour hypothèse la règle f2 pour la résistance de surface intrinsèque
    RS (f < 40 GHz) et la règle f pour la réactance de surface intrinsèque Xs. Cette
    deuxième édition annule et remplace la première édition parue en 2011. Cette édition
    constitue une révision technique.<br />\r\nCette édition inclut les modifications
    techniques majeures suivantes par rapport à l'édition précédente:<br />\r\n- l'Annexe
    B informative, concernant l'incertitude type relative composée de l'impédance
    de surface intrinsèque, a été ajoutée;<br />\r\n- les termes \"fidélité\" et \"exactitude\"
    ont été remplacés par \"incertitude\";<br />\r\n- les résultats d'un essai comparatif
    interlaboratoire ont été ajoutés."
