abstract:
- language: en
  script: Latn
  content: |-
    IEC/IEEE 82079-1:2019 is jointly developed and published by IEC, IEEE, and ISO and provides general principles and detailed requirements for the design and formulation of all types of instructions for use that will be necessary or helpful for users of products of all kinds, ranging from a tin of paint to large or highly complex products, such as large industrial machinery, turnkey based plants or buildings.<br/>
    IEC/IEEE 82079-1:2019 cancels and replaces the first edition IEC 82079-1:2012. This edition constitutes a technical revision. It includes the following significant technical changes with respect to the previous edition:<br/>
    a) The structure of this document has been rearranged in order to facilitate application of the standard and to make it easier to find information. Where possible, the language has been simplified.<br/>
    b) Information for use is introduced as a generic term. Instructions for use is a synonym for information for use. Step-by-step instructions is used as a subset of information for use.<br/>
    c) Clause 5 (principles) is revised and focuses on the purpose of information for use, the quality of information and the process for management of information.<br/>
    d) The process for preparation of information for use is integrated in the normative part and addressed comprehensively.<br/>
    e) Empirical methods for the evaluation of information for use are described in the normative part.<br/>
    f) The professional competencies needed for the preparation of information for use are addressed more comprehensively.<br/>
    g) Some aspects have been added to general requirements for information for use for complex systems of systems.<br/>
    h) Consideration is given to instructions for self-assembly products.<br/>
    i) An informative annex providing guidance on the fulfilment of specified requirements is introduced.<br/>
    IEC/IEEE 82079-1:2019 has the status of a horizontal standard in accordance with IEC Guide 108. It is primarily intended for use by technical committees in the preparation of standards in accordance with the principles laid down in IEC Guide 108.<br/>
    One of the responsibilities of a technical committee is, wherever applicable, to make use of horizontal standards in the preparation of its publications. The contents of this horizontal standard will not apply unless specifically referred to or included in the relevant publications.
- language: fr
  script: Latn
  content: |-
    L'IEC/IEEE 82079-1:2019 est développée et publiée conjointement par l'IEC, l'IEEE et l'ISO et fournit les principes généraux et les exigences détaillées pour la conception et la formulation de tous les types d'instructions d'utilisation, qui seront nécessaires ou utiles pour les utilisateurs de produits de toutes sortes, du pot de peinture aux produits de grande taille ou très complexes, comme les grandes machines industrielles, les usines ou les bâtiments clés en main.<br/>
    IEC/IEEE 82079-1:2019 annule et remplace la première édition IEC 82079-1:2012. Cette édition constitue une révision technique. Elle inclut les modifications techniques majeures suivantes par rapport à l'édition précédente:<br/>
    a) La structure du présent document a été réorganisée afin de faciliter l'application de la norme et la recherche de l'information. Le langage utilisé a été simplifié dans toute la mesure du possible.<br/>
    b) Les informations d'utilisation sont introduites en tant que terme générique. Les instructions d'utilisation et les informations d'utilisation sont synonymes. Les instructions étape par étape sont utilisées comme un sous-ensemble des informations d'utilisation.<br/>
    c) L'Article 5 (Principes) révisé porte sur l'objet des informations pour l'utilisation, la qualité des informations et le processus de gestion des informations.<br/>
    d) Le processus d'établissement des informations d'utilisation est intégré dans la partie normative et traité de manière exhaustive.<br/>
    e) Les méthodes empiriques d'évaluation des informations d'utilisation sont décrites dans la partie normative.<br/>
    f) Les aptitudes professionnelles nécessaires pour l'établissement des informations d'utilisation sont traitées de manière plus complète.<br/>
    g) Certains aspects ont été ajoutés aux exigences générales concernant les informations d'utilisation relatives aux systèmes complexes de réseaux.<br/>
    h) Les instructions relatives aux produits en kit sont prises en considération.<br/>
    i) Une annexe informative fournissant des recommandations pour la satisfaction aux exigences spécifiées est introduite.<br/>
    L'IEC/IEEE 82079-1:2019 a le statut de norme horizontale conformément au Guide IEC 108. Elle est essentiellement destinée à l'usage des comités d'études dans la préparation des normes, conformément aux principes établis dans le Guide 108 de l'IEC.<br/>
    Une des responsabilités d'un comité d'études est, partout où cela est possible, de se servir des normes horizontales lors de la préparation de ses publications. Le contenu de cette norme horizontale ne s'appliquera pas, à moins qu'il ne soit spécifiquement désigné ou inclus dans les publications concernées.
