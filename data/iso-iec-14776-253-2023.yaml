abstract:
- language: en
  script: Latn
  content: |-
    <p class="MsoNormal">This standard describes a SCSI transport protocol (see SAM-6) for USB-2 and USB-3 with the following properties:</p>
    <p class="MsoListParagraphCxSpFirst" style="text-indent: -18pt; padding-left: 40px;"><!-- [if !supportLists]-->a)      <!--[endif]-->a mechanism to send commands associated with any T10 command standard to a USB device;</p>
    <p class="MsoListParagraphCxSpMiddle" style="text-indent: -18pt; padding-left: 40px;"><!-- [if !supportLists]-->b)     <!--[endif]-->compliance with SCSI Architecture Model – 6 (e.g., autosense and command queuing); and</p>
    <p class="MsoListParagraphCxSpLast" style="text-indent: -18pt; padding-left: 40px;"><!-- [if !supportLists]-->c)      <!--[endif]-->other capabilities.</p>
