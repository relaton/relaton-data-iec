abstract:
- content: "<p>This document specifies data objects and encoding rules of generic
    eID-Systems in terms of building blocks for mobile document system infrastructures,
    and standardizes generic data models for data exchanges between mdoc apps and
    verification applications.</p><p>This document is applicable to entities involved
