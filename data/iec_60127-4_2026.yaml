abstract:
- content: "IEC 60127-4:2026 relates to universal modular fuse-links (UMF) for printed
    circuits and other substrate systems, used for the protection of electric appliances,
    electronic equipment, and component parts thereof, normally intended to be used
    indoors. It does not apply to fuse-links for appliances intended to be used under
    special conditions, such as in a corrosive or explosive atmosphere. These fuses
    are normally intended to be mounted or replaced only by appropriately skilled
    persons using specialized equipment. This document applies in addition to the
    requirements of IEC 60127-1. The objectives of this part of IEC 60127 are as given
    in IEC 60127-1, with the additional requirement of a degree of non-interchangeability.
    This fourth edition cancels and replaces the third edition published in 2005,
    Amendment 1:2008 and Amendment 2:2012. This edition constitutes a technical revision.<br
    />\r\nThis edition includes the following significant technical changes with respect
    to the previous edition:<br />\r\na) align to IEC 60127-1:2023, third edition;<br
    />\r\nb) enhance the rated current of UMFs to 100A and provide the corresponding
    maximum voltage drop and maximum sustained dissipation;<br />\r\nc) modify the
    figures;<br />\r\nd) update the normative references to the latest version.<br
    />\r\nThis International Standard is to be used in conjunction with IEC 60127-1:2023"
  language:
  - en
  script:
  - Latn
  format: text/html
- content: "IEC 60127-4:2026 s'applique aux éléments de remplacement modulaires universels
    (UMF, Universal Modular Fuse-link) pour circuits imprimés et d'autres substrats,
    qui sont utilisés pour assurer la protection des appareils électriques, des matériels
    électroniques et de leurs composants, normalement destinés à être utilisés en
    intérieur.<br />\r\nElle ne s'applique pas aux éléments de remplacement placés
    dans des appareils destinés à être utilisés dans des conditions particulières,
    comme des atmosphères corrosives ou explosives.Ces coupe-circuits sont normalement
    destinés à être montés ou remplacés uniquement par des personnes qualifiées possédant
    les compétences appropriées, à l'aide de matériels spéciaux. Le présent document
    s'applique, en plus des exigences de l'IEC 60127-1. Les objectifs de la présente
    partie de l'IEC 60127 sont identiques à ceux indiqués dans l'IEC 60127-1, auxquels
    s'ajoute l'exigence supplémentaire concernant le degré de non interchangeabilité.
    Cette quatrième édition annule et remplace la troisième édition parue en 2005,
    l'Amendement 1:2008 et l'Amendement 2:2012. Cette édition constitue une révision
    technique.<br />\r\nCette édition inclut les modifications techniques majeures
    suivantes par rapport à l'édition précédente:<br />\r\na) alignement sur la troisième
    édition de l'IEC 60127-1:2023;<br />\r\nb) augmentation du courant assigné des
    UMF à 100 A et indication de la chute de tension maximale et de la puissance dissipée
    maximale en régime continu correspondantes;<br />\r\nc) modification des figures;<br
    />\r\nd) mise à jour des références normatives sur la version la plus récente.<br
    />\r\nLa présente Norme internationale doit être utilisée conjointement avec l'IEC
    60127-1:2023"
