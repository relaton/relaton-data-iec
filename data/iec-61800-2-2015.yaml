abstract:
- language: en
  script: Latn
  content: |-
    IEC 61800-2:2015 applies to adjustable speed electric a.c. power drive systems, which include semiconductor power conversion and the means for their control, protection, monitoring, measurement and the a.c. motors. It applies to adjustable speed electric power drive systems intended to feed a.c. motors from a BDM connected to line-to-line voltages up to and including 1 kV a.c. 50 Hz or 60 Hz and/or voltages up to and including 1,5 kV d.c. input side.<br/>
    NOTE 1 Adjustable speed electric a.c. power drive systems intended to feed a.c. motors, and with rated converter input voltages above 1 000 V a.c. are covered by IEC 61800-4.<br/>
    NOTE 2 Adjustable speed electric d.c. power drive systems intended to feed d.c. motors are covered by IEC 61800-1.<br/>
    NOTE 3 For adjustable speed electric a.c. power drive systems having series-connected electronic power converter sections, the line-to-line voltage is the sum of the series connected input voltages.<br/>
    Traction applications and electric vehicles are excluded from the scope of this standard. IEC 61800-2:2015 is intended to define the following aspects of an a.c. power drive system (PDS):<br/>
    - principal parts of the PDS;<br/>
    - ratings and performance;<br/>
    - specifications for the environment in which the PDS is intended to be installed and operated;<br/>
    - other specifications which might be applicable when specifying a complete PDS.<br/>
    This standard provides minimum requirements, which may be used for the development of a specification between customer and manufacturer. This edition includes the following significant technical changes with respect to the previous edition.<br/>
    a) Clause 1 (Scope) has been updated,<br/>
    b) Clause 2 (Normative references) has been updated,<br/>
    c) Clause 3 (Definitions) has been updated including fundamental definitions to be used across the IEC 61800 series of standards,<br/>
    d) Clause 4 has been updated with respect to:<br/>
    1) description of the basic topology for BDM/CDM/PDS (4.2);<br/>
    2) ratings and performance (4.3 and 4.4);<br/>
    3) reference to applicable standards within the IEC 61800 series with respect to EMC (IEC 61800-3), Electrical safety (IEC 61800-5-1), Functional safety (IEC 61800-5-2), Load duty aspects (IEC TR 61800-6), Communication profiles (IEC 61800-7 series) and Power interface voltage (IEC TS 61800-8) to avoid conflicting requirements (4.5, 4.6, 4.7, 4.10, 4.11, 4.12);<br/>
    4) update of requirement for ECO design (4.8);<br/>
    5) update of requirement for environmental evaluation (4.9);<br/>
    6) implementation of requirement for explosive atmosphere (4.13).<br/>
    e) Clause 5 has been updated with test requirement in order to provide a clear link between design requirement and test requirement.<br/>
    f) Clause 6 has been updated to harmonize the marking and documentation requirement within the IEC 61800 series.<br/>
    g) Existing Annexes A to G have been deleted and replaced with new Annexes A to C.
- language: fr
  script: Latn
  content: |-
    L'IEC 61800-2:2015 s'applique aux systèmes d'entraînement électrique alternatifs à vitesse variable, incluant les convertisseurs à semi-conducteurs et les moyens permettant de les commander, de les protéger, de les surveiller, de les mesurer, ainsi que les moteurs à courant alternatif. Elle s'applique aux systèmes d'entraînement électrique à vitesse variable destinés à alimenter les moteurs à courant alternatif d'un BDM connecté aux tensions entre phases jusqu'à et y compris 1 kV en courant alternatif, 50 Hz ou 60 Hz et/ou des tensions jusqu'à et y compris 1,5 kV en courant continu côté entrée.<br/>
    NOTE 1 Les systèmes d'entraînement électrique alternatifs à vitesse variable destinés à alimenter les moteurs à courant alternatif, dont les tensions d'entrée assignées du convertisseur sont supérieures à 1 000 V en courant alternatif sont traités par l'IEC 61800-4.<br/>
    NOTE 2 Les systèmes d'entraînement électrique continus à vitesse variable destinés à alimenter les moteurs à courant continu sont traités par l'IEC 61800-1.<br/>
    NOTE 3 Pour les systèmes d'entraînement électrique alternatifs à vitesse variable comportant des sections de convertisseur de puissance électronique en série, la tension entre phases est égale à la somme des tensions d'entrée en série.<br/>
    Les applications de traction et les véhicules électriques sont exclus du domaine d'application de la présente norme. L'IEC 61800-2:2015 est destinée à définir les aspects suivants d'un entraînement électrique de puissance (PDS) à courant alternatif:<br/>
    - parties principales du PDS;<br/>
    - caractéristiques assignées et caractéristiques de fonctionnement;<br/>
    - spécifications de l'environnement d'installation et de fonctionnement prévu du PDS;<br/>
    - autres spécifications susceptibles d'être applicables lors de la spécification d'un PDS complet.<br/>
    La présente norme fournit les exigences minimales qui peuvent être utilisées pour le développement d'une spécification entre le client et le fabricant. Cette édition inclut les modifications techniques majeures suivantes par rapport à l'édition précédente.<br/>
    a) L'Article 1 (Domaine d'application) a été mis à jour,<br/>
    b) L'Article 2 (Références normatives) a été mis à jour,<br/>
    c) L'Article 3 (Définitions) a été mis à jour, y compris les définitions de base à utiliser dans la série IEC 61800,<br/>
    d) L'Article 4 a été mis à jour concernant la:<br/>
    1) description de la topologie de base des BDM/CDM/PDS (4.2);<br/>
    2) caractéristiques assignées et caractéristiques de fonctionnement (4.3 et 4.4);<br/>
    3) référence aux normes applicables dans la série de normes IEC 61800 relatives à la CEM (IEC 61800-3), la sécurité électrique (IEC 61800-5-1), la sécurité fonctionnelle (IEC 61800-5-2), les aspects liés au régime de charge (IEC TR 61800-6), les profils de communication (série IEC 61800-7) et la tension d'interface de puissance (IEC TS 61800-8) afin d'éviter les exigences conflictuelles (4.5, 4.6, 4.7, 4.10, 4.11, 4.12);<br/>
    4) mise à jour des exigences d'écoconception (4.8);<br/>
    5) mise à jour des exigences d'évaluation environnementale (4.9);<br/>
    application des exigences des atmosphères explosives (4.13).<br/>
    e) L'Article 5 a été mis à jour avec les exigences d'essai afin d'associer clairement les exigences de conception et les exigences d'essai.<br/>
    f) L'Article 6 a été mis à jour afin d'harmoniser les exigences de marquage et de documentation dans la série IEC 61800.<br/>
    g) Les Annexes A à G existantes ont été supprimées et remplacées par de nouvelles Annexes A à C.
