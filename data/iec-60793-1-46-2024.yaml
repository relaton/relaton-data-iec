abstract:
- language: en
  script: Latn
  content: |-
    IEC 60793-1-46:2024 establishes uniform requirements for the monitoring of changes in attenuation, thereby assisting in the inspection of fibres and cables for commercial purposes. This document gives two methods for monitoring the changes in attenuation of optical fibres and cables that occur during mechanical or environmental testing, or both. It provides a monitor in the change of attenuation characteristics arising from optical discontinuity, physical defects and modifications of the attenuation slope:<br/>
    - method A: change in attenuation by transmitted power;<br/>
    - method B: change in attenuation by backscattering.<br/>
    Methods A and B apply to the monitoring of all categories of the following fibres:<br/>
    - class A: multimode fibres;<br/>
    - class B: single-mode fibres;<br/>
    - class C: single-mode intraconnection fibres.<br/>
    Information common to both measurements is contained in Clause 1 to Clause 10, and information pertaining to each individual method appears in Annex A, and Annex B respectively.
- language: fr
  script: Latn
  content: |-
    L’IEC 60793-1-46:2024 établit des exigences uniformes pour le contrôle des variations de l’affaiblissement, contribuant ainsi au contrôle des fibres et câbles dans le cadre des relations commerciales. Le présent document décrit deux méthodes pour contrôler les variations de l’affaiblissement des fibres optiques et des câbles qui se produisent au cours des essais mécaniques et d’environnement, ou des deux. Il fournit un moyen de contrôle de la variation des caractéristiques d’affaiblissement qui proviennent de la discontinuité optique, de défauts physiques et de modifications de la pente d’affaiblissement:<br/>
    - Méthode A: variation de l’affaiblissement en puissance transmise;<br/>
    - Méthode B : variation de l’affaiblissement en rétrodiffusion.<br/>
    Les méthodes A et B s’appliquent au contrôle de toutes les catégories de fibres suivantes:<br/>
    - Classe A: fibres multimodales;<br/>
    - Classe B: fibres unimodales;<br/>
    - Classe C: fibres d’intraconnexion unimodales.<br/>
    Les informations communes aux deux mesures sont contenues dans les Articles 1 à 10 et les informations relatives à chacune des méthodes se trouvent respectivement dans les Annexe A et Annexe B.
