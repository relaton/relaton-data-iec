abstract:
- language: en
  script: Latn
  content: IEC TS 63537:2026 addresses the requirements for hardware-in-the-loop (HIL)
    simulation test of power system stability control system (see definition in 3.1.2).
    Its purpose is to provide guidelines encompassing the use of terms and definitions,
    as well as the objective and general requirements for HIL simulation test. The
    TS covers the test requirements, test system, test contents, and test quality
    management. This document improves the safe and stable operation of the power
    system.
