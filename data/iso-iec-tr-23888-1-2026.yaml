abstract:
- language: en
  script: Latn
  content: <p class="MsoBodyText">This document presents the role of artificial intelligence
    (AI) technologies, including neural networks (NN), in multimedia coding and processing
    activities. It describes the current perspectives on AI for multimedia and identifies
    working assumptions and technical challenges expected from working with AI and
    NN-based technologies. This document highlights a variety of multimedia coding
    activities, key scenarios and gaps that are to be addressed by further standardization
    efforts.</p>
