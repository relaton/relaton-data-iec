abstract:
- language: en
  script: Latn
  content: |-
    IEC 60079-10-2:2026 RLV contains both the official IEC International Standard and its Redline version. The Redline version is available in English only and provides you with a quick and easy way to compare all the changes between the official IEC Standard and its previous edition.<br/>
    <br/>
    IEC 60079-10-2 is concerned with the identification and classification of areas where explosive dust atmospheres and combustible dust layers are present in order to permit the proper assessment of ignition sources in such areas. In this document, explosive dust atmospheres and combustible dust layers are treated separately. In Clause 4, area classification for explosive dust clouds is described, with dust layers acting as one of the possible sources of release. In Clause 7, other general considerations for dust layers are described. The examples in this document are based on a system of effective housekeeping being implemented in the plant to prevent dust layers from accumulating. Where effective housekeeping is not present, the area classification includes the possible formation of explosive dust clouds from dust layers. The principles of this document can also be followed when combustible fibres or flyings might cause a hazard.<br/>
    Atmospheric conditions include variations in pressure and temperature above and below reference levels of 101,3 kPa (1 013 mbar) and 20 °C (293 K), provided that the variations have a negligible effect on the explosive properties of the combustible material. For air with normal oxygen content, typically a volume fraction of 21 % is assumed.<br/>
    It does not apply to:<br/>
    a) underground mining areas;<br/>
    b) dusts of explosives that do not require atmospheric oxygen for combustion such as pyrophoric substances, propellants, pyrotechnics, munitions, peroxides, oxidizers, water‑reactive elements or compounds, or other similar materials;<br/>
    c) catastrophic failures or rare malfunctions which are outside the conditions dealt with in this document;<br/>
    d) rooms used for medical purposes;<br/>
    e) domestic premises;<br/>
    f) where a hazard is due to the presence of flammable gas or vapour, but the principles can be used in the assessment of a hybrid mixture (see also IEC 60079-10-1).<br/>
    This document does not consider the effects of consequential damage following a fire or an explosion. Please refer to the foreword of the document for a detailed listing of the significant technical changes from the previous edition.
