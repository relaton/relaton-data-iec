abstract:
- language: en
  script: Latn
  content: IEC 63516:2026 defines the test method for providing uniform quality fixed folding durability test data to opto-electric wiring users. In particular, it provides a test condition for the tension and free tension folded state of the flexible opto-electric circuit boards of optic fibre type.
- language: fr
  script: Latn
  content: L'IEC 63516:2026 spécifie la méthode d'essai pour fournir aux utilisateurs de câblage optoélectrique des données d'essai de durabilité au pliage fixe de qualité uniforme. En particulier, il spécifie une condition d’essai pour les états pliés sous tension et sans tension des circuits optoélectriques souples de type à fibres optiques.
