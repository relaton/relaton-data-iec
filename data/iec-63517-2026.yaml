abstract:
- language: en
  script: Latn
  content: IEC 63517:2026 specifies a test method for the determination of heating
    performance of wearable heating e-textile products. Wearable heating textile products
    are made of e-textile parts including a portable battery for electric heating
    and conventional textile parts for garments. This document includes the test procedure
    for the heating temperature and power consumption of wearable heating garments
    such as jackets, vests, etc. Heating gloves and footwear are excluded. The safety
    and security of heating products are excluded, as the information on thermal safety
    limits for heating products is addressed in IEC 60335-2-17 and IEC 62368‑1. The
    performance and safety of the portable battery are also excluded.
- language: fr
  script: Latn
  content: L'IEC 63517:2026 spécifie une méthode d'essai pour la détermination de
    la performance de chauffage des produits e‑textiles chauffants prêts‑à‑porter.
    Les produits textiles chauffants prêts‑à‑porter sont composés de parties e‑textiles,
    y compris une batterie portable pour le chauffage électrique, et de parties textiles
    conventionnelles pour les vêtements. Ce document comprend le mode opératoire pour
    la température de chauffage et la consommation de puissance des vêtements chauffants
    prêts‑à‑porter tels que les vestes, les gilets, etc. Les gants et les chaussures
    chauffants sont exclus. La sûreté et la sécurité des produits chauffants sont
    exclues, étant donné que les informations sur les limites de sécurité thermique
    pour les produits chauffants sont traitées dans l'IEC 60335‑2‑17 et l'IEC 62368‑1.
    Les performances et la sécurité de la batterie portable sont également exclues.
