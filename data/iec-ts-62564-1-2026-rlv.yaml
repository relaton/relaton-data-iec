abstract:
- language: en
  script: Latn
  content: |-
    IEC TS 62564-1:2026 RLV contains both the official IEC International Standard and its Redline version. The Redline version is available in English only and provides you with a quick and easy way to compare all the changes between the official IEC Standard and its previous edition.<br/>
    <br/>
    IEC TS 62564-1:2026 defines the minimum requirements for integrated circuits and semiconductors which are designated as an "aerospace qualified electronic component (AQEC)".<br/>
    This edition includes the following significant technical changes with respect to the previous edition:<br/>
    a) addition of optional ADHP PPAP;<br/>
    b) revision to Annex B; addition of Annex C and Annex D;<br/>
    c) removal of STACK;<br/>
    d) general update to referenced standards throughout.
