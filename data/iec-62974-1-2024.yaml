abstract:
- language: en
  script: Latn
  content: |-
    IEC 62974-1:2024 specifies product and performance requirements for devices that fall under the heading of "monitoring and measuring systems used for data collection, aggregation and analysis", for industrial, commercial, and similar use rated below or equal to 1 kV AC and 1,5 kV DC.<br/>
    These devices are fixed and are intended to be used indoors as panel-mounted devices, or as modular devices fixed on a DIN rail, or as housing devices fixed on a DIN rail, or as devices fixed by other means inside a cabinet.<br/>
    These devices are used to upload or download information (energy measured on loads, power metering and monitoring data, temperature information, etc.), mainly for energy efficiency purposes. These devices are known as energy servers (ESE), energy data loggers (EDL), data gateways (DGW) and I/O data concentrators (IODC) and are grouped together under the family name of Data Management Devices (DMD).<br/>
    This document does not cover:<br/>
    • devices used only in the consumer market (living quarters) or household;<br/>
    • devices used in the smart metering infrastructure (e.g. smart meters);<br/>
    • devices used in the smart grid infrastructure;<br/>
    • devices used as IT servers in the information technology business;<br/>
    • power metering and monitoring devices (PMD);<br/>
    • I/O data concentrators already covered by a specific product standard;<br/>
    • communication protocols and interoperability;<br/>
    • power quality instruments (PQI);<br/>
    • software used for the data collection and analysis of the power quality for the supply side.<br/>
    IEC 62974-1:2024 cancels and replaces the first edition published in 2017. This edition constitutes a technical revision.<br/>
    This edition includes the following significant technical changes with respect to the previous edition:<br/>
    a) the performance criteria have been reviewed;<br/>
    b) EMC and safety requirements have been improved;<br/>
    c) mechanical requirements have been clarified and amended.
- language: fr
  script: Latn
  content: |-
    L'IEC 62974-1:2024 spécifie les exigences relatives aux produits et aux performances des dispositifs qui relèvent des "systèmes de surveillance et de mesure utilisés pour la collecte, l'agrégation et l'analyse de données", dans le cadre d'une exploitation industrielle, commerciale et analogue, et qui présentent des caractéristiques assignées inférieures ou égales à 1 kV en courant alternatif et à 1,5 kV en courant continu.<br/>
    Ces dispositifs sont fixes et sont destinés à une utilisation en intérieur comme les dispositifs montés sur panneau, les dispositifs modulaires fixés sur un rail DIN, les dispositifs en boîtier fixés sur un rail DIN ou les dispositifs fixés par un autre moyen à l'intérieur d'une armoire.<br/>
    Ces dispositifs permettent de charger ou de télécharger des informations (énergie mesurée sur les charges, données de mesure et de surveillance de la puissance, informations relatives à la température, etc.) essentiellement à des fins d'efficacité énergétique. Ces dispositifs répondent à différents noms: serveurs d'énergie (ESE), enregistreurs de données d'énergie (EDL), passerelles de données (DGW) et concentrateurs de données d'E/S (IODC). Ils sont regroupés sous le nom générique de dispositifs de management de données (DMD, Data Management Devices).<br/>
    Le présent document ne couvre pas:<br/>
    • les dispositifs à usage exclusivement grand public (espace de vie) ou domestique;<br/>
    • les dispositifs utilisés dans l'infrastructure de mesure intelligente (les compteurs intelligents, par exemple);<br/>
    • les dispositifs utilisés dans l'infrastructure de réseau intelligent;<br/>
    • les dispositifs utilisés comme serveurs IT dans le secteur des technologies de l'information;<br/>
    • les dispositifs de mesure et de surveillance de la puissance (PMD, Power Metering and monitoring Devices);<br/>
    • les concentrateurs de données d'E/S déjà couverts par une norme de produit particulière;<br/>
    • les protocoles de communication et l'interopérabilité;<br/>
    • les instruments de mesure de la qualité de l'alimentation (PQI, Power Quality Instruments);<br/>
    • les logiciels utilisés pour la collecte des données et l'analyse de la qualité de l'alimentation pour la partie production.<br/>
    L'IEC 62974-1:2024 annule et remplace la première édition parue en 2017. Cette édition constitue une révision technique.<br/>
    Cette édition inclut les modifications techniques majeures suivantes par rapport à l'édition précédente:<br/>
    a) les critères de performances ont été révisés;<br/>
    b) les exigences en matière de CEM et de sécurité ont été améliorées;<br/>
    c) les exigences mécaniques ont été clarifiées et modifiées.
