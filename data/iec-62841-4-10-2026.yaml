abstract:
- language: en
  script: Latn
  content: "IEC 62841-4-10:2026 applies to hand-held pole-mounted pruners which are
    designed for use by one operator for cutting tree branches with a cutting device
    and a fixed or detachable elongated construction such that the cutting device
    is distanced from the handles or grasping surfaces during use.<br />\r\nThis document
    does not cover the risk of electric shock associated with the intended use of
    pole-mounted pruners in the vicinity of overhead power lines.<br />\r\nThe cutting
    device of pole-mounted pruners can be<br />\r\n- a saw chain; or<br />\r\n- a
    reciprocating saw blade.<br />\r\nThis document does not apply to<br />\r\n- saws
    mounted on a pole where the distance measured between the point of the power switch
    closest to the cutting device and the nearest unguarded cutting edge of the cutting
    device is < 1 000 mm,<br />\r\n- pruning saws,<br />\r\n- chain saws as covered
    by IEC 62841-4-1,<br />\r\n- chain saws for tree service as covered by IEC 62841-4-9,<br
    />\r\n- hedge trimmers, including extended-reach hedge trimmers, as covered by
    IEC 62841‑4-2,<br />\r\n- brush saws and brush saws as covered in IEC 62841-4-4,<br
    />\r\n- scissors-type pruners, or<br />\r\n- machines designed for use with a
    circular saw blade.<br />\r\nNOTE 101 Pruning saws will be covered by a future
    part of IEC 62841-4.<br />\r\nNOTE 102 Scissors-type pruners will be covered by
    a future part of IEC 62841-4.<br />\r\nNOTE 103 In Europe (EN IEC 62841-4-10),
    this document does not apply to pole-mounted pruners equipped with integral batteries.<br
    />\r\nThis document is to be used in conjunction with the first edition of IEC
    62841-1:2014 and IEC 62841-1:2014/AMD1:2025.<br />\r\nNOTE The attention of National
    Committees is drawn to the fact that equipment manufacturers and testing organizations
    can need a transitional period following publication of a new, amended or revised
    IEC publication in which to make products in accordance with the new requirements
    and to equip themselves for conducting new or revised tests.<br />\r\nIt is the
    recommendation of the committee that the content of this publication be adopted
    for implementation nationally not earlier than 36 months from the date of publication."
- language: fr
  script: Latn
  content: "IEC 62841-4-10:2026 s'applique aux élagueuses sur perche portatives conçues
    pour être utilisées par un seul opérateur pour couper des branches d'arbre avec
    un dispositif de coupe et une construction allongée fixe ou amovible, de sorte
    que le dispositif de coupe soit éloigné des poignées ou des surfaces de préhension
    pendant l'utilisation.<br />\r\nLe présent document ne traite pas du risque de
    choc électrique associé à l'utilisation prévue des élagueuses sur perche à proximité
    de lignes électriques aériennes.<br />\r\nLe dispositif de coupe des élagueuses
    sur perche peut être<br />\r\n- une chaîne coupante; ou<br />\r\n- une lame de
    scie à mouvement alternatif.<br />\r\nLe présent document ne s'applique pas aux<br
    />\r\n- scies montées sur une perche où la distance mesurée entre le point de
    l'interrupteur de - - puissance le plus proche du dispositif de coupe et le bord
    de coupe non protégé le plus - - - proche du dispositif de coupe est <1 000 mm;<br
    />\r\n- scies d'élagage;<br />\r\n- scies à chaîne, couvertes par l'IEC 62841‑4‑1;<br
    />\r\n- scies à chaîne pour l'élagage des arbres, couvertes par l'IEC 62841‑4‑9;<br
    />\r\n- taille‑haies, y compris les taille‑haies télescopiques, couverts par l'IEC
    62841‑4‑2;<br />\r\n- débroussailleuses et débroussailleuses à lame de scie, couvertes
    par l'IEC 62841‑4‑4;<br />\r\n- élagueuses de type ciseaux; ou<br />\r\n- machines
    destinées à être utilisées avec une lame de scie circulaire.<br />\r\nNOTE 101 Les
    scies d'élagage seront couvertes par une partie ultérieure de l'IEC 62841‑4.<br
    />\r\nNOTE 102 Les élagueuses de type ciseaux seront couvertes par une partie
    ultérieure de l'IEC 62841‑4.<br />\r\nNOTE 103 En Europe (EN IEC 62841‑4‑10),
    le présent document ne s'applique pas aux élagueuses sur perche équipées de batteries
    non amovibles.<br />\r\nNOTE L'attention des Comités nationaux est attirée sur
    le fait que les fabricants d'appareils et les organismes d'essai peuvent avoir
    besoin d'une période transitoire après la publication d'une nouvelle publication
    IEC, ou d'une publication amendée ou révisée, pour fabriquer des produits conformes
    aux nouvelles exigences et pour adapter leurs équipements aux nouveaux essais
    ou aux essais révisés.<br />\r\nLe comité recommande que le contenu de cette publication
    soit adopté pour application nationale au plus tôt 36 mois après la date de publication."
