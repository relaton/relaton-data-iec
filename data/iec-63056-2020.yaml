abstract:
- language: en
  script: Latn
  content: |-
    IEC 63056:2020 specifies requirements and tests for the product safety of secondary lithium cells and batteries used in electrical energy storage systems (Figure 2) with a maximum DC voltage of 1 500 V (nominal).<br/>
    Basic safety requirements for the secondary lithium cells and batteries used in industrial applications are included in IEC 62619. This document provides additional or specific requirements for electrical energy storage systems.<br/>
    Since this document covers batteries for various electrical energy storage systems, it includes those requirements which are common and minimum to the electrical energy storage systems.<br/>
    Examples of appliances that are within the scope of this document are:<br/>
    • telecommunications,<br/>
    • central emergency lighting and alarm systems,<br/>
    • stationary engine starting,<br/>
    • photovoltaic systems,<br/>
    • home (residential) energy storage systems (HESS), and<br/>
    • large energy storage: on-grid/off-grid.<br/>
    This document applies to cells and batteries for uninterruptible power supplies (UPS).<br/>
    This document does not apply to portable systems 500 Wh or below, which are covered by IEC 61960-3.<br/>
    The contents of the corrigendum of June 2021 have been included in this copy.
- language: fr
  script: Latn
  content: |-
    L'IEC 63056:2020 spécifie les exigences et les essais pour la sécurité des produits des éléments et des batteries d'accumulateurs au lithium utilisés dans des systèmes de stockage d'énergie électrique (Figure 2) ayant une tension continue maximale de 1 500 V (nominale).<br/>
    L'IEC 62619 comprend les exigences relatives à la sécurité de base des éléments et batteries d'accumulateurs au lithium utilisés dans les applications industrielles. Le présent document inclut des exigences complémentaires ou particulières concernant les systèmes de stockage d'énergie électrique.<br/>
    Étant donné que le présent document couvre les batteries de différents systèmes de stockage d'énergie électrique, elle comprend les exigences minimales et communes aux systèmes de stockage d'énergie électrique.<br/>
    Les types suivants d'appareils sont des exemples d'appareils relevant du domaine d'application du présent document:<br/>
    • télécommunications,<br/>
    • systèmes centraux d'éclairage d'urgence et d'alarme d'urgence,<br/>
    • démarrage de moteur stationnaire,<br/>
    • systèmes photovoltaïques,<br/>
    • systèmes domestiques (résidentiels) de stockage d'énergie électrique (HESS, home energy storage systems), et<br/>
    • stockage d'énergie à grande échelle: sur réseau/hors réseau.<br/>
    Le présent document s'applique aux éléments et batteries conçus pour les alimentations sans interruption (ASI).<br/>
    Le présent document ne s'applique pas aux systèmes portables de 500 Wh ou moins, qui sont couverts par l'IEC 61960-3.<br/>
    Le contenu du corrigendum de juin 2021 a été pris en considération dans cet exemplaire.
