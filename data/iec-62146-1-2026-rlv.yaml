abstract:
- language: en
  script: Latn
  content: |-
    IEC 62146-1:2026 RLV contains both the official IEC International Standard and its Redline version. The Redline version is available in English only and provides you with a quick and easy way to compare all the changes between the official IEC Standard and its previous edition.<br/>
    <br/>
    IEC 62146-1:2026 includes generalities of capacitors used on alternating current circuit-breakers and introduces specifications for grading capacitors. Regarding grading capacitors, their function is to control the voltage distribution across the individual interrupter units of a multi-break circuit-breaker.<br/>
    This document applies to grading capacitors falling into one or both of the following categories for:<br/>
    - mounting on air-insulated circuit-breakers.<br/>
    - mounting on enclosed circuit-breakers (for example immersed in insulating gas, in oil, etc.).<br/>
    The object of this document is:<br/>
    - to define uniform rules regarding performances, testing and rating;<br/>
    - to define specific safety rules;<br/>
    - to provide a guidance for installation and operation.<br/>
    This document does not apply to capacitors not directly associated with high-voltage alternating current circuit-breakers.
