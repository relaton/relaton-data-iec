abstract:
- language: en
  script: Latn
  content: |-
    IEC 60335-2-25:2024 deals with the safety of microwave ovens for household and similar use, their rated voltage being not more than 250 V including direct current (DC) supplied appliances and battery-operated appliances. This standard also deals with combination microwave ovens, for which normative Annex AA is applicable. This standard also deals with microwave ovens intended to be used on board ships, for which normative Annex BB is applicable. Appliances not intended for normal household use but which nevertheless can be a source of danger to the public, such as appliances intended to be used by laymen in shops, in light industry and on farms, are within the scope of this standard. However, if the appliance is intended to be used professionally to process food for commercial purposes, the appliance is not considered to be for household and similar use only.<br/>
    As far as is practicable, this standard deals with the common hazards presented by appliances that are encountered by all persons in and around the home. However, in general, it does not take into account<br/>
    - persons (including children) whose physical, sensory or mental capabilities; or lack of experience and knowledge prevents them from using the appliance safely without supervision or instruction;<br/>
    - children playing with the appliance.<br/>
    Attention is drawn to the fact that<br/>
    - for appliances intended to be used in vehicles or on board ships or aircraft, additional requirements can be necessary;<br/>
    - in many countries, additional requirements are specified by the national health authorities, the national authorities responsible for the protection of labour and similar authorities.<br/>
    This standard does not apply to<br/>
    - commercial microwave ovens (IEC 60335-2-90);<br/>
    - commercial microwave appliances with insertion or contacting applicators (IEC 60335 2 110);<br/>
    - industrial microwave heating equipment (IEC 60519-6);<br/>
    - appliances for medical purposes (IEC 60601);<br/>
    - appliances intended to be used in locations where special conditions prevail, such as the presence of a corrosive or explosive atmosphere (dust, vapour or gas).<br/>
    This eighth edition cancels and replaces the seventh edition published in 2020. This edition constitutes a technical revision.<br/>
    This edition includes the following significant technical changes with respect to the previous edition:<br/>
    a) some subclauses have been modified for the appliance outlets and socket-outlets;<br/>
    b) Subclause 7.12 has been improved in clarity;<br/>
    c) Subclauses 8.1.1 and 20.2 have been modified to adopt test probe 19;<br/>
    d) Subclauses 10.1 and 10.2 have been improved in clarity for inverter type microwave ovens;<br/>
    e) maximum temperature rises of external accessible surfaces have been added in Subclause 11.8;<br/>
    f) test criterion has been modified in Subclause 15.101;<br/>
    g) Subclause 15.102 has been modified for harmonization with IEC 60335-2-6;<br/>
    h) Subclauses 8.1.3, 15.103, 19.11.2, 19.13, 22.105, 22.106, 22.111 and Figure 101 have been improved in clarity;<br/>
    i) Subclauses 22.103.2, 22.105 and 22.120 have been modified to adopt test probe 18;<br/>
    j) Subclause 16.101 has been modified to move the content of 16.101.1, 16.101.2 directly under 16.101;<br/>
    k) Subclause 22.119 has been modified to move the content of 22.119.1, 22.119.2 and 22.119.3 directly under 22.119.<br/>
    This part 2 is to be used in conjunction with the latest edition of IEC 60335-1 and its amendments unless that edition precludes it; in that case, the latest edition that does not preclude it is used. It was established on the basis of the sixth edition (2020) of that standard.
- language: fr
  script: Latn
  content: |-
    L'IEC 60335-2-25:2024 traite de la sécurité des fours à micro-ondes à usage domestique et analogue dont la tension assignée est inférieure ou égale à 250 V, y compris les appareils alimentés en courant continu (CC) et les appareils alimentés par batteries. La présente norme traite également des fours à micro-ondes combinés, pour lesquels l'Annexe AA normative s'applique. La présente norme traite également des fours à micro-ondes destinés à être utilisés à bord de navires, pour lesquels l'Annexe BB normative s'applique. Les appareils non destinés à un usage domestique normal, mais qui peuvent néanmoins constituer une source de danger pour le public, tels que les appareils destinés à être utilisés par des utilisateurs non avertis dans des magasins, chez des artisans et dans des fermes, sont compris dans le domaine d'application de la présente norme. Toutefois, si l'appareil est destiné à être utilisé par des professionnels pour la préparation d'aliments à des fins commerciales, cet appareil n'est pas considéré comme étant destiné uniquement à un usage domestique et analogue.<br/>
    Dans la mesure du possible, la présente norme traite des dangers courants que présentent les appareils et auxquels sont exposés tous les individus situés à l'intérieur et autour de l'habitation. Cependant, elle ne tient en général pas compte:<br/>
    - des personnes (y compris des enfants) dont les capacités physiques, sensorielles ou mentales; ou le manque d'expérience et de connaissance les empêchent d'utiliser l'appareil en toute sécurité sans surveillance ou instruction;<br/>
    - des enfants qui jouent avec l'appareil.<br/>
    L'attention est attirée sur le fait que<br/>
    - pour les appareils destinés à être utilisés dans des véhicules ou à bord de navires ou d'avions, des exigences supplémentaires peuvent être nécessaires;<br/>
    - dans de nombreux pays, des exigences supplémentaires sont spécifiées par les organismes nationaux de la santé, par les organismes nationaux responsables de la protection des travailleurs et par des organismes similaires.<br/>
    La présente norme ne s'applique pas<br/>
    - aux fours à micro-ondes à usage commercial (IEC 60335-2-90);<br/>
    - aux appareils à micro-ondes commerciaux avec applicateurs à insertion ou à contact (IEC 6033-2-110);<br/>
    - aux installations de chauffage industriel à hyperfréquences (IEC 60519-6);<br/>
    - aux appareils destinés à des usages médicaux (IEC 60601);<br/>
    - aux appareils destinés à être utilisés dans des locaux qui présentent des conditions particulières, telles que la présence d'une atmosphère corrosive ou explosive (poussière, vapeur ou gaz).<br/>
    Cette huitième édition annule et remplace la septième édition parue en 2020. Cette édition constitue une révision technique.<br/>
    Cette édition inclut les modifications techniques majeures suivantes par rapport à l'édition précédente:<br/>
    a) certains paragraphes ont été modifiés pour les socles femelles de connecteurs et les socles de prises de courant;<br/>
    b) le 7.12 a été amélioré pour plus de clarté;<br/>
    c) les 8.1.1 et 20.2 ont été modifiés afin d'utiliser le calibre d'essai 19;<br/>
    d) les 10.1 et 10.2 ont été améliorés pour les fours à micro-ondes de type onduleur;<br/>
    e) des valeurs d'échauffement maximales ont été ajoutées pour les surfaces accessibles extérieures en 11.8;<br/>
    f) le critère d'essai a été modifié en 15.101;<br/>
    g) le 15.102 a été modifié à des fins d'harmonisation avec l'IEC 60335-2-6;<br/>
    h) les 8.1.3, 15.103, 19.11.2, 19.13, 22.105, 22.106, 22.111 et la Figure 101 ont été améliorés pour plus de clarté;<br/>
    i) les 22.103.2, 22.105 et 22.120 ont été modifiés afin d'utiliser le calibre d'essai 18;<br/>
    j) le 16.101 a été modifié de manière à déplacer le contenu du 16.101.1 et du 16.101.2 directement sous le 16.101;<br/>
    k) le 22.119 a été modifié de manière à déplacer le contenu du 22.119.1, du 22.119.2 et du 22.119.3 directement sous le 22.119.<br/>
    La présente partie 2 doit être utilisée conjointement avec la dernière édition de l'IEC 60335-1 et ses amendements sauf si cette édition l'exclut. Dans ce cas, la dernière édition qui n'exclut pas la présente partie 2 est utilisée. Elle a été établie sur la base de la sixième édition (2020) de cette norme.
