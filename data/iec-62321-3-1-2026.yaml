abstract:
- language: en
  script: Latn
  content: |-
    <!-- NEW! -->IEC 62321-3-1:2026 is available as IEC 62321-3-1:2026 RLV which contains the International Standard and its Redline version, showing all changes of the technical content compared to the previous edition.<br/>
    <br/>
    IEC 62321-3-1:2026 describes the screening analysis of substances, specifically lead (Pb), mercury (Hg), cadmium (Cd), total chromium (Cr), total bromine (Br), total phosphorus (P), assuming the source of P is related to TCEP (CAS 115‑96‑8), Trixylyl-phosphate (CAS 25155‑23‑1), total chlorine (Cl), assuming the source of Cl is related to SCCP (CAS 85535‑84‑8), TCEP (CAS 115‑96‑8) , TBTC (CAS 1461‑22‑9), total tin (Sn), assuming the source of Sn is related to restricted organo-tin compounds, total antimony (Sb), assuming the source of Sb is related to Pyrochlore, and antimony lead yellow (CAS 8012‑00‑8) in uniform materials found in electrotechnical products, using the analytical technique of X‑ray fluorescence (XRF) spectrometry.<br/>
    This edition includes the following significant technical changes with respect to the previous editions of IEC 62321-3-1:2013 and IEC 62321:2008:<br/>
    a) This second edition of IEC 62321-3-1 includes the analysis of additional elements as indicators for additional substances. The selection is based on IEC TR 62936:2016. There are also comments about using the same methology for screening for content of critical raw materials (CRMs).<br/>
    This document has been given the status of a horizontal document in accordance with the ISO/IEC Directives, Part 1.
- language: fr
  script: Latn
  content: |-
    <!-- NEW! -->IEC 62321-3-1:2026 est disponible sous forme de IEC 62321-3-1:2026 RLV qui contient la Norme internationale et sa version Redline, illustrant les modifications du contenu technique depuis l'édition précédente.<br/>
    <br/>
    L'IEC 62321-3-1:2026 présente partie de l'IEC 62321 décrit une méthode de détection de substances, en particulier le plomb (Pb), le mercure (Hg), le cadmium (Cd), le chrome total (Cr), le brome total (Br), le phosphore total (P), en prenant pour hypothèse que la source de P est associée au TCEP (CAS 115‑96‑8) ou au phosphate de trixylyle (CAS 25155‑23‑1), le chlore total (Cl), en prenant pour hypothèse que la source de Cl est associée au PCCC (CAS 85535‑84‑8), au TCEP (CAS 115‑96‑8) ou au TBTC (CAS 1461‑22‑9), l'étain total (Sn), en prenant pour hypothèse que la source de Sn est associée aux composés organostanniques réglementés, l'antimoine total (Sb), en prenant pour hypothèse que la source de Sb est associée au pyrochlore ou à l'antimoniate de plomb (ou jaune de Naples) (CAS 8012‑00‑8), dans des matériaux homogènes rencontrés dans les produits électrotechniques, en utilisant la technique d'analyse de spectrométrie de fluorescence X (XRF, X‑Ray Fluorescence).<br/>
    Cette édition inclut les modifications techniques majeures suivantes par rapport aux éditions précédentes de l'IEC 62321‑3‑1:2013 et de l'IEC 62321:2008:<br/>
    a) Cette deuxième édition de l'IEC 62321‑3‑1 inclut l'analyse d'éléments complémentaires comme indicateurs de substances supplémentaires. La sélection repose sur l'IEC TR 62936:2016. Cette édition contient également des commentaires concernant l'utilisation de la même méthodologie pour la détection de la présence de matières premières critiques (CRM, Critical Raw Materials).<br/>
    Le présent document a obtenu le statut de publication horizontale conformément aux Directives ISO/IEC, Partie 1.
