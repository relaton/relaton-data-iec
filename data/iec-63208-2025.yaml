abstract:
- language: en
  script: Latn
  content: |-
    IEC 63208:2025 This document applies to the main functions of switchgear and controlgear and their assemblies, called equipment, in the context of operational technology (OT 3.1.34). It is applicable to equipment with wired or wireless data communication means and their physical accessibility, within their limits of environmental conditions. It is intended to achieve the appropriate physical and cybersecurity mitigation against vulnerabilities to security threats.<br/>
    This document provides requirements on the appropriate:<br/>
    – security risk assessment to be developed including the attack levels, the typical threats, the impact assessment and the relationship with safety;<br/>
    – levels of exposure of the communication interface and the determination of the equipment security level;<br/>
    – assessment of the exposure level of the communication interfaces;<br/>
    – assignment of the required security measures for the equipment;<br/>
    – countermeasures for the physical access and the environment derived from ISO/IEC 27001;<br/>
    – countermeasures referring to IEC 62443-4-2 with their criteria of applicability;<br/>
    – user instructions for installation, operation and maintenance;<br/>
    – conformance verification and testing, and – security protection profiles by family of equipment (Annex E to Annex I).<br/>
    In particular, it focuses on potential vulnerabilities to threats resulting in:<br/>
    – unintended operation, which can lead to hazardous situations;<br/>
    – unavailability of the protective functions (overcurrent, earth fault, etc.);<br/>
    – other degradation of main function.<br/>
    It also provides guidance on the cybersecurity management with the:<br/>
    – roles and responsibilities (Table 4);<br/>
    – typical architectures (Annex A);<br/>
    – use cases (Annex B);<br/>
    – development methods (Annex C);<br/>
    – recommendations to be provided to users and for integration into an assembly (Annex D);<br/>
    – bridging references to cybersecurity management systems (Annex K).<br/>
    This document does not cover security requirements for:<br/>
    – information technology (IT);<br/>
    – industrial automation and control systems (IACS), engineering workstations and their software applications;<br/>
    – critical infrastructure or energy management systems;<br/>
    – network device (communication network switch or virtual private network terminator), or<br/>
    – data confidentiality other than for critical security parameters;<br/>
    – design lifecycle management. For this aspect, see IEC 62443-4-1, ISO/IEC 27001 or other security lifecycle management standards.
- language: fr
  script: Latn
  content: |-
    IEC 63208:2025 Le présent document s'applique aux fonctions principales des appareillages et ensembles d'appareillages, appelés équipements, dans le contexte de la technologie d'exploitation (OT, 3.1.34). Il s'applique aux équipements équipés de moyens de communication de données filaires ou sans fil, ainsi qu'à leur accessibilité physique, dans les limites de leurs conditions d'environnement. Il a pour objet d'assurer l'atténuation appropriée de la sécurité physique et de la cybersécurité contre les vulnérabilités aux menaces à la sécurité.<br/>
    Le présent document fournit des exigences sur les aspects appropriés suivants:<br/>
    – l'appréciation du risque pour la sécurité à élaborer, y compris les niveaux d'attaque, les menaces types, l'appréciation de l'impact et la relation à la sécurité humaine;<br/>
    – les niveaux d'exposition de l'interface de communication et la détermination du niveau de sécurité de l'équipement;<br/>
    – l'évaluation du niveau d'exposition des interfaces de communication;<br/>
    – l'attribution des mesures de sécurité exigées pour l'équipement;<br/>
    – les contre-mesures pour l'accès physique et l'environnement selon l'ISO/IEC 27001;<br/>
    – les contre-mesures en référence à l'IEC 62443-4-2, avec leurs critères d'applicabilité;<br/>
    – les instructions pour l'utilisateur concernant l'installation, le fonctionnement et la maintenance;<br/>
    – la vérification et les essais de conformité; et<br/>
    – les profils de protection de la sécurité par famille d'équipements (de l'Annexe E à l'Annexe I).<br/>
    En particulier, il met l'accent sur les vulnérabilités potentielles aux menaces entraînant:<br/>
    – un fonctionnement non souhaitable, qui peut conduire à des situations dangereuses;<br/>
    – une indisponibilité des fonctions de protection (surintensité, défaut de terre, etc.);<br/>
    – toute autre dégradation de la fonction principale.<br/>
    Il fournit également des recommandations concernant le management de la cybersécurité, avec:<br/>
    – les rôles et responsabilités (Tableau 4);<br/>
    – les architectures types (Annexe A);<br/>
    – les cas d'utilisation (Annexe B);<br/>
    – les méthodes de développement (Annexe C);<br/>
    – les recommandations à fournir aux utilisateurs et à intégrer à un ensemble (Annexe D);<br/>
    – l'établissement de références aux systèmes de management de la cybersécurité (Annexe K).<br/>
    Le présent document ne fournit aucune exigence de sécurité en ce qui concerne:<br/>
    – les technologies de l'information (TI);<br/>
    – les systèmes d'automatisation et de commande industrielles (IACS, Industrial Automation And Control Systems), les postes de travail d'ingénierie<br/>
    et leurs applications logicielles;<br/>
    – les systèmes de management des infrastructures essentielles ou de l'énergie;<br/>
    – les dispositifs de réseau (commutateur de réseau de communication ou terminaison de réseau privé virtuel); ou<br/>
    – la confidentialité des données autre que pour les paramètres de sécurité critiques;<br/>
    – la gestion du cycle de vie de la conception. Pour cet aspect, voir l'IEC 62443-4-1, l'ISO/IEC 27001 ou d'autres normes de gestion du cycle de vie de la sécurité.
