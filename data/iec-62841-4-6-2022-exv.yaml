abstract:
- language: en
  script: Latn
  content: |-
    IEC 62841-4-6:2022 EXV contains both the international standard and its extended version (EXV). This extended version of the official IEC Standard is available in English only and provides the user with a comprehensive content of the Standard. IEC 62841-4-6:2022 EXV includes the content of the references made to IEC 62841-1:2014.<br/>
    <br/>
    IEC 62841-1:2014, Clause 1 is applicable, except as follows:<br/>
    Addition:<br/>
    This document applies to hand-held and backpack<br/>
    - garden blowers;<br/>
    - garden vacuums; and<br/>
    - garden blower/vacuums.<br/>
    This document does not apply to<br/>
    - walk-behind garden blowers, walk-behind garden vacuums and walk-behind garden blower/vacuums;<br/>
    - robotic garden blowers, robotic garden vacuums and robotic garden blower/vacuums;<br/>
    - vacuum cleaners intended primarily for use indoors, for water suction cleaning or animal grooming; and<br/>
    - blowers intended primarily for use indoors, or animal grooming.
