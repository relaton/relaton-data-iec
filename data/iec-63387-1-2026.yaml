abstract:
- language: en
  script: Latn
  content: |-
    IEC 63387-1:2026 specifies the methods for evaluating CPV/PV hybrid module performance in terms of power rating. Standard conditions for assessing the power produced by the module and the procedures to measure the power as a function of AOI, irradiance, and temperature are described. A methodology for determining a set of characterization parameter values for the hybrid CPV/PV module (FoV) is also included. In order to compare the performance of different hybrid CPV/PV modules whose output is discontinuous and time-dependent, the concept of effective nominal power is introduced.<br/>
    This document is applicable to CPV/PV hybrid modules which include both solar cells designed to collect concentrated light (CPV cells array) and solar cells designed to collect diffuse or global light (PV cells array), the latter with bifacial or monofacial illumination. This document applies to hybrid CPV/PV modules with a geometrical concentration ratio &gt; 3x for the CPV cells. For lower geometrical concentration ratio (≤ 3x), the IEC 60904-1 [11] and IEC 61853 series [9] apply.
- language: fr
  script: Latn
  content: |-
    IEC 63387-1:2026 spécifie les méthodes d’évaluation des performances des modules CPV/PV hybrides en ce qui concerne les caractéristiques assignées de puissance. Les conditions normales d’évaluation de la puissance générée par le module et des procédures de mesure de la puissance en fonction de l’AOI, de l’éclairement et de la température sont définies. Une méthodologie visant à définir un ensemble de valeurs pour les paramètres de caractérisation du module CPV/PV hybride (champ de vision) est également incluse. Pour comparer les performances des différents modules CPV/PV hybrides dont la sortie est discontinue et fonction du temps, le concept de puissance nominale effective a été introduit.<br/>
    Le présent document a été rédigé de façon à pouvoir s’appliquer aux modules CPV/PV hybrides équipés de cellules photovoltaïques conçues pour récupérer la concentration de lumière (ensemble de cellules CPV) et de cellules photovoltaïques conçues pour récupérer la lumière diffuse ou globale (ensemble de cellules PV), ces dernières avec un éclairage biface ou monoface. Le présent document s’applique aux modules CPV/PV hybrides dont le rapport de concentration géométrique est supérieur à 3 pour les cellules CPV. Pour les rapports de concentration géométrique inférieurs (≤ 3), les séries IEC 60904‑1 [11] et IEC 61853 [9] s’appliquent.
