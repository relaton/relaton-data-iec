abstract:
- language: en
  script: Latn
  content: |-
    IEC 63252:2020 defines methods for the measurement of energy consumption of vending machines, whether or not fitted with refrigerating appliances.<br/>
    The standard applies (but is not limited) to the following categories of machines:<br/>
    - Refrigerated closed-fronted can and bottle machines where the products are held in stacks<br/>
    - Refrigerated glass-fronted can and bottle, confectionery and snack machines<br/>
    - Refrigerated glass-fronted machines entirely for perishable foodstuffs<br/>
    - Refrigerated dual-temperature glass-fronted machines<br/>
    - Confectionery and snack machines that are not refrigerated<br/>
    - Combination machines consisting of two different categories of machine in the same housing and powered by one chiller<br/>
    The following types of vending machine are excluded from this document:<br/>
    - drink machines dispensing hot and/or cold drinks into cups;<br/>
    - machines with a food-heating function;<br/>
    - vending machines operating at temperatures below 0 °C; or<br/>
    - any machine including one or more of these compartments.<br/>
    For verification purposes, it is essential to apply all of the tests specified to a single unit. The tests can also be made individually for the study of a particular characteristic.<br/>
    This document does not deal with any characteristics of machine design other than energy consumption.
- language: fr
  script: Latn
  content: |-
    L'IEC 63252:2020 définit des méthodes de mesure de la consommation d'énergie des distributeurs automatiques, qu'ils soient équipés ou non d'appareils de réfrigération.<br/>
    La norme s'applique (entre autres) aux catégories de distributeurs suivants:<br/>
    – distributeurs fermés réfrigérés de cannettes et de bouteilles dans lesquels les produits sont empilés<br/>
    – distributeurs réfrigérés à porte vitrée de cannettes, bouteilles, confiseries et collations<br/>
    – distributeurs réfrigérés à porte vitrée contenant uniquement des denrées alimentaires périssables<br/>
    – distributeurs réfrigérés à porte vitrée et à double température<br/>
    – distributeurs non réfrigérés de confiseries et collations<br/>
    – distributeurs combinant deux catégories différentes de distributeurs dans une même enveloppe et alimentés par un seul réfrigérateur<br/>
    Les types de distributeurs automatiques suivants ne sont pas couverts par le présent document:<br/>
    – distributeurs de boissons chaudes et/ou froides dans des gobelets;<br/>
    – distributeurs avec une fonction de chauffage des denrées;<br/>
    – distributeurs automatiques fonctionnant à des températures inférieures à 0 °C; ou<br/>
    – tout distributeur comprenant un ou plusieurs de ces compartiments.<br/>
    À des fins de vérification, il est indispensable d’appliquer tous les essais spécifiés à un seul appareil. Les essais peuvent également être effectués séparément pour l'étude d'une caractéristique particulière.<br/>
    Le présent document ne couvre pas les caractéristiques de conception du distributeur autres que la consommation d'énergie.
