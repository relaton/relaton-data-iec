abstract:
- language: en
  script: Latn
  content: |-
    IEC 61252:2025 specifies<br/>
    – performance specifications for personal sound exposure meters,<br/>
    – details of the tests necessary to verify conformance to all mandatory specifications for the purpose of pattern evaluation, and<br/>
    – procedures for periodic testing of a personal sound exposure meter.<br/>
    Personal sound exposure meters conforming to the requirements of this document have a specified frequency response for sound incident on the microphone from all directions.<br/>
    This document is applicable to instruments that are designed to be worn on a person in a configuration specified by the manufacturer for the measurement of sound immission resulting from steady, intermittent, fluctuating, irregular, or impulsive sounds. For reproducibility of results, specifications and tests for the response to sound waves apply without an operator present in the sound field.<br/>
    Pattern evaluation tests and periodic tests described in this this document apply to personal sound exposure meters for which the manufacturer claims conformance to the specifications given in this document.<br/>
    IEC 61252:2025 cancels and replaces the first edition published in 1993, Amendment 1:2000, and Amendment 2:2017. This edition constitutes a technical revision.<br/>
    This edition includes the following significant technical changes with respect to the previous edition:<br/>
    a) personal sound exposure meters are required to provide indications of time-averaged sound level and peak sound level;<br/>
    b) sound exposure is an optional quantity for indication;<br/>
    c) specifications for physical quantities that do not follow the principle of equal-energy exchange rate have been added;<br/>
    d) specifications for directional response have been added;<br/>
    e) specifications for frequency weightings apply to the relative diffuse-field frequency response;<br/>
    f) determination of conformance to specifications takes account of uncertainties of measurement;<br/>
    g) detailed requirements for pattern-evaluation tests and periodic testing have been added.
- language: fr
  script: Latn
  content: |-
    L'IEC 61252:2025 spécifie<br/>
    – les performances des exposimètres acoustiques individuels;<br/>
    – les détails des essais nécessaires pour vérifier la conformité à toutes les spécifications obligatoires aux fins de l'évaluation de modèle; et<br/>
    – les procédures d'essais périodiques d'un exposimètre acoustique individuel.<br/>
    Les exposimètres acoustiques individuels conformes aux exigences du présent document ont une réponse en fréquence spécifiée pour le niveau sonore incident sur le microphone dans toutes les directions.<br/>
    Le présent document s'applique aux instruments conçus pour être portés par une personne dans une configuration spécifiée par le fabricant pour mesurer l'exposition sonore qui résulte de sons permanents, intermittents, fluctuants, irréguliers ou impulsifs. Pour la reproductibilité des résultats, les spécifications et les essais de la réponse aux ondes sonores s'appliquent sans opérateur présent dans le champ acoustique.<br/>
    Les essais d'évaluation de modèle et les essais périodiques décrits dans le présent document s'appliquent aux exposimètres acoustiques individuels pour lesquels le fabricant revendique la conformité aux spécifications données dans le présent document.<br/>
    L'IEC 61252:2025 annule et remplace la première édition parue en 1993, l'Amendement 1:2000 et l'Amendement 2:2017. Cette édition constitue une révision technique.<br/>
    Cette édition inclut les modifications techniques majeures suivantes par rapport à l'édition précédente:<br/>
    a) les exposimètres acoustiques individuels doivent fournir des indications du niveau équivalent continu de pression acoustique et du niveau sonore de crête;<br/>
    b) l'exposition au bruit est une grandeur dont l'indication est facultative;<br/>
    c) les spécifications des grandeurs physiques qui ne respectent pas le principe d'un taux de conversion d'énergie égale ont été ajoutées;<br/>
    d) les spécifications de la réponse directionnelle ont été ajoutées;<br/>
    e) les spécifications des pondérations fréquentielles s'appliquent à la réponse en fréquence en champ diffus relative;<br/>
    f) la détermination de la conformité aux spécifications tient compte des incertitudes de mesure;<br/>
    g) les exigences détaillées des essais d'évaluation de modèle et des essais périodiques ont été ajoutées.
