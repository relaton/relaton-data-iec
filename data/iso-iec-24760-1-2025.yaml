abstract:
- language: en
  script: Latn
  content: "<p class=\"MsoBodyText\" style=\"mso-layout-grid-align: none; text-autospace:
    none;\">This document:</p>\n\ndefines terms for identity management and specifies
    core concepts of identity and identity management, and their relationships;\nis
    applicable to any information system where information relating to identity is
    processed or stored;\nis considered to be a horizontal document for the following
    reasons:\nit applies concepts such as distinguishing the term “identity” from
    the term “identifier” on the implementation of systems for the management of identity
    information and on the requirements for the implementation and operation of a
    framework for identity management, \nit provides an important contribution to
    assess identity management systems with regard to their privacy-friendliness and
    their ability to assure the relevant attributes of an identity, and consequently
    it provides a foundation and a common understanding for any other standard addressing
    identity, identity information, and identity management.\n"
- language: fr
  script: Latn
  content: |
    <p>Le présent document:</p>

    définit les termes de gestion de l'identité et spécifie les concepts de base de l'identité et de la gestion de l'identité, ainsi que leurs relations;
    est applicable à tout système d'information dans lequel les informations relatives à l'identité sont traitées ou stockées;
    est considéré comme un document horizontal pour les raisons suivantes:
    il applique des concepts tels que la distinction entre le terme “identité” et le terme “identificateur” concernant la mise en œuvre de systèmes de gestion des informations d'identité et les exigences relatives à la mise en œuvre et au fonctionnement d'un cadre de gestion de l'identité;
    il apporte une contribution importante à l'évaluation des systèmes de gestion de l'identité en ce qui concerne leur protection de la vie privée et leur capacité à assurer les attributs pertinents d'une identité, et par conséquent il fournit une base et une compréhension commune pour toute autre norme traitant de l'identité, des informations d'identité et de la gestion de l'identité.
