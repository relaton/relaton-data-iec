abstract:
- language: en
  script: Latn
  content: |-
    IEC 60580:2019 specifies the performance and testing of Dose Area Product Meters intended to measure Dose Area Product and/or Dose Area Product Rate to which the Patient is exposed during Medical Radiological Examinations. This document is applicable to the following types of Dose Area Product Meters:<br/>
    a) Field-Class Dose Area Product Meters normally used for the measurement of Dose Area Products during Medical Radiological Examinations;<br/>
    b) Reference-Class Dose Area Product Meters normally used for the Calibration of Field-Class Dosimeters.<br/>
    NOTE Reference-Class Dose Area Product Meters can be used as Field-Class Dose Area Product Meters.<br/>
    The object of this document is<br/>
    1) to establish requirements for a satisfactory level of performance for Dose Area Product Meters, and<br/>
    2) to standardize the methods for the determination of compliance with this level of performance.<br/>
    Two levels of performance are specified:<br/>
    – a lower level of performance applying to Field-Class Dose Area Product Meters;<br/>
    – a higher level of performance applying to Reference-Class Dose Area Product Meters.<br/>
    IEC 60580:2019 cancels and replaces the second edition published 2000, and constitutes a technical revision. This edition includes the following significant technical changes with respect to the previous edition:<br/>
    a) a second class of devices is introduced with tighter uncertainty tolerances;<br/>
    b) this document has been expanded to include detectors other than ionization chambers;<br/>
    c) radiation qualities have been updated to the new definitions according to IEC 61267;<br/>
    d) a requirement on the linearity of the dose area product rate measurement was added;<br/>
    e) changed chamber light transmission requirement from 70 % to 60 %.
- language: fr
  script: Latn
  content: |-
    L'IEC 60580:2019 spécifie la performance et l'essai des Radiamètres de Produit Exposition-Surface destinés au mesurage du Produit Exposition-Surface et/ou du Débit de Produit Exposition-Surface auquel le Patient est exposé au cours des Examens Radiologiques Médicaux. Le présent document est applicable aux types suivants de Radiamètres de Produit Exposition-Surface:<br/>
    a) les Radiamètres de Produit Exposition-Surface de Classe de Routine normalement utilisés pour le mesurage des Produits Exposition-Surface au cours des Examens Radiologiques Médicaux;<br/>
    b) les Radiamètres de Produit Exposition-Surface de Classe de Référence normalement utilisés pour l’Étalonnage des Dosimètres de Classe de Routine.<br/>
    NOTE Les Radiamètres de Produit Exposition-Surface de Classe de Référence peuvent être utilisés en tant que Radiamètres de Produit Exposition-Surface de Classe de Routine.<br/>
    L’objet du présent document est<br/>
    1) d'établir les exigences pour assurer un niveau de performance satisfaisant des Radiamètres de Produit Exposition-Surface, et<br/>
    2) de normaliser les méthodes pour déterminer la conformité à ce niveau de performance.<br/>
    Deux niveaux de performance sont spécifiés:<br/>
    – un niveau inférieur de performance applicable aux Radiamètres de Produit Exposition-Surface de Classe de Routine;<br/>
    – un niveau supérieur de performance applicable aux Radiamètres de Produit Exposition-Surface de Classe de Référence.<br/>
    L'IEC 60580:2019 annule et remplace la deuxième édition parue en 2000, et constitue une révision technique. Cette édition inclut les modifications techniques majeures suivantes par rapport à l'édition précédente:<br/>
    a) une deuxième classe de dispositifs a été introduite, avec des tolérances d’incertitude plus strictes;<br/>
    b) la présente norme a été étendue pour inclure les détecteurs autres que les chambres d’ionisation;<br/>
    c) les qualités de rayonnement ont été mises à jour en fonction des nouvelles définitions de l’IEC 61267;<br/>
    d) une exigence relative à la linéarité du mesurage du débit de produit exposition-surface a été ajoutée;<br/>
    e) l’exigence relative à la transmission lumineuse de la chambre a été modifiée, passant de 70 % à 60 %.
