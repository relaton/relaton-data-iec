abstract:
- language: en
  script: Latn
  content: "IEC 63257:2026 applies to photovoltaic (PV) system components and communication
    networks supporting the communication of the DC shutdown equipment using power
    line communication.<br />\r\nThis document defines how to propagate the operational
    state of the entire PV system (normal / shutdown) to the individual power production
    components comprising the PV system. The document also describes requirements
    and constraints associated with power line communication networks that are used
    to support this application.<br />\r\nThis document defines the communication
    requirements for reducing the output voltage of the DC cables that leave a PV
    array. This output voltage reduction function can support emergency responders
    during firefighting operations. For this function, communication is necessary
    from the inverter / initiator to the PV-modules."
- language: fr
  script: Latn
  content: "IEC 63257:2026 s’applique aux composants d’un système photovoltaïque (PV)
    et aux réseaux de communication qui soutiennent la communication de l’équipement
    d’arrêt du courant continu au moyen d’une communication de ligne électrique.<br
    />\r\nLe présent document définit comment diffuser l’état de fonctionnement de
    tout le système photovoltaïque (normal/arrêt) vers chacun de ses composants de
    production de puissance. Il décrit également les exigences et les contraintes
    associées aux réseaux de communication de ligne électrique utilisés pour soutenir
    cette application. Le présent document définit les exigences de communication
    qui permettent de réduire la tension des câbles de courant continu en sortie d’un
    groupe photovoltaïque."
