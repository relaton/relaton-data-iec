abstract:
- language: en
  script: Latn
  content: 'IEC TR 63610:2026 analyses AR and MR technology in terms of four technical
    domains: content, platform, network and device. Based on this analysis, technical
    elements in each domain and requirements for interconnecting those technical domains
    are identified. On the same basis, this document identifies relevant standard
    development organizations’ activities and suggests items for standardization.'
