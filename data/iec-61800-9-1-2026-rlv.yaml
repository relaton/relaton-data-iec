abstract:
- language: en
  script: Latn
  content: |-
    IEC 61800-9-1:2026 RLV contains both the official IEC International Standard and its Redline version. The Redline version is available in English only and provides you with a quick and easy way to compare all the changes between the official IEC Standard and its previous edition.<br/>
    <br/>
    IEC 61800-9-1:2026 specifies the general methodology to energy efficiency standardization for any extended product by using the guidance of the extended product approach (EPA). It enables product committees for driven equipment connected to motor systems (so called extended products) to interface with the relative power losses of the connected motor system (e.g. power drive system) in order to calculate the system energy efficiency for the whole application. This is based on specified calculation models for speed/load profiles, the duty profiles and relative power losses of appropriate torque versus speed operating points. This document is applicable to motor systems operated by a motor starter or by a converter (power drive system). This document does not specify requirements for environmental impact declarations. Power drive systems designed to drive DC motors are not included in the scope of this document. This document is a group energy efficiency publication as defined in IEC Guide 118 with the energy efficiency function to establish a clear and simple system methodology for the comparison of the energy performance of motor systems to help product and system improvement.<br/>
    This edition includes the following significant technical changes with respect to the previous edition:<br/>
    a) addition of Annex D - Examples of indexing and evaluation of energy consumption;<br/>
    b) correction of errors of symbols in several formulas and tables.
