abstract:
- language: en
  script: Latn
  content: |-
    <p class="MsoBodyText">This document specifies requirements and a standardized framework for specifying objective, repeatable and reproducible evaluation methods and evaluation activities.</p>
    <p class="MsoBodyText">This document does not specify how to evaluate, adopt, or maintain evaluation methods and evaluation activities. These aspects are a matter for those originating the evaluation methods and evaluation activities in their particular area of interest.</p>
- language: fr
  script: Latn
  content: |-
    <p class="MsoBodyText">Le présent document spécifie les exigences, ainsi qu’un cadre normalisé pour la spécification de méthodes d'évaluation et d’activités d’évaluation objectives, répétables et reproductibles.</p>
    <p class="MsoBodyText">Le présent document ne précise pas comment évaluer, adopter ou maintenir les méthodes et les activités d'évaluation. Ces aspects relèvent de la compétence de ceux qui sont à l'origine des méthodes et des activités d'évaluation dans leur domaine d'intérêt particulier.</p>
