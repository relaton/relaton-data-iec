abstract:
- language: en
  script: Latn
  content: |-
    ISO 11553-2:2026 This document deals with all significant hazards, hazardous situations or hazardous events relevant to hand-held or hand-operated laser processing machines (HLMs), when they are used as intended and under conditions of misuse which are reasonably foreseeable by the manufacturer. HLM is the machine, as defined in ISO 11553-1:2020, 3.7, in which laser radiation is generated, where the laser provides sufficient energy/power to cause a phase transition in a part of the workpiece and where the laser output or workpiece to be processed is guided manually or hand-held during the laser material processing.<br/>
    This document defines general design requirements of HLM. HLM includes the laser device, beam-guiding device (e.g. mirror, fibre, lenses), beam-shaping device (e.g. telescope, focusing), and controls. The laser assembly as an integral part of the HLM or only the laser processing head is hand-held or hand-operated during the laser material processing.<br/>
    This document does not apply<br/>
    - to laser processing machines which are remotely controlled by a manual controller (hand-operated controller), such as joy sticks, keyboard, etc., without touching a workpiece or a part mechanically connected with the laser material processing head by using the hand(s) of the operator (user)<br/>
    - to laser processing machines without a drive system which may not belong to machinery. And the laser processing apparatus without moving parts, which may not be considered as machinery in “Type C standard”.<br/>
    - to medical or cosmetic applications for the treatment of living human or animal tissue;<br/>
    - to weapon applications, (e.g. such as with regard to military applications, direct close combat.)<br/>
    NOTE “hand-operated laser processing machine” is synonymous with “hand-guided laser processing machine” in this document. Hand-operated laser processing machines often use manual force reduction means such as wheels, supports, etc., for manual positioning of the laser processing heads or the workpieces.<br/>
    It is applicable to HLMs using laser radiation to process materials.<br/>
    The purpose of this document is to draw attention to the hazards related to HLMs and to prevent personal injury. Depending on the application and the location/operating conditions of HLMs, a number of different significant hazards can arise. This document describes both the areas of hazards analysis and risk assessment as well as protective measures.<br/>
    Requirements dealing with noise as a hazard are covered by ISO 11553-3:2013.<br/>
    This document does not apply to laser products or equipment manufactured solely or expressly for applications which are excluded from the Scope of ISO 11553-1:2020. This document is not applicable for HLMs which have been manufactured before the date of publication of this standard.<br/>
    HLMs include the following types:<br/>
    HLMs which are designed as all-in-one laser assembly including the beam delivery/forming(shaping) system and optional features such as gas nozzles, material (e.g. powder, wire) feed system;<br/>
    HLMs where the relevant devices are connected by a beam guidance system (e.g. optical fibre) and power/control cables to an external laser assembly device and which includes only the beam delivery/forming(shaping) system and optional features such as gas nozzles, material (e.g. powder, wire) feed system;<br/>
    laser processing machines where the workpiece is manually moved under/relative to the laser beam (see informative Annex A).<br/>
    The intended use of HLMs covers both:<br/>
    movement of elements or workpieces by hand to be processed under/relatively to stationary laser beams as shielded , and<br/>
    movement of the laser processing head (beam shaping device) by hand to move laser beam(s) over or relative to elements or workpieces to be processed.<br/>
    Laser processing machines, where laser processing is performed with hand-held or hand-operated workpieces outside the fixed (neither hand-held nor hand-operated by the operator or user) laser processing machines are out of the scope of this document. Such a fixed laser processing machine is to be covered by ISO 11553-1:2020.<br/>
    HLMs are intended for the industrial use and can be only operated by trained and authorized personnel in indoor and/or outdoor environments/locations (e.g. cleaning of facades, statues).
- language: fr
  script: Latn
  content: |-
    Le présent document traite tous les phénomènes dangereux, situations dangereuses ou événements dangereux significatifs qui sont pertinents pour les machines à laser portatives ou actionnées manuellement (HLM), lorsqu'elles sont utilisées normalement et dans les conditions de mauvais usage raisonnablement prévisible par le fabricant. Une HLM est la machine, telle que définie dans l'ISO 11553-1:2020, 3.7, dans laquelle le rayonnement laser est généré, où le laser fournit une énergie/puissance suffisante pour causer une transition de phase dans une partie de la pièce de fabrication et avec lequel la sortie laser ou la pièce de fabrication à traiter est guidée manuellement ou tenue à la main durant le traitement du matériau au laser.<br/>
    Le présent document définit les exigences générales de conception de la HLM, qui comprend le dispositif laser, le dispositif de guidage du faisceau (par exemple miroir, fibres, lentilles), le dispositif de mise en forme du faisceau (par exemple télescope, focalisation) et les commandes. L'ensemble laser en tant que partie intégrante d'une HLM ou la tête de traitement laser seule est portatif/portative ou actionné/actionnée manuellement pendant le traitement du matériau au laser.<br/>
    Le présent document ne s'applique pas:<br/>
    - aux machines à laser qui sont commandées à distance au moyen d'un contrôleur manuel (contrôleur actionné manuellement), telles que des manettes, un clavier, etc., sans toucher une pièce de fabrication ou une partie mécaniquement connectée à la tête de traitement laser en utilisant la ou les mains de l'opérateur (utilisateur);<br/>
    - aux machines à laser sans système d'entraînement qui peuvent ne pas faire partie de la machine. Et l'appareillage de traitement au laser sans parties mobiles, qui peut ne pas être considéré comme une machine dans la «norme de Type C».<br/>
    - aux applications médicales ou cosmétiques pour le traitement de tissus humains ou animaux vivants;<br/>
    à des applications d'armes (par exemple en ce qui concerne les applications militaires, le combat rapproché direct).<br/>
    NOTE «machines de traitement au laser actionnées manuellement» est synonyme de «machines à laser actionnées manuellement» dans le présent document. Les machines à laser actionnées manuellement utilisent souvent des moyens de réduction de la force manuelle tels que des roues, des supports, etc., pour le positionnement manuel des têtes de traitement laser ou des pièces de fabrication.<br/>
    Il est applicable aux HLM utilisant un rayonnement laser pour traiter des matériaux.<br/>
    Le présent document a pour objet d'attirer l'attention sur les phénomènes dangereux liés aux HLM et de prévenir les blessures aux personnes. En fonction de l'application et des conditions dans lesquelles les HLM se trouvent/fonctionnent, plusieurs phénomènes dangereux importants différents peuvent se produire. Le présent document décrit les domaines de l'analyse des phénomènes dangereux et l'appréciation du risque ainsi que les mesures de prévention.<br/>
    Les exigences relatives au bruit en tant que phénomène dangereux sont couvertes par l'ISO 11553-3:2013.<br/>
    Le présent document ne s'applique pas aux appareils ou aux équipements à laser fabriqués exclusivement ou expressément pour des applications qui sont exclues du domaine d'application de l'ISO 11553-1:2020. Le présent document n'est pas applicable aux HLM qui ont été fabriquées avant la date de publication de la présente norme.<br/>
    Les HLM incluent les types suivants:<br/>
    a) les HLM qui sont conçues comme un ensemble laser tout-en-un, y compris le système de distribution/de mise en forme du faisceau et les éléments facultatifs tels que les buses de gaz, le système d'alimentation en matériau (par exemple poudre, fil);<br/>
    b) les HLM au sein desquelles les dispositifs correspondants sont reliés par un système de guidage du faisceau (par exemple fibre optique) et des câbles d'alimentation en énergie/de commande à un appareil d'ensemble laser externe et qui inclut uniquement le système de distribution/de mise en forme du faisceau et des éléments optionnels tels que les buses de gaz ou le système d'alimentation en matériau (par exemple poudre, fil);<br/>
    c) les machines à laser pour lesquelles la pièce de fabrication est déplacée manuellement sous le faisceau laser ou en fonction de celui-ci (voir l'Annexe A informative). L'utilisation normale des HLM couvre:<br/>
    d) le mouvement manuel d'éléments ou de pièces de fabrication à traiter sous des faisceaux laser fixes ou par rapport à ceux-ci comme protégés, et<br/>
    e) le mouvement manuel de la tête de traitement laser (dispositif de mise en forme du faisceau) pour déplacer le(s) faisceaux laser sur les éléments ou pièces de fabrication à traiter ou par rapport à ceux-ci.<br/>
    Les machines à laser au sein desquelles le traitement au laser est réalisé avec des pièces de fabrication portatives ou actionnées manuellement, hormis les machines à laser fixes (ni portatives ni manipulées par l'opérateur ou l'utilisateur), ne font pas partie du domaine d'application du présent document. Une telle machine à laser fixe nécessite d'être couverte par l'ISO 11553-1:2020.<br/>
    Les HLM sont destinées à l'usage industriel et ne peuvent être utilisées que par du personnel formé et autorisé dans des environnements/emplacements en intérieur et/ou en extérieur (par exemple nettoyage de façade ou de statues).
