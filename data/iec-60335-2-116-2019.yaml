abstract:
- language: en
  script: Latn
  content: |-
    IEC 60335-2-116:2019 deals with the safety of furniture with electrically motorized parts intended for household and similar purposes, their rated voltage being not more than 250 V.<br/>
    Furniture incorporating electrically motorised parts not intended for normal household use but which nevertheless may be a source of danger to the public, such as furniture intended to be used by laymen in shops, offices, hotels, restaurants, cinemas, hospitals, schools, in light industry and on farms, are within the scope of this standard.<br/>
    Examples of furniture incorporating electrically motorised parts, are<br/>
    – electrically operated/height adjustable tables and desks;<br/>
    – electrically operated/adjustable stands and wall attachment for e.g.TV sets and monitors;<br/>
    – electrically operated/adjustable seating;<br/>
    – beds with incorporated ventilators and filters;<br/>
    – electrically operated/adjustable beds;<br/>
    – electrically operated/adjustable storage units including kitchen units;<br/>
    – electrically operated/adjustable furniture intended to be secured to the wall or ceiling;<br/>
    – electrically operated extension elements (drawers and doors);<br/>
    – electric check-out furniture in hotels and shops;<br/>
    – furniture delivered in parts (ready to assemble or knock-down furniture).<br/>
    This standard deals with the reasonably foreseeable hazards presented by furniture incorporating electrically motorised parts that are encountered by all persons. However, in general, it does not take into account<br/>
    – persons whose physical, sensory or mental capabilities; or lack of experience and knowledge prevents them from using the furniture incorporating electric appliances, parts or components safely without supervision or instruction;<br/>
    – children playing with furniture incorporating electrically motorised parts.<br/>
    Attention is drawn to the fact that<br/>
    – for furniture incorporating electrically motorised parts intended to be used in vehicles or on board ships or aircraft, additional requirements can be necessary;<br/>
    – in many countries, additional requirements are specified by the national health authorities, the national authorities responsible for the protection of labour, the national authorities for fire protection and similar authorities.<br/>
    This standard does not apply to<br/>
    – furniture containing heating elements;<br/>
    – electrically operated hospital beds (IEC 60601-2-52);<br/>
    – electrical wheel chairs;<br/>
    – special furniture incorporating electric appliances, parts or components, which are part of industrial production equipment;<br/>
    – cupboards for building in appliances like a dishwasher;<br/>
    – electric child care articles except electrical height adjustable changing (nursing) tables;<br/>
    – furniture especially for use by children;<br/>
    – furniture for outdoor use.<br/>
    This standard only covers the risks associated with electrically motorized parts when operated as in normal use taking into account the manufacturer's instructions. It also covers abnormal situations that can be expected in practice and takes into account the way in which electromagnetic phenomena can affect the safe operation of such appliances. It does not cover risks associated with furniture containing heating elements.<br/>
    Other safety aspects of furniture with and without electrically motorised parts are covered by the standards developed by ISO TC 136.<br/>
    This part 2 is to be used in conjunction with the latest edition of IEC 60335-1 and its amendments. It was established on the basis of the fifth edition (2010) of that standard.
- language: fr
  script: Latn
  content: |-
    L'IEC 60335-2-116:2019 traite de la sécurité du mobilier avec des parties électriquement motorisées, pour usages domestiques et analogues, dont la tension assignée n'est pas supérieure à 250 V.<br/>
    Les mobiliers intégrant des parties à motorisation électrique non destinés à un usage domestique normal, mais qui néanmoins peuvent constituer une source de danger pour le public (le mobilier destiné à être utilisé par des usagers non avertis dans des magasins, des bureaux, des hôtels, des restaurants, des cinémas, des hôpitaux, des écoles, chez les artisans et dans des fermes, par exemple) sont compris dans le domaine d'application de la présente norme.<br/>
    Exemples de mobilier intégrant des parties à motorisation électrique:<br/>
    – tables et bureaux à fonctionnement/réglage de la hauteur électrique;<br/>
    – meubles et fixations murales à fonctionnement/réglage électrique, pour les postes de télévision et les moniteurs, par exemple;<br/>
    – siège à fonctionnement/réglage électrique;<br/>
    – lits à ventilateurs et filtres incorporés;<br/>
    – lits à fonctionnement/réglage électrique;<br/>
    – unités de stockage à fonctionnement/réglage électrique, y compris les blocs-cuisine;<br/>
    – mobilier à fonctionnement/réglage électrique destiné à être fixé au mur ou au plafond;<br/>
    – éléments d'extension à fonctionnement électrique (tiroirs et portes);<br/>
    – mobilier à commande électrique dans les hôtels et les magasins;<br/>
    – mobilier livré en pièces détachées (mobilier prêt à assembler ou monter).<br/>
    La présente norme traite des dangers raisonnablement prévisibles que présente le mobilier incorporant des parties à motorisation électrique pour toutes les personnes. Cependant, la présente norme ne tient pas compte en général:<br/>
    – des personnes dont les capacités physiques, sensorielles ou mentales ou dont le manque d'expérience ou de connaissance les empêchent d'utiliser le mobilier incorporant des appareils, parties ou composants électriques en toute sécurité, sans surveillance ou instruction;<br/>
    – de l'utilisation du mobilier incorporant des parties à motorisation électrique comme jouet par des enfants.<br/>
    L'attention est attirée sur le fait que:<br/>
    – pour le mobilier incorporant des parties à motorisation électrique destiné à être utilisé dans des véhicules ou à bord de navires ou d'avions, des exigences supplémentaires peuvent être nécessaires;<br/>
    – dans de nombreux pays, des exigences supplémentaires sont spécifiées par les organismes nationaux de la santé, par les organismes nationaux responsables de la protection des travailleurs, par les organismes nationaux responsables de la protection contre les incendies et par des organismes similaires.<br/>
    La présente norme ne s'applique pas:<br/>
    – au mobilier comprenant des éléments chauffants;<br/>
    – aux lits d'hôpital électriques (IEC 60601-2-52);<br/>
    – aux fauteuils roulants électriques;<br/>
    – au mobilier particulier intégrant des appareils, parties ou composants électriques, faisant partie intégrante d'un matériel de production industrielle;<br/>
    – aux armoires pour appareils encastrés (les lave-vaisselle, par exemple);<br/>
    – aux articles électriques de puériculture, à l'exception des tables à langer (maternités) réglables en hauteur;<br/>
    – au mobilier spécialement destiné aux enfants;<br/>
    – au mobilier utilisé à l'extérieur.<br/>
    La présente norme couvre uniquement les risques liés aux parties électriquement motorisées lorsqu'elles fonctionnent comme en usage normal en tenant compte des instructions du fabricant. Elle couvre également les situations anormales qui peuvent être attendues dans la pratique et prend en considération les phénomènes électromagnétiques qui peuvent affecter le fonctionnement en toute sécurité de tels appareils. Elle ne couvre pas les risques liés au mobilier comprenant des éléments chauffants.<br/>
    D'autres aspects relatifs à la sécurité du mobilier avec et sans parties électriquement motorisées sont couverts par les normes élaborées par le TC 136 de l'ISO.<br/>
    La présente partie 2 doit être utilisée conjointement avec la dernière édition de l'IEC 60335-1 et ses amendements. Elle a été établie sur la base de la cinquième édition (2010) de cette norme.
