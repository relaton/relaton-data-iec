abstract:
- language: en
  script: Latn
  content: |-
    IEC 61980-3:2022 applies to the off-board supply equipment for wireless power transfer via magnetic field (MF-WPT) to electric road vehicles for purposes of supplying electric energy to the RESS (rechargeable energy storage system) and/or other on-board electrical systems. The MF-WPT system operates at standard supply voltage ratings per IEC 60038 up to 1 000 V AC and up to 1 500 V DC from the supply network. The power transfer takes place while the electric vehicle (EV) is stationary.<br/>
    Off-board supply equipment fulfilling the requirements in this document are intended to operate with EV devices fulfilling the requirements described in ISO 19363.<br/>
    The aspects covered in this document include<br/>
    – the characteristics and operating conditions,<br/>
    – the required level of electrical safety,<br/>
    – requirements for basic communication for safety and process matters if required by a MF WPT system,<br/>
    – requirements for positioning to assure efficient and safe MF-WPT power transfer, and<br/>
    – specific EMC requirements for MF-WPT systems.<br/>
    The following aspects are under consideration for future documents:<br/>
    – requirements for MF-WPT systems for two- and three-wheel vehicles,<br/>
    – requirements for MF-WPT systems supplying power to EVs in motion,<br/>
    – requirements for bidirectional power transfer,<br/>
    – requirements for flush mounted primary device,<br/>
    – requirements for MF-WPT systems for heavy duty vehicle, and<br/>
    – requirements for MF-WPT systems with inputs greater than 11,1 kVA.<br/>
    This document does not apply to<br/>
    – safety aspects related to maintenance, and<br/>
    – trolley buses, rail vehicles and vehicles designed primarily for use off-road.<br/>
    IEC 61980-3:2022 is to be used in conjunction with IEC 61980-1:2020.
- language: fr
  script: Latn
  content: |-
    L'IEC 61980-3:2022 s'applique au matériel d'alimentation non embarqué pour le transfert de puissance sans fil par champ magnétique (MF-WPT) aux véhicules électriques routiers, afin d'assurer l'alimentation en énergie électrique du RESS (système de stockage d'énergie rechargeable) et/ou d'autres systèmes électriques embarqués. Le système MF-WPT fonctionne aux tensions d'alimentation assignées normalisées selon l'IEC 60038, jusqu'à 1 000 V en courant alternatif et jusqu'à 1 500 V en courant continu, du réseau d'alimentation. Le transfert de puissance a lieu lorsque le véhicule électrique (VE) est immobile.<br/>
    Un matériel d'alimentation non embarqué qui satisfait aux exigences du présent document est prévu pour fonctionner avec des dispositifs de VE qui satisfont aux exigences décrites dans l'ISO 19363.<br/>
    Le présent document couvre:<br/>
    – les caractéristiques et les conditions de fonctionnement;<br/>
    – le niveau exigé de sécurité électrique;<br/>
    – les exigences de communication de base pour les questions de sécurité et de processus, si un système MF WPT l'exige;<br/>
    – les exigences de positionnement pour assurer un transfert de puissance MF-WPT efficace et sûr; et<br/>
    – les exigences de compatibilité électromagnétique (CEM) spécifiques aux systèmes MF WPT.<br/>
    Les aspects suivants sont à l'étude pour les documents ultérieurs:<br/>
    – les exigences relatives aux systèmes MF-WPT pour véhicules à deux et trois roues;<br/>
    – les exigences relatives aux systèmes MF-WPT qui alimentent les VE en mouvement;<br/>
    – les exigences relatives au transfert de puissance bidirectionnel;<br/>
    – les exigences relatives aux dispositifs principaux encastrés;<br/>
    – les exigences relatives aux systèmes MF-WPT pour véhicules utilitaires lourds; et<br/>
    – les exigences relatives aux systèmes MF-WPT avec des puissances d'entrée supérieures à 11,1 kVA.<br/>
    Le présent document ne s'applique pas<br/>
    – aux aspects de sécurité relatifs à la maintenance; et<br/>
    – aux trolleybus, aux véhicules ferroviaires et aux véhicules conçus principalement pour une exploitation non routière.<br/>
    L'IEC 61980-3:2022 doit être utilisée conjointement avec l'IEC 61980-1:2020.
