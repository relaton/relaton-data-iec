abstract:
- language: en
  script: Latn
  content: "<p>IEC 60695-2-10:2026 specifies the glow-wire apparatus and common test
    procedure to simulate the effects of thermal stresses which may be produced by
    heat sources such as glowing elements or overloaded resistors, for short periods,
    in order to assess the fire hazard by a simulation technique. The test procedure
    described in this document is a common test procedure intended for the small-scale
    tests in which a standardized electrically heated wire is used as a source of
    ignition. It is a common part of the test procedures applied to end products and
    to solid electrical insulating materials or other solid combustible materials.
    A detailed description of each particular test procedure is given in IEC 60695-2-11,
    IEC 60695-2-12 and IEC 60695-2-13.<br />\r\nThis fourth edition cancels and replaces
    the third edition published in 2021. This edition constitutes a technical revision.<br
    />\r\nThis edition includes the following significant technical changes with respect
    to the previous edition:<br />\r\na) revision of 4.3 to add reference to new Annex
    D;<br />\r\nb) addition of new normative Annex D on \"Use of pyrometer for glow-wire
    test\";<br />\r\nc) revision of Clause 3 references to align with ISO 13943:2017.<br
    />\r\nIt has the status of a basic safety publication in accordance with IEC Guide
    104. This International Standard is to be used in conjunction with IEC 60695-2-11,
    IEC 60695-2-12, and IEC 60695-2-13.</p>"
- language: fr
  script: Latn
  content: "L'IEC 60695-2-10:2026 spécifie l'appareillage et la méthode commune d'essai
    au fil incandescent pour simuler l'effet de contraintes thermiques qui peuvent
    être produites par des sources de chaleur telles que des éléments incandescents
    ou des résistances surchargées, sur de courtes durées, afin d'évaluer de façon
    simulée le danger d'incendie. La méthode d'essai décrite dans le présent document
    représente une méthode commune d'essai destinée aux essais à petite échelle qui
    utilisent un fil normalisé chauffé électriquement comme source d'allumage. Il
    s'agit d'une partie commune des méthodes d'essai appliquées aux produits finis
    et aux matériaux isolants électriques solides ou à d'autres matériaux combustibles
    solides.<br />\r\nUne description détaillée de chaque méthode d'essai particulière
    est donnée dans l'IEC 60695‑2‑11, l'IEC 60695‑2‑12 et l'IEC 60695‑2‑13.<br />\r\nCette
    quatrième édition annule et remplace la troisième édition parue en 2021. Cette
    édition constitue une révision technique.<br />\r\nCette édition inclut les modifications
    techniques majeures suivantes par rapport à l'édition précédente:<br />\r\na)
    révision du 4.3 pour ajouter une référence à la nouvelle Annexe D;<br />\r\nb)
    ajout d'une nouvelle Annexe D normative relative à l'\"utilisation du pyromètre
    pour l'essai au fil incandescent\";<br />\r\nc) révision des références de l'Article
    3 pour s'aligner sur l'ISO 13943:2017.<br />\r\nIl a le statut d'une publication
    fondamentale de sécurité conformément au Guide 104 de l’IEC. La présente Norme
    internationale doit être utilisée conjointement avec l'IEC 60695‑2‑11, l'IEC 60695‑2‑12
    et l'IEC 60695‑2‑13."
