abstract:
- language: en
  script: Latn
  content: |-
    IEC 63087:2026 sets out the requirements for the provision of assistive listening systems (ALS) in places or situations where there is a benefit for hearing-aid, cochlear implant, and other hearing device users, compared to listening to the acoustic signal directly at that location.<br/>
    This document applies to all ALS used for communication, entertainment, or educational purposes in public, private, domestic and public transport installations.<br/>
    This document does not apply to other forms of audio transmission, for example simultaneous interpretation or audio description or audio-streams other than those broadcast as part of an ALS. However, this document provides useful ancillary information for such systems which can be applied.<br/>
    Personal listening and intelligibility enhancement devices and systems are also included within the scope as they constitute a special case and incorporate some unique features and requirements (Annex C).<br/>
    This document does not apply to hearing aids and medical hearing devices themselves or to speech enhancement and communication systems found in some private motor vehicles which are sometimes referred to as assistive listening.
- language: fr
  script: Latn
  content: |-
    L'IEC 63087:2026 établit les exigences relatives à la fourniture de systèmes d'aide à l'audition (SLA) dans les endroits ou situations où il existe un avantage pour les utilisateurs d'appareils de correction auditive, d'implants cochléaires et d'autres appareils de correction auditive, par rapport à l'écoute du signal acoustique directement à cet endroit.<br/>
    Le présent document s'applique à toutes les ALS utilisées à des fins de communication, de divertissement ou d'éducation dans les installations de transport public, privé, domestique et public.<br/>
    Le présent document ne s'applique pas à d'autres formes de transmission audio, par exemple l'interprétation simultanée ou la description audio ou les flux audio autres que ceux diffusés dans le cadre d'une ALS. Toutefois, le présent document fournit des informations auxiliaires utiles pour de tels systèmes qui peuvent être appliqués.<br/>
    Les dispositifs et systèmes d'amélioration de l'écoute personnelle et de l'intelligibilité sont également inclus dans le domaine d'application car ils constituent un cas particulier et intègrent certaines caractéristiques et exigences uniques (Annexe C).<br/>
    Le présent document ne s'applique pas aux appareils de correction auditive et aux appareils de correction auditive médicaux eux-mêmes, ni aux systèmes d'amélioration de la parole et de communication présents dans certains véhicules automobiles privés qui sont parfois appelés écoute assistée.
