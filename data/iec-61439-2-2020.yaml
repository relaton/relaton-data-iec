abstract:
- language: en
  script: Latn
  content: |-
    IEC 61439-2:2020 defines the specific requirements for the power switchgear and controlgear assembly (abbreviated "PSC-assembly" throughout this document see 3.1.101) as follows:<br/>
    - assemblies for which the rated voltage does not exceed 1 000 V AC or 1 500 V DC;<br/>
    - assemblies designed for a nominal frequency of the incoming supply or supplies not exceeding 1 000 Hz;<br/>
    NOTE 1 Frequencies above 1 kHz are considered as high frequencies, see also IEC 60664-1:2007, 5.3.3.2.5 to take into account additional constraints to insulation coordination.<br/>
    - assemblies intended for indoor and outdoor applications;<br/>
    - stationary or movable assemblies with or without enclosures;<br/>
    - assemblies intended for use in connection with the generation, transmission, distribution and conversion of electrical energy, and for the control of equipment consuming electrical energy and for associated data processing;<br/>
    - assemblies designed for use under special service conditions, for example in ships and in rail vehicles, provided that the other relevant specific requirements are complied with;<br/>
    NOTE 2 Supplementary requirements for assemblies in ships are covered by IEC 60092-302-2.<br/>
    This third edition cancels and replaces the second edition published in 2011. It constitutes a technical revision. This edition includes the following significant technical changes with respect to the previous edition:<br/>
    a) addition of Annexes DD, EE and FF for assemblies for use in photovoltaic installation;<br/>
    b) clarification of the requirements for forms of internal separation and the addition of the requirement, when the form of separation is higher than 1, all parts within the functional unit compartment that remain live when the functional unit is switched off shall be protected to at least IPXXB;<br/>
    c) alignment with the structure of IEC 61439-1:2020;<br/>
    d) addition of temperature-rise verification for; (i) temperature-rise verification of assemblies with natural cooling and circuits rated above 1 600 A by a combination of comparison with a reference design and calculation, and; (ii) temperature-rise verification of assemblies with active cooling and rated currents up to 1 600 A;<br/>
    e) consideration of IP with active cooling.
- language: fr
  script: Latn
  content: "L’IEC 61439:2020 définit les exigences spécifiques applicables aux ensembles
    d’appareillage de puissance (dans l’ensemble du présent document, l’abréviation
    \"ensemble EAP\" est utilisée pour désigner un ensemble d’appareillage de puissance;
    voir 3.1.101) comme suit:\n\n\tensembles dont la tension assignée ne dépasse pas
    1 000 V en courant alternatif ou 1  500 V en courant continu;\n\tensembles conçus
    pour une fréquence nominale de l’alimentation ou des alimentations entrantes ne
    dépassant pas 1 000 Hz;\n\nNOTE 1 Les fréquences supérieures à 1 kHz sont considérées
    comme des hautes fréquences, voir aussi l’IEC 60664-1:2007, 5.3.3.2.5 pour tenir
    compte des contraintes supplémentaires relatives à la coordination de l’isolement.\n\n\n\tensembles
    destinés à des applications d’intérieur et d’extérieur;\n\tensembles fixes ou
    mobiles, avec ou sans enveloppe;\n\tensembles destinés à être utilisés avec des
    équipements conçus pour la production, le transport, la distribution et la conversion
    de l’énergie électrique, ainsi que pour la commande des matériels consommant de
    l’énergie électrique et le traitement des données associées;\n\tensembles conçus
    pour être utilisés dans des conditions spéciales d’emploi, par exemple à bord
    de navires et de véhicules sur rails, à condition que les autres exigences spécifiques
    correspondantes soient respectées.\n\nNOTE 2 Les exigences supplémentaires pour
    les ensembles à bord des navires sont couvertes par l’IEC 60092-302-2.<br/>\nCette
    troisième édition annule et remplace la deuxième édition parue en 2011 dont elle
    constitue une révision technique.<br/>\nCette édition inclut les modifications
    techniques majeures suivantes par rapport à l'édition précédente:\n\n\tajout des
    Annexes DD, EE et FF pour les ensembles utilisables dans les installations photovoltaïques;\n\tclarification
    des exigences concernant les formes de séparation interne et ajout de l’exigence
    selon laquelle, lorsque la forme de séparation de numéro supérieur à 1, toutes
    les parties à l’intérieur du compartiment de l’unité fonctionnelle qui restent
    actives lorsque l’unité fonctionnelle est désactivée doivent être protégées au
    moins selon le degré de protection IPXXB;\n\talignement sur la structure de l’IEC
    61439-1:2020;\n\tajout de la vérification de l’échauffement pour (i) la vérification
    de l’échauffement des ensembles à ventilation naturelle et des circuits de courant
    assigné supérieur à 1 600 A par une combinaison de comparaison entre une conception
    de référence et le calcul, et (ii) la vérification de l’échauffement des ensembles
    à ventilation forcée et avec des courants assignés jusqu’à 1 600 A;\n\tprise en
    compte du degré de protection IP pour la ventilation forcée.\n"
