  content: |-
    IEC 62351-8:2026 a pour objet de faciliter le contrôle d'accès basé sur les rôles (RBAC) pour la gestion de systèmes de puissance. Le RBAC attribue des utilisateurs humains, des systèmes automatisés et des applications logicielles (appelés "sujets" dans le présent document) aux "rôles" spécifiés et limite leur accès à ces ressources uniquement, que les politiques de sécurité identifient comme nécessaires à leurs rôles.<br/>
    Les systèmes électriques de puissance étant de plus en plus automatisés et les préoccupations relatives à la cybersécurité étant de plus en plus importantes, il est de plus en plus critique d'assurer la restriction de l'accès aux données (lecture, écriture, contrôle, etc.). Comme pour beaucoup d'aspects liés à la sécurité, le RBAC n'est pas uniquement une technologie; il s'agit d'une manière de diriger une entreprise. Le RBAC n'est pas un concept nouveau; en réalité, il est utilisé par de nombreux systèmes d'exploitation pour contrôler l'accès aux ressources de systèmes. Le RBAC fournit notamment une alternative au modèle tout ou rien de super utilisateur dans lequel tous les sujets ont accès à toutes les données, y compris aux commandes de contrôle.<br/>
    Le RBAC est une méthode primaire pour satisfaire au principe de sécurité de moindre privilège, qui indique qu'il convient qu'aucun sujet ne se voit attribué plus de permissions que nécessaire pour effectuer la tâche affectée audit sujet. Avec le RBAC, l'autorisation est distincte de l'authentification. Le RBAC permet à une organisation de subdiviser les capacités des super-utilisateurs et de les regrouper dans des comptes d'utilisateurs spéciaux, appelés rôles, pour les attribuer à des personnes spécifiques en fonction des responsabilités qui leur sont associées. Cette sous-division permet aux politiques de sécurité de déterminer les personnes ou les systèmes qui ont accès aux données dans d'autres systèmes. Le RBAC fournit ainsi un moyen de réattribuer des contrôles de systèmes comme cela est défini par la politique organisationnelle. Le RBAC peut notamment protéger des opérations sensibles de systèmes contre des actions commises par inadvertance (ou délibérées) par des utilisateurs non autorisés. Cependant, le RBAC ne se limite clairement pas aux utilisateurs humains; il s'applique tout aussi bien aux systèmes automatisés qu'aux applications logicielles, c'est à dire, aux parties logicielles qui fonctionnent indépendamment des interactions avec l'utilisateur.<br/>
    Les interactions suivantes relèvent du domaine d'application:<br/>
    – accès local (raccordé directement) à l'objet par un utilisateur humain, un agent ordinateur automatisé local, ou à l'aide de l'IHM ou du panneau intégré(e) aux objets;<br/>
    – accès à distance (par ligne commutée ou support sans fil) à l'objet par un utilisateur humain;<br/>
    – accès à distance (par ligne commutée ou support sans fil) à l'objet par un agent ordinateur automatisé distant, par exemple, un autre objet dans un autre poste, une ressource d'énergie distribuée dans l'installation d'un utilisateur final, ou une application centrale de contrôle.<br/>
    Tandis que le présent document définit un ensemble de rôles obligatoires à prendre en charge, le format d'échange de rôles définis spécifiques ou personnalisés relève également du domaine d'application du présent document. Pour ce faire, deux approches de codage différentes sont définies pour traiter la définition des rôles personnalisés, soit selon des permissions spécifiques, soit selon des contraintes imposées aux permissions existantes. La définition du traitement des rôles personnalisés a été lancée dans l'IEC 62351-90-1 et reprise dans l'IEC 62351-8:2020. En outre, en plus de la définition de rôles personnalisés fondée sur les permissions associées, le présent document inclut également des options sur la manière d'attribuer les permissions aux objets de manière générale. Les documents de référence fournissent une correspondance avec un modèle de données concret pour assurer l'interopérabilité des rôles normalisés utilisés dans différents modèles de données, ainsi que des rôles personnalisés. Les documents de référence peuvent être des normes telles que l'IEC PAS 61850-90-19 ou l'IEC 60870-5-7:2025, ou encore des définitions établies par un opérateur.<br/>
    Tous les thèmes non directement liés à la définition des rôles et des jetons d'accès concernant les accès locaux et distants, en particulier les tâches administratives ou organisationnelles, ne relèvent pas du domaine d'application du présent document. Ils incluent, entre autres:<br/>
    – définition des noms d'utilisateurs et définitions/stratégies de mots de passe;<br/>
    – gestion de clés et/ou échange de clés;<br/>
    – processus d'ingénierie des rôles;<br/>
    – attribution des rôles;<br/>
    – choix des autorités de certification de confiance émettant des justificatifs d'identité (jetons d'accès);<br/>
    – définition des tâches d'un responsable de la sécurité;<br/>
    – intégration de politiques locales dans le RBAC.<br/>
    Les normes existantes (voir ANSI INCITS 359-2004, IEC 62443 (toutes les parties), et IEEE 802.1X-2020) relatives à l'industrie du contrôle de processus et au contrôle d'accès (RFC 2904 et RFC 2905) ne suffisent pas pour traiter les spécificités de l'automatisation des systèmes de puissance, car aucune d'entre elles ne spécifie le nom de rôle exact et les permissions associées ou le format des jetons d'accès ou encore le mécanisme détaillé par lequel les jetons d'accès sont transférés au système cible et authentifiés par celui-ci. Le présent document aborde cette question en définissant le format des jetons d'accès, leur distribution et leur vérification à partir de la technologie existante.<br/>
    Dans l'ensemble du document, des événements de sécurité sont définis. Ces événements de sécurité sont destinés à prendre en charge la gestion des erreurs et à augmenter ainsi la résilience d'un système. Il est nécessaire que les mises en œuvre fournissent un mécanisme pour annoncer les événements de sécurité.<br/>
    Les informations relatives aux événements de sécurité et les informations détaillées potentielles peuvent uniquement être fournies par l'entité en fonction de la disponibilité de ces informations par l'intermédiaire de la plateforme sous-jacente ou des composants utilisés.<br/>
    Il est fortement recommandé que les événements de sécurité définis dans le document soient rendus accessibles à l'infrastructure opérationnelle par les événements de cybersécurité spécifiés dans l'IEC 62351-14 et/ou par la surveillance des objets comme cela est spécifié dans l'IEC 62351-7. Annexe A présente une correspondance entre les événements définis dans le présent document et la notion de l'IEC 62351-14.<br/>
    Les avis, les avertissements, les erreurs et les alarmes sont utilisés pour indiquer la sévérité d'un événement du point de vue de la sécurité. La notion suivante de l'IEC 62351-14 est utilisée:<br/>
    – Un avis fait référence à une activité liée à la cybersécurité pendant l'utilisation ou la maintenance courante d'une entité. Il ne concerne pas une atteinte à la sécurité informatique, une attaque ou une déviation par rapport aux conditions de fonctionnement normal d'une entité.<br/>
    – Un avertissement est une déviation par rapport aux conditions de fonctionnement normal d'une entité, mais il ne s'agit pas nécessairement d'une cyberattaque.<br/>
    – Une erreur décrit une condition imprévue, qui peut indiquer une activité non autorisée. Elle peut ne pas exiger une action immédiate.<br/>
    – Une alarme est l'indication d'un problème grave, qui peut indiquer une activité non autorisée. Il est prévu que des mesures soient prises immédiatement.<br/>
    Il est, en toute circonstance, prévu qu'une politique de sécurité de l'organisation détermine le traitement final des événements selon l'environnement opérationnel. Par exemple, l'évaluation d'une ou de plusieurs alarmes peut atteindre le niveau d'un incident.<br/>
    Cette deuxième édition annule et remplace la première édition parue en 2020. Cette édition constitue une révision technique.<br/>
    Cette édition inclut les modifications techniques majeures suivantes par rapport à l'édition précédente:<br/>
    a) Suppression de la mise en correspondance des rôles avec les permissions pour les objets selon le modèle de données et/ou le protocole cible pour permettre d'autres mises en correspondance que celles de l'IEC 61850. La mise en correspondance est déléguée à des documents distincts;<br/>
    b) Spécification du traitement d'une combinaison de rôles et de permissions en tant qu'operationSet pour permettre des affectations plus fines aux objets;<br/>
    c) Spécification d'une affectation simplifiée des rôles pour traiter plus efficacement les situations dans lesquelles les rôles sont utilisés en relation avec différents modèles de données, y compris des exemples;<br/>
    d) Inclusion d'un nouveau profil pour permettre de récupérer des informations RBAC à partir de référentiels LDAP;<br/>
    e) Définition d'événements de sécurité spécifiques dans l'ensemble du document;<br/>
    f) Alignement de la terminologie et renforcement avec des exemples.
