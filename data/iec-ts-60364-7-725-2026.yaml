abstract:
- language: en
  script: Latn
  content: |-
    IEC TS 60364-7-725:2026 provides additional requirements for the design, erection and verification of electrical installations applicable for resilient power supply systems that must be operational in a time of disaster. It specifies additional requirements for<br/>
    – generating sets,<br/>
    – a circuit concerning external generating sets, and<br/>
    – circuits of an installation to be supplied<br/>
    so as to prevent or limit the effects of a natural disaster such as<br/>
    – earthquake,<br/>
    – flood damage, or<br/>
    – wind hazard (e.g. tropical cyclone such as hurricane, typhoon).
