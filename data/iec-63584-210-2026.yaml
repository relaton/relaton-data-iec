abstract:
- language: en
  script: Latn
  content: |-
    IEC 63584-210:2026 The Open Charge Point Protocol (OCPP) provides the communication between a Charging Station and a Charging Station Management System (CSMS) and is designed to accommodate any type of charging technique.<br/>
    It is based on Open Charge Point Protocol 2.1 and was submitted as a Fast -Track document.<br/>
    This second edition cancels and replaces the first edition published in 2025. This edition constitutes a technical revision.<br/>
    This edition includes the following significant technical changes with respect to the previous edition:<br/>
    a) part 5 and 6 have been introduced, which contain the certification profiles responsible for the test cases;<br/>
    b) resolved issues and added clarifications to the specification, most of which are related to newly in OCPP 2.1 introduced features like; DER control, V2X, ISO 15118-20, based on lessons learned from the market;<br/>
    c) all OCPP 2.0.1 errata also have been incorporated into OCPP 2.1, due to the versions being backwards-compatible.
