abstract:
- language: en
  script: Latn
  content: |-
    <p class="MsoBodyText">This document provides the reference model for the Recursive Inter-Network Architecture (RINA). It describes:</p>
    <p class="ListContinue1" style="mso-list: l0 level1 lfo1;"><!-- [if !supportLists]-->—     <!--[endif]-->the basic concepts of distributed systems and distributed applications;</p>
    <p class="ListContinue1" style="mso-list: l0 level1 lfo1;"><!-- [if !supportLists]-->—     <!--[endif]-->distributed management systems (DMSs);</p>
    <p class="ListContinue1" style="mso-list: l0 level1 lfo1;"><!-- [if !supportLists]-->—     <!--[endif]-->the fundamental structure of distributed Inter-Process Communications;</p>
    <p class="ListContinue1" style="mso-list: l0 level1 lfo1;"><!-- [if !supportLists]-->—     <!--[endif]-->the Distributed Inter-Process Facility (DIF) operations.</p>
