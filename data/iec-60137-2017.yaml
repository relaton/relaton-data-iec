abstract:
- language: en
  script: Latn
  content: |-
    IEC 60137:2017 specifies the characteristics and tests for insulated bushings.<br/>
    This standard is applicable to bushings, as defined in Clause 3, intended for use in electrical apparatus, machinery, transformers, switchgear and installations for three-phase alternating current systems, having highest voltage for equipment above 1 000 V and power frequencies of 15 Hz up to and including 60 Hz.<br/>
    Subject to special agreement between purchaser and supplier, this standard may be applied, in part or as a whole, to the following:<br/>
    - bushings used in other than three-phase systems;<br/>
    - bushings for high-voltage direct current systems;<br/>
    - bushings for testing transformers;<br/>
    - bushings for capacitors.<br/>
    Special requirements and tests for transformer bushings in this standard apply also to reactor bushings.<br/>
    This standard is applicable to bushings made and sold separately. Bushings which are a part of an apparatus and which cannot be tested according to this standard should be tested with the apparatus of which they form part. This edition includes the following significant technical changes with respect to the previous edition:<br/>
    - Resin-impregnated synthetic (RIS) bushings has been introduced.<br/>
    - Bushings with Um ≤ 1,1 kV, Um = 1100 kV and Um = 1200 kV have been introduced.<br/>
    - Temperature rise testing has been included for liquid-insulated bushings according to clause to 3.4.<br/>
    - Introducing dry lightning impulse testing as a routine test for all transformer bushings with Um &gt; 72,5 kV.<br/>
    - The altitude correction procedure has been revised ( &gt; 1 000 m).<br/>
    - An explanation about Very Fast Transient (VFT) phenomenon and its impact on bushings has been included.<br/>
    The contents of the corrigendum of May 2018 have been included in this copy.
- language: fr
  script: Latn
  content: |-
    L'IEC 60137:2017 spécifie les caractéristiques et les essais applicables aux traversées isolées.<br/>
    La présente norme s'applique aux traversées, telles qu'elles sont définies à l’Article 3, destinées à être utilisées dans les dispositifs électriques, les machines, les transformateurs, les appareillages de connexion et les installations pour des systèmes à courant alternatif triphasé possédant une tension plus élevée pour le matériel dépassant 1 000 V et des fréquences industrielles comprises entre 15 Hz et 60 Hz (inclus).<br/>
    Sous réserve d’un accord spécifique entre l’acheteur et le fournisseur, cette norme peut être appliquée, en partie ou en totalité, aux éléments suivants:<br/>
    - traversées utilisées dans d’autres systèmes que ceux à courant alternatif triphasé;<br/>
    - traversées pour les systèmes à courant continu haute tension;<br/>
    - traversées pour les transformateurs d’essai;<br/>
    - traversées pour les condensateurs.<br/>
    Les exigences spéciales et les essais concernant les traversées de transformateurs spécifiées dans la présente norme s’appliquent également aux traversées pour bobines d'inductance. La présente norme s'applique aux traversées fabriquées et commercialisées séparément. Il convient que les traversées qui font partie intégrante d'un appareillage, et qui ne peuvent être soumises à l'essai selon la présente norme, soient soumises à l'essai avec l'appareillage dont elles font partie.<br/>
    Cette édition inclut les modifications techniques majeures suivantes par rapport à l’édition précédente:<br/>
    - Ajout de traversées en matière synthétique imprégnée de résine (RIS – resin-impregnated synthetics).<br/>
    - Ajout de traversées dont Um ≤ 1,1 kV, Um = 1 100 kV et Um = 1 200 kV.<br/>
    - Intégration de l'essai d'échauffement pour les traversées à isolation liquide selon 3.4.<br/>
    - Ajout de l'essai de choc de foudre à sec en tant qu'essai individuel de série pour toutes les traversées de transformateurs dont Um &gt; 72,5 kV.<br/>
    - La procédure de correction d’altitude a été révisée ( &gt; 1 000 m).<br/>
    - Ajout d’une explication sur le phénomène des transitoires très rapides (VFT – Very Fast transient) et sur leur impact sur les traversées.<br/>
    Le contenu du corrigendum de mai 2018 a été pris en considération dans cet exemplaire.
