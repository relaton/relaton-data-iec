abstract:
- language: en
  script: Latn
  content: |-
    IEC 61526:2024 applies to personal dosemeters with the following characteristics:<br/>
    a) They are worn on the trunk, close to the eye, or on the extremities.<br/>
    b) They measure the personal dose equivalents Hp(10), Hp(3), and Hp(0,07), from external X and gamma, neutron (not for Hp(3)), and beta radiations, and may measure the respective personal dose equivalent rates for the same radiations (for alarming purposes).<br/>
    c) They have a digital indication. This indication may or may not be attached.<br/>
    d) They have alarm functions for the personal dose equivalents or personal dose equivalent rates except for hybrid dosemeters. For hybrid dosemeters an alarm function for the personal dose equivalents shall be implemented in the associated readout system.<br/>
    This document specifies requirements for the dosemeter and, if supplied, for its associated readout system.<br/>
    This document specifies, for the dosemeters described above, general characteristics, general test procedures, radiation characteristics as well as electrical, mechanical, safety and envi­ronmental characteristics.<br/>
    This edition includes the following significant technical changes with respect to the previous edition:<br/>
    a) Modification of the title;<br/>
    b) Inclusion of the measurement quantity for the dose in the lens of the eye, Hp(3);<br/>
    c) Inclusion of measurement quantity for dose in the skin and extremities, Hp(0,07);<br/>
    d) Inclusion of dosemeters between active and passive: "hybrid dosemeters";<br/>
    e) Inclusion of software requirements;<br/>
    f) Harmonization of requirements for linearity to IEC 62387;<br/>
    g) Revised neutron energy response requirements.
- language: fr
  script: Latn
  content: |-
    IEC 61526:2024 s'applique aux dosimètres individuels qui présentent les caractéristiques suivantes:<br/>
    a) ils sont portés sur la poitrine, près des yeux, ou aux extrémités;<br/>
    b) ils mesurent les équivalents de dose individuels Hp(10), Hp(3) et Hp(0,07) pour les rayonnements externes X et gamma, neutron (excepté Hp(3)) et bêta, et peuvent mesurer les débits d'équivalents de dose individuels respectifs pour les mêmes rayonnements (à des fins d'alarme);<br/>
    c) ils comportent un affichage numérique. Cet affichage peut ou non être inclus;<br/>
    d) ils ont des fonctions d'alarme pour les équivalents de dose individuels ou pour les débits d'équivalents de dose individuels, à l'exception des dosimètres hybrides. Pour les dosimètres hybrides, une fonction d'alarme pour les équivalents de dose individuels doit être mise en œuvre dans le système de lecture associé.<br/>
    Le présent document spécifie les exigences pour les dosimètres et, s'ils sont fournis, pour leurs systèmes de lecture associés.<br/>
    Le présent document spécifie, pour les dosimètres décrits ci-dessus, leurs caractéristiques générales, leurs procédures d'essai générales, leurs caractéristiques sous rayonnement ainsi que leurs caractéristiques électriques, mécaniques, de sécurité et environnementales.<br/>
    Cette quatrième édition annule et remplace la troisième édition parue en 2010. Cette édition inclut les modifications techniques majeures suivantes par rapport à l'édition précédente:<br/>
    a) modification du titre;<br/>
    b) introduction de la grandeur de mesure pour la dose dans le cristallin de l'œil, Hp(3);<br/>
    c) introduction de la grandeur de mesure pour la dose dans la peau et les extrémités, Hp(0,07);<br/>
    d) introduction des dosimètres qui relèvent des catégories de dosimètres actifs et passifs: les "dosimètres hybrides";<br/>
    e) introduction des exigences relatives au logiciel;<br/>
    f) harmonisation des exigences de linéarité par rapport à l'IEC 62387;<br/>
    g) révision des exigences de réponse à l'énergie des neutrons.
