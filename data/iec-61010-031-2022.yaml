abstract:
- language: en
  script: Latn
  content: |-
    IEC 61010-031:2022 specifies safety requirements for hand-held and hand-manipulated probe assemblies for electrical test and measurement, and their related accessories. These probe assemblies are for non-contact or direct electrical connection between a part and electrical test and measurement equipment. They can be fixed to the equipment or be detachable accessories for the equipment.<br/>
    <br/>
    It has the status of a group safety publication in accordance with IEC Guide 104.<br/>
    <br/>
    This third edition cancels and replaces the second edition published in 2015, and Amendment 1:2018. IEC 61010-031 is a stand-alone standard. This edition includes the following significant technical changes with respect to the previous edition:<br/>
    the scope has been made succinct. General information from the scope of Edition 2 has been moved to a new Clause 4. Consequently, Clause 4 to Clause 8 of Edition 2 have been renumbered. Clause 9 of Edition 2 has been deleted;<br/>
    in Clause 2, normative references have been dated and new normative references have been added;<br/>
    in 3.1.4, the definition of probe tip has been modified;<br/>
    in 4.1, there is no longer any differentiation between high voltage and low voltage probe assemblies. Type C probe assemblies have been merged with Type B probe assemblies;<br/>
    in 4.1 d) "Kelvin" probes have been added to the list of probe assemblies as a new Type E and a new Figure 5;<br/>
    in 4.1 e), probes for voltage measurement without electrical connection to conductors have been added to the list of probe assemblies as a new Type F and a new Figure 6;<br/>
    in 4.2.1, spread of fire is no longer considered as a hazard;<br/>
    Subclause 4.4.2.5 from Edition 2 has been deleted;<br/>
    Subclause 4.4.4.3 from Edition 2 has been deleted;<br/>
    in 5.4.4.1 consideration has been given to spacings and impedance;<br/>
    in 6.1.1, removable parts of probe tips which bear markings are allowed;<br/>
    in 6.1.5, the voltage to be marked for measurement categories is the AC line-to-neutral or DC voltage;<br/>
    in 7.4.2, requirements for unmated connectors have been modified as follows:<br/>
    Table 2 has been modified and expanded,<br/>
    a calculation method for clearances of connectors above 20 kV has been defined,<br/>
    creepage distances have been aligned with clearances;<br/>
    <br/>
    in 7.4.3.1 and 7.4.3.5, requirements for IP2X probe tips with retractable sleeve have been added;<br/>
    in 7.4.3.2, Probe tips are now applicable to non-contact probe assemblies;<br/>
    in 7.5.2.3.2, the values of Table 5 have been modified;<br/>
    in 7.6.2, voltage tests of clearances are done without humidity preconditioning;<br/>
    pre-treatments for rigidity test from Clause 10 of Edition 2 have been moved to 9.2;<br/>
    Subclause 11.1 of Edition 2 has been deleted;<br/>
    addition of an exception for Type E probe assembly in 13.2. Removable parts of probe tips which bear markings are allowed;<br/>
    Figure F.1 has been modified;<br/>
    Annex G has been added, for determination of clearances for Table 2;<br/>
    Annex H has been added, covering line-to-neutral voltages for common mains supply systems.
- language: fr
  script: Latn
  content: |-
    L’IEC 61010-031:2022 spécifie les exigences de sécurité relatives aux sondes équipées tenues à la main et manipulées prévues pour le mesurage et les essais électriques, ainsi que leurs accessoires connexes. Ces sondes équipées sont prévues pour une connexion sans contact électrique ou une connexion électrique directe entre une partie et un appareil de mesure et d’essai électrique. Elles peuvent être solidaires de l’appareil ou en être des accessoires détachables.<br/>
    Elle a le statut d’une publication groupée de sécurité conformément au Guide IEC 104.<br/>
    Cette troisième édition annule et remplace la deuxième édition parue en 2015 et l’Amendement 1:2018. L’IEC 61010-031 est une norme autonome.<br/>
    Cette édition inclut les modifications techniques majeures suivantes par rapport à l’édition précédente:<br/>
    le domaine d’application a été raccourci. Les informations générales du domaine d’application de l’Edition 2 ont été déplacées dans un nouvel Article 4. Par conséquent, les Articles 4 à 8 de l’Edition 2 ont été renumérotés. L’Article 9 de l’Edition 2 a été supprimé;<br/>
    à l’Article 2, les références normatives ont été datées et de nouvelles références normatives ont été ajoutées;<br/>
    en 3.1.4, la définition de pointe de touche a été modifiée;<br/>
    en 4.1, il n’y a plus de distinction entre les sondes équipées haute tension et basse tension. Les sondes équipées de types B et C ont été fusionnées;<br/>
    en 4.1 d), les sondes "Kelvin" ont été ajoutées à la liste des sondes équipées en tant que nouveau type E, ainsi qu’une nouvelle Figure 5;<br/>
    en 4.1 e), des sondes de mesure de la tension sans connexion électrique aux conducteurs ont été ajoutées à la liste des sondes équipées en tant que nouveau type F, ainsi qu’une nouvelle Figure 6;<br/>
    en 4.2.1, la propagation du feu n’est plus considérée comme un danger;<br/>
    le paragraphe 4.4.2.5 de l’Edition 2 a été supprimé;<br/>
    le paragraphe 4.4.4.3 de l’Edition 2 a été supprimé;<br/>
    en 5.4.4.1, une attention particulière a été accordée aux espacements et à l’impédance;<br/>
    en 6.1.1, les parties amovibles des pointes de touche qui portent des marquages sont autorisées;<br/>
    en 6.1.5, la tension à marquer pour les catégories de mesure est la tension alternative phase-neutre ou la tension continue;<br/>
    en 7.4.2, les exigences relatives aux connecteurs découplés ont été modifiées comme suit:<br/>
    le Tableau 2 a été modifié et étendu;<br/>
    une méthode de calcul des distances d’isolement des connecteurs au-delà de 20 kV a été définie;<br/>
    les lignes de fuite ont été alignées avec les distances d’isolement;<br/>
    <br/>
    en 7.4.3.1 et 7.4.3.5, des exigences ont été ajoutées pour les pointes de touche IP2X avec manchon rétractable;<br/>
    en 7.4.3.2, les pointes de touche sont désormais applicables aux sondes équipées sans contact;<br/>
    en 7.5.2.3.2, les valeurs du Tableau 5 ont été modifiées;<br/>
    en 7.6.2, les essais de tension des distances d’isolement sont effectués sans préconditionnement à l’humidité;<br/>
    les prétraitements pour l’essai de rigidité de l’Article 10 de l’Edition 2 ont été déplacés en 9.2;<br/>
    le paragraphe 11.1 de l’Edition 2 a été supprimé;<br/>
    en 13.2, une exception a été ajoutée pour la sonde équipée de type E. Les parties amovibles des pointes de touche qui portent des marquages sont autorisées;<br/>
    la Figure F.1 a été modifiée;<br/>
    l’Annexe G a été ajoutée pour déterminer les distances d’isolement du Tableau 2;<br/>
    l’Annexe H a été ajoutée pour couvrir les tensions phase-neutre des réseaux de distribution généralement utilisés.
