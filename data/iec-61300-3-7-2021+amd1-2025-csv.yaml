abstract:
- language: en
  script: Latn
  content: |-
    IEC 61300-3-7:2021+AMD1:2025 CSV describes methods available to measure the wavelength dependence of attenuation and return loss of two-port, single mode passive optical components. It is not, however, applicable to dense wavelength division multiplexing (DWDM) devices. Measurement methods of wavelength dependence of attenuation of DWDM devices are described in IEC 61300-3-29. There are two measurement cases described in this document:<br/>
    a) measurement of attenuation only;<br/>
    b) measurement of attenuation and return loss at the same time.<br/>
    This third edition cancels and replaces the second edition published in 2009. This edition constitutes a technical revision. This edition includes the following significant technical changes with respect to the previous edition:<br/>
    a) reduction of the number of alternative methods proposed to bring in-line with industry practice;<br/>
    b) re-statement of the equations for insertion loss and return loss using logarithmic forms more common in the industry;<br/>
    c) additional recommendations with respect to the creation of fibre terminations;<br/>
    d) additional discussion on the characterization of the optical sources used in this document;<br/>
    e) simplification of bi-directional testing;<br/>
    f) removal of separate return loss only measurement procedures.
