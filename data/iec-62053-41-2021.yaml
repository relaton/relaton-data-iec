abstract:
- language: en
  script: Latn
  content: |-
    IEC 62053-41:2021 applies only to static watt-hour meters of accuracy classes 0,5 and 1 for the measurement of DC electrical energy in DC systems, and it applies to their type tests only.<br/>
    This document applies to electricity metering equipment designed to:<br/>
    • measure and control electrical energy on electrical networks with two poles where one of the poles is connected to earth and with voltage up to 1 500 V DC;<br/>
    • have all functional elements, including add-on modules, enclosed in, or forming a single meter case with the exception of indicating displays;<br/>
    • operate with integrated or detached indicating displays, or without an indicating display;<br/>
    • be installed in a specified matching socket or rack;<br/>
    • optionally, provide additional functions other than those for measurement of electrical energy.<br/>
    They may be used for measuring DC electrical energy, amongst others, in the following application areas:<br/>
    • in EV (electrical vehicle) charging stations or in EV charging infrastructures, if the measurement is placed on the DC side;<br/>
    • in information technology (IT) server farms;<br/>
    • in DC supply points for communication equipment;<br/>
    • in low voltage DC networks for residential or commercial areas, if the measurement is placed on the DC side;<br/>
    • in solar PV (photovoltaic) systems where DC power generation is measured;<br/>
    • in DC supply points for public transport networks (e.g. trolleybus, etc.).<br/>
    Meters designed for operation with low power instrument transformers, LPITs as defined in the IEC 61869 series, may be tested for compliance with this document only if such meters and their LPITs are tested together and meet the requirements for directly connected meters.<br/>
    This document does not apply to:<br/>
    • meters for which the voltage between the two poles, where one of the poles is connected to earth, exceeds 1 500 V DC;<br/>
    • meters to be used in networks other than with two poles in which one of the poles is connected to earth;<br/>
    • meters intended for connection with low power instrument transformers (LPITs as defined in the IEC 61869 series) when tested without such transformers;<br/>
    • metering systems comprising multiple devices physically (except LPITs) remote from one another;<br/>
    • portable meters;<br/>
    • meters used in rolling stock, vehicles, ships and airplanes;<br/>
    • laboratory and meter test equipment;<br/>
    • reference standard meters;<br/>
    • data interfaces to the register of the meter;<br/>
    • matching sockets or racks used for installation of electricity metering equipment;<br/>
    • any additional functions provided in electrical energy meters.<br/>
    This document does not cover measures for detection and prevention of fraudulent attempts to compromise a meter’s performance (tampering).
- language: fr
  script: Latn
  content: |-
    IEC 62053:41:2021 est applicable uniquement aux compteurs statiques d'énergie de classes d'exactitude 0,5 et 1, destinés au mesurage de l'énergie électrique en courant continu dans les systèmes en courant continu, et à leurs essais de type.<br/>
    Le présent document s'applique aux équipements de comptage de l'électricité conçus pour:<br/>
    • mesurer et piloter l'énergie électrique sur les réseaux électriques à deux pôles, l'un des pôles étant relié à la terre, de tension jusqu'à 1 500 V en courant continu;<br/>
    • avoir tous les éléments fonctionnels, y compris les modules additionnels, incorporés dans ou formant un boîtier de compteur unique, à l'exception des afficheurs ou dispositifs indicateurs;<br/>
    • fonctionner avec des afficheurs intégrés ou séparés, ou sans afficheur;<br/>
    • être installés dans un rack ou une embase correspondante spécifié(e);<br/>
    • assurer, en option, des fonctions additionnelles autres que celles relatives au comptage de l'énergie électrique.<br/>
    Ils peuvent être utilisés pour le comptage de l'énergie électrique en courant continu notamment dans les domaines d'application suivants:<br/>
    • dans les bornes de recharge pour véhicules électriques ou les infrastructures de recharge pour véhicules électriques, si le mesurage est effectué côté courant continu;<br/>
    • dans les parcs de serveurs des technologies de l'information (TI);<br/>
    • dans les points d'alimentation en courant continu pour les équipements de communication;<br/>
    • dans les réseaux basse tension en courant continu des zones résidentielles ou commerciales, si le mesurage est effectué côté courant continu;<br/>
    • dans les systèmes photovoltaïques (PV) où la puissance générée en courant continu est mesurée;<br/>
    • dans les points d'alimentation en courant continu pour les réseaux de transport public (par exemple, trolleybus, etc.).<br/>
    Les compteurs conçus pour être utilisés avec des transformateurs de mesure de faible puissance (LPIT, Low Power Instrument Transformers, définis dans la série IEC 61869) ne peuvent être soumis à des essais de conformité au présent document que si ces compteurs et leurs LPIT sont soumis ensemble aux essais et satisfont aux exigences relatives aux compteurs à branchement direct.<br/>
    Le présent document ne s'applique pas:<br/>
    • aux compteurs dont la tension entre les deux pôles, l'un des pôles étant relié à la terre, dépasse 1 500 V en courant continu;<br/>
    • aux compteurs prévus pour être utilisés dans des réseaux autres qu'à deux pôles, l'un des pôles étant relié à la terre;<br/>
    • aux compteurs destinés à être connectés à des transformateurs de mesure de faible puissance (LPIT, définis dans la série IEC 61869) lorsqu'ils sont soumis à l'essai sans ces transformateurs;<br/>
    • aux systèmes de comptage qui comprennent plusieurs dispositifs physiquement éloignés les uns des autres (à l'exception des LPIT);<br/>
    • aux compteurs portatifs;<br/>
    • aux compteurs utilisés dans le matériel roulant, les véhicules, les navires et les avions;<br/>
    • aux équipements de laboratoire et d'essai des compteurs;<br/>
    • aux compteurs étalons de référence;<br/>
    • aux interfaces de données avec l'élément indicateur du compteur;<br/>
    • aux racks ou embases correspondantes utilisés pour l'installation des équipements de comptage de l'électricité;<br/>
    • à toute fonction additionnelle assurée par les compteurs d'énergie électrique.<br/>
    Le présent document ne couvre pas les mesures de détection et de prévention des tentatives frauduleuses qui visent à compromettre les performances d'un compteur (falsification).
