abstract:
- language: en
  script: Latn
  content: |-
    IEC TR 62908-1-3:2026, which is a technical report, provides general information on pen touch technology with the aim toward standardization. This document includes an overview of the pen touch technology, critical performance characteristics, issues of characteristics measurements, and other information. The purpose of this document is to provide an overview of the different products available in pen touch technology. The companies and products named in this document do not constitute an endorsement by IEC of these products. This second edition cancels and replaces the first edition published in 2021. This edition constitutes a technical revision.<br/>
    This edition includes the following significant technical changes with respect to the previous edition:<br/>
    a) add writing characteristics as physical properties of interaction between a pen and a surface of a screen;<br/>
    b) add example of frictional response between paper and pencil, AGL and touch pen, and glass and touch pen;<br/>
    c) add example of touch display used in the classroom regarding writing and optical characteristics.
