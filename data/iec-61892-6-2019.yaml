abstract:
- language: en
  script: Latn
  content: |-
    IEC 61892-6:2019 provides specific requirements for the installation of electrical equipment in mobile and fixed offshore units, including pipeline, pumping or "pigging" stations, compressor stations and single buoy moorings, used in the offshore petroleum industry for drilling, production, accommodation, processing, storage and offloading purposes.<br/>
    It applies to all installations, whether permanent, temporary, transportable or hand-held, to AC installations and DC installations without any voltage level limitation. Referenced equipment standards may give voltage level limitations.<br/>
    This document specifies requirements such as those concerning<br/>
    – protection during equipment storage and in the installation period,<br/>
    – installation of generators and motors,<br/>
    – installation of transformers,<br/>
    – installation of switchgear and controlgear assemblies,<br/>
    – installation of semiconductor converters and UPS,<br/>
    – installation of secondary cells and batteries,<br/>
    – installation of luminaires,<br/>
    – installation of heating and cooking appliances,<br/>
    – installation of trace and surface heating,<br/>
    – installation of cables and wiring, both low-voltage and high-voltage cables,<br/>
    – requirements in relation to earthing and bonding,<br/>
    – lightning protection;,<br/>
    – testing of completed installation, and<br/>
    – documentation.<br/>
    This document does not apply to<br/>
    – fixed equipment for medical purposes,<br/>
    – electrical installations of tankers, and<br/>
    – control of ignition sources other than those created by electrical equipment.<br/>
    This fourth edition cancels and replaces the third edition published in 2013. This edition constitutes a technical revision.<br/>
    This edition includes the following significant technical changes with respect to the previous edition:<br/>
    a) requirements for protection during equipment storage have been added;<br/>
    b) the special requirements for distribution board enclosures in accommodation spaces have been deleted;<br/>
    c) requirements for installation of UPS have been updated;<br/>
    d) requirements regarding the installation of batteries have been modified;<br/>
    e) requirements for large single-core cables for three-phase AC have been updated;<br/>
    f) requirements in relation to cable transit systems have been added;<br/>
    g) the table on the sizes of earth continuity conductors and equipment earthing connections, set out in IEC 61892-4:2007, has been included;<br/>
    h) requirements as to the installation of controls and instrumentation have been modified; clauses relevant to design and equipment have been deleted.
- language: fr
  script: Latn
  content: |-
    L'IEC 61892-6:2019 donne les exigences spécifiques relatives à l'installation des équipements électriques dans les unités mobiles et fixes en mer, y compris les canalisations, les stations de pompage ou de raclage, les stations de compression et les systèmes d'amarrage à point unique, qui sont utilisés dans l'industrie pétrolière en mer (offshore) pour le forage, la production, les lieux d'habitation, le traitement, le stockage et le déchargement.<br/>
    Elle s'applique à toutes les installations, qu'elles soient permanentes ou provisoires, transportables ou portatives, aux installations en courant alternatif et aux installations en courant continu sans aucune limitation du niveau de tension. Les normes des équipements référencés peuvent fournir des limites de niveau de tension.<br/>
    Le présent document spécifie des exigences pour<br/>
    – la protection pendant le stockage de l'équipement et la période d'installation,<br/>
    – l'installation des générateurs et des moteurs,<br/>
    – l'installation des transformateurs,<br/>
    – l'installation des ensembles d'appareillages de connexion et de commande,<br/>
    – l'installation de convertisseurs à semiconducteurs et d'ASI,<br/>
    – l'installation d'accumulateurs et batteries d'accumulateurs,<br/>
    – l'installation de luminaires,<br/>
    – l'installation d'appareils de chauffage et de cuisson,<br/>
    – l'installation de traçage et chauffage superficiel,<br/>
    – l'installation des câbles et de câblage, tant des câbles à basse tension qu'à haute tension,<br/>
    – les exigences de mise à la terre et de liaison,<br/>
    – la protection contre la foudre,<br/>
    – les essais de l'installation terminée, et<br/>
    – la documentation.<br/>
    Le présent document ne s'applique pas<br/>
    – aux équipements fixes destinés aux applications médicales,<br/>
    – aux installations électriques des navires-citernes, et<br/>
    – au contrôle des sources d'incendie autres que celles générées par l'équipement électrique.<br/>
    Cette quatrième édition annule et remplace la troisième édition parue en 2013. Cette édition constitue une révision technique.<br/>
    Cette édition inclut les modifications techniques majeures suivantes par rapport à l'édition précédente:<br/>
    a) les exigences de protection pendant le stockage de l'équipement ont été ajoutées;<br/>
    b) les exigences particulières relatives aux enveloppes de tableau de répartition dans les locaux d'habitation ont été supprimées;<br/>
    c) les exigences d'installation des ASI ont été mises à jour;<br/>
    d) les exigences d'installation des batteries ont été modifiées;<br/>
    e) les exigences relatives aux câbles unipolaires de forte section pour courant alternatif triphasé ont été mises en jour;<br/>
    f) les exigences relatives aux systèmes de passage de câble ont été ajoutées;<br/>
    g) le tableau relatif à la taille des conducteurs de terre et des connexions de mise à la terre des équipements énoncés dans l'IEC 61892-4:2007 a été inclus;<br/>
    h) les exigences d'installation des commandes et instrumentations ont été modifiées, les articles relatifs à la conception et à l'équipement ont été supprimés.
