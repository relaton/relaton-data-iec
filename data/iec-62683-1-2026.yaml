abstract:
- language: en
  script: Latn
  content: |-
    IEC 62683-1:2026 establishes the reference dictionary of the general description of classes of low-voltage switchgear and controlgear and their assemblies based on defined properties. This dictionary is used to facilitate the exchange in electronic format of data describing low voltage switchgear and controlgear, their accessories and their assemblies. This document provides clear and unambiguous definitions of a limited number of properties and classes which are mainly used for presentation, selection and identification of products particularly in electronic catalogues. Each property has an unambiguously defined meaning and name, and where relevant, a defined value list, a defined format, and a defined unit. Manufacturer specific features are not covered. This second edition cancels and replaces the first edition published in 2017. This edition constitutes a technical revision.<br/>
    This edition includes the following significant technical changes with respect to the previous edition for reflecting the content of the IEC CDD 62683DB which has been updated with the change requests C00073, C00074, C00081, C00087, C00089, C00098, C00100, C00107, C00111, C00116, C00119, C00122, C00146, C00148, C00159, C00167, C00174 and C00135:<br/>
    a) New device class descriptions: ACC304, ACC305, ACC413, ACC417, ACC503, ACC504, ACC505, ACC512, ACC516, ACC536, ACC537, ACC538, ACC540, ACC541, ACC542, ACC543, ACC544, ACC545, ACC546, ACC547, ACC548.<br/>
    b) New associated properties.<br/>
    c) New assembly class structure: ACC101, ACC102, ACC103, ACC104, ACC106, ACC110, ACC111, ACC112, ACC113, ACC114, ACC115, ACC116, ACC117, ACC118, ACC119, ACC120, ACC121, ACC123, ACC124, ACC125, ACC126, ACC127, ACC131, ACC132, ACC133, ACC135, ACC141, ACC142, ACC143, ACC144, ACC145, ACC146, ACC147, ACC148, ACC150, ACC151, ACC152, ACC153, ACC154, ACC155, ACC156, ACC157, ACC158, ACC159, ACC160, ACC161, ACC162, ACC163, ACC164, ACC165, ACC166, ACC167, ACC170, ACC171, ACC172, ACC173, ACC174, ACC175.
- language: fr
  script: Latn
  content: |-
    L'IEC 62683-1:2026 définit le dictionnaire de référence pour la description générale des classes d'appareillages et ensembles d'appareillage à basse tension à partir de propriétés définies. Ce dictionnaire est utilisé pour faciliter l'échange, au format électronique, de données décrivant les appareillages, accessoires et ensembles d'appareillage à basse tension. Le présent document propose des définitions claires et sans équivoque pour un certain nombre de propriétés et de classes principalement destinées à la présentation, à la sélection et à l'identification de produits, en particulier dans les catalogues électroniques. Chaque propriété a une signification et un nom définis de manière univoque et, le cas échéant, une liste de valeurs définie, un format défini et une unité définie. Les fonctions spécifiques aux fabricants ne sont pas traitées. Cette deuxième édition annule et remplace la première édition parue en 2017. Cette édition constitue une révision technique.<br/>
    Cette édition inclut les modifications techniques majeures suivantes par rapport à l'édition précédente pour refléter le contenu de l'IEC CDD 62683DB, qui a été mis à jour avec les demandes de modification C00073, C00074, C00081, C00087, C00089, C00098, C00100, C00107, C00111, C00116, C00119, C00122, C00146, C00148, C00159, C00167, C00174 et C00135:<br/>
    a) Nouvelles descriptions de classe de dispositif: ACC304, ACC305, ACC413, ACC417, ACC503, ACC504, ACC505, ACC512, ACC516, ACC536, ACC537, ACC538, ACC540, ACC541, ACC542, ACC543, ACC544, ACC545, ACC546, ACC547, ACC548.<br/>
    b) Nouvelles propriétés associées.<br/>
    c) Nouvelle structure de classe d'ensemble: ACC101, ACC102, ACC103, ACC104, ACC106, ACC110, ACC111, ACC112, ACC113, ACC114, ACC115, ACC116, ACC117, ACC118, ACC119, ACC120, ACC121, ACC123, ACC124, ACC125, ACC126, ACC127, ACC131, ACC132, ACC133, ACC135, ACC141, ACC142, ACC143, ACC144, ACC145, ACC146, ACC147, ACC148, ACC150, ACC151, ACC152, ACC153, ACC154, ACC155, ACC156, ACC157, ACC158, ACC159, ACC160, ACC161, ACC162, ACC163, ACC164, ACC165, ACC166, ACC167, ACC170, ACC171, ACC172, ACC173, ACC174, ACC175.
