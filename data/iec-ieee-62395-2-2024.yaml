abstract:
- language: en
  script: Latn
  content: |-
    IEC/IEEE 62395-2:2024 provides detailed recommendations for the system design, installation, maintenance and repair of electrical resistance trace heating systems in industrial and commercial applications. This document does not include or provide for any applications in potentially explosive atmospheres.<br/>
    This standard cancels and replaces IEC 62395-2:2013. This edition constitutes a technical revision.<br/>
    This standard includes the following significant technical changes with respect to IEC 62395-2:2013:<br/>
    a) Design considerations for trace heating on sprinkler systems have been expanded and a figure has been added to illustrate how to avoid undue shadowing of spray patterns from insulated sprigs close to sprinkler heads;<br/>
    b) Specific details of design considerations for trace heating for emergency eyewash units and safety showers have been added.<br/>
    This document is published as an IEC/IEEE Dual Logo standard.
- language: fr
  script: Latn
  content: |-
    IEC/IEEE 62395-2: 2024 fournit des recommandations détaillées pour la conception, l'installation, la maintenance et la réparation des systèmes de traçage par résistance électrique dans les applications industrielles et commerciales. Le présent document ne comprend ni ne prévoit d'applications dans des atmosphères potentiellement explosives. Le présent document traite de systèmes de traçage qui peuvent comprendre soit des unités fabriquées en usine, soit des unités assemblées sur site (chantier), et qui peuvent être des résistances de traçage en série ou en parallèle, ou des résistances en surface (bandes de traçage ou panneaux de traçage) qui ont été assemblées et/ou équipées de terminaisons conformément aux instructions du fabricant. Les produits couverts par le présent document sont destinés à être installés par des personnes convenablement formées aux techniques nécessaires. Seul ce personnel formé réalise les travaux particulièrement critiques tels que l'installation de connexions et de terminaisons. Les installations sont destinées à être réalisées sous le contrôle d'une personne qualifiée ayant suivi une formation supplémentaire sur les systèmes de traçage électrique. Le présent document ne couvre pas le chauffage par induction, impédance ou effet de peau. Les systèmes de traçage et les systèmes de chauffage de surface peuvent être regroupés en différents types d'installations. Ces types sont caractérisés par des exigences d'essai différentes et ils sont généralement certifiés pour un type particulier d'installation ou d'application. Les applications types pour les différents types d'installations sont représentées dans le Tableau 1 de L’avante-propos.<br/>
    Le présent document est publié sous la forme d'une norme double logo IEC/IEEE.<br/>
    La présente norme annule et remplace l'IEC 62395-2:2013. Cette édition constitue une révision technique. La présente norme inclut les modifications techniques majeures suivantes par rapport à l'IEC 62395‑2:2013:<br/>
    a) les considérations de conception pour le traçage sur les systèmes pulvérisateurs ont été étendues et une figure a été ajoutée pour montrer comment faire pour éviter l'ombrage imprévu des pulvérisations des chevilles d'isolation adjacentes aux têtes d'arrosage;<br/>
    b) des détails spécifiques aux considérations de conception pour le traçage des unités de lave-yeux d'urgence et des douches de sécurité ont été ajoutés.
