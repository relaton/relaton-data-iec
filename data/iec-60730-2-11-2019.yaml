abstract:
- language: en
  script: Latn
  content: |-
    IEC 60730-2-11:2019 applies to energy regulators for use in, on, or in association with equipment, including energy regulators for heating, air conditioning and similar applications. The equipment may use electricity, gas, oil, solid fuel, solar thermal energy, etc. or a combination thereof.<br/>
    This standard applies to the inherent safety, to the operating values, operating times and operating sequence where these are associated with equipment safety, and to the testing of automatic electrical energy regulator devices used in, or in association with, equipment.<br/>
    This standard is also applicable to energy regulators for appliances within the scope of IEC 60335-1.<br/>
    Throughout this standard the word “equipment” means “appliance and equipment”.<br/>
    This standard also applies to automatic electrical energy regulators for equipment that may be used by the public, such as equipment intended to be used in shops, offices, hospitals, farms and commercial and industrial applications.<br/>
    This standard does not apply to automatic electrical energy regulators designed exclusively for industrial process applications unless explicitly mentioned in the equipment standard.<br/>
    This standard does not apply to equipment that are specifically within the scope of building automation equipment.<br/>
    This standard is also applicable to individual energy regulators utilized as part of a control system or energy regulators which are mechanically integral with multi-functional controls having non-electrical outputs.<br/>
    This standard applies to controls powered by primary or secondary batteries, requirements for which are contained within the standard, including Annex V<br/>
    This third edition cancels and replaces the second edition published in 2006. This edition constitutes a technical revision. This edition includes the following significant technical changes with respect to the previous edition:<br/>
    a) revision to the title to remove “for household and similar use”;<br/>
    b) changes to the scope and related modifications;<br/>
    c) changes to definitions in Annex H.<br/>
    This Part 2-11 is intended to be used in conjunction with IEC 60730 1. It was established on the basis of the fifth edition of that standard (2013) including Amendment 1 (2015). Consideration may be given to future editions of, or amendments to, IEC 60730-1.<br/>
    Keywords: Automatic Controls, Energy Regulators, Control Systems
- language: fr
  script: Latn
  content: |-
    IEC 60730-2-11:2019 s'applique aux régulateurs d'énergie destinés à être utilisés dans, sur ou avec du matériel, y compris les régulateurs d'énergie pour le chauffage, le conditionnement d'air et les applications analogues. Le matériel peut utiliser l'électricité, le gaz, le pétrole, des combustibles solides, l'énergie thermique solaire, etc. ou une combinaison de ces sources d'énergie.<br/>
    La présente norme s'applique à la sécurité intrinsèque, aux valeurs de fonctionnement, aux temps de fonctionnement et aux séquences de fonctionnement, dans la mesure où ces éléments interviennent dans la sécurité du matériel, ainsi qu'aux essais des régulateurs d'énergie électriques automatiques utilisés dans ou avec du matériel.<br/>
    La présente norme s'applique également aux régulateurs d'énergie pour appareils relevant du domaine d'application de l'IEC 60335-1.<br/>
    Partout où il est utilisé dans la présente norme, le terme "matériel" signifie "appareil et équipement".<br/>
    La présente norme s'applique également aux régulateurs d'énergie électriques automatiques pour les matériels qui peuvent être utilisés par le grand public, tels que les matériels destinés à être utilisés dans les magasins, bureaux, hôpitaux, exploitations agricoles, ainsi que les applications commerciales et industrielles.<br/>
    La présente norme ne s'applique pas aux matériels qui relèvent spécifiquement du domaine d'application des matériels d'automatisation du bâtiment.<br/>
    La présente norme s'applique également aux régulateurs d'énergie individuels utilisés comme élément d'un système de commande ou aux régulateurs d'énergie qui sont mécaniquement intégrés à des dispositifs de commande multifonctions dont les sorties ne sont pas électriques.<br/>
    La présente norme s'applique aux dispositifs de commande alimentés par piles ou accumulateurs dont les exigences sont spécifiées dans la présente norme, notamment à l'Annexe V.<br/>
    Cette troisième édition annule et remplace la deuxième édition parue en 2006. Cette édition constitue une révision technique. Cette édition inclut les modifications techniques majeures suivantes par rapport à l'édition précédente:<br/>
    a) révision du titre pour supprimer “à usage domestique et analogue”;<br/>
    b) modifications du domaine d’application et modifications associées;<br/>
    c) modifications des définitions à l’Annexe H.<br/>
    La présente Partie 2-11 est destinée à être utilisée conjointement avec l'IEC 60730 1. Elle a été établie sur la base de la cinquième édition de cette norme (2013) et de son Amendement 1 (2015). Les éditions futures de l'IEC 60730-1, ou ses amendements, pourront être pris en considération.<br/>
    Mots-clés: Commande automatiques, régulateurs d'énergie, système de commande
