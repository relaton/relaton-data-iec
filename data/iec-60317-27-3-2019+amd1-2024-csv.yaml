abstract:
- language: en
  script: Latn
  content: |-
    IEC 60317-27-3:2019+AMD1:2024 CSV specifies the requirements of paper tape covered rectangular copper winding wires. This covering consists of two or more layers of paper tape and is primarily intended for winding coils for oil immersed transformers. The range of nominal conductor dimensions covered by this document is<br/>
    - width: min. 2,0 mm max. 31,5 mm;<br/>
    - thickness: min. 0,80 mm max. 10,0 mm.<br/>
    The paper tapes included in this document are restricted to those specified in IEC 60554-1 and IEC 60554-3-5.<br/>
    Keywords: paper tape covered rectangular copper winding wires
