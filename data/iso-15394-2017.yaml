abstract:
- language: en
  script: Latn
  content: |-
    <p>ISO 15394:2017:</p>
    <p>-      specifies the minimum requirements for the design of labels containing linear bar code and two-dimensional symbols on transport units to convey data between trading partners;</p>
    <p>-      provides for traceability of transported units using a unique transport unit identifier (licence plate);</p>
    <p>-      provides guidance on the formatting on the label of data presented in linear bar code, two-dimensional symbol or human-readable form;</p>
    <p>-      provides specific recommendations regarding the choice of bar code symbologies, and specifies quality requirements;</p>
    <p>-      provides recommendations as to label placement, size and the inclusion of free text and any appropriate graphics;</p>
    <p>-      provides guidance on the selection of the label material.</p>
    <p>This document is not applicable to the direct printing on to kraft coloured corrugated surfaces.</p>
    <p>NOTE       Guidance on the direct printing of bar code symbols on to kraft coloured corrugated surfaces are provided in references such as The Fibre Box Handbook<sup>[</sup><sup>10</sup><sup>]</sup>.</p>
