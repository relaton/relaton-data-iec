abstract:
- language: en
  script: Latn
  content: |-
    IEC 60747-3:2013 gives the requirements for the following devices:<br/>
    - signal diodes (excluding diodes designed to operate at frequencies above several hundred MHz);<br/>
    - switching diodes (excluding high power rectifier diodes);<br/>
    - voltage-regulator diodes; voltage-reference diodes;<br/>
    - current-regulator diodes.<br/>
    This edition includes the following significant technical changes with respect to the previous edition:<br/>
    a) All clauses were re-edited to latest IEC publication format and style with all contents from previous publication.<br/>
    b) All clauses have been amended by suitable additions and deletions.<br/>
    <br/>
    This publication should be read in conjunction with IEC 60747-1:2006.
- language: fr
  script: Latn
  content: |-
    La CEI 60747-3:2013 donne les exigences pour les dispositifs suivants:<br/>
    - diodes de signal (à l'exclusion des diodes conçues pour fonctionner à des fréquences supérieures à plusieurs centaines de MHz);<br/>
    - diodes de commutation (à l'exclusion des diodes de redressement à haute puissance);<br/>
    - diodes régulatrices de tension;<br/>
    - diodes de tension de référence;<br/>
    - diodes régulatrices de courant.<br/>
    Cette édition inclut les modifications techniques majeures suivantes par rapport à l'édition précédente:<br/>
    a) Tous les articles ont été réédités dans le style et au format les plus récents des publications CEI avec tout le contenu issu de la précédente publication.<br/>
    b) Tous les articles ont été amendés par des ajouts et des suppressions appropriés.<br/>
    <br/>
    Cette publication doit être lue conjointement avec la CEI 60747-1:2006.
