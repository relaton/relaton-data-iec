abstract:
- language: en
  script: Latn
  content: |-
    IEC 60598-2-24:2026 EXV contains both the international standard and its extended version (EXV). This extended version of the official IEC Standard is available in English only and provides the user with a comprehensive content of the Standard. IEC 60598-2-24:2026 EXV includes the content of the references made to IEC 60598-1:2024.<br/>
    <br/>
    IEC 60598-2-24:2026 specifies requirements for luminaires for which limited surface temperatures are provided to counteract risks from combustible dusts (conductive or non‑conductive) or ignition of materials that can be deposited on luminaires. The luminaires are for use with electric light sources on supply voltages not exceeding 1 000 V. This document specifically excludes requirements for luminaires for use in explosive gas atmospheres and explosive dust atmospheres. This third edition cancels and replaces the second edition, published in 2013. This edition constitutes a technical revision.<br/>
    This edition includes the following significant technical changes with respect to the previous edition:<br/>
    a) the clause numbers and structure have been aligned with those of IEC 60598‑1;<br/>
    b) improved terms and definitions;<br/>
    c) more detailed classification of luminaires;<br/>
    d) indication of luminaire mounting positions and use locations;<br/>
    e) thermal protection of built-in controlgear and other built-in devices required.
