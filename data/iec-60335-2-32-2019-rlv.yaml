abstract:
- language: en
  script: Latn
  content: |-
    IEC 60335-2-32:2019 RLV contains both the official IEC International Standard and its Redline version. The Redline version is available in English only and provides you with a quick and easy way to compare all the changes between the official IEC Standard and its previous edition.<br/>
    <br/>
    IEC 60335-2-32:2019 deals with the safety of electric massage appliances for household and similar purposes, their rated voltage being not more than 250 V for single phase appliances and 480 V for other appliances. Examples of appliances within the scope of this standard are:<br/>
    - foot massagers;<br/>
    - water filled foot massagers;<br/>
    - hand-held massagers;<br/>
    - massage beds;<br/>
    - massage belts;<br/>
    - massage chairs;<br/>
    - massage pads.<br/>
    Appliances not intended for normal household use but that nevertheless may be a source of danger to the public, such as appliances intended to be used by laymen in shops, in light industry and on farms, are within the scope of this standard. As far as is practicable, this standard deals with the common hazards presented by appliances that are encountered by all persons in and around the home. However, in general, it does not take into account:<br/>
    - persons (including children) whose physical, sensory or mental capabilities or lack of experience and knowledge prevents them from using the appliance safely without supervision or instruction;<br/>
    - children playing with the appliance.<br/>
    Attention is drawn to the fact that:<br/>
    - for appliances intended to be used in vehicles or on board ships or aircraft, additional requirements can be necessary;<br/>
    - in many countries additional requirements are specified by the national health authorities, the national authorities responsible for the protection of labour and similar authorities.<br/>
    This standard does not apply to<br/>
    - appliances intended exclusively for industrial purposes;<br/>
    - appliances intended to be used in locations where special conditions prevail, such as the presence of a corrosive or explosive atmosphere (dust, vapour or gas);<br/>
    - electric foot care appliances that do not contain motors and other electric appliances for the care of skin or hair (IEC 60335-2-23)<br/>
    - electric appliances for beauty care of persons and intended for household, commercial and similar purposes (IEC 60335-2-115).<br/>
    This fifth edition cancels and replaces the fourth edition published in 2002, Amendment 1: 2008 and Amendment 2:2013. This edition constitutes a technical revision.<br/>
    This edition includes the following significant technical changes with respect to the previous edition:<br/>
    - aligns the text with IEC 60335-1, Ed 5, and its Amendments 1 and 2;<br/>
    - note is converted to normative text (11.8);<br/>
    - additional requirements for temperatures of external accessible surfaces (Clause 11);<br/>
    - alternative stability requirements for hand-held appliances (20.2);<br/>
    - new mechanical strength test for hand-held appliances (21.1, 21.101).<br/>
    This part 2 is to be used in conjunction with the latest edition of IEC 60335-1 and its amendments. It was established on the basis of the fifth edition (2010) of that standard.
