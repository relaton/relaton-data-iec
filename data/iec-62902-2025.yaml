abstract:
- language: en
  script: Latn
  content: |-
    IEC 62902:2025 specifies methods for the clear identification of secondary cells, batteries, battery modules and monoblocs according to their chemistry (electrochemical storage technology).<br/>
    The markings described in this document are applicable to<br/>
    - secondary cells,<br/>
    - batteries,<br/>
    - battery modules, and<br/>
    - monoblocs,<br/>
    when they are placed on the market for end use and when their battery volume exceeds 900 cm3.<br/>
    The chemistry marking is useful for the installation, operation and decommissioning phases in the battery's life cycle.<br/>
    This document defines the conditions of use of the markings indicating the chemistry of these secondary batteries.
- language: fr
  script: Latn
  content: |-
    L'IEC 62902:2025 spécifie les méthodes permettant d’identifier clairement les batteries d’accumulateurs, batteries, modules de batteries et monoblocs selon leur caractéristique chimique (technologie de stockage électrochimique).<br/>
    Les marquages décrits dans le présent document s’appliquent aux:<br/>
    - accumulateurs;<br/>
    - batteries;<br/>
    - modules de batteries;<br/>
    - monoblocs,<br/>
    lorsqu’ils sont mis sur le marché en vue d’une utilisation finale et lorsqu'ils ont un volume de batterie supérieur à 900 cm3.<br/>
    Le présent document définit les conditions d’utilisation des marquages indiquant la caractéristique chimique de ces batteries d’accumulateurs.
