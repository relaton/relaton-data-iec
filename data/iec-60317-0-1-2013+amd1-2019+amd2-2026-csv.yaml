abstract:
- language: en
  script: Latn
  content: |-
    IEC 60317-0-1:2013+AMD1:2019+AMD2:2026 CSV specifies general requirements of enamelled round copper winding wires with or without bonding layer. The range of nominal conductor diameters is given in the relevant specification sheet. This fourth edition cancels and replaces the third edition published in 2008. This edition constitutes a technical revision. This edition includes the following significant technical changes with respect to the previous edition:<br/>
    - revision to the definition of nominal conductor dimension;<br/>
    - new subclause containing general notes on winding wire, formerly a part of the scope;<br/>
    - revision to elongation requirements in Table 4;<br/>
    - revisions to Clause 13, Breakdown voltage, to include new requirements for intermediate wire diameters;<br/>
    - revision to continuity of insulation requirements in Table 13;<br/>
    - revision to the introduction of Annex A;<br/>
    - revision to B.2 of Annex B;<br/>
    - revision to Table C.1 of Annex C. Keywords: requirements of enamelled round copper winding wires
