abstract:
- language: en
  script: Latn
  content: |-
    IEC 60335-2-32:2024 deals with the safety of electric massage appliances for household and similar purposes, their rated voltage being not more than 250 V for single phase appliances and 480 V for other appliances including direct current (DC) supplied appliances and battery-operated appliances.<br/>
    Examples of appliances within the scope of this standard are<br/>
    - foot massagers;<br/>
    - water filled foot massagers;<br/>
    - hand-held massagers;<br/>
    - massage beds;<br/>
    - massage belts;<br/>
    - massage chairs;<br/>
    - massage pads.<br/>
    Appliances not intended for normal household use but that nevertheless can be a source of danger to the public, such as appliances intended to be used by laypersons in shops, in light industry and on farms, are within the scope of this standard.<br/>
    As far as is practicable, this standard deals with the common hazards presented by appliances that are encountered by all persons in and around the home.<br/>
    Attention is drawn to the fact that<br/>
    - for appliances intended to be used in vehicles or on board ships or aircraft, additional requirements can be necessary;<br/>
    - in many countries additional requirements are specified by the national health authorities, the national authorities responsible for the protection of labour and similar authorities.<br/>
    This standard does not apply to<br/>
    - appliances intended exclusively for industrial purposes;<br/>
    - appliances intended to be used in locations where special conditions prevail, such as the presence of a corrosive or explosive atmosphere (dust, vapour or gas);<br/>
    - electric foot care appliances that do not contain motors and other electric appliances for the care of skin or hair (IEC 60335-2-23);<br/>
    - electric appliances for beauty care of persons and intended for household, commercial and similar purposes (IEC 60335-2-115).<br/>
    This sixth edition cancels and replaces the fifth edition published in 2019. This edition constitutes a technical revision.<br/>
    This edition includes the following significant technical changes with respect to the previous edition:<br/>
    a) alignment with IEC 60335-1:2020;<br/>
    b) conversion of some notes to normative text (Clause 1);<br/>
    c) application of test probe 19 (8.1.1, 20.2, B.22.3, B.22.4).<br/>
    This part 2 is to be used in conjunction with the latest edition of IEC 60335-1 and its amendments unless that edition precludes it; in that case, the latest edition that does not preclude it is used. It was established on the basis of the sixth edition (2020) of that standard.
- language: fr
  script: Latn
  content: |-
    L'IEC 60335-2-32:2024 traite de la sécurité des appareils électriques de massage pour usages domestiques et analogues dont la tension assignée n'est pas supérieure à 250 V pour les appareils monophasés et à 480 V pour les autres appareils, y compris les appareils alimentés en courant continu et les appareils alimentés par batteries.<br/>
    Exemples d’appareils relevant du domaine d'application de la présente norme<br/>
    - les appareils de massage des pieds;<br/>
    - les appareils de massage des pieds remplis d’eau;<br/>
    - les appareils de massage portatifs;<br/>
    - les lits de massage;<br/>
    - les ceintures de massage;<br/>
    - les chaises de massage;<br/>
    - les coussins de massage.<br/>
    Les appareils non destinés à un usage domestique normal mais qui néanmoins peuvent constituer une source de danger pour le public, tels que les appareils destinés à être utilisés par des usagers non avertis dans des magasins, chez des artisans et dans des fermes, sont compris dans le domaine d'application de la présente norme.<br/>
    Dans la mesure du possible, la présente norme traite des dangers courants que présentent les appareils et auxquels sont exposés tous les individus à l'intérieur et autour de l'habitation. Cependant, elle ne tient en général pas compte<br/>
    - des personnes (y compris des enfants) dont les capacités physiques, sensorielles ou mentales; ou le manque d'expérience et de connaissance les empêchent d'utiliser l'appareil en toute sécurité sans surveillance ou instruction;<br/>
    - de l'utilisation de l'appareil comme jouet par des enfants.<br/>
    L’attention est attirée sur le fait que<br/>
    - pour les appareils destinés à être utilisés dans des véhicules ou à bord de navires ou d'avions, des exigences supplémentaires peuvent être nécessaires;<br/>
    - dans de nombreux pays, des exigences supplémentaires sont spécifiées par les organismes nationaux de la santé publique, par les organismes nationaux responsables de la protection des travailleurs et par des organismes analogues.<br/>
    La présente norme ne s'applique pas<br/>
    - aux appareils destinés exclusivement à des usages industriels;<br/>
    - aux appareils destinés à être utilisés dans des locaux qui présentent des conditions particulières, telles que la présence d’une atmosphère corrosive ou explosive (poussière, vapeur ou gaz);<br/>
    - aux appareils électriques de soins des pieds sans moteur et aux autres appareils électriques destinés aux soins de la peau ou des cheveux (IEC 60335-2-23);<br/>
    - aux appareils électriques destinés aux soins esthétiques, pour usage domestique, commercial ou analogue (IEC 60335-2-115).<br/>
    Cette sixième édition annule et remplace la cinquième édition parue en 2019. Cette édition constitue une révision technique.<br/>
    Cette édition inclut les modifications techniques majeures suivantes par rapport à l'édition précédente:<br/>
    a) texte aligné sur l'IEC 60335-1:2020;<br/>
    b) transformation de certaines notes en texte normatif (Article 1);<br/>
    c) application du calibre d’essai 19 (8.1.1, 20.2, B.22.3, B.22.4).<br/>
    La présente partie 2 doit être utilisée conjointement avec la dernière édition de l'IEC 60335-1 et ses amendements sauf si cette édition l'exclut; dans ce cas, la dernière édition qui n'exclut pas la présente partie 2 est utilisée. Elle a été établie sur la base de la sixième édition (2020) de cette norme.
