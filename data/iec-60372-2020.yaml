abstract:
- language: en
  script: Latn
  content: |-
    IEC 60372:2020 is applicable to locking devices used with ball and socket couplings of string insulator units and used with the corresponding metal fittings standardized in IEC 60120, when they are supplied separately.The object of this document is<br/>
    - to define the shapes and some standard dimensions for locking devices,<br/>
    - to define the test methods for locking devices,<br/>
    - to state the acceptance conditions for supply,<br/>
    - to give other dimensions for guidance of manufacturing only.<br/>
    This fourth edition cancels and replaces the third edition published in 1984. This edition includes the following significant technical changes with respect to the previous edition:<br/>
    a. Two new designated size of couplings, 36 and 40, were introduced;<br/>
    b. the relevant content of the 28B W-clip was deleted;<br/>
    c. Annex A is informative, Annex B is normative, Annex C is informative.
- language: fr
  script: Latn
  content: |-
    l’IEC 60372:2020 est applicable aux dispositifs de verrouillage utilisés avec les assemblages à rotule des éléments de chaînes d'isolateurs et utilisés avec les accessoires métalliques correspondants normalisés dans l’IEC 60120, lorsqu'ils sont livrés séparément. Le présent document a pour objet:<br/>
    - de définir les formes et certaines dimensions normalisées des dispositifs de verrouillage,<br/>
    - de définir les méthodes d'essai des dispositifs de verrouillage,<br/>
    - de fixer les conditions d'acceptation d'une fourniture,<br/>
    - de donner d'autres dimensions, uniquement à titre de recommandation pour la fabrication.<br/>
    Cette quatrième édition annule et remplace la troisième édition parue en 1984. Cette édition inclut les modifications techniques majeures suivantes par rapport à l'édition précédente:<br/>
    a. Deux nouvelles tailles d’assemblages normalisées, 36 et 40, sont présentées;<br/>
    b. le contenu concernant l'agrafe 28B a été supprimé;<br/>
    c. L’Annexe A est informative, l’Annexe B est normative, l’Annexe C est informative.
