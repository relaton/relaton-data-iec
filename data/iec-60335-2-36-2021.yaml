  content: |-
    VERSION CORRIGEE 2026-05<br/>
    <br/>
    L'IEC 60335-2-36:2021 traite de la sécurité des cuisinières, des fours, des tables de cuisson, des foyers de cuisson électriques à usage commercial et des appareils analogues dont la tension assignée est inférieure ou égale à 250 V pour les appareils monophasés raccordés entre un conducteur de phase et le conducteur de neutre et à 480 V pour les autres appareils.<br/>
    Ces appareils ne sont pas destinés à un usage domestique ou analogue. Ils sont destinés à un usage commercial pour le traitement des aliments dans des zones non ouvertes au public, par exemple dans les cuisines de restaurants, les cantines, les hôpitaux et les entreprises commerciales, telles que les boulangeries et les boucheries.<br/>
    La partie électrique des appareils qui utilise d'autres formes d'énergie est également comprise dans le domaine d'application de la présente norme.<br/>
    Dans la mesure du possible, la présente norme traite des dangers courants que présentent ces types d'appareils.<br/>
    L'attention est attirée sur le fait que:<br/>
    – pour les appareils destinés à être utilisés dans des véhicules ou à bord de navires ou d'avions, des exigences supplémentaires peuvent être nécessaires;<br/>
    – dans de nombreux pays, des exigences supplémentaires sont spécifiées par les organismes nationaux de la santé, par les organismes nationaux responsables de la protection des travailleurs, par les organismes nationaux responsables de l'alimentation en eau et par des organismes similaires;<br/>
    – dans de nombreux pays, des exigences supplémentaires sont spécifiées pour les appareils sous pression.<br/>
    La présente norme ne s'applique pas:<br/>
    – aux appareils prévus exclusivement pour des usages industriels;<br/>
    – aux appareils destinés à être utilisés dans des locaux qui présentent des conditions particulières, telles que la présence d'une atmosphère corrosive ou explosive (poussière, vapeur ou gaz);<br/>
    – aux appareils conçus pour la production continue en masse d'aliments;<br/>
    – aux fours à convection forcée, aux cuiseurs à vapeur et aux fours combinés vapeur‑convection (IEC 60335-2-42);<br/>
    – aux appareils destinés à maintenir au chaud les aliments et la vaisselle (IEC 60335-2-49);<br/>
    – aux fours à micro-ondes à usage commercial (IEC 60335-2-90);<br/>
    – aux appareils alimentés par batteries.<br/>
    Cette septième édition annule et remplace la sixième édition parue en 2017. Cette édition constitue une révision technique.<br/>
    Cette édition inclut les modifications techniques majeures suivantes par rapport à l'édition précédente:<br/>
    a) alignement du texte sur l'IEC 60335-1:2020;<br/>
    b) conversion en texte normatif, modification ou suppression de certaines notes (Article 1, 7.1, 7.15, 11.4, 13.3, 21.101, 22.101, 27.2, 30.101);<br/>
    c) alignement du texte de l'IEC 60335-2-36 sur d'autres normes sous l'IEC/TC61/MT32;<br/>
    d) exclusion des appareils alimentés par batteries et des appareils utilisés dans des lieux ouverts au public (Article 1);<br/>
    e) déplacement des instructions pour le nettoyage du 7.12.1 au 7.12;<br/>
    f) clarification de la procédure d'essai en 15.1.1;<br/>
    g) clarification des conditions d'essai en 19.1 et en 23.3;<br/>
    h) introduction du 22.110;<br/>
    i) clarification des exigences du 25.3.<br/>
    La présente Partie 2 doit être utilisée conjointement avec la dernière édition de l'IEC 60335-1 et ses amendements, sauf si cette édition l'exclut. Dans ce cas, la dernière édition qui n'exclut pas la présente Partie 2 est utilisée. Elle a été établie sur la base de la sixième édition (2020) de cette norme.<br/>
    Le contenu du corrigendum 1 (2026-05) a été pris en considération dans cet exemplaire.
