abstract:
- language: en
  script: Latn
  content: |-
    ISO TS 25558:2026 This document provides guidance for enhancing safety and usability aspects of smart home products, services, and systems to enable older persons to live the healthy lives they desire. It presents a process to assess the needs of older persons who use smart products, services, and systems in the smart home, the general living space of the future society, to select, apply, and evaluate appropriate smart home products, services, and systems.<br/>
    This document addresses older persons’ safety and usability needs as their health conditions and lifestyles change. It applies to designers, developers, and providers of smart homes for older persons and products, services, and systems in smart homes.
