abstract:
- language: en
  script: Latn
  content: |-
    IEC TS 63086-2-5:2026 specifies test methods for measuring the performance change of electrically powered household and similar air cleaners caused by the loading with particles.<br/>
    The main intention of the document is to compare differences in the performance change between air cleaners exposed to the same loading with particles. The performance change is not necessarily representative for real-use applications since concentration, size, morphology and chemical composition of particles present in household or similar environments can strongly differ.
