abstract:
- language: en
  script: Latn
  content: |-
    IEC 60413:2026 concerns graphite-based grades that are used for sliding electrical contacts, such as carbon brushes or pantograph strips. By extension, it is possible to apply the test procedures of this document to all electrical sliding contacts for electrical transmission appliances and to other appliances of graphite-based materials (heat exchangers, bearings, etc.). This document specifies uniformized procedures for determining their following properties:<br/>
    - density and porosity;<br/>
    - resistivity;<br/>
    - flexural strength;<br/>
    - hardness;<br/>
    - ash content.<br/>
    In addition, it provides recommendations on test procedures for other properties:<br/>
    - Mechanical properties: Charpy impact test, compressive strength, tensile strength (Annex B).<br/>
    - Thermal properties: coefficient of thermal expansion, specific heat capacity, thermal conductivity (Annex C).<br/>
    The properties determined by these tests are inherent to the graphite-based materials and it is therefore important to distinguish them from performance characteristics in operation on electrical equipment (carbon brush in an electrical rotating machine, contact strips on a pantograph, etc.). Since these materials are generally brittle, porous materials, it is reasonable that their properties vary much more than the same properties in metals. Some test methods are suitable for use in production quality control (routine tests), others only for more thorough investigations, using precise laboratory techniques (see Annex A).<br/>
    WARNING — The use of this document can involve hazardous substances, operations and equipment. It does not purport to address all of the safety or environmental problems associated with its use. It is the responsibility of the user of this document to establish appropriate safety and health practices and determine the applicability of regulatory limitations prior to use.<br/>
    This second edition cancels and replaces the first edition published in 1972. This edition constitutes a technical revision. This edition includes the following significant technical changes with respect to the previous edition:<br/>
    a) Title modified.<br/>
    b) Addition of definitions in Clause 3.<br/>
    c) Clause 5 on test specimen: Nomenclature and addition of the different types of test specimen, specification on their dimensions, tolerances and preparation.<br/>
    d) Improvement of test procedures of the properties already disclosed in the previous edition (Clause 6 to Clause 11).<br/>
    e) Separation of apparent density and apparent porosity (respectively Clause 6 and Clause 10).<br/>
    f) Resistivity (Clause 7): Addition of the eddy current method.<br/>
    g) Rebound hardness (Clause 9): Addition of a new model of scleroscope and addition of Leeb method, as a possible alternative to the traditional scleroscope method.<br/>
    h) Common elements of the test report in a dedicated Clause 12.<br/>
    i) Addition of Annex A (normative): introduction of tests categories (serial/type tests), list of properties to be tested for each test category of test according to their purpose.<br/>
    j) Addition of Annex B: test procedures for other mechanical properties than flexural strength and hardness: tensile, compressive and impact strength.<br/>
    k) Addition of Annex C: test procedures for thermal properties (coefficient of linear expansion, specific heat capacity and thermal conductivity).<br/>
    l) Addition of Annex D: supplement to density and porosity.<br/>
    m) Addition of Annex E: recommendations on methods for elements analysis.<br/>
    n) Addition of Annex F: supplement of information concerning scleroscope hardness.
- language: fr
  script: Latn
  content: |-
    IEC 60413:2026 concerne les nuances à base de graphite utilisées pour les contacts électriques glissants, tels que les balais ou les bandes de pantographes. Par extension, il est possible d'appliquer les modes opératoires d'essai du présent document à tous les contacts électriques glissants des équipements de transmission électrique et à d'autres applications de matériaux à base de graphite (échangeurs de chaleur, roulements, etc.). Le présent document spécifie des procédures uniformisées pour déterminer leurs propriétés suivantes:<br/>
    - densité et porosité;<br/>
    - résistivité;<br/>
    - résistance à la flexion;<br/>
    - dureté;<br/>
    - teneur en cendres.<br/>
    En outre, il fournit des recommandations sur les modes opératoires d'essai pour d'autres propriétés:<br/>
    - propriétés mécaniques: essai de choc Charpy, résistance à la compression, résistance à la traction (Annexe B);<br/>
    - propriétés thermiques: coefficient de dilatation thermique, capacité thermique massique, conductivité thermique (Annexe C).<br/>
    Les propriétés déterminées par ces essais sont inhérentes aux matériaux à base de graphite et par conséquent, il est important de les distinguer par rapport aux caractéristiques de performance en service sur les équipements électriques (balai dans une machine électrique tournante, bandes de contact sur un pantographe, etc.).<br/>
    Étant donné qu'il s'agit de matériaux généralement fragiles et poreux, il est raisonnable que leurs propriétés varient beaucoup plus que les mêmes propriétés dans les métaux.<br/>
    Certaines méthodes d'essai conviennent au contrôle de la qualité de la production (essais individuels de série), d'autres sont réservées à des examens plus approfondis, qui font appel à des techniques de laboratoire précises (voir l'Annexe A).<br/>
    AVERTISSEMENT — L'utilisation du présent document peut impliquer la mise en œuvre de substances, d'opérations et de matériels dangereux. Ce document ne prétend pas couvrir tous les problèmes environnementaux ou de sécurité liés à son utilisation. Il incombe à l'utilisateur du présent document d'établir des pratiques appropriées en matière d'hygiène et de sécurité et de déterminer l'applicabilité des limitations réglementaires avant l'utilisation.<br/>
    Cette deuxième édition annule et remplace la première édition parue en 1972. Cette édition constitue une révision technique.<br/>
    Cette édition inclut les modifications techniques majeures suivantes par rapport à l'édition précédente:<br/>
    a) le titre a été modifié;<br/>
    b) des définitions ont été ajoutées à l'Article 3;<br/>
    c) Article 5 sur les éprouvettes: la nomenclature et différents types d'éprouvettes, la spécification de leurs dimensions, leurs tolérances et leur préparation ont été ajoutés;<br/>
    d) les modes opératoires d'essai des propriétés déjà divulguées dans l'édition précédente (Articles 6 à 11) ont été améliorés;<br/>
    e) la densité apparente et la porosité apparente font l'objet d'articles distincts (Articles 6 et 10 respectivement);<br/>
    f) résistivité (Article 7): la méthode par courants de Foucault a été ajoutée;<br/>
    g) dureté rebond (Article 9): un nouveau modèle de scléroscope et la méthode Leeb ont été ajoutés comme alternative possible à la méthode classique du scléroscope;<br/>
    h) les éléments communs du rapport d'essai ont été consignés dans l'Article 12 correspondant;<br/>
    i) l'Annexe A (normative) a été ajoutée avec l'introduction des catégories d'essais (essais en série/essais de type) et une liste de propriétés à soumettre à l'essai pour chaque catégorie d'essai en fonction de leur objet;<br/>
    j) l'Annexe B a été ajoutée avec des modes opératoires d'essai pour d'autres propriétés mécaniques que la résistance à la flexion et la dureté: résistance à la traction, à la compression et au choc;<br/>
    k) l'Annexe C a été ajoutée avec des modes opératoires d'essai pour les propriétés thermiques (coefficient de dilatation thermique, capacité thermique massique et conductivité thermique);<br/>
    l) l'Annexe D a été ajoutée: elle fournit des informations supplémentaires sur la densité et la porosité;<br/>
    m) l'Annexe E a été ajoutée avec des recommandations sur les méthodes d'analyse des éléments;<br/>
    n) l'Annexe F a été ajoutée: elle fournit des informations supplémentaires sur la dureté scléroscopique.
