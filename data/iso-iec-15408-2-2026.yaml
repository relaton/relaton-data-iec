abstract:
- language: en
  script: Latn
  content: <p class="MsoBodyText">This document specifies requirements for the required
    structure and content of security functional components for use during a security
    evaluation. It includes a catalogue of functional components that meet the common
    security functionality requirements of many IT products.</p>
- language: fr
  script: Latn
  content: <p class="MsoBodyText">Le présent document spécifie les exigences pour
    la structure requise et le contenu des composants fonctionnels de sécurité au
    moyen d'une évaluation de sécurité. Il comporte un catalogue des composants fonctionnels
    qui répondent aux exigences fonctionnelles de sécurité communes à de nombreux
    produits TI.</p>
