abstract:
- language: en
  script: Latn
  content: |-
    IEC 61854:2020 applies to spacers for conductor bundles of overhead lines. It covers rigid spacers, flexible spacers and spacer dampers.<br/>
    It does not apply to interphase spacers, hoop spacers and bonding spacers.<br/>
    This document is written to cover the line design practices and spacers most commonly used at the time of writing. There may be other spacers available for which the specific tests reported in this document may not be applicable.<br/>
    In some cases, test procedures and test values are left to agreement between purchaser and supplier and are stated in the procurement contract. The purchaser is best able to evaluate the intended service conditions, which should be the basis for establishing the test severity.<br/>
    In Annex A, the minimum technical details to be agreed between purchaser and supplier are listed.<br/>
    This second edition cancels and replaces the first edition published in 1998. This edition constitutes a technical revision.<br/>
    This edition includes the following significant technical changes with respect to the previous edition:<br/>
    a) Consider the application of spacers on high temperature conductors specifying additional high temperature tests in clamp slip tests and for the characterization of elastic and damping properties;<br/>
    b) Specify as far as possible test parameters and acceptance values;<br/>
    c) Avoid as far as possible the alternative procedures for the same test;<br/>
    d) Introduce a simpler test device for the simulated short circuit current test;<br/>
    e) Introduce test at low temperature on fastener components such as break away bolts and conical spring washers;<br/>
    f) Prescribe a different procedure for subspan oscillation tests on spacers equipped with clamps having rod attachments;<br/>
    g) Modify the test procedure for the aeolian vibration tests;<br/>
    h) Prescribe a different procedure for aeolian vibration tests on spacers equipped with clamps having rod attachments;<br/>
    i) Re-edit all the figures in order to make them more clear and homogeneous;<br/>
    j) Introduce an additional test device for the simulated short circuit current test.<br/>
    Key words: Overhead Lines, Spacers
- language: fr
  script: Latn
  content: |-
    IEC 61854:2020 s'applique aux entretoises destinées aux faisceaux de conducteurs de lignes aériennes. Il couvre les entretoises rigides, les entretoises souples et les entretoises amortisseuses. Il ne s'applique pas aux espaceurs, aux écarteurs à anneaux et aux entretoises de mise à la terre.<br/>
    Le présent document a été élaboré pour couvrir les pratiques de conception de lignes, ainsi que les entretoises les plus couramment utilisées au moment de sa rédaction. Il peut exister d'autres entretoises pour lesquelles les essais spécifiques décrits dans le présent document peuvent ne pas s'appliquer.<br/>
    Dans certains cas, les procédures d'essai et les valeurs d'essai sont convenues entre l'acheteur et le fournisseur et sont indiquées dans le contrat d'approvisionnement. L'acheteur est le mieux à même d'évaluer les conditions de service prévues, qu'il convient d'utiliser comme base pour la définition de la sévérité des essais.<br/>
    L'Annexe A répertorie les informations techniques minimales à convenir entre l'acheteur et le fournisseur.<br/>
    Cette deuxième édition annule et remplace la première édition parue en 1998. Cette édition constitue une révision technique.<br/>
    Cette édition inclut les modifications techniques majeures suivantes par rapport à l'édition précédente:<br/>
    a) prise en compte de l'application des entretoises sur des conducteurs haute température, avec la spécification d'essais à haute température supplémentaires dans le cadre des essais de glissement des pinces et la caractérisation des propriétés élastiques et d'amortissement;<br/>
    b) spécification la plus large possible des paramètres d'essai et des valeurs de réception associées;<br/>
    c) affranchissement, dans la mesure du possible, par rapport aux procédures alternatives pour le même essai;<br/>
    d) introduction d'un dispositif d'essai plus simple pour l'essai de courant de court-circuit simulé;<br/>
    e) introduction d'un essai à basse température sur les composants de fixation tels que les boulons fusibles et les rondelles élastiques coniques;<br/>
    f) prescription d'une procédure différente pour les essais d'oscillation de sous-portée sur les entretoises équipées de pinces avec garnitures;<br/>
    g) modification de la procédure d'essai pour les essais de vibrations éoliennes;<br/>
    h) prescription d'une procédure différente pour les essais de vibrations éoliennes sur les entretoises équipées de pinces avec garnitures;<br/>
    i) reprise de l'ensemble des figures afin de les rendre plus claires et homogènes;<br/>
    j) introduction d'un dispositif d'essai supplémentaire pour l'essai de courant de court-circuit simulé.<br/>
    Mots-clés: lignes aériennes, entretoises
