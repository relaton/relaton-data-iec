abstract:
- language: en
  script: Latn
  content: |-
    IEC 61308:2026 specifies test methods for the determination of useful high frequency power output in equipment for industrial heating and processing of materials. It is in particular applicable to HF generators made available to users as separate units. This document is basically applicable to equipment operating in the frequency range 100 kHz to 300 MHz, as defined in IEC 60519-1, with the following limitations. This document does not apply to induction heating, which it is possible to carry out in the lower part of the specified frequency band. The ISM centre frequencies for dielectric heating and processing of industrial interest are narrow bands about 6,78 MHz, 13,56 MHz, 27,12 MHz and 40,68 MHz.<br/>
    This document is not applicable to:<br/>
    - appliances for household and similar use;<br/>
    - commercial use;<br/>
    - laboratory use;<br/>
    - medical high frequency equipment.<br/>
    For equipment working in designated ISM bands, it is a legal requirement that the frequency remains within the ISM bands according to CISPR 11, but the resonant frequency of the circuit varies with the change of dielectric parameters of the load. Therefore, the value of the mean output power in the work cycle can be much lower than the value obtained under the test conditions. This value depends upon the response of the tuning system.<br/>
    NOTE 1 The following criteria are suitable for determination of the classification as industrial equipment:<br/>
    – commercial equipment is typically designed and planned for series production of many identical units;<br/>
    – industrial equipment is typically produced in small series or even as single units; the processed goods are consumed or ready for final use at the end of the heating process.<br/>
    NOTE 2 Heating a workload with dielectric parameters which change significantly in time and/or with temperature, the value of the output power obtained with the actual charge can be different from that obtained with the test load specified in this document.<br/>
    This document relates to equipment normally operating under continuous rated conditions.<br/>
    This third edition cancels and replaces the second edition published in 2005. This edition constitutes a technical revision. This edition includes the following significant technical changes with respect to the previous edition:<br/>
    a) adaptation and alignment to the principles in more recent editions of IEC 60519-1 and IEC 60519-6;<br/>
    b) more detailed descriptions of, in particular, the calorimetric load test and output power evaluation for dielectic plastic welders.
- language: fr
  script: Latn
  content: |-
    L'IEC 61308:2026 spécifie des méthodes d'essai pour la détermination de la puissance de sortie utile à haute fréquence dans les équipements de chauffage industriel et de traitement des matériaux. Elle s'applique en particulier aux générateurs HF mis à la disposition des utilisateurs sous forme d'unités séparées. Le présent document est fondamentalement applicable aux matériels fonctionnant dans la gamme de fréquences de 100 kHz à 300 MHz, comme défini dans l'IEC 60519-1, avec les limitations suivantes. Le présent document ne s'applique pas au chauffage par induction, qu'il est possible d'effectuer dans la partie inférieure de la bande de fréquences spécifiée. Les fréquences centrales ISM pour le chauffage diélectrique et le traitement d'intérêt industriel sont des bandes étroites d'environ 6,78 MHz, 13,56 MHz, 27,12 MHz et 40,68 MHz.<br/>
    Le présent document n'est pas applicable:<br/>
    - aux appareils à usage domestique et analogue;<br/>
    - usage commercial;<br/>
    - utilisation en laboratoire;<br/>
    - appareils médicaux à haute fréquence.<br/>
    Pour les matériels fonctionnant dans des bandes ISM désignées, il est une exigence légale que la fréquence reste dans les bandes ISM selon la CISPR 11, mais la fréquence de résonance du circuit varie avec la variation des paramètres diélectriques de la charge. Par conséquent, la valeur de la puissance de sortie moyenne dans le cycle de travail peut être beaucoup plus faible que la valeur obtenue dans les conditions d'essai. Cette valeur dépend de la réponse du système de réglage.<br/>
    NOTE 1 Les critères suivants conviennent pour la détermination de la classification en tant qu'équipement industriel:<br/>
    – les équipements commerciaux sont généralement conçus et planifiés pour la production en série de nombreuses unités identiques;<br/>
    – les équipements industriels sont généralement produits en petites séries ou même en unités individuelles; les produits transformés sont consommés ou prêts à l'emploi final à la fin du processus de chauffage.<br/>
    NOTE 2 En chauffant une charge de travail avec des paramètres diélectriques qui changent de manière significative dans le temps et/ou avec la température, la valeur de la puissance de sortie obtenue avec la charge réelle peut être différente de celle obtenue avec la charge d'essai spécifiée dans le présent document. Le présent document concerne les équipements fonctionnant normalement dans des conditions assignées continues.<br/>
    Cette troisième édition annule et remplace la deuxième édition parue en 2005. Cette édition constitue une révision technique. Cette édition inclut les modifications techniques significatives suivantes par rapport à l'édition précédente:<br/>
    a) l'adaptation et l'alignement sur les principes des éditions plus récentes de l'IEC 60519-1 et de l'IEC 60519-6;<br/>
    b) des descriptions plus détaillées, en particulier, de l'essai de charge calorimétrique et de l'évaluation de la puissance de sortie pour les soudeurs plastiques diélectriques.
