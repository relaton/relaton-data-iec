abstract:
- language: en
  script: Latn
  content: |-
    IEC TS 62749:2020 specifies the expected characteristics of electricity at the SUPPLY TERMINALS of public low, medium and high voltage, 50 Hz or 60 Hz, networks.<br/>
    NOTE 1 The boundaries between the various voltage levels can be different for different countries/regions. In the context of this TS, the following terms for system voltage are used:<br/>
    - low voltage (LV) refers to less than or equal to 1 kV;<br/>
    - medium voltage (MV) refers to between 1 kV and 35 kV;<br/>
    - high voltage (HV) refers to between 35 kV and 230 kV.<br/>
    While power quality is related to EMC in a number of ways this document is not an EMC publication. This second edition cancels and replaces the first edition published in 2015. This edition constitutes a technical revision. This edition includes the following significant technical changes with respect to the previous edition:<br/>
    a) minimum number of remaining data for weekly analysis,<br/>
    b) improvement of the compatibility between EN 50160 and IEC TS 62749,<br/>
    c) further explanation of the conception of daily sliding window,<br/>
    d) further explanation of the aggregation method used for events,<br/>
    e) further explanation of the relation between Power Quality and EMC,<br/>
    f) addition of a new definition of mains communicating system (MCS),<br/>
    g) addition of a new Annex G: Other phenomena,<br/>
    h) transfer of the main content of IEC TR 62510 to IEC TS 62749.
