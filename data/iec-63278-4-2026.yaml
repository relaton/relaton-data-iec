abstract:
- language: en
  script: Latn
  content: |-
    IEC 63278-4:2026 assumes an application perspective of the Asset Administration Shell to develop a common understanding on how to use an Asset Administration Shell.<br/>
    This document defines how the Asset Administration Shell can be used in the context of the related entities and how to represent assets using the Asset Administration Shell.<br/>
    Due to the more detailed description compared to IEC 63278-1, additional requirements, recommendations, and permissions for the AAS are stated towards application of the AAS in selected scenarios.
- language: fr
  script: Latn
  content: |-
    IEC 63278-4:2026 Le présent document part d’une perspective d’application de l’Enveloppe de Gestion d’Actif pour développer une compréhension commune de la manière d’utiliser une Enveloppe de Gestion d’Actif.<br/>
    Il définit comment l’Enveloppe de Gestion d’Actif peut être utilisée dans le contexte des entités connexes et comment représenter les actifs à l’aide de l’Enveloppe de Gestion d’Actif.<br/>
    Dans la mesure où le présent document offre une description plus détaillée que l’IEC 63278-1, des exigences, des recommandations et des autorisations supplémentaires pour l’AAS sont énoncées, ciblant des applications de l’AAS dans des scénarios choisis.
