abstract:
- language: en
  script: Latn
  content: |-
    IEC TS 62461:2026 gives guidelines for the application of the uncertainty analysis accord­ing to ISO/IEC Guide 98‑3:2008 (GUM describing an analytical method for the uncertainty determination) and its Supplement 1:2008 (GUM S1 describing a Monte Carlo method for the uncertainty determination) for measurements of ionizing radiation. It does not include the uncertainty associated with the concept of the measuring quantity, e.g., the difference between Hp(10) on the ISO water slab phantom and on the person.<br/>
    This document explains the principles of ISO/IEC Guide 98‑3:2008, its Supplement 1:2008 and the special considerations necessary for radiation protection at an example taken from individual dosimetry of external radiation.<br/>
    This document is intended to assist the understanding of ISO/IEC Guide 98‑3:2008, ISO/IEC Guide 98‑3-SP1:2008 and other papers on uncertainty analysis. It cannot replace these papers, nor can it provide the background and justification of the arguments leading to the concept of ISO/IEC Guide 98‑3:2008 and ISO/IEC Guide 98‑3-SP1:2008.<br/>
    Finally, this document gives a very simple method to judge whether a measured result is significantly different from zero or not based on ISO 11929.<br/>
    This first edition of IEC TS 62461 cancels and replaces the second edition of IEC TR 62461 published in 2015. This edition includes the following significant technical changes with respect to the previous edition:<br/>
    - several minor corrections;<br/>
    - the addition of an example of the determination of the decision threshold and detection limit in accordance with ISO 11929.
