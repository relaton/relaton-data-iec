abstract:
- language: en
  script: Latn
  content: |-
    IEC 61360-1:2017 specifies principles for the definition of the properties and associated attributes and explains the methods for representing verbally defined concepts with appropriate data constructs available from IEC 61360-2. It also specifies principles for establishing a hierarchy of classification from a collection of classes, each of which represents a technical concept in the electrotechnical domain or a domain related to electrotechnology. This fourth edition cancels and replaces the third edition published in 2009. This edition constitutes a technical revision. This edition includes the following significant technical changes with respect to the previous edition:<br/>
    - support of advanced constructs such as<br/>
    · conditions and constraints,<br/>
    · blocks,<br/>
    · cardinality,<br/>
    · polymorphism,<br/>
    · generic and restricted enumerations, and<br/>
    · mapping;<br/>
    - extended list of data types;<br/>
    - harmonization with IEC 62656-1;<br/>
    - support of IEC TS 62720 and of coded units;<br/>
    - harmonization of semantic and administrative data among the various information objects;<br/>
    - use of UML for data modelling;<br/>
    - enhanced definitions and descriptions;<br/>
    - introduction of examples of higher level constructs such as block, cardinality, or polymorphism as guidance for the user of the IEC 61360 series.<br/>
    IEC 61360-4, IEC reference collection of standard data element types and component classes, can be accessed from IEC CDD (Common Data Dictionary) Free access to Database. The database contains the IEC reference collection of classes and associated characteristic properties (data element types or DETs) of electric/electronic components including materials, geometry and features used in electrotechnical equipment and systems. The dictionary and database follow the methodology of Part 1 of IEC 61360 and the information model of Part 2.<br/>
    IEC 61360-1:2017 has the status of a horizontal standard in accordance with IEC Guide 108.
- language: fr
  script: Latn
  content: |-
    L’IEC 61360-1:2017 spécifie les principes de la définition des propriétés et des attributs associés et explique les méthodes de représentation de concepts définis oralement par des constructions de données appropriées disponibles dans l’IEC 61360-2. Il spécifie également les principes permettant d’établir une hiérarchie de classification à partir d’une collection de classes, dont chacune représente un concept technique d’un domaine électrotechnique ou un domaine relatif à l’électrotechnologie. Cette quatrième édition annule et remplace la troisième édition parue en 2009. Cette édition constitue une révision technique. Cette édition inclut les modifications techniques majeures suivantes par rapport à l’édition précédente:<br/>
    - un support pour les constructions avancées telles que<br/>
    · conditions et contraintes,<br/>
    · blocs,<br/>
    · cardinalité,<br/>
    · polymorphisme,<br/>
    · énumérations générales et restreintes, et<br/>
    · mapping;<br/>
    - une liste de types de données étendue;<br/>
    - une harmonisation avec l’IEC 62656-1;<br/>
    - un support pour l’IEC TS 62720 et les unités codées;<br/>
    - une harmonisation des données sémantiques et administratives entre les divers objets d’information;<br/>
    - l’utilisation du langage UML pour la modélisation des données;<br/>
    - des descriptions et définitions étoffées;<br/>
    - l’introduction d’exemples de constructions de plus haut niveau comme le bloc, la cardinalité ou le polymorphisme, comme préconisations pour assister l’utilisateur de la série IEC 61360.<br/>
    L’IEC 61360-1:2017 a le statut de norme horizontale conformément au Guide IEC 108.
