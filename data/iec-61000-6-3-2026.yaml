abstract:
- language: en
  script: Latn
  content: |-
    IEC 61000-6-3:2026 is applicable only if no relevant dedicated product or product family EMC emission standard has been published. This part of IEC 61000 for emission requirements applies to electrical and electronic equipment intended for use at residential (see 3.1.21) locations. This part of IEC 61000 also applies to electrical and electronic equipment intended for use at other locations that do not fall within the scope of IEC 61000-6-8 or IEC 61000-6-4. The intention is that all equipment used in the residential, commercial and light-industrial locations are covered by IEC 61000-6-3 or IEC 61000-6-8. If there is any doubt the requirements in IEC 61000-6-3 apply. Equipment that has a radio function (3.1.20) are included in the scope of this document. However, the emission requirements in this document are not intended to be applicable to the intentional transmissions from these radio transmitters, their harmonics and their out of band emissions. Not all disturbance phenomena have been included for testing purposes but only those considered relevant for the equipment intended to operate within the locations included within this document.<br/>
    The objectives of this document are:<br/>
    - to establish requirements that provide an adequate level of protection of radio reception in the frequency range 9 kHz to 400 GHz;<br/>
    - to establish requirements that provide an adequate level of protection against conducted and radiated electromagnetic disturbances emitted by equipment in the scope of this document;<br/>
    - to support the reproducibility of measurement and the repeatability of results.<br/>
    NOTE 1 In special cases, situations will arise where the levels specified in this document will not offer adequate protection; for example, where a sensitive receiver is used in close proximity to an equipment. In these instances, special mitigation measures can be employed.<br/>
    NOTE 2 Disturbances generated in fault conditions of equipment are not covered by this document.<br/>
    NOTE 3 The requirements in this document are more stringent or equivalent to the requirements specified in IEC 61000-6-4 and IEC 61000-6-8.<br/>
    This fourth edition cancels and replaces the third edition published in 2020. This edition constitutes a technical revision. This edition includes the following significant technical changes with respect to the previous edition:<br/>
    a) the addition of magnetic field emission requirements, including the measurement of WPT function;<br/>
    b) the extension of low-voltage AC mains power requirements to cover the range 9 kHz to 150 kHz;<br/>
    c) products with a radio function have been added to the scope;<br/>
    d) limits in a FAR for rack mounted equipment have been added.
- language: fr
  script: Latn
  content: |-
    L'IEC 61000-6-3:2026 s'applique uniquement si aucune norme CEM d'émission pertinente dédiée à un produit ou une famille de produits n'a été publiée. La présente partie de l'IEC 61000 concernant les exigences d'émissions s'applique aux appareils électriques et électroniques destinés à être utilisés dans des environnements résidentiels (voir le 3.1.21). La présente partie de l'IEC 61000 s'applique également aux appareils électriques et électroniques destinés à être utilisés dans des environnements n'entrant pas dans le domaine d'application de l'IEC 61000-6-8 ou de l'IEC 61000-6-4. L'objectif est que tous les appareils utilisés dans les environnements résidentiels, commerciaux et de l'industrie légère soient couverts par l'IEC 61000-6-3 ou l'IEC 61000-6-8. Les exigences dans l'IEC 61000-6-3 s'appliquent en présence du moindre doute. Les appareils qui possèdent une fonction radio (3.1.20) sont inclus dans le domaine d'application du présent document. Toutefois, les exigences d'émissions spécifiées dans le présent document ne sont pas destinées à s'appliquer aux transmissions intentionnelles issues de ces émetteurs radioélectriques, à leurs harmoniques et à leurs émissions hors bande. Tous les phénomènes de perturbation n'ont pas été inclus pour les besoins de l'essai. Seuls l'ont été ceux considérés comme pertinents pour les appareils destinés à fonctionner dans l'environnement couvert par le présent document.<br/>
    Les objectifs du présent document sont les suivants:<br/>
    - établir des exigences qui procurent un niveau adéquat de protection de la réception radioélectrique dans la plage de fréquences de 9 kHz à 400 GHz;<br/>
    - établir des exigences qui procurent un niveau adéquat de protection contre les perturbations électromagnétiques conduites et rayonnées émises par les appareils qui relèvent du domaine d'application du présent document;<br/>
    - assurer la reproductibilité du mesurage et la répétabilité des résultats.<br/>
    NOTE 1 Dans certains cas particuliers, des situations sont susceptibles de se produire, pour lesquelles les niveaux spécifiés dans le présent document n'offrent pas le niveau de protection adéquat; par exemple lorsqu'un récepteur sensible est utilisé très proche d'un appareil. Dans de tels cas, des mesures particulières d'atténuation peuvent être employées.<br/>
    NOTE 2 Les perturbations générées dans les conditions de défaut de l'appareil ne sont pas couvertes par le présent document.<br/>
    NOTE 3 Les exigences du présent document sont plus strictes ou équivalentes aux exigences spécifiées dans l'IEC 61000-6-4 et l'IEC 61000-6-8.<br/>
    Cette quatrième édition annule et remplace la troisième édition parue en 2020. Cette édition constitue une révision technique. Cette édition inclut les modifications techniques majeures suivantes par rapport à l'édition précédente:<br/>
    a) ajout d'exigences relatives aux émissions de champ magnétique, y compris la mesure de la fonction WPT;<br/>
    b) extension des exigences relatives à l'alimentation secteur en courant alternatif basse tension pour couvrir la plage de 9 kHz à 150 kHz;<br/>
    c) ajout des produits avec une fonction radio au domaine d'application;<br/>
    d) ajout de limites dans une FAR pour les appareils montés sur bâti.
