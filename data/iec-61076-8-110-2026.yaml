abstract:
- language: en
  script: Latn
  content: |-
    IEC 61076-8-110:2026 This part describes free and fixed rectangular connectors, hereinafter referred to as “connector”, with:<br/>
    2P power plus 2P signal contacts;<br/>
    - plastic housing with locking lever and four possible codings;<br/>
    - 300 A rated current, 1 000 V DC rated voltage on the power section;<br/>
    - 5 A rated current, 50 V DC rated voltage on the signal section;<br/>
    - individual shielding around each power contact with relevant shielding termination;<br/>
    - IP65/IP68 degree of protection when mated and locked and IPXXB on both plug and receptacle parts when unmated
