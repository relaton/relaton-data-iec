abstract:
- language: en
  script: Latn
  content: |-
    <p>This document:</p>

    <!-- [if !supportLists]-->specifies the minimum requirements for the design of labels containing a linear bar code and two dimensional (2D) symbols on product packages to convey data between trading partners;
    <!-- [if !supportLists]-->provides guidance for the formatting on the label of data presented in a linear bar code, 2D symbols or human-readable form;
    <!-- [if !supportLists]-->provides specific recommendations regarding the choice of linear bar code and 2D symbologies, and specifies quality requirements and classes of bar code density;
    <!--[endif]-->provides specific recommendations regarding both linear and 2D symbologies, which allow a broad choice for general use of scanning hardware (e.g. area imagers, linear imagers, single line laser scanners, and raster laser scanners);
    makes recommendations as to label placement, size and the inclusion of free text and any appropriate graphics.

    <p>This document supports item identification and supply chain processes, at the product package level, such as inventory control, picking, and point of use.</p>
    <p>NOTE 1        ISO 15394[2] supports the distribution and transportation business processes, so aiding the tracing and tracking of unique shipments.</p>
    <p>NOTE 2        ISO 28219 addresses the direct part marking.</p>
    <p>The purpose of this document is to establish the machine readable (e.g. bar code) and human-readable data content of labels applied to product packages.</p>
    <p>Intended applications include, but are not limited to, inventory, warehouse management, maintenance and point of purchase.</p>
    <p>While guidance is provided, specific label dimensions or marking areas and the location of the information are not defined in this document. Before implementing this specification, suppliers and manufacturers are advised to review and mutually agree on these details with their trading partners.</p>
    <p>This document does not supersede or replace any applicable safety or regulatory marking or labelling requirements. It is intended to satisfy the product package requirements of numerous applications and industry groups. As such, it is applicable to a wide range of industries, each of which has specific implementation guidelines. This document is also applicable to any other labelling requirements.</p>
