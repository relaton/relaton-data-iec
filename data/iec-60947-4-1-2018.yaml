abstract:
- language: en
  script: Latn
  content: |-
    IEC 60947-4-1:2018 is applicable to the following equipment:<br/>
    - electromechanical contactors and starters including motor protective switching device (MPSD);<br/>
    - actuators of contactor relays;<br/>
    - contacts dedicated exclusively to the coil circuit of this contactor or this contactor relay;<br/>
    - dedicated accessories (e.g. dedicated wiring, dedicated latch accessory);<br/>
    intended to be connected to distribution circuits, motors circuits and other load circuits, the rated voltage of which does not exceed 1 000 V AC or 1 500 V DC. This fourth edition cancels and replaces the third edition published in 2009 and its Amendment 1:2012. This edition constitutes a technical revision. This edition includes the following significant technical changes with respect to the previous edition:<br/>
    - Scope structure and exclusions<br/>
    - Editorial correction of notes and hanging paragraphs<br/>
    - Reference to IEC 62683-1<br/>
    - Motor protective switching device (MPSD) with its requirements<br/>
    - Safety aspects related to:<br/>
    - General aspects;<br/>
    - Limited energy circuits;<br/>
    - Electronic circuits;<br/>
    - Assessment procedure for electromechanical overload protection used in safety -applications (new Annex L)<br/>
    - Introduction of provisions covering the impact of higher locked rotor current to achieve high efficiency class<br/>
    - Mention of dedicated wiring accessories<br/>
    - Pickup power measurement<br/>
    - Alignment to IEC 60947-1:2007, IEC 60947-1:2007/AMD1:2010, and IEC 60947‑1:2007/AMD2:2014<br/>
    - Direct current requirements for covering photovoltaic application (new Annex M)<br/>
    - Load monitoring indicators (new Annex O)<br/>
    - Short-circuit breaking tests of MPSD (new Annex P)<br/>
    - Co-ordination under short-circuit conditions between a MPSD and another short-circuit protective device associated in the same circuit (new Annex Q).<br/>
    The contents of the interpretation sheet of March 2020, the corrigendum 1 of April 2020 and the corrigendum 2 of April 2021 have been included in this copy.
- language: fr
  script: Latn
  content: |-
    L'IEC 60947-4-1:2018 s'applique aux équipements suivants:<br/>
    - contacteurs électromécaniques et démarreurs, y compris les appareils de connexion de protection des moteurs (ACPM);<br/>
    - organes de commande de contacteurs auxiliaires;<br/>
    - contacts destinés exclusivement au circuit de la bobine de ce contacteur ou ce contacteur auxiliaire;<br/>
    - accessoires dédiés (câblage dédié, accessoires d'accrochage dédié, par exemple);<br/>
    destinés à être connectés à des circuits de distribution, des circuits de moteur et à d'autres circuits de charge, dont la tension assignée ne dépasse pas 1 000 V en courant alternatif ou 1 500 V en courant continu. Cette quatrième édition annule et remplace la troisième édition parue en 2009, ainsi que son Amendement 1:2012. Cette édition constitue une révision technique.<br/>
    Cette édition inclut les modifications techniques majeures suivantes par rapport à l'édition précédente:<br/>
    - Structure du domaine d'application et exclusions<br/>
    - Corrections rédactionnelles des notes et des alinéas suspendus<br/>
    - Référence à l'IEC 62683-1<br/>
    - Appareil de connexion de protection des moteurs (ACPM) accompagné de ses exigences<br/>
    - Aspects relatifs à la sécurité:<br/>
    - Aspects généraux;<br/>
    - Circuits limités en énergie;<br/>
    - Circuits électroniques;<br/>
    - Procédure d'évaluation de la protection électromécanique contre les surcharges utilisée dans des applications de sécurité (nouvelle Annexe L)<br/>
    - Introduction des dispositions relatives à l'impact du courant rotor bloqué plus élevé afin d'atteindre une classe de rendement supérieure<br/>
    - Mention des accessoires de câblage dédiés<br/>
    - Mesurage de la puissance d'appel<br/>
    - Alignement avec l'IEC 60947-1:2007, l'IEC 60947-1:2007/AMD1:2010, et l'IEC 60947‑1:2007/AMD2:2014<br/>
    - Exigences en matière de courant continu pour couvrir les applications photovoltaïques (nouvelle Annexe M)<br/>
    - Indicateurs de surveillance de charge (nouvelle Annexe O)<br/>
    - Essais de coupure en court-circuit de l’ACPM (nouvelle Annexe P)<br/>
    - Coordination dans les conditions de court-circuit entre un ACPM et un autre dispositif de protection contre les courts-circuits associés dans le même circuit (nouvelle Annexe Q).<br/>
    Le contenu de la feuille d’interprétation de mars 2020, du corrigendum 1 d'avril 2020 et du corrigendum 2 d'avril 2021 a été pris en considération dans cet exemplaire.
