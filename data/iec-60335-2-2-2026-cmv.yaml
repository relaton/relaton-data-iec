abstract:
- language: en
  script: Latn
  content: |-
    IEC 60335-2-2:2026 CMV contains both the official standard and its commented version. The commented version provides you with a quick and easy way to compare all the changes between IEC 60335-2-2:2026 edition 8.0 and the previous IEC 60335-2-2:2019 edition 7.0. Furthermore, comments from IEC TC 61 experts are provided to explain the reasons of the most relevant changes, or to clarify any part of the content.<br/>
    <br/>
    IEC 60335-2-2:2026 deals with the safety of electric vacuum cleaners and water suction cleaning appliances for household and similar purposes, their rated voltage being not more than 250 V for single phase (AC) supplied appliances, direct current (DC) supplied appliances and battery-operated appliances and 480 V for multi-phase centrally-sited vacuum cleaners. This standard also applies to vacuum cleaners for animal grooming, centrally-sited vacuum cleaners, and automatic battery-operated cleaners.<br/>
    This standard also applies to spray extraction appliances in which<br/>
    – the pressure of the employed liquid solution does not exceed 2,5 MPa;<br/>
    – the product of the pressure (in MPa) and the flow of liquid solution (in litres per minute) do not exceed 100; and<br/>
    – the temperature of the liquid solution at the spray nozzle outlet does not exceed 60 °C.<br/>
    This standard also applies to vacuum cleaners and water suction cleaning appliances provided with a blowing function or inflating function.<br/>
    This standard also applies to motorized cleaning heads and current-carrying hoses associated with a particular vacuum cleaner or water suction cleaning appliance.<br/>
    Appliances not intended for normal household use, but which nevertheless can be a source of danger to the public, such as appliances intended to be used by laypersons in shops and other premises for normal housekeeping purposes, are within the scope of this standard.<br/>
    Examples of appliances for household use are appliances for typical housekeeping functions used in the household environment that can also be used by non-expert users for typical intermittent housekeeping functions:<br/>
    – in shops, schools and other similar working environments;<br/>
    – in farm houses;<br/>
    – by clients in hotels, motels and other residential type environments;<br/>
    – in bed and breakfast type environments.<br/>
    Household environments include the dwelling and its associated buildings, the garden, etc.<br/>
    As far as is practicable, this standard deals with the common hazards presented by appliances that are encountered by all persons in and around the home. However, in general, it does not take into account<br/>
    – persons (including children) whose physical, sensory or mental capabilities; or lack of experience and knowledge prevents them from using the appliance safely without supervision or instruction;<br/>
    – children playing with the appliance.<br/>
    Attention is drawn to the fact that<br/>
    – for appliances intended to be used in vehicles or on board ships or aircraft, additional requirements can be necessary;<br/>
    – in many countries, additional requirements are specified by the national health authorities, the national authorities responsible for the protection of labour, the national water supply authorities and similar authorities.<br/>
    This standard does not apply to<br/>
    – appliances intended exclusively for industrial purposes;<br/>
    – appliances intended to be used in locations where special conditions prevail, such as the presence of a corrosive or explosive atmosphere (dust, vapour or gas);<br/>
    – wet and dry vacuum cleaners, including power brush, for commercial use (IEC 60335-2-69);<br/>
    – floor treatment and wet scrubbing machines, including rug shampooers, for household and similar use (IEC 60335-2-10);<br/>
    – hand-held mains-operated garden blowers, vacuums and blower vacuums (IEC 60335 2 100, IEC 62841-4-6);<br/>
    – spray extraction machines for commercial use (IEC 60335-2-68);<br/>
    – high-pressure cleaners and steam cleaners (with a rated pressure not less than 2,5 MPa) (IEC 60335-2-79);<br/>
    – appliances having vacuum-pressure functions for skin care (IEC 60335-2-115).<br/>
    This eighth edition cancels and replaces the seventh edition published in 2019. This edition constitutes a technical revision.<br/>
    This edition includes the following significant technical changes with respect to the previous edition:<br/>
    – alignment with IEC 60335-1:2020;<br/>
    – conversion of some notes to normative text (Clause 1);<br/>
    – addition of multi-phase central vacuum cleaners to the scope (Clause 1);<br/>
    – addition of appliances with a blowing or inflating function to the scope (Clause 1, 3.1.9, 3.8.102, 3.8.103, 7.12);<br/>
    – clarification of uses similar to household use (Clause 1, 7.12);<br/>
    – addition of test probe 19 for accessibility of live parts (8.1.1, B.22.3, B.22.4);<br/>
    – relocation of the replacement in 19.9 to 19.106;<br/>
    – clarification that the stability test is not applicable to appliances held in the hand during normal use while also being supported by the floor unless they have a stand or rest (20.1);<br/>
    – allowance for a detachable power supply part in a flexible cord (6.2, 21.107, 21.108, 24.2);<br/>
    – clarification of remote operation requirements (22.40, 22.49, 22.51, Annex B 22.40);<br/>
    – addition of requirements for the supply cord of automatic battery-operated cleaners (25.7);<br/>
    – addition of a running overload test for brush and traction motors of automatic battery-operated cleaners (B.19.101);<br/>
    – clarification of requirements for docking stations (30.2);<br/>
    – addition of requirements for spray extraction appliances (Clause 1, 3.1.9.104, 3.5.105, 5.102, 7.12);<br/>
    – clarification of requirements for appliances with appliance outlets or socket-outlets (19.1, 19.107, 22.61, 25.8);<br/>
    – addition of requirements for appliances with reservoirs that can be overfilled (15.2).<br/>
    This part 2 is to be used in conjunction with the latest edition of IEC 60335-1 and its amendments unless that edition precludes it; in that case, the latest edition that does not preclude it is used. It was established on the basis of the sixth edition (2020) of that standard.
