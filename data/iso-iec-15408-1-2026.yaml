abstract:
- language: en
  script: Latn
  content: |-
    <p class="MsoBodyText">This document establishes the general concepts and principles of information technology (IT) security evaluation. It specifies the general model of evaluation given in this document, which in its entirety is intended to be used as the basis for evaluation of security properties of IT products.</p>
    <p class="MsoBodyText">This document provides an overview of all parts of the ISO/IEC 15408 series. It describes the various parts of the ISO/IEC 15408 series i.e.</p>

    defines the terms and abbreviations used in all parts of the series; establishes the core concept of a Target of Evaluation (TOE);
    describes the evaluation context; and
    describes the audience to which the evaluation criteria is addressed.

    <p class="MsoBodyText">Additionally, this document introduces the basic security concepts necessary for the evaluation of IT products.</p>
- language: fr
  script: Latn
  content: |-
    <p class="MsoBodyText">Le présent document établit les concepts et principes généraux de l'évaluation de la sécurité des technologies de l'information (TI). Il spécifie le modèle général d'évaluation donné dans le présent document, qui, dans son intégralité, est destiné à servir de base à l'évaluation des propriétés de sécurité des produits TI.</p>
    <p class="MsoBodyText">Le présent document fournit une vue d'ensemble de toutes les parties de la série ISO/IEC 15408. Il décrit les différentes parties de la série ISO/IEC 15408 c'est-à-dire qu'il:</p>

    définit les termes et abréviations utilisés dans toutes les parties de la série; établit le concept de base d'une cible d'évaluation (TOE, de l'anglais <em style="mso-bidi-font-style: normal;">Target of Évaluation</em>);
    décrit le contexte d'évaluation; et
    décrit le public auquel les critères d'évaluation sont adressés.

    <p class="MsoBodyText">De plus, le présent document introduit les concepts de sécurité de base nécessaires à l'évaluation des produits TI.</p>
