abstract:
- language: en
  script: Latn
  content: |-
    ISO 80601-2-79:2018 This document applies to the basic safety and essential performance of ventilatory support equipment, as defined in 201.3.205, for ventilatory impairment, as defined in 201.3.202, hereafter also referred to as me equipment, in combination with its accessories:<br/>
    — intended for use in the home healthcare environment;<br/>
    — intended for use by a lay operator; and<br/>
    — intended for use with patients who have ventilatory impairment, the most fragile of these patients, would not likely experience injury with the loss of this artificial ventilation; and<br/>
    — not intended for patients who are dependent on artificial ventilation for their immediate life support.<br/>
    EXAMPLE 1 Patients with mild to moderate chronic obstructive pulmonary disease (COPD).<br/>
    NOTE 1 In the home healthcare environment, the supply mains is often not reliable.<br/>
    NOTE 2 Such ventilatory support equipment can also be used in non-critical care applications of professional health care facilities.<br/>
    This document is also applicable to those accessories intended by their manufacturer to be connected to the breathing system of ventilatory support equipment for ventilatory impairment, where the characteristics of those accessories can affect the basic safety or essential performance of the ventilatory support equipment for ventilatory impairment.<br/>
    EXAMPLE 2 Breathing sets, connectors, water traps, expiratory valve, humidifier, breathing system filter, external electrical power source, distributed alarm system.<br/>
    If a clause or subclause is specifically intended to be applicable to me equipment only, or to me systems only, the title and content of that clause or subclause will say so. If that is not the case, the clause or subclause applies both to me equipment and to me systems, as relevant.<br/>
    Hazards inherent in the intended physiological function of me equipment or me systems within the scope of this document are not covered by specific requirements in this document except in IEC 60601‑1:2005+AMD1:2012, 7.2.13 and 8.4.1.<br/>
    NOTE 3 Additional information can be found in IEC 60601‑1:2005+AMD1:2012, 4.2.<br/>
    This document does not specify the requirements for:<br/>
    — ventilators or accessories for ventilator-dependent patients intended for critical care applications, which are given in ISO 80601‑2‑12;<br/>
    — ventilators or accessories intended for anaesthetic applications, which are given in ISO 80601‑2‑13[4];<br/>
    — ventilators or accessories intended for the emergency medical services environment, which are given in ISO 80601‑2‑84 [5] [1], the future replacement for ISO 10651‑3[6];<br/>
    — ventilators or accessories intended for ventilator-dependent patients in the home healthcare environment, which are given in ISO 80601‑2‑72;<br/>
    — ventilatory support equipment or accessories intended for ventilatory insufficiency, which are given in ISO 80601‑2‑80[1];<br/>
    — sleep apnoea therapy me equipment, which are given in ISO 80601‑2‑70[7];<br/>
    — continuous positive airway pressure (CPAP) me equipment;<br/>
    — high-frequency jet ventilators (HFJVs);<br/>
    — high-frequency oscillatory ventilators (HFOVs)[8];<br/>
    — oxygen therapy constant flow me equipment;<br/>
    — cuirass or "iron-lung" ventilation equipment.<br/>
    This document is a document in the IEC 60601 and IEC/ISO 80601 series of documents.<br/>
    [1] Under preparation. Stage at the time of publication: ISO/DIS 80601-2-84:2017.
- language: fr
  script: Latn
  content: |-
    ISO 80601-2-79:2018 Le présent document s'applique à la sécurité de base et aux performances essentielles des équipements d'assistance ventilatoire, tels que définis en 201.3.205, pour le trouble ventilatoire, tels que définis en 201.3.202, ci-après également désignés par appareils em, en association avec leurs accessoires:<br/>
    — destinés à être utilisés dans l'environnement des soins à domicile;<br/>
    — destinés à être utilisés par un opérateur non spécialiste; et<br/>
    — destinés à être utilisés avec des patients souffrant d'un trouble ventilatoire, les plus fragiles de ces patients ayant peu de risque d'être blessés en cas de perte de cette ventilation artificielle; et<br/>
    — non destinés à être utilisés chez les patients dont le maintien immédiat des fonctions vitales dépend d'une ventilation artificielle.<br/>
    EXEMPLE 1 Patients souffrant d'une bronchopneumopathie chronique obstructive (BPCO) légère à modérée.<br/>
    NOTE 1 Dans l'environnement des soins à domicile, il est fréquent que le réseau d'alimentation ne soit pas fiable.<br/>
    NOTE 2 Ces équipements d'assistance ventilatoire peuvent également être utilisés dans les établissements de santé professionnels, pour d'autres applications qu'en soins intensifs.<br/>
    Le présent document s'applique également aux accessoires conçus par leur fabricant pour être raccordés au système respiratoire des équipements d'assistance ventilatoire en cas de trouble ventilatoire, lorsque les caractéristiques de ces accessoires peuvent affecter la sécurité de base ou les performances essentielles des équipements d'assistance ventilatoire en cas de trouble ventilatoire.<br/>
    EXEMPLE 2 Ensembles respiratoires, raccords, pièges à eau, valve expiratoire, humidificateur, filtre pour système respiratoire, source d'énergie électrique externe et système d'alarme réparti.<br/>
    Si un article ou un paragraphe est spécifiquement destiné à être applicable uniquement aux appareils em ou uniquement aux systèmes em, le titre et le contenu de cet article ou de ce paragraphe l'indiquent. Dans le cas contraire, l'article ou le paragraphe s'applique à la fois aux appareils em et aux systèmes em, selon le cas.<br/>
    Les dangers inhérents à la fonction physiologique prévue des appareils em ou des systèmes em dans le cadre du domaine d'application du présent document ne sont pas couverts par des exigences spécifiques contenues dans le présent document, à l'exception de l'IEC 60601‑1:2005+AMD1:2012, 7.2.13 et 8.4.1.<br/>
    NOTE 3 Des informations supplémentaires peuvent être trouvées dans l'IEC 60601‑1:2005+AMD1:2012, 4.2.<br/>
    Le présent document ne spécifie pas les exigences relatives aux:<br/>
    — ventilateurs ou accessoires pour patients ventilo-dépendants prévus pour les applications en soins intensifs, qui sont données dans l'ISO 80601‑2‑12;<br/>
    — ventilateurs ou accessoires prévus pour les applications en anesthésie, qui sont données dans l'ISO 80601‑2‑13[4];<br/>
    — ventilateurs ou accessoires destinés à l'environnement des services médicaux d'urgence, qui sont données dans l'ISO 80601‑2‑84[5] [1]), qui remplacera l'ISO 10651‑3[6];<br/>
    — ventilateurs ou accessoires pour patients ventilo-dépendants dans l'environnement des soins à domicile, qui sont données dans l'ISO 80601‑2‑72;<br/>
    — équipements d'assistance ventilatoire ou accessoires prévus en cas d'insuffisance ventilatoire, qui sont données dans l'ISO 80601‑2‑80[1];<br/>
    — appareils em de traitement de l'apnée du sommeil, qui sont données dans l'ISO 80601‑2‑70[7];<br/>
    — appareils em délivrant une pression positive continue des voies aériennes (PPC);<br/>
    — jet-ventilateurs à haute fréquence (JVHF);<br/>
    — ventilateurs à oscillation haute fréquence (VOHF)[8] ;<br/>
    — appareils em délivrant un débit constant d'oxygénothérapie;<br/>
    — équipements de ventilation de type cuirasse ou «poumon d'acier».<br/>
    Le présent document fait partie des séries de documents de l'IEC 60601 et IEC/ISO 80601.<br/>
    [1]) En cours d?élaboration. État au moment de la parution: ISO/DIS 80601-2-84:2017.
