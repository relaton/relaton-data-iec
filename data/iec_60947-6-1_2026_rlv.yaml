abstract:
- content: "IEC 60947-6-1:2026 RLV contains both the official IEC International Standard
    and its Redline version. The Redline version is available in English only and
    provides you with a quick and easy way to compare all the changes between the
    official IEC Standard and its previous edition.<p>IEC 60947-6-1:2026 applies to
    transfer switching equipment (TSE), to be used in power systems for ensuring the
    continuity of the supply and allowing the energy management of the installation,
    by transferring a load between power supply sources, the rated voltage of which
    does not exceed 1 000 V AC or 1 500 V DC. Specific requirements for bypass/isolation
    transfer switch equipment are given in Annex C, ATSE having closed transition
    capability are given in Annex D, stand-alone ATS controllers are given in Annex
    E, and TSE for electric driven fire pump controllers are given in Annex F.<br
    />\r\nIt covers:<br />\r\n- manually operated transfer switching equipment (MTSE);<br
    />\r\n- remotely operated transfer switching equipment (RTSE);<br />\r\n- automatic
    transfer switching equipment (ATSE), including the controller;<br />\r\n- stand-alone
    ATS controllers;<br />\r\n- bypass/isolation transfer switch equipment (BTSE);<br
    />\r\n- ATSE having closed transition capability;<br />\r\n- fire pump TSE.<br
    />\r\nIt does not cover:<br />\r\n- TSE configurations that are not fully manufacturer
    type tested or marked according to this document as a complete transfer switch;<br
    />\r\n- auxiliary contacts (for guidance, see IEC 60947-5-1);<br />\r\n- transfer
    switches used in explosive atmospheres (for guidance, see IEC 60079 (all parts));<br
    />\r\n- embedded software design (for guidance, see IEC TR 63201);<br />\r\n-
    cybersecurity aspects (for guidance, see IEC 63208);<br />\r\n- TSE rated for
    direct-on-line starting asynchronous motor of design NE and HE, according to IEC
    60034-12. (for guidance, see AC-3e utilisation category according to IEC 60947
    4 1);<br />\r\n- other types of TSE under consideration including overlapping
    neutral TSE, multi-source TSE (i.e. TSE with more than two sources of supply),
    TSE with load-shedding functions, bus-tie TSE, and hybrid TSE;<br />\r\n- static
    transfer switches covered by IEC 62310 series.<br />\r\nThis fourth edition cancels
    and replaces the third edition published in 2021. This edition constitutes a technical
    revision.<br />\r\nThis edition includes the following significant technical changes
    with respect to the previous edition:<br />\r\n- clarification of scope;<br />\r\n-
    clarification of terms and definitions;<br />\r\n- Annex C for Bypass/Isolation
    Transfer Switch Equipment;<br />\r\n- Annex D for ATSE having closed transition
    capability;<br />\r\n- Annex E for Stand-alone ATS controller;<br />\r\n- Annex
    F for TSE used with electric driven fire pump control equipment.</p>"
