abstract:
- language: en
  script: Latn
  content: "<p>Specifies the content of the messages, commands and responses, transmitted
    by the interface device to the card and conversely, the structure and content
    of the historical bytes, structure of files and data, access methods to files
    and data in the card, a security architecture defining access rights to files
    and data in the card.</p>"
- language: fr
  script: Latn
  content: "La présente partie de l'ISO/CEI 7816 spécifie \nle contenu des messages,
    commandes et réponses, transmis par le dispositif d'interface à la carte et vice
    versa, \nla structure et le contenu des octets historiques émis par la carte lors
    de la réponse à la remise à zéro, \nla structure de fichiers et de données, telle
    qu'elle est visible à l'interface lors du traitement de commandes intersectorielles
    pour les échanges, \ndes méthodes d'accès à des fichiers et à des données dans
    la carte, \nune architecture de sécurité définissant des droits d'accès à des
    fichiers et à des données dans la carte, \ndes méthodes de messagerie de sécurité,
    \ndes méthodes d'accès aux algorithmes traités par la carte.\n\nCes algorithmes
    ne sont pas décrits. Elle ne décrit pas la mise\nen oeuvre dans la carte et/ou
    dans le monde extérieur. Elle permet encore\nla normalisation d'autres commandes
    intersectorielles et d'autres architectures\nde sécurité."
