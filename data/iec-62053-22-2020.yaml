abstract:
- language: en
  script: Latn
  content: |-
    IEC 62053-22:2020 applies only to transformer operated static watt-hour meters of accuracy classes 0,1 S, 0,2 S and 0,5 S for the measurement of alternating current electrical active energy in 50 Hz or 60 Hz networks and it applies to their type tests only.<br/>
    This document applies to electricity metering equipment designed to:<br/>
    • measure and control electrical energy on electrical networks (mains) with voltage up to 1 000 V AC;<br/>
    • have all functional elements, including add-on modules, enclosed in, or forming a single meter case with exception of indicating displays;<br/>
    • operate with integrated or detached indicating displays, or without an indicating display;<br/>
    • be installed in a specified matching socket or rack;<br/>
    • optionally, provide additional functions other than those for measurement of electrical energy.<br/>
    This document does not apply to:<br/>
    • meters for which the voltage line-to-neutral derived from nominal voltages exceeds 1 000 V AC;<br/>
    • meters intended for connection with low power instrument transformers (LPITs as defined in the IEC 61869 series) when tested without such transformers;<br/>
    • metering systems comprising multiple devices physically remote from one another.<br/>
    • portable meters;<br/>
    • meters used in rolling stock, vehicles, ships and airplanes;<br/>
    • laboratory and meter test equipment;<br/>
    • reference standard meters;<br/>
    • data interfaces to the register of the meter;<br/>
    • matching sockets or racks used for installation of electricity metering equipment;<br/>
    • any additional functions provided in electrical energy meters.<br/>
    This document does not cover measures for the detection and prevention of fraudulent attempts to compromise a meter’s performance (tampering)<br/>
    This second edition cancels and replaces the first edition published in 2003 and its amendment 1: 2016. This edition constitutes a technical revision.<br/>
    This edition includes the following significant technical changes with respect to the previous edition:<br/>
    a) Removed all meter safety requirements; the meter safety requirements are covered in IEC 62052-31: 2015.<br/>
    b) Moved the descriptions of all general requirements and test methods from IEC 62053-21: 2003, IEC 62053-22: 2003, IEC 62053-23: 2003, IEC 62053-24: 2003 to IEC 62052-11:2020; IEC 62053-21:2020, IEC 62053-22:2020, IEC 62053-23:2020, IEC 62053-24:2020 contain only accuracy class specific requirements.<br/>
    c) Added new requirements and tests concerning:<br/>
    1) active energy meters of accuracy class 0,1S;<br/>
    2) measurement uncertainty and repeatability (7.3, 7.8);<br/>
    3) influence of fast load current variations (9.4.12);<br/>
    4) immunity to conducted differential current disturbances in the 2 kHz to 150 kHz frequency range (9.3.8)
- language: fr
  script: Latn
  content: |-
    IEC 62053-22:2020 est applicable uniquement aux compteurs statiques d'énergie active alimentés par transformateurs des classes de précision 0,1 S, 0,2 S et 0,5 S, destinés à la mesure de l'énergie électrique active en courant alternatif sur les réseaux électriques en 50 Hz et 60 Hz, et à leurs essais de type.<br/>
    NOTE 1 Pour d'autres exigences générales, notamment en matière de sécurité, de sûreté de fonctionnement, etc., se référer aux normes IEC 62052 ou IEC 62059 correspondantes.<br/>
    Le présent document s'applique aux équipements de comptage de l'électricité conçus pour:<br/>
    • mesurer et piloter l'énergie électrique sur les réseaux électriques (secteur) avec une tension allant jusqu'à 1 000 V;<br/>
    • avoir tous les éléments fonctionnels, y compris les modules complémentaires, incorporés dans ou formant un boîtier de compteur unique, à l'exception des afficheurs;<br/>
    • fonctionner avec des afficheurs intégrés ou séparés, ou sans afficheur;<br/>
    • être installés dans une embase ou un bâti correspondant spécifié;<br/>
    • assurer, en option, des fonctions autres que celles relatives au comptage de l'énergie électrique.<br/>
    Le présent document ne s'applique pas:<br/>
    • aux compteurs dont la tension phase-neutre déduite des tensions nominales dépasse 1 000 V;<br/>
    • aux compteurs destinés à être connectés à des transformateurs de mesure de faible puissance (LPIT, Low Power Instrument Transformers, définis dans la série IEC 61869) lorsqu'ils sont soumis à l'essai sans ces transformateurs;<br/>
    • aux systèmes de comptage comprenant plusieurs dispositifs physiquement éloignés les uns des autres;<br/>
    • aux compteurs portatifs;<br/>
    • aux compteurs utilisés dans le matériel roulant, les véhicules, les navires et les avions;<br/>
    • aux équipements de laboratoire et d'essai des compteurs;<br/>
    • aux compteurs étalons de référence;<br/>
    • aux interfaces de données avec l'élément indicateur du compteur;<br/>
    • aux embases ou bâtis correspondants utilisés pour l'installation des équipements de comptage de l'électricité;<br/>
    • à toute fonction complémentaire assurée par les compteurs d'énergie électrique.<br/>
    Le présent document ne couvre pas les mesures de détection et de prévention des tentatives frauduleuses de compromettre les performances du compteur (falsification).<br/>
    Cette deuxième édition annule et remplace la première édition parue en 2003 et son amendement 1:2016. Cette édition constitue une révision technique.<br/>
    Cette édition inclut les modifications techniques majeures suivantes par rapport à l'édition précédente: voir Annexe B.
