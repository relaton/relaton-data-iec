abstract:
- language: en
  script: Latn
  content: |-
    IEC 60940:2026 establishes general rules and safety requirements on the application of capacitors, resistors, inductors, and complete filter units for electromagnetic interference suppression which will be connected to an AC mains or other supply (DC or AC) with a nominal voltage not exceeding 1 000 V AC having a nominal frequency not exceeding 400 Hz, or 1 500 V DC.<br/>
    It facilitates drafters of product safety standards and other stakeholders such as designers, manufacturers, service providers, policy makers and regulators to consider safety aspects for the intended use and the reasonably foreseeable misuse of these components in its products and systems and apply risk reduction measures to achieve a tolerable risk level.<br/>
    This third edition includes the following significant technical changes with respect to the previous edition:<br/>
    a) new title to change the document from “guidance” into “general rules and safety requirements;<br/>
    b) new content added (Clause 5 to Clause 9);<br/>
    c) the previous edition is partly contained in Clause 4.
- language: fr
  script: Latn
  content: |-
    L'IEC 60940:2026 établit les règles générales et les exigences de sécurité relatives à l’emploi des condensateurs, résistances, inductances et filtres complets d’antiparasitage qui seront connectés à un réseau alternatif ou à une autre alimentation (continue ou alternative) avec une tension nominale ne dépassant pas 1 000 V en courant alternatif et une fréquence nominale ne dépassant pas 400 Hz, ou 1 500 V en courant continu.<br/>
    Il convient qu’il aide les rédacteurs de normes de sécurité des produits et d’autres parties prenantes telles que les concepteurs, les fabricants, les prestataires de services, les décideurs et les régulateurs à prendre en compte les aspects de sécurité pour l’utilisation prévue et l’abus raisonnablement prévisible de ces composants dans ses produits et systèmes, et à appliquer des mesures de réduction des risques pour atteindre un niveau de risque tolérable.<br/>
    Cette troisième édition inclut les modifications techniques majeures suivantes par rapport à l’édition précédente:<br/>
    a) nouveau titre pour remplacer "guide d’emploi" par "règles générales et exigences de sécurité";<br/>
    b) ajout d’un nouveau contenu (Article 5 à Article 9);<br/>
    c) l’édition précédente est partiellement contenue dans l’Article 4.
