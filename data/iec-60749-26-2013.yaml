abstract:
- language: en
  script: Latn
  content: |-
    IEC 60749-26:2013 establishes the procedure for testing, evaluating, and classifying components and microcircuits according to their susceptibility (sensitivity) to damage or degradation by exposure to a defined human body model (HBM) electrostatic discharge (ESD). The purpose (objective) of this standard is to establish a test method that will replicate HBM failures and provide reliable, repeatable HBM ESD test results from tester to tester, regardless of component type. Repeatable data will allow accurate classifications and comparisons of HBM ESD sensitivity levels. ESD testing of semiconductor devices is selected from this test method, the machine model (MM) test method (see IEC 60749-27) or other ESD test methods in the IEC 60749 series. The HBM and MM test methods produce similar but not identical results; unless otherwise specified, this test method is the one selected. This edition includes the following significant technical changes with respect to the previous edition:<br/>
    a) descriptions of oscilloscope and current transducers have been refined and updated;<br/>
    b) the HBM circuit schematic and description have been improved;<br/>
    c) the description of stress test equipment qualification and verification has been completely re-written;<br/>
    d) qualification and verification of test fixture boards has been revised;<br/>
    e) a new section on the determination of ringing in the current waveform has been added;<br/>
    f) some alternate pin combinations have been included;<br/>
    g) allowance for non-supply pins to stress to a limited number of supply pin groups (associated non-supply pins) and allowance for non-supply to non-supply (i.e., I/O to I/O) stress to be limited to a finite number of 2 pin pairs (coupled non-supply pin pairs);<br/>
    h) explicit allowance for HBM stress using 2 pin HBM testers for die only shorted supply groups.
- language: fr
  script: Latn
  content: |-
    La CEI 60749-26:2013 établit une procédure pour les essais, l'évaluation et la classification des composants et des microcircuits en fonction de leur susceptibilité (sensibilité) aux dommages ou de leur dégradation suite à leur exposition à des décharges électrostatiques (DES) sur un modèle de corps humain (HBM) défini. Le but (objectif) de cette norme est de déterminer une méthode d'essai permettant de reproduire les défaillances du HBM et de fournir des résultats d'essais de DES de HBM fiables et reproductibles d'un appareil d'essai à un autre, sans tenir compte du type de composant. Des données reproductibles autoriseront des classifications et des comparaisons précises des niveaux de sensibilité de DES de HBM. Les essais de DES des dispositifs à semiconducteurs sont choisis entre la présente méthode d'essai, celle du modèle de machine (MM) (voir CEI 60749-27) ou toute autre méthode d'essai de la série CEI 60749. Les méthodes d'essai HBM et MM produisent des résultats similaires mais non identiques; sauf indication contraire, la présente méthode d'essai est celle qui prévaut. Cette édition inclut les modifications techniques majeures suivantes par rapport à l'édition précédente:<br/>
    a) les descriptions de l'oscilloscope et des transducteurs de courant ont été améliorées et mises à jour;<br/>
    b) le schéma de circuit et la description du HBM ont été améliorés;<br/>
    c) la description de la qualification et de la vérification du matériel d'essai de contrainte a été entièrement réécrite;<br/>
    d) la qualification et la vérification des cartes de montage d'essai ont été révisées;<br/>
    e) une nouvelle section concernant la détermination de l'oscillation de la forme d'onde de courant a été ajoutée;<br/>
    f) certaines variantes de combinaisons de broches ont été incluses;<br/>
    g) autorisation de contrainte pour les broches n'assurant pas l'alimentation jusqu'à un nombre limité de groupes de broches d'alimentation (broches associées n'assurant pas l'alimentation) et autorisation de limiter les contraintes entre broches n'assurant pas l'alimentation et broches n'assurant pas l'alimentation (c'est-à-dire, E/S vers E/S) à un nombre fini de 2 paires de broches (paires de broches couplées n'assurant pas l'alimentation);<br/>
    - h) autorisation explicite de contrainte de HBM utilisant des appareils d'essai de HBM à 2 broches pour puce seulement pour des groupes d'alimentations court-circuitées.
