abstract:
- language: en
  script: Latn
  content: |-
    IEC PAS 63720:2026 defines standardized routing parameter tables applicable to the design of rigid circuit board with mechanically or laser drilled vias.<br/>
    These parameter tables are based on the concept of "Routing Classes" initially introduced in the French standard NF-93713 (1971-1989, cancelled: 2019). They are linked to the pitch of electronic components (e.g., BGA, QFN, connector, etc.) and thus allow a better coupling with component and circuit board manufacturers.<br/>
    They can be easily integrated into EDA tools to facilitate the work of designers, while ensuring a common standard of communication between customers and manufacturers.<br/>
    Routing classes should not be confused with IPC performance classes, which are used in the context of circuit board acceptance (IPC-A-600) as well as qualification and performance (IPC-6012) standards. Additional information on circuit board design is provided by IPC-2221 (Generic Standard on Printed Board Design), IPC-2222 (Sectional Design Standard for Rigid Organic Printed Boards) and IPC-2226 (Sectional Design Standard for High Density Interconnect (HDI) Printed Boards).<br/>
    This document is based on French AFNOR Spec 2212 and was submitted as a PAS document.
