abstract:
- language: en
  script: Latn
  content: |-
    IEC 61300-3-30 describes a method for measuring the endface geometry of rectangular multifibre ferrules having an IEC defined optical interface. The primary attributes are fibre position relative to the endface, endface angle relative to the guide holes, fibre tip radii and core dip for multimode fibres.<br/>
    This edition includes the following significant technical changes with respect to the previous edition:<br/>
    a) clarification of region diameter symbols;<br/>
    b) introduction of x116 and x132 region of interest (ROI) to support MT-16 and MT-32 ferrule types;<br/>
    c) preparation of geometry limit (GL) parameter tables for 16-, 24- and 32-fibre ferrules;<br/>
    d) clarification of the neighbouring fibres definition when computing adjacent height;<br/>
    e) improvement of figures in Annexes.
- language: fr
  script: Latn
  content: |-
    L’IEC 61300-3-30:2026 décrit une méthode de mesurage applicable à la géométrie de la surface de terminaison des férules rectangulaires multifibres dont l’interface optique est définie par l’IEC. Les attributs primaires sont la position de la fibre par rapport à la surface de terminaison, l’angle de la surface de terminaison par rapport aux trous de guidage, les rayons des pointes des fibres et la dépression du cœur pour les fibres multimodales.<br/>
    Cette édition inclut les modifications techniques significatives suivantes par rapport à l'édition précédente:<br/>
    a) clarification des symboles pour le diamètre des différentes régions;<br/>
    b) introduction de la région d'intérêt (ROI, region of interest) x116 et x132 pour prendre en charge les types de férules MT-16 et MT-32;<br/>
    c) préparation de tableaux de paramètres de limite de géométrie (GL, geometry limit) pour les férules à 16, 24 et 32 fibres;<br/>
    d) larification de la définition des fibres adjacentes pour le calcul du différentiel de hauteur entre fibres adjacentes;<br/>
    e) amélioration des figures des Annexes.
