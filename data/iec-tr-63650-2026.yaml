abstract:
- language: en
  script: Latn
  content: |-
    IEC TR 63650:2026 investigates the primary technological approaches, current applications, and development prospects of electrochemical capacitors (supercapacitors). In particular, this document also analyses the technical solutions and characteristics of electrochemical capacitor applications in the field of Electrical Energy Storage (EES) and provides representative application cases. Then, the testing items of the electrochemical capacitors (supercapacitors) for use in EES are introduced for the cells and modules, respectively.<br/>
    By collecting the existing standards of electrochemical capacitor , this document identifies the gap between the existing IEC and ISO standards and the actual needs of electrochemical capacitors used in EES and proposes descriptions and a roadmap for future standardization of electrochemical capacitors in the field of EES. This work will promote the rapid progress and broader applications of electrochemical capacitors in the field of EES.
