abstract:
- language: en
  script: Latn
  content: |-
    IEC 62715-6-22:2026 RLV contains both the official IEC International Standard and its Redline version. The Redline version is available in English only and provides you with a quick and easy way to compare all the changes between the official IEC Standard and its previous edition.
    <p>IEC 62715-6-22:2026 specifies the standard measurement conditions and methods for determining the surface crease and waviness for the evaluation of foldable displays. The measurement methods are used to specify the extent of geometrical distortions in foldable display surfaces. This document applies to foldable display panels and modules. If the foldable display panel has two or more folding axes, this document applies only to the case that folding axes are parallel. This second edition cancels and replaces the first edition published in 2023. This edition constitutes a technical revision.<br/>
    This edition includes the following significant technical changes with respect to the previous edition:<br/>
    - addition of multiple-folding;<br/>
    - addition of new data analysis logic.</p>
