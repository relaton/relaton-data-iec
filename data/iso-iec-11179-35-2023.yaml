abstract:
- language: en
  script: Latn
  content: |-
    <p class="MsoBodyText" style="mso-layout-grid-align: none; text-autospace: none;">This document provides a specification for an extension to a Metadata Registry (MDR), as specified in ISO/IEC 11179-3, in which metadata that describes models, and their associated metamodels, can be registered.</p>
    <p class="MsoBodyText" style="mso-layout-grid-align: none; text-autospace: none;">The specification in this document, together with the relevant clauses of the specification in ISO/IEC 11179-3, provides the ability to record metadata about:</p>
    <p class="ListNumber1" style="tab-stops: 19.85pt 39.7pt 59.55pt 79.4pt 99.25pt 119.05pt 138.9pt 158.75pt 178.6pt 7.0cm; mso-layout-grid-align: none; text-autospace: none;">a)    models used in software engineering or information processing, for example, information or data models, process models, models of web services or any other type of models used to develop software systems or the processing of information;</p>
    <p class="ListNumber1" style="tab-stops: 19.85pt 39.7pt 59.55pt 79.4pt 99.25pt 119.05pt 138.9pt 158.75pt 178.6pt 7.0cm; mso-layout-grid-align: none; text-autospace: none;">b)    the concepts associated with the various elements within the models;</p>
    <p class="ListNumber1" style="tab-stops: 19.85pt 39.7pt 59.55pt 79.4pt 99.25pt 119.05pt 138.9pt 158.75pt 178.6pt 7.0cm; mso-layout-grid-align: none; text-autospace: none;">c)    the metamodels associated with the models;</p>
    <p class="ListNumber1" style="tab-stops: 19.85pt 39.7pt 59.55pt 79.4pt 99.25pt 119.05pt 138.9pt 158.75pt 178.6pt 7.0cm; mso-layout-grid-align: none; text-autospace: none;">d)    the mappings identified between the models, between the metamodels, and between the models and their associated metamodels – this is achieved by using the mapping facilities specified in ISO/IEC 11179-3.</p>
    <p class="MsoBodyText" style="mso-layout-grid-align: none; text-autospace: none;">This document is applicable to the formulation of models and metamodels to be shared among people and machines, independent of the organization that produces the model or metamodel. It is not applicable to the physical instantiation of any model.</p>
