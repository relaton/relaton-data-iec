abstract:
- language: en
  script: Latn
  content: |-
    IEC 63287-3:2026 specifies guidelines for a reliability qualification plan for power semiconductor modules to assure reliability targets over the entire product life.<br/>
    Power semiconductor modules with incorporated control circuits are excluded. Clamped packages that need external pressure for being mounted in a system are excluded, e.g. disc-type pressure pack devices.<br/>
    This document is not intended for medical, military, aeronautics and astronautics-related applications.<br/>
    NOTE Throughout the document, the term power semiconductor module refers to multichip semiconductor power modules as defined in IEC 60191-4.
- language: fr
  script: Latn
  content: |-
    L’IEC 63287-3:2026 spécifie des lignes directrices pour un plan de qualification de la fiabilité des modules à semiconducteurs de puissance, visant à définir des objectifs de fiabilité sur toute la durée de vie du produit.<br/>
    Les modules à semiconducteurs de puissance avec circuits de commande incorporés ne relèvent pas du domaine d’application du présent document. Les boîtiers pressés qui nécessitent une pression externe pour être montés dans un système ne relèvent pas du domaine d’application du présent document, par exemple les dispositifs à compression en forme de disque.<br/>
    Le présent document n’est pas destiné aux applications médicales, militaires, aéronautiques et astronautiques.<br/>
    NOTE Tout au long du présent document, le terme module à semiconducteurs de puissance désigne les modules à semiconducteurs de puissance multipuces tels qu'ils sont définis en l'IEC 60191-4.
