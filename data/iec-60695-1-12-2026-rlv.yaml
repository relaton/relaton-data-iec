abstract:
- language: en
  script: Latn
  content: |-
    IEC 60695-1-12:2026 RLV contains both the official IEC International Standard and its Redline version. The Redline version is available in English only and provides you with a quick and easy way to compare all the changes between the official IEC Standard and its previous edition.<br/>
    <br/>
    IEC 60695-1-12:2026 specifies methodologies of fire safety engineering for electrotechnical products by providing:<br/>
    - an explanation of the principles and uses of fire safety engineering;<br/>
    - guidance on the use of fire safety engineering in the design of electrotechnical products;<br/>
    - fire safety engineering terminology, and concepts;<br/>
    - an indication of properties, data and tests needed for input into fire safety engineering assessment; and<br/>
    - informative references.<br/>
    This document is intended to provide guidance for product committees on fire safety engineering methods and performance-based tests for use in performance-based designs and fire hazard assessments of electrotechnical materials, assemblies, products and systems. More detailed information on fire safety engineering is contained in ISO 23932‑1. This basic safety publication focusing on safety guidance is primarily intended for use by committees in the preparation of safety publications in accordance with the principles laid down in IEC Guide 104 and ISO/IEC Guide 51. This second edition cancels and replaces the first edition published in 2015. This edition constitutes a technical revision.<br/>
    This edition includes the following significant technical changes with respect to the previous edition:<br/>
    a) whole text is renewed to contain the most recent technologies of fire safety engineering mainly developed by ISO/TC92 Fire safety SC4 Fire safety engineering.<br/>
    b) Annex A is changed to show example of application of FSE in an international standard.
