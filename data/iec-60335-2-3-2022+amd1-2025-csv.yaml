abstract:
- language: en
  script: Latn
  content: |-
    IEC 60335-2-3:2022+AMD1:2025 CSV deals with the safety of electric dry irons and steam irons, including those with a separate water reservoir or boiler having a capacity not exceeding 5 l, for household and similar purposes, their rated voltage being not more than 250 V including direct current (DC) supplied appliances and battery-operated appliances.<br/>
    Appliances not intended for normal household use, but which nevertheless can be a source of danger to the public, such as appliances intended to be used by laymen in shops, in light industry and on farms, are within the scope of this standard.<br/>
    As far as is practicable, this standard deals with the common hazards presented by appliances, which are encountered by all persons in and around the home. However, in general, it does not take into account<br/>
    – persons (including children) whose physical, sensory or mental capabilities or lack of experience and knowledge prevents them from using the appliance safely without supervision or instruction;<br/>
    – children playing with the appliance.<br/>
    Attention is drawn to the fact that<br/>
    – for appliances intended to be used in vehicles or on board ships or aircraft, additional requirements can be necessary;<br/>
    – in many countries, additional requirements are specified by the national health authorities, the national authorities responsible for the protection of labour, the national authorities responsible for the safety of pressure vessels. and similar authorities.<br/>
    This standard does not apply to<br/>
    – ironers (IEC 60335-2-44);<br/>
    – ironing boards;<br/>
    – appliances designed exclusively for industrial purposes;<br/>
    – appliances intended to be used in locations where special conditions prevail, such as the presence of a corrosive or explosive atmosphere (dust, vapour or gas).<br/>
    This seventh edition cancels and replaces the sixth edition published in 2012 and Amendment 1:2015. This edition constitutes a technical revision.<br/>
    This edition includes the following significant technical changes with respect to the previous edition:<br/>
    a) alignment with IEC 60335-1:2020;<br/>
    b) deletion or conversion of some notes to normative text (Clause 1, 5.2, 21.101);<br/>
    c) addition of external accessible surface temperature limits (3.6.103, 11.3, 11.8);<br/>
    d) clarification of surfaces likely to be contacted when gripping a handle (22.13);<br/>
    e) clarification of the applicability of 30.2.2 and 30.2.3 (30.2, 30.2.3).<br/>
    This part 2 is to be used in conjunction with the latest edition of IEC 60335-1 and its amendments unless that edition precludes it; in that case, the latest edition that does not preclude it is used. It was established on the basis of the sixth edition (2020) of that standard.
