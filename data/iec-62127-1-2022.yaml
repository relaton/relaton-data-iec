abstract:
- language: en
  script: Latn
  content: |-
    CORRECTED VERSION 2026-08<br/>
    <br/>
    IEC 62127-1:2022 specifies methods of use of calibrated hydrophones for the measurement in liquids of acoustic fields generated by ultrasonic medical equipment including bandwidth criteria and calibration frequency range requirements in dependence on the spectral content of the fields to be characterized.<br/>
    This document:<br/>
    - defines a group of acoustic parameters that can be measured on a physically sound basis;<br/>
    - defines a second group of parameters that can be derived under certain assumptions from these measurements, and called derived intensity parameters;<br/>
    - defines a measurement procedure that can be used for the determination of acoustic pressure parameters;<br/>
    - defines the conditions under which the measurements of acoustic parameters can be made using calibrated hydrophones;<br/>
    - defines procedures for correcting for limitations caused by the use of hydrophones with finite bandwidth and finite active element size, and for estimating the corresponding uncertainties.<br/>
    IEC 62127-1:2022 cancels and replaces the first edition published in 2007 and Amendment 1:2013. This edition constitutes a technical revision.<br/>
    This edition includes the following significant technical changes with respect to the previous edition.<br/>
    a) The upper frequency limit of 40 MHz has been removed.<br/>
    b) Hydrophone sensitivity definitions have been changed to recognize sensitivities as complex-valued quantities.<br/>
    c) Procedures and requirements for narrow-band approximation and broadband measurements have been modified; details on waveform deconvolution have been added.<br/>
    d) Procedures for spatial averaging correction have been amended.<br/>
    e) Annex D, Annex E and bibliography have been updated to support the changes of the normative parts.<br/>
    The contents of the Interpretation sheet 1 (2026-08) have been included in this copy.
- language: fr
  script: Latn
  content: |-
    VERSION CORRIGEE 2026-08<br/>
    <br/>
    L’IEC 62127-1:2022 spécifie les méthodes d'utilisation des hydrophones étalonnés qui permettent de mesurer, dans des liquides, les champs acoustiques générés par des appareils médicaux à ultrasons, y compris les critères de largeur de bande et les exigences de plage de fréquences d’étalonnage en fonction du contenu spectral des champs à caractériser.<br/>
    Le présent document:<br/>
    - définit un groupe de paramètres acoustiques qui peuvent être mesurés sur une base physiquement sonore;<br/>
    - définit un second groupe de paramètres qui peuvent être déduits, dans le cadre de certaines hypothèses, de ces mesurages et appelés paramètres d'intensité dérivés;<br/>
    - définit un mode opératoire de mesure qui peut être utilisé pour déterminer les paramètres de pression acoustique;<br/>
    - définit les conditions dans lesquelles les mesurages des paramètres acoustiques peuvent être réalisés à l'aide d'hydrophones étalonnés;<br/>
    - définit les modes opératoires de correction, dans le cas de limitations provoquées par l'utilisation d'hydrophones à largeur de bande finie et de taille d'élément actif finie, ainsi que les modes opératoires d’estimation des incertitudes correspondantes.<br/>
    L’IEC 62127-1:2022 annule et remplace la première édition parue en 2007 ainsi que l’Amendement 1:2013. Cette édition constitue une révision technique.<br/>
    Cette édition inclut les modifications techniques majeures suivantes par rapport à l’édition précédente.<br/>
    a) La limite supérieure de fréquence de 40 MHz a été supprimée.<br/>
    b) Les définitions de la sensibilité des hydrophones ont été modifiées pour considérer les sensibilités comme des grandeurs à valeurs complexes.<br/>
    c) Les modes opératoires et les exigences concernant l’approximation à bande étroite et les mesurages à large bande ont été modifiés; des informations détaillées sur la déconvolution des formes d’onde ont été ajoutés.<br/>
    d) Les modes opératoires de correction de la moyenne spatiale ont été modifiés.<br/>
    e) L’Annexe D, l’Annexe E et la Bibliographie ont été mises à jour pour tenir compte des modifications apportées aux parties normatives.<br/>
    Le contenu de la feuille d'interpreation 1 (2026-08) s'applique à la version anglaise uniquement.
