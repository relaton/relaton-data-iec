abstract:
- language: en
  script: Latn
  content: |-
    IEC 62990-1:2019 specifies general requirements for design, function and performance, and describes the test methods that apply to portable, transportable, and fixed equipment for the detection and concentration measurement of toxic gases and vapours in workplace atmospheres and other industrial and commercial applications.<br/>
    This document is applicable to continuously sensing equipment whose primary purpose is to provide an indication, alarm and/or other output function the purpose of which is to indicate the presence of a toxic gas or vapour in the atmosphere and in some cases to initiate automatic or manual protective action(s). It is applicable to equipment in which the sensor generates an electrical signal when gas is present.<br/>
    This document applies to two types of equipment:<br/>
    • Type HM (Health Monitoring) ‘occupational exposure’ equipment:<br/>
    For occupational exposure measurement, the performance requirements are focused on uncertainty of measurement of gas concentrations in the region of Occupational Exposure Limit Values (OELV). The upper limit of measurement will be defined by the manufacturer in accordance with 4.2.1.<br/>
    • Type SM (Safety Monitoring) ‘general gas detection’ equipment:<br/>
    For general gas detection applications (e.g. safety warning, leak detection), the performance requirements are focused on alarm signalling. The upper limit of measurement will be defined by the manufacturer according to the intended use of the equipment.<br/>
    In general, the requirements for accuracy will be higher for Type HM equipment than for Type SM equipment. The same equipment may meet the requirements of both Type HM and Type SM.<br/>
    For equipment used for sensing the presence of multiple gases this document applies only to the detection of toxic gas or vapour.<br/>
    This document is not applicable to equipment:<br/>
    - with samplers and concentrators such as sorbents or paper tape having an irreversible indication;<br/>
    - used for the measurement of gases and vapours related to the risk of explosion;<br/>
    - used for the measurement of oxygen;<br/>
    - used only in laboratories for analysis or measurement;<br/>
    - used only for process measurement purposes;<br/>
    - used in the domestic environment;<br/>
    - used in environmental air pollution monitoring;<br/>
    - used for open-path (line of sight) area gas measurement;<br/>
    - used for ventilation control in car parks or tunnels.<br/>
    The contents of the corrigendum of December 2019 have been included in this copy.
- language: fr
  script: Latn
  content: |-
    IEC 62990-1:2019 spécifie les exigences générales pour la conception, la fonction et l’aptitude au fonctionnement, et décrit les méthodes d’essai qui s’appliquent aux matériels portables, transportables et fixes pour la détection et le mesurage de la concentration des gaz et des vapeurs toxiques dans les atmosphères des lieux de travail et d’autres applications industrielles et commerciales.<br/>
    Le présent document s’applique aux matériels à fonctionnement continu dont l’objectif principal est de donner une indication, une alarme et/ou une autre fonction de sortie, le but étant de signaler la présence d’un gaz ou d’une vapeur toxique dans l’atmosphère et, dans certains cas, de déclencher une ou des actions protectrices manuelles ou automatiques. Il s’applique aux matériels dont le capteur produit un signal électrique en présence d’un gaz.<br/>
    Le présent document s’applique à deux types de matériels:<br/>
    • Les matériels “d'exposition professionnelle” de type HM (surveillance de la santé):<br/>
    Pour le mesurage de l’exposition professionnelle, les exigences d’aptitude à la fonction ciblent l'incertitude de mesure des concentrations de gaz dans l’étendue d’application des valeurs limites d’exposition professionnelle (OELV – Occupational Exposure Limit Values). La limite supérieure de mesure est définie par le constructeur conformément à 4.2.1.<br/>
    • Les matériels de “détection générale de gaz” de type SM (surveillance de la sécurité):<br/>
    Pour les applications de détection générale de gaz (par exemple, avertissement de sécurité, détection de fuite), les exigences d’aptitude à la fonction ciblent la signalisation d’alarme. La limite supérieure de mesure est définie par le constructeur en fonction de l’utilisation prévue du matériel.<br/>
    Généralement, les exigences d’exactitude sont plus strictes pour les matériels de type HM que pour les matériels de type SM. Les mêmes matériels peuvent satisfaire aux exigences applicables aux deux types HM et SM.<br/>
    Pour les matériels qui permettent de détecter la présence de plusieurs gaz, le présent document s’applique uniquement pour la détection des gaz ou vapeurs toxiques.<br/>
    Le présent document ne s’applique pas aux matériels:<br/>
    - comportant des échantillonneurs et des concentrateurs tels que des sorbants ou une bande de papier qui présentent une indication irréversible;<br/>
    - utilisés pour le mesurage des gaz et vapeurs liés au risque d’explosion;<br/>
    - utilisés pour le mesurage de l’oxygène;<br/>
    - utilisés uniquement en laboratoires pour l’analyse ou le mesurage;<br/>
    - utilisés uniquement pour la mesure de processus;<br/>
    - utilisés dans l’environnement domestique;<br/>
    - utilisés dans la surveillance de la pollution atmosphérique;<br/>
    - utilisés pour le mesurage des gaz avec emplacement à chemin ouvert (champ de vision);<br/>
    - utilisés pour la commande de la ventilation dans les parcs de stationnement ou les tunnels.<br/>
    Le contenu du corrigendum de décembre 2019 a été pris en considération dans cet exemplaire.
