abstract:
- language: en
  script: Latn
  content: |-
    IEC 60335-2-79:2021 deals with the safety of high-pressure cleaners without traction drive, intended for household and commercial indoor or outdoor use, having a rated pressure not less than 2,5 MPa and not exceeding 35 MPa. It also applies to steam cleaners and those parts of hot water high pressure cleaners incorporating a steam stage which have a capacity not exceeding 100 l, a rated pressure not exceeding 2,5 MPa and a product of capacity and rated pressure not exceeding 5 MPa·l. They are not equipped with a traction drive. The following power systems of the drive for the high pressure pump are covered:<br/>
    - mains powered motors up to a rated voltage of 250 V for single-phase machines and 480 V for other machines,<br/>
    - battery-operated motors,<br/>
    - internal combustion engines,<br/>
    - hydraulic or pneumatic motors.<br/>
    This standard does not apply to:<br/>
    - high pressure water jet machines having a rated pressure exceeding 35 MPa;<br/>
    - liquid or steam cleaners intended for domestic use (IEC 60335-2-54);<br/>
    - hand-held and transportable motor-operated electric tools (IEC 60745 series, IEC 61029 series, IEC 62841 series);<br/>
    - appliances for medical purposes (IEC 60601);<br/>
    - agricultural sprayers (ISO 4254-6);<br/>
    - non-liquid, solid abrasive cleaners;<br/>
    - machines designed to be part of a production process;<br/>
    - machines designed for use in corrosive or explosive environments (dust, vapour or gas);<br/>
    - machines designed for use in vehicles or on board of ships or aircraft.<br/>
    This fifth edition cancels and replaces the fourth edition published in 2016. It constitutes a technical revision.<br/>
    This edition includes the following significant technical changes with respect to the previous edition (minor changes are not listed):<br/>
    - editorial and technical alignment with IEC 60335-1:2020;<br/>
    - clarification on hand-held and battery-operated high pressure cleaners;<br/>
    - general editorial improvements.<br/>
    This part 2 is to be used in conjunction with the latest edition of IEC 60335-1 and its amendments. It was established on the basis of the sixth edition (2020) of that standard.
- language: fr
  script: Latn
  content: |-
    L'IEC 60335-2-79:2021 traite de la sécurité des appareils de nettoyage à haute pression sans commande de dispositif de déplacement, destinés à un usage domestique et commercial en intérieur ou en extérieur, de pression assignée supérieure ou égale à 2,5 MPa et inférieure ou égale à 35 MPa. Elle s'applique également aux appareils de nettoyage à vapeur et aux parties des appareils de nettoyage à haute pression d'eau chaude qui comportent une phase vapeur dont la capacité ne dépasse pas 100 l et la pression assignée ne dépasse pas 2,5 MPa, le produit de la capacité et de la pression assignée ne dépassant pas 5 MPa·l. Ceux-ci ne sont pas équipés d'une commande de dispositif de déplacement. Les systèmes d'alimentation suivants de la commande de la pompe à haute pression sont couverts:<br/>
    - moteurs alimentés par le réseau de tension assignée inférieure ou égale à 250 V pour les machines monophasées et à 480 V pour les autres machines,<br/>
    - moteurs alimentés par batteries,<br/>
    - moteurs à combustion interne,<br/>
    - moteurs hydrauliques ou pneumatiques.<br/>
    La présente norme ne s'applique pas:<br/>
    - aux machines à jet d'eau à haute pression dont la pression assignée dépasse 35 MPa;<br/>
    - aux appareils de nettoyage à vapeur ou à liquide à usage domestique (IEC 60335-2-54);<br/>
    - aux outils électroportatifs et portables à moteur (série IEC 60745, série IEC 61029, série IEC 62841);<br/>
    - aux appareils à but médical (IEC 60601);<br/>
    - aux pulvérisateurs agricoles (ISO 4254-6);<br/>
    - aux nettoyants abrasifs solides, non liquides;<br/>
    - aux machines destinées à être utilisées dans le cadre d'un processus de production;<br/>
    - aux machines destinées à être utilisées dans des environnements corrosifs ou explosifs (poussière, vapeur ou gaz);<br/>
    - aux machines destinées à être utilisées dans des véhicules ou à bord de navires ou d'avions;<br/>
    Cette cinquième édition annule et remplace la quatrième édition parue en 2016. Elle constitue une révision technique.<br/>
    Cette édition inclut les modifications techniques majeures suivantes par rapport à l'édition précédente:<br/>
    - alignement rédactionnel et technique sur l'IEC 60335-1:2020;<br/>
    - clarification concernant les appareils de nettoyage à haute pression portatifs et alimentés par batteries;<br/>
    - améliorations rédactionnelles générales.<br/>
    La présente partie 2 doit être utilisée conjointement avec la dernière édition de l'IEC 60335-1 et ses amendements. Elle a été établie sur la base de la sixième édition (2020) de cette norme.
