abstract:
- language: en
  script: Latn
  content: |-
    IEC 60153-4:2017 specifies straight hollow metallic tubing of circular waveguides for use as waveguides in electronic equipment.<br/>
    The aim of this recommendation is to specify for hollow metallic waveguides:<br/>
    a) the details necessary to ensure compatibility and, as far as essential, interchangeability;<br/>
    b) test methods;<br/>
    c) uniform requirements for the electrical and mechanical properties.<br/>
    This edition includes the following significant technical changes with respect to the previous edition:<br/>
    a) expand and revise the operation frequency range for waveguides;<br/>
    b) revise the allowance of aperture dimensions;<br/>
    c) revise the test method for aperture dimensions;<br/>
    d) revise the equation of attenuation.
- language: fr
  script: Latn
  content: |-
    l'IEC 60153-4:2017 spécifie des tubes métalliques creux rectilignes de guides d'ondes circulaires destinés à être utilisés comme guides d'ondes dans les équipements électroniques.<br/>
    La présente recommandation a pour but de spécifier pour les guides d'ondes métalliques creux:<br/>
    a) les détails nécessaires pour assurer la compatibilité et, dès lors que c’est essentiel, l'interchangeabilité;<br/>
    b) les méthodes d’essai;<br/>
    c) es exigences uniformes pour les propriétés électriques et mécaniques<br/>
    La présente édition inclut les modifications techniques majeures suivantes par rapport à l'édition précédente:<br/>
    a) Extension et révision de la plage de fréquences de fonctionnement pour les guides d'ondes;<br/>
    b) Révision des tolérances sur les dimensions d'ouvertures;<br/>
    c) Révision de la méthode d'essai des dimensions d'ouverture;<br/>
    d) Révision des équations d'affaiblissement.
