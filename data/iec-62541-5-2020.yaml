abstract:
- language: en
  script: Latn
  content: |-
    IEC 62541-5:2020 defines the Information Model of the OPC Unified Architecture. The Information Model describes standardized Nodes of a Server’s AddressSpace. These Nodes are standardized types as well as standardized instances used for diagnostics or as entry points to server-specific Nodes. Thus, the Information Model defines the AddressSpace of an empty OPC UA Server. However, it is not expected that all Servers will provide all of these Nodes.<br/>
    This third edition cancels and replaces the second edition published in 2015. This edition constitutes a technical revision.<br/>
    This edition includes the following significant technical changes with respect to the previous edition:<br/>
    a) Added Annex F on User Authentication. Describes the Role Information Model that also allows configuration of Roles.<br/>
    b) Added new data types: "Union", "Decimal", "OptionSet", "DateString", "TimeString", "DurationString", NormalizedString", "DecimalString", and "AudioDataType".<br/>
    c) Added Method to request a state change in a Server.<br/>
    d) Added Method to set Subscription to persistent mode.<br/>
    e) Added Method to request resending of data from a Subscription.<br/>
    f) Added concept allowing to temporarily create a file to write to or read from a server in C.4.<br/>
    g) Added new Variable type to support Selection Lists.<br/>
    h) Added optional properties to FiniteStateMachineType to expose currently available states and transitions.<br/>
    i) Added UrisVersion Property to ServerType. This version information can be used for session-less service invocation.
- language: fr
  script: Latn
  content: |-
    IEC 62541-5:2020 définit le Modèle d'information de l'Architecture unifiée OPC. Le Modèle d'information décrit des Nœuds normalisés de l'AddressSpace d'un Serveur. Ces Nœuds sont des types normalisés ainsi que des instances normalisées utilisés pour le diagnostic ou comme des points d'entrée à des Nœuds spécifiques au serveur. Ainsi, le Modèle d'information définit l'AddressSpace d'un Serveur OPC UA vide. Cependant, tous les Serveurs ne sont pas supposés fournir la totalité de ces Nœuds.<br/>
    Cette troisième édition annule et remplace la deuxième édition parue en 2015. Cette édition constitue une révision technique.<br/>
    Cette édition inclut les modifications techniques majeures suivantes par rapport à l'édition précédente:<br/>
    a) ajout de l'Annexe F concernant l'Authentification des utilisateurs; description du Modèle d'information de rôle qui autorise également la configuration des Rôles;<br/>
    b) ajout de nouveaux types de données: "Union", "Decimal", "OptionSet", "DateString", "TimeString", "DurationString", "NormalizedString", "DecimalString" et "AudioDataType";<br/>
    c) ajout d'une méthode afin de demander un changement d'état dans un Serveur;<br/>
    d) ajout d'une méthode afin de définir un Abonnement en mode persistant;<br/>
    e) ajout d'une méthode afin de demander le renvoi de données à partir d'un Abonnement;<br/>
    f) ajout en C.4 d'un concept permettant la création temporaire d'un fichier pour l'écriture ou la lecture sur un serveur;<br/>
    g) ajout d'un nouveau type de Variable afin de prendre en charge les Listes de sélection;<br/>
    h) ajout de propriétés facultatives au FiniteStateMachineType afin de présenter les états et transitions actuellement disponibles;<br/>
    i) ajout d'une propriété UrisVersion au ServerType. Ces informations de version peuvent être utilisées pour l'invocation de services sans session.
