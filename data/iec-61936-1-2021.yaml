abstract:
- language: en
  script: Latn
  content: "IEC 61936-1:2021 provides requirements for the design and the erection
    of electrical power installations in systems with nominal voltages exceeding 1
    kV AC and nominal frequency up to and including 60 Hz, so as to provide safety
    and proper functioning for the use intended.<br/>\nThis document does not apply
    to the design and erection of any of the following:<br/>\n– overhead and underground
    lines between separate electrical power installations;<br/>\n– electrified railway
    tracks and rolling stock;<br/>\n– mining equipment and installations;<br/>\n–
    fluorescent lamp installations;<br/>\n– installations on ships according to IEC
    60092 (all parts) and offshore units according to IEC 61892 (all parts), which
    are used in the offshore petroleum industry for drilling, processing and storage
    purposes;<br/>\n– electrostatic equipment (e.g. electrostatic precipitators, spray-painting
    units);<br/>\n– test sites;<br/>\n– medical equipment, e.g. medical X-ray equipment.<br/>\nThis
    document does not apply to the design of prefabricated, type-tested switchgear
    and high voltage/low voltage prefabricated substation, for which separate IEC
    standards exist.<br/>\n<br/>\nThis edition includes the following significant
    technical changes with respect to the previous edition:\n\n\tintroduction has
    been rewritten to reflect the status when this document is produced;\n\tthe scope
    has been improved to clarify the application of this document;\n\tmissing and
    obsolete terms and definitions have been updated including improvement of existing
    terms;\n\tTable 1 has been updated where agreements between supplier and user
    are needed;\n\trequirements of electromagnetic compatibility have been clarified;\n\tinsulation
    coordination clause (Clause 5) has improved wording for better clarity and the
    technical content has an updated coordination to the latest versions of the insulation
    coordination standards;\n\twording regarding electrical equipment has been improved
    and made clearer;\n\tsubclause for fuses has been improved and reworded;\n\trequirements
    have been added for labelling when multiple sources are required to be disconnected;\n\tmissing
    requirements for GIS have been reintroduced;\n\tsubclause regarding ventilation
    (HVAC) has been improved;\n\tfigures in Clause 7 have been updated and moved to
    the corresponding subclause;\n\trequirements for transformer installations have
    been improved including adjustment of editorial typing-errors;\n\tclause on protection,
    automation and auxiliary systems has been restructured and improved;\n\tprotection
    against lightning strokes has been extended;\n\tclarification of content due to
    the distinction between erection (and providing electrical safety for the intended
    use of the electrical power installation) and subsequent activities such as maintenance
    and repair with safe working procedures;\n\twhere no provincial, national or regional
    regulations are available for safe working procedures, an informative guideline
    is provided in Annex F. This replaces the former parts of Figure 3 in Clause 7.\n"
- language: fr
  script: Latn
  content: "L’IEC 61936-1:2021 fournit des exigences relatives à la conception et
    au montage des installations électriques dans des systèmes dont les tensions nominales
    sont supérieures à 1 kV en courant alternatif et la fréquence nominale inférieure
    ou égale à 60 Hz, afin d'assurer la sécurité et le fonctionnement correct pour
    l'utilisation prévue.<br/>\nL'installation électrique comprend notamment les matériels
    suivants:\n\n\tmachines électriques tournantes;\n\tappareillage;\n\ttransformateurs
    et réactances;\n\tconvertisseurs;\n\tcâbles;\n\tcanalisations électriques;\n\tbatteries;\n\tcondensateurs;\n\tinstallations
    de mise à la terre;\n\tbâtiments et clôtures qui font partie d'une installation
    électrique fermée;\n\tsystèmes associés de protection, de commande et auxiliaires;\n\tréactance
    élevée à noyau d’air.\n\n\nLe présent document ne s'applique pas à la conception
    des appareillages préfabriqués soumis à un essai de type et des postes préfabriqués
    à haute tension/basse tension, pour lesquels des normes IEC spécifiques existent.<br/>\nCette
    édition inclut les modifications techniques majeures suivantes par rapport à l'édition
    précédente:\n\n\tl’introduction a été remaniée pour refléter la réalité au moment
    de la rédaction du présent document;\n\tle domaine d’application a été amélioré
    pour clarifier l’application du présent document;\n\tles termes et définitions
    manquants et obsolètes ont été mis à jour, et les termes existants ont été améliorés;\n\tle
    Tableau 1 a été mis à jour pour tenir compte des situations qui nécessitent des
    accords entre le fournisseur et l’utilisateur;\n\tles exigences en matière de
    compatibilité électromagnétique ont été clarifiées;\n\tla formulation de l’Article
    5) relatif à la coordination de l’isolement a été améliorée et la coordination
    de son contenu technique avec les dernières versions des normes de coordination
    de l’isolement a été mise à jour;\n\tla formulation concernant les matériels électriques
    a été améliorée et clarifiée;\n\tle paragraphe relatif aux fusibles a été amélioré
    et reformulé;\n\tdes exigences en matière d’étiquetage ont été introduites lorsque
    des sources multiples doivent être déconnectées;\n\tles exigences manquantes pour
    les postes sous enveloppe métallique (PSEM) ont été réintroduites;\n\tamélioration
    du paragraphe relatif à la ventilation (CVC, chauffage, ventilation et climatisation);\n\tmise
    à jour des chiffres dans l'Article 7 et leur déplacement vers le paragraphe correspondant;\n\tles
    exigences relatives aux installations de transformateurs ont été améliorées, et
    les fautes de frappe ont été corrigées;\n\trestructuration et amélioration de
    l’article relatif aux systèmes de protection, d’automatisation et auxiliaires;\n\tla
    protection contre les coups de foudre a été étendue;\n\tclarification du contenu
    en raison de la distinction entre les activités de montage (et l’assurance de
    la sécurité électrique pour l’utilisation prévue de l’installation électrique)
    et les activités consécutives (par exemple, la maintenance et la réparation) avec
    des procédures de travail sûres;\n\tprésence d’une ligne directrice informative
    dans l’Annexe F en l’absence de réglementation locale, nationale ou régionale
    sur les procédures de travail sûres. Cette modification se substitue aux anciennes
    parties de la Figure 3 à l'Article 7.\n\n"
