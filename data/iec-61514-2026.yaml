abstract:
- language: en
  script: Latn
  content: |-
    IEC 61514:2026 specifies tests designed to determine the static and dynamic performance of single-acting or double-acting analogue positioners. The tests apply to positioners which receive standard analogue input signals (as specified in IEC 60381-1, IEC 60381-2 and IEC 60382) and have a pneumatic output. Positioners with pulsed or digital input signals, positioners with digital controllers and positioners with pulsed outputs are outside the scope of this document. Testing is conducted either on a positioner alone, independently of an actuator, or on a positioner mounted and connected to a specific actuator, as a combined unit. The text makes clear where different approaches are required. The methods of evaluation given in this document are intended for use by manufacturers to determine the performance of their products, and by users, or independent testing establishments, to verify manufacturers' performance specifications. The closest liaison between the evaluating body and the manufacturer is indispensable during the tests, including the possibility for the manufacturer to influence the test programme based on the manufacturer's specifications for the instrument and comment on both the test programme and the results. This document is intended to provide definitions of positioner elements, actions, and characteristics, to specify uniform methods of measuring performance errors and effects of influence quantities on those characteristics, and to describe methods of reporting and evaluating the results of the measurement data obtained. The test conditions described in this publication (for example range of ambient temperatures and power supply) relate to conditions which commonly arise in use. Consequently, the values specified are used where no other values are specified by the manufacturer or user. If other values are used, they will be stated. It is recognized that the manufacturer's specifications and instructions for installation and operation apply during all steps. The tests specified in this document are not necessarily sufficient for instruments specifically designed for unusually arduous conditions. Conversely, a reduced series of tests can serve adequately for instruments designed to perform within a more limited range of conditions. When a full evaluation, in accordance with this document, is not required or possible, only the tests which are required are performed and the results reported in accordance with the relevant parts of this document. In such cases, the test report will state that it does not cover the full number of tests specified herein. This second edition cancels and replaces the first edition published in 2000. This edition constitutes a technical revision.<br/>
    This edition includes the following significant technical changes with respect to the previous edition:<br/>
    a) in 6.6.8 and Table 5, the magnetic field has been changed from 100 A/m to of 30 A/m (Mean Root Square);<br/>
    b) 6.10.4 and Figure 9 have been modified for better understandability;<br/>
    c) in 7.4, the reference to IEC 61187 has been deleted and replaced with a new Table 4: Document information.
- language: fr
  script: Latn
  content: |-
    L'IEC 61514:2026 spécifie les essais conçus pour déterminer les performances statiques et dynamiques des positionneurs analogiques à simple ou double effet. Ces essais s’appliquent aux positionneurs qui reçoivent des signaux d’entrée analogiques normaux (tels que spécifiés dans l’IEC 60381-1, à l’IEC 60381-2 et à l’IEC 60382) et qui comportent des sorties pneumatiques. Les positionneurs à signaux d’entrée à impulsions ou à entrées numériques, les positionneurs avec contrôleurs numériques et les positionneurs à sorties à impulsions ne relèvent pas du domaine d’application du présent document. Les essais sont réalisés sur un positionneur seul, indépendamment de tout actionneur, ou sur un positionneur monté sur et connecté à un actionneur spécifique, comme dans un dispositif combiné. Le texte stipule clairement les cas où une approche différente est exigée. Les méthodes d’évaluation fournies par le présent document sont destinées à être utilisées par les fabricants afin de déterminer les performances de leurs produits, ainsi que par les utilisateurs ou des organismes d’essai indépendants afin de vérifier les spécifications de performances fournies par les fabricants. Il est indispensable que l’organisme d’évaluation et le fabricant entretiennent un lien étroit pendant les essais, y compris la possibilité pour le fabricant de peser sur le programme d’essai en fonction de ses spécifications relatives à l’instrument et de commenter le programme d’essai et les résultats. Le présent document a pour objet de fournir les définitions des éléments, des actions et des caractéristiques des positionneurs, de spécifier des méthodes uniformes pour mesurer les erreurs de performance et l’effet des grandeurs d’influence sur ces caractéristiques, ainsi que de décrire les méthodes de compte rendu et d’évaluation des résultats des données de mesure obtenues. Les conditions d’essai décrites dans la présente publication (par exemple la plage de températures ambiantes ainsi que l’alimentation en énergie) se rapportent aux conditions d’utilisation les plus courantes. Par conséquent, les valeurs spécifiées sont utilisées lorsque ni l’utilisateur ni le fabricant n’en fournissent d’autres. Si d’autres valeurs sont utilisées, elles sont mentionnées. Il est admis d’appliquer les spécifications et les recommandations du fabricant pour l’installation et l’exploitation à toutes les étapes. Les essais spécifiés dans le présent document ne sont pas nécessairement suffisants pour des instruments spécialement conçus pour des conditions rarement difficiles. À l’inverse, une série d’essais réduite peut suffire pour des instruments conçus pour fonctionner dans une plage de conditions plus limitée. Lorsqu’une évaluation complète conforme au présent document n’est ni exigée ni possible, seuls les essais nécessaires sont effectués et les résultats font l’objet d’un compte-rendu conformément aux parties pertinentes du présent document. Dans ces cas, le rapport d’essai précise qu’il ne couvre pas la totalité des essais spécifiés ici. Cette deuxième édition annule et remplace la première édition parue en 2000. Cette édition constitue une révision technique.<br/>
    Cette édition inclut les modifications techniques majeures suivantes par rapport à l’édition précédente:<br/>
    a) en 6.6.8 et dans le Tableau 5, le champ magnétique a été modifié de 100 A/m à 30 A/m (valeur efficace);<br/>
    b) 6.10.4 et la Figure 9 ont été modifiés pour une meilleure compréhension;<br/>
    c) en 7.4, la référence à l’IEC 61187 a été supprimée et remplacée par un nouveau Tableau 4: Information documentée.
