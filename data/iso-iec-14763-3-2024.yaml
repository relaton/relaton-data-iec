abstract:
- language: en
  script: Latn
  content: |-
    ISO/IEC 14763-3:2024 specifies systems and methods for the inspection and testing of installed optical fibre cabling designed in accordance with premises cabling standards including the ISO/IEC 11801 series. The test methods refer to existing standards-based procedures where they exist.<br/>
    This third edition cancels and replaces the second edition published in 2014 and Amendment 1:2018. This edition constitutes a technical revision.<br/>
    This edition includes the following significant technical changes with respect to the previous edition:<br/>
    a) removal of plastic fibre testing;<br/>
    b) addition of testing of MPO cabling;<br/>
    c) restructuring of the content;<br/>
    d) addition of end-to-end link LSPM testing;<br/>
    e) addition of MPTL LSPM testing;<br/>
    f) addition of measurement uncertainty for all measurement methods;<br/>
    g) introduction of normative inspection for cleanliness to align with the ISO/IEC 11801 series;<br/>
    h) testing will support SM ranges up to 10 km;<br/>
    i) introduction of new test limits for connector attenuation against reference connector;<br/>
    j) introduction of description of reference connectors;<br/>
    k) introduction of recommended cleaning methods.
