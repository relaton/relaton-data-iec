abstract:
- language: en
  script: Latn
  content: |-
    IEC 60335-2-106:2021 deals with the safety of<br/>
    - portable heated carpets;<br/>
    - heated carpets and similar appliances;<br/>
    - heating units to heat the room in which they are located and that are intended to be installed directly under materials used as a removable floor covering such as carpet, cushion vinyl, or loose laid laminate,<br/>
    their rated voltage being not more than 250 V for single-phase installations and 480 V for other installations, including direct current (DC) supplied appliances.<br/>
    Attention is drawn to the fact that<br/>
    - in many countries different wiring rules apply;<br/>
    - for appliances intended to be used in vehicles or on board ships or aircraft, additional requirements can be necessary;<br/>
    - in many countries additional requirements are specified by the national authorities for fire protection, the national authorities for building regulations, the national health authorities, the national authorities responsible for the protection of labour and similar authorities.<br/>
    This standard does not apply to<br/>
    - appliances intended exclusively for industrial purposes;<br/>
    - appliances intended to be used in locations where special conditions prevail, such as the presence of a corrosive or explosive atmosphere (dust, vapour or gas);<br/>
    - blankets, pads and similar flexible heating appliances (IEC 60335-2-17);<br/>
    - heated mats and foot warmers with an area not exceeding 0,5 m2 (IEC 60335-2-81);<br/>
    - flexible sheet heating systems permanently incorporated in the floor of the building structure (IEC 60335-2-96);<br/>
    - flexible heating elements incorporated in other appliances;<br/>
    - battery-operated appliances.<br/>
    This second edition cancels and replaces the first edition published in 2007. This edition constitutes a technical revision.<br/>
    This edition includes the following significant technical changes with respect to the previous edition:<br/>
    a) the text has been aligned with IEC 60335-1:2020;<br/>
    b) some notes have been converted to normative text (Clause 1, 5.2, 5.3, 5.6, 7.12.1, 7.101, 10.1, 18.101.1, 18.101.2, 18.102.5, 19.1, 19.103, 21.1, 21.104, 21.105, 30.102);<br/>
    c) requirements for portable heated carpets have been added (Clause 1, 5.2, 5.5, 6.1, 6.2, 7.1, 7.6, 7.12, 7.14, 7.101, 11.8, 15.1, 15.101, 16.1, 16.2, 16.3, 19.101, 19.102. 19.103, 21.105, 21.106, 24.1.5, 24.2, 29.3);<br/>
    d) requirements for washable portable heated carpets have been added (5.3, 7.1, 7.6, 7.12, 7.14);<br/>
    e) the test of 30.102 has been updated.<br/>
    This Part 2 is to be used in conjunction with the latest edition of IEC 60335-1 and its amendments unless that edition precludes it; in that case, the latest edition that does not preclude it is used. It was established on the basis of the sixth edition (2020) of that standard.
- language: fr
  script: Latn
  content: |-
    L'IEC 60335-2-106:2021 traite de la sécurité des:<br/>
    - tapis chauffants mobiles;<br/>
    - tapis chauffants et appareils analogues;<br/>
    - unités chauffantes destinées à chauffer la pièce dans laquelle elles sont situées et destinées à être installées directement sous des matériaux utilisés comme un revêtement de sol amovible tel qu'un tapis, un revêtement en vinyle ou un stratifié à pose flottante,<br/>
    dont la tension assignée est inférieure ou égale à 250 V pour les installations monophasées et à 480 V pour les autres installations, y compris les appareils alimentés en courant continu.<br/>
    L'attention est attirée sur le fait que:<br/>
    - dans de nombreux pays, des règles d'installation différentes s'appliquent;<br/>
    - pour les appareils destinés à être utilisés dans des véhicules ou à bord de navires ou d'avions, des exigences supplémentaires peuvent être nécessaires;<br/>
    - dans de nombreux pays, des exigences supplémentaires sont spécifiées par les organismes nationaux responsables de la protection contre l'incendie, par les organismes nationaux responsables des règlements d'installation, par les organismes nationaux de la santé, par les organismes nationaux responsables de la protection des travailleurs et par des organismes similaires.<br/>
    La présente norme ne s'applique pas<br/>
    - aux appareils prévus exclusivement pour des usages industriels;<br/>
    - aux appareils destinés à être utilisés dans des locaux qui présentent des conditions particulières, telles que la présence d'une atmosphère corrosive ou explosive (poussière, vapeur ou gaz);<br/>
    - aux couvertures, coussins, vêtements et appareils chauffants souples analogues (IEC 60335-2-17);<br/>
    - aux chancelières et carpettes chauffantes électriques dont la surface est inférieure ou égale à 0,5 m2 (IEC 60335-2-81);<br/>
    - aux films souples chauffants intégrés au plancher de la structure des bâtiments (IEC 60335-2-96);<br/>
    - aux éléments chauffants souples incorporés dans d'autres appareils;<br/>
    - aux appareils alimentés par batteries.<br/>
    Cette édition inclut les modifications techniques majeures suivantes par rapport à l'édition précédente:<br/>
    a) alignement du texte sur l'IEC 60335-1:2020;<br/>
    b) conversion en texte normatif de certaines notes (Article 1, 5.2, 5.3, 5.6, 7.12.1, 7.101, 10.1, 18.101.1, 18.101.2, 18.102.5, 19.1, 19.103, 21.1, 21.104, 21.105, 30.102);<br/>
    c) ajout d'exigences pour les tapis chauffants mobiles (Article 1, 5.2, 5.5, 6.1, 6.2, 7.1, 7.6, 7.12, 7.14, 7.101, 11.8, 15.1, 15.101, 16.1, 16.2, 16.3, 19.101, 19.102, 19.103, 21.105, 21.106, 24.1.5, 24.2, 29.3);<br/>
    d) ajout d'exigences pour les tapis chauffants mobiles lavables (5.3, 7.1, 7.6, 7.12, 7.14);<br/>
    e) mise à jour de l'essai du 30.102.<br/>
    La présente Partie 2 doit être utilisée conjointement avec la dernière édition de l'IEC 60335-1 et ses amendements, sauf si cette édition l'exclut. Dans ce cas, la dernière édition qui n'exclut pas la présente Partie 2 est utilisée. Elle a été établie sur la base de la sixième édition (2020) de cette norme.
