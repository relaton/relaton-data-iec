abstract:
- content: "IEC 61169-1-3:2026 is applicable to built-in devices (hereinafter referred
    to as \"SPD\" - surge protective device) or surge protection of telecommunications
    and signalling networks against indirect and direct effects of lightning or other
    transient over voltages.<br />\r\nAn SPD is intended to protect the electrical
    apparatus from transient over voltages and to divert surge currents.<br />\r\nThe
    SPD built in the coaxial connector can be a gas discharge tube type, a ¼ wavelength
    short stub type, a flash-off gap type, and a hybrid type thereof.<br />\r\nThe
    purpose of these built-in SPD is to protect modern electronic equipment connected
    to telecommunications and signalling networks with nominal system voltages up
    to 1 000 V (RMS) AC and 1 500 V DC."
  language:
  - en
  script:
  - Latn
  format: text/html
- content: "L’IEC 61169-1-3:2026 est applicable aux dispositifs intégrés (appelés
    ci-dessous parafoudres ou SPD) ou à la protection des réseaux de télécommunications
    et de signalisation contre les surtensions, y compris les effets directs et indirects
    de la foudre ou d'autres surtensions transitoires.<br />\r\nUn parafoudre est
    destiné à protéger l'appareillage électrique contre les surtensions transitoires
    et à dévier les courants de choc.<br />\r\nLe parafoudre intégré dans le connecteur
    coaxial peut être de type tube à décharge de gaz, de type à ligne courte quart
    d'onde, de type à espace d'évaporation, et d'un type hybride de ceux-ci.<br />\r\nL'objectif
    de ces parafoudres intégrés est de protéger les équipements électroniques modernes
    connectés à des réseaux de télécommunications et de signalisation au moyen de
    tensions de système nominales allant jusqu'à 1 000 V (valeur efficace) en courant
    alternatif et 1 500 V en courant continu."
