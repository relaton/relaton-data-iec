abstract:
- language: en
  script: Latn
  content: |-
    IEC 60519-4:2021 provides particular safety requirements for arc furnace installations. This document deals with the significant hazards, hazardous situations or hazardous events relevant to industrial arc furnace installations, as listed in Annex A, for normal operation and for single fault condition as well as under conditions of reasonably foreseeable misuse.<br/>
    This fifth edition cancels and replaces the fourth edition published in 2013. This edition constitutes a technical revision.<br/>
    This edition includes the following significant technical changes with respect to the previous edition:<br/>
    - the structure has been redrafted according to IEC 60519-1:2020;<br/>
    - the scope and object have been redrafted;<br/>
    - the terms and definitions, normative references and bibliography have been updated and completed;<br/>
    - the requirements have been redrafted according to IEC 60519-1:2020;<br/>
    - all provisions have been redrafted and the text is more concise with respect to submerged arc furnace installations;<br/>
    - the annexes have been restructured, with respect to details concerning high voltage designs and non-electrical issues, however to be aware of in those installations;<br/>
    - the aspect of noise has been removed from the scope;<br/>
    - the EMC requirements have been clarified;<br/>
    - risk classification of hazards have been based on emission;<br/>
    - the boundaries to ISO 13577 (all parts) and ISO 13578 have been clarified.
- language: fr
  script: Latn
  content: |-
    L'IEC 60519-4:2021 fournit des exigences de sécurité particulières pour les installations de fours à arc. Le présent document traite des dangers significatifs, des situations dangereuses ou des événements dangereux liés aux installations industrielles de fours à arc, répertoriés à l'Annexe A, en fonctionnement normal et en condition de premier défaut, ainsi qu'en cas de mauvais usage raisonnablement prévisible. Cette cinquième édition annule et remplace la quatrième édition parue en 2013. Cette édition constitue une révision technique.<br/>
    Cette édition inclut les modifications techniques majeures suivantes par rapport à l'édition précédente:<br/>
    - la structure a été remaniée sur la base de l'IEC 60519-1:2020;<br/>
    - le domaine d'application et l'objet ont été reformulés;<br/>
    - les termes et définitions, les références normatives et la bibliographie ont été mis à jour et complétés;<br/>
    - les exigences ont été remaniées sur la base de l'IEC 60519-1:2020;<br/>
    - toutes les dispositions ont été reformulées et le texte relatif aux installations de fours à arc submergé est plus concis;<br/>
    - les annexes ont été restructurées, en ce qui concerne les détails relatifs aux conceptions haute tension et aux problèmes non électriques, mais dont il faut tenir compte dans le cadre de ces installations;<br/>
    - l'aspect relatif au bruit a été retiré du domaine d'application;<br/>
    - les exigences de CEM ont été clarifiées;<br/>
    - la classification des risques et des dangers a été établie en fonction des émissions;<br/>
    - les limites ont été clarifiées selon l'ISO 13577 (toutes les parties) et l'ISO 13578.
