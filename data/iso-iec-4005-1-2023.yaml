abstract:
- language: en
  script: Latn
  content: |-
    <p class="MsoBodyText">This document describes a communication model and requirements for unmanned aircraft area network (UAAN), which is a wireless distributed communication network for units related with UA services in level II. </p>
    <p class="MsoBodyText">It describes:</p>
    <p class="ListContinue1" style="mso-list: l0 level1 lfo1;"><!-- [if !supportLists]-->—     <!--[endif]-->the communication structure and operation; </p>
    <p class="ListContinue1" style="mso-list: l0 level1 lfo1;"><!-- [if !supportLists]-->—     <!--[endif]-->the purpose of the three types of communication and related services; </p>
    <p class="ListContinue1" style="mso-list: l0 level1 lfo1;"><!-- [if !supportLists]-->—     <!--[endif]-->the interoperation of the three types of communication; </p>
    <p class="ListContinue1" style="mso-list: l0 level1 lfo1;"><!-- [if !supportLists]-->—     <!--[endif]-->the interworking with upper layers.</p>
