abstract:
- language: en
  script: Latn
  content: "IEC 81346-14:2026, published jointly by IEC and ISO, provides, in combination
    with IEC 81346‑1 and IEC 81346‑2, rules and recommendations on the structuring
    of systems and the information on systems of manufacturing systems. It also provides
    additional classification schemes to those of IEC 81346‑2 for use in reference
    designations within manufacturing systems. It is published as a double logo standard.<br
    />\r\nThe structuring principles and the classes of objects are intended to provide
    a clear identification and localization of the objects, and for use in their labelling
    in the manufacturing plant, for their designation in technical documents and for
    the designation of the technical documents as well.<br />\r\nThe requirements
    in this document apply for processing, transportation and storage of products,
    as well as for systems to support the manufacturing process such as electrical
    systems, management systems and waste disposal systems.<br />\r\nThis document
    applies to different areas within the manufacturing industry such as light industry,
    electrical and optical industry, chemical industry, material industry and heavy
    industry.<br />\r\nThis document is not applicable for designations related to
    product individuals (e.g. inventory number, serial number) nor to the products
    manufactured.<br />\r\nThis document is also a horizontal publication intended
    for use by technical committees in preparation of publications related to reference
    designations in accordance with the principles laid down in IEC Guide 108."
- language: fr
  script: Latn
  content: "L'IEC 81346-14:2026, publiée conjointement par l’IEC et l’ISO, fournit,
    en combinaison avec l’IEC 81346‑1 et l’IEC 81346‑2, des règles et recommandations
    sur la structuration des systèmes, ainsi que des informations sur les systèmes
    de fabrication. Elle fournit également des hiérarchies de classification supplémentaires
    qui viennent compléter celles de l’IEC 81346‑2 pour une utilisation dans les désignations
    de référence au sein des systèmes de fabrication. Elle est publiée en tant que
    norme double logo.<br />\r\nLes principes de structuration et les classes d’objets
    sont destinés à permettre une identification et une localisation claires des objets.
    Ils sont conçus pour être utilisés sur l’étiquetage des objets au sein de l’installation
    de fabrication, pour désigner ces objets dans les documents techniques et pour
    désigner les documents techniques également.<br />\r\nLes exigences du présent
    document s’appliquent au traitement, au transport et au stockage des produits,
    ainsi qu’aux systèmes destinés à soutenir le processus de fabrication, tels que
    les systèmes électriques, les systèmes de gestion et les systèmes d’élimination
    des déchets.<br />\r\nLe présent document s’applique à différents domaines de
    l’industrie manufacturière, tels que l’industrie légère, l’industrie électrique
    et optique, l’industrie chimique, l’industrie des matériaux et l’industrie lourde.<br
    />\r\nLe présent document ne s’applique pas aux désignations liées aux produits
    individuels (par exemple numéro d’inventaire, numéro de série) ni aux produits
    fabriqués.<br />\r\nLe présent document est également une publication horizontale
    destinée à être utilisée par les comités techniques pour l’établissement de publications
    liées aux désignations de référence conformément aux principes exposés dans le
    Guide 108 de l’IEC."
