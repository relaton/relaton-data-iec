abstract:
- language: en
  script: Latn
  content: |-
    IEC 62885-2:2026 is applicable for measurements of the performance of mains-operated and cordless dry vacuum cleaners, including water filter vacuum cleaners for household or similar use. Table D.1 of Annex D is applicable to measurements of the performance of cordless dry vacuum cleaners for household use or under conditions similar to those in households. The results obtained under this annex are intended to be comparable to the results obtained for mains-operated vacuum cleaners. The purpose of Annex D is to specify additional requirements for measurements of cordless dry vacuum cleaners. Cleaning robots are evaluated to IEC/ASTM 62885-7. Handheld dry vacuum cleaners are excluded, except for 5.10.2 and 5.11. Measurements of the performance of mains-operated commercial dry vacuum cleaners are found in IEC 62885-8. The purpose of this document is to specify essential performance characteristics of dry vacuum cleaners which are of interest to users and to describe methods for measuring these characteristics. Due to the influence of environmental conditions, variations in time, origin of test materials and proficiency of the operator, some of the described test methods will give more reliable results when applied for comparative testing of a number of appliances at the same time, in the same laboratory and by the same operator. The methods here can be applied with modifications for surface-cleaning product types or technologies not currently covered within the scope. For safety requirements, reference is made to IEC 60335-1:2020 and IEC 60335-2-2. A recommendation on information for the consumer at the point of sale is given in Annex B. This third edition of IEC 62885-2 cancels and replaces the second edition published in 2021. This edition constitutes a technical revision.<br/>
    This edition includes the following significant technical changes with respect to the previous edition:<br/>
    a) relocation of RSB annexes to IEC TS 62885-1;<br/>
    b) relocation of remaining test materials, test dust, and equipment to IEC TS 62885-1;<br/>
    c) reduced number of test strokes from 5 double strokes to 3 double strokes except as specifically required;<br/>
    d) relocated requirements for cordless products, except for battery-related items, from IEC 62885-4 to a new Annex D;<br/>
    e) added definition and instructions for a universal dry nozzle;<br/>
    f) relocated air data equipment to IEC TS 62885-1, relocated formulae to 5.11, and made revisions to air data requirements;<br/>
    g) relocated dust re-emission equipment to IEC TS 62885-1.
