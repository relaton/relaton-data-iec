abstract:
- language: en
  script: Latn
  content: |-
    IEC 61851-23-3:2026 applies to the EV supply equipment to provide energy transfer between the supply network and electric vehicles (EVs), with a rated maximum voltage at side A (supply network side) up to 1 000 V AC or up to 1 500 V DC and a rated maximum voltage at side B (EV side) up to 1 250 V DC.<br/>
    This document specifies the EV supply equipment of megawatt charging system (MCS) equipped with a coupler according to IEC TS 63379. Systems different to MCS using a coupler specified in IEC TS 63379 are under consideration.<br/>
    The requirements for bidirectional power flow systems are under consideration.<br/>
    This document does not cover all safety aspects related to maintenance.<br/>
    This document specifies systems with protective separation between side A and side B.<br/>
    The requirements for digital communication between the EV supply equipment and the EV for control of energy transfer are defined in ISO 15118-10 and ISO 15118-20.<br/>
    EV supply equipment in compliance with this document is not intended to provide energy transfer to a single EV using<br/>
    – multiple vehicle connectors of the same EV supply equipment, or<br/>
    – multiple EV supply equipment.<br/>
    The requirements for such use cases are not specified in this document but are under consideration.<br/>
    The requirements for EVs mated to EV supply equipment according to this document are specified in ISO 5474-3:2024, Annex B.
- language: fr
  script: Latn
  content: |-
    IEC 61851-23-3:2026 s’applique aux systèmes d’alimentation pour VE afin de permettre un transfert d’énergie entre le réseau d’alimentation et les véhicules électriques (VE), avec une tension maximale alternative assignée de 1 000 V ou une tension maximale continue assignée de 1 500 V du côté A (côté réseau d’alimentation) et une tension maximale continue assignée de 1 250 V du côté B (côté VE).<br/>
    Le présent document spécifie le système d’alimentation pour VE du système de recharge mégawatt (MCS, Megawatt Charging System) équipé d’un connecteur conformément à l’IEC TS 63379. Les systèmes autres que le MCS qui utilisent l’un des connecteurs spécifiés dans l’IEC TS 63379 sont à l’étude.<br/>
    Les exigences relatives aux systèmes à flux de puissance bidirectionnels sont à l’étude.<br/>
    Le présent document ne couvre pas tous les aspects de sécurité relatifs à la maintenance.<br/>
    Le présent document spécifie les systèmes avec une séparation de protection entre le côté A et le côté B.<br/>
    Les exigences relatives à la communication numérique entre le système d’alimentation pour VE et le VE à des fins de contrôle du transfert d’énergie sont définies dans l’ISO 15118-10 et l’ISO 15118-20.<br/>
    Les systèmes d’alimentation pour VE conformes au présent document ne sont pas destinés à fournir un transfert d’énergie à un seul VE en utilisant:<br/>
    – plusieurs prises mobiles de véhicule du même système d’alimentation pour VE, ou<br/>
    – plusieurs systèmes d’alimentation pour VE.<br/>
    Les exigences relatives à ces cas d’utilisation ne sont pas spécifiées dans le présent document, mais sont à l’étude.<br/>
    Les exigences relatives aux véhicules électriques raccordés à un système d’alimentation pour VE conformément au présent document sont spécifiées dans l’ISO 5474-3:2024, Annexe B.
