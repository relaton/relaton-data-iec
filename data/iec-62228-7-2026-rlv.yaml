abstract:
- language: en
  script: Latn
  content: |-
    IEC 62228-7:2026 RLV contains both the official IEC International Standard and its Redline version. The Redline version is available in English only and provides you with a quick and easy way to compare all the changes between the official IEC Standard and its previous edition.<br/>
    <br/>
    IEC 62228-7:2026 specifies test and measurement methods for the EMC evaluation of CXPI transceiver ICs under network condition. It defines test configurations, test conditions, test signals, failure criteria, test procedures, test setups and test boards. This specification is applicable for standard CXPI transceiver ICs and ICs with embedded CXPI transceiver and covers:<br/>
    - the emission of RF disturbances;<br/>
    - the immunity against RF disturbances;<br/>
    - the immunity against impulses;<br/>
    - the immunity against electrostatic discharges (ESD).<br/>
    This edition includes the following significant technical changes with respect to the previous edition:<br/>
    a) change transceiver terms and definitions from master to commander and slave to responder in 3.1.5 and 3.1.6.<br/>
    b) change test configuration for embedded transceiver in 5.3.1 and add on Figure A.4 accordingly.<br/>
    c) change the definition of TX2 test signal for Type-B transceiver in 5.4.2.<br/>
    d) add examples for test limits in Annex C.
