abstract:
- language: en
  script: Latn
  content: |-
    IEC 60335-2-49:2021 RLV contains both the official IEC International Standard and its Redline version. The Redline version is available in English only and provides you with a quick and easy way to compare all the changes between the official IEC Standard and its previous edition.<br/>
    <br/>
    IEC 60335-2-49:2021 deals with the safety of electrically operated commercial appliances for keeping food and crockery warm, their rated voltage being not more than 250 V for single-phase appliances connected between one phase and neutral, and 480 V for other appliances.<br/>
    Examples of appliances that are within the scope of this standard are:<br/>
    – hot cupboards, with or without heated tops;<br/>
    – heated tops;<br/>
    – heated display cases;<br/>
    – heated crockery dispensers;<br/>
    – heated tables;<br/>
    – radiant heaters.<br/>
    These appliances are not intended for household and similar purposes. They are used for commercial purposes, processing of food, also in areas open to the public, for example in kitchens of restaurants, canteens, hospitals and in commercial enterprises, such as bakeries and butcheries.<br/>
    The electrical part of appliances making use of other forms of energy is also within the scope of this standard.<br/>
    As far as is practicable, this standard deals with the common hazards presented by these types of appliances.<br/>
    Attention is drawn to the fact that:<br/>
    – for appliances intended to be used in vehicles or on board ships or aircraft, additional requirements can be necessary;<br/>
    – in many countries, additional requirements are specified by the national health authorities, the national authorities responsible for the protection of labour, the national water supply authorities and similar authorities;<br/>
    – in many countries, additional requirements are specified for pressure appliances.<br/>
    This standard does not apply to:<br/>
    – appliances designed exclusively for industrial purposes;<br/>
    – appliances intended to be used in locations where special conditions prevail, such as the presence of a corrosive or explosive atmosphere (dust, vapour or gas);<br/>
    – appliances for continuous mass production of food;<br/>
    – commercial electric bains-marie (IEC 60335-2-50);<br/>
    – battery-operated appliances;<br/>
    – warming plates and similar appliances for household use covered by IEC 60335-2-12 used in the following environments by laymen: staff kitchen areas in shops, offices and other working environments, farm houses, hotels, motels and other residential type environments, bed and breakfast type environments.<br/>
    This fifth edition cancels and replaces the fourth edition published in 2002, Amendment 1:2008 and Amendment 2:2017. This edition constitutes a technical revision.<br/>
    This edition includes the following significant technical changes with respect to the previous edition:<br/>
    a) the text has been aligned with IEC 60335-1:2020;<br/>
    b) introduction of requirements for appliances intended for use in areas open to the public, including external accessible surface temperatures (Clause 1, 7.12, 11.8, Table 102);<br/>
    c) exclusion of battery-operated appliances (Clause 1);<br/>
    d) clarification of applicable standard for appliances for use by laymen (Clause 1, 7.12);<br/>
    e) relocation of cleaning instructions from 7.12.1 to 7.12;<br/>
    f) relocation of 24.101 to 22.106;<br/>
    g) conciliation of the text of IEC 60335-2-49 with other standards under IEC/TC61/MT32;<br/>
    h) some notes have been converted to normative text, modified or deleted (Clause 1, 7.1, 7.15, 11.3, 11.7, 15.2, 19.2, 22.101, 23.3);<br/>
    i) additional requirements for measurement of input current;<br/>
    j) clarification of the testing procedure in 15.1.1;<br/>
    k) clarification of the test conditions in 20.1 and 23.3;<br/>
    l) clarifications of the requirements in 25.3.<br/>
