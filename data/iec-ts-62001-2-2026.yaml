abstract:
- language: en
  script: Latn
  content: |-
    IEC TS 62001-2:2026 gives a guidance to the specification and design evaluation of AC filters of high-voltage direct current HVDC) systems, specifically on harmonic performance aspects. This document focusses on three specific areas of interest. Clause 4 discusses telephone interference related to the operation of HVDC transmission, including the derivation of appropriate harmonic limits. Clause 5 deals with all aspects of current-based harmonic performance criteria and their application. Clause 6 is concerned with field measurement and verification of compliance with specified harmonic limits.<br/>
    This document concentrates on passive AC filter technology and line-commutated high-voltage direct current (HVDC) converters, but much of the content is equally relevant to VSC converter technology. Where there is a distinction, this is indicated in the text.<br/>
    The scope of this document covers AC side filtering for the frequency range of interest in terms of harmonic distortion and audible frequency disturbances. It excludes filters specifically designed to be effective in the PLC and radio interference spectra.<br/>
    This edition includes the following significant technical changes with respect to IEC TR 62001‑2:2016:<br/>
    a) added Clause 3 on terms and definitions;<br/>
    b) split old Clause 3 to form new Clause 4 and Clause 5;<br/>
    c) extensive updating of text to reflect progress in time;<br/>
    d) transferred most of IEC TR 62001‑3:2016, Annex C, to Clause 6.
