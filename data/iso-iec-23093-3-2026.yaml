abstract:
- language: en
  script: Latn
  content: |-
    <p>This document specifies the syntax and semantics of description schemes for representing data exchanged by media things (e.g. media sensors, media actuators, and media storages). Moreover, it specifies the APIs to exchange these data between media things. The following interfaces are under the scope of this document:</p>

    APIs for accessing media sensors, actuators, storage, managers, controllers, and aggregators;
    structured data formats (XML) representing media thing’s base data types, including sensors, actuators, storage, managers, aggregators, controllers, and their elements;
    structured data formats (XML) representing the media sensor’s output data; and,
    structured data formats (XML) representing media actuator’s commands.

    <p>This document does not specify how sensing and actuating are carried out but defines the interfaces between the media things.</p>
