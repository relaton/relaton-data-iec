abstract:
- language: en
  script: Latn
  content: |-
    IEC 60115-8-10:2026 is applicable to the drafting of detail specifications for surface mount (SMD) low-power film resistors, classified to level G, based on the definition of the product classification levels in IEC 60115‑1:2020, 3.4.<br/>
    This edition includes the following significant technical changes with respect to the previous edition IEC 60115‑8‑1:2014:<br/>
    a) it supports solderability testing for both traditional lead-bearing soldering and up-to-date lead-free soldering, as required;<br/>
    b) it supports the provision of detailed visual acceptance criteria;<br/>
    c) it includes the requirement for a visual examination of the primary and proximity packaging;<br/>
    d) it provides for the inclusion of specific visual acceptance criteria, to be applied in addition to those given in Annex B of the sectional specification IEC 60115‑8:2023.
- language: fr
  script: Latn
  content: |-
    L'IEC 60115-8-10:2026 s'applique à la rédaction de spécifications particulières couvrant les résistances à couche, à faible dissipation pour montage en surface (CMS), classées niveau G selon la définition des niveaux de classification de produit donnée dans l'IEC 60115‑1:2020, 3.4.<br/>
    Cette édition inclut les modifications techniques majeures suivantes par rapport à l'édition précédente, l'IEC 60115‑8‑1:2014:<br/>
    a) acceptation des essais de brasabilité couvrant à la fois la brasure traditionnelle contenant du plomb et la brasure plus contemporaine, sans plomb, selon ce qui est exigé,<br/>
    b) prise en charge de la spécification de critères d'acceptation visuelle détaillés,<br/>
    c) spécification d'une exigence d'examen visuel portant sur l'emballage principal et l'emballage de proximité,<br/>
    d) inclusion de critères d'acceptation visuelle spécifiques, s'appliquant en complément de ceux donnés à l'Annexe B de la spécification intermédiaire IEC 60115‑8:2023.
