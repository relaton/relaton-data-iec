abstract:
- language: en
  script: Latn
  content: |-
    IEC 62321-14:2026 specifies one technique for the determination of short-chain and medium-chain chlorinated paraffins (SCCPs: C10-C13 and MCCPs: C14-C17) in plastics of electrotechnical products.<br/>
    This document specifies a quantitative method for the determination of short-chain and medium-chain chlorinated paraffins in electrotechnical products by means of solvent extraction and gas chromatography-negative chemical ionization-mass spectrometry (GC-NCI-MS).<br/>
    This document is a basic environment horizontal publication focusing on test methods and is primarily intended for use by committees in the preparation of publications within the area of environment in accordance with the principles laid down in IEC Guide 123. Wherever applicable, it is the responsibility of committees to make use of environment basic publications in the preparation of their environment group and product publications. Committees can apply this document directly to products when they do not develop a product publication in the area of environment.<br/>
    WARNING – Persons using this International Standard should be familiar with normal laboratory practice. This International Standard does not purport to address all of the safety problems, if any, associated with its use. It is the responsibility of the user to establish appropriate safety and health practices and to ensure compliance with any national regulatory conditions.
- language: fr
  script: Latn
  content: |-
    L'IEC 62321-14:2026 spécifie une technique pour la détermination des paraffines chlorées à chaîne courte et à chaîne moyenne (PCCC: C10‑C13 et PCCM: C14‑C17) dans les plastiques des produits électrotechniques.<br/>
    Le présent document spécifie une méthode quantitative pour la détermination des paraffines chlorées à chaîne courte et à chaîne moyenne dans les produits électrotechniques au moyen de l'extraction par solvant et de la chromatographie en phase gazeuse couplée à la spectrométrie de masse avec ionisation chimique négative (GC‑NCI‑MS).<br/>
    Le présent document est une publication horizontale environnementale fondamentale qui met l'accent sur les méthodes d'essai et est principalement destiné à être utilisé par les comités pour l'élaboration de publications relevant du domaine de l'environnement, conformément aux principes énoncés dans le Guide 123 de l'IEC. Le cas échéant, il incombe aux comités d'utiliser les publications environnementales fondamentales dans le cadre de l'élaboration de leurs publications environnementales et leurs publications de produits. Les comités peuvent appliquer le présent document directement aux produits lorsqu'ils n'élaborent pas de publication de produit dans le domaine de l'environnement.<br/>
    AVERTISSEMENT – Il convient que les personnes qui utilisent la présente Norme internationale aient une bonne connaissance des pratiques normales de laboratoire. La présente Norme internationale ne prétend pas traiter tous les problèmes de sécurité éventuels associés à son utilisation. Il incombe à l'utilisateur de mettre en place les pratiques adéquates en matière de sécurité et de santé, mais aussi d'assurer la conformité aux conditions réglementaires nationales.
