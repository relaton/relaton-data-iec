abstract:
- language: en
  script: Latn
  content: |-
    <p>IEC 60086-2-2:2026 is applicable to primary batteries which are based on standardised lithium (non-aqueous) electrochemical systems.<br/>
    It specifies:<br/>
    - the physical dimensions,<br/>
    - the discharge test conditions and discharge performance requirements.<br/>
    This first edition cancels and replaces the fourteenth edition of IEC 60086-2 published in 2021. This edition constitutes a technical revision.<br/>
    This edition includes the following significant technical changes with respect to the previous edition:<br/>
    a) separation of batteries with aqueous electrolyte into a separate Part 2-1: Physical and electrical specifications;<br/>
    b) maximum open circuit voltage of FR10G445 and FR14505 was changed from 1,83 to 1,90 V;<br/>
    c) load of digital audio test for FR10G445 was changed from 50 mA to 75 mA and MAD was modified;<br/>
    d) portable lighting test was added for FR10G445;<br/>
    e) motor/toy and radio /clock /remote control test was added for FR14505;<br/>
    f) in Clause 3, terms were reordered according their functions: electrochemical systems, electrochemical systems, electrical characteristics and specifications;<br/>
    g) Annex D for common designation of IEC 60086 2:2021 was moved to IEC 60086 1:2026, as Annex H;<br/>
    h) Annex E for Compliance checklist of IEC 60086 2:2021 was removed and merged into Annex J of IEC 60086 1:2026.</p>
- language: fr
  script: Latn
  content: |-
    L'IEC 60086-2-2:2026 s’applique aux piles électriques qui sont basées sur des systèmes électrochimiques normalisés au lithium (électrolyte non aqueux).<br/>
    Elle spécifie:<br/>
    - les dimensions physiques;<br/>
    - les conditions d’essai de décharge et les exigences relatives aux performances de décharge.<br/>
    Cette première édition annule et remplace la quatorzième édition de l’IEC 60086-2 parue en 2021. Cette édition constitue une révision technique.<br/>
    Cette édition inclut les modifications techniques majeures suivantes par rapport à l’édition précédente:<br/>
    a) séparation des piles à électrolyte aqueux dans une Partie 2-1 indépendante: Spécifications physiques et électriques;<br/>
    b) modification de 1,83 V à 1,90 V de la tension en circuit ouvert maximale des désignations FR10G445 et FR14505;<br/>
    c) modification de 50 mA à 75 mA de la charge de l’essai audio numérique pour la désignation FR10G445, et modification de la MAD;<br/>
    d) ajout de l’essai d’éclairage portatif pour la désignation FR10G445;<br/>
    e) ajout de l’essai jouet (motorisé) et de l’essai radio/horloge/télécommande pour la désignation FR14505;<br/>
    f) dans l’Article 3, les termes ont été réorganisés selon leurs fonctions: termes de base, systèmes électrochimiques, caractéristiques électriques et spécifications;<br/>
    g) déplacement dans l’IEC 60086-1:2026, en qualité d’Annexe H, de l’Annexe D de l’IEC 60086-2:2021 donnant les désignations communes;<br/>
    h) suppression de l’Annexe E Liste de contrôle de conformité de l’IEC 60086 2:2021 et fusion avec l’Annexe J de l’IEC 60086 1:2026.
