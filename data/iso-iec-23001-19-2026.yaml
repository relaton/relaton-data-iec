abstract:
- language: en
  script: Latn
  content: |-
    <p>This document defines a storage and delivery format for metadata for energy-efficient decoding, encoding, presentation, and selection of media (green metadata) as defined in ISO/IEC 23001-11. The green metadata are timed metadata which can be associated with other tracks in the ISO Base Media File Format. Timed metadata such as power consumption information and their metrics are defined in this document for carriage in files based on ISO/IEC 14496-12.</p>
    <p>In the context of DASH delivery, the green metadata representations and their association to the media representations are also defined using the signalling mechanisms specified in ISO/IEC 23009-1:2022 and ISO/IEC 23009-3[1].</p>
    <p>These metadata can be used for multiple purposes, including optimizing power consumption during playback and supporting dynamic adaptive streaming.</p>
