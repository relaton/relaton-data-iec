abstract:
- language: en
  script: Latn
  content: |-
    IEC 61753-042-02:2026 contains the minimum initial performance, test and measurement requirements and severities for plug-pigtail style and plug-receptacle style OTDR reflecting devices to meet the requirements of category C-Controlled environments, as specified in Annex A of IEC 61753-1. These devices are utilized for out-of-band OTDR testing of an optical fibre system. Annex B provides information concerning these devices.<br/>
    This first edition cancels and replaces the first edition of IEC 61753-042-2, published in 2014, and constitutes a technical revision.<br/>
    This edition includes the following significant technical changes with respect to IEC 61753‑042‑2:<br/>
    a) harmonization of test requirements with the requirements specified in IEC 61753-1:2018
- language: fr
  script: Latn
  content: |-
    L’IEC 61753-042-02:2026 contient les exigences et les sévérités initiales minimales de performance, d'essai et de mesure auxquelles les dispositifs de réflexion pour OTDR de modèle à fiche-fibre amorce et modèle à fiche-embase doivent satisfaire pour être classés conformes aux exigences de la catégorie C-environnements contrôlés, comme cela est défini dans l'Annexe A de l'IEC 61753-1. Ces dispositifs sont utilisés pour les essais hors bande par OTDR d'un système fibronique. L'Annexe B fournit des informations concernant ces dispositifs.<br/>
    Cette deuxième édition annule et remplace la première édition de l'IEC 61753-042-2 parue en 2014. Elle constitue une révision technique.<br/>
    Cette édition inclut les modifications techniques significatives suivantes par rapport à l’IEC 61753‑042‑2:<br/>
    a) harmonisation des exigences d'essai avec les exigences spécifiées dans l'IEC 61753­-1:2018
