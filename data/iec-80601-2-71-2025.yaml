abstract:
- language: en
  script: Latn
  content: |-
    IEC 80601-2-71:2025 applies to the BASIC SAFETY and ESSENTIAL PERFORMANCE of FUNCTIONAL NIRS EQUIPMENT, as defined in 201.3.205, intended to be used by itself, or as a part of an ME SYSTEM hereinafter referred to as ME EQUIPMENT.<br/>
    HAZARDS inherent in the intended physiological function of ME EQUIPMENT or ME SYSTEMS within the scope of this document are not covered by specific requirements in this document except in IEC 60601-1:2005, IEC 60601-1:2005/AMD1:2012 and IEC 60601-1:2005/AMD2:2020, 7.2.13 and 8.4.1.<br/>
    This document is not applicable to<br/>
    – equipment for the measurement of oxygen saturation of the haemoglobin in the micro vessels (capillaries, arterioles and venules), i.e. tissue oximeters;<br/>
    – frequency-domain and time-domain equipment for functional near-infrared spectroscopy;<br/>
    – equipment for the measurement of changes in the concentration of chromophores other than oxy- and deoxy-haemoglobin;<br/>
    – equipment for the measurement of changes in the concentration of oxy- and deoxy-haemoglobin in tissues other than the brain.<br/>
    This document does not specify the requirements for:<br/>
    – cerebral tissue oximeter equipment, which are given in ISO 80601-2-85; and<br/>
    – pulse oximeter equipment, which are given in ISO 80601-2-61.<br/>
    IEC 80601-2-71:2025 cancels and replaces the first edition published in 2015. This edition constitutes a technical revision.<br/>
    This edition includes the following significant technical changes with respect to the previous edition:<br/>
    a) alignment with IEC 60601-1:2005, IEC 60601-1:2005/AMD1:2012, IEC 60601-1:2005/AMD2:2020, IEC 60601-1-8:2006, IEC 60601-1-8:2006/AMD1:2012, IEC 60601-1-8:2006/AMD2:2020, IEC 60601-1-2:2014, IEC 60601-1-2:2014/AMD1:2020, IEC 60601-1-6:2010, IEC 60601-1-6:2010/AMD1:2013 and IEC 60601-1-6:2010/AMD2:2020;<br/>
    b) added requirements for ESSENTIAL PERFORMANCE;<br/>
    c) added requirements for PRIMARY OPERATING FUNCTIONS;<br/>
    d) added requirements for protection against excessive temperatures;<br/>
    e) added requirements for the display legibility for OPERATORS wearing personal protective equipment;<br/>
    f) harmonization with ISO 20417, where appropriate.
- language: fr
  script: Latn
  content: |-
    L'IEC 60601-2-71:2025 s'applique à la SECURITE DE BASE et aux PERFORMANCES ESSENTIELLES des ELECTROMYOGRAPHES et des APPAREILS A POTENTIEL EVOQUE, désignés ci-après sous le terme APPAREILS EM.<br/>
    Si un article ou un paragraphe est spécifiquement destiné à être applicable uniquement aux APPAREILS EM, ou uniquement aux SYSTEMES EM, le titre et le contenu de cet article ou de ce paragraphe l’indiquent. Si cela n’est pas le cas, l’article ou le paragraphe s’applique à la fois aux APPAREILS EM et aux SYSTEMES EM, selon le cas.<br/>
    Les APPAREILS EM suivants sont exclus de la liste:<br/>
    • APPAREILS EM destinés à une application thérapeutique;<br/>
    • APPAREILS EM destinés à être utilisés avec les neurostimulateurs électriques transcutanés et les stimulateurs musculaires électriques (APPAREILS EM couverts par l'IEC 60601-2-10).<br/>
    L'IEC 60601-2-71:2025 annule et remplace la deuxième édition parue en 2016. Cette édition constitue une révision technique.<br/>
    Cette édition inclut les modifications techniques majeures suivantes par rapport à l'édition précédente:<br/>
    a) des exigences relatives aux stimulateurs à tension constante ont été ajoutées;<br/>
    b) des exigences relatives aux STIMULATEURS VISUELS ont été clarifiées.<br/>
    L'IEC 80601-2-71:2025 concerne la SECURITE DE BASE et aux PERFORMANCES ESSENTIELLES des APPAREILS NIRS FONCTIONNELLE, définis au 201.3.205, destinés à être utilisés seuls ou en tant que partie d'un SYSTEME EM, ci-après appelés APPAREILS EM.<br/>
    Les DANGERS inhérents à la fonction physiologique prévue des APPAREILS EM ou des SYSTEMES EM compris dans le domaine d'application du présent document ne sont pas couverts par des exigences spécifiques dans le présent document, en dehors de l'IEC 60601-1:2005, l'IEC 60601-1:2005/AMD1:2012 et l'IEC 60601-1:2005/AMD2:2020, 7.2.13 et 8.4.1.<br/>
    Le présent document ne s'applique pas<br/>
    – Aux appareils qui mesurent la saturation en oxygène de l'hémoglobine dans les vaisseaux sanguins de très petite taille (capillaires, artérioles et veinules), c'est-à-dire aux oxymètres pour tissu.<br/>
    – Aux appareils dans le domaine temporel et de la fréquence pour la spectroscopie dans le proche infrarouge fonctionnelle.<br/>
    – Aux appareils qui mesurent les modifications de concentration en chromophores autres que l'oxyhémoglobine et la désoxyhémoglobine.<br/>
    – Aux appareils qui mesurent les modifications de concentration en oxyhémoglobine et en désoxyhémoglobine dans les tissus autres que le cerveau.<br/>
    Le présent document ne spécifie pas les exigences concernant:<br/>
    – les oxymètres pour tissu cérébral, qui sont données dans l'ISO 80601-2-85; et<br/>
    – les oxymètres de pouls, qui sont données dans l'ISO 80601-2-61.<br/>
    L'IEC 80601-2-71:2025 annule et remplace la première édition parue en 2015. Cette édition constitue une révision technique.<br/>
    Cette édition inclut les modifications techniques majeures suivantes par rapport à l'édition précédente:<br/>
    a) alignement sur l'IEC 60601-1:2005, l'IEC 60601-1:2005/AMD1:2012, l'IEC 60601-1:2005/AMD2:2020, l'IEC 60601-1-8:2006, l'IEC 60601-1-8:2006/AMD1:2012, l'IEC 60601-1-8:2006/AMD2:2020, l'IEC 60601-1-2:2014, IEC 60601-1-2:2014/AMD1:2020, IEC 60601-1-6:2010, l'IEC 60601-1-6:2010/AMD1:2013 et l'IEC 60601-1-6:2010/AMD2:2020;<br/>
    b) ajout d'exigences concernant les PERFORMANCES ESSENTIELLES;<br/>
    c) ajout d'exigences concernant les FONCTIONS PRINCIPALES DE SERVICE;<br/>
    d) ajout d'exigences concernant la protection contre les températures excessives;<br/>
    e) ajout d'exigences concernant la lisibilité de l'affichage pour les OPERATEURS qui portent un équipement de protection individuelle;<br/>
    f) harmonisation avec l'ISO 20417, le cas échéant.
