abstract:
- language: en
  script: Latn
  content: |-
    IEC 63497:2026, which is a product standard, is intended to specify the EMC, performance and safety requirements of shunt-connected active correction devices (ACD) with rated system voltages not exceeding 1 000 V AC or 1 500 V DC.<br/>
    These devices can be either cord or permanently connected. They can be movable, stationary, or fixed devices.<br/>
    An ACD includes both a static VAR generator (SVG) and an active harmonic filter (AHF).<br/>
    The primary function of a shunt connected ACD is to do one or more of the following:<br/>
    - active harmonic filtering;<br/>
    - reactive power compensation;<br/>
    - unbalanced load compensation.<br/>
    Additional functions of a shunt-connected ACD, not addressed by this document, can be the following:<br/>
    - flicker compensation;<br/>
    - interharmonic component filtering.<br/>
    In case of hybrid devices, combining a passive harmonic filter and an ACD, this document covers only the active part.<br/>
    This document does not cover<br/>
    - active mitigation functions part of another device (variable speed drive, uninterruptible power supply, dynamic voltage restorer, etc.),<br/>
    - switched power capacitors,<br/>
    - switched inductors,<br/>
    - passive harmonic filters,<br/>
    - energy storage converters, and<br/>
    - series-connected active correction devices.
- language: fr
  script: Latn
  content: |-
    L'IEC 63497:2026, qui est une norme de produit destinée à spécifier les exigences de compatibilité électromagnétique (CEM), de performance et de sécurité relatives aux dispositifs de correction active (ACD) à connexion shunt dont les tensions système assignées ne dépassent pas 1 000 V en courant alternatif ou 1 500 V en courant continu.<br/>
    Ces dispositifs peuvent être des dispositifs à cordon amovible, ou être raccordés de manière permanente. Ils peuvent être des dispositifs mobiles, stationnaires ou fixes.<br/>
    Les ACD englobent les générateurs de puissance réactive statiques (SVG) et les filtres d’harmoniques actifs (AHF).<br/>
    La fonction principale d’un ACD à connexion shunt est de réaliser une ou plusieurs des tâches suivantes:<br/>
    - filtrage actif des harmoniques;<br/>
    - compensation de puissance réactive;<br/>
    - compensation des charges non équilibrées.<br/>
    Les fonctions supplémentaires d’un ACD à connexion shunt, non abordées dans le présent document, peuvent être les suivantes:<br/>
    - compensation du papillotement ("flicker");<br/>
    - filtrage des composantes interharmoniques.<br/>
    Dans le cas de dispositifs hybrides, qui combinent un filtre d’harmoniques passif et un ACD, le présent document couvre uniquement la partie active.<br/>
    Le présent document ne couvre pas<br/>
    - les fonctions d’atténuation active d’un autre dispositif (variateur, alimentation sans interruption, correcteur dynamique de tension, etc.),<br/>
    - les condensateurs de puissance commutés,<br/>
    - les inductances commutées,<br/>
    - les filtres d’harmoniques passifs,<br/>
    - les convertisseurs de stockage d’énergie, et<br/>
    - les dispositifs de correction active à connexion série.
