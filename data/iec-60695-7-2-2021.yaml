abstract:
- language: en
  script: Latn
  content: |-
    IEC 60695-7-2:2021 gives a brief summary of the test methods that are in common use in the assessment of the toxicity of fire effluent. It includes special observations on their relevance to real fire scenarios and gives recommendations on their use.<br/>
    It advises which tests provide toxic potency data that are relevant to real fire scenarios, and which are suitable for use in fire hazard assessment and fire safety engineering.<br/>
    The list of test methods is not to be considered exhaustive.<br/>
    This summary cannot be used in place of published standards which are the only valid reference documents.<br/>
    This basic safety publication is intended for use by technical committees in the preparation of standards in accordance with the principles laid down in IEC Guide 104 and ISO/IEC Guide 51.<br/>
    One of the responsibilities of a technical committee is, wherever applicable, to make use of basic safety publications in the preparation of its publications. The requirements, test methods or test conditions of this basic safety publication will not apply unless specifically referred to or included in the relevant publications.<br/>
    This second edition cancels and replaces the first edition published in 2011. This edition constitutes a technical revision.<br/>
    The main changes with respect to the previous edition are listed below:<br/>
    – New text in the introduction;<br/>
    – New text in the scope;<br/>
    – Clause 2 has been updated;<br/>
    – Many terms and definitions in Clause 3 reproduced from ISO 13943 have been deleted. Other terms and definitions have been added.<br/>
    – New text in Subclauses 4.3 and 4.4;<br/>
    – New text in Subclause 6.1;<br/>
    – References to IEC 60695-7-50 and -51 (now withdrawn) have been removed;<br/>
    – Reference to DEF STAN 07-247 has been added;<br/>
    – Details of ISO/TS 19021 have been added;<br/>
    – Details of EN 17084 have been added;<br/>
    – New text added concerning ISO/TS 19700;<br/>
    – New text added concerning the IMO FTP toxicity test;<br/>
    – New Subclause 7.1 has been added;<br/>
    – The Annex in Edition1 has been replaced by new Clause 8;<br/>
    – The bibliography has been updated.
- language: fr
  script: Latn
  content: |-
    IEC 60695-7-2:2021 fournit un bref résumé des méthodes d'essai qui sont d'un usage courant dans l'évaluation de la toxicité des effluents du feu. Elle comprend des observations particulières sur leur pertinence par rapport aux scénarios d'incendies réels, et donne des recommandations sur leur utilisation.<br/>
    Elle indique quels sont les essais fournissant des données de potentiel toxique pertinentes pour les scénarios d'incendies réels, et quels sont ceux qui sont adaptés à l'utilisation dans l'évaluation des dangers d’incendie et l'ingénierie de sécurité incendie.<br/>
    La liste des méthodes d’essai ne doit pas être considérée comme exhaustive.<br/>
    Ce résumé ne peut pas remplacer les normes publiées, qui sont les seuls documents de référence valables.<br/>
    Cette publication fondamentale de sécurité est destinée à être utilisée par les comités d’études pour l’établissement de leurs normes, conformément aux principes exposés dans le Guide 104 de l’IEC et dans le Guide ISO/IEC 51.<br/>
    L'une des responsabilités d'un comité d'études consiste, le cas échéant, à utiliser les publications fondamentales de sécurité dans le cadre de l'élaboration de ses publications. Les exigences, les méthodes ou les conditions d'essai de la présente publication fondamentale de sécurité s'appliquent seulement si elles servent spécifiquement de référence ou sont intégrées dans les publications correspondantes.<br/>
    Cette deuxième édition annule et remplace la première édition parue en 2011. Cette édition constitue une révision technique.<br/>
    Les principales modifications par rapport à l'édition antérieure sont énumérées ci-dessous:<br/>
    – Nouveau texte d'introduction;<br/>
    – Nouveau texte de domaine d’application;<br/>
    – L’Article 2 a été mis à jour;<br/>
    – De nombreux termes et définitions de l’Article 3 issus de l’ISO 13943 ont été supprimés. D’autres termes et définitions ont été ajoutés.<br/>
    – Nouveau texte en 4.3 et 4.4;<br/>
    – Nouveau texte en 6.1;<br/>
    – Les références à l’IEC 60695-7-50 et -51 (à présent supprimées) ont été retirées;<br/>
    – Une référence à la DEF STAN 07-247 a été ajoutée;<br/>
    – Des éléments détaillés tirés de l’ISO/TS 19021 ont été ajoutés;<br/>
    – Des éléments détaillés tirés de l’EN 17084 ont été ajoutés;<br/>
    – Nouveau texte ajouté relatif à l’ISO/TS 19700;<br/>
    – Nouveau texte relatif à l'essai de toxicité de l’OMI FTP;<br/>
    – Nouveau paragraphe 7.1;<br/>
    – L’Annexe de la première édition est devenue le nouvel Article 8;<br/>
    – La bibliographie a été mise à jour.
