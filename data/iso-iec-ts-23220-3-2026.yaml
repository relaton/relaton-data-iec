abstract:
- language: en
  script: Latn
  content: |-
    <p>This document provides building blocks for mobile eID-System infrastructures and normalizes protocols, interfaces and services for mdoc apps by:</p>

    specifying interfaces for data interchange for installing of software in installation phase as well as issuing and deriving of attributes and credentials in issuing phase;
    specifying security and data protection mechanisms;
    applying privacy-enhancing mechanisms;
    specifying discoverability mechanisms.

    <p>Mechanisms for updating or revoking of attributes and credentials or mdocs are out of scope of this document and are provided by SA specific protocols.</p>
    <p>This document is applicable to entities involved in specifying, architecting, designing, testing, maintaining, administering and operating a mobile eID-System in parts or entirely.</p>
