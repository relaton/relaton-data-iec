abstract:
- language: en
  script: Latn
  content: |-
    IEC 62680-1-3:2026, this specification, defines the USB Type-C® receptacles, plug and cables.<br/>
    The USB Type-C Cable and Connector Specification is guided by the following principles:<br/>
    - Enable new and exciting host and device form-factors where size, industrial design and style are important parameters<br/>
    - Work seamlessly with existing USB host and device silicon solutions<br/>
    - Enhance ease of use for connecting USB devices with a focus on minimizing user confusion for plug and cable orientation<br/>
    The USB Type-C Cable and Connector Specification defines a receptacle, plug, cable, and detection mechanisms that are compatible with existing USB interface electrical and functional specifications. This specification covers the following aspects that are needed to produce and use this new USB cable/connector solution in newer platforms and devices, and that interoperate with existing platforms and devices:<br/>
    - USB Type-C receptacles, including electro-mechanical definition and performance requirements<br/>
    - USB Type-C plugs and cable assemblies, including electro-mechanical definition and performance requirements<br/>
    - USB Type-C to legacy cable assemblies and adapters<br/>
    - USB Type-C-based device detection and interface configuration, including support for legacy connections<br/>
    - USB Power Delivery optimized for the USB Type-C connector.<br/>
    IEC 62680-1-3:2026 cancels and replaces the sixth edition published in 2024 and constitutes an editorial revision. This standard is the USB-IF publication Universal Serial Bus Type-C Cable and Connector Specification Revision 2.4. New release primarily includes incorporation of all approved ECNs as of the revision date plus editorial clean-up.
- language: fr
  script: Latn
  content: |-
    IEC 62680-1-3:2026, la présente spécification définit les fiches et embases, ainsi que les câbles USB Type-C®.<br/>
    La spécification des câbles et connecteurs USB Type-C est guidée par les principes suivants:<br/>
    - favoriser des critères de forme d'hôtes et dispositifs innovants et agréables, où la taille, la conception industrielle et le style constituent des paramètres importants;<br/>
    - interagir en toute fluidité avec les solutions d'hôtes et de dispositifs USB silicium actuelles;<br/>
    - améliorer la facilité d'utilisation pour la connexion des dispositifs USB, en réduisant autant que possible le risque de confusion lors de l'insertion des connecteurs et des câbles.<br/>
    La spécification des câbles et connecteurs USB Type-C définit des techniques de connexion et de détection des embases, fiches et câbles USB, qui sont compatibles avec les spécifications électriques et fonctionnelles d'interface USB existantes. La présente spécification couvre les aspects suivants, qui sont nécessaires à la production et à l'utilisation de cette nouvelle solution de câble/connecteur USB pour les plateformes et dispositifs récents, et qui interagissent avec les plateformes et dispositifs actuels:<br/>
    - les embases USB Type-C, notamment la description électromécanique et les exigences de performance;<br/>
    - les fiches et les ensembles câble-connecteurs USB Type-C, notamment la description électromécanique et les exigences de performance;<br/>
    - les ensembles câble-connecteurs et les adaptateurs USB Type-C pour la connexion avec les solutions existantes;<br/>
    - la configuration d'interface et la détection des dispositifs USB Type-C, notamment la prise en charge des solutions de connexion existantes;<br/>
    - le système USB Power Delivery optimisé pour les connecteurs USB Type-C.<br/>
    L’IEC 62680-1-3:2026 annule et remplace la sixième édition parue en 2024 et constitue une révision rédactionnelle. Cette norme est la publication de l'USB-IF relative au bus universel en série et à la spécification des câbles et connecteurs de Type-C, révision 2.4. Nouvelle version comprenant l'incorporation de l'ensemble des ECN approuvés à la date de révision, ainsi que les corrections rédactionnelles.
