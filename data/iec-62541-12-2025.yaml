abstract:
- language: en
  script: Latn
  content: |-
    IEC 62541-12:2025 specifies how OPC Unified Architecture (OPC UA) Clients and Servers interact with DiscoveryServers when used in different scenarios. It specifies the requirements for the LocalDiscoveryServer, LocalDiscoveryServer-ME and GlobalDiscoveryServer. It also defines information models for Certificate management, KeyCredential management and AuthorizationServices.<br/>
    Annex A informatively discusses deployment and configuration aspects.<br/>
    Annex B defines NodeSet and numeric NodeIds.<br/>
    Annex F provides installation rules for the LDS.<br/>
    Annex H compares the Certificate management defined in this document with IETF RFC 7030.<br/>
    This second edition cancels and replaces the first edition published in 2020. This edition constitutes a technical revision.<br/>
    This edition includes the following significant technical changes with respect to the previous edition:<br/>
    a) addition of a "Quantity Model" which can be referenced from EngineeringUnit Properties. The model defines quantities and assigned units. In addition it provides alternative units and the conversion to them;<br/>
    b) addition of rules for ValuePrecision Property:<br/>
    • can also be used for other subtypes like Duration and Decimal.<br/>
    • additional rules when ValuePrecision has negative values.
- language: fr
  script: Latn
  content: |-
    IEC 62541-12:2025 spécifie la manière dont les Clients et les Serveurs de l'Architecture Unifiée OPC (OPC UA) interagissent avec les DiscoveryServers lorsqu'ils sont utilisés dans différents scénarios. Elle définit les exigences pour le LocalDiscoveryServer, le LocalDiscoveryServer-ME et le GlobalDiscoveryServer. Elle définit également les modèles d'information pour la gestion des Certificats, la gestion des KeyCredentials et les AuthorizationServices.<br/>
    L'Annexe A, informative, examine les aspects relatifs au déploiement et à la configuration.<br/>
    L'Annexe B définit le NodeSet et les NodeIds numériques.<br/>
    L'Annexe F fournit les règles d'installation du LDS.<br/>
    L'Annexe H compare la gestion des Certificates définie dans le présent document à la IETF RFC 7030.<br/>
    Cette deuxième édition annule et remplace la première édition parue en 2020. Cette édition constitue une révision technique.<br/>
    Cette édition inclut les modifications techniques majeures suivantes par rapport à l'édition précédente:<br/>
    a) ajout d'un "modèle de quantité" qui peut être référencé à partir des propriétés EngineeringUnit. Le modèle définit les grandeurs et les unités attribuées. En outre, il fournit des unités alternatives et les règles de conversion vers ces unités;<br/>
    b) ajout de règles pour la propriété ValuePrecision:<br/>
    • peut également être utilisé pour d'autres sous-types tels que Duration et Decimal;<br/>
    • règles supplémentaires lorsque ValuePrecision a des valeurs négatives.
