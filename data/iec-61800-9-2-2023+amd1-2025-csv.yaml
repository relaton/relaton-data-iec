abstract:
- language: en
  script: Latn
  content: |-
    IEC 61800-9-2:2023+AMD1:2025 CSV specifies energy efficiency indicators of power electronics (complete drive modules (CDM), input or output sub drive modules (SDM), power drive systems (PDS) and motor starters, all used for motor driven equipment.<br/>
    It defines IE and IES classes, their limit values and provides test procedures for the classification of the overall losses of the motor system. Furthermore, this document proposes a methodology for the implementation of the best energy efficiency solution of drive systems. This depends on the architecture of the motor driven system, on the speed/torque profile and on the operating points over time of the driven load equipment. It provides a link for the energy efficiency evaluation and classification of the extended product.<br/>
    This edition includes the following significant technical changes with respect to the previous edition:<br/>
    a) Additional IES Classes defined to IES5;<br/>
    b) Removed reference motor loss data and now point to IEC 60034-30-2;<br/>
    c) Expanded and modified factors in Clause 6 for CDMs;<br/>
    d) Annex C is now the Mathematical Model for CDM Losses;<br/>
    e) Moved the mathematical model for the CDM to Annex C;<br/>
    f) Added Sub Drive Input Module and Sub Drive Output Modules to Annex B;<br/>
    g) Annex D is now the Converter Topology (old Annex C);<br/>
    h) Annex E is now the Interpolation of Motor Losses (Old Annex D);<br/>
    i) Annex E expanded to include various motor connections and updated interpolation method;<br/>
    j) New Annex E for determination of Interpolation Coefficients;<br/>
    k) Annex F is the old Annex E;<br/>
    l) New Annex J Explanation of Correction Factors for the Reference Losses in Table 8.
