abstract:
- language: en
  script: Latn
  content: |-
    IEC 62402:2019 provides requirements and guidance for obsolescence management applicable to any organization that is dependent on another organization to obtain value from the usefulness of the items that it provides. A cost-effective obsolescence management process and the activities used to implement the process are applicable throughout all phases of an item’s life cycle. This document covers the following areas:<br/>
    • establishing an obsolescence management policy;<br/>
    • establishing an infrastructure and an organization;<br/>
    • developing an obsolescence management plan (OMP);<br/>
    • developing strategies to minimize obsolescence during design;<br/>
    • determining an obsolescence management approach;<br/>
    • selecting obsolescence resolution and implementation;<br/>
    • measuring and improving the performance of the outcomes of the obsolescence management activities.<br/>
    Guidance on obsolescence management is included as notes, in the informative annexes and references in the Bibliography. This second edition cancels and replaces the first edition published in 2007. This edition constitutes a technical revision. This edition includes the following significant technical changes with respect to the previous edition:<br/>
    a) this document has now been written with requirements as a standard, not a guide;<br/>
    b) this document continues to have guidance in the informative annexes;<br/>
    c) this document has been written as a general process for all technologies and items.<br/>
    Keywords: obsolescence management
- language: fr
  script: Latn
  content: |-
    IEC 62402:2019 fournit des exigences et des recommandations relatives à la gestion de l'obsolescence qui s'appliquent à toute organisation faisant appel à une autre organisation pour tirer parti des entités fournies par cette dernière. Un processus rentable de gestion de l'obsolescence ainsi que les activités de mise en œuvre de ce processus s'appliquent à chaque phase du cycle de vie d'une entité. Le présent document couvre les points suivants:<br/>
    • l'établissement d'une stratégie de gestion de l'obsolescence;<br/>
    • l'établissement d'une infrastructure et d'une organisation;<br/>
    • le développement d'un plan de gestion de l'obsolescence;<br/>
    • le développement de stratégies visant à réduire le plus possible l'obsolescence au cours de la conception;<br/>
    • l'identification de l'approche de gestion de l'obsolescence à adopter;<br/>
    • le choix et la mise en œuvre de la résolution de l'obsolescence;<br/>
    • la mesure et l'amélioration des performances des activités de gestion de l'obsolescence.<br/>
    Des recommandations relatives à la gestion de l'obsolescence sont incluses sous forme de notes, dans les annexes informatives et dans la Bibliographie.Cette deuxième édition annule et remplace la première édition parue en 2007. Cette édition constitue une révision technique. Cette édition comprend les modifications techniques majeures suivantes par rapport à l'édition précédente:<br/>
    a) le présent document a été réécrit pour se conformer aux exigences d'une norme et non d'un guide;<br/>
    b) le présent document contient toujours des recommandations dans ses annexes informatives;<br/>
    c) le présent document a été rédigé pour servir de processus général pour l'ensemble des technologies et entités.<br/>
    Mots clés : gestion de l'obsolescence
