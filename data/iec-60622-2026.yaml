abstract:
- language: en
  script: Latn
  content: |-
    IEC 60622:2026 specifies marking, designation, dimensions, tests and requirements for sealed nickel-cadmium prismatic secondary single cells, and battery systems made of them for use in industrial applications.<br/>
    IEC 60622:2026 specifies marking, designation, dimensions, tests and requirements for sealed nickel-cadmium prismatic secondary single cells, and battery systems made of them for use in industrial applications.<br/>
    This fourth edition cancels and replaces the third edition published in 2002.<br/>
    This edition constitutes a technical revision. This edition includes the following significant technical changes with respect to the previous edition:<br/>
    a) optional characterization of cells designed for performances at very low or very high temperature, or both;<br/>
    b) optional characterization of cells tested with CCCV charge (also known as IU curve);<br/>
    c) optional characterization of cells designed for rapid charge;<br/>
    d) optional characterization of cells designed for high cycling.
- language: fr
  script: Latn
  content: |-
    L’IEC 60622:2026 spécifie le marquage, la désignation, les dimensions, les essais et les exigences applicables aux accumulateurs individuels parallélépipédiques rechargeables étanches au nickel-cadmium, ainsi qu’aux systèmes de batterie constitués de ces éléments destinés à être utilisés dans des applications industrielles.<br/>
    Cette quatrième édition annule et remplace la troisième édition parue en 2002. Cette édition constitue une révision technique.<br/>
    Cette édition inclut les modifications techniques majeures suivantes par rapport à l’édition précédente:<br/>
    a) caractérisation facultative d’éléments conçus pour des performances à très basse ou très haute température, ou les deux;<br/>
    b) caractérisation facultative d’éléments soumis aux essais avec des charges CCCV (également connu sous le nom de courbe IU);<br/>
    c) caractérisation facultative d’éléments conçus pour une charge rapide;<br/>
    d) caractérisation facultative d’éléments conçus pour un nombre de cycles élevé.
