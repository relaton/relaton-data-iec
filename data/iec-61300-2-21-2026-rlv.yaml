abstract:
- language: en
  script: Latn
  content: |-
    IEC 61300-2-21:2026 RLV contains both the official IEC International Standard and its Redline version. The Redline version is available in English only and provides you with a quick and easy way to compare all the changes between the official IEC Standard and its previous edition.<br/>
    <br/>
    IEC 61300-2-21:2026 defines the resistance of a fibre optic device or component to the deteriorative effects of high temperature, humidity and cold conditions. It is intended to reveal defects in a device under test (DUT) caused by breathing as opposed to absorption of moisture. The test covers the effect of the freezing of trapped water in cracks and fissures as well as condensation. However, the degree of condensation will vary depending on the size and thermal mass of the DUT.<br/>
    This edition includes the following significant technical changes with respect to the previous edition:<br/>
    a) update of the terms and definitions and of the details to be specified and reported;<br/>
    b) update of Figure 1 and Figure 2 according to IEC 60068-2-38.
