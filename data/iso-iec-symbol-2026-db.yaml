abstract:
- language: en
  script: Latn
  content: |-
    12-month initial subscription to ISO/IEC SYMBOL Database<br/>
    <br/>
    ISO/IEC SYMBOL DB contains more than 5200 graphical symbols published in IEC 60417 and ISO 7000. These symbols are used to identify equipment or a part of equipment, indicate functional states, designate connections, provide information on packaging or provide instruction for the operation of the equipment. The symbols are available in GIF and vectorized PDF formats. The database provides classified views by shape, function, and application, as well as a search facility.
