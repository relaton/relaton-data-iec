abstract:
- language: en
  script: Latn
  content: |-
    IEC 62386-202:2022 is applicable to control gear for control by digital signals of electronic lighting equipment which is associated with self-contained emergency lighting as described in IEC 61347-2-7 with additional control interface for configuring emergency operation.<br/>
    This second edition cancels and replaces the first edition published in 2009. This edition constitutes a technical revision.<br/>
    This edition includes the following significant technical changes with respect to the previous edition:<br/>
    scope updated,<br/>
    hardwired switch operation can be disabled,<br/>
    installation inhibit feature added,<br/>
    memory bank added,<br/>
    modes of operation clarified, with some changes and additions,<br/>
    command added to enter extended emergency mode,<br/>
    command added to extend time in duration test mode.
- language: fr
  script: Latn
  content: |-
    L'IEC 62386-202:2022 s'applique aux appareillages de commande pour la commande par des signaux numériques des appareils d'éclairage électronique associés aux blocs autonomes d'éclairage de secours décrits dans l'IEC 61347-2-7 équipés d'une interface de commande supplémentaire pour la configuration du fonctionnement de secours.<br/>
    Cette deuxième édition annule et remplace la première édition parue en 2009. Cette édition constitue une révision technique.<br/>
    Cette édition inclut les modifications techniques majeures suivantes par rapport à l'édition précédente:<br/>
    mise à jour du domaine d'application;<br/>
    le fonctionnement du commutateur mécanique peut être désactivé;<br/>
    ajout de la fonction de neutralisation de l'installation;<br/>
    ajout du bloc de mémoire;<br/>
    clarification des états de fonctionnement par des modifications et des ajouts;<br/>
    ajout d'une commande pour passer à l'état de fonctionnement de secours prolongé;<br/>
    ajout d'une commande pour prolonger la durée de l'état "Essai d'autonomie".
