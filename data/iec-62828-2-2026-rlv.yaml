abstract:
- language: en
  script: Latn
  content: |-
    IEC 62828-2:2026 RLV contains both the official IEC International Standard and its Redline version. The Redline version is available in English only and provides you with a quick and easy way to compare all the changes between the official IEC Standard and its previous edition.<br/>
    <br/>
    IEC 62828-2:2026 establishes specific procedures for testing pressure process measurement transmitters (PMT) used in measuring and control systems for industrial processes and for machinery. A pressure PMT can feature a remote seal to bring the process variable to the sensing element in the PMT. When the remote seal cannot be separated from the PMT, the complete device is tested. For general test procedures, reference is made to IEC 62828-1, which is applicable to all types of process measurement transmitters.<br/>
    NOTE In industrial and process applications, to indicate the process measurement transmitters, it is common also to use the terms "industrial transmitters", or "process transmitters".<br/>
    This second edition cancels and replaces the first edition published in 2017. This edition constitutes a technical revision.<br/>
    This edition includes the following significant technical changes with respect to the previous edition:<br/>
    a) revision according to the latest IEC rules;<br/>
    b) comparison with the general part of IEC 62828-1;<br/>
    c) additions and more precise definitions in the “Terms and definitions” clause;<br/>
    d) correction of the calculation formulas for the measurement error;<br/>
    e) more precise formulation of long-term drift;<br/>
    f) extension of additional tests;<br/>
    g) transfer of the annex “Example of signal current range for a 4 to 20 mA PMT” in IEC 62828-1;<br/>
    h) new Annex C “Main characteristics for pressure transmitters”.
