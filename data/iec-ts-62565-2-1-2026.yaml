abstract:
- language: en
  script: Latn
  content: "IEC TS 62565-2-1:2026 which is a Technical Specification, establishes
    a blank detail specification and format for listing the relevant key control characteristics
    (KCCs) of single wall carbon nanotubes (SWCNTs). This document is intended to
    be used for SWCNTs in the form of powders and dispersions.<br />\r\nFor each KCC
    listed, methods and existing standards (in cases where they are applicable) for
    their measurement are indicated. Numeric values to be specified for the properties
    and characteristics are intentionally left blank and are determined by agreement
    between customer and supplier. Properties and characteristics not of relevance
    for a specific application can be classified as not applicable or not specified."
