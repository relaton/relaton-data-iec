abstract:
- language: en
  script: Latn
  content: |-
    IEC 61747-5-3:2009 applies to commercially available liquid crystal displays (LCDs). This standard applies to all LCD types, including transmissive, reflective or transflective liquid crystal display (LCD) modules using either segment, passive or active matrix and achromatic or colour type LCDs that are equipped with their own integrated source of illumination or without their own source of illumination. The objective of this standard is to establish uniform requirements for accurate and reliable measurements of the following LCD parameters:<br/>
    a) quasistatic strength,<br/>
    b) quasistatic fatigue.<br/>
    The methods described in this standard apply to all sizes, small and large, liquid crystal displays.<br/>
    <br/>
    This publication is to be read in conjunction with IEC 61747-1:1998. The contents of the corrigendum of November 2011 have been included in this copy.
- language: fr
  script: Latn
  content: |-
    La CEI 61747-5-3:2009 s'applique aux afficheurs à cristaux liquides (LCD) disponibles sur le marché. La présente norme s'applique à tous types de LCD, y compris les modules d'affichage à cristaux liquides (LCD) de type transmissif, réflexif ou transflexif utilisant des afficheurs à cristaux liquides de type soit à segments, soit à matrice passive ou active et achromatique ou couleur qui sont équipés ou non de leur propre source intégrée d'éclairement. L'objet de la présente norme est d'établir des exigences uniformes pour des mesures précises et fiables des paramètres LCD suivants:<br/>
    a) résistance quasi statique,<br/>
    b) fatigue quasi statique.<br/>
    Les méthodes décrites dans la présente norme s'appliquent à toutes les tailles, petites et grandes, d'afficheurs à cristaux liquides.<br/>
    <br/>
    Cette publication doit être lue conjointement avec la CEI 61747-1:1998. Le contenu du corrigendum de novembre 2011 a été pris en considération dans cet exemplaire.
