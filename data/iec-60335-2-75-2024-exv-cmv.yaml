abstract:
- language: en
  script: Latn
  content: |-
    This pack contains IEC 60335-2-75:2024 EXV and IEC 60355-2-75:2024 CMV.<br/>
    <br/>
    IEC 60335-2-75:2024 deals with the safety of electric commercial dispensing appliances and vending machines for preparation or delivery of food, drinks and consumer products, their rated voltage being not more than 250 V for single-phase appliances and 480 V for other appliances including direct current (DC) supplied appliances and battery-operated appliances.<br/>
    Examples of appliances that are within the scope of this standard are:<br/>
    – bulk tea or coffee brewing machines;<br/>
    – cigarette vending machines;<br/>
    – coffee grinders for use in areas open to the public;<br/>
    – commercial liquid heaters;<br/>
    – coffee makers with or without integrated coffee grinder;<br/>
    – coffee makers with cooling systems;<br/>
    – hot and cold beverage vending machines;<br/>
    – hot water dispensers;<br/>
    – ice cream and whipped cream dispensers;<br/>
    – ice dispensers;<br/>
    – newspaper, audio or video tape or disc vending machines;<br/>
    – packaged food and drink vending machines;<br/>
    – refrigerated merchandisers;<br/>
    – appliances incorporating electrode-type liquid heaters.<br/>
    Appliances can have more than one function.<br/>
    Other standards can be applicable for some functions such as:<br/>
    – refrigeration (IEC 60335-2-89);<br/>
    – heating by microwaves (IEC 60335-2-90);<br/>
    – professional ice cream makers (IEC 60335-2-118).<br/>
    This standard also deals with the hygiene aspects of appliances.<br/>
    As far as is practicable, this standard deals with the common hazards presented by appliances that are encountered by users and maintenance persons. However, in general, it does not take into account young children playing with the appliance.<br/>
    Attention is drawn to the fact that:<br/>
    – for appliances intended to be used in vehicles or on board ships or aircraft, additional requirements can be necessary;<br/>
    – in many countries, additional requirements for appliances incorporating pressure vessels are specified;<br/>
    – in many countries, additional requirements are specified by the national health authorities, the national authorities responsible for the protection of labour, the national water supply authorities and similar authorities.<br/>
    This standard does not apply to:<br/>
    – appliances intended to be used exclusively for household purposes;<br/>
    – appliances intended to be used exclusively for industrial purposes;<br/>
    – appliances intended to be used in locations where special conditions prevail, such as the presence of a corrosive or explosive atmosphere (dust, vapour or gas);<br/>
    – commercial coffee grinders for use in areas not open to the public (IEC 60335-2-64);<br/>
    – commercial electric boiling pans (IEC 60335-2-47);<br/>
    – commercial electric bains-marie (IEC 60335-2-50);<br/>
    – amusement machines and personal service machines (IEC 60335-2-82);<br/>
    – commercial refrigerating appliances (IEC 60335-2-89);<br/>
    – appliances solely used for dispensing money;<br/>
    – display cabinets;<br/>
    – requirements for dispensed potentially hazardous food (these are covered by national health regulations in many countries).<br/>
    This fourth edition cancels and replaces the third edition published in 2012, Amendment 1:2015 and Amendment 2:2018. This edition constitutes a technical revision.<br/>
    This edition includes the following significant technical changes with respect to the previous edition:<br/>
    a) alignment with IEC 60335-1:2020;<br/>
    b) conversion of some notes to normative text (Clause 1, 7.1, 19.2, 19.101);<br/>
    c) addition of requirements for electrode-type liquid heaters (Clause 1, 3.1.9, 3.6.101, 3.7.103, 13.2, 13.3, 16.2, 16.3, 19.1, 19.103 to 19.106, 22.6, 22.33, 22.115 to 22.118, 24.1.2, 27.1, Annex BB);<br/>
    d) addition of test requirements for appliances with a recommended ambient temperature above 25 °C (5.7);<br/>
    e) application of test probes 18 and 19 (8.1.1, 20.2, 22.101, B.22.3, B.22.4);<br/>
    f) addition of accessible surface temperature limits including marking of hot surfaces (7.1, 7.6, 7.12, 7.14, 7.15, 11.3, 11.8);<br/>
    g) addition of requirements to prevent simultaneous operation of multiple loads (22.114, Annex R);<br/>
    h) clarification of requirements for thermal cut-outs located in a service area (24.103).<br/>
    This part 2 is to be used in conjunction with the latest edition of IEC 60335-1 and its amendments unless that edition precludes it; in that case, the latest edition that does not preclude it is used. It was established on the basis of the sixth edition (2020) of that standard.
