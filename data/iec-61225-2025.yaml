abstract:
- language: en
  script: Latn
  content: IEC 61225:2025 specifies the performance and the functional characteristics of the low voltage static uninterruptible power supply (SUPS) systems in a nuclear power plant (NPP) and, when applicable, in nuclear facilities in general. An uninterruptible power supply (UPS) is an electrical equipment which draws electrical energy from a source, stores it, and maintains the supply in a specified form by means inside the equipment to output terminals. A SUPS has no rotating parts to perform its functions. The specific design requirements for the components of the power supply system are covered by IEC standards and other standards listed in the normative references. Otherwise, specific component-level design requirements are outside the scope of this document.
- language: fr
  script: Latn
  content: |-
    IEC 61225:2025 spécifie les performances et les caractéristiques fonctionnelles des systèmes d'alimentation statiques sans interruption (ASSI) en basse tension dans les centrales nucléaires de puissance (CNP) et, le cas échéant, dans les installations nucléaires en général. Une alimentation sans interruption (ASI) est un équipement électrique qui tire l'énergie électrique d'une source, la stocke et maintien une alimentation aux bornes de sortie sous une forme spécifiée en utilisant des moyens internes à l'équipement. Une ASSI ne comprend pas de partie tournante pour réaliser sa fonction.<br/>
    L'IEC 61225 a été établie par le sous-comité 45A: Systèmes d'instrumentation, de contrôle-commande et d'alimentation électrique des installations nucléaires, du comité d'études 45 de l'IEC: Instrumentation nucléaire. Il s'agit d'une Norme internationale.<br/>
    Cette quatrième édition annule et remplace la troisième édition parue en 2019. Cette édition constitue une révision technique.<br/>
    Cette édition inclut les modifications techniques majeures suivantes par rapport à l'édition précédente:<br/>
    a) l'expansion et la clarification des exigences relatives aux systèmes d'alimentation statiques non interruptibles en courant continu et en courant alternatif pour faciliter l'application dans les PRM et les conceptions passives.<br/>
    La présente Norme internationale doit être utilisée conjointement avec les normes IEC 61513:2011, IEC 60709:2018, IEC 60880:2006, IEC 62138:2018, IEC 62855:2016 et IEC 63046:2020.
