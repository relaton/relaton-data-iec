abstract:
- language: en
  script: Latn
  content: |-
    IEC 60404-8-5:2020+AMD1:2026 CSV defines the grades of electrical steel strip and sheet with specified mechanical properties and magnetic polarization. In particular, it gives general requirements, mechanical properties, magnetic polarization, geometric characteristics, tolerances and technological characteristics, as well as inspection procedures. This document applies to electrical steel strip and sheet intended for the construction of poles and rims of rotating electrical machines.<br/>
    The grades are grouped into two classes according to their manufacturing process:<br/>
    - hot-rolled grades;<br/>
    - cold-rolled grades.<br/>
    They correspond to Class D21 of IEC 60404-1.<br/>
    This edition includes the following significant technical changes with respect to the previous edition:<br/>
    a) extension of the range of products to include the improved grades;<br/>
    b) division of "flatness" into "edge wave (wave factor)" and "residual curvature" in consistent with IEC 60404-9;<br/>
    c) change length of test specimen for determinations of geometrical characters from 2 m to 1 m.
