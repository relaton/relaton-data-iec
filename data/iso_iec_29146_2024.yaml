abstract:
- content: <p class="MsoBodyText">This document defines and establishes a framework
    for access management (AM) and the secure management of the process to access
    information and information and communications technologies (ICT) resources, associated
    with the accountability of a subject within some contexts.</p><p class="MsoBodyText">This
    document provides concepts, terms and definitions applicable to distributed access
    management techniques in network environments.</p><p class="MsoBodyText">This
    document also provides explanations about related architecture, components and
    management functions.</p><p class="MsoBodyText">The subjects involved in access
    management can be uniquely recognized to access information systems, as defined
    in the ISO/IEC 24760 series.</p><p class="MsoBodyText">The nature and qualities
    of physical access control involved in access management systems are outside the
    scope of this document.</p>
  language:
  - en
  script:
  - Latn
  format: text/html
- content: <p class="MsoBodyText">Le présent document définit et établit un cadre
    pour la gestion de l'accès (AM, access management) et la gestion sécurisée du
    processus d'accès à l'information et aux ressources des technologies de l'information
    et de la communication (TIC), associé à la responsabilité d'un sujet dans certains
    contextes.</p><p class="MsoBodyText">Le présent document fournit des concepts,
    des termes et des définitions applicables aux techniques de gestion d'accès distribuée
    dans des environnements en réseau.</p><p class="MsoBodyText">Le présent document
    fournit également des explications concernant l'architecture, les composants et
    les fonctions de gestion associés.</p><p class="MsoBodyText">Les sujets impliqués
    dans la gestion d'accès peuvent être reconnus de manière unique pour accéder aux
    systèmes d'information, tel que défini dans la série ISO/IEC 24760.</p><p class="MsoBodyText">La
    nature et les qualités du contrôle d'accès physique intervenant dans les systèmes
    de gestion d'accès ne relèvent pas du domaine d'application du présent document.</p>
