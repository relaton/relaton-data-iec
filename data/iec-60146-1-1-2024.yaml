abstract:
- language: en
  script: Latn
  content: |-
    IEC 60146-1-1:2024 specifies the requirements for the performance of all semiconductor power converters and semiconductor power switches using controllable and/or non-controllable electronic valve devices. It is primarily intended to specify the basic requirements for converters in general and the requirements applicable to line commutated converters for conversion of AC power to DC power or vice versa. Parts of this document are also applicable to other types of electronic power converter provided that they do not have their own product standards.<br/>
    This fifth edition introduces four main changes:<br/>
    a) re-edition of the whole standard according to the current directives;<br/>
    b) deletion of safety-related descriptions considering coordination with IEC 62477 series;<br/>
    c) changes of calculation methods of inductive voltage regulation;<br/>
    d) changes considering coordination with IEC 61378 series.<br/>
    The content of the corrigendum 1 (2025-03) has been included in this copy.
- language: fr
  script: Latn
  content: |-
    L’IEC 60146-1-1:2024 spécifie les exigences relatives aux caractéristiques de fonctionnement de tous les convertisseurs de puissance à semiconducteurs, ainsi que des commutateurs de puissance à semiconducteurs utilisant des valves électroniques, commandables et/ou non commandables.<br/>
    Le présent document est prévu en premier lieu pour spécifier les exigences de base applicables aux convertisseurs en général, ainsi que les exigences applicables aux convertisseurs commutés par le réseau, pour la conversion de puissance alternative en puissance continue ou vice versa. Certaines parties du présent document s’appliquent également à d’autres types de convertisseurs électroniques de puissance, sous réserve qu’il n’existe pas de normes de produit qui leur soient propres.<br/>
    Cette cinquième édition introduit quatre modifications principales:<br/>
    a) réédition de l’ensemble de la norme conformément aux directives en vigueur;<br/>
    b) suppression des descriptions relatives à la sécurité, pour prendre en compte la coordination avec la série IEC 62477;<br/>
    c) modifications des méthodes de calcul de la variation inductive de tension;<br/>
    d) modifications pour prendre en compte la coordination avec la série IEC 61378.<br/>
    Le contenu du corrigendum 1 (2025-03) a été pris en considération dans cet exemplaire.
