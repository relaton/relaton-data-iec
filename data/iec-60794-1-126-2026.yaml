abstract:
- language: en
  script: Latn
  content: |-
    IEC 60794-1-126:2026 defines the test procedures used to establish uniform requirements for mechanical performance - galloping. It applies to optical fibre cables like ADSS, OPGW or OPPC that can be exposed to galloping phenomena. See IEC 60794-1-2 for general requirements and definitions and for a complete reference guide to test methods of all types. This first edition cancels and replaces Method E26 of the first edition of IEC 60794‑1‑21 published in 2015. This edition constitutes a technical revision.<br/>
    This edition includes the following significant technical changes with respect to the previous edition:<br/>
    a) Addition of "for ADSS" and "for OPGW and OPPC" in 4.7, a);<br/>
    b) Addition of "L4" in Figure 1 and in 4.7, b);<br/>
    c) Change of the specified static sag angle to ≤ 1,5±0,5°;<br/>
    d) Improvement of Figure 1;
- language: fr
  script: Latn
  content: |-
    IEC 60794-1-126: 2026 définit les procédures d’essai utilisées pour établir des exigences uniformes pour les performances mécaniques aux phénomènes de galop. Elle s’applique aux câbles à fibres optiques (câble autoportant tout diélectrique (ADSS, All Dielectric Self-Supporting), câble de garde à fibres optiques (OPGW, OPtical Ground Wire) ou conducteur de phase à fibres optiques (OPPC, OPtical Phase Conductor), par exemple) qui peuvent être exposés à des phénomènes de galop. Voir l’IEC 60794-1-2 pour les exigences générales et les définitions, et un guide de référence complet pour tous les types de méthodes d’essai. Cette première édition annule et remplace la Méthode E26 donnée dans la première édition de l’IEC 60794‑1‑21 parue en 2015. Cette édition constitue une révision technique.<br/>
    Cette édition inclut les modifications techniques majeures suivantes par rapport à l'édition précédente:<br/>
    a) ajout de "pour un câble ADSS" et "pour des câbles OPGW et OPPC" au 4.7, a);<br/>
    b) ajout de "L4" à la Figure 1 et au 4.7, b);<br/>
    c) modification de l’angle formé par la flèche statique spécifié à ≤ 1,5±0,5°;<br/>
    d) amélioration de la Figure 1.
