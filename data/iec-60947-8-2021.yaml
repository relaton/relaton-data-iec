abstract:
- language: en
  script: Latn
  content: |-
    IEC 60947-8:2021 specifies requirements for control units, which control a switching device in response to the PTC thermistors incorporated in rotating electrical machines and the industrial application.<br/>
    This second edition cancels and replaces the first edition published in 2003, Amendment 1:2006 and Amendment 2:2011. This edition constitutes a technical revision.<br/>
    This edition includes the following significant technical changes with respect to the previous edition:<br/>
    safety aspects related to:<br/>
    general aspects;<br/>
    limited energy circuits;<br/>
    electronic circuits;<br/>
    alignment to IEC 60947-1:2020;<br/>
    wire break detection function;<br/>
    the term detector is replaced by thermistor;<br/>
    reference to IEC 60738-1-4.
- language: fr
  script: Latn
  content: |-
    L'IEC 60947-8:2021 spécifie les exigences pour les unités de commande qui commandent un appareil de connexion réagissant aux thermistances CTP incorporées dans les machines électriques tournantes et l’application industrielle.<br/>
    Cette deuxième édition annule et remplace la première édition parue en 2003, son Amendement 1:2006 et son Amendement 2:2011. Cette édition constitue une révision technique.<br/>
    Cette édition inclut les modifications techniques majeures suivantes par rapport à l’édition précédente:<br/>
    des aspects liés à la sécurité concernant:<br/>
    les aspects généraux;<br/>
    les circuits à énergie limitée;<br/>
    les circuits électroniques;<br/>
    l’alignement avec l’IEC 60947-1:2020;<br/>
    la fonction de détection de rupture de conducteur;<br/>
    le terme détecteur est remplacé par thermistance;<br/>
    la référence à l’IEC 60738-1-4.
