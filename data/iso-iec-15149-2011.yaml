abstract:
- language: en
  script: Latn
  content: "<p>ISO/IEC 15149:2011 specifies the physical layer and media access control
    layer protocols of a wireless network over a magnetic field in a low frequency
    band (~300 kHz), for wireless communication in harsh environments (i.e. around
    metal, underwater, underground, etc.). </p>\n<p>The physical layer protocol is
    designed for the following scope:</p>\n\nlow carrier frequency for large magnetic
    field area and reliable communication in harsh environments;\nsimple and robust
    modulation for a low implementation cost and error performance;\nvariable coding
    and bandwidth for a link adaptation.\n\n<p>The media access control layer protocol
    is designed for the following scope:</p>\n\nsimple and efficient network topology
    for low power consumption;\nvariable superframe structure for compact and efficient
    data transmission;\ndynamic address assignment for small packet size and efficient
    address management.\n\n<p>ISO/IEC 15149:2011 supports several kbps data transmission
    in a wireless network within a distance of several metres. It can be applied to
    various services such as the following areas:</p>\n\nin the environmental industry,
    to manage pollution levels in soil and water using wireless underground or underwater
    sensors; \nin the construction industry, to monitor the integrity of buildings
    and bridges using wireless, inner-corrosion sensors;\nin the consumer-electronics
    industry, to detect food spoilage in wet, airtight storage areas and to transfer
    the sensing data from the inside to the outside;\nin the agricultural industry,
    to manage the moisture level as well as mineral status in soil using buried wireless
    sensors;\nin the transportation industry, to manage road conditions and traffic
    information using wireless underground sensors.\n"
