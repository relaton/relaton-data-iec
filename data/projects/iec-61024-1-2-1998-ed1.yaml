  script: Latn
  content: Applicable to the design and installation of Lightning Protection Systems (SPS) for common structures up to 60 m high, in accordance with IEC 61024-1.  Provides guidelines on how to use IEC 61024-1 and assists the user with the physical design and construction, maintenance and inspection of an LPS
