abstract:
- language: en
  script: Latn
  content: |-
    IEC 62439-3:2012 specifies two redundancy protocols designed to provide seamless recovery in case of single failure of an inter-bridge link or bridge in the network, which are based on the same scheme: duplication of the LAN, resp. duplication of the transmitted information. This second edition cancels and replaces the first edition published in 2010. It constitutes a technical revision. The main changes with respect to the previous edition are:<br/>
    - specification of the interconnection of PRP and HSR networks;<br/>
    - introduction of a suffix for PRP frames;<br/>
    - clarification and modification of specifications to ensure interoperability;<br/>
    - slackening of the specifications to allow different implementations;<br/>
    - consideration of clock synchronization according to IEC 61588;<br/>
    - introduction of test modes to simplify testing and maintenance.

    <br/><br/>This publication is to be read in conjunction with IEC 62439-1:2010.
- language: fr
  script: Latn
  content: |-
    La CEI 62439-3:2012 spécifie deux protocoles de redondance conçus pour assurer une reprise transparente en cas de défaillance unique d'une maille inter-étage ou d'un pont au sein du réseau, qui reposent sur le même schéma: duplication du réseau local, duplication des informations transmises. Cette deuxième édition annule et remplace la première édition parue en 2010. Elle constitue une révision technique. Les principales modifications apportées à l'édition précédente sont:<br/>
    - spécification de l'interconnexion des réseaux PRP et HSR;<br/>
    - introduction d'un suffixe pour les trames PRP;<br/>
    - clarification et modification des spécifications pour garantir l'interopérabilité;<br/>
    - assouplissement des spécifications pour permettre des mises en  oeuvre différentes;<br/>
    - prise en compte de la synchronisation des horloges conformément à la CEI 61588;<br/>
    - introduction de modes d'essai visant à simplifier les essais et la maintenance.

    <br/><br/>Cette publication doit être lue conjointement avec la CEI 62439-1:2010.
