abstract:
- language: en
  script: Latn
  content: |-
    IEC 62439-3:2016 is applicable to high-availability automation networks based on the Ethernet technology. This part of IEC 62439 specifies two redundancy protocols designed to provide seamless recovery in case of single failure of an inter-bridge link or bridge in the network, which are based on the same scheme: parallel transmission of duplicated information. This third edition cancels and replaces the second edition published in 2012. This edition constitutes a technical revision. This edition includes the following significant technical changes with respect to the previous edition:<br/>
    - technical corrections and extension of specifications;<br/>
    - consideration of IEC 61588 clock synchronization with end-to-end delay measurement alongside the existing peer-to-peer delay measurement in PRP.
- language: fr
  script: Latn
  content: |-
    L'IEC 62439-3:2016 s'applique aux réseaux d'automatisme à haute disponibilité basés sur la technologie Ethernet. Cette partie de l'IEC 62439 spécifie deux protocoles de redondance conçus pour assurer une reprise transparente en cas de défaillance unique de liaison interpont ou de pont au sein du réseau, basés sur le schéma: transmission en parallèle d'informations dupliquées. Cette troisième édition annule et remplace la deuxième édition parue en 2012. Cette édition constitue une révision technique. Cette édition inclut les modifications techniques majeures suivantes par rapport à l'édition précédente:<br/>
    - corrections techniques et extension des spécifications;<br/>
    - prise en compte de la synchronisation des horloges selon l'IEC 61588 lors de la mesure du délai entre extrémités et la mesure existante du délai entre homologues dans le protocole PRP.
