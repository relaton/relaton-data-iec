abstract:
- language: en
  script: Latn
  content: |-
    IEC 61755-1:2022 covers dispersion unshifted single-mode fibre optic connection interfaces. It includes references, document structure details, definitions, and standardised optical connection grades. The grades are based on random mated connections between two optical connector populations according to required characteristics including fibre mode field diameter (MFD) mismatch. It also defines standardized test methods where appropriate. This second edition cancels and replaces the first edition published in 2005. This edition constitutes a technical revision. This edition includes the following significant technical changes with respect to the previous edition:<br/>
    - deletion of Figure 2, Figure 3 and Table 4, and consideration of the whole parts of the text;<br/>
    - addition of the test method for random mating of the multifibre connectors;<br/>
    - introduction of a nomenclature for the specified core location variants;<br/>
    - replacement of the limited MFD range, which is now in line with the complete MFD range specified in IEC 60793-2-50;<br/>
    - replacement of the references to reliability standards to reliability technical reports;<br/>
    - new general title for the series.
- language: fr
  script: Latn
  content: |-
    L'IEC 61755-1:2022 document traite des interfaces de connexion fibroniques unimodales à dispersion non décalée. Il comprend des références, des précisions sur la structure du document, des définitions et des classes de connexion optique normalisées. Les classes sont fondées sur des connexions aléatoires entre deux populations de connecteurs optiques selon des caractéristiques exigées, y compris la désadaptation du diamètre du champ de mode (MFD - mode field diameter) de la fibre. Il définit également les méthodes d’essais normalisées, s’il y a lieu. Cette deuxième édition annule et remplace la première édition parue en 2005. Cette édition constitue une révision technique. Cette édition inclut les modifications techniques majeures suivantes par rapport à l’édition précédente:<br/>
    - suppression de la Figure 2, de la Figure 3 et du Tableau 4, et prise en considération de parties du texte dans leur intégralité;<br/>
    - ajout de la méthode d’essai relative à la connexion aléatoire de connecteurs multifibres;<br/>
    - présentation de la nomenclature des variantes de l'emplacement du cœur spécifié;<br/>
    - remplacement de la plage limitée de MFD qui est maintenant conforme à la plage complète de MFD spécifiée dans l’IEC 60793-2-50;<br/>
    - remplacement des références aux normes de fiabilité par des rapports techniques de fiabilité;<br/>
    - nouveau titre général pour la série.
