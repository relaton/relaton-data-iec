abstract:
- language: en
  script: Latn
  content: |-
    IEC 62453-1:2016 presents an overview and guidance for the IEC 62453 series. It<br/>
    - explains the structure and content of the IEC 62453 series (see Clause 5);<br/>
    - provides explanations of some aspects of the IEC 62453 series that are common to many of the parts of the series;<br/>
    - describes the relationship to some other standards.<br/>
    This second edition cancels and replaces the first edition published in 2009. This edition constitutes a technical revision. This edition includes the following significant technical changes with respect to the previous edition: introduction of a new implementation technology (defined in IEC 62453-42).
- language: fr
  script: Latn
  content: |-
    L'IEC 62453-1:2016 présente une vue générale et fournit un guide pour la série IEC 62453. Elle<br/>
    - explique la structure et le contenu de la série IEC 62453 (voir Article 5);<br/>
    - fournit des explications de certains aspects de la série IEC 62453 qui sont communs à beaucoup de parties de la série;<br/>
    - décrit la relation avec d'autres normes.<br/>
    Cette deuxième édition annule et remplace la première édition parue en 2009. Cette édition constitue une révision technique. Cette édition inclut les modifications techniques majeures suivantes par rapport à l'édition précédente: introduction d'une nouvelle technologie de mise en œuvre (définie dans l'IEC 62453-42).
