  script: Latn
  content: Traite de la sécurité des machines à laver le linge électriques pour usages domestiques et analogues destinés à laver des vêtements et des textiles dont la tension assignée n'est pas supérieure à 250 V pour les appareils monophasés et à 480 V pour les autres appareils.
