abstract:
- language: en
  script: Latn
  content: IEC/TR 60269-5:2010 serves as an application guide for low-voltage fuses, shows how current-limiting fuses are easy to apply to protect today's complex and sensitive electrical and electronic equipment. This guidance specifically covers low-voltage fuses up to 1 000 V a.c. and 1 500 V d.c. designed and manufactured in accordance with IEC 60269 series. This guidance provides important facts about as well as information on the application of fuses.
- language: fr
  script: Latn
  content: La CEI/TR 60269-5:2010 est un guide d'application des fusibles basse tension, montre que les fusibles limiteurs de courant sont faciles à utiliser pour protéger le matériel électronique complexe et sensible d'aujourd'hui. Ces lignes directrices couvrent spécifiquement les fusibles basse tension de tensions jusqu'à 1 000 V en courant alternatif et 1 500 V en courant continu selon la série CEI 60269. Elles fournissent des informations sur les fusibles ainsi que sur leurs applications.
