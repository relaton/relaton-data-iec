abstract:
- language: en
  script: Latn
  content: |-
    Specifies functional dimensions for metal thermowells for thermo-meter sensors of nominal diameters ranging from 3 mm to 8 mm for use in process control.<br/>
    The contents of the corrigendum of September 2017 have been included in this copy.
- language: fr
  script: Latn
  content: |-
    Spécifie les dimensions fonctionnelles des doigts de gantsmétalliques pour capteurs de température de diamètre nominal compris entre 3 mm et 8 mm, destinés à une utilisation dans une application de contrôle-commande.<br/>
    Le contenu du corrigendum de septembre 2017 a été pris en considération dans cet exemplaire.
