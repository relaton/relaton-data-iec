  script: Latn
  content: S'applique aux moniteurs et aux signaleurs de contamination destinés spécialement aux mains et (ou) aux pieds, que les mains ou les pieds soient nus ou non, et définit pour ces appareils les conditions générales, les caractéristiques liées aux rayonnements, les caractéristiques de fonctionnement, les caractéristiques mécaniques et le certificat d'identification.
