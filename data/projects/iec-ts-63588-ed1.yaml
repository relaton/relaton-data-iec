abstract:
- language: en
  script: Latn
  content: |-
    IEC TS 63588:2026 is applicable to high intensity therapeutic ultrasound (HITU) devices, specifying: <br/>
    – Devices and methods suitable for direct measurements of relevant parameters for high pressure levels in water;<br/>
    – measurement methods at relatively high therapeutic field output levels;<br/>
    – consideration of sidelobes and pre-focal maxima;<br/>
    – parameters relevant to HITU transducers of different construction and geometry, including non-focusing, focusing with or without lenses, collimated, diverging and convergent transducers, multi-element transducers, scanning transducers and multiple sources.<br/>
    This document supports the fulfilment of ultrasonic measurement requirements that will be specified in a future Technical Specification on measurement-based simulation of ultrasonic fields in water.<br/>
    This document can be used in quality assurance, safety testing, and the standardization of communications regarding the clinical performance of HITU systems. Where possible, this document incorporates specifications from other related standards. <br/>
    This document does not apply to the following types of devices, which are covered by other standards:<br/>
    – lithotripters (see IEC 61846);<br/>
    – surgical equipment (see IEC 61847); <br/>
    – physiotherapy devices (see IEC 61689).
