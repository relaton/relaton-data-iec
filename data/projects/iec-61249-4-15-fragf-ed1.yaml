abstract:
- language: fr
  script: Latn
  content: La CEI 61249-4-15:2009 fournit des exigences concernant les propriétés des préimprégnés principalement prévus pour être utilisés en tant que feuilles de collage en relation avec des stratifiés selon la CEI 61249-2-35 durant la fabrication des cartes multicouches selon la CEI 62326-4. Les cartes multicouches constituées de ces matériaux conviennent pour des processus d'assemblage sans plomb. Ce matériau peut également être utilisé pour coller d'autres types de stratifiés. Un préimprégné, selon la présente norme, est d'une inflammabilité définie (essai de combustion verticale). L'inflammabilité nominale d'un préimprégné entièrement traité est obtenue en utilisant des retardateurs de flamme bromés faisant partie intégrante de la structure polymère. Après traitement du préimprégné selon les instructions du fabricant, la température de transition vitreuse est définie comme étant comprise entre 150 °C et 200 °C.
