abstract:
- language: en
  script: Latn
  content: |-
    This third edition of IEC 60335-1(1991) and its 1st amendment (1994) covers the general requirements for safety of household appliances. All parts 2s, dealing with particular requirements, should be used in conjunction with this 3rd edition, except parts 2-57 and 2-63.

    The contents of the corrigenda of February 1993 and August 1994 have been included in this copy.
- language: fr
  script: Latn
  content: |-
    Cette troisième édition de la CEI 60335-1 (1991) et son 1er amendement (1994) couvrent les specifications générales de sécurité des appareils electrodomestiques. Toutes les parties 2, traitant des specifications particulières, doivent être lues conjointement avec cette 3ème édition, sauf les parties 2-57 et 2-63. 

    Le contenu des corrigendas de février 1993 et d'août 1994 a été pris en considération dans cet exemplaire.
