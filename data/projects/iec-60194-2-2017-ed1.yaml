abstract:
- language: en
  script: Latn
  content: |-
    IEC 60194-2:2017(E) covers terms and definitions related to printed board and electronic assembly technologies as well as other electronic technologies.<br/>
    This first edition, together with IEC 60194-1, will cancel and replace IEC 60194:2015. This edition constitutes a technical revision.<br/>
    This edition includes the following significant technical changes with respect to IEC 60194:2015:<br/>
    a)   exclusion of 32 general terms better served by other TCs;<br/>
    b)   exclusion of 47 terms no longer used by the electronics assembly industry;<br/>
    c)   inclusion of 13 new terms related with device embedded substrate technology;<br/>
    d)   removal of identification codes for terms as well as annexes.
