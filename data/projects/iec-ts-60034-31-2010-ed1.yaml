abstract:
- language: en
  script: Latn
  content: IEC/TS 60034-31:2010 provides a guideline of technical aspects for the application of energy-efficient, three-phase, electric motors. It not only applies to motor manufacturers, original equipment manufacturers, end users, regulators and legislators but to all other interested parties. Is applicable to all electrical machines covered by IEC 60034-30.
- language: fr
  script: Latn
  content: La CEI/TS 60034-31:2010 donne une ligne directrice concernant les aspects techniques relatifs à l'application des moteurs électriques éconergétiques triphasés. Elle s'applique non seulement aux fabricants de moteurs, aux fabricants originaux d'équipement, aux utilisateurs finaux, aux autorités de réglementation et aux législateurs, mais également à toutes les autres parties intéressées. Est applicable à toutes les machines électriques couvertes par la CEI 60034-30.
