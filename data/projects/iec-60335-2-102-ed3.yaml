abstract:
- language: en
  script: Latn
  content: |-
    IEC 60335-2-102:2026 deals with the safety of gas, oil and solid-fuel burning appliances having electrical connections, for household and similar purposes, their rated voltage being not more than 250 V for single-phase appliances and 480 V for other appliances including direct current (DC) supplied appliances and battery-operated appliances.<br/>
    This standard covers the electrical safety and some other safety aspects of these appliances. All safety aspects are covered when the appliance also complies with the relevant standard for the fuel-burning appliance. If the appliance incorporates electric heating sources, safety aspects concerning these electric sources are covered when the appliance also complies with a relevant part 2 of IEC 60335.<br/>
    Appliances not intended for normal household use but which nevertheless can be a source of danger to the public, such as appliances intended to be used by laypersons in shops, in light industry and on farms, are within the scope of this standard.<br/>
    Examples of appliances within the scope of this standard are:<br/>
    – central heating boilers;<br/>
    – commercial catering equipment;<br/>
    – cooking appliances;<br/>
    – laundry and cleaning appliances;<br/>
    – room heaters;<br/>
    – warm air heaters;<br/>
    – water heaters.<br/>
    As far as is practicable, this standard deals with the common hazards presented by appliances that are encountered by all persons in and around the home. However, in general, it does not take into account:<br/>
    – persons (including children) whose physical, sensory or mental capabilities; or lack of experience and knowledge prevents them from using the appliance safely without supervision or instruction;<br/>
    – children playing with the appliance.<br/>
    Attention is drawn to the fact that:<br/>
    – for appliances intended to be used in vehicles or on board ships or aircraft, additional requirements can be necessary;<br/>
    – in many countries, additional requirements are specified by the national health authorities, the national authorities responsible for the protection of labour and similar authorities.<br/>
    This standard does not apply to:<br/>
    – appliances intended exclusively for industrial purposes;<br/>
    – appliances intended to be used in locations where special conditions prevail, such as the presence of a corrosive or explosive atmosphere (dust, vapour or gas).<br/>
    This third edition cancels and replaces the second edition published in 2017. This edition constitutes a technical revision.<br/>
    This edition includes the following significant technical changes with respect to the previous edition:<br/>
    – alignment with IEC 60335-1:2020;<br/>
    – conversion of some Notes to normative text (Clause 1, 8.101, 11.8, 15.101, 16.3);<br/>
    – clarification of the requirement for moisture resistance (15.101);<br/>
    – addition of external accessible surface temperature limits for appliances with electric heat sources where there is no relevant IEC 60335 part 2 standard (3.6.102, 3.6.103, 7.12.1, 11.3, 11.8, Table 102, Figure 102);<br/>
    – application of test probe 19 for parts no more than 850 mm from the floor (7.12.1, 8.1.1, 8.1.3, 20.2);<br/>
    – addition of requirements for appliances intended for installation in areas with restricted access (3.8.103, 7.12.1, 8.1.1, 11.8, Table 102, 20.2, 22.106);<br/>
    – limitation of the application of test probes and external accessible surface temperatures for parts of appliances above 850 mm, 1,8 m or 2,3 m after installation (7.12.1, Table 102, 20.2);<br/>
    – addition of requirements for parts made of particle foam material (3.8.104, 21.2, 22.104, 22.105, 22.106, 30.1, 30.1.101, Figures 103 and 104);<br/>
    – clarification of requirements for controls and software to align with requirements for fuel control standards and fuel burning appliance standards (19.11.2, 19.11.3, 19.13, 22.46, 24.1, Annex AA, Annex BB).<br/>
    This part 2 is to be used in conjunction with the latest edition of IEC 60335-1 and its amendments unless that edition precludes it; in that case, the latest edition that does not preclude it is used. It was established on the basis of the sixth edition (2020) of that standard.
