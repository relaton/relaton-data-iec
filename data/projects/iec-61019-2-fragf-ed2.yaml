abstract:
- language: fr
  script: Latn
  content: |-
    L'IEC 61019-2:2005 donne un guide pratique des résonateurs à OAS utilisés dans les télécommunications, dans les équipements de radio et les produits de consommation. Il doit être utilisé dans la conjonction avec IEC 61019-1. Les résonateurs à OAS sont caractérisés par leurs petites dimensions, leur faible poids, l'absence de réglage et leur fiabilité élevée. Les principales modifications par rapport à l'édition antérieure sont indiquées ci-dessous:<br/>
    - à la fin de 5.1, le réflecteur de bord a été ajouté. L'ouvrage de référence qui s'y rapporte a été inséré dans la bibliographie;<br/>
    - dans le Tableau 1, les propriétés de propagation du LiNbO3 (64° Y) ont été ajoutées;<br/>
    - dans le Tableau 3, les numéros des articles et des paragraphes ont été corrigés pour correspondre à la CEI 61019-1 (2004) qui remplace la CEI 61019-1-1 (1990) et la CEI 61019-1-2 (1993).
