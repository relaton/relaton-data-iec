abstract:
- language: en
  script: Latn
  content: |-
    IEC 62505-3-3:2020 is applicable to new voltage transformers which are:<br/>
    - intended for use in indoor or outdoor fixed installations in tractions systems, and<br/>
    - operated with an AC line voltage and frequency as specified in IEC 60850.<br/>
    This document also applies to voltage transformers other than inductive types as far as reasonably possible. Requirements of this document have priority.<br/>
    This second edition cancels and replaces the first edition published in 2009. This edition includes the following significant technical changes with respect to the previous edition:<br/>
    This standard was revised to reflect the latest versions of standards referenced and to remove text already included in the IEC 61869 series.<br/>
    The structure of the document was adapted to that of IEC 62505‑1 and IEC 62505‑2.<br/>
    Ratings have been added to provide designations in line with other railway standards, for example IEC 62497.<br/>
    Tests requirements have been detailed to meet operating conditions of railway applications.<br/>
    Partial discharge voltages have been specified
