abstract:
- language: en
  script: Latn
  content: |-
    IEC 60317-0-2:2013 specifies the general requirements of enamelled rectangular copper winding wires. The range of nominal conductor dimensions is given in the relevant specification sheet. This third edition cancels and replaces the second edition published in 1997, Amendment 1:1999 and Amendment 2:2005. This edition constitutes a technical revision. This edition includes the following significant technical changes with respect to the previous edition:<br/>
    - addition of 3.2.2, transferring general winding wire requirements from the scope;<br/>
    - correction to Table 7 units;<br/>
    - change to Clause 15 requirements with a simple reference to IEC 60172;<br/>
    - deletion of Annex E. Key words: requirements of enamelled rectangular copper winding wires<br/>
    <br/>
    This publication is to be read in conjunction with the IEC 60851 series.
- language: fr
  script: Latn
  content: |-
    La CEI 60317-0-2:2013 spécifie les exigences générales pour les fils de bobinage de section rectangulaire en cuivre émaillé. La gamme des dimensions nominales des conducteurs est donnée dans la feuille de spécification appropriée. Cette troisième édition de la CEI 60317-0-2 annule et remplace la deuxième édition parue en 1997, l'Amendement 1:1999 et l'Amendement 2:2005. Cette édition constitue une révision technique. Cette édition inclut les modifications techniques majeures suivantes par rapport à l'édition précédente:<br/>
    - ajout du Paragraphe 3.2.2 transférant des exigences générales sur le fil de bobinage, présentes dans le domaine d'application;<br/>
    - correction des unités du Tableau 7;<br/>
    - modification des exigences de l'Article 15 avec une simple référence à la CEI 60172;<br/>
    - suppression de l'Annexe E. Mots clés: exigences pour les fils de bobinage de section rectangulaire en cuivre émaillé<br/>
    <br/>
    Cette publication doit être lue conjointement avec la série CEI 60851.
