abstract:
- language: en
  script: Latn
  content: |-
    IEC 61158-5-4:2019 (E) provides common elements for basic time-critical and non-time-critical messaging communications between application programs in an automation environment and material specific to Type 4 fieldbus. The term “time-critical” is used to represent the presence of a time-window, within which one or more specified actions are required to be completed with some defined level of certainty. Failure to complete specified actions within the time window risks failure of the applications requesting the actions, with attendant risk to equipment, plant and possibly human life.<br/>
    This International Standard defines in an abstract way the externally visible service provided by the Type 4 fieldbus application layer in terms of:<br/>
    a) an abstract model for defining application resources (objects) capable of being manipulated by users via the use of the FAL service,<br/>
    b) the primitive actions and events of the service;<br/>
    c) the parameters associated with each primitive action and event, and the form which they take; and<br/>
    d) the interrelationship between these actions and events, and their valid sequences.
- language: fr
  script: Latn
  content: |-
    L’IEC 61158-5-4:2019 (FR) fournit des éléments communs pour les communications de messagerie prioritaires et non prioritaires élémentaires entre les programmes d’application des environnements d’automatisation et le matériel spécifique au bus de terrain de type 4. On utilise le terme "prioritaire" pour traduire la présence d’une fenêtre temporelle, à l’intérieur de laquelle il est exigé qu'une ou plusieurs actions spécifiées soient terminées avec un niveau de certitude défini. Si les actions spécifiées ne sont pas réalisées dans la fenêtre temporelle, les applications demandant les actions risquent de connaître une défaillance, avec les risques que cela comporte pour les équipements, les installations et éventuellement la vie humaine.<br/>
    La présente norme définit de manière abstraite le service visible de l'extérieur fourni par la couche application de bus de terrain de type 4 en termes<br/>
    a) d’un modèle abstrait pour la définition des ressources d’application (objets) qui peuvent être manipulées par les utilisateurs par l'intermédiaire de l’utilisation du service FAL,<br/>
    b) des actions primitives et des événements du service;<br/>
    c) des paramètres associés à chaque action et événement primitif, et de la forme qu’ils peuvent prendre; et<br/>
    d) des interrelations entre ces actions et événements, et de leurs séquences valides.
