- language: en
  script: Latn
  content: IEC TR 62102:2005 This technical report is a guide to the determination of the interface requirements for equipment in terms of safety. It lists a number of interfaces and indicates the safety category of each listed interface. This technical report does not contain sufficient detail for conformance testing purposes, except when used in conjunction with product standards such as IEC 60950-1 and IEC 60950-21.
