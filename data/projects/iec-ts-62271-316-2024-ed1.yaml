- language: en
  script: Latn
  content: IEC TS 62271-316:2024 is applicable to direct current (DC) converter by-pass switches (CBPS) and paralleling switches (PS) designed for indoor or outdoor installation and for operation on HVDC transmission systems having direct voltages of 100 kV and above. Switches other than mechanical switching devices used for the same applications specified here are not covered by this document.
