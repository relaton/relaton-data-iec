abstract:
- language: en
  script: Latn
  content: IEC 60556:2006 describes methods of measuring the properties used to specify polycrystalline microwave ferrites in accordance with IEC 60392 and for general use in ferrite technology. These measuring methods are intended for the investigation of materials, generally referred to as ferrites, for application at microwave frequencies. This second edition is a consolidation of the first edition and its amendments 1 and 2. It includes editorial improvements as well as improvements to the figures.
- language: fr
  script: Latn
  content: La CEI 60556:2006 décrit des méthodes de mesure des propriétés utilisées pour spécifier des ferrites polycristallins pour hyperfréquences conformément à la CEI 60392 et l'utilisation générale de la technologie des ferrites. Ces méthodes de mesure sont destinées à l'étude de matériaux, les ferrites, pour lesapplications hyperfréquences. Cette deuxième édition est une consolidation de la première édition et de ses amendements 1 et 2. Elle inclut des améliorations éditoriales et des améliorations des figures.
