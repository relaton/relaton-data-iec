abstract:
- language: en
  script: Latn
  content: |-
    IEC 61158-3-4:2019 provides common elements for basic time-critical messaging communications between devices in an automation environment. The term “time-critical” is used to represent the presence of a time-window, within which one or more specified actions are required to be completed with some defined level of certainty. Failure to complete specified actions within the time window risks failure of the applications requesting the actions, with attendant risk to equipment, plant and possibly human life.<br/>
    This International Standard defines in an abstract way the externally visible services provided by the Type 4 fieldbus data-link layer in terms of<br/>
    a) the primitive actions and events of the services;<br/>
    b) the parameters associated with each primitive action and event, and the form which they take; and<br/>
    c) the interrelationship between these actions and events, and their valid sequences.
- language: fr
  script: Latn
  content: |-
    L’IEC 61158-3-4:2019 fournit les éléments communs des communications de messagerie critiques du point de vue temporel entre dispositifs dans un environnement automatisé. Le terme "en temps critique" signale l'existence d'une fenêtre temporelle dans laquelle des actions spécifiées doivent être exécutées, avec un niveau de certitude défini. La non-réalisation des actions spécifiées dans la fenêtre temporelle induit un risque de défaillance des applications qui demandent ces actions, avec les risques afférents pour l'équipement, les installations et éventuellement la vie humaine.<br/>
    La présente norme définit de manière abstraite les services visibles de l'extérieur fournis par la couche liaison de données de réseau de terrain de type 4 en termes<br/>
    a) des actions et événements primitifs des services;<br/>
    b) de paramètres associés à chaque événement et action de primitive, ainsi que de forme prise par ces paramètres; et<br/>
    c) d'interaction entre ces événements et ces actions, ainsi que de séquences valides desdits événements et actions.
