abstract:
- language: en
  script: Latn
  content: |-
    Deals with the safety of electric sewing machines for household and similar use, their rated voltage being not more than 250 V for single-phase appliances and 480 V for other appliances.
    Overlock machines and electrical sets are within the scope of the standard. 
    It is to be used in conjunction with IEC 335-1, (third edition).
