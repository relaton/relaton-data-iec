abstract:
- language: fr
  script: Latn
  content: |-
    La CEI 61937-1:2007 s'applique à l'interface audionumérique conforme à la série CEI 60958, pour l'acheminement des flux de bits audio à codage MIC non linéaire. Elle décrit la manière d'utiliser cette interface dans les applications grand public. Le domaine d'application de la présente norme ne couvre pas le domaine professionnel (AES/EBU). Cette seconde édition annule et remplace la première édition publiée en 2000. Elle contient les modifications techniques majeures suivantes par rapport à l'édition précédente:<br/>
    - Le champ type-de-données dans Pc est étendu des bits 0 à 4 aux bits 0 à 6.<br/>
    - Une nouvelle définition de Pd est spécifiée.<br/>
    - Les coefficients de multiplication pour la fréquence des symboles sont changés pour faire référence à chaque partie de la CEI 61937.<br/>
    - L'exigence sur l'espacement entre les salves est changée.<br/>
    La présente version bilingue, publiée en 2011-04, correspond à la version anglaise. La version française de cette norme n'a pas été soumise au vote.
