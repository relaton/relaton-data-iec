abstract:
- language: en
  script: Latn
  content: |-
    IEC 60404-1:2016 is available as IEC 60404-1:2016 RLV which contains the International Standard and its Redline version, showing all changes of the technical content compared to the previous edition.<br/>
    <br/>
    IEC 60404-1:2016 is intended to classify commercially available magnetic materials. The term "magnetic materials" denotes substances where the application requires the existence of ferromagnetic or ferrimagnetic properties. The classification of magnetic materials is based upon the generally recognized existence of two main groups of products:<br/>
    - soft magnetic materials (coercivity less than or equal to 1 000 A/m);<br/>
    - hard magnetic materials (coercivity greater than 1 000 A/m).<br/>
    This edition includes the following significant technical changes with respect to the previous edition:<br/>
    a) Removal of all tables and values describing typical properties of the material to be consistent with the aim of the document to be a classification and not a specification.<br/>
    b) Enlargement of the Ni content for the classes E1 and E3.<br/>
    c) Enlargement of the Co content for the classes F3.<br/>
    d) Addition of a new class: U5 bonded rare earth-iron-nitrogen magnets.
- language: fr
  script: Latn
  content: |-
    L'IEC 60404-1:2016 a pour objet la classification des matériaux magnétiques disponibles commercialement.<br/>
    Le terme "matériaux magnétiques" décrit les substances dont l'application exige l'existence de propriétés ferromagnétiques ou ferrimagnétiques.<br/>
    Dans le présent document, la classification des matériaux magnétiques est basée sur l'existence généralement reconnue de deux groupes principaux de produits:<br/>
    ·      les matériaux magnétiques doux (coercitivité £1 000 A/m);<br/>
    ·      les matériaux magnétiques durs (coercitivité &gt;1 000 A/m).<br/>
    Cette édition inclut les modifications techniques majeures suivantes par rapport à l'édition précédente:<br/>
    a)   Suppression de l'ensemble des tableaux et valeurs décrivant les propriétés types du matériau dans un souci de cohérence avec l'objectif du document visant à établir une classification et non une spécification.<br/>
    b)   Augmentation de la teneur en Ni pour les classes E1 et E3.<br/>
    c)   Augmentation de la teneur en Co pour les classes F3.<br/>
    d)   Ajout d'une nouvelle classe: classe U5 – aimants agglomérés terres rares-fer-azote.
