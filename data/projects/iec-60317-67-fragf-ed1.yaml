abstract:
- language: en
  script: Latn
  content: |-
    IEC 60317-67:2017 specifies the requirements of enamelled rectangular aluminium winding wire of class 105 with a sole coating based on polyvinyl acetal resin, which may be modified providing it retains the chemical identity of the original resin and meets all specified wire requirements. The range of nominal conductor dimensions covered by this standard is:<br/>

    	
    		
    			
    				 
    			
    				Minimum
    			
    				Maximum
    		
    		
    			
    				Width
    			
    				2,0 mm
    			
    				16,0 mm
    		
    		
    			
    				Thickness
    			
    				0,80 mm
    			
    				5,60 mm
    		
    	


    	 
    Wires of grade 1 and grade 2 are included in this part of IEC 60317 and apply to the complete range of conductors. The specified combinations of width and thickness as well as the specific ratio width/thickness are given in IEC 60317-0-9.<br/>
    This publication is to be read in conjunction with IEC 60317-0-9:2015.
- language: fr
  script: Latn
  content: |-
    IEC 60317-67:2017 spécifie les exigences relatives au fil de bobinage d’aluminium de section rectangulaire émaillé de classe 105 avec un revêtement unique à base de résine d’acétal de polyvinyle, qui peut être modifiée à condition de conserver la dénomination chimique de la résine d'origine et satisfaire à toutes les exigences spécifiées du fil.La plage de dimensions nominales du conducteur couverte par la présente norme est la suivante:<br/>
    <br/>

    	
    		
    			
    				
    					<p style="margin: 3pt 0in;">
    						<strong> </strong></p>
    				
    				
    					<p style="margin: 3pt 0in;">
    						Minimale</p>
    				
    				
    					<p style="margin: 3pt 0in;">
    						Maximale</p>
    				
    			
    			
    				
    					<p style="margin: 3pt 0in;">
    						Largeur</p>
    				
    				
    					<p style="margin: 3pt 0in;">
    						2,0 mm</p>
    				
    				
    					<p style="margin: 3pt 0in;">
    						16,0 mm</p>
    				
    			
    			
    				
    					<p style="margin: 3pt 0in;">
    						Epaisseur</p>
    				
    				
    					<p style="margin: 3pt 0in;">
    						0,80 mm</p>
    				
    				
    					<p style="margin: 3pt 0in;">
    						5,60 mm</p>
    				
    			
    		
    	

    <br/>
    Les fils de grade 1 et de grade 2 sont inclus dans la présente partie de l'IEC 60317 et s’appliquent à la plage complète de conducteurs. Les combinaisons spécifiées de largeurs et d’épaisseurs ainsi que le rapport spécifique largeur/épaisseur sont donnés dans l’IEC 60317-0-9.<br/>
    Mots clés: fils isolés utilisés dans les enroulements des appareils électriques, classe 105
