abstract:
- language: en
  script: Latn
  content: IEC 61082-1:2006 provides general rules and guidelines for the presentation of information in documents, and specific rules for diagrams, drawings and tables used in electrotechnology. It has the status of a horizontal standard in accordance with IEC Guide 108.
- language: fr
  script: Latn
  content: La CEI 61082-1:2006 définit des règles générales et sert de guide pour la présentation des informations dans les documents et définit des règles particulières pour les schémas, les dessins et les tableaux utilisés en électrotechnique. Elle a le statut d'une norme horizontale conformément au Guide 108 de la CEI.
