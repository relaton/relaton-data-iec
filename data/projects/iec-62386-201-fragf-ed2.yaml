abstract:
- language: fr
  script: Latn
  content: |-
    L'IEC 62386-201:2015 spécifie un système de bus pour la commande par des signaux numériques des appareils d'éclairage électroniques. Il convient que ces appareils d'éclairage électroniques satisfassent aux exigences de l'IEC 61347. Le présent document est applicable aux appareillages de commande associés aux lampes fluorescentes. Cette deuxième édition annule et remplace la première édition de l'IEC 62386-201 parue en 2009. Cette édition constitue une révision technique. Les modifications majeures par rapport à la première édition sont les suivantes:<br/>
    - mise à jour des références aux paragraphes de l'IEC 62386-101 et de l'IEC 62386-102 pour tenir compte de la nouvelle structure de la norme;<br/>
    - amélioration des séquences d'essai et description des séquences d'essai sous la forme d'un pseudo-code au lieu d'organigrammes.
