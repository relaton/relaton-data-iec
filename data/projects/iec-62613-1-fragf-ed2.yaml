abstract:
- language: en
  script: Latn
  content: |-
    IEC 62613-1:2019 applies to accessories with

    	three phases and earth with pilot contacts,
    	one pole for neutral.

    These accessories have rated currents not exceeding 500 A and rated operating voltages not exceeding 12 kV 50/60 Hz.<br/>
    This second edition cancels and replaces the first edition published in 2011. This edition constitutes a technical revision.<br/>
    This edition includes the following significant technical changes with respect to the previous edition:

    	extension of the scope to an unlimited number of pilot contacts (previously limited to 3);
    	update of the Figures and deletion of their embedded texts;
    	insertion of tables of keys whenever required by the Figures.


    <p>This bilingual version (2019-08) corresponds to the monolingual English version, published in 2019-05.<br/>
    The French version of this standard has not been voted upon.</p>
- language: fr
  script: Latn
  content: |-
    L'IEC 62613-1:2019 s'applique aux accessoires

    	triphasés avec terre de protection et contacts pilotes,
    	unipolaires pour le neutre.

    Ces accessoires ont un courant assigné ne dépassant pas 500 A et une tension d'emploi assignée ne dépassant pas 12 kV 50/60 Hz.<br/>
    Cette deuxième édition annule et remplace la première édition parue en 2011. Cette édition constitue une révision technique.<br/>
    Cette édition inclut les modifications techniques majeures suivantes par rapport à l'édition précédente:

    	extension du domaine d'application à un nombre illimité de contacts pilotes (précédemment limités à 3);
    	mise à jour des figures et suppression de leurs textes intégrés;
    	insertion de tableaux de légendes partout où l'exigent les figures.

    La présente version bilingue (2019-08) correspond à la version anglaise monolingue publiée en 2019-05.<br/>
    La version française de cette norme n'a pas été soumise au vote.
