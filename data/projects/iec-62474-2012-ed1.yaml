abstract:
- language: en
  script: Latn
  content: |-
    IEC 62474:2012 specifies the procedure, content, and form relating to material declarations for products of companies operating in and supplying the electrotechnical industry. Process chemicals and emissions during product use are not in the scope of this International Standard. It provides data to downstream manufacturers that:<br/>
    - allows them to assess products against substance restriction compliance requirements;<br/>
    - they can use in their environmentally conscious design process and across all product life cycle phases. A database associated with this document is available at http://std.iec.ch/iec62474. It contains the list of:<br/>
    - Declarable substance groups and declarable substances;<br/>
    - Reference Substances;<br/>
    - Material classes;<br/>
    - XML schema for data format and exchange and the accompanying developer table.
- language: fr
  script: Latn
  content: |-
    La CEI 62474:2012 décrit la procédure, le contenu et la forme des déclarations de matières pour les produits des entreprises et des fournisseurs de l'industrie électrotechnique. Les produits chimiques et les émissions du processus pendant l'utilisation du produit n'entrent pas dans le domaine d'application de la présente Norme internationale. Elle fournit aux fabricants situés en aval des données qui:<br/>
    - leur permettent d'évaluer des produits au vu des exigences de conformité et de restriction de substances;<br/>
    - peuvent être utilisées dans le cadre de leur processus d'écoconception et dans toutes les phases du cycle de vie du produit. Une base de données associée au présent document est disponible à l'adresse http://std.iec.ch/iec62474. Elle contient la liste des:<br/>
    - groupes de substances déclarables et les substances déclarables;<br/>
    - substances de référence;<br/>
    - classes de matières;<br/>
    - schémas XML pour le format et l'échange de données et le tableau développeurs d'accompagnement.
