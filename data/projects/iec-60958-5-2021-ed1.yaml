abstract:
- language: en
  script: Latn
  content: |-
    IEC 60958-5:2021 enhances the consumer application of the interface for the interconnection of digital audio equipment defined in IEC 60958-1 and IEC 60958-3, introducing:<br/>
    - multichannel;<br/>
    - multi-stream;<br/>
    - high-resolution;<br/>
    - multimedia extension;<br/>
    - related applications.
- language: fr
  script: Latn
  content: |-
    L'IEC 60958-5:2021 a pour objet d'améliorer l'application grand public de l'interface destinée à l'interconnexion des appareils audionumériques définis dans l'IEC 60958-1 et l'IEC 60958-3, en introduisant les améliorations suivantes:<br/>
    - voies multiples;<br/>
    - multiflux;<br/>
    - haute résolution;<br/>
    - extension multimédia;<br/>
    - applications connexes.
