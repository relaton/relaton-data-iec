  script: Latn
  content: Décrit une procédure d'essai pour mesurer le diagramme de l' il et les paramètres de la forme d'onde tels que le temps de montée, le temps de descente, le taux de dépassement et le taux d'extinction. Sinon, la forme d'onde peut être déterminée avec un masque de forme d'onde prédéterminé.
