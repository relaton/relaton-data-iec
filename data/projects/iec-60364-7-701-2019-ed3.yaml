abstract:
- language: en
  script: Latn
  content: |-
    IEC 60364-7-701:2019 applies to electrical installations in indoor or outdoor locations where a bath tub and/or a shower is intended to be permanently placed in a specific location.<br/>
    The extent of the location containing a bath tub and/or a shower is limited by:<br/>
    – the lowest finished floor level;<br/>
    – a horizontal plane 3 m above the lowest finished floor level;<br/>
    – a vertical circumscribing virtual surface at a distance of 4 m from the fixed water outlet for the bath tub or shower; and<br/>
    – the volume within the walls, floor and ceiling that border the location containing a bath or shower, measured to a depth of 6 cm.<br/>
    The requirements of this document also apply to fixed electrical installations in mobile applications, for example caravans, mobile homes, shower containers. This document does not apply to emergency facilities, for example emergency showers used in industrial areas or laboratories.<br/>
    This third edition cancels and replaces the second edition published in 2006. This edition constitutes a technical revision.<br/>
    This edition includes the following significant technical changes with respect to the previous edition:<br/>
    – the scope gives precisions relevant to the application of this document;<br/>
    – the description of zones is improved;<br/>
    – relevant terms are defined.
- language: fr
  script: Latn
  content: |-
    IEC 60364-7-701:2019 s’applique aux installations électriques se trouvant dans des emplacements intérieurs ou extérieurs où une baignoire et/ou une douche sont destinées à être installées de façon permanente dans un emplacement spécifique.<br/>
    L’étendue de l’emplacement contenant une baignoire et/ou une douche est délimitée par:<br/>
    – le niveau le plus bas du sol fini;<br/>
    – un plan horizontal situé 3 m au-dessus du niveau le plus bas du sol fini;<br/>
    – une surface virtuelle verticale se situant à une distance de 4 m de l’arrivée d’eau fixe pour la baignoire ou la douche; et<br/>
    – le volume entre les murs, sol et plafond qui délimitent l’emplacement contenant une baignoire ou une douche, mesuré à une profondeur de 6 cm.<br/>
    Les exigences du présent document s’appliquent également aux installations électriques fixes dans des applications mobiles, par exemple les caravanes, mobil-homes, sanitaires mobiles. Le présent document ne s’applique pas aux équipements d’urgence, par exemple les douches d’urgence utilisées dans les installations industrielles ou dans les laboratoires.<br/>
    Cette édition inclut les modifications techniques majeures suivantes par rapport à l'édition précédente:<br/>
    – le domaine d’application donne des précisions relatives à l’application du présent document;<br/>
    – la description des volumes est améliorée;<br/>
    – les termes pertinents sont définis.
