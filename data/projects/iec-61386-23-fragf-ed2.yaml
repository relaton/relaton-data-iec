  content: |-
    <!-- NEW! -->IEC 61386-23:2021 is available as IEC 61386-23:2021 RLV which contains the International Standard and its Redline version, showing all changes of the technical content compared to the previous edition.<br/>
    <br/>
    IEC 61386-23:2021 specifies the requirements for flexible conduit systems. This document is to be used in conjunction with IEC 61386-1:2008 and IEC 61386‑1:2008/AMD1:2017. This second edition cancels and replaces the first edition published in 2002. This edition constitutes a technical revision. This edition includes the following significant technical changes with respect to the previous edition:<br/>
    - Annex AA has been added to provide guidance on the application of a constantly increasing force.
- language: fr
  script: Latn
  content: |-
    <!-- NEW! -->IEC 61386-23:2021 est disponible sous forme de IEC 61386-23:2021 RLV qui contient la Norme internationale et sa version Redline, illustrant les modifications du contenu technique depuis l'édition précédente.<br/>
    L’IEC 61386-23:2021 spécifie les exigences pour les systèmes de conduits souples.<br/>
    Le présent document doit être utilisé conjointement avec l'IEC 61386-1:2008 et l’IEC 61386‑1:2008/AMD1:2017.<br/>
    Cette deuxième édition annule et remplace la première édition parue en 2002. Cette édition constitue une révision technique.<br/>
    Cette édition inclut les modifications techniques majeures suivantes par rapport à l'édition précédente:

    	L’Annexe AA a été ajoutée. Elle donne des recommandations relatives à l’application d’une force en augmentation constante.

    La présente version bilingue (2021-12) correspond à la version anglaise monolingue publiée en 2021-04.<br/>
    La version française de cette norme n'a pas été soumise au vote.
