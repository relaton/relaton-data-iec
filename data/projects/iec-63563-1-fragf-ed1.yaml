abstract:
- language: en
  script: Latn
  content: IEC 63563-1:2025 introduces the Qi Specification, which applies to flat surface devices such as mobile phones and tablets that use up to 15 W of power. 2 The WPC actively investigates new applications for wireless power transfer, such as a cordless kitchen solution that uses Power Transmitters installed underneath countertops and tables.
- language: fr
  script: Latn
  content: |-
    IEC 63563-1:2025 présente la spécification Qi, qui s'applique aux appareils à surface plane tels que les téléphones mobiles et les tablettes qui utilisent jusqu'à 15 W d'énergie.[1]<br/>
    Le WPC étudie activement de nouvelles applications pour le transfert d'énergie sans fil, comme une solution de cuisine sans fil qui utilise des émetteurs de puissance installés sous les comptoirs et les tables qui permettent à une variété d'appareils de cuisine et d'ustensiles de cuisine intelligents de fonctionner sans cordon d'alimentation.
