abstract:
- language: en
  script: Latn
  content: |-
    IEC 62305-1:2010 provides general principles to be followed for protection of structures against lightning, including their installations and contents, as well as persons. This second edition cancels and replaces the first edition, published in 2006, and constitutes a technical revision. This edition includes the following significant technical changes with respect to the previous edition:<br/>
    1) It no longer covers protection of services connected to structures.<br/>
    2) Isolated interfaces are introduced as protection measures to reduce failure of electric and electronic systems.<br/>
    3) First negative impulse current is introduced as a new lightning parameter for calculation purposes.<br/>
    4) Expected surge overcurrents due to lightning flashes have been more accurately specified for low voltage power systems and for telecommunication systems.<br/>
    This bilingual version (2013-01) corresponds to the monolingual English version, published in 2010-12.
- language: fr
  script: Latn
  content: |-
    La CEI 62305-1:2010 fournit des principes généraux à suivre pour protéger les structures contre la foudre, y compris leurs installations, leur contenu et les personnes qui s'y trouvent. Cette deuxième édition annule et remplace la première édition parue en 2006. Elle constitue une révision technique. Par rapport à l'édition précédente, cette édition contient les modifications techniques notables suivantes:<br/>
    1) Elle ne couvre plus la protection des services connectés aux structures.<br/>
    2) Les interfaces isolées sont présentées comme des mesures de protection destinées à réduire les défaillances des réseaux de puissance et de communication.<br/>
    3) Le premier courant de choc négatif est présenté comme un nouveau paramètre de foudre servant aux calculs.<br/>
    4) Les surintensités prévues dues aux éclairs ont été spécifiées plus précisément pour les systèmes d'alimentation basse tension et les réseaux de communication.<br/>
    La présente version bilingue (2013-01) correspond à la version anglaise monolingue publiée en 2010-12.
