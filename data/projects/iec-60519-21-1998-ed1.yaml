abstract:
- language: en
  script: Latn
  content: |-
    Covers the safety aspects of electrical parts also in the case when electrical heating is combined with other means of heating, for example liquid fuel heating. Supplements and modifies the corresponding clauses in IEC 60519-2.

    The contents of the corrigendum of June 1999 have been included in this copy.
- language: fr
  script: Latn
  content: |-
    Couvre les aspects de sécurité des parties electriques, également dans le cas où le chauffage electrique est combiné avec d'autres moyens de chauffage tel que le chauffage avec combustible liquide. Complète et modifie les articles correspondants de la CEI 60519-2.

    Le contenu du corrigendum de juin 1999 a été pris en considération dans cet exemplaire.
