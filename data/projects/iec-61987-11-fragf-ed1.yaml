abstract:
- language: fr
  script: Latn
  content: L'IEC 61987-11:2012 fournit une caractérisation des équipements de mesure de processus industriels (dictionnaire des types de dispositifs) pour l'intégration dans le dictionnaire de données de composants (CDD, en anglais "Component Data Dictionary") et des structures génériques pour les listes de propriétés fonctionnelles (OLOP, en anglais "Operating List of Properties") et les listes de propriétés des dispositifs de mesure (DLOP, en anglais "Device List of Properties") en conformité avec la CEI 61987-10. La présente version bilingue (2014-01) correspond à la version anglaise monolingue publiée en 2012-07.
