abstract:
- language: en
  script: Latn
  content: |-
    IEC 60884-2-5:2026 applies to adaptors for AC only, with or without earthing contact, with a rated voltage greater than 50 V but not exceeding 440 V and a rated current not exceeding 32 A, intended for household and similar purposes, either indoors or outdoors.<br/>
    Compatible plugs and socket-outlets, when combined, form a plug and socket-outlet system. Standardized systems used around the world are reported in IEC TR 60083.<br/>
    This document also applies to travel adaptors (see Annex AA). For travel adaptors, the scope is limited to a voltage rating greater than 50 V but not exceeding 250 V and to a current rating not exceeding 20 A.<br/>
    Travel adaptors allowing the simultaneous connection of two or more plugs are not covered by this document.<br/>
    This third edition cancels and replaces the second edition published in 2017. This edition constitutes a technical revision.<br/>
    This edition includes the following significant technical changes with respect to the previous edition:<br/>
    a) general alignment with IEC 60884-1:2022 and IEC 60884-1:2022/AMD1:2026;<br/>
    b) addition of a dedicated Table 1 listing the specimens necessary for tests;<br/>
    c) modification of the requirements for the visibility of marking the power;<br/>
    d) mandatory marking warning to avoid inserting an adaptor into another adaptor during normal use;<br/>
    e) new additional specifications for the IP test with water;<br/>
    f) modification of the test current of Clause 20;<br/>
    g) addition of requirements for EMC and EMF;<br/>
    h) new Annex CC covering requirements for adaptors incorporating USB power supplies;<br/>
    i) new Annex DD covering requirements for adaptors incorporating electronic components to perform additional functions.
