abstract:
- language: en
  script: Latn
  content: Applies to electrically heated flexible appliances designed for the application of heat to a bed, or to the human body, such as blankets, pads and mattresses for household purposes, and to control units delivered with them. Supersedes IEC 335-17 (1974).
- language: fr
  script: Latn
  content: S'applique aux appareils souples chauffés électriquement conçus pour dispenser de la chaleur à un lit ou au corps humain, tels que les couvertures, les coussins et les matelas pour usage domestique, et aux dispositifs de commande livrés avec eux. Remplace la CEI 335-17.
