abstract:
- language: fr
  script: Latn
  content: La CEI 61158-5-22:2010 spécifie la structure et les services de la couche application des bus de terrain de Type 22, en conformité avec le Modèle de référence de base de l'OSI (ISO/CEI 7498-1) et la structure de la couche application de l'OSI (ISO/CEI 9545). La présente norme annule et remplace la IEC/PAS 61158-5-22 publiée en 2009. et constitue une révision technique. La présente version bilingue publiée en 2012-01 correspond à la version anglaise monolingue publiée en 2010-08.
