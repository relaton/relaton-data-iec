abstract:
- language: en
  script: Latn
  content: Applies to auxiliary contact units associated (or intended to be associated) with circuit-breakers for overcurrent protection, and with residual current operated circuit-breakers with or without integral overcurrent protection for household and similar installations, having a rated voltage not exceeding 440 V a.c. and 250 V d.c., and a rated current not exceeding 10 A.
- language: fr
  script: Latn
  content: S'applique aux blocs de contacts auxiliaires associés (ou destinés à être associés) aux disjoncteurs pour la protection contre les surintensités et aux dispositifs de coupure à courant différentiel résiduel avec ou sans protection contre les surintensités incorporée pour installations domestiques et analogues, ayant une tension assignée qui ne dépasse pas 440 V en courant alternatif et 250 V en courant continu, et un courant assigné qui ne dépasse pas 10 A.
