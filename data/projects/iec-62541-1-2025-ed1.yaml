abstract:
- language: en
  script: Latn
  content: IEC 62541-1:2025 presents the concepts and overview of the OPC Unified Architecture (OPC UA). Reading this document is helpful to understand the remaining parts of the IEC 62541 series. Each of the other parts is briefly explained along with a suggested reading order. This first edition cancels and replaces IEC TR 62541-1 published in 2020
- language: fr
  script: Latn
  content: L'IEC 62541-1:2025 décrit les concepts et donne une vue d'ensemble de l'Architecture unifiée OPC (OPC UA). La lecture du présent document est utile pour comprendre les autres parties de la série IEC 62541. Chacune des autres parties est brièvement expliquée avec un ordre de lecture suggéré. Cette première édition annule et remplace l'IEC TR 62541-1 paru en 2020.
