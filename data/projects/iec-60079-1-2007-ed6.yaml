abstract:
- language: en
  script: Latn
  content: |-
    Contains specific requirements for the construction and testing of electrical apparatus with the type of protection flameproof enclosure 'd', intended for use in explosive gas atmospheres. This edition contains significant technical changes with regard to the previous edition.

    The contents of the corrigendum of September 2008 have been included in this copy.
- language: fr
  script: Latn
  content: |-
    Contient les exigences spécifiques de construction et d'essai du matériel électrique à enveloppe antidéflagrante, mode de protection «d», destiné à être utilisé dans les atmosphères explosives gazeuses. Cette édition inclut les modifications techniques majeures par rapport à l'édition précédente.

    Le contenu du corrigendum de septembre 2008 a été pris en considération dans cet exemplaire.
