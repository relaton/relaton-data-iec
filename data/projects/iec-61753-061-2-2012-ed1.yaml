abstract:
- language: en
  script: Latn
  content: 'IEC 61753-061-2:2012 contains the minimum test and measurement requirements and severities which a fibre optic isolator as specified by IEC 61202-1 should satisfy in order to be categorized as meeting the requirements of isolators used in controlled environments as specified in IEC 61753-1. Key words: fibre optic isolator, test and measurement'
- language: fr
  script: Latn
  content: 'La CEI 61753-061-2:2012 contient les sévérités et les exigences minimales d''essai et de mesure auxquelles il convient qu''un isolateur à fibres optiques tel que spécifié dans la CEI 61202-1 satisfasse afin d''être classé comme conforme aux exigences des isolateurs utilisés dans des environnements contrôlés spécifiés dans la CEI 61753-1. Mots clé: isolateur à fibres optiques, essai et mesure'
