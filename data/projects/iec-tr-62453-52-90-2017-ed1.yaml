  script: Latn
  content: |
    IEC TR 62453-52-90:2017(E)  which is a Technical Report, provides information for integrating the HART® technology into the CLI-based implementation of FDT interface specification (IEC TR 62453-42). This part of IEC 62453 specifies implementation of communication and other services based on IEC 62453‑309. This document neither contains the FDT specification nor modifies it.<br/>

