abstract:
- language: en
  script: Latn
  content: Gives requirements for the classification, selection, packaging, marking, calibration and care of reference solar devices. Covers solar reference devices used to determine the electrical performance of solar cells, modules and arrays under natural and simulated sunlight. Changes with respect to the previous edition include calibration traceability.
- language: fr
  script: Latn
  content: Donne les exigences relatives à la classification, à la sélection, au conditionnement, au marquage, à l'étalonnage et aux précautions d'utilisation des dispositifs solaires de référence. Couvre les dispositifs solaires de référence utilisés pour déterminer les performance électriques des cellules, modules et panneaux solaires sous éclairage naturel et simulé. Les changements par rapport à l'édition précédente comprennent la traçabilité de l'étalonnage.
