abstract:
- language: fr
  script: Latn
  content: |-
    La CEI 61300-2-33:2012 est partie d'une série qui permet d'évaluer l'aptitude au montage et au remontage d'une épissure mécanique de fibres optiques, d'un système de gestion des fibres ou d'un boîtier pour un nombre de fois spécifié. Cette troisième édition annule et remplace la deuxième édition publiée en 2006. Cette édition constitue une révision technique. La présente édition contient les changements techniques significatifs suivants par rapport à l'édition antérieure: ajout des systèmes de gestion des fibres et des composants actifs et passifs auxiliaires ainsi que des systèmes de gestion des câbles pour les câbles optiques entrants et sortants.
    Mots clés: épissure mécanique de fibres optiques, système de gestion des fibres ou d'un boîtier
