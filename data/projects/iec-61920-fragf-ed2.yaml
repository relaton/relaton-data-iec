abstract:
- language: fr
  script: Latn
  content: La CEI 61920:2004 décrit la classification de dispositifs infrarouge en groupes et classes pour identifier et clarifier les difficultés provenant des interférences mutuelles. Ces interférences sont provoquées par le nombre croissant d'applications comportant différents systèmes infrarouges en parallèle. Les longueurs d'onde comprises entre 700 nm et 1 600 nm sont prises en considération. Tous les systèmes à base d'applications d'infrarouges non guidés utilisant intentionnellement ou involontairement des rayonnements infrarouges dans cette gamme sont inclus. Cette deuxième édition annule et remplace la première édition parue en 1998, dont elle constitue une révision technique. La présente version bilingue (2012-08) correspond à la version anglaise monolingue publiée en 2004-01.
