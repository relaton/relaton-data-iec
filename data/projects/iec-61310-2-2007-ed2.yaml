abstract:
- language: en
  script: Latn
  content: 'It gives general rules on marking for identification of machinery, for safe use related to mechanical and electrical hazards, and for the avoidance of hazards arising from incorrect connections. Includes the following significant technical changes with respect to the previous edition: Annex A: additional safety signs included and updated.'
- language: fr
  script: Latn
  content: 'spécifie des exigences concernant le marquage des machines, définit des règles générales de marquage pour l''identification des machines, pour leur utilisation sûre, relatives aux risques mécaniques et électriques, et pour éviter les risques liés à des liaisons erronées, comprend les modifications techniques significatives suivantes par rapport à l''édition précédente: Annexe A : signaux de sécurité supplémentaires inclus et mis à jour'
