abstract:
- language: en
  script: Latn
  content: |-
    IEC 60794-1-117:2026 defines the test procedures used to establish uniform requirements for bending stiffness performance. It applies to optical fibre cables for use with telecommunication equipment and devices employing similar techniques, and to cables having a combination of both optical fibres and electrical conductors.<br/>
    This edition includes the following significant technical changes with respect to the previous edition:<br/>
    a) addition of "6.6 Details to be reported";<br/>
    b) addition of "7.6 Details to be reported";<br/>
    c) addition of "8.6 Details to be reported".
- language: fr
  script: Latn
  content: |-
    L'IEC 60794-1-117:2026 définit les procédures d'essai utilisées pour établir des exigences uniformes relatives à la performance de raideur. Elle s'applique aux câbles à fibres optiques destinés à être utilisés dans les équipements de télécommunications et les dispositifs qui utilisent des techniques analogues, ainsi qu'aux câbles constitués de fibres optiques d'une part et de conducteurs électriques d'autre part.<br/>
    Cette édition inclut les modifications techniques significatives suivantes par rapport à l'édition précédente:<br/>
    a) ajout du "6.6 Informations détaillées à consigner"<br/>
    b) ajout du "7.6 Informations détaillées à consigner";<br/>
    c) ajout du "8.6 Informations détaillées à consigner".
