abstract:
- language: en
  script: Latn
  content: Covers a range of rectangular multipole connectors with blade contacts, with either solder type terminations or solderless terminations of the wrap type. Specifies IEC type designation, dimensions, gauges and ratings for 8, 12, 16, 20 and 30-pole connectors. Establishes climatic categories and a schedule for type tests.
- language: fr
  script: Latn
  content: Couvre une gamme de connecteurs rectangulaires multipôles avec contacts à lames, ayant soit des sorties du type à souder, soit des sorties du type à connexions enroulées. Spécifie la désignation de type CEI, les dimensions, les calibres et les caractéristiques fonctionnelles des connecteurs à 8, 12, 16, 20 et 30 pôles. Spécifie les catégories climatiques ainsi qu'un programme d'essais de type.
