abstract:
- language: en
  script: Latn
  content: |-
    IEC/TR 62572-2:2008(E) provides guidance on:<br/>
    - the testing that a system supplier should ensure is in a place prior to procurement of a laser module from a laser module manufacturer;<br/>
    - a range of activities expected of a system supplier to verify a laser module manufacturer's reliability claims.<br/>
    This technical report deals with reliability assessment of laser modules used for telecommunication guidance on testing, use of failure criteria and reliability predictions is provided.
