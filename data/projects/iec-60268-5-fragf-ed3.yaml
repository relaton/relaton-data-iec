abstract:
- language: fr
  script: Latn
  content: La CEI 60268-5:2003 s'applique aux haut-parleurs de systèmes électroacoustiques, traités entièrement comme des éléments passifs. Les haut-parleurs avec amplificateurs incorporés sont exclus. Elle indique les caractéristiques à spécifier et les méthodes de mesure appropriées pour les haut-parleurs, utilisant des signaux sinusoïdaux, de bruit spécifié ou impulsionnels. Cette troisième édition annule et remplace la deuxième édition parue en 1989, l'amendement 1 (1993) et l'amendement 2 (1996). Elle constitue une révision technique.
