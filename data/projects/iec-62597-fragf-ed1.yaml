abstract:
- language: en
  script: Latn
  content: |-
    <!--StartFragment -->
    <p>This first edition cancels and replaces IEC TS 62597 published in 2011. This edition constitutes a technical revision.</p>

    <p>This edition includes the following significant technical changes with respect to the Technical Specification:</p>

    <p>– Annex A test plan has been converted to normative text</p>

    <p>– New Annex B (informative) for measurement technique for lower frequency has been added</p>

    <p>– New Annex C (informative) about consistency to IEC 62110 in some countries has been added</p>

    <p>The scope of this document is limited to apparatus, systems and fixed installations which are intended for use in the railway environment. The frequency range covered is 0 Hz to 300 GHz.</p>

    <p>Technical considerations and measurements are specified for frequencies up to 20 kHz because no relevant field strengths are expected above due to the physical nature of EMF sources in the railway environment.</p>

    <p>The object of this document is to provide measurement and calculation procedures of electric and magnetic field levels generated by electronic and electrical apparatus in the railway environment with respect to human exposure.</p>

    <p>The regulations regarding the protection of human beings during exposure to non-ionizing electromagnetic fields in the railway environment are different within the countries worldwide. This document offers a procedure regarding measurement, simulation/calculation and evaluation.</p>

    <p>The measurement procedures and points of measurement cover also the aspect of persons bearing active implantable medical devices.</p>

    <p>This document does not apply to the risk assessment for persons bearing active implants in magnetic field generated by electronic and electrical apparatus in the railway environment.</p>

    <p>This document does not apply to personal electronic devices (e.g. mobile phones, laptop computers, wireless communication systems, etc.) of passengers and workers.</p>

    <p>This document does not apply to intentional transmitters with frequencies higher than 20 kHz.</p>
- language: fr
  script: Latn
  content: |-
    <!--StartFragment -->
    <p>Cette première édition annule et remplace IEC TS 62597 publiée en 2011. Cette édition</p>

    <p>constitue une révision technique.</p>

    <p>Cette édition comprend les modifications techniques importantes suivantes par rapport à la spécification technique:</p>

    <p>– Le plan d'essai de l'Annexe A a été converti en texte normatif</p>

    <p>– Une nouvelle Annexe B (informative) relative à la technique de mesure pour les basses</p>

    <p>fréquences a été ajoutée</p>

    <p>– Une nouvelle Annexe C (informative) relative à la conformité à l’IEC 62110 dans certains</p>

    <p>pays a été ajoutée</p>

    <p>Le domaine d'application du présent document se limite aux appareils, systèmes et installations fixes destinés à être utilisés dans l'environnement ferroviaire. La plage de fréquences couverte est comprise entre 0 Hz et 300 GHz.</p>

    <p>Les considérations techniques et les mesures sont spécifiées pour des fréquences inférieures ou égales à 20 kHz, car aucune intensité de champ au-delà de cette valeur n'est attendue en raison de la nature physique des sources de champs électromagnétiques dans l'environnement ferroviaire.</p>

    <p>L'objet du présent document est de définir les procédures de mesure/calcul des niveaux de champ magnétique et électrique générés par les appareils électroniques et électriques dans l'environnement ferroviaire en regard de l'exposition humaine. La réglementation relative à la protection des êtres humains en cas d'exposition aux champs électromagnétiques non ionisants dans l'environnement ferroviaire varie d'un pays à l'autre.</p>

    <p>Le présent document suggère une procédure de mesure, de simulation/calcul et d'évaluation.</p>

    <p>Les procédures et points de mesure couvrent également le cas des personnes équipées de dispositifs médicaux implantables actifs.</p>

    <p>Le présent document ne s'applique pas à l'évaluation du risque concernant les personnes équipées de dispositifs médicaux implantables actifs et exposées à un champ magnétique généré par les appareils électriques et électroniques dans l'environnement ferroviaire.</p>

    <p>Le présent document ne s'applique pas aux dispositifs électroniques personnels des passagers et travailleurs (téléphones et ordinateurs portables, systèmes de communication sans fil, etc.).</p>

    <p>Le présent document ne s'applique pas aux émetteurs intentionnels de fréquences supérieures à 20 kHz.</p>
