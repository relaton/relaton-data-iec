abstract:
- language: en
  script: Latn
  content: IEC/PAS 62722-1:2011(E) covers specific performance and environmental requirements for luminaires, incorporating electric light sources for operation from supply voltages up to 1 000 V where claims of operational performance are made. Unless otherwise detailed performance data covered under the scope of this PAS are for the luminaires in a condition representative of new manufacture, with any specified initial aging procedures completed.
