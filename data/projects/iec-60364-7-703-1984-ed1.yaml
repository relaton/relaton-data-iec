abstract:
- language: en
  script: Latn
  content: |-
    Applies to locations in which sauna heating equipment according to
    IEC Publication 60335-2-53, Safety of Household and Similar Electric
    Appliances, Part 2: Particular Requirements for Electric Heating
    Appliances for Saunas, is installed and exclusively reserved for
    such use.
- language: fr
  script: Latn
  content: |-
    S'appliquent aux locaux dans lesquels sont installés des
    équipements de saunas conformément à la Publication 60335-2-53 de la
    CEI: Sécurité des appareils électrodomestiques et analogues,
    Deuxième partie:  Règles particulières pour les appareils de
    chauffage électrique des saunas, exclusivement réservés à cet
    usage.
