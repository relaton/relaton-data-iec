abstract:
- language: en
  script: Latn
  content: |-
    <!--StartFragment -->
    <p>This International Standard applies to the electrical protection system, provided for AC and DC electric traction power supply systems. It:</p>

    <p>– establishes railway specific protection principles;</p>

    <p>– describes the railway specific protection system functionality;</p>

    <p>– specifies minimum functional requirements and informative examples of their application;</p>

    <p>– establishes limitations of the protection system and the acceptability of residual risks;</p>

    <p>– specifies principles for design verification.</p>

    <p>This document is applicable to:</p>

    <p>– railways;</p>

    <p>– guided mass transport systems, such as tramways, elevated and underground railways, mountain railways, trolleybus systems, and magnetically levitated systems which use a contact line system.</p>

    <p>This document can also be applied to electrified road traffic with a contact line, such as truck-trolley systems.</p>

    <p>This document applies to new electric traction power supply systems and can be applied to changes of existing systems.</p>

    <p>This document does not apply to:</p>

    <p>– underground mine traction systems;</p>

    <p>– cranes, transportable platforms and similar transportation equipment on rails, temporary structures (e.g. exhibition structures) in so far as these are not supplied directly or via transformers from the contact line system and are not endangered by the traction power supply system;</p>

    <p>– suspended cable cars;</p>

    <p>– funicular railways;</p>

    <p>– magnetic levitated systems (without a contact line system);</p>

    <p>– railways with an inductive power supply without contact system;</p>

    <p>– railways with a buried contact system that is required to be energized only below the train to ensure safety.</p>

    <p>This document does not cover:</p>

    <p>– technical requirements for products, e.g. protection devices;</p>

    <p>– rules for maintenance of protection systems.</p>
- language: fr
  script: Latn
  content: |-
    <!--StartFragment -->
    <p>La présente Norme internationale s'applique au système de protection électrique qui équipe les réseaux d'alimentation de traction électrique à courant alternatif et à courant continu. Elle :</p>

    <p>– établit les principes de protection spécifiques au domaine ferroviaire ;</p>

    <p>– décrit la fonctionnalité du système de protection spécifique au domaine ferroviaire ;</p>

    <p>– spécifie les exigences fonctionnelles minimales et les exemples informatifs de leur application ;</p>

    <p>– établit les limites du système de protection et l'acceptabilité des risques résiduels ;</p>

    <p>– spécifie les principes de la vérification de la conception.</p>

    <p>Le présent document s'applique aux :</p>

    <p>– chemins de fer ;</p>

    <p>– aux réseaux de transport en commun guidés tels que les tramways, les chemins de fer aériens et souterrains, les chemins de fer de montagne, les trolleybus et les systèmes à sustentation magnétique qui utilisent un système de ligne de contact.</p>

    <p>Le présent document peut également être appliqué au trafic routier électrifié avec une ligne de contact (les systèmes de lorry, par exemple).</p>

    <p>Le présent document s'applique également aux nouveaux réseaux d'alimentation de traction électrique et peut être appliquée aux modifications des systèmes existants.</p>

    <p>Le présent document ne s'applique pas aux :</p>

    <p>– systèmes de traction miniers souterrains ;</p>

    <p>– grues, plateformes transportables et matériels de transport similaires sur rails, structures temporaires (dans les foires et expositions, par exemple) dans la mesure où elles ne sont pas alimentées par les lignes de contact, directement ou par des transfor mateurs, ni affectées par le réseau d'alimentation de traction ;</p>

    <p>– téléphériques ;</p>

    <p>– funiculaires ;</p>

    <p>– systèmes à sustentation magnétique (sans système de ligne de contact) ;</p>

    <p>– chemins de fer équipés d'une alimentation inductive sans système de contact ;</p>

    <p>– chemins de fer équipés d'un système de contact enterré qui ne doit être alimenté que sous le train afin de garantir la sécurité.</p>

    <p>Le présent document ne couvre pas :</p>

    <p>– les exigences techniques pour les produits (les dispositifs de protection, par exemple) ;</p>

    <p>– les règles de maintenance des systèmes de protection.</p>
