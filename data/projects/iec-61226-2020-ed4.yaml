abstract:
- language: en
  script: Latn
  content: |-
    IEC 61226:2020 establishes, for nuclear power plants , a method of assignment of the functions specified for the plant into categories according to their importance to safety. Subsequent classification of the I&amp;C and electrical power systems performing or supporting these functions, based on the assigned category, then determines relevant design criteria.<br/>
    The design criteria, when applied, ensure the achievement of each function in accordance to its importance to safety. In this document, the criteria are those of functionality, reliability, performance, environmental qualification (e.g. seismic) and quality assurance (QA).<br/>
    This edition includes the following significant technical changes with respect to the previous edition:<br/>
    - to align on IAEA requirements, recommendations and terminology, particularly to take into account the replacement of NS-R-1 by SSR 2/1 and publication of SSG 30;<br/>
    - to extend the scope to electrical power systems;<br/>
    - to move the detailed requirements applying to functions and I&amp;C systems to a normative annex, which will be removed after updating IEC 61513.
- language: fr
  script: Latn
  content: |-
    l'IEC 61226:2020 établit, pour les centrales nucléaires de puissance , une méthode d'affectation en catégories des fonctions spécifiées pour la centrale, sur la base de leur importance pour la sûreté. Le classement, sur la base de la catégorie attribuée, des systèmes d'I&amp;C et d'alimentation électrique assurant ou contribuant à la réalisation de ces fonctions détermine alors les critères de conception appropriés.<br/>
    Les critères de conception, dès lors qu'ils sont appliqués, garantissent que chaque fonction est réalisée selon son importance pour la sûreté. Les critères retenus dans le présent document concernent la fonctionnalité, la fiabilité, les performances, la qualification aux conditions environnementales (par exemple, la qualification sismique) et l'assurance qualité (AQ).<br/>
    Cette édition inclut les modifications techniques majeures suivantes par rapport à l'édition précédente:<br/>
    - l'alignement sur les exigences, les recommandations et la terminologie de l'AIEA, surtout la prise en compte du document SSR 2/1 (ayant remplacé le NS-R-1) et du guide SSG 30;<br/>
    - l'extension du domaine d'application aux systèmes d'alimentation électrique;<br/>
    - le déplacement des exigences détaillées applicables aux fonctions et aux systèmes d'I&amp;C dans une annexe normative, qui sera supprimée à l'issue de la mise à jour de l'IEC 61513.
