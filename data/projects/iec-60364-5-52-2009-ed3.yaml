abstract:
- language: en
  script: Latn
  content: |-
    IEC 60364-5-52:2009 deals with the selection and erection of wiring systems. This third edition cancels and replaces the second edition, published in 2001, and constitutes a technical revision. The main changes with respect to the previous edition are as follows:<br/>
    - Subclause 521.4 introduces minor changes with regard to busbar trunking systems and powertrack systems.<br/>
    - Subclause 523.6 introduces minor changes with regard to the sizing of cables where harmonic currents are present.<br/>
    - A new sublause 523.9 concerning single-core cables with a metallic covering has been introduced.<br/>
    - Clause 525 introduces changes in the maximum value of voltage drop permitted between the origin of the consumer's installation and the equipment which should not be greater than that given in the relevant annex.<br/>
    - Clause 526 introduces minor changes to electrical connections including additional exceptions for inspection of connections and additional notes.<br/>
    - Clause 528 introduces additional requirements with regard to proximity of underground power and telecommunication cables.<br/>
    - Clause 529 introduces minor changes to selection and erection of wiring systems in relation to maintainability, including cleaning. The contents of the corrigendum of February 2011 have been included in this copy.
- language: fr
  script: Latn
  content: |-
    La CEI 60364-5-52:2009 traite du choix et de la mise en oeuvre des canalisations. Cette troisième édition annule et remplace la deuxième édition, publiée en 2001. Elle constitue une révision technique. Les principaux changements par rapport à l'édition précédente sont les suivants:<br/>
    - Le paragraphe 521.4 apporte des changements mineurs aux canalisations préfabriquées et aux systèmes de conducteurs préfabriqués.<br/>
    - Le paragraphe 523.6 apporte des changements mineurs au dimensionnement des câbles en présence de courants harmoniques.<br/>
    - Un nouveau paragraphe 523.9 a été introduit; il concerne les câbles monoconducteurs à gaine métallique.<br/>
    - L'Article 525 insère des modifications de la valeur maximale de la chute de tension admissible entre l'origine de l'installation et l'équipement de l'utilisateur; il convient que celle-ci ne soit pas supérieure à celle donnée dans l'annexe correspondante.<br/>
    - L'Article 526 apporte des changements mineurs aux connexions électriques, y compris des restrictions relatives à la vérification des connexions et des notes complémentaires.<br/>
    - L'Article 528 introduit des exigences supplémentaires concernant le voisinage des câbles enterrés de réseaux d'énergie et de communications.<br/>
    - L'Article 529 apporte des changements mineurs au choix et à la mise en uvre des canalisations en fonction de la maintenance, comprenant le nettoyage. Le contenu du corrigendum de février 2011 a été pris en considération dans cet exemplaire.
