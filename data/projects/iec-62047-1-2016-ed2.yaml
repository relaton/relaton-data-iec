abstract:
- language: en
  script: Latn
  content: |-
    IEC 62047-1:2016 defines terms for micro-electromechanical devices including the process of production of such devices. This edition includes the following significant technical changes with respect to the previous edition:<br/>
    a) removal of ten terms;<br/>
    b) revision of twelve terms;<br/>
    c) addition of sixteen new terms.
- language: fr
  script: Latn
  content: |-
    L'IEC 62047-1:2016 définit des termes pour les dispositifs microélectromécaniques en incluant le procédé de production de ces dispositifs. Cette édition inclut les modifications techniques majeures suivantes par rapport à l'édition précédente:<br/>
    a) retrait de dix termes;<br/>
    b) révision de douze termes;<br/>
    c) ajout de seize nouveaux termes.
