- language: en
  script: Latn
  content: IEC 61189-3-719:2016 specifies a test method to monitor the resistance of single plated-through holes (PTHs) in printed circuit boards (PCBs) to determine the PTH durability under thermo-mechanical stress induced by temperature cycling.
