abstract:
- language: en
  script: Latn
  content: |-
    IEC 60884-2-1:2025 applies to fused plugs, where the fuses are primarily intended to protect the flexible cable connected to the plug. These fuses are not intended to protect appliances or parts of them against overload.<br/>
    This third edition cancels and replaces the second edition published in 2006. This edition constitutes a technical revision.<br/>
    This edition includes the following significant technical changes with respect to the previous edition:<br/>
    a) alignment to IEC 60884‑1, fourth edition.
