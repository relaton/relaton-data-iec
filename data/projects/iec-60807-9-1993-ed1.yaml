  script: Latn
  content: 'Couvre une gamme de connecteurs destinés à l''interconnexion entre équipements domestiques ou électroniques similaires: prises de péritélévision. Les connexions entre l''embase et la fiche sont constituées de deux rangées de 10 contacts en quinconce (plus un contact spécial de masse).'
