abstract:
- language: en
  script: Latn
  content: |-
    IEC 60619:2026 applies to electrically operated food preparation appliances for household use.<br/>
    The purpose of this document is to state and define test methods for measuring the functions that can be carried out by means of household electrical food preparation appliances, which are of interest to the user and to give some guidelines for the evaluation of test results.<br/>
    Taking into account the lower grade of accuracy and repeatability, due to variations in time and origin of test materials and ingredients and to the influence of the subjective judgement of test operators, the described test methods can be applied more reliably for comparative testing of a number of appliances at approximately the same time, in the same laboratory, by the same operator and with the same utensils, rather than for testing of single appliances in different laboratories.<br/>
    This document does not cover safety.<br/>
    This document does not apply to appliances designed exclusively for commercial or industrial use.<br/>
    This third edition cancels and replaces the second edition published in 1993, Amendment 1:1995 and Amendment 2:2004. This edition constitutes a technical revision.<br/>
    This edition includes the following significant technical changes with respect to the previous edition:<br/>
    a) deleted test in Clause 6;<br/>
    b) modified description of movement of handheld machines in Subclause 5.4;<br/>
    c) fully revised test on whipping cream in Clause 7;<br/>
    d) revised Clause 15;<br/>
    e) figures moved from Clause 22 to Subclauses 5.4 to 5.8,<br/>
    f) deleted Clause 22.
- language: fr
  script: Latn
  content: |-
    L'IEC 60619:2026 s'applique aux appareils électriques pour la préparation de la nourriture, à usage domestique.<br/>
    Le présent document a pour objet d'énoncer et de définir les méthodes d'essai permettant d'évaluer les fonctions qui peuvent être réalisées avec des appareils électriques de préparation de la nourriture à usage domestique, qui présentent un intérêt pour l'utilisateur, et de donner des lignes directrices pour l'évaluation des résultats d'essai.<br/>
    En tenant compte du faible degré d'exactitude et de répétabilité, dû aux variations dans le temps et à l'origine des matières et ingrédients utilisés pour les essais ainsi qu'à l'influence du jugement subjectif des personnes qui réalisent les essais, les méthodes d'essai décrites peuvent être utilisées de manière plus fiable pour des essais comparatifs réalisés sur différents appareils approximativement dans même temps, dans le même laboratoire par le même opérateur et avec les mêmes ustensiles, plutôt que pour les essais d'appareils uniques dans différents laboratoires.<br/>
    Le présent document ne couvre pas la sécurité.<br/>
    Le présent document ne s'applique pas aux appareils conçus exclusivement pour des usages commerciaux ou industriels.<br/>
    L'attention est attirée sur le fait que, parfois, le même résultat peut être obtenu en utilisant différentes fonctions.<br/>
    Cette troisième édition annule et remplace la seconde édition parue en 1993, l'Amendement 1:1995 et l'Amendement 2:2004. Cette édition constitue une révision technique. <br/>
    Cette édition inclut les modifications techniques majeures suivantes par rapport à l'édition précédente:<br/>
    a) suppression de l'essai à l'Article 6;<br/>
    b) modification de la description du mouvement des machines portatives au 5.4;<br/>
    c) révision complète de l'essai consistant à fouetter la crème à l'Article 7;<br/>
    d) révision de l'Article 15;<br/>
    e) déplacement des figures de l'Article 22 aux paragraphes 5.4 à 5.8; <br/>
    f) suppression de l'Article 22.
