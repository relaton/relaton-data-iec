abstract:
- language: en
  script: Latn
  content: Describes the measurement methods to evaluate the chrominance performance in SECAM non-broadcast video tape recorders. Because of the frequency modulation used in the SECAM system, special methods of measurement are required for testing the chrominance performance.
- language: fr
  script: Latn
  content: Décrit les méthodes de mesure pour évaluer les performances des voies chrominance des magnétoscopes SECAM hors radiodiffusion. La modulation de fréquence étant utilisée dans le système SECAM, des méthodes spéciales de mesure sont exigées pour relever les performances des voies chrominance.
