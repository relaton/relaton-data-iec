abstract:
- language: en
  script: Latn
  content: |-
    The IEC 61158-4-12:2019 data-link layer provides basic time-critical messaging communications between devices in an automation environment.<br/>
    provides communication opportunities to all participating data-link entities<br/>
    a) in a synchronously-starting cyclic manner, and<br/>
    b) in a cyclic or acyclic asynchronous manner, as requested each cycle by each of those data-link entities.<br/>
    Thus this protocol can be characterized as one which provides cyclic and acyclic access asynchronously but with a synchronous restart of each cycle.
- language: fr
  script: Latn
  content: |-
    L'IEC 61158-4-12:2019 la couche de liaison de données assure les communications de messagerie à contrainte de temps de base entre les appareils d’un environnement d’automatisation.<br/>
    Ce protocole offre des opportunités de communication à toutes les entités de liaison de données participantes<br/>
    a) de manière cyclique et synchrone, et<br/>
    b) de manière cyclique ou acyclique asynchrone, comme demandé par chaque cycle de chacune de ces entités de liaison de données.<br/>
    Par conséquent, ce protocole peut se caractériser comme assurant un accès cyclique et acyclique asynchrone, mais avec un redémarrage synchrone de chaque cycle.
