abstract:
- language: fr
  script: Latn
  content: La CEI 60684-3-246:2007 définit les exigences relatives aux gaines thermorétractables en polyoléfine, double paroi, non retardées à la flamme. Il a été constaté que ces gaines étaient adaptées pour une utilisation allant jusqu'à 110°C. Ces gaines sont composées d'une couche externe faite d'un matériau semi-rigide réticulé. La couche interne est principalement en polyoléfine non réticulée qui coule et fond au cours du processus de rétreint pour obtenir une étanchéité. Les principales modifications techniques par rapport à la deuxième édition concernent la mise en conformité avec les spécifications nationales existantes.
