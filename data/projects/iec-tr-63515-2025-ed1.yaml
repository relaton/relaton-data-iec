abstract:
- language: en
  script: Latn
  content: |-
    IEC TR 63515:2025 provides a conceptual framework for power system resilience. It covers the definition, evaluation metrics and methods, improvement strategies and uses cases of power system resilience. This document is applicable to developing resilient power system and implementing resilience improvement strategies.<br/>
    This document is not exhaustive, and it is possible to consider other aspects, such as different application scenarios, evaluation methods, and improvement measures.
