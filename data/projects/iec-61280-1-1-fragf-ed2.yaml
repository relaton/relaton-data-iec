abstract:
- language: fr
  script: Latn
  content: |-
    L'IEC 61280-1-1:2013 s'applique aux sous-systèmes généraux de télécommunications à fibres optiques. Elle a pour objet la mesure de la puissance optique d'un émetteur couplé à un câble à fibres optiques unimodales à dispersion décalée ou non décalée. Cette deuxième édition annule et remplace la première édition publiée en 1998. Cette deuxième édition constitue une révision technique. La modification technique significative par rapport à l'édition antérieure réside dans l'ajout de l'Annexe A relative à la méthode de prise en compte des incertitudes. Des corrections rédactionnelles figurent dans l'ensemble du document, ainsi que des mises à jour de références.
    Mots clés: mesure de la puissance optique d'un émetteur couplé à un câble à fibres optiques unimodales à dispersion décalée ou non décalée
