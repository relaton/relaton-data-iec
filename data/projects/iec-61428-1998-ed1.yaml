  script: Latn
  content: Applies to containers of liquid, solid or gaseous samples for use with cooled germanium detectors in quantitative gamma-ray measurements. Specifies the volume, dimensions and physical characteristics of the containers, the volumes of which range from 50 to 3000 cubic cm.
