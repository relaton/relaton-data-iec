abstract:
- language: en
  script: Latn
  content: |-
    IEC TS 62885-1:2018(E) specifies the physical characteristics of test equipment and material used in tests common for several products covered by standards in the IEC 62885 series for surface cleaning appliances. In addition, it provides guidance regarding the evaluation of Wilton and other types of carpets to determine their acceptability for testing.<br/>
    This edition includes the following significant technical change with respect to the previous edition:<br/>
    a new clause (Clause 5) on the pre-treatment of carpets has been introduced.<br/>
    This edition covers only the Wilton carpet and its treatment.
