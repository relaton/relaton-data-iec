  script: Latn
  content: L'IEC 62561-3:2012 spécifie les exigences et les essais à appliquer aux éclateurs d'isolement liés à un système de protection contre la foudre. Les éclateurs d'isolement peuvent être utilisés pour raccorder indirectement un système de protection contre la foudre à une partie métallique proche, lorsqu'un raccordement direct n'est pas admissible pour des raisons fonctionnelles.
