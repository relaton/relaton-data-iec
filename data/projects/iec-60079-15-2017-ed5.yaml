abstract:
- language: en
  script: Latn
  content: |-
    IEC 60079-15:2017 specifies requirements for the construction, testing and marking for Group II electrical equipment with type of protection “n” which includes; sealed devices “nC”, hermetically sealed devices “nC”, non-incendive components “nC” and restricted breathing enclosures “nR” intended for use in explosive gas atmospheres. This part of IEC 60079 applies to electrical equipment where the rated input voltage does not exceed 15 kV r.m.s. AC or DC including where the internal working voltages of the Ex product exceeds 15 kV, for example starters for HID luminaires. This part of IEC 60079 supplements and modifies the general requirements of IEC 60079-0, except as indicated in Table 1 (Clause 1). Where a requirement of this part of IEC 60079 conflicts with a requirement of IEC 60079-0, the requirement of this part of IEC 60079 takes precedence. This fifth edition cancels and replaces the fourth edition, published in 2010, and constitutes a technical revision. Refer to the Forward of the document for a complete listing of the technical changes between edition 5.0 and the previous edition of the document.<br/>
    Keywords: Group II electrical equipment with type of protection “n”
- language: fr
  script: Latn
  content: |-
    IEC 60079-15:2017 spécifie les exigences de construction, d’essai et de marquage de l’appareil électrique du Groupe II avec mode de protection «n» qui inclut: les dispositifs clos «nC», les dispositifs hermétiquement scellés «nC», les composants non-propagateurs de flamme «nC» et les enveloppes à respiration limitée «nR», et qui est destiné à ętre utilisé en atmosphère explosive gazeuse. La présente partie de l’IEC 60079 s’applique à l’appareil électrique dont la tension assignée d’entrée ne dépasse pas la valeur efficace de 15 kV en courant alternatif ou en courant continu, y compris lorsque les tensions internes de service du produit Ex dépassent 15 kV, par exemple les starters pour luminaires DHI. La présente partie de l’IEC 60079 complète et modifie les exigences générales de l’IEC 60079-0, à l’exception de celles qui sont indiquées dans le Tableau 1 (Clause 1). Si une exigence de la présente partie de l’IEC 60079 est en conflit avec une exigence de l’IEC 60079-0, l’exigence de la présente partie de l’IEC 60079 prévaut. Cette cinquième édition annule et remplace la quatrième édition parue en 2010. Cette édition constitue une révision technique. Reportez-vous à l'avant-propos du document pour une liste complète des modifications techniques entre l'édition 5.0 et édition précédente du document.<br/>
    Mots clés: électrique du Groupe II avec mode de protection «n»
