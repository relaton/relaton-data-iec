- language: en
  script: Latn
  content: IEC 60384-3-1:2006 is a bilingual version and corresponds to the English version. It is a supplementary document to the sectional specification and contains requirements for style, layout and minimum content of detail specifications. Detail specifications not complying with these requirements may not be considered as being in accordance with IEC specifications nor shall they so be described. It cancels and replaces the first edition published in 1989 and constitutes a minor revision related to tables, figures and references.
- language: fr
  script: Latn
  content: La CEI 60384-3-1:2006 est une version bilingue et correspond à la version anglaise. Elle est un document annexe à la spécification intermédiaire qui contient des exigences pour le modèle, la disposition et le contenu minimum des spécifications particulières. Les spécifications particulières qui ne satisfont pas aux exigences peuvent ne pas être considérées comme conformes aux spécifications de la CEI et ne doivent pas être décrites comme telles. Elle annule et remplace la première édition publiée en 1989. Elle constitue une révision mineure des tableaux, valeurs et références.
