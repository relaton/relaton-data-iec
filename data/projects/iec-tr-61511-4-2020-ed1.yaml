abstract:
- language: en
  script: Latn
  content: |-
    IEC TR 61511-4:2020(E), Functional safety - safety instrumented systems for the process industry sector, which is a Technical Report:<br/>
    • specifies the rationale behind all clauses and the relationship between them,<br/>
    • raises awareness for the most common misconceptions and misinterpretations of the clauses and the changes related to them,<br/>
    • explains the differences between Ed. 1 and Ed. 2 of IEC 61511-1 and the reasons behind the changes,<br/>
    • presents high level summaries of how to fulfil the requirements of the clauses, and<br/>
    • explains differences in terminology between IEC 61508-4:2010 and IEC 61511-1 Ed. 2.
