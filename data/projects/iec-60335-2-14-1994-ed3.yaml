- language: en
  script: Latn
  content: Deals with the Safety of electric kitchen machines for household and similar purposes, their rated voltage being not more than 250 V (such as food mixers, mincers, food processors, knives, centrifugal juicers...) Replaces IEC 60335-2-33
- language: fr
  script: Latn
  content: 'Traite de la sécurité des machines de cuisine électriques pour usages domestiques et analogues, dont la tension assignée n''est pas supérieure à 250V (exemples: batteurs, hachoirs, préparateurs culinaires, couteaux, centrifugeuses, etc...) Cette publication remplace CEI 60335-2-33.'
