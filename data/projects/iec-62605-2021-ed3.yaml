abstract:
- language: en
  script: Latn
  content: |-
    IEC 62605:2021 specifies the interchange format for e-dictionaries among publishers, content creators and manufacturers.<br/>
    This document does not address the following aspects:<br/>
    • data formats for reading devices;<br/>
    • elements necessary for final print reproduction only;<br/>
    • rendering issues related to physical devices;<br/>
    • security issues such as DRM for documents.<br/>
    IEC 62605:2021 cancels and replaces the second edition published in 2016. This edition constitutes a technical revision.<br/>
    This edition includes the following significant technical changes with respect to the previous edition:<br/>
    The format described in Annex B was significantly enhanced in the following ways:<br/>
    a) elements to enhance uses of data (e.g. web-related usage);<br/>
    b) attribute for accessibility-related functions;<br/>
    c) attributes for more detailed markup for data reusability.
