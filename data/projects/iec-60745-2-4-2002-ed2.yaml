abstract:
- language: en
  script: Latn
  content: Applies to sanders with the exception of all types of disc-type sanders, which are covered by IEC 60745-2-3. Tools covered include but are not limited to belt sanders, reciprocating sanders or polishers, orbital sanders or polishers, and random orbit sanders or polishers.
- language: fr
  script: Latn
  content: S'applique aux ponceuses à l'exception de toutes les ponceuses du type à disque qui sont couvertes par la CEI 60745-2-3. Les outils concernés comprennent mais n'y sont pas limités, les ponceuses à bande, les ponceuses ou polisseuses vibrantes, les ponceuses ou polisseuses orbitales ainsi que les ponceuses orbitales spéciales.
