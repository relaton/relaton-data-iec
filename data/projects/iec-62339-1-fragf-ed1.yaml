abstract:
- language: fr
  script: Latn
  content: La CEI 62339-1:2006 établit les propriétés et les dimensions physiques qui définissent l'interface pour les composants de distribution de fluide montés en surface équipés de dispositifs d'étanchéité en élastomère utilisés dans les systèmes d'analyseurs de processus et de traitement des échantillons. L'interface contrôle les dimensions et l'emplacement des surfaces d'étanchéité pour permettre de changer un seul élément du système sans modification de tout le système. C'est cet aspect qui rend le système modulaire tant du point de vue de la conception que de l'entretien. Elle annule et remplace la CEI/PAS 62339-1 publiée en 2003. Cette première édition constitue une révision technique.
