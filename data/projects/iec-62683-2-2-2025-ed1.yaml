abstract:
- language: en
  script: Latn
  content: |-
    IEC 62683-2-2:2025 specifies the building information modelling (BIM) with the physical characteristics and technical services of low-voltage switchgear and controlgear assemblies to be used mainly for the construction phase of the building and also for delivering data for operation.<br/>
    This document covers all types of assemblies covered by the IEC 61439 series which can be installed in a building.<br/>
    Busbar trunking systems defined by IEC 61439-6 are under consideration for a next edition.<br/>
    These BIM object models, registered in IEC CDD, are intended to supply the process defined by ISO 16739 series.<br/>
    This document does not cover:<br/>
    – the build-in components included within the assembly such as switchgear and controlgear,<br/>
    – safety related control system of machinery,<br/>
    – the detailed electrical and mechanical configuration of the assembly<br/>
    – logistic information.
- language: fr
  script: Latn
  content: |-
    IEC 62683-2-2:2025 spécifie la modélisation des informations de la construction (BIM), avec les caractéristiques physiques et les services techniques des ensembles d’appareillage à basse tension à utiliser principalement pour la phase de construction du bâtiment, mais aussi pour la livraison des données pour l’exploitation du bâtiment.<br/>
    Le présent document englobe tous les types d’ensembles couverts par la série IEC 61439, qui peuvent être installés dans un bâtiment.<br/>
    Les systèmes de canalisation préfabriquée définis dans l’IEC 61439-6 sont à l’étude pour une prochaine édition.<br/>
    Ces modèles d’objets BIM, enregistrés dans l’IEC CDD, sont destinés à servir d’intrants au processus défini par la série ISO 16739.<br/>
    Le présent document ne couvre pas:<br/>
    – les composants intégrés au sein d’un ensemble, tel que l’appareillage;<br/>
    – le système de commande de machines qui soit relatif à la sécurité;<br/>
    – la configuration électrique et mécanique détaillée de l’ensemble;<br/>
    – les informations logistiques.
