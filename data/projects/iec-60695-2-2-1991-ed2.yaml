abstract:
- language: en
  script: Latn
  content: |-
    Specifies a needle-flame test to stimulate the effect of small flames which may result from fault conditions within the equipment, in order to assess by a simulation technique the fire hazard.
    This edition supersedes the first edition of IEC 695-2-2 (1980).

    Has the status of a basic safety publication in accordance with IEC Guide 104.
- language: fr
  script: Latn
  content: |-
    Prescrit un essai au brûleur-aiguille pour simuler l'effet de petites flammes qui peuvent provenir de défaillances à l'intérieur du matériel, afin d'évaluer de façon simulée le risque du feu.

    A le statut d'une publication fondamentale de sécurité conformément au Guide 104.
