abstract:
- language: en
  script: Latn
  content: IEC 63203-204-2:2025 specifies a test method for e-textiles for measuring the change of electrical resistance during bending of the knee and elbow joints. It uses a dynamic method. This document is applicable to e-textiles.
- language: fr
  script: Latn
  content: L’IEC 63203-204-2:2025 spécifie une méthode d’essai pour les textiles électroniques (e-textiles) permettant de mesurer la variation de la résistance électrique lors de la flexion de l’articulation du genou et du coude. Elle met en œuvre une méthode dynamique. Le présent document s’applique aux e-textiles.
