abstract:
- language: en
  script: Latn
  content: |-
    IEC 61158-4-3:2019 data-link layer provides basic time-critical messaging communications between devices in an automation environment.<br/>
    This protocol provides communication opportunities to a pre-selected “master” subset of data-link entities in a cyclic asynchronous manner, sequentially to each of those data-link entities. Other data-link entities communicate only as permitted and delegated by those master data-link entities.<br/>
    For a given master, its communications with other data-link entities can be cyclic, or acyclic with prioritized access, or a combination of the two.<br/>
    This protocol provides a means of sharing the available communication resources in a fair manner. There are provisions for time synchronization and for isochronous operation.
- language: fr
  script: Latn
  content: |-
    L'IEC 61158-4-3:2019 la couche liaison de données permet la communication de messages de base, critiques du point de vue temporel, entre appareils dans un environnement d'automatisation.<br/>
    Ce protocole donne les moyens de communiquer à un sous-ensemble “maître” présélectionné d'entités de liaison de données de manière asynchrone cyclique, séquentiellement pour chacune de ces entités de liaison de données. D'autres entités de liaison de données communiquent uniquement si elles sont autorisées et déléguées par ces entités de liaison de données "maîtres".<br/>
    Les communications d'un maître avec d'autres entités de liaison de données peuvent être cycliques ou acycliques avec accès selon un ordre de priorité, ou une combinaison des deux.<br/>
    Ce protocole est un moyen de partager de manière équitable les ressources de communication disponibles. Il comporte des dispositions de fonctionnement synchrone et isochrone.
