abstract:
- language: en
  script: Latn
  content: Recommends procedures for the monitoring of energy-related photovoltaic (PV) system characteristics, and for the exchange and analysis of monitored data. The purpose is the assessment of the overall performance of PV systems.
- language: fr
  script: Latn
  content: Donne des recommandations relatives aux procédures pour le suivi des caractéristiques énergétiques des systèmes photovoltaïques (PV), ainsi qu'à l'échange et l'analyse des données enregistrées. L'objectif de ces procédures est l'évaluation des performances globales des systèmes PV.
