    <p class="MsoNormal">ISO/IEC 29341-13-10:2008(E) provides the services necessary for strong authentication, authorization, replay prevention and privacy of UPnP SOAP (simple object access protocol) actions. The series of ISO/IEC 29341 publications defines an architecture for pervasive peer-to-peer network connectivity of intelligent appliances, wireless devices and PCs. It is designed to bring easy to use, flexible, standards-based connectivity to ad-hoc or unmanaged networks whether in the home, in a small business, public spaces or attached to the Internet.</p>
