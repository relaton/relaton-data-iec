abstract:
- language: en
  script: Latn
  content: |-
    Is concerned with the classification of hazardous areas where
    flammable gas or vapour risks may arise, in order to permit the
    proper selection and installation of apparatus for use in such
    hazardous areas.
- language: fr
  script: Latn
  content: |-
    Est relative au classement des régions dangereuses dans lesquelles
    des risques dus à des gaz, ou vapeurs, inflammables peuvent
    apparaître, afin de permettre le choix et l'installation corrects
    du matériel à utiliser dans de telles régions dangereuses.
