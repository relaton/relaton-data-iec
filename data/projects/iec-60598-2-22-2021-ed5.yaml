abstract:
- language: en
  script: Latn
  content: |-
    IEC 60598-2-22:2021 specifies requirements for emergency luminaires for use with electrical lamps on emergency power supplies not exceeding 1 000 V. This fifth edition cancels and replaces the fourth edition published in 2014 and Amendment 1:2017. This edition constitutes a technical revision. This edition includes the following significant technical changes with respect to the previous edition:<br/>
    - update of requirements for rest mode and inhibiting mode;<br/>
    - clarification of high temperature operation tests;<br/>
    - introduction of new requirements for lithium batteries;<br/>
    - introduction of new requirements for electric double layer capacitors (EDLCs);<br/>
    - clarification of resistance to heat, fire and tracking;<br/>
    - clarification of test facilities for self-contained luminaires;<br/>
    - clarification of the test method for contrast measurements of exit signs.
- language: fr
  script: Latn
  content: |-
    L'IEC 60598-2-22:2021 spécifie les exigences applicables aux luminaires d'éclairage de secours à utiliser avec des lampes électriques sur des alimentations de secours qui ne dépassent pas 1 000 V. Cette cinquième édition annule et remplace la quatrième édition parue en 2014 et l'Amendement 1:2017. Cette édition constitue une révision technique. Cette édition inclut les modifications techniques majeures suivantes par rapport à l'édition précédente:<br/>
    - mise à jour des exigences relatives à l'état de repos et l'état de neutralisation;<br/>
    - clarification des essais de fonctionnement à température élevée;<br/>
    - introduction de nouvelles exigences pour les batteries au lithium;<br/>
    - introduction de nouvelles exigences pour les condensateurs électriques à double couche (EDLC);<br/>
    - clarification de la résistance à la chaleur, au feu et aux courants de cheminement;<br/>
    - clarification des dispositifs d'essai pour les blocs autonomes;<br/>
    - clarification de la méthode d'essai pour les mesures du contraste des signaux de sortie.
