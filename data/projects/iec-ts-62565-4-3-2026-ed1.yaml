abstract:
- language: en
  script: Latn
  content: |-
    IEC TS 62565-4-3:2026, which is a Technical Specification, establishes a blank detail specification (BDS) for quantum dot enabled light emitting diodes (QLEDs) used for printed light emitting diodes (LEDs).<br/>
    This document is intended to be used for display applications.<br/>
    The relevant key control characteristics (KCCs) include optical, physical, chemical, and structural properties of colloidal quantum dots (QDs). For each KCC listed, methods and existing standards for their measurement are reported. The applicability of such methods and standards to different material categories (physical forms) of QDs, for example colloidal solution, inks, films, is indicated.<br/>
    Numeric values for the KCCs are left blank as they will be specified between customer and supplier in the detail specification (DS). In the DS, KCCs can be added or removed if agreed between customer and supplier.
