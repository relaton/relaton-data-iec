abstract:
- language: en
  script: Latn
  content: IEC/TR 61292-1:2009(E) is a technical report, and applies to optical components of rare-earth doped fibre amplifiers. It provides information about the most relevant parameters of optical components especially for erbium doped fibre amplifiers (EDFAs). This second edition cancels and replaces the first edition published in 1998. It is a technical revision with updates reflecting new technology.
