abstract:
- language: en
  script: Latn
  content: |-
    IEC 60127-8:2018 relates to fuse resistors with particular overcurrent protection rated up to AC 500 V and/or DC 500 V for printed circuits and other substrate systems, used for the protection of electric appliances, electronic equipment and component parts thereof, normally intended to be used indoors.<br/>
    It does not apply to fuse resistors with particular overcurrent protection for appliances intended to be used under special conditions, such as in a corrosive or explosive atmosphere.<br/>
    The object of this part of IEC 60127 is<br/>
    a) to establish uniform requirements for fuse resistors with particular overcurrent protection so as to protect appliances or parts of appliances in the most suitable way;<br/>
    b) to define the performance of the fuse resistors with particular overcurrent protection, so as to give guidance to manufacturers of electrical appliances and electronic equipment and to ensure replacement of fuse resistors with particular overcurrent protection by those of similar dimensions and characteristics;<br/>
    c) to establish uniform test methods for fuse resistors with particular overcurrent protection, so as to allow verification of the values (for example rated dissipation, functioning characteristic and rated breaking capacity values) specified by the manufacturer.<br/>
    This part of IEC 60127 applies in addition to the requirements of IEC 60127-1.<br/>
    This first edition of IEC 60127-8 cancels and replaces IEC PAS 60127-8:2014.<br/>
    This international standard is to be used in conjunction with IEC 60127-1.<br/>
    Keywords: Miniature Fuses, Fuse-Resistors, Overcurrent Protection
- language: fr
  script: Latn
  content: |-
    IEC 60127-8: 2018 porte sur les résistances de protection avec protection particulière contre les surintensités assignées jusqu’à 500 V en courant alternatif et/ou 500 V en courant continu pour les circuits imprimés et autres systèmes de substrat employés pour la protection d'appareils électriques, d’équipements électroniques et de leurs éléments constituants, normalement destinés à être utilisés à l'intérieur.<br/>
    Elle n’est pas applicable aux résistances de protection avec protection particulière contre les surintensités placées dans des appareils destinés à être utilisés dans des conditions particulières, telles que des atmosphères corrosives ou explosives.<br/>
    L’objet de la présente partie de l’IEC 60127 est<br/>
    a) d’établir des exigences uniformes pour les résistances de protection avec protection particulière contre les surintensités afin de protéger les appareils ou les parties d’appareils de la façon la plus appropriée;<br/>
    b) de définir les performances des résistances de protection avec protection particulière contre les surintensités afin de donner des recommandations aux fabricants d’appareils électriques et d'équipements électroniques et d’assurer le remplacement des résistances de protection avec protection particulière contre les surintensités par des résistances de dimensions et de caractéristiques similaires;<br/>
    c) d’établir des méthodes d’essai uniformes pour les résistances de protection avec protection particulière contre les surintensités afin de permettre la vérification des valeurs spécifiées par le fabricant (par exemple, la dissipation assignée, la caractéristique de fonctionnement et le pouvoir de coupure assigné).<br/>
    La présente partie de l'IEC 60127 s'applique en complément des exigences de l'IEC 60127-1.<br/>
    Cette première édition de l’IEC 60127-8 annule et remplace l’IEC PAS 60127-8:2014.<br/>
    La présente Norme internationale doit être utilisée conjointement avec l’IEC 60127-1.
