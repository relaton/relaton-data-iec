abstract:
- language: en
  script: Latn
  content: |-
    IEC 63522-52:2026 is used for testing all kind of electrical relays and for evaluating their ability to perform under expected conditions of transportation, storage and all aspects of operational use.<br/>
    This document defines a standard test method for coil overvoltage in device under test (DUT) equipped with a coil. is used for testing all kind of electrical relays and for evaluating their ability to perform under expected conditions of transportation, storage and all aspects of operational use.
- language: fr
  script: Latn
  content: |-
    IEC 63522-52:2026 traite des essais de tous les types de relais électriques et elle évalue leur aptitude à fonctionner dans les conditions prévues de transport, de stockage et dans tous les aspects de leur utilisation opérationnelle.<br/>
    Le présent document a pour objet de définir une méthode d'essai normalisée relative à la surtension aux bornes de la bobine dans un dispositif en essai (DUT) équipé d'une bobine
