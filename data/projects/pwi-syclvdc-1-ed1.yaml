abstract:
- language: en
  script: Latn
  content: |-
    <p>The AhG 2 Use Case Priority Assessment: “last mile” with communication was established to determine the urgency of standardisation of LVDC distribution in public domain.</p>

    <p>The "Last mile'' LVDC System is an alternative to the smart grid distribution solutions based on conventional AC distribution systems. The “last mile” refers to the use LVDC distribution to serve multiple Grid Users on an area that extends over a wide area in public domain. In such use cases the network assets can be either public or private property, but the purpose of the distribution is to provide either grid service or enable providing other electricity distribution dependent services publicly. The "communication" refers to any means of exchanging information for the distribution management, grid operation and electricity trade purposes and for the purposes of the other related services.</p>
    Due to considerable differences between the identified use cases, it was concluded, that the LVDC distribution with communication in public domain is a group of use cases. Each use case is related to one or more business cases and depicted by respective business and system use cases. Formal definition of the use cases by using appropriate methodology is required to determine reference use cases for standardisation purposes. During the course of the work, the scope was refined to be the definition, description and analysis of the use cases on high level with the goal to provide a basis for preparation of corresponding systems reference document(s) (SRD(s)).<br/>
    <br/>
    This report presents the high-level business and system oriented use case analysis and gives examples of more detailed use case descriptions based on the IEC use case methodology.
