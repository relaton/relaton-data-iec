abstract:
- language: fr
  script: Latn
  content: |-
    La CEI 62448:2009 spécifie un format générique de publication électronique multimédia utilisé pour l'échange des données d'un livre électronique entre les préparateurs de ces données et les éditeurs, satisfaisant un certain nombre d'exigences de ces derniers:<br/>
    - une structure logique révisable,<br/>
    - extensible et<br/>
    - hétérogène. La présente version bilingue, publiée en 2009-06, correspond à la version anglaise publiée en 2009-02. La version française de cette norme n'a pas été soumise au vote.
