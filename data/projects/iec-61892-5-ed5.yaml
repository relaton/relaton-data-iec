abstract:
- language: en
  script: Latn
  content: |-
    IEC 61892-5:2026 specifies additional characteristics for electrical installations in mobile units.<br/>
    It applies to installations that depend on buoyancy, such as column-stabilized units (semi­submersible units), ship- or barge-type units as well as self-elevating units. It specifies additional characteristics for such units, used during transfer from one location to another and for drilling, production, accommodation, processing, storage and offloading purposes.<br/>
    It applies to all installations, whether permanent, temporary, transportable or hand-held, to AC installations and DC installations without any limitation on voltage level. It is possible that referenced equipment standards give voltage level limitations.<br/>
    This fifth edition cancels and replaces the fourth edition published in 2019. This edition constitutes a technical revision.<br/>
    This edition includes the following significant technical changes with respect to the previous edition:<br/>
    a) addition of floating units in Scope;<br/>
    b) minor updates in Normative references.
