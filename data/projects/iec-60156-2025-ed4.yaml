abstract:
- language: en
  script: Latn
  content: IEC 60156:2025 specifies the method for determining the dielectric breakdown voltage of insulating liquids at power frequency. The test procedure is performed in a specified apparatus, where the oil sample is subjected to an increasing AC electrical field until breakdown occurs. The method applies to all types of insulating liquids of nominal viscosity up to 350 mm2/s at 40 °C. It is appropriate both for acceptance testing on unused liquids at the time of their delivery and for establishing the condition of samples taken in monitoring and maintenance of equipment.
- language: fr
  script: Latn
  content: L'IEC 60156:2025 spécifie la méthode de détermination de la tension de claquage diélectrique des isolants liquides à fréquence industrielle. La procédure d’essai est réalisée dans un appareil spécifié dans lequel l’échantillon d’huile est soumis à un champ électrique alternatif croissant jusqu’à l’obtention du claquage. La méthode est applicable à tous les types d’isolants liquides de viscosité nominale allant jusqu’à 350 mm2/s à 40 °C. Elle convient aussi bien pour les essais de réception de liquides neufs à la livraison que pour définir l’état des échantillons prélevés lors de la surveillance et de la maintenance des matériels.
