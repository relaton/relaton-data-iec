abstract:
- language: en
  script: Latn
  content: IEC 63522-40:2025 This document is used for testing along with the appropriate severities and conditions for measurements and tests designed to assess the ability of DUTs to perform under expected conditions of transportation, storage and all aspects of operational use. This document defines a standard test method for short circuit testing.
- language: fr
  script: Latn
  content: |-
    IEC 63522-40:2025 Le présent document traite des essais ainsi que des sévérités et conditions appropriées pour les mesurages et essais destinés à évaluer l'aptitude de DUT à fonctionner dans des conditions prévues de transport, de stockage, et de tous les aspects d'utilisation opérationnelle.<br/>
    Le présent document définit une méthode d'essai normalisée pour les essais de court-circuit.
