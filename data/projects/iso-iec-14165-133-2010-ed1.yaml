abstract:
- language: en
  script: Latn
  content: "ISO&#x2F;IEC 14165-133:2010(E) describes how switches communicate and interact with one another to form a Fabric of switches. It includes:&lt;br &#x2F;&gt;\r\na) E_Port Operation and Fabric Configuration;&lt;br &#x2F;&gt;\r\nb) Path selection (FSPF and FSPF-Backbone);&lt;br &#x2F;&gt;\r\nc) Bridge Port (B_Port) Operation;&lt;br &#x2F;&gt;\r\nd) distributed server interaction and communication;&lt;br &#x2F;&gt;\r\ne) exchange of information between Switches to support zoning;&lt;br &#x2F;&gt;\r\nf) distribution of Event Notifications between Switches."
