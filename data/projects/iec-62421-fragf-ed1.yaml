  script: Latn
  content: L'IEC 62421:2007 consiste en une norme générique relative aux modules électroniques sur laquelle sont fondées les normes intermédiaires associées. Il fournit une définition, un modèle commercial, une interface entre les partenaires commerciaux, et les domaines concernés par la normalisation des modules électroniques. De plus une série de méthode d'essai générique est fournie.
