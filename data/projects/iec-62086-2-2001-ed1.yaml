abstract:
- language: en
  script: Latn
  content: |-
    Pprovides guidance for the application of electrical resistance trace-heating systems in areas where explosive gas atmospheres may be present.
    It provides recommendations for the design, installation and maintenance of trace-heating equipment and associated control and monitoring equipment.
    This part supplements the requirements specified in IEC 62086-1.
- language: fr
  script: Latn
  content: |-
    Fournit des lignes directrices quant à l'application des systèmes de traçage par résistance électrique dans les emplacements où l'on peut rencontrer des atmosphères explosives.
    Elle fournit des recommandations pour la conception, l'installation et la maintenance du matériel de traçage et du matériel associé de commande et de surveillance. 
    La présente partie représente un complément des prescriptions spécifiées dans la CEI 62086-1.
