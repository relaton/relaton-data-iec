abstract:
- language: en
  script: Latn
  content: |-
    IEC 62442-1:2022 defines a measurement and calculation method of the total input power for controlgear-lamp circuits when operating with their associated fluorescent lamp(s). The calculation method for the efficiency of the lamp controlgear is also defined. This document applies to electrical controlgear-lamp circuits consisting only of the controlgear and the lamp(s). It is intended for use on DC supplies up to 1 000 V and/or AC supplies up to 1 000 V at 50 Hz or 60 Hz. This third edition cancels and replaces the second edition published in 2018. This edition constitutes a technical revision. This edition includes the following significant technical changes with respect to the previous edition:<br/>
    - this edition has been harmonized with IEC 62442-2 and IEC 62442­-3;<br/>
    - the reference to and use of the measurement methods for non-active power consumption in accordance with IEC 63103 have been added.
- language: fr
  script: Latn
  content: |-
    L'IEC 62442-1:2022 définit une méthode de mesurage et de calcul de la puissance d'entrée totale pour les circuits appareillage-lampe qui fonctionnent avec la ou les lampes à fluorescence qui leur sont associées. La méthode de calcul du rendement des appareillages de lampes est également définie. Le présent document s'applique aux circuits appareillage-lampe électriques constitués exclusivement de l'appareillage et de la ou des lampes. Il s'applique aux alimentations en courant continu jusqu'à 1 000 V et/ou aux alimentations en courant alternatif jusqu'à 1 000 V à 50 Hz ou 60 Hz. Cette troisième édition annule et remplace la deuxième édition parue en 2018. Cette édition constitue une révision technique. Cette édition inclut les modifications techniques majeures suivantes par rapport à l'édition précédente:<br/>
    - cette édition a été harmonisée avec l'IEC 62442-2 et l'IEC 62442-3;<br/>
    - des références à l'IEC 63103 ont été ajoutées afin d'appliquer les méthodes de mesurage de la consommation de puissance en mode non actif.<br/>
    La version française de cette norme n'a pas été soumise au vote.
