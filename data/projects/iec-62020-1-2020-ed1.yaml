abstract:
- language: en
  script: Latn
  content: "IEC 62020-1:2020 applies to residual current monitors for household and similar purposes, having rated operational voltages and a rated voltage of the monitored circuit not exceeding 440 V AC and rated currents not exceeding 125 A.<br/>\nThis first edition cancels and replaces IEC 62020:1998 and IEC 62020:1998/AMD1:2003. This edition constitutes a technical revision.<br/>\nThis edition includes the following significant technical changes with respect to the previous edition:<br/>\n– definition of Type F and Type B RCM;<br/>\n– marking of Type F and Type B RCM;<br/>\n– introduction of a new subclause, <!--[if supportFields]><span\r\nlang=EN-GB><span style='mso-element:field-begin'></span><span\r\nstyle='mso-spacerun:yes'> </span>REF _Ref521411992 \\r \\h<span\r\nstyle='mso-spacerun:yes'>  </span>\\* MERGEFORMAT <span style='mso-element:field-separator'></span></span><![endif]-->8.20<!--[if gte mso 9]><xml>\r\n <w:data>08D0C9EA79F9BACE118C8200AA004BA90B02000000080000000E0000005F005200650066003500320031003400310031003900390032000000</w:data>\r\n</xml><![endif]--><!--[if supportFields]><span lang=EN-GB><span\r\nstyle='mso-element:field-end'></span></span><![endif]-->;<br/>\n– modification of <!--[if supportFields]><span lang=EN-GB><span\r\nstyle='mso-element:field-begin'></span><span\r\nstyle='mso-spacerun:yes'> </span>REF _Ref521412027 \\r \\h<span\r\nstyle='mso-spacerun:yes'>  </span>\\* MERGEFORMAT <span style='mso-element:field-separator'></span></span><![endif]-->9.7<!--[if gte mso 9]><xml>\r\n <w:data>08D0C9EA79F9BACE118C8200AA004BA90B02000000080000000E0000005F005200650066003500320031003400310032003000320037000000</w:data>\r\n</xml><![endif]--><!--[if supportFields]><span lang=EN-GB><span\r\nstyle='mso-element:field-end'></span></span><![endif]-->;<br/>\n– update of <!--[if supportFields]><span lang=EN-GB><span\r\nstyle='mso-element:field-begin'></span><span\r\nstyle='mso-spacerun:yes'> </span>REF _Ref521412044 \\r \\h<span\r\nstyle='mso-spacerun:yes'>  </span>\\* MERGEFORMAT <span style='mso-element:field-separator'></span></span><![endif]-->9.9<!--[if gte mso 9]><xml>\r\n <w:data>08D0C9EA79F9BACE118C8200AA004BA90B02000000080000000E0000005F005200650066003500320031003400310032003000340034000000</w:data>\r\n</xml><![endif]--><!--[if supportFields]><span lang=EN-GB><span\r\nstyle='mso-element:field-end'></span></span><![endif]-->;<br/>\n– modification of <!--[if supportFields]><span lang=EN-GB><span\r\nstyle='mso-element:field-begin'></span><span\r\nstyle='mso-spacerun:yes'> </span>REF _Ref521412054 \\r \\h<span\r\nstyle='mso-spacerun:yes'>  </span>\\* MERGEFORMAT <span style='mso-element:field-separator'></span></span><![endif]-->9.14<!--[if gte mso 9]><xml>\r\n <w:data>08D0C9EA79F9BACE118C8200AA004BA90B02000000080000000E0000005F005200650066003500320031003400310032003000350034000000</w:data>\r\n</xml><![endif]--><!--[if supportFields]><span lang=EN-GB><span\r\nstyle='mso-element:field-end'></span></span><![endif]-->;<br/>\n– modification of <!--[if supportFields]><span lang=EN-GB><span\r\nstyle='mso-element:field-begin'></span><span\r\nstyle='mso-spacerun:yes'> </span>REF _Ref521412067 \\r \\h<span\r\nstyle='mso-spacerun:yes'>  </span>\\* MERGEFORMAT <span style='mso-element:field-separator'></span></span><![endif]-->9.19<!--[if gte mso 9]><xml>\r\n <w:data>08D0C9EA79F9BACE118C8200AA004BA90B02000000080000000E0000005F005200650066003500320031003400310032003000360037000000</w:data>\r\n</xml><![endif]--><!--[if supportFields]><span lang=EN-GB><span\r\nstyle='mso-element:field-end'></span></span><![endif]-->, for introduction of the relevant test for Type F and Type B RCM.<br/>\nThe contents of the corrigendum of July 2020 have been included in this copy."
- language: fr
  script: Latn
  content: "L'IEC 62020-1:2020 s'applique aux contrôleurs d'isolement à courant différentiel résiduel pour usages domestiques et analogues, avec des tensions d'emploi assignées et une tension assignée du circuit surveillé ne dépassant pas 440 V en courant alternatif et des courants assignés ne dépassant pas 125 A.<br/>\nCette première édition annule et remplace l'IEC 62020:1998 et l'IEC 62020:1998/AMD1:2003. Cette édition constitue une révision technique.<br/>\nCette édition inclut les modifications techniques majeures suivantes par rapport à l'édition précédente:<br/>\n– définitions des RCM de type F et de type B;<br/>\n– marquage des RCM de type F et de type B;<br/>\n– ajout d'un nouveau paragraphe, <!--[if supportFields]><span\r\nlang=EN-GB><span style='mso-element:field-begin'></span><span\r\nstyle='mso-spacerun:yes'> </span>REF _Ref521411992 \\r \\h<span\r\nstyle='mso-spacerun:yes'>  </span>\\* MERGEFORMAT <span style='mso-element:field-separator'></span></span><![endif]-->8.20<!--[if gte mso 9]><xml>\r\n <w:data>08D0C9EA79F9BACE118C8200AA004BA90B02000000080000000E0000005F005200650066003500320031003400310031003900390032000000</w:data>\r\n</xml><![endif]--><!--[if supportFields]><span lang=EN-GB><span\r\nstyle='mso-element:field-end'></span></span><![endif]-->;<br/>\n– modification du <!--[if supportFields]><span lang=EN-GB><span\r\nstyle='mso-element:field-begin'></span> REF _Ref521412027 \\r \\h<span\r\nstyle='mso-spacerun:yes'>  </span>\\* MERGEFORMAT <span style='mso-element:field-separator'></span></span><![endif]-->9.7<!--[if gte mso 9]><xml>\r\n <w:data>08D0C9EA79F9BACE118C8200AA004BA90B02000000080000000E0000005F005200650066003500320031003400310032003000320037000000</w:data>\r\n</xml><![endif]--><!--[if supportFields]><span lang=EN-GB><span\r\nstyle='mso-element:field-end'></span></span><![endif]-->;<br/>\n– mise à jour du <!--[if supportFields]><span lang=EN-GB><span\r\nstyle='mso-element:field-begin'></span> REF _Ref521412044 \\r \\h<span\r\nstyle='mso-spacerun:yes'>  </span>\\* MERGEFORMAT <span style='mso-element:field-separator'></span></span><![endif]-->9.9<!--[if gte mso 9]><xml>\r\n <w:data>08D0C9EA79F9BACE118C8200AA004BA90B02000000080000000E0000005F005200650066003500320031003400310032003000340034000000</w:data>\r\n</xml><![endif]--><!--[if supportFields]><span lang=EN-GB><span\r\nstyle='mso-element:field-end'></span></span><![endif]-->;<br/>\n– modification du <!--[if supportFields]><span lang=EN-GB><span\r\nstyle='mso-element:field-begin'></span> REF _Ref521412054 \\r \\h<span\r\nstyle='mso-spacerun:yes'>  </span>\\* MERGEFORMAT <span style='mso-element:field-separator'></span></span><![endif]-->9.14<!--[if gte mso 9]><xml>\r\n <w:data>08D0C9EA79F9BACE118C8200AA004BA90B02000000080000000E0000005F005200650066003500320031003400310032003000350034000000</w:data>\r\n</xml><![endif]--><!--[if supportFields]><span lang=EN-GB><span\r\nstyle='mso-element:field-end'></span></span><![endif]-->;<br/>\n– modification du <!--[if supportFields]><span lang=EN-GB><span style='mso-element:\r\nfield-begin'></span></span><span lang=FR style='mso-ansi-language:FR'> REF\r\n_Ref521412067 \\r \\h<span style='mso-spacerun:yes'>  </span>\\* MERGEFORMAT </span><span\r\nlang=EN-GB><span style='mso-element:field-separator'></span></span><![endif]-->9.19<!--[if gte mso 9]><xml>\r\n <w:data>08D0C9EA79F9BACE118C8200AA004BA90B02000000080000000E0000005F005200650066003500320031003400310032003000360037000000</w:data>\r\n</xml><![endif]--><!--[if supportFields]><span lang=EN-GB><span\r\nstyle='mso-element:field-end'></span></span><![endif]--> afin d'ajouter l'essai concernant les RCM de type F et de type B.<br/>\nLe contenu du corrigendum de juillet 2020 a été pris en considération dans cet exemplaire."
