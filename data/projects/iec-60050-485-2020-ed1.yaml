abstract:
- language: en
  script: Latn
  content: |-
    IEC 60050-485:2020 gives the general terminology used in fuel cell technologies, as well as general terms pertaining to specific applications and associated technologies. This terminology is consistent with the terminology developed in the other specialized parts of the IEV.<br/>
    It has the status of a horizontal standard in accordance with IEC Guide 108.
- language: fr
  script: Latn
  content: |-
    IEC 60050-485:2020 la terminologie générale utilisée dans le domaine des technologies des piles à combustible ainsi que les termes généraux relatifs à des applications particulières et technologies associées. Cette terminologie est en accord avec la terminologie figurant dans les autres parties spécialisées de l'IEV.<br/>
    Elle a le statut de norme horizontale conformément au Guide IEC 108.
