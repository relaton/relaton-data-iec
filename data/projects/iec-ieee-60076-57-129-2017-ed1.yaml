abstract:
- language: en
  script: Latn
  content: |-
    IEC/IEEE 60076-57-129:2017(E) specifies requirements of liquid-immersed three-phase and single-phase converter transformers for use in high voltage direct current (HVDC) power transmission systems including back-to-back applications. It applies to transformers having two, three or multiple windings.<br/>
    This document does not apply to:<br/>
    - converter transformers for industrial applications (see IEC 61378-1 or IEEE C57.18.10);<br/>
    - converter transformers for traction applications (see IEC 60310).<br/>
    This publication cancels and replaces the first edition of IEC 61378-2 published in 2001 and IEEE Std C57.129™ published in 2007.
