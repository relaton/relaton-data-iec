  script: Latn
  content: Définit les prescriptions destinées à garantir que les points de consigne automatiques de l'instrumentation du système de sûreté nucléaire dans les centrales nucléaires de puissance et les installations à réacteurs nucléaires sont établis et maintenus à l'intérieur des limites spécifiées.
