abstract:
- language: en
  script: Latn
  content: |-
    IEC 62056-8-4:2018 specifies DLMS/COSEM communication profiles for narrow-band OFDM power line carrier PRIME neighbourhood networks using the modulation as specified in Recommendation ITU-T G.9904:2012.<br/>
    Three communication profiles are specified:<br/>
    • a profile using the IEC 61334-4-32 LLC layer;<br/>
    • a profile using TCP-UDP/IPv4;<br/>
    • a profile using TCP-UDP/IPv6.
- language: fr
  script: Latn
  content: |-
    IEC 62056-8-4:2018 spécifie les profils de communication DLMS/COSEM pour les réseaux de voisinage OFDM utilisant les courants porteurs en ligne PRIME utilisant la modulation conformément à la Recommandation UIT-T G.9904:2012.<br/>
    Trois profils de communication sont spécifiés:<br/>
    • un profil utilisant la couche LLC IEC 61334-4-32;<br/>
    • un profil utilisant TCP-UDP/IPv4;<br/>
    • un profil utilisant TCP-UDP/IPv6.
