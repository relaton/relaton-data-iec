  script: Latn
  content: Traite de la sécurité des friteuses à usage collectif fonctionnant à l'électricité et qui ne sont pas destinées aux usages domestiques, la tension assignée des appareils n'étant pas supérieure à 250 V pour les appareils monophasés alimentés entre phase et neutre et 480 V pour les autres appareils.
