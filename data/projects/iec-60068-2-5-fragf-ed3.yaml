abstract:
- language: en
  script: Latn
  content: |-
    <!-- NEW -->
    <p>IEC 60068-2-5:2018 specifies the methods for testing equipment or components under simulated solar radiation conditions.</p>

    <p>This document is applicable to the equipment and components at the surface of the earth.</p>
    This bilingual version (2018-10) corresponds to the monolingual English version, published in 2018-04.<br/>
    This third edition cancels and replaces the second edition of published in 2010. This edition constitutes a technical revision.<br/>
    This edition includes the following significant technical changes with respect to the previous edition:

    	the title of this document has been modified;
    	the current thermal effect test method, specified as "Test method Sa" has been retained and the weathering test method specified as "Test method Sb" has been added.


    <p>The French version of this standard has not been voted upon.</p>
- language: fr
  script: Latn
  content: |-
    <!-- NEW -->
    <p>L’IEC 60068-2-5:2018 spécifie les méthodes d’essai pour les équipements ou les composants soumis à des conditions de rayonnement solaire simulé.</p>

    <p>Ce document est applicable aux équipements et aux composants qui se trouvent à la surface de la Terre.</p>
    La présente version bilingue (2018-10) correspond à la version anglaise monolingue publiée en 2018-04.  <br/>
    Cette troisième édition annule et remplace la deuxième édition parue en 2010. Cette édition constitue une révision technique.<br/>
    Cette édition inclut les modifications techniques majeures suivantes par rapport à l’édition précédente:

    	le titre du présent document a été modifié;
    	la méthode d’essai existante relative aux effets thermiques, spécifiée en tant que "Méthode d’essai Sa" a été conservée et la méthode d’essai de vieillissement aux intempéries, spécifiée en tant que "Méthode d’essai Sb" a été ajoutée.

    La version française de cette norme n'a pas été soumise au vote.
