abstract:
- language: en
  script: Latn
  content: |-
    IEC 61772:2009 supplements IEC 60964 and presents design requirements for the application of VDUs in main control rooms of nuclear power plants. Assists the designer in specifying VDU applications including displays on individual workstations and larger displays for group-working or distant viewing. The main technical changes with respect to the previous edition are as follows:<br/>
    - expand the previous text to cover the use of large screen displays, to provide improved recommendations on the use of colour, and to improve the coverage of back-fit or upgrade applications;<br/>
    - present examples of good practice.
- language: fr
  script: Latn
  content: |-
    La CEI 61772:2009 complète la CEI 60964 et présente des exigences de conception pour l'application des unités de visualisation dans les salles de commande principales des centrales nucléaires de puissance. Aide le concepteur à spécifier les applications relatives aux unités de visualisation y compris les affichages sur les stations de travail individuelles ou sur de plus grands dispositifs d'affichage destinés au travail de groupe ou à la visualisation à distance. Les principaux changements techniques par rapport à l'édition précédente sont les suivants:<br/>
    - étendre le domaine pour couvrir l'utilisation des grands écrans, et pour améliorer les recommandations concernant l'utilisation des couleurs ainsi que la couverture des applications de rénovation ou de mise à niveau;<br/>
    - présenter des exemples de bonnes pratiques.
