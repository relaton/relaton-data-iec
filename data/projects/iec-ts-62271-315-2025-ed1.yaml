abstract:
- language: en
  script: Latn
  content: IEC TS 62271-315:2025 is applicable to direct current (DC) transfer switches designed for indoor or outdoor installation and for operation on HVDC transmission systems having direct voltages of 100 kV and above. DC transfer switches normally include metallic return transfer switches (MRTS), earth return transfer switches (ERTS), neutral bus switches (NBS) and neutral bus earthing switches (NBES).
