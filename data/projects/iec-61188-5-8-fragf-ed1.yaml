abstract:
- language: fr
  script: Latn
  content: La CEI 61188-5-8:2007 fournit des informations sur la géométrie des plages d'accueil utilisées pour la fixation en surface des composants électroniques à sorties matricielles de forme de boules de brasure, de colonnes de brasure ou de pastilles recouvertes d'une protection. Le but des informations indiquées dans la présente norme est de fournir les dimensions, formes et tolérances appropriées des plages d'accueil pour montage en surface afin de garantir une surface suffisante pour le raccord de brasure et pour permettre l'inspection, la mise en essai et les retouches des joints de brasure.
