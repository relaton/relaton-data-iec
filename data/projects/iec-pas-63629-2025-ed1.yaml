abstract:
- language: en
  script: Latn
  content: |-
    IEC PAS 63629:2025 sets out the specific rules for luminaires and defines the product specifications to be adopted by manufacturers in the development of their Product Environmental Profiles (PEP) particularly with regard to:<br/>
    - the technology and its type of application,<br/>
    - the conventional typical lifetime taken into account for the Life Cycle Assessment (LCA),<br/>
    - the conventional use scenarios to be adopted during the product use stage.
