- language: en
  script: Latn
  content: |-
    IEC 63489:2025 specifies the definition of cross-domain product data concepts (classes and properties) in the context of smart manufacturing.<br/>
    This document will be published as a set of concepts within cross-domain data dictionary "General Items (IEC 61360-7)” in the IEC CDD.
- language: fr
  script: Latn
  content: |-
    IEC 63489: 2025 spécifie la définition des concepts des données de produit interdomaines (classes et propriétés) dans le contexte de la fabrication intelligente.<br/>
    Le présent document sera publié dans le cadre des concepts du dictionnaire de données interdomaines "IEC 61360 7 - General items" dans le CDD de l'IEC.
