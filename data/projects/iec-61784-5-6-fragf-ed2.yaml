abstract:
- language: fr
  script: Latn
  content: |-
    La CEI 61784-5-6:2010 définit les profils d'installation pour la CPF 6 (INTERBUS). Les profils d'installation sont spécifiés dans les annexes. Ces annexes sont utilisées conjointement à la CEI 61918:2010. Cette deuxième édition annule et remplace la première édition publiée en 2007, dont elle constitue une révision technique. Elle comporte les modifications techniques suivantes par rapport à l'édition précédente:<br/>
    - alignement sur la CEI 61918:2010;<br/>
    - addition du connecteur M12-FO. La présente version bilingue (2012-02) correspond à la version anglaise monolingue publiée en 2010-07.
