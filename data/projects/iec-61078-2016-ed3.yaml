abstract:
- language: en
  script: Latn
  content: |-
    IEC 61078:2016 this International Standard describes:<br/>
    - the requirements to apply when reliability block diagrams (RBDs) are used in dependability analysis;<br/>
    - the procedures for modelling the dependability of a system with reliability block diagrams;<br/>
    - how to use RBDs for qualitative and quantitative analysis;<br/>
    - the procedures for using the RBD model to calculate availability, failure frequency and reliability measures for different types of systems with constant (or time dependent) probabilities of blocks success/failure, and for non-repaired blocks or repaired blocks;<br/>
    - some theoretical aspects and limitations in performing calculations for availability, failure frequency and reliability measures;<br/>
    - the relationships with fault tree analysis (see IEC 61025) and Markov techniques (see IEC 61165). This third edition cancels and replaces the second edition published in 2006. This edition constitutes a technical revision. This edition includes the following significant technical changes with respect to the previous edition:<br/>
    - the structure of the document has been entirely reconsidered, the title modified and the content extended and improved to provide more information about availability, reliability and failure frequency calculations;<br/>
    - Clause 3 has been extended and clauses have been introduced to describe the electrical analogy, the "non-coherent" RBDs and the "dynamic" RBDs;<br/>
    - Annex B about Boolean algebra methods has been extended;<br/>
    - Annex C (Calculations of time dependent probabilities), Annex D (Importance factors), Annex E (RBD driven Petri net models) and Annex F (Numerical examples and curves) have been introduced.  
    Keywords: reliability block diagram (RBD)
- language: fr
  script: Latn
  content: |-
    L'IEC 61078:2016 la présente Norme internationale décrit:<br/>
    - les exigences à appliquer lors de l'utilisation de diagrammes de fiabilité (BDF) dans le cadre d'analyses de sûreté de fonctionnement;<br/>
    - les procédures de modélisation de la sûreté de fonctionnement d'un système avec des diagrammes de fiabilité;<br/>
    - comment utiliser les BDF pour procéder à des analyses qualitatives et quantitatives;<br/>
    - les procédures d'utilisation du modèle BDF pour calculer les mesures de disponibilité, de fréquence de défaillance et de fiabilité pour différents types de systèmes avec des probabilités constantes (ou dépendant du temps) de succès/défaillance de blocs, et ceci pour des blocs non réparés ou des blocs réparés;<br/>
    - certains aspects et limitations théoriques liés aux calculs des mesures de disponibilité, de fréquence de défaillance et de fiabilité;<br/>
    - les relations avec l'analyse par arbre de panne (voir IEC 61025) et les techniques de Markov (voir IEC 61165). Cette troisième édition annule et remplace la deuxième édition publiée en 2006. Cette édition constitue une révision technique. Cette édition inclut les modifications techniques majeures suivantes par rapport à l'édition précédente:<br/>
    - la structure du document a été entièrement remaniée, le titre modifié et le contenu étendu et amélioré afin de fournir de plus amples informations sur les calculs de disponibilité, de fiabilité et de fréquence de défaillance;<br/>
    - l'Article 3 a été étendu et des articles ont été introduits pour décrire l'analogie électrique, les BDF "non cohérents" et les BDF "dynamiques";<br/>
    - l'Annexe B relative aux méthodes algébriques booléennes a été étendue;<br/>
    - l'Annexe C (Calculs des probabilités en fonction du temps), l'Annexe D (Facteurs d'importance), l'Annexe E (Modèles de réseau de Petri piloté par BDF) et l'Annexe F (Exemples numériques et courbes) ont été introduites.  
    Mots clés: diagrammes de fiabilité (BDF)
