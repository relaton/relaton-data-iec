abstract:
- language: fr
  script: Latn
  content: La CEI 61968-13:2008 spécifie le format et les règles pour l'échange d'informations de modélisation sur la base du CIM (Common Information Model) et en rapport avec des données de réseau de distribution. Permet l'échange de données d'instance en masse. Ainsi, il convient que les données de modèles de réseau importées soient suffisantes pour permettre d'accomplir l'analyse de connectivité de réseau, y compris le suivi de réseau, l'analyse d'interruptions de service, les calculs de flux de charge, etc. La présente partie pourrait être utilisée pour synchroniser des bases de données de systèmes d'informations géographiques avec des bases de données de systèmes de conduite à distance.
