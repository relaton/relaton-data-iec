abstract:
- language: en
  script: Latn
  content: Provides methods for evaluating the performance of all electrical and pneumatic analogue chart recorders operating from a standardized signal which may be used in process control. Continuous and dotted line traces, multiple-pen and multiple-channel instruments are covered.
- language: fr
  script: Latn
  content: Décrit des méthodes destinées à évaluer les performances de tous les enregistreurs analogiques électriques et pneumatiques sur papier diagramme, fonctionnant à partir d'un signal normalisé qui peut être utilisé dans les systèmes de conduite des processus. Couvre les instruments à tracés continus et à tracés interrompus, les instruments à plusieurs plumes et à plusieurs canaux.
