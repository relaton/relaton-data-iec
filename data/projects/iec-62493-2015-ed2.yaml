abstract:
- language: en
  script: Latn
  content: |-
    IEC 62493:2015 applies to the assessment of lighting equipment related to human exposure to electromagnetic fields. The assessment consists of the induced internal electric field for frequencies from 20 kHz to 10 MHz and the specific absorption rate (SAR) for frequencies from 100 kHz to 300 MHz around lighting equipment. This second edition cancels and replaces the first edition published in 2009. This edition constitutes a technical revision. This edition includes the following significant technical changes with respect to the previous edition:<br/>
    a) identification of lighting product types deemed to comply with the standard without the need for test;<br/>
    b) deletion of the need for CISPR-15-compliance as a prerequisite for IEC 62493 compliance;<br/>
    c) inclusion of the consequences of the ICNIPR 2010 guidelines for (up to 100 kHz);<br/>
    d) adding some guidance to the Van der Hoofden test head method to improve reproducibility of results;<br/>
    e) inclusion of compliance demonstration method for products having intentional radiators.
- language: fr
  script: Latn
  content: |-
    L'IEC 62439:2015 traite de l'évaluation d'un équipement d'éclairage relativement à l'exposition humaine aux champs électromagnétiques. L'évaluation comprend le champ électrique interne induit pour les fréquences comprises entre 20 kHz et 10 MHz et le débit d'absorption spécifique (DAS) pour les fréquences comprises entre 100 kHz et 300 MHz autour de l'équipement d'éclairage. Cette deuxième édition annule et remplace la première édition, parue en 2009. Cette édition constitue une révision technique. La présente édition inclut les modifications techniques significatives suivantes par rapport à l'édition précédente:<br/>
    a) identification des types de produits d'éclairage considérés comme satisfaisant à la norme sans qu'il soit nécessaire de procéder à des essais;<br/>
    b) suppression de la condition préalable consistant à se conformer à la norme CISPR 15 pour satisfaire aux exigences de l'IEC 62493;<br/>
    c) inclusion des conséquences des lignes directrices de l'ICNIPR 2010 (jusqu'à 100 kHz);<br/>
    d) ajout de recommandations pour la "méthode de la tête d'essai de Van der Hoofden" afin d'améliorer la reproductibilité des résultats;<br/>
    e) inclusion de la méthode de démonstration de conformité des produits dotés d'éléments rayonnants intentionnels.
