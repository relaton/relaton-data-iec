abstract:
- language: en
  script: Latn
  content: |
    <!-- NEW! -->IEC 60794-3-70:2021 is available as IEC 60794-3-70:2021 RLV which contains the International Standard and its Redline version, showing all changes of the technical content compared to the previous edition.<br/>
    <br/>
    IEC 60794-3-70: 2021 is a family specification that covers outdoor optical fibre cables intended for rugged terrestrial rapid/multiple deployment. These cables, with enhanced mechanical, environmental and ingress performance can be used wherever a rapid or multiple deployment is relevant (e.g. mobile broadcast units, emergency rescue services, tactical ground-forces, outdoor motion-robotics, mining machinery, temporary repair cables for damaged links, etc.). This second edition cancels and replaces the first edition published in 2016. It constitutes a technical revision. This edition includes the following significant technical changes with respect to the previous edition:

    	incorporation of the new classification system for optical fibre categories, sub-categories in IEC 60793-2-10;
    	incorporation of the new classification system for optical fibre categories, sub-categories and models in IEC 60793-2-50;
    	updating of cabled fibre performance categories in alignment with ISO/IEC 11801-1;
    	updating of bibliographical references.
- language: fr
  script: Latn
  content: |-
    <p>IEC 60794-3-70:2021 est disponible sous forme de IEC 60794-3-70:2021 RLV qui contient la Norme internationale et sa version Redline, illustrant les modifications du contenu technique depuis l'édition précédente.<br/>
    <br/>
    IEC 60794-3-70: 2021 est une spécification de famille qui couvre les câbles à fibres optiques extérieurs destinés à un déploiement rapide/multiple terrestre renforcé. Ces câbles, dont les performances mécaniques, environnementales et d’infiltration sont améliorées, peuvent être utilisés partout où un déploiement rapide ou multiple est applicable (par exemple, dans des unités mobiles de diffusion, des services de secours d’urgence, des forces terrestres tactiques, des robots mobiles extérieurs, des engins d’exploitation minière, des câbles de réparation temporaire pour liaisons endommagées, etc.). Cette édition inclut les modifications techniques majeures suivantes par rapport à l’édition précédente:<br/>
    a) incorporation du nouveau système de classification pour les catégories et sous-catégories de fibres optiques de l’IEC 60793-2-10;<br/>
    b) incorporation du nouveau système de classification pour les catégories, sous-catégories et modèles de fibres optiques de l’IEC 60793-2-50;</p>
