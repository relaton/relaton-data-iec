abstract:
- language: en
  script: Latn
  content: |-
    IEC/TR 62362: 2026 provides information on the specification of optical fibre cables with respect to the mechanical, ingress, climatic and chemical or electromagnetic characteristics (MICE) as classified in ISO/IEC 11801-1.<br/>
    In this classification system, each letter of the four initials of the acronym are subscripted with a value from one to three to indicate different severities. The current attributes and severities are found in Annex A.<br/>
    IEC/TR 62362: 2026 includes the following changes with respect to the previous edition:<br/>
    a) Updating of Annex B - IEC optical fibre cable standards, to reflect the of currently existing IEC optical cable standards;<br/>
    b) Updating of Annex C - Fibre specifications and tests.
