abstract:
- language: en
  script: Latn
  content: |-
    IEC 61300-3-21:2019 describes a method to measure the switching time and related performance parameters of a fibre optic spatial switch when the actuation energy is applied or removed to change the state of the switch. This third edition cancels and replaces the second edition published in 2014. This edition constitutes a technical revision. This edition includes the following significant technical changes with respect to the previous edition:<br/>
    - changes to remove redundant overlap with IEC 60876-1;<br/>
    - clarifications to definitions and diagrams;<br/>
    - generalization of the detection apparatus beyond an oscilloscope.<br/>
    Keywords: switching time, performance parameters of a fibre optic spatial switch, actuation energy
- language: fr
  script: Latn
  content: |-
    IEC 61300-3-21:2019 décrit une méthode en vue de mesurer le temps de commutation et les paramètres de performances associés d'un commutateur spatial fibronique, lorsque l'énergie d'activation est appliquée ou retirée pour modifier l'état du commutateur. Cette troisième édition annule et remplace la deuxième édition parue en 2014 dont elle constitue une révision technique. La présente édition inclut les modifications techniques majeures suivantes par rapport à l'édition précédente:<br/>
    - modifications pour éviter les redondances avec l'IEC 60876-1;<br/>
    - clarifications des définitions et des schémas;<br/>
    - généralisation des appareils de détection autres que les oscilloscopes.<br/>
    Mots-clés : temps de commutation, paramètres de performances associés d'un commutateur spatial fibronique, énergie d'activation
