abstract:
- language: en
  script: Latn
  content: |-
    IEC 61400-25-5:2017 specifies standard techniques for testing of compliance of implementations, as well as specific measurement techniques to be applied when declaring performance parameters. The use of these techniques will enhance the ability of users to purchase systems that integrate easily, operate correctly, and support the applications as intended. This part of IEC 61400-25 defines: the methods and abstract test cases for compliance testing of server and client devices used in wind power plants; the metrics to be measured in said devices according to the communication requirements specified in IEC 61400-25 (all parts). This new edition includes the following significant technical changes with respect to the previous edition:<br/>
    - harmonization with structure and test cases in IEC 61850-10:2012;<br/>
    - reduction of overlap between standards and simplification by increased referencing to the IEC 61850 standard series.
- language: fr
  script: Latn
  content: |-
    l'IEC 61400-25-5:2017 spécifie les techniques normalisées destinées à soumettre à l'essai la conformité des mises en œuvre ainsi que des techniques de mesure spécifiques à appliquer lors de l'établissement des paramètres de performance. L'utilisation de ces techniques permet aux utilisateurs d'acheter en toute connaissance de cause des systèmes faciles à intégrer, qui fonctionnent correctement et prennent en charge les applications prévues.<br/>
    La présente partie de l'IEC 61400-25 définit:<br/>
    les méthodes et les cas d'essai abstraits pour les essais de conformité des dispositifs serveur et client utilisés dans les centrales éoliennes; les mesurages à réaliser dans lesdits dispositifs conformément aux exigences relatives à la communication spécifiées dans l'IEC 61400-25 (toutes les parties).Cette édition inclut les modifications techniques majeures suivantes par rapport à l'édition précédente:<br/>
    - harmonisation avec la structure et les cas d'essai de l'IEC 61850-10:2012;<br/>
    - réduction du chevauchement entre les normes et simplification par augmentation des références à la série de normes IEC 61850;
