  content: IEC 61337-2:2004-07(en-fr) attire l'attention sur certains des aspects les plus importants qu'il convient qu'un utilisateur prenne en compte avant de passer commande pour des filtres utilisant des résonateurs diélectriques à modes guidés. Il est limité aux filtres utilisant des résonateurs diélectriques à modes guidés utilisés pour des applications hyperfréquences telles que les téléphones portables, les stations de base cellulaires et les liaisons radio.
