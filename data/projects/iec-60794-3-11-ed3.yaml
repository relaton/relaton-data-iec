abstract:
- language: en
  script: Latn
  content: |-
    IEC 60794-3-11:2026 sets forth detailed requirements and characteristics specific to this type of optical fibre cables for duct, direct buried, and lashed installation.<br/>
    This document includes functional, mechanical, environmental and optical requirements, recommended features and test methods for assessing the product against the stated requirements.<br/>
    The specified test methods, where applicable, are those referenced in IEC 60794-1-1 and IEC 60794-1-2.<br/>
    The requirements of this document supplement those of the sectional specification IEC 60794‑3 and the family specification IEC 60794-3-10.<br/>
    This edition includes the following significant technical changes with respect to the previous edition:<br/>
    a) subclause 5.2.2 has been enlarged to include fibre type B-657.B2;<br/>
    b) this document has been updated to include multimode optical fibres.
- language: fr
  script: Latn
  content: |-
    L’IEC 60794-3-11 établit les exigences détaillées et les caractéristiques spécifiques à ce type de câbles à fibres optiques, destinés à être installés dans des conduites, directement enterrés et en aériens ligaturés.<br/>
    Le présent document comprend des exigences fonctionnelles mécaniques, environnementales et optiques, des caractéristiques recommandées et des méthodes d’essai pour l’évaluation des produits par rapport aux exigences établies.<br/>
    Les méthodes d’essai spécifiées, si applicables, sont celles référencées dans l’IEC 60794‑1‑1 et l’IEC 60794‑1‑2.<br/>
    Les exigences du présent document complètent celles de la spécification intermédiaire IEC 60794‑3 et de la spécification de famille IEC 60794‑3‑10.<br/>
    Cette édition inclut les modifications techniques majeures suivantes par rapport à l’édition précédente:<br/>
    a) le paragraphe 5.2.2 a été complété pour inclure le type de fibre B-657.B2;<br/>
    b) le présent document a été mis à jour pour inclure les fibres optiques multimodales.
