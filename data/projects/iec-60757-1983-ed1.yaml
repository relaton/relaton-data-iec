abstract:
- language: en
  script: Latn
  content: |-
    Applies to the text of descriptions, drawings, markings, etc., in the electrotechnical field and lays down a letter code for the designation of some distinct colour.

    Has the status of a basic safety publication in accordance with IEC Guide 104.
- language: fr
  script: Latn
  content: |-
    S'applique aux textes de descriptions, schémas, marquages, etc., utilisés en électrotechnique et établit un code littéral pour la désignation de quelques couleurs distinctes.

    A le statut d'une publication fondamentale de sécurité conformément au Guide 104.
