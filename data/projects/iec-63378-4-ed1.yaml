abstract:
- language: en
  script: Latn
  content: |-
    IEC 63378-4:2026 defines thermal evaluation board specifications for fine pitch semiconductor packages.<br/>
    Fine pitch is defined as 0,8 mm or less solder pitch for both ball grid array (BGA) and land grid array (LGA) and 0,5 mm or less solder pitch for QFP.<br/>
    Semiconductor packages are mounted on this thermal evaluation board using solder and then thermal resistance and thermal parameter of the packages are measured.<br/>
    The obtained thermal resistance and thermal parameter are listed in the datasheets of semiconductor packages.
- language: fr
  script: Latn
  content: |-
    L’IEC 63378-4:2026 définit les spécifications de la carte d’évaluation thermique pour les boîtiers de semiconducteurs à pas fin.<br/>
    Le pas fin est défini comme étant un pas de brasage inférieur ou égal à 0,8 mm pour les boîtiers matriciels à billes (BGA, Ball Grid Array) et boîtiers matriciels à zone de contact plate (LGA, Land Grid Array) et inférieur ou égal à 0,5 mm pour les boîtiers QFP.<br/>
    Les boîtiers de semiconducteurs sont montés sur cette carte d’évaluation thermique par brasage, puis la résistance thermique et le paramètre thermique des boîtiers sont mesurés.<br/>
    La résistance thermique et le paramètre thermique obtenus sont énumérés dans les fiches techniques des boîtiers de semiconducteurs.
