abstract:
- language: en
  script: Latn
  content: |-
    It applies to the sub-family of pushbutton switches within the
    family of electromechanical switches of assessed quality. Its
    object is to:

    a)prescribe preferred ratings and characteristics;

    b)select the appropriate quality assessment procedures and test
    methods from IEC 61020-1;

    c)prescribe the general performance requirements for pushbutton
    switches.


    This publication supersedes IEC 60341-1, 60341-1A, 60341-2, 60341-3.
- language: fr
  script: Latn
  content: |-
    Elle s'applique à la sous-famille des interrupteurs à
    bouton-poussoir dans la famille des interrupteurs électromécaniques
    sous assurance de qualité.
    A pour objet de:
    a) prescrire les valeurs assignées préférentielles et les
    caractéristiques;
    b) sélectionner les méthodes appropriées pour l'assurance de la
    qualité ainsi que les méthodes d'essais à partir de la CEI 61020-1;
    c) prescrire les exigences générales de fonctionnement pour les
    interrupteurs à bouton-poussoir.

    Cette publication remplace les CEI 60341-1, 60341-A, 60341-2, 60341-3.
