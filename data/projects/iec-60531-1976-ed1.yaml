  script: Latn
  content: S'applique aux appareils de chauffage électrique à accumulation principalement prévus pour chauffer la pièce dans laquelle ils sont situés. Enumère et définit les principales caractéristiques d'aptitude à la fonction intéressant l'utilisateur et décrit les méthodes normalisées pour la vérification de ces caractéristiques.
