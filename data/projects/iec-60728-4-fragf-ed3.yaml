abstract:
- language: fr
  script: Latn
  content: |-
    La CEI 60728-4:2007 s'applique aux prises d'usager, aux répartiteurs et aux dérivateurs, ainsi qu'aux matériels passifs à une et à plusieurs bornes comprenant des filtres, des atténuateurs, des égalisateurs, des isolateurs galvaniques, des injecteurs d'alimentation, des jonctions de câbles, des résistances de bouclage et des points de livraison, mais ne s'applique pas aux câbles coaxiaux et aux cordons de raccordement. La présente norme:<br/>
    - couvre la gamme de fréquences de 5 MHz à 3 000 MHz;<br/>
    - identifie les exigences de performance pour certains paramètres;<br/>
    - énonce les exigences de publication des données pour certains paramètres;<br/>
    - stipule des méthodes de mesure;<br/>
    - introduit des exigences minimales définissant les classes de qualité. Cette troisième édition annule et remplace la deuxième édition parue en 2000, dont elle constitue une révision technique. Elle contient les modifications techniques significatives suivantes: Le paragraphe 3.1 comporte plusieurs définitions nouvelles ou modifiées. L'Article 4 comporte des méthodes d'essai supplémentaires pour l'atténuation, le découplage, l'atténuation de passage, la variation de temps de propagation de groupe, la réponse amplitude-fréquence et deux mesures d'intermodulation de porteuse pour les produits du deuxième et du troisième ordre. L'Article 5 comporte des exigences de performance nouvelles et mises à jour.
