abstract:
- language: en
  script: Latn
  content: |-
    IEC 60512-11-14:2003 defines a standard test method to assess the effects of controlled corrosion in industrial atmospheres, in a specified concentration of polluted gas(es). It is used for testing of connectors for electronic equipment. This test may also be used for similar components when specified in a detail specification.<br/>
    <br/>
    This standard is to be read in conjunction with IEC 60512-1:2001 and IEC 60512-1-100:2006.
- language: fr
  script: Latn
  content: |-
    La CEI 60512-11-14:2003 Définit une méthode d'essai normalisée pour évaluer les effets de la corrosion contrôlée dans des atmosphères industrielles, en une concentration spécifiée de gaz pollués. Est utilisée pour les essais des connecteurs pour équipements électroniques, mais peut aussi être utilisé sur des composants similaires lorsqu'une spécification particulière l'exige.<br/>
    <br/>
    Cette publication doit être lue conjointement avec IEC 60512-1:2001 et IEC 60512-1-100:2006.
