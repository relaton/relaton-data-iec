  script: Latn
  content: IEC 60050-741:2020 provides a definition of Internet of Things along with related terms and definitions. It has the status of a horizontal standard in accordance with IEC Guide 108:2006. This terminology is consistent with the terminology developed in the other specialized parts of the IEV.
