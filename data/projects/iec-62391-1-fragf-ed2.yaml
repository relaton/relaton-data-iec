abstract:
- language: en
  script: Latn
  content: |-
    IEC 62391-1:2015(E) is available as IEC 62391-1:2015 RLV which contains the International Standard and its Redline version, showing all changes of the technical content compared to the previous edition.<br/>
    <br/>
    IEC 62391-1:2015 applies to fixed electric double-layer capacitors (hereafter referred to as capacitor(s)) mainly used in d.c. circuits of electric and electronic equipment. This part of IEC 62391 establishes standard terms, inspection procedures and methods of test for use in sectional and detail specifications of electronic components for quality assessment or any other purpose. This edition includes the following significant technical changes with respect to the previous edition:<br/>
    a) enhancement of the scope to include electric (high power) application;<br/>
    b) implementation of Annex Q, replacing Clause 3 in the first edition;<br/>
    c) in addition, minor revisions related to tables, figures and references.<br/>
    The contents of the corrigendum of December 2016 have been included in this copy.
- language: fr
  script: Latn
  content: |-
    <p class="PARAGRAPH">
    	L'IEC 62391-1:2015 s'applique aux condensateurs électriques fixes à double couche (appelés ci-après condensateurs) principalement utilisés dans des circuits à courant continu d'équipements électriques et électroniques. La présente partie de l'IEC 62391 définit les termes normalisés, les procédures de contrôle et les méthodes d’essai utilisés dans les spécifications intermédiaires et particulières des composants électroniques dans le cadre de l’assurance de la qualité, ainsi qu’à d’autres fins.<br/>
    	La présente édition inclut les modifications techniques majeures suivantes par rapport à l'édition précédente:<br/>
    	a)   renforcement du domaine d'application pour inclure des applications électriques (haute puissance);<br/>
    	b)   mise en œuvre de l’Annexe Qqui remplace l’Article 3 de la première édition;<br/>
    	c)   en plus, des révisions mineures des tableaux, valeurs et références.<br/>
    	 </p>
