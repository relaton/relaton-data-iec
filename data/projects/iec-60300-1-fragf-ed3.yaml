abstract:
- language: fr
  script: Latn
  content: |-
    L'IEC 60300-1:2014 La présente partie de l'IEC 60300 établit un cadre pour la gestion de la sûreté de fonctionnement. Elle donne des lignes directrices sur la gestion de la sûreté de fonctionnement des produits, des systèmes, des processus ou des services impliquant des aspects matériels, logiciels et humains ou toute combinaison intégrant ces éléments. Elle présente des lignes directrices sur la planification et la mise en oeuvre des activités de sûreté de fonctionnement et des processus techniques tout au long du cycle de vie, en prenant en compte les autres exigences telles que celles relatives à la sécurité et à l'environnement. La présente norme donne des lignes directrices qui aident les directeurs et leur personnel technique à optimiser la sûreté de fonctionnement. Cette troisième édition annule et remplace la deuxième édition parue en 2003. Cette édition constitue une révision technique. Cette édition inclut les modifications techniques majeures suivantes par rapport à l'édition précédente:<br/>
    - des définitions actualisées selon la toute dernière version du IEC 60050-191:2014;<br/>
    - une meilleure description de la sûreté de fonctionnement et de ses attributs;<br/>
    - une approche plus générique de la gestion de la sûreté de fonctionnement;<br/>
    - des lignes directrices révisées pour l'application de la gestion de la sûreté de fonctionnement;<br/>
    - une approche plus générique du cycle de vie;<br/>
    - un cadre pour les normes de sûreté de fonctionnement.
    Mots clés: gestion de la sûreté de fonctionnement
