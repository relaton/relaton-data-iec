abstract:
- language: en
  script: Latn
  content: |-
    This part of IEC 60079 contains the specific requirements for the design, selection and erection of electrical installations in explosive gas atmospheres. 
    These requirements are in addition to the requirements for installations in non-hazardous areas. 
    This standard applies to all electrical equipment and installations in hazardous areas whether permanent, temporary, portable, transportable or hand-held. 
    It applies to installations at all voltages. 
    This standard does not apply to 
    - electrical installations in mines susceptible to firedamp; 
    - electrical installations in areas where the hazard is due to combustible dusts or fibres; 
    - inherently explosive situations, for example explosives manufacturing and processing; 
    - rooms used for medical purposes.
- language: fr
  script: Latn
  content: |-
    Contient les règles particulières de conception, de sélec-tion et de montage applicables aux installations électriques situées dans des atmosphères explosives gazeuses.
    Ces règles complètent celles relatives aux installations dans les emplacements non dangereux.
    La présente norme s'applique à tous les équipements et à toutes les installations électriques situés dans des emplacements dangereux, que ces installations soient permanentes, tempo-raires, portables, déplaçables ou portatives.
    La présente norme s'applique à toutes les installations, quelle que soit la tension utilisée. 
    La présente norme ne s'applique pas aux
    - installations électriques situées dans des mines grisouteuses;
    - installations électriques situées dans des emplacements dans lesquels le danger est dû à des poussières ou à des fibres inflammables;
    - situations intrinsèquement explosives, par exemple, fabrication et traitement d'explosifs;
    - salles utilisées à des fins médicales.
