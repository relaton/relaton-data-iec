abstract:
- language: fr
  script: Latn
  content: |-
    L'IEC 60320-1:2015 établit les exigences générales applicables aux connecteurs bipolaires et bipolaires avec contact de mise à la terre et destinés au raccordement au réseau d'alimentation des dispositifs électriques pour usages domestiques et assimilés. La présente partie de l'IEC 60320 est également valable pour les socles de connecteurs/socles femelles de connecteurs intégrés ou incorporés dans des appareils d'utilisation. La tension assignée ne dépasse pas 250 V (courant alternatif) et le courant assigné ne dépasse pas 16 A. Cette troisième édition annule et remplace la deuxième édition parue en 2001 et l'Amendement 1:2007. Cette édition constitue une révision technique. Cette édition inclut les modifications techniques majeures suivantes par rapport à l'édition précédente:<br/>
    a) Feuilles de norme déplacées de l'IEC 60320-1 dans l'IEC 60320-3.<br/>
    b) Clarification des exigences relatives aux connecteurs non normalisés.<br/>
    La présente version bilingue (2016-11) correspond à la version anglaise monolingue publiée en 2015-06. La version française de cette norme n'a pas été soumise au vote.
