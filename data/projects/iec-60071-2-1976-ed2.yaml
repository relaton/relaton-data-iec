  script: Latn
  content: Constitue un guide pour le choix de la tenue diélectrique des matériels, des parafoudres ou éclateurs de protection et de la mesure dans laquelle il apparaît utile de limiter les surtensions de manoeuvre, en indiquant dans quelle direction doivent être recherchées les solutions rationnelles et économiquement justifiables.
