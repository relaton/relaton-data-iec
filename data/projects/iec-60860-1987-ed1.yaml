abstract:
- language: en
  script: Latn
  content: Applies to equipment intended to detect ionizing radiation from, and provide warning of, a criticality accident. Specifies the general characteristics, operating characteristics, electrical, mechanical, safety and environmental characteristics, test procedures and documentation.
- language: fr
  script: Latn
  content: S'applique aux équipements destinés à la fois à la détection des rayonnements ionisants et au déclenchement de l'alarme lors des accidents de criticité. Définit les caractéristiques générales, les caractéristiques de fonctionnement, les caractéristiques électriques et mécaniques, les caractéristiques relatives à la sécurité et à l'environnement, les procédures d'essais et la documentation.
