abstract:
- language: en
  script: Latn
  content: |-
    IEC TS 63117:2021(E) specifies the safety requirements of lighting systems at the system level, applicable when designing a lighting system.<br/>
    A lighting system comprises a set of products. Safety requirements of the products are not covered in this document, but specified in product safety standards.<br/>
    NOTE For emergency lighting systems, national or regional regulations provide relevant information that can be firstly consulted.<br/>
    This document specifies safety requirements for lighting systems based on specific networks.<br/>
    This document does not cover cyber-security and information security of lighting systems.<br/>
    This document does not apply to lighting systems to be installed in potential explosive atmospheres which are under the scope of IEC TC 31.<br/>
    For lighting systems based on an information and communication technology (ICT) network, refer to IEC 62949. For lighting systems based on a home and building electronic system and building automation and control system (HBES/BACS) network, refer to IEC 63044-3.
