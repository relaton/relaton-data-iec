abstract:
- language: fr
  script: Latn
  content: |-
    La CEI 60335-2-2:2009 traite de la sécurité des aspirateurs et des appareils de nettoyage à aspiration d'eau électriques pour usages domestiques et analogues, y compris les aspirateurs pour les soins des animaux, dont la tension assignée n'est pas supérieure à 250 V. Elle s'applique également aux aspirateurs à unité centrale d'aspiration et aux aspirateurs automatiques alimentés par batteries. La présente norme s'applique aussi aux têtes de nettoyage motorisées et aux flexibles conducteurs associés à un aspirateur donné. Par rapport à la cinquième édition de la CEI 60335-2-2, les principales modifications indiquées ci-après ont été apportées dans la présente édition: le texte est aligné sur la CEI 60335-1:2001, et ses Amendements 1 et 2. L'attention des Comités Nationaux est attirée sur le fait que les fabricants d'appareils et les organismes d'essai peuvent avoir besoin d'une période transitoire après la publication d'une nouvelle publication CEI, ou d'une publication amendée ou révisée, pour fabriquer des produits conformes aux nouvelles exigences et pour adapter leurs équipements aux nouveaux essais ou aux essais révisés. Le comité recommande que le contenu de cette publication soit entériné au niveau national au plus tôt 12 mois et au plus tard 36 mois après la date de publication. La présente partie 2 doit être utilisée conjointement avec la dernière édition de la CEI 60335-1.
    Mots-clés: appareils de nettoyage, aspiration d'eau, aspirateurs
