  script: Latn
  content: Applicable aux tubes à plusieurs électrodes à l'exception des tubes à rayons cathodiques. Donne la méthode utilisée pour numéroter les électrodes de même type des tubes à plusieurs électrodes et pour désigner les sections des tubes à plusieurs sections.
