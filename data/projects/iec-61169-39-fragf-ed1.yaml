abstract:
- language: fr
  script: Latn
  content: La CEI 61169-39:2009 est une spécification intermédiaire. Elle fournit des informations et des règles en vue de l'établissement de spécifications particulières de connecteurs RF à verrouillage rapide de la série CQM, ainsi que de la spécification particulière cadre pro forma. Elle prescrit également les dimensions de l'interface d'accouplement pour des connecteurs d'usage général, les détails dimensionnels des connecteurs d'essai normalisés de classe 0, des informations de calibrage et des essais choisis dans la CEI 61169-1, applicables à toutes les spécifications particulières ayant trait aux connecteurs de la série CQM. La présente spécification indique les caractéristiques de performance recommandées à prendre en compte pour la rédaction d'une spécification particulière, et elle couvre les programmes d'essais et les exigences de contrôle pour les niveaux d'assurance qualité M et H. La présente version bilingue, publiée en 2011-04, correspond à la version anglaise. La version française de cette norme n'a pas été soumise au vote.
