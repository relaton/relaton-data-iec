abstract:
- language: en
  script: Latn
  content: |-
    IEC/TR 62856:2013 describes features for existing design languages, as well as for enhancing and newly developing design languages belonging to the defined design processes of System on a chip (SoC) which ranges from system level design, SoC design implementation and verification, IP block creation and analog block design down to interface data preparation for manufacturing. Thirty-three design languages have been chosen and each feature of their latest version as of March 2011 is reflected in this report:<br/>
    UML, Esterel, Rosetta, SystemC, SystemC-AMS, IBIS, CITI, TouchStone, BSDL, System Verilog, VHDL, Verilog HDL, UPF, CPF, e language, PSL, FSDB, SDC, DEF, Open Access, SDF, GDS II, OASIS, STIL, WGL, Verilog-A, Verilog-AMS, SPICE, VHDL-AMS, LEF, Liberty, CDL and IP-XACT.
- language: fr
  script: Latn
  content: |-
    La CEI/TR 62856:2013 décrit des caractéristiques pour des langages de conception existants, ainsi que pour améliorer et renouveler des langages de conception qui appartiennent aux processus de conception définis du Système sur puce (SoC) allant de la conception au niveau système, de la mise en oeuvre et de la vérification SoC, de la création de bloc IP et de la conception de bloc analogique jusqu'à la préparation des données d'interface pour la fabrication. Trente-trois langages de conception sont choisis et la dernière version de chaque langage est reprise dans le présent rapport, à la date de mars 2011:<br/>
    UML, Esterel, Rosetta, SystemC, SystemC-AMS, IBIS, CITI, TouchStone, BSDL, System Verilog, VHDL, Verilog HDL, UPF, CPF, e language, PSL, FSDB, SDC, DEF, Open Access, SDF, GDS II, OASIS, STIL, WGL, Verilog-A, Verilog-AMS, SPICE, VHDL-AMS, LEF, Liberty, CDL et IP-XACT.
