abstract:
- language: en
  script: Latn
  content: |-
    IEC 61400-12-6:2022 specifies a procedure for measuring the nacelle transfer function of a single electricity-producing, horizontal axis wind turbine, which is not considered to be a small wind turbine in accordance with IEC 61400-2. It is expected that this document be used when a valid nacelle transfer function is needed to execute a power performance measurement according to IEC 61400-12-2. This document specifies how to characterise a wind turbine's nacelle transfer function. The nacelle transfer function is determined by collecting simultaneous measurements of nacelle‑measured wind speed and free stream wind speed (as measured on a meteorological mast) for a period that is long enough to establish a statistically significant database over a range of wind speeds and under varying wind and atmospheric conditions. The procedure also provides guidance on determination of measurement uncertainty including assessment of uncertainty sources and recommendations for combining them.<br/>
    This first edition of IEC 61400-12-6 is part of a structural revision that cancels and replaces the performance standards IEC 61400-12-1:2017 and IEC 61400-12-2:2013. The structural revision contains no technical changes with respect to IEC 61400-12-1:2017 and IEC 61400‑12‑2:2013, but the parts that relate to wind measurements, measurement of site calibration and assessment of obstacle and terrain have been extracted into separate standards.
- language: fr
  script: Latn
  content: |-
    IEC 61400-12-6:2022 spécifie une procédure de mesure de la fonction de transfert de la nacelle d’une éolienne simple de production d’électricité à axe horizontal, qui n’est pas considérée comme un petit aérogénérateur selon l’IEC 61400-2. Il est attendu que le présent document soit utilisé lorsqu’il est nécessaire d'employer une fonction de transfert de la nacelle valide pour mesurer la performance de puissance conformément à l’IEC 61400-12-2. Le présent document décrit la façon de déterminer la fonction de transfert de la nacelle d’une éolienne. La fonction de transfert de la nacelle est déterminée en collectant simultanément des valeurs de mesure de la vitesse du vent mesurée à la nacelle et de la vitesse du vent en écoulement libre (mesurée sur un mât météorologique) pendant une période suffisamment longue pour créer une base de données statistiquement significative sur une certaine plage de vitesses du vent et dans des conditions de vent et des conditions atmosphériques variables. Cette procédure fournit également des recommandations relatives à la détermination de l’incertitude de mesure, incluant l’évaluation des sources d’incertitude et des recommandations qui permettent de les combiner.<br/>
    La présente première édition de l’IEC 61400-12-6 fait partie d'une révision structurelle qui annule et remplace les normes de performance IEC 61400-12-1:2017 et IEC 61400-12-2:2013. Cette révision structurelle ne contient aucune modification technique par rapport à l'IEC 61400‑12‑1:2017 et l'IEC 61400-12‑2:2013. Toutefois, les parties relatives aux mesurages du vent, au mesurage de l'étalonnage du site et à l'évaluation des obstacles et du terrain ont été extraites vers des normes distinctes.
