abstract:
- language: en
  script: Latn
  content: |-
    a. This technical specification specifies the requirements of basic technical conditions, test, startup procedure, and emergency handling for black start of hydropower plant.<br/>
    b. This document defines the technical requirements of hydraulic generator, hydraulic turbine regulating system, excitation system, relay protection, control system, computer monitoring system, DC system, auxiliary equipment, communication equipment, working gate and main valve of water inlet of turbine for two black starts modes.<br/>
    c. This document gives guidelines for black start test in terms of equipment system test, black start power test, phase test, overall test, and black start mode identification.<br/>
    d. This technical specification is applicable to hydropower plant with black start capabilities. However, it does not apply to plants without black start capability. Hydraulic structures, such as dams and reservoirs, and transformers, switchgears are not included.
