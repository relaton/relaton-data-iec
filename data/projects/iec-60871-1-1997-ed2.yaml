abstract:
- language: en
  script: Latn
  content: Applies to capacitor units and capacitor banks intended to be used in particular for power-factor correction of a.c. power systems having a rated voltage above 1000 V and a frequency of 15 Hz to 60 Hz.
- language: fr
  script: Latn
  content: |-
    S'applique aux condensateurs unitaires et aux batteries de
    condensateurs destinés en particulier à être utilisés pour corriger
    le facteur de puissance des réseaux à courant alternatif dont la
    tension assignée est supérieure à 1000 V et la fréquence comprise
    entre 15 et 60 Hz.
