abstract:
- language: en
  script: Latn
  content: |-
    IEC 63241-2-1:2024 supplements or modifies the corresponding clauses in IEC 63241-1, so as to convert it into the IEC Standard: Electric motor-operated tools - Dust measurement procedure - Particular requirements for hand-held core drills.<br/>
    Where a particular subclause of IEC 63241-1:2023 is not mentioned in this Part 2-1, that subclause applies as far as relevant. Where this standard states "addition", "modification" or "replacement", the relevant text in Part 1 is to be adapted accordingly.
- language: fr
  script: Latn
  content: |-
    IEC 63241-2-1:2024 complète ou modifie les articles correspondants de l'IEC 63241-1, de façon à transformer cette publication en norme IEC: Outils électroportatifs à moteur - Procédure de mesure de la poussière - Exigences particulières pour les foreuses portatives.<br/>
    Lorsqu'un paragraphe particulier de l’IEC 63241-1:2023 n'est pas mentionné dans cette Partie 2-1, ce paragraphe s'applique pour autant que cela soit pertinent. Lorsque la présente norme mentionne "addition", "modification" ou "remplacement", le texte correspondant de la Partie 1 doit être adapté en conséquence.
