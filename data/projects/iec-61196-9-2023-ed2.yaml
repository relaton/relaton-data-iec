abstract:
- language: en
  script: Latn
  content: |-
    IEC 61196-9:2023 specifies the materials and cable construction for RF flexible coaxial communication cables with solid or with semi-air-spaced dielectric, IEC type designation, identification, marking and labelling, standard rating and characteristics, requirements of finished cables, quality assessment, delivery and storage, etc.<br/>
    This document applies to RF flexible coaxial communication cables for use in mobile communication systems, microwave test equipment and other fields. It is read in conjunction with IEC 61196-1:2005.
