abstract:
- language: en
  script: Latn
  content: IEC 60794-1-136:2026 specifies procedures to determine the maximum allowable push force applied on cables during the installation by blowing. Currently this parameter is determined by a separate test on the cable before installation. The methods specified in this document apply primarily to low-diameter cables (microduct cables according to IEC 60794-5) without rigid strength elements (e.g. GRP rods).
- language: fr
  script: Latn
  content: L'IEC 60794-1-136:2026 spécifie des procédures pour déterminer la force de poussée maximale admissible appliquée sur les câbles lors de l'installation par soufflage. Actuellement, ce paramètre est déterminé par un essai séparé sur le câble avant l'installation. Les méthodes spécifiées dans le présent document s'appliquent principalement aux câbles de faible diamètre (câbles en microconduits conformément à l'IEC 60794-5) dépourvus d'éléments de résistance rigides (p. ex. tiges en PRV).
