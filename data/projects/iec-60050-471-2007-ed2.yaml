abstract:
- language: en
  script: Latn
  content: |-
    This part of IEC 60050 gives the general terminology used in insulators. This terminology is consistent with the terminology developed in the other specialized parts of the IEV.<br/>
    It has the status of a horizontal standard in accordance with IEC Guide 108.
