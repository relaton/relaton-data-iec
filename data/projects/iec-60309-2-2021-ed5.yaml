abstract:
- language: en
  script: Latn
  content: |-
    CORRECTED VERSION 2026-08<br/>
    <br/>
    IEC 60309-2:2021 applies to plugs, fixed or portable socket-outlets, and appliance inlets, hereinafter referred to as accessories, with a rated operating voltage not exceeding 1 000 V DC or 1 000 V AC with a frequency not exceeding 500 Hz and a rated current not exceeding 125 A, primarily intended for industrial use, either indoors or outdoors.<br/>
    This fifth edition cancels and replaces the fourth edition published in 1999, Amendment 1:2005 and Amendment 2:2012. This edition constitutes a technical revision.<br/>
    This edition includes the following significant technical changes with respect to the previous edition:<br/>
    addition of requirements and test for non-solid pins;<br/>
    additional rating IPX9;<br/>
    additional marking to indicate neutral terminal and/or earthing terminal.<br/>
    This document is to be read in conjunction with IEC 60309-1:2021.<br/>
    The content of the corrigendum 1 (2026-08) has been included in this copy.
- language: fr
  script: Latn
  content: |-
    VERSION CORRIGEE 2026-08<br/>
    <br/>
    L'IEC 60309-2:2021 s’applique aux fiches, socles fixes de prise de courant, prises mobiles et socles de connecteur, ci-après collectivement désignés par le terme "appareils", de tension nominale d’emploi ne dépassant pas 1 000 V en courant continu ou 1 000 V en courant alternatif, de fréquence ne dépassant pas 500 Hz, et de courant nominal ne dépassant pas 125 A, destinés essentiellement aux usages industriels, à l’intérieur ou à l’extérieur des bâtiments.<br/>
    Cette cinquième édition annule et remplace la quatrième édition parue en 1999, son Amendement 1:2005 et son Amendement 2:2012. Cette édition constitue une révision technique.<br/>
    Cette édition inclut les modifications techniques majeures suivantes par rapport à l’édition précédente:<br/>
    ajout d’exigences et d’un essai pour les broches non massives;<br/>
    ajout du degré de protection IPX9;<br/>
    marquage supplémentaire pour indiquer la borne du neutre et/ou la borne de terre.<br/>
    Le présent document est à lire conjointement avec l’IEC 60309-1:2021.<br/>
    Le contenu du corrigendum 1 (2026-08) a été pris en considération dans cet exemplaire.
