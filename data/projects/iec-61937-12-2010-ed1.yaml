- language: en
  script: Latn
  content: IEC 61937-12:2010 specifies the method for IEC 60958 to convey non-linear PCM bitstreams encoded in accordance with the DRA formats. This bilingual version, published in 2010-10, corresponds to the English version. The French version of this standard has not been voted upon.
- language: fr
  script: Latn
  content: La CEI 61937-12:2010 spécifie la méthode de la CEI 60958 pour acheminer des flux de bits MIC non linéaires codés selon les formats DRA. La présente version bilingue, publiée en 2010-10, correspond à la version anglaise. La version française de cette norme n'a pas été soumise au vote.
