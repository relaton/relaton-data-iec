abstract:
- language: en
  script: Latn
  content: Applies to all types of semiconductor convertors, i.e. d.c. to d.c. convertors without an a.c. link. If applicable, it may also be used for certain d.c. switches in control applications. Gives terminology and specifies service conditions, rated values, test programme and test methods.
- language: fr
  script: Latn
  content: S'applique à tous les types de convertisseurs à courant continu directs à semiconducteurs, c'est-à-dire aux convertisseurs continu-continu sans liaison à courant alternatif. Le cas échéant, elle peut aussi être utilisée pour certains commutateurs à courant continu dans les applications de commande. Donne une terminologie et spécifie les conditions de service, les valeurs nominales, le programme des essais et les méthodes d'essai.
