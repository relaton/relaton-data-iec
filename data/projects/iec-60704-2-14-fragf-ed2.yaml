abstract:
- language: fr
  script: Latn
  content: |-
    La CEI 60704-2-14:2013 spécifie les conditions de mesures afin de procurer une précision suffisante pour déterminer le bruit émis et comparer les résultats de mesures effectuées par différents laboratoires, tout en simulant, dans la mesure du possible, l'utilisation pratique de réfrigérateurs à usage ménager, conservateurs de denrées congelées et congélateurs. Il est recommandé de tenir compte de la détermination des niveaux de bruit dans le cadre d'une procédure d'essai exhaustive couvrant un grand nombre d'aspects des propriétés et des performances des réfrigérateurs à usage ménager, conservateurs de denrées congelées et congélateurs. Cette édition inclut les modifications techniques significatives suivantes par rapport à l'édition précédente:<br/>
    a) la description d'une enceinte d'essai appropriée a été supprimée de la présente partie de la CEI 60704 et a été incorporée dans la Partie 1 de la CEI 60704-1;<br/>
    b) les valeurs des écarts-types des niveaux de puissance acoustique déterminés selon la présente partie de la CEI 60704 ont été ajoutées.
