- language: fr
  script: Latn
  content: |-
    Détaille les prescriptions applicables aux luminaires fixes à usage
    général, à utiliser avec des lampes à filament de tungstène, des
    lampes tubulaires fluorescentes, et autres lampes à décharge, pour
    tensions d'alimentation ne dépassant pas 1 000 V.
