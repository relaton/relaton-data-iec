abstract:
- language: fr
  script: Latn
  content: 'La CEI 62002-2:2008 fournit les règles et les lignes directrices applicables aux essais de conformité des équipements construits pour satisfaire à la norme CEI 62002-1, accès radio mobile et portable en DVB-T/H. Elle vise notamment à limiter le nombre des essais à une valeur pratique. Il incombe néanmoins au fabricant de garantir que le terminal satisfait à tous les aspects de la spécification de l''accès radio mobile et portable en DVB-T/H (CEI 62002-1). Cette deuxième édition annule et remplace la première édition, parue en 2005. Elle constitue une révision technique. Les principales modifications par rapport à l''édition précédente sont: Le DVB-H a été intégré dans la spécification principale. Tous les chiffres décrivant les performances ont été révisés pour tenir compte des nouveaux résultats de simulation et du développement de nouveaux récepteurs de référence DVB-H. Le DVB-H inclut à présent l''ensemble des différents débits du code MPE-FEC. De nouveaux types de canaux de propagation "portable en intérieur" et "portable en extérieur" ont été ajoutés ainsi que les performances chiffrées avec ces canaux. Un nouveau canal d''essai SFN mobile 2x TU-6 a été inclus. Un nouveau type de linéarité L4 a été ajouté. De nouveaux chiffres décrivant les performances particulières du DVB-H pour les types d''interférences S1, S2, L1 à L4 ont été intégrés. Une nouvelle méthode de mesure des interférences GSM a été ajoutée. La présente version bilingue (2012-03) correspond à la version anglaise monolingue publiée en 2008-05.'
