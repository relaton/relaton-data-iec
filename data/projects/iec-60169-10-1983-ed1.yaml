abstract:
- language: en
  script: Latn
  content: 'Concerns patterns for r.f. coaxial connectors which may preferably be used with r.f. cables 96 IEC 60050-1 or 96 IEC 60050-2 of IEC 60096-2: Radio-frequency cables, Part 2: Relevant cable specifications. These connectors are for low power. They have a snap-on coupling mechanism and are commonly known as Type SMB.'
- language: fr
  script: Latn
  content: Concerne les modèles de connecteurs coaxiaux pour fréquences radioélectriques qui sont de préférence utilisés avec les câbles 96 IEC 60050-1 ou 96 IEC 60050-2 de la CEI 60096-2. Ces modèles de connecteurs sont pour de faibles puissances. Ils ont un accouplement par encliquetage et sont connus comme étant du type SMB.
