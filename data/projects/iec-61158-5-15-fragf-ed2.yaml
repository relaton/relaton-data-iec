abstract:
- language: en
  script: Latn
  content: |-
    IEC 61158-5-15:2010 is to define the services provided to<br/>
    a) the FAL user at the boundary between the user and the Application Layer of the Fieldbus Reference Model, and<br/>
    b) Systems Management at the boundary between the Application Layer and Systems Management of the Fieldbus Reference Model.<br/>
    This part of IEC 61158 specifies the structure and services of the Type 15 IEC fieldbus Application Layer, in conformance with the OSI Basic Reference Model (ISO/IEC 7498 1) and the OSI Application Layer Structure (ISO/IEC 9545).
- language: fr
  script: Latn
  content: |-
    L'IEC 61158-5-15:2010 vise à définir les services mis en place pour<br/>
    a) l’utilisateur de FAL à la frontière entre l’utilisateur et la Couche application du Modèle de référence de bus de terrain; et<br/>
    b) la Gestion des systèmes au niveau de la frontière entre la Couche application et la Gestion des systèmes selon le Modèle de référence de bus de terrain.<br/>
    La présente partie de l’IEC 61158 spécifie la structure et les services de la couche application de bus de terrain IEC type 15, en conformité au modèle de référence de base OSI (ISO/IEC 7498) et à la structure de couche application OSI (ISO/IEC 9545).
