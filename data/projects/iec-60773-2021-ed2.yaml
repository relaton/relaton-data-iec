abstract:
- language: en
  script: Latn
  content: |-
    IEC 60773:2021 applies to test methods for the measurement of the operational characteristics of brushes designed to operate on commutating and slip ring machines under specified test conditions. By extension some tests may be relevant for other kinds of sliding electrical contacts for electrical appliances.<br/>
    This second edition cancels and replaces the first edition published in 1983. This edition includes the following significant technical changes with respect to the previous edition:<br/>
    - the clause structure has been modified on the view point of a laboratory testing procedure. The new sequence is as follows: test rig specification, general testing procedure, and specific procedure for each operational characteristic<br/>
    - a new clause has been added to introduce the black-band test for the characterisation of the brush grades for DC machines.
- language: fr
  script: Latn
  content: |-
    IEC 60773:2021 s'applique aux méthodes d'essai pour le mesurage des caractéristiques opérationnelles des balais conçus pour fonctionner sur des machines avec commutation et sur des machines à bagues, dans des conditions d'essai spécifiées. Par extension, certains essais peuvent être pertinents pour d’autres types de contacts électriques glissants pour appareils électriques.<br/>
    Cette deuxième édition annule et remplace la première édition parue en 1983. Cette édition inclut les modifications techniques majeures suivantes par rapport à l'édition précédente:<br/>
    - La structure des articles a été modifiée du point de vue d’une procédure d’essai en laboratoire. La nouvelle séquence est la suivante: spécification du banc d’essai , procédure générale d’essai, et procédure spécifique relative à chaque caractéristique opérationnelle.<br/>
    - Un nouvel article a été ajouté pour présenter l’essai de bande noire pour la caractérisation des nuances de balais pour machines à courant continu.
