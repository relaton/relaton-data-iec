abstract:
- language: en
  script: Latn
  content: Specifies procedures for applying and preparing compliance test plans for success ratio or failure ratio. The procedures are based on the assumption that each trial is statistically independent. Supersedes IEC 605-5 and its amendment 1.
- language: fr
  script: Latn
  content: Spécifie des procédures pour l'application et la préparation de plans d'essai de conformité concernant la proportion de succès ou la proportion de défaillance. Les procédures se basent sur l'hypothèse que chaque essai est statistiquement indépendant. Remplace la CEI 605-5 et sa Modification n° 1.
