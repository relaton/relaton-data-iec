  content: IEC TS 62735-1:2015(E) applies to plugs and fixed socket-outlets for class I equipment with two active contacts plus an earthing contact, a rated power of 2,6 kW and a rated voltage range from 294 V to 400 V d.c. They are intended to power d.c. information and communication technology equipment only, products according to IEC 60950.
