abstract:
- language: fr
  script: Latn
  content: L'IEC 61968-8:2015 spécifie le contenu d'informations d'un ensemble de types de messages qui peuvent être utilisés pour prendre en charge de nombreuses fonctions métier relatives à l'assistance à la clientèle. La demande de service, l'accord client et la gestion d'incidents constituent des utilisations typiques des types de messages. L'objectif de la présente partie de l'IEC 61968 est de définir une norme pour l'intégration de l'assistance à la clientèle (CS) qui inclurait des composants liés au service à la clientèle, à la gestion des incidents et aux points de vente, ces composants étant intégrés à d'autres systèmes et fonctions métier dans le domaine d'application de l'IEC 61968. Le domaine d'application de la présente norme est l'échange d'informations entre un système d'assistance à la clientèle et d'autres systèmes au sein de l'entreprise de distribution.
