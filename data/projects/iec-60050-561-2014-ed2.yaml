abstract:
- language: en
  script: Latn
  content: |-
    IEC 60050-561:2014 gives the terms and definitions for piezoelectric and dielectric devices representing the present state-of-the-art. This new edition reviews and complements the previous one. This terminology is consistent with the terminology developed in the other specialized parts of the IEV.<br/>
    It has the status of a horizontal standard in accordance with IEC Guide 108.
- language: fr
  script: Latn
  content: |-
    IEC 60050-561:2014 donne les termes et définitions relatifs aux dispositifs piézoélectriques et diélectriques correspondant à l état actuel de la technologie. Cette nouvelle édition révise et complète la précédente. Cette terminologie est en accord avec la terminologie figurant dans les autres parties spécialisées de l'IEV.<br/>
    Elle a le statut de norme horizontale conformément au Guide IEC 108.
