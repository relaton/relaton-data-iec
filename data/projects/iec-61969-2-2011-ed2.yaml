abstract:
- language: en
  script: Latn
  content: 'IEC 61696-2:2011 applies to the design of enclosures for outdoor applications for stationary use at non-weatherprotected locations as defined in IEC 61969-1 Ed.2.0. The internal and external coordination dimensions are derived from IEC 60917-2. The internal dimensions meet the mounting dimensions of subracks in accordance with IEC 60917-2-2 and IEC 60297-3. The external dimensions, compared to IEC 60917-2, are partly increased in order to meet the design requirements of the outdoor specific conditions. This second edition cancels and replaces the first edition issued in 2000. It constitutes a technical revision. The main technical changes with regard to the previous edition are as follows: It was the intention when IEC 61969-2 Ed 1.0 was created that a sectional standard is to be followed by a detail standard, consisting of IEC 61969-2-1 and IEC 61969-2-2. The intention of detail standards was to create a recommended but cost-effective range of outdoor enclosure solutions offered from multiple vendors. However, it became evident that the outdoor enclosure applications were extremely application specific and the intended effect became irrelevant. Consequently, IEC 61969-2-1 and IEC 61969-2-2 became obsolete and will be withdrawn at the time when IEC 61969-2 Ed.2.0 is published. To provide for a useful outdoor enclosure installation matrix IEC 61969-2 Ed.2.0 focuses on overall outdoor enclosure co-ordination dimension only.'
- language: fr
  script: Latn
  content: 'La CEI 61969-2:2011 s''applique à la conception des enveloppes pour des applications extérieures, pour une utilisation à poste fixe dans les lieux exposés aux intempéries tels que définis dans la CEI 61969-1 Éd.2.0. Les dimensions de coordination intérieures et extérieures sont tirées de la CEI 60917-2. Les dimensions intérieures correspondent aux dimensions de montage des bacs à cartes, selon la CEI 60917-2-2 et la CEI 60297-3. Les dimensions extérieures ont été partiellement augmentées par rapport à la CEI 60917-2 pour tenir compte des contraintes liées aux conditions spécifiques du plein air. Cette deuxième édition annule et remplace la première édition, parue en 2000, dont elle constitue une révision technique. Les principaux changements techniques par rapport à l''édition précédente sont les suivants: Lors de l''élaboration de la CEI 61969-2 Éd. 1.0 l''objectif était qu''une norme intermédiaire soit suivie d''une norme particulière, constituée par la CEI 61969-2-1 et la CEI 61969-2-2. L''objet des normes particulières était de créer une gamme recommandée mais rentable de solutions d''enveloppes de plein air proposées par de nombreux fournisseurs. Toutefois, il est devenu évident que les utilisations des enveloppes de plein air étaient d''application très spécifique et l''effet visé devenu non pertinent. En conséquence, la CEI 61969-2-1 et la CEI 61969-2-2 étant devenues obsolètes, elles seront supprimées au moment de la publication de la CEI 61969-2 Éd.2.0. En vue de prévoir une matrice d''installation des enveloppes de plein air utile, la CEI 61969-2 Éd. 2.0 porte uniquement sur les dimensions hors-tout de coordination des enveloppes de plein air.'
