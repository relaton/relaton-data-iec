abstract:
- language: fr
  script: Latn
  content: |-
    L'IEC 61823:2002 spécifie les caractéristiques des transformateurs série utilisés pour le balisage aéronautique au sol (AGLST) pour des circuits série de 6,6 A, dont la tension de service atteint 5 kV, alimentés par des régulateurs de courant constant jusqu'à 30 kVA.
    Les transformateurs série AGL assurent l'alimentation des feux aéronautiques de balisage ou d'autres charges (résistives) à partir de leurs circuits secondaires. Les transformateurs série AGL assurent la continuité du circuit série en cas de perte de charge sur le transformateur, et l'isolation électrique entre le circuit primaire alimenté par un régulateur de courant constant et le circuit secondaire connecté à la charge dans des conditions définies dans la présente Norme. La présente version bilingue (2016-11) correspond à la version anglaise monolingue publiée en 2002-12.
