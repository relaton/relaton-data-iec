abstract:
- language: en
  script: Latn
  content: IEC 61169-11:2007 It is a Sectional Specification (SS), provides information and rules for the preparation of Detail Specifications (DS) for type STWX8 R.F. coaxial connectors with push-pull self-lock coupling. It describes the interface dimensions for general purpose grade 2 connectors, dimensional details for standard test connectors, grade 0, together with gauging information and the mandatory tests selected from QC 220000 (IEC 61169-1), applicable to all DS relating to type STWX8 connectors.
- language: fr
  script: Latn
  content: L'IEC 61169-37:2007 est une spécification intermédiaire qui fournit des informations et des règles pour la préparation des spécifications particulières pour les connecteurs coaxiaux pour fréquences radioélectriques de série STWX8 avec accouplement autobloquant push-pull.
