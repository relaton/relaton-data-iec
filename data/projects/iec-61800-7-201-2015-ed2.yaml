abstract:
- language: en
  script: Latn
  content: |-
    IEC 61800-7-201:2015 specifies profile type 1 for power drive systems (PDS). Profile type 1 can be mapped onto different network technologies. This edition includes the following significant technical changes with respect to the previous edition:<br/>
    - Updates, clarifications and enhancements.
- language: fr
  script: Latn
  content: |-
    L'IEC 61800-7-201:2015 spécifie le type de profil 1 pour les entraînements électriques de puissance (PDS). Le type de profil 1 peut être mis en correspondance avec différentes technologies de réseau de communication. Cette édition inclut les modifications techniques majeures suivantes par rapport à l'édition précédente:<br/>
    - Mises à jour, clarifications et améliorations.
