abstract:
- language: en
  script: Latn
  content: |-
    IEC TS 60034-31:2021 provides a guideline of technical and economical aspects for the application of energy-efficient electric AC motors. It applies to motor manufacturers, OEMs (original equipment manufacturers), end users, regulators, legislators and other interested parties.<br/>
    This document is applicable to all electrical machines covered by IEC 60034-1, IEC 60034-30‑1 and IEC TS 60034-30-2.<br/>
    a. references to relevant standards have been updated;<br/>
    b. global market data for industrial motors have been updated;<br/>
    c. guidelines and theories about normal industrial applications have been described;<br/>
    d. energy efficiency comparison examples have been given.<br/>
    This publication contains an attached file titled, “TS 60034-31 Generic Efficiency Interpolation”, in the form of an XLS document.
