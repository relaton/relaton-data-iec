abstract:
- language: en
  script: Latn
  content: The application guide can be used to implement a maintainability programme covering the initiation, development and in-service phases of a product, which form part of the tasks in IEC 60300-2. It provides guidance on how the maintenance aspects of the tasks should be considered in order to achieve optimum maintainability. It uses other IEC standards, notably IEC 60706, as reference documents or tools as to how a task should be undertaken. This standard replaces Sections 1 and 3 of IEC 60706-1 (1982).
- language: fr
  script: Latn
  content: Ce guide d'application peut être utilisé pour mettre en oeuvre un programme de maintenabilité couvrant les phases de conception, développement et d'exploitation d'un produit (tâches décrites dans la CEI 60300-2). Elle indique comment il convient que les tâches de maintenance soient prises en considération pour optimiser la maintenabilité. Elle utilise d'autres normes, en particulier la CEI 60706, comme documents de référence ou comme outils pour fournir plus de détails sur la manière de réaliser les tâches. Cette norme remplace les sections 1 et 3 de la CEI 60706-1 (1982).
