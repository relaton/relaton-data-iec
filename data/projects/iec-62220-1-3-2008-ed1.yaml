abstract:
- language: en
  script: Latn
  content: IEC 62220-1-3:2008 specifies the method for the determination of the detective quantum efficiency (DQE) of digital X-ray imaging devices as a function of air kerma and of spatial frequency for the working conditions in the range of the medical application as specified by the manufacturer. The intended users of this part of IEC 62220 are manufacturers and well equipped test laboratories. This Part 1-3 is restricted to digital X-ray imaging devices that are used for dynamic imaging such as, but not exclusively, direct and indirect flat panel-detector based systems. It is not recommended to use this part of IEC 62220 for digital X-ray image intensifier-based systems.
- language: fr
  script: Latn
  content: La CEI 62220-1-3:2008 spécifie la méthode de la détermination de l'efficacité quantique de détection (EQD) des dispositifs d'imagerie numérique à rayonnement X en fonction du kerma dans l'air et de la fréquence spatiale pour les conditions de fonctionnement dans la gamme des applications médicales, suivant les spécifications du fabricant. Les utilisateurs prévus de la présente partie de la CEI 62220 sont les fabricants et les laboratoires d'essai bien équipés.La présente partie 1-3 se limite aux dispositifs d'imagerie numérique à rayonnement X qui sont utilisés pour l'imagerie dynamique telle que, mais pas exclusivement, des systèmes à base de détecteurs plans direct ou indirect. Il n'est pas recommandé d'utiliser cette partie de la CEI 62220 pour des systèmes basés sur un intensificateur d'image radiologique.
