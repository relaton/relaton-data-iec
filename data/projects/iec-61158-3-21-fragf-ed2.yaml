abstract:
- language: en
  script: Latn
  content: |-
    IEC 61158-3-21:2019 provides the common elements for basic time-critical messaging communications between devices in an automation environment. The term “time-critical” in this context means the prioritized full-duplex collision-free time-deterministic communication, of which one or more specified actions are required to be completed with some defined level of certainty. Failure to complete specified actions within the required time risks the failure of the applications requesting the actions, with attendant risk to equipment, plant, and possibly human life.<br/>
    This International Standard defines in an abstract way the externally visible service provided by the Type 21 data-link layer in terms of:<br/>
    a) the primitive actions and events of the service;<br/>
    b) the parameters associated with each primitive action and event, and the form that they take; and<br/>
    c) the interrelationships between these actions and events, and their valid sequences.
- language: fr
  script: Latn
  content: |-
    L’IEC 61158-3-21:2019 fournit les éléments communs pour les communications de messagerie de base à temps critique entre des dispositifs dans un environnement d'automation. Le terme "à temps critique" dans ce contexte signifie la communication hiérarchisée par priorité et déterministe dans le temps sans collision en duplex intégral, dont l'une ou plusieurs actions spécifiées sont tenues d'être parachevées avec un certain niveau défini de certitude. Le manquement à parachever les actions spécifiées dans les limites du délai requis risque d'entraîner la défaillance des applications qui demandent ces actions, avec le risque concomitant pour l'équipement, la centrale et éventuellement pour la vie humaine.<br/>
    La présente norme définit de manière abstraite le service visible de l'extérieur fourni par la couche liaison de données de type 21 en termes:<br/>
    a) des actions et événements primitifs du service;<br/>
    b) des paramètres associés à chaque action primitive et événement primitif, et la forme qu'ils prennent; et<br/>
    c) des interrelations entre ces actions et événements, et leurs séquences valides.
