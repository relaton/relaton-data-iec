  content: Spécifie les règles particulières de sécurité pour les appareils de surveillance de la pression partielle transcutanée. S'applique aux moniteurs transcutanés utilisés sur des adultes, des enfants et des nouveau-nés et inclut l'utilisation de ces dispositifs dans la surveillance foetale pendant l'accouchement.
