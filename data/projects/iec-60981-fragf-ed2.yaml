abstract:
- language: en
  script: Latn
  content: |-
    This International Standard specifies requirements for EHDERS (extra heavy-duty electrical rigid steel) conduits, couplings, nipples and elbows for electrical installations, including communications and fibre optics. This standard also specifies threads for these components.
    It is not applicable to the conduits specified in IEC 60423.
