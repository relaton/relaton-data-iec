abstract:
- language: en
  script: Latn
  content: Sets out rules which govern selection and erection of equipment in general and stipulates compliance with measures of protection of safety, requirements for proper functioning for intended use and those appropriate to external influences. Gives in tabular form characteristics required for selection and erection of equipment with respect to external influences.
- language: fr
  script: Latn
  content: Donne les règles qui régissent le choix et la mise en oeuvre du matériel en général, et stipule la conformité aux mesures de protection pour assurer la sécurité, les prescriptions pour assurer un fonctionnement satisfaisant pour l'utilisation prévue et les prescriptions appropriées aux influences externes. Donne sous forme tabulaire les caractéristiques requises pour le choix et la mise en oeuvre du matériel en fonction de ces influences externes.
