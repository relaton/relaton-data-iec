abstract:
- language: en
  script: Latn
  content: IEC 62037-8:2022 defines a radiated passive intermodulation (PIM) test to determine PIM levels generated by a device or object when it is exposed to RF radiation. This test can be conducted on any material or object and is not limited to devices designed to propagate RF signals. This test can be conducted as either a near field or far field test as defined by the test specification in an outdoor test site or in an anechoic test chamber.
- language: fr
  script: Latn
  content: IEC 62037-8:2022 définit un essai d’intermodulation passive (PIM) rayonnée pour déterminer les niveaux d’intermodulation passive générés par un dispositif ou un objet lorsqu’il est exposé à un rayonnement RF. Cet essai peut être effectué sur tout matériau ou objet et n’est pas limité aux dispositifs conçus pour propager des signaux RF. Cet essai peut être effectué en champ proche ou en champ lointain, selon ce qui est défini dans la spécification d’essai sur un site d’essai extérieur ou à l’intérieur d’une chambre d’essai anéchoïque.
