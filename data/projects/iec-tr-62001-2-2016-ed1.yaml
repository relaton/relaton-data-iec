abstract:
- language: en
  script: Latn
  content: |-
    IEC TR 62001-2:2016(E), which is a Technical Report, provides guidance on the performance aspects and verification of performance of harmonic filters. The scope of this document covers AC side filtering for the frequency range of interest in terms of harmonic distortion and audible frequency disturbances. It excludes filters designed to be effective in the PLC and radio interference spectra. This document concerns the "conventional" AC filter technology and line-commutated high-voltage direct current (HVDC) converters. This first edition of IEC TR 62001-2, together with IEC TR 62001-1, IEC TR 62001-3 and IEC TR 62001-4, cancels and replaces IEC TR 62001 published in 2009. This edition constitutes a technical revision. This edition includes the following significant technical changes with respect to IEC TR 62001:<br/>
    a) expanded and supplemented Clause 19, and Annex B;<br/>
    b) new Clause 3 on current-based interference criteria;<br/>
    c) new annexes on induced noise calculation with Dubanton equations;<br/>
    d) addition of a TIF requirement in a technical specification;<br/>
    e) specification of IT limits dependent on network impedance and on the impact of AC network harmonic impedance; and<br/>
    f) specification of voltage level on the filter design necessary to fulfil an IT criterion.
