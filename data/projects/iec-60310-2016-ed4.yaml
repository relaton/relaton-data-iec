abstract:
- language: en
  script: Latn
  content: |-
    IEC 60310:2016 applies to traction and auxiliary power transformers installed on board rolling stock and to the various types of power inductors inserted in the traction and auxiliary circuits of rolling stock, of dry or liquid-immersed design. This standard can also be applied, after agreement between purchaser and manufacturer, to the traction transformers of three-phase AC line-side powered vehicles and to the transformers inserted in the single-phase or poly-phase auxiliary circuits of vehicles, except instrument transformers and transformers of a rated output below 1 kVA single-phase or 5 kVA poly-phase. This new edition takes into account the new generic railway standards, more specifically general service conditions referring to IEC 62498-1 and shock and vibration considerations referring to IEC 61373. It also includes the following significant technical changes with regard to the previous edition:<br/>
    - temperature limits;<br/>
    - temperature-rise test;<br/>
    - dielectric tests;<br/>
    - partial discharge test;<br/>
    - inductance measurement methods;<br/>
    - voltage between terminals withstand test, etc.<br/>
    The contents of the corrigendum of February 2018 have been included in this copy.
- language: fr
  script: Latn
  content: |-
    L'IEC 60310:2016 s'applique aux transformateurs de traction et de puissance auxiliaire à bord du matériel roulant et aux divers types de bobines d'inductance d'alimentation insérées dans les circuits de traction ou auxiliaires du matériel roulant, de conception sèche ou immergée dans un liquide. La présente Norme peut également être appliquée, après accord entre l'acheteur et le fabricant, aux transformateurs de traction des véhicules à courant alternatif triphasé côté réseau et aux transformateurs insérés dans les circuits auxiliaires monophasés ou polyphasés des véhicules, exception faite des transformateurs de mesure et des transformateurs de puissance assignée inférieure à 1 kVA en monophasé ou à 5 kVA en polyphasé. Cette nouvelle édition tient compte des nouvelles normes génériques ferroviaires, en particulier en ce qui concerne les conditions générales de service en référence à l'IEC 62498-1 et les considérations en matière de chocs et de vibrations en référence à l'IEC 61373. Elle inclut également les modifications techniques majeures suivantes par rapport à l'édition précédente:<br/>
    - limites de températures;<br/>
    - essai d'échauffement;<br/>
    - essais diélectriques;<br/>
    - essai de décharges partielles;<br/>
    - méthodes de mesure d'inductance;<br/>
    - essai de tenue à la tension entre bornes; etc.<br/>
    Le contenu du corrigendum de février 2018 a été pris en considération dans cet exemplaire.
