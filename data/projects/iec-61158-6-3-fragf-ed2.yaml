abstract:
- language: fr
  script: Latn
  content: |-
    La CEI 611158-6-3:2010 définit de manière abstraite le comportement visible de l'extérieur fourni par la couche application de bus de terrain Type 3. Elle spécifie le protocole fourni pour définir la représentation câblée des primitives de service spécifiées dans la CEI 61158-5-3, et définir le comportement visible de l'extérieur qui est associé à leur transfert. La présente norme spécifie le protocole de la couche application des réseaux de terrain de Type 3, en conformité avec le Modèle de référence de base de l'OSI (ISO/CEI 7498) et la Structure de la couche application de l'OSI (ISO/CEI 9545). Cette deuxième édition annule et remplace la première édition, parue en 2007 et elle constitue une révision technique. Les principaux changements par rapport à l'édition précédente sont:<br/>
    - corrections, dans le Tableau 10 et dans le Tableau 48;<br/>
    - clarification en 6.9.1.2;<br/>
    - suppression des brevets expirés et divulgation de nouveaux brevets. La présente version bilingue (2012-07) correspond à la version anglaise monolingue publiée en 2010-08.
