abstract:
- language: en
  script: Latn
  content: |-
    IEC 61010-2-203: 2024 specifies particular safety requirements for industrial communication circuits and their interconnection where equipment is intended to be installed in a process or discrete control environment.<br/>
    These include communication circuits and interconnections which are part of electrical test and measurement equipment or process control equipment, where these are intended to be used in an industrial environment.<br/>
    This document is to be used in conjunction with IEC 61010-1:2010 and IEC 61010 1:2010/AMD1:2016.<br/>
    Additional information may be found in the Foreword, Intruduction and in the Scope and object of the document.
