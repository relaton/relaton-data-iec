abstract:
- language: en
  script: Latn
  content: States the characteristics of the equipment, the conditions with which the equipment shall comply (operation and behaviour in normal service, operation and behaviour in case of specified abnormal conditions, dielectric properties) the test for confirming that these conditions have been met and the methods to be adopted for these tests; the information to be marked on the equipment or made available by the manufacturer, e.g. in the catalogue. This publication supersedes IEC 60408 (1985) and should be read in conjunction with IEC 60947-1 (1988).
- language: fr
  script: Latn
  content: Fixe les caractéristiques du matériel, les conditions auxquelles doit répondre le matériel, fonctionnement et comportement en service normal, fonctionnement et comportement en cas de conditions anormales spécifiées, qualités diélectriques, les essais destinés à vérifier si ces conditions sont remplies et les méthodes à adopter pour ces essais, les indications à porter sur le matériel, ou celles fournies par le constructeur, par exemple dans le catalogue. Cette publication remplace la CEI 60408 (1985) et doit être utilisée conjointement avec la CEI 60947-1 (1988).
