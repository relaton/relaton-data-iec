abstract:
- language: en
  script: Latn
  content: Concerns r.f. coaxial connectors for use with r.f. cables both flexible and semi-rigid, where air dielectric interface and high mechanical stability are required for severe environmental exposure. The connectors provide low reflection in the microwave region up to 12 GHz and all patterns may provide sealing up to a pressure differential of 3 bar.
- language: fr
  script: Latn
  content: Concerne les connecteurs coaxiaux pour fréquences radioélectriques pouvant être utilisés avec des câbles pour fréquences radioélectriques, soit souples, soit semi-rigides, avec interface à diélectrique air et où une haute stabilité mécanique est prescrite pour des conditions d'environnement sévères. Les connecteurs ont un bas coefficient de réflexion dans la zone des micro-ondes jusqu'à 12 GHz et tous les modèles peuvent être étanches jusqu'à une pression différentielle de 3 bar.
