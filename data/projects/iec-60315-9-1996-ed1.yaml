  content: Spécifie les conditions, caractéristiques et méthodes de mesure à utiliser pour déterminer les caractéristiques de réception RDS d'un récepteur de radiodiffusion sonore, afin de pouvoir comparer des résultats des mesures réalisées par différents observateurs.
