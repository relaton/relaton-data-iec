abstract:
- language: en
  script: Latn
  content: |-
    IEC 62841-4-5:2021 This document applies to grass shears with a maximum cutting width of 200 mm designed primarily for cutting grass.<br/>
    This document does not apply to hedge trimmers.<br/>
    Hedge trimmers are covered by IEC 62841-4-2.
- language: fr
  script: Latn
  content: |-
    IEC 62841-4-5:2021 Le présent document s'applique aux <strong>cisailles à gazon</strong> d'une <strong>largeur de coupe</strong> maximale de 200 mm, conçues principalement pour la tonte du gazon.<br/>
    Le présent document ne s'applique pas aux taille-haies.<br/>
    Les taille-haies sont couverts par l'IEC 62841-4-2.
