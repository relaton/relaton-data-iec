abstract:
- language: fr
  script: Latn
  content: La CEI 62356-2:2011 spécifie la compression d'un format source haute définition en un format de flux de données groupées en paquets sur deux canaux, adapté à l'enregistrement sur des dispositifs de stockage sur disque et sur bande, dont l'enregistreur de type D-11. La présente spécification comporte un certain nombre d'opérations de base de mise en paquets incluant l'imbrication des données source avant la compression, à la fois pour améliorer la performance de compression et pour permettre un traitement de correction d'erreurs dans le décodeur. La présente norme contient également le processus requis pour décoder le format de données compressées mises en paquets de type D-11 en un signal de sortie à haute définition. La présente version bilingue, publiée en 2011-05, correspond à la version anglaise. Elle inclut le corrigendum 1 (2011-05) à la version anglaise. La version française de cette norme n'a pas été soumise au vote.
