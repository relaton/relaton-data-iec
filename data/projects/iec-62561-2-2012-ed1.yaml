abstract:
- language: en
  script: Latn
  content: |-
    IEC 62561-2:2012 specifies the requirements and tests for:<br/>
    - metallic conductors (other than "natural" conductors) that form part of the air termination system and down conductors;<br/>
    - metallic earth electrodes that form part of the earth termination system.
- language: fr
  script: Latn
  content: |-
    L'IEC 62561-2:2012 spécifie les exigences et les essais pour:<br/>
    - les conducteurs métalliques (autres que les conducteurs "naturels") qui font partie du dispositif de capture et des conducteurs de descente,<br/>
    - les électrodes de terre métalliques qui font partie de la prise de terre.
