abstract:
- language: en
  script: Latn
  content: |-
    The Fieldbus Application Layer (FAL) provides user programs with a means to access the fieldbus communication environment. In this respect, the FAL can be viewed as a “window between corresponding application programs.”<br/>
    IEC 61158-6-25:2019 provides common elements for basic time-critical and non-time-critical messaging communications between application programs in an automation environment and material specific to Type 25 fieldbus. The term “time-critical” is used to represent the presence of a time-window, within which one or more specified actions are required to be completed with some defined level of certainty. Failure to complete specified actions within the time window risks failure of the applications requesting the actions, with attendant risk to equipment, plant and possibly human life.<br/>
    This document defines in an abstract way the externally visible behavior provided by the different Types of the fieldbus Application Layer in terms of:<br/>
    a) the abstract syntax defining the application layer protocol data units conveyed between communicating application entities,<br/>
    b) the transfer syntax defining the application layer protocol data units conveyed between communicating application entities,<br/>
    c) the application context state machine defining the application service behavior visible between communicating application entities; and<br/>
    d) the application relationship state machines defining the communication behavior visible between communicating application entities.
- language: fr
  script: Latn
  content: |-
    La couche application de bus de terrain (FAL, Fieldbus Application Layer) fournit aux programmes d’utilisateur un moyen d’accéder à l’environnement de communication du bus de terrain. A cet égard, la FAL peut être vue comme une "fenêtre entre des programmes d'application correspondants".<br/>
    L'IEC 61158-6-25:2019 fournit les éléments communs pour les communications de messagerie de base prioritaires et non prioritaires entre des programmes d'application dans un environnement d'automation et le matériau spécifique au bus de terrain de type 25. On utilise le terme "prioritaire" pour traduire la présence d’une fenêtre temporelle, à l’intérieur de laquelle une ou plusieurs actions spécifiées doivent être terminées avec un niveau de certitude défini. Si les actions spécifiées ne sont pas réalisées dans la fenêtre temporelle, les applications demandant les actions risquent de connaître une défaillance, avec les risques que cela comporte pour les équipements, les installations et éventuellement la vie humaine.<br/>
    Le présent document définit de manière abstraite le comportement, visible par un observateur externe, assuré par les différents types de la couche application de bus de terrain, en termes<br/>
    a) de syntaxe abstraite définissant les unités de données de protocole de la couche application, transmises entre les entités d'application en communication;<br/>
    b) de syntaxe de transfert définissant les unités de données de protocole de la couche application, transmises entre les entités d'application en communication;<br/>
    c) de diagramme d'états de contexte d'application définissant le comportement de service d'application observable entre les entités d'application en communication; et<br/>
    d) de diagrammes d'états de relations d'applications définissant le comportement de communication visible entre les entités d'application en communication.
