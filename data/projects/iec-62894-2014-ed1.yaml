abstract:
- language: en
  script: Latn
  content: IEC 62894:2014 describes data sheet and name plate information for photovoltaic inverters in grid parallel operation. The object of this standard is to provide minimum information required to configure a safe and optimal system with photovoltaic inverters.
- language: fr
  script: Latn
  content: L'IEC 62894:2014 décrit les informations contenues dans la fiche technique et sur la plaque d'identification des onduleurs photovoltaïques fonctionnant parallèlement au réseau. L'objet de cette norme est de fournir les informations minimales requises pour configurer un système sûr et optimal avec des onduleurs photovoltaïques.
