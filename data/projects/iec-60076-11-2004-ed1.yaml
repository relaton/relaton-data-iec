abstract:
- language: en
  script: Latn
  content: Applies to dry-type power transformers (including auto-transformers) having values of highest voltage for equipment up to and including 36 kV and at least one winding operating at greater than 1,1 kV. Applies to all construction technologies.
- language: fr
  script: Latn
  content: S'applique aux transformateurs de type sec (y compris les autotransformateurs) ayant des valeurs de tension la plus élevée pour le matériel inférieures ou égales à 36 kV avec au moins un enroulement fonctionnant à plus de 1,1 kV. S'applique à toutes les technologies de construction.
