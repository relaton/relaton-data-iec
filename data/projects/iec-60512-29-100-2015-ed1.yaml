abstract:
- language: en
  script: Latn
  content: "L&#x27;IEC 60512-29-100:2015 spécifie les méthodes d&#x27;essais pour les performances des transmissions pour les connecteurs de type M12 jusqu&#x27;à 500 MHz. Elle est également applicable aux essais réalisés sur des connecteurs à fréquences plus basses s&#x27;ils satisfont aux exigences des spécifications particulières et de la présente norme. Les méthodes d&#x27;essai spécifiées ici sont:</br>\r\n- perte d&#x27;insertion, essai 29a;</br>\r\n- affaiblissement de réflexion, essai 29b;</br>\r\n- paradiaphonie (NEXT), essai 29c;</br>\r\n- télédiaphonie (FEXT), essai 29d;</br>\r\n- perte de conversion transverse (TCL), essai 29f;</br>\r\n- perte de transfert de conversion transverse (TCTL), essai 29g. Pour l&#x27;essai d&#x27;impédance de transfert (ZT), voir l&#x27;IEC 60512-26-100, essai 26e. Pour l&#x27;affaiblissement de couplage, voir l&#x27;ISO&#x2F;IEC 11801. Toutes les figures représentent des principes pour des câblages de quatre paires Mots-clés: Connecteurs, Intégrité des signaux, Connecteurs de type M12"
- language: fr
  script: Latn
