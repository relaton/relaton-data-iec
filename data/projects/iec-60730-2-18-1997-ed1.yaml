abstract:
- language: en
  script: Latn
  content: |-
    Applies to automatic electrical water and air flow sensing controls
    for use in, on or in association with equipment for household and
    similar use including controls for heating, air conditioning and
    similar applications. -The equipment may use electricity, gas, oil,
    solid fuel, solar thermal energy, etc., or a combination thereof.
- language: fr
  script: Latn
  content: |-
    -------------------------------------------------------------------
    -+        |
    s'applique aux dispositifs de commande électrique automatiques
    détecteurs du débit d'eau et d'air destinés à être utilisés dans,
    ou en association avec des appareils domestiques et à usage
    analogue y compris les dispositifs de commande pour le chauffage,
    le conditionnement d'air et autres applications similaires.
    Ces appareils peuvent utiliser l'électricité, le gaz, des
    combustibles solides, l'énergie solaire ou thermique, etc. ou une
    combinaison de ces énergies.
