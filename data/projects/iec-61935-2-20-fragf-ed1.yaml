abstract:
- language: fr
  script: Latn
  content: |-
    La CEI 61935-2-20:2008, est une spécification particulière cadre qui décrit les cordons de zone de travail pour les applications de classe D, comme défini dans l'ISO/IEC 11801, ainsi que dans 
    l'ISO/CEI 24702. Elle détermine la disposition et le modèle pour les spécifications particulières décrivant les cordons dont les caractéristiques de transmission sont inférieures ou égales à 100 MHz pour communications numériques. Elle annule et remplace la ISO/CEI PAS 61935-2-20 publiée en 2007 et constitue une révision technique. La présente version bilingue, correspond à la version anglaise publiée en 2008.
