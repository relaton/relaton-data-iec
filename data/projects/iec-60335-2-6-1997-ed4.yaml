  script: Latn
  content: Est applicable aux cuisinières, tables de cuisson, fours électriques fixes et appareils analogues pour usages domestiques. Comme exemples, les grils fixes, les grils par contact fixes, les fours autonettoyants par pyrolyse, les tables de cuisson à induction et les fours à vapeur.
