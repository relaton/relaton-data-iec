abstract:
- language: fr
  script: Latn
  content: |-
    La CEI 61158-4-2:2010 spécifie un protocole qui offre des opportunités de communication séquentielle et synchrone cyclique à toutes les entités de liaison de données participantes. Un accès planifié de premier plan est proposé à toutes les activités à contrainte de temps, un accès non planifié l'étant aux activités moins critiques. Ce protocole offre la possibilité de maintenir la synchronisation d'horloge d'une liaison étendue à 10 ms près. Ce protocole permet d'optimiser chaque opportunité d'accès en concaténant plusieurs DLSDU et DLPCI associés en une seule DLPDU, améliorant le transfert de données des entités de liaison de données qui émettent activement plusieurs flux de données. Cette deuxième édition annule et remplace la première édition publiée en 2007. Elle constitue une révision technique. Les principales modifications par rapport à l'édition précédente sont:<br/>
    - la mise à jour des références normatives et bibliographiques;<br/>
    - la mise à jour des abréviations;<br/>
    - les mises à jour de l'objet de liaison Ethernet;<br/>
    - des nouveaux objets DLR et QoS;<br/>
    - un nouveau protocole DLR. La présente version bilingue (2012-07) correspond à la version anglaise monolingue publiée en 2010-08.
