abstract:
- language: en
  script: Latn
  content: |
    IEC 60793-2-30: 2015 is applicable to sub-categories A3a, A3b, A3c, A3d, A3e, A3f and A3g. These fibres are used or can be incorporated in different information transmission equipment, other applications employing similar light transmitting techniques as well as fibre optic cables.<br/>
    Three types of requirements apply to these fibres:

    	general requirements, as defined in IEC 60793-2;
    	specific requirements common to the category A3 multimode fibres covered in this standard and which are given in Clause 3;
    	particular requirements applicable to the individual sub-categories or specific applications (e.g. automotive or industrial applications), which are defined in the normative sub-category annexes.

    <br/>
    This fourth edition cancels and replaces the third edition published in 2012 and constitutes a technical revision. This edition includes the following significant technical changes with respect to the previous edition:

    	specified test specimen length and measurement details for core diameter and NAff measurements have been added.
    	two new sub-categories have been added
    	NAth is replaced by NAff
- language: fr
  script: Latn
  content: |
    IEC 60793-2-30: 2015 est applicable aux sous-catégories A3a, A3b, A3c, A3d, A3e, A3f et A3g. Ces fibres sont utilisées ou peuvent être intégrées dans différents équipements destinés à la transmission de l'information, d'autres applications employant des techniques de transmission lumineuse analogues, ainsi que les câbles à fibres optiques. Trois types d’exigences s’appliquent à ces fibres:

    	les exigences générales, conformément à l’IEC60793-2;
    	les exigences spécifiques communes aux fibres multimodes de catégorie A3, couvertes par la présente norme, et qui sont données à l'Article 3;
    	les exigences particulières applicables à des sous-catégories particulières ou à des applications spécifiques (par exemple, des applications automobiles ou industrielles), qui sont définies dans les annexes normatives relatives aux sous-catégories.

    Cette quatrième édition annule et remplace la troisième édition parue en 2012 et constitue une révision technique. La présente édition inclut les modifications techniques majeures suivantes par rapport à l’édition précédente:


    	Ajouts de précisions relatives à la longueur du spécimen d'essai, au diamètre de cœur et aux mesurages NAff.
    	Ajout de deux nouvelles sous-catégories
    	NAth est remplacé par NAff
