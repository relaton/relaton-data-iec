abstract:
- language: en
  script: Latn
  content: |-
    IEC 61675-2:2026 specifies terminology and test methods for describing the characteristics of GAMMA CAMERAS equipped with PARALLEL HOLE COLLIMATORS that are capable of planar imaging. Additional tests are specified for those GAMMA CAMERAS that are capable of SINGLE PHOTON EMISSION COMPUTED TOMOGRAPHY (SPECT) or planar wholebody imaging (PLANAR WHOLEBODY IMAGING EQUIPMENT) or SPECT wholebody imaging. SPECT systems can also be equipped with a CT system for hybrid imaging.<br/>
    These GAMMA CAMERAS consist of a gantry, single or multiple DETECTOR HEADS, and a computer for data acquisition, processing, storage, and display. The DETECTOR HEADS can contain single or multiple scintillation crystals or solid state detectors.<br/>
    Novel camera designs with multiple DETECTOR HEADS that are not capable of planar acquisition are not included in the scope of this document.<br/>
    IEC 61675-2:2026 cancels and replaces the second edition published in 2015. This edition constitutes a technical revision.<br/>
    This edition includes the following significant technical changes with respect to the previous edition:<br/>
    a) addition of systems based on pixelated semi-conductor detectors;<br/>
    b) addition of tests for wholebody SPECT performance and quantitative SPECT image accuracy;<br/>
    c) alignment with NEMA NU 1-2018;<br/>
    d) deletion of tests for SPECT-systems operated in coincidence mode due to the lack of market share of these systems.
- language: fr
  script: Latn
  content: |-
    IEC 61675-2:2026 spécifie la terminologie et les méthodes d’essai relatives à la description des caractéristiques des GAMMA-CAMERAS équipées de COLLIMATEURS A TROUS PARALLELES adaptés à l'imagerie planaire. Des essais supplémentaires sont spécifiés pour les GAMMA-CAMERAS ADAPTEES A LA SPECT OU A L'IMAGERIE PLANAIRE DU CORPS ENTIER (EQUIPEMENT D'IMAGERIE PLANAIRE DU CORPS ENTIER) ou l’imagerie du corps entier SPECT. Les systèmes SPECT peuvent aussi être équipés d’un système CT pour l’imagerie hybride.<br/>
    Ces GAMMA-CAMERAS se composent d'un portique, de TETES DU DETECTEUR simples ou multiples et d’un système informatique pour l'acquisition, le traitement, le stockage et l'affichage des données. Les TETES DU DETECTEUR peuvent contenir des cristaux à scintillation simples ou multiples ou des détecteurs à semiconducteurs.<br/>
    Le domaine d’application de cette norme n’inclut pas les nouvelles conceptions de caméras à plusieurs TETES DU DETECTEUR qui ne peuvent pas réaliser d’acquisition planaire.<br/>
    IEC 61675-2:2026 annule et remplace la deuxième édition parue en 2015. Cette édition constitue une révision technique.<br/>
    Cette édition inclut les modifications techniques majeures suivantes par rapport à l’édition précédente:<br/>
    a) elle a été modifiée pour traiter des systèmes fondés sur des détecteurs semi-conducteurs à pixels;<br/>
    b) les essais pour les performances SPECT du corps entier et l’exactitude quantitative des images SPECT ont été ajoutés;<br/>
    c) elle a fait l'objet d'un reformatage, d'une mise à jour et d'un alignement partiel avec le document NEMA NU 1 2018;<br/>
    d) les essais associés ont tous été supprimés en raison de l’absence de part de marché pour les systèmes SPECT mis en fonctionnement dans le mode de détection en coïncidence.
