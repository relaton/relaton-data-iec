abstract:
- language: en
  script: Latn
  content: |-
    IEC 62443-3-2:2020 (E) establishes requirements for:<br/>
    • defining a system under consideration (SUC) for an industrial automation and control system (IACS);<br/>
    • partitioning the SUC into zones and conduits;<br/>
    • assessing risk for each zone and conduit;<br/>
    • establishing the target security level (SL-T) for each zone and conduit; and<br/>
    • documenting the security requirements.
- language: fr
  script: Latn
  content: |-
    L’IEC 62443-3-2:(2020) établit les exigences concernant:<br/>
    • la définition d'un système à l'étude (SUC, system under consideration) pour un système d'automatisation et de commande industriel (IACS);<br/>
    • la division du SUC en zones et conduits;<br/>
    • l'appréciation du risque pour chaque zone et conduit;<br/>
    • l'établissement d'un niveau de sécurité cible (SL-T) pour chaque zone et conduit; et<br/>
    • la documentation des exigences de sécurité.
