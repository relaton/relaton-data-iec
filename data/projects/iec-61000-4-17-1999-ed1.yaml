abstract:
- language: en
  script: Latn
  content: Defines test methods for immunity to ripple at the d.c. input power port of electrical or electronic equipment. Applies to low-voltage d.c. power ports of equipment supplied by external rectifier systems, or batteries which are being charged. This standard defines - test voltage waveform; - range of test levels; - test generator; - test set-up; - test procedure.
- language: fr
  script: Latn
  content: Définit les méthodes d'essai d'immunité aux ondulations résiduelles appliquées à l'entrée de l'alimentation en courant continu des matériels électriques ou électroniques. S'applique aux entrées de puissance en courant continu basse tension des matériels alimentés par des systèmes redresseurs externes ou par des batteries qui sont en charge. Cette norme définit - la forme d'onde de la tension d'essai; - une gamme de niveaux d'essai; - le générateur d'essai; - l'installation d'essai; - la procédure d'essai.
