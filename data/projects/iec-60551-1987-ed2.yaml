abstract:
- language: en
  script: Latn
  content: Defines the methods by which the sound levels of transformers, reactors and their associated cooling equipment shall be determined so that compliance with any specification requirements may be confirmed and the characteristic of noise emitted in service determined.
- language: fr
  script: Latn
  content: Définit les méthodes par lesquelles les niveaux de bruit des transformateurs des bobines d'inductance et de leurs dispositifs de refroidissement associés doivent être mesurés de telle sorte que l'on puisse contrôler la conformité à des exigences spécifiées et déterminer les caractéristiques du bruit émis en service.
