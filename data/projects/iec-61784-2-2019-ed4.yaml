abstract:
- language: en
  script: Latn
  content: |-
    IEC 61784-2:2019 specifies the performance indicators supporting classification schemes for Real-Time Ethernet (RTE) requirements; the profiles and related network components based on ISO/IEC 8802-3 or IEEE 802.3, IEC 61158 series, and IEC 61784-1 and the RTE solutions that are able to run in parallel with ISO/IEC 8802-3 or IEEE 802.3 based applications. These communication profiles are called Real-Time Ethernet communication profiles. This fourth edition cancels and replaces the third edition published in 2014 and constitutes a technical revision. The main changes are:<br/>
    • update of reference from ISO/IEC 8802-3 to ISO/IEC/IEEE 8802-3;<br/>
    • update of the dated references to the IEC 61158 series, to IEC 61784 1, to the IEC 61784-5 series and to IEC 61918 throughout the document;<br/>
    • update of selection tables for CPF 2, CPF 3, CPF 4, CPF 8 and CPF 17;<br/>
    • CPF3: update of the requirements for all conformance classes;<br/>
    • CPF3: updated timing requirements for IO devices;<br/>
    • CPF3: refining the added application classes;<br/>
    • addition of a new Communication Profile Family – CPF 20 in Clause 21;<br/>
    • addition of a new Communication Profile Family – CPF 21 in Clause 22
- language: fr
  script: Latn
  content: |-
    EC 61784-2:2019 spécifie:<br/>
    • les indicateurs de performance prenant en charge les schémas de classement pour les exigences RTE (Real-Time Ethernet);<br/>
    • les profils et les composants de réseau connexes reposant sur l’ISO/IEC/IEEE 8802-3, la série IEC 61158 et l’IEC 61784-1;<br/>
    • les solutions RTE capables de fonctionner en parallèle avec les applications ISO/IEC/IEEE 8802-3.<br/>
    Ces profils de communication sont appelés Ethernet en temps réel (RTE).<br/>
    Cette quatrième édition annule et remplace la troisième édition parue en 2014. Cette édition constitue une révision technique.<br/>
    Cette édition inclut les modifications techniques majeures suivantes par rapport à l'édition précédente:<br/>
    • la mise à jour de la référence de l’ISO/IEC 8802-3 à l’ISO/IEC/IEEE 8802-3;<br/>
    • la mise à jour des références datées à la série IEC 61158, à l’IEC 61784 1, à la série IEC 61784-5 et à l’IEC 61918 dans tout le document;<br/>
    • la mise à jour des tableaux de sélection pour CPF 2, CPF 3, CPF 4, CPF 8 et CPF 17;<br/>
    – CPF3: mise à jour des exigences pour toutes les classes de conformité;<br/>
    – CPF3: mise à jour des exigences de temporisation pour les appareils d'entrée-sortie;<br/>
    – CPF3: affinage des classes d'application ajoutées;<br/>
    • l'ajout d’une nouvelle famille de profils de communication – CPF 20 à l’Article 21;<br/>
    • l'ajout d’une nouvelle famille de profils de communication – CPF 21 à l’Article 22.<br/>
    La présente version bilingue (2020-04) correspond à la version anglaise monolingue publiée en 2019-04.
