abstract:
- language: en
  script: Latn
  content: |-
    This part of IEC 61988 defines drawings and required dimensions of plasma display (PDP) modules, PDP components, PDP sub-assemblies and ancillary components. 

    This standard serves as a basis to establish a set of PDP modules with a standard description of dimensions.
- language: fr
  script: Latn
  content: |-
    La présente partie de la CEI 61988 définit les plans et les dimensions requises des modules d'afficheurs plasma (PDP), de parties constituantes des PDP, et des sous-ensembles et accessoires des PDP. 

    Cette norme sert de base à l'établissement d'un ensemble de modules PDP ayant une description normalisée de leurs dimensions.
