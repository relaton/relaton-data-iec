abstract:
- language: en
  script: Latn
  content: |-
    Defines a set of encoding rules that may be used to derive the specification of a transfer syntax for values of types defined in the DLMS core standard using the ASN.1 notation (see IEC 61334-4-41).<br/>
    <br/>
    This publication is of high relevance for Smart Grid.
- language: fr
  script: Latn
  content: Définit un ensemble de règles de codage susceptibles d'être utilisées pour obtenir la spécification d'une syntaxe de transfert pour les valeurs de types définis dans la norme principale DLMS à l'aide de la notation ASN.1 (voir la CEI 61334-4-41).
