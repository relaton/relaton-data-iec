abstract:
- language: en
  script: Latn
  content: |-
    Applies to low-voltage switchgear and controlgear assemblies (type-tested assemblies (TTA) and partially type-tested
    assemblies (PTTA)), the rated voltage of which does not exceed 1 000 V a.c. at frequencies not exceeding 1 000 Hz, or 1 500 V d.c.
- language: fr
  script: Latn
  content: S'applique aux ensembles d'appareillage à basse tension (ensembles de série (ES) et ensembles dérivés de série (EDS)), dont la tension assignée ne dépasse pas 1 000 V en courant alternatif à des fréquences ne dépassant pas 1 000 Hz, ou 1 500 V en courant continu.
