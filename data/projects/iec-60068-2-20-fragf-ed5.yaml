abstract:
- language: fr
  script: Latn
  content: |-
    La CEI 60068-2-20:2008 décrit l'essai T qui s'applique aux dispositifs à broches. Les essais de brasage des composants pour montage en surface (CMS) sont décrits dans la CEI 60068-2-58. La présente norme fournit des procédures pour déterminer la brasabilité et la résistance à la chaleur de brasage des dispositifs dans les applications utilisant des alliages de brasure, qui sont soit des brasures étain plomb (Pb) eutectique ou quasi eutectique, soit des alliages de brasure sans plomb. Les procédures de la présente norme incluent les méthodes dites de bain de brasage et de fer à braser. Le but de la présente norme est de s'assurer que les broches des composants ou la brasabilité de leurs extrémités est en mesure de satisfaire aux exigences applicables aux joints de brasures des CEI 61191-3 et 61191-4. De plus, des méthodes d'essai sont fournies pour s'assurer que le corps du composant peut résister à la charge calorifique à laquelle il est exposé pendant le brasage. Les principales modifications techniques par rapport à la quatrième édition sont les suivantes:<br/>
    - l'essai de gouttelette de brasure est supprimé;<br/>
    - des conditions et des exigences d'essai concernant les brasures sans plomb sont ajoutées.
