abstract:
- language: fr
  script: Latn
  content: 'L''IEC 61158-5-20:2007 définit les services fournis: à l''utilisateur FAL à la limite entre l''utilisateur et la couche application du modèle de référence de bus de terrain, et à la gestion des systèmes à la limite entre la couche application et la gestion des systèmes du modèle de référence de bus de terrain. Elle spécifie la structure et les services de la couche application de bus de terrain CEI, conformément au modèle de référence de base OSI (ISO/CEI 7498) et à la structure de la couche application OSI (ISO/CEI 9545). Cette première édition et les autres normes de la sous-partie CEI 61158-5 annulent et remplacent la CEI 61558-5:2003. Cette édition de la présente partie constitue un ajout technique. Elle inclut les modifications suivantes: suppression de l''ancien bus de terrain de Type 6, qui n''est plus adapté au marché; ajout de nouveaux types de bus de terrain; éclatement de la partie 5 de la troisième édition en plusieurs parties numérotées-5-2, -5-3,   La présente version bilingue (2014-06) correspond à la version anglaise monolingue publiée en 2007-12.'
