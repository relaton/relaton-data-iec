abstract:
- language: en
  script: Latn
  content: |-
    IEC 60598-2-2:2026 specifies requirements for recessed luminaires and recessed air-handling luminaires for use within ventilation ducts or ventilated spaces. These luminaires are for use with electric light sources and with supply voltages up to 1 000 V.<br/>
    This document is not applicable to ground recessed luminaires as covered by IEC 60598-2-13.<br/>
    This fifth edition cancels and replaces the fourth edition published in 2023. This edition constitutes a technical revision.<br/>
    This edition includes the following significant technical changes with respect to the previous edition:<br/>
    a) the clause numbers and structure have been aligned with those of IEC 60598-1.
