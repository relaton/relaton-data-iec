abstract:
- language: en
  script: Latn
  content: This part of IEC 60825 serves as a guide to the employer, the responsible organisation, the laser safety officer, the laser operator and other persons involved, on the safe use of lasers and laser equipment classified as class 3B or class 4. It covers all applications of laser beams on humans in, but not limited to, health-care facilities, cosmetic and hair removal centres and dental practices, including applications in vehicles and domestic premises. This technical report explains the control measures recommended for the safety of patients, staff, maintenance personnel and others. Engineering controls which form part of the laser equipment or the installation are also briefly described to provide an understanding of the general principles of protection. The subject areas covered in this guide include - beam delivery systems; - biological effects of laser radiation; - reporting of accidents and dangerous situations; - checklists. The object of this report is to enhance the protection of persons from laser radiation and other associated hazards by providing guidance on how to establish safety procedures, precautions and user control measures.
