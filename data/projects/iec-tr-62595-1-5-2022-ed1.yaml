abstract:
- language: en
  script: Latn
  content: |-
    IEC TR 62595-1-5:2022(E), which is a Technical Report, provides information for the future standardization of the electrical signal interface of LED backlight units for liquid crystal display television sets, which include control signals, control data and LED driver interface. This document only provides information about 2-D local dimming LED backlight units, with or without local boosting.<br/>
    NOTE All values and parameters of this document are examples.
