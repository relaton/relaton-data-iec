  script: Latn
  content: Constitue un guide pour la mesure des paramètres électriques équivalents des résonateurs à quartz. Les résonateurs à quartz sont très largement utilisés pour la stabilisation de la fréquence des oscillateurs ainsi que dans des réseaux de filtre de grande sélectivité.
