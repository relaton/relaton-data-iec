abstract:
- language: en
  script: Latn
  content: |-
    Specifies the particular requirements for the electrical and
    mechanical safety of medical electron accelerators. It contains new
    sub-clauses which are additions to section one of IEC 601-2-1, and
    a new section three giving the electrical and mechanical safety
    requirements for equipment.
- language: fr
  script: Latn
  content: |-
    Spécifie les prescriptions particulières concernant la sécurité
    électrique et mécanique des accélérateurs médicaux d'électrons.
    Comporte des nouveaux paragraphes qui sont des compléments à la
    section un de la CEI 601-2-1, et une nouvelle section trois qui
    traite des règles de sécurité électrique et mécanique pour
    l'appareil.
