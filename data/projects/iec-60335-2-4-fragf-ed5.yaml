abstract:
- language: fr
  script: Latn
  content: Traite de la sécurité des essoreuses centrifuges électriques pour usages domestiques et analogues dont la capacité ne dépasse pas 10 kg de linge sec, dont la vitesse périphérique du tambour ne dépasse pas 50 m/s et dont la tension assignée n'est pas supérieure à 250 V pour les appareils monophasés et à 480 V pour les autres appareils. Couvre aussi les appareils destinés à être utilisés par des usagers non avertis dans des magasins, chez des artisans et dans des fermes.
