- language: en
  script: Latn
  content: IEC 62884-4:2019 describes the methods for the measurement and evaluation of the short-term frequency stability tests of piezoelectric, dielectric and electrostatic oscillators. Its purpose is to unify the test and evaluation methods for short-term frequency stability.
- language: fr
  script: Latn
