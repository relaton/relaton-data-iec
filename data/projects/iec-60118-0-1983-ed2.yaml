abstract:
- language: en
  script: Latn
  content: Defines the measurement of physical performance characteristics of air-conduction hearing aids based on a free-field technique and measured with an ear simulator. Describes methods of measurement for evaluation of the electroacoustical characteristics of hearing aids.
- language: fr
  script: Latn
  content: Décrit la mesure des caractéristiques physiques des appareils de correction auditive à conduction aérienne, fondée sur une technique de champ acoustique libre et utilisant un simulateur d'oreille. Décrit des méthodes de mesure pour l'évaluation des caractéristiques électroacoustiques des appareils de correction auditive.
