abstract:
- language: en
  script: Latn
  content: |-
    IEC 60215:2016 applies to radio transmitting equipment, operating under the responsibility of skilled persons. It also applies to auxiliary equipment and ancillary apparatus, including combining units and matching networks and cooling systems where these form an integral part of the transmitter system.<br/>
    This fourth edition cancels and replaces the third edition, published in 1987, Amendment 1:1989 and Amendment 2:1993. This edition constitutes a technical revision.<br/>
    This edition includes the following significant technical changes with respect to the previous edition:<br/>
    ·     The test methods in this standard are similar to those given in IEC 60215:1987 and continue to apply only to radio transmitting equipment and equipment defined in Clause 1, operating under the responsibility of skilled persons.<br/>
    ·     Reorganization and revision of the content are summarized in Annex F.<br/>
    This bilingual version (2016-11) corresponds to the monolingual English version, published in 2016-04.
- language: fr
  script: Latn
  content: |-
    L'IEC 60215:2015 s'applique aux matériels d'émission radioélectrique fonctionnant sous la responsabilité de personnes qualifiées. Elle s'applique également aux matériels auxiliaires et aux appareils secondaires, y compris les multiplexeurs de programmes, les circuits d’adaptation et les systèmes de refroidissement lorsque ces derniers font partie intégrante du système émetteur.<br/>
    Cette quatrième édition annule et remplace la troisième édition parue en 1987, son Amendement 1:1989 et son Amendement 2:1993. Cette édition constitue une révision technique.<br/>
    Cette édition inclut les modifications techniques majeures suivantes par rapport à l'édition précédente:<br/>
    ·      Les méthodes d'essai énoncées dans la présente norme sont identiques à celles données dans l’IEC 60215:1987 et continuent de s'appliquer uniquement aux matériels d'émission radioélectrique et aux matériels définis à l'Article 1, fonctionnant sous la responsabilité de personnes qualifiées;<br/>
    ·      La réorganisation et la révision du contenu se trouvent dans l'Annexe F.<br/>
    La présente version bilingue (2016-11) correspond à la version anglaise monolingue publiée en 2016-04.
