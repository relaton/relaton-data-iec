- language: en
  script: Latn
  content: |-
    Applicable to electric traction overhead lines for railways, tramways and trolleybuses.
    It is recommended that these provisions should be applied to electric traction overhead lines of new construction or when complete transformation of existing lines takes place.
- language: fr
  script: Latn
  content: |-
    Applicable aux lignes aériennes de traction électrique des chemins de fer, tramways et trolleybus.
    Il est recommandé d'appliquer ces prescriptions aux lignes aériennes de traction électrique de construction nouvelle ou à l'occasion d'une transformation radicale de lignes existantes.
