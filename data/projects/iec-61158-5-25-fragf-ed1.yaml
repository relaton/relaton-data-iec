abstract:
- language: en
  script: Latn
  content: |-
    IEC 61158-5-25:2019 defines in an abstract way the externally visible service provided by the different Types of the fieldbus Application Layer in terms of<br/>
    a) an abstract model for defining application resources (objects) capable of being manipulated by users via the use of the FAL service,<br/>
    b) the primitive actions and events of the service;<br/>
    c) the parameters associated with each primitive action and event, and the form which they take; and<br/>
    d) the interrelationship between these actions and events, and their valid sequences.<br/>
    The purpose of this document is to define the services provided to<br/>
    a) the FAL user at the boundary between the user and the Application Layer of the Fieldbus Reference Model, and<br/>
    b) Systems Management at the boundary between the Application Layer and Systems Management of the Fieldbus Reference Model
- language: fr
  script: Latn
  content: |-
    L'IEC 61158-5-25:2019 définit de manière abstraite le service visible de l'extérieur fourni par les différents types de la couche application de bus de terrain en termes<br/>
    a) de modèle abstrait visant à la définition des ressources d'application (objets) qui peuvent être manipulées par des utilisateurs utilisant un service FAL;<br/>
    b) d'événements et d'actions liées aux primitives du service;<br/>
    c) de paramètres associés à chaque événement et action de primitive, ainsi que de forme prise par ces paramètres; et<br/>
    d) d'interaction entre ces événements et ces actions, ainsi que de séquences valides desdits événements et actions.
