abstract:
- language: en
  script: Latn
  content: This standard specifies the values of the various parameters such as voltage, current, power and temperature to be used in the testing of battery cells, monoblocs and modules used for the propulsion of electric road vehicles. The standard also defines certain test conditions and procedures.
- language: fr
  script: Latn
  content: La présente norme spécifie les valeurs des divers paramètres tels que la tension, le courant, la puissance et la température à utiliser lors des essais des éléments de batteries, des monoblocs et des modules utilisés pour la propulsion des véhicules routiers électriques. La norme définit également certaines conditions et procédures d'essai.
