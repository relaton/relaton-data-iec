abstract:
- language: en
  script: Latn
  content: |-
    IEC PAS 61980-6:2025 addresses communication and activities of magnetic field dynamic wireless power transfer (MF-D-WPT) systems. The power transfer takes place while the electric vehicle (EV) is in motion.<br/>
    The requirements in this document are intended to be applied for MF-D-WPT systems according to IEC PAS 61980-5 and ISO 5474-6.<br/>
    Supply device fulfilling the requirements in this document are intended to operate with EV devices fulfilling the requirements described in ISO 5474-6.<br/>
    The aspects covered in this document include:<br/>
    – operational and functional characteristics of the MF-D-WPT communication system and related activities<br/>
    – operational and functional characteristics of the positioning system<br/>
    The following aspects are under consideration for future documents:<br/>
    – requirements for two- and three-wheel vehicles,<br/>
    – requirements for bidirectional power transfer
