abstract:
- language: en
  script: Latn
  content: |-
    IEC/PAS 62612:2009(E) specifies the performance requirements for self-ballasted LED lamps with a supply voltage up to 250 V, together with the test methods and conditions required, intended for domestic and similar general lighting purposes, having:<br/>
    - a rated wattage up to 60 W;<br/>
    - a rated voltage of up to 250 V AC or DC.
