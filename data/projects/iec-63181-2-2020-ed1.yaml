abstract:
- language: en
  script: Latn
  content: "IEC 63181-2:2020 specifies measuring methods for LCD multi-screen display terminals. To evaluate the characteristics of LCD multi-screen display terminals, the following measurement items are specified:&lt;br &#x2F;&gt;\r\n– gap (physical, optical): detailed splicing precision;&lt;br &#x2F;&gt;\r\n– splicing deviation: splicing accuracy of active areas of LCD splicing screen;&lt;br &#x2F;&gt;\r\n– installation deviation: the flatness of terminal surfaces in vertical and horizontal directions;&lt;br &#x2F;&gt;\r\n– luminance uniformity: luminance uniformity of adjacent LCD units;&lt;br &#x2F;&gt;\r\n– chromatic uniformity: chromatic uniformity of adjacent LCD units."
- language: fr
  script: Latn
  content: "L&#x27;IEC 63181-2:2020 spécifie les méthodes de mesure des terminaux d&#x27;affichage à plusieurs écrans LCD. Pour évaluer les caractéristiques des terminaux d&#x27;affichage à plusieurs écrans LCD, les éléments de mesure suivants sont spécifiés:&lt;br &#x2F;&gt;\r\n– écartement (physique, optique): précision de raccordement détaillée;&lt;br &#x2F;&gt;\r\n– écart de raccordement: précision de raccordement des zones actives de l&#x27;écran de raccordement LCD;&lt;br &#x2F;&gt;\r\n– écart d&#x27;installation: la planéité des surfaces du terminal dans le sens vertical et le sens horizontal;&lt;br &#x2F;&gt;\r\n– uniformité de la luminance: uniformité de luminance des unités LCD adjacentes;&lt;br &#x2F;&gt;\r\n– uniformité chromatique: uniformité chromatique des unités LCD adjacentes."
