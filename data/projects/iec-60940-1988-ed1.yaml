abstract:
- language: en
  script: Latn
  content: |-
    Gives the limits of interference as well as a classification of suppression components. Shows a choice of ratings for specific applications. Deals with the connection of suppression components as well as with safety aspects.

    The contents of the corrigendum of January 1998 have been included in this copy.
- language: fr
  script: Latn
  content: |-
    Donne les limites pour les interférences ainsi qu'une classification des éléments d'antiparasitage. Présente un choix des caractéristiques pour des applications spécifiques et traite du raccordement des composants d'antiparasitage ainsi que des aspects relatifs à la sécurité.

    Le contenu du corrigendum de janvier 1998 a été pris en considération dans cet exemplaire.
