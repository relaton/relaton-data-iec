abstract:
- language: en
  script: Latn
  content: |-
    IEC TS 62607-4-8:2020 specifies a test method for the determination of water content in electrode nanomaterials for nano-enabled electrical energy storage devices, using the Karl Fischer coulometric titration method.<br/>
    This document includes:<br/>
    - recommendations for sample preparation,<br/>
    - outlines of the experimental procedures used to measure electrode nanomaterial properties, and<br/>
    - methods of interpretation of results and discussion of data analysis.<br/>
    IEC TS 62607-4-8:2020 is not applicable for samples that can react with the main components of Karl Fischer reagent and produce water, or samples that can react with iodine or iodide ion.
