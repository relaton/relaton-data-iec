abstract:
- language: en
  script: Latn
  content: |-
    Defines rules for the use and writing of symbols for general
    quantities, symbols for quantities concerning two-port networks,
    symbols for line transmissions of signals (including cables),
    symbols for radio wave propagation, symbols for quantities
    concerning waveguide propagation, symbols for aerials (antennas),
    symbols for electro-acoustics and symbols for equivalent circuits
    of piezo-electric crystals.
