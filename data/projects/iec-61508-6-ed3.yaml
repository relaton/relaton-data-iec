abstract:
- language: en
  script: Latn
  content: |-
    IEC 61508-6:2026 covers those aspects to be considered when electrical/electronic/programmable electronic (E/E/PE) systems are used to carry out safety functions.<br/>
    A first objective is to facilitate the development of product and application sector international standards by the technical committees responsible for the product or application sector. This will allow all the relevant factors, associated with the product or application, to be fully considered and thereby meet the specific needs of users of the product and the application sector.<br/>
    A second objective is to enable the development of E/E/PE safety-related systems where product or application sector international standards do not exist.<br/>
    The scope of this document is the functional safety for E/E/PE safety-related systems but, apart from normative requirements in the hazard and risk analysis phase, this document does not itself provide normative requirements for malevolent action arising from a security risk.<br/>
    NOTE 1 For requirements and/or guidance on security see the IEC 62443 series and ISO/IEC 27000 series.<br/>
    NOTE 2 For guidance on the coordination between safety and security, refer to IEC TR 63069.<br/>
    This third edition cancels and replaces the second edition published in 2010. This edition constitutes a technical revision.<br/>
    This edition includes the following significant technical changes with respect to the previous edition:<br/>
    a) the following new annexes have been created:<br/>
    1) Annex F gives examples on how to include failures of the diagnostic function in the calculation of the safety parameters;<br/>
    2) Annex G gives guidance on failure rate estimation from field feedback with confidence intervals.<br/>
    3) Annex H gives guidance on robust safety architecture.<br/>
    b) new common cause method on redundancy at PCB device level estimation of β (Clause D.6) and for estimation of β suitable for complex semiconductor (Clause D.7) has been added;<br/>
    c) examples from ISO/TR 12489:2013 have been included (Annex B);<br/>
    d) corrections and explanations have been made related to formulas and their applicability.<br/>
    It has the status of a basic safety publication according to IEC Guide 104 and has been developed according to ISO/IEC Guide 51.
