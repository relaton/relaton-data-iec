abstract:
- language: en
  script: Latn
  content: |-
    IEC 62862-2-2:2026 specifies the technical requirements, test methods, inspection rules, packaging, transportation and storage of molten salt mixtures used for heat transfer and storage in solar thermal power generation systems, in particular nitrate mixtures.<br/>
    This document is applicable to the processing, inspection, operation and maintenance of such molten salt as the medium for heat storage and heat transfer in solar thermal power plants. Other systems using molten salt as the medium for heat storage and heat transfer can be executed by reference.
