abstract:
- language: en
  script: Latn
  content: This technical report, which serves as an application guide for the short-circuit ratings given in IEC standards for low-voltage switchgear and controlgear and assemblies, summarises the definitions of the ratings and provides examples of their application. This edition cancels and replaces the first edition of IEC 61912, published in 2006, and corrigendum 1 (May 2006). The changes are only editorial.
- language: fr
  script: Latn
  content: Le présent rapport technique, qui sert de guide d'application pour les caractéristiques de court-circuit données dans les normes CEI de l'appareillage à basse tension et des ensembles d'appareillage, résume les définitions des caractéristiques et donne des exemples de leur application. Cette édition annule et remplace la première édition de la CEI 61912, publiée en 2006, et le corrigendum 1 (mai 2006).Les modifications ne sont que rédactionnelles.
