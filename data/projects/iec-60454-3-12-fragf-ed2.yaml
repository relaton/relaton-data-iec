abstract:
- language: fr
  script: Latn
  content: |-
    IEC 60454-3-12:2006 contient les exigences pour les rubans en polyéthylène et polypropylène avec des adhésifs sensibles à la pression. Les matériaux conformes à cette spécification satisfont à des niveaux établis de performance. Cependant, il convient que le choix d'un matériau par un utilisateur et pour une application particulière soit fondé sur les exigences réelles nécessaires pour obtenir les performances satisfaisantes pour cette application, et non sur cette seule spécification. Cette deuxième édition de la CEI 60454-3-12 remplace la première édition publiée en 1998 ainsi que la CEI 60454-3-18 publiée en 2003. Elle constitue une révision technique. La présente édition remplace la précédente deuxième édition et son contenu est consolidé avec le texte de la CEI 604564-3-18 (2003).
    Mots clés: rubans en polyéthylène et polypropylene, adhésifs sensibles à la pression
