  script: Latn
  content: S'applique aux sectionneurs de terre à courant alternatif, de tension assignée égale ou supérieure à 52 kV, aptes à établir et couper des courants et tensions induits. Etablit des prescriptions pour la manoeuvre en charge des sectionneurs de terre destinés à la mise à la terre des lignes de transport.
