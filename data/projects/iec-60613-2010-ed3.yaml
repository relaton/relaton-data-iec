abstract:
- language: en
  script: Latn
  content: IEC 60613:2010 applies to X-ray tube assemblies either with a rotating anode X-ray tube or a stationary anode X-ray tube, intended for use in medical diagnosis. For an X-ray tube head, its X-ray tube assembly aspects are also within the scope. IEC 60613:2010 covers performance-related definitions and conditions of electrical and loading characteristics of X-ray tube assemblies in relation to their behaviour during and after energization and, where appropriate, methods of presentation and measurement of these characteristics. This International Standard is therefore relevant for the manufacturer and the responsible organization. This third edition cancels and replaces the second edition of IEC 60613, published in 1989. It constitutes a technical revision. This third edition has been adapted to apply to the present technology.
- language: fr
  script: Latn
  content: La CEI 60613:2010 s'applique aux gaines équipées à tube radiogène à anode tournante ou à tube radiogène à anode fixe, destinées à être utilisées pour le diagnostic médical. Pour une tête de tube radiogène, ses aspects concernant le tube radiogène relèvent également du domaine d'application. La CEI 60613:2010 comprend les définitions et les conditions de performance des caractéristiques électriques et de charge des gaines équipées par rapport à leur comportement pendant et après la mise sous tension avec, si besoin, des méthodes de présentation et de mesure de ces caractéristiques. La présente Norme Internationale est de ce fait utile pour le fabricant et pour l'organisme responsable. Cette troisième édition annule et remplace la deuxième édition de la CEI 60613 publiée en 1989, dont elle constitue une révision technique. Cette troisième édition a été adaptée afin d'appliquer les technologies actuelles.
