abstract:
- language: en
  script: Latn
  content: Applies to microwave and combination microwave ovens for heating food and beverages. These appliances may also use thermal cooking means as employed in conventional cooking ovens. They may also incorporate a browning function. It applies to combination microwave ovens when used in the microwave generating mode only. For safety of microwave ovens, see IEC 60335-2-25 and IEC 60335-2-90.
- language: fr
  script: Latn
  content: S'applique aux fours micro-ondes et aux fours micro-ondes combinés destinés à chauffer des aliments ou des boissons. Ces appareils peuvent aussi être dotés de moyens thermiques de cuisson tels que ceux utilisés dans des fours conventionnels. Ils peuvent également être équipés d'une fonction de brunissement. S'applique aux fours à micro-ondes combinés pour l'utilisation de la seule énergie micro-ondes. Pour des règles de sécurité des fours micor-ondes, voir la CEI 60335-2-25 et la CEI 60335-2-90.
