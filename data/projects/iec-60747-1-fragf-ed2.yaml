abstract:
- language: fr
  script: Latn
  content: |-
    La CEI 60747-1:2006 spécifie les exigences générales applicables aux dispositifs discrets à semiconducteurs et aux circuits intégrés couverts par les autres parties de la CEI 60747 et de la CEI 60748 (voir Annexe A).
    Cette deuxième édition de la CEI 60747-1 annule et remplace la première édition (1983) et ses amendements 1 (1991), 2 (1993) et 3 (1996).
    Les principaux changements par rapport à l'édition précédente sont énumérés ci-dessous:
    a) La terminologie figurant actuellement dans le VEI (ou qui était en contradiction avec le VEI) a été omise.
    b) Les lignes directrices relatives aux valeurs limites et caractéristiques essentielles ont fait l'objet d'une révision générale.
    c) La distinction entre méthodes de mesure générales et de référence a été supprimée.
    d) Un article relatif à l'annonce de suppression d'un produit a été ajouté.
