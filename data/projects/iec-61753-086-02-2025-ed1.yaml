abstract:
- language: en
  script: Latn
  content: |-
    IEC 61753-086-02:2025 contains the minimum initial performance, test and measurement requirements and severities which a fibre optic pigtailed 1 490/1 550 nm downstream and 1 310 nm upstream wide wavelength division multiplexing (WWDM) passive optical network (PON) device will satisfy in order to be categorized as meeting the requirements of category C (indoor controlled environment), as defined in IEC 61753-1:2018, Annex A. WWDM is defined in IEC 62074-1. Annex B gives general information for these PON WWDM devices.<br/>
    This first edition cancels and replaces the first edition of IEC 61753-086-2 published in 2009. This edition constitutes a technical revision. This edition includes the following significant technical changes with respect to the previous edition:<br/>
    a) Change of test conditions harmonizing with IEC 61753-1: 2018.
- language: fr
  script: Latn
  content: |-
    IEC 61753-086-02:2025 La présente partie de l’IEC 61753 contient les exigences minimales initiales de performance, d’essai et de mesure, ainsi que les sévérités auxquelles un dispositif de réseau optique passif (PON, Passive Optical Network) de multiplexage par répartition en longueur d'onde large (WWDM, Wide Wavelength Division Multiplexing) 1 490/1 550 nm en voie descendante et 1 310 nm en voie montante équipé de fibres amorces satisfait pour être classé conforme aux exigences de la catégorie C (environnement intérieur contrôlé), selon la définition donnée à l’Annexe A de l’IEC 61753-1:2018. Le WWDM est défini dans l’IEC 62074-1. L'Annexe B donne des informations générales pour ces dispositifs PON WWDM.<br/>
    Cette première édition annule et remplace la première édition de l'IEC 61753-086-2 parue en 2009. Cette édition constitue une révision technique. Cette édition inclut les modifications techniques majeures suivantes par rapport à l'édition précédente:<br/>
    a) Modification des conditions d'essai pour harmonisation avec l’IEC 61753-1: 2018.
