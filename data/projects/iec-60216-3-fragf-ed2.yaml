abstract:
- language: fr
  script: Latn
  content: La CEI 60216-3:2006 spécifie les méthodes de calcul à utiliser pour obtenir les caractéristiques d'endurance thermique à partir des données expérimentales obtenues conformément aux instructions de la CEI 60216-1 et de la CEI 60216-2, en utilisant des températures de vieillissement fixes et des temps de vieillissement variables. Les données expérimentales peuvent être obtenues en utilisant des essais non destructifs, des essais destructifs et des essais d'épreuve. Les données obtenues à partir d'essais non destructifs ou d'essais d'épreuve peuvent être incomplètes, car la mesure des temps mis pour atteindre le point limite peut avoir été arrêtée à un moment situé après le temps médian, mais avant que toutes les éprouvettes n'aient atteint le point limite. Les méthodes sont illustrées par des exemples pratiques, et des programmes informatiques adaptés sont recommandés pour faciliter les calculs. Les modifications majeures par rapport à la première édition concernent la mise à jour du Tableau C.2. De plus, le domaine d'application a été élargi pour couvrir une plus grande gamme de caractéristiques de données, en particulier en ce qui concerne les données incomplètes, comme cela est souvent le cas pour les données obtenues à partir de critères d'essai d'épreuve. Il convient que cette plus grande souplesse d'utilisation conduise à un emploi plus efficace du temps disponible pour les essais de vieillissement. Enfin, les méthodes spécifiées dans cette partie de la CEI 60216 ont été largement soumises aux essais et ont été utilisées pour calculer les résultats à partir d'un grand nombre de données expérimentales obtenues conformément aux autres parties de la norme. L'Annexe E "Programme informatique" a été complètement remaniée.
