abstract:
- language: en
  script: Latn
  content: |-
    IEC TS 62898-3-5:2026 provides technical requirements for the hardware in the loop testing (HIL), commissioning testing, and periodic testing that allows the verification, and quantification of the performance of microgrid monitoring, control, and energy management systems (MMCS and MEMS). This document applies to MMCS and MEMS developed for grid-connected or isolated microgrids, or both. This document includes the following aspects:<br/>
    - general technical requirements;<br/>
    - hardware in the loop testing;<br/>
    - commissioning testing;<br/>
    - periodic testing.
