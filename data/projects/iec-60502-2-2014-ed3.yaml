abstract:
- language: en
  script: Latn
  content: |-
    IEC 60502-2:2014 specifies the construction, dimensions and test requirements of power cables with extruded solid insulation from 6 kV up to 30 kV for fixed installations such as distribution networks or industrial installations. When determining applications, it is recommended that the possible risk of radial water ingress is considered. Cable designs with barriers claimed to prevent longitudinal water penetration and an associated test are included in this part of IEC 60502. Cables for special installation and service conditions are not included, for example cables for overhead networks, the mining industry, nuclear power plants (in and around the containment area) nor for submarine use or shipboard application. This third edition cancels and replaces the second edition, published in 2005, and constitutes a technical revision. This edition includes the following significant technical changes with respect to the previous edition:<br/>
    a) a simplified calculation procedure for the thickness of the lead sheath and the oversheath;<br/>
    b) a new subclause for the determination of the cable conductor temperature;<br/>
    c) a modified procedure for the routine voltage test;<br/>
    d) a new subclause for a routine electrical test on oversheath;<br/>
    e) modified requirements for the non-metal sheaths including semi-conductive layer;<br/>
    f) modified tolerances for the bending test cylinder;<br/>
    g) the inclusion of a 0,1 Hz test after installation.<br/>
    In addition, the modified structure of the IEC 60811 series has been adopted for this third edition.
- language: fr
  script: Latn
  content: |-
    IEC 60502-2:2014 spécifie la constitution, les dimensions et les exigences d'essais des câbles d'énergie à isolation extrudée par diélectriques massifs, de tensions assignées de 6 kV à 30 kV, pour installations fixes telles que les réseaux de distribution ou les installations industrielles. Pour la conception des câbles, il est recommandé de tenir compte du risque possible d'une entrée d'eau radiale. Les câbles dont la conception est déclarée comporter une barrière d'étanchéité longitudinale à l'eau et les essais qui y correspondent sont inclus dans cette partie de la CEI 60502. Les câbles destinés à des conditions particulières d'installations et de service ne sont pas inclus, par exemple, les câbles pour réseaux aériens, pour l'industrie minière, pour les centrales nucléaires (à l'intérieur et à l'extérieur de l'enceinte de confinement), les câbles sous-marins ou les câbles de bord des navires. Cette troisième édition annule et remplace la deuxième édition publiée en 2005 et constitue une révision technique. Des changements techniques significatifs ont été apportés par rapport à la deuxième édition:<br/>
    a) une procédure de calcul simplifié pour l'épaisseur de la gaine de plomb et de la gaine extérieure;<br/>
    b) un nouveau paragraphe concernant la détermination de la température de l'âme du câble;<br/>
    c) une procédure modifiée des essais individuels de tension;<br/>
    d) un nouveau paragraphe concernant l'essai individuel électrique de la gaine extérieure;<br/>
    e) les exigences modifiées pour les gaines non métalliques y compris une couche semi-conductrice;<br/>
    f) les tolérances modifiées concernant l'essai d'enroulement d'un cylindre d'essai;<br/>
    g) l'ajout d'un essai sous 0,1 Hz après l'installation.<br/>
    De plus, la structure modifiée de la série CEI 60811 est adoptée dans cette troisième édition.
