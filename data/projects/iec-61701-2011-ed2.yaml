abstract:
- language: en
  script: Latn
  content: IEC 61701:2011 describes test sequences useful to determine the resistance of different PV modules to corrosion from salt mist containing Cl- (NaCl, MgCl2, etc.). All tests included in the sequences, except the bypass diode functionality test, are fully described in IEC 61215, IEC 61646, IEC 62108, IEC 61730-2 and IEC 60068-2-52. This Standard can be applied to both flat plate PV modules and concentrator PV modules and assemblies. Salt mist test is based on IEC 60068-2-52 rather than IEC 60068-2-11 as in edition 1 since the former standard is much more widely used in the electronic component field. According to this change the new edition 2 includes a cycling testing sequence that combines in each cycle a salt fog exposure followed by humidity storage under controlled temperature and relative humidity conditions. This testing sequence is more suitable to reflect the corrosion processes that happen in PV modules subjected to permanent or temporary corrosive atmospheres.
- language: fr
  script: Latn
  content: La CEI 61701:2011 décrit des séquences d'essai pour déterminer la résistance de différents modules photovoltaïques à la corrosion due au brouillard salin contenant du Cl- (NaCl, MgCl2, etc.). Tous les essais inclus dans les séquences, à l'exception de l'essai de fonctionnalité des diodes de dérivation, sont décrits de façon détaillée dans les normes CEI 61215, CEI 61646, CEI 62108, CEI 61730-2 et CEI 60068-2-52. La présente Norme peut être appliquée à des modules photovoltaïques plans et à des modules et ensembles photovoltaïques à concentration. L'essai au brouillard salin est basé sur la CEI 60068-2-52 plutôt que sur la CEI 60068-2-11 comme dans l'édition 1 puisque l'ancienne norme est plus largement utilisée dans le domaine des composants électroniques. Conformément à ce changement, la nouvelle édition 2 inclut une séquence d'essai cyclique qui combine dans chaque cycle une exposition au brouillard salin suivie d'un stockage en milieu humide dans des conditions de température et d'humidité relative contrôlées. Cette séquence d'essai reflète mieux les processus de corrosion rencontrés par les modules photovoltaïques soumis à des atmosphères corrosives permanentes ou temporaires (NaCl).
