  script: Latn
  content: La CEI/TS 62504:2011 présente des termes et des définitions concernant l'éclairage avec des sources lumineuses à LED. Elle donne à la fois des termes descriptifs (comme "module de LED incorporé") et des termes mesurables (comme "luminance").
