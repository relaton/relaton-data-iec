abstract:
- language: fr
  script: Latn
  content: La CEI 60384-17:2005 s'applique aux condensateurs fixes à électrodes métallisées et à diélectrique en polypropylène destinés aux équipements électroniques. Les condensateurs équipés à la fois d'électrodes métallisées et d'électrodes en feuille sont également couverts par la présente norme. Ces condensateurs peuvent avoir des propriétés "d'auto-régénération" en fonction des conditions d'utilisation. Les condensateurs couverts par la présente spécification sont principalement destinés à être utilisés dans des applications à impulsions et/ou à tension alternative. La puissance réactive maximale est 10 000 var et la tension de crête maximale est 3 000 V. Cette deuxième édition annule et remplace la première édition parue en 1987. Elle constitue une révision mineure des tableaux, valeurs et références.
