abstract:
- language: en
  script: Latn
  content: |-
    Specifies the performance and type testing of marine automatic radar plotting aids (ARPA) required by Regulation 12 of Chapter V of 'The International Convention for the Safety of Life at Sea' (SOLAS) 1974, as amended.
    Establishes minimum performance standards and methods of testing and required test results for ARPA.
- language: fr
  script: Latn
  content: Précise le comportement et l'essai de type des Aides de Pointage Radar Automatiques pour Navires (APRA) requis par la Règle 12 du chapitre V de la Convention internationale pour la sauvegarde de la vie humaine en mer (SOLAS) 1974, telle qu'amendée. Etablit les normes minimales de fonctionnement, les méthodes d'essai et les résultais d'essai exigibles pour les APRA.
