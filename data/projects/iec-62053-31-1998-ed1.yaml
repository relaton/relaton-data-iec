abstract:
- language: en
  script: Latn
  content: |-
    Applies to passive, two-wire, externally powered pulse output devices to be used in electricity meters as defined by the relevant standards of technical committee 13 as well as future standards for static VA-hour meters. Such pulse output devices are used to transmit pulses to a receiver (e.g. a tariff device).<br/>
    <br/>
    This publication is of high relevance for Smart Grid.
- language: fr
  script: Latn
  content: S'applique aux dispositifs de sortie d'impulsions à deux fils, passifs avec alimentation externe utilisés dans des compteurs d'électricité définis dans les normes du comité d'études 13 s'y rapportant ainsi que dans les normes futures concernant les compteurs statiques de voltampèreheures. De tels dispositifs de sortie d'impulsions sont utilisés pour la transmission d'impulsions à un recepteur (par exemple une unité de commande de tarif).
