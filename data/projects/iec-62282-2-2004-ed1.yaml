abstract:
- language: en
  script: Latn
  content: 'Provides the minimum requirements for safety and performance of fuel cell modules. Applies to fuel cell modules with the following electrolyte chemistry: alkaline; proton exchange membrane (including direct methanol fuel cells); phosphoric acid; molten carbonate; solid oxide fuel cell modules.'
- language: fr
  script: Latn
  content: 'Donne les exigences minimales de sécurité et de performance des modules à piles à combustible. S''applique aux modules à piles à combustible avec les différents types d''électrolytes suivants: alcalins; à membrane échangeuse de protons (y compris piles à combustible à méthanol direct); à acide phosphorique; à carbonates fondus; à oxyde solide.'
