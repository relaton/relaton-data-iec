abstract:
- language: fr
  script: Latn
  content: Le Guide CEI 114:2005 décrit des concepts relatifs à l'intégration des aspects environnementaux dans la conception et le développement de produits électrotechniques. Ce guide est destiné à tous ceux qui sont impliqués dans la conception et le développement de produits - quels que soient le type, la taille, le lieu et la complexité de l'organisme - et ce, pour tout type d'équipement électrique et électronique, nouveau ou modifié. Il a été rédigé pour tous ceux qui sont directement concernés par le processus de développement de produits et pour tous ceux qui sont responsables de la politique et de la prise de décision dans un organisme.
