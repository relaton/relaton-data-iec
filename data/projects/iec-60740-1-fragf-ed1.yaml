abstract:
- language: fr
  script: Latn
  content: |-
    La CEI 60740-1:2005 spécifie les caractéristiques de tôles découpées. Leur utilisation préférentielle porte sur les noyaux de transformateur et d'inductances. Les tôles découpées sont constituées de bandes et de tôles de matériaux magnétiques, spécifiées dans la CEI 60404-8-4 et la CEI 60404-8-7. Les principales modifications sont présentées ci-après:<br/>
    a) gammes avec bandes de tôles découpées YS, YSUI 1, YSUI 2 et tôles découpées YEE 2 -..L ajoutées;<br/>
    b) gamme YEI 1 étendue aux fins de la présente norme;<br/>
    c) gammes YED 2, YEF 2, YEL 2, YES 2, Type YM 1-5a et YM 1-7a annulées;<br/>
    d) désignations nationales annulées;<br/>
    e) caractéristiques électriques pour les tôles découpées spécifiées;<br/>
    f) caractéristiques mécaniques pour les tôles découpées ajoutées;<br/>
    g) trous ajoutés pour les tôles découpées de type YEI 1, YUI 1, YUI 2 et YM 1;<br/>
    h) conversion de la polarisation J et de l'intensité du champ H en une puissance apparente totale spécifique définie à l'Annexe A. Des équations et des constantes sont spécifiées pour les caractéristiques de la puissance réactive et de la perte de puissance.
