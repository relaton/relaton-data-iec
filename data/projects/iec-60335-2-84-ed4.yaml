abstract:
- language: en
  script: Latn
  content: |-
    IEC 60335-2-84:2026 deals with the safety of electrical toilet appliances, in which excrement is stored, dried or destructed or which assist the use of other toilet equipment, their rated voltage being not more than 250 V including direct current (DC) supplied appliances and battery-operated appliances.<br/>
    Examples of such electrical toilets are the following and they can be used to process garbage such as paper and food waste:<br/>
    – mouldering toilets;<br/>
    – package toilets;<br/>
    – freezing toilets;<br/>
    – vacuum toilets.<br/>
    This standard also applies to electrical equipment for use with conventional and electrical toilets.<br/>
    Examples of such electrical appliances are:<br/>
    – automatic seat covering devices;<br/>
    – chopping units;<br/>
    – heated seats;<br/>
    – pumping units;<br/>
    – water heaters for spray seats;<br/>
    – spray seats;<br/>
    – toilet seat lifters.<br/>
    This standard deals with reasonably foreseeable hazards presented by appliances that are encountered by all persons in and around the home. However, in general, it does not take into account children playing with the appliance.<br/>
    For toilet seat lifters, motorized parts are also evaluated according to IEC 60335-2-116.<br/>
    Attention is drawn to the fact that<br/>
    • for appliances intended to be used in vehicles or on board ships or aircraft, additional requirements can be necessary;<br/>
    • in many countries, additional requirements are specified by the national health authorities, the national authorities responsible for the protection of labour, the national water supply authorities and similar authorities.<br/>
    This standard does not apply to:<br/>
    • appliances intended to be used in locations where special conditions prevail, such as the presence of a corrosive or explosive atmosphere (dust, vapour or gas);<br/>
    • chemical toilets;<br/>
    • toilets in which excrement is destructed by combustion;<br/>
    • assistive products for toileting (ISO 17966).<br/>
    This fourth edition cancels and replaces the third edition published in 2019. This edition constitutes a technical revision.<br/>
    This edition includes the following significant technical changes with respect to the previous edition:<br/>
    a) alignment with IEC 60335-1:2020 and IEC 60035-1/AMD1:2025;<br/>
    b) add toilet seat lifters in the scope and relevant requirements in Clause 3, Clause 11 and Clause 21;<br/>
    c) add probe 19 in Clause 8 and Clause 20;<br/>
    d) modify 3.1.9 to move operating time and cycles to Clause 10 and Clause 11;<br/>
    e) modify Table 101 and Table 102 to remove the ambiguity;<br/>
    f) remove 19.101;<br/>
    g) move 22.101 requirement to 6.101;<br/>
    h) move 22.102 requirement to 22.36;<br/>
    i) add earthing requirements of class I spray seats to 27.1;<br/>
    j) modify 31.101 to allow an alternative method.<br/>
    This part 2 is to be used in conjunction with the latest edition of IEC 60335-1 and its amendments unless that edition precludes it; in that case, the latest edition that does not preclude it is used. It was established on the basis of the sixth edition (2020) of that standard.
