abstract:
- language: en
  script: Latn
  content: |-
    This document provides an overview of commonly used technologies used for detecting single photons, and reviews commonly used quantities and measurement methods used to characterize the performance of single-photon detection systems for applications in other quantum technologies.<br/>
    This document does not cover photonic sources, photonic quantum memories, or devices for measuring continuous-variable photonic states, such as squeezed light, except where these are used as components in measurement methods for characterising single-photon detection systems. This document does not establish standardized quantities, metrics, or recommended practices.
