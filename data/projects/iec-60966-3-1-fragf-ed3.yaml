abstract:
- language: fr
  script: Latn
  content: La CEI 60966-3-1:2009 est une spécification particulière-cadre qui concerne les cordons coaxiaux semi-flexibles qui fonctionnent en mode électromagnétique transverse (TEM, Transverse Electromagnetic Mode). La présente spécification particulière-cadre doit être utilisée conjointement avec la deuxième édition de la CEI 60966-1 (1999) et avec la troisième édition de la CEI 60966-3 (2008). La création d'une présentation et d'un type uniformes de spécification particulière est déterminée par l'utilisation d'un modèle de spécification particulière-cadre. La spécification particulière peut être établie par l'insertion de données dans le modèle par l'organisme national de normalisation, par un fabricant agréé ou par un utilisateur (lorsqu'elle est établie par un utilisateur, la spécification particulière doit être soumise à l' organisme national autorisé par un fabricant agréé).
