abstract:
- language: en
  script: Latn
  content: |-
    IEC 61892-2:2026 is applicable to system design of electrical installations and equipment in mobile and fixed offshore units including floating units, pipeline, pumping or "pigging" stations, compressor stations and single buoy moorings, used in the offshore industry for drilling, production, accommodation, processing, storage and offloading purposes.<br/>
    It applies to all installations, whether permanent, temporary, transportable or hand-held, to AC installations and DC installations, without any voltage level limitation. It is possible that referenced equipment standards give voltage level limitations.<br/>
    This fourth edition cancels and replaces the third edition published in 2019. This edition constitutes a technical revision.<br/>
    This edition includes the following significant technical changes with respect to the previous edition:<br/>
    a) Floating units added in Clause 1 Scope<br/>
    b) Minor updates of normative references, terms and definitions<br/>
    c) Requirements added in Subclause 4.9 Alternative sources of electrical power<br/>
    d) Added Subclause 8.3 Split of switchboards and grouping of circuits relevant for ignition source control<br/>
    e) Minor changes to Clause 10 System studies<br/>
    f) Added Subclause 10.5 Switching and equipment insulation study<br/>
    g) Requirements and reference standard added in Subclause 13.5 Communication protocols<br/>
    h) Added information related to Battery Energy Storage Systems (BESS) in Annex F.4
