abstract:
- language: en
  script: Latn
  content: ISO/IEC 18012-3:2025 specifies a lexicon of objects for the interoperability domain (ID). This document specifies ID base objects and their associated properties and input/output event types (i.e. in the form of a list of ID sensor, actuator, and control objects), and object state actions, which can be used to define interoperable application models.
