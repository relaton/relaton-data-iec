abstract:
- language: en
  script: Latn
  content: |-
    IEC 60598-2-2:2023 specifies requirements for recessed luminaires incorporating electric light sources for operation from supply voltages up to 1 000 V. It also specifies requirements for recessed air-handling luminaires for use with a ventilation duct or ventilated space (plenum).<br/>
    This fourth edition cancels and replaces the third edition published in 2011. This edition constitutes a technical revision.<br/>
    This edition includes the following significant technical changes with respect to the previous edition (there are no major technical changes, see Annex D):<br/>
    The requirements specific to recessed luminaries given in IEC 60598-1 are now incorporated in this Part 2-2.<br/>
    The requirements for air-handling luminaires given in IEC 60598-2-19 are now incorporated in this Part 2-2.<br/>
    The references to Part 1 have been updated.
- language: fr
  script: Latn
  content: |-
    L'IEC 60598-2-2:2023 spécifie des exigences pour les luminaires encastrés qui comporte des sources lumineuses électriques, pour un fonctionnement à des tensions d'alimentation jusqu'à 1 000 V. Elle spécifie également des exigences pour les luminaires à circulation d'air encastrés pour un fonctionnement avec un conduit de ventilation ou un espace ventilé (plenum).<br/>
    Cette quatrième édition annule et remplace la troisième édition parue en 2011. Cette édition constitue une révision technique.<br/>
    Cette édition inclut les modifications techniques majeures suivantes par rapport à l'édition précédente (il n'y a aucune modification technique essentielle, voir l’Annexe D):<br/>
    les exigences spécifiques aux luminaires encastrés données dans l'IEC 60598-1 sont désormais intégrées dans la présente Partie 2-2;<br/>
    les exigences relatives aux luminaires à circulation d'air données dans l'IEC 60598-2-19 sont désormais intégrées dans la présente Partie 2-2;<br/>
    les références à la Partie 1 ont été mises à jour.
