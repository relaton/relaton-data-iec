abstract:
- language: en
  script: Latn
  content: Deals with baseband measurements on simulated radio-relay systems which are not directly related to a particular type of signal actually being transmitted. These measurements are carried out typically at the modulator input and the demodulator output points and exclude auxiliary terminal equipment.
- language: fr
  script: Latn
  content: Traite des mesures de bande sur les liaisons simulées qui ne sont pas liées directement à un type particulier de signal effectivement transmis. Ces mesures sont opérées typiquement aux accès d'entrée du modulateur et de sortie du démodulateur, et elles excluent tous matériels terminaux auxiliaires.
