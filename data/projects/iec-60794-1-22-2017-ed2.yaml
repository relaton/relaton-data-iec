abstract:
- language: en
  script: Latn
  content: |-
    IEC 60794-1-22:2017 defines test procedures to be used in establishing uniform requirements for the environmental performance of:<br/>
    - optical fibre cables for use with telecommunication equipment and devices employing similar techniques, and<br/>
    - cables having a combination of both optical fibres and electrical conductors.<br/>
    Throughout this document, the wording "optical cable" can also include optical fibre units, microduct fibre units, etc. See IEC 60794-1-2 for a reference guide to test methods of all types and for general requirements and definitions. This second edition cancels and replaces the first edition published in 2012. It constitutes a technical revision. This second edition includes the following significant technical changes with respect to the previous edition:<br/>
    - new test method designation F16 – Compound flow (drip) [E14 in IEC 60794-1-21];<br/>
    - new test method F17 – Cable shrinkage test (fibre protrusion);<br/>
    - new test method F18 – Mid-span temperature cycling test.<br/>
    Keywords: optical fibre cables for use with telecommunication equipment
- language: fr
  script: Latn
  content: |-
    IEC 60794-1-22:2017 définit les modes opératoires d’essai ŕ utiliser pour définir des exigences harmonisées pour les performances environnementales<br/>
    - des câbles à fibres optiques destinés à ętre utilisés avec les équipements et dispositifs de télécommunications employant des techniques similaires, et<br/>
    - des câbles combinant fibres optiques et conducteurs électriques.<br/>
    Dans la présente norme, le terme «câble optique» peut également englober les unités de fibres optiques, les unités de fibres en microconduit, etc. Se reporter à l’IEC 60794-1-2 comme guide de référence des méthodes d’essai de tous types, et pour consulter les exigences générales et les définitions. Cette deuxième édition annule et remplace la première édition parue en 2012. Cette édition constitue une révision technique. Cette deuxième édition inclut les modifications techniques majeures suivantes par rapport à l'édition précédente:<br/>
    a) nouvelle désignation de la méthode d’essai F16 – Ecoulement (égouttement) des matériaux<br/>
    de remplissage [E14 dans l'IEC 60794-1-21],<br/>
    b) nouvelle méthode d’essai F17 – Essai de rétraction du câble (excroissance des fibres),<br/>
    c) nouvelle méthode d’essai F18 – Essai de cycles de température à mi-portée.<br/>
    Mots clés: des câbles à fibres optiques destinés à ętre utilisés avec les équipements et dispositifs de télécommunication
