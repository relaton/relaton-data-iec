  content: 'IEC PAS 63441:2022 defines the functional architecture and functional model of the Industrial Internet System for industrial applications. It presents the models, structures, activities, and interaction contents between layers of the end, edge, and cloud: infrastructure as a service (IaaS), platform as a service (PaaS), and software as service (SaaS), respectively.'
