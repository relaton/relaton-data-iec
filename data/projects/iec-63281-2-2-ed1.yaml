abstract:
- language: en
  script: Latn
  content: |-
    IEC 63281-2-2:2026 specifies safety requirements and test methods for autonomous cargo e Transporters (ACeTs).<br/>
    ACeTs are primarily controlled electrically or electronically for either speed or steering, or both autonomously without human intervention. Even if in case of over the operational preconditions, an authorized users can operate remotely for the ACeTs manually via an external systems or supplementary telecommunication control devices. It operates in an Operational Design Domain for ACeTs (ODDa) specified by a manufacturer where designated public road environments include public access spaces that are not public road environment such as big shopping mall, airport facilities, big building corridor.<br/>
    This document specifies safety requirements and test methods for autonomous cargo e-transporters. <br/>
    This document is applicable to application of an ACeTs include use-cases when a remote monitoring operator is remote-operating directly by an authorized user using either wireless system or supplemental operating devices, or both from the outside. ACeTs are designed for direct delivery of cargo and can be for private or commercial use. ACeTs are intended for use cargo delivery services provided by user themselves or by service providers.<br/>
    This document does not apply to:<br/>
    – ACeTs are to be driven by on boarded driver,<br/>
    – ACeTs are equipped without autonomous driving functions,<br/>
    – ACeTs are equipped with propulsion drive assist or propulsion drive power input,<br/>
    – ACeTs are equipped with function to loading and unloading cargo by themselves,<br/>
    – Usage applications for on boarded passengers transporting,<br/>
    – Usage applications for hazardous good or special material loads transporting.<br/>
    Hazardous good or materials requiring special controls are explosive materials, radioactive controlled materials, biohazardous materials, pressure vessels and high heat source objects, opioid such as morphine and toxic substances.<br/>
    Similar products of e-Transporters such as mobile service robots, electrically-powered bicycles, mopeds, motorcycles and driverless cars they are handled by other TCs:<br/>
    – ISO TC 22,<br/>
    – IEC TC 69,<br/>
    – ISO TC 110,<br/>
    – ISO TC 149,<br/>
    – ISO TC 299.
