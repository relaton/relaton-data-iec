abstract:
- language: en
  script: Latn
  content: |-
    IEC/TR 61156-1-3:2011(E) is a supplement to IEC 61156-1 Edition 3 (2007): Multicore and symmetrical pair/quad cables for digital communications - Part 1: Generic specification. It covers the following topics:<br/>
    - the near-end crosstalk test methods and length correction procedures of 6.3.5;<br/>
    - the far-end crosstalk test methods and length correction procedures of 6.3.6;<br/>
    - the concatenation of measured cable segments, even if they are of different design.
