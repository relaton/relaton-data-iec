abstract:
- language: fr
  script: Latn
  content: |-
    La CEI 61061-1:2006 comprend les définitions nécessaires à la compréhension des trois parties de la norme, la désignation des types de matériaux et les exigences générales applicables aux stratifiés de bois densifié, non imprégnés, à usages électriques. La présente spécification est prévue pour s'appliquer uniquement aux planches et aux anneaux d'épaisseurs nominales comprises entre 6 mm et 100 mm inclus. Les principales modifications suivantes ont été apportées par rapport à l'édition précédente:<br/>
    - ajout des cas d'emploi et des déclarations de sécurité;<br/>
    - redéfinition de l'anneau et de la planche;<br/>
    - ajouts pertinents aux paragraphes;<br/>
    - remise en forme du texte pour l'aligner sur le format actuel des documents CEI.
