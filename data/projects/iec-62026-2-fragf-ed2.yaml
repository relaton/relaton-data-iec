abstract:
- language: fr
  script: Latn
  content: |-
    La CEI 62026-2 :2008  spécifie une méthode de communication entre un seul appareil de commande et des éléments de commutation. Elle établit un système d'interopérabilité pour les composants équipés des interfaces de communication spécifiées. Le système complet est appelé "Interface capteur-actionneur (AS-i)".
    Cette deuxième édition de la CEI 62026-2 annule et remplace la première édition parue en 2000. Cette deuxième édition constitue une révision technique.
    Les principales modifications apportées par rapport à l'édition précédente sont indiquées ci-dessous: -doublement du nombre d'esclaves, passant de 31 à 62, par l'introduction de sous-adresses; -introduction du système de sécurité AS-I.
    La présente version bilingue, publiée en 2009-08, correspond à la version anglaise.
    La version française de cette norme n'a pas été soumise au vote.
