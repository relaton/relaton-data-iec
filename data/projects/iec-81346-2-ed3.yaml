abstract:
- language: en
  script: Latn
  content: |-
    IEC 81346-2:2026 establishes classification schemes with defined object classes and their associated letter codes. The codes are primarily intended for use in reference designations and for designation of generic types.<br/>
    The classification schemes are applicable for objects in all technical disciplines and all branches of industry.<br/>
    IEC 81346-2:2026 has the status of a horizontal standard in accordance with IEC Guide 108. It is also intended for use by technical committees in preparation of publications related to reference designations in accordance with the principles laid down in IEC Guide 108.<br/>
    IEC 81346-2:2026 cancels and replaces the second edition published in 2019. This edition constitutes a technical revision.<br/>
    This edition includes the following significant technical changes with respect to the previous edition:<br/>
    a) existing class definitions have been reviewed and further clarified;<br/>
    b) Table 2 in this document has been updated to include the information from Table 3 in the previous edition;<br/>
    c) Table 2 in this document has been further updated with the addition of new classes, modification of class names, and identification of obsolete classes;<br/>
    d) Table 4 in the previous edition is moved to become Table 5 in this document and has been updated with the addition of new classes, modification of class names, and identification of obsolete classes;<br/>
    e) additional examples have been added to several classes;<br/>
    f)new classification schemes for construction complexes and construction entities have been added as Table 3 and Table 4, respectively, intended to replace the classification tables in ISO 81346-10:2022, Annex C;<br/>
    g) the former Clause 7 "Classification of objects applicable for infrastructure" and the former Annex C "Object classes related to objects in a generic infrastructure" have been deleted following the publication of ISO 81346-10, ISO 81346-12 and IEC 81346-14;<br/>
    h) the former Annex D "Comparison between Tables 1, 2 and 3 of IEC 81346-2:2019 and Tables 1 and 2 of IEC 81346-2:2009" has been deleted as this document is a revision of IEC 81346-2:2019 and therefore not necessary to maintain.
- language: fr
  script: Latn
  content: |-
    L’IEC 81346-2:2026, publiée conjointement par l’IEC et l’ISO, établit des plans de classement et définit les classes d’objets ainsi que leurs codes lettres associés. Les codes sont principalement destinés à être utilisés dans les désignations de référence et pour la désignation des types génériques.<br/>
    Les plans de classement s’appliquent aux objets appartenant à toutes les disciplines techniques ainsi qu’à toutes les branches d’industrie.<br/>
    Le présent document est également une publication horizontale destinée à être utilisée par les comités d’études pour l’établissement de publications liées aux désignations de référence conformément aux principes exposés dans le Guide 108 de l’IEC.<br/>
    Cette troisième édition annule et remplace la deuxième édition parue en 2019. Cette édition constitue une révision technique.<br/>
    Cette édition inclut les modifications techniques majeures suivantes par rapport à l’édition précédente:<br/>
    a) les définitions des classes existantes ont été revues et clarifiées;<br/>
    b) le Tableau 2 du présent document a été mis à jour pour inclure les informations du Tableau 3 de l’édition précédente;<br/>
    c) le Tableau 2 du présent document a également été mis à jour avec l’ajout de nouvelles classes, la modification des noms de classes et l’identification des classes obsolètes;<br/>
    d) le Tableau 4 de l’édition précédente a été déplacé pour devenir le Tableau 5 dans le présent document et a été mis à jour avec l’ajout de nouvelles classes, la modification des noms de classes et l’identification des classes obsolètes;<br/>
    e) des exemples supplémentaires ont été ajoutés à plusieurs classes;<br/>
    f) de nouveaux plans de classement pour les complexes de construction et les entités de construction ont été ajoutés, respectivement en tant que Tableau 3 et Tableau 4, afin de remplacer les tableaux de classement de l’ISO 81346‑10:2022, Annexe C;<br/>
    g) l’ancien Article 7 "Classification des objets en fonction de l’infrastructure" et l’ancienne Annexe C "Classes d’objets en relation avec les objets dans une infrastructure générique" ont été supprimés à la suite de la publication de l’ISO 81346-10, l’ISO 81346-12 et l’IEC 81346-14;<br/>
    h) l’ancienne Annexe D "Comparaison entre les Tableaux 1, 2 et 3 de l’IEC 81346-2:2019 et les Tableaux 1 et 2 de l’IEC 81346-2:2009" a été supprimée car le présent document est une révision de l’IEC 81346-2:2019 et qu’il n’est donc pas nécessaire de la maintenir à jour.
