abstract:
- language: en
  script: Latn
  content: |-
    IEC 62541-100:2015 is an extension of the overall OPC Unified Architecture standard series and defines the information model associated with Devices. This part of IEC 62541 describes three models which build upon each other:<br/>
    - the (base) Device Model intended to provide a unified view of devices;<br/>
    - the Device Communication Model which adds Network and Connection information elements so that communication topologies can be created;<br/>
    - the Device Integration Host Model finally which adds additional elements and rules required for host systems to manage integration for a complete system. It allows reflecting the topology of the automation system with the devices as well as the connecting communication networks.
- language: fr
  script: Latn
  content: |-
    L'IEC 62541-100:2015 est une extension de la série globale de normes de l'OPC UA (architecture unifiée OPC) et définit le modèle d'information associé aux Appareils. La présente spécification décrit trois modèles qui se construisent les uns sur les autres:<br/>
    - le Modèle d'appareils (de base) vise à fournir une vue unifiée des appareils;<br/>
    - le Modèle de communication d'appareils ajoute des éléments informationnels relatifs au réseau et à la connexion;<br/>
    - le Modèle d'hôte d'intégration d'appareils enfin ajoute des éléments et des règles complémentaires qui sont requis pour que les systèmes gèrent l'intégration pour un système complet. Il permet de refléter la topologie du système d'automation avec les appareils ainsi que les réseaux de communication qui se connectent.
