abstract:
- language: fr
  script: Latn
  content: 'L''IEC 61158-5-19:2007 défini les services fournis à l''utilisateur de FAL à la frontière entre l''utilisateur et la couche application du modèle de référence de bus de terrain, et la gestion des systèmes au niveau de la frontière entre la couche application et la gestion des systèmes selon le Modèle de référence de bus de terrain. Elle spécifie la structure et les services de la couche application des bus de terrain, en conformité avec le Modèle de référence de base de l''OSI (ISO/CEI 7498) et la structure de la couche application de l''OSI (ISO/CEI 9545). Cette première édition et les autres normes de la sous-partie CEI 61158-5 annulent et remplacent la CEI 61158-5:2003. Cette édition de la présente partie constitue un ajout technique. La présente partie ainsi que les normes connexes traitant du Type 19 annulent et remplacent également la CEI/PAS 62410, parue en 2005. Elle inclut les modifications suivantes: suppression de l''ancien bus de terrain de Type 6, qui n''est plus adapté au marché; ajout de nouveaux types de bus de terrain; éclatement de la partie 5 de la troisième édition en plusieurs parties numérotées-5-2, -5-3,   La présente version bilingue (2014-06) correspond à la version anglaise monolingue publiée en 2007-12.'
