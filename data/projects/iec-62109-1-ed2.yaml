abstract:
- language: en
  script: Latn
  content: |-
    IEC 62109-1:2026 provides general requirements applicable to all types of power conversion equipment (PCE) for use in photovoltaic (PV) systems where a uniform technical level with respect to safety is necessary. This document defines the minimum requirements for PCE regarding protection against electric shock, energy, fire, mechanical and other hazards. This document covers PCE with inputs and outputs with system voltages not exceeding the low voltage limits of 1 500 V DC and 1 000 V AC, line to line and line to earth, including PV, battery, mains and non-mains AC systems, or other sources. Where a PV combiner is integrated into a PCE, the combiner is considered a part of the PCE and this document applies.<br/>
    The purpose of the requirements of this Part 1 of IEC 62109 is to ensure that the design and methods of construction used in PV PCE provide adequate protection for the operator and the surrounding area against:<br/>
    - electric shock and energy hazards;<br/>
    - mechanical hazards;<br/>
    - excessive temperature hazards;<br/>
    - spread of fire from the equipment;<br/>
    - chemical hazards;<br/>
    - sonic pressure hazards;<br/>
    - liberated fluids, gases and explosion hazards.<br/>
    <br/>
    This second edition cancels and replaces the first edition published in 2010. This edition includes the following significant technical changes with respect to the previous edition:<br/>
    - Scope: Removes handheld and transportable equipment.<br/>
    - PV safety: New requirements for earth faults and arc faults.<br/>
    - Backfeed: Updated requirements for reverse current and voltage backfeed.<br/>
    - Electrical safety: Updated requirements for shock protection, touch current and live parts.<br/>
    - Protection devices: New and updated requirements for switches, disconnectors and circuit breakers.<br/>
    - Insulation: Updated requirements for clearance, creepage and insulation.<br/>
    - Outdoor equipment: Updated requirements for environmental and water/dust protection.<br/>
    - PV &amp; batteries: New/updated requirements for PV and battery circuits and batteries.<br/>
    - Isolation: Updated requirements for isolating equipment from power sources.<br/>
    - Functional safety: Expanded requirements covering both software and hardware.<br/>
    - Testing: New and updated safety and electrical tests.<br/>
    - New risk: Added requirements addressing gas build-up and possible explosion risks.
- language: fr
  script: Latn
  content: |-
    IEC 62109-1:2026 fournit des exigences générales applicables à tous les types d'équipements de conversion de puissance (PCE, Power Conversion Equipment) utilisés dans les systèmes photovoltaïques (PV) nécessitant un niveau technique uniforme en matière de sécurité. Le présent document définit les exigences minimales applicables aux PCE en ce qui concerne la protection contre les chocs électriques, les risques liés à l'électricité, les incendies, les dangers mécaniques et autres dangers.<br/>
    Le présent document couvre les PCE dont les entrées et les sorties ont des tensions réseau qui ne dépassent pas les limites de basse tension de 1 500 V en courant continu et 1 000 V en courant alternatif, entre phases et entre phases et terre, y compris les systèmes PV, les batteries, les systèmes à courant alternatif raccordés ou non au réseau d'alimentation, ou d'autres sources. Lorsqu'un combinateur PV est intégré dans un PCE, le combinateur est considéré comme faisant partie du PCE et le présent document s'applique.<br/>
    L'objectif des exigences de la présente Partie 1 de l'IEC 62109 est d'assurer que la conception et les méthodes de construction utilisées pour les PCE PV procurent une protection suffisante de l'opérateur et de son environnement proche, notamment contre:<br/>
     -les chocs électriques et les dangers liés à l'électricité;<br/>
    - les dangers mécaniques;<br/>
    - les dangers liés aux températures extrêmes;<br/>
    - la propagation d'incendie à partir de l'équipement;<br/>
    - les dangers chimiques;<br/>
    - les dangers liés à la pression acoustique;<br/>
    - les dangers liés à une explosion, à la libération de gaz et de liquides.<br/>
    <br/>
    Cette édition inclut les modifications techniques majeures suivantes par rapport à l'édition précédente: suppression des équipements transportables et portatifs du Domaine d'application, ainsi que des exigences spécifiques qui s'y rapportent;<br/>
    - Domaine d’application : Les matériels tenus à la main et transportables sont exclus.<br/>
    - Sécurité photovoltaïque : Nouvelles exigences relatives aux défauts à la terre et aux défauts d’arc.<br/>
    - Retour d’alimentation : Mise à jour des exigences relatives aux courants inverses et au retour de tension.<br/>
    - Sécurité électrique : Mise à jour des exigences relatives à la protection contre les chocs électriques, aux courants de contact et aux parties actives.<br/>
    - Appareils de protection et de coupure : Nouvelles exigences et exigences mises à jour relatives aux interrupteurs, aux sectionneurs et aux disjoncteurs.<br/>
    - Isolation électrique : Mise à jour des exigences relatives aux distances d’isolement, aux lignes de fuite et à l’isolation.<br/>
     « Ligne de fuite » est bien le terme français employé par le Vocabulaire électrotechnique international pour “creepage distance”.<br/>
    - Matériels destinés à une utilisation en extérieur : Mise à jour des exigences relatives aux conditions environnementales et à la protection contre la pénétration d’eau et de poussière.<br/>
    - Systèmes photovoltaïques et batteries : Nouvelles exigences et exigences mises à jour relatives aux circuits photovoltaïques, aux circuits de batteries et aux batteries.<br/>
    - Séparation des sources d’alimentation : Mise à jour des exigences relatives à la séparation des matériels de leurs sources d’alimentation.<br/>
    - Sécurité fonctionnelle : Extension des exigences afin de couvrir le logiciel et le matériel.<br/>
    - Essais : Nouveaux essais et mise à jour des essais de sécurité et des essais électriques.<br/>
    - Nouveau risque : Ajout d’exigences relatives à l’accumulation de gaz et aux risques d’explosion qui peuvent en résulter.
