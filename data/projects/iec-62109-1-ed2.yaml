abstract:
- language: en
  script: Latn
  content: "IEC 62109-1:2026 provides general requirements applicable to all types of power conversion equipment (PCE) for use in photovoltaic (PV) systems where a uniform technical level with respect to safety is necessary. This document defines the minimum requirements for PCE regarding protection against electric shock, energy, fire, mechanical and other hazards. This document covers PCE with inputs and outputs with system voltages not exceeding the low voltage limits of 1 500 V DC and 1 000 V AC, line to line and line to earth, including PV, battery, mains and non-mains AC systems, or other sources. Where a PV combiner is integrated into a PCE, the combiner is considered a part of the PCE and this document applies.<br />\r\nThe purpose of the requirements of this Part 1 of IEC 62109 is to ensure that the design and methods of construction used in PV PCE provide adequate protection for the operator and the surrounding area against:<br />\r\n- electric shock and energy hazards;<br />\r\n- mechanical hazards;<br />\r\n- excessive temperature hazards;<br />\r\n- spread of fire from the equipment;<br />\r\n- chemical hazards;<br />\r\n- sonic pressure hazards;<br />\r\n- liberated fluids, gases and explosion hazards.<br />\r\n<br />\r\nThis second edition cancels and replaces the first edition published in 2010. This edition includes the following significant technical changes with respect to the previous edition:<br />\r\n- Scope: Removes handheld and transportable equipment.<br />\r\n- PV safety: New requirements for earth faults and arc faults.<br />\r\n- Backfeed: Updated requirements for reverse current and voltage backfeed.<br />\r\n- Electrical safety: Updated requirements for shock protection, touch current and live parts.<br />\r\n- Protection devices: New and updated requirements for switches, disconnectors and circuit breakers.<br />\r\n- Insulation: Updated requirements for clearance, creepage and insulation.<br />\r\n- Outdoor equipment: Updated requirements for environmental and water/dust protection.<br />\r\n- PV & batteries: New/updated requirements for PV and battery circuits and batteries.<br />\r\n- Isolation: Updated requirements for isolating equipment from power sources.<br />\r\n- Functional safety: Expanded requirements covering both software and hardware.<br />\r\n- Testing: New and updated safety and electrical tests.<br />\r\n- New risk: Added requirements addressing gas build-up and possible explosion risks."
