abstract:
- language: en
  script: Latn
  content: |-
    IEC 60794-1-122:2026 specifies the test procedures used to establish uniform requirements for optical fibre cables on the mechanical properties. This document is used to check the buffered fibre movement under compression in optical fibre cables for use in patch cords. This document applies to optical fibre cables for use with telecommunication equipment and devices employing similar techniques, and to cables having a combination of both optical fibres and electrical conductors.<br/>
    IEC 60794-1-122:2026 cancels and replaces Method E22 of the first edition of IEC 60794-1-21 published in 2015. This edition includes the following significant technical changes with respect to IEC 60794-1-21:2015:<br/>
    a) addition of "11 Details to be reported".
- language: fr
  script: Latn
  content: |-
    L'IEC 60794-1-122:2026 spécifie les procédures d’essais utilisées afin d'établir des exigences uniformes relatives aux câbles à fibres optiques en ce qui concerne les caractéristiques mécaniques. Le présent document est utilisé pour vérifier le mouvement des fibres sous revêtement protecteur sous l’effet d’une compression dans les câbles à fibres optiques utilisés comme cordons de brassage. Le présent document s’applique aux câbles à fibres optiques destinés à être utilisés dans les équipements de télécommunications et les dispositifs qui utilisent des techniques analogues, ainsi qu'aux câbles constitués de fibres optiques d'une part et de conducteurs électriques d'autre part.<br/>
    L'IEC 60794-1-122:2026 annule et remplace la Méthode E22 de la première édition de l'IEC 60794-1-21 parue en 2015. Cette édition inclut les modifications techniques significatives suivantes par rapport à l’IEC 60794‑1‑21:2015:<br/>
    a) ajout de l'Article 11 "Informations détaillées à consigner".
