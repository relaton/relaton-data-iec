abstract:
- language: fr
  script: Latn
  content: |-
    La CEI 61810-7:2006 énonce les procédures d'essai et de mesure pour les relais élémentaires électromécaniques. Elle couvre d'une manière générale tous les types de relais élémentaires électromécaniques. Des exigences complémentaires peuvent être nécessaires pour des conceptions ou des applications particulières. Les procédures d'essai et de mesure selon la présente norme sont décrites sous forme de dispositions individuelles couvrant une exigence spécifique. Pour les combiner avec un programme d'essai, on doit prendre soin (par un regroupement approprié des relais soumis à essai, par exemple) de s'assurer que des essais antérieurs ne dévaluent pas des essais postérieurs. Cette deuxième édition annule et remplace la première édition parue en 1997. Cette deuxième édition constitue une révision technique. Cette nouvelle édition a été révisée dans les buts suivants:<br/>
    - mettre à jour toutes les références normatives,<br/>
    - adapter son contenu aux éditions les plus récentes des autres parties de la série de normes de base relatives aux relais (CEI 61810-1 et CEI 61810-2),<br/>
    - établir la cohérence avec d'autres normes CEI (de la série CEI 60068-2, par exemple),<br/>
    - améliorer les procédures d'essai et de mesure, s'il y a lieu,<br/>
    - supprimer les essais qui ne sont plus utilisés dans le cas des relais élémentaires pour application industrielle.
