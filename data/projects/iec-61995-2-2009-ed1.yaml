abstract:
- language: en
  script: Latn
  content: |-
    IEC 61995-2:2009 which is to be read in conjunction with IEC 61995-1, applies to devices for the connection of luminaires (DCL) 250 V, 6 A a.c. intended for household and similar purposes, for the electrical connection to final circuits rated not more than 16 A, without providing mechanical support for the luminaire.<br/>
    <br/>
    This publication is to be read in conjunction with IEC 61995-1:2005.
- language: fr
  script: Latn
  content: |-
    La CEI 61995-2:2009 qui est à lire conjointement avec la CEI 61995-1, s'applique à des dispositifs de connexion pour luminaires (DCL) 250 V, 6 A courant alternatif, prévus pour un usage domestique et analogue et pour le raccordement à des circuits finaux de courant assigné inférieur ou égal à 16 A, sans fourniture de support mécanique du luminaire.<br/>
    <br/>
    Cette publication doit être lue conjointement avec la IEC 61995-1:2005.
