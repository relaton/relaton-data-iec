abstract:
- language: fr
  script: Latn
  content: La CEI 62571:2011 définit les exigences et formule des recommandations à l'intention des éditeurs, développeurs de logiciels, fournisseurs de contenu et fabricants de matériel sur la structure de données, les exigences en facilité d'utilisation, les systèmes de lecture et les systèmes de remise des livres audio au format de fichier numérique. Il convient de noter que dans l'ensemble de cette Norme internationale, le terme livre audio désigne un fichier audio ou un assemblage de fichiers audio contenant surtout du langage parlé, fichiers lus ou linéairement ou dans un ordre spécifié. Donc, de l'audio fait de mots parlés avec de la musique de temps en temps, de narration d'articles de journaux, et d'autres discours de ce genre, est dans cette norme considéré comme livre audio. La présente version bilingue, publiée en 2011-07, correspond à la version anglaise.
