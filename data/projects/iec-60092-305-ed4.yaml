abstract:
- language: en
  script: Latn
  content: |-
    IEC 60092-305:2026 is applicable to the installation of all fixed position storage batteries up to 1 500 V DC of all types, sizes, and chemistries for use in or on ships.<br/>
    This document is not applicable to portable batteries and to primary cells.<br/>
    This fourth edition cancels and replaces the third edition published in 1980, Amendment 1:1989. This edition constitutes a technical revision.<br/>
    This edition includes the following significant technical changes with respect to the previous edition:<br/>
    a) Complete revised version.<br/>
    b) Implementing different battery systems
