abstract:
- language: fr
  script: Latn
  content: La CEI 61784-3:2007 définit des principes communs pouvant être appliqués pour la transmission des messages propres à la sécurité entre les participants d'un réseau réparti, en utilisant la technologie de bus de terrain conformément aux exigences de la série CEI 61508 concernant la sécurité fonctionnelle. Ces principes peuvent être utilisés dans diverses applications industrielles, telles que la commande de processus, l'usinage automatique et les machines.
