abstract:
- language: en
  script: Latn
  content: |-
    IEC 63555:2026 specifies performance requirements for LED light sources connected to a DC supply of up to 1 500 V or an AC supply of up to 1 000 V. This document specifies requirements and test methods for electrical, photometric, colorimetric and dimensional characteristics.<br/>
    This document covers LED light sources that produce light with a correlated colour temperature typically between 2 200 and 6 500 K, based on inorganic LED technology.<br/>
    This first edition cancels and replaces IEC 62612:2013, IEC 62612:2013/AMD1:2015, IEC 62612:2013/AMD2:2018, IEC 62717:2014, IEC 62717:2014/AMD1:2015 and IEC 62717:2014/AMD2:2019. This edition constitutes a technical revision.<br/>
    This edition includes the following significant technical changes with respect to IEC 62612:2013, IEC 62612:2013/AMD1:2015, IEC 62612:2013/AMD2:2018, IEC 62717:2014, IEC 62717:2014/AMD1:2015 and IEC 62717:2014/AMD2:2019:<br/>
    a) IEC 62612 and IEC 62717 have been merged into an LED light source standard;<br/>
    b) the luminous flux maintenance requirements have been fully reviewed and moved to an informative annex (Annex K – Luminous flux maintenance at 3 000 h) and the test time reduced to 3 600 h;<br/>
    c) the lumen maintenance code has been deleted;<br/>
    d) sample sizes have been fully reviewed and a new informative Annex M – Verification testing has been introduced;<br/>
    e) Symbols u',v' and Duv have been introduced;<br/>
    f) relevancy of the endurance test reviewed and considered no longer relevant for the market as part of this document.
