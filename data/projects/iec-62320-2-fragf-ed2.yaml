abstract:
- language: en
  script: Latn
  content: |-
    IEC 62320-2:2016 is available as IEC 62320-2:2016 RLV which contains the International Standard and its Redline version, showing all changes of the technical content compared to the previous edition.<br/>
    <br/>
    IEC 62320-2:2016 specifies the operational and performance requirements, methods of testing and required test results for AIS AtoN Stations compatible with the performance standards adopted by IMO Resolution MSC.74(69), Annex 3, Universal AIS. It incorporates the technical characteristics of non-shipborne AIS AtoN equipment, included in Recommendation ITU-R M.1371 and IALA Recommendation A-126. Where applicable, it also takes into account the ITU Radio Regulations. This standard takes into account other associated IEC International Standards and existing national standards, as applicable. This document is applicable for automatic identification system (AIS) installations on aids to navigation (AtoN). This edition includes the following significant technical changes with respect to the previous edition:<br/>
    - additional cyber security measures;<br/>
    - updated description of configuration via VDL;<br/>
    - updated VDL access scheme requirements;<br/>
    - new PI sentences and VDL message structures with added description for optional TAG blocks;<br/>
    - added requirement for at least one standard method for configuration using Standard PI sentences;<br/>
    - updated test methods and updated Annexes.
- language: fr
  script: Latn
  content: |-
    L'IEC 62320-2:2016 spécifie les exigences opérationnelles et de fonctionnement, les méthodes d'essai et les résultats d’essai exigés applicables aux stations d'aides à la navigation AIS compatibles avec les normes de fonctionnement adoptées par la Résolution MSC.74(69) de l'OMI (Annexe 3, AIS universel). Elle comprend les caractéristiques techniques des matériels AIS d'aides à la navigation non embarqués, figurant dans la Recommandation UIT-R M.1371 et la Recommandation A-126 de l'AISM. Le cas échéant, elle prend également en compte le Règlement des radiocommunications de l'UIT. La présente norme tient compte des autres normes internationales IEC associées et des normes nationales existantes, selon le cas.<br/>
    Le présent document s'applique aux installations de systèmes d'identification automatique (AIS – automatic identification system) dédiées aux aides à la navigation (AtoN – aids to navigation).<br/>
    Cette deuxième édition annule et remplace la première édition parue en 2008. Cette édition constitue une révision technique.<br/>
    Cette édition inclut les modifications techniques majeures suivantes par rapport à l'édition précédente:<br/>
    - des mesures de cybersécurité supplémentaires;<br/>
    - mise à jour de la description de configuration via la VDL;<br/>
    - mise à jour des exigences concernant les modes d'accès VDL;<br/>
    - de nouvelles sentences PI et de nouvelles structures de messages VDL avec ajout d'une description des blocs TAG facultatifs;<br/>
    - ajout d’une exigence concernant au moins une méthode de configuration type à l'aide de sentences PI types;<br/>
    - mise à jour des méthodes d'essai et des annexes.
