abstract:
- language: en
  script: Latn
  content: Specifies techniques for availability performance testing of frequently maintained items when the availability performance measure used is either steady-state availability or steady-state unavailability. Applies to compliance testing of the steady-state availability.
- language: fr
  script: Latn
  content: Spécifie les techniques permettant de tester les caracté-ristiques de disponibilité d'entités fréquemment maintenues quand la mesure de la disponibilité utilisée est soit une disponibilité en régime établi, soit une indisponibilité en régime établi. S'applique aux essais de conformité de la disponibilité en régime établi.
