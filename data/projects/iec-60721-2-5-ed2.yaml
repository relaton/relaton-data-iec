abstract:
- language: en
  script: Latn
  content: |-
    IEC 60721-2-5:2026 presents information related to the occurrence and characteristics of dust, sand and salt mist. It describes the influences from these environmental factors to which products are liable to be exposed during storage, transportation and use. The effects of dust, sand and salt mist can be enhanced by precipitation and wind.<br/>
    Information related to the occurrence and characteristics of precipitation and wind is provided in IEC 60721-2-2.<br/>
    This second edition cancels and replaces the first edition published in 1991. This edition constitutes a technical revision.<br/>
    This edition includes the following significant technical changes with respect to the previous edition:<br/>
    a) the information provided in the previous edition has been extensively enhanced and revised;<br/>
    b) new guidance information on methodologies for deriving dust and sand severities has been included;<br/>
    c) Annex A has been removed because, despite extensive investigation, the source and accuracy of the severities could not be verified; equivalent information is now provided within the text.
