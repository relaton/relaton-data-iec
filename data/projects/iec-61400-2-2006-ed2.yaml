abstract:
- language: en
  script: Latn
  content: |-
    Deals with safety aspects, quality assurance, and engineering integrity and specifies requirements for the safety of small wind turbines including design, installation, maintenance and operation under specified external conditions. Provides the appropriate level of protection against damage from hazards from these systems during their planned lifetime.
    <br /><br />This publication is of high relevance for Smart Grid</a>.
- language: fr
  script: Latn
  content: Traite des aspects relatifs à la sécurité, l'assurance de la qualité et l'intégrité de l'ingénierie, et spécifie les exigences relatives à la sécurité des petits aérogénérateurs, comprenant leur conception, leur installation et leur maintenance, ainsi que leur exploitation dans des conditions externes spécifiques. Fixe un niveau approprié de protection contre les risques et dommages que ces systèmes pourraient causer pendant leur durée de vie.
