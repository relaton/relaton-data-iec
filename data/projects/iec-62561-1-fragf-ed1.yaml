abstract:
- language: fr
  script: Latn
  content: L'IEC 62561-1:2012 spécifie les exigences et les essais à appliquer aux composants métalliques de connexion faisant partie d'un Système de Protection contre la Foudre (SPF). Il peut s'agir typiquement des connecteurs, composants de liaisons équipotentielles, de dérivation, pièces d'expansion, ainsi que les joints de contrôle. Les essais de composants pour atmosphère explosive ne sont pas concernés par la présente norme.
