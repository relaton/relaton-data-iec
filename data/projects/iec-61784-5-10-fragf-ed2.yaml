  script: Latn
  content: La CEI 61784-5-10 :2010 spécifie les profils d'installation applicables à la CPF 10 (Vnet/IP ). Les profils d'installation sont spécifiés dans l'annexe. Cette annexe est lue conjointement à la CEI 61918:2010. Elle annule et remplace la première édition publiée en 2007, dont elle constitue une révision éditoriale. Cette édition ne comporte pas de modifications techniques par rapport à l'édition précédente. La présente version bilingue (2012-02) correspond à la version anglaise monolingue publiée en 2010-07.
