abstract:
- language: en
  script: Latn
  content: |-
    This document defines a set of environmental performance evaluation (EPE) data classes, including their properties.<br/>
    It is applicable to entire manufacturing facilities or to parts of a manufacturing facility.<br/>
    This document applies to manufacturing systems including discrete, batch and continuous control, which are defined in IEC 62264-1.<br/>
    The following are outside the scope of this document:<br/>
    - syntax of EPE data and data models;<br/>
    - protocols to exchange EPE data;<br/>
    - functions that can be enabled by the use of EPE data;<br/>
    - product life cycle assessment;<br/>
    - EPE data that are specific to a particular industry sector, manufacturer or machinery;<br/>
    - acquisition of EPE data.
