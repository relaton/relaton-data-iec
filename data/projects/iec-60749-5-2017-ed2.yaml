abstract:
- language: en
  script: Latn
  content: |-
    IEC 60749-5:2017 provides a steady-state temperature and humidity bias life test for the purpose of evaluating the reliability of non-hermetic packaged solid-state devices in humid environments.<br/>
    This second edition cancels and replaces the first edition published in 2003. This edition constitutes a technical revision.<br/>
    This edition includes the following significant technical changes with respect to the previous edition:<br/>
    a) correction of an error in an equation;<br/>
    b) inclusion of notes for guidance;<br/>
    c) clarification of the applicability of test conditions.
- language: fr
  script: Latn
  content: |-
    L’IEC 60749-5:2017 décrit un essai continu de durée de vie utilisant la température et l’humidité avec polarisation pour évaluer la fiabilité des dispositifs à semiconducteurs sous boîtier non hermétique dans les environnements humides. Cette méthode d’essai est considérée comme destructive.<br/>
    Cette édition inclut les modifications techniques majeures suivantes par rapport à l’édition précédente:<br/>
    a) correction d’une erreur dans une équation;<br/>
    b) ajout de notes à des fins de recommandation;<br/>
    c) clarification de l’applicabilité des conditions d’essai.
