abstract:
- language: en
  script: Latn
  content: |-
    This Technical Specification specifies requirements for instruments that measure sound intensity using pairs of pressure sensing microphones with respect to their immunity to power- and radio-frequency fields and to electrostatic discharge, and the permitted radio-frequency emissions, together with test procedures to verify conformance. Sound intensity measuring instruments are available in many different configurations and may be powered by batteries or from external power supply systems. The technical requirements in this Technical Specification apply to all configurations of instruments for the measurement of sound intensity.

    The electromagnetic and electrostatic compatibility requirements are equally applicable for sound intensity measuring instruments used in residential, commercial and light-industrial environments, or industrial sites. The requirements of this Technical Specification are additional to those contained in IEC 61043 and do not alter any of the specifications contained therein. The requirements do not apply retrospectively to sound intensity measuring instruments complying with IEC 61043 prior to the publication of this Technical Specification.
- language: fr
  script: Latn
  content: |-
    La présente Spécification technique spécifie, pour les instruments qui mesurent l'intensité acoustique au moyen d'une paire de microphones de pression, des exigences qui sont en rapport avec leur immunité à des champs électriques à la fréquence du secteur ou à fréquence radioélectrique, ainsi qu'à des décharges électrostatiques, ou avec les émissions à fréquence radioélectrique tolérées, et décrit également les procédures d'essai destinées à vérifier leur conformité à ces exigences. Les instruments de mesure de l'intensité acoustique sont disponibles dans de nombreuses configurations différentes et peuvent être alimentés par batteries ou par des sources d'alimentation extérieures. Les exigences techniques de la présente Spécification technique s'appliquent à toutes les configurations d'instruments destinés à la mesure de l'intensité acoustique. 

    Les exigences concernant les compatibilités électromagnétiques et électrostatiques s'appliquent aux instruments de mesure de l'intensité acoustique utilisés aussi bien dans des environnements résidentiels, commerciaux et d'industrie légère que dans des sites industriels. Les exigences contenues dans la présente Spécification technique complètent celles qui sont contenues dans la CEI 61043 et ne modifient aucune des spécifications qui y sont incluses. Les exigences ne s'appliquent pas rétrospectivement aux instruments de mesure de l'intensité acoustique satisfaisant à la CEI 61043 avant la publication de la présente Spécification technique.
