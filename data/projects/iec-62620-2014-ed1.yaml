abstract:
- language: en
  script: Latn
  content: |-
    IEC 62620:2014 specifies marking, tests and requirements for lithium secondary cells and batteries used in industrial applications including stationary applications. When there exists an IEC standard specifying test conditions and requirements for cells used in special applications and which is in conflict with this standard, the former takes precedence. (e.g. IEC 62660 series on road vehicles). The following are some examples of applications that utilize the cells and batteries under the scope of this standard.<br/>
    - Stationary applications: telecom, uninterruptible power supplies (UPS), electrical energy storage system, utility switching, emergency power and similar applications.<br/>
    - Motive applications: fork-lift truck, golf cart, AGV, railway, and marine, excluding road vehicles.<br/>
    This standard applies to cells and batteries. If the battery is divided into smaller units, the smaller unit can be tested as the representative of the battery. The manufacturer clearly declares the tested unit. The manufacturer may add functions, which are present in the final battery, to the tested unit.
- language: fr
  script: Latn
  content: |-
    L'IEC 62620:2014 spécifie le marquage, les essais et les exigences pour les éléments et les batteries d accumulateurs au lithium utilisés dans les applications industrielles, y compris les applications stationnaires. En cas d'existence d'une norme IEC spécifiant des conditions d'essai et des exigences pour des éléments destinés à des applications particulières, et qui serait en contradiction avec la présente norme, la publication particulière est appliquée en priorité (par exemple, la série IEC 62660 sur les véhicules routiers). Ci-après figurent des exemples d'applications utilisant les éléments et les batteries inclus dans le domaine d'application de la présente norme.<br/>
    - Applications stationnaires: télécommunications, alimentation sans interruption (ASI), système de stockage de l'énergie électrique, sélecteur de service, alimentation d'urgence et applications analogues.<br/>
    - Applications mobiles: chariot élévateur, voiturette de golf, AGV, ferroviaire, et marine, à l'exception des véhicules routiers.<br/>
    La présente norme s'applique aux éléments et aux batteries. Si la batterie est divisée en unités plus petites, l'unité plus petite peut être soumise aux essais pour représenter l'ensemble de la batterie. Le fabricant déclare clairement l'unité soumise aux essais. Le fabricant peut ajouter des fonctions, qui sont présentes dans la batterie finale, à l'unité soumise aux essais.
