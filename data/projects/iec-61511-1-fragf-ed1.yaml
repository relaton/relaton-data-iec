abstract:
- language: fr
  script: Latn
  content: permet de définir des prescriptions relatives aux spécifications, à la conception, à l'installation, à l'exploitation et à l'entretien d'un système instrumenté de sécurité, de telle manière qu'il puisse être mis en oeuvre en toute confiance, et ainsi établir et/ou maintenir les processus dans un état de sécurité convenable. La présente norme a été conçue pour être une mise en  uvre de la norme internationale CEI 61508 "Sécurité fonctionnelle des systèmes électriques/électroniques/ électroniques programmables relatifs à la sécurité" dans le domaine de l'industrie des processus
