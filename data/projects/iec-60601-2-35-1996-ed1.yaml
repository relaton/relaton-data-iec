- language: en
  script: Latn
  content: |-
    Establishes requirements, which minimize hazards to patient and
    operator, for heating devices such as blankets, pads, mattresses and
    fluid-filled mattresses. Specifies tests by which comliance can
    be verified.
- language: fr
  script: Latn
  content: |-
