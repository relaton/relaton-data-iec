abstract:
- language: en
  script: Latn
  content: |-
    IEC TR 63191:2018(E) specifies recommendations about power quality measurement and assessment within installations.<br/>
    IEC TR 63191:2018 outlines the various phases needed for the establishment of a demand side power quality measurement plan for buildings and industry installations.<br/>
    Such a power quality measurement plan will enable the optimization of the energy availability and efficiency, improve the assets lifetime and facilitate the resolutions of power quality problems. A power quality measurement plan encompasses the following stages:<br/>
    •    definition of the context, objectives and constraints;<br/>
    •    assessment of the initial power quality situation;<br/>
    •    definition of an action plan for the improvement of the power quality situation;<br/>
    •    implementation of the power quality measuring system;<br/>
    •    exploitation of the measurement system for the improvement of the power quality situation;<br/>
    •    maintenance of the measurement system.<br/>
    IEC TR 63191:2018 will also help facility managers to tailor their measurement plan to the specific needs of the electrical system under their control. It addresses all the disturbances present in such networks, but does not cover the disturbances present in public electrical distribution networks (supply side) as they are governed by specific documents such as EN 50160 and IEC TS 62749.
