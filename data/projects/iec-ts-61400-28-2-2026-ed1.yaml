abstract:
- language: en
  script: Latn
  content: |-
    IEC TS 61400‑28-2:2026 addresses the decommissioning and preparation for recycling of wind turbines.<br/>
    This scope includes all the tasks and on-site considerations of the different process steps, from the beginning of the dismantling phase, material preparation and arrangement, and preparation for shipment to re-using or recycling facilities. Wind turbines in the context of this document include blades, hubs, nacelles, towers, foundations, generators, gearboxes, cables, electrical equipment, transformers, and any other equipment that can be dismantled from wind turbines and not listed before.<br/>
    The purpose of this document is to define the framework conditions of decommissioning and preparation for recycling of wind turbines, which includes the tasks and considerations of each of the steps of the process. The objective is to provide basic high-level information on the sustainable and efficient decommissioning and dismantling arrangements for wind turbines.<br/>
    This document can be used by manufacturers, asset owners, governments, operators, recyclers and personnel involved in the decommissioning and preparation for recycling of wind turbines.
