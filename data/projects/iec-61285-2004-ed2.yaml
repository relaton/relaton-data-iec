abstract:
- language: en
  script: Latn
  content: describes the physical requirements for the safe operation of the process analyser measuring system installed in an AH in order to ensure its protection against fire, explosion and health hazards. This standard extends beyond IEC 60079-16 to include houses with Zone 2 interiors and to apply to toxic hazards. (Appropriate national guidelines on toxic hazards are to be followed.)
