abstract:
- language: en
  script: Latn
  content: Specifies the tests for empty cabinets and subracks concerning electromagnetic shielding performance, in the frequency range of 30 MHz to 2 000 MHz. Ensures physical integrity and environmental performance of cabinets and subracks, taking into account the need for different levels of performance in different applications. Was developed in close relationship to IEC 61000-5-7 but with the specific focus on subracks and cabinets and the determination of performance levels at the chosen frequency range.
- language: fr
  script: Latn
  content: Spécifie les essais pour les baies et les bacs à cartes vides concernant leurs performances de blindage électromagnétique dans la gamme de fréquences de 30 MHz à 2 000 MHz. Assure l'intégrité physique et les performances environnementales des baies et des bacs à cartes en tenant compte du besoin de différents niveaux de performances dans différentes applications. A été établie en relation étroite avec la CEI 61000-5-7, mais spécifiquement pour les bacs à cartes et les baies et la détermination des niveaux de performances dans la gamme de fréquences choisie.
