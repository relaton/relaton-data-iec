abstract:
- language: en
  script: Latn
  content: |-
    IEC 63041-1 ED3 applies to piezoelectric sensors of resonator, delay-line and non-acoustic types, which are used in physical and engineering sciences, chemistry and biochemistry, medical and environmental sciences, etc.<br/>
    The purpose of this document is to specify the terms and definitions for piezoelectric sensors, and from a technological perspective, to make sure that users understand the state-of-art piezoelectric sensors and how to use them correctly. The terms and definitions defined in this document are used in all parts of the IEC 63041 series.<br/>
    This edition includes the following significant technical changes with respect to the previous edition:<br/>
    a) Some sources given in Clause Clause 3 have been updated based on IEC TS 61994-5:2023;<br/>
    b) quasi-static piezoelectric sensor element (3.1.4) has been added.
