  script: Latn
  content: IEC 62848-1:2016 applies to non-linear metal-oxide surge arresters without gaps for both on board and fixed installations, designed to limit voltage surges on DC systems specified in IEC 60850 with nominal voltage up to 3 kV.
- language: fr
  script: Latn
