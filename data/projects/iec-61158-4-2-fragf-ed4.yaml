abstract:
- language: en
  script: Latn
  content: |-
    The data-link layer provides basic time-critical messaging communications between devices in an automation environment.<br/>
    This protocol provides communication opportunities to all participating data-link entities, sequentially and in a cyclic synchronous manner. Foreground scheduled access is available for time-critical activities together with background unscheduled access for less critical activities.<br/>
    Deterministic and synchronized transfers can be provided at cyclic intervals up to 1 ms and device separations of 25 km. This performance is adjustable dynamically and on-line by re-configuring the parameters of the local link whilst normal operation continues. By similar means, DL connections and new devices may be added or removed during normal operation.<br/>
    This protocol provides means to maintain clock synchronization across an extended link with a precision better than 10 s.<br/>
    This protocol optimizes each access opportunity by concatenating multiple DLSDUs and associated DLPCI into a single DLPDU, thereby improving data transfer efficiency for data-link entities that actively source multiple streams of data.<br/>
    The maximum system size is an unlimited number of links of 99 nodes, each with 255 DLSAP-addresses. Each link has a maximum of 224 related peer and publisher DLCEPs.
- language: fr
  script: Latn
  content: |-
    La couche de liaison de données assure les communications de messagerie à contrainte de temps de base entre les appareils d'un environnement d'automatisation.<br/>
    Ce protocole offre des opportunités de communication séquentielle et synchrone cyclique à toutes les entités de liaison de données participantes. Un accès planifié de premier plan est proposé à toutes les activités à contrainte de temps, un accès non planifié l'étant aux activités moins critiques.<br/>
    Des transferts déterministes et synchronisés peuvent être assurés à des intervalles cycliques allant jusqu’à 1 ms et des appareils distants de 25 km. Cette performance peut être adaptée de manière dynamique et en ligne en reconfigurant les paramètres de la liaison locale sans interrompre le fonctionnement normal. De la même manière, des connexions DL et de nouveaux appareils peuvent être ajoutés ou retirés pendant le fonctionnement normal.<br/>
    Ce protocole offre la possibilité de maintenir la synchronisation d'horloge d'une liaison étendue supérieure à 10 s.<br/>
    Ce protocole permet d'optimiser chaque opportunité d'accès en concaténant plusieurs DLSDU et DLPCI associés en une seule DLPDU, améliorant le transfert de données des entités de liaison de données qui émettent activement plusieurs flux de données.<br/>
    La taille maximale du système est un nombre illimité de liaisons de 99 nœuds, comportant chacune 255 adresses DLSAP. Chaque liaison comporte un maximum de 224 homologues connexes et DLCEP d'éditeur.
