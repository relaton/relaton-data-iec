abstract:
- language: en
  script: Latn
  content: |-
    Specifies particular safety and essential performance requirements for individual devices designed for use in an anaesthetic system as well as specific requirements for the anaesthetic gas delivery system. This standard specifies requirements and defines interfaces for:

    - individual devices designed for use in an anaesthetic systems(s), and

    - integrated anaesthetic systems.
