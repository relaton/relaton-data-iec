abstract:
- language: en
  script: Latn
  content: |+
    <!-- NEW! -->IEC 60401-1:2020 is available as IEC 60401-1:2020 RLV which contains the International Standard and its Redline version, showing all changes of the technical content compared to the previous edition.
    <p>IEC 60401-1:2020 provides a nomenclature of the most frequent surface, bulk and shape irregularities relevant to cores made of soft ferrites (magnetic oxides). Most irregularities are graphically exemplified as visual aids. A general recommendation is also given in Annex A for a consistent scheme for specifying the exact location of the irregularity, combining a general name for the location with more detailed qualifiers of the specified location. This document can also be useful as a terminology reference when preparing technical documentation, irregularity inspection specifications, etc.<br/>
    This document also presents a method for defining the designation nomenclature for the major physical attributes of soft ferrite core shapes. The purpose of this document is to facilitate uniform usage of dimensional characters by manufacturers, specifiers, and users when describing core dimensions on drawings, in tables, and on catalogue specification sheets.<br/>
    This second edition cancels and replaces the first edition of IEC 60401-1 published in 2002 and the second edition of IEC 60401-2 published in 2009. This edition constitutes a technical revision.<br/>
    This edition includes the following significant technical changes with respect to the previous editions of IEC 60401-1 and IEC 60401-2:<br/>
    a) added the surface irregularity term “pores” in 4.3.1.6;<br/>
    b) added the surface irregularity term “scratch” in 4.3.6.3;<br/>
    c) removed the surface irregularity term “crater” in 4.1.5 of IEC 60401-1: 2002;<br/>
    d) removed the bulk irregularity terms “superpores” in 5.1, “inclusions” in 5.2, “internal stratification” in 5.3 and “internal crack” in 5.4 of IEC 60401-1: 2002;<br/>
    e) removed the contents related to “yoke ring cores” in 7.1.3 and 7.4 of IEC 60401-1:2002;<br/>
    f) replaced the surface irregularity term “stratification” with “lamination” in 4.3.4.7;<br/>
    g) replaced the location related terms “upper surface of back” with “bottom surface” and “lower surface of back” with “back surface” in Figure A.1;<br/>
    h) changed Clause 7 of IEC 60401-1:2002 into Annex A.</p>


- language: fr
  script: Latn
  content: "<!-- NEW! -->IEC 60401-1:2020 est disponible sous forme de IEC 60401-1:2020 RLV qui contient la Norme internationale et sa version Redline, illustrant les modifications du contenu technique depuis l'édition précédente.\n<p>:L’IEC 60401-1:2020 fournit une nomenclature des irrégularités de surface, de structure interne et de forme les plus fréquentes correspondant aux noyaux en matériaux ferrites doux (oxydes magnétiques). La plupart des irrégularités sont citées en exemple sous forme de graphique, en tant qu'aide visuelle. Une recommandation générale est également fournie à l’<!--[if supportFields]><span lang=FR\r\nstyle='mso-ansi-language:FR'><span style='mso-element:field-begin'></span> REF\r\n_Ref42873675 \\r \\h <span style='mso-element:field-separator'></span></span><![endif]-->Annexe A<!--[if gte mso 9]><xml>\r\n <w:data>08D0C9EA79F9BACE118C8200AA004BA90B02000000080000000D0000005F00520065006600340032003800370033003600370035000000</w:data>\r\n</xml><![endif]--><!--[if supportFields]><span lang=FR style='mso-ansi-language:\r\nFR'><span style='mso-element:field-end'></span></span><![endif]--> en vue d'un programme cohérent pour spécifier l'emplacement exact de l'irrégularité, en associant un nom général pour l'emplacement à des qualificatifs plus détaillés de l'emplacement spécifié. Le présent document peut également être utile en tant que référence terminologique lors de l'élaboration de la documentation technique, des spécifications de contrôle des irrégularités, etc.</p>\n\n<p>Le présent document présente également une méthode qui définit la nomenclature de désignation des principaux attributs physiques des formes de noyaux en matériaux ferrites doux. L’objet du présent document est de faciliter l’utilisation uniforme des caractères dimensionnels par les fabricants, les spécificateurs et les utilisateurs lors de la description des dimensions de noyaux dans des schémas, des tableaux et des fiches de spécification de catalogues.<br/>\n<br/>\nCette deuxième édition annule et remplace la première édition de l’IEC 60401-1 parue en 2002 et la deuxième édition de l’IEC 60401-2 parue en 2009. Cette édition constitue une révision technique.<br/>\nCette édition inclut les modifications techniques majeures suivantes par rapport aux éditions précédentes de l'IEC 60401-1 et de l'IEC 60401-2:</p>\n\n\n\tajout du terme d'irrégularité de surface \"pores\" en 4.3.1.6;\n\tajout du terme d'irrégularité de surface \"rayure\" en 4.3.6.3;\n\tsuppression du terme d'irrégularité de surface \"cratère\" au 4.1.5 de l’IEC 60401-1: 2002;\n\tsuppression des termes d'irrégularité de structure interne \"superpores\" en 5.1, \"inclusions\" en 5.2, \"stratification interne\" en 5.3 et \"fissures internes\" en 5.4 de l’IEC 60401-1: 2002;\n\tsuppression du terme lié au contenu \"bague de déflexion\" au 7.1.3 et au 7.4 de l’IEC 60401-1: 2002;\n\tremplacement du terme d’irrégularité de surface \"stratification\" par \"lamination\" (en anglais) en 4.3.4.7;\n\tremplacement des termes liés à l'emplacement \"surface supérieure du fond\" par \"surface du bas\" et \"surface inférieure du fond\" par \"surface du fond\" à la Figure A.1;\n\tmodification de l’Article 7 de l’IEC 60401-1:2002 en Annexe A.\n"
