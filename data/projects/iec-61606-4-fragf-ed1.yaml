abstract:
- language: fr
  script: Latn
  content: La CEI 61606-4:2005 spécifie les méthodes de mesure de base d'un signal PCM linéaire pour la partie audio des ordinateurs personnel (PC) et s'applique à la fois aux ordinateurs de bureau et portables. Les conditions et méthodes de mesure communes sont décrites dans la CEI 61606-1. Des conditions et méthodes de mesure spécifiques aux PC sont indiquées dans la présente norme. La présente version bilingue (2012-05) correspond à la version anglaise monolingue publiée en 2005-12.
