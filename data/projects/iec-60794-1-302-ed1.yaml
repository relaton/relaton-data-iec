abstract:
- language: en
  script: Latn
  content: |-
    IEC 60794-1-302:2026 specifies test procedures to establish uniform requirements for the geometrical properties of optical fibre ribbons.<br/>
    This document applies to optical fibre ribbons used with telecommunication equipment and similar devices, and to optical fibre ribbons for cables combining both optical fibres and electrical conductors.<br/>
    IEC 60794-1-302:2026 also applies to ribbon structures that are designated as edge-bonded, encapsulated or partially-bonded.<br/>
    This edition includes the following significant technical changes with respect to method G2 of IEC 60794‑1‑23:2019:<br/>
    a) addition of a description of a flexible ribbon, such as partially bonded ribbon for measurement procedure;<br/>
    b) addition of new clauses containing the details to be specified and the details to be reported.
