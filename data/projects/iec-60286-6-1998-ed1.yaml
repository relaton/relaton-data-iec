  script: Latn
  content: L'emballage en vrac est conçu pour transporter et pour stocker les composants, et pour les fournir directement ou par un chargeur approprié à la machine de placement. Est fixé à la machinerie pour opérations automatisées au moyen d'une interface de couplage.
