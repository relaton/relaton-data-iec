  script: Latn
  content: S'applique aux détecteurs semiconducteurs utilisés pour la détection et la spectrométrie à haute résolution des particules chargées. Les techniques de mesure décrites ont été choisies pour leurs facilités d'application par tous les fabricants et utilisateurs de détecteurs semiconducteurs pour particules chargées.
