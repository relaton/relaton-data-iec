abstract:
- language: en
  script: Latn
  content: |-
    ISO/IEC TR 30167:2021 describes the enabling and driving technologies of underwater communication such as acoustic communication, optical communication, Very Low Frequency (VLF)/Extremely, Low Frequency (ELF) communication, and Magnetic Fusion Communication (MFC). This document also highlights:<br/>
    – technical overview of different communication technologies;<br/>
    – characteristics of different communication technologies;<br/>
    – trends of different communication technologies;<br/>
    – applications of each communication technology;<br/>
    – benefits and challenges of each communication technology.
