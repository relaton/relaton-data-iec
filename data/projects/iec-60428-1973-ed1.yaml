  script: Latn
  content: S'applique aux deux espèces de piles étalons utilisées comme référence de force électromotrice, c'est-à-dire les piles étalons saturées et les piles étalons non saturées, et traite des conditions d'essai relatives à la certification et des prescriptions relatives aux caractéristiques électriques et mécaniques.
