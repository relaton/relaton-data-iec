abstract:
- language: fr
  script: Latn
  content: 'La CEI 60746-1:2003 spécifie la terminologie et les définitions des termes relatifs aux caractéristiques fonctionnelles des analyseurs électrochimiques utilisés pour la détermination en continu de certains aspects de solutions (généralement aqueuses); les méthodes uniformes à utiliser pour les indications concernant les caractéristiques fonctionnelles de tels analyseurs; les procédures générales d''essai pour déterminer et vérifier les caractéristiques fonctionnelles des analyseurs électrochimiques, en tenant compte des différences d''approche dans les documents CEI spécifiant les méthodes d''essai (CEI 60359, CEI 60770, CEI 61298). Elle fournit des documents de base dans le cadre de l''application des normes d''assurance qualité: ISO 9001, ISO 9002 et ISO 9003. Cette deuxième édition annule et remplace la première édition, parue en 1982, et constitue une révision technique.'
