abstract:
- language: en
  script: Latn
  content: |-
    IEC 61300-3-52: 2026 describes a procedure to measure the guide pin hole and guide pin deformation constant, C<sub>DE</sub>, for angled PC rectangular ferrule multi-fibre connectors.<br/>
    This edition includes the following significant technical changes with respect to the previous edition:<br/>
    a) inclusion of 19,6 N mating force and 0,5480 mm diameter pins, which covers 16 fibre and multi-row ferrule variants;<br/>
    b) clarification to C<sub>DE</sub> measurement setup;<br/>
    c) improved definition of α parameter.
