  content: S'applique aux montages convertisseurs à semi-conducteurs couverts par la CEI 60146. Décrit un code d'identification s'appliquant aux montages convertisseurs les plus importants et les plus communément utilisés et constitués exclusivement d'éléments de valve. Cette publication a le statut d'un rapport.
