abstract:
- language: en
  script: Latn
  content: |-
    IEC 62282-3-300:2012 provides minimum safety requirements for the installation of indoor and outdoor stationary fuel cell power systems in compliance with IEC 62282-3-100 and applies to the installation of the following systems:<br/>
    - intended for electrical connection to mains directly or with a readily accessible, manually operable switch or circuit-breaker;<br/>
    - intended for a stand-alone power distribution system;<br/>
    - intended to provide AC or DC power;<br/>
    - with or without the ability to recover useful heat.
- language: fr
  script: Latn
  content: |-
    La CEI 62282-3-300:2012 fournit les exigences de sécurité minimales pour l'installation intérieure et extérieure des systèmes à piles à combustible stationnaires conformément à la CEI 62282-3-100 et s'applique à l'installation des systèmes mentionnés ci-après:<br/>
    - destinés à être connectés au réseau électrique directement ou via un interrupteur ou disjoncteur facilement accessible, pouvant fonctionner manuellement;<br/>
    - destinés à être un système de distribution d'énergie autonome;<br/>
    - destinés à fournir de l'énergie à courant alternatif ou à courant continu;<br/>
    - avec ou sans aptitude à récupérer la chaleur utile.
