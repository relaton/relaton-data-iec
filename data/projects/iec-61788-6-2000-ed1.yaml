abstract:
- language: en
  script: Latn
  content: |-
    Covers a test method detailing the tensile test procedures to be carried out on Cu/Nb-Ti superconductive composite wires at room temperature.

    This test is used to measure modulus of elasticity, 0,2% proof strength of the composite due to a yelding of the copper component, and tensile strength.
