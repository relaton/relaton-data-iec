abstract:
- language: fr
  script: Latn
  content: |-
    L'IEC 60793-2-20:2015 est applicable aux fibres optiques des sous-catégories A2a, A2b, et A2c. Ces fibres sont utilisées ou peuvent être intégrées dans des équipements pour la transmission de l'information et dans des câbles à fibres optiques (typiquement jusqu'à 2 km). Trois types d'exigences s'appliquent à ces fibres:<br/>
    - les exigences générales, qui sont définies dans l'IEC 60793-2;<br/>
    - des exigences spécifiques communes aux fibres multimodales de catégorie A2, couvertes par la présente norme, et qui sont données dans l'Article 3;<br/>
    - des exigences particulières applicables à des sous-catégories particulières de fibres ou à des applications données, qui sont définies dans les spécifications de famille figurant en annexe. Cette troisième édition annule et remplace la deuxième édition parue en 2007. Cette édition constitue une révision technique. Cette édition inclut les modifications techniques majeures suivantes par rapport à l'édition précédente:<br/>
    - NA<sub>th</sub> a été remplacé par NA<sub>ff</sub>;<br/>
    - la longueur du spécimen d'essai et les détails de mesure spécifiés pour la mesure du diamètre du coeur et de NA<sub>ff</sub>.
    Mots clés: des équipements pour la transmission de l'information, des câbles à fibres optiques, fibres multimodales de catégorie A2
