abstract:
- language: en
  script: Latn
  content: |-
    IEC 62368-3:2017 applies to equipment intended to supply and receive operating power through communication cables or ports. It covers particular requirements for circuits that are designed to transfer DC power from a power sourcing equipment (PSE) to a powered device (PD).<br/>
    The power transfer uses voltages at ES1 or ES2 or in very specific cases voltage levels at ES3.<br/>
    Any cable provided with a connector defined by an industry standard that permits DC power transfer between equipment is considered a communication cable even if communication does not take place. For example, a USB cable can be used just to recharge a portable device battery.<br/>
    This International Standard is to be used in conjunction with IEC 62368-1:2014.<br/>
    It has the status of a group safety publication in accordance with IEC Guide 104.<br/>
    The subclauses of IEC 62368-1 apply as far as reasonable. Where safety aspects are similar to those of IEC 62368-1, the relevant clause or subclause of IEC 62368-1 is given for reference in a note in the relevant subclause. Where a requirement in IEC 62368-3 refers to a requirement or criterion of IEC 62368-1, a specific reference to IEC 62368-1 is made.<br/>
    This group safety publication is primarily intended to be used as a product safety standard for the products mentioned in the scope, but shall also be used by technical committees in the preparation of standards for products similar to those mentioned in the scope of this standard, in accordance with the principles laid down in IEC Guide 104 and lSO/lEC Guide 51.
- language: fr
  script: Latn
  content: |-
    IEC 62368-3:2017 s’applique aux équipements conçus pour fournir et recevoir de l’énergie de fonctionnement au moyen de câbles et d’accès de communication. Elle couvre les exigences particulières relatives aux circuits conçus pour transférer de la puissance en courant continu d’un équipement source d’alimentation (PSE - power sourcing equipment) à un dispositif alimenté (PD - powered device).<br/>
    Le transfert de puissance utilise des tensions à ES1 ou ES2 ou, dans des cas très spécifiques, des niveaux de tensions à ES3.<br/>
    Tout câble équipé d’un connecteur défini par une norme industrielle permettant le transfert de puissance en courant continu entre des équipements est considéré comme étant un câble de communication, même en l’absence de communication. Par exemple, un câble USB peut être utilisé uniquement pour recharger une batterie de dispositif portable.<br/>
    Cette Norme Internationale doit être utilisée conjointement avec l'IEC IEC 62368-1:2014.<br/>
    Elle a le statut d'une publication groupée de sécurité conformément au Guide IEC 104.<br/>
    Les paragraphes de l’IEC 62368-1 s’appliquent dans la mesure du possible. Lorsque les aspects liés à la sécurité sont similaires à ceux décrits dans l’IEC 62368-1, l’article ou le paragraphe pertinent de l’IEC 62368-1 est indiqué à titre de référence dans une note qui figure dans le paragraphe concerné. Lorsqu’une exigence de l’IEC 62368-3 fait référence à une exigence ou un critère de l’IEC 62368-1, une référence particulière est faite à l’IEC 62368-1.<br/>
    La présente publication groupée de sécurité est avant tout destinée à être utilisée en tant que norme en matière de sécurité des produits pour les produits cités dans le domaine d’application, mais elle doit également être utilisée par les comités d’études dans le cadre de l’élaboration de normes pour des produits similaires à ceux cités dans le domaine d’application de la présente norme, conformément aux principes établis dans le Guide IEC 104 et le Guide ISO/IEC 51.<br/>
    Mots clés: communication, sécurité, câbles, transfert de puissance en courant continu
