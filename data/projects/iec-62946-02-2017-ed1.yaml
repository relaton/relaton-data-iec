abstract:
- language: en
  script: Latn
  content: |-
    IEC 62946-02:2017(E) covers 8-way, unshielded free and fixed high density connectors for data transmission with frequencies up to 250 MHz and with extra low voltage current carrying capabilities up to 1 A, and is intended to specify the common dimensions, mechanical, electrical, signal integrity and environmental characteristics and tests for these connectors.<br/>
    The contents of the corrigendum of March 2020 have been included in this copy.
