- language: en
  script: Latn
  content: IEC 60747-14-12:2026(E) specifies the performance test methods for CMOS imager-based gas sensors. It includes the terms and definitions, the test environmental conditions, the test system, the test methods, and the test report. This document is applicable to the performance test of both CMOS gas sensors based on lens-free imaging and CMOS gas sensors based on lens imaging.
