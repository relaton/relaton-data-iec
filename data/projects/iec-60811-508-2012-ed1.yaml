abstract:
- language: en
  script: Latn
  content: |-
    IEC 60811-508:2012 gives the procedure for a pressure test at high temperature, which typically applies to thermoplastic compounds used for insulating and sheathing materials. IEC 60811-508:2012 cancels and replaces Clause 8 of IEC 60811-3-1:1985, which is withdrawn. Full details of the replacements are shown in Annex A of IEC 60811-100:2012. Significant technical changes with respect to the previous edition are as follows:<br/>
    - re-statement of oven characteristics, especially relating to anti-vibration and to temperature control;<br/>
    - enhanced detail as to the preparations and testing of flat cables;<br/>
    - enhanced detail as to thickness and dimensional measurements. See also the Foreword to IEC 60811-100:2012.

    <br/><br/>This publication is to be read in conjunction with IEC 60811-100:2012.
- language: fr
  script: Latn
  content: |-
    La CEI 60811-508:2012 décrit la procédure à suivre pour réaliser l'essai de pression à température élevée, généralement applicable aux mélanges thermoplastiques utilisés pour les matériaux d'isolation et de gainage. La CEI 60811-508:2012 annule et remplace l'Article 8 de la CEI 60811-3-1:1985, qui est supprimée. L'ensemble des détails relatifs aux remplacements figure dans l'Annexe A de la CEI 60811-100:2012. Des modifications techniques importantes ont été effectuées par rapport à l'édition précédente, comme suit:<br/>
    - redéfinition des caractéristiques relatives à l'étuve, en particulier les caractéristiques antivibratoires et le contrôle de la température;<br/>
    - des détails supplémentaires relatifs aux préparations et aux essais de câbles méplats;<br/>
    - des détails supplémentaires relatifs aux mesures d'épaisseur et de dimensions. Voir également l'avant-propos de la CEI 60811-100:2012.

    <br/><br/>Cette publication doit être lue conjointement avec la CEI 60811-100:2012.
