  script: Latn
  content: Définit des modèles de référence s'appliquant au contrôle-commande de processus de fabrication par lots tel qu'il est utilisé dans les industries de processus ainsi qu'une terminologie permettant d'expliquer les relations entre ces modèles et ces termes. Ne s'applique pas à toutes les applications de contrôle-commande des processus de fabrication par lots.
