  script: Latn
  content: L'IEC 62858:2015 présente et évoque toutes les mesures nécessaires qui visent à rendre fiables et homogènes les valeurs de NG obtenues par les LLS dans différents pays. Seuls les paramètres essentiels à l'analyse du risque sont pris en compte.
