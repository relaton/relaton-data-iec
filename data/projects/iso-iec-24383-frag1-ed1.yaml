abstract:
- language: en
  script: Latn
  content: |-
    ISO/IEC 24383:2020 specifies requirements and recommendations providing security to the physical network comprising customer premises cabling in accordance with ISO/IEC 11801 series, associated infrastructure and accommodation of information technology equipment.<br/>
    The document covers the security of the telecommunications cables, pathways, spaces, and other infrastructure components of the telecommunications physical infrastructure to protect the telecommunications infrastructure from theft, vandalism, intrusions, and unauthorized modifications.<br/>
    The document addresses:<br/>
    • risk assessment,<br/>
    • design (including construction), planning and installation practices based on a required Security Grade (SG),<br/>
    • intrusion detection,<br/>
    • administration including Automated Infrastructure Management (AIM).<br/>
    The document applies to existing buildings and structures together with those being planned for construction.<br/>
    The following are outside the scope of this International Standard:<br/>
    • data protection methods such as encryption,<br/>
    • practices that address protection from non-contact cable tapping, audio, visual or RF snooping and other forms of unauthorized monitoring.<br/>
    Safety and electromagnetic compatibility (EMC) requirements are outside the scope of this international standard and are covered by other standards and regulations. However, information given in this international standard can be of assistance in meeting these standards and regulations.
