abstract:
- language: en
  script: Latn
  content: |-
    IEC 60364-8-2:2018 provides additional requirements, measures and recommendations for design, erection and verification of all types of low-voltage electrical installation according to IEC 60364-1:2005, Clause 11, including local production and/or storage of energy in order to ensure compatibility with the existing and future ways to deliver electrical energy to current-using equipment or to the public network by means of local sources. Such electrical installations are designated as prosumer’s electrical installations (PEIs).<br/>
    This document also provides requirements for proper behaviour and actions of PEIs in order to efficiently obtain sustainable and safe operations of these installations when integrated into smart grids.<br/>
    These requirements and recommendations apply, within the scope of IEC 60364 (all parts), for new installations and modification of existing installations.
- language: fr
  script: Latn
  content: |-
    IEC 60364-8-2:2018 spécifie des exigences, mesures et recommandations supplémentaires, en matière de conception, de montage et de vérification de tous les types d'installations électriques à basse tension conformément à l’Article 11 de l'IEC 60364-1:2005, y compris la production locale et/ou le stockage de l'énergie, afin d'assurer la compatibilité avec les moyens existants et à venir de fourniture de l’énergie électrique au matériel d'utilisation ou au réseau public au moyen de sources locales. Ces installations électriques sont conçues comme des installations électriques de prosommateur (PEI - prosumer’s electrical installation).<br/>
    Le présent document spécifie également des exigences relatives au comportement et aux actions adaptés des PEI afin d'assurer leur fonctionnement durable et sûr lorsque ces PEI sont intégrées dans des réseaux intelligents.<br/>
    Ces exigences et recommandations s'appliquent, dans les limites du domaine d'application de l'IEC 60364 (toutes les parties), aux installations neuves et à la modification des installations existantes.
