abstract:
- language: en
  script: Latn
  content: |-
    IEC 61373:2026 specifies the requirements for testing items of equipment intended for use on railway vehicles which are subsequently subjected to vibrations and shock owing to the nature of railway operational environment. To gain assurance that the quality of the equipment is acceptable, it is exposed to tests of reasonable duration that simulate the service conditions seen throughout its expected life.<br/>
    Simulated long-life testing can be achieved in a number of ways each having their associated advantages and disadvantages, the following being the most common:<br/>
    a) amplification: where the amplitudes are increased and the time base decreased;<br/>
    b) time compression: where the amplitude history is retained and the time base is decreased (increase of the frequency);<br/>
    c) decimation: where time slices of the historical data are removed when the amplitudes are below a specified threshold value.<br/>
    The amplification method as stated in item a) above, is used in this document and together with the publications referred to in Clause 2; it defines the default test procedure to be followed when vibration testing items for use on railway vehicles.<br/>
    Whilst this document is primarily concerned with railway vehicles on fixed rail systems, its wider use is not precluded. For systems operating on pneumatic tyres, or other transportation systems such as trolleybuses, where the level of shock and vibration clearly differ from those obtained on fixed rail systems, specific test levels can be considered. In that case, the frequency spectra and the shock duration and amplitude are computed in compliance with the guidelines in Annex A.<br/>
    Annex F provides the functional random vibration load that can be considered by the user for urban vehicles operating on pneumatic tyres.<br/>
    This document applies to single axis testing. However, multi-axis testing is possible.<br/>
    The anchoring bolts at the fixing point(s) of the equipment are not evaluated in this document.<br/>
    This document is intended to evaluate equipment which is attached to the main structure of the vehicle (and components mounted thereon). It is not intended to test equipment which forms part of the main structure. Main structure in the sense of this document means car body, bogie and axle.<br/>
    The following items are out of scope of this document:<br/>
    – the traction motors for railway vehicles;<br/>
    – any mechanical substructure not equipped with electrical, electronic or pneumatic component.<br/>
    Additional or special vibration tests for some specific equipment are not specified in this document, for example:<br/>
    a) equipment mounted on, or linked to, items which are known to produce defined frequency excitation;<br/>
    b) equipment such as pantographs, shoegear, or suspension components which are known to be exposed to specific shock and vibration excitation;<br/>
    c) equipment intended for use in special operational environments as specified by the customer;<br/>
    d) transportation and handling tests.<br/>
    This third edition cancels and replaces the second edition published in 2010. This edition constitutes a technical revision.<br/>
    This edition includes the following significant technical changes with respect to the previous edition:<br/>
    a) consideration of specific ASD spectra from onboard measurements and certification limited to the specific case;<br/>
    b) exclusion from the scope of applicability of traction motors and any substructure not equipped with electrical, electronic or pneumatic device;<br/>
    c) clarification for order of testing and typical test sequence, taking into account the possibility of simultaneous multi-axis testing;<br/>
    d) recommendation and guidance for removing resilient mounts of the equipment (if located between the equipment and the main structure) during the long-life test;<br/>
    e) qualification of the fixture device used to attach the equipment to the test bench;<br/>
    f) guidance for using a measuring point as a possibility to assess mechanical integrity;<br/>
    g) change of the method to calculate the acceleration ratio which shall be applied to the functional ASD value to obtain the simulated long-life ASD value;<br/>
    h) duration of long-life test can be set from 5 h to 100 h per axis, with corresponding acceleration ratio (default value) indicated in a table;<br/>
    i) clarification of the concept of structural integrity;<br/>
    j) description of test exemption cases, subassembly tests, and finite element analysis for structural parts of equipment (new Annex E);<br/>
    k) the lowest frequency f1 of ASD spectra of Category 1 and Category 2 is fixed at 5 Hz as a default value, and the lowest frequency f1 of ASD spectra of Category 3 is fixed at 10 Hz as a default value;<br/>
    l) update of ASD spectra for functional random vibration test: Table 1, Table 2, Table 3, Table 4, Table A.2 and Figure 6, Figure 7, Figure 8, Figure 10. This update was recommended in the Rail Safety and Standard Board research program document: “Vibration environment for rail vehicle mounted Equipment”;<br/>
    m) new annex F dedicated on urban vehicle operating on pneumatic tyres.
- language: fr
  script: Latn
  content: |-
    IEC 61373:2026 spécifie les exigences d'essai des matériels destinés à être utilisés sur les véhicules ferroviaires soumis à des vibrations et à des chocs dus à la nature de l'environnement d'exploitation ferroviaire. Pour s'assurer que la qualité d'un matériel est acceptable, celui-ci est soumis à des essais d'une durée raisonnable qui simulent les conditions de service auxquelles il est exposé tout au long de sa vie.<br/>
    On peut réaliser des essais d’endurance simulés de différentes façons, chacune ayant ses avantages et ses inconvénients, les plus communes étant:<br/>
    a) l'amplification: avec augmentation des amplitudes et réduction de la durée;<br/>
    b) la compression du temps: avec maintien de l'historique d'amplitude et réduction de la durée (accroissement de la fréquence);<br/>
    c) la décimation: suppression de tranches des données historiques lorsque les amplitudes sont inférieures à une valeur de seuil spécifiée.<br/>
    La méthode par amplification indiquée en a) ci-dessus est utilisée dans le présent document et avec les publications référencées à l'Article 2; elle définit les procédures d'essai à suivre par défaut pour les essais de vibrations sur les véhicules ferroviaires.<br/>
    Bien que le présent document concerne en premier lieu les véhicules ferroviaires sur réseaux ferrés fixes, une utilisation plus large de celle-ci n'est pas interdite. Pour les systèmes sur pneus ou d'autres systèmes de transport comme les trolleybus, pour lesquels les niveaux de choc et de vibration diffèrent nettement de ceux obtenus sur les systèmes à rails fixes, des niveaux d'essai spécifiques peuvent être envisagés. Dans ce cas, les spectres de fréquence, ainsi que la durée et l'amplitude du choc, sont calculés conformément aux directives de l’Annexe A.<br/>
    L’Annexe F fournit la charge de vibration fonctionnelle aléatoire que l'utilisateur peut prendre en compte pour les véhicules urbains fonctionnant sur pneus.<br/>
    IEC 61373 : 2026 s'applique aux essais mono-axiaux. Toutefois, des essais multi-axiaux sont possibles.<br/>
    Les boulons d'ancrage aux points de fixation du matériel ne sont pas évalués dans le présent document.<br/>
    Le présent document est destiné à évaluer le matériel monté sur la structure principale du véhicule (et les composants fixés sur celle-ci). Elle n'est pas prévue pour les essais des matériels qui font partie de la structure principale. La structure principale au sens du présent document signifie la caisse, le bogie et l'axe.<br/>
    Les éléments suivants n'entrent pas dans le domaine d'application du présent document:<br/>
    – moteurs de traction pour véhicules ferroviaires;<br/>
    – toute sous-structure mécanique non équipée de composants électriques, électroniques ou pneumatiques.<br/>
    Des essais supplémentaires ou spéciaux pour certains matériels spécifiques ne sont pas spécifiés dans le présent document, par exemple:<br/>
    a) matériels fixés sur ou reliés à des éléments qui sont connus pour produire une excitation à fréquence définie;<br/>
    b) matériels tels les pantographes, les frotteurs ou les composants de suspension qui peuvent être soumis à une excitation de chocs et vibrations spécifique;<br/>
    c) matériels destinés à être utilisés dans des environnements de service spéciaux comme spécifié par le client;<br/>
    d) essais de transport et de manutention.<br/>
    Cette troisième édition annule et remplace la deuxième édition publiée en 2010. Cette édition constitue une révision technique.<br/>
    Cette édition inclut également les modifications techniques majeures suivantes par rapport à l'édition précédente:<br/>
    a) prise en compte du spectre ASD spécifique à partir des mesures à bord et de la certification limitée au cas spécifique;<br/>
    b) exclusion du domaine d'application des moteurs de traction et de toute sous-structure non équipée d'un dispositif électrique, électronique ou pneumatique;<br/>
    c) clarification de l'ordre des essais et de la séquence d'essai type, en tenant compte de la possibilité d'essais multi-axiaux simultanés;<br/>
    d) recommandations et lignes directrices pour l'enlèvement des fixations élastiques du matériel (si elles sont situées entre le matériel et la structure principale) au cours de l'essai d’endurance;<br/>
    e) qualification du dispositif de fixation utilisé pour attacher le matériel au banc d'essai;<br/>
    f) lignes directrices pour l'utilisation d'un point de mesure comme moyen d'évaluer l'intégrité mécanique;<br/>
    g) changement de la méthode pour calculer le taux d'accélération qui doit être appliqué à la valeur fonctionnelle de la densité spectrale d'accélération (ASD) pour obtenir une valeur simulée d'ASD sur le long terme;<br/>
    h) la durée de l'essai d’endurance peut être réglée de 5 heures à 100 heures par axe, le rapport d'accélération correspondant (valeur par défaut) étant indiqué dans un tableau;<br/>
    i) clarification du concept d'intégrité structurelle;<br/>
    j) description des cas d'exemption d'essai, des essais de sous-ensembles et de l'analyse par éléments finis pour les parties structurelles du matériel (nouvelle Annexe E);<br/>
    k) fixation de la fréquence la plus basse fréquence f1 du spectre ASD de Catégorie 1 et de Catégorie 2 à 5 Hz comme valeur par défaut, et fixation de la fréquence la plus basse fréquence f1 du spectre ASD de Catégorie 3 à 10 Hz comme valeur par défaut;<br/>
    l) mise à jour du spectre ASD pour l'essai fonctionnel de vibration aléatoire: Tableau 1, Tableau 2, Tableau 3, Tableau 4, Tableau A.2 et Figure 6, Figure 7, Figure 8, Figure 10. Cette mise à jour a été recommandée dans le document du programme de recherche du Rail Safety and Standard Board: « Environnement de vibration pour équipements montés sur véhicules ferroviaires »;<br/>
    m) nouvelle annexe F dédiée aux véhicules urbains fonctionnant sur pneus.
