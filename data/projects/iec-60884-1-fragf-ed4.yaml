abstract:
- language: en
  script: Latn
  content: |
    IEC 60884-1:2022 applies to plugs and fixed or portable socket-outlets for AC only, with or without earthing contact, with a rated voltage greater than 50 V but not exceeding 440 V and a rated current not exceeding 32 A, intended for household and similar purposes, either indoors or outdoors.<br/>
    Compatible plugs and socket-outlets, when combined, form a plug and socket-outlet system. Standardized systems used around the world are reported in IEC/TR 60083.<br/>
    The rated current is limited to 16 A maximum for accessories provided with screwless-type terminals.<br/>
    This fourth edition cancels and replaces the third edition published in 2002, Amendment 1:2006 and Amendment 2:2013. This edition constitutes a technical revision.<br/>
    This edition includes the following significant technical changes with respect to the previous edition:

    	plugs and socket-outlets incorporating pilot lights;
    	crimped connections in accessories;
    	insulation piercing terminals (IPT);
    	accessories to be used with American Wire Gauge (AWG) cables;
    	accessories used in T° below −5 °C down to and including <em>−</em>45 °C;
    	accessories used in T° above +40 °C up to and including +70 °C;
    	plugs and socket-outlets for high load (HL);
    	clarification of some definitions;
    	durability of markings test;
    	introduction of thermal monitoring in the plug;
    	requirements for shutters in portable socket-outlets;
    	test walls for the verification of ingress of water;
    	rewriting of the temperature rise clause.
- language: fr
  script: Latn
  content: |-
    L'IEC 60884-1:2022 s'applique aux fiches et aux socles fixes ou mobiles pour courant alternatif seulement, avec ou sans contact de terre, de tension assignée supérieure à 50 V, mais inférieure ou égale à 440 V et de courant assigné inférieur ou égal 32 A, destinés aux usages domestiques et usages analogues, à l'intérieur ou à l'extérieur des bâtiments.<br/>
    Les fiches et socles compatibles, lorsqu'ils sont combinés, forment un système de prise de courant. Les systèmes normalisés utilisés dans le monde sont indiqués dans l'IEC/TR 60083.<br/>
    Le courant assigné est limité à 16 A au maximum pour les appareils équipés de bornes sans vis.<br/>
    Cette quatrième édition annule et remplace la troisième édition parue en 2002, l'Amendement 1:2006 et l'Amendement 2:2013. Cette édition constitue une révision technique.<br/>
    Cette édition inclut les modifications techniques majeures suivantes par rapport à l'édition précédente:

    	fiches et socles qui comportent des lampes indicatrices;
    	raccordements par sertissage dans les appareils;
    	bornes à perçage d'isolant (IPT);
    	appareils à utiliser avec des câbles American Wire Gauge (AWG);
    	appareils utilisés à des températures inférieures à −5 °C jusqu'à <em>−</em>45 °C inclus;
    	appareils utilisés à des températures supérieures à +40 °C jusqu'à +70 °C inclus;
    	fiches et socles pour charge élevée (HL);
    	clarification de certaines définitions;
    	essai de durabilité des marquages;
    	introduction du monitorage thermique dans la fiche;
    	exigences relatives aux obturateurs dans les socles mobiles;
    	murs d'essai pour la vérification de la pénétration de l'eau;
    	réécriture de l'article relatif à l'échauffement.

    La présente version bilingue (2022-11) correspond à la version anglaise monolingue publiée en 2022-08.<br/>
    La version française de cette norme n'a pas été soumise au vote.
