abstract:
- language: en
  script: Latn
  content: |-
    IEC 62372:2021 is applicable to housed scintillators for registration and spectrometry of alpha-, beta-, gamma-, X-ray and neutron radiation. This document specifies the requirements for the testing equipment and test methods of the basic parameters, of housed scintillators, such as:<br/>
    - the direct method is applicable to measure the light output of housed scintillators based on scintillation material. The housed scintillators certified by this method can be used as working standard of housed scintillators (hereinafter: working standard) when performing measurements by a relative method of comparison.<br/>
    - the relative method of comparison with the working standard is applicable to housed scintillators based on the same scintillation material as the working standard.<br/>
    This second edition cancels and replaces the first edition published in 2006. This edition includes the following significant technical changes with respect to the previous edition:<br/>
    - Title has been modified.<br/>
    - To review the existing requirements and to update the terminology, definitions and normative references.
- language: fr
  script: Latn
  content: |-
    IEC 62372:2021 s'applique aux scintillateurs montés utilisés pour l'enregistrement et la spectrométrie des radiations ionisantes (alpha, bêta, gamma, X et neutrons. Le présent document spécifie les exigences pour l'équipement d'essai et les méthodes d'essai des paramètres de base des scintillateurs montés, par exemple:<br/>
    - la méthode directe est destinée à mesurer la lumière sortante de scintillateurs montés à partir d'un matériau de scintillation donné. Les scintillateurs montés certifiés avec cette méthode peuvent servir d'étalon de travail pour les scintillateurs montés (ci-après: étalon de travail) quand la méthode de comparaison est utilisée;<br/>
    - la méthode de comparaison à l'étalon de travail est adaptée pour les scintillateurs montés qui présentent le même matériau de scintillation que l'étalon de travail.<br/>
    Cette deuxième édition annule et remplace la première édition parue en 2006. Cette édition inclut les modifications techniques majeures suivantes par rapport à l'édition précédente:<br/>
    - le titre a été modifié;<br/>
    - les exigences existantes ont été révisées et la terminologie, les définitions et les références normatives ont été mises à jour.
