abstract:
- language: en
  script: Latn
  content: Provides the method to measure the coupled power ratio (CPR) coefficient. The CPR coefficient may be measured at both 850 nm and 1 300 nm wavelengths. CPR measurements are used to characterise optical sources and to standardize the launch conditions for measurements of attenuation on multimode fibres and inseration loss according to IEC 61300-3-4.
