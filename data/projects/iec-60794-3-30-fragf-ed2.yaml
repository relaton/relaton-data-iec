abstract:
- language: fr
  script: Latn
  content: |-
    la CEI 60794-3-30:2008 donne de famille s'applique aux câbles optiques de télécommunication destinés à être utilisés pour les traversées des lacs et des rivières, et pour les applications côtières. Les exigences de la spécification intermédiaire CEI 60794-3 pour les câbles installés dans des conduites, enterrés, aériens, et pour les traversées de lacs et de rivières, et les applications côtières, sont applicables aux câbles couverts par la présente norme. Les principaux changements par rapport à l'édition précédente sont:<br/>
    - le titre de cette spécification a été mis à jour pour inclure les applications côtières;<br/>
    - les spécifications de fibres ont été étendues afin d'inclure les fibres de type B5; et<br/>
    - une annexe a été ajoutée comprenant des exigences supplémentaires selon la table "MICE".
