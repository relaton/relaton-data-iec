abstract:
- language: en
  script: Latn
  content: |-
    IEC 61869-3:2011 applies to new inductive voltage transformers for use with electrical measuring instruments and electrical protective devices at frequencies from 15 Hz to 100 Hz. This standard replaces IEC 60044-2: Inductive Voltage Transformers.<br/>
    <br/>
    This publication is to be read in conjunction with IEC 61869-1:2007.
- language: fr
  script: Latn
  content: |-
    La CEI 61869-3:2011 est applicable aux transformateurs inductifs de tension neufs destinés à être utilisés avec des appareils de mesure électriques et des dispositifs électriques de protection, de fréquence comprise entre 15 Hz et 100 Hz. La présente Norme remplace la CEI 60044-2 relatives aux transformateurs inductifs de tension.<br/>
    <br/>
    Cette publication doit être lue conjointement avec la CEI 61869-1:2007.
