abstract:
- language: en
  script: Latn
  content: Applicable to electrical measuring instruments incorporating a radioactive sealed or non-dispersible unsealed source for self-calibration or for measurement. Not applicable to instruments used for the control of nuclear reactors or for medical diagnostic or therapeutic purposes.
- language: fr
  script: Latn
  content: Applicable aux appareils électriques de mesure dans lesquels est incorporée une source scellée ou une source non scellée non dispersive destinée à l'étalonnage de l'appareil ou à la mesure. Non applicable aux appareils utilisés pour la commande de réacteurs nucléaires ou à des fins de diagnostic médical ou thérapeutique.
