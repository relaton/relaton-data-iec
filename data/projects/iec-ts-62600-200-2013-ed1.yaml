abstract:
- language: en
  script: Latn
  content: |-
    IEC/TS 62600-200:2013(E) provides the following items:<br/>
    - a systematic methodology for evaluating the power performance of tidal current energy converters (TECs) that produce electricity for utility scale and localized grids;<br/>
    - a definition of TEC rated power and rated water velocity;<br/>
    - a methodology for the production of the power curves for the TECs in consideration;<br/>
    - a framework for the reporting of results.
