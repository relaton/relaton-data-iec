  script: Latn
  content: Ne traite que des phénomènes transitoires qui ne se rapportent pas à la fréquence du réseau et durent 40 ms au maximum. Ne traite pas non plus de variations ni de fluctuations de tension prolongées. Cette publication a le statut d'un rapport.
