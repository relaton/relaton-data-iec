abstract:
- language: en
  script: Latn
  content: |-
    IEC 62623:2022 covers personal computing products. It applies to desktop and notebook computers as defined in 4.1 that are marketed as final products and that are hereafter referred to as the equipment under test (EUT) or product. This document specifies:<br/>
    - a test procedure to enable the measurement of the power and/or energy consumption in each of the EUT's power modes;<br/>
    - formulas for calculating the typical energy consumption (TEC) for a given period (normally annual);<br/>
    - a majority profile to be used with this document which enables conversion of average power into energy within the TEC formulas;<br/>
    - a pre-defined format for the presentation of results.<br/>
    This document does not set any pass/fail criteria for the EUTs. Users of the test results define such criteria. IEC 62623:2022 cancels and replaces the first edition published in 2012. This edition constitutes a technical revision. The first edition of this standard was originally based on ECMA-383. This edition includes the following significant technical changes with respect to the previous edition:<br/>
    a) Additions to terms &amp; definitions and modification to short &amp; long idle descriptions.<br/>
    b) Test setup modifications for notebooks where battery pack cannot be removed for testing.<br/>
    c) Categorisation procedure based on ECMA-389 removed.<br/>
    d) Replace majority profile with new duty cycle study including new duty cycle attributes for desktop and notebook in a residential and enterprise application.<br/>
    e) Removal of any reference and test methodology to ENERGY STAR V5.
- language: fr
  script: Latn
  content: |-
    L'IEC 62623:2022 traite des produits informatiques personnels. Il s'applique aux ordinateurs de bureau et aux ordinateurs portables définis en 4.1, qui sont commercialisés en tant que produits finaux et appelés ci-après matériel à l'essai (EUT, Equipment Under Test) ou produit. Le présent document spécifie:<br/>
    - une procédure d'essai pour mesurer la consommation de puissance et/ou d'énergie dans chacun des modes d'alimentation de l'EUT;<br/>
    - des formules pour calculer la consommation d'énergie type (TEC, Typical Energy Consumption) sur une période donnée (annuellement en général);<br/>
    - le profil majoritaire à utiliser avec le présent document pour convertir la puissance moyenne en énergie dans les formules de TEC;<br/>
    - un format prédéfini pour la présentation des résultats.<br/>
    Le présent document n'établit aucun critère de réussite/d'échec pour les EUT. Ces critères sont définis par les utilisateurs des résultats d'essai. L'IEC 62623:2022 annule et remplace la première édition parue en 2012. Cette édition constitue une révision technique. La première édition de la présente norme a été établie sur la base de l'ECMA-383. Cette édition inclut les modifications techniques majeures suivantes par rapport à l'édition précédente:<br/>
    a) des termes et définitions ont été ajoutés, et les descriptions relatives aux termes attente courte et attente longue ont été modifiées;<br/>
    b) le montage d'essai a été modifié pour les ordinateurs portables dont le bloc de batteries ne peut pas être retiré pour les essais;<br/>
    c) la procédure de classification issue de l'ECMA-389 a été supprimée;<br/>
    d) le profil majoritaire a été remplacé par une nouvelle étude des cycles de service; de nouveaux attributs de cycle de service ont été ajoutés pour les ordinateurs de bureau et les ordinateurs portables destinés à une application domestique et d'entreprise;<br/>
    e) les références à la spécification et à la méthodologie d'essai ENERGY STAR V5 ont été supprimées.
