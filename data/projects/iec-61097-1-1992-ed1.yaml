abstract:
- language: en
  script: Latn
  content: Specifies the performance standards and type testing of marine radar transponders used in search and rescue operations at sea (SART), as required by the relevant regulations of the international SOLAS convention. Is associated with IEC 60936 and IEC 60945.
- language: fr
  script: Latn
  content: Définit les normes de fonctionnement et les essais de type des répondeurs radar maritimes utilisés pour les opérations de recherche et de sauvetage en mer (SAR), comme exigé par les règles applicables de la convention internationale SOLAS. Est associée avec les CEI 60936 et CEI 60945.
