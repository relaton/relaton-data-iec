abstract:
- language: fr
  script: Latn
  content: La CEI 61340-4-6:2010 donne les méthodes d'essai électriques et mécaniques et les limites de performance pour les essais d'évaluation, d'acceptation et fonctionnels des bracelets de conduction dissipative. Cette norme couvre les essais des bracelets antistatiques et des systèmes de bracelets antistatiques pour la mise à la terre du personnel amené à travailler avec des assemblages et dispositifs sensibles aux ESD. Elle ne couvre pas les systèmes de surveillance constante.
