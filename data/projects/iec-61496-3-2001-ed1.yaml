abstract:
- language: en
  script: Latn
  content: |-
    Specifies additional requirements for the design, construction and
    testing of electro-sensitive protective equipment (ESPE) for the safeguarding of machinery, employing active opto-electronic protective devices responsive to diffuse reflection (AOPDDRs) for the sensing function.
- language: fr
  script: Latn
  content: Définit les prescriptions supplémentaires de conception, deconstruction et dessais déquipements de protection électro-sensibles (ESPE) pour la sécurité des machines, utilisant pour la fonction de détection des systèmes actifs optoélectroniques sensibles aux réflexions diffuses (AOPDDR).
