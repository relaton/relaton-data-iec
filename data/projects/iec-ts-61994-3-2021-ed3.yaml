  content: |-
    IEC TS 61994-3:2021(E) gives the terms and definitions for piezoelectric, dielectric and electrostatic oscillators representing the state of the art, which are intended for use in the standards and documents of IEC TC 49.<br/>
    The main changes with respect to the previous edition are as listed below:<br/>
    - some definitions have been updated;<br/>
    - the terminology given in IEC 60679-1:2017 has been taken into account;<br/>
    - new terminologies are added.
