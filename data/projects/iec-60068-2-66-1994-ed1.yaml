abstract:
- language: en
  script: Latn
  content: IEC 60068-2-66:1994 Provides a standard test procedure for the prupose of evaluating, in an accelerated manner, the resistance of small electrotechnical products, primarily non-hermetically sealed components, to the deteriorative effect of damp heat. The test is not intended to evaluate external effects, such as corrosion and deformation.
- language: fr
  script: Latn
  content: IEC 60068-2-66:1994 Fournit une méthode d'essai normalisée permettant d'évaluer, de manière accélérée, la résistance de produits électrotechniques de petites dimensions, principalement de composants non hermétiquement fermés, à la dégradation par la chaleur humide. L'essai n'a pas pour but d'évaluer les effets externes tels que la corrosion et la déformation.
