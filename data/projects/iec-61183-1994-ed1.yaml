  script: Latn
  content: Décrit une méthode d'étalonnage en champ libre pour déterminer les niveaux de sensibilité sous incidence aléatoire des sonomètres. En outre, elle décrit une méthode d'étalonnage en champs diffus pour déterminer les niveaux de sensibilité en champs diffus.
