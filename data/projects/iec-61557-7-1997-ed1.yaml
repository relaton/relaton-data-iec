abstract:
- language: en
  script: Latn
  content: |-
    Specifies requirements for measuring equipment applied to testing th
    e phase sequence in three-phase distribution systems. Indication of
    the phase sequence may be mechanical, visual and/or audible.
- language: fr
  script: Latn
  content: |-
    Définit les prescriptions applicables aux appareils de mesure
    destinés à contrôler l'ordre des phases dans des réseaux triphasés.
