abstract:
- language: en
  script: Latn
  content: |-
    Gives guidance on specifying required dependability characteristics
    in product and equipment specifications, together with
    specifications of procedures and criteria for verification. 

    Includes advice on specifying quantitative and qualitative
    reliability, maintainability and availability requirements.
- language: fr
  script: Latn
  content: |-
    Donne des recommandations pour spécifier les caractéristiques de
    sûreté de fonctionnement qui sont préscrites dans les
    spécifications de produits et de matériels, ainsi que pour
    spécifier les procédures et les critères de vérification.

    On trouve notamment des conseils pour spécifier des exigences
    quantitatives et qualitatives de fiabilité, de maintenabilité et de
    disponibilité.
