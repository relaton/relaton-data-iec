abstract:
- language: en
  script: Latn
  content: |-
    IEC 61250:2026 establishes the requirements for instrumentation necessary to detect leakage from reactor coolant systems of all types of light water and heavy water nuclear reactors. Methods of leakage detection are described and characteristics of different methods of detection and of differentiating between allowable and abnormal leakages are given.<br/>
    IEC 61250 has been prepared by subcommittee 45A: Instrumentation, control and electrical power systems of nuclear facilities, of IEC technical committee 45: Nuclear instrumentation. It is an International Standard.<br/>
    This second edition cancels and replaces the first edition published in 1994. This edition constitutes a technical revision.<br/>
    This edition includes the following significant technical changes with respect to the previous edition:<br/>
    a) to take into account new advances in leakage detection technology, and to renew general design requirements for leakage detection systems;<br/>
    b) to align the document with the new revisions of reference standards and documents.
