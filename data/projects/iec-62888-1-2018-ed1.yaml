abstract:
- language: en
  script: Latn
  content: IEC 62888-1:2018 describes the primary purpose of the Energy Measurement System (EMS), which measures energy consumption on board for applications such as energy management, energy saving, billing and others. It gives requirements for the complete EMS and also requirements for all devices implementing one or more functions of the EMS; applies to newly manufactured EMSs for use on board traction units, powered by AC and/or DC supply voltages as listed in IEC 60850.
- language: fr
  script: Latn
  content: L'IEC 62888-1:2018 décrit le principal objectif du système de mesure d’énergie (EMS) qui mesure la consommation d'énergie à bord pour des applications telles que la gestion de l’énergie, les économies d’énergie, la facturation, etc. Cette norme définit les exigences générales pour l’EMS complet ainsi que les exigences pour tous les dispositifs mettant en œuvre une ou plusieurs fonctions de l’EMS; elle’applique à des EMS nouvellement fabriqués pour l’utilisation à bord d’unités de traction alimentées par des tensions d’alimentation en courant alternatif et/ou en courant continu comme indiqué dans l’IEC 60850.
