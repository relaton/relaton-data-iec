abstract:
- language: en
  script: Latn
  content: |-
    IEC 60793-1-40:2024 establishes uniform requirements for measuring the attenuation of optical fibre, thereby assisting in the inspection of fibres and cables for commercial purposes. Four methods are described for measuring attenuation, one being that for modelling spectral attenuation:<br/>
    -method A: cut-back;<br/>
    -method B: insertion loss;<br/>
    -method C: backscattering;<br/>
    -method D: modelling spectral attenuation.<br/>
    Methods A to C apply to the measurement of attenuation for all categories of the following fibres:<br/>
    -class A multimode fibres;<br/>
    -class B single-mode fibres.<br/>
    Method C, backscattering, also covers the location, losses and characterization of point discontinuities.<br/>
    Method D is applicable only to class B fibres.<br/>
    Information common to all four methods appears in Clause 1 to Clause 11, and information pertaining to each individual method appears in Annex A, Annex B, Annex C, and Annex D, respectively.<br/>
    This third edition cancels and replaces the second edition published in 2019. This edition constitutes a technical revision. This edition includes the following significant technical changes with respect to the previous edition:<br/>
    a) modifying the definition of attenuation to be compatible with the definition in electropedia.org
- language: fr
  script: Latn
  content: |-
    L'IEC 60793-1-40:2024 établit des exigences harmonisées pour mesurer l'affaiblissement d'une fibre optique, contribuant ainsi au contrôle des fibres et des câbles à des fins commerciales. Quatre méthodes sont décrites pour mesurer l'affaiblissement, parmi lesquelles une méthode pour modéliser l'affaiblissement spectral:<br/>
    -méthode A: fibre coupée;<br/>
    -méthode B: pertes d'insertion;<br/>
    -méthode C: rétrodiffusion;<br/>
    -méthode D: modélisation de l'affaiblissement spectral.<br/>
    Les méthodes A à C s'appliquent au mesurage de l'affaiblissement pour toutes les catégories de fibres suivantes:<br/>
    -fibres multimodales de classe A;<br/>
    -fibres unimodales de classe B.<br/>
    La méthode C, rétrodiffusion, s'applique aussi à la localisation, aux pertes et à la caractérisation des discontinuités ponctuelles.<br/>
    La méthode D s'applique uniquement aux fibres de classe B.<br/>
    Les informations communes à ces quatre méthodes sont présentées aux Articles 1 à 11, et les informations propres à chaque méthode individuelle, sont présentées à l'Annexe A, l'Annexe B, l'Annexe C et l'Annexe D, respectivement.<br/>
    Cette troisième édition annule et remplace la deuxième édition parue en 2019. Cette édition constitue une révision technique. Cette édition inclut les modifications techniques majeures suivantes par rapport à l'édition précédente:<br/>
    a) modification de la définition de l'affaiblissement pour s'aligner sur la définition du site electropedia.org
