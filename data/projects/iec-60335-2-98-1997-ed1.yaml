abstract:
- language: en
  script: Latn
  content: Deals with the safety of electric humidifiers for household and similar use. The room air is humidified by evaporating or atomizing water. Deals with the common hazards presented by humidifiers which are encountered by all persons in and around the home, in shops, in light industry and on farms.
- language: fr
  script: Latn
  content: Traite de la sécurité des humidificateurs électriques pour usages domestiques et analogues. L'air de la pièce est humidifié en vaporisant ou en atomisant l'eau. Traite des risques ordinaires présentés par les humidificateurs, encourus par tous les individus à l'intérieur et autour de l'habitation, dans des magasins, chez des artisans et dans des fermes.
