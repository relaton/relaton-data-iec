abstract:
- language: en
  script: Latn
  content: |-
    IEC 62481-1:2013(E) specifies the core architecture and protocols of DLNA implementations It provides vendors with the information needed to build interoperable networked platforms and devices for the digital home. This second edition cancels and replaces the first edition published in 2007 and constitutes a technical revision. It includes the following changes:<br/>
    - inclusion of variable play (trick mode) support;<br/>
    - addition of the Scheduled Recording feature;<br/>
    - addition of the EPG feature;<br/>
    - additon fo the RUI feature;<br/>
    - addition of the Upload and Download Synchronziation feature;<br/>
    - additon of Wi-Fi Direct, MoCA, and HPNA Phys;<br/>
    - inclusion of updates to resolve interoperability issues.
