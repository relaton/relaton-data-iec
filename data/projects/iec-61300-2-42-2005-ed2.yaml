abstract:
- language: en
  script: Latn
  content: This part of IEC 61300 specifies a test to determine the influence of a side load applied to a connector plug. The intention is to simulate the load, due to a length of fibre cable, which would typically be experienced during service.
- language: fr
  script: Latn
  content: La présente partie de la CEI 61300 spécifie un essai destiné à déterminer l'influence d'une charge latérale appliquée à une fiche de connecteur. L'intention est de simuler la charge exercée par une longueur de câble à fibres, que l'on rencontre généralement au cours du service.
