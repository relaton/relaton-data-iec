abstract:
- language: en
  script: Latn
  content: IEC 60255-27:2023 specifies the product safety requirements for measuring relays and protection equipment having a rated AC voltage up to 1 000 V, or a rated DC voltage up to 1 500 V. This document specifies essential safety requirements to minimize the risk of fire and hazards caused by electric shock or injury to the user and property. This document specifies only product safety requirements; functional performance of the equipment is not covered. This document covers all the ways in which the equipment can be mounted and used in cabinets, racks and panels. This document also applies to auxiliary devices such as shunts, series resistors, transformers, auxiliary control panels, display devices, etc., that are used in conjunction with measuring relays and protection equipment and are tested together.
- language: fr
  script: Latn
  content: L'IEC 60255-27:2023 spécifie les exigences de sécurité des produits pour les relais de mesure et les dispositifs de protection avec une tension assignée en courant alternatif inférieure ou égale à 1 000 V ou avec une tension assignée en courant continu inférieure ou égale à 1 500 V. Le présent document spécifie les exigences de sécurité fondamentales pour réduire le plus possible les risques d'incendie et de dangers causés par un choc électrique ou les risques de blessure de l'utilisateur et de dégradation matérielle. Le présent document spécifie uniquement les exigences de sécurité des produits; les performances fonctionnelles du matériel ne sont pas couvertes. En revanche, le présent document couvre tous les modes qui peuvent être utilisés pour le montage et l'utilisation du dispositif dans des baies, des racks ou des panneaux. Le présent document s'applique aussi aux dispositifs auxiliaires comme les shunts, résistances série, transformateurs, panneaux de commande auxiliaires, dispositifs d'affichage, etc., qui sont utilisés conjointement avec les relais de mesure et les dispositifs de protection et sont soumis à l'essai ensemble.
