abstract:
- language: en
  script: Latn
  content: |-
    Describes the concept of maintainability, defines the general approach and gives the objectives of maintainability. Gives the maintainability requirements for specifications and contracts and describes the contents of maintainability programmes.
    Sections 1 and 3 are replaced by IEC 60300-3-10 (2000).
- language: fr
  script: Latn
  content: |-
    Décrit le concept de la maintenabilité, définit une première approche et donne les objectifs de la maintenabilité. Donne les exigences de maintenabilité dans les spécifications et contrats et décrit le contenu d'un programme de maintenabilité.
    Les sections 1 et 3 sont remplacées par la CEI 60300-3-10 (2000).
