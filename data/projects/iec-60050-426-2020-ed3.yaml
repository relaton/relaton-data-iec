abstract:
- language: en
  script: Latn
  content: |-
    IEC 60050-426:2020 gives terms specifically relevant to explosive atmospheres. This new edition reviews and complements the previous one. This terminology is consistent with the terminology developed in the other specialized parts of the IEV.<br/>
    It has the status of a horizontal standard in accordance with IEC Guide 108.
- language: fr
  script: Latn
  content: |-
    IEC 60050-426:2020 définit les termes spécifiquement relatifs aux atmosphères explosives. Cette nouvelle édition révise et complète la précédente. Cette terminologie est en accord avec la terminologie figurant dans les autres parties spécialisées de l'IEV.<br/>
    Elle a le statut de norme horizontale conformément au Guide IEC 108.
