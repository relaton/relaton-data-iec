abstract:
- language: fr
  script: Latn
  content: La CEI 60774-5:2004 s'applique à l'enregistrement par paquets MPEG TS (flux de transport) pour les systèmes de magnétoscope à cassette à balayage hélicoïdal utilisant la bande magnétique de 12,65 mm (0,5 in) de format VHS. La présente norme spécifie les cassettes, la bande, la configuration des pistes, la structure des données, la méthode d'enregistrement et le format MPEG-TS pour le D-VHS. La présente version bilingue (2012-08) correspond à la version anglaise monolingue publiée en 2004-04.
