abstract:
- language: en
  script: Latn
  content: |-
    IEC 61196-1-101:2025 applies to coaxial communications cables. It specifies test methods for determining the conductor DC resistance of coaxial cables.<br/>
    This second edition cancels and replaces the first edition published in 2005. This edition constitutes a technical revision.<br/>
    This edition includes the following significant technical changes with respect to the previous edition:<br/>
    a) Clause 4, Test equipment, is extended;<br/>
    b) in Clause 5, the cable length is specified;<br/>
    c) Clause 6, Test procedure, is revised;<br/>
    d) Clause 7, Expression of test results, is revised;<br/>
    e) Clause 8, Failure criterion, is introduced;<br/>
    f) Clause 9, Information to be given in the relevant specification, is revised;<br/>
    g) Clause 10, Test report, is revised.
