  script: Latn
  content: Normalise des méthodes d'essai permettant de déterminer les paramètres essentiels et les caractéristiques techniques des installations électrothermiques comportant des fours. S'applique aux installations électriques comportant des fours industriels à induction à canal et des fours industriels à induction à creuset pour la fusion, le maintien et la surchauffe.
