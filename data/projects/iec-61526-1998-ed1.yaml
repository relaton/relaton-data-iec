abstract:
- language: en
  script: Latn
  content: Specifies the design requirements and the performance characteristics of personal dosemeters used for the determination of the total personal dose equivalents and/or the total personal dose equivalent rates for depths of 10 mm and 0,07 mm in the body of the wearer from X, gamma and beta radiations.
- language: fr
  script: Latn
  content: Spécifie les exigences de conception et les caractéristiques de fonctionnement de dosimètres personnels utilisés pour la détermination des équivalents de dose totaux et/ou des débits d'équivalents de dose totaux pour des profondeurs de 10 mm et 0,07 mm dans le corps du porteur pour les rayonnements X, gamma et bêta.
