abstract:
- language: en
  script: Latn
  content: Applies to hard copy cameras producing images on monochrome continuous tone material (such as photographic films and materials sensitive to infrared radiation), and comprising types of cameras using a cathode ray-tube, laser beam, or a thermoprinting system, as used in medical diagnostic imaging systems.
- language: fr
  script: Latn
  content: S'applique aux Reprographes produisant des images sur un matériau d'un ton monochrome continu (tel que les films photographiques et les matériaux sensibles aux radiations infrarouges) et comprenant des types de caméras utilisant un tube à rayons cathodiques, un faisceau laser ou un dispositif à impression thermique, utilisés dans les systèmes de diagnostic par l'image.
