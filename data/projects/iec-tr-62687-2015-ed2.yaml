abstract:
- language: en
  script: Latn
  content: |-
    IEC TR 62687:2015(E) contains a collection of terms (glossary) used in IEC, ISO and ITU publications in the field of graphical symbols for use on equipment including some related fields. Some terms are annotated and/or modified for the purpose of clarification. This second edition cancels and replaces the first edition published in 2011. This edition constitutes a technical revision and includes the following significant technical changes with respect to the previous edition:<br/>
    - The title has changed from "terminology" to "vocabulary";<br/>
    - Annex A has been added.
