abstract:
- language: en
  script: Latn
  content: Specifies the performance requirements for three classes of sound calibrator. Sound calibrators are designed to produce a known effective sound pressure level or levels at a specified frequency or frequencies when coupled to specified models of microphone or specified configurations, for example, with or without protective grid.
- language: fr
  script: Latn
  content: Donne des prescriptions concernant les caractéristiques de trois classes de calibreurs acoustiques. Les calibreurs acoustiques sont conçus pour produire un ou plusieurs niveaux connus de pression acoustique à une ou plusieurs fréquences spécifiées lorsqu'ils sont couplés à des microphones de modèles spécifiés et dans les conditions spécifiées, par exemple avec ou sans grille de protection.
