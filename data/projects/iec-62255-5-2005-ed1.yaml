  script: Latn
  content: is applicable to filled drop cables having a metallic screen over the cable core, a thermoplastic jacket, copper conductors, and solid or cellular insulation. These cables are typically available in 2 to 6 pair. These cables are intended primarily for direct burial in the ground.
