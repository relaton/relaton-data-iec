abstract:
- language: en
  script: Latn
  content: |-
    IEC 62364:2026 gives guidelines for:<br/>
    a) presenting data on hydro-abrasive erosion rates on several combinations of water quality, operating conditions, component materials, and component properties collected from a variety of hydro sites;<br/>
    b) developing guidelines for the methods of minimizing hydro-abrasive erosion by modifications to hydraulic design for clean water. These guidelines do not include details such as hydraulic profile shapes which are determined by the hydraulic design experts for a given site;<br/>
    c) developing guidelines based on “experience data” concerning the relative resistance of materials faced with hydro-abrasive erosion problems;<br/>
    d) developing guidelines concerning the maintainability of materials with high resistance to hydro-abrasive erosion and hardcoatings;<br/>
    e) developing guidelines on an approach, which owners can take to ensure that specifications communicate the need for particular attention to this aspect of hydraulic design at their sites without establishing criteria which cannot be satisfied because the means are beyond the control of the manufacturers;<br/>
    f) developing guidelines concerning operation mode of the hydro turbines in water with particle materials to increase the operation life.<br/>
    It is assumed in this document that the water is not chemically aggressive. Since chemical aggressiveness is dependent upon so many possible chemical compositions, and the materials of the machine, it is beyond the scope of this document to address these issues.<br/>
    This document focuses mainly on hydroelectric power plant equipment. Certain portions can also be applicable to other hydraulic machines.<br/>
    This third edition cancels and replaces the second edition published in 2019. This edition includes the following significant technical changes with respect to the previous edition:<br/>
    a) use of “accumulated sediment amount” instead of ”yearly particle load” in order to have more flexible time periods;<br/>
    b) added a chapter describing an experimental method to define particle abrasiveness;<br/>
    c) deleted description about limitations of continuous particle monitoring instrumentation due to advances in this field;<br/>
    d) added figure showing measurement ranges for various concentration monitoring techniques
