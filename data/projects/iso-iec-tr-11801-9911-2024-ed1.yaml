abstract:
- language: en
  script: Latn
  content: |-
    ISO/IEC TR 11801-9911:2024, which is a Technical Report,<br/>
    a) describes the rules of implementation of balanced single pair as described by ISO/IEC 11801-6:2017/AMD1:202x within a balanced 4- pair cabling system with a current carrying capacity of 0,75 A per conductor;<br/>
    b) describes the use of components and cabling to implement and configure according to ISO/IEC 11801-6:2017/AMD1:202x<br/>
    c) describes links and components for generic single pair channels according to ISO/IEC 11801-1:2017/AMD1:202x. Particular areas of interest are:<br/>
    • remote powering according to IEEE Std 802.3, Clause 104<br/>
    • loop resistance, max. current<br/>
    • insertion loss<br/>
    • return loss<br/>
    • noise considerations<br/>
    • frequency range requirements (low and high)<br/>
    • length calculation of the SCP-Link-4-pair-cable<br/>
    • number of channels<br/>
    d) describes the use of application specific single pair channels in addition to ISO/IEC 11801:2017/AMD1:202x, 6.6.4<br/>
    e) describes guidance on single pair remote powering applications when using 4-pair cabling with current carrying capacity specified<br/>
    f) describes guidelines for planning, administration and installation
