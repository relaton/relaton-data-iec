abstract:
- language: en
  script: Latn
  content: |-
    IEC TS 62271-314:2024, a Technical Specification, applies to high-voltage direct current disconnectors and earthing switches, designed for indoor and outdoor installations and for operation on HVDC transmission systems having direct voltages of 100 kV and above.<br/>
    It also applies to the operating devices of these disconnectors and earthing switches and their auxiliary equipment.<br/>
    NOTE Disconnectors in which the fuse forms an integral part are not covered by this document
