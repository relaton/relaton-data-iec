abstract:
- language: en
  script: Latn
  content: |-
    IEC 63044-1:2017 applies to all Home and Building Electronic Systems (HBES) and Building Automation and Control Systems (BACS) and specifies the general requirements for these systems and products. This document is applicable (but not limited) to<br/>
    operator stations and other human–system interface devices,<br/>
    devices for management functions,<br/>
    control devices, automation stations and application specific controllers,<br/>
    field devices and their interfaces, and<br/>
    cabling and interconnection of devices<br/>
    used within a dedicated HBES/BACS network. This document provides an overview of the IEC 63044 series. To enable integration of a wide spectrum of applications, the IEC 63044 series covers<br/>
    electrical safety,<br/>
    functional safety,<br/>
    environmental conditions,<br/>
    EMC requirements, and<br/>
    installation and cabling rules and topologies.<br/>
    IEC 63044 is a series of product family standards.
- language: fr
  script: Latn
  content: |-
    L'IEC 63044-1:2017 s'applique à tous les systèmes électroniques pour les foyers domestiques et/ou les bâtiments (HBES) et à tous les systèmes de gestion technique du bâtiment (SGTB). Elle spécifie les exigences générales concernant ces systèmes et produits. Le présent document est applicable (mais pas limitée) aux<br/>
    postes d'opérateur et autres dispositifs d'interface homme–système,<br/>
    dispositifs pour des fonctions de gestion,<br/>
    dispositifs de commande, postes d'automatisation et contrôleurs spécifiques à une application,<br/>
    dispositifs de terrain, et<br/>
    câblage et interconnexion des dispositifs<br/>
    utilisés dans un réseau HBES/SGTB. Le présent document fournit une vue d'ensemble de la série IEC 63044. Pour permettre l'intégration d'un large spectre d'applications, la série IEC 63044 couvre les éléments suivants:<br/>
    la sécurité électrique;<br/>
    la sécurité fonctionnelle;<br/>
    les conditions d’environnement;<br/>
    les exigences CEM;<br/>
    les règles et les topologies d'installation et de câblage.<br/>
    L'IEC 63044 est une série de normes de famille de produits.
