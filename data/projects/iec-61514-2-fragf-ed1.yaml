abstract:
- language: fr
  script: Latn
  content: prescrit des revues de conception et des essais destinés à mesurer et à déterminer les performances statiques et dynamiques, le degré d'intelligence et les capacités de transmission de données des positionneurs de  vanne intelligents à simple et double effet. Les essais peuvent être appliqués à des positionneurs qui reçoivent des signaux analogiques d'entrée électriques normalisés (comme spécifié dans la norme CEI 60381) et/ou des signaux numériques par l'intermédiaire d'une liaison de transmission de données et qui disposent d'une sortie pneumatique.
