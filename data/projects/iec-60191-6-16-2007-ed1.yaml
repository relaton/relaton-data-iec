- language: en
  script: Latn
  content: IEC 60191-6-16:2007 gives a glossary of semiconductor sockets for BGA, LGA, FBGA and FLGA. This standard intends to establish definitions and unification of terminology relating to tests and burn-in sockets for BGA, LGA, FBGA and FLGA.
- language: fr
  script: Latn
  content: La CEI 60191-6-16:2007 fournit un glossaire relatif aux supports pour boîtiers à semiconducteurs de type BGA, LGA, FBGA et FLGA. Cette norme est destinée à établir des définitions et une unification de la terminologie relatives aux supports de test et de déverminage pour les BGA, LGA, FBGA et FLGA.
