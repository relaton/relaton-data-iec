abstract:
- language: fr
  script: Latn
  content: |-
    L'IEC 60079-10-1:2015 concerne le classement des emplacements dans lesquels des dangers dus à des gaz ou vapeurs inflammables peuvent apparaître, et ainsi constitue une base pour le choix et l'installation corrects du matériel utilisé dans de tels emplacements. Elle est destinée à être appliquée là où il peut exister un danger d'inflammation du fait de la présence de gaz ou vapeurs inflammables, en mélange avec l'air, mais elle ne s'applique pas:<br/>
    - aux mines grisouteuses;<br/>
    - au traitement et à la fabrication des explosifs;<br/>
    - aux défaillances catastrophiques ou rares dysfonctionnements, qui dépassent le concept d'anormalité traité dans la présente norme (voir 3.7.3 et 3.7.4);<br/>
    - aux locaux utilisés à des fins médicales;<br/>
    - aux applications commerciales et industrielles dans lesquelles seul du gaz combustible basse pression est utilisé, par exemple, pour cuisiner, chauffer l'eau, etc., l'installation satisfaisant aux codes de gaz correspondants;<br/>
    - aux locaux à usage domestique;<br/>
    - lorsqu'un  danger peut apparaître compte tenu de la présence de poussières combustibles ou de particules combustibles en suspension dans l'air, mais les principes définis peuvent toutefois être appliqués dans l'évaluation d'un mélange hybride (se reporter également à l'IEC 60079-10-2). Cette deuxième édition de l'IEC 60079-10-1 annule et remplace la première édition parue en 2008. Cette édition constitue une révision technique. Les modifications techniques importantes par rapport à l'édition précédente sont identifiés dans l'avant-propos du document.
    Mots clés: danger d'inflammation, gaz ou vapeurs inflammables, risque d'explosions
