abstract:
- language: en
  script: Latn
  content: |-
    CORRECTED VERSION 2026-03<br/>
    <br/>
    IEC 63563-7:2025 defines methods for ensuring that the power transfer proceeds without heating metal objects in the magnetic field of a Power Transmitter. Although the Power Transmitter may optionally use any of these methods, some of them require assistance by the Power Receiver.<br/>
    <br/>
    This corrected version of IEC 63563-7:2025 incorporates the following correction:<br/>
    - correction of the publication date on the cover page.
- language: fr
  script: Latn
  content: |-
    VERSION CORRIGEE 2026-03<br/>
    <br/>
    IEC 63563-7:2025 définit des méthodes permettant de s'assurer que le transfert de puissance se déroule sans échauffement des objets métalliques dans le champ magnétique d'un émetteur de puissance. Bien que l'Exigence puisse utiliser l'une ou l'autre de ces méthodes, certaines d'entre elles requièrent l'assistance du Récepteur de Puissance.<br/>
    <br/>
    Cette version corrigée de l’IEC 63563-7:2025 contient la correction suivante:<br/>
    - correction de la date de publication sur la page de couverture.
