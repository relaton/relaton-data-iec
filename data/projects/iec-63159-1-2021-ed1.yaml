abstract:
- language: en
  script: Latn
  content: |-
    IEC 63159-1:2021 applies to electric instantaneous water heaters for domestic hot water heating for household and similar applications, which show both of the following characteristics:<br/>
    – fulfilling at least one load pattern from Annex A;<br/>
    – heating up to temperatures below the boiling temperature.<br/>
    This document specifies terms, definitions and measurement methods for the assessment of energy efficiency.<br/>
    This document does not take into account requirements regarding the safety of the appliances.
- language: fr
  script: Latn
  content: |-
    L'IEC 63159-1:2021 s'applique aux chauffe-eau instantanés électriques destinés au chauffage de l'eau chaude sanitaire pour des applications domestiques et analogues, présentant les deux caractéristiques suivantes:<br/>
    – satisfaisant à au moins un diagramme de charge de l'Annexe A;<br/>
    – chauffant jusqu'à des températures inférieures à la température d'ébullition.<br/>
    Le présent document spécifie les termes, définitions et méthodes de mesure pour l'évaluation du rendement énergétique.<br/>
    Le présent document ne tient pas compte des exigences concernant la sûreté des appareils.
