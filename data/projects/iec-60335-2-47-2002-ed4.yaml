abstract:
- language: en
  script: Latn
  content: Deals with the safety of electrically operated commercial boiling pans not intended for household use. The rated voltage being not more than 250 V for single-phase appliances connected between one phase and neutral, and 480 V for other appliances. Appliances which are within the scope of this standard are typically used in restaurants, canteens, hospitals and commercial enterprises such as bakeries, butcheries,etc. The electrical part of appliances making use of other forms of energy is also witin the scope of this standard.
