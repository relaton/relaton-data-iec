abstract:
- language: en
  script: Latn
  content: |-
    IEC 61988-4-2:2012 defines testing methods for evaluating mechanical characteristics of plasma display modules (PDP modules) in the following areas:<br/>
    a) Ball drop breaking strength of panels;<br/>
    b) Partial heating strength of panels.
- language: fr
  script: Latn
  content: |-
    La CEI 61988-4-2:2012 définit des méthodes d'essai pour évaluer les caractéristiques mécaniques de modules d'affichage à plasma (modules PDP, Plasma Display Panels) dans les domaines suivants:<br/>
    a) Résistance à la rupture des panneaux par impact d'une bille;<br/>
    b) Résistance à l'échauffement partiel des panneaux.
