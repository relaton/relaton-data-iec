abstract:
- language: fr
  script: Latn
  content: |-
    La CEI 60875-1:2010 s'applique aux dispositifs de couplage pour fibres optiques qui ne dépendent pas de la longueur d'onde. Tous présentent les caractéristiques suivantes:<br/>
    - ils sont passifs, au sens où ils ne contiennent aucun élément optoélectronique ou transducteur;<br/>
    - ils ont trois ports ou plus pour l'entrée et/ou la sortie de la puissance optique, et ils partagent la puissance optique parmi ces ports, selon une modalité spécifiée; les ports sont des fibres optiques ou des connecteurs à fibres optiques.<br/>
    Cette cinquième édition annule et remplace la quatrième édition parue en 2000 et constitue une révision technique. Les modifications par rapport à l'édition précédente sont la suppression de l'article concernant les procédures d'assurance de la qualité et une reconsidération de la structure de la présente norme. Cette version bilingue (2010-10) remplace la version monolingue anglaise.
