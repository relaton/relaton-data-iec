abstract:
- language: en
  script: Latn
  content: |-
    IEC 63510-4-1:2025 This document specifies the application of relevant transport protocols for Home and Wide Area Networks as well as cloud connectivity; in this case, SPINE (Smart Premises Interoperable Neutral-Message Exchange), SPINE-IoT, and SHIP (Smart Home IP).<br/>
    This document is part of the IEC 63510 series, which defines the information exchange between Smart Appliances and management systems in homes and buildings including energy management.<br/>
    It is based on EN 50631-4-1:2023 and was submitted as a Fast-Track document.
