abstract:
- language: fr
  script: Latn
  content: |-
    L'IEC 60684-3-212:2005 donne les exigences pour quatre types de gaines thermorétractables en polyoléfine adaptées à une utilisation à des températures allant jusqu'à 135 °C.<br/>
    Type A: retardatrices de flamme, rapport de rétreint 2:1,<br/>
    Type B: non retardatrices de flamme, rapport de rétreint 2:1,<br/>
    Type C: retardatrices de flamme, rapport de rétreint 3:1,<br/>
    Type D: non retardatrices de flamme, rapport de rétreint 3:1. Cette deuxième édition annule et remplace la première édition publiée en 1998 et constitue une révision technique. Cette édition comprend les modifications significatives suivantes par rapport à l'édition précédente: Remplacement de la méthode d'essai d'endurance thermique conformément à la CEI 60216 par un essai de vieillissement de longue durée, c'est-à-dire 3 000 h à la température maximale recommandée pour un usage adapté, en vue de fournir des données d'essai thermiques dans une échelle de temps exploitable.
    Mots clés: gaines thermorétractables en polyoléfine
