abstract:
- language: en
  script: Latn
  content: |-
    IEC 60068-2-45:2026 provides a test procedure and guidance whereby specimens to be tested are immersed in a certain solvent at a specified temperature and for a specified time. The objective of this procedure is to determine the effects of specified cleaning solvents on electronic components and other parts suitable to be mounted on printed boards when subjected to immersion in the cleaning solvent.<br/>
    This second edition cancels and replaces the first edition published in 1980 and Amendment 1:1993. This edition constitutes a technical revision.<br/>
    This edition includes the following significant technical changes with respect to the previous edition:<br/>
    a) IEC 60068-2-45:1980/AMD1:1993 incorporated;<br/>
    b) refers to new associated document IEC 60068-2-88.
