abstract:
- language: fr
  script: Latn
  content: |-
    L'IEC 60793-1-1:2008 donne la liste, et les lignes directrices pour l'utilisation, des documents qui fournissent les exigences uniformes pour les mesures et les essais des fibres optiques, permettant ainsi le contrôle des fibres et des câbles proposés sur le marché (le plus souvent dans le domaine des télécommunications). Les méthodes d'essai et de mesure individuelles sont contenues dans les différentes parties de la série CEI 60793. Elles sont identifiées CEI 60793-1-X, où "X" est le numéro assigné à une sous-partie, indiquant qu'elle appartient à la CEI 60793-1. En général, les méthodes d'essai et de mesure s'appliquent à toutes les fibres multimodales de la classe A et à toutes les fibres unimodales de la classe B couvertes par la série CEI 60793-2, bien qu'il puisse exister des exceptions. L'article 1 de chaque partie de la CEI 60793 contient le domaine d'application pour chaque attribut particulier.  Cette troisième édition annule et remplace la deuxième édition parue en 2002. Les principales modifications par rapport à l'édition antérieure sont indiquées ci-dessous:<br/>
    - ré-écriture de l'Article 8: Catégories des fibres optiques;<br/>
    - suppression de l'Article 10: Correspondance entre les anciennes désignations des essais et les documents actuels; suppression de la bibliographie.
    Mots clés: directrices pour l'utilisation, des documents qui fournissent les exigences uniformes pour les mesures et les essais des fibres optiques
