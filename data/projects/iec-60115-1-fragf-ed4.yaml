abstract:
- language: fr
  script: Latn
  content: |-
    La CEI 60115-1:2008 est une spécification générique et s'applique aux résistances fixes utilisées dans les équipements électroniques. Elle définit les termes normalisés, les procédures d'inspection et les méthodes d'essai utilisés dans les spécifications intermédiaires et particulières des composants électroniques dans le cadre de l'assurance qualité, ainsi qu'à d'autres fins. La présente norme annule et remplace la CEI 61045-1 (1991), la CEI 61045-2 (1991) et la CEI 61045-2-1 (1991). Cette édition inclut les modifications techniques majeures suivantes par rapport à l'édition précédente:<br/>
    a) mise en place de l'Annexe Q qui remplace l'Article 3;<br/>
    b) addition de nouvelles procédures d'essai de 4.34 au 4.38;<br/> 
    c) retrait de la propriété "caractéristiques de température" de 4.8;<br/> 
    d) introduction d'un nouveau système de sévérités des essais pour l'essai de cisaillement de 4.32;<br/> 
    e) introduction de nouvelles tensions de polarisation pour l'essai continu en chaleur humide de 4.24;<br/>
    f) de plus, cette quatrième édition annule et remplace la troisième édition publiée en 1999 et ajoute des révisions mineures relatives aux tableaux, figures et références.
