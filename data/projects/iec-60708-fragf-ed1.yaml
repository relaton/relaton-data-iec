abstract:
- language: fr
  script: Latn
  content: |-
    L'IEC 60708:2005 est destinée à définir des câbles à isolation polyoléfine prévus pour être insérés dans des réseaux locaux en extérieur. La présente norme s'applique aux câbles téléphoniques à isolation polyoléfine et à gaine polyoléfine à barrière d'étanchéité, remplis ou non avec des conducteurs en cuivre, utilisés comme:<br/>
    a) câbles pour installation en conduites.<br/>
    b) câbles pour enterrement direct en pleine terre.<br/>
    c) câbles avec brin de support intégré pour les installations aériennes. La présente norme est conforme aux Recommandations UIT-T.
    La présente norme inclut des détails de conception générale et des exigences sur les dimensions et autres détails de construction ainsi que des caractéristiques mécaniques, électriques et environnementales pour tous les types de câbles pour basses fréquences à isolation polyoléfine (massive ou cellulaire), remplis ou non et à gaine polyoléfine à barrière d'étanchéité (avec brin de support intégré).
