abstract:
- language: en
  script: Latn
  content: Applies to composite insulators for use as suspension/tension line insulators. Deals with those composite insulators which include a 'core' and a 'housing'. Defines the terms used, prescribes test methods, prescribes acceptance criteria.
- language: fr
  script: Latn
  content: S'applique aux isolateurs composites utilisés pour la suspension ou l'ancrage des lignes. Traite des isolateurs composites incluant un «noyau» et un «revêtement». Définit les termes employés, fixe les méthodes d'essais, fixe les conditions d'acceptation d'une fourniture.
