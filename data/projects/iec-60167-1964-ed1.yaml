abstract:
- language: en
  script: Latn
  content: Describes procedures for rapidly determining the values of the insulation resistance of solid insulating materials in order to give a general indication of quality when great accuracy is not required.
- language: fr
  script: Latn
  content: Décrit des méthodes d'essai rapides pour déterminer les valeurs de la résistance d'isolement des isolants solides en vue de donner une indication générale sur la qualité du matériau quand une grande précision n'est pas nécessaire. Cette rapidité est due à la facilité avec laquelle on peut préparer les éprouvettes.
