abstract:
- language: en
  script: Latn
  content: |-
    IEC 60335-2-125:2026 deals with the safety of electric breast pump appliances for expressing breast milk for household and similar purposes, their rated voltage being not more than 250 V, including direct current (DC) supplied appliances and battery-operated appliances.<br/>
    Appliances not intended for normal household use but that nevertheless can be a source of danger to the public, such as appliances intended to be used outdoors and at lactation specialist offices, are within the scope of this standard.<br/>
    As far as is practicable, this standard deals with the common hazards presented by appliances that are encountered by all persons in and around the home. However, in general, it does not take into account:<br/>
    – persons (including children) whose physical, sensory or mental capabilities; or lack of experience and knowledge<br/>
    prevents them from using the appliance safely without supervision or instruction;<br/>
    – children playing with the appliance.<br/>
    Attention is drawn to the fact that<br/>
    – for appliances intended to be used in vehicles or on-board ships or aircraft, additional requirements can be necessary;<br/>
    – in many countries additional requirements are specified by the national health authorities, the national authorities responsible for the protection of labour and similar authorities.<br/>
    This standard does not apply to<br/>
    – breast pump appliances for expressing breast milk intended for medical purposes (IEC 60601 series);<br/>
    – electric appliances for massage of persons and intended for household and similar purposes (IEC 60335-2-32);<br/>
    – electric pumps for liquids for household and similar purposes (IEC 60335-2-41).<br/>
    In some jurisdictions, a breast pump appliance is classified as a medical device. To avoid confusion for users, several requirements between the different standards are aligned in this document.<br/>
    This part 2 is to be used in conjunction with the latest edition of IEC 60335-1 and its amendments unless that edition precludes it; in that case, the latest edition that does not preclude it is used. It was established on the basis of the sixth edition (2020) of that standard.
