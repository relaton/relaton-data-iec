abstract:
- language: en
  script: Latn
  content: |-
    IEC 61511-2:2016 provides guidance on the specification, design, installation, operation and maintenance of SIFs and related SIS as defined in IEC 61511-1:2016. This second edition cancels and replaces the first edition published in 2003. This edition constitutes a technical revision. This edition includes the following significant technical changes with respect to the previous edition:<br/>
    - guidance examples based on all phases of the safety life cycle provided based on usage experience with IEC 61511 1st edition;<br/>
    - annexes replaced to address transition from software to application programming.
- language: fr
  script: Latn
  content: |-
    L'IEC 61511-2:2016 donne les lignes directrices relatives à la spécification, la conception, l'installation, au fonctionnement et à la maintenance des SIF et des SIS associés, telles que définies dans l'IEC 61511-1:2016. Cette deuxième édition annule et remplace la première édition parue en 2003. Cette édition constitue une révision technique. Cette édition inclut les modifications techniques majeures suivantes par rapport à l'édition précédente:<br/>
    - description des exemples d'orientation, basés sur toutes les phases du cycle de vie de sécurité, réalisée avec des exemples basés sur l'expérience de l'utilisation de la norme IEC 61511 première édition;<br/>
    - remplacement des annexes pour répondre à la transition de logiciel à programmation d'application.
