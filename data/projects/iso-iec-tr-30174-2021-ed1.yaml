abstract:
- language: en
  script: Latn
  content: |-
    ISO/IEC TR 30174:2021(E) describes:<br/>
    • key features of the socialized IoT systems, e.g. sensing the external physical world, resolving the uncertainties of targets, satisfying users' demand and providing quality service, etc.;<br/>
    • socialized attributes, i.e. socialized network, socialized collaboration, and socialized services, which are derived from the key features; and<br/>
    • guidelines on how to use or apply the socialized attributes in the design and development of IoT systems.
