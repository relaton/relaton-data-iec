abstract:
- language: en
  script: Latn
  content: IEC/TR 62678:2010(E) provides information on accessibility and usability terms, activities, completed and ongoing standards, technical reports, projects, and specifies user needs that may or may not apply to audio, video and multimedia systems and equipment. Comments about demographics and public policies are included. A checklist of accessibility and usability considerations is also included. Industry experts may or may not apply this information when they evaluate opportunities to integrate support for accessibility and usability in their work.
