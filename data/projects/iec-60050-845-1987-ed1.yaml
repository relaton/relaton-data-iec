abstract:
- language: en
  script: Latn
  content: |-
    Comprises some 950 terms and definitions to promote international standardization in the use of quantities, units, symbols and terminology in the field of lighting. Is also CIE Publication 17.4: International Lighting Vocabulary.<br/>
    It has the status of a horizontal standard in accordance with IEC Guide 108.
- language: fr
  script: Latn
  content: |-
    Rassemble environ 950 termes et définitions dans le but de favoriser l'unification internationale dans l'emploi des grandeurs, des unités et des symboles et de la terminologie dans le domaine de l'éclairage. Constitue également la publication 17.4 de la CIE: Vocabulaire international de l'éclairage.<br/>
    Elle a le statut de norme horizontale conformément au Guide IEC 108.
