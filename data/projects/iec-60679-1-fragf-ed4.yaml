abstract:
- language: en
  script: Latn
  content: |-
    IEC 60679-1:2017 specifies general requirements for piezoelectric, dielectric and electrostatic oscillators, including Dielectric Resonator Oscillators (DRO) and oscillators using FBAR (hereinafter referred to as "Oscillator"), of assessed quality using either capability approval or qualification approval procedures.<br/>
    NOTE Dielectric Resonator Oscillators (DRO) and oscillators using FBAR are under consideration.<br/>
    This edition includes the following significant technical changes with respect to the previous edition:<br/>
    a) the title has been changed;<br/>
    b) additional matters related to oscillator using SAW or MEMS resonator in "Terms, definitions and general information" have been included;<br/>
    c) measurement methods of IEC 60679-1:2007 have been removed (they will be moved to IEC 62884 series);<br/>
    d) the content of Annex A has been extended;<br/>
    e) a new term and definition DIXO (Digital interfaced Crystal Oscillator) has been added;<br/>
    f) a new term and definition SSXO (Spread Spectrum Crystal Oscillator) has been added;<br/>
    g) Annex D has been added.
- language: fr
  script: Latn
  content: |-
    <p>L’IEC 60679-1:2017 spécifie les exigences générales relatives aux oscillateurs piézoélectriques, diélectriques et électrostatiques, y compris les oscillateurs à résonateur diélectrique (DRO - <em>Dielectric Resonator Oscillators</em>) et les oscillateurs à résonateurs à ondes acoustiques de volume à couches (FBAR) (ci-après dénommés "Oscillateur"), sous assurance qualité par les procédures d’agrément de savoir-faire ou les procédures d’homologation.<br/>
    NOTE Les oscillateurs DRO et FBAR sont à l’étude.<br/>
    Cette édition inclut les modifications techniques majeures suivantes par rapport à l'édition précédente:<br/>
    a) le titre a été modifié;<br/>
    b) des éléments supplémentaires relatifs aux oscillateurs utilisant un résonateur OAS ou MEMS ont été ajoutés dans "Termes, définitions et informations générales";<br/>
    c) les méthodes de mesure de l’IEC 60679-1:2007 ont été supprimées (elles seront intégrées à la série IEC 62884);<br/>
    d) le contenu de l’Annexe A a été enrichi;<br/>
    e) un nouveau terme et sa définition, “DIXO” (<em>digital interfaced crystal oscillator -</em> oscillateur à quartz à interface numérique), ont été ajoutés;<br/>
    f) un nouveau terme et sa définition, “SSXO” (<em>spread spectrum crystal oscillator</em> - oscillateur à quartz à spectre étalé), ont été ajoutés;<br/>
    g) l’Annexe D a été ajoutée.</p>
