abstract:
- language: en
  script: Latn
  content: IEC 62059-32-1:2011 specifies a method for testing the stability of metrological characteristics of electricity meters, by operating a test specimen at the upper limit of the specified operating range of temperature, voltage and current for an extended period.
- language: fr
  script: Latn
  content: La CEI 62059-32-1:2011 spécifie une méthode pour les essais de stabilité des caractéristiques métrologiques des compteurs d'électricité, en faisant fonctionner un exemplaire d'essai à la limite supérieure de la température, de la tension et du courant dans le domaine de fonctionnement spécifié, pendant une durée prolongée.
