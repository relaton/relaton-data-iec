  script: Latn
  content: S'applique aux cartes imprimées rigides équipées protégées par un revêtement de matériau isolant déposé sur une de leurs faces ou sur les deux. Décrit les prescriptions et les modes opératoires des essais. A le statut d'une publication fondamentale de sécurité conformément au Guide 104.
