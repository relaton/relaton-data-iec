  script: Latn
  content: L'IEC 62052-21:2004 spécifie les prescriptions générales pour les essais de type d'équipements neufs de tarification et contrôle de charge, de type intérieur, tels que des récepteurs de télécommande centralisée ou des horloges de tarification qui sont utilisés pour le contrôle de charges électriques, de registres multi-tarifs ou des dispositifs indicateurs de maximum. La présente version bilingue (2016-07) correspond à la version monolingue publiée en 2004-05.
