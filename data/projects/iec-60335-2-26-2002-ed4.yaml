abstract:
- language: en
  script: Latn
  content: Deals with the safety of electric clocks having a rated voltage of not more than 250 V. Examples of appliances that are within the scope of this standard are alarm clocks, spring-driven clocks with an electrically operated winding mechanism, clocks incorporating driving means other than motors. This standard does not apply to battery-operated clocks; appliances intended exclusively for industrial purposes; appliances intended to be used in locations where special conditions prevail, such as the presence of a corrosive or explosive atmosphere (dust, vapor or gas); clocks having other functions, whether or not in combination with time indication, such as master control clocks and timers for cooking ranges, washing machines and similar appliances; clocks for 'clocking in' purposes; clocks incorporating electronic circuits only(refer to IEC 60065).
- language: fr
  script: Latn
  content: Traite de la sécurité des horloges électriques dont la tension assignée n'est pas supérieure à 250 V. Comme exemples d'appareils compris dans le domaine d'application de la présente norme, on peut citer les réveils; les horloges à entraînement par ressort comportant un mécanisme de remontage électrique; les horloges comprenant des moyens d'entraînement autres que des moteurs. La présente norme ne s'applique pas aux horloges à piles ou à accumulateurs; aux appareils destinés exclusivement à des usages industriels; aux appareils destinés à être utilisés dans des locaux présentant des conditions particulières, telles que la présence d'une atmosphère corrosive ou explosive (poussière, vapeur ou gaz); aux horloges ayant d'autres fonctions, associées au non à l'indication de l'heure, telles que les horloges-mères et les minuteries de cuisinières, de machines à laver et appareils analogues; aux horloges pointeuses; aux horloges ne comportant que des circuits électroniques (CEI 60065).
