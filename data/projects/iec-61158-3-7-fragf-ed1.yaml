abstract:
- language: fr
  script: Latn
  content: |-
    La CEI 61158-3-7:2007 définit de manière abstraite le service visible de l'extérieur fourni par la couche de liaison de données de bus de terrain de Type 7 en termes:<br/>
    - d'actions et événements primitifs du service;<br/>
    - de paramètres associés à chaque action primitive et événement primitif, et la forme qu'ils prennent;<br/>
    - de l'interrelation entre ces actions et événements, et leurs séquences valides. Cette première édition et ses parties associées de la sous-série CEI 61158-3 annulent et remplacent la CEI 61158-3:2003. La présente édition de cette partie constitue une révision rédactionnelle. Cette édition inclut les modifications suivante:<br/>
    - suppression du précédent bus de terrain de Type 6, et du paramètre fictif pour une couche de liaison de données des bus de terrain de Type 5, en raison d'un manque de pertinence avec le marché;<br/>
    - ajout de nouveaux types de bus de terrain; division de cette partie en plusieurs parties numérotées 3-1, 3-2,..., 3-19. La présente version bilingue (2013-07) correspond à la version anglaise monolingue publiée en 2007-12.
