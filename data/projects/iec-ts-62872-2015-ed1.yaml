  script: Latn
  content: IEC TS 62872:2015(E) defines the interface, in terms of information flow, between industrial facilities and the "smart grid". It identifies profiles and extends where required, the standards needed to allow the exchange of the information needed to support the planning, management and control of electric energy flow between the industrial facility and the smart grid.
