abstract:
- language: en
  script: Latn
  content: |-
    IEC TS 62607-4-7:2018 provides a method for the determination of magnetic impurities in anode nanomaterials for energy storage devices using an Inductively Coupled Plasma Optical Emission Spectrometer (ICP-OES), including test overview, reagents, apparatus, test procedures, test results and test report.<br/>
    IEC TS 62607-4-7:2018 applies to the determination of the total content of magnetic impurities (iron, cobalt, chromium, and nickel) ≥ 0,02 mg/kg which can be attracted by magnet.
