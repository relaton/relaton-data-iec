abstract:
- language: fr
  script: Latn
  content: L'IEC 62616:2010 spécifie les exigences de performance, caractéristiques techniques et méthodes d essai minimales, ainsi que les résultats requis pour les essais, pour un système d alarme à surveillance d activité de navigation sur le pont (BNWAS), tels que les requiert le Chapitre V de la Convention internationale pour la sauvegarde de la vie humaine en mer (SOLAS - International Convention for the Safety of Life at Sea), amendée. Elle prend en compte les exigences générales de la résolution OMI A.694(17) et est associée à l'IEC 60945. Le contenu du corrigendum de Juillet 2012 est inclus dans cette copie.
