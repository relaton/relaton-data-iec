abstract:
- language: en
  script: Latn
  content: |-
    IEC PAS 61850-90-28:2026, which is a Publicly Available Specification, specifies the expected behavior and associated documentation related to the validation of received GOOSE and SV messages. It considers engineering rules and guidance to ensure that the communication configuration process is well designed for this validation. Conformance statements related to this validation are also considered.<br/>
    This document considers subscribers claiming conformance to latest editions of the IEC 61850 series in combination with publishers claiming conformance to any previous version and revision of the IEC 61850 series.
