abstract:
- language: fr
  script: Latn
  content: La CEI 60384-8:2005 s'applique aux condensateurs fixes à diélectrique en céramique avec un coefficient de température défini (diélectrique de Classe 1), destinés à être utilisés dans des équipements électroniques incluant les condensateurs sans sorties, mais excluant les condensateurs multicouches fixes pour montage en surface à diélectrique en céramique. Les condensateurs d'antiparasitage ne sont pas inclus, mais ils sont couverts par la CEI 60384-14. Cette troisième édition est le résultat des activités de maintenance associées à l'édition précédente. Toutes les modifications acceptées peuvent être classées comme des révisions mineures.
