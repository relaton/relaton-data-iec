abstract:
- language: en
  script: Latn
  content: provides information on the underlying concepts of risk, the relationship of risk to safety integrity, the determination of tolerable risk, a number of different methods that enable the safety integrity levels for the safety instrumented functions to be determined. It has the status of a horizontal standard in accordance with IEC Guide 108.
- language: fr
  script: Latn
  content: fournit des informations sur les concepts sous-jacents de risque et la relation entre risque et intégrité, la détermination du risque tolérable, différentes méthodes permettant de déterminer les niveaux d'intégrité de sécurité des fonctions instrumentées de sécurité. Elle a le statut d'une norme horizontale conformément au Guide 108 de la CEI.
