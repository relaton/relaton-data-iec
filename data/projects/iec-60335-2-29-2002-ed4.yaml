abstract:
- language: en
  script: Latn
  content: Deals with the safety of electric battery chargers for household use having an output at safety extra-low voltage, their rated voltage being not more than 250 V. This standard also includes battery chargers intended for use in garages, shops, light industry  and on farms.
- language: fr
  script: Latn
  content: Traite de la sécurité des chargeurs de batterie électriques pour usages domestiques et analogues, dont la tension de sortie est la très basse tension de sécurité et dont la tension assignée n'est pas supérieure à 250 V. Couvre aussi les chargeurs de batterie destinés à être utilisés dans des garages, dans des magasins, chez des artisans et dans des fermes.
