  content: Décrit les méthodes d'essai et les procédures applicables aux systèmes de mesure d'épaisseur par rayonnement ionisant destinés à effectuer des mesures et des vérifications continues ou discontinues de l'épaisseur, de la masse par unité de surface, ou de la masse par unité de longueur des matériaux produits par l'industrie.
