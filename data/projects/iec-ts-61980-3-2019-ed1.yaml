abstract:
- language: en
  script: Latn
  content: |-
    IEC TS 61980-3:2019 applies to the equipment for the magnetic field wireless power transfer (MF-WPT) of electric power from the supply network to electric road vehicles for purposes of supplying electric energy to the RESS (rechargeable energy storage system) and/or other on-board electrical systems. The MF-WPT system operates at standard supply voltages ratings per IEC 60038 up to 1 000 V AC and up to 1 500 V DC The power transfer takes place while the electric vehicle (EV) is stationary.<br/>
    This document also applies to MF-WPT equipment supplied from on-site storage systems (e.g. buffer batteries) at standard supply voltages ratings per IEC 60038 up to 1 000 V AC and up to 1 500 V DC.<br/>
    The aspects covered in this document include<br/>
    – the characteristics and operating conditions,<br/>
    – the required level of electrical safety,<br/>
    – requirements for basic communication for safety and process matters if required by a MF-WPT system,<br/>
    – requirements for positioning to assure efficient and safe MF-WPT power transfer, and<br/>
    – specific EMC requirements for MF-WPT systems.<br/>
    The following aspects are under consideration for future documents:<br/>
    – requirements for two- and three-wheel vehicles,<br/>
    – requirements for MF-WPT systems supplying power to EVs in motion, and<br/>
    – requirements for bidirectional power transfer.<br/>
    This standard does not apply to<br/>
    – safety aspects related to maintenance, and<br/>
    – trolley buses, rail vehicles and vehicles designed primarily for use off-road.
