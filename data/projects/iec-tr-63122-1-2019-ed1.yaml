  content: |-
    IEC TR 63122-1:2019 The focus of this standard is the conceptual definition of smart television, basic features, use cases and current technologies based on applications and requirements. They make it clear where further existing standards can be used and highlight where work on standards is needed.<br/>
    In addition, this document was developed taking into account ISO/IEC Guide 71. The objective of this document is to highlight potential areas for standardisation for smart televisions.
