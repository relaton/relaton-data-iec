abstract:
- language: en
  script: Latn
  content: Applies to range hoods incorporating a fan for the recirculation or forced removal of air from above a hob situated in a household kitchen. The standard defines the mainperformance characteristics of range hoods, and methods of measurement.
- language: fr
  script: Latn
  content: S'applique aux hottes de cuisine comportant un ventilateur pour la circulation ou l'extraction forcée d'air au-dessus d'une table de cuisson dans une cusisine à usage domestique. Cette norme définit les principales caractéristiques d'aptitude à la fonction des hottes de cuisine et les méthodes pour la vérification.
