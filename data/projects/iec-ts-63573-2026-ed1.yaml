abstract:
- language: en
  script: Latn
  content: |-
    IEC TS 63573-1:2026, which is a Technical specification, defines specific requirements for materials to be used for the stator and/or rotor core of rotating electrical machines according to the IEC 60034 series. This document applies in addition to IEC 60404- series and is addressed to the suppliers of the raw material (electrical sheet), to producers of magnetic cores (including a possible annealing treatment), to electric motor manufacturers as well as to users of electrical steel. This document does not apply to motor customers.<br/>
    The objective of this document is to address the immediate needs of motor manufacturers striving to achieve high IEC efficiency classes.<br/>
    IEC TS 63573 is an independent product-specific specification focusing on rotating electrical machines in accordance with the IEC 60034 series and can be applied as a supplement to IEC 60404-8-4.<br/>
    At the time of publication of this document it is anticipated that collaboration with IEC Technical Committee 68 (Magnetic alloys and steels) will lead to the development of Amendment 2 to IEC 60404-8-4:2022. This amendment is expected to clarify the relevant issues and provide a comprehensive solution.<br/>
    This Technical Specification will be withdrawn once Amendment 2 to IEC 60404-8-4:2022 is published and takes effect, provided it addresses the identified need.
