abstract:
- language: en
  script: Latn
  content: |-
    <!-- NEW! -->IEC 61280-1-3:2021 is available as IEC 61280-1-3:2021 RLV which contains the International Standard and its Redline version, showing all changes of the technical content compared to the previous edition.<br/>
    <br/>
    IEC 61280-1-3:2021 provides definitions and measurement procedures for several wavelength and spectral width properties of an optical spectrum associated with a fibre optic communication subsystem, an optical transmitter, or other light sources used in the operation or test of communication subsystems. This document also provides definitions and measurement procedures for side-mode suppression ratio and signal-to-source spontaneous emission ratio. The measurement is done for the purpose of system construction and/or maintenance. In the case of communication subsystem signals, the optical transmitter is typically under modulation. NOTE Different properties can be appropriate to different spectral types, such as continuous spectra characteristics of light-emitting diodes (LEDs), as well as multilongitudinal-mode (MLM), multitransverse-mode (MTM) and single-longitudinal mode (SLM) spectra, which are characteristic of laser diodes (LDs). This third edition cancels and replaces the second edition published in 2010. This edition constitutes a technical revision. This edition includes the following significant technical changes with respect to the previous edition:<br/>
    - addition of measurement of signal-to-source spontaneous emission ratio in 8.9;<br/>
    - change of document title to reflect the additional measurement;<br/>
    - additional information on the resolution bandwidth used in the measurement of the side-mode suppression ratio in 8.8;<br/>
    - use of a calibrated optical wavelength meter for accurate wavelength measurements of single-longitudinal mode lasers.
- language: fr
  script: Latn
  content: |
    <!-- NEW! -->IEC 61280-1-3:2021 est disponible sous forme de IEC 61280-1-3:2021 RLV qui contient la Norme internationale et sa version Redline, illustrant les modifications du contenu technique depuis l'édition précédente.<br/>
    <br/>
    IEC 61280-1-3: 2021 fournit des définitions et des procédures de mesure pour plusieurs propriétés de longueur d’onde et de largeur spectrale d’un spectre optique associées à un sous-système de télécommunication fibronique, un émetteur optique ou d’autres sources de lumière utilisées pour l’exploitation ou les essais des sous-systèmes de télécommunication. Le présent document fournit également des définitions et des procédures de mesure du rapport de suppression des modes latéraux et du taux d’émission spontanée entre signal et source. Le mesurage est effectué pour les besoins de la construction et/ou de la maintenance d'un système. Dans le cas des signaux dans les sous-systèmes de télécommunication, l’émetteur optique fonctionne généralement en modulation. <em>NOTE Des propriétés différentes peuvent être appropriées pour des types de spectres différents, telles que les caractéristiques spectrales continues des diodes électroluminescentes (LED), les spectres de mode multilongitudinal (MLM), de mode multitransversal (MTM) et unimodal longitudinal (SLM), qui sont caractéristiques des diodes lasers (LD).</em><br/>
    Cette troisième édition annule et remplace la deuxième édition parue en 2010. Cette édition constitue une révision technique. Cette édition inclut les modifications techniques majeures suivantes par rapport à l'édition précédente:<br/>
    <br/>
    a) ajout du mesurage du taux d’émission spontanée entre signal et source en 8.9;
    b) modification du titre du document pour tenir compte du mesurage supplémentaire;


    	c) information supplémentaire relative à la résolution spectrale utilisée pour le mesurage du rapport de suppression des modes latéraux en 8.8;
    	d) utilisation d'un appareil optique de mesure de longueur d'onde étalonné pour des mesurages précis de longueur d'onde des lasers unimodaux longitudinaux.
