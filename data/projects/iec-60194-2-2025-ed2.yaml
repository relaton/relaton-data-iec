abstract:
- language: en
  script: Latn
  content: |-
    IEC 60194-2:2025 covers terms and definitions related to circuit board and electronic assembly technologies as well as other electronic technologies.<br/>
    The terms have been classified according to the decimal classification code (DCC) and this DCC number appears just below the defined term. The DCC numbering is fully explained in Annex A.<br/>
    A list of terms in alphabetical order with code number is provided in Annex B.<br/>
    This edition includes the following significant technical changes with respect to the previous edition:<br/>
    a) exclusion of 116 terms transferred to IEV;<br/>
    b) inclusion of 9 new terms related to printed electronics and packaging technology;<br/>
    c) revision of definitions of 23 terms reflecting current technology;<br/>
    d) three "printed wiring" terms were removed;<br/>
    e) reintroduction of identification codes for terms.
