abstract:
- language: en
  script: Latn
  content: |-
    IEC 62148-15:2021 covers the physical dimension and interface specifications for discrete vertical cavity surface emitting laser (VCSEL) devices in optical telecommunication and optical data transmission applications. The intent of this document is to adequately specify the physical requirements of VCSEL devices that will enable mechanical interchangeability of laser devices or transmitters complying with this document both at the printed circuit wiring board and for any panel-mounting requirement. This third edition cancels and replaces the second edition published in 2014. This edition constitutes a technical revision. This edition includes the following significant technical changes with respect to the previous edition:<br/>
    - the classification of optical/electrical interface types is generalized and referred to IEC 62148-1;<br/>
    - a new pin mode is added to Table 1;<br/>
    - several dimensions of the VCSEL TO CAN package are changed in Table 3 to reflect the current state of technology;<br/>
    - Figure 7 is updated to show the complete details of the VCSEL TOSA package.
- language: fr
  script: Latn
  content: |-
    L'IEC 62148-15:2021 concerne les dimensions physiques et les spécifications de l'interface des dispositifs individuels à laser à cavité verticale (VCSEL) dans le cadre des applications de télécommunication et de transmissions de données par un moyen optique. Le présent document vise à spécifier de façon appropriée les exigences physiques des dispositifs VCSEL qui permettront l'interchangeabilité mécanique des dispositifs laser ou des émetteurs-récepteurs conformes au présent document tant au niveau de la carte de circuit imprimé que pour toute exigence de montage sur panneau. Cette troisième édition annule et remplace la deuxième édition parue en 2014. Cette édition constitue une révision technique.<br/>
    Cette édition inclut les modifications techniques majeures suivantes par rapport à l'édition précédente:<br/>
    - la classification des types d'interfaces optiques et électriques est généralisée et fait référence à l'IEC 62148-1;<br/>
    - un nouveau mode de broche a été ajouté au Tableau 1;<br/>
    - plusieurs dimensions du boîtier VCSEL TO CAN ont été modifiées dans le Tableau 3 afin de refléter l’état actuel de la technique;<br/>
    - la Figure 7 a été ajoutée en vue de représenter les détails complets du boîtier VCSEL TOSA.
