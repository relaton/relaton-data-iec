abstract:
- language: fr
  script: Latn
  content: La CEI 61784-3-3:2007 spécifie une couche de communication relative à la sécurité (services et protocole) fondée sur la CPF 3 de la CEI 61784-1 et les types 3 et 10 de la CEI 61784-2 (CP 3/1, CP 3/2, CP 3/4, CP 3/5 et CP 3/6) et de la CEI 61158. Elle identifie les principes applicables aux communications de sécurité fonctionnelle définies dans la CEI 61784-3, et appropriés à cette couche de communication de sécurité. Elle définit les mécanismes de transmission des messages propres à la sécurité entre les participants d'un réseau réparti, en utilisant la technologie de bus de terrain conformément aux exigences de la série CEI 61508 concernant la sécurité fonctionnelle. Ces mécanismes peuvent être utilisés dans diverses applications industrielles, telles que la commande de processus, l'usinage automatique et les machines. La présente version bilingue (2013-05) correspond à la version anglaise monolingue publiée en 2007-12.
