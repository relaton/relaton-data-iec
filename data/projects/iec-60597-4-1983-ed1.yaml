abstract:
- language: en
  script: Latn
  content: Applies to linearly polarized receiving aerials for domestic use in the frequency range 30 MHz to 1 GHz. Ensures uniformity in the presentation of aerial performance specifications and provides a standard format for individual aerial specification sheets. This publication supersedes IEC 60138 (1962).
- language: fr
  script: Latn
  content: S'applique aux antennes de réception à polarisation rectiligne, pour usage domestique, dans la gamme des fréquences comprises entre 30 MHz et 1 GHz. Rend uniforme la présentation des spécifications des antennes et fournit un modèle normalisé pour les cahiers de spécifications. Cette publication remplace la CEI 60138 (1962).
