abstract:
- language: en
  script: Latn
  content: |-
    Establishes requirements for the safety of magnetic resonance equipment to provide protection for the patient.                   
    It establishes requirements to provide information to the operator, staff associated with magnetic resonance equipment and the general public.                                                          
                                                                     
    It also provides methods for demonstrating compliance with those 
    requirements.
- language: fr
  script: Latn
  content: |-
    Etablit les exigences de sécurité des appareils à rm afin d'assurer la protection du patient.                                          
    Etablit des exigences pour fournir des informations à l'opérateur, au personnel associé aux appareils à rm et au grand public.        

    Fournit également des méthodes pour démontrer la conformité à ces exigences.
