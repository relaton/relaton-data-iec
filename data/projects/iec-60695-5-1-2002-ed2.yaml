abstract:
- language: en
  script: Latn
  content: |-
    IEC 60695-5-1:2002 Provides guidance on the following:<br/>
    a) general aspects of corrosion damage test methods;<br/>
    b) methods of measurement of corrosion damage;<br/>
    c) consideration of test methods;<br/>
    d) relevance of corrosion damage data to hazard assessment.<br/>
    The structure of this second edition remains essentially the same as the first edition with the following additions:<br/>
    - Information on fire scenarios and fire models has been added along with an update on the latest advances in the analysis of the fire effluent.<br/>
    - The general classification of fires from ISO TR 9122-1 has been added.<br/>
    - A new clause on the general aspects of the corrosivity of fire effluent which describes the types of corrosion damage effects and the factors affecting corrosivity.<br/>
    - A new clause on the principles of corrosion damage measurement has been added describing the assessment of the corrosive potential and the consideration of the corrosivity test methods.<br/>
    - A new table describing a summary of corrosion test methods.<br/>
    - A new flowchart detailing the evaluation and consideration of corrosion damage test methods.<br/>
    - The bibliography has been expanded.
- language: fr
  script: Latn
  content: |-
    IEC 60695-5-1:2002 Fournit un guide concernant:<br/>
    a) les aspects généraux des méthodes d'essai des dommages provoqués par la corrosion;<br/>
    b) les méthodes de mesure des dommages provoqués par la corrosion;<br/>
    c) la prise en compte des méthodes d'essai;<br/>
    d) la pertinence des données concernant les dommages de corrosion pour l'évaluation des risques.<br/>
    La structure de la deuxième édition demeure pratiquement inchangée, à l'exception des éléments importants suivants qui ont été ajoutés:<br/>
    - Information relative aux scénarios et aux modèles de feu ainsi qu'une mise à jour des dernières avancées réalisées dans l'analyse des effluents du feu.<br/>
    - Classification générale des feux selon l'ISO TR 9122-1.<br/>
    - Nouvel article relatif aux aspects généraux de la corrosivité des effluents du feu, décrivant les types d'effets des dommages de la corrosion et les facteurs affectant la corrosivité.<br/>
    - Nouvel article relatif aux principes de mesure des dommages de la corrosion, décrivant l'évolution du potentiel corrosif et la prise en compte des méthodes d'essai de la corrosivité.<br/>
    - Nouveau tableau résumant les méthodes d'essai de la corrosivité.<br/>
    - Nouvel organigramme présentant en détail l'évaluation et la prise en compte des méthodes d'essai des dommages de la corrosion.<br/>
    - Elargissement de la bibliographie.
