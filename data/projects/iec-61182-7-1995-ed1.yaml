abstract:
- language: en
  script: Latn
  content: Supplement to IEC 61182-1, specifically in the area of describing bare board electrical test information. Intended to convey additional requirements, guidelines, and examples necessary to provide the data structures and concepts for bare board electrical test information in digital form. The contents of the corrigendum of October 2002 have been included in this copy.
- language: fr
  script: Latn
  content: 'Complément à la CEI 61182-1: Compléte surtout la description du test électrique sur carte nue. Fournit des consignes supplémentaires, des directives et des exemples pertinents afin de définir une structure de données et des concepts sur la codification sous forme numérique du test électrique sur carte nue. Le contenu du corrigendum d''octobre 2002 a été pris en considération dans cet exemplaire.'
