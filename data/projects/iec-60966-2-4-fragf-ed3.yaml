abstract:
- language: fr
  script: Latn
  content: |-
    La CEI 60966-2-4:2009 s'applique aux câbles coaxiaux souples décrits dans la CEI 60096-2. Elle concerne les cordons pour les récepteurs TV ou radio, et en particulier la sous-famille de cordons 9,52. (CEI 61169-2). Ces cordons sont utilisés comme cela est décrit dans la CEI 60728-4. La présente spécification particulière donne les exigences et les sévérités de sous-famille qui doivent être appliquées. Cette spécification particulière doit être utilisée avec la CEI 60966-1:1999, la CEI 60966-2-1:2008 et la CEI 60966-2-2:2003.
    Pour obtenir l'homologation, les opérations de qualification seront réalisées conformément au 12.2 de la CEI 60966-2-1 en tenant compte des variantes spécifiées. Seuls les essais dont les résultats pourraient dépendre des variantes seront répétés. Pour obtenir l'agrément de savoir-faire, les opérations de qualification seront réalisées sur les CQC correspondants comme cela est défini en 12.3 de la CEI 60966-2-1 et décrit dans le manuel CM. Sauf spécification contraire dans le CM, seuls les essais lot par lot des groupes Ba et Eb seront réalisés sur les produits livrés, tous les autres essais seront réalisés sur les CQC comme cela est défini en 12.3 de la CEI 60966-2-1 et décrit dans le manuel CM.
