abstract:
- language: en
  script: Latn
  content: |-
    Relates to a range of circular multipole connectors with threaded coupling, round pins and solder terminations.
    Specifies IEC type designation, dimensions, gauges, performance ratings and arrangement of contacts. Establishes climatic category and a schedule for type tests.
- language: fr
  script: Latn
  content: Concerne une gamme de connecteurs circulaires multipôles avec accouplement par vis, broches rondes et sorties à souder. Spécifie la désignation de type CEI, les dimensions, les calibres, les caractéristiques fonctionnelles et la disposition des contacts. Spécifie une catégorie climatique ainsi qu'un programme d'essais de type.
