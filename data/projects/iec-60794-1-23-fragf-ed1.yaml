abstract:
- language: en
  script: Latn
  content: |-
    <p>IEC 60794-1-23:2012 applies to optical fibre cables for use with telecommunication equipment and devices employing similar techniques, and to cables having a combination of both optical fibres and electrical conductors. The object of this part of IEC 60794 is to define test procedures to be used in establishing uniform requirements for the geometrical, material, mechanical, environmental properties of optical fibre cable elements. Throughout the document the wording “optical cable” may also include optical fibre units, microduct fibre units, etc. General requirements and definitions are given in IEC 60794-1-20 and a complete reference guide to test method of all types in the IEC 60794-1-2.</p>

    <p>Key words: Optical cable test procedures, optical fibre units</p>
- language: fr
  script: Latn
  content: |-
    <p>IEC 60794-1-23: 2012 s’applique aux câbles à fibres optiques destinés à être utilisés avec des équipements de télécommunication et des dispositifs utilisant des techniques analogues, ainsi qu’aux câbles constitués de fibres optiques d’une part et de conducteurs électriques d’autre part.L’objet de la présente partie de l’IEC 60794 est la définition des procédures d’essai à utiliser pour établir des exigences uniformes relatives aux propriétés géométriques, mécaniques, de matériaux et d’environnement des éléments de câbles à fibres optiques. L’expression « câble optique » est utilisée dans tout le document et peut inclure des unités de fibres optiques, des unités de fibres en microconduits, etc. Les exigences générales et les définitions sont données dans l’IEC 60794-1-20 et un guide de référence complet pour tous les types de méthode d’essai est contenu dans l’IEC 60794-1-2.</p>

    <p>Mots clés : Procédures d’essai des câbles optiques, unités de fibres optiques</p>
