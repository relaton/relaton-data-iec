- language: en
  script: Latn
  content: specifies requirements for the selection, positioning, configuration and commissioning, of protective equipment to detect the presence of persons in order to protect those persons from dangerous part(s) of machinery in industrial applications. This specification covers the application of electro-sensitive protective equipment (ESPE) specified in IEC 61496 (all parts) and pressure sensitive mats and floors specified in ISO 13856-1.
