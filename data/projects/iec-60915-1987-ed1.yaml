  script: Latn
  content: Contains preferred dimensions of spindle ends, bushes and, for the mounting of single-hole, bush-mounted, spindle-operated variable capacitors, variable resistors and potentiometers. If other dimensions not listed in this publication have to be used, it is recommended to select them from IEC 60390 (1972) and 60620 (1984).
