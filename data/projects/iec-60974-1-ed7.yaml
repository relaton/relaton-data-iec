abstract:
- language: en
  script: Latn
  content: |-
    IEC 60794-1: 2026 is applicable to power sources for arc welding and allied processes designed for industrial and professional use, and supplied by a voltage not exceeding 1  000 V, battery supplied or driven by mechanical means.   This document specifies safety and performance requirements of welding power sources and plasma cutting systems.   This document is not applicable to limited duty arc welding and cutting power sources which are designed mainly for use by layperson and designed in accordance with IEC 60974-6.   This document includes requirements for battery-powered welding power sources and battery packs, which are given in Annex O.   This document is not applicable to testing of power sources during periodic maintenance or after repair. <br/>
    <em>NOTE 1 Typical allied processes are electric arc cutting and arc spraying. <br/>
    NOTE 2 AC systems having a nominal voltage between 100 V and 1 000 V are given in Table 1 of IEC 60038:2009. <br/>
    NOTE 3 This document does not include electromagnetic compatibility (EMC) requirements. <br/>
    NOTE 4 In this document, “and/or” is used in the sense of “either x or y, or both”.</em><br/>
    This seventh edition cancels and replaces the sixth edition published in 2021. This edition constitutes a technical revision.    This edition includes the following significant technical changes with respect to the previous edition: <br/>
    a) new terms and definitions 3.1.67 to 3.1.70 added;<br/>
    b) verbal form changes ‘may’ to ‘can’ of edition 6 introduced at FDIS reviewed and reverted where necessary;<br/>
    c) deletion of Notes relating to (EU) 2019/1784 in 3.3.2, 15.3, 16.3.3 and M.1.1;<br/>
    d) deletion of storage and transport requirements and Note on different environmental conditions in 4;<br/>
    e) type tests requirements in 5.4 reworded;<br/>
    f) note to clearance verification with AC or DC voltage in 6.1.2 added;<br/>
    g) editorial adjustment of Table 3 Minimum creepage distances to IEC 60664­1:2020/AMD1:2025;<br/>
    h) DC dielectric strength test limited to certain conditions in 6.1.5;<br/>
    i) capacitor short circuit test procedure in 9.5 refined;<br/>
    j) new cycle definition for supply circuit on/off switching device test in 10.8;<br/>
    k) testing of single-fault conditions for rated no-load voltage to 11.1.5 added;<br/>
    l) welding cable standard IEC 60245­6 moved from requirement to Note;<br/>
    m) voltage reducing device test procedure in 13.2.1 reworded for clarification;<br/>
    n) Petroleum spirit definition to 15.1 added;<br/>
    o) duty cycle requirements on rating plate in 15.3 b) reworded for clarification;<br/>
    p)wire-feed speed and example relation to filler wire consumption to 16.3.3 added;<br/>
    q) Figure N.3 b) corrected from Figure 10 to Figure 8 of IEC 60990:2016;<br/>
    r) reference to Annex P instead of ISO 6469­1:2009 in O.6.1.4 b) added;<br/>
    s) requirement in O.6.2.205 modified;<br/>
    t) additional example to Note 1 in O.7.201 added;<br/>
    u) abnormal operation test requirements in O.9.1 aligned to 9.1;<br/>
    v) warnings updated in O.17.1;<br/>
    w) new Annex P added.
