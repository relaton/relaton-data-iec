abstract:
- language: en
  script: Latn
  content: |-
    IEC 61508-4:2026 covers those aspects to be considered when electrical/electronic/programmable electronic (E/E/PE) systems are used to carry out safety functions.<br/>
    A first objective is to facilitate the development of product and application sector international standards by the technical committees responsible for the product or application sector. This will allow all the relevant factors, associated with the product or application, to be fully considered and thereby meet the specific needs of users of the product and the application sector.<br/>
    A second objective is to enable the development of E/E/PE safety-related systems where product or application sector international standards do not exist.<br/>
    The scope of this document is functional safety for E/E/PE safety-related systems but, apart from normative requirements in the hazard and risk analysis phase, this document does not itself provide normative requirements for malevolent action arising from a security risk.<br/>
    NOTE 1 For requirements and/or guidance on security, see the IEC 62443 series and ISO/IEC 27000 family.<br/>
    NOTE 2 For guidance on the coordination between safety and security, refer to IEC TR 63069.<br/>
    This third edition cancels and replaces the second edition published in 2010. This edition constitutes a technical revision.<br/>
    This edition includes the following significant technical changes with respect to the previous edition:<br/>
    a) a set of definitions has been introduced or modified to cover aspects of:<br/>
      1) software off-line support tools, tool impact class (TIC, TIC1, TIC2, TIC3), tool error detection (TD);<br/>
      2) software technology classes (SWTC I, SWTC II, SWTC III, related to “artificial Intelligence”);<br/>
      3) diagnostic functions, diagnostic function failure, diagnostic detection failure, diagnostic undetected failure, diagnostic safe failure fraction (DSFF);<br/>
      4) levels of independence of persons (IL1, IL2, IL3);<br/>
      5) common cause initiators and common cause coupling (CCI, CCC);<br/>
      6) selection of techniques and methods (shortcuts in tables);<br/>
    b) various clarifications have been made in definitions;<br/>
    c) the normative references and the bibliography have been updated.<br/>
    It has the status of a basic safety publication according to IEC Guide 104 and has been developed according to ISO/IEC Guide 51.
