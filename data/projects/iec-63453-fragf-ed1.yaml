abstract:
- language: en
  script: Latn
  content: |-
    <!--StartFragment -->
    <p>Simulation techniques are used to assess the dynamic interaction between overhead contact lines and pantographs, as part of the prediction of current collection quality. This document specifies functional requirements for the validation of such simulation tools to ensure confidence in, and mutual acceptance of the results of the simulations.</p>

    <p>This document deals with:</p>

    <p>– input and output parameters of the simulation;</p>

    <p>– comparison with line test measurements, and the characteristics of those line tests;</p>

    <p>– validation of pantograph models;</p>

    <p>– comparison between different simulation tools;</p>

    <p>– limits of application of validated methods to assessments of pantographs and overhead contact lines.</p>

    <p>This document applies to the current collection from an overhead contact line by pantographs mounted on railway vehicles. It does not apply to trolley bus systems.</p>
- language: fr
  script: Latn
  content: |-
    <!--StartFragment -->
    <p>Des techniques de simulation sont appliquées pour évaluer l'interaction dynamique entre les caténaires et les pantographes dans le cadre de la détermination de la qualité du captage de courant. Le présent document spécifie les exigences fonctionnelles relatives à la validation de ces outils de simulation afin de garantir la fiabilité et l'acceptation mutuelle des résultats de ces simulations.</p>

    <p>Le présent document porte sur :</p>

    <p>– les paramètres d'entrée et de sortie de la simulation ;</p>

    <p>– la comparaison des résultats de simulation par rapport aux données mesurées lors des essais en ligne et les caractéristiques de ces essais ;</p>

    <p>– la validation des modèles de pantographes ;</p>

    <p>– la comparaison entre les différents outils de simulation existants ;</p>

    <p>– les limites d'application relatives aux méthodes validées pour l'évaluation des pantographes et des caténaires.</p>

    <p>Le présent document s'applique au captage du courant d'une caténaire par les pantographes des véhicules ferroviaires. Il ne s'applique pas aux trolleybus.</p>
