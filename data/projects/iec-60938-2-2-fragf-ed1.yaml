abstract:
- language: fr
  script: Latn
  content: La CEI 60938-2-2:1999 constitue la base d'une procédure uniforme de marquage commun. Elle met en oeuvre le programme d'homologation pour les essais de sécurité uniquement de la CEI 60938-2, nécessite une déclaration de conception pour les paramètres relatifs aux essais de sécurité et indique les essais de conformité à réaliser sur tous les lots avant leur livraison et les essais de requalification en fonction des modifications apportées à la conception.
