abstract:
- language: fr
  script: Latn
  content: |-
    La CEI 60689:2008 est applicable aux mesures et aux méthodes d'essai relatives aux résonateurs à quartz à diapason dans la plage comprise entre 10 kHz et 200 kHz et aux valeurs normales pour la commande et le choix de la fréquence. La présente édition inclut les modifications techniques significatives suivantes par rapport à l'édition précédente:<br/> 
    a) Le titre de la première édition est Méthodes de mesure et d'essais destinées aux quartz à 32 kHz pour montres-bracelets et valeurs normales. Le titre en a été modifié et la plage de fréquences de cette seconde édition est étendue à la plage comprise entre 10 kHz et 200 kHz.<br/>
    b) La méthode de Lissajous est définie dans la première édition comme la méthode de mesure normale. Le réseau en PI et la méthode du pont sont utilisés dans cette seconde édition.<br/>
    c) Le réseau en PI comporte un transformateur pour l'adaptation d'impédance. Cette composition diffère de celle de la CEI 60444-1.
