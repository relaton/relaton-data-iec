abstract:
- language: en
  script: Latn
  content: |-
    IEC TS 62600-100:2024 applied in conjunction with the IEC Technical Specification on wave energy resource assessment and characterization (IEC TS 62600-101), provides a method for estimation of the mean annual energy production of a WEC, assessing the electrical power production performance of a single, non-array, wave energy converter, at Location 2 based on the performance at Location 1.<br/>
    The scope of this document includes:<br/>
    a) All wave energy converters that produce electrical power from wave energy.<br/>
    b) All sea resource zones (near and offshore, deep and shallow water).<br/>
    c) Capture width matrix transposition from one location to another.<br/>
    d) Limitation on the changes that are allowed to the WEC and the specification of the location.<br/>
    e) Wave data required at Location 2, as a minimum the requirements found in IEC TS 62600‑101.<br/>
    f) Development of the capture width matrix at Location 2.<br/>
    g) Validation of the capture width matrix at Location 2.<br/>
    h) Assessment of uncertainties in the derived performance parameters at Location 2.<br/>
    i) Requirements for the allowable power performance transfer by geometric, kinematic and dynamic similarity.<br/>
    j) Requirements for the allowable incorporation of additional empirical model data.<br/>
    k) Requirements for the allowable incorporation of additional numerical model data.<br/>
    l) The document applies to commercial scale wave energy converters that are:<br/>
    - compliantly moored.<br/>
    - tautly moored.<br/>
    - bottom mounted.<br/>
    - shore mounted.<br/>
    This second edition cancels and replaces the first edition published in 2012. This edition includes the following significant technical changes with respect to the previous edition:<br/>
    a) Incorporation of IEC TS 62600-102 as a series of annexes in this document.<br/>
    b) Removal of the computation of annual energy production. This has been moved to IEC TS 62600-101.<br/>
    c) Modification to the list of terms definitions, symbols and units.<br/>
    d) Modification of the reporting section to align with IEC TS 62600-200.
