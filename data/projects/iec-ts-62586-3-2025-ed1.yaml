  content: IEC TS 62586-3:2025 Describes a procedure used for maintenance tests of individual power quality instruments. Users of these instruments need to ensure the conformity of the individual power quality instrument for stationary use with the requirements of IEC 62586‑1. This is achieved by periodic maintenance tests as defined in this document.
