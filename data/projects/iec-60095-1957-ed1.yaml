  script: Latn
  content: Applicable aux batteries d'accumulateurs au plomb, d'une tension nominale de 6 V ou de 12 V, utilisées essentiellement comme source de courant pour le démarrage et l'allumage des moteurs à combustion interne, ainsi que pour les installations auxiliaires des véhicules munis de moteurs à combustion interne.
