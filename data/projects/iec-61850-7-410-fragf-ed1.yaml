abstract:
- language: fr
  script: Latn
  content: |-
    La CEI 61850-7-410:2007 spécifie des classes de données communes additionnelles, noeuds logiques et objets de données qui sont indispensables pour l'utilisation de la CEI 61850 dans une centrale hydroélectrique. Les Noeuds Logiques et Objets de Donnée définis dans la présente partie de la CEI 61850 appartiennent aux domaines d'utilisation suivants:<br/>
    - fonctions électriques;<br/>
    - fonctions mécaniques;<br/>
    - fonctions hydrologiques;<br/>
    - capteurs.
