abstract:
- language: en
  script: Latn
  content: Applies to protection of persons and livestock against electric shock from installations and equipment. This report presents the fundamental principle and general requirements for protection against electric shock which are common to IEC 364-4-41, IEC 536 and IEC 536-2.
- language: fr
  script: Latn
  content: S'applique à la protection des personnes et des animaux d'élevage ou domestiques contre les chocs électriques dans les installations et dans les matériels. Présente les principes fondamentaux et les prescriptions générales de protection contre les chocs électriques comme base commune aux CEI 364-4-41 et CEI 536-2. A le statut d'un rapport technique.
