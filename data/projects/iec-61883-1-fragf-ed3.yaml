abstract:
- language: fr
  script: Latn
  content: |-
    La CEI 61883-1:2008 spécifie une interface numérique pour matériel électronique audio/vidéo grand public, en utilisant la norme IEEE 1394. Elle décrit la structure générale en paquets, la gestion du flux de données et la gestion de la connexion de données audio-visuelles; elle décrit également les règles générales de transmission des commandes de contrôle. Elle définit un protocole de transmission de données audio-visuelles et une commande de contrôle assurant l'interconnexion du matériel numérique audio et vidéo, en appliquant la norme IEEE 1394. Cette troisième édition de la CEI 61883-1 annule et remplace la deuxième édition parue en 2003. Elle constitue une révision technique. Les modifications techniques significatives par rapport à la deuxième édition sont:<br/>
    - attribution d'un nouveau code FMT (Identification du format, en anglais " Format ID ") à l'Association commerciale 1394 " 601 sur 1394 ";<br/>
    - Clarification de la signification du code FMT;<br/>
    - harmonisation de la CEI 61883-1 avec l'IEEE 1394.1 pour les vitesses supérieures à S400. La présente version bilingue (2012-08) correspond à la version anglaise monolingue publiée en 2008-02.
