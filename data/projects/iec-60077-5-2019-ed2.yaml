abstract:
- language: en
  script: Latn
  content: |-
    IEC 60077-5:2019 give additional or amended rules for high voltage (HV) fuses as a supplement to those given by IEC 60077-2. The high voltage fuses concerned are those connected into power and/or auxiliary circuits. The nominal voltage of these circuits lies between 600 V DC and 3 000 V DC, according to IEC 60850. These fuses can also be used in auxiliary AC circuits up to a nominal voltage of 1 500 V. This document together with IEC 60077-2 states specifically:<br/>
    a) the characteristics of the fuses;<br/>
    b) the service conditions with which the fuses comply with reference to:<br/>
    - operation and behaviour in normal service;<br/>
    - operation and behaviour in case of short circuit;<br/>
    - dielectric properties.<br/>
    c) the tests intended for confirming the compliance of the fuse with the characteristics under the service conditions and the methods adopted for these tests;<br/>
    d) the information marked on, or given with, the fuse.<br/>
    This second edition cancels and replaces the first edition, issued in 2003. This edition includes the following main technical changes with regard to the previous edition:<br/>
    a) test method of test duty III for verification of breaking capacity is reviewed.
- language: fr
  script: Latn
  content: |-
    L'IEC 60077-5:2019 fournir des règles complémentaires ou amendées pour les fusibles à haute tension, en plus de celles données dans l'IEC 60077-2. Les fusibles à haute tension concernés sont connectés dans les circuits de puissance et/ou auxiliaires. La tension nominale de ces circuits est située entre 600 V CC et 3 000 V CC, conformément à l'IEC 60850. Ces fusibles peuvent également être utilisés dans des circuits auxiliaires à courant alternatif jusqu'à une tension nominale de 1 500 V. En complément de l'IEC 60077-2, le présent document précise particulièrement:<br/>
    a) les caractéristiques des fusibles;<br/>
    b) les conditions de service que les fusibles supportent du point de vue:<br/>
    - du fonctionnement et du comportement en service normal;<br/>
    - du fonctionnement et du comportement en cas de court-circuit;<br/>
    - des propriétés diélectriques.<br/>
    c) les essais destinés à vérifier la conformité du fusible avec les caractéristiques dans les conditions de service ainsi que les méthodes à adopter pour ces essais;<br/>
    d) les informations données avec ou marquées sur le fusible.<br/>
    Cette deuxième édition annule et remplace la première édition, parue en 2003. Cette édition inclut les modifications techniques majeures suivantes par rapport à l'édition précédente:<br/>
    a) révision de la méthode d'essai des conditions d'essai III pour la vérification du pouvoir de coupure.
