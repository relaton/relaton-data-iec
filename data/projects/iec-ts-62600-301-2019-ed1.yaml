abstract:
- language: en
  script: Latn
  content: |-
    IEC TS 62600-301:2019 provides:<br/>
    · Methodologies that ensure consistency and accuracy in the determination of the theoretical river energy resource at sites that may be suitable for the installation of River Energy Converters (RECs);<br/>
    · Methodologies for producing a standard current speed distribution based on measured, historical, or numerical data, or a combination thereof, to be used in conjunction with an appropriate river energy power performance assessment;<br/>
    · Allowable data collection methods and/or modelling techniques; and<br/>
    · A framework for reporting results.<br/>
    The document explicitly excludes:<br/>
    · Technical or practical resource assessments;<br/>
    · Resource characterisation;<br/>
    · Power performance assessment of river energy converters; and<br/>
    · Environmental impact studies, assessments, or similar.
