abstract:
- language: fr
  script: Latn
  content: |-
    La CEI 60454-3-11:2007 contient les exigences relatives aux rubans adhésifs sensibles à la pression, composés d'endos combinés reposant sur un film polyester:<br/>
    - Rubans de combinaison de film polyéthylène-téréphtalate (PET)/filament de verre;<br/>
    - Rubans de combinaison de papier cellulosique crêpé/film polyéthylène-téréphtalate (PET);<br/>
    - Rubans de combinaison de film polyéthylène-téréphtalate (PET)/polyester non tissé polyester;<br/>
    - Rubans de combinaison de film polyéthylène-téréphtalate (PET)/époxy.<br/>
    Cette deuxième édition de la CEI 60454-3-11 remplace la première édition, publiée en 1998, ainsi que la CEI 60454-3-15 (2001), la CEI 60454-3-16 (2003) et la CEI 60454-3-17 (2001). Cette nouvelle édition constitue une révision technique.La CEI 60454-3-15, la CEI 60454-3-16 et la CEI 60454-3-17 doivent être supprimées au moment de cette publication. Les principales modifications par rapport à l'édition précédente sont la consolidation des Parties 3-11, 3-15, 3-16 et 3-17.
    Mots clé: rubans adhésifs sensibles à la pression
