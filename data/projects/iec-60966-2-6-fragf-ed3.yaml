abstract:
- language: fr
  script: Latn
  content: |-
    La CEI 60966-2-6:2009 est une spécification particulière qui s'applique aux cordons coaxiaux souples décrits dans la CEI 60096-2.
    Elle concerne les cordons de connexion de récepteurs radio ou TV, en particulier la sous-famille d'ensembles de cordons F (CEI 61169-24).
    Cette spécification particulière indique les exigences relatives aux sous-familles et les sévérités qui doivent être appliquées. Cette troisième édition annule et remplace la deuxième édition et constitue une révision technique. Par rapport à la deuxième édition, les principales modifications concernent la mise à jour des références ainsi que l'exigence relative à l'affaiblissement d'écran.
