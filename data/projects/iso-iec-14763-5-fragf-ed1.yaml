abstract:
- language: en
  script: Latn
  content: |-
    IEC 14763-5:2025 specifies requirements and recommendations to maximize the sustainability of cabling systems including both customer premises infrastructure and the accommodation of information technology equipment by addressing the<br/>
    a) cabling design;<br/>
    b) selection, packaging and transportation of components and related materials;<br/>
    c) installation, operation and maintenance;<br/>
    d) management of waste materials;<br/>
    e) skill sets necessary for designers, installers and users.
- language: fr
  script: Latn
  content: |-
    IEC 14763-5:2025 spécifie les exigences et les recommandations visant à maximiser la durabilité des systèmes de câblage, y compris l’infrastructure des réseaux d’usagers et l’hébergement des appareils de traitement de l’information, en traitant les points suivants:<br/>
    a) conception du câblage;<br/>
    b) choix, emballage et transport des composants et du matériel associé;<br/>
    c) installation, exploitation et maintenance;<br/>
    d) gestion des déchets;<br/>
    e) compétences nécessaires aux concepteurs, installateurs et usagers.
