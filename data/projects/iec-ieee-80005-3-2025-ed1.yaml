abstract:
- language: en
  script: Latn
  content: |-
    IEC/IEEE 80005-3:2025 specifies provisions for the design, installation and testing of low-voltage shore connection (LVSC) systems, onboard ships and on shore, to supply the ship with electrical power from shore.<br/>
    This document is applicable to:<br/>
    - ships requiring up to 1 MVA while at berth;<br/>
    - three-phase shore connection systems rated 250 A and above, and with a nominal voltage rating of 400 V AC to 1 000 V AC;<br/>
    - shore-side connection systems;<br/>
    - shore-to-ship connection and interface equipment;<br/>
    - transformers and reactors;<br/>
    - semiconductor and rotating frequency convertors;<br/>
    - ship-side connection systems;<br/>
    - protection, control, monitoring, interlocking and power management systems.<br/>
    This document does not apply to:<br/>
    - inland navigation vessels;<br/>
    - high-voltage shore connection systems, including ships built in accordance with the annexes of IEC/IEEE 80005-1;<br/>
    - the electrical power supply during docking periods, for example dry docking and other out-of-service maintenance and repair;<br/>
    - systems to be operated by ordinary persons as defined in 3.19.
