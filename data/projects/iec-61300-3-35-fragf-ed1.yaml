abstract:
- language: fr
  script: Latn
  content: La CEI 61300-3-35:2009 décrit les méthodes prévues pour évaluer quantitativement la qualité de l'extrémité d'un connecteur à fibres optiques polies. Les informations sont destinées à être utilisées avec d'autres normes qui établissent les exigences pour les défauts en surface admissibles, tels que les éraflures, les piqûres et les débris qui peuvent affecter la performance optique. En général, les méthodes décrites dans la présente norme s'appliquent aux fibres à gaine de 125 ohmm contenues dans une férule et destinées à être utilisées avec des sources &le;2 W de puissance d'entrée. Toutefois, des parties sont applicables aux connecteurs exempts de férules et autres types de fibres. Ces parties sont identifiées s'il y lieu.
