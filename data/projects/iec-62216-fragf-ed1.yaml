abstract:
- language: en
  script: Latn
  content: |-
    IEC 62216:2009 specifies both Standard Definition and High Definition receivers for the DVB-T system.<br/>
    It concerns:<br/>
    • broadcasters, and<br/>
    • receiver manufacturers.<br/>
    The objective is to define:<br/>
    • how to provide broadcasts that are understood by all receivers and enable receivers to provide good facilities to their users;<br/>
    • the behaviour required from receivers to work well with these broadcasts and to be attractive to consumers.<br/>
    To avoid doubt, the words “shall”, “should”, etc. are used in the traditional way to distinguish issues that are mandatory versus those that are optional A baseline receiver will support the mandatory features but not all the optional features in this standard. Inclusion of optional features is part of the marketing strategy of the manufacturer.<br/>
    Subtitling and teletext are considered to be components of TV services. Standalone teletext services (without associated video content) are not part of this standard.<br/>
    This standard primarily addresses terrestrial delivery of digital transmissions.<br/>
    This standard primarily addresses deployment in countries that use European Latin script based languages.<br/>
    Two types of systems are considered:<br/>
    • standard systems where services are all SD and use well-established codecs. Standard receivers which can decode standard services are suitable for these systems;<br/>
    • advanced systems where some services may use advanced codecs, for example to provide HD video. Advanced receivers which can decode advanced services are suitable for these systems.<br/>
    Where the term “receiver” or “broadcast” is used without a qualifier, the statement is applicable equally to both types of systems.
- language: fr
  script: Latn
  content: |-
    L'62216:2009 spécifie à la fois les récepteurs de définition normalisés et de haute définition pour le système DVB-T.<br/>
    Elle s’adresse:<br/>
    • aux diffuseurs et<br/>
    • aux fabricants de récepteurs.<br/>
    L’objectif étant de définir:<br/>
    • comment diffuser des émissions recevables par l’ensemble des récepteurs et permettre à ces derniers d’offrir aux téléspectateurs de bonnes fonctionnalités;<br/>
    • le comportement requis pour les récepteurs afin de fonctionner correctement avec les services diffusés et d’être attractifs pour les téléspectateurs.<br/>
    Pour éviter toute confusion, les expressions ʺdoitʺ, ʺil convient deʺ etc. sont utilisées de manière classique afin de distinguer les points importants de ceux qui le sont moins. Un récepteur de base prend en charge les caractéristiques obligatoires mais il ne prend pas en charge toutes les caractéristiques facultatives de la présente norme. L'introduction de caractéristiques facultatives fait partie de la stratégie de marketing du fabricant.<br/>
    Le sous-titrage et le système télétexte sont considérés comme composantes des services de télévision. La possibilité d’un service télétexte seul (sans contenu vidéo associé) n’est pas prise en compte.<br/>
    La présente norme concerne principalement la diffusion terrestre des transmissions numériques.<br/>
    La présente norme traite principalement du déploiement dans les pays qui utilisent des langues basées sur l’écriture latine Européenne.<br/>
    On considère deux types de système:<br/>
    • les systèmes normalisés dont les services sont tous SD et utilisent des codecs bien connus. Les récepteurs standard qui peuvent décoder des services standard conviennent pour ces systèmes;<br/>
    • les systèmes avancés où certains services peuvent utiliser des codecs avancés, par exemple pour fournir de la vidéo HD (haute définition). Les récepteurs avancés qui peuvent décoder des services avancés conviennent pour ces systèmes.<br/>
    Lorsqu'on utilise le terme ʺrécepteurʺ ou ʺdiffusionʺ sans qualificatif, cet énoncé s'applique également aux deux types de systèmes.
