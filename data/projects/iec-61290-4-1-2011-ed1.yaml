abstract:
- language: en
  script: Latn
  content: IEC 61290-4-1:2011 applies to erbium-doped fibre amplifiers (EDFAs) and optically amplified elementary sub-systems. It applies to OAs using active fibres (optical fibre amplifiers, OFAs), containing rare-earth dopants. These amplifiers are commercially available and widely deployed in service provider networks.
- language: fr
  script: Latn
  content: La CEI 62190-4-1:2011 s'applique aux amplificateurs à fibre dopée à l'erbium (EDFA) et aux sous-systèmes élémentaires à amplification optique. Elle s'applique aux AO utilisant des fibres actives (amplificateurs à fibres optiques, AFO), contenant des dopants aux terres rares. Ces amplificateurs sont disponibles sur le marché et sont largement déployés dans les réseaux de prestataires de service.
