abstract:
- language: en
  script: Latn
  content: |-
    Applicable to a.c. contactors and/or contactor-based motor-starters designed for indoor installation and operation at frequencies up to and including 60 Hz on systems having voltages above 1 000 V but not exceeding 12 000 V.

    Applicable only to three-pole contactors and starters for use in three-phase systems and single-pole contactors and starters for use in single-phase systems.
