  script: Latn
  content: deals with the safety requirements applicable to fixed sited systems and equipment. As far as applicable, it is also valid for mobile and temporarily installed systems, for example, caravans.It provides specifically for the safety of the system, personnel working on it, subscribers and subscriber equipment. It deals only with safety aspects and is not intended to define a standard for the protection of the equipment used in the system.
