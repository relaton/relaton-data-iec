abstract:
- language: en
  script: Latn
  content: |-
    IEC 60794-3-60:2008 covers drinking water pipe cables and subducts for installation by blowing and/or pulling/dragging/floating in drinking water pipes. Systems built with components covered by this standard are subject to the requirements of sectional specification IEC 60794-3.<br/>
    <br/>
    This publication is to be read in conjunction with  IEC 60794-1-1:2011, IEC 60794-1-2:2003 and IEC 60794-3:2001.
- language: fr
  script: Latn
  content: |-
    La CEI 60794-3-60:2008 s'applique aux câbles de canalisations d'eau potable et aux sous-conduites destinés à être installés par soufflage et/ou tirage/traînage/flottaison dans les canalisations d'eau potable. Les systèmes intégrant des éléments couverts par la présente norme sont soumis aux exigences de la spécification intermédiaire CEI 60794-3.<br/>
    <br/>
    Cette publication doit être lue conjointement avec la CEI 60794-1-1:2011, la CEI 60794-1-2:2003 et la CEI 60794-3:2001.
