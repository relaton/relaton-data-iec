abstract:
- language: en
  script: Latn
  content: |-
    Deals with the safety of electrically operated commercial rinsing
    sinks not intended for household use, their rated voltage being not
    more than 250 V for single-phase appliances and 480 V for other
    appliances.
- language: fr
  script: Latn
  content: |-
    Traite de la sécurité des plonges électriques à usage collectif,
    qui ne sont pas destinées aux usages domestiques, la tension
    assignée des appareils n'étant pas supérieure à 250 V pour les
    appareils monophasés, et 480 V pour les autres appareils.
