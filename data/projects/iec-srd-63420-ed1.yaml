abstract:
- language: en
  script: Latn
  content: This document specifies requirements for the design, verification, and validation measures to achieve the AAL-specific safety of the intended functionality (SOTIF) for electrical/electronic E/E systems in which housing equipment with advanced features operates in cooperation to improve the lives of AAL users effectively. SOTIF refers to the absence of unreasonable risk due to hazards resulting from malfunctioning behaviour, that are caused by unexpected factors in the designer’s intended function or reasonably foreseeable misuse, in E/E systems in which housing equipment that has been made in accordance with the design intention operates in cooperation. The E/E system in which housing equipment operates in cooperation covered in this document is a system that is a combination of existing products from different companies as well as newly developed products. E/E systems in which housing equipment operates in cooperation tend to mislead users and are likely to be used incorrectly because their combinations may change according to the lifestyle of the user and there are differences in the performance, conflicts in purpose or operation as well as differences in functionality among individual products with respect to the whole system. This document is meant to be applied to the intended functionality of E/E systems in which housing equipment operates in cooperation.
