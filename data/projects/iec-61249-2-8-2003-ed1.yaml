abstract:
- language: en
  script: Latn
  content: Gives requirements for properties of modified brominated epoxide woven E-glass reinforced laminate sheets of defined flammability, copper-clad in thicknesses of 0,05 mm up to 3,2 mm. The flammability rating is achieved through the use of brominated fire retardants reacted as part of the epoxide polymeric structure.
- language: fr
  script: Latn
  content: Donne les prescriptions concernant les propriétés des feuilles stratifiées en tissu de verre de type E époxyde modifié ayant une épaisseur comprise entre 0,05 mm et 3,2 mm, plaquées cuivre, d'inflammabilité définie. Les caractéristiques d'inflammabilité sont obtenues en utilisant des ignifuges bromés issus de la structure polymère époxyde.
