abstract:
- language: fr
  script: Latn
  content: La CEI 61675-3:1998 a pour objet de spécifier les méthodes d'essai relatives à la description des caractéristiques des systèmes d'imagerie du corps entier à gamma caméra. Dans la mesure où ces systèmes sont basés sur des gamma caméras de type Anger, il convient de lire la présente partie de la CEI 61675 conjointement avec la CEI 60789. Les méthodes d'essai spécifiées ont été sélectionnées afin de refléter autant que possible l'utilisation clinique des systèmes d'imagerie du corps entier à gamma caméra. L'objectif est de faire appliquer ces méthodes d'essai par les fabricants, leur donnant ainsi les moyens de décrire les caractéristiques des systèmes d'imagerie du corps entier à gamma caméra.
