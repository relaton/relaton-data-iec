abstract:
- language: fr
  script: Latn
  content: La CEI 60873-1:2003 fournit des méthodes pour la détermination des performances de tous les enregistreurs analogiques électriques et pneumatiques sur papier diagramme fonctionnant à partir d'un signal normalisé et qui peuvent être utilisés en commande de processus. Elle spécifie des méthodes uniformes d'essai pour l'évaluation des performances d'enregistreurs analogiques électriques et pneumatiques sur papier diagramme fonctionnant à partir d'un signal normalisé et qui peuvent être utilisés en commande de processus.
