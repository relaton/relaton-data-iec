abstract:
- language: en
  script: Latn
  content: "<!-- NEW! -->IEC 62453-1:2025 is available as <a href=\"https://webstore.iec.ch/publication/109139\">IEC 62453-1:2025 RLV</a> which contains the International Standard and its Redline version, showing all changes of the technical content compared to the previous edition.</br></br>IEC 62453-1:2025 presents an overview and guidance for the IEC 62453 series. It<br />\r\n• explains the structure and content of the IEC 62453 series (see Clause 5);<br />\r\n• provides explanations of some aspects of the IEC 62453 series that are common to many of the parts of the series;<br />\r\n• describes the relationship to some other standards;<br />\r\n• provides definitions of terms used in other parts of the IEC 62453 series.<br />\r\nThis third edition cancels and replaces the first edition published in 2016. This edition constitutes a technical revision.<br />\r\nThis edition includes the following significant technical changes with respect to the previous edition:<br />\r\na) introduction of a new implementation technology (defined in IEC TS 62453-43);<br />\r\nb) introduction of an OPC UA information model for FDT (defined in IEC 62453-71)."
- language: fr
  script: Latn
  content: "<!-- NEW! -->IEC 62453-1:2025 est disponible sous forme de <a href=\"https://webstore.iec.ch/publication/109139\">IEC 62453-1:2025 RLV</a> qui contient la Norme internationale et sa version Redline, illustrant les modifications du contenu technique depuis l'édition précédente.</br></br>L'IEC 62453-1:2025 présente une vue générale et fournit un guide pour la série IEC 62453. Elle:<br />\r\n• explique la structure et le contenu de la série IEC 62453 (voir Article 5);<br />\r\n• fournit des explications de certains aspects de la série IEC 62453 qui sont communs à beaucoup de parties de la série;<br />\r\n• décrit la relation avec d’autres normes;<br />\r\n• fournit les définitions des termes utilisés dans d’autres parties de la série IEC 62453.<br />\r\nCette troisième édition annule et remplace la première édition parue en 2016. Cette édition constitue une révision technique.<br />\r\nCette édition inclut les modifications techniques majeures suivantes par rapport à l’édition précédente:<br />\r\na) introduction d’une nouvelle technologie de mise en œuvre (définie dans l’IEC TS 62453‑43);<br />\r\nb) introduction d’un modèle d’information d’architecture unifiée de l’OPC pour les outils FDT (défini dans l’IEC 62453-71)."
