abstract:
- language: en
  script: Latn
  content: Describes measurement procedures for current-voltage characteristics of crystalline silicon photovoltaic devices in natural or simulated sunlight. These procedures are applicable to a single solar cell, a sub-assembly of solar cells, or a flat module.
- language: fr
  script: Latn
  content: Décrit les procédures de mesure des caractéristiques courant-tension des dispositifs photovoltaïques au silicium cristallin sous éclairement solaire naturel ou simulé. Ces procédures sont applicables aux cellules solaires individuelles, aux assemblages de cellules solaires et aux modules plans.
