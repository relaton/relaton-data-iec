abstract:
- language: en
  script: Latn
  content: IEC 62821-1:2015 applies to cables with insulation, and sheath if any, based on halogen-free, thermoplastic compound, and having low emission of smoke and corrosive gases when exposed to fire, of rated voltages up to and including 450/750 V used in power installations of nominal voltage not exceeding 450/750 V a.c.
- language: fr
  script: Latn
  content: L'IEC 62821-1:2015 s'applique aux câbles à isolation et gaine, le cas échéant, à base de mélanges thermoplastiques sans halogène et à faible dégagement de fumées et de gaz corrosifs en cas d exposition au feu, de tensions assignées au plus égales à 450/750 V, utilisés dans des installations d'énergie d'une tension nominale ne dépassant pas 450/750 V en courant alternatif.
