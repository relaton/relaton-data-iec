abstract:
- language: fr
  script: Latn
  content: |-
    La CEI 60704-2-2:2009 fournit la méthode pour la détermination du bruit aérien émis par les appareils de chauffage soufflants électriques, conçus pour être placés sur le sol, sur une table ou sur un plan de travail, etc., ou pour être fixés au mur.
    Les principales modifications de la présente édition par rapport à l'édition précédente sont l'addition des dispositions pour les incertitudes de mesure, ainsi que des écarts types pour la déclaration et la vérification. Cette norme doit être utilisée conjointement avec la CEI 60704-1:1997.
