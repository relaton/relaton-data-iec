abstract:
- language: en
  script: Latn
  content: IEC 63652-1:2026 specifies a method and procedures for Wireless Power Transfer between two NFC wireless devices. The provided technical foundations use NFC technology for the initiation, control and execution of 13.56 MHz power transfer.
- language: fr
  script: Latn
  content: "<p>IEC 63652-1:2026 spécifie une méthode et des procédures pour le transfert d'énergie sans fil entre deux dispositifs sans fil NFC. Les fondations techniques fournies utilisent la technologie NFC pour le démarrage, le contrôle et l'exécution du transfert d'énergie à 13,56 MHz.</p>"
