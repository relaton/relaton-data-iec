abstract:
- language: en
  script: Latn
  content: |-
    IEC 60794-1-21:2015 applies to optical fibre cables for use with telecommunication equipment and devices employing similar techniques, and to cables having a combination of both optical fibres and electrical conductors. The object of this standard is to define test procedures to be used in establishing uniform requirements for mechanical requirement performance. Throughout this standard the wording "optical cable" may also include optical fibre units, microduct fibre units, etc. General requirements and definitions are given in IEC 60794-1-20 and a complete reference guide to test method of all types in the IEC 60794-1-2. This first edition of IEC 60794-1-21 cancels and replaces the mechanical tests part of the second edition of IEC 60794-1-2, published in 2003. It constitutes a technical revision. Keywords: optical fibre cables for use with telecommunication equipment, test procedures<br/>
    <br/>
    This publication is to be read in conjunction with IEC 60794-1-1:2011.
- language: fr
  script: Latn
  content: |-
    IEC 60794-1-21:2015 s'applique aux câbles à fibres optiques destinés à être utilisés avec des équipements de télécommunication et des dispositifs utilisant des techniques analogues, ainsi qu'aux câbles constitués de fibres optiques d'une part et de conducteurs électriques d'autre part.L'objet de la présente norme est de définir les procédures d'essai à utiliser en vue d'établir des exigences uniformes pour les performances d'exigence mécanique. Dans la présente norme, le terme "câble optique" peut également englober les unités de fibres optiques, les unités de fibres en microconduit, etc. Les exigences générales et les définitions sont données dans l'IEC 60794-1-20 et un guide de référence complet pour tous les types de méthode d'essai est contenu dans l'IEC 60794-1-2. Cette première édition de l'IEC 60794-1-21 annule et remplace la partie des essais mécaniques de la deuxième édition de l'IEC 60794-1-2, publiée en 2003. Elle constitue une révision technique.<br/>
    Mots clés : câbles à fibres optiques destinés à être utilisés avec des équipements de télécommunication, procédures d'essai
