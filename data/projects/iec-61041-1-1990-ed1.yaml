abstract:
- language: en
  script: Latn
  content: Deals with the assessment of the performance of non-broadcast video tape recorders of the so-called colour-under type for domestic use. Defines test signals, measurement set-ups and measurement conditions so as to make possible the comparison of the results of measurements.
- language: fr
  script: Latn
  content: S'applique aux performances des magnétoscopes hors radiodiffusion, du type «chrominance en bande inférieure», pour usages grand public. Définit les signaux d'essai, les montages de mesure et les conditions de mesure de façon à rendre possible la comparaison des résultats de mesure.
