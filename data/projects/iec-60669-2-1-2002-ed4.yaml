abstract:
- language: en
  script: Latn
  content: |-
    Applies to electronic switches and to associated electronic
    extension units for household and similar fixed electrical
    installations either indoors or outdoors.

    The contents of the Interpretation sheet 1 of December 2011 have been included in this copy.
- language: fr
  script: Latn
  content: |-
    S'applique aux interrupteurs électroniques et aux périphériques
    électroniques associées pour installations domestiques et
    installations électriques fixes analogues soit intérieures, soit
    extérieures.

    Le contenu de la feuille d'interprétation 1 de décembre 2011 a été pris en considération dans cet exemplaire.
