abstract:
- language: en
  script: Latn
  content: |-
    CISPR 11: 2022 applies to industrial, scientific and medical electrical equipment operating in the frequency range 0 Hz to 400 GHz and to domestic and similar appliances designed to generate and/or use locally radio-frequency energy. This document covers emission requirements related to radio-frequency (RF) disturbances in the frequency range of 9 kHz to 400 GHz. Measurements are only performed in frequency ranges where limits are specified in Clause 6. For ISM RF applications in the meaning of the definition found in the ITU Radio Regulations (see Definition 3.1.20), this document covers emission requirements related to radio-frequency disturbances in the frequency range of 9 kHz to 18 GHz. ISM equipment which incorporates radio transmit/receive functions (host equipment with radio functionality) is included in the scope of this document, see Annex F. However, the emission requirements in this document are not intended to be applicable to the intentional transmissions from a radio transmitter as defined by the ITU including their spurious emissions. Requirements for ISM RF lighting equipment and UV irradiators operating at frequencies within the ISM frequency bands defined by the ITU Radio Regulations are contained in this document. Robots used for industrial, scientific and medical applications are in the scope of this document. Equipment covered by other CISPR product and product family emission standards are excluded from the scope of this document. This seventh edition cancels and replaces the sixth edition published in 2015, Amendment 1:2016 and Amendment 2:2019. This edition constitutes a technical revision.This edition includes the following significant technical changes with respect to the previous edition:<br/>
    introduction of limits for radiated disturbances in the frequency range above 1 GHz for group 1 equipment in line with the requirements given in the generic emission standards;<br/>
    introduction of limits for conducted disturbances on the wired network port in line with the requirements given in the generic emission standards;<br/>
    introduction of requirements for equipment which incorporates radio transmit/receive functions;<br/>
    introduction of definitions for various types of robots;<br/>
    consideration of some particular conditions when measuring robots, such as measurement setups and operating modes of robots;<br/>
    introduction of information related to various types of wireless power transfer equipment.
