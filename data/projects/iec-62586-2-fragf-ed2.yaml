abstract:
- language: en
  script: Latn
  content: |-
    IEC 62586-2:2017 specifies functional tests and uncertainty requirements for instruments whose functions include measuring, recording, and possibly monitoring power quality parameters in power supply systems, and whose measuring methods (class A or class S) are defined in IEC 61000-4-30.<br/>
    This document applies to power quality instruments complying with IEC 62586-1.<br/>
    This document can also be referred to by other product standards (e.g. digital fault recorders, revenue meters, MV or HV protection relays) specifying devices embedding class A or class S power quality functions according to IEC 61000-4-30.<br/>
    These requirements are applicable in single-, dual- (split phase) and 3-phase AC power supply systems at 50 Hz or 60 Hz.<br/>
    This second edition cancels and replaces the first edition published in 2013. This edition constitutes a technical revision. This edition includes the following significant technical changes with respect to the previous edition:<br/>
    - test procedures for RVC and current have been added;<br/>
    - mistakes have been fixed.<br/>
    This bilingual version (2017-11) corresponds to the monolingual English version, published in 2017-03.<br/>
    The French version of this standard has not been voted upon.
- language: fr
  script: Latn
  content: |-
    L'IEC 62586-2:2017 spécifie les essais fonctionnels et les exigences d'incertitude pour les instruments dont les fonctions incluent la mesure, l'enregistrement et, éventuellement, la surveillance des paramètres de qualité de l'alimentation dans les réseaux d'alimentation, et dont les méthodes de mesure (classe A ou classe S) sont définies dans l'IEC 61000-4-30.<br/>
    La présente norme s'applique aux instruments de qualité de l'alimentation conformes à l'IEC 62586-1.<br/>
    Cette norme peut également apparaître sous forme de référence dans d'autres normes de produits (p. ex. sur les enregistreurs de défauts numériques, les appareils de mesure des revenus, les relais de protection MV ou HV) spécifiant des appareils incorporant des fonctions de qualité de l'alimentation de classe A ou de classe S selon l'IEC 61000-4-30.<br/>
    Ces exigences sont applicables aux réseaux d'alimentation en courant alternatif monophasés, biphasés (phase divisée) et triphasés à 50 Hz ou 60 Hz.<br/>
    Cette deuxième édition annule et remplace la première édition parue en 2013. Cette édition constitue une révision technique.<br/>
    Cette édition inclut les modifications techniques majeures suivantes par rapport à l'édition précédente:<br/>
    - ajout des procédures d'essai des RVC et du courant;<br/>
    - correction d'erreurs.<br/>
    La présente version bilingue (2017-11) correspond à la version anglaise monolingue publiée en 2017-03. <br/>
    La version française de cette norme n'a pas été soumise au vote.
