abstract:
- language: en
  script: Latn
  content: |-
    IEC 63407:2026 is applicable to automatic couplers, consisting of an automated connection device (ACD) and an ACD counterpart, of standardized configuration, intended for use in electric vehicle conductive charging systems which incorporate control means, with rated operating voltage up to 1 500 V DC. This document applies to high power DC interfaces intended for use in isolated conductive charging systems, for circuits specified in IEC 61851‑23‑1.<br/>
    The requirements of this document apply only to automatic couplers defined in Annex A, Annex B, Annex C and Annex D of this document.
- language: fr
  script: Latn
  content: |-
    L'IEC 63407:2026 s’applique aux connecteurs automatiques composés d’un dispositif de connexion automatisé (ACD) et d’une contre-pièce ACD, de configuration normalisée, destinés à être utilisés dans les systèmes de charge conductifs des véhicules électriques qui intègrent des moyens de contrôle, dont la tension assignée d’emploi peut atteindre 1 500 V en courant continu. Le présent document s’applique aux interfaces en courant continu de puissance élevée, destinées à être utilisées dans les systèmes de charge conductifs isolés, pour les circuits spécifiés dans l’IEC 61851‑23-1.<br/>
    Les exigences du présent document s’appliquent uniquement aux connecteurs automatiques définis dans l’Annexe A, l’Annexe B, l’Annexe C et l’Annexe D du présent document.
