abstract:
- language: en
  script: Latn
  content: Deals with the safety of electric blankets, pads and other flexible appliances for heating the bed or human body, for household and similar purposes, their rated voltage being not more than 250 V. This standard also deals with the control units supplied with the appliance.
- language: fr
  script: Latn
  content: Traite de la sécurité des couvertures, coussins et autres appareils électriques souples, destinés à chauffer un lit ou le corps humain, pour usages domestiques et analogues et dont la tension assignée n'est pas supérieure à 250 V.  Cette norme s'applique également aux unités de commande fournies avec l'appareil.
