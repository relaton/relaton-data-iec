  script: Latn
  content: |-
    est applicable à des câbles de branchement remplis ayant un écran métallique sur l'âme du câble, une gaine thermoplastique, des conducteurs cuivre et une enveloppe isolante massive ou cellulaire. Ces câbles sont disponibles typiquement de 2 à 6 paires.
