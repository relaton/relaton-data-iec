abstract:
- language: en
  script: Latn
  content: |-
    IEC TR 63415:2023 provides an overview over the formalized modelling and designing of cybersecure architectures to apply for I&amp;C system cybersecurity enforcement at NPPs. The plant-specific risk assessment can use the techniques covered by this TR. This document considers the complex problem of NPP I&amp;C architecture synthesis to address particular issues:<br/>
    - asset classification,<br/>
    - barrier measures assignment,<br/>
    - the information transfer and links conformity with security requirements.<br/>
    This document provides guidance on creating a comprehensive security model applicable to NPP I&amp;C systems that describes NPP I&amp;C cybersecurity architecture and aids in accomplishing the main tasks of I&amp;C system secure design, which are:<br/>
    - specification of system designs with increased determinism that enhance security,<br/>
    - mapping of the security requirements into the security architecture of the I&amp;C system,<br/>
    - definition of the security requirements for information exchange between components within the I&amp;C system, operators and other systems,<br/>
    - assistance in the determination of the security degree assignment with a model-based technique considering asset properties and formal grouping of the assets,<br/>
    design and establishment of security zones boundaries.
