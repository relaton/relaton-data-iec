abstract:
- language: en
  script: Latn
  content: IEC 61326-2-6:2020 specifies minimum requirements for immunity and emissions regarding electromagnetic compatibility for IN VITRO DIAGNOSTIC (IVD) MEDICAL EQUIPMENT, taking into account the particularities and specific aspects of this electrical equipment and their electromagnetic environment.
- language: fr
  script: Latn
  content: L'IEC 61326-2-6:2020 spécifie les exigences minimales pour l’immunité et les émissions relatives à la compatibilité électromagnétique des MATERIELS MEDICAUX DE DIAGNOSTIC IN VITRO (IVD – in vitro diagnostic), en prenant en compte les particularités et aspects spéc ifiques de ces matériels et de leur environnement électromagnétique.
