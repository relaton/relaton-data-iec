abstract:
- language: fr
  script: Latn
  content: 'La CEI 60384-3:2006 s''applique aux condensateurs au tantale pour montage en surface, à électrolyte solide. Ces condensateurs sont principalement destinés à être montés directement sur des substrats pour circuits hybrides ou sur des cartes imprimées. On considère les 2 modèles suivants: Modèle 1 - condensateurs protégés; Modèle 2 - condensateurs non protégés. Cette troisième édition annule et remplace la deuxième édition publiée en 1989. Elle constitue une révision mineure des tableaux, valeurs et références. La présente version bilingue correspond à la version anglaise.'
