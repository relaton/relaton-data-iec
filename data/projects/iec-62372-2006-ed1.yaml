abstract:
- language: en
  script: Latn
  content: Is applicable to housed scintillators for registration and spectrometry of alpha-, beta-, gamma-, X-ray and neutron radiation. Establishes basic parameters such as a light output and intrinsic resolution and specifies the requirements for the equipment and the methods of defining the basic parameters.
- language: fr
  script: Latn
  content: Est applicable aux scintillateurs montés utilisés pour l'enregistrement et la spectrométrie des radiations ionisantes (alpha, bêta, gamma, X et neutrons). Etablit les paramètres basiques, comme lumière sortante et résolution intrinsèque, et spécifie les exigences pour l'équipement et les méthodes de définition des paramètres basiques.
