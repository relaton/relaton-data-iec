abstract:
- language: en
  script: Latn
  content: |-
    lEC 60320-3:2014 sets the dimensions for appliance couplers for two poles and two poles with earth contact:<br/>
    - for the connection of electrical devices for household and similar onto the mains supply and<br/>
    - for the interconnection of the electrical supply to appliance or equipment<br/>
    - and dimensions for gauges.<br/>
    <br/>
    This publication is to be read in conjunction with IEC 60320-1:2007.
- language: fr
  script: Latn
  content: |-
    L'IEC 60320-3:2014 établit les dimensions applicables aux connecteurs bipolaires et bipolaires avec contact de terre :<br/>
    - pour raccordement des dispositifs électriques pour usages domestiques et analogues à l'alimentation électrique et<br/>
    - pour raccordement de l'alimentation électrique aux appareils d'utilisation ou autres matériels électriques<br/>
    - et les dimensions des calibres.<br/>
    <br/>
    Cette publication doit être lue conjointement avec la CEI 60320-1:2007.
