abstract:
- language: en
  script: Latn
  content: Applies to instruments for measurement of A-frequency- weighted sound exposure resulting from steady, intermittent, fluctuating, irregular, or impulsive sound. Specifies acoustical and electrical performance requirements for personal sound exposure meters of one accuracy grade.
- language: fr
  script: Latn
  content: S'applique aux instruments de mesure de l'exposition sonore pondérée A en fréquence et résultant de sons stables, intermittents, fluctuants, irréguliers, ou impulsifs. Donne les prescriptions concernant les caractéristiques acoustiques et électriques des exposimètres acoustiques individuels correspondant à une seule classe de précision.
