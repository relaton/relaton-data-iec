abstract:
- language: en
  script: Latn
  content: |-
    IEC 61892-3:2026 is applicable to electrical equipment in mobile and fixed offshore units including floating units, pipeline, pumping or "pigging" stations, compressor stations and single buoy moorings, used in the offshore petroleum industry for drilling, production, accommodation, processing, storage and offloading purposes.<br/>
    It applies to all installations, whether permanent, temporary, transportable or hand-held, to AC installations and DC installations without any voltage level limitation. Referenced equipment standards can give voltage level limitations.<br/>
    This fifth edition cancels and replaces the fourth edition published in 2019. This edition constitutes a technical revision.<br/>
    This edition includes the following significant technical changes with respect to the previous edition:<br/>
    a) addition of floating units in Scope;<br/>
    b) minor updates in Normative references and Terms and definitions;<br/>
    c) addition of leak detection for heat exchangers in 4.13;<br/>
    d) in Table 1, deletion of Earth conductor for enclosures and replacement by reference to IEC 61892-6:—, Table 5;<br/>
    e) addition of LSC requirement for GIS up to 36 kV in 7.5.3;<br/>
    f) addition of restriction for use of SF6 in 7.6.4 and update of tightness requirements;<br/>
    g) use of LPIT (low power instrument transformers) added in 7.7.7;<br/>
    h) addition of Li-Ion and Molten salt type of batteries in 9.2.
