abstract:
- language: fr
  script: Latn
  content: La CEI 60384-4-1:2007 est une spécification particulière cadre et est un document annexe à la spécification intermédiaire qui contient des exigences pour le modèle, la disposition et le contenu minimum des spécifications particulières. Les spécifications particulières qui ne satisfont pas aux exigences peuvent ne pas être considérées comme conformes aux spécifications de la CEI et ne doivent pas être décrites comme telles. Cette troisième édition annule et remplace la deuxième édition publiée en 2000. Elle constitue une révision mineure des tableaux, valeurs et références. La présente version bilingue, publiée en 2008, correspond à la version anglaise.
