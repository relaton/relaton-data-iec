abstract:
- language: en
  script: Latn
  content: |-
    IEC 63553:2026 specifies performance requirements of fully flexible organic light emitting diode (OLED) tiles and panels whose configurations are twisted, wavy or helical for use on supplies up to 120 V ripple free DC for indoor and similar general lighting purposes and designed for being bent during the manufacturing process of curved luminaires.<br/>
    The requirements of this document relate only to type testing.
