abstract:
- language: en
  script: Latn
  content: |-
    Provides guidance on the use and interpretation of results obtained from laboratory tests.  Discusses available approaches to toxic hazard assessment consistent with the approach of ISO TC 92 SC 3, as set out in ISO/TR 9122-6.  Gives guidance on the use of toxic potency data in hazard assessment and on principles which underlie the use of combustibility and toxicological information in hazard assessment.  The detailed methodology described is directly applicable to data produced by tests measuring the lethal effects of fire effluents.  The general principles, but not all of the details, are applicable when interpreting data produced by tests which measure the incapacitating effects of fire effluents.
    Has the status of a basic safety publication in accordance with IEC Guide 104.
- language: fr
  script: Latn
  content: |-
    Fournit un guide sur l'utilisation et l'interprétation des résultats obtenus lors d'essais en laboratoire.  Traite des approches disponibles pour l'évaluation du danger toxique, compatibles avec l'approche de l'ISO TC 92 SC 3, telle que défini dans l'ISO/TR 9122-6.  Fournit également un guide pour l'utilisation des données de puissances toxiques dans l'évaluation du danger et sur des principes qui mettent l'accent sur l'utilisation d'information sur la combustibilité et la toxicologie dans l'évaluation du danger.  La méthodologie détaillée décrite est directement applicable aux données fournis par les essais qui mesurent les effets létaux des effluents du feu.  Les principes généraux, mais pas l'ensemble des détails, sont applicable lors de l'interprétation des données fournies par les essais qui mesurent les effets d'incapacitation des effluents du feu.  
    A le statut d'une publication fondamentale de sécurité conformément au Guide 104 de la CEI.
