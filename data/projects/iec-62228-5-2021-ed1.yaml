abstract:
- language: en
  script: Latn
  content: |-
    IEC 62228-5:2021 specifies test and measurement methods for EMC evaluation of Ethernet transceiver ICs under network condition. It defines test configurations, test conditions, test signals, failure criteria, test procedures, test setups and test boards. It is applicable for transceiver of the Ethernet systems<br/>
    100BASE-T1 according to ISO/IEC/IEEE 8802-3/AMD1;<br/>
    100BASE-TX according to ISO/IEC/IEEE 8802-3;<br/>
    1000BASE-T1 according to ISO/IEC/IEEE 8802-3/AMD4<br/>
    and covers<br/>
    the emission of RF disturbances;<br/>
    the immunity against RF disturbances;<br/>
    the immunity against impulses;<br/>
    the immunity against electrostatic discharges (ESD).
- language: fr
  script: Latn
  content: |-
    L’IEC 62228-5:2021 spécifie les méthodes d’essai et de mesure pour l’évaluation de la compatibilité électromagnétique (CEM) des circuits intégrés (CI) émetteurs‑récepteurs Ethernet placés en réseau. Elle définit les configurations d’essai, les conditions d’essai, les signaux d’essai, les critères de défaillance, les procédures d’essai, les montages d’essai et les cartes d’essai. Elle s’applique à l’émetteur-récepteur des systèmes Ethernet:<br/>
    100BASE-T1 conformément à l’ISO/IEC/IEEE 8802-3/AMD1;<br/>
    100BASE-TX conformément à l’ISO/IEC/IEEE 8802-3;<br/>
    1000BASE-T1 conformément à l’ISO/IEC/IEEE 8802-3/AMD4.<br/>
    et couvre:<br/>
    l’émission de perturbations radioélectriques;<br/>
    l’immunité aux perturbations radioélectriques;<br/>
    l’immunité aux impulsions;<br/>
    l’immunité aux décharges électrostatiques (DES).
