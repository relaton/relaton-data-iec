abstract:
- language: en
  script: Latn
  content: Specifies a test to evaluate the effects of a number of successive cycles of engagement and separation of fibre optic connectors or other interconnecting devices on optical performance and mechanical degradation of the component under normal conditions of use.
- language: fr
  script: Latn
  content: Spécifie un essai en vue d'évaluer les effets d'un certain nombre de cycles successifs d'accouplements et de désaccouplemements des connecteurs ou d'autres dispositifs d'interconnexion pour fibres optiques sur une performance optique, et la dégradation mécanique du composant dans des conditions d'utilisation normales.
