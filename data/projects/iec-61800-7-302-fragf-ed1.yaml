abstract:
- language: fr
  script: Latn
  content: 'La CEI 61800-7-302:2007 spécifie les profils dédiés aux entraînements électriques de puissance (PDS) et leur mise en correspondance avec les systèmes de communication existants grâce à un modèle d''interface générique. Il spécifie aussi la mise en correspondance du profil de type 2 (CIP MotionTM) décrit dans la CEI 61800-7-202 avec les différentes technologies de réseau: DeviceNet (CP 2/3), ControlNet (CP 2/1), EtherNet/IP (CP 2/2).'
