abstract:
- language: en
  script: Latn
  content: |-
    IEC TS 62898-3-4:2023 provides technical requirements for the monitoring and control of microgrids. This document applies to non-isolated or isolated microgrids integrated with distributed energy resources. This document describes the specific recommendations for low-voltage (LV) and medium-voltage (MV) microgrids.<br/>
    This document focuses on standardization of the architecture, functions, and operation of microgrid monitoring and control systems (MMCS). It teases out the general functions of MMCS and provides technical requirements for MMCS. This document includes the following aspects of MMCS:<br/>
    • system architecture,<br/>
    • information exchange with other devices/functions in microgrid,<br/>
    • performance requirement,<br/>
    • main function descriptions.
