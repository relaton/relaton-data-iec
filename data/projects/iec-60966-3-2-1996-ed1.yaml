abstract:
- language: en
  script: Latn
  content: Relates to the subfamily of coaxial cables and connector assemblies operating int he frequency range of GSM (0,8 GHz - 1 GHz). Gives subfamily requirements and severities to be applied. Should be used together with IEC 60966-3 and IEC 600966-1.
- language: fr
  script: Latn
  content: Concerne la sous-famille de connecteurs et de câbles assemblés fonctionnant dans les bandes de fréquence du GSM (0,8 GHz - 1 GHz). Donne les exigences et les sévérités à appliquer à la sous-famille. Convient d'utiliser cette spécification particulière conjointement avec la CEI 60966-3 et la CEI 60096-1.
