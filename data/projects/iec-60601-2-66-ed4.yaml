abstract:
- language: en
  script: Latn
  content: |-
    IEC 60601-2-66:2027 applies to the BASIC SAFETY and ESSENTIAL PERFORMANCE of HEARING AIDS and HEARING AID SYSTEMS, hereafter also referred to as ME EQUIPMENT or ME SYSTEM.<br/>
    If a clause or subclause is specifically intended to be applicable to HEARING AIDS only, or to HEARING AID SYSTEMS only, the title and content of that clause or subclause will say so. If that is not the case, the clause or subclause applies both to HEARING AIDS and to HEARING AID SYSTEMS, as relevant.<br/>
    HAZARDS inherent in the intended physiological function of HEARING AIDS or HEARING AID SYSTEMS within the scope of this document are not covered by specific requirements in this document. This document does not specify any acoustical gain or output limits, as these depend on the individual needs of the user, which are determined by THE HEARING AID FITTING PROCESS. The HEARING AID FITTING PROCESS is not within the scope of this document. Requirements or limits related to the BASIC SAFETY of normal-hearing users relate to external references.<br/>
    This document contains criteria for acoustical SAFETY for DIRECT-TO-CONSUMER HEARING AIDS.<br/>
    ACCESSORIES to HEARING AIDS in the HOME HEALTHCARE ENVIRONMENT (e.g. remote control units, audio streamers, battery chargers, power supplies) can be tested according to the applicable standard IEC 62368-1 or other applicable IEC safety standards. Alternatively, IEC 60601-1 may be applied. HEARING AIDS do not have a MAINS PART intended for connection to AC SUPPLY MAINS. The connection to the SUPPLY MAINS of a HEARING AID SYSTEM is covered by power supply, charger or other types of ACCESSORIES.<br/>
    ACCESSORIES with FUNCTIONAL CONNECTION to a HEARING AID can form a HEARING AID SYSTEM. HEARING AID related ACCESSORIES that are not physically connected to the HEARING AID during NORMAL USE are not considered to be APPLIED PART, because they do not directly contribute to the INTENDED USE of the HEARING AID.<br/>
    Wireless programming interfaces are covered by the applicable standard IEC 62368-1 or other applicable IEC safety standards. Alternatively, IEC 60601-1 may be applied.<br/>
    Programming interfaces with wired connection to the HEARING AID are covered by IEC 60601-1.<br/>
    NOTE Detachable parts of HEARING AIDS, even if supplied separately (e.g. ear hooks, domes, wax guards etc.), are not considered as ACCESSORIES, but as component parts.<br/>
    This document does not apply to<br/>
    – cochlear implants or implanted HEARING AIDS,<br/>
    – bone conduction HEARING AIDS,<br/>
    – educational HEARING AIDS (i.e. group HEARING AIDS, auditory trainers etc.),<br/>
    – the application of a HEARING AID for the measurement of hearing levels, where IEC 60645-1 applies,<br/>
    – fixed installation audio-frequency induction-loop systems or their component parts, as described in IEC 60118-4 and IEC 62489-1, and<br/>
    – the sound generating function of a tinnitus masker.<br/>
    This document does not address applicable testing for intentional RF radiation of wireless equipment (e.g. maximum radiated output power, modulation bandwidth).<br/>
    IEC 60601-2-66:2027 cancels and replaces the third edition published in 2019. This edition constitutes a technical revision.<br/>
    This edition includes the following significant technical changes with respect to the previous edition:<br/>
    a) new definitions added;<br/>
    b) requirements to electrical and mechanical safety updated;<br/>
    c) the defined term FITTED OSPL90 is replaced by USE-CONDITION OUTPUT SATURATION LEVEL;<br/>
    d) term USE-CONDITION GAIN80/90 added;<br/>
    e) revision of clauses related to acoustic energy;<br/>
    f) requirements for DIRECT-TO-CONSUMER HEARING AIDS added;<br/>
    g) concept of SOUND DOSE in accordance with IEC 62368-1 as optional safety feature implemented;<br/>
    h) informative annexes added to describe implementation and verification methods of SOUND DOSE.
