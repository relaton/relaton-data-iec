abstract:
- language: en
  script: Latn
  content: |-
    IEC 60335-2-82:2017 deals with the safety of electric commercial amusement machines and personal service machines, their rated voltage being not more than 250 V for single-phase appliances and 480 V for other appliances.<br/>
    Examples of appliances that are within the scope of this standard are amusement machines:<br/>
    - tables;<br/>
    - bowling machines;<br/>
    - dartboards;<br/>
    - driving simulators;<br/>
    - gaming machines;<br/>
    - kiddie rides;<br/>
    - laser shooting appliances;<br/>
    - pinball machines;<br/>
    - video games;<br/>
    - personal service machines;<br/>
    - card re-value machines;<br/>
    - currency dispensers;<br/>
    - luggage lockers;<br/>
    - weighing machines;<br/>
    - shoe shining appliances.<br/>
    As far as is practicable, this standard deals with the common hazards presented by appliances that are encountered by users and maintenance persons.<br/>
    Attention is drawn to the fact that:<br/>
    - for appliances intended to be used in vehicles or on board ships or aircraft, additional requirements may be necessary;<br/>
    - in many countries, additional requirements are specified by the national authorities responsible for health, for the protection of labour and similar authorities.<br/>
    This standard does not apply to:<br/>
    - appliances intended exclusively for household use;<br/>
    - appliances intended exclusively for industrial purposes;<br/>
    - appliances intended to be used in locations where special conditions prevail, such as the presence of a corrosive or explosive atmosphere (dust, vapour or gas);<br/>
    - appliances for washing cars;<br/>
    - dispensing appliances and vending machines (IEC 60335-2-75);<br/>
    - appliances within the scope of IEC 60065, such as jukeboxes and household video games;<br/>
    - appliances within the scope of IEC 60950-1, such as copying machines, ticket machines and automatic teller machines;<br/>
    - appliances intended to be used when a trained attendant is present, such as virtual reality systems;<br/>
    - equipment intended exclusively for fairgrounds, such as carousels;<br/>
    - self-balancing personal transport devices.<br/>
    This third edition cancels and replaces the second edition published in 2002 including its Amendment 1 (2008) and its Amendment 2 (2015). This edition constitutes a technical revision.<br/>
    This edition includes the following significant technical changes with respect to the previous edition:<br/>
    - It is clarified that 22.44 is not applicable to amusement machines;<br/>
    - Modified some Notes to make them normative text (5.6, 11.2, 11.8, 15.2.101, 15.2.102, 15.2.104, 15.3, 19.4, 19.101, 24.101, 24.102).<br/>
    - Reference to 22.106 is made in Annex R.<br/>
    This part 2 is to be used in conjunction with the latest edition of IEC 60335-1 and its amendments. It was established on the basis of the fifth edition (2010) of that standard.<br/>
    This part 2 supplements or modifies the corresponding clauses in IEC 60335-1, so as to convert that publication into the IEC standard: Safety requirements for amusement machines and personal service machines.<br/>
    When a particular subclause of Part 1 is not mentioned in this part 2, that subclause applies as far as is reasonable. When this standard states “addition”, “modification” or “replacement”, the relevant text in Part 1 is to be adapted accordingly.
- language: fr
  script: Latn
  content: |-
    L'IEC 60335-2-82:2017 traite de la sécurité des machines de divertissement électriques et des machines électriques de service pour les personnes, à usage commercial, dont la tension assignée n'est pas supérieure à 250 V pour les appareils monophasés et à 480 V pour les autres appareils.<br/>
    Il est possible de citer, à titre d’exemple d'appareils compris dans le domaine d'application de la présente norme, les machines de divertissement:<br/>
    - tables;<br/>
    - jeux de quilles;<br/>
    - fléchettes;<br/>
    - simulateurs de conduite;<br/>
    - machines de jeu;<br/>
    - animaux ou véhicules animés pour enfants («kiddie rides»);<br/>
    - jeux à laser;<br/>
    - billards électriques;<br/>
    - jeux vidéo;<br/>
    - machines de service pour les personnes;<br/>
    - machines à recharger les cartes;<br/>
    - distributeurs de monnaie;<br/>
    - consignes à bagages;<br/>
    - balances;<br/>
    - appareils à cirer les chaussures.<br/>
    Dans la mesure du possible, la présente norme traite des dangers ordinaires présentés par les appareils, encourus par les utilisateurs et les agents d’entretien.<br/>
    L’attention est attirée sur le fait que:<br/>
    - pour les appareils destinés à être utilisés dans des véhicules ou à bord de navires ou d'avions, des exigences supplémentaires peuvent être nécessaires;<br/>
    - dans de nombreux pays, des exigences supplémentaires sont spécifiées par les organismes nationaux de la santé, par les organismes nationaux responsables de la protection des travailleurs, et par des organismes similaires.<br/>
    La présente norme ne s’applique pas:<br/>
    - aux appareils prévus exclusivement pour des usages domestiques;<br/>
    - aux appareils prévus exclusivement pour des usages industriels;<br/>
    - aux appareils destinés à être utilisés dans des locaux présentant des conditions particulières, telles que la présence d'une atmosphère corrosive ou explosive (poussière, vapeur ou gaz);<br/>
    - aux appareils de lavage des voitures;<br/>
    - aux distributeurs avec ou sans moyen de paiement (IEC 60335-2-75);<br/>
    - aux appareils entrant dans le domaine d'application de l’IEC 60065, tels que juke-boxes et jeux vidéo à usage domestique;<br/>
    - aux appareils entrant dans le domaine d'application de l’IEC 60950, tels que les machines à photocopier, les distributeurs de tickets et les distributeurs de billets;<br/>
    - aux appareils destinés à être utilisés en présence d’un surveillant formé, tels que les systèmes de réalité virtuelle;<br/>
    - aux équipements destinés à être utilisés exclusivement dans des foires, tels que les manèges;<br/>
    - aux dispositifs de transport personnel autoéquilibrés.<br/>
    Cette troisième édition annule et remplace la deuxième édition parue en 2002, son Amendement 1 (2008) et son Amendement 2 (2015). Cette édition constitue une révision technique.<br/>
    Cette édition inclut les modifications techniques majeures suivantes par rapport à l'édition précédente:<br/>
    - Il est précisé que le 22.44 n’est pas applicable aux machines de divertissement;<br/>
    - Modification de certaines notes pour les transformer en texte normatif (5.6, 11.2, 11.8, 15.2.101, 15.2.102, 15.2.104, 15.3, 19.4, 19.101, 24.101, 24.102).<br/>
    - Une référence au 22.106 est faite à l’Annexe R.<br/>
    La présente partie 2 doit être utilisée conjointement avec la dernière édition de l’IEC 60335-1 et ses amendements. Elle a été établie sur la base de la cinquième édition (2010) de cette norme.<br/>
    La présente partie 2 complète ou modifie les articles correspondants de l’IEC 60335-1, de façon à transformer cette publication en norme IEC: Exigences de sécurité pour les machines de divertissement et les machines de service pour les personnes.<br/>
    Lorsqu'un paragraphe particulier de la Partie 1 n'est pas mentionné dans la présente partie 2, ce paragraphe s'applique pour autant qu'il soit raisonnable. Lorsque la présente norme spécifie "addition", "modification" ou "remplacement", le texte correspondant de la Partie 1 doit être adapté en conséquence.
