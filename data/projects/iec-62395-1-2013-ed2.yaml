abstract:
- language: en
  script: Latn
  content: |-
    IEC 62395-1:2013 specifies requirements for electrical resistance trace heating systems and includes general test requirements. This second edition cancels and replaces the previous edition published in 2006 and constitutes a technical revision. This edition includes the following significant technical changes with respect to the previous edition:<br/>
    - Tests have been added for trace heating on sprinkler systems;<br/>
    - The flammability test has been changed to align with the latest draft of future IEC/IEEE 60079-30-1;<br/>
    - A supplementary test has been added for the verification of sheath temperature using trace heating mounted on a plate fixture.
- language: fr
  script: Latn
  content: |-
    La CEI 62395-1:2013 spécifie les exigences relatives aux systèmes de traçage par résistance électrique et comprend les exigences générales d'essai. Cette deuxième édition annule et remplace l'édition précédente publiée en 2006 et constitue une révision technique. Cette édition inclut les modifications techniques majeures suivantes par rapport à l'édition précédente:<br/>
    - Ajout d'essais pour le traçage sur les installations d'arrosage;<br/>
    - Modification de l'essai d'inflammabilité en vue d'une adaptation à la dernière version de la future norme CEI/IEEE 60079-30-1;<br/>
    - Ajout d'un essai supplémentaire permettant de vérifier la température de gaine à l'aide d'un système de traçage monté sur une plaque de fixation.
