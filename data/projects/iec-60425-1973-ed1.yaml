abstract:
- language: en
  script: Latn
  content: Gives a guide dealing with colours to be used for coding and identification of capacitors and resistors for use in electronic equipment. This guide reduces errors or misunderstandings which may result from improper selection or interpretation of colours.
- language: fr
  script: Latn
  content: Donne un guide traitant des couleurs à utiliser pour la codification et l'identification des condensateurs et des résistances destinés aux équipements électroniques. Ce guide réduit les erreurs ou les malentendus qui peuvent résulter d'un choix impropre ou d'une fausse interprétation des couleurs.
