abstract:
- language: en
  script: Latn
  content: |-
    IEC 60364-7-753:2014 applies to embedded electric heating systems for surface heating. It also applies to electric heating systems for de-icing or frost prevention or similar applications. Both indoor and outdoor systems are covered. Heating systems for industrial and commercial applications complying with relevant parts of IEC 60519, IEC 62395 and IEC 60079 are not covered. This second edition cancels and replaces the first edition published in 2005 and constitutes a technical revision. This edition includes the following significant technical changes with respect to the previous edition:<br/>
    - the title has been changed from "Floor and ceiling heating systems" to "Heating cables and embedded heating systems" to align with the revised scope;<br/>
    - the scope has been extended and now covers embedded electric heating systems for surface heating, also electric heating systems for de-icing or frost prevention or similar applications, and covers both indoor and outdoor systems. This includes heating systems for: walls, ceiling, floors, roofs, drainpipes, gutters, pipes, stairs, roadways, non-hardened compacted areas (e.g. football fields, lawns);<br/>
    - for wall heating systems, this standard contains additional requirements (e.g. metal sheath/enclosure/grid) to protect against the effects of overheating caused by a short-circuit between live conductors due to penetration of an embedded heating unit;<br/>
    - from heating units delivered from the manufacturer without exposed-conductive-parts, this standard requires a metallic mesh grid covering. This has been reduced to 3 mm for wall heating systems;<br/>
    - this standard now requires that electric heating systems shall be selected and erected so as to avoid any harmful influence between the heating system and any electrical or non-electrical installations envisaged;<br/>
    - and this standard covers surface temperatures and now refers the reader to the appropriate IEC guide.
- language: fr
  script: Latn
  content: |-
    L'IEC 60364-7-753:2014 s'applique aux systèmes de chauffage électriques intégrés pour le chauffage de surface. Elle s'applique aussi aux systèmes de chauffage électriques pour le dégivrage ou la prévention du gel ou pour des applications analogues. Les systèmes tant intérieurs qu'extérieurs sont couverts. Les systèmes de chauffage pour les applications industrielles et commerciales conformes aux parties applicables des normes IEC 60519, IEC 62395 et IEC 60079 ne sont pas couverts. Cette deuxième édition annule et remplace la première édition parue en 2005 et constitue une révision technique. Cette édition inclut les modifications techniques majeures suivantes par rapport à l'édition précédente:<br/>
    - le titre a été modifié de "Systèmes de chauffage par sol ou plafond" en "Câbles chauffants et systèmes de chauffage intégrés" pour être en cohérence avec le nouveau domaine d'application;<br/>
    - le domaine d'application a été étendu et couvre maintenant les systèmes de chauffage électrique intégrés pour le chauffage de surfaces, les systèmes de chauffage électrique pour le dégivrage ou la prévention du gel ou des applications similaires, et couvre à la fois les systèmes intérieurs et extérieurs. Ceci inclut les systèmes pour: murs, plafonds, sols, toits, tuyaux d'évacuation, gouttières, tuyaux, escaliers, chaussées, zones compactées meubles (par exemple terrains de football, pelouses);<br/>
    - pour les systèmes de chauffage installés dans les murs, la présente norme contient des exigences supplémentaires (par exemple gaine/enveloppe/grillage métallique) pour la protection contre les échauffements dus à un court-circuit entre conducteurs actifs pénétrant dans l'unité de chauffage intégré;<br/>
    - pour les unités de chauffage fournies par le constructeur sans masse, la présente norme exige un recouvrement par un grillage métallique. Celui-ci a été réduit à 3 mm pour les systèmes de chauffage installés dans les murs;<br/>
    - la présente norme exige maintenant que les systèmes de chauffage électrique soient choisis et mis en oeuvre de manière à éviter toute influence dommageable entre le système de chauffage et toute installation électrique ou non-électrique prévue;<br/>
    - et la présente norme traite des températures de surface et renvoie maintenant le lecteur au guide approprié de l'IEC.
