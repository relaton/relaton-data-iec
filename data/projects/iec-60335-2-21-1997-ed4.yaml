abstract:
- language: en
  script: Latn
  content: Applies to stationary non instantaneous storage water heaters intended for heating water to a temperature below its boiling point, their rated voltage being not more than 250 V for single-phase appliances and 480 V for other appliances.
- language: fr
  script: Latn
  content: S'applique aux chauffe-eau à accumulation fixes non instantanés destinés à chauffer l'eau à une température inférieure à celle de l'ébullition, dont la tension assignée n'est pas supérieure à 250 V pour les appareils monophasés et à 480 V pour les autres appareils.
