abstract:
- language: en
  script: Latn
  content: |-
    IEC 63535:2026 specifies radiation safety requirements for germicidal ultraviolet (GUV) luminaires, incorporating ultraviolet (UV) sources, and systems comprising GUV luminaires, which intentionally emit UV radiation between 180 nm and 400 nm into the surroundings.<br/>
    This document also addresses precautions regarding radiation‑induced ozone.<br/>
    This document does not cover other product safety aspects.<br/>
    This document is applicable to GUV luminaires used for whole-room GUV disinfection in both occupiable and unoccupied spaces.
