abstract:
- language: en
  script: Latn
  content: |-
    Provides general information on scope and presentation of IEC 60747
    and 60748.
    Provides information on the general principles or requirements
    applicable to IEC 60747-2, 60747-3, etc., including terminology and
    letter symbols, essential ratings and characteristics, methods of
    measurement, acceptance and reliability for the various categories
    or sub-categories of discrete devices.
- language: fr
  script: Latn
  content: |-
    Donne des informations générales sur le domaine d'application et la
    présentation des CEI 60747 et 60748.
    Donne des informations sur les principes généraux ou les exigences
    générales applicables aux CEI 60747-2, 60747-3, etc., contenant la
    terminologie et les symboles littéraux, les valeurs limites et les
    caractéristiques essentielles, les méthodes de mesure, la réception
    et la fiabilité pour les diverses catégories ou sous-catégories de
    dispositifs discrets.
