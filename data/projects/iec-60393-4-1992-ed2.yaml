abstract:
- language: en
  script: Latn
  content: Prescribes standard ratings and characteristics, selects from IEC 393-1 the appropriate methods of test and gives general performance requirements for this type of potentiometer. Relates only to single-turn rotary type of power potentiometers with a rated power dissipation normally greater than or equal to 10 W.
- language: fr
  script: Latn
  content: S'applique aux potentiomètres de puissance rotatifs du type à un seul tour, de dissipation nominale normalement supérieure ou égale à 10 W. Prescrit les valeurs normales et les caractéristiques, oriente le choix des méthodes d'essai appropriées à partir de la CEI 393-1 et fixe les exigences générales pour ce type de potentiomètres.
