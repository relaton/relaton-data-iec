abstract:
- language: en
  script: Latn
  content: |-
    IEC TS 62565-5-3:2025 which is a Technical Specification, establishes a standardized method to determine a blank detail specification (BDS) for<br/>
    ‭• silicon nanosized materials<br/>
    used for<br/>
    ‭• negative electrode of lithium-ion batteries.<br/>
    This document is intended to be used for silicon nanosized materials for the negative electrode of lithium-ion batteries which have been widely employed in the fields of<br/>
    - portable devices,<br/>
    - power tools,<br/>
    - electric vehicles, and<br/>
    - energy storage system.<br/>
    Numeric values for the key control characteristics are left blank as they will be specified between customer and supplier in the detail specification (DS). In the DS key control characteristics can be added or removed if agreed between customer and supplier.
