abstract:
- language: fr
  script: Latn
  content: |-
    La CEI 60763-2:2007 expose les méthodes d'essai applicables aux matériaux classés dans la CEI 60763-1. La présente édition comporte les modifications techniques significatives suivantes par rapport à l'édition précédente:<br/>
    D'une manière générale, la norme a été révisée et mise en conformité avec la CEI 60641 2;<br/>
    La méthode d'essai permettant de déterminer la résistance à la traction des couches internes a été remplacée par une autre méthode;<br/>
    Le domaine d'application de la méthode d'essai permettant de déterminer la résistance thermique a été élargi.
