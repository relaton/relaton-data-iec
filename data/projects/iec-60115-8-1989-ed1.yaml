abstract:
- language: en
  script: Latn
  content: |-
    Applicable to fixed chip resistors for use in electronic equipment.
    Prescribes preferred ratings and characteristics and selects the
    appropriate Quality Assessment procedures, tests and measuring
    methods and gives general performance requirements for this type of
    resistor.
- language: fr
  script: Latn
  content: |-
    Applicable aux résistances fixes chipses destinées aux équipements
    électroniques. Prescrit les valeurs préférentielles des
    caractéristiques, choisit les procédures d'assurance de la qualité
    et les méthodes d'essai et de mesure appropriées et fixe les
    exigences générales pour ce type de résistances.
