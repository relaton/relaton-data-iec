abstract:
- language: fr
  script: Latn
  content: |-
    La CEI 61300-2-21:2009 détermine la résistance des dispositifs à fibres optiques aux effets de détérioration dus aux conditions de température élevée, d'humidité et de froid. Elle est destinée à révéler les défauts d'un dispositif en essai provoqués par sa respiration, par opposition à la notion d'absorption d'humidité. Cet essai couvre l'effet de la congélation de l'eau piégée dans des craquelures et des fissures aussi bien que celui de la condensation. Cependant, le niveau de condensation varie selon les dimensions et la masse thermique du dispositif en essai. Les changements par rapport à l'édition précédente sont les suivants:<br/>
    - la reconsidération de toutes les parties de la norme;<br/>
    - la description de l'appareillage et des procédures avec plus de détails;<br/>
    - la définition avec précision du nombre de 24 cycles dans la sévérité.
