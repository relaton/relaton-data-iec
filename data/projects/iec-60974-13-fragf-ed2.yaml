abstract:
- language: en
  script: Latn
  content: |-
    <!-- NEW! -->IEC 60974-13:2021 is available as IEC 60974-13:2021 RLV which contains the International Standard and its Redline version, showing all changes of the technical content compared to the previous edition.
    <p>IEC 60974-13:2021 is applicable to welding current return clamps for arc welding processes, designed to make an electrical connection to the workpiece without using tools. This document is not applicable to welding current return clamps for underwater welding and plasma cutting.<br/>
    This document specifies safety and performance requirements of welding current return clamps. This document does not specify requirements for welding cables. This second edition cancels and replaces the first edition, published in 2011, and constitutes a technical revision.<br/>
    The significant technical changes with respect to the previous edition are the following:<br/>
    - Modified the title from "Welding clamp" to "Welding current return clamp" and updated the term through the document.<br/>
    - Updated all values of test current in Table 1 corrected to 40 °C.<br/>
    - Updated the reference to EN 50565-1:2014, Electric cables - Guide to use for cables with a rated voltage not exceeding 450/750 V (U0/U) – Part 1: General guidance<br/>
    This part of IEC 60974 is to be used in conjunction with IEC 60974-1.</p>
- language: fr
  script: Latn
  content: |-
    <!-- NEW! -->IEC 60974-13:2021 est disponible sous forme de IEC 60974-13:2021 RLV qui contient la Norme internationale et sa version Redline, illustrant les modifications du contenu technique depuis l'édition précédente.<br/>
    <br/>
    L’IEC 60974-13:2021 s’applique aux connecteurs de pièce pour les procédés de soudage à l’arc, conçus pour les relier électriquement à la pièce mise en œuvre sans l'aide d'outils.<br/>
    Le présent document ne s’applique pas aux connecteurs de pièce pour le soudage sous-marin et le coupage par plasma.<br/>
    Le présent document spécifie les exigences de sécurité et de performance des connecteurs de pièce.<br/>
    Le présent document ne spécifie pas les exigences pour les câbles de soudage.<br/>
    Cette deuxième édition annule et remplace la première édition parue en 2011, et constitue une révision technique.<br/>
    Les modifications techniques majeures par rapport à l'édition précédente sont les suivantes:

    	Modification du titre existant "pince de retour de courant" en "connecteur de pièce", et mise à jour des termes dans l’ensemble du document.
    	Mise à jour de toutes les valeurs du courant d’essai dans le Tableau 1, corrigées pour une température de 40 °C.
    	Mise à jour de la référence à l’EN 50565-1:2014, <em>Câbles électriques – Guide d'emploi des câbles avec une tension assignée n'excédant pas 450/750 V (U0/U) – Partie 1:</em> <em>Lignes directrices</em>

    La présente partie de l’IEC 60974 doit être utilisée conjointement avec l’IEC 60974-1.<br/>
    La présente version bilingue (2021-11) correspond à la version anglaise monolingue publiée en 2021-04.<br/>
    La version française de cette norme n'a pas été soumise au vote.
     
