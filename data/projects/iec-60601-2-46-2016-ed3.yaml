abstract:
- language: en
  script: Latn
  content: IEC 60601-2-46:2016 specifies safety requirements for operating tables, whether or not having electrical parts, including transporters, used for the transportation of the operating table top to or from the base or pedestal of an operating table with detachable operating table top. This third edition cancels and replaces the second edition published in 2010 and constitutes a technical revision. This edition of IEC 60601-2-46 was revised to align structurally with the 2005 edition of IEC 60601-1 and with IEC 60601-1:2005/AMD1:2012.
- language: fr
  script: Latn
  content: L'IEC 60601-2-46:2016 spécifie les exigences de sécurité applicables aux tables d'opération, que celles-ci comportent ou non des parties électriques, y compris les chariots de transfert, utilisés pour le transport du plateau de la table d'opération vers ou depuis la base ou le socle d'une table d'opération à plateau mobile. Cette troisième édition annule et remplace la deuxième édition parue en 2010. Cette édition constitue une révision technique. La présente édition de l'IEC 60601-2-46 a été révisée de façon à s'aligner sur la structure de l'édition 2005 de l'IEC 60601-1 et de l'IEC 60601-1:2005/AMD1:2012.
