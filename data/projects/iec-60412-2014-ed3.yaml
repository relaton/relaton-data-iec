abstract:
- language: en
  script: Latn
  content: |-
    IEC 60412:2014 gives guidelines for scintillation detectors and scintillators nomenclature (identification) and standard dimensions of scintillators. This International Standard is applicable to all types of solid organic and inorganic scintillators used in detectors for scintillation counting and spectrometry. The object of this standard is to define a standardized nomenclature for scintillation detectors in which most of the properties can be found. The object of this standard is also to standardize the dimensions of bare scintillators in order to facilitate interchangeability of non-encapsulated scintillators and to facilitate intercomparisons of measurements with encapsulated scintillators. The main technical changes with regard to the previous edition are as follows:<br/>
    - nomenclature of scintillation detectors was expanded by phoswich detector and single-line multi-channel detector;<br/>
    - some missing positions in the nomenclature of the previous edition were filled out.
- language: fr
  script: Latn
  content: |-
    L'IEC 60412:2014 donne des lignes directrices pour la nomenclature des détecteurs à scintillation et des scintillateurs (identification) et pour les dimensions normalisées des scintillateurs. La présente Norme internationale est applicable à tous les types de scintillateurs organiques et inorganiques solides utilisés dans les détecteurs pour le comptage par scintillation et en spectrométrie. L'objet de la présente norme est de définir une nomenclature normalisée pour les détecteurs à scintillation dans laquelle la plupart des propriétés du détecteur peuvent être trouvées. L'objet de la présente norme est aussi de normaliser les dimensions des scintillateurs nus afin de faciliter l'interchangeabilité des scintillateurs sans boîtier et de faciliter la comparaison des mesures effectuées avec les scintillateurs avec boîtier. Les principales modifications techniques par rapport à l'édition précédente sont les suivantes:<br/>
    - la nomenclature des détecteurs à scintillation a été complétée par le module de détection phoswich et par le détecteur multicanal unifilaire;<br/>
    - certaines positions manquantes de la nomenclature de l'édition précédente ont été complétées.
