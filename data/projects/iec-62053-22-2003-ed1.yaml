abstract:
- language: en
  script: Latn
  content: |-
    Applies only to newly manufactured static watt-hour meters of
    accuracy classes 0,2 S and 0,5 S, for the measurement of alternating current electrical active energy in 50 Hz or 60 Hz networks and it applies to their type tests only.
    <br /><br />This publication is of high relevance for Smart Grid</a>.
