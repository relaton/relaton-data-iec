abstract:
- language: en
  script: Latn
  content: |-
    This part of 81346 International Standard, published jointly by IEC and ISO, provides, in combination with IEC 81346-1 and IEC 81346-2, rules and recommendations on the structuring of systems and the information on systems of vehicle systems. It also provides additional classification schemes to those of IEC 81346-2 for use in reference designations within vehicle systems.<br/>
    The structuring principles and the classes of objects are intended to provide a clear identification and localization of the objects, and for use in their labelling in the vehicle, for their designation in technical documents and for the designation of the technical documents as well
