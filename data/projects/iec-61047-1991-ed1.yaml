abstract:
- language: en
  script: Latn
  content: Specifies performance requirements for electronic step-down convertors for use on d.c. supplies up to 250 V and a.c. supplies up to 1 000 V at 50 Hz or 60 Hz with operating frequencies deviating from the supply frequency, associated with tungsten halogen lamps (as specified in IEC 60357) and other filament lamps.
- language: fr
  script: Latn
  content: Spécifie les prescriptions de performances pour les convertisseurs abaisseurs électroniques pour les alimentations en courant continu jusqu'à 250 V et les alimentations en courant alternatif jusqu'à 1 000 V, à 50 Hz ou 60 Hz fonctionnant à des fréquences différentes de la fréquence d'alimentation, associés avec des lampes à incandescence aux halogènes comme spécifié dans la CEI 60357.
