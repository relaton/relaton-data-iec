abstract:
- language: en
  script: Latn
  content: |-
    IEC TS 60904-13:2018(E) specifies methods to:

    	capture electroluminescence images of photovoltaic modules,
    	process images to obtain metrics about the images taken in quantitative terms, and
    	provide guidance to qualitatively interpret the images for features in the image that are observed.

    This document is applicable to PV modules measured with a power supply that places the cells in the modules in forward bias.
