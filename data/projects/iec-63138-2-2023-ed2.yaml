abstract:
- language: en
  script: Latn
  content: IEC 63138-2:2023, which is a sectional specification (SS), provides information and rules for the preparation of detail specifications (DS) for MQ4 series circular connectors with four RF channels, as well as a detailed specification of the blank format. An MQ4 series circular connector with 50 Ω nominal impedance has four RF channels which can be engaged and disengaged at the same time. There are two versions of plug connectors, one is a quick-lock version, and the other is a threaded version. The socket connector provides two coupling mechanisms, a quick-lock and a threaded coupling. MQ4 series circular connectors can be used in mobile communication systems and in other communication equipment. This document also specifies the mating face dimensions and gauging information of MQ4 series circular connectors, and tests selected from IEC 63138-1, applicable to all detail specifications relating to MQ4 series circular connectors.
- language: fr
  script: Latn
  content: 'L’IEC 63138:2023, qui est une spécification intermédiaire (SI), fournit des informations et des règles pour l’établissement de spécifications particulières (SP) relatives aux connecteurs circulaires de série MQ4 disposant de quatre canaux RF, ainsi qu’une spécification particulière-cadre. Un connecteur circulaire de série MQ4 présentant une impédance nominale de 50 Ω dispose de quatre canaux RF pouvant être accouplés et désaccouplés en même temps. Il existe deux versions de fiches mâles: une première version à verrouillage rapide et une seconde version à verrouillage par vis. La prise femelle offre deux mécanismes d’accouplement: un couplage par verrouillage rapide et un couplage par verrouillage par vis. Les connecteurs circulaires de série MQ4 peuvent être utilisés au sein de systèmes de communication mobiles ainsi que dans d’autres équipements de communication.Le présent document spécifie également les dimensions de l’interface d’accouplement et les informations sur le calibre des connecteurs circulaires de série MQ4, ainsi que les essais choisis à partir de l’IEC 63138-1, applicables à toutes les spécifications particulières relatives aux connecteurs circulaires de série MQ4.'
