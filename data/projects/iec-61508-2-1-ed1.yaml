abstract:
- language: en
  script: Latn
  content: |-
    IEC 61508-2-1:2026 outlines the requirements for the development and integration of semiconductors according to IEC 61508-1, IEC 61508-2 and IEC 61508-3. Additionally, this part outlines requirements for the integration of semiconductors not developed in accordance with the IEC 61508 series.<br/>
    In particular, this document outlines requirements and recommendations for<br/>
    - processes and methods for the development of semiconductors for single-channel and multi-channel applications;<br/>
    - processes for the development of software test libraries for use in semiconductors developed to this part;<br/>
    - processes and methods for development of soft-IP (circuits to be used in another design) used by developers of semiconductors;<br/>
    - the expectations of deliverables by the semiconductors developers to the system integrators including use-case constraints;<br/>
    - a roadmap for semiconductor developers and system integrators.<br/>
    This document does not apply to simple semiconductor devices such as MOSFETS, transistors or diodes where all the failure modes are easily recognized and known.
