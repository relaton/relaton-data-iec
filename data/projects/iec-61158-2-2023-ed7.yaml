abstract:
- language: en
  script: Latn
  content: IEC 61158-2:2023 is one of a series produced to facilitate the interconnection of automation system components. It is related to other standards in the set as defined by the "three-layer" fieldbus reference model described in IEC 61158‑1.
- language: fr
  script: Latn
  content: L'IEC 61158-2:2023 constitue une partie d'une série produite pour faciliter l'interconnexion de composants d'un système d'automation. Elle est liée à d'autres normes de la série telle qu'elle est définie par le modèle de référence des bus de terrain "à trois couches" décrit dans le rapport IEC 61158‑1.
