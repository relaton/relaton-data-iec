abstract:
- language: en
  script: Latn
  content: Describes a mechanical coupler for the measurement of the output force of bone vibrators. The mechanical impedance of the coupler is specified in the frequency range 125 Hz to 8 000 Hz. The coupler is intended for calibration of audiometers using bone vibrators having a plane circular tip area of 175 mm² ± 25 mm² and for determining the performance of bone conduction hearing aids. The vibratory force developed by a bone vibrator is not, in general, the same on the coupler as on a person's mastoid. However, the IEC recommends its use as a means for the calibration of specified vibrators used in audiometry and for the exchange of specifications and of data on bone conduction hearing aids. This standard cancels and replaces IEC 60373 published in 1990. This first edition constitutes a technical revision.
- language: fr
  script: Latn
  content: Décrit un coupleur mécanique destiné à la mesure de la force de sortie des ossivibrateurs. L'impédance mécanique du coupleur est spécifiée dans la gamme de fréquences comprise entre 125 Hz et 8 000 Hz. Le coupleur est destiné à l'étalonnage des audiomètres utilisant les ossivibrateurs dont l'extrémité présente une surface plane et circulaire de 175 mm2 ± 25 mm2 et à la détermination de la performance des appareils de correction auditive à conduction osseuse. La force vibratoire développée par un ossivibrateur n'est pas, en général, la même sur le coupleur que sur la mastoïde d'une personne. Cependant, la CEI recommande son utilisation comme moyen d'étalonnage des vibrateurs spécifiés, utilisés en audiométrie et pour l'échange des spécifications et des données sur les appareils de correction auditive à conduction osseuse. La présente norme annule et remplace la CEI 60373 parue en 1990. Cette première édition constitue une révision technique.
