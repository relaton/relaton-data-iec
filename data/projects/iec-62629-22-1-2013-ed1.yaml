abstract:
- language: en
  script: Latn
  content: IEC 62629-22-1:2013 specifies optical measuring methods for autostereoscopic display devices. It defines general measuring procedures for optical characteristics of two-view and multi-view displays and integral imaging displays.
- language: fr
  script: Latn
  content: La CEI 62629-22-1:2013 spécifie les méthodes de mesure optique des dispositifs d'affichage autostéréoscopiques. Elle définit les procédures générales de mesure des caractéristiques optiques des écrans à deux fenêtres, multifenêtre et d'imagerie intégrale.
