abstract:
- language: en
  script: Latn
  content: |-
    IEC 61978-1:2014 applies to fibre optic passive chromatic dispersion compensators, all exhibiting the following features:<br/>
    - they are optically passive;<br/>
    - they have an optical input and an optical output for transmitting optical power;<br/>
    - the ports are optical fibres or optical fibre connectors;<br/>
    - they are wavelength sensitive;<br/>
    - they may be polarization sensitive. This standard establishes uniform requirements for the passive chromatic dispersion compensator. This third edition cancels and replaces the second edition, published in 2009, and constitutes a technical revision. This edition includes the following significant technical changes with respect to the previous edition:<br/>
    - introduction of new terms and definitions;<br/>
    - revision of classifications;<br/>
    - addition of Annex E. Keywords: fibre optic passive chromatic dispersion compensators
- language: fr
  script: Latn
  content: |-
    IEC 61978-1:2014 s'applique aux compensateurs de dispersion chromatique passifs à fibres optiques présentant les caractéristiques suivantes:<br/>
    - ils sont passifs au niveau optique;<br/>
    - ils possèdent une entrée optique et une sortie optique pour la transmission de la puissance optique;<br/>
    - les ports sont des fibres optiques ou des connecteurs de fibres optiques;<br/>
    - ils sont sensibles aux longueurs d'onde;<br/>
    - ils peuvent être sensibles à la polarisation. La présente norme établit des exigences uniformes pour les compensateurs de dispersion chromatique passifs. La présente troisième édition annule et remplace la deuxième édition publiée en 2009, dont elle constitue une révision technique. Cette édition inclut les modifications techniques majeures suivantes par rapport à l'édition précédente:<br/>
    - introduction de nouveaux termes et définitions;<br/>
    - révision des classifications;<br/>
    - ajout de l'Annexe E. Mots clés: compensateurs de dispersion chromatique passifs à fibres optiques
