abstract:
- language: en
  script: Latn
  content: |-
    Contains the specific requirements for construction and assessment of intrinsically safe electrical systems, type of protection "i", intended for use, as a whole or in part, in explosive atmospheres in Group II locations. Intended for use by the designer of the system who may be a manufacturer, a specialist consultant or a member of the end-user's staff.<br/>
    The contents of the Interpretation Sheet 1 of May 2023 have been included in this copy.
- language: fr
  script: Latn
  content: Contient les règles spécifiques de construction et d'évaluation des systèmes électriques de sécurité intrinsèque, de mode de protection «i», destinés à être utilisés, en tout ou en partie, dans des atmosphères explosives du Groupe II. Destinée à être utilisée par le concepteur du système qui peut être un constructeur, un consultant spécialisé ou un membre du personnel de l'utilisateur final.
