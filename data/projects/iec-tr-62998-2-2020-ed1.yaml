abstract:
- language: en
  script: Latn
  content: |-
    IEC TR 62998-2:2020 establishes guidance for the application of IEC TS 62998-1:2019.<br/>
    It provides examples of:<br/>
    – application for which SRS/SRSS are relevant,<br/>
    – use of SRS/SRSS information from an application point of view,<br/>
    – fusion of SRS into SRSS for given applications, and<br/>
    – appropriate information for use for given applications.
