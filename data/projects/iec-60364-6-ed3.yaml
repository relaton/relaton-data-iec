abstract:
- language: en
  script: Latn
  content: |-
    IEC 60364-6:2026 (E) provides requirements for initial verification, by inspection and testing, of an electrical installation to determine, as far as reasonably practicable, whether the requirements of IEC 60364-1, IEC 60364-4, IEC 60364-5 and IEC 60364-8 have been met, and requirements for the reporting of the results of the initial verification. The initial verification takes place upon the completion of a new electrical installation or completion of an addition or an alteration to an existing electrical installation.<br/>
    This document provides requirements for periodic verification of an electrical installation to determine, as far as reasonably practicable, whether the electrical installation and all its constituent equipment are in a satisfactory condition for continued use and requirements for the reporting of the results of the periodic verification.<br/>
    <br/>
    This third edition cancels and replaces the second edition published in 2016. This edition constitutes a technical revision. <br/>
    This edition includes the following significant technical changes with respect to the previous edition:<br/>
    a)    Annex E: New model forms for reporting.<br/>
    b)    Annex F: New model schedules of inspections.<br/>
    c)    Annex G: New schedule of circuit details and schedule of test results.<br/>
    d)    Annex H: New table giving example recommendations for carrying out first periodic verification. <br/>
    e)    Annex I: Periodic verification of an electrical installation in dwellings.<br/>
    f)    Annex J: Listing of notes concerning some countries.
