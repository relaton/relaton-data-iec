abstract:
- language: fr
  script: Latn
  content: |-
    La CEI 60793-2-30:2012 est applicable aux sous-catégories A3a, A3b, A3c, A3d et A3e. Trois types d'exigences s'appliquent à ces fibres:<br/>
    - les exigences générales, comme définies dans la CEI 60793-2;<br/>
    - des exigences spécifiques communes aux fibres multimodales de catégorie A3, couvertes par la présente norme, et qui sont données dans l'Article 3;<br/>
    - des exigences particulières applicables à des sous-catégories particulières ou à des applications spécifiques (comme des applications automobiles ou industrielles), qui sont définies dans les annexes normatives relatives aux sous-catégories. Cette troisième édition annule et remplace la deuxième édition publiée en 2007. Elle constitue une révision technique La présente édition contient les modifications techniques significatives suivantes par rapport à l'édition précédente:<br/>
    - l'ajout d'une nouvelle sous-catégorie A3e;<br/>
    - modification d'unité concernant l'erreur de concentricité entre le coeur et la gaine et le niveau de contrainte d'essai.
    Mots clés: multimodales de catégorie A3, sous-catégories A3a, A3b, A3c, A3d et A3e
