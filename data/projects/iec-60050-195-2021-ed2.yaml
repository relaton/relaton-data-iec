  content: IEC 60050-195:2020 donne les termes et définitions fondamentaux relatifs à la mise à la terre et à la protection contre les chocs électriques. Cette nouvelle édition révise et complète la précédente. Elle a le statut de publication horizontale conformément au Guide IEC 108. Cette terminologie est en accord avec la terminologie figurant dans les autres parties spécialisées de l'IEV.
