- language: en
  script: Latn
  content: IEC 60050-195:2020 gives the fundamental terms and definitions concerning earthing and protection against electric shock. This new edition reviews and complements the previous one. It has the status of a horizontal publication in accordance with IEC Guide 108. This terminology is consistent with the terminology developed in the other specialized parts of the IEV.
