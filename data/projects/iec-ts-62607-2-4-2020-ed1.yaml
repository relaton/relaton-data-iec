abstract:
- language: en
  script: Latn
  content: |-
    IEC TS 62607-2-4:2020 specifies the test method for determining the resistivity and the contact resistance of an individual CNT and the dependability of the measurement.<br/>
    This document includes:<br/>
    – outlines of the experimental procedures used to measure resistance of carbon nanotubes,<br/>
    – methods of interpretation of results and discussion of data analysis, and<br/>
    – case studies.
