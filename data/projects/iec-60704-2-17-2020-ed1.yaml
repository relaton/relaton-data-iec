abstract:
- language: en
  script: Latn
  content: |-
    IEC 60704-2-17:2020 describes the determination of the noise emission of dry-cleaning robots under normal operating conditions on carpet and hard floors.<br/>
    This document applies to electrical dry-cleaning robots (including their accessories and their component parts) for household use or under conditions similar to those in households.<br/>
    This document applies to electrical dry-cleaning robots operating in dry conditions only. Some additions and modifications for dry-cleaning robots operating in wet conditions are under consideration.<br/>
    This document does not apply to dry-cleaning robots for industrial or professional purposes.<br/>
    This document does not apply to<br/>
    – manually operated vacuum cleaners, and<br/>
    – dry-cleaning robots for outdoor use.<br/>
    This Part 2-17 is intended to be used in conjunction with IEC 60704-1:2010. The relevant text of IEC 60704-1:2010 as amended by this publication establishes the test code for dry-cleaning robots.
- language: fr
  script: Latn
  content: |-
    L'IEC 60704-2-17:2020 décrit le code d'essai pour la détermination du bruit aérien des robots de nettoyage à sec électriques destinés à un usage domestique ou dans des conditions analogues à celles des foyers domestiques.<br/>
    Cette partie de l'IEC 60704-2 s'applique aux robots de nettoyage à sec électriques fonctionnant sur sol sec uniquement.<br/>
    Des additions et modifications sont à l'étude pour les robots de nettoyage à sec fonctionnant sur sol humide.<br/>
    Cette partie de l'IEC 60704-2 ne s'applique pas aux robots de nettoyage à sec destinés à des usages industriels ou professionnels.<br/>
    Le présent document ne s'applique pas:<br/>
    – aux aspirateurs à commande manuelle; ni<br/>
    – aux robots de nettoyage à sec pour une utilisation en extérieur.<br/>
    La présente Partie 2-17 est destinée à être utilisée conjointement avec l'IEC 60704-1:2010. Le texte correspondant de l'IEC 60704-1:2010 modifié par la présente publication établit le code d'essai pour les robots de nettoyage à sec.
