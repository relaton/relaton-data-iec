abstract:
- language: en
  script: Latn
  content: |-
    IEC TS 62933-2-2:2022(E) defines testing methods and duty cycles to validate the EES system’s technical specification for the manufacturers, designers, operators, utilities and owners of the EES systems which evaluate the performance of the EES systems for various applications. The following items are covered in this document. The energy storage devices and technologies are outside the scope of this document:<br/>
    application;<br/>
    performance testing methods;<br/>
    duty cycles for specific application.
