abstract:
- language: en
  script: Latn
  content: |-
    IEC 62863:2017 applies to reciprocating electric hair clippers or trimmers for household use.<br/>
    This document deals with the methods of measuring performances of electric hair clippers or trimmers for household use with a rated voltage not greater than 250 V.<br/>
    This document does not specify safety or performance requirements.<br/>
    This document does not apply to professional hair clippers or trimmers, animal shearers and animal clippers, or shavers. For shavers, refer to IEC 61254.<br/>
    This document does not cover safety requirements (see IEC 60335-2-8).
- language: fr
  script: Latn
  content: |-
    L'IEC 62863:2017 s’applique aux tondeuses ou tondeuses de finition électriques à mouvement alternatif pour usage domestique.<br/>
    Le présent document traite des méthodes de mesure de l'aptitude à la fonction des tondeuses ou tondeuses de finition électriques pour usage domestique, dont la tension assignée ne dépasse pas 250 V.<br/>
    Le présent document ne spécifie pas les exigences de sécurité ou d'aptitude à la fonction.<br/>
    Le présent document ne s’applique pas aux tondeuses ou tondeuses de finition professionnelles, aux tondeuses pour bétail et aux tondeuses pour animaux domestiques, ni aux rasoirs. Pour les rasoirs, se référer à l’IEC 61254.<br/>
    Le présent document ne couvre pas les exigences de sécurité (voir IEC 60335-2-8).
