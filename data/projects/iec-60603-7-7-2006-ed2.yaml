abstract:
- language: en
  script: Latn
  content: Covers 8 way connectors, up to 4 pairs, and specifies mechanical and environmental requirements, and electrical transmission requirements for frequencies up to 600 MHz. These connectors are typically used as category 7 connectors in class F cabling systems specified in IS0/IEC 11801. They are intermateable, interoperable and backward compatible with IEC 60603-7-X series connectors.
