abstract:
- language: fr
  script: Latn
  content: La CEI 61340-4-9:2010 donne des méthodes d'essai spécifiques pour l'évaluation de la résistance électrique des vêtements antistatiques. Cette partie définit les méthodes d'essai pour déterminer la résistance électrique manche à manche et point à point des vêtements antistatiques. Les méthodes d'essai définies dans la présente norme utilisent des instruments normalisés pour la mesure de la résistance des vêtements antistatiques. Ces méthodes sont destinées à servir de procédures d'essai de qualification. Elles peuvent aussi être utilisées pour des essais périodiques pour s'assurer de l'intégrité électrique continue d'un vêtement dans les conditions ambiantes.
