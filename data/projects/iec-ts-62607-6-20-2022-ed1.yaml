abstract:
- language: en
  script: Latn
  content: |-
    IEC TS 62607-6-20:2022 (EN) IEC TS 62607 establishes a standardized method to determine the chemical key control characteristic<br/>
    - metallic impurity content<br/>
    for powders of graphene-based materials by<br/>
    - inductively coupled plasma mass spectrometry (ICP-MS).<br/>
    The metallic impurity content is derived by the signal intensity of measured elements through MS spectrum of ICP-MS.<br/>
    - The method is applicable for powder of graphene and related materials, including bilayer graphene (2LG), trilayer graphene (3LG), few-layer graphene (FLG), reduced graphene oxide (rGO) and graphene oxide (GO).<br/>
    – The typical application area is in the microelectronics industry, e.g. conductive pastes, displays, etc., for manufacturers to guide material design, and for downstream users to select suitable products.
