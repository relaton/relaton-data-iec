abstract:
- language: en
  script: Latn
  content: IEC 62715-6-22:2023 specifies the standard measurement conditions and methods for determining the surface crease and waviness for the evaluation of foldable displays. The measurement methods are used to specify the extent of geometrical distortions in foldable display surfaces. This document applies to foldable display panels and modules (e.g. in-folding and out-folding) with one axis.
