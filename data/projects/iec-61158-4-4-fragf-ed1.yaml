  content: IEC 61158-4-4:2007 spécifie les modes opératoires de transfert opportun des données et des informations de commande entre une entité utilisateur de liaison de données et une entité utilisateur homologue, mais aussi parmi les entités de liaison de données formant le fournisseur de service de liaison de données distribué et la structure des DLPDU de bus de terrain utilisée par le protocole de la présente norme pour le transfert des données et des informations de commande, ainsi que leur représentation sous forme d'unités de données d'interface physique.
