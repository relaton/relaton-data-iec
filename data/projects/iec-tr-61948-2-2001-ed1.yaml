abstract:
- language: en
  script: Latn
  content: |-
    This technical report is valid for single photon scintillation cameras with parallel hole collimators used in planar scintigraphy and tomography.
    The objective is to specify routine tests for quality control.

    Methods for the acceptance test are described in IEC 60789 and IEC 61675-2.
