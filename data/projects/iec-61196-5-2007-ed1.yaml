abstract:
- language: en
  script: Latn
  content: applies to coaxial communications cables. It specifies the requirements for trunk and distribution cables for use in cabled television distribution networks operating at temperature between  40 °C and +65 °C and in the frequency range of 5 MHz to 1 000 MHz and is to be read in conjunction with Part 1.
- language: fr
  script: Latn
  content: s'applique aux câbles coaxiaux de communication. Elle spécifie les exigences pour les câbles de transport et de distribution utilisés dans les réseaux câblés de distribution de télévision fonctionnant à une température comprise entre  40 °C and +65 °C et dans la plage de fréquences comprises entre 5 MHz et 1 000 MHz. Elle doit être lue conjointement à la partie 1.
