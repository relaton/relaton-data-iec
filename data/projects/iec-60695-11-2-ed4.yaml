abstract:
- language: en
  script: Latn
  content: |-
    IEC 60695-11-2:2026 gives the requirements for the production and confirmation of a nominal 1 kW propane/air pre-mixed flame for use in fire hazard testing.<br/>
    This basic safety publication focusing on safety test method(s) is primarily intended for use by technical committees in the preparation of safety publications in accordance with the principles laid down in IEC GUIDE 104 and ISO/IEC Guide 51.<br/>
    One of the responsibilities of a technical committee is, wherever applicable, to make use of basic safety publications in the preparation of its publications.<br/>
    The requirements, test methods or test conditions of this basic safety publication will not apply unless specifically referred to or included in the relevant publications.<br/>
    This fourth edition cancels and replaces the third edition published in 2017. This edition constitutes a technical revision.<br/>
    This edition includes the following significant technical changes with respect to the previous edition:<br/>
    a) correction of errors in notes of Subclauses 5.2 and 5.3
- language: fr
  script: Latn
  content: |-
    L'IEC 60695-11-2:2026 spécifie les exigences pour la production et la validation d'une flamme de type à prémélange à base de propane/air de 1 kW nominal pour utilisation dans les essais relatifs aux risques du feu.<br/>
    La présente publication fondamentale de sécurité portant sur les méthodes d'essai de sécurité est essentiellement destinée à être utilisée par les comités d'études dans le cadre de l'élaboration de publications de sécurité conformément aux principes établis dans le Guide IEC 104 et le Guide ISO/IEC 51.<br/>
    Cette quatrième édition annule et remplace la troisième édition parue en 2017. Cette édition constitue une révision technique.<br/>
    Elle a le statut d'une publication fondamentale de sécurité conformément au Guide IEC 104 et au Guide ISO/IEC 51.<br/>
    Cette édition inclut les modifications techniques majeures suivantes par rapport à l'édition précédente:<br/>
    a) correction d'erreurs dans les notes des 5.2 et 5.3.
