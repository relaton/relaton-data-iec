abstract:
- language: en
  script: Latn
  content: |-
    IEC TS 60318-7:2017(E) describes a head and torso simulator, or manikin, intended for the measurement of air-conduction hearing aids in the frequency range from 100 Hz to 16 000 Hz.<br/>
    The manikin described in this document is intended for airborne acoustic measurements only. It is not suitable for measurements which depend upon vibration transmission paths such as bone conduction, or for measurements requiring the simulation of bone or tissue.<br/>
    This document specifies the manikin in terms of both its geometrical dimensions and its acoustical properties. Only manikins compliant with both sets of specifications are in conformance with this document.<br/>
    This edition includes the following significant technical changes with respect to the previous edition:<br/>
    a) the document is based on the designs of three different commonly used types of manikins;<br/>
    b) the cross sections of the head and torso and pinna simulators of the previous edition are replaced by maximum and minimum values of their geometric dimensions;<br/>
    c) the diffuse field frequency response of the manikin is added;<br/>
    d) the usable frequency range is extended to 100 Hz to 16 000 Hz;<br/>
    e) in addition to the cylindrical ear canal extension a tapered ear canal extension is added;<br/>
    f) design examples of one anatomically shaped manikin and of two different geometrically shaped manikins are given in the annexes;<br/>
    g) the relationship between tolerance interval, corresponding acceptance interval and the maximum permitted uncertainty of measurement are given in an annex;<br/>
    h) 3D representations of three different types of pinna simulators are given in an annex.
