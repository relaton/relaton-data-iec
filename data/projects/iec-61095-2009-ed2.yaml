abstract:
- language: en
  script: Latn
  content: |-
    IEC 61095:2009 applies to electromechanical air break contactors for household and similar purposes provided with main contacts intended to be connected to circuits the rated voltage of which does not exceed 440 V a.c. (between phases) with rated operational currents less than or equal to 63 A for utilization category AC-7a and 32 A for utilization categories AC-7b and AC-7c, and rated conditional short-circuit current less than or equal to 6 kA. This second edition cancels and replaces the first edition published in 1992 and its Amendment 1 (2000), and constitutes a technical revision. This edition includes the following significant technical changes with respect to the previous edition:<br/>
    - deletion of switching overvoltages requirements,<br/>
    - addition of a new utilization category AC-7c: switching of compensated electric discharge lamp control,<br/>
    - measuring of <em>U</em><sub>imp</sub> required, but the marking is not required if <em>U</em><sub>imp</sub> equal to 4 kV,<br/>
    - improvement regarding marking concerning direction of movement,<br/>
    - improvement of dielectric properties,<br/>
    - test of resistance to humidity referred to IEC 60068-2-78 instead of IEC 60068-2-3,<br/>
    - amendment to Table B.1 regarding test sequences,<br/>
    - deletion of Table F.2 regarding the correspondence between the nominal voltage of the supply system and the contactor rated impulse withstand voltage,<br/>
    - addition of a new Annex H (normative): degrees of protection of enclosed contactor,<br/>
    - addition of a new Annex I (normative): requirements and tests for equipment with protective separation.
- language: fr
  script: Latn
  content: |-
    La CEI 61095:2009 est applicable aux contacteurs électromécaniques à air pour usages domestiques et analogues dont les contacts principaux sont destinés à être reliés à des circuits dont la tension assignée ne dépasse pas 440 V en courant alternatif (entre phases) et dont les courants assignés d'emploi sont inférieurs ou égaux à 63 A pour la catégorie d'emploi AC-7a et à 32 A pour les catégories d'emploi AC-7b et AC-7c, et le courant assigné de court-circuit conditionnel est inférieur ou égal à 6 kA. Cette deuxième édition annule et remplace la première édition parue en 1992 et son Amendement 1 (2000). Elle constitue une révision technique. Cette édition inclut les modifications techniques majeures suivantes par rapport à l'édition précédente:<br/>
    - suppression des exigences concernant les surtensions de manoeuvre,<br/>
    - ajout de la nouvelle catégorie d'utilisation AC-7c: commande de lampes à décharge électrique avec compensation,<br/>
    - exigence de mesure de <em>U</em><sub>imp</sub>,<br/>
    - amélioration concernant le marquage,<br/>
    - test de résistance à l'humidité basée sur CEI 60068-2-78,<br/>
    - amendement au Tableau B.1,<br/>
    - suppression du Tableau F.2,<br/>
    - ajout de la nouvelle Annexe H (normative): degrés,<br/>
    - ajout de la nouvelle Annexe I (normative).
