abstract:
- language: en
  script: Latn
  content: |-
    IEC 60810:2014 is applicable to lamps (filament lamps, discharge lamps and LED light sources) to be used in headlamps, fog-lamps and signalling lamps for road vehicles. It is especially applicable to those lamps which are listed in IEC 60809. However, the standard may also be used for other lamps falling under the scope of this standard. This fourth edition cancels and replaces the third edition, published in 2003, its Amendments 1 (2008) and 2 (2013). This edition constitutes a technical revision. This edition includes the following significant technical changes with respect to the previous edition:<br/>
    a) introduction of new gas discharge light sources;<br/>
    b) introduction of requirements for non-replaceable filament lamps;<br/>
    c) introduction of requirements and test conditions for LED packages.
- language: fr
  script: Latn
  content: |-
    L'IEC 60810:2014 est applicable aux lampes (lampes à filament, lampes à décharge et sources lumineuses à LED) destinées à être utilisées dans les projecteurs avant, les feux de brouillard et les feux de signalisation des véhicules routiers. Elle s'applique particulièrement aux lampes figurant dans l'IEC 60809. Cependant, elle peut aussi être utilisée pour d'autres lampes relevant de son domaine d'application. Cette quatrième édition annule et remplace la troisième édition parue en 2003, l'Amendement 1 (2008) et l'Amendement 2 (2013). Cette édition constitue une révision technique. Cette édition inclut les modifications techniques majeures suivantes par rapport à l'édition précédente:<br/>
    a) introduction de nouvelles sources lumineuses à décharge;<br/>
    b) introduction des exigences applicables aux lampes à filament non remplaçable;<br/>
    c) introduction des exigences et conditions d'essai applicables aux LED encapsulées.
