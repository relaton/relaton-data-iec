abstract:
- language: en
  script: Latn
  content: |-
    <p>ISO/IEC 24383:2026 specifies requirements and recommendations providing security to the physical network comprising customer premises cabling in accordance with the ISO/IEC 11801 series, associated infrastructure and accommodation of information technology equipment.<br/>
    <br/>
    The document covers the security of the ICT cables, pathways, spaces, and other infrastructure components of the ICT physical infrastructure to help provide protection of the ICT infrastructure from unauthorized access, tampering, or modifications.<br/>
    The document addresses:<br/>
    a) risk assessment guidelines;<br/>
    b) design, planning, product selection and installation practices based on a required information sensitivity level;<br/>
    c) intrusion detection, (treatments and controls); and<br/>
    d) administration including automated infrastructure management (AIM).<br/>
    <br/>
    This document applies to existing buildings and structures together with those being planned for construction.<br/>
    The following are outside the scope of this document:<br/>
    e) data protection methods such as encryption;<br/>
    f) practices that address protection from non-contact cable tapping, audio, visual or RF snooping and other forms of unauthorized monitoring;<br/>
    g) internal environmental events such as overheating, fire, electrostatic discharge, water impacting the function of the facility; and<br/>
    h) external environmental events such as fire, flood, earthquake, explosion, lightning, and electromagnetic effects.</p>
