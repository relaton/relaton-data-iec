abstract:
- language: en
  script: Latn
  content: |+
    <!-- NEW! -->IEC 61386-21:2021 is available as IEC 61386-21:2021 RLV which contains the International Standard and its Redline version, showing all changes of the technical content compared to the previous edition.
    <p>IEC 61386-21:2021 specifies the requirements for rigid conduit systems. This document is to be used in conjunction with IEC 61386-1:2008 and IEC 61386‑1:2008/AMD1:2017. This second edition cancels and replaces the first edition published in 2002. This edition constitutes a technical revision. This edition includes the following significant technical changes with respect to the previous edition:<br/>
    - Subclause 7.1.103 has been added requiring the manufacturer to declare whether the conduit is bendable;<br/>
    - Annex AA has been added to provide guidance on the application of a constantly increasing force.</p>


- language: fr
  script: Latn
  content: |-
    <!-- NEW! -->IEC 61386-21:2021 est disponible sous forme de IEC 61386-21:2021 RLV qui contient la Norme internationale et sa version Redline, illustrant les modifications du contenu technique depuis l'édition précédente.<br/>
    La présente partie de l’IEC 61386 spécifie les exigences pour les systèmes de conduits rigides.<br/>
    Ce document doit être utilisé conjointement avec l’IEC 61386-1:2008 et l’IEC 61386‑1:2008/AMD1:2017.<br/>
    Cette deuxième édition annule et remplace la première édition parue en 2002. Cette édition constitue une révision technique.<br/>
    Cette édition inclut les modifications techniques majeures suivantes par rapport à l’édition précédente:

    	Le 7.1.103 a été ajouté. Il exige du fabricant qu’il déclare si le produit peut être cintré;
    	L’Annexe AA a été ajoutée. Elle donne des recommandations relatives à l’application d’une force croissant constamment.

    La présente version bilingue (2021-11) correspond à la version anglaise monolingue publiée en 2021-04.<br/>
    La version française de cette norme n'a pas été soumise au vote.
