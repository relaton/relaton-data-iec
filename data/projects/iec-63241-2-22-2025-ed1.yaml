abstract:
- language: en
  script: Latn
  content: |-
    IEC 63241-2-22: 2025 applies to hand-held cut-off machines and wall chasers.<br/>
    This document is to be used in conjunction with the first edition of IEC 63241-1:2023.<br/>
    This document supplements or modifies the corresponding clauses in IEC 63241-1, so as to convert it into the IEC Standard: Particular requirements for hand-held cut-off machines and wall chasers.<br/>
    Where a particular subclause of Part 1 is not mentioned in this Part 2-22, that subclause applies as far as relevant. Where this standard states "addition", "modification" or "replacement", the relevant text in Part 1 is to be adapted accordingly.
- language: fr
  script: Latn
  content: |-
    IEC 63241-2-22:2025 s'applique aux tronçonneuses et aux rainureuses portatives.<br/>
    Le présent document doit être utilisé conjointement avec la première édition de l'IEC 63241‑1:2023.<br/>
    Le présent document complète ou modifie les articles correspondants de l'IEC 63241-1 de façon à la transformer en norme IEC: Exigences particulières pour les tronçonneuses et les rainureuses portatives.<br/>
    Lorsqu'un paragraphe particulier de la Partie 1 n'est pas mentionné dans cette Partie 2-22, ce paragraphe s'applique pour autant que cela soit pertinent. Lorsque la présente norme spécifie "addition", "modification" ou "remplacement", le texte correspondant de la Partie 1 doit être adapté en conséquence.
