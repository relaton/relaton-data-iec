abstract:
- language: fr
  script: Latn
  content: |-
    IEC 61968-11:2010 specifies the distribution extensions of the Common Information Model (CIM) specified in IEC 61970-301. It defines a standard set of extensions of common information model, which support message definitions in Parts 3 to 9 of IEC 61968, IEC 61968-13 and IEC 61968-14. The scope of this document is the information model that extends the base CIM for the needs of distribution networks, as well as for integration with enterprise-wide information systems typically used within electrical utilities. The information model is defined in UML which is platform-independent and electronically processable language that is then used to create message payload definitions in different required formats.
    <br /><br />This publication is of core relevance for Smart Grid</a>.
