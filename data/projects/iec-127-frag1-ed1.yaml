abstract:
- language: en
  script: Latn
  content: |-
    This Guide provides recommendations for the drafters of standards for the inclusion of collaborative safety aspects in standards. It is applicable to any safety aspect related to people, property or the environment, or to a combination of these.<br/>
    This Guide supplements ISO/IEC Guide 51 and IEC Guide 116 by specifying requirements and recommendations for drafters of standards to assist them in including collaborative safety-related aspects in standards.<br/>
    This Guide supplements, in particular, the Safeguarding and complementary protective measures (Step 2) and may include Protective measure taken by the user (e.g. Provision and use of additional safeguards), both illustrated in Guide 116, Figure 5 Risk reduction process.
