abstract:
- language: en
  script: Latn
  content: |-
    IEC 60825-1 is applicable to safety of laser products emitting laser radiation in the wavelength range 180 nm to 1 mm. 

    A laser product may consist of a single laser with or without a separate power supply or may incorporate one or more lasers in a complex optical, electrical, or mechanical system. Typically, laser products are used for demonstration of physical and optical phenomena, materials processing, data reading and storage, transmission and display of information, etc. Such systems have found use in industry, business, entertainment, research, education, medicine and consumer products. 

    Laser products that are sold to other manufacturers for use as components of any system for subsequent sale are not subject to IEC 60825-1, since the final product will itself be subject to this standard. However, if the laser system within the laser product is operable when removed from the equipment, the requirements of this Part 1 apply to the removable unit.

    Any laser product is exempt from all further requirements of this Part 1 if classification by the manufacturer of that product according to Clauses 3, 8 and 9 shows that the emission level does not exceed the AEL (accessible emission limit) of Class 1 under all conditions of operation, maintenance, service and failure.

    In addition to the hazards resulting from laser radiation, laser equipment may also give rise to other hazards such as fire and electric shock.

    This Part 1 describes the minimum requirements. Compliance with this Part 1 may not be sufficient to achieve the required level of product safety. Laser products must conform to the applicable performance and testing requirements of the applicable product safety standards.

    Where a laser system forms a part of equipment which is subject to another IEC product safety standard (e.g. for medical equipment (IEC 60601-2-22), IT equipment (IEC 60950), audio and video equipment (IEC 60065), equipment for use in hazardous atmospheres (IEC 60079), or electric toys (IEC 62115)), this Part 1 will apply in accordance with the provisions of IEC Guide 104 ) for hazards resulting from laser radiation. If no product safety standard is applicable, then IEC 61010-1 applies.

    In previous editions, LEDs were included in the scope of IEC 60825-1, and they may be still included in other parts of the IEC 60825 series. However, with the development of lamp safety standards, optical radiation safety of LEDs in general can be more appropriately addressed by lamp safety standards. The removal of LEDs from the scope of this Part 1 does not preclude other standards from including LEDs whenever they refer to lasers. CIE S009 may be applied to determine the risk group class of an LED or product incorporating one or more LEDs.

    The MPE (maximum permissible exposure) values of this Part 1 were developed for laser radiation and do not apply to collateral radiation. However, if a concern exists that accessible collateral radiation might be hazardous, the laser MPE values may be applied to conservatively evaluate this potential hazard.

    The MPE values are not applicable to intentional human exposure to laser radiation for the purpose of medical or cosmetic/aesthetic treatment.

    The objectives of this part of IEC 60825 are the following:

    - to introduce a system of classification of lasers and laser products according to their degree of optical radiation hazard in order to aid hazard evaluation and to aid the determination of user control measures;

    - to establish requirements for the manufacturer to supply information so that proper precautions can be adopted;

    - to ensure, through labels and instructions, adequate warning to individuals of hazards associated with accessible radiation from laser products;

    - to reduce the possibility of injury by minimizing unnecessary accessible radiation and to give improved control of the laser radiation hazards through protective features.

    This second edition of IEC 60825-1 cancels and replaces the first edition published in 1993, its Amendment 1 (1997) and its Amendment 2 (2001). It constitutes a technical revision. The user's guide has been removed from this part of the IEC 60825 series and is now a separate document (Part 14). Light emitting diodes (LEDs) have been removed from the scope of this part of IEC 60825, but may still be included in other parts.

    This part of IEC 60825 has the status of a Group Safety Publication, in accordance with IEC Guide 104, for aspects of laser radiation pertaining to human safety.

    The contents of the corrigendum of August 2008 and the interpretation sheet 1 of December 2009 have been included in this copy.
- language: fr
  script: Latn
  content: |-
    La CEI 60825-1 s'applique à la sécurité des appareils à laser émettant un rayonnement laser dans la gamme des longueurs d'ondes de 180 nm à 1 mm.

    Un appareil à laser peut se composer d'un seul laser avec ou sans dispositif d'alimentation séparé, ou bien il peut comporter un ou plusieurs lasers dans un système complexe optique, électrique ou mécanique. Les appareils à laser sont généralement utilisés pour la démonstration des phénomènes physiques et optiques, le travail des matériaux, la lecture et le stockage des données, la transmission et la visualisation de l'information, etc. De tels systèmes sont utilisés dans l'industrie, le commerce, le spectacle, la recherche, l'enseignement, la médecine et les produits de consommation. 

    Les appareils à laser qui sont vendus à d'autres fabricants pour être utilisés en tant que composants d'un matériel quelconque destiné à une vente ultérieure ne sont pas soumis à la CEI 60825-1, étant donné que l'appareil final sera lui-même soumis à cette norme. Cependant, si le système à laser dans l'appareil à laser est utilisable lorsqu'il est ôté de ce matériel, les exigences de cette Partie 1 s'appliquent à ce système amovible.

    Tout appareil à laser est exempt de toutes les exigences supplémentaires de la présente Partie 1, si la classification par le fabricant de cet appareil conformément aux Articles 3, 8 et 9 montre que le niveau d'émission ne dépasse pas les LEA (limite d'émission accessible) de la classe 1 dans toutes les conditions de fonctionnement, de maintenance, d'entretien et de défaillance.

    En complément des dangers associés au rayonnement laser, les matériels laser peuvent éventuellement présenter aussi d'autres dangers tels qu'un danger d'incendie ou un choc électrique.

    La présente Partie 1 décrit les exigences minimales. La conformité à cette Partie 1 peut ne pas être suffisante pour obtenir le niveau requis de sécurité de l'appareil. Il faut que les appareils à laser soient conformes aux exigences de performance et d'essais applicables des normes de sécurité de produits applicables.

    Lorsqu'un système à laser constitue une partie d'un matériel qui est soumis à une autre norme CEI de sécurité de produit (par exemple appareils médicaux (CEI 60601-2-22), matériels de traitement de l'information (CEI 60950), matériels audio et vidéo (CEI 60065), matériels pour utilisation en atmosphères dangereuses (CEI 60079), ou jouets électriques (CEI 62115)), la présente Partie 1 sera appliquée, conformément aux dispositions du Guide CEI 104 ), pour les dangers associés au rayonnement laser. Si aucune norme de sécurité de produit n'est applicable, la CEI 61010-1 s'applique.

    Dans les éditions précédentes, les DEL étaient comprises dans le domaine d'application de la CEI 60825-1, et elles peuvent être encore incluses dans les autres parties de la série CEI 60825. Cependant, avec le développement des normes de sécurité pour les lampes, la sécurité des rayonnements optiques des DEL en général peut être traitée de façon plus appropriée par les normes de sécurité pour les lampes. Le retrait des DEL du domaine d'application de la présente Partie 1 n'empêche pas que les autres normes traitent des DEL, à chaque fois qu'elles se rapportent aux lasers. La CIE S009 peut être appliquée pour déterminer la classe du groupe de risque d'une DEL ou d'un appareil comportant une ou plusieurs DEL.

    Les valeurs des EMP (expositions maximales permises) données dans cette Partie 1 ont été établies pour le rayonnement laser et ne s'appliquent pas au rayonnement connexe. Cependant, s'il demeure une inquiétude concernant le danger d'un rayonnement connexe, les valeurs des EMP pour les lasers peuvent être appliquées pour minimiser ce danger potentiel.

    Les valeurs des EMP ne sont pas applicables à l'exposition intentionnelle d'une personne au rayonnement laser dans le but d'un traitement médical ou cosmétique/esthétique.

    La présente partie de la CEI 60825 répond aux objectifs définis ci-dessous:

    - introduire un système de classification des lasers et des appareils à laser selon leur degré de danger de rayonnement optique, afin de faciliter l'évaluation des dangers et la détermination des mesures de contrôle des utilisateurs;

    - établir des exigences pour que le fabricant fournisse des informations, de telle sorte que des précautions adéquates puissent être adoptées;

    - assurer aux personnes, par des étiquetages et des instructions, une mise en garde appropriée contre les dangers associés au rayonnement accessible des appareils à laser;

    - diminuer la possibilité d'accident en réduisant au minimum le rayonnement accessible non utile, et procurer un meilleur contrôle des dangers liés au rayonnement laser par des procédures de protection.

    Cette deuxième édition de la CEI 60825-1 annule et remplace la première édition parue en 1993, l'Amendement 1 (1997) et l'Amendement 2 (2001). Elle constitue une révision technique. Le guide de l'utilisateur a été retiré de cette partie de la série CEI 60825 et représente maintenant un document séparé (Partie 14). Les diodes électroluminescentes (DEL) ont été retirées du domaine d'application de cette partie de la série CEI 60825, mais elles peuvent toujours être introduites dans les autres parties.

    La CEI 60825-1 a le statut d'une publication groupée de sécurité, conformément au Guide CEI 104, pour ce qui concerne les aspects du rayonnement laser relatifs à la sécurité des personnes.

    Le contenu du corrigendum d'août 2008 a été pris en considération dans cet exemplaire.
