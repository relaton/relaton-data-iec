abstract:
- language: en
  script: Latn
  content: Relates to a method of measurement of speed fluctuations in sound recording and reproducing equipment. Applies to the method using the weighted peak technique for measurement of flutter and wow and defines the characteristics of the measuring equipment.
- language: fr
  script: Latn
  content: Traite des méthodes de mesure des fluctuations de vitesse des appareils destinés à l'enregistrement et à la lecture du son. Elle s'applique aux méthodes utilisant la technique de crête pondérée pour la mesure du scintillement et du pleurage et définit les caractéristiques que doivent présenter les appareils de mesure.
