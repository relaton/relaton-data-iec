abstract:
- language: en
  script: Latn
  content: |-
    IEC 60092-501:2013(E) specifies requirements for all electric propulsion plants and gives the specifications, system design, installation and testing of at least:<br/>
    - generators and their prime movers;<br/>
    - switchboards;<br/>
    - transformers/reactors;<br/>
    - semiconductor convertors;<br/>
    - propulsion motors;<br/>
    - excitation systems;<br/>
    - control, monitoring and safety systems;<br/>
    - wires, cables, busbars, trunking systems;<br/>
    - harmonic filters.<br/>
    Bow and stern thrusters intended as auxiliary steering devices, booster and take-home devices, all auxiliary generating plants, and accumulator battery powered propulsion machinery and equipment are excluded. This fifth edition cancels and replaces the fourth edition published in 2007. It constitutes a technical revision. This edition included the following significant technical changes with respect to the previous edition:<br/>
    a) requirements regarding system responsibility, electromagnetic compatibility (EMC), harmonic distortion and filtering, special requirements for ships with propulsion motor(s) and podded drives, and power management system (PMS);<br/>
    b) overall technical review to update the standard according to general requirements and referenced equipment standards.
