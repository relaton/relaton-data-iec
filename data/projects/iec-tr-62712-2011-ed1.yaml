abstract:
- language: en
  script: Latn
  content: |-
    IEC/TR 62712:2011(E) summarizes the results of the study on products and market status of professional tape-less camera recorders. This report also includes the guideline on the possibilities of standardizations for professional tape-less camera recorders, including the following components:<br/>
    - codec;<br/>
    - file format;<br/>
    - metadata;<br/>
    - recording media;<br/>
    - interface.
