abstract:
- language: en
  script: Latn
  content: States and defines the principal performance characteristics of electric storage water-heaters which are of interest to the user and to describe the standard methods for measuring these characteristics. This standard is concerned neither with safety nor with performance requirements.
- language: fr
  script: Latn
  content: A pour objet d'énumérer et de définir les principales caractéristiques d'aptitude à la fonction des chauffe-eau électriques à accumulation intéressant le consommateur et de décrire les méthodes normalisées pour la vérification de ces caractéristiques. La présente norme ne traite pas des prescriptions de sécurité ni des valeurs exigées pour les caractéristiques d'aptitude à la fonction.
