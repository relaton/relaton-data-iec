abstract:
- language: en
  script: Latn
  content: |-
    IEC 62779-4:2020 defines general requirements on the electrical performances of a semiconductor interface for capsule endoscope using galvanic coupling human body communication. It includes general and functional specifications of the interface. The semiconductor interface that is covered in this document is the interface to handle or deliver an electrical signal between the capsule endoscope inside the human body and the HBC modem in the receiving device outside the human body.<br/>
    NOTE Additional information on capsule endoscope using the human body communication is provided in Annex A of this document.
- language: fr
  script: Latn
  content: |-
    L’IEC 62779-4:2020 définit des exigences générales concernant les performances électriques d’une interface à semiconducteurs pour la capsule endoscopique utilisant les communications via le corps humain par couplage galvanique. Elle inclut des spécifications générales et fonctionnelles de l'interface. L’interface à semiconducteurs couverte dans le présent document est l’interface de traitement ou de fourniture d’un signal électrique entre la capsule endoscopique à l’intérieur du corps humain et le modem HBC du dispositif récepteur à l'extérieur de ce même corps humain.<br/>
    NOTE L’Annexe A fournit des informations complémentaires concernant la capsule endoscopique utilisant les communications via le corps humain.
