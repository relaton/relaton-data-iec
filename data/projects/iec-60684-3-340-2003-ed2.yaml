abstract:
- language: en
  script: Latn
  content: Gives the requirements for sleeving having the property of expanding its internal diameter when compressed longitudinally and thereafter returning to its initial diameter after release of the compressing force. It is constructed of polyethylene terephthalate monofilament yarns suitably processed to provide the mechanical ability to conform in the manner described above. These sleevings have been found suitable for use at temperatures up to 130 °C. Because of its open construction, this sleeving is normally used to provide air-space insulation. Therefore, no requirement for breakdown voltage is specified in this standard. (Any value for this property should be given in the purchase contract, but a typical value is 1,5 kV/mm wall thickness, although a linear relationship cannot be assumed.) However, it serves to provide mechanical protection to circuit components such as wires, sleeves, and flat cable over which it is applied as a containing wrap or harness. Materials which conform to this specification meet established levels of performance. However, the selection of a material by a user for a specific application should be based on the actual requirements necessary for adequate performance in that application and not based on this specification alone. This second edition has been aligned to reflect the changes made to the 2nd edition of IEC 60684-2, Test methods, and provides a more comprehensive list of resistance to test fluids.
- language: fr
  script: Latn
  content: Donne les prescriptions relatives aux gaines ayant comme propriété d'agrandir leur diamètre intérieur quand elles sont compressées longitudi-nalement, pour revenir ensuite à leur diamètre initial après suppression de la force de compression. Elles sont faites de fibres monofilamentaires de téréphtalate de polyéthylène traitées de manière à assurer les aptitudes mécaniques au comportement exposées ci-dessus. Ces gaines ont été considérées comme adaptées à des températures allant jusqu'à 130 °C. Du fait de leur constitution aérée, ces gaines sont normalement utilisées pour assurer une isolation par épaisseur d'air. Par suite, cette norme ne spécifie pas d'exigence pour la tension de claquage. (Il convient que toute valeur intéressant cette propriété soit indiquée dans le contrat d'achat, la valeur type étant de 1,5 kV/mm d'épaisseur de paroi, bien qu'un rapport linéaire ne puisse être assuré). Toutefois, ces gaines servent à procurer une protection mécanique à des composants de circuits, comme les conducteurs, les gaines et les câbles en nappe autour desquels ces gaines sont montées comme un enveloppement ou filet de maintien. Les matériaux conformes à cette norme satisfont aux niveaux de performance établis. Cependant, il convient que la sélection d'un matériau par un utilisateur pour une application particulière soit basée sur les caractéristiques réelles nécessaires pour atteindre les performances appropriées dans cette application et pas uniquement basée sur la présente norme. Cette deuxième édition a été alignée afin de tenir compte des changements effectués dans la deuxième édition de la CEI 60684-2, Méthode d'essai, et fournit une liste plus complète de résistance aux fluides d'essai.
