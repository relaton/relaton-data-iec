  script: Latn
  content: Traite de la sécurité des appareils de chauffage électriques à accumulation pour usages domestiques et analogues, destinés à chauffer la pièce dans laquelle ils sont situés, dont la tension assignée n'est pas supérieure à 250 V pour les appareils monophasés et à 480 V pour les autres appareils.
