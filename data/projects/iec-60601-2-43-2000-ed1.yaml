  content: |-
    Establishes safety requirements for the design and manufacture of X-ray equipment for prolonged radioscopically guided interventional procedures.

    Specifies information which is to be provided with such equipment for the assistance of the user and operator in managing the radiation risk arising from these procedures which could affect patients and staff.
