abstract:
- language: en
  script: Latn
  content: Applies to single UPS units or UPS systems comprising a number of interconnected UPS and associated control/switchgear forming a single power system, intended to be installed in any operator accessible area or in separated electrical locations, connected to either industrial or public low voltage supply networks. Takes precedence over all aspects of the generic standards, and no additional testing is necessary. Takes into account differing test conditions necessary to encompass the range of physical sizes and power ratings of UPS. A UPS unit or system shall meet the relevant requirements of this standard as a stand-alone product. Special installation environments are not covered, nor are fault conditions of UPS taken into account. This standard does not cover d.c. supplied electronic ballast (IEC 60924 and IEC 60925) or UPS based on rotating machines. States EMC requirements, test methods, minimum performance levels.
- language: fr
  script: Latn
  content: S'applique aux ASI individuelles ou aux systèmes d'ASI comprenant un certain nmbre d'ASI interconnectées et de matériels de commande/commutation formant un système d'alimentation unique, les unes et les autres étant destingées à être installées dans n'impporte quel local accessible à l'opérateur ou dans des locaux séparés et reliés à des réseaux d'alimentation basse tension industriels ou publics. Prévaudra sur tous les aspects des normes génériques; aucun essai complémentaire n'est nécessaire. norme prend en compte les différentes conditions d'essai nécessaires pour couvrir le domaine des ASI en ce qui concerne leurs tailles et leurs puissances nominales. Une ASI unitaire ou un système d'ASI doit satisfaire aux prescriptions appropriées de la présente norme en tant que produit considéré individuellement. Les environnements spéciaux d'installation ne sont pas couverts et les conditions de défaut des ASI ne sont pas non plus pris en compte. La présente norme ne couvre pas les ballasts électroniques alimentés en courant continu (CEI 60924 et CEI 60925) ou les ASI mettant en jeu des machines tournantes. La présente norme fixe les prescriptions de CEM, des méthodes d'essai, des niveaux minimaux de performance.
