abstract:
- language: en
  script: Latn
  content: |-
    IEC 61753-061-2:2020 contains the minimum test and measurement requirements and severities which a fibre optic isolator as specified by IEC 61202-1 satisfies in order to be categorized as meeting the requirements of isolators used in controlled environments as specified in IEC 61753-1. The requirements cover single-mode pigtailed style polarization independent isolators for category C used in controlled environments. This second edition cancels and replaces the first edition published in 2012 and constitutes a technical revision. This edition includes the following significant technical changes with respect to the previous edition:<br/>
    - addition of the detail high optical power test procedures and the condition in Annex B;<br/>
    - change of test conditions harmonizing with IEC 61753-1:2018;<br/>
    - addition of category CHD;<br/>
    - addition of the detailed measurements conditions in Annex C;<br/>
    - change of clause structure accordance with the latest ISO/IEC Directives, Part 2.<br/>
    The content of the corrigendum 1 (2025-05) has been included in this copy.
- language: fr
  script: Latn
  content: |-
    IEC 61753-061-2:2020 contient les sévérités et les exigences minimales de mesure et d'essai auxquelles un isolateur fibronique tel que spécifié dans l'IEC 61202-1 est tenu de satisfaire afin d'être considéré comme conforme aux exigences des isolateurs utilisés dans des environnements contrôlés tel que spécifié dans l'IEC 61753-1. Les exigences couvrent les isolateurs à fibres unimodales munis de fibres amorces non connectorisées pour la catégorie C utilisés dans des environnements contrôlés. Cette deuxième édition annule et remplace la première édition parue en 2012 et constitue une révision technique. Cette édition inclut les modifications techniques majeures suivantes par rapport à l'édition précédente:<br/>
    - ajout des détails et des conditions des procédures d'essai à puissance optique élevée dans l'Annexe B;<br/>
    - modification des conditions d'essai en harmonisation avec l'IEC 61753-1:2018;<br/>
    - ajout de la catégorie CHD;<br/>
    - ajout des conditions de mesure détaillées dans l'Annexe C;<br/>
    - modification de la structure des articles conformément aux dernières Directives ISO/IEC, Partie 2.<br/>
    Le contenu du corrigendum 1 (2025-05) a été pris en considération dans cet exemplaire.
