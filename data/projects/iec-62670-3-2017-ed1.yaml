  content: L'IEC 62670-3:2017 spécifie des procédures de mesure et des instruments permettant d'établir les performances des concentrateurs photovoltaïques dans des conditions de fonctionnement normales du concentrateur (CSOC) et des conditions d’essais normales du concentrateur (CSTC) définies dans l'IEC 62670-1, y compris les rapports de puissance.
