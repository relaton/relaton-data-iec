  content: IEC 62670-3:2017 defines measurement procedures and instrumentation for determining concentrator photovoltaic performance at concentrator standard operating conditions (CSOC) and concentrator standard test conditions (CSTC), defined in IEC 62670-1, including power ratings.
- language: fr
