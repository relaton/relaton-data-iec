abstract:
- language: en
  script: Latn
  content: |-
    IEC 60623:2026 specifies marking, designation, dimensions, tests and requirements for vented nickel-cadmium prismatic secondary single cells and battery systems made of them for use in industrial applications.<br/>
    This sixth edition cancels and replaces the fifth edition published in 2017. This edition constitutes a technical revision.<br/>
    This edition includes the following significant technical changes with respect to the previous edition:<br/>
    a) added a test for internal DC resistance;<br/>
    b) added a subclause for pulse power calculation;<br/>
    c) added a test for constant power measurement;<br/>
    d) added a subclause on the determination of durability parameters.
- language: fr
  script: Latn
  content: |-
    IEC 60623:2026 spécifie le marquage, la désignation, les dimensions, les essais et les exigences applicables aux accumulateurs individuels parallélépipédiques rechargeables ouverts au nickel-cadmium, ainsi qu’aux systèmes de batterie constitués de ces éléments et destinés aux applications industrielles.<br/>
    La sixième édition annule et remplace la cinquième édition parue en 2017. Cette édition constitue une révision technique.<br/>
    Cette édition inclut les modifications techniques majeures suivantes par rapport à l’édition précédente:<br/>
    a) ajout d’un essai de résistance interne en courant continu;<br/>
    b) ajout d’un paragraphe relatif au calcul de la puissance d’impulsion;<br/>
    c) ajout d’un essai de mesure à puissance constante;<br/>
    d) ajout d’un paragraphe concernant la détermination des paramètres de durabilité.
