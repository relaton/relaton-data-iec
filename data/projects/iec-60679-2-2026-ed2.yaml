abstract:
- language: en
  script: Latn
  content: |-
    IEC 60679-2:2026 describes the general properties, performance characteristics and usage precautions for quartz crystal oscillators. This document mainly describes crystal oscillators, but some descriptions also apply to oscillators other than crystal units (e.g. MEMS resonators).<br/>
    This edition includes the following significant technical changes with respect to the previous edition:<br/>
    a) some new contents that reflect the latest manufacturing technologies;<br/>
    b) added contents about the operating principle of crystal oscillators;<br/>
    c) added contents about usage precautions for crystal oscillators.
- language: fr
  script: Latn
  content: |-
    L’IEC 60679-2:2026 décrit les propriétés générales, les caractéristiques de performance et les précautions d’utilisation des oscillateurs à quartz. Le présent document décrit principalement les oscillateurs à quartz, mais certaines descriptions s’appliquent également aux oscillateurs autres que les unités de cristal (les résonateurs MEMS, par exemple).<br/>
    Cette édition inclut les modifications techniques majeures suivantes par rapport à l’édition précédente:<br/>
    a) quelques nouveaux contenus qui reflètent les dernières technologies de fabrication;<br/>
    b) ajout de contenu sur le principe de fonctionnement des oscillateurs à quartz;<br/>
    c) ajout de contenu sur les précautions d’utilisation des oscillateurs à quartz.
