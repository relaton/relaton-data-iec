abstract:
- language: en
  script: Latn
  content: |-
    IEC 62106-8:2021 defines the coding and definition of features for the Radio Data System (RDS). IEC 62106-8:2021 cancels and replaces the first edition published in 2018. This edition constitutes a technical revision. This edition includes the following significant technical changes with respect to IEC 62106‑2:2018:<br/>
    a) Subclause 4.2.4 has been added;<br/>
    b) Tables 1 and 13 have been modified;<br/>
    c) The new function RDS2 file transfer has been added and it is detailed in Annex C; this uses a CRC-16, which is specified in Annex D.
