abstract:
- language: en
  script: Latn
  content: |-
    IEC 63310:2025 deals with the functional performance criteria and guidelines for robots intended for use in the active assisted living connected home environment (AAL CHE).<br/>
    This document does not cover safety requirements of robots.<br/>
    This document is applicable to robots which provide the AAL user (or AAL care recipient) with one or more of the following services and support in the AAL CHE:<br/>
    - information and data management;<br/>
    - monitoring service;<br/>
    - communication support;<br/>
    - activity support;<br/>
    - mobility support;<br/>
    - other support.<br/>
    AAL robots can be subject to additional relevant regulations and standards.<br/>
    This document is not applicable to robots used for medical purposes.
