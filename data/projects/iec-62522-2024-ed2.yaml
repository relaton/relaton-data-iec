abstract:
- language: en
  script: Latn
  content: IEC 62552:2024 provides a stable and reproducible procedure to calibrate the wavelength and power output of a tuneable laser against reference instrumentation such as optical power meters and optical wavelength meters (including optical frequency meters) that have been previously traceably calibrated.
- language: fr
  script: Latn
  content: L'IEC 62552:2024 fournit une procédure fiable et reproductible pour étalonner la longueur d’onde et la puissance de sortie d’un laser accordable en fonction des instruments de référence tels que des wattmètres optiques et des appareils de mesure de longueur d’onde optique (y compris des fréquencemètres optiques) dont la traçabilité a été préalablement étalonnée.
