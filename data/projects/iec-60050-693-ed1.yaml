abstract:
- language: en
  script: Latn
  content: |-
    IEC 60050-693 gives the general terminology used in management of network assets in power systems, as well as general terms pertaining to specific applications and associated technologies. It has the status of a horizontal publication in accordance with IEC Guide 108.<br/>
    It has the status of a horizontal publication in accordance with IEC Guide 108, Guidelines for ensuring the coherence of IEC publications – Horizontal functions, horizontal publications and their application.<br/>
    This terminology is consistent with the terminology developed in the other specialized parts of the IEV.<br/>
    This horizontal publication is primarily intended for use by technical committees in the preparation of IEC publications in accordance with the principles laid down in IEC Guide 108.<br/>
    One of the responsibilities of a technical committee is, wherever applicable, to make use of horizontal publications in the preparation of its publications.
- language: fr
  script: Latn
  content: |-
    IEC 60050-693 donne la terminologie générale utilisée dans le domaine de la gestion des actifs de réseau dans les systèmes électriques, ainsi que les termes généraux relatifs à des applications particulières et technologies associées.<br/>
    Elle a le statut de publication horizontale conformément au Guide 108 de l’IEC, Lignes directrices pour assurer la cohérence des publications de l’IEC – Application des normes horizontales.<br/>
    Cette terminologie est en accord avec celle figurant dans les autres parties spécialisées de l’IEV.<br/>
    La présente publication horizontale est essentiellement destinée à l’usage des comités d’études dans la préparation des publications de l’IEC, conformément aux principes établis dans le Guide 108 de l’IEC.<br/>
    L’une des responsabilités d’un comité d’études est d’utiliser, autant que possible, les publications horizontales lors de la préparation de ses publications.
