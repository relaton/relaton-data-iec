abstract:
- language: en
  script: Latn
  content: IEC 62379-5-2:2014 specifies protocols which can be used between networking equipment to enable the setting up of calls which are routed across different networking technologies. It also specifies encapsulation of digital media within those calls.
- language: fr
  script: Latn
  content: |-
    L'IEC 62379-5-2:2014 spécifie les protocoles qui peuvent être utilisés entre les équipements de mise en réseau pour permettre l'établissement d'appels acheminés sur des technologies de mise en réseau différentes.<br/>
    Elle spécifie également l'encapsulation des supports numériques dans ces appels.
