- language: en
  script: Latn
  content: |-
    IEC TS 62564-1:2016(E) defines the minimum requirements for integrated circuits and semiconductors which are designated as an "aerospace qualified electronic component (AQEC)". This new edition includes the following significant technical changes with respect to the previous edition:<br/>
    - refers to the latest editions of IEC TS 62239-1 and IEC TS 62686-1, and of other publications;<br/>
    - adds information regarding components' life expectancy.
