abstract:
- language: en
  script: Latn
  content: |-
    Is applicable to electroheat installations such as furnaces for direct arc heating (direct arc furnaces, submerged arc furnaces, ladle arc heating furnaces) and furnaces for indirect arc heating.

    The contents of the corrigendum of December 2008 have been included in this copy.
- language: fr
  script: Latn
  content: |-
    Est applicable aux installations électrothermiques telles que les fours utilisant le chauffage par arc direct (fours à arc direct, fours à arc submergés, fours poches avec chauffage à l'arc) et les fours à arc indirect.

    Le contenu du corrigendum de décembre 2008 a été pris en considération dans cet exemplaire.
