abstract:
- language: en
  script: Latn
  content: |-
    IEC 61058-1:2026 applies to switches or switching devices for appliances. The switches are intended to control electrical appliances and other equipment for household or similar purposes with a rated voltage not exceeding 600 V and a rated current not exceeding 63 A. This fifth edition cancels and replaces the fourth edition published in 2016. This edition constitutes a technical revision.<br/>
    This edition includes the following significant technical changes with respect to the previous edition:<br/>
    a) Extension to 600 V in the scope;<br/>
    b) Add requirements on ground-fuse (Clause 17);<br/>
    c) DC arc extinction test (Annex P and Clause 17);<br/>
    d) Table 5 re-arranged to line-up with classifications;<br/>
    e) Table 6 correction due to inhomogeneous values;<br/>
    f) Deletion of X3 capacitors in classification and in Table 19.
- language: fr
  script: Latn
  content: |-
    L'IEC 61058-1:2026 s'applique d'une manière générale aux interrupteurs ou appareils de connexion pour appareils. Les interrupteurs permettent de commander des appareils électriques et autres matériels pour usage domestique et analogue dont la tension assignée ne dépasse pas 600 V et le courant assigné ne dépasse pas 63 A. Cette cinquième édition annule et remplace la quatrième édition parue en 2016. Cette édition constitue une révision technique.<br/>
    Cette édition inclut les modifications techniques majeures suivantes par rapport à l'édition précédente:<br/>
    a) extension du domaine d'application à 600 V;<br/>
    b) ajout d'exigences concernant les fusibles de mise à la terre (Article 17);<br/>
    c) essai d'extinction d'arc en courant continu (Annexe P et Article 17);<br/>
    d) réorganisation du Tableau 5 pour l'aligner sur les classifications;<br/>
    e) correction du Tableau 6 en raison de valeurs non homogènes;<br/>
    f) suppression des condensateurs X3 de la classification et du Tableau 19.
