abstract:
- language: en
  script: Latn
  content: |-
    IEC 61196-10:2014 applies to semi-rigid coaxial communication cables with polytetrafluoroethylene (PTFE) dielectric and tubular outer conductor. These cables are intended for use in microwave and wireless equipments or other signal transmission equipments or units at frequencies above 500 MHz. The contents of the corrigendum of February 2016 have been included in this copy.<br/>
    <br/>
    This publication is to be read in conjunction with IEC 61196-1:2005.
- language: fr
  script: Latn
  content: |-
    L'IEC 61196-10:2014 s'applique aux câbles coaxiaux semi-rigides de communication comportant un diélectrique en polytétrafluoroéthylène (PTFE) et un conducteur extérieur tubulaire. Ces câbles sont destinés à être utilisés dans les équipements à microondes et sans fil ou dans d'autres équipements ou unités de transmission de signal, à des fréquences supérieures à 500 MHz. Le contenu du corrigendum publié en février 2016 est inclus dans ce document.<br/>
    <br/>
    Cette publication doit être lue conjointement avec la IEC 61196-1:2005.
