abstract:
- language: fr
  script: Latn
  content: 'La CEI 61784-5-10 :2012 spécifie les profils d''installation applicables à la CPF 11 (TCnet). Les profils d''installation sont spécifiés dans l''annexe. Cette annexe est lue conjointement à la CEI 61918:2010. Cette deuxième édition annule et remplace la première édition publiée en 2007, dont elle constitue une révision technique. La présente édition comporte les modifications techniques suivantes par rapport à l''édition précédente: Addition d''une nouvelle Annexe B 8 (normative). La présente version bilingue (2012-02) correspond à la version anglaise monolingue publiée en 2010-07.'
