  script: Latn
  content: This standard defines the design&#x2F;type tests, routine test, acceptance tests and classifications for line surge arresters (LSA). The arresters covered by this standard are Non-Gapped Line Arresters (NGLA) and Externally Gapped Line Arresters (EGLA) for use on AC or DC transmission and distribution power lines with system voltages &gt; 1kV.
