abstract:
- language: en
  script: Latn
  content: |-
    IEC TS 62607-4-10:2026, which is a Technical Specification, establishes standardized methods to determine the electrochemical key control characteristics, including:<br/>
    • specific capacitance, voltage maintenance rate, endurance in cycling and temperature endurance of carbon nanomaterials by determining the standard coin-type EDLC.<br/>
    The electrochemical key control characteristics are derived by calculating the recording curve at the specific charging and discharging process.<br/>
    • The document is applicable for coin-type EDLC assembled from carbon nanomaterials, such as nanoporous activated carbon, carbon aerogel, carbon nanotube, carbon black, graphene, nano graphite sheet, vapor-grown carbon fibre and so on.<br/>
    • Typical application areas of this method are research, manufacturer and downstream use to guide material processing and quality control.
