abstract:
- language: en
  script: Latn
  content: Applies to electric fans and their associated regulators intended for use on single-phase a.c. and d.c. circuits not exceeding 250 V, for household and similar purposes, such as ceiling, table, pedestal, partition and ventilating fans.
- language: fr
  script: Latn
  content: S'applique aux ventilateurs électriques ainsi qu'aux régulateurs de vitesse associés, destinés à être utilisés sur des circuits monophasés en courant alternatif ou en courant continu pour usages domestiques et analogues, à des tensions inférieures ou égales à 250 V, tels que les ventilateurs de plafond, de table, de cloison à colonne et les aérateurs.
