abstract:
- language: fr
  script: Latn
  content: |-
    L'IEC 60455-2:2015 spécifie les méthodes d'essai à utiliser pour vérifier les composés réactifs à base de résines, leurs composants et les composés durcis, utilisés pour l'isolation électrique. Cette troisième édition annule et remplace la deuxième édition parue en 1998. Cette édition constitue une révision technique. La présente édition inclut les modifications techniques majeures suivantes par rapport à l'édition précédente:<br/>
    - Introduction des méthodes d'essai relatives à la norme IEC 60455-3-8;<br/>
    - Des méthodes d'essai supplémentaires et mis à jour pour les résines.
    Mots clés: composés réactifs à base de résines utilisés pour l'isolation électrique
