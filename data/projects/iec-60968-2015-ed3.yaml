abstract:
- language: en
  script: Latn
  content: |-
    IEC 60968:2015 specifies the safety and interchangeability requirements, together with the test methods and conditions required to show compliance of tubular fluorescent lamps with integrated means for controlling starting and stable operation (self-ballasted fluorescent lamps). This third edition cancels and replaces the second edition published in 2012. This edition constitutes a technical revision. This edition includes the following significant technical changes with respect to the previous edition, where additions have been made to the following:<br/>
    a) caps and prevention of cap misuse;<br/>
    b) interchangeability;<br/>
    c) mechanical and electrical strength;<br/>
    d) creepage distances and clearances;<br/>
    e) end of lamp life precaution;<br/>
    f) abnormal operation;<br/>
    g) test conditions for dimmable and three-way lamps;<br/>
    h) water contact related marking;<br/>
    i) verification, and assessment;<br/>
    j) information for luminaire design in the form of annexes.<br/>
    The contents of the corrigendum of March 2015 have been included in this copy.
- language: fr
  script: Latn
  content: |-
    L'IEC 60968:2015 spécifie les exigences de sécurité et d'interchangeabilité ainsi que les méthodes et les conditions d'essais exigés pour démontrer la conformité des lampes tubulaires à fluorescence à dispositif intégré d'amorçage et de stabilisation du fonctionnement (lampes à fluorescence à ballast intégré). Cette troisième édition annule et remplace la deuxième édition, parue en 2012. Cette édition constitue une révision technique. La présente édition inclut les modifications techniques majeures suivantes par rapport à l'édition précédente, avec des ajouts concernant:<br/>
    a) les culots et la prévention de la mauvaise utilisation des culots;<br/>
    b) l'interchangeabilité;<br/>
    c) l'endurance mécanique et électrique;<br/>
    d) les lignes de fuite et distances d'isolement;<br/>
    e) les précautions sur la fin de la durée de vie des lampes;<br/>
    f) le fonctionnement anormal;<br/>
    g) les conditions d'essai pour les lampes à variation d'intensité et à trois intensités;<br/>
    h) le marquage relatif au contact avec l'eau;<br/>
    i) la vérification et évaluation;<br/>
    j) les informations pour la conception du luminaire sous forme d'annexes.<br/>
    Le contenu du corrigendum de mars 2015 a été pris en considération dans cet exemplaire.
