abstract:
- language: en
  script: Latn
  content: |-
    IEC 61196-1-326:2026 specifies the test methods of clamps for laying coaxial communication cable, including mechanical test methods and environmental test methods.<br/>
    This document applies to clamps for laying coaxial communication cables, including feeder and radiating cables. For requirements not covered in IEC 61914, clamps for other types of cables can also refer to this document.<br/>
    This second edition cancels and replaces the first edition published in 2022. This edition constitutes a technical revision.<br/>
    This edition includes the following significant technical changes with respect to the previous edition:<br/>
    a) Addition of Clause 4 to Clause 15.
