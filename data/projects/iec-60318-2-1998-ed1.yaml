- language: en
  script: Latn
  content: Specifies two different adapters and the removable conical ring to be used with the IEC 60318-1 ear simulator to provide an interim acoustic coupler for the calibration of certain audiometric earphones designed for use in the extended high-frequency range from 8 kHz to 16 kHz.
