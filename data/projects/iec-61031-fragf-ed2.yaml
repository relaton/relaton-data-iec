abstract:
- language: en
  script: Latn
  content: |-
    <p>IEC 61031:2020 applies to the design, location and application of installed equipment for monitoring local gamma radiation dose rates within nuclear facilities during normal operation and anticipated operational occurrences. High range area gamma radiation dose rate monitoring equipment for accident conditions currently addressed by IEC 60951-1 and IEC 60951-3 is not within the scope of this document. This document provides guidelines for the design principles, the location, the application, the calibration, the operation, and the testing of installed equipment for continuously monitoring local gamma radiation dose rates in nuclear facilities under normal operation conditions and anticipated operational occurrences. These instruments are normally referred to as area radiation monitors. Portable instruments are also used for this purpose but are not covered by this document.</p>

    <p>This document is to be used in conjunction with IEC 60532:2010. This second edition cancels and replaces the first edition published in 1990. This edition includes the following significant technical changes with respect to the previous edition:<br/>
    a. The scope of the standard is extended from nuclear power plants to nuclear facilities and the title is accordingly aligned.<br/>
    b. The relevant standards published by IEC SC 45A since the publication of the first edition are taken into account and refered to when relevant.</p>
- language: fr
  script: Latn
  content: |-
    <p>IEC 61031:2020 s'applique à la conception, l'implantation et l'application des matériels à poste fixe destinés à la surveillance locale des débits de dose de rayonnement gamma dans les installations nucléaires pour le fonctionnement normal et les incidents de fonctionnement prévus. Le matériel de surveillance du débit de dose de rayonnement gamma à large gamme pour les conditions accidentelles est actuellement couvert par l'IEC 60951-1 et l'IEC 60951-3; il n'entre pas dans le domaine d'application du présent document. Le présent document fournit des lignes directrices pour les principes de conception, l'implantation, l'application, l'étalonnage, le fonctionnement et les essais du matériel à poste fixe destiné à la surveillance permanente des débits de dose de rayonnement gamma local dans les installations nucléaires, dans des conditions de fonctionnement normal et d'incidents de fonctionnement prévus. Ces appareils sont généralement appelés moniteurs de rayonnement de zone. Des appareils portatifs sont également utilisés dans ce but, mais ne sont pas couverts par le présent document.</p>

    <p>Le présent document est destiné à être utilisé conjointement avec l'IEC 60532:2010. Cette deuxième édition annule et remplace la première édition parue en 1990. Cette édition inclut les modifications techniques majeures suivantes par rapport à l'édition précédente:<br/>
    a. extension du domaine d'application de la norme des centrales nucléaires de puissance aux installations nucléaires et alignement du titre en conséquence;<br/>
    b.prise en compte des normes pertinentes publiées par le SC 45A de l'IEC depuis la publication de la première édition et référence à ces normes, le cas échéant.</p>
