  script: Latn
  content: Décrit une méthode d'échange de données «temps critique» de centres de conduite, à travers des réseaux locaux ou à longues distances utilisant une pile de protocoles entièrement conformes à l'ISO. Contient des dispositions permettant de soutenir aussi bien une architecture distribuée qu'une architecture centralisée.
