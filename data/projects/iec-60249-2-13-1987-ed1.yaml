abstract:
- language: en
  script: Latn
  content: |-
    Gives requirements for properties of flexible copper-clad polyimide film, general purpose grade including optional requirements which apply only by agreement between purchaser and supplier.
    The material consists of an insulating flexible film base with copper foil bonded to one or both sides, with or without the use of an adhesive.
- language: fr
  script: Latn
  content: Donne les exigences concernant les propriétés des films flexibles de polyimide recouverts de cuivre, de qualité courante. Comporte en outre des exigences facultatives qui s'appliquent uniquement par accord entre acheteur et fournisseur. Le matériau consiste en un film isolant flexible recouvert d'une feuille de cuivre sur une face ou sur les deux faces, avec ou sans emploi de colle.
