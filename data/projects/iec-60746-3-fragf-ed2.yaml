  content: La CEI 60746-3:2002 a pour but de spécifier la terminologie, les définitions et les exigences relatives aux énoncés des caractéristiques par les constructeurs d'analyseurs, de détecteurs et d'unités électroniques utilisés pour la détermination de la conductivité électrolytique des solutions aqueuses; d'établir les essais de qualité de fonctionnement pour ces analyseurs, détecteurs et unités électroniques; de fournir des documents de base dans le cadre de l'application des normes d'assurance qualité.
