abstract:
- language: en
  script: Latn
  content: |-
    <p>IEC 60068-2-52:2017 specifies the application of the cyclic salt mist test to components or equipment designed to withstand a salt-laden atmosphere as salt can degrade the performance of parts manufactured using metallic and/or non-metallic materials.<br/>
    This third edition cancels and replaces the second edition published in 1996. This edition constitutes a technical revision.<br/>
    This edition includes the following significant technical changes with respect to the previous edition:</p>


    	the entire content has been harmonized with ISO 9227 as far as possible;
    	an introduction has been added;
    	the scope has been simplified;
    	normative references have been updated;
    	the general description of the test has been changed;
    	a dry chamber has been added to the test apparatus;
    	severities have been changed to test methods;
    	test methods 7 and 8 have been added;
    	information on the test report has been added;
    	Figure 1 has been changed to Table 1;
    	a typical test apparatus example has been added in a new Annex A;
    	a description of each test method has been added in a new Annex B;
    	bibliographical references have been added.


    <p>This bilingual version (2019-08) corresponds to the monolingual English version, published in 2017-11.<br/>
    The French version of this standard has not been voted upon.</p>
- language: fr
  script: Latn
  content: |-
    L'IEC 60068-2-52:2017 spécifie l'application de l'essai cyclique au brouillard salin aux composants ou équipements conçus pour résister à une atmosphère chargée en sel, car le sel peut détériorer le fonctionnement des parties fabriquées à partir de matériaux métalliques et/ou non métalliques.<br/>
    Cette troisième édition annule et remplace la deuxième édition parue en 1996. Cette édition constitue une révision technique.<br/>
    Cette édition inclut les modifications techniques majeures suivantes par rapport à l'édition précédente:

    	le contenu a été harmonisé autant que possible avec l'ISO 9227;
    	une introduction a été ajoutée;
    	le domaine d'application a été simplifié;
    	les références normatives ont été mises à jour;
    	la description générale de l'essai a été modifiée;
    	une chambre sèche a été ajoutée à l'appareillage d'essai;
    	les sévérités ont été remplacées par les méthodes d'essai;
    	les méthodes d'essai 7 et 8 ont été ajoutées;
    	des informations sur le rapport d'essai ont été ajoutées;
    	la Figure 1 a été remplacée par le Tableau 1;
    	un exemple d'appareillage d'essai type a été ajouté à la nouvelle Annexe A;
    	une description de chaque méthode d'essai a été ajoutée à la nouvelle Annexe B;
    	des références bibliographiques ont été ajoutées.


    <p>La présente version bilingue (2019-08) correspond à la version anglaise monolingue publiée en 2017-11.<br/>
    La version française de cette norme n'a pas été soumise au vote.</p>
