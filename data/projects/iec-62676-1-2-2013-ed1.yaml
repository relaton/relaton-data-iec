  script: Latn
  content: La CEI 62676-1-2:2013 décrit les exigences générales pour la vidéotransmission. La présente norme couvre les exigences générales pour les vidéotransmissions relatives à la performance, la sécurité et la conformité à la connectivité IP de base, fondées sur les normes internationales existantes bien connues.
