abstract:
- language: en
  script: Latn
  content: |-
    IEC 62657-4:2022 specifies a concept and methods for central coordination (CC) of automation applications using wireless communications to extend the coexistence management according to IEC 62657-2. It establishes system elements, interfaces and relationships for a central coordination. Functions, data, and data exchange for assessing and maintaining the coexistence state are specified.<br/>
    This document specifies the central coordination point (CCP) approach as one example of the usage of the formal description given in IEC 62657-3.<br/>
    This document is applicable to develop, implement, or modify procedures or solutions.<br/>
    This document provides requirements for automated coexistence management systems.<br/>
    This document provides requirements for:<br/>
    • determination of the coexistence state,<br/>
    • automated coexistence management procedures,<br/>
    • CC amendments for existing wireless communication solutions,<br/>
    • CC functions that coordinate legacy and new wireless communication systems.<br/>
    This document is not restricted to a specific radio frequency range nor is it restricted to a specific wireless communication technology.
- language: fr
  script: Latn
  content: |-
    l’IEC 62657-4:2022 spécifie un concept et des méthodes de coordination centrale (CC) des applications d’automatisation à l’aide de communications sans fil, afin d’étendre la gestion de coexistence selon l’IEC 62657-2. Elle établit les éléments de système, les interfaces et les relations permettant d’assurer une coordination centrale. Les fonctions, les données et les échanges de données permettant d’évaluer et de maintenir l’état de coexistence sont spécifiés.<br/>
    Le présent document spécifie l’approche du point de coordination central (CCP) comme exemple d’utilisation de la description formelle donnée dans l’IEC 62657-3.<br/>
    Le présent document vise à développer, mettre en œuvre ou modifier des procédures ou solutions.<br/>
    Le présent document fournit les exigences relatives aux systèmes automatisés de gestion de coexistence.<br/>
    Il fournit les exigences relatives:

    	à la détermination de l’état de coexistence;
    	aux procédures automatisées de gestion de coexistence;
    	aux amendements de la coordination centrale pour les solutions de communication sans fil existantes;
    	aux fonctions de coordination centrale qui coordonnent les systèmes de communication sans fil existants et nouveaux.

    Le présent document ne se limite pas à une plage de fréquences radio particulière ni à une technologie de communication sans fil spécifique.
