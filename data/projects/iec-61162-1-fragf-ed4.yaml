abstract:
- language: fr
  script: Latn
  content: La CEI 61162-1:2010 contient les exigences pour la communication des données entre les instruments maritimes électroniques, les équipements de navigation et de radiocommunications lorsqu'ils sont interconnectés via un système approprié. La présente partie de la CEI 61162 est destinée à supporter l'émission unidirectionnelle de données série entre un émetteur unique et un ou plusieurs récepteurs. Ces données sont au format ASCII imprimable et peuvent inclure des informations telles que la position, la vitesse, la profondeur, l'allocation de fréquences, etc. Les messages types peuvent être de longueur comprise entre environ 11 et 79 caractères au maximum et nécessitent généralement une émission pas plus rapidement qu'un seul message à la seconde. Les définitions électriques de la présente norme ne sont pas destinées à gérer les applications à large bande passante comme les radars ou l'imagerie vidéo, ou encore les bases de données intensives et les applications de transfert de fichiers. En l'absence de disposition garantissant l'émission des messages et compte tenu de la capacité limitée de vérification des erreurs, il convient que la présente norme soit utilisée avec précaution dans toutes les applications de sécurité.
