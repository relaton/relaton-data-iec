abstract:
- language: en
  script: Latn
  content: |-
    IEC 60095-8:2026 is applicable to lead acid batteries with a nominal voltage of 12 V, for automobile passenger cars applications, used as auxiliary energy storage and power source in vehicles, but not featuring the classical function of engine starting or cranking. This includes applications in battery-electric vehicles, as well as in vehicles with an internal combustion engine (ICE) that is started by another (12 V, 48 V or high-volt) battery. This document can be used for batteries with auxiliary or backup purposes.<br/>
    This document specifies:<br/>
    – the general requirements; and<br/>
    – the essential functional characteristics, relevant test methods and results required for several classes of batteries in accordance with:<br/>
    • the general type of application;<br/>
    • the type of product; and<br/>
    • the categories as defined in 4.1.
