abstract:
- language: en
  script: Latn
  content: |-
    IEC 63409-1:2026 specifies requirements for the testing of power conversion equipment (PCE) for use in photovoltaic power systems (PV systems) with or without DC-coupled electrical energy storage devices. This part of the IEC 63409 series provides general information on how to use the series and on how it is structured. Other parts of the IEC 63409 series provide the detailed procedures for testing of the PCE.<br/>
    This series applies to the PCE composing grid-tied PV systems, grid-tied PV systems with storage, and grid-tied PV systems with storage and backup, which is also referred to as a grid-connected power converter (GCPC). Those types of PV systems with possible elements are described in Annex A. Examples of the configuration of grid-tied PV systems are illustrated in Annex B.<br/>
    The reports and results of tests defined in this series of standards can be used to demonstrate the behaviour and response to grid events. Any part of the test series and any selection (within each part) of tests can be performed and reported separately. The tests are defined for a single PCE.
