abstract:
- language: en
  script: Latn
  content: |-
    IEC 60794-1-205:2026 specifies test procedures to establish uniform requirements for the environmental performance of optical cables. The tests determine the ability of optical cables to prevent water penetration along a specified length.<br/>
    In this document, it is assumed that water can penetrate through the cable due to sheath damage, or through the cable end, if water penetrates into the protective housing through the closure.<br/>
    This edition includes the following significant technical changes with respect to IEC 60794‑1‑22:2017:<br/>
    a) Revision of the contents of 9 Details to be specified and 10 Details to be reported in comparison to IEC 60794‑1‑22:2017, 5.6 and 5.7.
