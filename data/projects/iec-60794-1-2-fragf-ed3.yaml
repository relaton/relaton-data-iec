abstract:
- language: fr
  script: Latn
  content: |-
    L'IEC 60794-1-2:2013 s'applique aux câbles à fibres optiques destinés à être utilisés avec les équipements de télécommunication et les dispositifs employant des techniques similaires, et aux câbles constitués d'une combinaison de fibres optiques et de conducteurs électriques. L'objet de la présente norme est de fournir à l'utilisateur final une table des références croisées entre la deuxième édition de CEI 60794-1-2 et la présente troisième édition, qui a été établie après scindement de la CEI 60794-1-2, à savoir:<br/> 
    CEI 60794-1-2, Table des références croisées<br/>
    CEI 60794-1-20, Généralités and définitions<br/>
    CEI 60794-1-21, Essais mécaniques<br/>
    CEI 60794-1-22, Essais environnementaux<br/>
    CEI 60794-1-23, Eléments du câble<br/> 
    CEI 60794-1-24, Essais électriques<br/>
    Mots clés: table des références croisées, fibres optiques destinés à être utilisés avec les équipements de télécommunication
