abstract:
- language: en
  script: Latn
  content: |-
    IEC 62041: 2017(E) is applicable to transformers, reactors and power supply units covered by the IEC 61558 series of standards. This document deals with the electromagnetic compatibility requirements for emission and immunity within the frequency range 0 Hz to 400 GHz. No tests need to be performed at frequencies where no requirements are specified.<br/>
    This third edition cancels and replaces the second edition published in 2010. It constitutes a technical revision.<br/>
    This edition includes the following significant technical changes with respect to the previous edition:<br/>

    	
    		the inclusion of a clause on tests in series production;
    	
    		the inclusion of a new clause on measurement uncertainly, and
    	
    		the status of a harmonized standard for this third edition.

    It has the status of a product family EMC standard in accordance with IEC Guide 107:2009,<br/>
    <em>Electromagnetic compatibility – Guide to the drafting of electromagnetic compatibility publications.</em><br/>
    This bilingual version (2018-01) corresponds to the monolingual English version, published in 2017-08.<br/>
    The French version of this standard has not been voted upon.
- language: fr
  script: Latn
  content: |-
    Le présent document s’applique aux transformateurs, bobines d’inductance et aux blocs d’alimentation couverts par la série de normes IEC 61558. Le présent document traite des exigences de compatibilité électromagnétique pour l’émission et l’immunité dans la bande de fréquences comprise entre 0 Hz et 400 GHz. Aucun essai n’est nécessaire aux fréquences pour lesquelles aucune exigence n’est spécifiée.<br/>
    Cette troisième édition annule et remplace la deuxième édition parue en 2010. Elle constitue une révision technique.<br/>
    Cette édition inclut les modifications techniques majeures suivantes par rapport à l’édition précédente:<br/>

    	
    		ajout d’un article sur les essais de production en série;
    	
    		ajout d’un nouvel article sur l’incertitude des mesures, et
    	
    		statut de norme harmonisée pour cette troisième édition.

    Elle a le statut d’une norme CEM de famille de produits conformément au Guide IEC 107:2009,<br/>
    <em>Compatibilité électromagnétique – Guide pour la rédaction des publications sur la compatibilité électromagnétique.</em><br/>
    La présente version bilingue (2018-01) correspond à la version anglaise monolingue publiée en 2017-08.  <br/>
    La version française de cette norme n'a pas été soumise au vote.
