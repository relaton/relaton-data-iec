abstract:
- language: en
  script: Latn
  content: |-
    IEC 60092-504:2026 specifies requirements for electrical, electronic and programmable equipment supporting essential services intended for automation, control, monitoring, alert, safety and protection systems. This fifth edition cancels and replaces the fourth edition published in 2016. This edition constitutes a technical revision.<br/>
    This edition includes the following significant technical changes with respect to the previous edition:<br/>
    a) aligned bridge and machinery alert references throughout the document;<br/>
    b) transfer of EMC items to IEC 60533 throughout the document;<br/>
    c) update of power management and energy management (9.5 and 9.6).
