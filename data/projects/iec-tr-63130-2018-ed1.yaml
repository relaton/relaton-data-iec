  content: IEC TR 63130:2018(E) describes the current state of experts’ opinions on the standardization of metal halide lamps to cover the relevant parameters for hot restrike and for dimming in combination with low frequency square wave ballasts. It provides guidelines for supplementing or modifying IEC 61167 in order that these conditions are covered.
