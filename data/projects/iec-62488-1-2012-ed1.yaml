abstract:
- language: en
  script: Latn
  content: IEC 62488-1:2012 applies to the planning of analogue and digital power line carrier systems operating over EHV/HV/MV electricity grids. The object of this standard is to establish the planning of the services and performance parameters for the operational requirements to transmit and receive data efficiently over power networks. The transmission media used by the different electricity supply industries will include analogue and digital systems together with more common communication services including national telecommunications authorities, radio links and fibre optic networks and satellite networks. With the developments in communication infrastructures over the last two decades and the ability of devices connected in the electricity communications network to internally and externally communicate, there is a variety of architectures to use in the electricity distribution network to provide efficient seamless communications.
- language: fr
  script: Latn
  content: La CEI 62488-1:2012 s'applique à la conception des systèmes à courants porteurs de lignes d'énergie analogiques et numériques fonctionnant sur des réseaux d'électricité EHT/HT/MT. Elle a pour objet de définir la conception des services et des paramètres de performance relatifs aux exigences opérationnelles en matière d'émission et de réception efficace des données sur les réseaux électriques. Le support de transmission utilisé par les différentes compagnies d'électricité comprend des systèmes analogiques et numériques accompagnés de services de communication plus courants, tels que les autorités de télécommunications nationales, les liaisons radio, les réseaux à fibres optiques et les réseaux par satellite. Grâce aux développements des infrastructures de communication au cours des deux dernières décennies et à la capacité des dispositifs connectés au réseau de communication électriques à communiquer en interne et en externe, il existe une grande variété d'architectures utilisables dans le réseau de distribution d'électricité pour fournir des communications sans raccord efficaces.
