abstract:
- language: en
  script: Latn
  content: This report identifies fundamental considerations to be taken into account in developing standards to ensure the safety of medical electrical equipment. It follows closely recommendations of ISO/IEC Guide 51 and expands on matters which are unique to, or critical in, the application of medical electrical equipment.
- language: fr
  script: Latn
  content: Ce rapport technique fait état des considérations fondamentales dont il faut tenir compte pour l'établissement des normes devant assurer la sécurité des appareils électromédicaux. Il suit de près les recommandations du Guide 51, et développe les sujets qui sont seuls propres à l'utilisation des appareils électromédicaux, ou critiques pour cette utilisation.
