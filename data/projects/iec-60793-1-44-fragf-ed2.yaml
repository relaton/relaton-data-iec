abstract:
- language: fr
  script: Latn
  content: La CEI 60793-1-44:2011 établit des exigences uniformes pour mesurer la longueur d'onde de coupure des fibres optiques unimodales, contribuant ainsi au contrôle des fibres et câbles dans des relations commerciales. La présente norme donne les méthodes de mesure de la longueur d'onde de coupure de fibre et de câble. Cette deuxième édition annule et remplace la première édition parue en 2001. Elle constitue une révision technique. La principale modification par rapport à l'édition précédente consiste en la suppression de l'Annexe D. Il convient de lire la présente norme conjointement avec la CEI 60793-1-1.
