abstract:
- language: fr
  script: Latn
  content: |-
    La CEI 62305-3:2010 spécifie les exigences pour la protection d'une structure contre les dommages physiques par un système de protection contre la foudre (SPF) et pour la protection contre les blessures d'êtres vivants dues aux tensions de contact et de pas à proximité d'un SPF (voir la CEI 62305-1). Cette deuxième édition annule et remplace la première édition, parue en 2006, dont elle constitue une révision technique. La présente édition comprend les modifications techniques importantes suivantes par rapport à la précédente édition:<br/>
    1) Les épaisseurs minimales des tôles ou canalisations métalliques indiquées dans le Tableau 3 pour les dispositifs de capture sont supposées comme non capables d'éviter les problèmes de points chauds.<br/>
    2) L'acier comportant un dépôt électrolytique de cuivre est introduit comme matériau adapté aux SPF.<br/>
    3) Certaines surfaces de section des conducteurs du système de protection ont été légèrement modifiées.<br/>
    4) A des fins de liaison, des éclateurs sont utilisés pour les installations métalliques, tandis que le parafoudre est utilisé pour les réseaux internes.<br/>  
    5) Deux méthodes simplifiée et détaillée sont fournies pour l'évaluation de la distance de séparation.<br/>
    6) Les mesures de protection contre les blessures d'êtres vivants dues à un choc électrique sont également prises en compte à l'intérieur de la structure.<br/>
    7) Une information plus complète concernant le système de protection contre la foudre (SPF) dans le cas de structures présentant un risque d'explosion est fournie à l'Annexe D (normative).<br/>
    La présente version bilingue (2012-06) correspond à la version anglaise monolingue publiée en 2010-12.
