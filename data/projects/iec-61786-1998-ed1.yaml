abstract:
- language: en
  script: Latn
  content: Provides guidance for measuring the values of magnetic and electric fields with regard to exposure of human beings. The frequency range spans 15 Hz to 9 kHz. The standard covers magnetic fields with magnitudes from 100 nT to 100 mT, and electric fields from 1 V/m to 50 kV/m. Sources of fields include devices that operate at power frequencies and produce frequency harmonics. Other devices produce fields independent of the power frequencies.
- language: fr
  script: Latn
  content: Fournit des recommendations pour la mesure des champs magnétiques et électriques dans leur rapport à l'exposition humaine. Les fréquences couvrent entre 15 Hz et 9 kHz. Les plages d'ampitudes sont de 100 nT à 100 mT pour les champs magnétiques et de 1 V/m à 50 kV/m pour les champs électriques. Parmi les sources possibles sont des dispositifs qui fonctionnent aux fréquences industrielles et produisent des fréquences harmoniques. D'autres dispositifs produisent des champs indépendants de la fréquence industrielle.
