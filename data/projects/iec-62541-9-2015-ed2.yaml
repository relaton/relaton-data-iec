abstract:
- language: en
  script: Latn
  content: |-
    IEC 62541-9:2015 specifies the representation of Alarms and Conditions in the OPC Unified Architecture. Included is the Information Model representation of Alarms and Conditions in the OPC UA address space. This second edition cancels and replaces the first edition published in 2012 and constitutes a technical revision. This edition includes the following changes:<br/>
    - added section to describe expect behaviour for A&amp;C servers and the associated information model in the case of redundancy or communication faults;<br/>
    - changed the DialogConditionType to be not abstract since it is expect that instance of this type will exist in the system;<br/>
    - updated ConditionRefresh Method to allow the use of the well know NodeIds associated with the types for the MethodId and ConditionId instead of requiring the call to use only the MethodId and ConditionId that is part of an instance;<br/>
    - Fixed ExclusiveLimitStateMachineType and ShelvedStatemachineType to be sub-types of FinitStateMachineType not StateMachineType.
- language: fr
  script: Latn
  content: |-
    L'IEC 62541-9:2015 spécifie la représentation des Alarms (alarmes) et des Conditions dans l'architecture unifiée OPC, y compris la représentation du Information Model (modèle d'informations) relative aux Alarms et Conditions dans l'espace d'adresses d'OPC UA. Cette deuxième édition annule et remplace la première édition parue en 2012. Elle constitue une révision technique. Cette édition inclut les modifications suivantes:<br/>
    - ajout d'une section pour décrire le comportement attendu pour les serveurs A&amp;C et le modèle d'informations associé en cas de redondance ou de défauts de communication;<br/>
    - modification du DialogConditionType afin qu'il ne soit pas abstrait;<br/>
    - mise à jour de la méthode ConditionRefresh pour permettre l'utilisation des NodeIds bien connus associés aux types pour MethodId et ConditionId;<br/>
    - ExclusiveLimitStateMachineType et ShelvedStatemachineType déclarés être des sous-types de FinitStateMachineType, et non de StateMachineType.
