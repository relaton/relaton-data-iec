abstract:
- language: en
  script: Latn
  content: IEC 62343-1:2016 provides a performance standard of general conditions for dynamic modules. All dynamic modules should satisfy required performance defined in individual performance standards on the general conditions defined in this document. Additional conditions may be included in individual performance standards.
- language: fr
  script: Latn
  content: |-
    IEC 62343-1:2016 fournit une norme de performance sur les conditions générales pour des modules dynamiques. Il convient que tous les modules dynamiques satisfassent aux performances exigées définies dans des normes de performance individuelles sur les conditions générales définies dans le présent document. Des conditions complémentaires peuvent être incluses dans des normes de performance individuelles.<br/>
