- language: en
  script: Latn
  content: IEC 62912:2015 gives requirements for direct current relays intended for safety-related applications in railway signalling installations. This International Standard is applicable to monostable relays of type N and type C.
- language: fr
  script: Latn
  content: L'IEC 62912:2015 établit des exigences pour les relais à courant continu destinés aux applications liées à la sécurité dans les installations de signalisation ferroviaires. La présente Norme Internationale est applicable aux relais monostables de type N et de type C.
