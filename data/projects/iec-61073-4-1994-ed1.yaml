abstract:
- language: en
  script: Latn
  content: Covers the general requirements and the minimum quality assessment procedure for fusion splices. All dimensional and optical performance requirements are to be defined in the appropriate detail specification. Blank detail specifications for permanent and separable mechanical single and multiple fibre splices are included.
- language: fr
  script: Latn
  content: Couvre des prescriptions générales et les procédures minimales d'assurance de la qualité pour les épissures mécaniques. Toutes les conditions relatives aux protriétés dimensionnelles et optiques seront données dans la spécification pariculière concernée. Sont incluses les spécifications particulières-cadre concernant les épissures mécaniques permanentes de monofibre et de fibres multiples.
