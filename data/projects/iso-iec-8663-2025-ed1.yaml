  script: Latn
  content: ISO/IEC 8663:2025 specifies the terms and definitions commonly used in the field of brain–computer interface (BCI), including basic concepts and classifications of BCI, hardware, experiment setups and protocols used in BCI, related neuroscience concepts of BCI (e.g. coding and decoding, feedback and stimulation), and its applications.
