abstract:
- language: en
  script: Latn
  content: IEC 60601-2-41:2009 applies to the basic safety and essential performance of surgical luminaires and luminaires for diagnosis. It amends and supplements IEC 60601-1 (third Edition 2005), hereinafter referred to as the general standard. This second edition cancels and replaces the first edition published in 2000. This edition constitutes a technical revision to be consistent with the third edition of the IEC 60601-1.
- language: fr
  script: Latn
  content: La CEI 60601-2-41:2009 s'applique à la sécurité de base et aux performances essentielles des éclairages chirurgicaux et des éclairages de diagnostic. Elle modifie et complète la CEI 60601-1 (troisième édition 2005), appelée norme générale dans la présente Norme. Cette deuxième édition annule et remplace la première édition publiée en 2000. Cette édition constitue une révision technique permettant l'alignement de la norme sur la troisième édition de la CEI 60601-1.
