abstract:
- language: en
  script: Latn
  content: Applies to failure mechanisms for interconnnecting devices and passive components. It introduces a choice of relevant tests from the IEC 61300 series tests for each known failure mechanism and failure effects. See IEC 62005-5 for the extension of severity for environmental categories.
- language: fr
  script: Latn
  content: S'applique aux mécanismes de défaillance associés aux dispositifs d'interconnexion et aux composants passifs. Elle donne le choix des essais appropriés de la série CEI 61300 pour chaque mécanisme et effet de défaillance connus. Voir CEI 62005-5 pour les extensions de sévérité en fonction de catégorie d'environnement.
