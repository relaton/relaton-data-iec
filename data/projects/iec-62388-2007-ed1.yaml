abstract:
- language: en
  script: Latn
  content: Specifies the minimum operational and performance requirements, methods of testing and required test results conforming to performance standards not inferior to those adopted by the IMO in Resolution MSC.192(79). Covers the testing of all SOLAS shipborne radar equipment. Individual equipment may be tested for a specific category of vessel. Provides a summary of the categories and basic differential capabilities for each category.
