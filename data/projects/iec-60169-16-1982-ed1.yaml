abstract:
- language: en
  script: Latn
  content: Concerns pin and socket r.f. coaxial connectors, with screw coupling mechanism, for low to medium power applications. Three versions of this connector, commonly known as the 'Type N' are included, each version being mateable with each of the others.
- language: fr
  script: Latn
  content: Concerne les connecteurs coaxiaux mâles et femelles, avec verrouillage à vis, pour fréquences radioélectriques et applications allant de la basse à la moyenne puissance. Trois versions de ce connecteur, communément connu comme étant du «type N», figurent dans cette norme, chaque version étant accouplable à chacune des autres versions.
