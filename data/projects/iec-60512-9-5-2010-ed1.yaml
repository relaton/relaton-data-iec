abstract:
- language: en
  script: Latn
  content: IEC 60512-9-5:2010 when required by the detail specification, is used for testing connectors within the scope of technical committee 48. It may also be used for similar devices when specified in a detail specification. The object of this standard is to detail a standard method for subjecting solderless connections to thermal stress conditioning by cyclic current loading.
- language: fr
  script: Latn
  content: La CEI 60512-9-5:2010 est utilisée pour les essais des connecteurs du domaine d'activité du comité d'études 48, lorsque la spécification particulière l'exige. Elle peut également être utilisée pour des dispositifs similaires lorsqu'une spécification particulière le stipule. L'objet de cette norme est de définir une méthode normalisée pour soumettre les connexions sans soudure à une contrainte thermique appliquée au moyen d'une charge en courant de façon cyclique.
