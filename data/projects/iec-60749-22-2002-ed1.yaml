  content: Applicable aux dispositifs à semiconducteurs (dispositifs discrets et circuits intégrés), cet essai permet de mesurer la robustesse d'un contact soudé ou de déterminer sa conformité à des exigences de robustesse spécifiées. Le contenu du corrigendum d'août 2003 a été pris en considération dans cet exemplaire.
