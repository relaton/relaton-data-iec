abstract:
- language: en
  script: Latn
  content: |-
    IEC Guide 118:2017(E) is intended for technical committees and gives guidance on how to consider energy efficiency aspects when preparing IEC publications.<br/>
    Its purpose is:<br/>
    - to describe the contributions of IEC publications to energy efficiency;<br/>
    - to describe the concept of an energy efficiency aspect;<br/>
    - to provide categories of energy efficiency aspects and a list of energy efficiency aspects to be considered by technical committees.<br/>
    This Guide:<br/>
    - helps in harmonizing the approach to energy efficiency;<br/>
    - raises awareness that provisions in IEC publications can affect the energy performance of the product itself (taken individually) and of the entire application (embedding the product), in both negative and positive ways;<br/>
    - helps technical committees to identify energy efficiency aspects that contribute to energy efficiency improvement of the product itself and of the entire application;<br/>
    - promotes the use of a systematic approach when addressing energy efficiency in the context of standardization;<br/>
    - promotes the use of a systems approach when addressing energy efficiency aspects in the context of standardization.
