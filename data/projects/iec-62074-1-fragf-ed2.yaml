abstract:
- language: fr
  script: Latn
  content: |-
    L'IEC 62074-1:2014 s'applique aux dispositifs de multiplexage par répartition en longueur d'onde (WDM) à fibres optiques, dont les caractéristiques générales sont les suivantes:<br/>
    - ils sont passifs, en ce qu'ils ne contiennent aucun élément optoélectronique ni autre élément de transduction;<br/>
    - mais ils peuvent utiliser une commande de température uniquement dans le but de stabiliser les caractéristiques des dispositifs;<br/>
    - ils excluent toute fonction de commutation optique ils possèdent au moins trois ports pour l'entrée et/ou la sortie de la puissance optique et partagent la puissance optique entre ces ports d'une façon prédéterminée en fonction de la longueur d'onde;<br/>
    - les ports sont des fibres optiques ou des connecteurs à fibres optiques. La présente norme spécifie les exigences uniformes pour: les propriétés optiques, mécaniques et environnementales. Cette deuxième édition annule et remplace la première édition publiée en 2009; elle constitue une révision technique. Cette édition inclut les modifications techniques majeures suivantes par rapport à l'édition précédente:<br/>
    - mise à jour significative des définitions;<br/>
    - ajout des Annexes informatives C à G présentant des exemples d'informations techniques relatives aux dispositifs WDM.
    Mots clés: dispositifs de multiplexage par répartition en longueur d'onde (WDM) à fibres optiques, exigence pour les propriétés optiques, mécaniques et environnementales
