abstract:
- language: en
  script: Latn
  content: This standard defines the main performance characteristics of electric blankets and specifies methods for measuring these characteristics, for the information of users. This standard does not specify values for performance characteristics.
- language: fr
  script: Latn
  content: Cette norme définit les principales caractéristiques d'aptitude à la fonction des couvertures chauffantes électriques et spécifie les méthodes pour la véfification de ces caractéristiques, dans un dessein d'information du consommateur. La présente norme ne traite pas des valeurs exigées pour les caractéristiques d'aptitude à la fonction.
