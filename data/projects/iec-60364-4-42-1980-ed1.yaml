abstract:
- language: en
  script: Latn
  content: 'Specifies methods of protection for persons, fixed equipment, and fixed material adjacent to electrical equipment, against: harmful effect of heat developed by electrical equipment or thermal radiation (particularly combustion or degradation of materials) - risk of burns - impairment of the safe function of installed equipment.'
- language: fr
  script: Latn
  content: 'Spécifie les modes de protection des personnes, des matériels fixes et des objets voisins des matériels électriques contre: les effets thermiques dangereux dus au fonctionnement des matériels électriques ainsi que ceux des rayonnements thermiques (notamment combustion et dégradation de matériaux); les risques de brûlures; l''atteinte à la sécurité de fonctionnement des matériels électriques installés.'
