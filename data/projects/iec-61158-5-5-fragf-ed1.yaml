abstract:
- language: fr
  script: Latn
  content: 'L''IEC 61158-5-5:2007 défini les services fournis à: l''utilisateur de FAL à la frontière entre l''utilisateur et la couche application du modèle de référence de bus de terrain; et la Gestion des systèmes au niveau de la frontière entre la couche application et la Gestion des systèmes selon le modèle de référence de bus de terrain. Elle spécifie la structure et les services de la couche application des bus de terrain de Type 2, en conformité avec le Modèle de référence de base de l''OSI (ISO/CEI 7498) et la structure de la couche application de l''OSI (ISO/CEI 9545). Cette première édition et les normes connexes de la sous-série CEI 61158-5 annulent et remplacent la CEI 61158-5:2003. Cette édition de la présente partie constitue une révision éditoriale. Elle inclut les modifications majeures suivantes par rapport à l''édition précédente: suppression de l''ancien bus de terrain de type 6 qui n''est plus adapté au marché; ajout de nouveaux types de bus de terrain; éclatement de la partie 5 de la troisième édition en plusieurs parties numérotées 5-2, 5-3. La présente version bilingue (2014-06) correspond à la version anglaise monolingue publiée en 2007-12.'
