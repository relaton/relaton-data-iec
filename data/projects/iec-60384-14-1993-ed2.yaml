abstract:
- language: en
  script: Latn
  content: |-
    Prescribes preferred ratings and characteristics, selects from IEC
    60384-1 (1982) the appropriate quality assessment procedures, tests
    and measuring methods and to give general performance requirements
    for this type of capacitor. Replaces IEC 60161.
- language: fr
  script: Latn
  content: |-
    Prescrit les valeurs préférentielles des caractéristiques, choisit
    dans la CEI 60384-1 (1982) les procédures d'assurance de la qualité
    et les méthodes d'essai et de mesure appropriées et fixe les
    exigences générales pour ce type de condensateur.

    Remplace la CEI 161.
