abstract:
- language: en
  script: Latn
  content: |-
    IEC TS 60071-4:2026, which is a technical specification, gives guidance on conducting insulation co-ordination studies which propose internationally recognized recommendations:<br/>
    • for the computational modelling of electrical systems, and<br/>
    • for the implementation of deterministic and probabilistic methods adapted to the use of numerical programmes.<br/>
    Its objective is to give information in terms of methods, modelling and examples that support the application of the approaches presented in IEC 60071-2:2023, and for the selection of insulation levels of equipment or installations, as defined in IEC 60071-1:2019
