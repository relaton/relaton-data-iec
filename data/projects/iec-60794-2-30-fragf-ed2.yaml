abstract:
- language: fr
  script: Latn
  content: |-
    La CEI 60794-2-30:2008 est une spécification de famille qui couvre les câbles à rubans de fibres optiques pour usage intérieur. Les exigences de la spécification intermédiaire CEI 60794-2 sont applicables aux câbles couverts par la présente norme. Cette deuxième édition annule et remplace la première édition publiée en 2003 dont elle constitue une révision technique. Les principales modifications sont présentées ci-après:<br/>
    - le paragraphe 5.4 a été détaillé en fonction du type de fibre;<br/>
    - l'Annexe A a été ajoutée pour montrer un exemple de construction de câble;<br/>
    - l'Annexe B a été ajoutée. Elle constitue une spécification particulière cadre incluant les exigences et le classement MICE;<br/>
    - une bibliographie a été ajoutée. La présente norme doit être utilisée conjointement avec la CEI 60794-1-1, la CEI 60794-1-2 et la CEI 60794-2.
    Mots clés: câbles à rubans de fibres optiques pour usage intérieur
