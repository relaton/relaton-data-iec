abstract:
- language: fr
  script: Latn
  content: L'IEC 61784-5-6:2007 définit une couche de communication relative à la sécurité (services et protocole) fondée sur la CPF 1 de la CEI 61784-1 et les types 1 et 9 de la CEI 61158. Elle identifie les principes applicables aux communications de sécurité fonctionnelle définies dans la CEI 61784-3, et appropriés à cette couche de communication de sécurité. La présente version bilingue (2014-12) correspond à la version anglaise monolingue publiée en 2007-12.
