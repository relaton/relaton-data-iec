abstract:
- language: fr
  script: Latn
  content: |-
    IEC 60454-3-2: 2006 contient les exigences relatives aux: Rubans en polyester avec un adhésif en caoutchouc thermodurcissable, caoutchouc thermoplastique ou en acrylique réticulé. Les matériaux qui sont conformes à cette spécification satisfont à des niveaux de performances établis. Cependant, il convient que le choix d'un matériau par un utilisateur et pour une application particulière soit fondé sur les exigences réelles nécessaires pour obtenir les performances satisfaisantes pour cette application, et non pas fondé sur cette seule spécification. Cette troisième édition de la CEI 60454-3-2 remplace la deuxième édition, parue en 1998, et son contenu est consolidé avec le texte de la CEI 60464-3-3 (1998). Elle constitue une révision technique.
    Mots clés: Rubans en polyester avec un adhésif en caoutchouc thermodurcissable, caoutchouc thermoplastique ou en acrylique réticulé
