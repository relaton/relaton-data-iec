abstract:
- language: en
  script: Latn
  content: IEC 63041-2:2017 is applicable to piezoelectric chemical sensors mainly used in the field of biological, medical, gas and environmental sciences. It provides users with technical guidelines on biochemical sensors as well as basic knowledge of common chemical sensors.
- language: fr
  script: Latn
  content: "<p>L'IEC 63041-2:2017 s'applique aux capteurs chimiques piézoélectriques principalement utilisés dans le domaine biologique, médical, des gaz et des sciences environnementales. Elle donne aux utilisateurs des lignes directrices techniques relatives aux capteurs biochimiques, ainsi que les connaissances concernant les capteurs chimiques communs.</p>"
