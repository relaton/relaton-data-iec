abstract:
- language: en
  script: Latn
  content: This international standard is applicable to instruments measuring radiant power emitted from sources which are typical for the fibre-optic communications industry. The standard describes the calibration of power meters to be performed by calibration laboratories or by power meter manufacturers.
- language: fr
  script: Latn
  content: La présente Norme internationale s'applique aux appareils qui mesurent la puissance rayonnante émise par des sources typiques pour l'industrie des communications par fibres optiques. Cette norme décrit l'étalonnage des wattmètres, qui doit être effectué par des laboratoires d'étalonnage ou par des fabricants de wattmètres.
