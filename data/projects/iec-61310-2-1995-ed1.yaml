- language: en
  script: Latn
  content: Specifies requirements for the marking of machinery. Gives general rules for identification of machinery, for safe use related to mechanical and electrical hazards, and for the avoidance of hazards arising from incorrect connections.
- language: fr
  script: Latn
  content: Spécifie des exigences concernant le marquage des machines. Définit les règles générales de marquage pour l'identification des machines, pour leur utilisation sûre, relatives aux risques mécaniques et électriques, et pour éviter les risques liés à des liaisons erronées.
