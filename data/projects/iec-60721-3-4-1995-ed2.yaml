abstract:
- language: en
  script: Latn
  content: |-
    IEC 60721-3-4:1995 Classifies groups of environmental parameters and the severities to which a product may be exposed under use conditions, including periods of erection work, downtime, maintenance and repair, when mounted for stationary use at locations which are non-weatherprotected. 

    It has the status of a horizontal standard in accordance with IEC Guide 108.
- language: fr
  script: Latn
  content: |-
    IEC 60721-3-4:1995 Classifie les groupements des agents d'environnement et de leurs sévérités, auxquels peut être exposé un produit dans les conditions de son utilisation, y compris les périodes de montage, d'arrêt, de maintenance et de réparation, lorsqu'il est monté pour une utilisation à poste fixe dans les endroits non protégés contre les intempéries. 

    Elle a le statut de norme horizontale conformément au Guide IEC 108.
