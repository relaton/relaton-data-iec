abstract:
- language: fr
  script: Latn
  content: La CEI 61158-4-12 spécifie les procédures de transfert de données et d'informations de commande d'une entité utilisateur de liaison de données vers une ou plusieurs entités utilisateur; la structure des DLPDU utilisées par le protocole de la présente norme pour le transfert des données et des informations de commande, et leur représentation sous forme d'unités de données d'interface physique. Cette seconde édition annule et remplace la première édition publiée en 2007 et constitue une révision technique. Les principales modifications par rapport à l'édition précédente sont la réparation des erreurs et l'amélioration rédactionnelle. La présente version bilingue (2012-05) correspond à la version anglaise monolingue publiée en 2010-08.
