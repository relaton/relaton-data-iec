abstract:
- language: en
  script: Latn
  content: |-
    Deals with safety philosophy, quality assurance, engineering
    integrity and specifies requirements for the safety of wind
    turbines having a swept area smaller than 40m2 and generating at a
    voltage below 1000v a.c. or 1500v d.c.
- language: fr
  script: Latn
  content: |-
    Traite de la philosophie relative à la sécurité, l'assurance
    qualité et l'intégrité de l'ingénierie et décrit les prescriptions
    relatives à la sécurité des aérogénérateurs ayant une surface
    balayée inférieure à 40m2 et fonctionnant à une tension en dessous
    de 1000v c.a. et 1500v c.c.
