  content: Gives requirements for properties of phenolic cellulose paper copper-clad laminated sheet, high electrical quality, in thicknesses of 0.5 mm up to 6.4 mm. The sheet consists of an insulating base phenolic resin bonded cellulose paper laminate with metal foil bonded to one or both sides.
