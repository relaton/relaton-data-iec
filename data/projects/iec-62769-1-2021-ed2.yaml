  script: Latn
  content: IEC 62769-1:2021 describes the concepts and overview of the Field Device Integration (FDI) specifications. The detailed motivation for the creation of this technology is also described (see 4.1). Reading this document is helpful to understand the other parts of this multi-part standard.
