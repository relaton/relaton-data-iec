abstract:
- language: en
  script: Latn
  content: Describes the requirements for resistance temperature detectors (RTDs) suitable for nuclear power plant (NPP) services. The requirements of RTDs include design, materials, manufacturing, testing, calibration, procurement, and inspection.
- language: fr
  script: Latn
  content: Etablit les exigences applicables aux sondes à résistance (SR) aptes à fonctionner en centrales nucléaires. Ces exigences applicables aux SR sont relatives à la conception, aux matériaux de construction, à la fabrication, aux essais, à l'étalonnage, à l'approvisionnement et aux inspections.
