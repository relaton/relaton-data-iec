  content: Spécifie les prescriptions relatives aux câbles à fibres optiques unimodales destinés, en premier lieu, à être utilisés dans les réseaux publics de télécommunication. Il peut être envisagé de considérer d'autres types d'applications nécessitant des câbles d'un type similaire.
