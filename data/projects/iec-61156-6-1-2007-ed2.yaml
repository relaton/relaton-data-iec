abstract:
- language: en
  script: Latn
  content: 'Describes symmetrical pair/quad cables intended for working area cabling in class D, E, EA, F and FA channels (Cat 5e, Cat 6, Cat 6A, Cat 7, Cat 7A) as defined in ISO/IEC 11801 and ISO/IEC 24702. Includes additional recommended environmental characteristics and severities, which are derived from the environmental classifications that are specified for cabling for industrial environments. includes the following significant technical changes with respect to the previous edition: a) new requirements for new cables Cat6A, Cat7A for 10 GBase-T applications; b) revised requirements and tests for the cables'
