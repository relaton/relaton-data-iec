abstract:
- language: en
  script: Latn
  content: This part of IEC 61347 specifies particular safety requirements for starting devices (starters other than glow starters and ignitors) for fluorescent and other discharge lamps for use on a.c. supplies up to 1 000 V at 50 Hz or 60 Hz which produce starting pulses not greater than 100 kV and which are used in combination with lamps and ballasts covered in IEC 60081, IEC 60188, IEC 60192, IEC 60662, IEC 60901, IEC 61167, IEC 61195, IEC 61199, IEC 61347-2-8 and IEC 61347-2-9. It does not apply to glow starters or starting devices which are incorporated in discharge lamps or which are manually operated. Preheat transformers for fluorescent lamps are covered by IEC 61347-2-8. This first edition of IEC 61347-2-1, together with IEC 61347-1, cancels and replaces the second edition of IEC 60926, published in 1995, and constitutes a minor revision. This standard shall be used in conjunction with IEC 61347-1. It was established on the basis of the first edition (2000) of that standard.
- language: fr
  script: Latn
  content: La présente partie de la CEI 61347 spécifie les prescriptions de sécurité particulières aux dispositifs d'amorçage (starters autres que starters à lueur et amorceurs) pour lampes à fluorescence et autres lampes à décharge conçus pour être alimentés en courant alternatif de 50 Hz ou 60 Hz jusqu'à 1 000 V produisant des impulsions d'amorçage ne dépassant pas 100 kV, et utilisés en association avec les lampes et ballasts faisant l'objet de la CEI 60081, de la CEI 60188, de la CEI 60192, de la CEI 60662, de la CEI 60901, de la CEI 61167, de la CEI 61195, de la CEI 61199, de la CEI 61347-2-8 et de la CEI 61347-2-9. Elle n'est pas applicable aux starters à lueur ni aux dispositifs d'amorçage incorporés dans les lampes à décharge ou aux dispositifs d'amorçage à commande manuelle. Les transformateurs de préchauffage pour lampes à fluorescence sont traités dans la CEI 61347-2-8. Cette première édition de la CEI 61347-2-1, conjointement avec la CEI 61347-1, annule et remplace la deuxième édition de la CEI 60926, parue en 1995, dont elle constitue une révision mineure. Cette norme doit être utilisée conjointement avec la CEI 61347-1. Elle a été établie sur la base de la première édition (2000) de cette norme.
