  content: Fournit des spécifications de produit pour les câbles à une et deux fibres. Décrit les câbles optiques à une seule fibre pour utilisation intérieure, dans des applications telles que l'équipement de transmission, l'équipement téléphonique, l'équipement de traitement de données, et les réseaux de communication et de transmission.
