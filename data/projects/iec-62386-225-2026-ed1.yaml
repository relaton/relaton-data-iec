abstract:
- language: en
  script: Latn
  content: |-
    IEC 62386-225:2026 is applicable to control gear for emergency lighting applications with additional functionality supporting adaptive emergency escape lighting. This document builds on the digital addressable lighting interface as specified in the IEC 62386 series.<br/>
    This document is applicable to control gear complying with IEC 62386-102 when combined with either IEC 62386-202 or IEC 62386-220.
- language: fr
  script: Latn
  content: |-
    IEC 62386-225:226 s'applique aux appareillages de commande pour les applications d'éclairage de secours avec une fonctionnalité supplémentaire qui prend en charge l'éclairage de sécurité adaptatif. Le présent document enrichit l'interface d'éclairage adressable numérique spécifiée dans la série IEC 62386.<br/>
    Le présent document s'applique aux appareillages de commande conformes à l'IEC 62386‑102 en combinaison avec l'IEC 62386-202 ou l'IEC 62386-220.
