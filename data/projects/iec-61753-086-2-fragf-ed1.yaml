abstract:
- language: fr
  script: Latn
  content: |-
    L'IEC 61753-086-2:2009 contient les sévérités et les exigences minimales initiales de performances, d'essais et de mesure auxquelles un dispositif de réseau optique passif (PON: Passive Optical Network) à répartition en longueur d'onde large (WWDM: Wide Wavelength Division Multiplexing) 1 490 / 1 550 nm en voie descendante et 1 310 nm en voie montante muni de fibres amorces doit répondre afin d'être classé comme conforme aux exigences de la catégorie C (environnements contrôlés), comme défini dans l'Annexe A de la CEI 61753-1. L'Annexe B de la présente norme fournit des informations concernant le fonctionnement des voies descendantes à 1 490 / 1 550 nm et des voies montantes à 1 310 nm. 
    Mots clés: catégorie C (environnements contrôlés), WWDM, PON
