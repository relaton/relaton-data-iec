abstract:
- language: en
  script: Latn
  content: |-
    Applies to the design, manufacture and some installation aspects of an RTPS

    - for use in RADIOTHERAPY TREATMENT PLANNING in human medical practice;

    - that imports data either through input by the OPERATOR or direct 
    from other devices;

    - that outputs data either in printed form for review or direct to other devices;

    - and which is intended to be

    . for NORMAL USE, under the authority of appropriately licensed or QUALIFIED PERSONS, by OPERATORS having the required skills and training;

    . maintained in accordance with the recommendations given in the INSTRUCTIONS FOR USE, and

    . used within the environmental and electrical supply conditions SPECIFIED in the technical descriptions.

    An RTPS is principally a software application, and the object of this standard is to establish the requirements for features, associated documentation, and testing of the software.
- language: fr
  script: Latn
  content: |-
    S'applique à la conception, à la fabrication ainsi qu'à certains aspects de l'installation des SPTR

    - qui sont utilisés en médecine humaine pour la PLANIFICATION DES TRAITEMENTS de RADIOTHERAPIE;

    - qui utilisent des données entrées par l'OPERATEUR ou importées directement depuis d'autres dispositifs;

    - qui produisent des données de sortie qui sont soit imprimées pour être revues, soit exportées directement vers d'autres dispositifs;

    - et qui sont destinés à 

    . être utilisés en UTILISATION NORMALE, sous la responsabilité de PERSONNES QUALIFIEES ou agréées à cet effet, par des OPERATEURS ayant les compétences et la formation nécessaires;

    . être entretenus conformément aux recommandations données dans les INSTRUCTIONS D'UTILISATION, et

    . être utilisés selon les conditions d'environnement et d'alimentation électrique SPECIFIEES dans la description technique.

    Un SPTR est principalement une application logicielle, et la présente norme a pour objet d'établir des prescriptions pour les caractéristiques, pour la documentation associée et pour les essais du logiciel.
