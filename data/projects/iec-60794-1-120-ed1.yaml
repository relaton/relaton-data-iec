abstract:
- language: en
  script: Latn
  content: |-
    IEC 60794-1-120:2026 defines test procedures used to establish uniform requirements for cable storage performance before installation for armoured optical fibre cables. It applies to optical fibre cables for use with telecommunication equipment and devices employing similar techniques, and to cables having a combination of both optical fibres and electrical conductors.<br/>
    This first edition cancels and replaces Method E20 of IEC 60794‑1‑21 published in 2015.<br/>
    This edition includes the following significant technical changes with respect to the previous edition:<br/>
    a) addition and update of typical cable structures in the object;<br/>
    b) addition of a figure for Method E20A;<br/>
    c) addition of "details to be reported" to Method E20A;<br/>
    d) addition of the "figure-8" piling test method as Method E20B.
