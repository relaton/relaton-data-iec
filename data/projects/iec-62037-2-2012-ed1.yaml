abstract:
- language: en
  script: Latn
  content: IEC 62037-2:2012 defines a procedure to measure levels of passive intermodulation generated by a coaxial cable assembly. This test method is applicable to jumper cables, i.e. cable assemblies intended to provide interface flexibility between rigid devices.
- language: fr
  script: Latn
  content: La CEI 62037-2:2012 définit une procédure pour la mesure des niveaux d'intermodulation passive générés par un cordon coaxial. Cette méthode d'essai s'applique aux jarretières, c'est-à-dire aux cordons destinés à fournir une interface flexible entre des dispositifs rigides.
