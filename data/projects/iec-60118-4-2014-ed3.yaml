abstract:
- language: en
  script: Latn
  content: 'IEC 60118-4:2014 is applicable to audio-frequency induction-loop systems producing an alternating magnetic field at audio frequencies and intended to provide an input signal for hearing aids operating with an induction pick-up coil (telecoil). Throughout this standard, it is assumed that the hearing aids used with it conform to all relevant parts of IEC 60118. This standard specifies requirements for the field strength in audio-frequency induction loops for hearing aid purposes, which will give adequate signal-to-noise ratio without overloading the hearing aid. The standard also specifies the minimum frequency response requirements for acceptable intelligibility. Methods for measuring the magnetic field strength are specified, and information is given on appropriate measuring equipment (see Annex B), information that should be provided to the operator and users of the system (see Annex C), and other important considerations. This standard does not specify requirements for loop driver amplifiers or associated microphone or audio signal sources, which are dealt with in IEC 62489-1, or for the field strength produced by equipment, such as telephone handsets, within the scope of ITU-T P.370. This third edition cancels and replaces the second edition published in 2006. This edition constitutes a technical revision which includes the following significant technical changes with respect to the previous edition: Addition of Annexes G, H and I where more information is provided about practical considerations and methods of measurement.'
- language: fr
  script: Latn
  content: 'L''IEC 60118-4:2014 s''applique aux systèmes de boucles d''induction audiofréquences qui produisent un champ magnétique alternatif à fréquence acoustique et destinés à produire un signal d''entrée aux appareils de correction auditive en exploitation avec une bobine d''induction captrice. Dans toute la présente norme, on suppose que les appareils de correction auditive utilisés sont conformes à toutes les parties appropriées de l''IEC 60118. Cette norme spécifie des exigences concernant l''intensité du champ dans les boucles d''induction utilisées à des fins de correction auditive, qui correspond à un rapport signal sur bruit convenable sans surcharge de l''appareil de correction auditive. La norme spécifie également des exigences concernant la réponse en fréquence minimale pour une intelligibilité acceptable. Les méthodes de mesure de l''intensité du champ magnétique et des renseignements sur l''équipement de mesure approprié (voir Annexe B), ainsi que les renseignements qu''il convient de fournir aux opérateurs et aux utilisateurs du système (voir Annexe C) sont donnés, avec d''autres considérations importantes. Par contre, la présente norme ne spécifie pas d''exigences concernant les amplificateurs qui alimentent la boucle, le microphone associé, les sources du signal acoustique, qui sont décrits dans l''IEC 62489-1, ou l''intensité du champ produit par des appareillages tels que les appareils téléphoniques, dans le domaine d''application de la norme UIT-T P370. Cette troisième édition annule et remplace la deuxième édition parue en 2006. L''édition de cette partie constitue une révision technique qui inclut les modifications techniques majeures suivantes par rapport à l''édition précédente: ajout des Annexes G, H et I qui apportent plus d''information concernant des considérations pratiques et les méthodes de mesure.'
