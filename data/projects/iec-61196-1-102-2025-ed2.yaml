abstract:
- language: en
  script: Latn
  content: |-
    IEC 61196-1-102:2025 applies to coaxial communication cables. It specifies test methods for determining the insulation resistance of coaxial cables. It is intended to detect the flaws in the dielectric of finished coaxial cables. This second edition cancels and replaces the first edition, published in 2005. This edition constitutes a technical revision.<br/>
    This edition includes the following significant technical changes with respect to the previous edition:<br/>
    a) the scope was extended;<br/>
    b) the procedure is updated for the period of discharge and the test sample with high insulation resistance;<br/>
    c) the unit of cable length has been amended;<br/>
    d) the test procedures for the cables with special structure are specified in Annex A.
