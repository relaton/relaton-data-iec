  script: Latn
  content: Deals with milking machines for milking farm animals, for use in stalls or in the open. Examples are bucket and direct-to-can milking machines, milking pipeline machines, recorder milking machines. The rated voltage is less than 250 V for single-phase operation and 480 V for other operations.
