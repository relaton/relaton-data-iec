abstract:
- language: fr
  script: Latn
  content: La CEI 60915:2006 contient les dimensions préférentielles concernant les terminaisons des axes, les canons et le montage par le canon sur trou unique de condensateurs variables, de résistances et de potentiomètres variables munis d'un axe de commande. Si d'autres dimensions non indiquées dans la présente norme doivent être utilisées, il est recommandé de les sélectionner aussi dans les normes CEI 60390 et la CEI 60620. Cette seconde édition annule et remplace la première édition publiée en 1987. Elle constitue une révision mineure des tableaux, valeurs et références. La présente version bilingue, publiée en 2008-07, correspond à la version anglaise.
