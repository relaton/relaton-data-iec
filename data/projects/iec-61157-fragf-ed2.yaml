abstract:
- language: fr
  script: Latn
  content: |-
    La CEI 61157:2007 spécifie les critères et un format normalisés de déclaration des émissions acoustiques des appareils de diagnostic médical à ultrasons. Les valeurs numériques de déclaration représentent les valeurs moyennes des conditions d'émission maximale pour un mode opératoire discret ou combiné donné et proviennent de mesures réalisées dans l'eau. Les paramètres d'intensité sont spécifiés dans la présente norme. Cependant, ils sont considérés comme des grandeurs dérivées qui sont significatives uniquement dans le cadre de certaines hypothèses liées au champ ultrasonique mesuré.
    La présente Norme internationale s'applique aux appareils de diagnostic médical à ultrasons. Elle offre un jeu de paramètres acoustiques traçables décrivant les champs acoustiques. Elle définit des critères et un format normalisés de déclaration des informations relatives aux émissions acoustiques. Elle décrit également un jeu de données d'exemption pour les appareils générant de bas niveaux d'émissions acoustiques. Cette deuxième édition annule et remplace la première édition parue en 1992. La présente édition constitue une révision mineure. Les principaux changements effectués par rapport à l'édition précédente sont les suivants:<br/>
    - mise à jour de la présente norme et des références aux normes CEI 61161 et CEI 62127-1;<br/>
    - et un article relatif à la conformité a été ajouté. Le contenu du corrigendum (août 2008, disponible en anglais seulement) a été inclus dans cette norme. La version française n'a pas été soumise au vote.
