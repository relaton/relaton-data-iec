abstract:
- language: en
  script: Latn
  content: |-
    IEC 63044-4:2021 provides the functional safety requirements for HBES/BACS.<br/>
    In addition, it defines functional safety requirements for the interface of equipment intended to be connected to an HBES/BACS network. It does not apply to interfaces to other networks.<br/>
    This document does not provide functional safety requirements for safety-related systems.<br/>
    This document does not provide requirements on data protection and security.
- language: fr
  script: Latn
  content: |-
    L'IEC 63044-4:2021 spécifie les exigences de sécurité fonctionnelle pour HBES/SGTB.<br/>
    De plus, elle spécifie des exigences de sécurité fonctionnelle relatives à l'interface des équipements destinés à être connectés à un réseau HBES/SGTB. Elle ne s'applique pas aux interfaces avec d'autres réseaux.<br/>
    Le présent document ne spécifie pas d’exigences de sécurité fonctionnelle des systèmes relatifs à la sécurité.<br/>
    Le présent document ne spécifie pas d’exigences relatives à la protection et la sécurité des données.
