- language: en
  script: Latn
  content: Contains a presentation of the graphical symbols with the corresponding descriptions in numerical order which does not necessarily represent any functional grouping. It is complemented by an alphabetical index and a graphical survey of the symbols. Additional information is provided to the user by classifications to form and function, and the examples of application. IEC 60417-1 and 60417-2 cancel and replace IEC 60417 and all its supplements.
