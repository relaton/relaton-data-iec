abstract:
- language: fr
  script: Latn
  content: La CEI 62480:2008 spécifie les exigences applicables aux caractéristiques de l'adaptateur de réseau proprement dit ainsi que celles de l'interface entre l'adaptateur de réseau et l'équipement prêt pour connexion au réseau. Les données échangées entre l'adaptateur de réseau et l'équipement prêt pour connexion au réseau correspondent fondamentalement à celles de la Classe 1 de systèmes électroniques domotiques (HES). La présente version bilingue (2012-08) correspond à la version anglaise monolingue publiée en 2008-05.
