abstract:
- language: fr
  script: Latn
  content: La CEI 62381:2006 définit les procédures et spécifications des essais d'acceptation en usine (FAT), des essais d'acceptation sur site (SAT) et des essais d'intégration sur site (SIT). Ces essais sont réalisés pour démontrer la conformité du système d'automatisme à la spécification. Elle annule et remplace la CEI/PAS 62381 publiée en 2004. Cette première édition constitue une révision technique. La présente version bilingue (2013-04) correspond à la version anglaise monolingue publiée en 2006-11.
