abstract:
- language: en
  script: Latn
  content: |-
    IEC 62933-5-3:2023 applies to those instances when a BESS undergoes unplanned modifications. Such modifications can involve one or more of the following:<br/>
    - changes in energy storage capacity;<br/>
    - changes of chemistries, design and manufacturer of the accumulation subsystem;<br/>
    - changes of a subsystem component using non-OEM parts,<br/>
    - changes to the mode of operation,<br/>
    - changes of the installation site, or<br/>
    - changes in an accumulation subsystem due to an installation of reused or repurposed batteries.<br/>
    Any such modification can impair the original state of safety of the BESS.<br/>
    This document complements IEC 62933-5-2, which relates to the overall safety aspects of a BESS. The requirements covered by this document are applied in addition to the requirements in IEC 62933-5-2 in accordance with each situation.
- language: fr
  script: Latn
  content: |-
    L’IEC 62933-5-3:2023 s’applique aux situations dans lesquelles un BESS subit des modifications non programmées. Ces modifications peuvent comporter un ou plusieurs des éléments suivants:<br/>
    - modifications de la capacité de stockage énergétique;<br/>
    - modifications des compositions chimiques et de la conception, et changement de fabricant du sous-système d’accumulation;<br/>
    - modifications d’un composant de sous-système qui utilise des pièces non OEM;<br/>
    - modifications du mode de fonctionnement;<br/>
    - modifications du site d’installation; ou<br/>
    - modifications d’un sous-système d’accumulation en raison d’une installation de batteries réutilisées ou réaffectées.<br/>
    Une telle modification peut compromettre l’état de sécurité initial du BESS.<br/>
    Le présent document complète l’IEC 62933-5-2 qui concerne les aspects liés à la sécurité globale d’un BESS. Les exigences couvertes par le présent document sont appliquées en plus des exigences de l’IEC 62933-5-2 conformément à chaque situation.
