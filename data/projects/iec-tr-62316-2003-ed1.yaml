abstract:
- language: en
  script: Latn
  content: This technical report provides guidelines for the interpretation of backscattering traces, as obtained by an optical time domain reflectometer (OTDR). The guidance includes some theoretical background on the OTDR as well as guidance specific to the use of the OTDR in assessing splice loss.
- language: fr
  script: Latn
  content: |-
    Fournit un guide pour l'interprétation des courbes de rétrodiffusion obtenues au moyen d'un réflectomètre optique dans le domaine temporel (OTDR).
    Ce guide comporte également quelques données de base sur la théorie générale concernant l'OTDR ainsi que des lignes directrices spécifiques à l'utilisation de l'OTDR pour l'évaluation des pertes d'épissure.
