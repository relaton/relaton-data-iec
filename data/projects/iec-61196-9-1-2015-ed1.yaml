abstract:
- language: en
  script: Latn
  content: |-
    IEC 61196-9-1:2015, which is a blank detail specification, applies to RF flexible coaxial communication cables described in IEC 61196-9. It determines the layout and style for detail specification. Detail specifications, based on this blank detail specification, may be prepared by a national organization, a manufacturer or a user.<br/>
    <br/>
    This publication is to be read in conjunction with IEC 61196-1:2005 and IEC 61196-9:2014.
- language: fr
  script: Latn
  content: |-
    L'IEC 61196-9-1:2015, qui est une spécification particulière cadre, s'applique aux câbles coaxiaux de communication RF souples décrits dans l'IEC 61196-9. Elle détermine la présentation et le modèle de la spécification particulière. Les spécifications particulières, basées sur la présente spécification particulière cadre, peuvent être préparées par un organisme national, un fabricant ou un utilisateur.<br/>
    <br/>
    Cette publication doit être lue conjointement avec l'IEC 61196-1:2005 et l'IEC 61196-9:2014.
