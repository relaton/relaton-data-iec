abstract:
- language: en
  script: Latn
  content: |-
    IEC 61400-15-1:2025 defines a framework for assessment and reporting of the wind turbine suitability conditions for both onshore and offshore wind power plants. This includes:<br/>
    a) definition, measurement, and prediction of the long-term meteorological and wind flow characteristics at the site;<br/>
    b) integration of the long-term meteorological and wind flow characteristics with wind turbine and balance-of-plant characteristics;<br/>
    c) characterizing environmental extremes and other relevant plant design drivers;<br/>
    d) addressing documentation and reporting requirements to help ensure the traceability of the assessment processes.<br/>
    This document is framed to complement and support the scope of related IEC 61400 series by defining environmental input conditions. It is not intended to supersede the design and suitability requirements presented in those documents. Specific analytical and modelling procedures as described in IEC 61400-1, IEC 61400-2, IEC 61400-3-1 and IEC TS 61400-3-2 are excluded from the scope of this document.
- language: fr
  script: Latn
  content: |-
    l’IEC 61400-15-1:2025 consiste à définir un cadre pour l'évaluation et le rapport des conditions d'acceptabilité d'un site/des éoliennes (fixes ou flottantes) tant pour les centrales terrestres que pour les centrales en mer. Il comprend:<br/>
    a) définition, mesurage et prévision des caractéristiques météorologiques et d'écoulement du vent à long terme sur le site;<br/>
    b) intégration des caractéristiques météorologiques et d'écoulement du vent à long terme avec les caractéristiques d’éoliennes et d'équilibre des centrales;<br/>
    c) caractérisation des extrêmes environnementaux et des autres facteurs applicables pour la conception des centrales;<br/>
    d) traitement des exigences relatives à la documentation et aux rapports afin d’assurer la traçabilité des processus d'évaluation.<br/>
    Le présent document est conçu pour compléter et venir à l'appui le domaine d'application de la série IEC 61400 connexe en définissant les conditions environnementales à remplir. Il n'est pas destiné à remplacer les exigences de conception et d'acceptabilité présentées dans ces documents. Les procédures spécifiques d'analyse et de modélisation décrites dans l’IEC 61400-1, l’IEC 61400-2, l’IEC 61400-3-1 et l’IEC TS 61400-3-2 sont exclues du domaine d'application du présent document.
