abstract:
- language: en
  script: Latn
  content: |-
    IEC 63327:2026 deals with the safety of powered automatic floor treatment machines intended for commercial use indoors for the following applications:<br/>
    – sweeping,<br/>
    – scrubbing,<br/>
    – wet or dry pick-up,<br/>
    – polishing,<br/>
    – application of wax, sealing products and powder-based detergents,<br/>
    – shampooing<br/>
    of floors.<br/>
    The requirements given by this document are applied in addition to the requirements for commercial floor treatment machines in IEC 60335-2-72, as far as applicable.<br/>
    For automatic floor treatment machines solely designed for wet or dry pick-up, additional or modified requirements of IEC 60335-2-69 where stated are applicable.<br/>
    Machines covered by this document can operate in automatic or manual mode.<br/>
    Modified requirements are given in normative Annex FF of this document for automatic floor treatment machines not equipped with a manual mode.<br/>
    The automatic floor treatment machines covered by this document are designed to avoid hazardous contact with persons in the environment applied. It is recognized that automatic floor treatment machines for commercial use can require operation within close proximity to large groups of people, such as in shopping malls and schools.<br/>
    Throughout this document, the term "machine" is used to refer to an automatic floor treatment machine.<br/>
    The following power systems are covered:<br/>
    – rechargeable batteries that are recharged by built-in battery chargers or off-board battery chargers which may be incorporated within the circuitry of the machine, or mounted on the machine and incorporated within the enclosure of the automatic floor treatment machine; or powered by batteries that shall be removed to be recharged with a charger that is external to the machine, <br/>
    – other systems are under consideration.<br/>
    This document does not apply to<br/>
    – vacuum cleaners and water-suction cleaning appliances and automatic battery-operated cleaners for household use (IEC 60335-2-2);<br/>
    – floor treatment machines and wet scrubbing machines for household use (IEC 60335-2‑10);<br/>
    – battery chargers (IEC 60335-2-29);<br/>
    – floor treatment machines for commercial use (IEC 60335-2-67);<br/>
    – spray extraction machines for commercial use (IEC 60335-2-68);<br/>
    – road sweepers;<br/>
    – machines designed for use on slopes with a gradient exceeding 20 %;<br/>
    – machines equipped with a power take-off (PTO);<br/>
    – machines designed for use in corrosive or explosive environments (dust, vapour or gas);<br/>
    – machines designed for use in vehicles or on board of ships or aircraft;<br/>
    – vacuum cleaners designed for pickup of combustible dust;<br/>
    – appliances for medical purposes (IEC 60601-1);<br/>
    – driverless industrial trucks and their systems (ISO 3691-4);<br/>
    – robots and robotic devices: safety requirements of personal care robots (ISO 13482);<br/>
    – machines with parts that extend beyond the contact zone of the machine;<br/>
    – machines designed for picking up liquids with a flash point below 55 °C.<br/>
    This second edition cancels and replaces the first edition published in 2021. This edition constitutes a technical revision.<br/>
    This edition includes the following significant technical changes with respect to the previous edition: <br/>
    a) introduction of a supervisory function;<br/>
    b) introduction and evaluation of bumper systems;<br/>
    c) introduction of force measurements;<br/>
    d) introduction of hazardous contacts;<br/>
    e) automatic restart of automatic floor treatment machines.
