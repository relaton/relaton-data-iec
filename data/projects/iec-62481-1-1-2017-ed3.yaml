abstract:
- language: en
  script: Latn
  content: |-
    IEC 62481-1-1:2017(E) specifies the core architecture and protocols of DLNA implementations.<br/>
    This third edition cancels and replaces IEC 62481-1 published in 2013 and constitutes a technical revision.<br/>
    This edition includes the following significant technical changes with respect to the previous edition:<br/>
    a) removal of Bluetooth, printers (DMPr, +PR1+ and +PR2+), Mobile Digital Media Uploader (M-DMU), Mobile Digital Media Downloader (M-DMD), Mobile Network Connectivity Function (M NCF) and Media Interoperability Unit (MIU);<br/>
    b) removal of CEA2014 guidelines (RUISRC, RUISINK, RUICTRL, RUIPL);<br/>
    c) addition of IPv6;<br/>
    d) heading levels adjusted to be no deeper that heading level 5.
