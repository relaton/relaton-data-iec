abstract:
- language: en
  script: Latn
  content: IEC 61784-3-1:2010(E) specifies a safety communication layer (services and protocol) based on CPF 1 of IEC 61784-1 and IEC 61158 Types 1 and 9. It identifies the principles for functional safety communications defined in IEC 61784-3 that are relevant for this safety communication layer.
- language: fr
  script: Latn
  content: L'IEC 61784-3-1:2010 (FR) spécifie une couche de communication de sécurité (services et protocole) basée sur la CPF 1 de l’IEC 61784 1 et l’IEC 61158 Types 1 et 9. Elle identifie les principes de communication de sécurité fonctionnelle définis dans l’IEC 61784 3 qui sont pertinents pour cette couche de communication de sécurité.
