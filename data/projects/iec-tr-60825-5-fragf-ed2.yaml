abstract:
- language: fr
  script: Latn
  content: Le présent rapport technique est applicable aux appareils à laser tels que décrits dans la CEI 60825-1. La liste de contrôle est destinée à être utilisée par les fabricants d'appareils à laser et leurs agents, afin d'établir que chaque conception nouvelle ou modifiée est conforme aux exigences de la CEI 60825-1:1993 et à ses amendements 1 et 2. La liste de contrôle ne peut remplacer la CEI 60825-1. Il est nécessaire d'utiliser la CEI 60825-1 en relation avec la liste de contrôle, dans la mesure où les articles et paragraphes correspondants sont mentionnés dans le texte.
