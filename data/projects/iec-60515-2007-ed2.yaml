abstract:
- language: en
  script: Latn
  content: Describes characteristics and tests methods for gas-filled radiation detectors used for the protection of nuclear reactors. Applies to the radiation detectors which are installed external to the core of nuclear reactors and which provide electrical input signals to the reactor's control and instrumentation system.
- language: fr
  script: Latn
  content: Décrit les caractéristiques et les méthodes d'essais des détecteurs de rayonnements à mélange gazeux, utilisés pour la protection des réacteurs nucléaires. S'applique aux détecteurs de rayonnements installés à l'extérieur du c ur des réacteurs nucléaires et qui fournissent les signaux électriques en entrée du système d'instrumentation et de contrôle du réacteur.
