abstract:
- language: fr
  script: Latn
  content: |-
    IEC 61760-1:2006-04(en-fr) fournit un ensemble de références indiquant les conditions de processus ainsi que les conditions d'essai correspondantes à utiliser lors de l'élaboration de spécifications de composants électroniques destinés à être utilisés pour la technologie de montage en surface. Les modifications principales par rapport à l'édition précédente sont les suivantes:<br/>
    - exigences relatives au brasage sans plomb;<br/>
    - extension du domaine d'application destinée à inclure également les composants montés par collage;<br/>
    - référence directe à la CEI 60068-2-58 pour les exigences relatives à la brasabilité et à la résistance à la chaleur de brasage;<br/>
    - la classification en catégories basée sur la capacité des composants à supporter la résistance à la chaleur de brasage a été supprimée.
