abstract:
- language: fr
  script: Latn
  content: |-
    La CEI 60794-3-11:2010 établit les exigences techniques et les caractéristiques des câbles à fibres optiques unimodales destinés à être installés dans des conduites ou directement enterrés. Cette spécification comprend des exigences fonctionnelles mécaniques, environnementales et optiques, des caractéristiques recommandées et des méthodes d'essai pour l'évaluation des produits par rapport aux exigences établies. Les exigences de la présente spécification complètent celles de la CEI 60794-3 et de la CEI 60794-3-10. Les principales modifications par rapport à l'édition antérieure sont:
    - le titre de la spécification a été mis à jour pour inclure les applications avec ligatures;
    - L'article relatif aux spécifications de fibres (paragraphe 5.2.2) a été étendu pour inclure les types de fibres B6_a.
