abstract:
- language: en
  script: Latn
  content: IEC 63011-1:2018 provides definitions pertaining to multichip integrated circuits, as vertically stacked dies using through-silicon vias (TSVs) or micro bumps. Terms and definitions related to the fabrication and test of the multichip integrated circuits are also provided.
- language: fr
  script: Latn
  content: L'IEC 63011-1:2018 donne des définitions relatives aux circuits intégrés multipuces constitués de puces empilées verticalement à l'aide de trous de liaison à travers le silicium ou de microbosses. Des termes et définitions relatifs à la fabrication et aux essais des circuits intégrés multipuces sont également fournis.
