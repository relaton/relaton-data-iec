abstract:
- language: en
  script: Latn
  content: |-
    Provides the physical interface specifications for the SFF MU duplex 10-pin fibre optic transceiver module family. The physical requirements of an optical transceiver that will enable mechanical interchangeability of transceivers complying with this standard both at the printed circuit wiring board and for any panel-mounting requirement are specified.

    The contents of the corrigendum of May 2003 have been included in this copy.
