abstract:
- language: en
  script: Latn
  content: |-
    IEC TS 60034-27-6:2026 which is a Technical Specification, deals with the on-line electrical detection and monitoring of partial discharges on both motors and generators whose rotor windings or stator windings, or both, are supplied from converters. The tests are applicable to both type I and type II insulation systems, encompassing AC windings rated 300 V and above.<br/>
    Details of non-electrical methods such as optical or acoustic detection are not included. The on-line measurement of PD where the winding is supplied via slip rings are also not covered.
