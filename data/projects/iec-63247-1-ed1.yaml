abstract:
- language: en
  script: Latn
  content: |-
    <p>IEC 63247:2020 specifies the requirements and testing for PPE footwear used as electrical insulating footwear and overboots that provide protection of the worker against electric shock and used for working live or close to live parts on installations up to 36 000 V AC or 25 500 V DC.</p>

    <p>The products designed and manufactured according to this document contribute to the safety of the users provided they are used by skilled persons, in accordance with safe methods of work and the instructions for use.</p>

    <p>Antistatic, electrical insulating outsole and conductive footwear are not covered by this document.</p>

    <p>Other parts dealing with electrical insulating outsole footwear and conductive footwear for live working are in development.</p>
