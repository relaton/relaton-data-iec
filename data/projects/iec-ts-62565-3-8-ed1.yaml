abstract:
- language: en
  script: Latn
  content: |-
    IEC TS 62565-3-8:2027, which is a Technical Specification, establishes a detail specification (DS) for<br/>
    • graphene-based heat dissipating film, exhibiting high in-plane thermal conductive performance, well-known as graphene thermal conductive film<br/>
    used for<br/>
    • the thermal management of portable electric devices, as heat dissipation component to conduct quickly and uniformly the large amount of concentrated heat generated at the locations of chips, batteries, cameras, etc. due to the high-speed operation of electronic devices.<br/>
    <br/>
    This detail specification is intended to be used for<br/>
    • typical smartphone, tablets and laptops, wearable electronics, etc.<br/>
    • computers, communication and consumer electronics (3C).<br/>
    <br/>
    Numeric values for the key control characteristics (KCCs) are specified based on the wide consensus of the demand and supply chain.
