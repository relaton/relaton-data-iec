abstract:
- language: en
  script: Latn
  content: |-
    IEC 63152:2020 (EN) establishes concepts and gives guidelines to help sustain a variety of city services on the occasion of a disaster from the perspective of providing electricity. It outlines the basic concepts on how multiple city services can cooperate and continue by electricity continuity plan(s) and electricity continuity system(s). It also specifies methods and means to establish these.<br/>
    The users of this document are assumed to be city developers, city operators, equipment manufacturers, essential service providers and disaster management personnel.<br/>
    Cities are facing many kinds of potential threats which affect the continuity of city services. There exists, therefore, a great need to establish safe and secure societies in which negative impacts on city services to the citizens are minimized and city services are continuously available to them during a period of emergency. There is no doubt that, in modern cities, electricity plays a critical role in maintaining city services.
- language: fr
  script: Latn
  content: |-
    L'IEC 63152:2020 (FR) établit des concepts et spécifie des lignes directrices visant à faciliter le maintien de nombreux services urbains différents en cas de catastrophe, avec pour objectif la fourniture d’électricité. Il présente les concepts de base portant sur le mode de coopération et de pérennité de services urbains multiples par la mise en place d’un ou de plusieurs plans et d’un ou de plusieurs systèmes de continuité de la fourniture d’électricité. Le présent document spécifie également des méthodes et les moyens permettant leur mise en place.<br/>
    Par hypothèse, les utilisateurs du présent document sont des promoteurs, des exploitants de réseaux urbains, des équipementiers, des fournisseurs de services essentiels et le personnel de gestion des catastrophes.<br/>
    Les villes sont confrontées à de nombreux types de menaces potentielles affectant la continuité des services urbains. Il est par conséquent particulièrement nécessaire de mettre en place des sociétés sûres et protégées, dans lesquelles les effets négatifs sur les services urbains proposés aux citoyens sont réduits le plus possible, et dans lesquelles la pérennité de ces services est assurée au cours de toute situation d’urgence. Dans les villes modernes, l’électricité constitue un facteur essentiel évident de la continuité des services urbains.
