abstract:
- language: en
  script: Latn
  content: Gives methods for tests for thermosetting coating powders as defined in Sub-clause 3.7 of IEC 60455-1. These tests are for material before cure and in cured form. The contents of the corrigendum of August 1991 have been included in this copy.
- language: fr
  script: Latn
  content: Expose les méthodes d'essai applicables aux poudres thermodurcissables définies au paragraphe 3.7 de la CEI 60455-1. Ces essais concernent les matériaux avant traitement ainsi que leurs propriétés à l'état durci. Le contenu du corrigendum d'août 1991 a été pris en considération dans cet exemplaire.
