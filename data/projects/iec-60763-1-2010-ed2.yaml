abstract:
- language: en
  script: Latn
  content: IEC 60763-1:2010 contains the definitions required for the understanding of all three parts of IEC 60763, the classification of material into types, and the general requirements applicable to all material covered by the standard. The main changes with respect to the previous edition is that the specification was brought in line with the second edition of IEC 60641-1(2007).
- language: fr
  script: Latn
  content: La CEI 60763-1:2010 contient les définitions requises pour la compréhension de l'ensemble des trois parties de la CEI 60763, la classification des matériaux en types et les exigences générales applicables à tous les matériaux couverts par la norme. Les principales modifications par rapport à l'édition précédente est la spécification a été alignée avec la deuxième édition de la CEI 60641-1(2007).
