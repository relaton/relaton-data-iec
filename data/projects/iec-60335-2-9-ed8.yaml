abstract:
- language: en
  script: Latn
  content: |-
    IEC 60335-2-9:2026 deals with the safety of electric portable appliances for household and similar purposes that have a cooking function such as baking, roasting and grilling, their rated voltage being not more than 250 V including direct current (DC) supplied appliances and battery-operated appliances.<br/>
    Examples of portable appliances that are within the scope of this standard are<br/>
    – air fryers;<br/>
    – breadmakers;<br/>
    – candy floss appliances;<br/>
    – contact grills (griddles);<br/>
    – cookers;<br/>
    – food dehydrators;<br/>
    – hotplates, including induction hot plates and induction wok hotplates;<br/>
    – ovens, including ovens with forced air circulation and steam ovens;<br/>
    – pop-corn makers;<br/>
    – raclette grills;<br/>
    – radiant grills, including raclette appliances and barbecues for indoor use;<br/>
    – roasters;<br/>
    – rotary grills (rotisseries);<br/>
    – toasters;<br/>
    – waffle irons.<br/>
    Appliances intended for normal household and similar use and that can also be used by laypersons in shops, in light industry and on farms, are within the scope of this standard. However, if the appliance is intended to be used professionally to process food for commercial consumption, the appliance is not considered to be for household and similar use only.<br/>
    As far as is practicable, this standard deals with the common hazards presented by appliances that are encountered by all persons in and around the home. However, in general, it does not take into account<br/>
    – persons (including children) whose physical, sensory or mental capabilities; or lack of experience and knowledge prevents them from using the appliance safely without supervision or instruction;<br/>
    – children playing with the appliance.<br/>
    Attention is drawn to the fact that<br/>
    – for appliances intended to be used in vehicles or on board ships or aircraft, additional requirements can be necessary;<br/>
    – in many countries, additional requirements are specified by the national health authorities, the national authorities responsible for the protection of labour and similar authorities.<br/>
    This standard does not apply to:<br/>
    – stationary ovens and stationary grills (IEC 60335-2-6);<br/>
    – pressure steam ovens having a cooking pressure exceeding 140 kPa;<br/>
    – warming plates (IEC 60335-2-12);<br/>
    – frying pans and deep fat fryers (IEC 60335-2-13);<br/>
    – steam cookers (IEC 60335-2-15);<br/>
    – microwave ovens, including combination microwave ovens, except as specified in IEC 60335 2 25:2024, Annex AA (IEC 60335-2-25);<br/>
    – portable and stationary barbecues for outdoor use (IEC 60335-2-78);<br/>
    – appliances intended to burn charcoal or similar combustible fuels;<br/>
    – appliances intended for commercial catering;<br/>
    – appliances intended to be used in locations where special conditions prevail, such as the presence of a corrosive or explosive atmosphere (dust, vapour or gas).<br/>
    This eighth edition cancels and replaces the seventh edition published in 2019. This edition constitutes a technical revision.<br/>
    This edition includes the following significant technical changes with respect to the previous edition:<br/>
    a) alignment with IEC 60335 1:2020;<br/>
    b) conversion of some notes to normative text (Clause 1, 5.2, 11.7, 15.2, 19.2, 19.105, 21.1, 22.109, 24.1.5);<br/>
    c) addition of definitions and requirements of portable steam ovens (Clause 1, 3.1.9.106, 3.1.101, 3.5.119, 3.5.120, 3.5.121, 3.5.122, 3.6.106, 3.6.107, 5.102, 7.1, 7.12, 7.102, 10.1, 10.2, 11.102, 15.2, 19.2, 19.4, 22.7, 22.117 to 22.125, Figure 101);<br/>
    d) addition of requirements for ovens with forced air circulation (clause 1, 5.102);<br/>
    e) addition of requirements for portable air fryers (Clause 1, 3.5.123, 5.103, 7.12, 11.2, 11.7, 21.102, 21.103, Figure 101);<br/>
    f) addition of instructions for appliances not intended to be immersed for cleaning (7.12);<br/>
    g) reduction of the limits for temperature rises for external surfaces (Table 102);<br/>
    h) modification of the construction requirements of toasters (7.12, 8.1.3, 22.113);<br/>
    i) clarification of remote operation requirements (3.11.4, 7.12, 22.40, 22.49, 22.51, deletion of 22.101, Annex R);<br/>
    j) Clarification of position of doors, drawers and lids during the stability test (20.1);<br/>
    k) clarification of the position of the oven on the horizontal surface for the test of 20.101;<br/>
    l) addition of requirements of simultaneous activation of any combination of heating elements and motors (22.116, Annex R).<br/>
    This part 2 is to be used in conjunction with the latest edition of IEC 60335-1 and its amendments unless that edition precludes it; in that case, the latest edition that does not preclude it is used. It was established on the basis of the sixth edition (2020) of that standard.
