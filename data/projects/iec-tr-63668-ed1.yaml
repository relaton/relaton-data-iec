abstract:
- language: en
  script: Latn
  content: "<p>IEC TR 63668:2026 analyses the wireless charging technology for autonomous moving machines that support multimedia/services in living spaces. The wireless power transfer (WPT) technology is spreading to various application fields such as automated guided vehicles (AGVs), autonomous mobile robots (AMRs), delivery robots, cleaning robots, electric carts, electric wheelchairs, electric home appliances, and drones. As the demand for services that improve human convenience increases, the use of delivery robots and d rones is rapidly increasing, and interest in wireless charging technology for such autonomous moving machines is expected to increase. This document investigates the overall market trends and standardization status, and proposes a communication system configuration and operation scenario for wireless power charging of autonomous moving machines.</p>"
