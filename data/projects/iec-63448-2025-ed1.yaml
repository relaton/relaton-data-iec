abstract:
- language: en
  script: Latn
  content: |-
    IEC 63448:2025 specifies the low and ultra-low latency communication and control system (ULCCS) technology to address the communication and control challenges of multimedia-centric applications. It describes the medium access control (MAC) layer specifications:<br/>
    - MAC frame design for control-centric scheduling.<br/>
    - Message types and packet formats for MAC layer operation.<br/>
    - System management aspects at the MAC layer for multiple control domains and multi-hop operation.
