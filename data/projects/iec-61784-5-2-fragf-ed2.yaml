abstract:
- language: fr
  script: Latn
  content: |-
    La CEI 61784-5-2:2010 définit les profils d'installation pour la CPF 2 (CIP). Les profils d'installation sont spécifiés dans les annexes.  Ces annexes sont utilisées conjointement à la CEI 61918:2010. Cette deuxième édition annule et remplace la première édition publiée en 2007 dont elle constitue une révision technique. Elle inclut les modifications techniques suivantes par rapport à la précédente édition:<br/>
    - mises à jour tenant compte des pratiques d'installation actuelles;<br/>
    - ajout de nouvelles technologies devenues récemment disponibles;<br/>
    - correction d'erreurs;<br/>
    - meilleure adéquation avec la CEI 61918. La présente version bilingue (2012-02) correspond à la version anglaise monolingue publiée en 2010-07.
