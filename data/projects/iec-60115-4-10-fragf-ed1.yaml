abstract:
- language: en
  script: Latn
  content: |-
    IEC 60115-4-10:2023 is applicable to the drafting of detail specifications for fixed power resistors with leads, classified to level G, which is defined in IEC 60115‑1:2020, 3.4 for general electronic equipment. It is a supplementary document to the sectional specification and contains requirements for style, layout and minimum contents of detail specifications.<br/>
    This first edition cancels and replaces IEC 60115-4-1:1983. This edition constitutes a technical revision.<br/>
    This edition includes the following significant technical changes with respect to the previous edition:<br/>
    a) it employs the product classification based on application requirements as defined in the generic specification IEC 60115-1:2020;<br/>
    b) it permits the specification additional dimensional requirements concerning the eccentricity of termination wires and the coating extending onto wires;<br/>
    c) it provides for a tabulated presentation of resistance ranges in relationship to the temperature coefficient and the tolerance;<br/>
    d) it supports solderability testing for both, traditional lead-bearing soldering and up-to-date lead-free soldering, as required;<br/>
    e) it introduces a test for the specimens’ robustness to electrostatic discharge if required;<br/>
    f) it introduces a test for the specimens’ resistance to solvents if required;<br/>
    g) it introduces a test for the flammability of the specimens if required;<br/>
    h) it employs consistent stability requirements grouped in stability classes;<br/>
    i) it supports the provision of detailed visual acceptance criteria<br/>
    j) it includes the requirement for a visual inspection of the primary and proximity packaging;<br/>
    k) it provides the correlated test schedules for a qualification approval and for subsequent quality conformance inspections side by side;<br/>
    l) it employs quality assessment procedures which meet the requirements of a zero-defect approach, which evades the use of historic AQL levels and the permission of non-conforming specimens in test groups;<br/>
    m) it provides for the inclusion of specific visual acceptance criteria, to be applied in addition to those given in Annex B of the sectional specification IEC 60115-4:2022;<br/>
    n) furthermore, it employs a new document structure, for which a transition guidance is provided in Annex X.
- language: fr
  script: Latn
  content: |-
    l’IEC 60115-4-10:2023 s’applique à la rédaction de spécifications particulières couvrant les résistances de puissance à broches classées niveau G selon la définition de l’IEC 60115-1:2020, 3.4, pour les équipements électroniques généraux. Une spécification particulière-cadre constitue un document venant compléter une spécification intermédiaire, et qui contient des exigences relatives au style, à la mise en forme et au contenu minimal à faire figurer dans les spécifications particulières.<br/>
    Cette première édition annule et remplace l’IEC 60115-4-1:1983. Cette édition constitue une révision technique.<br/>
    Cette édition inclut les modifications techniques majeures suivantes par rapport à l’édition précédente:<br/>
    a) recours à la classification de produit basée sur les exigences d’application, telle qu’elle est définie dans la spécification générique IEC 60115-1:2020‑1:2020;<br/>
    b) autorisation de la spécification d’exigences dimensionnelles supplémentaires, concernant l’excentricité des fils de sortie et la prolongation du revêtement sur ces fils;<br/>
    c) présentation sous forme de tableau des plages de résistances, en relation avec le coefficient de température et la tolérance;<br/>
    d) acceptation des essais de brasabilité couvrant à la fois la brasure traditionnelle contenant du plomb et la brasure plus contemporaine, sans plomb, selon ce qui est exigé;<br/>
    e) introduction d’un essai couvrant la robustesse des éprouvettes aux décharges électrostatiques, si cela est exigé;<br/>
    f) introduction d’un essai couvrant la robustesse des éprouvettes aux solvants, si cela est exigé;<br/>
    g) introduction d’un essai couvrant l’inflammabilité des éprouvettes, si cela est exigé;<br/>
    h) recours à des exigences de stabilité homogènes regroupées dans des classes de stabilité;<br/>
    i) prise en charge de la spécification de critères d’acceptation visuelle détaillés;<br/>
    j) spécification d’une exigence d’examen visuel portant sur l’emballage principal et l’emballage de proximité;<br/>
    k) spécification groupée des programmes d’essais corrélés pour l’homologation et les contrôles ultérieurs de conformité de la qualité;<br/>
    l) recours à des procédures d’assurance de la qualité satisfaisant aux exigences d’une approche zéro défaut, qui évite l’utilisation des anciens niveaux NQA et l’autorisation d’éprouvettes non conformes au sein de groupes d’essai;<br/>
    m) inclusion de critères d’acceptation visuelle spécifiques, s’appliquant en complément de ceux donnés à l’Annexe B de la spécification intermédiaire IEC 60115-4:2022;<br/>
    n) recours à une nouvelle structure documentaire, avec des recommandations facilitant la transition vers celle-ci données à l’Annexe X.
