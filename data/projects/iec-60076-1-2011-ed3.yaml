abstract:
- language: en
  script: Latn
  content: |-
    IEC 60076-1:2011 applies to three-phase and single-phase power transformers (including auto-transformers) with the exception of certain categories of small and special transformers. For those categories of power transformers and reactors which have their own IEC standards, this part is applicable only to the extent in which it is specifically called up by cross-reference in the other standard. This new edition includes the following significant technical additions with respect to the previous one:<br/>
    - definition of harmonic content;<br/>
    - subclause on transport;<br/>
    - functional method of specification;<br/>
    - connection symbols for single phase transformers;<br/>
    - safety and environmental requirements;<br/>
    - requirements for liquid preservation systems;<br/>
    - clause on DC currents;<br/>
    - vacuum, pressure and leak tests on tanks;<br/>
    - facilities for condition monitoring and environmental and safety considerations.
- language: fr
  script: Latn
  content: |-
    La CEI 60076-1:2011 s'applique aux transformateurs triphasés et monophasés (y compris les autotransformateurs), à l'exception de certaines catégories de petits transformateurs et de transformateurs spéciaux. Pour les catégories de transformateurs de puissance et de bobines d'inductance qui disposent de leur propre norme CEI, la présente partie est applicable uniquement dans la mesure où il y est fait explicitement référence dans l'autre norme. Cette nouvelle édition contient les ajouts techniques significatifs suivants par rapport à l'édition précédente:<br/>
    - définition du contenu harmonique;<br/>
    - paragraphe relatif au transport;<br/>
    - méthode fonctionnelle de spécification;<br/>
    - symboles de connexion pour les transformateurs monophasés;<br/>
    - exigences de sécurité et d'environnement;<br/>
    - exigences pour les systèmes de conservation du liquide;<br/>
    - article relatif aux courants continus;<br/>
    - essais de tenue au vide, à la pression et d'étanchéité des cuves;<br/>
    - prédispositions à l'installation de système de surveillance d'état en continu et de considérations d'environnement et de sécurité.
