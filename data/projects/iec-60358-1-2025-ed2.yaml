abstract:
- language: en
  script: Latn
  content: |-
    IEC 60358-1:2025 This part of IEC 60358 applies to:<br/>
    Coupling capacitors and capacitor dividers, with rated voltage &gt; 1 000 V, connected line to ground with the low-voltage terminal either permanently earthed or connected to devices, for applications listed hereunder and other similar uses.<br/>
    This document serves as a basic standard for the coupling capacitors and capacitor dividers.
- language: fr
  script: Latn
  content: |-
    IEC 60358-1:2025 La présente partie de l’IEC 60358 s’applique:<br/>
    aux condensateurs de couplage et aux diviseurs capacitifs, avec une tension assignée &gt; 1 000 V, connectés entre la ligne et la terre avec la borne basse tension connectée de manière permanente à la terre ou connectée à des dispositifs, pour les applications énumérées ci-dessous et d’autres utilisations semblables.<br/>
    Le présent document constitue une norme de base pour les condensateurs de couplage et les diviseurs capacitifs.
