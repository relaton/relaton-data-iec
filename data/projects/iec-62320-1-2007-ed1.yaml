  script: Latn
  content: Specifies the minimum operational and performance requirements, methods of testing and required test results for AIS Base Stations, compatible with the performance standards adopted by IMO Res. MSC.74 (69), Annex 3, Universal AIS. It incorporates the technical characteristics of non-shipborne, fixed station AIS equipment, included in the relevant ITU and IALA recommendations. Where applicable, takes into account the ITU Radio Regulations.
