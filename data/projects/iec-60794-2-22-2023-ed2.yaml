abstract:
- language: en
  script: Latn
  content: |-
    IEC 60794-2-22: 2023 specifies breakout optical cables with multiple simplex optical fibre cables for use in terminated breakout cable assemblies. This second edition cancels and replaces the first edition published in 2016. This edition constitutes a technical revision. This edition includes the following significant technical changes with respect to the previous edition:<br/>
    a) changed partly the wording in the title and the scope to align with IEC 60794-2-50, IEC 60794-2-23 and IEC 60794-2-24;<br/>
    b) added IEC 60793-1-40, IEC 60793-1-46 and IEC 60794-1-2 to the normative references;<br/>
    c) deleted reference to IEC 60794-2-51;<br/>
    d) added the definition of terminated breakout cable assembly;<br/>
    e) changed the number of bend cycles from 10 to 3 to harmonise with IEC 60794-2-50;<br/>
    f) changed test parameters for temperature cycling to harmonise with IEC 60794-2-50;<br/>
    g) added maximum attenuation requirements after temperature cycling;<br/>
    h) replaced the text for the fire performance with an improved description.
- language: fr
  script: Latn
  content: |-
    L'IEC 60794-2-22: 2023 spécifie particulière pour câbles optiques épanouis comprenant des câbles à fibres optiques simplex multiples destinés à être utilisés comme câbles assemblés épanouis équipés. Cette deuxième édition annule et remplace la première édition parue en 2016. Cette édition constitue une révision technique. Cette édition inclut les modifications techniques majeures suivantes par rapport à l'édition précédente:<br/>
    a) modification partielle de la formulation du titre et du domaine d'application à des fins d'harmonisation avec l’IEC 60794-2-50, l’IEC 60794-2-23 et l’IEC 60794-2-24;<br/>
    b) ajout de l'IEC 60793-1-40, l'IEC 60793-1-46 et l'IEC 60794-1-2 aux références normatives;<br/>
    c) suppression de la référence à l’IEC 60794-2-51;<br/>
    d) ajout de la définition des câbles assemblés épanouis équipés;<br/>
    e) modification du nombre de cycles en courbure de 10 à 3 aux fins d'harmonisation avec l'IEC 60794-2-50;<br/>
    f) modification des paramètres de l'essai des cycles de températures aux fins d'harmonisation avec l’IEC 60794-2-50;<br/>
    g) ajout des exigences d'affaiblissement maximal après les cycles de températures;<br/>
    h) remplacement du texte relatif au comportement au feu par une description améliorée.
