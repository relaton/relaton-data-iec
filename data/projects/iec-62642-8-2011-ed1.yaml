abstract:
- language: en
  script: Latn
  content: IEC 62642-8:2011 specifies the requirements for security fog systems as a part of an I&HAS. It covers application and performance and also gives the necessary tests and trials to ensure efficiency and reliability of such obscuration devices. It also gives guidance on the criteria for design, installation, operation and maintenance of security fog systems.
- language: fr
  script: Latn
  content: La CEI 62642-8:2011 spécifie les exigences relatives aux systèmes générateurs de fumée dans le cadre d'un système d'alarme contre l'intrusion et les hold-up (I&HAS). Elle couvre l'application et les performances et fournit également les essais et mises à l'épreuve nécessaires pour garantir l'efficacité et la fiabilité de tels dispositifs d'obscurcissement. Elle donne par ailleurs des lignes directrices sur les critères de conception, d'installation, de fonctionnement et de maintenance des systèmes générateurs de fumée.
