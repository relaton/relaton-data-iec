abstract:
- language: en
  script: Latn
  content: |-
    IEC 63145-22-20:2020(E) specifies the standard measurement conditions and measuring methods for determining the see-through optical properties and imaging quality of augmented reality (AR) eyewear displays. This includes the transmission characteristics and ambient optical performance of the eyewear displays.<br/>
    Contact lens type displays are out of the scope of this document.<br/>
    NOTE The relationship between the scope and other documents (IEC 63145-20-10, IEC 63145-22-10) is shown in Annex A.
