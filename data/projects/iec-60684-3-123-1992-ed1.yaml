abstract:
- language: en
  script: Latn
  content: Gives the requirements for two types of non-heat-shrinkable sleeving, without defined burning properties, extruded from silicone elastomer. They are distinguished principally by volatile content. Sleeving of this type is normally available in bore sizes up to 25 mm and in a range of wall thickness between 0,1 mm and 2 mm.
- language: fr
  script: Latn
  content: Donne les prescriptions relatives à deux types de gaines non thermorétractables, sans propriétés de combustion déterminées, extrudées à partir d'élastomère silicone. Ils se différencient principalement par leur teneur en matières volatiles. Les gaines de ce type sont généralement fournies avec des diamètres allant jusqu'à 25 mm et dans une gamme d'épaisseurs de paroi comprises entre 0,1 mm et 2 mm.
