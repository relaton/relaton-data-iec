- language: en
  script: Latn
  content: 'IEC 61754-6-100:2015 defines the standard interface dimensions of simplified receptacle dimensions for the type MU connector family. The receptacle assembly consists of a simplified receptacle housing and a simplified plug. Keywords: interface dimensions for the type MU connector'
