abstract:
- language: en
  script: Latn
  content: Gives guidance on the selection, installation, use and maintenance of electrically operated group II apparatus for the detection and measurement of flammable gases complying with the requirements of IEC 61779-1 to IEC 61779-5.  For the purpose of this standard, flammable gases shall include flammable vapours.  This standard applies only to group II apparatus intended for use in industrial and commercial safety applications, involving areas classified in accordance with IEC 60079-10.
