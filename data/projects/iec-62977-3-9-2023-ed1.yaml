abstract:
- language: en
  script: Latn
  content: IEC 62977-3-9:2023 specifies standard measurement conditions and methods for determining the sparkle contrast of direct-view displays which comprise display matrix elements to render real 2D images on a flat panel and an anti-glare layer. This document excludes measurement of sparkle, which is intentionally obtained by the specular reflection from reflecting flakes in coatings and paints.
