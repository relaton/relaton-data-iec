abstract:
- language: en
  script: Latn
  content: |-
    IEC 62241:2026, provides the functional requirements for the alarm systems in the main control room of nuclear power plants. It gives definitions of the terms used for alarm functions. It also establishes the human factors requirements and the design guidelines for alarm presentation for the main control room of nuclear power plants.<br/>
    <br/>
    This second edition cancels and replaces the first edition published in 2004. This edition constitutes a technical revision.<br/>
    <br/>
    This edition includes the following significant technical changes with respect to the previous edition:<br/>
    a)    In 5.1, reference to ISO 11064-5 has been added for detailed guidance on dedicated displays associated with alarms.<br/>
    b)    In 5.1, considerations to be taken into account have been added for multiple unit operations in a single control room.<br/>
    c)    In 5.7, reference to IEC 63351 has been added for human factors criteria and guidelines.<br/>
    d)    In 5.8, an assessment approach based on IEC 61771 has been added.<br/>
    e)    In 7.1, requirements and guidelines regarding alarm presentation for innovative plants have been added.
