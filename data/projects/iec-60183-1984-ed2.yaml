abstract:
- language: en
  script: Latn
  content: Gives guidance in the selection of the conductor size, insulation level and construction of cable to be used on three-phase alternating current systems operating at voltages exceeding 1 kV. Also summarizes the information which is necessary to enable the appropriate selection to be made.
- language: fr
  script: Latn
  content: Donne des directives pour le choix de la section des conducteurs, du niveau d'isolement et du type de câbles à utiliser dans les réseaux triphasés fonctionnant à des tensions supérieures à 1 kV. Rassemble également les informations qui sont nécessaires pour effectuer ce choix de façon judicieuse.
