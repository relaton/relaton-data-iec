abstract:
- language: en
  script: Latn
  content: |-
    IEC 62949:2017 applies to the interface of equipment designed and intended to be connected as a communication terminal to an information and communication technology (ICT) network termination.<br/>
    This document does not apply to:<br/>
    - equipment covered by IEC 62368-1; or<br/>
    - interfaces to other networks.<br/>
    This document specifies the safety requirements of the interface to the ICT network only. Requirements additional to those specified in this document may be necessary for equipment intended for operation while exposed, for example, to extremes of temperature, to excessive dust, moisture, or vibration, to flammable gases, to corrosive or explosive atmospheres and electro medical applications with physical connections to the patient. The following requirements are not covered by this document:<br/>
    - functional safety of equipment;<br/>
    - functional reliability of equipment;<br/>
    - communication facilities with remote supply using hazardous voltage;<br/>
    - protection of equipment connected to ICT networks from functional damage.
- language: fr
  script: Latn
  content: |-
    IEC 62949:2017 s’applique à l’interface de l’équipement conçu et prévu pour être connecté en tant que terminal de communication à une terminaison de réseau des technologies de l’information et de la communication (TIC). Le présent document ne s’applique pas:<br/>
    - aux équipements couverts par l’IEC 62368-1; et<br/>
    - aux interfaces connectées à d’autres réseaux. Le présent document spécifie les exigences de sécurité de l’interface au réseau des TIC. Des exigences venant s’ajouter à celles spécifiées dans le présent document peuvent être nécessaires pour les équipements destinés à fonctionner en étant exposés, par exemple, à des températures extrêmes, à une poussière, une humidité ou une vibration excessive, à des gaz inflammables ou à des atmosphères corrosives ou explosives, les applications électromédicales connectées physiquement au patient. Les exigences suivantes ne sont pas couvertes par le présent document:<br/>
    - la sécurité fonctionnelle des équipements;<br/>
    - la fiabilité fonctionnelle des équipements;<br/>
    - les installations de communications avec une alimentation à distance utilisant une tension dangereuse;<br/>
    - la protection des équipements connectés aux réseaux des TIC contre les dommages fonctionnels.<br/>
    Mots clés: audio/vidéo, terminal de communication, réseau des TIC, circuits externes
