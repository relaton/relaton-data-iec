abstract:
- language: en
  script: Latn
  content: IEC 61076-2-105:2008 describes circular connectors with M5 screw-locking, typically used for industrial process measurement and control. These connectors consist of fixed non-rewireable or rewireable and free connectors non-rewireable.
- language: fr
  script: Latn
  content: La CEI 61076-2-105:2008 décrit les connecteurs circulaires avec M5 à vis, généralement utilisés pour les dispositifs de mesure et de commande dans les processus industriels. Ces connecteurs se composent d'embases non démontables ou démontables et de fiches non démontables.
