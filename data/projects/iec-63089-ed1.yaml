  content: |2
    
    	 Scope

    This International Standard specifies the designation system, requirement , test methods, inspection rule, marks and packaging of the formed annealed aluminium conductors composite core supported, made of combinations of the following metal wires and composite core.


    	formed Aluminium A0F wire shaped before stranding;
    	composite core as IEC 62818 designated.
