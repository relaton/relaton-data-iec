abstract:
- language: en
  script: Latn
  content: |-
    IEC 61914:2015 specifies requirements and tests for cable cleats and intermediate restraints used for securing cable in electrical installations. Cable cleats provide resistance to electromechanical forces where declared. This standard includes cable cleats that rely on a mounting surface specified by the manufacturer for axial and/or lateral retention of cables. This second edition cancels and replaces the first edition published in 2009. This edition constitutes a technical revision. This edition includes the following significant technical changes with respect to the previous edition:<br/>
    a) Additional declaration and test for lateral load retention depending on cleat mounting orientation with associated new figures;<br/>
    b) Additional declaration of the distance between the cable centres in any short-circuit test and associated new figures;<br/>
    c) Specification of the cable to be used in short-circuit testing and relaxation of the ambient temperature limits for the test;<br/>
    d) Additional requirement to photograph the short-circuit test arrangement before and after the test and to record more complete details of the cable used;<br/>
    e) Revised parameters for the test of resistance to UV light.<br/>
    This edition also includes the following editorial changes with respect to the previous edition:<br/>
    f) Revised and updated normative references and bibliography;<br/>
    g) Editorial clarification of definitions;<br/>
    h) Editorial clarification of procedures for selection of test samples and the testing of cleats designed for more than one cable;<br/>
    i) Relaxation of some mandrel material requirements;<br/>
    j) Clarification of the inspection requirements following a short-circuit test and adding the option of either a.c. or d.c. voltage testing following a second short-circuit;<br/>
    k) Clarification that the resistance to corrosion test applies to all types of fixing;<br/>
    l) New cleat example illustration;<br/>
    m) Limitations of use of the formulae in Annex B added.
- language: fr
  script: Latn
  content: |-
    L'IEC 61914:2015 spécifie les exigences et essais pour brides de câbles et dispositifs intermédiaires de tenue utilisés pour la fixation de câbles dans des installations électriques. Les brides de câbles fournissent une résistance aux forces électromécaniques lorsque cela est déclaré. La présente norme inclut les brides de câbles qui reposent sur une surface de montage spécifiée par le fabricant pour le maintien axial et/ou latéral des câbles. Cette deuxième édition annule et remplace la première édition parue en 2009. Cette édition constitue une révision technique. Cette édition inclut les modifications techniques majeures suivantes par rapport à l'édition précédente:<br/>
    a) Déclaration et test complémentaires pour le maintien latéral à la charge en fonction de l'orientation de montage des brides, et ajout de nouvelles figures associées;<br/>
    b) Déclaration supplémentaire de la distance entre les centres des câbles pour tout essai de court-circuit, et mise à jour des figures associées;<br/>
    c) Définition du type de câble à utiliser pour les essais de court-circuit et assouplissement des limites de température ambiante durant les essais;<br/>
    d) Ajout de photographies illustrant le montage d'essai avant et après l'essai de court-circuit et exigence supplémentaire de consigner les caractéristiques détaillées du câble utilisé;<br/>
    e) Modifications des paramètres de l'essai de tenue aux rayonnements lumineux ultraviolets.<br/>
    Cette édition inclut également les modifications éditoriales suivantes par rapport à l'édition précédente:<br/>
    f) Mise à jour des références normatives et de la bibliographie;<br/>
    g) Clarification éditoriale des définitions;<br/>
    h) Clarification éditoriale des règles de choix des échantillons d'essai et des essais de brides de câbles conçues pour plusieurs câbles;<br/>
    i) Assouplissement de certaines exigences relatives aux matériaux des mandrins;<br/>
    j) Clarification des exigences de contrôle après un essai de court-circuit et ajout de l'option d'essai en tension alternative ou en tension continue après un deuxième court-circuit;<br/>
    k) Clarification de l'application de l'essai de tenue à la corrosion à tous les types de fixations;<br/>
    l) Nouvelle illustration d'exemple de bride de câbles;<br/>
    m) Limitations de l'utilisation des formules de l'Annexe B.
