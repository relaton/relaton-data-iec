- language: en
  script: Latn
  content: Applies to medical equipment, medical electrical systems, information technology equipment used in medical electrical application, and all other equipment forming part of medical electrical systems. Specifies general requirements and tests for electromagnetic compatibility of equipment and/or systems.
- language: fr
  script: Latn
  content: S'applique aux appareils électromédicaux, systèmes électromédicaux, appareils de traitement de l'information utilisés pour des applications électromédicales et à tous les autres appareils constitutifs de systèmes électromédicaux dénommés appareils. Spécifie des prescriptions générales et des essais relatifs à la compatibilité électromagnétique des appareils et/ou systèmes.
