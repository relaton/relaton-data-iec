abstract:
- language: en
  script: Latn
  content: 'Applies to optical fibre types A3a, A3b, A3c and A3d. It covers requirements common to A3 multimode fibres. It also covers particular requirements for individual fibre types and specific applications. The main changes from the previous edition are: the addition of tensile strength requirement; the removal of water immersion requirement; and the addition of environmental requirements.'
- language: fr
  script: Latn
  content: 'S''applique aux fibres optiques de type A3a, A3b, A3c et A3d. Elle couvre des prescriptions communes aux fibres multimodales de catégorie A3. Elle couvre aussi des prescriptions particulières applicables à des types particuliers de fibres et à des applications données. Les principaux changements par rapport à l''édition précédente sont: adjonction d''exigences concernant la contrainte à la traction; suppression des exigences concernant l''immersion dans l''eau; et adjonction d''exigences d''environnement.'
