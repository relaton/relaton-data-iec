abstract:
- language: en
  script: Latn
  content: This guide has for purpose to provide guidance for the early consideration of testability aspects in design and development, and to assist in determining effective test procedures as an integral part of operation and maintenance. This second edition constitutes a technical revision. It expands and provides more detail on the techniques and systems broadly outlined in the first edition.
- language: fr
  script: Latn
  content: Ce guide a pour but de fournir des indications pour la prise en considération, très tôt, des aspects de testabilités en conception et développement, d'aider dans la détermination de procédures de test efficaces en tant que partie intégrante de l'exploitation et de la maintenance. Elle élargit le champ de la première édition, et fournit plus de détails sur les techniques et les systèmes présentés de façon générale dans la première édition.
