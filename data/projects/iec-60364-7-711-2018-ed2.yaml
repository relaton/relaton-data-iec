abstract:
- language: en
  script: Latn
  content: |-
    IEC 60364-7-711:2018 gives requirements applying to the temporary electrical installations in exhibitions, shows and stands (including mobile and portable displays and equipment) to protect users. This second edition cancels and replaces the first edition published in 2007. This edition constitutes a technical revision. This edition includes the following significant technical changes with respect to the previous edition:<br/>
    a) in 711.3.1 and 711.3.2 addition of "outdoors" to the list of suitable locations;<br/>
    b) alignment with IEC 60364-4-41.
- language: fr
  script: Latn
  content: |-
    L'IEC 60364-7-711:2018 les exigences particulières de la présente partie de l’IEC 60364 s’appliquent aux installations électriques temporaires des expositions, spectacles et stands (y compris les étalages et les matériels mobiles et portables). Cette deuxième édition annule et remplace la première édition parue en 2007. Cette édition constitue une révision technique. Cette édition inclut les modifications techniques majeures suivantes par rapport à l'édition précédente:<br/>
    a) en 711.3.1 et 711.3.2, ajout de «à l’extérieur» à la liste des emplacements appropriés;<br/>
    b) alignement sur l’IEC 60364-4-41.
