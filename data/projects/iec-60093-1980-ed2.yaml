  script: Latn
  content: Définit les procédés de mesure ainsi que les calculs de résistivité transversale et résistivité superficielle. Etablit des recommandations pour les valeurs de tension et durée d'application - nature et géométrie des électrodes - température et humidité de l'atmosphère et des éprouvettes, conditionnement des éprouvettes.
