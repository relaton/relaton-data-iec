- language: en
  script: Latn
  content: 'Gives test procedures and calculations for the determination of volume and surface resistivity. Establishes recommendations for: values of voltage and time of application; nature and geometry of electrodes temperature and humidity of atmosphere and test specimens; conditioning of test specimens.'
