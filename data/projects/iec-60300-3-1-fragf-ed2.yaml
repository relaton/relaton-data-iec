abstract:
- language: fr
  script: Latn
  content: |-
    La CEI 60300-3-1:2003 donne une vue générale des techniques d'analyse de la sûreté de fonctionnement communément employées. Elledécrit les méthodologies habituelles, les avantages et les inconvénients, les données d'entrée et les autres conditions concernant l'utilisation de techniques différentes. La présente norme constitue une introduction aux méthodologies sélectionnées et est destinée à fournir les informations nécessaires permettant de choisir les méthodes d'analyse les plus appropriées. Cette seconde édition annule et remplace la première édition, publiée en 1991, dont elle constitue une révision technique. Les lignes directrices concernant le choix de techniques d'analyse et le nombre des techniques couvertes ont notamment été étendues. La présente version bilingue (2013-02) correspond à la version anglaise monolingue publiée en 2003-01.
    Mots clés: techniques d'analyse de la sûreté de fonctionnement
