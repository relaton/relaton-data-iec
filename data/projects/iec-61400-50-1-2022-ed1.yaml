abstract:
- language: en
  script: Latn
  content: IEC 61400-50-1:2022 specifies methods and requirements for the application of instruments to measure wind speed (and related parameters, e.g. wind direction, turbulence intensity). Such measurements are required as an input to some of the evaluation and testing procedures for wind energy and wind turbine technology (e.g. resource evaluation and turbine performance testing) described by other standards in the IEC 61400 series. This document is applicable specifically to the use of wind measurement instruments mounted on meteorological masts, turbine nacelles or turbine spinners which measure the wind at the location at which the instruments are mounted. This document excludes remote sensing devices which measure the wind at some location distant from the location at which the instrument is mounted (e.g. vertical profile or forward facing lidars).
- language: fr
  script: Latn
  content: IEC 61400-50-1:2022 spécifie les méthodes et les exigences pour l'application des instruments de mesure de la vitesse du vent (et des paramètres associés, par exemple la direction du vent et l'intensité des turbulences). Ces mesurages sont exigés pour certaines procédures d'évaluation et d'essai de l'énergie éolienne et de la technologie des éoliennes (par exemple, l'évaluation des ressources et les essais de performance des éoliennes) décrites dans d'autres normes de la série IEC 61400. Le présent document s'applique spécifiquement à l'utilisation d'instruments de mesure du vent montés sur des mâts météorologiques, des nacelles d’éolienne ou des nez de rotors d’éolienne qui mesurent le vent à un endroit dans lequel les instruments sont montés. Le présent document exclut les dispositifs de télédétection qui mesurent le vent à un endroit éloigné de celui dans lequel l'instrument est monté (par exemple, les lidars à profil vertical ou orientés vers l'avant)
