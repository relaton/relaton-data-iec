abstract:
- language: fr
  script: Latn
  content: La CEI 62317-4:2005 spécifie les dimensions qui présentent une importance pour l'interchangeabilité mécanique d'une gamme préférentielle de noyaux RM et de noyaux RM faible hauteur en ferrite, et l'emplacement de leurs broches de raccordement sur une grille à pas de 2,54 mm en rapport avec le périmètre d'embase des noyaux. Elle spécifie également les conditions d'essai et les forces d'assemblage à utiliser pour mesurer l'inductance. La présente Norme internationale annule et remplace la deuxième édition de la CEI 60431 publiée en 1983, ainsi que son amendement 1 (1995) et son amendement 2 (1996). La présente Norme internationale constitue une révision technique de la CEI 60431.
