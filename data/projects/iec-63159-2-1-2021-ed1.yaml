abstract:
- language: en
  script: Latn
  content: |-
    IEC 63159-2-1:2021 applies to electric instantaneous water heaters designed to operate as multifunctional appliances with an electric rated power &gt; 2 kW.<br/>
    This document specifies tests for the assessment of the performance.<br/>
    This International Standard is to be used in conjunction with IEC 63159-1:2021.
- language: fr
  script: Latn
  content: |-
    L'IEC 63159-2-1:2021 s'applique aux chauffe-eau instantanés électriques conçus pour fonctionner comme des appareils multifonctions de puissance électrique assignée &gt; 2 kW.<br/>
    Le présent document spécifie les essais pour l'évaluation de l'aptitude à la fonction.<br/>
    La présente Norme internationale doit être utilisée conjointement avec l'IEC 63159-1:2021.
