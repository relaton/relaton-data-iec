abstract:
- language: en
  script: Latn
  content: Describes a procedure to assess end face geometry in guide pin based multifibre ferrules and connectors. Fibre position relative to the end face, either undercut or protrusion, end face angle relative to the guide pin bores, and core dip for multimode fibre are the primary attributes.
