abstract:
- language: en
  script: Latn
  content: |-
    <p>IEC TR 63676-1:2026 describes the system overview of external visual systems of external human - machine interfaces (eHMIs). These systems are specifically designed for use in automated vehicles. It provides an introduction and background information on the concept of eHMIs, highlighting their significance in the context of automated vehicles. Additionally, it describes the architecture and key components of external visual systems used in eHMI multimedia systems.<br/>
    It does not deal with:<br/>
    a) external display usage scenario;<br/>
    b) UX and UI of external display;<br/>
    c) hardware performance of eHMI;<br/>
    d) eHMI regulation of automated vehicle;<br/>
    e) special vehicle conditions that use eHMI external displays, such as trucks, ambulances, fire engines, buses, and taxis.</p>
