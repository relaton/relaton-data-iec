abstract:
- language: fr
  script: Latn
  content: |-
    L'IEC 60286-5:2003 décrit les dimensions communes, les tolérances et les caractéristiques des supports. Elle ne comprend que les dimensions qui sont essentielles pour la manipulation des supports dans le but indiqué et pour le chargement et le déchargement des composants sur ces supports. Par rapport à l'édition précédente, la présente édition inclut les modifications techniques significatives suivantes:<br/> 
    a) Les règles génériques pour la conception des supports matriciels sont données dans la présente norme. Les supports de développement récent qui suivent ces règles ne seront pas listées individuellement. Seuls les supports qui sont conformes aux règles de conception exposées ci-après sont classés comme "supports normalisés" et constituent ainsi les modèles préférentiels.<br/>
    b) Une liste mise à jour des supports matriciels qui ne sont pas conformes aux règles de conception exposées ci-après, qui sont considérés comme des "supports non normalisés" et qui ne sont pas d'utilisation préférentielle, est donnée à l'Annexe A.
