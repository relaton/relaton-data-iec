abstract:
- language: en
  script: Latn
  content: Specifies the requirements and methods of test of air circulator and air blast cooling fans, oscillating and non-oscillating, and their associated regulators intended for use on single-phase a.c. circuits and d.c. circuits not exceeding 250 V.
- language: fr
  script: Latn
  content: Précise les prescriptions et les méthodes d'essai relatives aux ventilateurs de circulation d'air et de rafraîchissement à air soufflé, oscillant ou non, ainsi qu'aux régulateurs de vitesse associés, destinés à être utilisés sur des circuits monophasés en courant alternatif ou en courant continu à des tensions inférieures ou égales à 250 V.
