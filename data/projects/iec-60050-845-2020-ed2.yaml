abstract:
- language: en
  script: Latn
  content: IEC 60050-845:2020 gives the general terminology used in lighting, as well as general terms pertaining to specific applications and associated technologies. This second edition reviews and complements the previous one. It has the status of a horizontal publication in accordance with IEC Guide 108. This terminology is consistent with the terminology developed in the other specialized parts of the IEV.
- language: fr
  script: Latn
  content: IEC 60050-845:2020 donne la terminologie générale utilisée dans le domaine de l'éclairage, ainsi que les termes généraux relatifs à des applications particulières et technologies associées. Cette deuxième édition révise et complète la précédente. Elle a le statut de publication horizontale conformément au Guide IEC 108. Cette terminologie est en accord avec la terminologie figurant dans les autres parties spécialisées de l'IEV.
