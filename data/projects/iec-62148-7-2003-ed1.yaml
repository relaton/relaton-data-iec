- language: en
  script: Latn
  content: Provides the physical interface specifications for the SFF LC 10-pin fibre optic transceiver module family. The physical requirements of an optical transceiver that will enable mechanical interchangeability of transceivers complying with this standard both at the printed circuit wiring board and for any panel-mounting requirement are specified.
