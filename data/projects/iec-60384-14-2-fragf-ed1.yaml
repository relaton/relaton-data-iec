abstract:
- language: fr
  script: Latn
  content: La CEI 60384-14-2:2004 constitue la base d'une procédure uniforme de marquage de sécurité international commun. Elle met en oeuvre le programme d'approbation pour les essais de sécurité de la CEI 60384-14, nécessite une déclaration de conception pour les paramètres relatifs à la sécurité et indique les essais de conformité à réaliser sur tous les lots avant leur livraison et les essais de requalification en fonction des modifications apportées à la conception déclarée.
