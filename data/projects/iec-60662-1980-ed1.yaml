abstract:
- language: en
  script: Latn
  content: Specifies the lamp dimensions, electrical characteristics for lamp starting and operation together with information for ballast, ignitor and luminaire design purposes. This is a loose-leaf publication. Amendments containing new and revised sheets are issued periodically. Consolidated edition incorporating amendment 1, 2, 3, 4, 5, 6, 7 and 8
- language: fr
  script: Latn
  content: Précise les dimensions des lampes, les caractéristiques électriques pour l'amorçage et le fonctionnement ainsi que les informations pour la conception du ballast, de l'allumeur et des luminaires. Cette publication est composée de feuillets détachables. La CEI publie, au fur et à mesure de leur mise au point, de nouvelles feuilles et des feuilles révisées. Edition consolidée incorporant les amendements 1, 2, 3, 4, 5, 6, 7 et 8.
