abstract:
- language: en
  script: Latn
  content: |-
    IEC PAS 63312:2021 deals with the general requirements, classification and technical requirements, installation and commissioning requirements, inspection and maintenance requirements, test methods and requirements of radiant energy sensing flame detectors (including IR, UV, visible light, and imaging-based flame detectors).<br/>
    This PAS is applicable to the type selection, design, installation, commissioning, inspection, maintenance and acceptance of the radiant energy sensing flame detectors, which monitor the flame status of burners
