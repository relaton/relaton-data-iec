abstract:
- language: en
  script: Latn
  content: |-
    IEC 60747-5-5:2020 specifies the terminology, essential ratings, characteristics, safety tests, as well as the measuring methods for photocouplers.<br/>
    Note: The term "optocoupler" can also be used instead of "photocoupler".<br/>
    This edition includes the following significant technical changes with respect to the previous edition:<br/>
    a) optional data sheet basic insulation rating in accordance with IEC 60664-1:2007, 6.1.3.5;<br/>
    b) editorial corrections on the use of VIORM;<br/>
    c) editorial corrections on Figure 2: Time intervals for method b);<br/>
    d) addition of an alternative surge pulse VIOSM test method.
- language: fr
  script: Latn
  content: |
    L’IEC 60747-5-5:2020 spécifie la terminologie, les valeurs assignées essentielles, les caractéristiques, les essais de sécurité, ainsi que les méthodes de mesure pour les photocoupleurs.<br/>
    NOTE Le terme "optocoupleur" peut aussi être employé à la place de "photocoupleur".<br/>
    Cette édition inclut les modifications techniques majeures suivantes par rapport à l’édition précédente:

    	valeur assignée de l’isolation principale, élément facultatif de la fiche technique, consignée conformément à l’IEC 60664-1:2007, 6.1.3.5;
    	corrections éditoriales relatives à l’utilisation de <em>V</em>IORM;
    	corrections éditoriales à la Figure 2: Intervalles de temps pour la méthode b);
    	ajout d’une méthode d’essai en variante pour l’impulsion de tension d’isolement de surcharge <em>V</em>IOSM.
