  content: ISO&#x2F;IEC 14776-151:2010(E) defines the rules for exchanging information between SCSI devices using a serial interconnect. It defines the rules for exchanging information between ATA hosts and ATA devices using the same serial interconnect. It is a functional description. Conforming implementations may employ any design technique that does not violate interoperability.
