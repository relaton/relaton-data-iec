abstract:
- language: en
  script: Latn
  content: |-
    IEC 62321-3-1:2013 describes the screening analysis of five substances, specifically lead (Pb), mercury (Hg), cadmium (Cd), total chromium (Cr) and total bromine (Br) in uniform materials found in electrotechnical products, using the analytical technique of X-ray fluorescence (XRF) spectrometry.<br/>
    IEC 62321-3-1:2013 has the status of a horizontal standard in accordance with IEC Guide 108.
- language: fr
  script: Latn
  content: |-
    L'IEC 62321-3-1:2013 décrit des procédures d'analyse de détection de cinq substances, spécifiquement le plomb (Pb), le mercure (Hg), le cadmium (Cd), le chrome total (Cr) et le brome total (Br) dans des matériaux uniformes utilisés dans les produits électrotechniques en utilisant la technique d'analyse de spectrométrie par fluorescence X (XRF).<br/>
    L'IEC 62321-3-1:2013 a le statut de norme horizontale conformément au Guide IEC 108.
