abstract:
- language: en
  script: Latn
  content: IEC 62106-9:2021 specifies the Radio Broadcast Data System (RBDS), which is an RDS-compatible variant used in countries of North America. RBDS was first standardized by the U.S. National Radio Systems Committee (NRSC) in 1993 and subsequently revised in 1998, 2004, 2005 and 2011 . With the publication of this edition of IEC 62106, the RDS and RBDS standards are now harmonized into a single document. The frequency range of operation (64,0 MHz to 108,0 MHz as indicated by the title of this document) varies according to regional regulatory authority. The U.S. range is 88 MHz to 108 MHz, as set by the U.S. Federal Communications Commission.
