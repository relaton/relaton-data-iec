abstract:
- language: en
  script: Latn
  content: |-
    IEC 60947: 2026 specifies requirements for protective conductor terminal blocks (PE and PEN conductors) with screw-type or screwless-type clamping units, primarily intended for industrial applications or similar use in circuits of a rated voltage not exceeding 1 000 V AC up to 1 000 Hz or 1 500 V DC, most commonly in conjunction with terminal blocks according to IEC 60947-7-1:2025.<br/>
    This document applies to:<br/>
    –    protective conductor terminal blocks with PE function having a cross-section between 0,05 mm²/30 AWG and 150 mm²/300 kcmil and<br/>
    –    protective conductor terminal blocks with PEN function having a cross-section between 10 mm²/ 8 AWG and 150 mm²/300 kcmil.<br/>
    Protective conductor terminal blocks are intended to form the electrical and mechanical connection between round copper conductors with or without special preparation and the fixing support.<br/>
    NOTE 1 This document is not intended for connecting devices for household purposes according to IEC 60998-1.<br/>
    NOTE 2 AWG is the abbreviation of “American Wire Gage” [Gage (US) = Gauge (UK)].<br/>
    kcmil = 1 000 cmil<br/>
    1 cmil = 1 circular mil = surface area of a circle having a diameter of 1 mil<br/>
    1 mil = 1/1 000 inch<br/>
    NOTE 3 This document can be used as a part of additional risk assessment for the following products which are not covered by the scope of this document:<br/>
    - protective conductor terminal blocks requiring the fixing of special devices to the conductors, for example, quick connect terminations or wrapped connections;<br/>
    - protective conductor terminal blocks providing direct contact to the conductors by means of edges or points penetrating the insulation, for example, insulation displacement connections.<br/>
    Where applicable in this document, the term “clamping unit” has been used instead of the term “terminal”. This is taken into account in case of reference to IEC 60947-1:2020.<br/>
    Where applicable in this document, the term “protective conductor terminal blocks” replaces the term "terminal block" when referring to IEC 60947-7-1:2025.<br/>
    <br/>
    This fourth edition cancels and replaces the third edition published in 2009. This edition constitutes a technical revision.<br/>
    This edition includes the following significant technical changes with respect to the previous edition:<br/>
    a)    the scope has been extended to include larger conductor cross-sections;<br/>
    b)    a contact pressure via insulation material (CoPI) test has been added.<br/>
    This International Standard is to be used in conjunction with IEC 60947-1:2020 and IEC 60947-7-1:2025. The provisions of the general rules dealt with in IEC 60947-1:2020 and the requirements for terminal blocks of IEC 60947-7-1:2025 are applicable to this document, where specifically called for. Clauses and subclauses, tables, figures and annexes thus applicable are identified by reference to IEC 60947-1:2020 or IEC 60947-7-1:2025, for example, IEC 60947-1:2020, 2, or IEC 60947-1:2020, Annex A.
