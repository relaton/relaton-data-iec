abstract:
- language: fr
  script: Latn
  content: La CEI 62337:2006 définit des phases et des jalons spécifiques pour la mise en service des systèmes électriques, de mesure et de commande, utilisés dans l'industrie de transformation. Elle décrit, à titre d'exemple, les activités qui suivent le jalon "achèvement du montage" du projet mais préalables à la phase "de réception de l'ensemble industriel" par le maître d'ouvrage. Il est nécessaire d'adapter ces activités à chaque type de processus/ensemble industriel concerné. La présente norme annule et remplace le CEI/PAS 62337 publié en 2002. Cette première édition constitue une révision technique. La présente version bilingue (2013-05) correspond à la version anglaise monolingue publiée en 2006-11.
