abstract:
- language: en
  script: Latn
  content: |-
    IEC TR 61292-6:2023 which is a Technical Report, relates to distributed Raman amplification (DRA). Its main purpose is to provide background material for future standards related to DRA, such as specifications, test methods and operating procedures. This document covers the following aspects:<br/>
    - general overview of Raman amplification;<br/>
    - applications of DRA;<br/>
    - performance characteristics and test methods related to DRA;<br/>
    - operational issues relating to the deployment of DRA.<br/>
    As DRA is a relatively new technology, and still rapidly evolving, some of the material in this document can become obsolete or irrelevant in a fairly short period of time. This document will be updated frequently to minimize this possibility. This second edition cancels and replaces the first edition published in 2010. This edition constitutes a technical revision. This edition includes the following significant technical changes with respect to the previous edition:<br/>
    - correction of the formula for noise figure;<br/>
    - correction of errors in Figure 10.
