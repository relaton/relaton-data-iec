  content: IEC TR 62715-6-21:2022, which is a technical report, provides information about various folding types and hinge structures of foldable products which can affect the durability of a foldable panel. This document focuses only on the issues concerning the foldable products and will not include product parts that do not affect display durability such as speakers, batteries, communication ports.
