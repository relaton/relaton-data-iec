  content: "IEC 60793-2-70: 2017 This part of IEC 60793 is applicable to optical fibre types D1, D2, D3, as described in <!--[if supportFields]><span\r\nlang=EN-GB><span style='mso-element:field-begin'></span><span\r\nstyle='mso-spacerun:yes'> </span>REF _Ref459118742 \\h<span\r\nstyle='mso-spacerun:yes'>  </span>\\* MERGEFORMAT <span style='mso-element:field-separator'></span></span><![endif]-->Table 1<!--[if gte mso 9]><xml>\r\n <w:data>08D0C9EA79F9BACE118C8200AA004BA90B02000000080000000E0000005F005200650066003400350039003100310038003700340032000000</w:data>\r\n</xml><![endif]--><!--[if supportFields]><span lang=EN-GB><span\r\nstyle='mso-element:field-end'></span></span><![endif]-->. These fibres are polarization-maintaining fibre types, and are used or can be incorporated in information transmission equipment and optical fibre cable. These fibres are available for use in optical transport networks. Three types of requirements apply to these fibres:<br/>\n- general requirements defined in IEC 60793-2;<br/>\n- specific requirements common to the category D polarization-maintaining fibres covered in this document and which are given in Clause 4;<br/>\n- particular requirements applicable to individual fibre types or specific applications, which are defined in Annexes A to C.<br/>\n<br/>\nTable 1<!--[if supportFields]><span\r\nstyle='mso-bookmark:_Ref459118742'><span style='mso-bookmark:_Toc434426447'><span\r\nstyle='mso-bookmark:_Toc374036196'><span style='mso-bookmark:_Toc374036146'><span\r\nstyle='mso-bookmark:_Toc459121246'><span style='mso-bookmark:_Toc459187263'><span\r\nstyle='mso-bookmark:_Toc472584728'></span></span></span></span></span></span></span><span\r\nstyle='mso-element:field-end'></span><![endif]-->– Categories of glass core/glass clad polarization-maintaining fibres\n<p> </p>\n\n\n\n\t\n\t\t\n\t\t\t\n\t\t\t<p>Category</p>\n\t\t\t\n\t\t\t\n\t\t\t<p>Type</p>\n\t\t\t\n\t\t\t\n\t\t\t<p>Description</p>\n\t\t\t\n\t\t\n\t\t\n\t\t\t\n\t\t\t<p>D1</p>\n\t\t\t\n\t\t\t\n\t\t\t<p>Polarization-maintaining fibre suitable for use at 980 nm</p>\n\t\t\t\n\t\t\t\n\t\t\t<p>This category of polarization-maintaining fibre is optimised for polarization-maintaining ability in the 980 nm region. This fibre is used for erbium-doped fibre amplifier.</p>\n\t\t\t\n\t\t\n\t\t\n\t\t\t\n\t\t\t<p>D2</p>\n\t\t\t\n\t\t\t\n\t\t\t<p>Polarization-maintaining fibre suitable for use at 1 310 nm</p>\n\t\t\t\n\t\t\t\n\t\t\t<p>This category of polarization-maintaining fibre is optimised for polarization-maintaining ability and connection property of category B fibres in the 1 310 nm region.</p>\n\t\t\t\n\t\t\n\t\t\n\t\t\t\n\t\t\t<p>D3</p>\n\t\t\t\n\t\t\t\n\t\t\t<p>Polarization-maintaining fibre suitable for use at 1 550 nm</p>\n\t\t\t\n\t\t\t\n\t\t\t<p>This category of polarization-maintaining fibre is optimised for polarization-maintaining ability and connection property of category B fibres in the<br/>\n\t\t\t1 550 nm region.</p>\n\t\t\t\n\t\t\n\t\n\n"
- language: fr
  script: Latn
  content: |-
    IEC 60793-2-70: 2017 La présente partie de l’IEC 60793 est applicable aux fibres optiques de type D1, D2, D3, comme décrit dans le Tableau 1. Ces fibres sont des fibres à maintien de polarisation, elles sont utilisées ou peuvent être intégrées dans des équipements destinés à la transmission de l’information et dans des câbles à fibres optiques. Ces fibres sont disponibles afin d’être utilisées au sein de réseaux de transport optique. Trois types d’exigences s’appliquent à ces fibres:

    	les exigences générales, définies dans l’IEC 60793-2;
    	des exigences spécifiques communes aux fibres à maintien de polarisation de catégorie D couvertes par le présent document et qui sont données à l’Article 4;
    	des exigences particulières applicables à des types particuliers de fibres ou à des applications données, qui sont définies dans les Annexes A à C.

    Tableau 1 – Catégories de fibres à maintien de polarisation<br/>
    à cœur en verre/gaine en verre

    	
    		
    			Catégorie
    			Type
    			Description
    		
    		
    			D1
    			Fibre à maintien de polarisation convenant à un usage à 980 nm.
    			Cette catégorie de fibres à maintien de polarisation est spécialement conçue pour le maintien de la polarisation autour de 980 nm. Cette fibre est utilisée pour les amplificateurs à fibre dopée à l’erbium.
    		
    		
    			D2
    			Fibre à maintien de polarisation convenant à un usage à 1 310 nm.
    			Cette catégorie de fibres à maintien de polarisation est spécialement conçue pour le maintien de la polarisation et pour les propriétés de connexion des fibres de la catégorie B autour de 1 310 nm.
    		
    		
    			D3
    			Fibre à maintien de polarisation convenant à un usage à 1 550 nm.
    			Cette catégorie de fibres à maintien de polarisation est spécialement conçue pour le maintien de la polarisation et pour les propriétés de connexion des fibres de la catégorie B autour de 1 550 nm.
    		
    	


     
