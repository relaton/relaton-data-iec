  content: Provides terms and definitions for an electromagnetic noise suppression sheet for digital devices and equipment used in a frequency range of between 30 MHz to 30 GHz, and refers to the influence on the signal by usage of a noise suppression sheet. Gives also guidance for uniform presentation of the properties of a noise suppression sheet, intended for use in manufactures' technical data. Is to be used with IEC 62333-2.
