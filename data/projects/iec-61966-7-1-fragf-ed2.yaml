abstract:
- language: fr
  script: Latn
  content: 'La CEI 61966:2006 spécifie un jeu de données dans les fichiers de mire couleur pour les mesures, l''échantillonnage d''imprimés successifs, les conditions de mesure et les formulaires de retour des résultats, de façon à permettre la caractérisation de l''imprimante couleur et la comparaison des résultats de mesure. Les ensembles de données pour les mesures se trouvent dans des fichiers de mire couleur exprimés dans un espace chromatique rouge-vert-bleu, où des images couleurs correspondantes sont reproduites sur un substrat réfléchissant. Les méthodes de mesure de cette norme sont conçues de manière à pouvoir s''appliquer à des imprimés couleur à réflexion pour usage grand public. Les imprimés couleur à réflexion peuvent être produits par des imprimantes couleur sans impact, incluant des technologies telles que le jet d''encre, le transfert par sublimation, le transfert thermique, l''électrophotographie et d''autres technologies similaires. Cette deuxième édition annule et remplace la première édition parue en 2001. Elle constitue une révision technique. Elle contient les modifications techniques significatives suivantes: En plus de l''illuminant par défaut, D50, D65, F11 et l''illuminant A ont été ajoutés comme illuminants facultatifs. La numérotation des motifs de couleurs dans le fichier de mire a été modifiée pour comprendre facilement l''emplacement de mesure. Deux fichiers de mire: mire d''instabilité à court terme et mire de non-uniformité spatiale ont été ajoutés. La présente version bilingue (2012-08) correspond à la version anglaise monolingue publiée en 2006-05.'
