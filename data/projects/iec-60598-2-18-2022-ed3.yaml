abstract:
- language: en
  script: Latn
  content: |-
    IEC 60598-2-18:2022 specifies requirements for fixed luminaires intended for use in water, or in contact with water, in, for example, the basins of swimming pools, fountains, paddling pools, and garden pools, and for use with electric light sources.<br/>
    This third edition cancels and replaces the second edition published in 1993 and Amendment 1:2011. This edition constitutes a technical revision.<br/>
    This edition includes the following significant technical changes with respect to the previous edition:<br/>
    references to Part 1 have been updated;<br/>
    some subclauses have been renumbered;<br/>
    the standard has been redrafted such that it is applicable to both filament lamps and LED light sources;<br/>
    marking requirements have been updated and 18.5.3 of the previoius edition has been deleted;<br/>
    18.10.3 of the previous edition has been deleted, as it is no longer relevant, following the update of requirements for cross-sectional areas of external and internal cables in Section 5 of Part 1;<br/>
    18.10.4 and 18.10.5 of the previous edition renumbered as 18.11.4 and 18.11.5 in this edition have been adapted to allow the use of an alternative waterproof multi-core cable that conforms to the waterproof test of Annex D and Annex E of EN 50525‑2‑21:2011 or to an equivalent regional standard;<br/>
    in 18.11 (18.10 in the previous edition), the cross-sectional area of wiring has been aligned with Part 1;<br/>
    in 18.11 (18.10 in the previous edition), the types of cables have been updated with alternative regional cables.
- language: fr
  script: Latn
  content: |-
    L'IEC 60598-2-18:2022 spécifie les exigences applicables aux luminaires fixes destinés à être utilisés dans l'eau ou en contact avec l'eau, par exemple dans les bassins des piscines, les fontaines, les pataugeoires et les bassins de jardin, et destinés à être utilisés avec des sources lumineuses électriques.<br/>
    Cette troisième édition annule et remplace la deuxième édition parue en 1993 et l'Amendement 1:2011. Cette édition constitue une révision technique.<br/>
    Cette édition inclut les modifications techniques majeures suivantes par rapport à l'édition précédente:<br/>
    les références à la Partie 1 ont été mises à jour;<br/>
    certains paragraphes ont été renumérotés;<br/>
    la norme a été remaniée afin qu'elle s'applique aux lampes à filament et aux sources lumineuses à LED;<br/>
    les exigences de marquage ont été mises à jour et le 18.5.3 de l’édition précédente a été supprimé;<br/>
    le 18.10.3 de l’édition précédente a été supprimé, car il n'est plus pertinent depuis la mise à jour des exigences applicables aux sections des câbles internes et externes dans la Section 5 de la Partie 1;<br/>
    les 18.10.4 et 18.10.5 de l’édition précédente qui ont été renumérotés 18.11.4 et 18.11.5 dans la présente édition ont été adaptés pour permettre l'utilisation d'une variante de câble multiconducteur étanche conforme à l'essai d'étanchéité de l'Annexe D et de l'Annexe E de l'EN 50525-2-21:2011, ou à une norme régionale équivalente;<br/>
    en 18.11, (18.10 de l’édition précédente), la section du câblage a été alignée sur la Partie 1;<br/>
    en 18.11, (18.10 de l’édition précédente), les types de câbles ont été mis à jour avec d'autres variantes régionales de câbles.
