abstract:
- language: fr
  script: Latn
  content: La CEI 61158-4-22:2010 spécifie les procédures de transfert en temps opportun des données et des informations de commande entre une entité utilisateur de liaison de données et une entité utilisateur homologue, et parmi les entités de liaison de données formant le fournisseur de services distribués de liaison de données; la structure des DLPDU de bus de terrain utilisées par le protocole de la présente norme pour le transfert des données et des informations de commande, et leur représentation sous forme d'unités de données d'interface physique. La présente norme annule et remplace la CEI/PAS 61158-4-22 publiée en 2009. La présente version bilingue publiée en 2012-01 correspond à la version anglaise monolingue publiée en 2010-08.
