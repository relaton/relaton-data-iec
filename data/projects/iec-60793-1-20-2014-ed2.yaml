abstract:
- language: en
  script: Latn
  content: |-
    IEC 60793-1-20:2014 establishes uniform requirements for measuring the geometrical characteristics of uncoated optical fibres. The geometry of uncoated optical fibres directly affect splicing, connectorization and cabling and so are fundamental parameters requiring careful specification, quality control, and thus measurement. This second edition cancels and replaces the first edition, published in 2001, and constitutes a technical revision. This edition includes the following significant technical changes with respect to the previous edition:<br/>
    - the reference test method for all fibre types is changed to the video grey scale transmitted near field method from the refracted near field method;<br/>
    - the test lengths for all fibre types are now to be specified in the fibre's detail specification;<br/>
    - the core illumination wavelength for all multimode fibre types may now to be specified in the fibre's detail specification although defaults are given;<br/>
    - the core k-factor (decision level) is now to be specified in the detail specification for all multimode fibre types;<br/>
    - this edition is substantially more specific in describing the measurement;<br/>
    - data reduction and transformation is fully described;<br/>
    - the data reduction methodology for both refracted near-field and transmitted near-field methods are now unified and consistent. Keywords: measuring the geometrical characteristics of uncoated optical fibres The contents of the corrigendum of March 2016 have been included in this copy.
- language: fr
  script: Latn
  content: |-
    L'IEC 60793-1-20:2014 établit des exigences uniformes pour mesurer les caractéristiques géométriques des fibres optiques nues. La géométrie des fibres optiques nues affecte directement l'épissurage, le montage des connecteurs (connectorisation) et le câblage et est donc un paramètre fondamental nécessitant une spécification minutieuse, un contrôle qualité et par la même, des mesures. Cette deuxième édition annule et remplace la première édition, publiée en 2001, dont elle constitue une révision technique. Cette édition contient les modifications techniques principales suivantes par rapport à l'édition précédente:<br/>
    - la méthode d'essai de référence pour tous les types de fibres est modifiée de la méthode du champ proche réfracté à la méthode du champ proche transmis sur vidéo en niveaux de gris;<br/>
    - les longueurs d'essai de tous les types de fibres doivent désormais être spécifiées dans la spécification particulière de la fibre;<br/>
    - bien que des valeurs par défaut soient données, la longueur d'onde d'illumination du coeur pour tous les types de fibres multimodales peut désormais être spécifiée dans la spécification particulière de la fibre;<br/>
    - le facteur k appliqué sur le coeur (niveau de décision) doit maintenant être spécifié dans la spécification particulière pour tous les types de fibres multimodales;<br/>
    - la présente édition décrit le mesurage de manière bien plus spécifique;<br/>
    - la réduction et la transformation des données sont décrites de manière exhaustive;<br/>
    - la méthodologie de réduction des données pour la méthode du champ proche réfracté et pour la méthode du champ proche transmis est maintenant unifiée et cohérente. Mots clés: mesurer les caractéristiques géométriques des fibres optiques nues Le contenu du corrigendum de mars 2016 a été pris en considération dans cet exemplaire.
