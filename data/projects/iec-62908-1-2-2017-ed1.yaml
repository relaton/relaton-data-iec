- language: en
  script: Latn
  content: IEC 62908-1-2:2017(E) provides a list of terminological entries that are frequently used in the literature related to touch and interactive displays in the IEC 62908 series. Terms for various input methods such as touch, hovering, proximity, gesture, eye tracking, and motion recognition are included. This document is applicable to touch displays, interactive displays and their components.
