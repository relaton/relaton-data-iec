abstract:
- language: en
  script: Latn
  content: IEC 60191-6-2:2001 covers the requirements for the preparation of drawings of integrated circuit outlines for the various ball terminal packages, e.g. ceramic ball grid array (C-BGA), plastic ball grid array (P-BGA), tape ball grid array (T-BGA) and others as well as column terminal packages, e.g. ceramic column grid array (C-CGA).
- language: fr
  script: Latn
  content: La CEI 60191-6-2:2001 couvre les exigences de préparation des dessins d'encombrement de circuits intégrés pour les divers boîtiers à bornes en forme de billes, par exemple boîtiers matriciels à billes en céramique (C-BGA), boîtiers matriciels à billes en plastique (P-BGA), boîtiers matriciels à billes sur bande (T-BGA) et autres, et aussi boîtiers à bornes en forme de colonnes, par exemple boîtiers matriciels à colonnes en céramique (C-CGA).
