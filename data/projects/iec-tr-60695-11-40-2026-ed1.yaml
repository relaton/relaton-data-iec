abstract:
- language: en
  script: Latn
  content: |-
    IEC TR 60695-11-40:2026, presents a general characterization of small-scale test flames and associated confirmatory tests based on copper block calorimetry. Information is presented for the selection of critical parameters in confirmatory test designs.<br/>
    This basic safety publication is intended for use by technical committees in the preparation of safety publications in accordance with the principles laid down in IEC Guide 104 and ISO/IEC Guide 51.<br/>
    This first edition cancels and replaces the second edition of IEC TS 60695-11-40 published in 2021. This edition constitutes a technical revision.<br/>
    This edition includes the following significant technical changes with respect to the previous edition:<br/>
    a) change of classification of this document (from Technical Specification to Technical Report), based on the nature of this publication, which provides solely general information and the theoretical basis for confirmatory tests using copper blocks;<br/>
    b) minor editorial changes.
