abstract:
- language: en
  script: Latn
  content: |-
    IEC 62793:2020 describes the characteristics of thunderstorm warning systems (TWSs) in order to implement lightning hazard preventive measures.<br/>
    Single sensors and/or a network of sensors (e.g. lightning location system) can be used as a TWS.<br/>
    This second edition cancels and replaces the first edition, published in 2016. This edition constitutes a technical revision.<br/>
    This edition includes the following significant technical changes with respect to the previous edition:<br/>
    - portable devices are no longer covered by this standard;<br/>
    - in Clause 5, classes of TWS have been deleted;<br/>
    - in Clause 6, updated figures and more detailed text are provided to better illustrate the alarm timeline;<br/>
    - in Clause 9, the text has been summarized and refers now to the application guide given in Annex F;<br/>
    - annexes have been reorganized;<br/>
    - Annex E is normative.
- language: fr
  script: Latn
  content: |-
    <p>L'IEC 62793:2020 décrit les caractéristiques des systèmes d'alerte aux orages (TWS, <em>Thunderstorm Warning Systems</em>), afin de mettre en œuvre des mesures préventives contre les dangers de la foudre.</p>

    <p>Des capteurs uniques et/ou des réseaux de capteurs (système de localisation de la foudre, par exemple) peuvent être utilisés comme TWS.<br/>
    Cette deuxième édition annule et remplace la première édition parue en 2016. Cette édition constitue une révision technique.<br/>
    Cette édition inclut les modifications techniques majeures suivantes par rapport à l'édition précédente:</p>


    	les appareils portatifs ne sont plus couverts par la présente norme;
    	à l'Article 5, les classes de TWS ont été supprimées;
    	à l'Article 6, des figures mises à jour et un texte plus précis fournissent une meilleure représentation de la chronologie de l'alarme;
    	à l'Article 9, le texte a été synthétisé et fait désormais référence au guide d'application de l'Annexe F;
    	les annexes ont été réorganisées;
    	l'Annexe E est normative.


    <p>La présente version bilingue (2021-02) correspond à la version anglaise monolingue publiée en 2020-09.<br/>
    La version française de cette norme n'a pas été soumise au vote.</p>
