abstract:
- language: en
  script: Latn
  content: |-
    IEC 61439-7:2022 defines the specific requirements for assemblies for the following applications: marinas, camping sites, market squares and electric vehicle charging stations as follows:<br/>
    - assemblies for which the rated voltage does not exceed 1 000 V AC or 1 500 V DC;<br/>
    - assemblies intended for use in connection with the generation, transmission, distribution and conversion of electric energy, and for the control of electric energy consuming equipment;<br/>
    - assemblies operated by ordinary persons (e.g. to plug and unplug of electrical equipment);<br/>
    - assemblies intended to be installed and used in market squares, marinas, camping sites and other similar sites accessible to the public including temporary installations;<br/>
    - assemblies intended for charging stations for electric vehicles (AEVCS) for Mode 3 and Mode 4. They are designed to integrate the functionality and additional requirements for electric vehicle conductive charging systems according to IEC 61851-1:2017.<br/>
    This second edition cancels and replaces the first edition published in 2018. It constitutes a technical revision. This edition includes the following changes with respect to the previous technical specification:<br/>
    - a general editorial review and a technical revision.
- language: fr
  script: Latn
  content: |-
    L'IEC 61439-7:2022 définit les exigences spécifiques applicables aux ensembles destinés aux applications suivantes: marinas, terrains de camping, marchés et emplacements analogues et bornes de charge de véhicules électriques, comme suit:<br/>
    - ensembles dont la tension assignée ne dépasse pas 1 000 V en courant alternatif ou 1 500 V en courant continu;<br/>
    - ensembles destinés à être utilisés avec des équipements conçus pour la production, le transport, la distribution et la conversion de l'énergie électrique et la commande des matériels qui consomment de l'énergie électrique;<br/>
    - ensembles actionnés par des personnes ordinaires (par exemple, brancher ou débrancher du matériel électrique);<br/>
    - ensembles destinés à être installés et utilisés dans les marchés, marinas, des terrains de camping et autres lieux analogues accessibles au public, y compris les installations temporaires;<br/>
    - ensembles destinés aux bornes de charge de véhicules électriques (AEVCS) de Mode 3 et de Mode 4. Ils sont conçus pour intégrer la fonctionnalité et les exigences supplémentaires des systèmes de charge conductive pour véhicules électriques conformément à l'IEC 61851-1:2017.<br/>
    Cette deuxième édition annule et remplace la première édition parue en 2018. Elle constitue une révision technique. Cette édition inclut les modifications suivantes par rapport à la spécification technique précédente:<br/>
    - une revue rédactionnelle générale et une révision technique ont été effectuées.
