abstract:
- language: en
  script: Latn
  content: |-
    IEC 62613-1:2011 applies to accessories with:<br/>
    - three phases (3 poles and Earth) with up to three pilot contacts,<br/>
    - one single pole (Neutral).<br/>
    These accessories have rated currents not exceeding 500 A and rated operating voltages not exceeding 12 kV 50/60 Hz.
- language: fr
  script: Latn
  content: |-
    La CEI 62613-1:2011 s'applique aux appareils:<br/>
    - triphasés (3 pôles + Terre) avec jusqu'à 3 contacts pilotes,<br/>
    - unipolaires (Neutre).<br/>
    de courant nominal ne dépassant pas 500 A et de tension nominale d'emploi ne dépassant pas 12 kV 50/60 Hz.
