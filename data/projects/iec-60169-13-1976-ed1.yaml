abstract:
- language: en
  script: Latn
  content: Refers to solder type connectors only. Gives the dimensions for r.f. coaxial connectors which are preferably to be used with r.f. cable 96 IEC 60075-4-1 or -2 and 96 IEC 60050-2-2 or 96 IEC 60050-3-1 respectively. These connector patterns are for threaded and snap-on or push-pull locking devices and for slide-on rack and panel applications.
- language: fr
  script: Latn
  content: Concerne uniquement les connecteurs à souder. Donne les dimensions des connecteurs coaxiaux pour fréquences radioélectriques à utiliser de préférence avec les câbles r.f. 96 IEC 60075-4-1 ou 2 et 96 IEC 60050-2-2 ou 96 IEC 60050-3-1, selon le cas. Ces modèles de connecteurs se verrouillent par des dispositifs à vis, à baïonnette, ou pousser-tirer, ils se montent sur tiroir ou sur panneau.
