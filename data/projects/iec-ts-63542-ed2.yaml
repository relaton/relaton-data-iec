abstract:
- language: en
  script: Latn
  content: |-
    IEC TS 63542:2026 applies to refrigerant detection systems for use in appliances complying with a relevant standard of the IEC 60335 series using flammable refrigerants .<br/>
    Relevant standards of the IEC 60335-series include:<br/>
    – IEC 60335-2-40 , Household and similar electrical appliances - Safety - Part 2-40: Particular requirements for electrical heat pumps, air-conditioners and dehumidifiers<br/>
    – IEC 60335-2-104, Household and similar electrical appliances - Safety - Part 2-104: Particular requirements for appliances to recover and/or recycle refrigerant from air conditioning and refrigeration equipment<br/>
    This document does not take into account refrigerants other than group A2L, A2 and A3 as defined by ISO 817.<br/>
    This second edition cancels and replaces the first edition published in 2024. This edition constitutes a technical revision.<br/>
    This edition includes the following significant technical changes with respect to the previous edition:<br/>
    – Clause 4 - revised general requirements;<br/>
    – Clause 5 - revised test gases and default test conditions;<br/>
    – Clause 7 - revised response time of the refrigerant detection system ;<br/>
    – Clause 8 - revised refrigerant detection system calibration and short-term stability;<br/>
    – Clause 9 - revised selectivity test and poisoning test;<br/>
    – Clause 10 - revised high concentration test,<br/>
    – Clause 11 - revised drift test;<br/>
    – Clause 12 - revised humidity test;<br/>
    – Clause 13 - revised temperature test;<br/>
    – Clause 14 - revised pressure test;<br/>
    – Clause 15 - revised vibration requirements;<br/>
    – Clause 16 - revised EMC immunity test;<br/>
    – Clause 17 - revised ignition test;<br/>
    – Clause 18 - Revised refrigerant detection system self test routine;<br/>
    – Clause 19 - revised hardware and software design requirements for refrigerant sensors and refrigerant detection systems;<br/>
    – Clause 20 - revised refrigerant sensor identification;<br/>
    – Annex A - Revised routine tests;<br/>
    – Annex B - Revised contamination test(cooking by-products);<br/>
    – Annex C - Revised dust test;<br/>
    – Annex D - added poisoning test for multiple refrigerant gasses.
