abstract:
- language: en
  script: Latn
  content: |-
    <!-- NEW! -->IEC 61400-1:2019 is available as IEC 61400-1:2019 RLV which contains the International Standard and its Redline version, showing all changes of the technical content compared to the previous edition.
    <p style="margin-left:0cm; margin-right:0cm">IEC 61400-1:2019 specifies essential design requirements to ensure the structural integrity of wind turbines. Its purpose is to provide an appropriate level of protection against damage from all hazards during the planned lifetime. This document is concerned with all subsystems of wind turbines such as control and protection functions, internal electrical systems, mechanical systems and support structures. This document applies to wind turbines of all sizes. For small wind turbines, IEC 61400-2 can be applied. IEC 61400-3-1 provides additional requirements to offshore wind turbine installations. This document is intended to be used together with the appropriate IEC and ISO standards mentioned in Clause 2. This edition includes the following significant technical changes with respect to the previous edition:<br/>
    a) general update and clarification of references and requirements;<br/>
    b) extension of wind turbine classes to allow for tropical cyclones and high turbulence;<br/>
    c) Weibull distribution of turbulence standard deviation for normal turbulence model (NTM);<br/>
    d) updated design load cases (DLCs), in particular DLC 2.1 and 2.2;<br/>
    e) revision of partial safety factor specifications<br/>
    The contents of the corrigendum of September 2019 have been included in this copy.</p>
- language: fr
  script: Latn
  content: "<!-- NEW! -->IEC 61400-1:2019 est disponible sous forme de IEC 61400-1:2019 RLV qui contient la Norme internationale et sa version Redline, illustrant les modifications du contenu technique depuis l'édition précédente.\n<p>l'IEC 61400-1:2019 spécifie les exigences de conception essentielles pour assurer l’intégrité structurelle des éoliennes. Elle a pour objet de fournir un niveau de protection approprié contre les dommages causés par tous les dangers pendant la durée de vie prévue. Le présent document concerne tous les sous-systèmes des éoliennes tels que les fonctions de commande et de protection, les systèmes électriques internes, les systèmes mécaniques et les structures de support. Le présent document s'applique aux éoliennes de toutes dimensions. Pour les petites éoliennes, l'IEC 61400-2 peut s’appliquer. L'IEC 61400-3-1 donne les exigences supplémentaires relatives aux installations d'éoliennes en pleine mer. Le présent document est destiné à être utilisé avec les normes IEC et ISO appropriées mentionnées à l’Article <!--[if supportFields]><span\r\nstyle='mso-element:field-begin'></span><span lang=FR style='mso-ansi-language:\r\nFR'> REF _Ref34379257 \\r \\h </span><span style='mso-element:field-separator'></span><![endif]-->2<!--[if gte mso 9]><xml>\r\n <w:data>08D0C9EA79F9BACE118C8200AA004BA90B02000000080000000D0000005F00520065006600330034003300370039003200350037000000</w:data>\r\n</xml><![endif]--><!--[if supportFields]><span style='mso-element:field-end'></span><![endif]-->. Cette édition inclut les modifications techniques majeures suivantes par rapport à l'édition précédente:<br/>\na. mise à jour générale et clarification des références et des exigences;<br/>\nb. extension des classes d'éoliennes pour les adapter aux cyclones tropicaux et aux fortes turbulences;<br/>\nc. loi de Weibull de l'écart type de la turbulence pour le modèle de turbulence normale (NTM);<br/>\nd. cas de charge pour la conception (DLC) mis à jour, en particulier les DLC 2.1 et 2.2;<br/>\ne. révision des spécifications du facteur de sécurité partielle</p>"
