abstract:
- language: en
  script: Latn
  content: Is applicable to computer-system hardware for systems of Class 1 and 2 (as defined by IEC 61513) in nuclear power plants. This new edition reflects recent developments in computer system hardware design, the use of pre-developed hardware and changes in terminology.
- language: fr
  script: Latn
  content: Est applicable au matériel des systèmes informatisés des centrales nucléaires de puissance de Classes 1 et 2 (telles que définies dans la CEI 61513). Cette nouvelle édition tient compte des développements récemment survenus dans le domaine de la conception du matériel des systèmes informatisés, l'utilisation de matériels prédéveloppés commercialement disponibles sur étagère et l'évolution de la terminologie.
