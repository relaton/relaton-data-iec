abstract:
- language: en
  script: Latn
  content: Specifies methods for indicating the record and/or reproduction error status of broadcast-grade digital VTRs utilizing a Reed Solomon product error correction code. Also specifies methods of measuring the error rates in record and/or reproduction modes to indicate the error status.
- language: fr
  script: Latn
  content: Spécifie les méthodes d'affichage de l'état des erreurs d'enregistrement et/ou de lecture dans les magnétoscopes numériques de radiodiffusion qui utilisent un code de correction d'erreurs de type Reed Solomon. Spécifie également les méthodes de mesure des taux d'erreurs, destinées à indiquer l'état des erreurs en fonction des modes d'enregistrement et/ou de lecture.
