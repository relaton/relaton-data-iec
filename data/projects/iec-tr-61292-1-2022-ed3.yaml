abstract:
- language: en
  script: Latn
  content: |
    IIEC TR 61292-1:2022 which is a Technical Report, applies to optical components of optical fibre amplifiers (OFAs). This document provides information about the most relevant parameters of these optical components, especially for erbium doped fibre amplifiers (EDFAs) and fibre Raman amplifiers (FRAs). It provides introductory information for a better understanding operation and applications of EDFAs and FRAs<em>. NOTE </em><em>IEC TR 61292-6 provides more technical information on FRAs. </em>This third edition cancels and replaces the second edition published in 2009. This edition constitutes a technical revision. <em> </em>This edition includes the following significant technical changes with respect to the previous edition:

    	Change of document title from "Parameters of amplifier components" to "Parameters of optical fibre amplifier components";
    	Addition of parameters for optical components used in fibre Raman amplifiers;
    	Addition of Table 1, listing various documents that specify terms and definitions for optical components used in optical fibre amplifiers;
    	Addition of Figure 2 and Figure 3, showing typical component layouts for distributed and lumped fibre Raman amplifiers;
    	Harmonization of the descriptions of optical component parameters with the definitions in other standards on optical components.
