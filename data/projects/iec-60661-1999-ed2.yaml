abstract:
- language: en
  script: Latn
  content: Applies to electric coffee makers for household use, not commercial or industrial use. It defines the main performance characteristics which are of interest to the user and describes the standard methods for measuring these characteristics.
- language: fr
  script: Latn
  content: S'applique aux cafetières électriques à usage domestique, pas aux appareils destinés à un usage commercial ou industriel. La norme définit les principales caractéristiques d'aptitude à la fonction intéressant le consommateur et décrit les méthodes normalisées pour la vérification de ces caractéristiques.
