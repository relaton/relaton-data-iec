  content: |-
    <!--StartFragment -->
    <p>Cette deuxième édition annule et remplace la première édition parue en 2007. Cette édition constitue une révision technique.</p>

    <p>Cette édition inclut les modifications techniques majeures suivantes par rapport à l'édition précédente:</p>

    <p>a) le document a été aligné sur les phases du cycle de vie définies dans l'IEC 62278-1 ;</p>

    <p>b) l'Article 5 décrit les exigences relatives au développement de systèmes électroniques relatifs à la sécurité (jusqu'à la phase 9 du cycle de vie) ;</p>

    <p>c) l'Article 8 traite des exigences relatives à l'acceptation et à l'approbation de la sécurité des systèmes électroniques relatifs à la sécurité, ainsi que des phases suivantes du cycle de vie ;</p>

    <p>d) des exigences et des recommandations ont été ajoutées à l'Article 6 concernant les sujets suivants :</p>

    <p>1) réutilisation de systèmes préexistants ;</p>

    <p>2) outils relatifs à la sécurité ;</p>

    <p>3) impact des menaces de cybersécurité sur la sécurité fonctionnelle ;</p>

    <p>4) dossiers de sécurité pour applications spécifiques ;</p>

    <p>e) les exigences relatives à la structure et au contenu du dossier de sécurité sont désormais définies dans un Article 7 dédié ;</p>

    <p>f) l'Annexe A a été mise à jour en ce qui concerne la spécification et l'allocation des exigences d'intégrité de la sécurité ;</p>

    <p>g) le contenu de l'ancienne Annexe D a été fusionné avec celui de l'Annexe B, et l'annexe est passée du statut informatif à normatif ;</p>

    <p>h) l'Annexe E est passée du statut informatif à normatif ;</p>

    <p>i) une Annexe F informative a été ajoutée pour couvrir les circuits intégrés programmables par l'utilisateur.</p>

    <p><!--StartFragment -->L'Annexe G compare en détail les modifications entre l'IEC 62425:2007 et le présent document.<!--EndFragment --><br/>
    <br/>
    Le présent document s'applique aux systèmes électroniques relatifs à la sécurité (en incluant les sous-systèmes et les équipements) utilisés dans les applications de signalisation ferroviaire.</p>

    <p>Le présent document s'applique aux systèmes génériques (c'est-à-dire aux produits ou systèmes génériques qui définissent une classe d'applications), ainsi qu'aux systèmes destinés à des applications spécifiques.</p>

    <p>La Figure 1 représente le domaine d'application du présent document, ainsi que ses relations avec les autres normes de l'IEC et du CENELEC.</p>

    <p>Le présent document est applicable uniquement à la sécurité fonctionnelle des systèmes. Il ne traite pas d'autres aspects de la sécurité tels que la santé des travailleurs et la sécurité du personnel. Si la sécurité fonctionnelle des systèmes peut avoir un impact sur la sécurité du personnel, la santé et la sécurité des travailleurs peuvent également être affectées par d'autres aspects de la conception du système qui ne sont pas couverts par le présent document. Les aspects de cybersécurité de la sécurité fonctionnelle ne sont couverts que dans une certaine mesure.</p>

    <p>Le présent document s'applique à toutes les phases du cycle de vie d'un système électronique relatif à la sécurité, et en particulier aux phases 5 (architecture et allocation des exigences du système) à 10 (acceptation du système) définies dans l'IEC 62278-1:—.</p>

    <p>Les exigences applicables aux systèmes non relatifs à la sécurité ne relèvent pas du domaine d'application du présent document.</p>

    <p>Le présent document n'est pas applicable aux systèmes, sous-systèmes ou équipements existants (c'est-à-dire ceux qui ont déjà été acceptés avant le développement du présent document). Toutefois, autant que cela est raisonnablement possible, le présent document s'applique aux modifications et extensions des systèmes, sous-systèmes et équipements existants.</p>

    <p>Le présent document s'applique essentiellement aux systèmes, sous-systèmes ou équipements qui ont été spécialement conçus et fabriqués dans les applications de signalisation ferroviaire. Le présent document s'applique également, autant que cela est raisonnablement possible, aux équipements généraux ou industriels (par exemple, alimentations, écrans d'affichage ou autres articles disponibles dans le commerce) qui sont utilisés comme partie d'un système électronique relatif à la sécurité.</p>

    <p>Le présent document s'adresse aux responsables d'exploitation ferroviaire, aux fournisseurs de matériel ferroviaire et aux chargés d'évaluations ainsi qu'aux autorités de tutelle, même si ce document ne définit pas un processus d'approbation applicable par les autorités de tutelle.</p>
