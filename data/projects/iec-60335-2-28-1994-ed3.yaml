abstract:
- language: en
  script: Latn
  content: Deals with the safety of electric sewing machines for household and similar use, their rated voltage being not more than 250 V for single-phase appliances and 480 V for other appliances. Overlock machines and electrical sets are within the scope of the standard.
- language: fr
  script: Latn
  content: Traite de la sécurité des machines à coudre électriques destinées à des usages domestiques et analogues et dont la tension assignée n'est pas supérieure à 250 B pour les appareils monophasés et à 480 V pour les autres appareils. Les surjetteuses-raseuses et les ensembles électriques sont compris dans le domaine d'application de la présente norme.
