abstract:
- language: en
  script: Latn
  content: Specifies a method of determining the electroacoustic performance of hearing aids fitted with an induction pick-up coil and used in an audio-frequency magnetic field. The induction pick-up performance is measured in a loop simulating conditions of use in room applications.
- language: fr
  script: Latn
  content: Spécifie une méthode pour déterminer les caractéristiques électroacoustiques des appareils de correction auditive équipés d'une bobine d'induction captrice et utilisés dans un champ magnétique audiofréquence. Les caractéristiques de la bobine d'induction sont mesurées dans une boucle simulant les conditions d'utilisation applicables aux salles équipées d'une boucle.
