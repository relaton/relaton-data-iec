abstract:
- language: en
  script: Latn
  content: |-
    ISO/IEC 30169:2022 specifies the system framework, IoT application model and overall technical requirements for ELS.<br/>
    This document applies to the design and development of the IoT applications for ELS.<br/>
    The IoT applications for ELS specified in this document are mainly applicable to the retail industry, and can also provide reference for the design and development of the IoT applications for ELS in other industries.
