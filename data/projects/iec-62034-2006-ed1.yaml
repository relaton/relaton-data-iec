abstract:
- language: en
  script: Latn
  content: This International Standard specifies the basic performance and safety requirements for individual products and components that are incorporated into automatic test systems for use with emergency lighting systems on supply voltages not exceeding 1000 V.
- language: fr
  script: Latn
  content: La présente Norme Internationale spécifie les performances de base et les exigences de sécurité relatives aux différents produits et composants qui sont incorporés dans les systèmes automatiques de test dont les tensions d'alimentation n'excédent pas 1 000 V.
