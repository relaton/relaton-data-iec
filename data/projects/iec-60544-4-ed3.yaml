abstract:
- language: en
  script: Latn
  content: |-
    <p>IEC 60544-4 provides a classification system that serves as a guide for the selection and indexing of insulating materials intended to serve in the radiation environments of nuclear reactor facilities, reactor fuel-processing facilities, irradiation facilities, particle accelerators, and X-ray apparatus. The classification system provides a set of parameters defining the utility of the three types of polymeric materials (rigid plastics, flexible plastics, elastomers) for use in devices which are exposed to ionizing radiation. This document forms the basis for a quantitative statement of the suitability of such materials for radiation environments and therefore provides a guide for material specifications and for procurement agreements between suppliers and users.<br/>
    <br/>
    This edition includes the following significant technical changes with respect to the previous edition:<br/>
    - update of the list of test methods and associated references</p>
