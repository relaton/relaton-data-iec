abstract:
- language: en
  script: Latn
  content: |-
    IEC TS 63236-2:2021(E) applies to DC appliance couplers for class I equipment with two active contacts plus an earthing contact, a rated power of 5,2 kW and a rated voltage range from 294 V to 400 V DC. They are intended to power DC information and communication technology equipment only, as specified in IEC 62368-1.<br/>
    This Part 2 is to be used in conjunction with IEC TS 63236-1:2021.
