abstract:
- language: en
  script: Latn
  content: This part of IEC 61755 series defines the dimensional limits of an angled PC rectangular polyphenylene sulphide (PPS) ferrule optical interface in order to meet specific requirements for reference connector application. Ferrules made from the material specified in this standard are suitable for use in categories C and OP as defined in IEC 61753-1. Ferrule interface dimensions and features are contained in the IEC 61754 series, which deals with fibre optic connector interfaces.
