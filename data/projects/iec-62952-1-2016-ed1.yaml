abstract:
- language: en
  script: Latn
  content: IEC 62952-1:2016 specifies the general requirements of power modules for wireless communication devices (WCD). This document includes additional optional specifications to permit use in explosive atmospheres and harsh environments. This International Standard is based on VDI/VDE 2185 Blatt 3.
- language: fr
  script: Latn
  content: L'IEC 62952-1:2016 spécifie les exigences générales relatives aux modules d'alimentation pour les appareils de communication sans fil (WCD). Cette IS inclut des spécifications facultatives supplémentaires permettant l'utilisation dans les atmosphères explosives et les environnements défavorables. La présente Norme internationale est basée sur la norme VDI/VDE 2185 Blatt 3.
