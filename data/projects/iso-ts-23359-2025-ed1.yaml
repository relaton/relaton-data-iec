abstract:
- language: en
  script: Latn
  content: |-
    ISO TS 23359:2025, which is a Technical Specification, describes methods for characterising the chemical properties of powders or liquid dispersions containing graphene-related two-dimensional materials, using a set of suitable measurement techniques.<br/>
    This document covers the determination of elemental composition, oxygen to carbon ratio, trace metal impurities, weight percentage of chemical species and functional groups present, by use of the following techniques:<br/>
    • X-ray photoelectron spectroscopy (XPS);<br/>
    • thermogravimetric analysis (TGA);<br/>
    • inductively coupled plasma mass spectrometry (ICP-MS);<br/>
    • Fourier-transform infrared spectroscopy (FTIR).<br/>
    This document covers sample preparation, protocols and data analysis for the different techniques.
- language: fr
  script: Latn
  content: |-
    Le présent document spécifie les méthodes de caractérisation des propriétés chimiques des poudres ou des dispersions liquides contenant des matériaux bidimensionnels similaires au graphène (GR2M), à l’aide d’un ensemble de techniques de mesurage appropriées.<br/>
    Le présent document couvre la détermination de la composition élémentaire, le rapport oxygène/carbone, les traces d’impuretés métalliques, le pourcentage en poids des espèces chimiques et les groupes fonctionnels présents, en employant les techniques suivantes:<br/>
    - spectroscopie de photoélectrons par rayons X (XPS);<br/>
    - analyse thermogravimétrique (ATG);<br/>
    - spectrométrie de masse à plasma à couplage inductif (ICP-MS);<br/>
    - spectroscopie infrarouge à transformée de Fourier (spectrométrie FTIR).<br/>
    Le présent document couvre la préparation des échantillons, les protocoles et l’analyse des données pour les différentes techniques
