abstract:
- language: fr
  script: Latn
  content: La CEI 61784-3-12:2010 spécifie une couche de communication relative à la sécurité (services et protocole) fondée sur la CPF 12 de la CEI 61784-2 et le type 12 de la CEI 61158. Elle identifie les principes applicables aux communications de sécurité fonctionnelle définies dans la CEI 61784-3, et appropriés à cette couche de communication de sécurité. La présente version bilingue (2012-02) correspond à la version anglaise monolingue publiée en 2010-06.
