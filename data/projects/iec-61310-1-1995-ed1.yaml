abstract:
- language: en
  script: Latn
  content: Specifies requirements for visual auditory and tactile methods of indicating safety related information. Specifies a system of colours, safety signs, markings and other warnings, intended for use for the indication of hazardous situations.
- language: fr
  script: Latn
  content: Spécifie des exigences concernant des méthodes visuelles, auditives et tactiles pour transmettre l'information relative à la sécurité. Définit des règles générales pour un système de couleurs, de signaux de sécurité, de marquages et autres avertissements, destinées à être utilisées pour indiquer des situations dangereuses.
