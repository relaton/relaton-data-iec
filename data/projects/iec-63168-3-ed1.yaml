abstract:
- language: en
  script: Latn
  content: 'This document specifies functional safety requirements for electric and electronic home equipment and household IoT equipment which are operated together in the connected home environment in accordance with the principles of the basic standard for functional safety, IEC 61508. This document is applicable to AAL systems that include one or more electrical, electronic and software devices, services and technologies, and that are installed in a connected home environment to achieve Active Assisted Living directly or indirectly. This document provides a total approach to functional safety in the connected home environment, and takes into consideration: - the lifetime of a home from design, through construction, living, renovation to demolition; - all the network-connected electrical and electronic equipment and software in the home to prevent harm to the residents, and their assets and environment.'
