abstract:
- language: en
  script: Latn
  content: 'Two methods are described for measuring bandwidth: impulse response and frequency response. Both methods apply to the measurement of bandwidth of category A1 multimode fibres. Application to other categories of class A multimode fibres is under study. Neither method applies to measurement of type B single-mode fibres.'
- language: fr
  script: Latn
  content: 'Deux méthodes pour mesurer la largeur de bande sont présentées: la réponse impulsionnelle, et la réponse fréquentielle. Les deux méthodes s''appliquent à la mesure de la largeur de bande des fibres multimodales de catégorie A1. L''application aux autres catégories de fibres multimodales de classe A est à l''étude. Aucune des méthodes ne s''applique à la mesure de la larguer de bande sur fibres unimodales de type B.'
