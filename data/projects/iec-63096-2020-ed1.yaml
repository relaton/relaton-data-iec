abstract:
- language: en
  script: Latn
  content: |-
    IEC 63096:2020 provides a catalogue of highly recommended and optional security controls graded (see Clause 5 to Clause 20) in line with the security degrees defined by IEC 62645. These are intended for nuclear I&amp;C programmable digital systems and architecture including related activities (I&amp;C platform development, project engineering, operation and maintenance).<br/>
    This document is intended to be used for designing I&amp;C systems for new NPPs, and modernizing and modifying I&amp;C systems for existing NPPs throughout the I&amp;C programmable digital systems lifecycle. It may also be applicable to other types of nuclear facilities.<br/>
    This document addresses the whole scope of nuclear I&amp;C programmable digital systems, both safety and non-safety classified. The scope of this document also includes sensors, actuators and electrical systems that belong to the I&amp;C control loop. It is also applicable to those parts of electrical systems covered by IEC 63046, which rely on digital programmable technology. For better readability the terms “nuclear I&amp;C programmable digital systems”, “I&amp;C system” or “I&amp;C platform” used in this document implicitly include electrical systems if the electrical system includes a programmable digital systems.
