abstract:
- language: en
  script: Latn
  content: |-
    IEC Guide 109:2026 provides requirements and guidance on how to consider aspects resulting in impacts on the environment caused by electrotechnical products. It is intended for standards writers developing documents containing provisions relevant to environment as defined in this document.<br/>
    This fourth edition cancels and replaces the third edition published in 2012.<br/>
    This edition includes the following significant technical changes with respect to the previous edition:<br/>
    a) provide standards writers with reference documents, especially horizontal standards, for alignment;<br/>
    b) align with other guides (such as IEC Guide 108 and relevant documents published by other standards development organizations);<br/>
    c) introduction of checklists and recommendations to help product committees identify relevant environmental issues to their products.
