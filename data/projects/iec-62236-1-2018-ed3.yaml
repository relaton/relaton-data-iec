- language: en
  script: Latn
  content: 'IEC 62236-1:2018 outlines the structure and the content of the whole series. It specifies the performance criteria applicable to the whole standards series. This new edition includes the following significant technical change with respect to the previous edition: management of EMC now based on IEC 61000 series.'
- language: fr
  script: Latn
  content: 'IEC 62236-1:2018 donne la structure et le contenu de l’ensemble de la série. Elle spécifie les critères d''aptitude à la fonction applicables à l''ensemble de la série de normes. Cette nouvelle édition inclut le changement technique significatif suivant par rapport à l’édition précédente: la gestion de l’EMC se base dorénavant sur la série IEC 61000.'
