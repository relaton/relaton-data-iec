  content: IEC TR 61191-7:2020(E) serves as a Technical Report and provides information, how technical cleanliness can be assessed within the electronics assembly industry. Technical cleanliness concerns sources, analysis, reduction and control as well as associated risks of particulate matter, so-called foreign-object debris, on components and electronic assemblies in the electronics industry.
