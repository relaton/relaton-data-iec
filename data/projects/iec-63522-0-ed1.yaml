abstract:
- language: en
  script: Latn
  content: |-
    This part of IEC 63522 defines general conditions for testing along with their appropriate severities and conditions for measurements and tests designed to assess the ability of device under test (DUT) or specimens to perform under expected conditions of transportation, storage and all aspects of operational use.<br/>
    <br/>
    This document specifies the general condition to be applied for all testing, if not otherwise specified, and provide general guidance which is used in conjunction with all other parts of the IEC 63522 series.
