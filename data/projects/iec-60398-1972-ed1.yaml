abstract:
- language: en
  script: Latn
  content: Applies to all industrial electro-heating such as resistance, electrode, arc, dielectric and infra-red furnaces. It states the general test conditions as the basic measuring methods applicable to all industrial electro-heating equipment.
- language: fr
  script: Latn
  content: S'applique à toutes les installations électrothermiques industrielles telles que les fours à résistance, à électrodes, à arc, à induction, à pertes diélectriques et à rayonnement infrarouge. Elle définit les conditions générales des essais, ainsi que les méthodes de mesure fondamentales applicables à toutes les installations électrothermiques industrielles.
