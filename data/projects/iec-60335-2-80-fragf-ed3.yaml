abstract:
- language: en
  script: Latn
  content: |-
    IEC 60335-2-80:2015 deals with the safety of electric fans for household and similar purposes, their rated voltage being not more than 250 V for single-phase appliances and 480 V for other appliances.<br/>
    Examples of fans that are within the scope of this standard are:<br/>
    - ceiling fans;<br/>
    - duct fans;<br/>
    - partition fans;<br/>
    - pedestal fans;<br/>
    - table fans.<br/>
    This standard also applies to separate controls supplied with fans.<br/>
    Appliances not intended for normal household use but which nevertheless may be a source of danger to the public, such as appliances intended for use in shops, in light industry and on farms, are within the scope of this standard.<br/>
    As far as is practicable, this standard deals with the common hazards presented by appliances that are encountered by all persons in and around the home. However, in general, it does not take into account<br/>
    - persons (including children) whose<br/>
        - physical, sensory or mental capabilities; or<br/>
        - lack of experience and knowledge<br/>
      prevents them from using the appliance safely without supervision or instruction;<br/>
    - children playing with the appliance.<br/>
    Attention is drawn to the fact that<br/>
    - for appliances intended to be used in vehicles or on board ships or aircraft, additional requirements may be necessary;<br/>
    - in many countries additional requirements are specified by the national health authorities, the national authorities responsible for the protection of labour and similar authorities.<br/>
    This standard does not apply to<br/>
    - appliances intended exclusively for industrial purposes;<br/>
    - appliances intended to be used in locations where special conditions prevail, such as the presence of a corrosive or explosive atmosphere (dust, vapour or gas);<br/>
    - fans incorporated in other appliances.<br/>
    This third edition cancels and replaces the second edition published in 2002 including its Amendment 1 (2004) and its Amendment 2 (2008). It constitutes a technical revision.<br/>
    The principal changes in this edition as compared with the second edition of IEC 60335 2 80 are as follows (minor changes are not listed):<br/>
    - added definition for ceiling fan suspension system (3.102);<br/>
    - added instructions for ceiling fan maintenance (7.12);<br/>
    - added instructions for ceiling fan installation (7.12.1);<br/>
    - added entrapment assessment criteria for table and pedestal fan with a fan head that oscillates in the up-down direction (20.102);<br/>
    - added requirements for insulation of pre-installed internal wiring used to supply attached luminaires (22.101);<br/>
    - added suspension system failure protection requirements for ceiling fans (22.102);<br/>
    - added motor brush wear requirements (27.3).<br/>
    This part 2 is to be used in conjunction with the latest edition of IEC 60335-1 and its amendments. It was established on the basis of the fifth edition (2010) of that standard.<br/>
    This part 2 supplements or modifies the corresponding clauses in IEC 60335-1, so as to convert that publication into the IEC standard: Safety requirements for fans.
- language: fr
  script: Latn
  content: |-
    L'IEC 60335-2-80:2015 traite de la sécurité des ventilateurs électriques pour usages domestiques et analogues dont la tension assignée n'est pas supérieure à 250 V pour les appareils monophasés et 480 V pour les autres appareils.<br/>
    Des exemples de ventilateurs compris dans le domaine d'application de la présente norme sont:<br/>
    - les ventilateurs de plafond;<br/>
    - les ventilateurs de conduit;<br/>
    - les ventilateurs de cloison;<br/>
    - les ventilateurs à colonne;<br/>
    - les ventilateurs de table.<br/>
    Cette norme s'applique également aux dispositifs de commande fournis avec les ventilateurs.<br/>
    Les appareils non destinés à un usage domestique normal, mais qui peuvent néanmoins constituer une source de danger pour le public, tels que les appareils destinés à être utilisés dans des magasins, chez des artisans et dans des fermes, sont compris dans le domaine d'application de la présente norme.<br/>
    Dans la mesure du possible, la présente norme traite des dangers courants présentés par les appareils, encourus par tous les individus à l'intérieur et autour de l'habitation. Cependant, la présente norme ne tient pas compte en général:<br/>
    - des personnes (y compris des enfants) dont:<br/>
        - les capacités physiques, sensorielles ou mentales; ou<br/>
        - le manque d'expérience et de connaissances<br/>
      les empêchent d'utiliser l'appareil en toute sécurité sans surveillance ou instruction;<br/>
    - de l'utilisation de l'appareil comme jouet par des enfants.<br/>
    L'attention est attirée sur le fait que:<br/>
    - pour les appareils destinés à être utilisés dans des véhicules ou à bord de navires ou d'avions, des exigences supplémentaires peuvent être nécessaires;<br/>
    - dans de nombreux pays, des exigences supplémentaires sont spécifiées par les autorités sanitaires nationales, les organismes nationaux en charge de la protection des travailleurs et les organismes analogues.<br/>
    La présente norme ne s'applique pas:<br/>
    - aux appareils prévus exclusivement pour des usages industriels;<br/>
    - aux appareils destinés à être utilisés dans des locaux présentant des conditions particulières, telles que la présence d'une atmosphère corrosive ou explosive (poussière, vapeur ou gaz);<br/>
    - aux ventilateurs incorporés dans d'autres appareils.<br/>
    Cette troisième édition annule et remplace la deuxième édition parue en 2002, y compris son Amendement 1 (2004) et son Amendement 2 (2008). Elle constitue une révision technique.<br/>
    Les principales modifications apportées à la présente édition par rapport à la deuxième édition de l'IEC 60335­2­80 sont les suivantes (les modifications mineures ne sont pas citées):<br/>
    - ajout de la définition du terme système de suspension de ventilateur de plafond (3.102);<br/>
    - ajout d'instructions relatives à l'entretien des ventilateurs de plafond (7.12);<br/>
    - ajout d'instructions relatives à l'installation des ventilateurs de plafond (7.12.1);<br/>
    - ajout de critères d'évaluation du piégeage pour les ventilateurs de table et les ventilateurs à colonne dotés d'une tête oscillant de haut en bas (20.102);<br/>
    - ajout d'exigences relatives à l'isolation des conducteurs internes préinstallés utilisés pour alimenter les luminaires fixés (22.101);<br/>
    - ajout d'exigences relatives à la protection contre les défaillances des systèmes de suspension pour les ventilateurs de plafond (22.102);<br/>
    - ajout d'exigences relatives à l'usure des balais de moteur (27.3).<br/>
    La présente Partie 2 doit être utilisée conjointement avec la dernière édition de l'IEC 60335-1 et ses amendements. Elle a été établie sur la base de la cinquième édition (2010) de cette norme.<br/>
    La présente Partie 2 complète ou modifie les articles correspondants de l'IEC 60335-1, de façon à transformer cette publication en norme IEC: Exigences de sécurité pour les ventilateurs.
