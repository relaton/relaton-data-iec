abstract:
- language: fr
  script: Latn
  content: |-
    L'IEC 61746-1:2009 fournit des procédures destinées à l'étalonnage des réflectomètres optiques dans le domaine de temps pour fibres unimodales (OTDR).  Elle ne traite que des erreurs de mesure et incertitudes de l'OTDR. Cette norme ne couvre pas la correction de la réponse de l'OTDR. Cette première édition de la CEI 61746-1 annule et remplace la deuxième édition de la CEI 61746, publiée en 2005. Elle constitue une révision technique. Les principales modifications techniques sont l'adaptation de l'article 4, la suppression de l'article 10, l'amélioration et l'ajout de certaines définitions, le changement de certains calculs et le changement de symbologie graphique IEC / TR 61930.
    Mots clés : l'étalonnage des réflectomètres optiques dans le domaine de temps pour fibres unimodales (OTDR)
