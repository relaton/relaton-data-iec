abstract:
- language: en
  script: Latn
  content: Describes procedures for the measurement of current-voltage characteristics of photovoltaic devices in natural or simulated sunlight. Lays down basic requirements for the measurement, defines procedures for different measuring techniques in use and shows practices for minimising measurement uncertainty.
- language: fr
  script: Latn
  content: Décrit les procédures pour la mesure des caractéristiques courant-tension des dispositifs photovoltaïques sous éclairement solaire naturel ou simulé. Présente des exigences fondamentales pour la mesure, définit des procédures pour les différentes techniques de mesure utilisées et présente des pratiques visant à réduire l'incertitude de mesure.
