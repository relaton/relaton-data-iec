abstract:
- language: en
  script: Latn
  content: Applies to miniature r.f. connectors for use with r.f. cables, both flexible and semi-rigid cables. The semi-dielectric filled interface is required for severe environmental exposure and for operating frequency range of 0 to 18 GHz with low reflection factors. These connectors can be mated with series TNC connectors.
- language: fr
  script: Latn
  content: S'applique aux connecteurs miniatures pour fréquences radioélectriques destinés à être utilisés avec des câbles soit flexibles, soit semi-rigides. Les interfaces remplies de matière semi-isolante sont requises pour des conditions d'environnement sévères et pour une gamme de fréquences de fonctionnement de 0 à 18 GHz avec de faibles facteurs de réflexion. Ces connecteurs peuvent être accouplés avec des connecteurs du type TNC.
