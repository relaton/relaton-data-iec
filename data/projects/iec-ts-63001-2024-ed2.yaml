abstract:
- language: en
  script: Latn
  content: |-
    IEC TS 63001:2024 provides a technique of measurement and evaluation of ultrasound in liquids for use in cleaning devices, equipment, and ultrasonic reactors. It specifies<br/>
    - the cavitation measurement at frequencies between harmonics of the operating frequency f0,<br/>
    - the cavitation measurement derived by integrating broadband cavitation noise energy,<br/>
    - the cavitation measurement by extraction of broadband spectral components.<br/>
    This document covers the measurement and evaluation of cavitation, but not its secondary effects (cleaning results, sonochemical effects, etc.). Further details regarding the generation of cavitation noise in ultrasonic baths and ultrasonic reactors are provided in Annex A.<br/>
    IEC TS 63001:2024 cancels and replaces the first edition published in 2019. This edition constitutes a technical revision.<br/>
    This edition includes the following significant technical changes with respect to the previous edition:<br/>
    a) addition of a new method of measurement: the measurement of integrated broadband cavitation energy between two frequency bounds.
