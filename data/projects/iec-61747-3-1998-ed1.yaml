abstract:
- language: en
  script: Latn
  content: |-
    Applies to liquid crystal cells of the segment type monochrome liquid crystal display cells. It gives details of the quality assessment procedures, the inspection requirements, screening sequences, sampling requirements and test and measurement procedures required for the assessment of liquid crystal display cells.

    Instead of the qualification approval procedure, it is allowed to apply the capability approval procedure.
