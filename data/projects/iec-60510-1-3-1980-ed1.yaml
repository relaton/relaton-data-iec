abstract:
- language: en
  script: Latn
  content: Applies to frequency division multiplex multiple-access/frequency-modulated systems. Gives methods of measurement for return loss, input and output levels, amplitude/frequency characteristic, static automatic gain control characteristic and 'group-delay/frequency characteristic'.
- language: fr
  script: Latn
  content: S'applique aux systèmes à accès multiple par répartition en fréquence pour des porteuses modulées en fréquence. Donne les méthodes de mesure de l'affaiblissement d'adaptation, niveaux d'entrée et de sortie, caractéristique amplitude/fréquence, caractéristique statique de la commande automatique de gain et caractéristique «temps de propagation de groupe/fréquence».
