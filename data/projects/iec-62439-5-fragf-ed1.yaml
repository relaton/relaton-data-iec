abstract:
- language: fr
  script: Latn
  content: |-
    La CEI 62439-5:2010 concerne les réseaux d'automatisme à haute disponibilité reposant sur la technologie (Ethernet) de l'ISO/CEI 8802-3 (IEEE 802.3). La présente partie de la série CEI 62439 porte sur un protocole de redondance reposant sur la duplication du réseau, ce protocole étant exécuté dans les noeuds d'extrémité, par opposition à un protocole de redondance intégré aux commutateurs. La détection rapide des erreurs est assurée par deux noeuds balise, la décision de basculement étant prise dans chaque noeud individuellement. La capacité de connexion inter-réseau permet à des noeuds d'extrémité à une seule association d'être connectés sur l'un ou l'autre des deux réseaux. La présente norme annule et remplace la CEI 62439 publiée en 2008. Cette première édition constitue une révision technique. Cette édition inclut les modifications techniques majeures suivantes:<br/>
    - ajout d'une méthode de calcul pour le protocole RSTP (Rapid Spanning Tree Protocol, IEEE 802.1Q),<br/>
    - ajout de deux nouveaux protocoles de redondance: HSR (redondance transparente de haute disponibilité) et DRP (protocole de redondance distribuée),<br/>
    - déplacement des Articles 1 à 4 (Introduction, Définitions, Aspects généraux) et des Annexes (Taxinomie, Calcul de disponibilité) dans la CEI 62439-1, qui servent à présent de base aux autres documents,<br/>
    - déplacement de l'Article 5 (MRP, Media Redundancy Protocol) dans la CEI 62439-2 avec peu de modifications éditoriales,<br/>
    - déplacement de l'Article 6 (PRP, Protocole de Redondance Parallèle) dans la CEI 62439-3 avec peu de modifications éditoriales,<br/>
    - déplacement de l'Article 7 (CRP, Protocole de Redondance Transréseau) dans la CEI 62439-4 avec peu de modifications éditoriales, et<br/>
    - déplacement de l'Article 8 (BRP, Protocole de Redondance à Balise) dans la CEI 62439-5 avec peu de modifications éditoriales,<br/>
    - ajout d'une méthode de calcul du temps de reprise maximal du protocole RSTP dans une configuration restreinte (anneau) dans la CEI 62439-1 (Article 8),<br/>
    - ajout de spécifications du protocole HSR, qui partage les principes du protocole PRP dans la CEI 62439-3 (Article 5), et<br/>
    - introduction du protocole DRP (CEI 62439-6).<br/>
    La présente version bilingue (2012-04) correspond à la version anglaise monolingue publiée en 2010-02.
