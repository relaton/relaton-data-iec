abstract:
- language: en
  script: Latn
  content: |-
    IEC 60851-6:2012 specifies the following tests:<br/>
    - Test 9: Heat shock;<br/>
    - Test 10: Cut-through;<br/>
    - Test 15: Temperature index;<br/>
    - Test 21: Loss of mass. For definitions, general notes on methods of test and the complete series of methods of test for winding wires, see IEC 60851-1. Keyword: winding wires
- language: fr
  script: Latn
  content: |-
    La CEI 60851-6:2012 concerne les essais suivants:<br/>
    - Essai 9: Choc thermique;<br/>
    - Essai 10: Thermoplasticité;<br/>
    - Essai 15: Indice de température;<br/>
    - Essai 21: Perte de masse. Pour les définitions, les généralités concernant les méthodes d'essai et les séries complètes des méthodes d'essai des fils de bobinage, voir la CEI 60851-1. Mot clé: fils de bobinage
