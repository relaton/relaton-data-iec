abstract:
- language: en
  script: Latn
  content: |-
    IEC 60050-113:2011 gives the general terminology on physical concepts used in the fields of electricity, electronics and telecommunications. Its target is to collect the most usual concepts in space and time, macroscopic physics, mechanics, thermodynamics, particle physics, and solid-state physics, and to present them as terms and descriptions given in logical order according to their interdependence. The descriptions are definitions from the terminological point of view, but they are not always complete definitions in physical sense. Their main goal is to distinguish among particular concepts. In consequence, this part of the IEV should not be regarded as a physical textbook, but rather as a set of terms with their equivalents in many languages and with descriptions in the main IEV languages. This first edition cancels and replaces Sections 111-13, 111-14 and 111-16 of International Standard IEC 60050-111:1996 and its Amendment 1:2005.<br/>
    It has the status of a horizontal standard in accordance with IEC Guide 108.<br/>
    The contents of the corrigendum of September 2011 have been included in this copy.
- language: fr
  script: Latn
  content: |-
    La CEI 60050-113:2011 donne la terminologie générale relative aux concepts physiques utilisés dans les domaines de l'électricité, de l'électronique et des télécommunications. Elle collecte les concepts les plus usuels concernant l'espace et le temps, la physique macroscopique, la mécanique, la thermodynamique, la physique des particules et la physique des solides, et les présente sous forme de termes et descriptions, dans un ordre logique mettant en évidence leurs relations. Les descriptions sont des définitions au sens terminologique, mais ne sont pas toujours des définitions physiquement complètes. Elles ont principalement pour but de distinguer entre eux les différents concepts. Il convient par conséquent de ne pas considérer la présente partie comme un manuel de physique, mais plutôt comme un ensemble de termes avec leurs équivalents dans d'autres langues et des descriptions dans les langues principales du VEI. Cette première édition annule et remplace les sections 111-13, 111-14 et 111-16 de la Norme internationale CEI 60050-111:1996 et de son Amendement 1:2005.<br/>
    Elle a le statut de norme horizontale conformément au Guide IEC 108.<br/>
    Le contenu du corrigendum de septembre 2011 a été pris en considération dans cet exemplaire.
