abstract:
- language: en
  script: Latn
  content: |-
    IEC PAS 61400-60:2026 will be applied to existing models already in use within the wind energy sector, as well as to future models (and updates of models) that will be used within the wind energy sector. As such, this document does not set specific requirements to model accuracy and precision but aims to transparently establish the performance of models in terms of accuracy and precision, both for the intended use as covered by measurements as well as the predictive capability of the model.<br/>
    This document (and all documents under IEC PAS 61400-60 (all parts) aims at model validation but not model development. Specifically, this document further defines the model validation requirements in the following standards and operational documents:<br/>
    - IEC 61400-1:2019,<br/>
    - IEC 61400-5:2020,<br/>
    - IEC 61400-27-2:2020,<br/>
    - OD-501:2018 [2],<br/>
    - OD-501:2022 [3],<br/>
    - IECRE Clarification sheet CSH022 Ed 2.0
