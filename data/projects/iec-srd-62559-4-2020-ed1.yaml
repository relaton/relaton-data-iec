abstract:
- language: en
  script: Latn
  content: |-
    IEC SRD 62559-4:2020 specifies best practices for an entity to engage in a use cases redaction process to determine and describe their user requirements for systems, based on the business needs. It complements the information in IEC TR 62559-1, IEC 62559-2 and IEC 62559-3 by providing users with best practices in:<br/>
    - use cases drafting process,<br/>
    - determining the skill sets of the people required,<br/>
    - use case repository management, and<br/>
    - using use cases for IEC or enterprise projects.
