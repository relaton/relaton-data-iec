abstract:
- language: fr
  script: Latn
  content: |-
    La CEI 61158-3-21:2010 définit de manière abstraite le service visible de l'extérieur fourni par la couche liaison de données de bus de terrain Type 21 en termes des actions et événements primitifs du service; des paramètres associés à chaque action primitive et événement primitif, et la forme qu'ils prennent; et des interrelations entre ces actions et événements, et leurs séquences valides. La présente norme annule et remplace la CEI/PAS
    62573 parue en 2008. La présente version bilingue publiée en     
    2012-01 correspond à la version anglaise monolingue publiée en    
    2010-08.
