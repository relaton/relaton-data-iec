  content: IEC 63211-3-5:2020(E) defines common procedures for surface durability mechanical test methods. This document generally describes the test equipment and procedures used for each method when applied on all levels, from parts (i.e. outermost surface parts of products, display panels and modules) to final products (i.e. finished displays or products).
