abstract:
- language: en
  script: Latn
  content: |-
    IEC 61300-3-7: 2009 describes the various methods available to measure the wavelength dependence of attenuation <em>A</em>(<em>l</em>) and return loss <em>RL</em>(<em>l</em>), of single-mode passive optical components (POC) used in fibre-optic (FO) telecommunications. It is not, however, applicable to dense wavelength division multiplexing (DWDM) devices. Measurement methods of wavelength dependence of attenuation of DWDM devices are described in IEC 61300-3-29. Definition of WDM device types is given in IEC 62074-1. Three measurement cases are herein considered:

    	Measurement of <em>A</em>(<em>l</em>) only;
    	Measurement of <em>RL</em>(<em>l</em>) only;
    	Measurement of <em>A</em>(<em>l</em>) and <em>RL</em>(<em>l</em>) at the same time.

    These measurements may be performed in one direction (unidirectional) or bi-directionally. This second edition cancels and replaces the first edition published in 2000. It constitutes a technical revision. Changes from the previous edition of this standard are to reflect changes made to IEC 61300-1 and covers unidirectional and bi-directional methods of measurement.
- language: fr
  script: Latn
  content: |-
    IEC 61300-3-7: 2009 décrit les diverses méthodes disponibles de mesure de la dépendance par rapport à la longueur d’onde de l’affaiblissement <em>A</em>(<em>l</em>) et de l’affaiblissement de réflexion <em>RL</em>(<em>l</em>), pour les composants optiques passifs (POC, <em>passive optical components</em>) unimodaux utilisés dans les télécommunications à fibres optiques. (FO). Toutefois, elle ne s'applique pas aux dispositifs à multiplexeur par répartition en longueur d'onde à forte densité (DWDM – <em>dense wavelength division multiplexing</em>). Les méthodes de mesure de la dépendance par rapport à la longueur d’onde de l’affaiblissement des dispositifs DWDM sont décrites dans l’IEC 61300-3-29. L’IEC 62074-1 donne une définition des types de dispositifs WDM. Trois cas de mesure sont pris en considération dans le présent document:

    	Mesurage de <em>A</em>(<em>l</em>) seulement;
    	Mesurage de <em>RL</em>(<em>l</em>) seulement;
    	Mesurage simultané de <em>A</em>(<em>l</em>) et <em>RL</em>(<em>l</em>).

    Ces mesurages peuvent être effectués dans une seule direction (unidirectionnel) ou de manière bidirectionnelle. Cette deuxième édition annule et remplace la première édition parue en 2000. Elle constitue une révision technique. Les modifications par rapport à l’édition précédente de la présente norme visent à refléter les modifications apportées à l’IEC 61300-1 et traitent des méthodes de mesure unidirectionnelles et bidirectionnelles.
