abstract:
- language: en
  script: Latn
  content: |-
    IEC TR 62263:2024 covers procedures for the installation and maintenance of optical fibre cables on single and multi-circuit overhead power lines, including:<br/>
    – optical ground wire (OPGW) fibre cable;<br/>
    – optical phase conductor fibre cable (OPPC);<br/>
    – optical attached fibre cable (OPAC);<br/>
    – all dielectric self supporting (ADSS) optical fibre cable.<br/>
    Relevant electrical hazards are also discussed.
