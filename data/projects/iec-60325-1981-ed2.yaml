abstract:
- language: en
  script: Latn
  content: 'Applies to assemblies designed to measure or detect the contamination of surfaces by alpha and/or beta radiation emitters. Lays down standard requirements: gives examples of acceptable methods; specifies general characteristics, general test conditions, radiation characteristics, electrical safety and environmental characteristics, and also the identification certificate.'
- language: fr
  script: Latn
  content: |-
    S'applique aux ensembles destinés à mesurer ou à détecter la
    contamination des surfaces par des émetteurs de rayonnement alpha
    et bêta. Etablit des prescriptions, donne des exemples de méthodes
    acceptables; spécifie les caractéristiques générales, les
    conditions générales d'essai, les caractéristiques relatives au
    rayonnement, à la sécurité électrique, à l'environnement, ainsi que
    le certificat d'identification.
