abstract:
- language: en
  script: Latn
  content: Applies only to newly manufactured static var-hour meters of accuracy classes 2 and 3 for the measurement of alternating current electrical reactive energy of a frequency in the range 45 Hz to 65 Hz and, like IEC 60687 and IEC 61036, it includes type tests only.
- language: fr
  script: Latn
  content: S'applique uniquement aux compteurs statiques neufs des classes de précision 2 et 3. destinés à la mesure de l'énergie électrique réactive en courant alternatif de fréquence comprise entre 45 Hz et 65 Hz; comme la CEI 60687 et la CEI 61036, cette norme n'inclut que les essais de type.
