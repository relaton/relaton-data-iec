abstract:
- language: en
  script: Latn
  content: Details specific requirements for luminaires for use with tungsten filament, fluorescent and other discharge lamps on supply voltages not exceeding 1 000 V for use in clinical areas in which medical treatment, examination and medical care takes place in hospital and health care buildings. The contents of the corrigendum of September 1994 have been included in this copy.
- language: fr
  script: Latn
  content: Détaille les prescriptions spécifiques aux luminaires à utiliser avec les lampes à filament de tungstène, les lampes tubulaires à fluorescence et autres lampes à décharge, sous des tensions d'alimentation ne dépassant pas 1 000 V, dans les unités de soins des hôpitaux et les maisons de santé, où sont effectués des examens et des traitements médicaux. Le contenu du corrigendum de septembre 1994 a été pris en considération dans cet exemplaire.
