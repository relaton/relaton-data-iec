abstract:
- language: en
  script: Latn
  content: |-
    IEC 62807-1:2017 is applicable to hybrid cables intended to contain any combination of optical fibres, twisted pair/quad, coaxial and current-carrying electrical conductor elements as required under a common outer sheath.<br/>
    This hybrid cable design is convenient for networks and customer premises wiring that transmit data, telecommunication and signalling services over optical fibre, metallic twisted pairs, and/or broadband data over coaxial units, and retains the option of supplying electrical current to remote equipment.<br/>
    The cable element (e.g. coaxial, balanced and optical fibre) performance requirements and supported applications are as specified in the following standards series: IEC 61196, IEC 61156, and IEC 60794 respectively.<br/>
    The various combinations of strength members, sheath materials, fibre arrangements, twisted pair/quad structure, cable shielding, and current carrying conductors will be specified in the following specifications:<br/>
    - IEC 62807-2;<br/>
    - IEC 62807-3.<br/>
    In IEC 62807 (all parts), the current carrying conductors are not intended to be used as power mains supply. The specific use and safety regulation requirements are defined in the detailed and sectional cable specification.
     
- language: fr
  script: Latn
  content: |-
    L'IEC 62807-1:2017 est applicable aux câbles hybrides prévus pour contenir toute combinaison d'éléments à fibres optiques, paires/quartes torsadées, coaxiaux et conducteurs électriques parcourus par un courant, selon ce qui est demandé sous une gaine extérieure commune.<br/>
    Cette conception de câble hybride convient pour le câblage des réseaux et le câblage dans les locaux d’utilisateurs qui transmettent des données, des services de télécommunication et de signalisation sur fibre optique, paires torsadées métalliques, et/ou des données à large bande sur des unités coaxiales, et conserve l'option de fournir du courant électrique aux équipements distants.<br/>
    Les exigences relatives à la performance de chaque élément de câble (coaxial, à paires symétriques et à fibre optique) et les applications prises en charge correspondent à celles qui sont spécifiées dans les séries de normes suivantes: IEC 61196, IEC 61156, et IEC 60794 respectivement.<br/>
    Les diverses combinaisons d'éléments de renfort, de matériaux de gaine, de dispositions des fibres, de structure des paires/quartes torsadées, d'écrantage de câble, et de conducteurs parcourus par un courant seront stipulées dans les spécifications suivantes:<br/>
    - IEC 62807-2;<br/>
    - IEC 62807-3.<br/>
    Dans l'IEC 62807 (toutes les parties), les conducteurs parcourus par un courant ne sont pas destinés à être utilisés en tant qu'alimentation secteur. Les exigences relatives à une utilisation spécifique et aux réglementations en matière de sécurité sont définies dans la spécification particulière et la spécification intermédiaire de câble.
