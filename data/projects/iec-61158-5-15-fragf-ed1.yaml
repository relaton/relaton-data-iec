abstract:
- language: fr
  script: Latn
  content: 'L''IEC 61158-5-15:2007 défini les services fournis: à l''utilisateur de la FAL à la frontière entre l''utilisateur et la couche application du modèle de référence de bus de terrain, et à la gestion des systèmes à la frontière entre la couche application et la gestion des systèmes du modèle de référence de bus de terrain. Elle spécifie la structure et les services de la couche application de bus de terrain CEI type 15, en conformité au modèle de référence de base OSI (ISO/CEI 7498) et à la structure de couche application OSI (ISO/CEI 9545). Cette première édition et ses parties d''accompagnement de la sous-série CEI 61158-5 annulent et remplacent la CEI 61158 5:2003. La présente édition de cette partie constitue une révision technique. Cette partie et ses parties d''accompagnement pour le Type 15 annulent et remplacent également la CEI/PAS 62030, publiée en 2004. Elle inclut les modifications suivantes: suppression du précédent bus de terrain de Type 6 en raison du manque d''adéquation au marché; ajout de nouveaux types de bus de terrain; division de la partie 5 de la troisième édition en parties multiples numérotées -5-2,-5-3, ... La présente version bilingue (2014-06) correspond à la version anglaise monolingue publiée en 2007-12.'
