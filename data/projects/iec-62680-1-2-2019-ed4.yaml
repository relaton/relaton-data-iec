abstract:
- language: en
  script: Latn
  content: |-
    IEC 62680-1-2:2019 defines a power delivery system covering all elements of a USB system including: Hosts, Devices, Hubs, Chargers and cable assemblies. This specification describes the architecture, protocols, power supply behavior, connectors and cabling necessary for managing power delivery over USB at up to 100W. This specification is intended to be fully compatible and extend the existing USB infrastructure. It is intended that this specification will allow system OEMs, power supply and peripheral developers adequate flexibility for product versatility and market differentiation without losing backwards compatibility.<br/>
    This fourth edition cancels and replaces the third edition published in 2018 and constitutes a technical revision.<br/>
    It is also identified as USB Power Delivery Specification, Revision 3.0, Version 1.2<br/>
    This updated release of the USB PD specification was made to incorporate all the ECNs that were made to USB PD 3.0, V1.1. This makes a full completed printed specifications with all ECNs incorporated into a hard copy specification.
- language: fr
  script: Latn
  content: |-
    IEC 62680-1-2:2019 définit un système d'alimentation électrique par port USB qui couvre tous les éléments d'un système USB, y compris: hôtes, dispositifs, hubs, chargeurs et assemblages de câbles. La présente spécification décrit l'architecture, les protocoles, le comportement de l'alimentation électrique, les connecteurs et le câblage nécessaires à la gestion de l'alimentation électrique sur USB jusqu'à 100W. Cette spécification est destinée à être entièrement compatible avec les infrastructures USB existantes et à en assurer une extension. Il est prévu que cette spécification offre aux OEM de systèmes, ainsi qu'aux développeurs d'alimentations électriques et de périphériques, une souplesse appropriée pour une polyvalence des produits et leur différenciation sur le marché, sans perdre en compatibilité ascendante.<br/>
    IEC 62680-1-2:2019 annule et remplace la troisième édition publiée en 2018, dont elle constitue une révision technique.
