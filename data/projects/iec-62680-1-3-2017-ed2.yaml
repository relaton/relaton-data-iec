abstract:
- language: en
  script: Latn
  content: IEC 62680-1-1-3:2017(E) is intended as a supplement to the existing USB 2.0, USB 3.1 and USB Power Delivery specifications. It addresses only the elements required to implement and support the USB Type-C receptacles, plugs and cables. Normative information is provided to allow interoperability of components designed to this specification. Informative information, when provided, may illustrate possible design implementations.
