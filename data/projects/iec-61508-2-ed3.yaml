abstract:
- language: en
  script: Latn
  content: |-
    IEC 61508-2:2026 covers those aspects to be considered when electrical/electronic/programmable electronic (E/E/PE) systems are used to carry out safety functions.<br/>
    A first objective is to facilitate the development of product and application sector international standards by the technical committees responsible for the product or application sector. This will allow all the relevant factors, associated with the product or application, to be fully considered and thereby meet the specific needs of users of the product and the application sector.<br/>
    A second objective is to enable the development of E/E/PE safety-related systems where product or application sector international standards do not exist.<br/>
    The scope of this document is functional safety for E/E/PE safety-related systems but, apart from normative requirements in the hazard and risk analysis phase, this document does not itself provide normative requirements for malevolent action arising from a security risk.<br/>
    NOTE 1 For requirements and/or guidance on security, see the IEC 62443 series and ISO/IEC 27000 family.<br/>
    NOTE 2 For guidance on the coordination between safety and security, refer to IEC TR 63069.<br/>
    This edition includes the following significant technical changes with respect to the previous edition:<br/>
    a) the interfaces to other parts of IEC 61508 have been clarified and duplication of requirements in other standards of the IEC 61508 series has been removed;<br/>
    b the differentiation between the required safety integrity level (SIL) and the achieved Systematic Capability (SC) has been clarified;<br/>
    c) semiconductor content relocated to the IEC 61508‑2‑1. This transfer includes the material previously found in Annex E, Annex F and the semiconductor V-model;<br/>
    d) a reference to software off-line support tools has been added in 7.4.6.4;<br/>
    e) requirements on diagnostic functions have been introduced in 7.4.12;<br/>
    f) requirements on traceability have been clarified (Annex B);<br/>
    g) requirements on common cause failures have been introduced in Annex E;<br/>
    h) the normative references and the bibliography have been updated.<br/>
    It has the status of a basic safety publication according to IEC Guide 104 and has been developed according to ISO/IEC Guide 51.
