  script: Latn
  content: 'La CEI 60793-2-60:2008 est applicable aux types de fibres optiques C1, C2, C3, C4, tels que décrits dans le Tableau 1. Ces fibres sont utilisées pour les intraconnexions à l''intérieur de ou entre les composants ou les systèmes ou sous-systèmes photoniques. Mots clés: catégorie C, fibres optiques, intraconnexion fibre'
