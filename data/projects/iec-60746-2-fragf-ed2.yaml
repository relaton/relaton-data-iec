abstract:
- language: fr
  script: Latn
  content: 'La CEI 60746-2:2003 spécifie la terminologie, les définitions, les exigences relatives aux énoncés des caractéristiques par les constructeurs des analyseurs, détecteurs et unités électroniques utilisés pour la détermination du pH des solutions aqueuses; d''établir les essais de qualité de fonctionnement pour ces analyseurs, détecteurs et unités électroniques. Elle fournit les documents de base dans le cadre de l''application des normes d''assurance qualité: ISO 9001, ISO 9002 et ISO 9003.'
