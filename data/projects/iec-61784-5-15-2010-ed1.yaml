abstract:
- language: en
  script: Latn
  content: |-
    IEC 61784-5-15:2010 specifies the installation profiles for CPF 15/1 (MODBUS -TCP) and CPF 15/2 (RTPS).The installation profiles are specified in the annex. This annex is read in conjunction with IEC 61918:2010. This bilingual version (2012-02) corresponds to the monolingual English version, published in 2010-07.<br/>
    <br/>
    This publication is to be read in conjunction with IEC 61918:2010.
- language: fr
  script: Latn
  content: |-
    La CEI 61784-5-15:2010 spécifie les profils d'installation applicables à la CPF 15/1 (MODBUS -TCP) et à la CPF 15/2 (RTPS). Cette annexe est lue conjointement à la CEI 61918:2010. La présente version bilingue (2012-02) correspond à la version anglaise monolingue publiée en 2010-07.<br/>
    <br/>
    Cette publication doit être lue conjointement avec la CEI 61918:2010.
