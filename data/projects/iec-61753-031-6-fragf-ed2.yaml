abstract:
- language: en
  script: Latn
  content: |-
    IEC 61753-031-6: 2014 contains the minimum initial tests and measurement requirements and severities which a non-wavelength selective branching device (NWBD) should satisfy in order to be categorized as meeting the requirements of this standard. The requirements cover balanced bidirectional non-connectorized single-mode 1´N and 2´N non-wavelength-selective branching devices for use in an IEC category O environment (N is the number of branching ports), especially but not exclusively used for PON application. For balanced NWBD, two attenuation and uniformity performance classes are considered: class A (premium class) which meets more restrictive requirements (i.e. for extended reach PON application) and class B (standard class) for standard application (i.e. normal reach PON application). The requirements also cover unbalanced bidirectional non-connectorized single-mode non-wavelength-selective branching devices, however the specifications of unbalanced branching devices are limited to 1 ´ 2 and 2 ´ 2 devices because they are the most commonly used. This second edition of IEC 61753-031-6 cancels and replaces the first edition published in 2008 and constitutes a technical revision. This edition includes the following significant technical changes with respect to the previous edition:

    	deletion of the Introduction;
    	an updated and extended scope to reflect an introduction of two attenuation and uniformity performance classes for balanced NWBD instead of branching device technologies on the market;
    	an updated list of normative references;
    	a more simplified introduction to the two types of spectral bands;
    	Clause 5, Performance requirements, has been updated and extended to reflect the introduction of two attenuation and uniformity performance classes for balanced NWBD;
    	simplified test items to exclude tests for damp heat (steady state) and impact for performance requirements;
    	Annex A has been changed to introduce the calculated and minimum requirements for attenuation and uniformity.

    Keywords: non-wavelength selective branching device (NWBD), IEC category O environment
- language: fr
  script: Latn
  content: |-
    IEC 61753-031-6: 2014 contient les exigences et les sévérités initiales minimales d’essais et de mesures auxquelles il convient qu’un dispositif de couplage indépendant de la longueur d’onde (NWBD, <em>non-wavelength selective branching device</em>) satisfasse afin d’être classé comme satisfaisant aux exigences de la présente norme. Ces exigences couvrent les dispositifs de couplage indépendants de la longueur d’onde 1´N et 2´N en unimodal, non connectorisés, bidirectionnels symétriques destinés à être utilisés dans un environnement de catégorie O selon l’IEC (N correspond au nombre de ports de couplage), qui sont utilisés, en particulier, mais pas de manière exclusive, pour les applications PON. Dans le cas des NWBD symétriques, deux classes d’affaiblissement et d’uniformité sont prises en compte: la classe A (classe de première qualité) qui satisfait aux exigences les plus restrictives (à savoir pour les applications PON étendues) et la classe B (classe normale) pour les applications normales (à savoir les applications PON d’étendue normale). Ces exigences couvrent aussi les dispositifs de couplage indépendants de la longueur d’onde en unimodal, non connectorisés, bidirectionnels asymétriques, toutefois les spécifications des dispositifs de couplage asymétriques sont limitées aux dispositifs 1 ´ 2 et 2 ´ 2, car ce sont les plus couramment utilisés. Cette deuxième édition de l’IEC 61753-031-6 annule et remplace la première édition parue en 2008 et constitue une révision technique. Cette édition inclut les modifications techniques majeures suivantes par rapport à l’édition précédente:

    	la suppression de l’Introduction;
    	un domaine d’application mis à jour et étendu pour refléter l’introduction de deux classes de performance d’affaiblissement et d’uniformité pour les NWBD symétriques à la place des technologies de dispositifs de couplage du marché;
    	une liste mise à jour des références normatives;
    	une introduction plus simple des deux types de bandes spectrales;
    	l’Article 5, Exigences de performances, a été mis à jour et étendu pour refléter l’introduction de deux classes de performance d’affaiblissement et d’uniformité pour les NWBD symétriques;
    	des éléments soumis à essai simplifiés pour exclure les essais de chaleur humide (essai continu) et d’impact pour les exigences de performance;
    	l’Annexe A a été modifiée pour introduire les exigences calculées et minimales en matière d’affaiblissement et d’uniformité.

    Mots clés: couplage indépendant de la longueur d’onde (NWBD), environnement de catégorie O selon l’IEC
