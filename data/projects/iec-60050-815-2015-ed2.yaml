abstract:
- language: en
  script: Latn
  content: |-
    IEC 60050-815:2015 gives the terms and definitions for the wide area of superconductivity-related technologies, from the physics to their applications representing the present state-of-the-art. The second edition reviews and complements the first edition. This terminology is consistent with the terminology developed in the other specialized parts of the IEV.<br/>
    It has the status of a horizontal standard in accordance with IEC Guide 108.
- language: fr
  script: Latn
  content: |-
    IEC 60050-815:2015 donne les termes et définitions relatifs au vaste domaine des techniques liées à la supraconductivité, depuis la physique de base jusqu'à leurs applications représentant l'état de l'art actuel. Cette deuxième édition révise et complète la première édition. Cette terminologie est en accord avec la terminologie figurant dans les autres parties spécialisées de l'IEV.<br/>
    Elle a le statut de norme horizontale conformément au Guide IEC 108.
