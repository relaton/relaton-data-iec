abstract:
- language: en
  script: Latn
  content: |-
    IEC TS 62840-3:2026 (E), which is a Technical Specification, provides specific requirements and test methods for BSSs operating with HBSs for electric road vehicles. The rated voltage of HBSs is less than 120 V DC.<br/>
    The BSS is intended to be connected to the supply network at standard supply voltages in accordance with IEC 60038, with a rated voltage up to 1 000 V AC or up to 1 500 V DC.<br/>
    This document is applicable to<br/>
    – BSSs for electric vehicles equipped with one or more HBSs,<br/>
    – BSSs supplied from on-site storage systems (e.g. buffer batteries etc.), and<br/>
    – BSSs intended to be installed at an altitude up to 2 000 m.<br/>
    This document is not applicable to<br/>
    – safety aspects related to maintenance,<br/>
    – electrical devices and components which are covered by their specific product standards,<br/>
    – trolley buses and rail vehicles, and<br/>
    – any on-board equipment which is covered by ISO.<br/>
    Requirements for reverse power transfer are under consideration and are not part of this document.<br/>
    <br/>
    <br/>
    This first edition cancels and replaces IEC PAS 62840-3:2021. This edition constitutes a technical revision.<br/>
    This edition includes the following significant technical changes with respect to IEC PAS 62840-3:2021:<br/>
    a) revision of the scope to address battery swap systems operating with handheld-swappable battery systems (HBSs), and extension of the rated supply voltage range to 1 000 V AC or 1 500 V DC;<br/>
    b) restructuring of the document to supplement and modify the requirements of IEC 62840-1:2025 and IEC 62840-2:2025;<br/>
    c) addition of requirements and test methods for charging control, output voltage and current regulation, charging protection, and fault shutdown;<br/>
    d) revision of digital communication requirements between the BSS and HBS, and addition of provisions for communication with management systems and human-machine interaction;<br/>
    e) revision of fire protection requirements, including addition of provisions for fire enclosures and internal combustible materials;<br/>
