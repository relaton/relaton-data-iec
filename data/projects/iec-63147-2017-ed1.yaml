abstract:
- language: en
  script: Latn
  content: |-
    IEC 63147:2017(E) contains the functional and design criteria for accident monitoring instrumentation for new plant designs and nuclear power generating stations desiring to perform design modifications. The purpose of this standard is to establish selection, design, performance, qualification, and display criteria for accident monitoring instrumentation for anticipated operational occurrences, design basis events, and severe accidents.<br/>
    This standard applies to accident monitoring instrumentation intended for use during the following operations:<br/>
    - As required for planned operator action related to accident mitigation,<br/>
    - For assessing plant conditions, safety system performance, and making decisions related to plant response to abnormal events,<br/>
    - For achieving and maintaining safe shutdown following an accident<br/>
    This standard does not apply to the following:<br/>
    - Accident monitoring instrumentation that is intended solely for historical recording or solely for maintenance purposes<br/>
    - Other instrumentation that may be available during accident conditions.<br/>
    This standard is an adoption of IEEE 497-2016  by IEC.<br/>
    When applied in an IAEA / IEC environment this standard is to be used in conjunction with IEC TR 63123.
