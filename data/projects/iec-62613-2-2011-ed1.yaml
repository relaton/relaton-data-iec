abstract:
- language: en
  script: Latn
  content: |-
    IEC 62613-2:2011 applies to accessories with<br/>
    - three phases (3 poles and Earth) with up to three pilot contacts,<br/>
    - one single pole (Neutral), these accessories have rated currents not exceeding 500 A and rated operating voltages not exceeding 12 kV 50/60 Hz.<br/>
    <br/>
    This publication is to be read in conjunction with IEC 62613-1:2011.
- language: fr
  script: Latn
  content: |-
    La CEI 62613-2:2011 s'applique aux appareils<br/>
    - triphasés (3 pôles + Terre) avec jusqu'à 3 contacts pilotes,<br/>
    - unipolaires (Neutre), de courant nominal ne dépassant pas 500 A et de tension nominale d'emploi ne dépassant pas 12 kV 50/60 Hz.<br/>
    <br/>
    Cette publication doit être lue conjointement avec la CEI 62613-1:2011.
