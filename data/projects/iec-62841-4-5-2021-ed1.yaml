abstract:
- language: en
  script: Latn
  content: |-
    IEC 62841-4-5:2021 This document applies to grass shears with a maximum cutting width of 200 mm designed primarily for cutting grass.<br/>
    This document does not apply to hedge trimmers.<br/>
    Hedge trimmers are covered by IEC 62841-4-2.<br/>
    The contents of the corrigendum of January 2024 have been included in this copy.
- language: fr
  script: Latn
  content: |-
    IEC 62841-4-5:2021 Le présent document s'applique aux cisailles à gazon d'une largeur de coupe maximale de 200 mm, conçues principalement pour la tonte du gazon.<br/>
    Le présent document ne s'applique pas aux taille-haies.<br/>
    Les taille-haies sont couverts par l'IEC 62841-4-2.<br/>
    Le contenu du corrigendum de janvier 2024 a été pris en considération dans cet exemplaire.
