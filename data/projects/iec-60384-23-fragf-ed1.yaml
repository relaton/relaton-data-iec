abstract:
- language: fr
  script: Latn
  content: applicable aux condensateurs fixes pour montage en surface à courant continu, avec des électrodes métallisées et des diélectriques en polyéthylène naphtalate et utilisés dans des équipements électroniques. Ces condensateurs possèdent des pastilles de connexion métallisées ou des bandes de soudures et sont destinés à être montés directement sur des substrats de circuits hybrides ou sur des cartes imprimées. Ces condensateurs peuvent posséder des " propriétés autorégénératrices " selon les conditions d'utilisation. Ils sont principalement destinés aux applications dont la composante de courant alternatif est négligeable par rapport à la tension nominale
