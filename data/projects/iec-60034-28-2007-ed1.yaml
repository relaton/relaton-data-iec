  script: Latn
  content: Applies to three-phase low-voltage cage induction motors of frame numbers 56 to 400 as specified in IEC 60072-1. Establishes procedures to obtain values for elements of single phase equivalent circuit diagrams from tests and defines standard elements of these diagrams.
