abstract:
- language: en
  script: Latn
  content: |-
    IEC 60794-1-2: 2017 applies to optical fibre cables for use with telecommunications equipment and devices employing similar techniques, and to cables having a combination of both optical fibres and electrical conductors. The prime objective of this document is to provide the end user with an overview about the content of different parts of the IEC 60794-1 series numbered -2X. Table 1 shows the different parts. <br/>
    Table 1 – Document overview

    	
    		
    			<strong>Test methods</strong>
    			<strong>IEC reference</strong>
    		
    		
    			General guidance
    			IEC 60794-1-2
    		
    		
    			Methods E – Mechanical
    			IEC 60794-1-21
    		
    		
    			Methods F – Environmental
    			IEC 60794-1-22
    		
    		
    			Methods G – Cable elements
    			IEC 60794-1-23
    		
    		
    			Methods H – Electrical
    			IEC 60794-1-24
    		
    		
    			NOTE Several numbers in the test method numbering sequence are missing. The reasons for these omissions are historical. To avoid confusion, the existing numbering sequence has been retained.
    		
    	


     
    These documents define test procedures to be used in establishing uniform requirements for the geometrical, transmission, material, mechanical, ageing (environmental exposure) and climatic properties of optical fibre cables, and electrical requirements where appropriate. Throughout the documents, the wording "optical cable" can also include optical fibre units, microduct fibre units, etc.  The secondary objective of this document is to provide the end user with useful guidance when testing optical fibre cables.  This fourth edition cancels and replaces the third edition published in 2013 and IEC 60794­-1­-20 published in 2014. This edition constitutes a technical revision. This edition includes the following significant technical changes with respect to the previous edition and to IEC 60794-1-20:<br/>
    - the multiple cross-reference tables have been deleted and replaced with a higher level one related to the generic standards;<br/>
    - all pertinent text from IEC 60794-1-20 has been included;<br/>
    - standard optical test wavelengths have been introduced;<br/>
    - this document has been streamlined by cross-referencing IEC 60794-1-1;<br/>
    - the "No change in attenuation" definitions contained in IEC 60794-1-20 have been transferred to IEC 60794-1-1;<br/>
    - the title has been modified to reflect the contents of the new edition.<br/>
    This publication is to be read in conjunction with IEC 60794-1-1:2015.
- language: fr
  script: Latn
  content: |-
    IEC 60794-1-2: 2017 s’applique aux câbles à fibres optiques destinés à être utilisés avec les équipements de télécommunications et les dispositifs utilisant des techniques analogues, ainsi qu'aux câbles constitués d'une combinaison de fibres optiques et de conducteurs électriques.  L'objectif principal du présent document est de fournir à l'utilisateur final une vue d'ensemble sur le contenu des différentes parties de la série IEC 60794-1 portant le numéro -2X. Le Tableau 1 présente les différentes parties. <br/>
    Tableau 1– Vue d'ensemble des documents

    	
    		
    			<strong>Méthodes d'essai</strong>
    			<strong>Référence IEC</strong>
    		
    		
    			Lignes directrices générales
    			IEC 60794-1-2
    		
    		
    			Méthodes E – Essais mécaniques
    			IEC 60794-1-21
    		
    		
    			Méthodes F – Essais environnementaux
    			IEC 60794-1-22
    		
    		
    			Méthodes G – Eléments du câble
    			IEC 60794-1-23
    		
    		
    			Méthodes H – Essais électriques
    			IEC 60794-1-24
    		
    		
    			NOTE Plusieurs numéros de la séquence de numérotation de la méthode d'essai sont manquants. Les raisons de ces omissions sont historiques. Afin d'éviter toute confusion, la séquence de numérotation existante a été retenue.
    		
    	


     
    Ces documents définissent les procédures d’essai à utiliser pour établir des exigences uniformes relatives aux caractéristiques géométriques, de transmission, de matériaux, mécaniques, de vieillissement (exposition à l'environnement) et climatiques des câbles à fibres optiques, ainsi que des exigences électriques, le cas échéant. Tout au long des documents, l'expression "câble optique" peut également inclure des unités de fibres optiques, des unités de fibres en microconduits, etc.  Le deuxième objectif de ce document est de fournir à l'utilisateur final des lignes directrices utiles lors de l'essai de câbles à fibres optiques. Cette quatrième édition annule et remplace la troisième édition publiée en 2013 et l'IEC 60794-1-20 publiée en 2014. Cette édition constitue une révision technique. Cette édition inclut les modifications techniques majeures suivantes par rapport à l'édition précédente et à l'IEC 60794-1-20:<br/>
    - suppression des tableaux des références croisées multiples et remplacement par un table plus général en lien avec les normes génériques;<br/>
    - insertion de tout le texte pertinent de l'IEC 60794-1-20;<br/>
    - introduction de longueurs d'ondes d'essais optiques normalisées;<br/>
    - simplification du présent document par établissement de correspondances avec l'IEC 60794‑1­1;<br/>
    - transfert dans l'IEC 60794-1-1 des définitions "Absence de variation de l'affaiblissement" contenues dans l'IEC 60794-1-20;<br/>
    - modification du titre pour refléter le contenu de la nouvelle édition.<br/>
    Cette publication doit être lue conjointement avec l’IEC 60794-1-1:2015.<br/>
    Mots clés : fibres optiques destinés à être utilisés avec les équipements de télécommunications
