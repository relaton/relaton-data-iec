abstract:
- language: en
  script: Latn
  content: |-
    Applies only to newly manufactured induction type watt-hour meters of accuracy classes 0.5, 1 and 2, for the measurement of alternating current electrical active energy of a frequency in the range 45 Hz to 65 Hz and to their type tests only.
    This publication supersedes IEC 60043 (1960), 60170 (1964) and 60280 (1968).
- language: fr
  script: Latn
  content: |-
    S'applique uniquement aux compteurs à induction neufs, des classes de précision 0,5, 1 et 2, destinés à la mesure de l'énergie électrique active en courant alternatif, à une fréquence comprise entre 45 Hz et 65 Hz, et à leurs essais de type.

    Cette publication remplace les CEI 60043 (1960), 60170 (1964) et 60280 (1968).
