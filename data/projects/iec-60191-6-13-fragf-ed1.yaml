abstract:
- language: fr
  script: Latn
  content: La CEI 60191-6-13:2007 fournit un guide de conception des supports à semi-conducteurs sans couvercle pour les boîtiers matriciels à billes et à pas fins (désignés ci-après "FBGA" abréviation de Fine-pitch Ball Grid Array) et les boîtiers matriciels à zone de contact plate et à pas fins (désignés ci-après "FLGA", Fine-pitch Land Grid Array). La présente norme est destinée à établir les dessins et dimensions d'encombrement du support sans couvercle parmi les supports d'essai et de rodage appliqués aux FBGA et aux FLGA.
