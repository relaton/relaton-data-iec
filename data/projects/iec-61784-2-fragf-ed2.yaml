abstract:
- language: fr
  script: Latn
  content: |-
    La CEI 61784-2:2010 spécifie les indicateurs de performance prenant en charge les schémas de classement pour les exigences RTE (Real-Time Ethernet); les profils et les composants de réseau connexes reposant sur l'ISO/ICEI 8802-3, la série CEI 61158 et la CEI 61784-1; les solutions RTE capables de fonctionner en parallèle avec les applications ISO/CEI 8802-3. Ces profils de communication sont appelés Ethernet en temps réel (RTE). Cette deuxième édition annule et remplace la première édition parue en 2007 et constitue une révision technique. Les principales modifications apportées à l'édition précédente:<br/>
    - mise à jour des références datées à la série CEI 61158, à la CEI 61784-1, à la série CEI 61784-3, à la série CEI 61784-5 et à la CEI 61918 dans tout le document;<br/>
    - mise à jour des tables de sélection pour CPF 2, CPF 3, CPF 11 et CPF 14;<br/>
    - ajout d'un nouveau profil CP 11/2 en 12.3;<br/>
    - ajout d'un nouveau profil CP 14/3 en 15.5;<br/>
    - ajout d'une nouvelle famille de profils de communication CPF 17;<br/>
    - nouveau paragraphe 3.3.12 (symboles CPF 17);<br/>
    - nouvel Article 18 pour CPF 17 avec un profil;<br/>
    - ajout d'une nouvelle famille de profils de communication CPF 18;<br/>
    - nouveau paragraphe 3.3.13 (symboles CPF 18);<br/>
    - nouvel Article 19 pour CPF 18 avec un profil;<br/>
    - modifications de spécification pour CPF3;<br/>
    - mise à jour des exigences de toutes les classes de conformité;<br/>
    - ajout d'exigences de synchronisation précise pour IP;<br/>
    - exigences de synchronisation mises à jour pour les dispositifs d'entrée-sortie;<br/>
    - ajout d'exigences de synchronisation précise pour PTCP;<br/>
    - augmentation du nombre de dispositifs synchronisés en ligne;<br/>
    - intégration d'une fonction supplémentaire de démarrage rapide.<br/>
    La présente version bilingue, correspond à la version anglaise monolingue publiée en 2010-07.
