abstract:
- language: en
  script: Latn
  content: Relates to varnishes used for electrical insulation. All varnishes contain solvent. The varnishes may be used for finishing or impregnating applications, and may be dried or dried and cured at ambient temperatures.
- language: fr
  script: Latn
  content: Traite des vernis utilisés pour l'isolation électrique. Tous les vernis contiennent des solvants. Les vernis peuvent être utilisés pour des applications de finition ou d'impregnation, et peuvent être séchés et/ou durcis à températures ambientes ou à chaud.
