abstract:
- language: en
  script: Latn
  content: |-
    IEC 62439-1:2010 is applicable to high-availability automation networks based on the ISO/IEC 8802-3 (IEEE 802.3) (Ethernet) technology. It specifies:<br/>
    - the common elements and definitions for other parts of the IEC 62439 series;<br/>
    - the conformance test specification (normative);<br/>
    - a classification scheme for network characteristics (informative);<br/>
    - a methodology for estimating network availability (informative);<br/>
    - the configuration rules, calculation and measurement method for a deterministic recovery time in RSTP. This standard cancels and replaces IEC 62439 published in 2008 and constitutes a technical revision. It includes the following changes:<br/>
    - a new calculation method for RSTP (rapid spanning tree protocol, IEEE 802.1Q),<br/>
    - two new redundancy protocols: HSR (High-availability Seamless Redundancy) and DRP (Distributed Redundancy Protocol),<br/>
    - a new method to calculate the maximum recovery time of RSTP in a restricted configuration (ring) to IEC 62439-1 as Clause 8, new specifications of the HSR (High-availability Seamless Redundancy) protocol, which shares the principles of PRP to IEC 62439-3 as Clause 5, and<br/>
    - introduces the DRP protocol as IEC 62439-6. This bilingual version (2013-07) corresponds to the monolingual English version, published in 2010-02.
