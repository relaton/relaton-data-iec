abstract:
- language: fr
  script: Latn
  content: |-
    L'IEC 61212-1:2006 donne les définitions liées aux désignations à utiliser et aux exigences générales à satisfaire pour les tubes et barres industriels, rigides, ronds, stratifiés à usages électriques fabriqués avec l'une des résines suivantes comme liant: phénolique, époxy (époxyde), mélamine et silicone. Il est admis d'utiliser les matériaux de renfort suivants soit isolément soit en combinaison: papier cellulosique, tissu de coton, tissu de verre, papier mica. Cette deuxième édition annule et remplace la première édition publiée en 1995 et constitue une révision technique. Les principales modifications apportées par rapport à l'édition précédente sont les suivantes: instructions supplémentaires relatives à l'utilisation et à la sécurité de l'application. Reformatage du document pour respecter le format de document actuel de la CEI. Modifications de la méthode de désignation des tubes dans le respect des pratiques courantes. Ajout des nouveaux types EP GC 23 et PF CC 24. Suppression du type PF CP 24.
    Mots clés: tubes et barres industriels rigides, ronds, stratifies, phénolique, époxy (époxyde), melamine, silicone
