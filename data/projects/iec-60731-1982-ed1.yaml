abstract:
- language: en
  script: Latn
  content: Establishes performance requirements for dosimeters with ionization chambers as used in radiotherapy. Applies to ionization chambers and instruments using ionization chambers, intended for the measurement of exposure, exposure rate or related quantities in electromagnetic radiation.
- language: fr
  script: Latn
  content: Etablit les prescriptions de performance des dosimètres à chambre d'ionisation utilisés en radiothérapie. S'applique aux chambres d'ionisation et aux instruments utilisant de telles chambres d'ionisation pour le mesurage d'exposition, de débit d'exposition, ou des grandeurs qui leur sont reliées, pour des rayonnements électromagnétiques.
