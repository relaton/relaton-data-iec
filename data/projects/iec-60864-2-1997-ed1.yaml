abstract:
- language: en
  script: Latn
  content: Deals with the itnerface between a transmitter (or system of transmitters) and the supervisory equipment which is entended to remotely monitor and/or control the transmitter(s). It details the interconnections and facilities to be provided with a view to achieving compatibility between different types and makes of transmitters and supervisory equipement.
- language: fr
  script: Latn
  content: Concerne l'interface ntre les émetteurs ou les systèmes d'émetteurs et l'équipement de télésurveillance qui contrôle et/ou commande à distance l'émetteur (ou les émetteurs). Elle spécifie les interconnexions et les dispositifs à prévoir afin de rendre compatibles entre eux les différents types et les différentes fabrications d'émetteurs et d'équipements de télésurveillance.
