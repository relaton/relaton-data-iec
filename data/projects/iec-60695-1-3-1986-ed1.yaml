abstract:
- language: en
  script: Latn
  content: |-
    This standard should be read in conjunction with IEC 695-1-1. lt deals with the hazard concept, the main objective of the tests, their significant aspects, the evaluation of the fire hazard and a list of suitable ignition sources.

    Has the status of a basic safety publication in accordance with IEC Guide 104.
- language: fr
  script: Latn
  content: |-
    Cette norme doit être lue conjointement avec la CEI 695-1-1. Elle décrit le concept de risque, les objectifs principaux des essais, leurs aspects significatifs, l'évaluation des risques du feu et une liste des sources d'allumage disponibles.

    A le statut d'une publication fondamentale de sécurité conformément au Guide 104.
