abstract:
- language: en
  script: Latn
  content: The parameters defined herein form a specifiable minimum set of specifications that are common to all fibre optic subsystems. Additional parameters may be needed depending on the particular application and technology. Those additional parameters will be specified in the relevant sectional specification and/or detail specification, as appropriate
- language: fr
  script: Latn
  content: Les paramètres définis dans la présente norme forment un ensemble minimal de spécifications communes à tous les sous-systèmes à fibres optiques. Il est possible que des paramètres complémentaires soient nécessaires, selon les applications particulières et la technologie. Ces  paramètres complémentaires seront spécifiés dans la spécification intermédiaire et/ou dans la spécification particulière applicable, selon le cas.
