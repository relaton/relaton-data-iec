- language: en
  script: Latn
  content: Completes IEC 60404-8-6 by introducing a lower magnetic grade into the alloy classes E11 and E31 for iron-nickel alloys and specifying the requirements for iron-cobalt alloys defined as alloy classes F1 to F3 in IEC 60404-1.
