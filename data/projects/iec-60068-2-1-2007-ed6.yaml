abstract:
- language: en
  script: Latn
  content: |-
    IEC 60068-2-1:2007 Deals with cold tests applicable to both non heat-dissipating and heat-dissipating specimens. For non heat-dissipating specimens, Tests Ab and Ad do not deviate essentially from earlier issues. Test Ae has been added primarily for testing equipment that requires being operational throughout the test, including the conditioning periods. The object of the cold test is limited to the determination of the ability of components, equipment or other articles to be used, transported or stored at low temperature. Cold tests cover by this standard do not enable the ability of specimens to withstand or operate during the temperature variations to be assessed. In this case, it would be necessary to use IEC 60068-2-14. The cold tests are subdivided as follows:<br/>
    - Cold tests for non heat-dissipating specimens: * with gradual change of temperature, Ab;<br/>
    - Cold test for heat-dissipating specimens: * with gradual change of temperature, Ad,<br/>
    * with gradual change of temperature, specimen powered throughout, Ae.<br/>
    The procedures given in this standard are normally intended for specimens that achieve temperature stability during the performance of the test procedure. Temperature chamber(s) are constructed and verified in accordance with specifications IEC 60068-3-5 and IEC 60068-3-7. Further guidance for dry heat and cold tests can be found in IEC 60068-3-1 and general guidance in IEC 60068-1. This sixth edition deals with cold tests applicable both to non heat-dissipating and heat-dissipating specimens. For non heat-dissipating specimens, Tests Ab and Ad do not deviate essentially from earlier issues. Test Ae has been added primary for testing equipment that requires being operational throughout the test including the conditioning periods.
- language: fr
  script: Latn
  content: |-
    IEC 60068-2-1:2007 Traite des essais de froid applicables à la fois aux spécimens dissipant de l'énergie et à ceux ne dissipant pas d'énergie. Les essais Ab et Ad destinés à des spécimens ne dissipant pas d'énergie ne présentent pas de modifications importantes par rapport aux éditions précédentes. L'essai Ae a été ajouté principalement pour les appareils d'essais qui impliquent d'être en fonctionnement pendant l'essai incluant des périodes de conditionnement. Le but de l'essai de froid se limite à la détermination de l'aptitude des composants, équipements ou autres articles à être utilisés, transportés ou stockés à basse température. Les essais de froid concernés par la présente norme ne permettent pas de vérifier l'aptitude des spécimens à subir ou à fonctionner pendant les variations de température. Dans ce cas, il serait nécessaire d'utiliser la CEI 60068-2-14. Les essais de froid se subdivisent de la façon suivante:<br/>
    - Essais de froid pour spécimens ne dissipant pas d'énergie: * avec variation lente de la température, Ab;<br/>
    - Essais de froid pour spécimens dissipant de l'énergie: * avec variation lente de la température, Ad;<br/>
    * avec variation lente de la température, pour les spécimens dissipant partout, Ae.<br/>
    La procédure décrite dans cette norme est normalement prévue pour les spécimens qui atteignent la stabilité thermique pendant le déroulement de l'essai. La ou les chambres d'essai en température doivent être conçues et vérifiées selon les spécifications de la CEI 60068-3-5 et de la CEI 60068-3-7. D'autres conseils pour les essais de froid et de chaleur sèche peuvent être trouvés dans la CEI 60068-3-1 et des conseils généraux dans la CEI 60068-1. Cette sixième édition traite des essais de froid applicables à la fois aux spécimens dissipant de l'énergie et à ceux ne dissipant pas d'énergie. Les essais Ab et Ad destinés à des spécimens ne dissipant pas d'énergie ne présentent pas de modifications importantes par rapport aux éditions précédentes. L'essai Ae a été ajouté principalement pour les appareils d'essais qui impliquent d'être en fonctionnement pendant l'essai incluant des périodes de conditionnement.
