abstract:
- language: fr
  script: Latn
  content: 'La CEI 61158-6-12:2010 spécifie le protocole de la couche Application de bus de terrain de la CEI, en conformité avec le modèle de référence de base OSI (ISO/CEI 7498) et avec la structure de la couche Application OSI (ISO/CEI 9545). Elle vise à définir le protocole mis en place pour définir le comportement visible de l''extérieur associé à leur transfert. Cette deuxième édition annule et remplace la première édition parue en 2007. Elle constitue une révision technique. Les principales modifications sont: correction d''erreurs et améliorations rédactionnelles.'
