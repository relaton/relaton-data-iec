abstract:
- language: en
  script: Latn
  content: Deals with the standard conditions and methods of measurement on high definition television (HDTV) displays. Deals with the determination of performance and permits comparision of equipment by listing characteristics useful for specifications and laying down uniform methods of measurement.
- language: fr
  script: Latn
  content: Traite des conditions et méthodes de mesure normalisées applicables aux dispositifs de visualisation haute définition (TVHD). Permet la détermination du niveau de performance d'équipements ainsi que leur comparaison en dressant la liste des caractéristiques représentatives et en proposant des méthodes uniformes de mesure.
