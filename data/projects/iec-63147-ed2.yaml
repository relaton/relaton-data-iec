abstract:
- language: en
  script: Latn
  content: |-
    IEC 63147:2026 contains the functional and design criteria for accident monitoring instrumentation for new nuclear power plant designs and design modifications for nuclear power generating stations.<br/>
    <br/>
    This second IEC edition cancels and replaces the first edition published in 2017. This edition constitutes a technical revision. IEEE Std 497-2016 and IEC TR 63123 have served as a basis for the development of this document.<br/>
    <br/>
    This edition includes the following significant technical changes with respect to the previous editions:<br/>
    <br/>
    A.) reactor technology neutral approach including consideration of advanced reactor applications;<br/>
    B.) international usability based on better alignment with IEC SC 45A and the IAEA Nuclear Safety and Security Glossary, 2022 (Interim) Edition;<br/>
    C.) incorporation of user feedback, including application of Type F variables;<br/>
    D.) consideration for risk-informed techniques;<br/>
    E.) NRC RG 1.97 Rev.5 Position Statements.
