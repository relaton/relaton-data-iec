abstract:
- language: en
  script: Latn
  content: |-
    IEC 61158-6-26:2019 provides common elements for basic time-critical and non-time-critical messaging communications between application programs in an automation environment and material specific to Type 2 fieldbus. The term “time-critical” is used to represent the presence of a time-window, within which one or more specified actions are required to be completed with some defined level of certainty. Failure to complete specified actions within the time window risks failure of the applications requesting the actions, with attendant risk to equipment, plant and possibly human life.<br/>
    This International Standard specifies interactions between remote applications and defines the externally visible behavior provided by the Type 2 fieldbus application layer. The purpose of this document is to define the protocol provided to<br/>
    a) define the wire-representation of the service primitives defined in this document, and<br/>
    b) define the externally visible behavior associated with their transfer. This document specifies the protocol of the Type 2 fieldbus application layer, in conformance with the OSI Basic Reference Model (ISO/IEC 7498-1) and the OSI application layer structure (ISO/IEC 9545).
- language: fr
  script: Latn
  content: |-
    L'IEC 61158-6-26:2019 fournit des éléments communs pour les communications de messagerie prioritaires et non prioritaires élémentaires entre les programmes d’application des environnements d’automatisation et le matériel spécifique au bus de terrain de type 26. On utilise le terme "prioritaire" pour traduire la présence d’une fenêtre temporelle, à l’intérieur de laquelle une ou plusieurs actions spécifiées doivent être terminées avec un niveau de certitude défini. Si les actions spécifiées ne sont pas réalisées dans la fenêtre temporelle, les applications demandant les actions risquent de connaître une défaillance, avec les risques que cela comporte pour les équipements, les installations et éventuellement la vie humaine.<br/>
    La présente norme définit de manière abstraite le comportement, visible par un observateur externe, assuré par les différents Types de la couche Application de bus de terrain, en termes<br/>
    a) de syntaxe abstraite définissant les unités de données de protocole de la couche Application, transmises entre les entités d'application en communication,<br/>
    b) de syntaxe de transfert définissant les unités de données de protocole de la couche Application, transmises entre les entités d'application en communication;<br/>
    c) de diagramme d'états de contexte d'application définissant le comportement de service d'application observable entre les entités d'application en communication; et<br/>
    d) de diagrammes d'états de relations d'applications définissant le comportement de communication visible entre les entités d'application en communication.
