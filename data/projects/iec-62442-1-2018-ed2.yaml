abstract:
- language: en
  script: Latn
  content: IEC 62442-1:2018 defines a measurement and calculation method of the total input power for controlgear-lamp circuits when operating with their associated fluorescent lamp(s). The calculation method for the efficiency of the lamp controlgear is also defined. This document applies to electrical controlgear-lamp circuits consisting only of the controlgear and the lamp(s). It is intended for use on DC supplies up to 1 000 V and/or AC supplies up to 1 000 V at 50 Hz or 60 Hz. This second edition cancels and replaces the first edition published in 2011. This edition constitutes a technical revision and has been harmonized with IEC 62442-2 and IEC 62442­-3.
- language: fr
  script: Latn
  content: IEC 62442-1:2018 définit une méthode de mesure et de calcul de la puissance d'entrée totale pour les circuits d’appareillage-lampe fonctionnant avec la ou les lampes à fluorescence qui leur sont associées. La méthode de calcul du rendement des appareillages de lampe est également définie. Le présent document s'applique aux circuits électriques d’appareillage de lampe constitués exclusivement de l'appareillage et de(s) lampe(s). Il s'applique à des alimentations en courant continu jusqu’à 1 000 V et/ou à des alimentations en courant alternatif de 1 000 V au maximum, à 50 Hz ou 60 Hz. Cette deuxième édition annule et remplace la première édition parue en 2011. Cette édition constitue une révision technique et a été harmonisée avec l’IEC 62442-2 et l’IEC 62442-3.
