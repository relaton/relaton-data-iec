abstract:
- language: en
  script: Latn
  content: |-
    IEC 62386-225:2026 is applicable to control gear for emergency lighting applications with additional functionality supporting adaptive emergency escape lighting. This document builds on the digital addressable lighting interface as specified in the IEC 62386 series.<br/>
    This document is applicable to control gear complying with IEC 62386-102 when combined with either IEC 62386-202 or IEC 62386-220.
