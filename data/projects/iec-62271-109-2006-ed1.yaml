abstract:
- language: en
  script: Latn
  content: This International Standard is applicable to a.c. series capacitor by-pass switches designed for outdoor installation and for operation at frequencies of 50 Hz and 60 Hz on systems having voltages above 52 kV. It is only applicable to by-pass switches for use in three-phase systems.
- language: fr
  script: Latn
  content: La présente Norme internationale est applicable aux interrupteurs de contournement pour condensateurs série à courant alternatif conçus pour l'installation à l'extérieur et pour fonctionner à des fréquences de 50 Hz à 60 Hz, sur des réseaux de tensions supérieures à 52 kV. Elle s'applique uniquement aux interrupteurs de contournement destinés à être utilisés dans les systèmes triphasés.
