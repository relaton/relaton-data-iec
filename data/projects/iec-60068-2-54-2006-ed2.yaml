abstract:
- language: en
  script: Latn
  content: 'IEC 60068-2-54:2006 outlines Test Ta, solder bath wetting balance method applicable for any shape of component terminations to determine the solderability. It is especially suitable for reference testing and for components that cannot be quantitatively tested by other methods. For surface mounting devices (SMD), IEC 60068-2-69 should be applied if it is suitable. This standard provides the standard procedures for solder alloys containing lead (Pb) and for lead-free solder alloys. This second edition cancels and replaces the first edition, published in 1985 and constitutes a technical revision. The major technical changes with regard to the previous edition concern: - the addition of lead free solder alloy (see Clause 7, Materials); - reversal of force-time curves to align with IEC 60068-2-69 (see Figure 2 and Figure B.1); - modification to the test requirement for progress of wetting (see Clause 9).'
- language: fr
  script: Latn
  content: |-
    La CEI 60068-2-54:2006 décrit l'essai Ta qui consiste en la méthode de la balance de mouillage de bain de soudure applicable qui permet de déterminer la soudabilité des terminaisons de composants de toute forme. Elle est particulièrement adaptée aux essais de référence et aux composants qui ne peuvent pas être soumis à essai quantitativement par d'autres méthodes. Pour des dispositifs de montage en surface (SMD), il convient d'appliquer la CEI 60068-2-69 si cela est approprié. La présente norme fournit les procédures normalisées pour les alliages à braser contenant du plomb (Pb) et pour les alliages à braser sans plomb. Cette seconde édition annule et remplace la première édition publiée en 1985 et constitue une révision technique. Les principales modifications techniques apportées par rapport à l'édition précédente concernent:<br/>
    - l'addition de l'alliage à braser sans plomb (voir l'Article 7, Matériaux);<br/>
    - l'inversion des courbes force-temps pour se conformer à la CEI 60068-2-69 (voir la Figure 2 et la Figure B.1);<br/>
    - la modification de l'exigence d'essai pour la progression du mouillage (voir l'Article 9).
