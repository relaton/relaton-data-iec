abstract:
- language: en
  script: Latn
  content: Describes a method for characterizing the modal structure of a graded-index multimode fibre. The information is useful for assessing the bandwidth performance of a fibre when used with laser sources. Applies only to multimode, graded-index glass-core (category A1) fibres. The test method is commonly used in production and research facilities, however is not easily accomplished in the field.
- language: fr
  script: Latn
  content: |-
    Décrit une méthode de caractérisation de la structure modale d'une fibre multimodale à gradient d'indice. Cette information est utile pour évaluer les performances de largeur de bande d'une fibre lorsqu'elle est utilisée avec des sources lasers.
    S'applique uniquement aux fibres multimodales à cur en verre à gradient d'indice (catégorie A1). Cette méthode d'essai est généralement utilisée dans les installations de production et de recherche et n'est pas facilement réalisée sur le terrain
