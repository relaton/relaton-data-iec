abstract:
- language: en
  script: Latn
  content: |-
    IEC 60730-2-7:2015 applies to timers and time switches for household and similar use that may use electricity, gas, oil, solid fuel, solar thermal energy, etc. or a combination thereof, including heating, air conditioning and similar applications. This standard is also applicable to individual timers utilized as part of a control system or timers which are mechanically integral with multifunctional controls having non-electrical outputs. This standard does not apply to time-delay switches (TDS) within the scope of IEC 60669-2-3. This standard applies to the inherent safety, to the operating characteristics where such are associated with equipment protection and to the testing of timers used in appliances and other apparatus, electrical and non-electrical, for household and similar purposes, but also extended to industrial purposes when no dedicated product standards exist, such as that for central heating, air conditioning, process heating, etc. Timers for equipment not intended for normal household use, but which nevertheless may be used by the public, such as equipment intended to be used by laymen in shops, in light industry and on farms, are within the scope of this standard. This third edition cancels and replaces the second edition published in 2008. This third edition constitutes a technical revision. This new edition revises the compliance criteria of type 1.S and 2.S action, revises the requirements for filament lamp loads, adds requirements for abnormal operation in Annex H, removes some special requirements for single countries as well as updates the standard to IEC 60730-1:2010, fourth edition. Key words: Timers, Time Switches<br/>
    <br/>
    This publication is to be read in conjunction with IEC 60730-1:2013.
- language: fr
  script: Latn
  content: |-
    <p>IEC 60730-2-7:2015 s'applique aux minuteries et aux minuteries cycliques qui peuvent utiliser l'électricité, le gaz, le pétrole, un combustible solide, l'énergie thermique solaire, etc., ou une combinaison de ces énergies, y compris des applications de chauffage, de climatisation et analogues.</p>

    <p>La présente norme s'applique également aux minuteries particulières qui sont utilisées en tant que parties d'un système de commande ou aux minuteries qui sont intégrées mécaniquement dans des dispositifs de commande multifonctions qui possèdent des sorties non électriques. La présente norme ne s'applique pas aux interrupteurs temporisés (Time-Delay Switches – TDS) qui relèvent du domaine d'application de l’IEC 60669-2-3.</p>

    <p>La présente norme s'applique à la sécurité intrinsèque, aux caractéristiques de fonctionnement dans la mesure où elles interviennent dans la protection des matériels ainsi qu'aux essais des minuteries utilisées dans les appareils et autres appareillages, électriques et non électriques, à usage domestique et analogue, mais aussi avec une extension aux applications industrielles pour lesquelles il n'existe aucune norme de produit spécifique, telles que celles pour le chauffage central, la climatisation, la production de chaleur industrielle, etc.</p>

    <p>Les minuteries pour les matériels qui ne sont pas prévus pour un usage domestique normal, mais qui peuvent néanmoins être utilisés par le grand public, comme les matériels prévus pour être utilisés par des profanes dans les magasins, dans l'industrie légère et dans les fermes, entrent dans le domaine d'application de la présente norme.</p>

    <p>Cette troisième édition annule et remplace la deuxième édition parue en 2008. Cette troisième édition constitue une révision technique. La présente nouvelle édition révise les critères de conformité des actions de type 1.S et 2.S ainsi que les exigences pour les charges par lampes à filament, elle ajoute des exigences pour le fonctionnement anormal dans l'Annexe H, elle supprime une partie des exigences spécifiques à certains pays et elle met la norme à jour par rapport à l'IEC 60730-1:2010, quatrième édition.</p>

    <p>Mots clés: minuteries, minuteries cycliques</p>

    <p>La présente partie 2-7 est destinée à être utilisée conjointement avec l'IEC 60730-1:2013.</p>
