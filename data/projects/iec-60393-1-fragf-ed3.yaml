abstract:
- language: fr
  script: Latn
  content: 'L''IEC 60393-1:2008 est applicable à tous les types de potentiomètres résistifs, y compris les potentiomètres à commande par vis, les potentiomètres d''ajustement, les potentiomètres multitours, etc., utilisés dans les équipements électroniques. Elle définit les termes normalisés et établit des procédures de contrôle et des méthodes d''essai normalisées à utiliser dans les spécifications intermédiaires et particulières de composants électroniques pour l''assurance de la qualité ou à toute autre fin. Elle a été principalement rédigée, et les méthodes d''essai ont été décrites, pour être en conformité avec les potentiomètres rotatifs monotour avec axe de commande, qui sont largement répandus. Cette édition comporte les modifications techniques significatives suivantes par rapport à la précédente édition: mise en oeuvre de l''Annexe H, qui remplace la section 3 de la précédente édition.'
