abstract:
- language: fr
  script: Latn
  content: 'La CEI 61937-7:2004 spécifie la méthode pour l''interface audionumérique spécifiée dans la CEI 60958 pour acheminer des flux de bits MIC non linéaire codés selon les formats ATRAC, ATRAC2/3 et ATRAC-X. La présente deuxième édition annule et remplace la première édition parue en 2002. Cette édition constitue une révision technique. Elle contient les importantes modifications techniques suivantes: Dans cette édition, un nouveau type de données audio au format ATRAC-X est ajouté au aux formats ATRAC et ATRAC2/3. Les caractéristiques particulières, telles que les points de référence, la période de répétition, la méthode pour combler les intervalles entre flux et le temps de latence du décodage, sont spécifiées pour le type de données ATRAC-X.'
