abstract:
- language: en
  script: Latn
  content: |-
    IEC 60191-6-12:2011 provides standard outline drawings, dimensions, and recommended variations for all fine-pitch land grid array packages (FLGA) with terminal pitch of 0,8 mm or less. This edition includes the following significant changes with respect to the previous edition:<br/>
    - scope is expanded so that this standard include the square type FLGA. The title of this standard has been changed accordingly: "Rectangular type" has been deleted from the title;<br/>
    - ball pitch of 0,3 mm has been added;<br/>
    - datum is changed from the body datum to the ball datum;<br/>
    - combination lists of D, E, MD, and ME have been revised.
- language: fr
  script: Latn
  content: |-
    La CEI 60191-6-12:2011 fournit les dessins d'encombrement, les dimensions, et les variations recommandées, normalisés pour tous les boîtiers matriciels à plots et à pas fins (FLGA: Fine-Pitch Ball Grid Array Package) comportant des pas de bornes inférieurs ou égaux à 0,8 mm. La présente édition inclut les modifications significatives suivantes par rapport à l'édition antérieure:<br/>
    - le domaine d'application est étendu afin que la présente norme couvre aussi les FLGA de type carré. Le titre de la norme a été modifié en conséquence. "Type rectangulaire" a été supprimé du titre;<br/>
    - le pas de bille de 0,3 mm a été ajouté;<br/>
    - la référence passe de "référence du corps" à "référence de la bille";<br/>
    - les listes de combinaison de D, E, MD, et ME ont été révisées.
