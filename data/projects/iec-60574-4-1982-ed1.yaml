  script: Latn
  content: Enonce les valeurs électriques recommandées pour réaliser une interconnexion correcte dans les systèmes audiovisuels. Dans ce contexte «interconnexion correcte» n'implique pas nécessairement un transfert maximal de puissance d'un circuit à l'autre.
