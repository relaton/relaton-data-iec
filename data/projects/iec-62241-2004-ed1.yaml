  content: Fournit les exigences fonctionnelles applicables aux systèmes d'alarme des salles de commande principales des centrales nucléaires de puissance. Etablit aussi les exigences relatives aux facteurs humains ainsi que les lignes directrices pour la conception de la présentation des alarmes dans la salle principale de commande des centrales nucléaires.
