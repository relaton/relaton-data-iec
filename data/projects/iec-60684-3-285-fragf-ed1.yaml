abstract:
- language: fr
  script: Latn
  content: |-
    L'IEC 60684-3-285:2014 donne les exigences relatives aux gaines thermorétractables pour isolation de jonction moyenne tension, avec une plage de rapports de rétreint. Il a été établi que ces gaines sont adaptées à une utilisation à des températures allant jusqu'à 100 °C. Ces gaines sont normalement fournies en couleur, rouge ou marron. Comme ce type de gaines couvre une gamme très large de dimensions et d'épaisseurs de paroi, la dimension réelle fera l'objet d'un accord entre l'acheteur et le fournisseur. Les matériaux conformes à la présente norme satisfont à des niveaux de performance établis. Cependant, il convient que le choix d'un matériau par un utilisateur pour une application spécifique soit fondé sur les exigences réelles nécessaires pour obtenir les performances satisfaisantes pour cette application, et qu'il ne soit pas fondé uniquement sur la présente norme. Ces gaines sont conçues pour être utilisées dans des accessoires de câbles moyenne tension et, en conséquence, les performances électriques sont définies dans le cadre de l'assemblage concerné. De tels exemples sont décrits dans le HD 629 et l'IEC 60502.
    Mots clés: gaines thermorétractables pour isolation de jonction moyenne tension, gaines isolantes souples à usages électriques.
