abstract:
- language: fr
  script: Latn
  content: L'IEC TR 62874:2015, qui est un rapport technique, est destiné à estimer la vie thermique consommée de l'isolation cellulosique d'un transformateur, grâce à l'analyse de certains composés dissous dans l'huile minérale isolante. Une comparaison entre les résultats d'analyse de 2-furfural (2-FAL) et d oxyde de carbone et de leurs valeurs types correspondantes estimées pour différentes familles d'équipement donne des informations sur la dégradation thermique estimée des papiers.
