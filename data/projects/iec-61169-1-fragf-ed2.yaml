abstract:
- language: fr
  script: Latn
  content: |-
    L'IEC 61169-1:2013 est une spécification générique, qui s'applique aux connecteurs pour fréquences radioélectriques de lignes de transmission pour fréquences radioélectriques destinés à être utilisés dans des équipements de télécommunications, électroniques et similaires. Elle fournit la base de spécifications intermédiaires qui s'appliquent à des types de connecteurs distincts. Elle a pour objet de fixer des concepts et des procédures uniformes concernant:<br/>
    - la terminologie;<br/>
    - les valeurs assignées et les caractéristiques;<br/>
    - les procédures d'essai et de mesure concernant les propriétés électriques, mécaniques et climatiques;<br/>
    - la classification des connecteurs d'après les procédures d'essais climatiques relatives à la température et à l'humidité. Les méthodes et les procédures d'essai de la présente norme sont d'abord prévues pour des essais d'approbation de type. Cette deuxième édition annule et remplace la première édition parue en 1992, ainsi que ses amendements 1 (1996) et 2 (1997). Cette édition constitue une révision technique. Par rapport à l'édition antérieure, les méthodes d'essai ainsi que la terminologie ont été mises à jour. Le contenu du corrigendum publié en Février 2016 est inclus.
