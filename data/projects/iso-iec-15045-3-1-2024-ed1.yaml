abstract:
- language: en
  script: Latn
  content: |-
    ISO/IEC 15045-3-1:2024 describes the series of privacy, security, and safety standards to support the HES Gateway and attached devices. The purpose is to specify methods for protecting home and building systems from both internal and external threats, intrusions, or unintended observation of data and unsafe conditions that could result from network functions. Part 3 defines a set of basic and advanced requirements for gateway monitoring and control of both inbound and outbound traffic, including switching/routing, addressing, encryption, intrusion detection and prevention, and other “firewall” functions.<br/>
    The Part 3 requirements specify the following functions:<br/>
    1) prevention of active inbound attacks and unsafe commands,<br/>
    2) discovery and classification of outbound traffic,<br/>
    3) interoperability of premises internal network traffic,<br/>
    4) management of privacy and security mechanisms, and<br/>
    5) provision for a management and reporting dashboard for use by the non-technical end-user.<br/>
    This standard describes the inter-relationships between privacy, security, and safety.
