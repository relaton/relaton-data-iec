abstract:
- language: en
  script: Latn
  content: |-
    IEC 63466-1:2025 specifies the general requirements and test methods for leaky waveguides, including terms and definitions, design and structure, type designation, ratings and characteristics, identification, marking and labelling, requirements and test methods, etc.<br/>
    This document is applicable to leaky waveguides, including rigid rectangular leaky waveguides and elliptic leaky waveguides. These leaky waveguides are intended for use in tunnels, railways, highways, subways, elevators and other installations in which conventional antenna transmission is not satisfactory or even impossible.
- language: fr
  script: Latn
  content: |-
    L’IEC 63466-1:2025 spécifie les exigences générales et les méthodes d’essai relatives aux guides d’ondes de fuite, notamment les termes et les définitions, la conception et la structure, la désignation de type, les valeurs assignées et les caractéristiques, l’identification, le marquage et l’étiquetage, les exigences et les méthodes d’essai, etc.<br/>
    Le présent document s'applique aux guides d'ondes de fuite, y compris les guides d'ondes de fuite rectangulaires rigides et les guides d'ondes de fuite elliptiques. Ces guides d’ondes de fuite sont destinés à être utilisés dans des tunnels, voies ferrées, autoroutes, métros, ascenseurs et toute autre installation dans laquelle une transmission conventionnelle par antenne est insatisfaisante, voire même impossible.
