abstract:
- language: en
  script: Latn
  content: IEC 62035:2014 specifies the safety requirements for discharge lamps (excluding fluorescent lamps) for general lighting purposes. This second edition cancels and replaces the first edition published in 1999, AMD1:2003 and AMD2:2012. This edition constitutes a technical revision. This edition includes the following significant technical changes with respect to the previous edition. Photobiological safety requirements are taken care of on basis of the risk group concept of IEC 62471 and the technical report IEC TR 62778 on blue light hazard. This has consequences for terms, marking, structure of 4.6, and introduction of a new symbol "Caution, do not stare at light source". Special attention is given to blue light hazard. This bilingual version (2016-11) corresponds to the monolingual English version, published in 2014-04. The French version of this standard has not been voted upon.
- language: fr
  script: Latn
  content: 'L''IEC 62035:2014 spécifie les exigences de sécurité auxquelles doivent répondre les lampes à décharge (à l''exclusion des lampes à fluorescence) destinées à l''éclairage général. Cette deuxième édition annule et remplace la première édition publiée en 1999, AMD1: 2003 et AMD2: 2012. Cette édition constitue une révision technique. La présente édition inclut les modifications techniques significatives suivantes par rapport à l''édition précédente. Les exigences de sécurité photobiologique sont prises en charge sur la base de la notion de groupe à risque de l''IEC 62471 et du rapport technique IEC TR 62778 sur les dangers de la lumière bleue. Cela a des conséquences sur les termes, le marquage, la structure de 4,6, et l''introduction d''un nouveau symbole "Attention, ne pas regarder la source de lumière". Une attention particulière est accordée aux dangers de la lumière bleue. La présente version bilingue (2016-11) correspond à la version anglaise monolingue publiée en 2014-04. La version française de cette norme n''a pas été soumise au vote.'
