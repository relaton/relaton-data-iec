abstract:
- language: en
  script: Latn
  content: IEC 60127-7:2026 covers requirements for miniature fuse-links for special applications. This part of IEC 60127 is applicable to fuse-links with a rated voltage not exceeding 1 000 V, a rated current not exceeding 125 A and a rated breaking capacity not exceeding 50 kA. It does not apply to fuses completely covered by the subsequent parts of IEC 60269-1. It does not apply to miniature fuse-links for appliances intended to be used under special conditions, such as in corrosive or explosive atmospheres.
- language: fr
  script: Latn
  content: L'IEC 60127-7:2026 traite des exigences relatives aux éléments de remplacement miniatures pour applications spéciales. La présente partie de l'IEC 60127 s'applique aux éléments de remplacement avec une tension assignée qui ne dépasse pas 1 000 V, un courant assigné qui ne dépasse pas 125 A et un pouvoir de coupure assigné qui ne dépasse pas 50 kA. Elle ne s'applique pas aux coupe‑circuits totalement couverts par les parties suivantes de l'IEC 60269‑1. Elle ne s'applique pas aux éléments de remplacement miniatures placés dans des appareils destinés à être utilisés dans des conditions particulières, comme des atmosphères corrosives ou explosives.
