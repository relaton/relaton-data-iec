abstract:
- language: en
  script: Latn
  content: |-
    IEC/TR 61850-1:2013 is applicable to power utility automation systems and defines the communication between intelligent electronic devices in such a system, and the related system requirements. This part gives an introduction and overview of the IEC 61850 standard series. This edition includes the following significant technical changes with respect to the previous edition:<br/>
    - extended application scope of the IEC 61850 standard:<br/>
    - power quality domain;<br/>
    - statistical and historical data;<br/>
    - distributed generation monitoring and automation purpose;<br/>
    - for substation to substation communication;<br/>
    - smart grid considerations.
- language: fr
  script: Latn
  content: |-
    La CEI/TR 61850-1:2013 s'applique aux systèmes d'automatisation des systèmes électriques et définit les communications entre les dispositifs électroniques intelligents dans un tel système ainsi que les exigences liées au système correspondant. Cette édition inclut les modifications techniques majeures suivantes par rapport à l'édition précédente:<br/>
    - extension du domaine d'application de la norme CEI 61850 qualité de l'électricité;<br/>
    - support des données statistiques et historiques;<br/>
    - surveillance et d'automatisation des unités de production distribuées;<br/>
    - communications entre postes;<br/>
    - considérations relatives au réseau d'électricité intelligent.
