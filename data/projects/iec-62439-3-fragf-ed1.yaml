abstract:
- language: fr
  script: Latn
  content: |-
    L'IEC 62439-3:2009 spécifie deux protocoles de redondance basés sur la duplication du réseau local ou sur la duplication des informations transmises, afin de permettre une reprise transparente en cas de défaillance unique d'une maille inter-étage ou d'un commutateur au sein du réseau. La présente norme annule et remplace l'IEC 62439, publiée en 2008. Cette première édition constitue une révision technique. Cette édition inclut les modifications techniques majeures suivantes par rapport à l'édition IEC 62439 (2008):<br/>
    - ajout d'une méthode de calcul pour RSTP (protocole à convergence d'arborescence rapide, IEEE 802.1Q),<br/>
    - ajout de deux nouveaux protocoles de redondance: HSR (High-availability Seamless Redundancy) et DRP (Distributed Redundancy Protocol),<br/>
    - transfert des anciens Articles 1 à 4 (introduction, définitions, aspects généraux) et des Annexes (taxonomie, calcul de disponibilité) vers IEC 62439-1, qui sert maintenant de base pour les autres documents,<br/>
    - transfert de l'Article 5 (MRP) vers IEC 62439-2 avec des modifications éditoriales mineures,<br/>
    - transfert de l'Article 6 (PRP) vers IEC 62439-3 avec des modifications éditoriales mineures,<br/>
    - transfert de l'Article 7 (CRP) vers IEC 62439-4 avec des modifications éditoriales mineures,<br/>
    - transfert de l'Article 8 (BRP) vers IEC 62439-5 avec des modifications éditoriales mineures,<br/>
    - ajout d'une méthode pour calculer le temps de rétablissement maximum de RSTP dans une configuration limitée (anneau) à la norme IEC 62439-1 sous forme d'Article 8,<br/>
    - ajout des spécifications du protocole HSR (High-availability Seamless Redundancy), qui partage les principes de PRP à la norme IEC 62439-3 sous forme d'Article 5, et<br/>
    - présentation du protocole DRP comme norme IEC 62439-6. La présente version bilingue (2016-07) correspond à la version anglaise monolingue publiée en 2012-07.
