  script: Latn
  content: IEC/TS 62654:2012(E) defines the architecture and functional requirements of an energy saving system (ESS) that measures energy consumption of each home appliance, including AV multimedia equipment and systems, and shows how to reduce its standby power. With respect to energy consumption measurements, this specification extends only to AC power environments in premises.
