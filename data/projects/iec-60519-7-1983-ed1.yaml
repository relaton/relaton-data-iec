abstract:
- language: en
  script: Latn
  content: Deals with the safety of electroheating installations with electron guns and is to be read in conjunction with IEC 60519-1. Applies also to the high-voltage source supplied to electron guns and may also be used for equipment employing glow discharge heating systems, where applicable.
- language: fr
  script: Latn
  content: |-
    Traite de la sécurité des installations électrothermiques comportant des canons à électrons et doit être considérée conjointement avec la CEI 60519-1.
    S'applique également à la source de haute tension fournie aux canons à électrons et peut aussi être étendue aux installations de chauffage par effluves, dans la mesure où elle s'applique.
