abstract:
- language: en
  script: Latn
  content: |-
    IEC 61158-6-19:2019 provides common elements for basic time-critical and non-time-critical messaging communications between application programs in an automation environment and material specific to Type 19 fieldbus. The term “time-critical” is used to represent the presence of a time-window, within which one or more specified actions are required to be completed with some defined level of certainty. Failure to complete specified actions within the time window risks failure of the applications requesting the actions, with attendant risk to equipment, plant and possibly human life.<br/>
    This International Standard defines in an abstract way the externally visible service provided by the different Types of fieldbus Application Layer in terms of:<br/>
    a) an abstract model for defining application resources (objects) capable of being manipulated by users via the use of the FAL service;<br/>
    b) the primitive actions and events of the service;<br/>
    c) the parameters associated with each primitive action and event, and the form which they take; and<br/>
    d) the interrelationship between these actions and events, and their valid sequences.<br/>
    The purpose of this document is to define the services provided to:<br/>
    a) the FAL user at the boundary between the user and the Application Layer of the Fieldbus Reference Model, and<br/>
    b) Systems Management at the boundary between the Application Layer and Systems Management of the Fieldbus Reference Model.
- language: fr
  script: Latn
  content: |-
    L’IEC 611586-19:2019 fournit des éléments communs pour les communications de messagerie prioritaires et non prioritaires élémentaires entre les programmes d’application des environnements d’automatisation et le matériel spécifique au bus de terrain de type 19. On utilise le terme "prioritaire" pour traduire la présence d’une fenêtre temporelle, à l’intérieur de laquelle il est exigé qu’une ou plusieurs actions spécifiées soient terminées avec un niveau de certitude défini. Si les actions spécifiées ne sont pas réalisées dans la fenêtre temporelle, les applications demandant les actions risquent de connaître une défaillance, avec les risques que cela comporte pour les équipements, les installations et éventuellement la vie humaine.<br/>
    La présente norme définit de manière abstraite le service, visible par un observateur externe, assuré par les différents Types de la couche Application de bus de terrain, en termes<br/>
    a) de modèle abstrait visant à la définition des ressources d’application (objets) qui peuvent être manipulées par des utilisateurs utilisant un service FAL;<br/>
    b) d’événements et d’actions liés aux primitives du service;<br/>
    c) de paramètres associés à chaque événement et action de primitive, ainsi que de forme prise par ces paramètres; et<br/>
    d) d’interaction entre ces événements et ces actions, ainsi que de séquences valides desdits événements et actions.<br/>
    Le but du présent document est de définir les services fournis à:<br/>
    a) l’utilisateur de FAL à la frontière entre l’utilisateur et la Couche application du Modèle de référence de bus de terrain; et<br/>
    b) la Gestion des systèmes au niveau de la frontière entre la Couche application et la Gestion des systèmes selon le Modèle de référence de bus de terrain.
