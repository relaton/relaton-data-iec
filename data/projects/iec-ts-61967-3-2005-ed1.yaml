abstract:
- language: en
  script: Latn
  content: |-
    This part of IEC 61967 provides a test procedure which defines a method for evaluating the near electric, magnetic or electromagnetic field components at or near the surface of an integrated circuit (IC). This diagnostic procedure is intended for IC architectural analysis such as floor planning and power distribution optimization. This test procedure is applicable to measurements from an IC mounted on any circuit board that is accessible to the scanning probe. For comparison of surface scan emissions between different ICs, the standardized test board defined in IEC 61967-1 should be used.

    This technique is capable of providing a detailed pattern of the radio frequency (RF) sources internal to the IC. The resolution of the measurement is determined by the capability of the measurement probe and the precision of the probe positioner. This method is intended for use over the 10 MHz to 1 GHz frequency range. Extended upper frequency limits are possible with existing probe technology but are beyond the scope of this specification. 

    The probe is mechanically scanned according to a programmed pattern in a parallel or perpendicular plane to the IC surface. The data is computer processed to provide a colour- enhanced representation of the field strength at the scan frequency.
- language: fr
  script: Latn
  content: |-
    La présente procédure d'essai définit une méthode d'évaluation des champs proches électrique, magnétique ou électromagnétique émis à la surface ou près de la surface d'un circuit intégré (CI). Cette procédure de diagnostic est destinée à l'analyse architecturale du CI telle que la gestion de couches et l'optimisation de la distribution de puissance. Cette procédure d'essai s'applique aux mesures effectuées sur un CI monté sur tout circuit imprimé accessible à la sonde de balayage. Pour la comparaison des émissions de balayage en surface entre différents CI, il convient que la carte d'essai normalisée définie dans la CEI 61967-1 soit utilisée.

    Cette technique peut fournir une configuration détaillée des sources RF internes du CI. La résolution de la mesure est déterminée par la capacité de la sonde de mesure et par la précision du positionneur de la sonde. Cette méthode est destinée à être utilisée sur la gamme de fréquences comprise entre 10 MHz et 1 GHz. Des limites de fréquence supérieure étendues sont possibles avec la technologie actuelle en matière de sondes mais n'entrent pas dans le domaine d'application de la présente spécification. 

    La sonde est balayée mécaniquement selon une configuration programmée sur un plan parallèle ou perpendiculaire à la surface du CI. Les données sont traitées par ordinateur pour fournir une représentation en couleurs contrastées de l'intensité du champ à la fréquence de balayage.
