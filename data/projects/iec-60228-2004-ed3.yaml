abstract:
- language: en
  script: Latn
  content: |-
    Specifies the nominal cross-sectional areas, in the range 0,5 mm2 to 2 500 mm2, for conductors in electric power cables and cords of a wide range of types. Requirements for numbers and sizes of wires and resistance values are also included.  These conductors include solid and stranded copper, aluminium and aluminium alloy conductors in cables for fixed installations and flexible copper conductors.
    The standard does not apply to conductors for telecommunication purposes.
    The applicability of this standard to a particular type of cable is as specified in the standard for the type of cable.
    Unless indicated to the contrary in a particular clause, this standard relates to the conductors in the finished cable and not to the conductor as made or supplied for inclusion into a cable.
    Informative annexes are included giving supplementary information covering temperature correction factors for resistance measurement (Annex B) and dimensional limits of circular conductors (Annex C).
    The principal changes with respect to the previous edition are as follows:
    a) the consolidation of material from IEC 60228A;
    b) addition of a definition for nominal cross-sectional area;
    c) an increase in the range of conductor sizes in Tables 1 and 2;
    d) addition of a note that solid aluminum alloy conductors, having the same dimensions as aluminum conductors, will have a higher resistance;
    e) strengthening of the recommendations for dimensional limits of compacted stranded copper conductors.
- language: fr
  script: Latn
  content: |-
    Spécifie les sections nominales, dans la plage de 0,5 mm2 à 2 500 mm2, des âmes des conducteurs et des câbles électriques de puissance, dans une large gamme de spécifications. Des exigences sur le nombre et le diamètre des brins et les valeurs de résistance sont également incluses. Les âmes concernées sont les âmes massives et câblées, en cuivre, en aluminium et en alliage d'aluminium, destinées aux câbles pour installations fixes et les âmes en cuivre pour conducteurs souples.
    Cette norme ne s'applique pas aux conducteurs de télécommunication.
    L'applicabilité de cette norme à un type de câble particulier est précisée dans la norme relative à ce type de câble.
    Sauf indication contraire dans un article particulier, cette norme porte sur les âmes des câbles terminés, et non sur les âmes seules ou fournies pour la fabrication d'un câble. 
    Des annexes informatives sont incluses, donnant des informations complémentaires sur les facteurs de correction de température à utiliser dans les mesures de résistance (Annexe B) et les limites dimensionnelles des âmes circulaires (Annexe C).
    Les principaux changements par rapport à l'édition précédente sont les suivants:
    a) l'incorporation des éléments contenus dans la CEI 60228A;
    b) l'ajout d'une définition de la section nominale;
    c) une extension de la gamme des sections d'âmes dans les Tableaux 1 et 2;
    d) l'introduction d'une note précisant que les âmes massives en alliage d'aluminium ayant les mêmes dimensions que les âmes en aluminium auront une résistance plus élevée;  
    e) un renforcement des recommandations concernant les limites dimensionnelles des âmes câblées rétreintes en cuivre
