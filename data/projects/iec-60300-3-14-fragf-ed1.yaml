abstract:
- language: fr
  script: Latn
  content: |-
    Décrit un cadre pour la maintenance et le support de maintenance et les diverses pratiques communes minimales qui peuvent être prises. Souligne, d'une façon générique, la gestion, les procédés et techniques liés à la maintenance et au support de maintenance qui sont nécessaires pour atteindre une sûreté de fonctionnement adéquate répondant aux besoins opérationnels du client. 
    Applicable aux entités, qui comprennent tout type de produits, équipements et systèmes (matériel et logiciel associé). La plupart de ceux-ci nécessitent un certain niveau de maintenance pour assurer que leurs exigences de fonctionnalité, de sûreté de fonctionnement, de capabilité, de coût, de sécurité et de réglementation sont respectées.
