abstract:
- language: en
  script: Latn
  content: |-
    IEC 61300-2-4:2019 is to ensure that the retention or attachment of the fibre, cord or cable in a fibre optic device or an enclosure This second edition cancels and replaces the first edition published in 1995. This edition includes the following significant technical changes with respect to the previous edition:<br/>
    a) addition of Clause 2, Normative references;<br/>
    b) clarification of the test procedures;<br/>
    c) clarification of the severities;<br/>
    d) modification of the whole document structure according to the latest ISO/IEC Directives.<br/>
    Keywords: tensile load applied to the fibre, cord or cable
- language: fr
  script: Latn
  content: |-
    L'IEC 61300-2-4:2019 est de vérifier la rétention ou la fixation de la fibre, du cordon ou du câble à un dispositif fibronique ou à une enveloppe. Cette deuxième édition annule et remplace la première édition parue en 1995. Cette édition inclut les modifications techniques majeures suivantes par rapport à l'édition précédente:<br/>
    a) ajout de l'Article 2, Références normatives;<br/>
    b) clarification des procédures d'essai;<br/>
    c) clarification des sévérités;<br/>
    d) modification de la structure globale du document, conformément aux dernières directives ISO/IEC.<br/>
    Mots-clés: charge de traction appliquée à la fibre, au cordon ou au câble.
