abstract:
- language: en
  script: Latn
  content: |-
    IEC 61892-6:2026 provides specific requirements for the installation of electrical equipment in mobile and fixed offshore units, including floating units, pipeline, pumping or "pigging" stations, compressor stations and single buoy moorings, used in the offshore petroleum industry for drilling, production, accommodation, processing, storage and offloading purposes.<br/>
    It applies to all installations, whether permanent, temporary, transportable or hand-held, to AC installations and DC installations without any voltage level limitation. It is possible that referenced equipment standards give voltage level limitations.<br/>
    This fifth edition cancels and replaces the fourth edition published in 2019. This edition constitutes a technical revision.<br/>
    This edition includes the following significant technical changes with respect to the previous edition:<br/>
    a) elaborated existing requirements to 7.1.2;<br/>
    b) requirements for Lithium ion and Molten salt batteries added in new 9.2.2 and 9.2.3;<br/>
    c) minor changes to text and Table 5 in Clause 15.
