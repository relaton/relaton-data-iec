  script: Latn
  content: S'applique aux gaines isolantes souples et aux éléments thermorétractables destinés principalement à isoler les conducteurs et les raccordements d'appareils. Certains types de gaines conviennent également au recouvrement et au maintien de conducteurs isolés individuellement.
