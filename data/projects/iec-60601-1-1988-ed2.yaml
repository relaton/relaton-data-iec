abstract:
- language: en
  script: Latn
  content: This is the major revised and updated baseline of standards for the safety of all medical electrical equipment used by or under the supervision of qualified personnel in the general medical and patient environment. lt also contains certain requirements for reliable operation to ensure safety. Note the change of title from the first (1977) edition. (For particular requirements see series 601-2 below.)
- language: fr
  script: Latn
  content: La publication majeure de base, révisée et mise à jour, concernant les normes principales pour la sécurité de tout équipement électromédical utilisé dans l'environnement spécifique ou général du patient. Comprend également certaines prescriptions relatives à la fiabilité et sécurité du fonctionnement des appareils. A noter le changement du titre de la première édition (1977). (Pour les normes particulières, voir la série 601-2 ci-dessous.)
