abstract:
- language: en
  script: Latn
  content: |-
    Requirements are applicable to mobile or transportable units.
    For the purpose of this standard, the term 'unit' is intended to mean a vehicle and/or mobile or transportable structure in which all or part of an electrical installation is contained.
    Units are :
    - either of the mobile type, e.g. vehicles (self-propelled or towed);
    - or of the transportable type,e.g. containers or cabins placed on a base frame.
    Examples of the intended use are for broadcasting, medical services, advertising, fire fighting, workshops, etc.
    Two or more units may be electrically connected together.
    The requirements are not applicable to :
    - generating sets
    - marinas and pleasure craft
    - mobile machinery in accordance with IEC 60204-1
    - caravans
    - traction equipment of electric vehicles
    Where applicable, additional requirements as laid down in clauses of Part 7 shall be taken into consideration, e.g. for showers, medical locations, etc
- language: fr
  script: Latn
  content: |-
    Les prescriptions sont applicables aux unités mobiles ou transportables.
    Dans le cadre de cette norme, le terme «unité» est applicable à un véhicule et/ou à une structure mobile ou transportable dans lesquels une installation électrique ou une partie de celle-ci est incorporée.
    Les unités sont
    - soit du type mobile, par exemple véhicules (autopropulsés ou remorqués);
    - soit du type transportable, par exemple conteneurs ou cabines installées sur chantier.
    Des exemples d'utilisations prévues sont les émissions de radio, les services médicaux, la publicité, la lutte contre l'incendie, les ateliers, etc.
    Deux ou plusieurs unités peuvent être électriquement interconnectées.
    Ces prescriptions ne sont pas applicables
    - aux groupes générateurs; 
    - aux marinas et navires de plaisance;
    - aux machines mobiles conformes à la CEI 60204-1;
    - aux caravanes;
    - aux matériels de traction des véhicules électriques.
    Les prescriptions complémentaires des autres articles de la partie 7, si elles sont applicables, seront prises en compte, par exemple pour les douches, les emplacements à usages médicaux, etc
