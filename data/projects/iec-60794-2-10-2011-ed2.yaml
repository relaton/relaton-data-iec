abstract:
- language: en
  script: Latn
  content: |-
    IEC 60794-2-10:2011 covers simplex and duplex optical fibre cables for indoor use except for cables used in terminated assemblies specified by IEC 60794-2-50. The requirements of the Sectional specification IEC 60794-2 are applicable to cables covered by this standard. The main changes with respect to the previous edition are as follows:<br/>
    - A new clause has been introduced: Clause 4 - Dimensions;<br/>
    - Test conditions and requirements have been made more accurate;<br/>
    - The new Subclause 5.5 has been added to give useful figures.<br/>
    <br/>
    This publication is to be read in conjunction with IEC 60794-1-1:2001, IEC 60794-1-2:2003 and IEC 60794-2:2002.
- language: fr
  script: Latn
  content: |-
    La CEI 60794-2-10:2011 couvre les câbles à fibres optiques simplex et duplex pour usage intérieur à l'exception des câbles utilisés dans les cordons spécifiés par la CEI 60794-2-50. Les exigences de la spécification intermédiaire CEI 60794-2 sont applicables aux câbles couverts par la présente norme. Les principales modifications par rapport à l'édition antérieure sont indiquées ci-dessous:<br/>
    - Un nouvel article a été intégré: Article 4 - Dimensions;<br/>
    - Les conditions et exigences d'essai ont été modifiées pour gagner en précision;<br/>
    - Le nouveau Paragraphe 5.5 a été ajouté pour donner des chiffres utiles.<br/>
    <br/>
    <br/>
    Cette publication doit être lue conjointement avec la CEI 60794-1-1:2001, la CEI 60794-1-2:2003 et la CEI 60794-2:2002.
