abstract:
- language: fr
  script: Latn
  content: |-
    La CEI 60068-2-21:2006 est applicable à tous les composants électriques et électroniques dont les sorties ou les dispositifs de montage incorporés sont susceptibles d'être soumis à des contraintes au cours des opérations normales de montage ou de manipulation. La présente édition inclut les modifications techniques significatives suivantes par rapport à l'édition antérieure:<br/>
    - Ajout de la sévérité du couple pour le diamètre nominal du filetage de 8 mm à l'Essai Ud: essai de couple, conformément à la CEI 60252-2 (voir le tableau 5);<br/>
    - Modification de la spécification du substrat et de la méthode de montage décrivant l'alliage à braser sans plomb, à l'Essai Ue (voir la Figure 5 et le 8.3.3 et al.);<br/>
    - Modification du gabarit d'essai et des conditions d'essai concernant l'Essai Ue1: essai de pliage du substrat (voir la Figure 7 et al.);<br/>
    - Modification de la force de poussée passant de 10 N à 5 N dans l'Essai Ue3: essai de cisaillement (voir le 8.5.3.2).
