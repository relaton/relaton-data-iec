abstract:
- language: en
  script: Latn
  content: Describes methods of measurement and special test signals for the analogue audio part of equipment mainly dedicated to recording reproduction of TV signals on mangetic tape on reels or in cassettes. Is applicable to acceptance tests, performance comparison and, as far as possible, to routine checks.
- language: fr
  script: Latn
  content: Décrit les méthodes de mesure et les signaux d'essai particuliers pour la partie audio-analoguique du matériel principalement dédiée à la lecture d'enregistrement de signaux de télévision sur bande magnétique en bobine ou en cassette. S'applique aux essais d'acceptation, aux comparaisons de performances, et autant que possible aux esais de routine.
