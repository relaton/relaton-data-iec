abstract:
- language: en
  script: Latn
  content: |-
    Determines the effect on a specimen of simple standard treatments which are representative of the knocks and jolts likely to occur during repair work or rough handling on a table or bench.

    Has the status of a basic safety publication in accordance with IEC Guide 104.
- language: fr
  script: Latn
  content: |-
    A pour but de s'assurer des effets, sur un spécimen, d'essais simples normalisés destinés à représenter les coups et les cahots pouvant arriver au cours des opérations de maintenance, ou de toute manipulation, parfois brutale, effectuée en utilisation, se produisant sur une table ou un établi.

    A le statut d'une publication fondamentale de sécurité conformément au Guide 104
