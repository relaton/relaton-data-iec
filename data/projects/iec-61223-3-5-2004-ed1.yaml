abstract:
- language: en
  script: Latn
  content: |-
    This standard

    - defines the essential parameters which describe the performance of the CT scanners with regard to image quality, patient dose and positioning; 

    - defines the methods of testing the essential parameters;

    - evaluates compliance with the tolerances of the parameters specified by the accompanying documents.

    These methods rely mainly on non-invasive measurements, using appropriate test equipment, performed during the installation or after it has been completed. Signed statements covering steps in the installation procedure may be used as part of the acceptance test report.

    This part of IEC 61223 is intended to assist in performing the acceptance tests on a CT scanner. The aim is to verify compliance of the installation with specifications affecting the image quality, patient dose and positioning.

    The contents of the corrigendum of March 2006 have been included in this copy.
- language: fr
  script: Latn
  content: |-
    Cette norme 

    - définit les paramètres importants qui décrivent les performances des tomodensitomètres en ce qui concerne la qualité d'image, la dose délivrée au patient et le positionnement;

    - définit les méthodes d'essais des paramètres importants;

    - évalue la conformité des paramètres par rapport aux tolérances spécifiées dans les documents d'accompagnement.

    Ces méthodes s'appuient principalement sur des mesures non invasives, exécutées pendant l'installation ou à l'issue de celle-ci, en utilisant les équipements d'essai appropriés. Des déclarations signées couvrant des étapes de la procédure d'installation peuvent être utilisées dans le cadre du rapport d'essai d'acceptation.

    La présente partie de la CEI 61223 est destinée à aider à la réalisation des essais d'acceptation d'un tomodensitomètre. Le but est de vérifier la conformité de l'installation aux spécifications concernant la qualité de l'image, la dose délivrée au patient et le positionnement.

    Le contenu du corrigendum de mars 2006 a été pris en considération dans cet exemplaire.
