abstract:
- language: en
  script: Latn
  content: |-
    IEC 63593:2026 (E) applies to the specification and verification of rolling stock energy consumption. It defines a methodology to calculate the energy consumption which can be used to determine the total net energy consumed from a primary power source (e.g. at current collector or from the fuel tank) over a predefined service profile. It provides guidance for rolling stock procurement and life cycle cost (LCC) assessments.<br/>
    This document specifies the methodology to simulate and measure the energy consumed and regenerated by rolling stock. The results obtained from this methodology can be directly compared to, or be representative of the operation of a train.<br/>
    This document defines a framework on the generation of common and comparable energy performance values for rolling stock which supports the benchmarking and improvement of the energy efficiency of rolling stock.<br/>
    This document, in whole or in part, applies to all railway vehicles except coal-powered vehicles, special purpose vehicles (e.g. shunting locomotives, vehicles for track construction and maintenance) and magnetically supported vehicles.<br/>
    This document applies only to the energy consumption of the rolling stock itself. It does not cover comparisons of energy consumption with other modes of transportation, or between diesel and electric traction
