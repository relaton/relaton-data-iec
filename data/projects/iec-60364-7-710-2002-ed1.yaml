abstract:
- language: en
  script: Latn
  content: Applies to electrical installations in medical locations so as to ensure safety of patients and medical staff. These requirements, in the main, refer to hospitals, private clinics, medical and dental practices, health care centres and dedicated medical rooms in the work place.
- language: fr
  script: Latn
  content: Les prescriptions sont applicables à des installations électriques de locaux à usages médicaux afin d'assurer la sécurité des patients et du personnel médical. Ces prescriptions se réfèrent généralement à des hôpitaux, des cliniques privées, des cabinets médicaux et dentaires, des centres de soins et à des locaux médicaux sur des sites de travail.
