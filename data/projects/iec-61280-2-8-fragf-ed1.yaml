abstract:
- language: fr
  script: Latn
  content: |-
    La CEI 61280-2-8:2003 spécifie deux méthodes principales de détermination de faibles valeurs de TEB en réalisant des mesures accélérées. Celles-ci incluent la méthode du seuil de décision variable (Article 4) et la méthode du seuil optique variable (Article 5). En outre, une troisième méthode, la méthode de brouillage sinusoïdal, est décrite à l'Annexe B.
    Mots clés: faibles valeurs de TEB, la méthode du seuil de décision variable, la méthode du seuil optique variable, la méthode de brouillage sinusoïdal
