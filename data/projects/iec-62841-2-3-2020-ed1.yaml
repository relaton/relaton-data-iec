abstract:
- language: en
  script: Latn
  content: |-
    IEC 62841-2-3:2020: applies to hand-held grinders, disc-type polishers and disc-type sanders, including angle, straight and vertical tools, intended for use on various materials except magnesium, with a rated capacity not exceeding 230 mm. For grinders, the rated no-load speed does not exceed a peripheral speed of the accessory of 80 m/s at rated capacity.<br/>
    This standard does not apply to dedicated cut-off machines.<br/>
    This standard does not apply to orbital polishers and orbital sanders.<br/>
    This standard does not apply to die grinders.<br/>
    This Part 2-3 is to be used in conjunction with the first edition of IEC 62841-1:2014.<br/>
    The attention of National Committees is drawn to the fact that equipment manufacturers and testing organizations may need a transitional period following publication of a new, amended or revised IEC publication in which to make products in accordance with the new requirements and to equip themselves for conducting new or revised tests.<br/>
    It is the recommendation of the committee that the content of this publication be adopted for implementation nationally not earlier than 36 months from the date of publication. The contents of the corrigendum of April 2021 have been included in this copy.
- language: fr
  script: Latn
  content: |-
    IEC 62841-2-3:2020 s'applique aux meuleuses portatives, aux lustreuses portatives du type à disque et aux ponceuses portatives du type à disque, y compris dans leur version d'angle, droite ou verticale, prévues pour une utilisation sur divers matériaux à l'exception du magnésium, et dont la capacité assignée ne dépasse pas 230 mm. Pour les meuleuses, la vitesse assignée à vide ne dépasse pas une vitesse périphérique de l'accessoire de 80 m/s à la capacité assignée.<br/>
    La présente norme ne s'applique pas aux tronçonneuses dédiées.<br/>
    La présente norme ne s'applique pas aux lustreuses orbitales ni aux ponceuses orbitales.<br/>
    La présente norme ne s'applique pas aux meules à rectifier les matrices.<br/>
    L'attention des Comités nationaux est attirée sur le fait que les fabricants d'appareils et les organismes d'essai peuvent avoir besoin d'une période transitoire après la publication d'une nouvelle publication IEC, ou d'une publication amendée ou révisée, pour fabriquer des produits conformes aux nouvelles exigences et pour adapter leurs équipements aux nouveaux essais ou aux essais révisés.<br/>
    Le comité recommande que le contenu de cette publication soit entériné au niveau national au plus tôt 36 mois après la date de publication. Le contenu du corrigendum d'avril 2021 a été pris en considération dans cet exemplaire.
