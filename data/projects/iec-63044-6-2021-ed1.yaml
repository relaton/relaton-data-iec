abstract:
- language: en
  script: Latn
  content: |-
    IEC 63044-6:2021 specifies the requirements for planning and installation of HBES/BACS and the supporting infrastructure.<br/>
    Radio frequency (RF) HBES/BACS are also considered.<br/>
    Safety requirements are covered by IEC 60364 (all parts).<br/>
    Information and communication technology (ICT) and broadcasting and communication technology (BCT) network installations are typically interfaced with HBES/BACS.<br/>
    The requirements for ICT and BCT network installations are covered by ISO/IEC 14763-2.<br/>
    This document does not cover HBES/BACS implementation with:<br/>
    - optical fibre,<br/>
    - power lines,<br/>
    - power over Ethernet (PoE).
- language: fr
  script: Latn
  content: |-
    L'IEC 63044-6:2021 spécifie les exigences de planification et d'installation de HBES/SGTB et de l'infrastructure support.<br/>
    Les radiofréquences (RF) HBES/SGTB sont également prises en considération.<br/>
    Les exigences de sécurité sont couvertes par la série IEC 60364 (toutes les parties).<br/>
    Les installations de réseau ICT et BCT sont en général interfacées avec HBES/SGBT.<br/>
    Les exigences relatives aux installations de réseau ICT et BCT sont couvertes par l'ISO/IEC 14763-2.<br/>
    Le présent document ne couvre pas la mise en œuvre HBES/SGTB avec:<br/>
    - fibres optiques,<br/>
    - lignes d'énergie,<br/>
    - alimentation électrique par câble Ethernet (PoE).
