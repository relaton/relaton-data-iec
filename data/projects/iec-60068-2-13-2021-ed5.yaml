abstract:
- language: en
  script: Latn
  content: |-
    IEC 60068-2-13:2021 specifies methods of test applicable to specimens which, during transportation, storage or in service, can be subjected to low air pressure.<br/>
    This fifth edition cancels and replaces the fourth edition, published in 1983. This edition constitutes a technical revision.<br/>
    This edition includes the following significant technical changes with respect to the previous edition:<br/>
    a) alignment with recently revised parts of IEC 60068-2;<br/>
    b) Clause 5: severities aligned with IEC 60721-2-3 and IEC 60721-3 (all parts);<br/>
    c) addition of Annex A (guidance on selecting the duration of exposure).
- language: fr
  script: Latn
  content: |-
    L'IEC 60068-2-13:2021 fournit les méthodes d'essai applicables aux spécimens qui peuvent être soumis à une pression atmosphérique basse pendant le transport, le stockage ou en service.<br/>
    Cette cinquième édition annule et remplace la quatrième édition parue en 1983. Cette édition constitue une révision technique.<br/>
    Cette édition inclut les modifications techniques majeures suivantes par rapport à l'édition précédente:<br/>
    a) alignement sur les normes IEC 60068-2 révisées récemment;<br/>
    b) Article 5: alignement des sévérités sur l'IEC 60721-2-3 et sur I’IEC 60721-3 (toutes les parties);<br/>
    c) ajout de l'Annexe A (recommandations quant au choix de la durée d'exposition).
