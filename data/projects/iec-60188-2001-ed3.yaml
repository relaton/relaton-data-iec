abstract:
- language: en
  script: Latn
  content: This standard specifies the performance requirements for high-pressure mercury vapour lamps for general lighting purposes, with or without a red correcting fluorescent coating. For some of the requirements given in this standard, reference is made to "the relevant lamp data sheet". For some lamps these data sheets are contained in this standard. For other lamps, falling under the scope of this standard, the relevant data are supplied by the lamp manufacturer or responsible vendor. The requirements
- language: fr
  script: Latn
  content: La présente norme spécifie les prescriptions de performances des lampes à vapeur de mercure à haute pression pour éclairage général, avec ou sans recouvrement fluorescent correcteur du rouge. Pour certaines des prescriptions de la présente norme, le texte renvoie à « la feuille de caractéristiques de lampe correspondante ». Pour certaines lampes, ces feuilles de caractéristiques sont incluses dans la présente norme. Pour d'autres, faisant partie de son domaine d'application, les données correspondantes sont fournies par le fabricant ou le vendeur responsable. Les prescriptions de la présente norme ne concernent que les essais de type.
