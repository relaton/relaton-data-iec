abstract:
- language: fr
  script: Latn
  content: |-
    La CEI 61918:2010 spécifie les exigences de base pour l'installation d'un support de réseaux de communication dans des locaux industriels et à l'intérieur et entre des îlots d'automatisation de sites industriels. La présente norme couvre le câblage symétrique et à fibres optiques. Elle couvre également l'infrastructure de câblage des supports sans fil, mais pas le support sans fil lui-même. D'autres supports sont couverts par la série CEI 61784-5. Elle couvre aussi:<br/>
    - l'installation de câblage de télécommunication générique pour les locaux industriels (voir ISO/CEI 24702);<br/>
    - et la connexion entre le câblage de télécommunication générique spécifié dans l'ISO/CEI 24702;<br/>
    - et le câblage de communication spécifique d'un îlot d'automatisation, dans laquelle une prise d'automatisation (AO) remplace la prise de télécommunication (TO) de l'ISO/CEI 24702. Cette deuxième édition annule et remplace la première édition publiée en 2007 et le Corrigendum 1 et constitue une révision technique. Elle inclut les modifications techniques suivantes par rapport à l'édition précédente:<br/>
    - 4.4.7.2.1 mis à jour;<br/>
    - 4.4.7.3.4 mis à jour;<br/>
    - 5.7.4.3 mis à jour suite à la révision des profils d'installation;<br/>
    - 6.2.3.1 mis à jour;<br/>
    - Figure 2, Figure 15, Tableau 14 et Tableau B.3 mis à jour;<br/>
    - une nouvelle Figure 35 a été ajoutée;<br/>
    - un nouveau Tableau 10 a été ajouté;<br/>
    - l'Annexe D a été étendue pour couvrir des familles de profil de communication supplémentaires;<br/>
    - l'Annexe F a été étendue pour couvrir les tailles de conducteur dans les câbles électriques;<br/>
    - l'Annexe H est devenue normative. Certaines exigences communes sont étendues suite à la révision des profils d'installation. La présente version bilingue (2012-05) correspond à la version anglaise monolingue publiée en 2010-07.
