abstract:
- language: en
  script: Latn
  content: |-
    IEC 61347-2-2:2024 specifies safety requirements for electronic step-down convertors for use on DC supplies of up to 1 500 V or AC supplies of up to 1 000 V at 50 Hz or 60 Hz, and with a rated output voltage ≤ 50 V (RMS) at a frequency deviating from the supply frequency, or 120 V ripple free DC between conductors and between any conductor and earth, associated with tungsten-halogen lamps as specified in IEC 60357, and other filament lamps.<br/>
    This third edition cancels and replaces the second edition published in 2011. This edition constitutes a technical revision.<br/>
    This edition includes the following significant technical changes with respect to the previous edition:<br/>
    a) alignment with respect to the fourth edition of IEC 61347-1;<br/>
    - introduction of dated references to the fourth edition of IEC 61347-1 as appropriate;<br/>
    - deletion of the clauses and subclauses which are either no longer relevant or now covered in IEC 61347-1;<br/>
    b) scope extension to 1 500 V for direct current;<br/>
    c) scope clarification;<br/>
    d) deletion of unused definitions;<br/>
    e) revision of information and marking requirements;<br/>
    f) revision of compliance conditions for the measurement of the output voltage during fault condition testing and during thermal testing.
- language: fr
  script: Latn
  content: |-
    L'IEC 61347-2-2:2024 spécifie les exigences de sécurité applicables aux convertisseurs abaisseurs électroniques destinés à être utilisés sur des alimentations en courant continu jusqu'à 1 500 V ou sur des alimentations en courant alternatif jusqu'à 1 000 V à 50 Hz ou 60 Hz et de tension de sortie assignée ≤ 50 V (en valeur efficace) à une fréquence différente de celle de la tension d'alimentation, ou 120 V en courant continu lissé entre conducteurs et entre un conducteur et la terre, associés à des lampes tungstène‑halogène, comme cela est spécifié dans l'IEC 60357, et d'autres lampes à incandescence.<br/>
    Cette troisième édition annule et remplace la deuxième édition parue en 2011. Cette édition constitue une révision technique.<br/>
    Cette édition inclut les modifications techniques majeures suivantes par rapport à l'édition précédente:<br/>
    a) alignement sur la quatrième édition de l'IEC 61347-1;<br/>
    - ajout de références datées à la quatrième édition de l'IEC 61347-1, le cas échéant;<br/>
    - suppression des articles et paragraphes qui ne sont plus pertinents ou qui sont désormais couverts dans l'IEC 61347-1;<br/>
    b) extension du domaine d'application à 1 500 V pour le courant continu;<br/>
    c) clarification du domaine d'application;<br/>
    d) suppression des définitions non utilisées;<br/>
    e) révision des exigences relatives aux informations et aux marquages;<br/>
    f) révision des conditions de conformité pour le mesurage de la tension de sortie lors des essais en conditions de défaut et lors des essais thermiques.
