abstract:
- language: en
  script: Latn
  content: |-
    IEC 63453:2025 specifies functional requirements for the validation of simulation techniques and tools used to assess the dynamic interaction between overhead contact lines and pantographs, as part of the prediction of current collection quality, to ensure confidence in, and mutual acceptance of the results of the simulations.<br/>
    This document deals with:<br/>
    - input and output parameters of the simulation;<br/>
    - comparison with line test measurements, and the characteristics of those line tests;<br/>
    - validation of pantograph models;<br/>
    - comparison between different simulation tools;<br/>
    - limits of application of validated methods to assessments of pantographs and overhead contact lines.<br/>
    This document applies to the current collection from an overhead contact line by pantographs mounted on railway vehicles. It does not apply to trolley bus systems.
- language: fr
  script: Latn
  content: |-
    IEC 63453:2025 Des techniques de simulation sont appliquées pour évaluer l'interaction dynamique entre les caténaires et les pantographes dans le cadre de la détermination de la qualité du captage de courant. Le présent document spécifie les exigences fonctionnelles relatives à la validation de ces outils de simulation afin de garantir la fiabilité et l'acceptation mutuelle des résultats de ces simulations.<br/>
    Le présent document porte sur :<br/>
    – les paramètres d'entrée et de sortie de la simulation ;<br/>
    – la comparaison des résultats de simulation par rapport aux données mesurées lors des essais en ligne et les caractéristiques de ces essais ;<br/>
    – la validation des modèles de pantographes ;<br/>
    – la comparaison entre les différents outils de simulation existants ;<br/>
    – les limites d'application relatives aux méthodes validées pour l'évaluation des pantographes et des caténaires.<br/>
    Le présent document s'applique au captage du courant d'une caténaire par les pantographes des véhicules ferroviaires. Il ne s'applique pas aux trolleybus.<!--EndFragment -->
