abstract:
- language: fr
  script: Latn
  content: |-
    La CEI 60173-1:2009 s'applique au matériel de montage pour épissures de fibres optiques (protections des épissures mécaniques et des épissures par fusion) pour câbles et fibres optiques. Elle comprend:<br/>
    - les exigences relatives aux matériels de montage des épissures pour fibres optiques;<br/>
    - les procédures d'assurance de la qualité. Elle ne couvre pas les procédures de mesure et d'essais, ces dernières étant décrites dans la CEI 61300-1, la série CEI 61300-2 et la série CEI 61300-3. Cette quatrième édition annule et remplace la troisième édition publiée en 1999. Cette édition constitue une révision technique. Les principales modifications par rapport à l'édition précédente sont les suivantes:<br/>
    - Les termes et définitions ont été revus;<br/>
    - Un modèle a été ajouté au paragraphe classification des exigences;<br/>
    - Le paragraphe consacré aux catégories d'environnement a été supprimé du paragraphe classification des exigences;<br/>
    - La structure normative et les interdépendances entre normes ont été revue.
    Mots clés: matériel d'épissure pour fibres optiques; assurance de la qualité.
