- language: en
  script: Latn
  content: IEC 61076-3-122:2017 covers 8-way, shielded, free and fixed rectangular connectors for I/O and Gigabit Ethernet applications, suitable for use in harsh environments, and is intended to specify the common dimensions, mechanical, electrical and environmental characteristics and tests for this family of connectors.
