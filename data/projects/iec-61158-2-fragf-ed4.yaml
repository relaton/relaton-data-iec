abstract:
- language: fr
  script: Latn
  content: |-
    L'IEC 61158-2:2007 spécifie les exigences applicables aux composants de bus de terrain. Elle spécifie également les exigences de configuration des supports et des réseaux requises pour garantir les niveaux convenus:<br/>
    - d'intégrité des données avant vérification d'erreur de la couche de liaison de données;<br/>
    - interopérabilité entre dispositifs au niveau de la couche physique. Cette quatrième édition annule et remplace la CEI 61158-2:2003. L'édition de la présente partie en constitue une révision mineure. Cette publication, associée à ses parties correspondantes pour le Type 16, remplace également en partie la CEI 61491:2002 qui est actuellement en cours de révision. La CEI 61491 sera publiée en tant que rapport technique. Cette édition inclut les modifications suivantes:<br/>
    - suppression de l'ancien bus de terrain de Type 6 du fait de son manque de pertinence pour le marché;<br/>
    - ajout de nouveaux types de bus de terrain;<br/>
    - généralisation du Type 1 support radioélectrique rarement utilisé, sous une forme plus utile. La présente version bilingue (2014-04) correspond à la version anglaise monolingue publiée en 2007-12.
