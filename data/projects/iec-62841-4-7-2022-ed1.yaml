abstract:
- language: en
  script: Latn
  content: |-
    IEC 62841-4-7:2022 clause 1 of IEC 62841-1:2014, is applicable, except as follows:<br/>
    Addition:<br/>
    This document applies to pedestrian controlled walk-behind lawn scarifiers and lawn aerators which are designed for regenerating lawns by combing out materials such as grass, thatch and moss or cutting vertically into the lawn face using<br/>
    metallic tines; and/or<br/>
    rigid non-metallic tines<br/>
    which rotate about a horizontal axis.<br/>
    This document does not apply to<br/>
    pedestrian controlled walk-behind lawnmowers;<br/>
    towed/semi-mounted lawn scarifiers and lawn aerators;<br/>
    ride-on machines;<br/>
    non-powered lawn scarifiers and lawn aerators;<br/>
    combustion engine powered lawn scarifiers and lawn aerators;<br/>
    plug aerators (corers);<br/>
    hybrid and fuel cell powered machines and associated charging systems; and<br/>
    garden tractors or their attachments.<br/>
    The contents of the corrigendum of May 2023 have been included in this copy.
- language: fr
  script: Latn
  content: |-
    IEC 62841-4-7:2022, La clause 1 de la IEC 62841-1:2014 est applicable, sauf dans les cas suivants :<br/>
    Addition:<br/>
    Le présent document s’applique aux scarificateurs et aux aérateurs de pelouse contrôlés par les piétons qui sont conçus pour régénérer les pelouses en peignant des matériaux tels que l’herbe, le chaume et la mousse ou en coupant verticalement dans la taille de la pelouse à l’aide de<br/>
    tiges métalliques; et/ou<br/>
    tiges rigides non métalliques<br/>
    qui tournent autour d’un axe horizontal.<br/>
    Le présent document ne s’applique pas aux<br/>
    tondeuses à gazon à marche contrôlées par les piétons;<br/>
    scarificateurs de pelouse et aérateurs de pelouse remorqués/semi-montés;<br/>
    machines autoportées;<br/>
    scarificateurs de pelouse et aérateurs de pelouse non motorisés;<br/>
    scarificateurs de pelouse et aérateurs de pelouse alimentés par moteur à combustion;<br/>
    aérateurs de bouchon (corers);<br/>
    les machines hybrides et à pile à combustible et les systèmes de charge associés; et<br/>
    tracteurs de jardin ou leurs accessoires.<br/>
    Le contenu du corrigendum de mai 2023 a été pris en considération dans cet exemplaire.
