abstract:
- language: fr
  script: Latn
  content: La CEI 61966-2-2:2003 s'applique au codage, à l'édition et à la communication des couleurs RVB de radiance de scènes relatives, large plage dynamique, gamme de couleurs étendue et précision en bits étendue, en tant qu'espace colorimétrique utilisé dans les systèmes informatiques et les applications similaires par définition des transformations de codage. Les valeurs des primaires et du point blanc de l'espace colorimétrique définies dans la présente norme sont identiques aux chromaticités CIE pour les primaires de référence UIT-R BT.709-5 et pour l'illuminant normalisé CIE D65 comme son point blanc. L'espace colorimétrique scRVB est une extension de sRVB et il est considéré comme compatible avec sRVB. La présente version bilingue (2013-02) correspond à la version anglaise monolingue publiée en 2003-01.
