abstract:
- language: en
  script: Latn
  content: |-
    This document specifies dimensions and requirements for the design and functional performance of small-bore connectors intended to be used for connections in intravascular applications or hypodermic connections in hypodermic applications of medical devices and accessories.<br/>
    EXAMPLES Hypodermic syringes and needles or intravascular (IV) cannulae with male and female Luer slip connectors and Luer lock connectors.<br/>
    NOTE 1 See Annex A.<br/>
    NOTE 2 The Luer connector was originally designed for use at pressures up to 300 kPa.<br/>
    This document does not specify requirements for the medical devices or accessories that use these connectors. Such requirements are given in particular documents for specific medical devices or accessories.<br/>
    This document does not specify requirements for the following small-bore connectors, which are specified in other documents:<br/>
    - haemodialyser, haemodiafilter and haemofilter blood compartment ports (ISO 8637 [5] and applicable portion of ISO 8638 [6] referencing blood compartment ports);<br/>
    - haemodialysis, haemodiafiltration and haemofiltration equipment connectors (ISO 8637 [5]);<br/>
    - infusion system closure piercing connectors (ISO 8536-4 [4]).<br/>
    NOTE 3 Manufacturers are encouraged to incorporate the small-bore connectors specified in this document into medical devices or accessories, even if currently not required by the relevant particular medical device documents. It is expected that when the relevant particular medical device documents are revised, requirements for small-bore connectors, as specified in ISO 80369, will be included.<br/>
    NOTE 4 ISO 80369-1:2018, Clause 7, specifies alternative methods of conformance with ISO 80369-1:2018, for small-bore connectors intended for use with intravascular applications or hypodermic application medical devices or accessories, which do not conform with this document.
- language: fr
  script: Latn
  content: |-
    Le présent document spécifie les dimensions et les exigences relatives à la conception et aux performances fonctionnelles des raccords de petite taille destinés A être utilisés pour effectuer des raccordements dans des applications intravasculaires ou des raccordements hypodermiques dans des applications hypodermiques de dispositifs médicaux et d'accessoires.<br/>
    EXEMPLES Les seringues et aiguilles hypodermiques ou les canules intravasculaires (IV) avec raccords Luer à glissement et raccords Luer à verrouillage mâles et femelles.<br/>
    NOTE 1 Voir l'Annexe A.<br/>
    NOTE 2 l'origine, le raccord Luer a été conçu pour être utilisé à des pressions maximales de 300 kPa.<br/>
    Le présent document ne spécifie pas les exigences relatives aux dispositifs médicaux ou aux accessoires sur lesquels ces raccords sont utilisés. Ces exigences figurent dans des documents spécifiques traitant de dispositifs médicaux ou d'accessoires particuliers.<br/>
    Le présent document ne spécifie pas d'exigences pour les raccords de petite taille suivants, celles-ci étant spécifiées dans d'autres documents:<br/>
    - orifices du compartiment sanguin des hémodialyseurs, hémodiafiltres et hémofiltres (l'ISO 8637[5] et la partie applicable de l'ISO 8638[6] référencent les orifices du compartiment sanguin);<br/>
    - raccords des appareils d'hémodialyse, d'hémodiafiltration et d'hémofiltration (ISO 8637[5]);<br/>
    - raccords du perforateur du système de fermeture des appareils de perfusion (ISO 8536-4[4]).<br/>
    NOTE 3 Les fabricants sont incités à intégrer les raccords de petite taille spécifiés dans le présent document dans les dispositifs médicaux ou accessoires, même si cela n'est pas actuellement requis par les documents appropriés, spécifiques de ces dispositifs médicaux. Il est prévu d'inclure des exigences relatives aux raccords de petite taille, tels que spécifiées dans l'ISO 80369, lors de la révision des documents appropriés spécifiques de ces dispositifs médicaux.<br/>
    NOTE 4 L'Article 7 de l'ISO 80369-1:2018 spécifie d'autres méthodes de vérification de la conformité à l'ISO 80369-1:2018 pour les raccords de petite taille destinés à être utilisés avec des dispositifs médicaux ou des accessoires pour applications intravasculaires ou applications hypodermiques, mais qui ne sont pas conformes au présent document.
