abstract:
- language: en
  script: Latn
  content: This part of IEC 62013 details those performance and other safety features of caplights, including those with a point of connection for another apparatus, not covered in IEC 62013-1, but which are important for the safety and working conditions of the user. It may also be applied to caplights for use in mines not likely to be endangered by firedamp.
- language: fr
  script: Latn
  content: Cette partie de la CEI 62013 détaille l'aptitude à la fonction et autres caractéristiques de sécurité des lampes-chapeaux, y compris celles ayant un point de connexion pour d'autres matériels, non couverts par la CEI 62013-1, mais qui sont importantes pour la sécurité et les conditions de travail de l'utilisateur. Elle peut aussi s'appliquer aux lampes-chapeaux utilisées dans les mines non grisouteuses.
