  script: Latn
  content: La CEI 60424-5:2009 donne des lignes directrices relatives aux limites admissibles pour les irrégularités de surface applicables aux noyaux planaires conformément à la spécification générique applicable. La présente norme est considérée comme une spécification intermédiaire utile dans les négociations entre fabricants et utilisateurs de noyaux de ferrite concernant les irrégularités de surface.
