  content: Donne les prescriptions concernant les matériaux obtenus en combinant du papier de mica avec du tissu de verre et en imprégnant le papier de mica avec une résine époxyde. Le matériau est fourni pour traitement de durcissement après application, sous forme de feuille ou de rouleaux.
