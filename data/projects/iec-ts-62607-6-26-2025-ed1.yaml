abstract:
- language: en
  script: Latn
  content: |-
    IEC TS 62607-6-26:2025, which is a Technical Specification, establishes a standardized method to determine the mechanical key control characteristics (KCCs)<br/>
    • Young's modulus (or elastic modulus),<br/>
    • residual strain,<br/>
    • residual stress, and<br/>
    • fracture stress<br/>
    of 2D materials and nanoscale films using the<br/>
    • bulge test.<br/>
    The bulge test is a reliable method where a pressure differential is applied to a freestanding film, and the resulting deformation is measured to derive the mechanical properties.<br/>
    • This method is applicable to a wide range of freestanding 2D materials, such as graphene, and nanometre-thick films with thicknesses typically ranging from 1 nm to several hundred nanometres.<br/>
    • This document ensures the characterization of mechanical properties essential for assessing the structural integrity and performance of materials in applications such as composite additives, flexible electronics, and energy harvesting devices.
