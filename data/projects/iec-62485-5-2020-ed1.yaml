abstract:
- language: en
  script: Latn
  content: |-
    IEC 62485-5:2020 applies to the installation of one or more stationary secondary batteries having a maximum aggregate DC voltage of 1 500 V to any DC part of the power network, and describes the principal measures for protections during normal operation or under expected fault conditions against hazards generated from:<br/>
    – electricity,<br/>
    – short-circuits,<br/>
    – electrolyte,<br/>
    – gas emission,<br/>
    – fire,<br/>
    – explosion.<br/>
    This document provides requirements on safety aspects associated with the installation, use, inspection, and maintenance and disposal of lithium ion batteries used in stationary applications.<br/>
    The contents of the corrigendum of June 2022 have been included in this copy.
- language: fr
  script: Latn
  content: |-
    L'IEC 62485-5:2020 s'applique à l'installation d'une ou de plusieurs batteries d'accumulateurs stationnaires ayant une tension continue cumulée maximale de 1 500 V sur toute partie sous tension continue du réseau d'alimentation, et décrit les principales mesures de protection en fonctionnement normal ou dans des conditions de défaut prévues contre les dangers engendrés par:<br/>
    – l'électricité,<br/>
    – les courts-circuits,<br/>
    – l'électrolyte,<br/>
    – les émissions gazeuses,<br/>
    – le feu,<br/>
    – l'explosion.<br/>
    Le présent document fournit les exigences concernant les aspects de sécurité associés à l'installation, l'utilisation, le contrôle, la maintenance et la mise au rebut des batteries ions-lithium utilisées dans des applications stationnaires.<br/>
    Le contenu du corrigendum de juin 2022 a été pris en considération dans cet exemplaire.
