- language: en
  script: Latn
  content: Gives requirements for software for category A functions, systems and associated equipment. Addresses defence against common cause failures, caused by software; automated tools for the development of software important to safety; and use of pre-developed software.
- language: fr
  script: Latn
  content: Fournit des prescriptions pour les logiciels des fonctions de catégorie A et des systèmes et équipements associés. Porte sur les moyens de défense contre les défaillances de mode commun provoquées par les logiciels; les outils automatisés pour le développement de logiciels importants pour la sûreté; et l'utilisation de logiciels préexistants.
