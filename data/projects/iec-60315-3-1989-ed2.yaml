abstract:
- language: en
  script: Latn
  content: Applies to radio receivers for the reception of amplitude-modulated sound broadcasting emissions. Deals mainly with measurements using radio-frequency signals applied to the antenna terminals of the receiver, or induced in a magnetic antenna. Is intended to be read in conjuction with IEC 60315-1. The contents of the corrigendum of April 1994 have been included in this copy.
- language: fr
  script: Latn
  content: S'applique aux récepteurs radioélectriques en amplitude. Traite principalement de mesures qui utilisent des signaux à fréquence radioélectrique appliqués aux bornes d'antenne des récepteurs ou induits dans une antenne magnétique. Destinée à être utilisée conjointement avec la CEI 60315-1. Le contenu du corrigendum d'avril 1994 a été pris en considération dans cet exemplaire.
