abstract:
- language: en
  script: Latn
  content: |-
    IEC 62590-2-2:2026 describes functions and working principles, specifies requirements, interfaces, and test methods for controlled converters for DC electric traction power supply systems:<br/>
    – AC/DC converters:<br/>
    • rectifiers,<br/>
    • inverters,<br/>
    • combinations.<br/>
    – DC converters.<br/>
    The purpose of the converters can be a power connection to other power networks or energy storages.<br/>
    The common characteristic of this equipment is the possibility to influence the power flow in the DC electric traction power supply system. The converters can be:<br/>
    – line-commutated;<br/>
    – self-commutated.<br/>
    This document applies to fixed installations of the following electric traction systems:<br/>
    – railway networks,<br/>
    – metropolitan transport networks including metros, tramways, trolleybuses and fully automated transport systems, magnetic levitated transport systems, and electric road systems.
