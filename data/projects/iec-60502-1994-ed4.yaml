abstract:
- language: en
  script: Latn
  content: Specifies the construction, dimensions and test requirements of power cables with extruded solid insulation of the types listed in 1.2, for rated voltages (u) from 1 kV up to and including 30 kV given in 1.3, for fixed installations. Cables for special conditions of installations and service are not included.
- language: fr
  script: Latn
  content: Spécifie la construction, les dimensions et les prescriptions des câbles de transport d'énergie avec isolations extrudées en diélectriques massifs des types énumérés en 1.2, pour des tensions assignées (U) comprises entre 1 kV et 30 kV (voir 1.3), pour installations fixes. Les câbles destinés à des conditions pariculières d'installations et de service ne sont pas inclus.
