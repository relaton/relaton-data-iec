abstract:
- language: en
  script: Latn
  content: |-
    CORRECTED VERSION 2025-11<br/><br/>IEC 60601-2-33:2022 establishes particular basic safety and essential performance requirements for magnetic resonance equipment to provide protection for the patient and the magnetic resonance worker.<br/>
    The contents of the Interpretation sheets 1 (2023-05) and 2 (2025-11) have been included in this copy.
- language: fr
  script: Latn
  content: |-
    VERSION CORRIGEE 2025-11<br/><br/>La CEI 60601-2-33:2022 établit des exigences particulières relatives à la sécurité de base et aux performances essentielles pour les appareils à résonance magnétique en matière de protection pour le patient et le personnel pour la résonance magnétique.<br/>
    Le contenu de la feuille d'interpreation 1 (2023-05) et 2 (2025-11) s'applique à la version anglaise uniquement.
