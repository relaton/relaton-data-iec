abstract:
- language: en
  script: Latn
  content: |-
    IEC TS 62196-3-1:2020(E) applies to accessories and cable assemblies with the same configuration as specified in IEC 62196-3:2014 with rated operating voltage not exceeding 1 500 V DC and a rated current not exceeding 500 A that employ<br/>
    - thermal sensing, or<br/>
    - thermal transport and thermal sensing with the system architecture described in 4.101.<br/>
    These accessories and cable assemblies are intended to be used in conductive charging systems for circuits specified in IEC 61851-23.<br/>
    NOTE Edition 2 of IEC 61851-23 is under development.<br/>
    The accessories covered by this document are intended to be used in charging mode 4 according to IEC 61851-1. These accessories are intended to be connected to cables according to the IEC 62893 series for DC cables.
