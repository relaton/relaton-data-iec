abstract:
- language: en
  script: Latn
  content: |-
    IEC 63082-1:2025 defines the concepts and terminology necessary to understand and communicate effectively about intelligent device management (IDM). This document explains the relationship between IDM and other existing asset management standards.<br/>
    Additionally, this document describes principles and defines organizational and functional structures associated with IDM. This document also introduces the concept of IDM program for coordination of multiple stakeholders.<br/>
    This first edition cancels and replaces the first edition of IEC TR 63082-1 published in 2020. This edition constitutes a technical revision.<br/>
    This edition includes the following significant technical changes with respect to IEC TR 63082‑1:2020:<br/>
    a) alignment with clause structure of IEC 63082-2.
