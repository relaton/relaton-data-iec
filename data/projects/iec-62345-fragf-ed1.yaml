abstract:
- language: fr
  script: Latn
  content: La CEI 62345:2005 spécifie les caractéristiques des cartouches de disque optique (ODC) de 50 mm d'une capacité de 730 Mo par cartouche. Cette réglementation recouvre le format logique des disques magnéto-optiques amovibles de 50 mm utilisés sur des appareils photographiques numériques, des caméras vidéo numériques, des albums électroniques et des dispositifs similaires ainsi que des combinaisons de ces dispositifs qui enregistrent, lisent ou traitent les données numériques d'images fixes, d'images animées et d'audio. La présente norme spécifie le format d'enregistrement et de reproduction et la méthode de traitement de fichiers d'images fixes, d'images animées et d'audio sur des disques magnéto-optiques de 50 mm, de façon que les utilisateurs puissent utiliser ces disques sur divers dispositifs compatibles. La présente version bilingue (2012-11) correspond à la version anglaise monolingue publiée en 2005-09.
