abstract:
- language: en
  script: Latn
  content: |-
    IEC 62109-3:2020 covers the particular safety requirements for electronic elements that are mechanically and/or electrically incorporated with photovoltaic (PV) modules or systems.<br/>
    Mechanically and/or electrically incorporated means that the whole combination of electronic device with the photovoltaic element is sold as one product. Nevertheless, tests provided in this document may also be used to evaluate compatibility of PV modules and electronic devices that are sold separately and are intended to be installed close to each other.<br/>
    The purpose of the requirements of this document is to provide additional safety-related testing requirements for the following types of integrated electronics, collectively referred to as module integrated equipment (MIE):<br/>
    a) Type A MIE where the PV element can be evaluated as a PV module according to IEC 61730-1 and IEC 61730‑2 independently from the electronic element;<br/>
    b) Type B MIE where the PV element cannot be evaluated as a PV module according to IEC 61730-1 and IEC 61730-2 independently from the electronic element.<br/>
    The contents of the corrigendum of November 2020 have been included in this copy.
- language: fr
  script: Latn
  content: |-
    l’IEC 62109-3:2020 couvre les exigences particulières de sécurité concernant les éléments électroniques intégrés de manière mécanique et/ou électrique à des modules ou systèmes photovoltaïques (PV).<br/>
    “Intégrés de manière mécanique et/ou électrique” signifie que l’intégralité de la combinaison de l’appareil électronique et de l’élément photovoltaïque est vendue comme un seul et même produit. Cependant, les essais indiqués dans le présent document peuvent également être utilisés pour évaluer la compatibilité des modules PV et des appareils électroniques vendus séparément et destinés à être installés à proximité les uns des autres.<br/>
    Les exigences de la présente partie de l’IEC 62109 ont pour objet de fournir des exigences supplémentaires d’essai liées à la sécurité pour les types suivants d’électroniques intégrées, communément appelées “électroniques intégrées aux modules” (MIE-module integrated equipment):<br/>
    a) La MIE de type A, dans laquelle l’élément PV peut être évalué comme un module PV conforme à l’IEC 61730-1 et à l’IEC 61730-2, quel que soit l’élément électronique;<br/>
    b) La MIE de type B, dans laquelle l’élément PV ne peut pas être évalué comme un module PV conforme à l’IEC 61730-1 et à l’IEC 61730-2, quel que soit l’élément électronique.<br/>
    Le contenu du corrigendum de novembre 2020 a été pris en considération dans cet exemplaire.
