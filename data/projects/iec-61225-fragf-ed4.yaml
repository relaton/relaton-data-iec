abstract:
- language: en
  script: Latn
  content: |-
    IEC 61225:2026 specifies the performance and the functional characteristics of the low voltage static uninterruptible power supply (SUPS) systems in a nuclear power plant (NPP) and, when applicable, in nuclear facilities in general. An uninterruptible power supply (UPS) is an electrical equipment which draws electrical energy from a source, stores it, and maintains the supply in a specified form by means inside the equipment to output terminals. A SUPS has no rotating parts to perform its functions.<br/>
    <br/>
    IEC 61225 has been prepared by subcommittee 45A: Instrumentation, control and electrical power systems of nuclear facilities, of IEC technical committee 45: Nuclear instrumentation. It is an International Standard.<br/>
    This fourth edition cancels and replaces the third edition published in 2019. This edition constitutes a technical revision.<br/>
    This edition includes the following significant technical changes with respect to the previous edition:<br/>
    expansion and clarification of the requirements for static uninterruptible DC and AC power supply systems to ease the application in SMRs and passive designs.<br/>
    <br/>
    This International Standard is to be used in conjunction with IEC 61513:2011, IEC 60709:2018, IEC 60880:2006, IEC 62138:2018, IEC 62855:2016 and IEC 63046:2020.
- language: fr
  script: Latn
  content: |-
    IEC 61225:2026 spécifie les performances et les caractéristiques fonctionnelles des systèmes d'alimentation statiques sans interruption (ASSI) en basse tension dans les centrales nucléaires de puissance (CNP) et, le cas échéant, dans les installations nucléaires en général. Une alimentation sans interruption (ASI) est un équipement électrique qui tire l'énergie électrique d'une source, la stocke et maintien une alimentation aux bornes de sortie sous une forme spécifiée en utilisant des moyens internes à l'équipement. Une ASSI ne comprend pas de partie tournante pour réaliser sa fonction.<br/>
    <br/>
    L'IEC 61225 a été établie par le sous-comité 45A: Systèmes d'instrumentation, de contrôle-commande et d'alimentation électrique des installations nucléaires, du comité d'études 45 de l'IEC: Instrumentation nucléaire. Il s'agit d'une Norme internationale.<br/>
    Cette quatrième édition annule et remplace la troisième édition parue en 2019. Cette édition constitue une révision technique.<br/>
    Cette édition inclut les modifications techniques majeures suivantes par rapport à l'édition précédente:<br/>
    a) l'expansion et la clarification des exigences relatives aux systèmes d'alimentation statiques non interruptibles en courant continu et en courant alternatif pour faciliter l'application dans les PRM et les conceptions passives.<br/>
    La présente Norme internationale doit être utilisée conjointement avec les normes IEC 61513:2011, IEC 60709:2018, IEC 60880:2006, IEC 62138:2018, IEC 62855:2016 et IEC 63046:2020.
