abstract:
- language: en
  script: Latn
  content: |-
    IEC 60335-2-30:2026 deals with the safety of electric room heaters for household and similar purposes, their rated voltage being not more than 250 V for single-phase appliances and 480 V for other appliances including direct current (DC) supplied appliances and battery-operated appliances.<br/>
    Examples of appliances that are within the scope of this standard are<br/>
    – convector heaters;<br/>
    – fan heaters;<br/>
    – heaters for use in greenhouses;<br/>
    – liquid-filled radiators;<br/>
    – panel heaters;<br/>
    – radiant heaters;<br/>
    – ceiling recessed radiant heaters;<br/>
    – tubular heaters;<br/>
    – ceiling mounted heat lamp appliances;<br/>
    – cab heaters;<br/>
    – caravan heaters.<br/>
    This standard also deals with the safety of electric heaters intended for the heating of driver and passenger compartments of motor vehicles when they are stationary, their rated voltage being not more than 250 V including direct current (DC) supplied appliances and battery-operated appliances.<br/>
    For extraction fans of ceiling mounted heat lamp appliances, IEC 60335-2-80 is applicable as far as is reasonable.<br/>
    Appliances not intended for normal household use but which nevertheless can be a source of danger to the public, such as appliances intended to be used by laypersons in the shops, in light industry and on farms, are within the scope of this standard.<br/>
    As far as is practicable, this standard deals with the common hazards presented by appliances which are encountered by all persons in and around the home. However, in general, it does not take into account<br/>
    – persons (including children) whose physical, sensory or mental capabilities; or lack of experience and knowledge prevents them from using the appliance safely without supervision or instruction;<br/>
    – children playing with the appliance.<br/>
    Attention is drawn to the fact that<br/>
    – for appliances intended to be used in moving vehicles or on board ships or aircraft, additional requirements can be necessary;<br/>
    – in many countries, additional requirements are specified by the national health authorities, the national authorities responsible for the protection of labour and similar authorities;<br/>
    – for appliances intended to be used in the presence of combustible dust, for example in barns or stables, additional requirements can be necessary;<br/>
    – heaters with pins for insertion into socket outlets have not been considered while drafting this standard and additional requirements can be applicable.<br/>
    This standard does not apply to<br/>
    – appliances intended exclusively for industrial purposes;<br/>
    – appliances intended to be used where special conditions prevail, such as the presence of a corrosive or explosive atmosphere (dust, vapour or gas);<br/>
    – heaters that are built into air conditioners (IEC 60335-2-40);<br/>
    – clothes dryers and towel rails (IEC 60335-2-43);<br/>
    – heaters for saunas (IEC 60335-2-53);<br/>
    – thermal-storage room heaters (IEC 60335-2-61);<br/>
    – heating appliances for breeding and rearing animals (IEC 60335-2-71);<br/>
    – foot warmers and heating mats (IEC 60335-2-81);<br/>
    – flexible sheet heating elements for room heating (IEC 60335-2-96);<br/>
    – recessed luminaires (IEC 60598-2-2);<br/>
    – heated carpets;<br/>
    – central heating systems;<br/>
    – heating cables (IEC 60800).<br/>
    This sixth edition cancels and replaces the fifth edition published in 2009, Amendment 1: 2016 and Amendment 2:2021. This edition constitutes a technical revision.<br/>
    This edition includes the following significant technical changes with respect to the previous edition:<br/>
    a) alignment with IEC 60335-1:2020;<br/>
    b) conversion of some notes to normative text (Clause 1, 5.2, 19.1, 22.104, 22.107);<br/>
    c) introduction of requirements for caravan heaters (Clause 1, 3.5, 7.1, 7.12.1,11.8, 19.109, 19.116, 21.101, 21.105, 22.112, 24.1.4, 24.101, 24.102, 30.1);<br/>
    d) introduction of requirements for heating appliances with suspension means for ceiling mounting (Clause 7.12.1, 21.103);<br/>
    e) introduction of test probe 19 (8.1.1, 20.2, B.22.3, B.22.4).<br/>
    This part 2 is to be used in conjunction with the latest edition of IEC 60335-1 and its amendments unless that edition precludes it; in that case, the latest edition that does not preclude it is used. It was established on the basis of the sixth edition (2020) of that standard.
