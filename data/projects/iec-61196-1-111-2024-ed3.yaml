abstract:
- language: en
  script: Latn
  content: |-
    IEC 61196-1-111:2024 provides test methods to determine the stability of phase of coaxial communication cables. This document is applicable to RF coaxial cables. RF coaxial cable assemblies can also use this document for reference. This part of IEC 61196 comprises following test methods:<br/>
    a) phase variation with temperature (Clause 4);<br/>
    b) phase constant variation with temperature (Clause 5);<br/>
    c) phase stability with bending (Clause 6);<br/>
    d) phase stability with twisting (Clause 7);<br/>
    e) phase consistency test for two or more cables (Annex A);<br/>
    f) phase variation with temperature test between two cables (Annex B).<br/>
    This second edition cancels and replaces the first edition published in 2014. This edition constitutes a technical revision.<br/>
    This edition includes the following significant technical changes with respect to the previous edition:<br/>
    a) addition of the list of test methods in the Scope;<br/>
    b) addition of "the number of scanning points" in every test method;<br/>
    c) addition of Annex A, Phase consistency test for two or more cables;<br/>
    d) addition of Annex B, Phase variation with temperature test between two cables.
