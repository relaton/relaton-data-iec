abstract:
- language: en
  script: Latn
  content: |-
    IEC 62430:2009 specifies requirements and procedures to integrate environmental aspects into design and development processes of electrical and electronic products, including combination of products, and the materials and components of which they are composed. 

    It has the status of a horizontal standard in accordance with IEC Guide 108.
- language: fr
  script: Latn
  content: |-
    La CEI 62430:2009 spécifie les exigences et les procédures destinées à intégrer les aspects environnementaux dans les processus de conception et de développement des produits électriques et électroniques, y compris les combinaisons de produits, et des matériaux et éléments constituants qui les composent. 

    Elle a le statut de norme horizontale conformément au Guide IEC 108.
