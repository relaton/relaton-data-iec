abstract:
- language: en
  script: Latn
  content: |-
    This report gives the procedure for evaluation of the risk of damage to a structure caused by direct and indirect lightning flashes, and to permit the bodies concerned to fix an acceptable value for the frequency of damage to structures.

    This publication has the status of a Technical Report - type 2.
- language: fr
  script: Latn
  content: |-
    Ce rapport propose les procédures d'évaluation des risques de dommages à une structure causés par les coups de foudre directs et indirects, et de permettre aux organismes concernés de fixer une valeur acceptable de la fréquence des dommages aux structures.

    Cette publication a le statut d'un rapport technique  - type 2.
