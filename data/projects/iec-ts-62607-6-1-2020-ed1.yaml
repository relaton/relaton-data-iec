abstract:
- language: en
  script: Latn
  content: |-
    IEC TS 62607-6-1:2020 establishes a standardized method to determine the electrical key control characteristic<br/>
    – volume resistivity<br/>
    for powder consisting of graphene-based material like flakes of graphene, few layer graphene and/or reduced graphene oxide after preparation of a sample in pellet form by<br/>
    – four probe method<br/>
    using powder resistivity measurement system.<br/>
    The volume resistivity is a measure of the quality of powder-type graphene products in terms of electrical property and reflects the density-dependency shown in a pellet of powder-type graphene.<br/>
    The volume conductivity can directly be derived from the volume resistivity.<br/>
    Typical application areas are industries that use powder-type graphene products for graphene manufacture, potential developers, and users who produce graphene-based products. As the volume resistivity measured according to this document requires the preparation of a sample in the form of a pellet, this document describes in detail<br/>
    – an apparatus to prepare consistently a test sample, the pellet,<br/>
    – the preparation of the pellet starting from powder-type graphene,<br/>
    – the measurement procedure to measure the volume resistivity (or volume conductivity) of the pellet, and<br/>
    – the data analysis, the interpretation and reporting of the results.
