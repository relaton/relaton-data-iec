abstract:
- language: fr
  script: Latn
  content: La CEI 61987-1:2006 définit une structure générique dans laquelle il convient d'agencer les caractéristiques des équipements de mesure et de commande dans les processus industriels avec sortie analogique ou numérique, afin de faciliter la compréhension des descriptions de produit quand elles sont transférées d'une partie à l'autre. Elle s'applique à la production des catalogues d'équipements de mesure de processus fournis par le fabricant du produit et aide l'utilisateur à formuler ses exigences.
