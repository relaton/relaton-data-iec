- language: en
  script: Latn
  content: |-
    IEC 63010-2:2017(E) specifies test methods that are particular for cables with insulation and sheath based on halogen-free thermoplastic compounds having rated voltage up to and including 300/300 V for use with small devices and for short connections to desktop electrical appliances where flexibility is of prime importance.<br/>
