abstract:
- language: fr
  script: Latn
  content: |-
    L'IEC 61280-2-1:2010 décrit les procédures d'essai applicables aux systèmes de télécommunications et de données à fibres optiques numériques. L'objet de cette procédure d'essai est la mesure des puissances optiques minimale et maximale requises et admissibles au port d'entrée optique d'un système à fibres optiques, pour assurer son fonctionnement dans les limites spécifiées. Un autre objet est la vérification du critère d'erreur garanti aux puissances d'entrée minimale et maximale spécifiées par le fabricant de l'équipement terminal. Cette seconde édition annule et remplace la première édition parue en 1998 et constitue une révision technique. Les principales modifications par rapport à l'édition antérieure sont indiquées ci-dessous:<br/>
    - révision en vue d'inclure les exigences associées aux matériels de communications de données, régénérateurs et amplificateurs;<br/>
    - the terme "câble de liaison" a été remplacé par "cordon d'essai";<br/>
    - une section relative aux définitions a été ajoutée;<br/>
    - une section traitant des incertitudes de mesure a été ajoutée. La présente version bilingue (2015-12) correspon à la version anglaise monolingue publiée en 2010-03.
    Mots clés: systèmes de télécommunications et de données à fibres optiques numériques, port d'entrée optique
