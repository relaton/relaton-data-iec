- language: en
  script: Latn
  content: |-
    Relates to flexible coaxial cable assemblies operating in the transverse electromagnetic mode (TEM).
    Establishes uniform requirements for testing the electrical, mechanical and climatic properties of flexible coaxial cable assemblies composed of flexible coaxial cables and coaxial connectors.
