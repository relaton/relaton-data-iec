abstract:
- language: en
  script: Latn
  content: |-
    IEC TR 62829-1:2019, which is a Technical Report, covers<br/>
    • a study into the pre-requisites of chemometric (exploratory) data analysis,<br/>
    • an overview of common data analysis procedures for univariate, bivariate and multivariate data analysis,<br/>
    • explanations of the basic principles and major application areas of the different methods),<br/>
    • some recommendations on the selection of an appropriate data analysis strategy.<br/>
    These recommendations not covered earlier by other guidance documents on the topic are complemented by some advice on the validation of commercial (at the site of installation) and tailored software for process analytical purposes. Recommendations are given on available reference data sets (Annex B) for benchmarking of software implementing the data analysis methods covered (if available).
