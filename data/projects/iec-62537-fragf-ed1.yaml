abstract:
- language: fr
  script: Latn
  content: La CEI 62537:2010 spécifie les exigences d'une interface pour haut-parleurs numériques basée sur la série de normes CEI 60958 et sur la norme MIDI. Elle optimise la souplesse et la valeur en combinant ces normes qui étaient précédemment distinctes. Les deux normes fournissent ensemble une interface numérique simple et souple pour haut-parleurs. La présente version bilingue, publiée en 2010-09, correspond à la version anglaise. La version française de cette norme n'a pas été soumise au vote.
