abstract:
- language: en
  script: Latn
  content: |
    IEC 60352-5:2020 is applicable to solderless press-in connections for use in electrical and electronic equipment and components.<br/>
    The press-in connection consists of a termination having a suitable press-in zone which is inserted into a hole of a board.<br/>
    Information on materials and data from industrial experience is included in addition to the test procedures to provide electrically stable connections under specified environmental conditions.<br/>
    The object of this document is to determine the suitability of press-in connections under mechanical, electrical and atmospheric conditions as specified by the manufacturer of the press-in termination and to provide a means of comparing test results when the tools used to make the connections are of different designs or manufacture.<br/>
    This fifth edition cancels and replaces the fourth edition published in 2012. This edition constitutes a technical revision.<br/>
    This edition includes the following significant changes with respect to the previous edition:

    	revising the scope by removing the wording "… telecommunication equipment and in electronic devices employing similar techniques" and replacing it by "… electrical and electronic equipment and components" in the first paragraph;
    	adding terms and definitions for 'board', 'hole' and 'metal board' to recognize that press-in terminations are being used in many non-printed board materials;
    	editorial changes to clarify the difference between the two test schedules for qualification and application;
    	modification of upper limit of copper thickness of the plated-through-hole to reflect actual market trends and manufacturing practices;
    	removal of bending test, as this test is very specific for applications of press-in technology no longer common;
    	adding graphs to document the press-in and push-out force, since this is common testing practice and provides further insight into mechanical performance of the contact zone;
    	reducing the number of test specimens required, since in previous testing scheme a lot of test samples were discarded;
    	new wording in 4.5 for cracked and bent terminations;
    	added Figure 7b to show V and A connection locations when the press-in termination does not protrude through the bottom side of the board.
- language: fr
  script: Latn
  content: |-
    IEC 60352-5:2020 s’applique aux connexions press-in sans soudure pour utilisation dans les équipements et composants électriques et électroniques.<br/>
    La connexion press-in consiste en une terminaison ayant une zone de press-in appropriée qui est insérée dans un trou d’une planche.<br/>
    Les informations sur les matériaux et les données provenant de l’expérience industrielle sont incluses en plus des procédures d’essai pour fournir des connexions électriques stables dans des conditions environnementales spécifiques.<br/>
    L’objet du présent document est de déterminer la pertinence des connexions de presse dans des conditions mécaniques, électriques et atmosphériques telles que spécifiées par le fabricant de la terminaison presse-in et de fournir un moyen de comparer les résultats des essais lorsque les outils utilisés pour effectuer les connexions sont de conceptions ou de fabrications différentes.<br/>
    Cette cinquième édition annule et remplace la quatrième édition publiée en 2012. Cette édition constitue une révision technique.<br/>
    Cette édition comprend les changements importants suivants par rapport à l’édition précédente :<br/>
    a) révision du domaine d’application en supprimant dans le premier alinéa l’expression "…dans les équipements de télécommunication et les systèmes électroniques employant des techniques similaires" et en la remplaçant par l’expression "…dans les équipements et composants électriques et électroniques";<br/>
    b) ajout des termes "carte", "trou" et "carte métallique", et des définitions associées, pour stipuler que les bornes pour connexion insérée à force sont utilisées sur des cartes non imprimées fabriquées dans différents matériaux;<br/>
    c) modifications éditoriales clarifiant la différence entre le programme d’essais de qualification et le programme d’essais d’application;<br/>
    d) modification de la limite supérieure d’épaisseur de cuivre du trou métallisé, afin de refléter les tendances réelles du marché et les pratiques de fabrication;<br/>
    e) suppression de l’essai de courbure, celui-ci ciblant plus spécifiquement des applications de la technologie d’insertion à force qui ne sont plus très répandues;<br/>
    f) ajout de graphiques visant à documenter la force d’insertion et la force d’extraction, car cela constitue une pratique d’essai courante et donne des informations supplémentaires sur les performances mécaniques de la zone de contact;<br/>
    g) réduction du nombre de spécimens exigés, car un lot d’échantillons d’essai avait été ignoré dans le schéma d’essais précédent;<br/>
    h) nouvelle formulation en 4.5 pour les bornes fissurées ou pliées;<br/>
    i) ajout de la Figure 7b pour représenter les points de connexion pour la mesure de la tension et du courant lorsque la borne pour connexion insérée à force ne dépasse pas de la face inférieure de la carte.
