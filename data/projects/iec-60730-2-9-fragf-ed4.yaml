abstract:
- language: en
  script: Latn
  content: |-
    IEC 60730-2-9:2015(E) is available as IEC 60730-2-9:2015 RLV which contains the International Standard and its Redline version, showing all changes of the technical content compared to the previous edition.<br/>
    <br/>
    IEC 60730-2-9:2015(E) applies to automatic electrical temperature sensing controls for use in, on or in association with equipment, including electrical controls for heating, air-conditioning and similar applications. The equipment may use electricity, gas, oil, solid fuel, solar thermal energy, etc., or a combination thereof. This standard is applicable to automatic electrical temperature sensing controls forming part of a building automation control system within the scope of ISO 16484. This standard also applies to automatic electrical temperature sensing controls for equipment that may be used by the public, such as equipment intended to be used in shops, offices, hospitals, farms and commercial and industrial applications. This standard does not apply to automatic electrical temperature sensing controls intended exclusively for industrial process applications, unless explicitly mentioned in the relevant equipment standard. This standard applies to the inherent safety, to the operating values, operating times, and operating sequences where such are associated with equipment safety, and to the testing of automatic electrical temperature sensing control devices used in, or in association with, equipment. This standard is also applicable to the functional safety of low complexity safety-related temperature sensing controls and systems. This fourth edition cancels and replaces the third edition published in 2008, and its Amendment 1:2011. This edition constitutes a technical revision. This edition includes alignment with the text of 60730-1 fifth edition and the following significant technical changes with respect to the previous edition:<br/>
    - modification of heating-freezing tests in Clause 12;<br/>
    - alignment of the EMC requirements in H.26 to those in other part 2 standards and<br/>
    - addition of requirements in Clause H.27 to cover class B and C control functions of temperature sensing controls.<br/>
    <br/>
    This publication is to be read in conjunction with IEC 60730-1:2013.
- language: fr
  script: Latn
  content: |-
    IEC 60730-2-9:2015 s'applique aux dispositifs de commande électrique automatiques thermosensibles pour usage dans, sur ou en association avec des appareils, y compris les dispositifs de commande électrique pour le chauffage, le conditionnement d'air et applications analogues. L’équipement peut fonctionner à l'électricité, au gaz, au pétrole, aux combustibles solides, à l'énergie solaire, etc., ou à une de leurs combinaisons.<br/>
    La présente norme s'applique aux dispositifs de commande électrique automatiques thermosensibles faisant partie d’un système de commande d’automatisation des bâtiments qui relève du domaine d'application de l’ISO 16484.<br/>
    La présente norme s’applique également aux dispositifs de commande électrique automatiques thermosensibles des équipements qui peuvent être utilisés par le public (les équipements destinés à être utilisés dans des magasins, des bureaux, des hôpitaux, des fermes et des applications commerciales et industrielles, par exemple).<br/>
    La présente norme ne s'applique pas aux dispositifs de commande électrique automatiques thermosensibles prévus exclusivement pour des applications industrielles, sauf mention particulière dans la norme d’équipement appropriée.<br/>
    La présente norme s'applique à la sécurité intrinsèque, aux valeurs de fonctionnement, aux temps de fonctionnement et aux séquences de fonctionnement dans la mesure où ils interviennent dans la sécurité de l’équipement, ainsi qu'aux essais des dispositifs de commande électrique automatiques thermosensibles utilisés dans ou avec l’équipement.<br/>
    Cette quatrième édition annule et remplace la troisième édition parue en 2008 et son Amendement 1:2011. Cette édition constitue une révision technique. Cette édition inclut l’alignement sur le texte de la cinquième édition de l’IEC 60730-1 et les modifications techniques majeures suivantes par rapport à l'édition précédente:

    	modification des essais d’échauffement-congélation à l’Article 12;
    	alignement des exigences CEM en H.26 sur celles d’autres normes de la partie 2;
    	ajout d’exigences en H.27 pour couvrir les fonctions de commande des classes B et C des dispositifs de commande thermosensibles.

    La présente Partie 2-9 doit être utilisée conjointement avec l’IEC 60730-1.
