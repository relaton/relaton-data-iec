abstract:
- language: fr
  script: Latn
  content: La CEI 61966-8:2001 est applicable à la caractérisation et l'évaluation des scanners couleur utilisés dans les systèmes informatiques et les applications multimédia et similaires. Elle est conçue pour permettre la caractérisation et l'évaluation de la performance objective des scanners couleur multimédia qui peuvent saisir des images couleur et des informations couleur de sortie, telles que les données rouge, verte et bleue à partir des originaux à réflexion. Les résultats mesurés sont destinés à être utilisés pour les besoins de la gestion de la couleur dans les systèmes multimédia. Les conditions de mesure, les méthodes possibles de mesure et la caractérisation sont définies pour permettre la gestion de la couleur. La présente version bilingue (2013-03) correspond à la version anglaise monolingue publiée en 2001-02.
