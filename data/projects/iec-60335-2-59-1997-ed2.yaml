  script: Latn
  content: S'applique aux appareils destructeurs d'insectes pour usages domestiques et analogues. Cette norme ne s'applique pas aux appareils qui fonctionnent par diffusion de substances chimiques, qui émettent des ultrasons, et qui sont utilisés dans une atmosphère corrosive ou explosive.
