abstract:
- language: en
  script: Latn
  content: |-
    IEC GUIDE 120:2018 provides guidelines on the security topics to be covered in IEC publications, and aspects of how to implement them. These guidelines can be used as a checklist for the combination of publications used in implementation of systems.<br/>
    This document includes what is often referred to as “cyber security”.<br/>
    This document excludes non electrotechnical aspects of security such as societal security, except where they directly interact with electrotechnical security.
