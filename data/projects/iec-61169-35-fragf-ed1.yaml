abstract:
- language: fr
  script: Latn
  content: La CEI 61169-35:2011 fournit des informations et des règles en vue de l'établissement de spécifications particulières de connecteurs coaxiaux RF de la série 2,92, ainsi que la spécification particulière cadre pro-forma. Elle prescrit également les dimensions des faces d'accouplement pour des connecteurs haute performance   classe 1, des détails dimensionnels des connecteurs d essai normalisés. Classe 0, des informations de calibrage et des essais choisis dans la CEI 61169-1 applicable à toutes les spécifications particulières ayant trait aux connecteurs coaxiaux RF de la série 2,92. Cette édition annule et remplace la CEI/PAS 61169-35, publiée en 2009 dont elle constitue une révision mineure. Le seul changement consiste en la transformation de PAS en norme internationale.
