abstract:
- language: en
  script: Latn
  content: |-
    IEC TR 62898-4:2026 describes business use cases (high-level use cases covering the main typical usage of microgrids) and details some of them. System use cases linked to those business use cases are listed and briefly described for contextualizing the main functions to be performed for managing microgrids. Ultimately, the goal of this document is to provide a consistent level of detail for all business use cases. The document details the methodology retained to develop system use cases from the business use cases.<br/>
    <br/>
    This second edition cancels and replaces the first edition published in 2023. This edition includes the following significant technical changes with respect to the previous edition:<br/>
    a) development of the system use cases introduced within the first edition by the business use cases;<br/>
    b) completion of the system use cases with power quality aspects;<br/>
    c) update of the technical content according to the state of the art
