abstract:
- language: en
  script: Latn
  content: |-
    IEC 63378-2-2:2026 specifies three-dimensional (3D) thermal models of plastic ball grid array (PBGA) and fine pitch ball grid array (FBGA) packages, utilized in the steady-state thermal analysis of electronic devices to estimate junction temperatures accurately.<br/>
    This model is intended to be made by semiconductor suppliers and to be used by assembly makers of electronic devices.
- language: fr
  script: Latn
  content: |-
    L’IEC 63378-2-2:2026 spécifie les modèles thermiques tridimensionnels (3D) des boîtiers matriciels à billes en plastique (PBGA, Plastic Ball Grid Array) et des boîtiers matriciels à billes et à pas fin (FBGA, Fine pitch Ball Grid Array), utilisés pour l’analyse thermique en régime établi des dispositifs électroniques afin d’estimer précisément les températures de jonction.<br/>
    Ce modèle est destiné à être fabriqué par les fournisseurs de semiconducteurs et à être utilisé par les assembleurs de dispositifs électroniques.
