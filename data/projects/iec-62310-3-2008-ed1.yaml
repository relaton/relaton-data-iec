abstract:
- language: en
  script: Latn
  content: IEC 62310-3:2008 applies to stand-alone operating a.c. static transfer systems (STS) intended to ensure the continuity of load supply through controlled transfer, with or without interruption of power, from two or more independent a.c. sources. It includes information for the overall integration of the STS and its accessories into the a.c. power network and includes requirements for the switching elements, their control and protective elements, where applicable. It concerns general and safety requirements.
- language: fr
  script: Latn
  content: La CEI 62310-3:2008 s'applique aux Systèmes de Transfert Statique (STS) à courant alternatif autonomes destinés à assurer la continuité de l'alimentation d'une charge par un transfert contrôlé, avec ou sans coupure, à partir d'au moins deux sources indépendantes à courant alternatif. Elle s'applique aux exigences générales et aux règles de sécurité. Elle contient des informations relatives à l'intégration globale d'un STS et de ses accessoires dans un réseau d'énergie électrique en courant alternatif ainsi que des exigences concernant les éléments de commutation, leur commande et leurs éléments de protection, le cas échéant.
