abstract:
- language: en
  script: Latn
  content: |-
    IEC/ASTM 62885-7:2020 is applicable to dry-cleaning robots for household use or under conditions similar to those in households.<br/>
    The purpose of this document is to specify the essential performance characteristics of dry- cleaning robots that are of interest to users and to describe methods for measuring these characteristics.<br/>
    This document is neither concerned with safety requirements nor with performance requirements.<br/>
    This first edition of IEC/ASTM 62885-7 cancels and replaces IEC 62929:2014. This edition constitutes a technical revision.<br/>
    This edition includes the following significant technical changes with respect to IEC 62929:2014:<br/>
    a) the box test has been cancelled;<br/>
    b) the set of straight-line tests have been extended to contain also tests on removal of different kinds of debris both from hard floors and carpets;<br/>
    c) the set of straight-line tests also contains a test on the removal of fibres from carpets;<br/>
    d) as a miscellaneous test, a method for the determination of energy consumption has been added;<br/>
    e) a separate clause on test material and equipment has been added.
- language: fr
  script: Latn
  content: |-
    L'IEC/ASTM 62885-7:2020 s'applique aux robots de nettoyage à sec pour usage domestique ou utilisation dans des conditions similaires à celles rencontrées dans des conditions domestiques<br/>
    Le présent document a pour objet de spécifier les principales caractéristiques d’aptitude à la fonction des robots de nettoyage à sec présentant un intérêt pour les utilisateurs et de décrire des méthodes de mesure de ces caractéristiques.<br/>
    Le présent document ne couvre ni les exigences de sécurité ni les exigences d'aptitude à la fonction.<br/>
    Cette première édition de l'IEC/ASTM 62885-7 annule et remplace l'IEC 62929:2014. Cette édition constitue une révision technique.<br/>
    Cette édition inclut les modifications techniques majeures suivantes par rapport à l'IEC 62929:2014:<br/>
    a) l'essai du caisson a été annulé;<br/>
    b) l'ensemble des essais en trajectoire rectiligne a été élargi pour inclure également des essais d’élimination de différents types de débris aussi bien sur des sols durs que sur des tapis;<br/>
    c) l'ensemble des essais en trajectoire rectiligne inclut également un essai d’élimination de fibres d’un tapis;<br/>
    d) une méthode de détermination de la consommation d'énergie a été ajoutée en tant qu’essai divers;<br/>
    e) un article distinct concernant le matériau et l'équipement d’essai a été ajouté.
