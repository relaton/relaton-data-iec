  content: La CEI 62037-2:2012 définit une procédure pour la mesure des niveaux d'intermodulation passive générés par un cordon coaxial. Cette méthode d'essai s'applique aux jarretières, c'est-à-dire aux cordons destinés à fournir une interface flexible entre des dispositifs rigides.
