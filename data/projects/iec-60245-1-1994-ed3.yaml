- language: en
  script: Latn
  content: Gives definitions. Specifies marking, core identification and general requirements for the construction of cables. Appendices describe code designation and calculation method for determination of the thickness of sheath of cable types IEC 53, 57 and 66 of Publication 60245-4.
- language: fr
  script: Latn
  content: Donne des définitions. Spécifie le marquage, le repérage des conducteurs et les prescriptions générales sur la constitution des conducteurs et des câbles. Des annexes exposent le code de désignation et la méthode de calcul permettant de déterminer l'épaisseur des gaines des câbles types CEI 53, 57, et 66 de la CEI 245-4.
