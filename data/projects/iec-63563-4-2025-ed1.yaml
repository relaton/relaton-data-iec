  content: |-
    CORRECTED VERSION 2026-03<br/>
    <br/>
    IEC 63563-4:2025 comprises guidelines and requirements for Power Receiver design, including circuitry, power consumption, operating power levels, power transfer efficiency, and standby power.<br/>
    <br/>
    This corrected version of IEC 63563-4:2025 incorporates the following correction:<br/>
    - correction of the publication date on the cover page.
- language: fr
  script: Latn
  content: |-
    VERSION CORRIGEE 2026-03<br/>
    <br/>
    IEC 63563-4:2025 comprend des lignes directrices et des exigences pour la conception des récepteurs de puissance, y compris les circuits, la consommation d'énergie, les niveaux de puissance de fonctionnement, l'efficacité du transfert d'énergie et la puissance en veille.<br/>
    <br/>
    Cette version corrigée de l’IEC 63563-4:2025 contient la correction suivante:<br/>
    - correction de la date de publication sur la page de couverture.
