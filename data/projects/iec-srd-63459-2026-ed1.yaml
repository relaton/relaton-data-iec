  content: |-
    IEC SRD 63459:2026 specifies the template for smart manufacturing use cases. It is developed for easier storage, search, comparison, and retrieval of use cases from different SDOs and others by having a unified template of use cases.<br/>
    The storage of SM use cases in IEC UCMR follows the template requirements in this document.
