abstract:
- language: en
  script: Latn
  content: |-
    IEC 61988-2-4:2011 determines the measuring methods for characterizing the performance of plasma display panel (PDP) modules in the following areas:<br/>
    a) viewing angle;<br/>
    b) image streaking;<br/>
    c) flicker;<br/>
    d) moving picture resolution.
- language: fr
  script: Latn
  content: |-
    La CEI 61988-2-4:2011 détermine les méthodes de mesure de caractérisation des performances des modules de panneaux d'affichage à plasma (PDP) dans les domaines suivants:<br/>
    a) angle de visualisation;<br/>
    b) filage d'image;<br/>
    c) papillotement (scintillement);<br/>
    d) résolution d'images animées.
