abstract:
- language: en
  script: Latn
  content: |-
    Gives dimensions and gauges for plug-in pin connectors and snap-fastener connectors for dry batteries. Specifies requirements and a schedule for type tests.

    The contents of the corrigendum of January 1993 have been included in this copy.
- language: fr
  script: Latn
  content: |-
    Concerne les dimensions des connecteurs à broches et à bouton-pression pour les piles avec les calibres de vérification. Spécifie les prescriptions applicables ainsi qu'un programme d'essais de type.

    Le contenu du corrigendum de janvier 1993 a été pris en considération dans cet exemplaire.
