abstract:
- language: en
  script: Latn
  content: IEC/TR 62267-2:2011(E) provides a non normative generic hazard analysis at top system level conducted for the development of IEC 62267 for Automated Urban Guided Transport (AUGT) systems. This report is applicable to all systems covered by the scope of IEC 62267. This generic hazard analysis can be used for specific AUGT systems to support the necessary activities in lifecycle process following IEC 62278.
