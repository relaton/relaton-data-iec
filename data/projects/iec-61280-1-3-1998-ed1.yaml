abstract:
- language: en
  script: Latn
  content: |-
    Measures several wavelength and spectral width properties of an optical spectrum associated with a fibre optic communication subsystem.

    The measurement is done for the purpose of system construction and/or maintenance. The optical transmitter is typically under modulation.
- language: fr
  script: Latn
  content: |-
    Mesure certaines propriétés de longueur d'onde et de largeur d'un spectre optique associé à un sous-système de communication à fibres optiques.

    Le mesurage est effectué dans le but de la construction d'un système et/ou de la maintenance. L'émetteur optique fonctionne en modulation.
