abstract:
- language: en
  script: Latn
  content: |-
    Connectors have 17, 29, 41, 53, 65, 72, 84 or 96 contacts for solder or wrapped connections. Male-female guides ensure polarizing, guiding and coding, with 36 coding possibilities.
    Rating 120 V (r.m.s.), 3 A. Climatic category 55/125/56 or 25/085/21.
- language: fr
  script: Latn
  content: 'Ces connecteurs ont 17, 29, 41, 53, 65, 72, 84 ou 96 contacts, pour connexions soudées ou enroulées. Des guides mâles-femelles assurent la polarisation, le guidage et le codage, avec 36 possibilités de codage. Valeurs nominales: 120 V valeur efficace, 3 A, Catégorie climatique: 55/125/56 ou 25/085/21.'
