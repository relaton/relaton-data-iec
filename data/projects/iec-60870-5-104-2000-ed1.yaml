  script: Latn
  content: S'applique à la téléconduite d'équipement et de systèmes dotés d'une transmission binaire série codés pour la conduite et le contrôle de processus dispersés géographiquement. Définit une norme d'accompagnement de téléconduite qui rend possible l'interopérabilité entre des équipements de téléconduite compatibles.
