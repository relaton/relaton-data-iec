- language: en
  script: Latn
  content: IEC 60444-9:2007 describes two methods for determining the spurious (unwanted) modes of piezoelectric crystal resonators. It extends the capabilities and improves the reproducibility and accuracy compared to previous methods.
- language: fr
  script: Latn
  content: La CEI 60444-9:2007 décrit deux méthodes pour déterminer les modes parasites (non désirés) des résonateurs piézoélectriques. Elle étend les possibilités et améliore la reproductibilité et la précision par rapport aux méthodes précédentes.
