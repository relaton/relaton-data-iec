abstract:
- language: en
  script: Latn
  content: Detail a standard test method to assess the effectiveness of the interfacial sealing of a connector against ingress of water by exposure to low pressure whilst immersed in a salt solution. Is intended to assess the effectiveness of the interfacial sealing means of connectors. Also assesses the sealing of one cavity of a connector from another.
- language: fr
  script: Latn
  content: Etablit une méthode d&#x27;essai normalisée pour évaluer l&#x27;efficacité de l&#x27;étanchéité interfaciale d&#x27;un connecteur contre la pénétration d&#x27;eau en l&#x27;exposant à une basse pression tandis qu&#x27;il est immergé dans une solution salée. Est adapté à l&#x27;évaluation de l&#x27;efficacité des dispositifs d&#x27;étanchéité interfaciale des connecteurs. Evalue également l&#x27;étanchéité d&#x27;un alvéole d&#x27;un connecteur par rapport à tous les autres.
