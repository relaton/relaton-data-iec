abstract:
- language: en
  script: Latn
  content: |-
    It deal with cable networks including equipment and associated methods of measurement for headend reception, processing and distribution of television signals, sound signals and their associated data signals and for processing, interfacing and transmitting all kinds of signals for interactive services using all applicable transmission media.
    This edition includes the following significant technical changes with respect to the previous edition: redrafting of introduction and scope to reflect the current scope of IEC TC 100/TA 5; redrafting of measurement procedure for bit error ratio (BER); updating of performance requirements in Clause 5; inclusion of new Clause 6; inclusion of new Clause 7; inclusion of new Annex K.
