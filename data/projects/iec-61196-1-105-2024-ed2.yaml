abstract:
- language: en
  script: Latn
  content: IEC 61196-1-105:2024 applies to coaxial communication cables. It specifies test methods for determining the withstand voltage of the dielectric of coaxial cables. It is intended to detect the flaws in the dielectric of finished coaxial cables. The test procedures for the cables with special structure are specified in Annex A.
