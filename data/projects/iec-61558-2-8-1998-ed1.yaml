abstract:
- language: en
  script: Latn
  content: |-
    Applies to fixed, single-phase, air-cooled independant or associated safety isolating transformers.
    This part 2 supplements or modifies the corresponding clauses in IEC 61558-1. 

    It has the status of a group safety publication in accordance with IEC Guide 104.

    This standard replaces section 3 of chapter III of IEC 60742.
- language: fr
  script: Latn
  content: |-
    Est applicable aux transformateurs de sécurité installés à poste fixe, monophasés, à refroidissement par air. 
    La présente partie 2 complète ou modifie les articles correspondants de la CEI 61558-1.

    Elle a le statut de publication groupée de sécurité conformément au guide 104 de la CEI.

    La présente norme remplace la section 3 du chapitre III de la CEI 60742.
