abstract:
- language: en
  script: Latn
  content: |-
    IEC 62955:2026 applies to residual direct current detecting devices (RDC-DDs) for permanently connected AC electric vehicle charging stations (mode 3 charging of electric vehicles, according to IEC 61851‑1 and IEC 60364‑7‑722) for rated voltages not exceeding 440 V AC with rated frequencies of 50 Hz, 60 Hz or 50/60 Hz and rated currents not exceeding 125 A.<br/>
    This second edition cancels and replaces the first edition published in 2018. This edition constitutes a technical revision.<br/>
    This edition includes the following significant technical changes with respect to the previous edition:<br/>
    a) redefinition of classification 4.1;<br/>
    b) alignment with IEC 61851‑1:— [1] for classification 4.1.1;<br/>
    c) harmonization of EMC requirements with the new editions of IEC 61543 and IEC 61851‑21‑2;<br/>
    d) general improvement of test and requirements.<br/>
    <br/>
    [1]    Under preparation. Stage at the time of publication: IEC FDIS 61851-1:2026.
