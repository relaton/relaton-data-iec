abstract:
- language: fr
  script: Latn
  content: |-
    La CEI 60426:2007 détermine la capacité des matériaux isolants à produire une corrosion électrolytique sur des métaux en contact avec eux, sous l'influence de contraintes électriques, d'une forte humidité et de températures élevées. L'effet de la corrosion électrolytique est apprécié d'après un seul essai, en utilisant successivement les deux méthodes suivantes:<br/>
    - une méthode visuelle semi-quantitative qui consiste à comparer visuellement la corrosion qui apparaît sur les bandes métalliques pour l'anode et la cathode, à celles des figures de référence. Cette méthode consiste en l'appréciation visuelle directe du degré de corrosion de deux lames de cuivre, servant respectivement d'anode et de cathode, mises en contact avec le matériau isolant en essai et soumises dans des conditions d'environnement spécifiées à une différence de potentiel en courant continu. Le degré de corrosion est évalué en comparant visuellement les marques de corrosion constatées sur les bandes métalliques anode et cathode, à celles des figures de référence;<br/>
    - une méthode quantitative, qui met en jeu des mesures de résistance à la traction, effectuées sur les mêmes bandes métalliques pour l'anode et la cathode, après inspection visuelle.<br/> 
    Une méthode d'essai quantitative supplémentaire en vue de déterminer la corrosion électrolytique, qui met en jeu des mesures de la résistance à la traction de fils de cuivre, est décrite dans l'Annexe informative C.
