abstract:
- language: en
  script: Latn
  content: This part of IEC 60896 applies to all stationary lead-acid cells and monobloc batteries of the valve regulated type for float charge applications, (i.e. permanently connected to a load and to a d.c. power supply), in a static location (i.e. not generally intended to be moved from place to place) and incorporated into stationary equipment or installed in battery rooms for use in telecom, uninterruptible power supply (UPS), utility switching, emergency power or similar applications. The objective of this part of IEC 60896 is to assist the specifier in the understanding of the purpose of each test contained within IEC 60896-21 and provide guidance on a suitable requirement that will result in the battery meeting the needs of a particular industry application and operational condition. This standard is used in conjunction with the common test methods described in IEC 60896-21 and is associated with all types and construction of valve regulated stationary lead-acid cells and monoblocs used in standby power applications.
- language: fr
  script: Latn
  content: La présente partie de la CEI 60896 s'applique à tous les éléments et batteries monoblocs stationnaires au plomb de type étanche à soupapes pour les applications en charge flottante, (c'est-à-dire connectés en permanence à une charge et à une source d'alimentation continue), à un emplacement fixe (c'est-à-dire n'étant généralement pas prévus pour être déplacés d'un emplacement à l'autre) et incorporés dans un matériel stationnaire ou installés dans un local batteries pour des applications telles que télécommunication, alimentation sans interruption (ASI), commutation, alimentation de secours ou applications similaires. L'objectif de la présente partie de la CEI 60896 est de fournir une assistance au responsable de spécifications dans la compréhension de l'objet de chaque essai inclus dans la CEI 60896-21 et de lui servir de guide dans la fixation d'une exigence adaptée qui garantisse que la batterie répondra aux besoins d'une application industrielle spécifique et à des conditions d'exploitation particulières. La présente norme s'utilise conjointement aux méthodes d'essai communes décrites dans la CEI 60896-21 et est associée à tous les types et constructions d'éléments et monoblocs stationnaires au plomb de type étanche à soupapes utilisés dans les applications d'alimentation de secours
