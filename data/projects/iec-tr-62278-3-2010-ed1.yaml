abstract:
- language: en
  script: Latn
  content: |-
    IEC/TR 62278-3:2010(E) provides guidance on applying the reliability, availability and maintainability (RAM) requirements in IEC 62278 to rolling stock and for dealing with RAM activities during the system life cycle phases from invitation to tender to demonstration in operation only. The technical report is aimed at the customers/operators and main suppliers of rolling stock.<br/>
    <br/>
    This publication is to be read in conjunction with  IEC 62278:2002.
