abstract:
- language: en
  script: Latn
  content: |-
    IEC 60050-543:2026 gives the general terminology addressing topics including, but not limited to, materials, printing processes, printability and quality assessment of printed components and systems reliant on printed and flexible devices for their essential functionalities. It focuses on terms that are of particular importance to printed and flexible devices. It is intended to facilitate communication between bodies and individuals in industry and those who interact with them. It has the status of a horizontal publication in accordance with IEC Guide 108, Guidelines for ensuring the coherence of IEC publications – Horizontal functions, horizontal publications and their application.<br/>
    This terminology is consistent with the terminology developed in the other specialized parts of the IEV.<br/>
    This horizontal publication is primarily intended for use by technical committees in the preparation of IEC publications in accordance with the principles laid down in IEC Guide 108.<br/>
    One of the responsibilities of a technical committee is, wherever applicable, to make use of horizontal publications in the preparation of its publications.
- language: fr
  script: Latn
  content: |-
    L'IEC 60050-543:2026 fournit la terminologie générale relative à des thèmes incluant, mais sans s’y limiter, les matériaux, les processus d’impression, l’imprimabilité et l’évaluation de la qualité des composants et systèmes imprimés dont les fonctionnalités essentielles sont dépendantes des dispositifs imprimés et flexibles. Elle est axée sur les termes qui ont une importance particulière pour les dispositifs imprimés et flexibles. Elle vise à faciliter la communication entre les organismes, les personnes travaillant dans l’industrie et tous les intervenants. Elle a le statut de publication horizontale conformément au Guide IEC 108, Guidelines for ensuring the coherence of IEC publications – Horizontal functions, horizontal publications and their application (disponible en anglais seulement).<br/>
    Cette terminologie est en accord avec la terminologie figurant dans les autres parties spécialisées de l’IEV.<br/>
    La présente publication horizontale est essentiellement destinée à l’usage des comités d’études dans la préparation des publications de l'IEC, conformément aux principes établis dans le Guide IEC 108.<br/>
    L’une des responsabilités d’un comité d’études est d’utiliser, autant que possible, les publications horizontales lors de la préparation de ses publications.
