abstract:
- language: fr
  script: Latn
  content: La CEI 60938-2:1999, s'applique à des inductances fixes conçues pour s'opposer aux perturbations électromagnétiques et s'inscrivant dans le domaine d'application de la spécification générique CEI 60938-1. Elle se limite à des inductances fixes pour lesquelles des essais de sécurité sont souhaitables. Cela signifie que les inductances décrites conformément à la présente spécification seront, soit reliées à l'alimentation secteur, auquel cas les essais obligatoires du Tableau 1 sont exigés, soit utilisées en d'autres positions du circuit pour lesquelles la spécification applicable à l'équipement indique que certains ou l'ensemble de ces essais de sécurité sont exigés. Cette deuxième édition annule et remplace la première édition parue en 1988.
