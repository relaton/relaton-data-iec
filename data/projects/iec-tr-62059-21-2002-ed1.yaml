abstract:
- language: en
  script: Latn
  content: |-
    Describes methods for the collection and analysis of field failure data of static electricity metering equipment using field failure reports and sampling plans.To make results comparable, definitions of equipment complexity and classification of failures are given. A failure reporting form is provided in annex A.
    <br /><br />This publication is of high relevance for Smart Grid</a>.
- language: fr
  script: Latn
  content: Décrit des méthodes de collecte et danalyse de données de défaillances sur le terrain des équipements statiques de comptage de l'électricité grâce à des rapports de défaillances sur le terrain et à des plansdéchantillonnage. Pour rendre les résultats comparables, des définitions de complexité des équipements et des classifications de défaillances sont données. Un compte-rendu de défaillance est proposé en annexe A.
