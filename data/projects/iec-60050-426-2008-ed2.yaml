  content: 'This second edition cancels and replaces the first edition published in 1990. This edition constitutes a technical revision. This edition included the following significant technical changes with respect to the previous edition: Terms and definitions have been revised to align with those used in the documents listed in the normative references. It has the status of a horizontal standard in accordance with IEC Guide 108.'
