abstract:
- language: en
  script: Latn
  content: |-
    IEC 63620:2026:<br/>
    <br/>
    –    gives guidance on the functional requirements, operational requirements, reliability requirements and test requirements of the electronic tagging system;<br/>
    –    specifies the core functions of the electronic tagging system, including recording information on the material in the package, locating the position of the package, and transmitting information to the control centre.<br/>
    <br/>
    This document is applicable to the electronic tagging system used for tracking radioactive materials, which is intended for regulatory use in the transport of radioactive materials. Both the radio frequency identification (RFID) and the back-office system are special-purpose systems, with the aim of facilitating the tracking of radioactive materials and improving safety during their transportation.
