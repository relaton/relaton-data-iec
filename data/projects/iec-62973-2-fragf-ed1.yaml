abstract:
- language: en
  script: Latn
  content: |-
    IEC 62973: 2026 applies to NiCd rechargeable batteries for auxiliary power supply systems used on railway vehicles. It is an extension of IEC 62973-1:2018 which specifies common requirements for all battery technologies of other parts of IEC 62973. Unless otherwise specified, the requirements of IEC 62973-1:2018 apply.<br/>
    Battery systems described in this document are used in conjunction with charging systems onboard rolling stock, as described in IEC 62973-1:2018. Charging systems (e.g. LVPS, converters, etc.) are excluded from the scope of this document.<br/>
    This document also specifies the design, operation parameters, safety recommendations, routine and type tests, as well as marking and designation.<br/>
    This document is used in addition to IEC 60623:2017 or IEC 62259:2003 for NiCd Cells.<br/>
    Specific requirements on subcomponents within the battery systems are covered in this document, e.g. temperature measurement components.<br/>
    When there is an existing IEC standard specifying additional test conditions and requirements for NiCd batteries used in specific railway applications and which conflicts with this document, the latter takes precedence.<br/>
    The main objective of this document is to achieve standardization of the electrical interfaces by considering NiCd battery parameters to allow for calculating the NiCd battery capacity required for a specific load profile.
- language: fr
  script: Latn
  content: |-
    IEC 62973 : 2026 s'applique aux différentes batteries NiCd rechargeables destinées aux systèmes d'alimentation auxiliaire utilisés sur les véhicules ferroviaires. Elle constitue un prolongement de l'IEC 62973-1:2018 qui spécifie les exigences communes à l'ensemble des technologies de batteries couvertes par les autres parties de l'IEC 62973. Sauf spécification contraire, les exigences de l'IEC 62973-1:2018 s'appliquent.<br/>
    Les systèmes de batterie décrits dans le présent document sont utilisés conjointement avec des systèmes de charge embarqués sur le matériel roulant, actuellement décrits dans l'IEC 62973-1:2018. Les systèmes de charge (convertisseurs d'alimentation basse tension, etc.) ne relèvent pas du domaine d'application du présent document.<br/>
    Le présent document spécifie également la conception, les paramètres d'exploitation, les recommandations de sécurité, les essais individuels de série et les essais de type, ainsi que le marquage et la désignation.<br/>
    Le présent document est destiné à être utilisé en complément des normes IEC 60623:2017 ou IEC 62259:2003 relatives aux éléments NiCd.<br/>
    Les exigences spécifiques aux sous-composants des systèmes de batterie (composants de mesurage de la température, par exemple) sont couvertes dans le présent document.<br/>
    Dans l'éventualité où il existerait une norme IEC qui spécifie des conditions d'essai et des exigences supplémentaires concernant les batteries NiCd utilisées dans des applications ferroviaires particulières et qui serait en conflit avec le présent document, le présent document prévaut.<br/>
    Le principal objectif du présent document est d'aboutir à la normalisation des interfaces électriques en étudiant différents paramètres de batteries NiCd dans le but de calculer la capacité de batterie NiCd exigée pour un profil de charge donné.
