abstract:
- language: en
  script: Latn
  content: |-
    IEC 62037-3:2021 defines the impact test on coaxial connectors to evaluate their robustness against weak connections and particles inside the connector, as independently as possible from the effects of cable PIM (passive intermodulation). For other connectors (e.g. panel mounted connectors), the cable can be replaced by an adequate transmission-line (e.g. airline, stripline). In order to evaluate the effects of mechanical stresses on the connectors, a series of impacts is applied to the connectors while measuring the PIM. This second edition cancels and replaces the first edition published in 2012. This edition includes the following significant technical changes with respect to the previous edition:<br/>
    a. impact method changed to utilize a steel ball rather than a brass rod;<br/>
    b. impact energy required to test each connector type added;<br/>
    c. method added to calculate impact energy for connector types not listed in the document.
- language: fr
  script: Latn
  content: |-
    L'IEC 62037-3:2021 définit l’essai de choc sur des connecteurs coaxiaux pour évaluer leur robustesse dans le cas de connexions faibles et de particules à l’intérieur des connecteurs, aussi indépendamment que possible des effets de l’intermodulation passive des câbles. Pour les autres connecteurs (par exemple les connecteurs montés sur panneaux), le câble peut être remplacé par une ligne de transmission adéquate (par exemple une ligne à air, une ligne à ruban). Afin d’évaluer les effets des contraintes mécaniques sur les connecteurs, une série de chocs est appliquée aux connecteurs, tout en mesurant l’intermodulation passive. Cette seconde édition annule et remplace la première édition parue en 2012. Cette édition inclut les modifications techniques majeures suivantes par rapport à l’édition précédente:<br/>
    a. modification de la méthode d’impact pour utiliser une bille en acier plutôt qu’une tige en laiton;<br/>
    b. ajout de l’énergie de choc exigée pour soumettre à l’essai chaque type de connecteur;<br/>
    c. ajout de la méthode pour calculer l’énergie de choc pour les types de connecteurs non répertoriés dans le document.
