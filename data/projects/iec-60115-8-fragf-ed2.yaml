abstract:
- language: fr
  script: Latn
  content: |-
    La CEI 60115-8:2009 s'applique aux résistances fixes pour montage en surface utilisées dans les équipements électroniques. Ces résistances sont généralement décrites selon des types (différentes formes géométriques) et des modèles (différentes dimensions). Elles comportent des extrémités métallisées et sont conçues principalement pour être montées directement sur un circuit imprimé. Les principales modifications techniques par rapport à la première édition sont les suivantes:<br/> 
    - introduction d'une classification de produit basée sur les exigences de l'application;<br/> 
    - extension de la liste des modèles et des dimensions;<br/> 
    - utilisation d'un domaine d'application étendu avec des définitions de classe de stabilité;<br/> 
    - extension des listes de valeurs préférentielles des caractéristiques nominales;<br/> 
    - inclusion de conditions d'essai et d'exigences pour le brasage sans plomb, pour les surcharges périodiques, pour la résistance aux décharges électrostatiques (DES);<br/> 
    - inclusion d'une nouvelle série de sévérités pour un essai de cisaillement;<br/> 
    - inclusion de définitions d'une carte d'essai;<br/> 
    - remplacement du niveau d'assurance de la qualité E et des autres possibles par l'unique niveau d'assurance de la qualité EZ qui est conforme aux exigences de l'approche "zéro défaut";<br/> 
    - inclusion d'un essai d'endurance étendu, d'un essai d'inflammabilité, d'un essai d'échauffement, d'essais de vibrations, d'un essai étendu de variation rapide de température et d'un essai de surcharge sous forme d'une simple impulsion de tension élevée;<br/> 
    - inclusion d'exigences applicable aux résistances de valeurs 0 ohm (cavaliers).
