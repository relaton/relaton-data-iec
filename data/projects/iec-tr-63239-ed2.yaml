abstract:
- language: en
  script: Latn
  content: |-
    IEC TR 63239:2025 presents surveyed technologies, product development trends, international standards, and regulation trends of RF beam WPT. This document can be used for the research and analysis of projects that apply small-output remote WPT to mobile devices, such as smartphones, Internet of Things (IoT) devices, and ultra-small sensors.<br/>
    IEC TR 63239:2025 cancels and replaces the first edition published in 2020. This edition constitutes a technical revision.<br/>
    This edition includes the following significant technical changes with respect to the previous edition:<br/>
    a) enhanced frequency details: Subclause 4.4 has been updated to provide more detailed information on candidate frequencies for radio frequency (RF) beam WPT, particularly within the industrial, scientific, and medical (ISM) bands. These revisions offer greater clarity on the available frequency spectrum for RF-based WPT systems;<br/>
    b) expanded applications: Clause 6 introduces new potential applications for RF beam WPT, such as IoT devices, sensors in vehicles, sensors in nursing homes, wireless charging for medical devices, wireless charging for electronic price tags, and wireless charging lamps.
