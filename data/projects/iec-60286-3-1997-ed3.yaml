  content: Concerne la mise en bande des composants électroniques sans fils de sorties ou avec tronçons de sorties destinés à être connectés à des circuits électroniques Seules les dimensions essentielles pour la mise sur bande de composants destinés aux opérations mentionnées ci-dessus sont données.
