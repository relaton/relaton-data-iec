abstract:
- language: en
  script: Latn
  content: |-
    This guide should be used in conjunction with IEC 60034-3. It presents
    guidance on some design features and operating procedures intended
    to avoid the occurrence, or ignition, of an ignitable mixture of
    hydrogen and air, either in the machine itself or associated
    equipment.
- language: fr
  script: Latn
  content: Ce guide doit être utilisé conjointement avec la CEI 60034-3. Il constitue un guide pour la conception de certains éléments et pour les consignes d'exploitation, afin d'éviter la formation ou l'inflammation d'un mélange détonant hydrogène-air, soit dans la machine elle-même, soit dans les équipements extérieurs.
