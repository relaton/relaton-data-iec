- language: en
  script: Latn
  content: Lists the characteristics, ratings as well as the inspection requirements for adjusters of assessed quality used with magnetic oxide cores for use in adjustable inductors and transformers. Is to be used in conjunction with the generic specification IEC 60723-1.
- language: fr
  script: Latn
  content: Donne les caractéristiques et les valeurs ainsi que les exigences de contrôle pour les bâtonnets de réglage, soumis à l'assurance de qualité et employés avec des noyaux en oxyde magnétique destinés aux bobines d'inductance et transformateurs réglables. Cette spécification intermédiaire est utilisée conjointement avec la spécification générique CEI 60723-1.
