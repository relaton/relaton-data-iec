abstract:
- language: en
  script: Latn
  content: IEC 63318:2022 This document specifies electrical systems that are intended to be used for electricity access and not connected to a public network such as product kits up to 35 V DC as specified in IEC 62257-9-5 and IEC 62257-9-8 for Tier 2 of the ESMAP Muti-Tier Framework for household electricity supply; and/or 48 V DC fixed installations, for Tier 3 of the ESMAP Muti-Tier Framework for household electricity supply. This document applies to Tier 2 and Tier 3 installations using SELV DC systems.
- language: fr
  script: Latn
  content: IEC 63318:2022 Le présent document spécifie les systèmes électriques destinés à être utilisés pour l'accès à l'électricité et non raccordés à un réseau public tels que les kits de produits jusqu'à 35 V en courant continu spécifiés dans l'IEC 62257-9-5 et l'IEC 62257-9-8 pour le Niveau 2 du cadre multiniveaux de l'ESMAP pour l'alimentation en électricité domestique, et/ou les installations fixes de 48 V en courant continu pour le Niveau 3 du cadre multiniveaux de l'ESMAP pour l'alimentation en électricité domestique. Le présent document s'applique aux installations de niveau 2 et de niveau 3 qui utilisent des schémas TBTS en courant continu.
