abstract:
- language: en
  script: Latn
  content: |-
    IEC 61523-1:2023 focuses on delay and power calculation for integrated circuit design with support for modeling logical behavior and signal integrity.<br/>
    The standard specifications covered in this document are as follows:<br/>
    - Description language for timing and power modeling, called the “delay calculation language” (DCL)<br/>
    - Software procedural interface (PI) for communications between EDA applications and compiled libraries of DCL descriptions<br/>
    - Standard file exchange format for parasitic information about the chip design: Standard Parasitic Exchange Format (SPEF)<br/>
    - Informative usage examples<br/>
    - Informative notes.<br/>
    This is an IEC/IEEE dual logo standard.
