  content: Décrit deux méthodes, utilisant chacune des appareillages différents pour évaluer la tendance des isolants liquides à émettre ou absorber des gaz lorsqu'ils sont soumis à une contrainte électrique. Le contenu du corrigendum d'octobre 1986 a été pris en considération dans cet exemplaire.
