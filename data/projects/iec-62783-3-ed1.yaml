  content: |-
    <p>IEC 62783-3 is a family specification for twinax cables for SAS physical interfaces, including SAS-3, SAS-4 and SAS-4.1. It specifies materials and cable construction, requirements and test methods, etc.</p>

    <p>The twinax cables for SAS physical interfaces are typically used for signal connection between various components in the server, memory and other devices.</p>
