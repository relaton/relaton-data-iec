abstract:
- language: en
  script: Latn
  content: |-
    IEC 60086-2:2021 (EN) is applicable to primary batteries which are based on standardised electrochemical systems.<br/>
    It specifies<br/>
    – the physical dimensions,<br/>
    – the discharge test conditions and discharge performance requirements.
- language: fr
  script: Latn
  content: |-
    L'IEC 60086-2:2021 (FR)s’applique aux piles électriques qui ont recours à des systèmes électrochimiques normalisés.<br/>
    Elle spécifie:<br/>
    – les dimensions physiques,<br/>
    – les conditions d’essai de décharge et les exigences de performance en décharge.
