abstract:
- language: en
  script: Latn
  content: IEC 60332-1-1:2004 Specifies the test apparatus for testing the resistance to vertical flame propagation for a single vertical electrical insulated conductor or cable, or optical fibre cable, under fire conditions. The procedure, together with an informative annex of recommended requirements for performance, is given in IEC 60332-1-2.
- language: fr
  script: Latn
  content: IEC 60332-1-1:2004 Spécifie l'appareillage d'essai de résistance à la propagation verticale de la flamme sur conducteur ou câble électrique isolé ou sur câble à fibres optiques, soumis au feu. La procédure, ainsi qu'une annexe informative concernant les recommandations pour les prescriptions de performance, sont indiquées dans la CEI 60332-1-2.
