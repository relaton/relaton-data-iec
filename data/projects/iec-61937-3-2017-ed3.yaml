abstract:
- language: en
  script: Latn
  content: |-
    IEC 61937-3:2017 describes the method used to convey non-linear PCM bitstreams encoded according to the AC-3 and enhanced AC-3 formats. This third edition of IEC 61937-3 cancels and replaces the second edition published in 2007. This edition constitutes a technical revision.<br/>
    This edition includes the following significant technical changes with respect to the previous edition:<br/>
    a) removal of support for enhanced AC-3 bitstreams with a sampling frequency of 32 kHz;<br/>
    b) updates to normative and informative references;<br/>
    c) clarification of pause data-burst usage for enhanced AC-3 bitstreams.
