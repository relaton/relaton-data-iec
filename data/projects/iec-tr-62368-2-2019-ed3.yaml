abstract:
- language: en
  script: Latn
  content: |-
    IEC TR 62368-2:2019 provides explanatory information related to IEC 62368-1. Only those subclauses considered to need further background reference information or explanation of their content to benefit the reader are included. Therefore, not all numbered subclauses are cited. Unless otherwise noted, all references are to clauses, subclauses, annexes, figures or tables located in IEC 62368-1:2018. This third edition updates the second edition of IEC 62368-2 published in 2014 to take into account changes made to IEC 62368-1:2014 as identified in the Foreword of IEC 62368-1:2018. This Technical Report is informative only. In case of a conflict between IEC 62368-1 and IEC TR 62368-2, the requirements in IEC 62368-1 prevail over this Technical Report.<br/>
    <br/>
    Key words: Audio/Video, Safeguards, Information, Communication
- language: fr
  script: Latn
  content: |-
    L'IEC TR 62368-2:2019 fournit des explications au sujet de l'IEC 62368-1. Ne sont inclus que les paragraphes qui nécessitent des informations complémentaires ou des explications pouvant bénéficier au lecteur. Par conséquent, certains numéros de paragraphes ne sont pas cités. Sauf indication contraire, toutes les références à des articles, paragraphes, annexes, figures ou tableaux renvoient à l'IEC 62368-1:2018 Cette troisième édition actualise la deuxième édition de l'IEC 62368-2 publiée en 2014 et intègre les modifications faites dans l'IEC 62368-1:2014 telles qu'indiquées dans l'Avant-propos de l'IEC 62368-1:2018. Le présent Rapport technique est un document informatif. En cas de conflits entre l'IEC 62368-1 et l'IEC TR 62368-2, les exigences de l'IEC 62368-1 prévalent sur le présent Rapport technique.<br/>
    <br/>
    Mots-clés: Audio/Vidéo, Protection, Information, Communication
