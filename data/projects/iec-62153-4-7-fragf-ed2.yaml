abstract:
- language: fr
  script: Latn
  content: |-
    L'IEC 62153-4-7:2015 décrit une méthode triaxiale, qui convient pour déterminer l'impédance surfacique de transfert et/ou l'affaiblissement d'écrantage et l'affaiblissement de couplage de connecteurs équipés d'un écran accouplés (y compris la connexion entre le câble et le connecteur) et de cordons. Cette méthode pourrait également être étendue pour déterminer l'impédance de transfert, l'affaiblissement d'écrantage ou l'affaiblissement de couplage de connecteurs symétriques ou à plusieurs broches et de cordons multiconducteurs. Pour le mesurage de l'impédance de transfert et de l'affaiblissement d'écrantage ou l'affaiblissement de couplage, un seul montage d'essai est nécessaire. Cette édition inclut les modifications techniques majeures suivantes par rapport à l'édition précédente:<br/>
    Le document a été révisé et mis à jour. Les modifications de l'IEC 62153-4-3:2013 et de l'IEC 62153-4-4:2015 sont incluses. Les mesurages peuvent à présent être effectués sans adaptation du côté du générateur, les dispositifs d'adaptation d'impédance ne sont pas nécessaires.
