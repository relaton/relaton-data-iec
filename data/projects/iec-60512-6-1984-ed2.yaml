abstract:
- language: en
  script: Latn
  content: The tests contained in this standard, when required by the detail specification, shall be used for electromechanical components having an inherent connecting or switching function intended for use in equipment for telecommunication and in electronic devices employing similar techniques.
- language: fr
  script: Latn
  content: Les essais contenus dans la présente norme doivent être utilisés lorsque la spécification particulière le prescrit pour les composants prévus pour la connexion ou l'interruption électromécanique et destinés à être utilisés dans les matériels de télécommunication et les dispositifs électroniques analogues.
