  content: Spécifie les exigences de compatibilité électromagnétique pour les relais de mesure et dispositifs de protection. Est applicable aux relais de mesure et dispositifs de protection pour la protection des réseaux d'énergie, y compris les fonctions de contrôle, surveillance et communication intégrées utilisées dans ces réseaux.
