abstract:
- language: en
  script: Latn
  content: |-
    IEC 61508-1:2026 covers those aspects to be considered when electrical/electronic/programmable electronic (E/E/PE) systems are used to carry out safety functions.<br/>
    A first objective is to facilitate the development of product and application sector international standards by the technical committees responsible for the product or application sector. This will allow all the relevant factors, associated with the product or application, to be fully considered and thereby meet the specific needs of users of the product and the application sector.<br/>
    A second objective is to enable the development of E/E/PE safety-related systems where product or application sector international standards do not exist.<br/>
    The scope of this document is functional safety for E/E/PE safety-related systems but, apart from normative requirements in the hazard and risk analysis phase, the IEC 61508 series does not itself provide normative requirements for malevolent action arising from a security risk.<br/>
    NOTE 1 For requirements and/or guidance on security see the IEC 62443 series and the ISO/IEC 27000 family.<br/>
    NOTE 2 For guidance on the coordination between safety and security, refer to IEC TR 63069.<br/>
    This third edition cancels and replaces the second edition published in 2010. This edition constitutes a technical revision.<br/>
    This edition includes the following significant technical changes with respect to the previous edition:<br/>
    a) the scope includes clarification on 'artificial Intelligence' (software technology class), human factors and security. The related requirements are limited to the hazard and risk analysis (refer to 7.1.2.3 on human factors and 7.4.2.3 for security) and further references to external guidance;<br/>
    b) the interfaces to other parts of IEC 61508 have been clarified and duplication of requirements in other Parts has been removed;<br/>
    c) the differentiation between the required safety integrity level (SIL) and the achieved Systematic Capability (SC) has been clarified;<br/>
    d) more detailed requirements on competence of people have been provided;<br/>
    e) requirements on levels of independence for functional safety assurance activities (Annex B) have been introduced;<br/>
    It has the status of a basic safety publication according to IEC Guide 104 and has been developed according to ISO/IEC Guide 51.
