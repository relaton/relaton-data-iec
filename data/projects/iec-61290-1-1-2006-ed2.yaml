abstract:
- language: en
  script: Latn
  content: This International Standard applies to all commercially available optical amplifiers (OAs) and optically amplified modules. It applies to OAs using optically pumped fibers (OFAs based on either rare-earth doped fibers or on the Raman effect), semiconductor OAs (SOAs) and waveguides (POWAs).
- language: fr
  script: Latn
  content: La présente Norme internationale s'applique à tous les amplificateurs optiques (OA, Optical Amplifier en anglais) et modules à amplification optique disponibles sur le marché. Elle s'applique aux OA utilisant des fibres pompées optiquement (OFA basés sur des fibres dopées aux terres rares ou sur l'effet Raman), des semiconducteurs (SOA), et des guides d'ondes (POWA).
