- language: en
  script: Latn
  content: determines the layout and style for detail specifications describing symmetrical pair cables with transmission characteristics up to 1 200 MHz for digital and analog communications. Detail specifications, based on the blank detail specification, may be prepared by a national organization, a manufacturer, or a user.
- language: fr
  script: Latn
  content: détermine la mise en page et le style pour les spécifications particulières décrivant les câbles à paires symétriques avec caractéristiques de transmission jusqu'à 1 200 MHz pour transmissions numériques et analogiques. Sur la base de cette spécification particulière cadre, des spécifications particulières peuvent être préparées par un organisme national de normalisation, un constructeur ou un utilisateur.
