abstract:
- language: en
  script: Latn
  content: |-
    ISO/TR 80002-2:2017(E) applies to any software used in device design, testing, component acceptance, manufacturing, labelling, packaging, distribution and complaint handling or to automate any other aspect of a medical device quality system as described in ISO 13485.<br/>
    ISO/TR 80002-2:2017 applies to<br/>
    - software used in the quality management system,<br/>
    - software used in production and service provision, and<br/>
    - software used for the monitoring and measurement of requirements.<br/>
    It does not apply to<br/>
    - software used as a component, part or accessory of a medical device, or<br/>
    - software that is itself a medical device.
