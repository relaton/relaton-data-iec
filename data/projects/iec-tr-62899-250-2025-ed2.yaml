abstract:
- language: en
  script: Latn
  content: |-
    IEC TR 62899-250:2025 explores a new technological field to establish standardization activities in TC 119 (Printed electronics) in particular, and to contribute to the development and market expansion of wearable smart device (WSD) technology.<br/>
    This edition includes the following significant technical changes with respect to the previous edition:<br/>
    a) added classification of e-textile integrated type;<br/>
    b) added Clause 5, “Verification of conclusions in IEC TR 62899-250:2016 (edition 1)”;<br/>
    c) added explanation of 3D printed circuits;<br/>
    d) introduced trends in standardization activities, especially those after the first edition publication;<br/>
    e) added new issues that became clear after the first edition was published.
