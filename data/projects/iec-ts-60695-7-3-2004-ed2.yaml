abstract:
- language: en
  script: Latn
  content: |-
    Concerns laboratory tests used to measure the toxic components of the fire effluent from either electrotechnical products  or materials  used in electrotechnical products. It provides  guidance on  the use and interpretation of results from such tests. It discusses currently available approaches to toxic hazard assessment consistent with the  approach of ISO TC  92 SC 3, as set out in ISO/TR 9122-1 to 9122-6, ISO 13344 and ISO/TS  13571. It also  provides guidance on the use of  toxic potency data in hazard assessment and on principles which underlie the use of combustibility and toxicological information in hazard assessment.
    The methods described are applicable to data concerning both the incapacitating effects and the lethal effects of fire effluents.
    The structure of this technical specification remains essentially the same as the first edition but has been usefully expanded in all areas to further clarify the alignment with ISO/TC 92 Fire Safety and in particular with ISO 13344 and ISO/TS 13571.
    The main topics have been expanded upon to bring them into alignment with the current philosophy for the use and interpretation of test results.
    - Formulae are given for the calculation of the fraction of the   
    incapacitating dose for each of the asphyxiants, carbon monoxide
    and hydrogen cyanide.                                           
    - Volume fractions that are expected to cause incapacitation (F values) are given for some of the more important irritants.
    - Equations used to predict death are given.
    - The hyperventilatory effect of carbon dioxide is discussed.
    Has the status of a basic safety publication in accordance with IEC Guide 104.
- language: fr
  script: Latn
  content: |-
    Concerne les essais en laboratoire utilisés pour mesurer les composants toxiques des effluents du feu provenant des produits électrotechniques ou des matériaux utilisés dans ces produits. Elle fournit des indications pour l'utilisation et l'interprétation des résultats obtenus lors de ces essais. Elle traite des approches actuellement disponibles pour l'évaluation du risque toxique compatible avec l'approche du TC 92 SC 3 de l'ISO, telle qu'elle est définie dans l'ISO/TR 9122-1 à 9122-6, dans l'ISO 13344 et l'ISO/TS 13571. Elle fournit également des indications pour l'utilisation des données de puissance toxique dans l'évaluation du danger et sur les principes qui mettent l'accent sur l'utilisation des informations sur la combustion et la toxicologie dans l'évaluation du risque.
    Les méthodes décrites sont applicables aux données concernant à la fois les effets incapacitants et les effets létaux des effluents du feu.
    La structure de la présente spécification technique reste pour l'essentiel la même que dans la première édition mais elle a été utilement étoffée dans tous les domaines afin de mieux mettre en lumière son alignement sur les travaux du TC 92 de l'ISO Sécurité au feu et en particulier sur l'ISO 13344 et l'ISO/TS 13571.
    Les principaux thèmes ont été étendus pour les aligner sur la philosophie actuelle d'utilisation et d'interprétation des résultats d'essai.
    - Des formules sont données pour le calcul de la fraction de la dose incapacitante pour chacun des agents asphyxiants, du monoxyde de carbone et du cyanure d'hydrogène.
    - Les fractions de volume supposées causer l'incapacitation (valeurs F) sont données pour certains des irritants les plus importants.
    - Les équations utilisées pour les prévisions du taux de létalité sont indiquées. 
    - L'effet hyperventilatoire du dioxyde de carbone est étudié.
    A le statut de publication fondamentale de sécurité, conformément au Guide CEI 104.
