abstract:
- language: en
  script: Latn
  content: The rules of this part of IEC 60364 are intended to provide for the safety of persons and equipment in a LV system in the event of a fault between the HV system and earth in the HV part of transformer stations which supply low-voltage systems.
- language: fr
  script: Latn
  content: Les règles de la présente partie de la CEI 60364 sont destinées à assurer la sécurité des personnes et des matériels dans une installation à basse tension en cas de défaut entre l'installation à haute tension et la terre dans la partie haute tension du poste alimentant l'installation à basse tension.
