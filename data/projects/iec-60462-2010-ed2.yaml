abstract:
- language: en
  script: Latn
  content: |-
    IEC 60462:2010(E) establishes test procedures for photomultiplier tubes (PMT) for scintillation and Cherenkov detectors. The tests described are supplementary to those described in IEC 60306-4. The main technical changes of this new edition with regard to the previous one are as follows:<br/>
    - the requirements have been revised and the terminology,<br/>
    - definitions and normative references have been brought up-to-date.
