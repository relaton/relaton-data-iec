abstract:
- language: en
  script: Latn
  content: IEC 60749-7:2011 specifies the testing and measurement of water vapour and other gas content of the atmosphere inside a metal or ceramic hermetically sealed device. The test is used as a measure of the quality of the sealing process and to provide information about the long-term chemical stability of the atmosphere inside the package. It is applicable to semiconductor devices sealed in such a manner but generally only used for high reliability applications such as military or aerospace. This test is destructive. This second edition cancels and replaces the first edition published in 2002 and constitutes a technical revision. This second edition has been completely re-written so as to align it with the text of the latest versions of MIL-STD-750, method 1018 and MIL-STD-883, method 1018. The main change is the removal of the two alternative methods formerly designated method 2 and method 3.
- language: fr
  script: Latn
  content: La CEI 60749-7:2011 spécifie les essais et les mesures de la teneur en vapeur d'eau et en autres gaz de l'atmosphère à l'intérieur d'un dispositif métallique ou céramique scellé hermétiquement. L'essai est utilisé en tant que mesure de la qualité du procédé de scellement et en vue de fournir des informations sur la stabilité chimique à long terme de l'atmosphère à l'intérieur du boîtier. Il est applicable à tous les dispositifs à semiconducteurs scellés de cette manière mais généralement réservés pour les applications à haute fiabilité comme dans les domaines militaire et spatial. Le présent essai est destructif. Cette deuxième édition annule et remplace la première édition parue en 2002, dont elle constitue une révision technique. Cette seconde édition a été complètement remaniée de manière à l'aligner sur le texte des dernières versions de la MIL-STD-750, méthode 1018 et la MIL-STD-883, méthode 1018. La modification principale est la suppression des deux méthodes alternatives, anciennement désignées méthode 2 et méthode 3.
