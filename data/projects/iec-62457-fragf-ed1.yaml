abstract:
- language: fr
  script: Latn
  content: La CEI 62457:2012 spécifie les exigences relatives à l'interface entre la couche inférieure d'un réseau résidentiel pour un réseau résidentiel local d'appareils domestiques de type autonome et la couche TCP/IP (Protocole de commande de transmission/Protocole Internet, en anglais "Transmission Control Protocol/Internet Protocol") lorsqu'on souhaite introduire une couche TCP/IP à chacun des n uds comprenant ce réseau résidentiel d'appareils domestiques de type autonome. L'interface spécifiée dans la couche inférieure du réseau résidentiel est constituée de 2 parties, l'interface TCP/IP et l'interface inférieure spécifique au support. La présente version bilingue (2012-10) correspond à la version anglaise monolingue publiée en 2007-09.
