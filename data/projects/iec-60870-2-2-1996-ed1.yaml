abstract:
- language: en
  script: Latn
  content: |-
    Applies to telecontrol equipment and systems with coded bit serial
    data transmission for monitoring and control of geographically wides
    pread processes. Specifies classes for environmental conditions
    under which the various components of the systems have to operate.
- language: fr
  script: Latn
  content: |-
    S'applique aux matériels et aux systèmes de téléconduite avec
    transmission de données série par bits codés destinés à la
    surveillance et à la conduite de processus géographiquement dispersé
    s. Définit des classes en fonction des conditions d'environnement
    dans lesquelles les différents composants des systèmes considérés
    doivent fonctionner.
