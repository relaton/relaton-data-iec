abstract:
- language: en
  script: Latn
  content: Lays down uniform requirements for judging the mechanical, electrical and climatic properties of sockets, describes test methods and gives recommendations for the standard dimensions and classification of the sockets into groups according to their ability to withstand extremes of temperature, humidity or mechanical stress.
- language: fr
  script: Latn
  content: Etablit des prescriptions uniformes permettant d'apprécier les qualités mécaniques, électriques et climatiques des supports, décrit les méthodes d'essai et donne des recommandations concernant les dimensions normalisées et la classification en catégories suivant l'aptitude des supports à résister aux extrêmes de température, d'humidité, de pression ou de contraintes mécaniques.
