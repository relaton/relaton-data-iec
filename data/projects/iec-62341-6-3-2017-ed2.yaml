abstract:
- language: en
  script: Latn
  content: |-
    IEC 62341-6-3:2017(E) specifies the standard measurement conditions and measuring methods for determining the image quality of organic light emitting diode (OLED) display panels and modules.<br/>
    This second edition cancels and replaces the first edition published in 2012. This edition constitutes a technical revision.<br/>
    This edition includes the following significant technical changes with respect to the previous edition:<br/>
    a) the measuring method for viewing angle has been modified. Measurement of the half luminance angle, gamma distortion, and directional colour variation is added;<br/>
    b) measurement method for colour characteristics is added;<br/>
    c) additional explanation is added in static image resolution clause;<br/>
    d) moving image resolution clause has been moved to Annex B.<br/>
    The contents of the corrigendum of October 2019 have been included in this copy.
