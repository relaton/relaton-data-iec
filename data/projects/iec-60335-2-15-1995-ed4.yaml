abstract:
- language: en
  script: Latn
  content: Deals with the safety of electrical appliances for heating liquids for household and similar purposes, e.g. kettles, coffee-makers, steam cookers. To be used by laymen in light industry and on farms. The contents of the interpretation sheet of September 1996 have been included in this copy.
- language: fr
  script: Latn
  content: 'Traite de la sécurité des appareils électriques de chauffage des liquides destinés à des usages domestiques et analogues, par ex.: bouilloires, cafetières, cuiseurs à vapeur. Utilisé par des usagers non avertis dans les magasins, chez les artisans et dans les fermes. Le contenu de la feuille d''interprétation de septembre 1995 a été pris en considération dans cet exemplaire.'
