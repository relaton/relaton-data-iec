abstract:
- language: en
  script: Latn
  content: IEC 61000-4-6:2008 relates to the conducted immunity requirements of electrical and electronic equipment to electromagnetic disturbances coming from intended radio-frequency (RF) transmitters in the frequency range 9 kHz up to 80 MHz. Equipment not having at least one conducting cable (such as mains supply, signal line or earth connection) which can couple the equipment to the disturbing RF fields is excluded. The object of IEC 61000-4-6:2008 is to establish a common reference for evaluating the functional immunity of electrical and electronic equipment when subjected to conducted disturbances induced by radio-frequency fields. The test method documented in this part of IEC 61000 describes a consistent method to assess the immunity of an equipment or system against a defined phenomenon. IEC 61000-4-6:2008 has the status of a basic EMC publication in accordance with IEC Guide 107. This third edition of IEC 61000-4-6:2008 cancels and replaces the second edition published in 2003, Amendment 1 (2004) and Amendment 2 (2006). This edition cons titutes a technical revision.
- language: fr
  script: Latn
  content: IEC 61000-4-6:2008 se rapporte aux exigences relatives à l'immunité en conduction des équipements électriques et électroniques aux perturbations électromagnétiques provoquées par des émetteurs destinés à des radiofréquences (RF), dans la plage de fréquences de 9 kHz à 80 MHz. Les matériels n'ayant pas au moins un câble conducteur (tel que cordons d'alimentation, lignes de transmission de signaux ou connexions de mise à la terre) pouvant coupler les matériels aux champs RF perturbateurs ne sont pas concernés par cette norme. L'objet de la CEI 61000-4-6:2008 est d'établir une référence commune dans le but d'évaluer l'immunité fonctionnelle des matériels électriques et électroniques, quand ils sont soumis aux perturbations conduites induites par les champs radiofréquence. La méthode d'essai documentée dans cette partie de la CEI 61000, décrit une méthode cohérente dans le but d'évaluer l'immunité d'un matériel ou d'un système vis-à-vis d'un phénomène défini. La CEI 61000-4-6:2008 a le statut de publication fondamentale en CEM en accord avec le Guide 107 de la CEI. Cette troisième édition de la CEI 61000-4-6 annule et remplace la deuxième édition parue en 2003, l'Amendement 1 (2004) et l'Amendement 2 (2006). Cette édition constitue une révision technique.
