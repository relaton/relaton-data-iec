abstract:
- language: fr
  script: Latn
  content: |-
    La CEI 60268-16:2011 spécifie des méthodes objectives d'évaluation de la qualité de transmission de la parole sous l'angle de l'intelligibilité. Elle met un manuel complet à la disposition de tous les types d'utilisateurs de la méthode STI dans les domaines de l'audio, des communications et de l'acoustique. Trois méthodes, étroitement liées, sont présentées sous le nom de STI, STIPA, et STITEL. Les deux premières méthodes sont destinées à l'évaluation des performances de la transmission de la parole avec ou sans systèmes électroacoustiques. La méthode STITEL a des utilisations plus restreintes. Cette quatrième édition annule et remplace la troisième édition parue en 2003, et constitue une révision technique. Elle inclut les modifications techniques importantes suivantes par rapport à l'édition précédente:<br/>
    - Le développement d'une normalisation plus aboutie, plus complète et moins ambiguë de la méthodologie STI;<br/>
    - le terme STIr n'est plus utilisé. Une nouvelle fonction pour la prédiction des effets du masquage auditif est introduite;<br/>
    - le concept de "niveau de parole" et le réglage du niveau du signal d'essai ont été introduits;<br/>
    - des informations supplémentaires relatives aux modes opératoires de prédiction et de mesures ont été incluses. La version française de cette norme n'a pas été soumise au vote.
