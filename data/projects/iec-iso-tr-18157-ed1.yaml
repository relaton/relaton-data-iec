abstract:
- language: en
  script: Latn
  content: |-
    This document provides an introduction to quantum computing, including background, quantum information basics, quantum computing paradigms and approaches, quantum hardware, software, algorithms and applications.<br/>
    This document is a companion to ISO/IEC 4879:2024 Information technology — Quantum computing — Vocabulary. It is meant to assist readers who are non-expert in quantum fields and seek to gain basic and foundational knowledge of quantum computing technology and the ecosystem surrounding it. This document will provide common reference for those interested in the advancement of the technology and the growth of the surrounding industry.
