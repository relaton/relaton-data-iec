abstract:
- language: en
  script: Latn
  content: Applies to radio receivers of any kind excluding television receivers, and to the parts of which they are composed, or which are used as auxiliaries to such receivers. Deals with the determination of performance, the comparison of equipment and the determination of proper practical applications by listing the characteristics useful for specifications and laying down uniform methods of measurement for these characteristics. Also replaces IEC 315-2 (1971).
