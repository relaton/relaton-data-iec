abstract:
- language: en
  script: Latn
  content: |-
    CORRECTED VERSION 2025-11<br/>
    <br/>
    IEC 62841-2-18:2024 is to be used in conjunction with IEC 62841-1:2014. This document supplements or modifies the corresponding clauses in IEC 62841-1, so as to convert it into the IEC Standard: Particular requirements for hand-held strapping tools. Where a particular subclause of IEC 62841-1 is not mentioned in this document, that subclause applies as far as reasonable. Where this document states "addition", "modification" or "replacement", the relevant text in IEC 62841-1 is to be adapted accordingly. This document applies to hand-held strapping tools.<br/>
    The content of the corrigendum 1 (2025-11) has been included in this copy.
- language: fr
  script: Latn
  content: |-
    VERSION CORRIGEE 2025-11<br/>
    <br/>
    L'IEC 62841-2-18:2024 doit être utilisé conjointement avec l'IEC 62841-1:2014. Le présent document complète ou modifie les articles correspondants de l'IEC 62841-1 de façon à la transformer en norme IEC: Exigences particulières pour les outils à cercler portatifs. Lorsqu'un paragraphe particulier de l'IEC 62841-1 n'est pas mentionné dans le présent document, ce paragraphe s'applique pour autant que cela soit raisonnable. Lorsque le présent document mentionne "addition", "modification" ou "remplacement", le texte correspondant de l'IEC 62841-1 doit être adapté en conséquence. Le présent document s'applique aux outils à cercler portatifs.<br/>
    Le contenu du corrigendum 1 (2025-11) a été pris en considération dans cet exemplaire.
