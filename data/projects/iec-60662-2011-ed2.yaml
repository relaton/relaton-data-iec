abstract:
- language: en
  script: Latn
  content: |-
    IEC 60662:2011 specifies performance requirements for high-pressure sodium vapour lamps for general lighting purposes which comply with the safety requirements of IEC 62035. This second edition cancels and replaces the first edition published in 1980 and its amendments. It constitues a technical revision. Main items that required development of the 2nd edition of IEC 60662 are:<br/>
    - restriction to performance requirements. Safety requirements are given in IEC 62035: Discharge lamps (excluding fluorescent lamps) - Safety specifications;<br/>
    - introduction of a test device for ignition;<br/>
    - split of the lamp data sheets which make use of the test device and those which do not;<br/>
    - provisions for measurement during starting, measurement of electrical and photometrical characteristics and tests for lumen maintenance and life;<br/>
    - general review e.g. of maximum lamp outlines and alignment of data;<br/>
    - new order of data sheets by wattage.
- language: fr
  script: Latn
  content: |-
    La CEI 60662:2011 spécifie les exigences de performance pour les lampes à vapeur de sodium à haute pression pour l'éclairage général qui satisfont aux exigences de sécurité de la CEI 62035. Cette seconde édition annule et remplace la première édition publiée en 1980 et ses amendements, dont elle constitue une révision technique. Les principaux éléments à l'origine de la 2e édition de la CEI 60662 sont les suivants:<br/>
    - limites relatives aux exigences de performance. Les exigences de sécurité sont fournies dans la CEI 62035: Lampes à décharge (à l'exclusion des lampes à fluorescence) - Prescriptions de sécurité;<br/>
    - présentation d'un dispositif d'essai d'amorçage;<br/>
    - séparation des feuilles de caractéristiques des lampes qui utilisent le dispositif d'essai et des autres lampes;<br/>
    - dispositions relatives aux mesures pendant l'amorçage, mesures des caractéristiques électriques et photométriques et essais de maintien du flux et de durée de vie;<br/>
    - examen général, par exemple de l'encombrement maximal des lampes et l'alignement des données;<br/>
    - nouveau classement des feuilles de caractéristiques par puissance.
