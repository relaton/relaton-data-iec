  content: Cette norme concerne la sécurité des appareils de thérapie à ondes courtes dont la puissance de sortie assignée ne dépasse pas 500 W. La deuxième édition corrige certaines insuffisances de la première et traite plus en détail les appareils à applicateur inductif.
