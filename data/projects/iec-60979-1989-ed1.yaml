  script: Latn
  content: S'applique aux connexions enroulées des fils miniatures d'équipement à conducteur massif, pour usage avec des machines manuelles et semi-automatiques et des machines totalement automatiques. Indique les prescriptions supplémentaires pour les fils miniatures d'équipement pour basses fréquences utilisés pour les connexions enroulées.
