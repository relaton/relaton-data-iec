abstract:
- language: en
  script: Latn
  content: |-
    IEC 62884-1:2017 specifies the measurement techniques for piezoelectric, dielectric and electrostatic oscillators, including Dielectric Resonator Oscillators (DROs) and oscillators using FBAR (hereinafter referred to as "Oscillator")<br/>
    NOTE: Dielectric Resonator Oscillators (DROs) and oscillators using FBAR are under consideration.
- language: fr
  script: Latn
  content: |-
    <p>L'IEC 62884-1:2017 spécifie les techniques de mesure des oscillateurs piézoélectriques, diélectriques et électrostatiques, y compris les oscillateurs à résonateur diélectrique (DRO – Dielectric Resonator Oscillators) et les oscillateurs utilisant des résonateurs et filtres à ondes de volume sur couches minces (FBAR) (ici appelé "Oscillateur").<br/>
    NOTE: Les oscillateurs à résonateur diélectrique (DRO) et les oscillateurs utilisant FBAR sont à l'étude.</p>
