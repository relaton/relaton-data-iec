abstract:
- language: en
  script: Latn
  content: |-
    IEC 62333-2:2006 specifies the methods for measuring the electromagnetic characteristics of a noise suppression sheet. Those methods are intended to provide useful and repeatable measurements to characterize the performance of the noise suppression sheets, so that manufacturers and their customers are able to obtain the same results.<br/>
    <br/>
    This publication is to be read in conjunction with IEC 62333-1:2006.
- language: fr
  script: Latn
  content: |-
    La CEI 62333-2:2006 spécifie les méthodes de mesure des caractéristiques électromagnétiques d'une plaque réduisant le bruit. Ces méthodes sont destinées à fournir des mesures utiles et reproductibles pour caractériser les performances des plaques réduisant le bruit, de sorte que les fabricants et leurs clients puissent obtenir les mêmes résultats.<br/>
    <br/>
    Cette publication doit être lue conjointement avec la CEI 62333-1:2006.
