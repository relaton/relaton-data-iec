abstract:
- language: en
  script: Latn
  content: Deals with optical telecommunication cables installed underwater for lake and river crossings. Does not cover methods of cable repair or repair capability, nor does it cover cables for use with lake and river crossing line amplifiers.
- language: fr
  script: Latn
  content: |-
    S'applique aux câbles optiques de télécommunication destinés à être utilisés pour les traversées des lacs et des rivières.
    Ne couvre ni les méthodes de réparation des câbles ni leur réparabilité, ni les câbles équipés d'amplificateurs pour utilisation pour la traversée des lacs et des rivières.
