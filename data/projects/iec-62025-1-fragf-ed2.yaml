abstract:
- language: fr
  script: Latn
  content: |-
    La CEI 62025-1:2007 s'applique aux inductances fixes pour montage en surface et aux perles de ferrite. En cas de conflit entre cette spécification et les spécifications particulières, ce sont ces dernières qui auront la priorité. La présente norme vise à établir des exigences applicables aux inductances fixes pour montage en surface en décrivant les termes nécessaires, en donnant des recommandations pour les valeurs et les dimensions normalisées et en proposant des lignes directrices sur les inductances fixes pour montage en surface. Cette édition inclut les modifications techniques majeures suivantes par rapport à l'édition précédente:<br/>
    - une nomenclature des dimensions de la Figure 1 a été modifiée;<br/>
    - un nouveau Tableau 1, Lettres d'identification pour les valeurs d'inductance, a été ajouté;<br/>
    - les dimensions des formes dans les Tableaux 2 et 5 ont été ajoutées;<br/>
    - de nouvelles valeurs de températures assignées au Tableau 9 ont été ajoutées.
