abstract:
- language: en
  script: Latn
  content: |-
    <p>IEC TR 62627-10.2026 summarises the results of the investigation of the change in attenuation during and after temperature cycling on the following test configurations: LC pigtail, LC patchcord and cable with the cable elements fixed at both ends; also, shrinkage of the cable sheath was measured. LC simplex shrinkage of the simplex cables used was determined after the same temperature cycling test.</p>

    <p>The test results are from 14 tests with single-mode test samples from 5 companies and from 3 tests with multimode test samples from 2 companies. That covers a limited number of LC simplex connectors and simplex cables available on the market. The results are representative for some components (LC simplex connectors terminated as pigtail or patchcord and simplex cables ∅︀1,7 mm and 2,0 mm) but not necessarily for the whole market where several other connector and cable types are used. Although the test results cover a small part of all possible component and configuration options, the test results provide useful information.</p>
