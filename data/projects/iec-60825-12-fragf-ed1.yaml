abstract:
- language: fr
  script: Latn
  content: |-
    La présente partie de la CEI 60825 donne des exigences et des directives spécifiques relatives à la fabrication et à l'utilisation sans aucun risque des appareils à laser et des systèmes employés pour la transmission optique de données en espace libre, d'un point à un autre ou d'un point à plusieurs autres points. Cette norme ne traite que de la partie du faisceau qui se propage dans un espace ouvert du système. Si des parties de l'équipement ou du système comprennent une fibre optique qui s'étend au-delà des limites de confinement de l'enveloppe ou des enveloppes, les exigences de fabrication et de sécurité de la CEI 60825-1 ne doivent s'appliquer qu'à ces parties. Cette norme ne s'applique pas aux systèmes conçus dans le but de transmettre un flux énergétique optique pour des applications telles que le traitement des matériaux ou le traitement médical. Cette norme ne s'applique pas non plus à l'utilisation des systèmes en atmosphères explosives.

    L'objectif de cette partie de la CEI 60825 est de:

    - fournir des informations pour protéger les personnes contre le rayonnement optique potentiellement dangereux produit par les systèmes de communication optique en espace libre (SCOEL ou FSOCS), en spécifiant les moyens de contrôle et les exigences techniques, les moyens de contrôle administratif et les règles de travail en fonction du degré de danger;

    - spécifier des exigences à l'usage des organismes assurant la fabrication, l'installation, le réglage/l'entretien et l'exploitation, afin d'établir des procédures et de fournir des informations écrites, de sorte que des précautions appropriées puissent être prises.
