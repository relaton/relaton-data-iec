abstract:
- language: en
  script: Latn
  content: |-
    IEC 60079-11:2023 specifies the construction and testing of intrinsically safe apparatus intended for use in explosive atmospheres, and for associated apparatus which is intended for connection to intrinsically safe circuits which enter such atmospheres.<br/>
    This Type of Protection is applicable to electrical equipment in which the electrical circuits themselves are incapable of causing ignition of a surrounding explosive atmosphere. This includes electrical equipment which contains circuits that are intrinsically safe only under certain conditions, for example under battery supply with mains supply removed.<br/>
    This document is also applicable to electrical equipment or parts of electrical equipment located outside the explosive atmosphere or protected by another Type of Protection listed in IEC 60079 0, where the intrinsic safety of the electrical circuits in the explosive atmosphere may depend upon the design and construction of such electrical equipment or parts of such electrical equipment. The electrical circuits exposed to the explosive atmosphere are assessed for use in such atmospheres by applying this document.<br/>
    This document applies to sensors connected to intrinsically safe circuits but does not apply to the protection of catalytic elements for Group IIC or Group IIB + H2.<br/>
    This document does not apply to Ex Equipment cable glands.<br/>
    The requirements for intrinsically safe systems are provided in IEC 60079-25.<br/>
    This document supplements and modifies the general requirements of IEC 60079-0, except as indicated in Table 1. Where a requirement of this document conflicts with a requirement of IEC 60079-0, the requirement of this document takes precedence.<br/>
    Unless otherwise stated, the requirements in this document are applicable to both intrinsically safe apparatus and associated apparatus, and the generic term "apparatus" is used throughout the standard.<br/>
    As this document applies only to electrical equipment, the term "equipment" used in the standard always means "electrical equipment".<br/>
    This document applies to apparatus for use under the atmospheric conditions of IEC 60079 0 with additional requirements for use at extended atmospheric pressures in the range from 60 kPa (0,6 bar), up to 110 kPa (1,1 bar).<br/>
    This seventh edition cancels and replaces the sixth edition published in 2011. This edition constitutes a technical revision.<br/>
    The identification and significance of the changes between IEC 60079-11, Edition 7 (2022) and IEC 60079-11, Edition 6 (2011 + Corrigendum 1 (2012)) can be found in the table of changes in the foreword of the publication.<br/>
    The contents of the corrigendum of June 2023 have been included in this copy.
- language: fr
  script: Latn
  content: |-
    IEC 60079-11:2023 spécifie la construction et les essais pour le matériel électrique de sécurité intrinsèque destiné à être utilisé dans les atmosphères explosives et pour le matériel électrique associé destiné à être relié à des circuits de sécurité intrinsèque qui entrent dans de telles atmosphères.<br/>
    Ce mode de protection s’applique à l’appareil électrique dont les circuits électriques sont eux mêmes incapables de provoquer une inflammation dans l’atmosphère explosive environnante. Il inclut l’appareil électrique qui contient des circuits qui sont de sécurité intrinsèque uniquement dans certaines conditions, par exemple alimentés par batterie et alimentation réseau coupée.<br/>
    Le présent document s’applique également à l’appareil électrique ou aux parties d’appareil électrique situés hors de l’atmosphère explosive ou protégés par un autre mode de protection cité dans l’IEC 60079 0, si la sécurité intrinsèque des circuits électriques situés dans l’atmosphère explosive peut dépendre de la conception et de la construction de cet appareil électrique ou de ces parties d’appareil électrique. Les circuits électriques exposés à une atmosphère explosive sont évalués en vue de leur emploi dans de telles atmosphères en appliquant le présent document.<br/>
    Le présent document s’applique aux capteurs reliés à des circuits de sécurité intrinsèque, mais elle ne s’applique pas à la protection d’éléments catalytiques pour le Groupe IIC ou le Groupe IIB + H2.<br/>
    Le présent document ne s’applique pas aux entrées de câbles d’appareils Ex.<br/>
    Les exigences pour les circuits de sécurité intrinsèque sont fournies dans l’IEC 60079-25.<br/>
    Le présent document complète et modifie les exigences générales de l’IEC 60079-0. Si une exigence du présent document entre en conflit avec une exigence de l’IEC 60079-0, l’exigence du présent document prévaut.<br/>
    Sauf indication contraire, les exigences du présent document s’appliquent au matériel de sécurité intrinsèque et au matériel associé, et le terme générique "matériel" est utilisé dans toute la norme.<br/>
    Comme le présent document s’applique uniquement à l’appareil électrique, le terme "appareil" utilisé dans la norme signifie toujours "appareil électrique".<br/>
    Le présent document s’applique au matériel à utiliser dans les conditions atmosphériques de l’IEC 60079 0 avec les exigences supplémentaires pour son utilisation à des pressions atmosphériques supérieures comprises entre 60 kPa (0,6 bar) et 110 kPa (1,1 bar).<br/>
    <br/>
    Cette septième édition annule et remplace la sixième édition parue en 2011. Cette édition constitue une révision technique<br/>
    L'identification et la signification des changements entre la CEI 60079-11, Édition 7 (2022) et la CEI 60079-11, Édition 6 (2011 + Corrigendum 1 (2012)) peuvent être trouvées dans le tableau des modifications dans l'avant-propos de la publication
