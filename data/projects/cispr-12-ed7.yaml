abstract:
- language: en
  script: Latn
  content: |-
    CISPR 12: 2018 The limits in this International Standard are designed to provide protection for off-board receivers in the frequency range of 30 MHz to 1 000 MHz when used in the residential environment. Compliance with this document may not provide adequate protection for receivers used in the residential environment nearer than 10 m to the vehicle, boat or device. It also may not provide adequate protection for new types of radio transmissions. This document applies to the emission of electromagnetic energy that can cause interference to radio reception and which is emitted from:<br/>
    a) vehicles propelled by an internal combustion engine, electrical means or both (see 3.31);<br/>
    b) boats propelled by an internal combustion engine, electrical means or both (see 3.4). Boats are tested in the same manner as vehicles except where they have unique characteristics as explicitly stated in this document;<br/>
    c) devices equipped with internal combustion engines (see 3.8). In the case of hybrid devices (e.g. equipped with both internal combustion engine and traction batteries), only the internal combustion mode is included in this document.<br/>
    Annex F provides a flow chart to help determine the applicability of CISPR 12.<br/>
    This seventh edition cancels and replaces the sixth edition published in 2007 and Amendment 1:2009. This edition constitutes a technical revision. This edition includes the following significant technical changes with respect to the previous edition:<br/>
    a) test setups for electric vehicles and plug-in hybrid electric vehicles in charging mode were added;<br/>
    b) antenna positions relative to the vehicle were defined;<br/>
    c) some statements dealing with series surveillance and type approval were deleted;<br/>
    d) annexes for measurement instrumentation uncertainty were added;<br/>
    e) an annex describing networks to be used for the charging mode was added; and<br/>
    f) general improvements were made.<br/>
    <br/>
    Keywords: interference to radio reception, protection for radio reception
- language: fr
  script: Latn
  content: |-
    CISPR 12: 2018 Les limites données dans la présente Norme internationale sont prévues pour assurer la protection des récepteurs extérieurs dans la plage de fréquences de 30 MHz à 1 000 MHz utilisés dans un environnement résidentiel. La conformité au présent document peut ne pas fournir une protection adéquate pour les récepteurs utilisés dans un environnement résidentiel à moins de 10 m d'un véhicule, d’un bateau ou d'un engin. Elle peut également ne pas fournir une protection adéquate pour les nouveaux types d’émissions radioélectriques. Le présent document concerne le rayonnement d'énergie électromagnétique qui peut brouiller la réception des radiocommunications et qui est produit par:<br/>
    a) des véhicules entraînés par un moteur à combustion interne et/ou par des moyens électriques (voir 3.31);<br/>
    b) des bateaux entraînés par un moteur à combustion interne et/ou par des moyens électriques (voir 3.4). Les bateaux sont soumis à essai de la même manière que les véhicules, excepté lorsqu'ils ont des caractéristiques particulières telles qu'elles sont explicitement fixées dans le présent document;<br/>
    c) des engins équipés de moteurs à combustion interne (voir 3.8). Dans le cas des engins hybrides (équipés d'un moteur à combustion interne et de batteries de traction, par exemple), seul le mode de combustion interne est inclus dans le présent document.<br/>
    L'Annexe F fournit un diagramme pour aider à déterminer l’applicabilité de la CISPR 12.<br/>
    <br/>
    Cette septième édition annule et remplace la sixième édition parue en 2007 et l'Amendement 1:2009. Cette édition constitue une révision technique.<br/>
    Cette édition inclut les modifications techniques majeures suivantes par rapport à l'édition précédente:<br/>
    a) des montages d'essai de véhicules électriques et de véhicules électriques hybrides rechargeables en mode de chargement ont été ajoutés;<br/>
    b) des positions d'antenne par rapport au véhicule ont été définies;<br/>
    c) certaines déclarations relatives à la surveillance en série et à l'homologation ont été supprimées;<br/>
    d) des annexes relatives à l'incertitude des appareils de mesure ont été ajoutées;<br/>
    e) une annexe décrivant les réseaux à utiliser pour le mode de chargement a été ajoutée; et<br/>
    f) des améliorations générales ont été apportées.<br/>
    <br/>
    Mots clés : brouiller la réception des radiocommunications, protection des récepteurs extérieurs
