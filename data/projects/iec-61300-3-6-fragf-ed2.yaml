abstract:
- language: en
  script: Latn
  content: Presents procedures for the measurement of the return loss (RL) of a fibre optic device under test (DUT). RL, as used in this standard, is the ratio of the power (Pi) incident on, or entering, the DUT to the total power reflected (Pr) by the DUT, expressed in decibels.
