abstract:
- language: en
  script: Latn
  content: |-
    IEC 61892-1:2026 is applicable to electrical installations and equipment in mobile and fixed offshore units, including floating units, pipeline, pumping or "pigging" stations, compressor stations and single buoy moorings, used in the offshore industry for drilling, production, accommodation, processing, storage and offloading purposes.<br/>
    It applies to all installations, whether permanent, temporary, transportable or hand-held, to AC installations and DC installations without any voltage level limitation. It is possible that referenced equipment standards give voltage level limitations.<br/>
    This fifth edition cancels and replaces the fourth edition published in 2019. This edition constitutes a technical revision.<br/>
    This edition includes the following significant technical changes with respect to the previous edition:<br/>
    a) addition of floating units in Scope;<br/>
    b) minor updates in Normative references and Terms and definitions;<br/>
    c) minor modifications to 4.14.2 - Emergency shutdown (ESD) system;<br/>
    d) minor modifications to 4.14.4 - Manual electrical disconnection;<br/>
    e) minor modifications to Table 5 - Degree of ingress protection of equipment;<br/>
    f) addition of new informative Annex D - A typical ESD hierarchy structure for a fixed production and drilling unit.
