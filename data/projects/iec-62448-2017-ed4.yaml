abstract:
- language: en
  script: Latn
  content: |-
    IEC 62448:2017 specifies a generic format for multimedia e-publishing employed for e-book data interchange among data preparers and publishers, satisfying a number of publishers’ requirements: revisable, extensible and heterogeneous logical structure. This fourth edition cancels and replaces the third edition, published in 2013 and constitutes a technical revision. This edition includes the following significant technical changes with respect to the previous edition:<br/>
    a) clarifying descriptions;<br/>
    b) deleting redundant statements;<br/>
    c) resolving mistakes and confusing terminologies.
