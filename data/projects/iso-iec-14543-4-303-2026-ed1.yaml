abstract:
- language: en
  script: Latn
  content: ISO/IEC 14543-4-303:2026 specifies an application-layer protocol important for ensuring interoperability among the products of various manufacturers regarding communications between electric vehicle supply equipment (EVSE) chargers and controllers. It uses the network enhanced communications device (NECD) protocol specified in ISO/IEC 14543-4-3. This protocol is based on UDP using IPv4 or IPv6 (TCP is optional).
