abstract:
- language: en
  script: Latn
  content: |-
    Is a functional profile (FP) and defines the provision of the TASE.2 communications services between two control centre end systems. This FP also defines the provision of the OSI connection-mode presentation and session services between the end systems.
    <br /><br />This publication is of high relevance for Smart Grid</a>.
- language: fr
  script: Latn
  content: |-
    Est un profil fonctionnel (PF) et définit la prestation des services de communication TASE.2 entre deux systèmes finals d'un 
    centre de conduite. Ce PF définit également la prestation de services de présentation et de session en mode connexion OSI entre les systèmes finals.
