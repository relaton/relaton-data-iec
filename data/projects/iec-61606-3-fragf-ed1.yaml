abstract:
- language: fr
  script: Latn
  content: La CEI 61606-3:2008 s'applique aux méthodes fondamentales pour la mesure des équipements audio à usage professionnel. Les définitions, les conditions et les méthodes de mesure communes aux équipements grand public et professionnels sont décrites dans la CEI 61606-1. Cette norme contient des détails relatifs aux définitions et aux conditions et méthodes de mesure applicables aux équipements professionnels qui sont différentes de celles décrites dans la CEI 61606-1.
