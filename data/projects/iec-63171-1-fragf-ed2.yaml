abstract:
- language: en
  script: Latn
  content: |-
    This part of IEC 63171 covers two-way, shielded or unshielded, free and fixed connectors known as Type 1, for balanced single-pair data transmission with frequencies up to 600 MHz and with current carrying capacity up to 2,0 A at 60 °C.<br/>
    <br/>
    It specifies the common dimensions, and provides the mechanical, electrical, signal integrity, and environmental characteristics, the reliability specifications and corresponding tests for these connectors.
- language: fr
  script: Latn
  content: |-
    La présente partie de l’IEC 63171 couvre les connecteurs bidirectionnels, écrantés ou non écrantés, de type fiche et embase, désignés Type 1, pour la transmission de données sur une paire symétrique unique, à des fréquences jusqu’à 600 MHz (et avec un courant admissible pouvant atteindre 2,0 A à 60 °C).<br/>
    <br/>
    Elle spécifie les dimensions communes et fournit les caractéristiques mécaniques, électriques, d’intégrité du signal et d’environnement, les spécifications de fiabilité et les essais correspondants pour ces connecteurs.
