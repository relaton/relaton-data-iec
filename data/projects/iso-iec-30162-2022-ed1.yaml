abstract:
- language: en
  script: Latn
  content: |-
    ISO/IEC 30162:2022 specifies network models for IIoT connectivity and general compatibility requirements for devices and networks within IIoT systems in terms of:<br/>
    a) data transmission protocols interaction;<br/>
    b) distributed data interoperability &amp; management;<br/>
    c) connectivity framework;<br/>
    d) connectivity transport;<br/>
    e) connectivity network;<br/>
    f) best practices and guidance to use in IIoT area.
