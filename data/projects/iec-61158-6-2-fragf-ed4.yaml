abstract:
- language: en
  script: Latn
  content: |-
    IEC 61158-6-2:2019 provides common elements for basic time-critical and non-time-critical messaging communications between application programs in an automation environment and material specific to Type 2 fieldbus. The term “time-critical” is used to represent the presence of a time-window, within which one or more specified actions are required to be completed with some defined level of certainty. Failure to complete specified actions within the time window risks failure of the applications requesting the actions, with attendant risk to equipment, plant and possibly human life.<br/>
    This International Standard specifies interactions between remote applications and defines the externally visible behavior provided by the Type 2 fieldbus application layer in terms of<br/>
    a) the formal abstract syntax defining the application layer protocol data units conveyed between communicating application entities;<br/>
    b) the transfer syntax defining encoding rules that are applied to the application layer protocol data units;<br/>
    c) the application context state machine defining the application service behavior visible between communicating application entities;<br/>
    d) the application relationship state machines defining the communication behavior visible between communicating application entities.
- language: fr
  script: Latn
  content: |-
    L’IEC 61158-6-2:2019 (FR) fournit des éléments communs pour les communications à temps critique ou non entre des programmes d'application dans un environnement et avec un matériel d'automation spécifiques aux bus de terrain de type 2. Le terme "à temps critique" signale l'existence d'une fenêtre temporelle dans laquelle est exigée la réalisation d'une ou de plusieurs actions spécifiées, avec un niveau de certitude défini. La non-réalisation des actions spécifiées dans la fenêtre temporelle induit un risque de défaillance des applications qui demandent ces actions, avec les risques relatifs à l'équipement, les installations et éventuellement la vie humaine.<br/>
    Le présent document spécifie les interactions entre les applications distantes et définit le comportement, visible par un observateur externe, assuré par la couche application de bus de terrain de type 2, en termes<br/>
    a) de syntaxe abstraite formelle définissant les unités de données de protocole de couche application, acheminées entre les entités d'application en communication;<br/>
    b) de syntaxe de transfert définissant les règles de codage qui s'appliquent aux unités de données de protocole de couche application;<br/>
    c) du diagramme d'états de contexte application définissant le comportement de service application visible entre des entités d'application engagées dans une communication;<br/>
    d) de diagrammes d'états de relations d'applications définissant le comportement de communication visible entre les entités d'application en communication.
