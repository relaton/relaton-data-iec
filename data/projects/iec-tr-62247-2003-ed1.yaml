abstract:
- language: en
  script: Latn
  content: Is a technical report presenting information concerning the use of IEC 60964 and feedback from designers, safety authorities and vendors. Includes recommendations to improve IEC 60964 (1989). To be used in conjunction with IEC 60964 which is the main IEC standard for the design of main control rooms of nuclear power plants.
- language: fr
  script: Latn
  content: Est un rapport technique qui présente des informations concernant l'utilisation de la CEI 60964 et le retour d'expérience de la part des concepteurs, autorités de sûreté et fournisseurs. Inclut des recommandations pour améliorer la CEI 60964 (1989). La CEI 60964 est la principale norme CEI pour la conception des salles de commande des centrales nucléaires de puissance.
