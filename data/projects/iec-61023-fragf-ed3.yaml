abstract:
- language: fr
  script: Latn
  content: |-
    L'IEC 61023:2007 spécifie les exigences de fonctionnement minimales, les méthodes d'essai et les résultats d'essai exigés des appareils d'indication de la vitesse et de la distance instruments de mesure de la vitesse et de la distance (Lochs) requis par la Règle 19 du Chapitre V de la Convention internationale pour la sauvegarde de la vie humaine en mer (SOLAS - International Convention for Safety of Life at Sea), 1974, dans sa version modifiée et qui est associée à la norme IEC 60945. Cette troisième édition annule et remplace la seconde édition parue en 1999 et constitue une révision technique. 
    Les principales modifications apportées à l'édition précédente sont les suivantes:<br/>
    - amendements résultant de modifications des normes de performance OMI relatives aux instruments de mesure de la vitesse et de la distance pour navires (Lochs) définis en 2000 dans la résolution MSC.96(72). Ces amendements réduisent à 2 m la profondeur minimale de l'eau sous la quille de l'équipement par rapport au fond afin d'assurer le bon fonctionnement des instruments de mesure de la vitesse et de la distance pour navires (Lochs), réduisent la précision requise des écrans analogiques et ajoutent une exigence relative à une interface série.
