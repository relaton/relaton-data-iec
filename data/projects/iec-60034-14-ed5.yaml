abstract:
- language: en
  script: Latn
  content: |-
    IEC 60034-15: 2026 specifies the factory acceptance vibration test procedures and vibration limits for certain electrical machines under specified conditions, when uncoupled from any load or prime mover. It is applicable to DC and three-phase AC machines, with shaft heights 56 mm and higher and a rated output up to 50 MW, at operational speeds from 120 min–1 up to and including 15 000 min–1. This document is not applicable to machines mounted in situ (on site), three-phase commutator motors, single-phase machines, three-phase machines operated on single-phase systems, vertical waterpower generators, turbine generators greater than 20 MW and machines with magnetic bearings or series-wound machines.<br/>
    NOTE 1 For machines measured in situ, refer to applicable clauses or subclauses of ISO 20816‑1 and ISO 20816‑3.<br/>
    NOTE 2 For output power above 50 MW reference is made to the ISO 20816 series.<br/>
    NOTE 3 Vibration routine tests are not mandatory according to IEC 60034‑1. If performed, the method for testing is included in this document.<br/>
    This fifth edition cancels and replaces the fourth edition published in 2018. This edition constitutes a technical revision. This edition includes the following significant technical changes with respect to the previous edition:<br/>
    a) subclause 6.3.3 Vertical machines: added two new subclauses: Type and routine tests;<br/>
    b) subclause 7.3 Test conditions: added two new subclauses: Direct-on-line and variable speed;<br/>
    c) Table 1: decreased limits for Grade A in free suspension for 56 ≤ H ≤ 132 mm;<br/>
    d) Clause 9 Limits of relative shaft vibration: added information how to mitigate effects of run-out on shaft vibration measurements.
