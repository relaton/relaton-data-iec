abstract:
- language: fr
  script: Latn
  content: |-
    L'IEC 62329-1:2005 s'applique aux profilés thermorétractables dans une gamme de configurations et de matériaux adaptés à l'isolement, aux éléments d'étanchéité contre les intempéries, à la protection mécanique, aux dispositifs anti-traction pour connecteurs/extrémités de câbles et aux transitions à conducteurs multiples. Elle spécifie la conception et les dimensions, les méthodes d'essai, les exigences sur les matériaux et les caractéristiques de compatibilité. Les profilés les plus courants sont présentés à l'Annexe A.
    Mots clés: profilés thermorétractables
