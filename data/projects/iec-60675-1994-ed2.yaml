abstract:
- language: en
  script: Latn
  content: Applies to electric direct-acting room heaters. They may be portable, stationary, fixed or built-in. It defines the main performance characteristics and the methods for measuring these characteristics. For thermal-storage room heaters, see IEC 60531.
- language: fr
  script: Latn
  content: S'applique aux appareils électriques de chauffage des locaux à action directe. Ils peuvent être mobiles, fixes, installés à poste fixe ou encastrés. Définit les principales caractéristiques d'aptitude à la fonction et méthodes pour la vérification de ces caractéristiques. Pour les appareils de chauffage des locaux à accumulation, voir CEI 60531.
