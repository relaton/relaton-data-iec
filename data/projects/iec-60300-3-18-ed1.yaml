abstract:
- language: en
  script: Latn
  content: |-
    IEC 60300-3-18:2026 gives guidance on managing reliability and reliability activities that are applicable throughout the life cycle of an item and to any organization.<br/>
    This part of the IEC 60300 series provides guidance to managers and technical personnel involved in the specification, design, development, manufacture, acceptance, use of an item and the item support services.<br/>
    This document describes:<br/>
    - the principles of reliability;<br/>
    - the benefits of reliability;<br/>
    - the elements of reliability programmes;<br/>
    - the specification of reliability;<br/>
    - the measurement, analysis and assurance of reliability;<br/>
    - reliability data, reliability documentation and their control.<br/>
    The ability to retain the reliability of an item is not only dependent upon the design itself but also on the design and management of its associated maintenance (IEC 60300‑3‑10) and support (IEC 60300‑3‑14) programmes. The interaction between reliability activities and the maintainability and supportability activities are discussed within this document.
