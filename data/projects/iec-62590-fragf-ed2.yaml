abstract:
- language: en
  script: Latn
  content: |-
    This second edition cancels and replaces the first edition published in 2010. This edition constitutes a technical revision.<br/>
    This edition includes the following significant technical changes with respect to the previous edition:<br/>
    a) Incorporation of DC converters.<br/>
    b) Correction of the clearances and withstand voltages due to erroneous use of PD in former edition.<br/>
    c) Adaption to current ISO/IEC directive part 2, adaption of structure, adaption of vocabulary, removal of unused term and abbreviations.<br/>
    <br/>
    This document specifies the requirements for the performance of all fixed installations electronic power converters, using controllable and/or non-controllable electronic valves, intended for traction power supply.<br/>
    The devices can be controlled by means of current, voltage or light. Non-bistable devices are assumed to be operated in the switched mode.<br/>
    <br/>
    This document applies to fixed installations of the following electric traction systems:<br/>
    • railways,<br/>
    • guided mass transport systems such as: tramways, light rail systems, elevated and underground railways, mountain railways, trolleybusses.<br/>
    This document does not apply to:<br/>
    • cranes, transportable platforms and similar transportation equipment on rails,<br/>
    • suspended cable cars,<br/>
    • funicular railways.<br/>
    <br/>
    This document applies to diode rectifiers, controlled rectifiers, DC converters, inverters and frequency converters.<br/>
    The equipment covered in this document is the converter itself.
- language: fr
  script: Latn
  content: |-
    Cette deuxième édition annule et remplace la première édition publiée en 2010. Cette édition constitue une révision technique.<br/>
    Cette édition inclut également les modifications techniques majeures suivantes par rapport à l'édition précédente :<br/>
    a) Inclusion des convertisseurs continu/continu<br/>
    b) Correction des distances d'isolement et tensions de tenue suite à l’utilisation erronée de PD dans l’édition précédente<br/>
    c) Adaptation à la directive ISO/IEC actuelle partie 2, adaptation de la structure, adaptation du vocabulaire, suppression des termes et abréviations non utilisés<br/>
    <br/>
    Le présent document spécifie les exigences de performance de tous les convertisseurs électroniques de puissance pour les installations fixes, utilisant des valves électroniques commandables et/ou non commandables et destinées à l'alimentation de traction.<br/>
    <br/>
    Les appareils peuvent être commandés par un courant, une tension ou un feu. Les appareils non bistables fonctionnent, par hypothèse, en mode commuté.<br/>
    <br/>
    Le présent document s'applique aux installations fixes des systèmes de traction électrique suivants :<br/>
    • les chemins de fer ;<br/>
    • les systèmes guidés de transport de masse tels que : tramways, métros légers, chemins de fer aériens et souterrains, chemins de fer de montagne, trolleybus.<br/>
    Le présent document ne s'applique pas aux :<br/>
    • grues, plateformes transportables et autres matériels de transport similaires sur rails ;<br/>
    • téléphériques, télécabines,<br/>
    • funiculaires.<br/>
    <br/>
    Le présent document s'applique aux redresseurs à diodes, redresseurs commandés, convertisseurs continu/continu, onduleurs et convertisseurs de fréquence.<br/>
    L'équipement traité dans le présent document est le convertisseur même.
