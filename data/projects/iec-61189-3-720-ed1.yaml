abstract:
- language: en
  script: Latn
  content: IEC 61189-3-720 ED1 specifies the S parameter test method for the internal transmission circuit of a multilayer circuit board (CB) for high frequency up to 50 GHz. The transmission loss test method that applies the via in pad plated over (VIPPO) structure to the CB surface contributes to improving the signal loss measurement precision and signal integrity of the internal transmission circuit of the high frequency CB. In addition, the use of back-drilling with VIPPO structure can eliminate influence of stubs on signal transmission.
