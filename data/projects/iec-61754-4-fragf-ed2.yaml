abstract:
- language: fr
  script: Latn
  content: |-
    IEC 61754-4:2013 définit les dimensions des interfaces normalisées pour la famille des connecteurs de type SC. La présente deuxième édition annule et remplace la première édition publiée en 1997 et constitue une révision technique. La présente édition contient les modifications techniques majeures suivantes par rapport à l'édition précédente:<br/>
    - ajout de l'interface des fiches et des raccords duplex;<br/>
    - réexamen de l'ensemble du contenu de la norme. Le contenu du corrigendum de janvier 2014 a été inclut dans la présente version.
    Mots clés: dimensions des interfaces normalisées pour la famille des connecteurs de type SC
