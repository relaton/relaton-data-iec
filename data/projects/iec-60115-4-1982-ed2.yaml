abstract:
- language: fr
  script: Latn
  content: |-
    S'applique aux résistances fixes de dissipation supérieure à 1 W et
    inférieure à 1 000 W, pourvues d'un revêtement protecteur. Prescrit
    les valeurs préférentielles de caractéristiques. Choisit, dans la
    CEI 115-1, les procédures d'assurance de la qualité et les méthodes
    d'essai et de mesure appropriées. Fixe les exigences générales.
