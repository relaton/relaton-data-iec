abstract:
- language: fr
  script: Latn
  content: La CEI 62071-3:2005 définit le format de la suite de données pour l'échange synchrone d'audio, de données et de vidéo compressée au format vidéonumérique (dont la structure de données est définie dans la SMPTE 314M) par l'interface définie dans la SMPTE 305M. Elle traite de la transmission de paquets audio, de données de code auxiliaire et de vidéo compressée en association avec des structures au format DV (vidéonumérique) à 25 Mb/s et 50 Mb/s, notamment de la transmission plus rapide qu'en temps réel pour les systèmes SDTI 525/60 et SDTI 625/50. La présente version bilingue (2013-07) correspond à la version anglaise monolingue publiée en 2005-10.
