abstract:
- language: fr
  script: Latn
  content: La CEI 61784-3-6:2007 spécifie une couche de communication relative à la sécurité (services et protocole) fondée sur la CPF 6 de la CEI 61784-1, la CEI 61784-2 et le Type 8 de la CEI 61158. Elle identifie les principes applicables aux communications de sécurité fonctionnelle définies dans la CEI 61784-3, et appropriés à cette couche de communication de sécurité. Elle définit les mécanismes de transmission des messages propres à la sécurité entre les participants d'un réseau réparti, en utilisant la technologie de bus de terrain conformément aux exigences de la CEI 61508 concernant la sécurité fonctionnelle. Ces mécanismes peuvent être utilisés dans diverses applications industrielles, telles que la commande de processus, l'usinage automatique et les machines. La présente version bilingue (2013-07) correspond à la version anglaise monolingue publiée en 2007-12.
