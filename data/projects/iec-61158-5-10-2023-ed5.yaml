abstract:
- language: en
  script: Latn
  content: IEC 61158-5-10:2023 provides common elements for basic time-critical and non-time-critical messaging communications between application programs in an automation environment and material specific to Type 10 fieldbus. The term "time-critical" is used to represent the presence of a time-window, within which one or more specified actions are required to be completed with some defined level of certainty. Failure to complete specified actions within the time window risks failure of the applications requesting the actions, with attendant risk to equipment, plant and possibly human life.
- language: fr
  script: Latn
  content: L’IEC 61158-5-10:2023 constitue l’un des éléments d’une série rédigée pour faciliter l’interconnexion des composants des systèmes d’automatisation. Elle est liée aux autres normes de la série telle que définie par le modèle de référence de bus de terrain "à trois couches" décrit dans l’IEC 61158‑1.
