abstract:
- language: en
  script: Latn
  content: Provides procedures for calibrating single-mode optical time domain reflectometers (OTDR). It only covers OTDR measurement errors and uncertainties. This standard does not cover correction of the OTDR response.
- language: fr
  script: Latn
  content: Fournit des procédures destinées à l'étalonnage des réflectomètres optiques dans le domaine de temps pour fibres unimodales (OTDR). Elle ne traite que des erreurs de mesure et incertitudes de l'OTDR. Cette norme ne couvre pas la correction de la réponse de l'OTDR
