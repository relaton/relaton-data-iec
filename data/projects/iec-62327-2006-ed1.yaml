abstract:
- language: en
  script: Latn
  content: Specifies requirements for hand-held photon spectrometers, in particular for the detectors, the electronic multi-channel analyzers, the identification software, the radionuclide libraries, and the instrument display. Also specifies general characteristics, general test procedures, radiation characteristics, as well as electrical, mechanical, safety, and environmental characteristics.
- language: fr
  script: Latn
  content: Spécifie les exigences pour les spectromètres de photons portables, en particulier pour les détecteurs, les analyseurs électroniques multicanaux, le logiciel d'identification, les bibliothèques de radionucléides et l'écran de l'instrument. De plus, spécifie les caractéristiques générales, les procédures générales d'essai, les caractéristiques de rayonnement, ainsi que les caractéristiques électriques, mécaniques, de sécurité et d'environnement.
