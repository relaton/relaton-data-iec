abstract:
- language: en
  script: Latn
  content: 'IEC 62522:2014 provides a stable and reproducible procedure to calibrate the wavelength and power output of a tuneable laser against reference instrumentation such as optical power meters and optical wavelength meters (including optical frequency meters) that have been previously traceably calibrated. Keywords: calibrate the wavelength and power output of a tuneable laser'
- language: fr
  script: Latn
  content: 'L''IEC 62522:2014 fournit une procédure stable et reproductible pour étalonner la longueur d''onde et la puissance de sortie d''un laser accordable en fonction des instruments de référence tels que des appareils de mesure de la puissance optique et des appareils de mesure de longueur d''onde optique (y compris des fréquencemètres optiques) dont la traçabilité a été préalablement étalonnée. Mots clés: étalonner la longueur d''onde et la puissance de sortie d''un laser accordable'
