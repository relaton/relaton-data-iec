abstract:
- language: en
  script: Latn
  content: |-
    IEC 61300-2-5:2022 determines the ability of the cable attachment element of the device under test (DUT) to withstand torsional loads that can be experienced during installation and normal service. This fourth edition cancels and replaces the third edition published in 2009. This edition constitutes a technical revision. This edition includes the following significant technical changes with respect to the previous edition:<br/>
    - the terms and definitions clause was added;<br/>
    - the procedure description was modified;<br/>
    - new subsections are included in Clause 6 for a better sequence description;<br/>
    - Figure 1 was improved and Figure 2 was updated in text descriptions;<br/>
    - the severity of the test was updated according to the component and operation conditions.
- language: fr
  script: Latn
  content: |-
    L'IEC 61300-2-5:2002 détermine l’aptitude de l’élément de fixation du câble du dispositif en essai (DUT) à résister aux charges de torsion qui peuvent être appliquées pendant l’installation et en service normal. Cette quatrième édition annule et remplace la troisième édition parue en 2009. Cette édition constitue une révision technique. Cette édition inclut les modifications techniques majeures suivantes par rapport à l’édition précédente:<br/>
    - l'article sur les termes et définitions a été ajouté;<br/>
    - la description de la procédure a été modifiée;<br/>
    - de nouveaux paragraphes ont été inclus à l’Article 6 pour améliorer la description de la séquence;<br/>
    - la Figure 1 a été améliorée et les descriptions textuelles de la Figure 2 ont été mises à jour;<br/>
    - la sévérité de l’essai a été mise à jour en fonction du composant et des conditions de fonctionnement.
