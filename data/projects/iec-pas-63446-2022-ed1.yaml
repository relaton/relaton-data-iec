abstract:
- language: en
  script: Latn
  content: |
    IEC PAS 63446:2022, a Publicly Available Specification, provides the method to conservatively evaluate the area averaged electromagnetic (EM) power density entering the human body, i.e. the absorbed power density (APD), for communication devices intended to be used at a position near the human head or body, or mounted on the body, combined with other transmitters within a product, or embedded in garments. The device categories covered include but are not limited to mobile telephones, radio transmitters in personal computers, and desktop and laptop devices. The applicable frequency range is from 6 GHz to 10 GHz.<br/>
    This document specifies:

    	conversion of the psSAR to the psAPD (Clause 6);
    	uncertainty estimation (Clause 7);
    	reporting requirements (Clause 8);
    	methods of validation and system check (Annex C)
