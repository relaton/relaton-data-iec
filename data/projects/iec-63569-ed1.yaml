abstract:
- language: en
  script: Latn
  content: |-
    IEC 63569 ED1 specifies the method for high-level test description table (HTD Table) for development of production test program. High-level test description technology is a test verification technology that takes into account the various operating environments of electronic equipment and systems. It is a technology to effectively deploy the process of test program design and development, which was developed to accurately and efficiently conduct electronic equipment and system tests.<br/>
    The upstream design of a test program for an automated test system (ATS) is a complex process that involves test requirement data, unit under test (UUT) data, diagnostics data, prognostics data, and program development environment. It is the most important process in the verification of system test products. Standardization of the upstream design of test programs is in line with the efficiency requirements of the testing field.
