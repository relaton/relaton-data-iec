abstract:
- language: en
  script: Latn
  content: |-
    IEC 62228-7:2022 specifies test and measurement methods for the EMC evaluation of CXPI transceiver ICs under network condition. It defines test configurations, test conditions, test signals, failure criteria, test procedures, test setups and test boards. This specification is applicable for standard CXPI transceiver ICs and ICs with embedded CXPI transceiver and covers<br/>
    the emission of RF disturbances,<br/>
    the immunity against RF disturbances,<br/>
    the immunity against impulses and<br/>
    the immunity against electrostatic discharges (ESD).
- language: fr
  script: Latn
  content: |-
    L’IEC 62228-7:2022 spécifie les méthodes d’essai et de mesure pour l’évaluation de la compatibilité électromagnétique (CEM) des circuits intégrés émetteurs-récepteurs CXPI placés en réseau. Elle définit les configurations d’essai, les conditions d’essai, les signaux d’essai, les critères de défaillance, les modes opératoires d’essai, les montages d’essai et les cartes d’essai. La présente spécification s’applique aux circuits intégrés émetteurs-récepteurs CXPI standard et aux circuits intégrés avec émetteur-récepteur CXPI intégré, et couvre:<br/>
    l’émission de perturbations radioélectriques;<br/>
    l’immunité aux perturbations radioélectriques;<br/>
    l’immunité aux transitoires électriques;<br/>
    l’immunité aux décharges électrostatiques (DES).
