abstract:
- language: en
  script: Latn
  content: IEC 62053-25:2026 (E) specifies the requirements, associated tests and test conditions for revenue meters with digital inputs, and for electricity metering functions hosted on equipment, operating on sampled values in accordance with IEC 61850-9-2:2011, IEC 61850-9-2:2011/AMD1:2020 and IEC 61869 9:2016. These meters and metering functions are elements in a digital metering chain based on IEC 61850 architecture within the process level. This document applies to static meters of accuracy class 0,01 D for both active and fundamental reactive energy as defined in IEC 62053-24:2020.
