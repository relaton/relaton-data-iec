abstract:
- language: en
  script: Latn
  content: Provides uniform terminology in the forms of diagrams, definitions and equations related to fuel cell technologies in all applications including but not limited to stationary power, transportation, portable power and micro power applications. Is intended as a resource for the Working Groups and users of the IEC 62282 series of fuel cell standards.
- language: fr
  script: Latn
  content: 'Fournit une terminologie standardisée sous forme de schémas, définitions et équations des technologies de piles à combustible dans toutes leurs applications (entre autres: production stationnaire d''électricité, transport, production portable et micro production). Constitue une ressource pour les groupes de travail et utilisateurs de la série de normes CEI 62282 sur les piles à combustible.'
