abstract:
- language: en
  script: Latn
  content: IEC 63068-3:2020 provides definitions and guidance in use of photoluminescence for detecting as-grown defects in commercially available 4H-SiC (Silicon Carbide) epitaxial wafers. Additionally, this document exemplifies photoluminescence images and emission spectra to enable the detection and categorization of the defects in SiC homoepitaxial wafers.
- language: fr
  script: Latn
  content: L’IEC 63068-3:2020 décrit les définitions et les recommandations relatives à l’utilisation de la photoluminescence pour la détection de défauts bruts au sein de plaquettes homoépitaxiales en carbure de silicium (4H-SiC) disponibles dans le commerce. De plus, le présent document donne des exemples d’images de photoluminescence et de spectres d’émission, permettant la détection et la catégorisation des défauts au sein de plaquettes homoépitaxiales en SiC.
