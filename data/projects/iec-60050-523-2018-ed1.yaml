abstract:
- language: en
  script: Latn
  content: |-
    IEC 60050-523:2018 gives the general terminology used for micro-electromechanical devices including the process of production of such devices. This terminology is consistent with the terminology developed in the other specialized parts of the IEV.<br/>
    It has the status of a horizontal standard in accordance with IEC Guide 108.
- language: fr
  script: Latn
  content: |-
    IEC 60050-523:2018 donne la terminologie générale utilisée pour les dispositifs microélectromécaniques en incluant le procédé de production de ces dispositifs. Cette terminologie est en accord avec la terminologie figurant dans les autres parties spécialisées de l'IEV.<br/>
    Elle a le statut de norme horizontale conformément au Guide IEC 108.
