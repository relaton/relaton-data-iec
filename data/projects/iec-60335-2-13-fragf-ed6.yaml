abstract:
- language: fr
  script: Latn
  content: |-
    La CEI 60335-2-13:2009 traite de la sécurité des friteuses ayant une quantité d'huile maximale recommandée ne dépassant pas 5 l, poêles à frire, woks et autres appareils électriques dans lesquels l'huile est utilisée pour la cuisson, destinés uniquement à des usages domestiques et analogues, et dont la tension assignée n'est pas supérieure à 250 V. Par rapport à la cinquième édition de la CEI 60335-2-13, les principales modifications indiquées ci-après ont été apportées dans la présente édition:<br/> 
    - modification du domaine d'application pour traiter des usages domestiques et analogues,<br/>
    - ajout d'instructions supplémentaires pour refléter le contenu du domaine d'application (7.12). <br/>
    L'attention des Comités Nationaux est attirée sur le fait que les fabricants d'appareils et les organismes d'essai peuvent avoir besoin d'une période transitoire après la publication d'une nouvelle publication CEI, ou d'une publication amendée ou révisée, pour fabriquer des produits conformes aux nouvelles exigences et pour adapter leurs équipements aux nouveaux essais ou aux essais révisés. Le comité recommande que le contenu de cette publication soit entériné au niveau national au plus tôt 12 mois et au plus tard 36 mois après la date de publication. La présente partie 2 doit être utilisée conjointement avec la dernière édition de la CEI 60335-1:2006. La présente version bilingue (2013-07) correspond à la version anglaise monolingue publiée en 2009-12.
    Mots-clés : appareils, poêles à frire, friteuses
