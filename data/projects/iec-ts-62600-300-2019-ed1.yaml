abstract:
- language: en
  script: Latn
  content: |-
    IEC TS 62600-300:2019 provides:<br/>
    · A systematic methodology for evaluating the power performance of river current energy converters (RECs) that produce electricity for utility scale and localized grids;<br/>
    · A definition of river energy converter rated capacity and rated water speed;<br/>
    · A methodology for the production of power curves for the river energy converters in consideration; and<br/>
    · A framework for the reporting of results.<br/>
    Exclusions from the scope of this document are as follows:<br/>
    · RECs that provide forms of energy other than electrical energy unless the other form is an intermediary step that is converted into electricity by the river energy converter;<br/>
    · Resource assessment, that will be addressed separately in the River Energy Resource Assessment Technical Specification;<br/>
    · Scaling of any measured or derived results;<br/>
    · Power quality issues;<br/>
    · Any type of performance other than power and energy performance; and<br/>
    · The combined effect of multiple river energy converter arrays.
