  content: 'La CEI 61212-3-3:2006 donne les exigences relatives aux barres industrielles rigides rondes, stratifiées, moulées, à usages électriques, à base de différentes résines et de différents matériaux de renfort. Les modifications principales apportées par rapport à l''édition précédente sont les suivantes: instructions supplémentaires relatives à l''utilisation et à la sécurité de l''application. Reformatage du document pour correspondre au format de document actuel de la CEI. Ajout du Type EP GC 43.'
