abstract:
- language: en
  script: Latn
  content: |-
    IEC 62973-3: 2024 establishes the framework for the electrical interfaces to the train, and the sizing (e.g., capacity, cell number, to meet the requested load profile) and operation of lead acid batteries of the VRLA type for auxiliary power supply systems on rolling stock of railways and complements IEC 62973-1, unless otherwise specified.<br/>
    This document provides guidance and links to standards for the required battery qualification tests procedures and safety measures to be implemented.<br/>
    The cited normative references for lead acid batteries provide multiple requirements and tests applicable for their qualification.<br/>
    In this document, the most appropriate clauses of these cited standards have been selected and adapted as needed to reflect the intended use of these batteries as auxiliary power sources on rolling stock of railways.<br/>
    The battery-specific requirements for subcomponents of battery systems such as containers, charging controls, temperature probes, nameplates and similar are covered in this document as needed.<br/>
    Charging systems are excluded from the scope of this document.
- language: fr
  script: Latn
  content: |-
    IEC 62973-3: 2024 établit le cadre régissant les interfaces électriques avec le train, ainsi que le dimensionnement (par exemple, la capacité ou le numéro d'élément, afin de satisfaire au profil de charge demandé) et l'exploitation des batteries au plomb de type VRLA au sein de systèmes d'alimentation auxiliaire équipant du matériel roulant ferroviaire et, sauf spécification contraire, complète l'IEC 62973-1.<br/>
    Le présent document fournit des préconisations ainsi que des liens vers des normes en ce qui concerne les procédures d'essais de qualification des batteries et les mesures de sécurité à mettre en œuvre.<br/>
    Les références normatives citées relativement aux batteries au plomb spécifient les différentes exigences et les différents essais applicables à leur qualification.<br/>
    Dans le présent document, les articles les plus appropriés des normes citées ont été choisis et adaptés afin qu'ils reflètent l'utilisation prévue de ces batteries en tant que source d'énergie auxiliaire sur du matériel roulant ferroviaire.<br/>
    Les exigences spécifiques aux sous-composants de systèmes de batterie tels que les conteneurs, les régulateurs de charge, les sondes de température, les plaques signalétiques et autres sont couvertes par le présent document le cas échéant.<br/>
    Les systèmes de charge ne relèvent pas du domaine d'application du présent document.
