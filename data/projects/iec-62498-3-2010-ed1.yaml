abstract:
- language: en
  script: Latn
  content: |-
    IEC 62498-3:2010 covers the design and the use of equipment and any portable equipment for signalling and telecommunications systems (including test, measure, monitoring equipment, etc.).

    The contents of the corrigendum of November 2010 have been included in this copy.
- language: fr
  script: Latn
  content: |-
    La CEI 62498-3:2010 couvre la conception et l'utilisation des équipements fixes et de tout équipement portable de signalisation et de télécommunications de l'infrastructure (en incluant les équipements d'essai, de mesure, de surveillance, etc.).

    Le contenu du corrigendum de novembre 2010 a été pris en considération dans cet exemplaire.
