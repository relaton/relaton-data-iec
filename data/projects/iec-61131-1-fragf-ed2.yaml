abstract:
- language: fr
  script: Latn
  content: La CEI 61131-1:2003 s'applique aux automates programmables (AP) et à leurs périphériques associés par exemple, les outils de programmation et de mise au point (PADT), les interfaces homme-machine (HMI), etc. qui sont prévus pour être utilisés comme dispositifs de contrôle et de commande de machines et de processus industriels. Elle donne les définitions des termes utilisés dans la présente norme. Elle identifie les principales caractéristiques fonctionnelles des configurations d'automate programmable. Cette seconde édition annule et remplace la première édition, parue en 1992, dont elle constitue une révision technique. La présente version bilingue (2012-05) correspond à la version anglaise monolingue publiée en 2003-05.
