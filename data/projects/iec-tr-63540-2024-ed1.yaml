abstract:
- language: en
  script: Latn
  content: |-
    IEC TR 63540:2024 provides information on outdoor lighting systems for selected applications. This document provides an overview of configuration, interfaces with other devices, communications, control strategies and characteristics of various outdoor lighting systems with relevant functionalities.<br/>
    Applications selected for inclusion are:<br/>
    - outdoor parking area lighting;<br/>
    - road and street lighting;<br/>
    - pedestrian and cycle pathways lighting.
