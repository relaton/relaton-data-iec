abstract:
- language: en
  script: Latn
  content: The intention of this standard is to establish uniform requirements for the radio disturbance level of the equipment contained in the scope, to fix limits of disturbance, to describe methods of measurement and to standardize operating conditions andinterpretation of results.
- language: fr
  script: Latn
  content: L'objet de cette norme est d'établir des exigences uniformes pour les limites des perturbations radioélectriques des appareils relevant du domaine d'application, de fixer des limites pour le niveau perturbateur, de décrire des méthodes de mesure et de normaliser les conditions de fonctionnement et l'interprétation des résultats.
