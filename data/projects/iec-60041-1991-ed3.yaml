abstract:
- language: en
  script: Latn
  content: IEC 60041:1991 specifies methods for any size and type of impulse or reaction turbine, storage pump or pump turbine. Determines whether the contract guarantees have been fulfilled and deals with the rules governing these tests as well as the methods of computing the results and the content and style of the final report. Replaces IEC 60198 (1966) and IEC 60607 (1978). The contents of the corrigendum of March 1996 have been included in this copy.
- language: fr
  script: Latn
  content: Spécifie les méthodes d'essai applicables à toutes les turbines à action ou à réaction, pompes d'accumulation et pompes turbines, quels que soient leurs dimensions et leur type. Permet de déterminer si les garanties contractuelles sont respectées. Elle fixe les règles de conduite de ces essais ainsi que les méthodes de calcul des résultats, le contenu et le mode de présentation du rapport final. Cette publication remplace les CEI 60198 et 60607. Le contenu du corrigendum de mars 1996 a été pris en considération dans cet exemplaire.
