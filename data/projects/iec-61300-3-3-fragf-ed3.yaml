abstract:
- language: fr
  script: Latn
  content: La CEI 61300-3-3:2009 décrit la procédure destinée à contrôler les modifications d'affaiblissement et/ou de l'affaiblissement de réflexion d'un composant ou d'un dispositif d'interconnexion, lorsqu'il est soumis à un essai d'environnement ou mécanique. Une telle procédure est communément désignée contrôle actif. Dans de nombreux cas, il est plus efficace de contrôler l'affaiblissement et l'affaiblissement de réflexion en même temps. Cette édition constitue une révision mineure. Les modifications par rapport à l'édition précédentes du document sont relatives à la structure du document.
