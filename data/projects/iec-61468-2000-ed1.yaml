abstract:
- language: en
  script: Latn
  content: Applies to in-core neutron detectors and instrumentation, which are designed for purposes important to safety, such as protection, control and information. Gives requirements, recommendations and guidance on selection of the type and characteristics of self powered neutron detectors used in different possible applications.
- language: fr
  script: Latn
  content: 'Est applicable aux détecteurs en-coeur et à l''instrumentation associée, conçus pour des fonctions importantes pour la sûreté: la protection, le contrôle et l''information. Précise les exigences et les recommandations, et donne des conseils pour sélectionner un type de collectrons et les caractéristiques des collectrons pour différentes applications possibles.'
