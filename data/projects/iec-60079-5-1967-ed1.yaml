  script: Latn
  content: Fixe les conditions auxquelles doivent satisfaire à la construction, les enveloppes du matériel électrique et le matériau utilisé pour le remplissage; donne les essais de vérification, la méthode de détermination de la hauteur minimale de sécurité et les marques et indications à porter sur les enveloppes.
