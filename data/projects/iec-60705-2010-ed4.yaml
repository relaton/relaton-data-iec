abstract:
- language: en
  script: Latn
  content: |-
    IEC 60705:2010 applies to microwave ovens for household use. It also applies to combination microwave ovens. This standard defines the main performance characteristics of household microwave ovens which are of interest to the user, and it specifies methods for measuring these characteristics. This fourth edition cancels and replaces the third edition published in 1999, its amendment 1 (2004) and its amendment 2 (2006), and constitutes a technical revision. The main changes from the previous edition are as follows:<br/>
    - the definition of rounding is given in 3.5;<br/>
    - the usable volume and the overall volume are respectively determined in 7.2 and 7.3.
- language: fr
  script: Latn
  content: |-
    La CEI 60705:2010 s'applique aux fours à micro-ondes à usage domestique. Elle s'applique également aux fours à micro-ondes combinés. Cette norme définit les principales caractéristiques d'aptitude à la fonction des fours à micro-ondes à usage domestique qui intéressent les utilisateurs, et spécifie les méthodes de mesure pour évaluer ces caractéristiques. Cette quatrième édition annule et remplace la troisième édition parue en 1999, son amendement 1 (2004) et son amendement 2 (2006); elle constitue une révision technique. Les changements principaux par rapport à l'édition précédente sont les suivants:<br/>
    - le terme "arrondi" est défini en 3.5;<br/>
    - le volume utile et le volume global sont déterminés respectivement en 7.2 et 7.3.
