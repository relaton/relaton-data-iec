abstract:
- language: en
  script: Latn
  content: Deals with the safety of fixed electric immersion heaters intended for installation in a water tank for heating water to temperature below its boiling point. The rated voltage is not more than 250 V for single-phase and 480 V for other appliances.
- language: fr
  script: Latn
  content: Traite de la sécurité des thermoplongeurs électriques installés à poste fixe à usages domestiques et analogues, destinés à être installés dans une cuve pour chauffer de l'eau à une température inférieure à l'ébullition. La tension assignée n'est pas supérieure à 250 V pour les appareils monophasés et à 480 V pour les autres appareils.
