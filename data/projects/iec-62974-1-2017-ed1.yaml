abstract:
- language: en
  script: Latn
  content: |-
    IEC 62974-1:2017 specifies product and performance requirements for devices that fall under the heading of “monitoring and measuring systems used for data collection, gathering and analysis”, for industrial, commercial and similar use rated below or equal to 1 kV AC and 1,5 kV DC.<br/>
    These devices are fixed and are intended to be used indoors as panel-mounted devices, or as modular devices fixed on a DIN rail, or as housing devices fixed on a DIN rail, or as devices fixed by other means inside a cabinet.<br/>
    These devices are used to upload or download information (energy measured on loads, power metering and monitoring data, temperature information…), mainly for energy efficiency purposes. These devices are known as energy servers, energy data loggers, data gateways and I/O data concentrators.
- language: fr
  script: Latn
  content: |-
    L'IEC 62974-1:2017 spécifie les exigences relatives aux produits et aux performances des dispositifs intégrés aux "systèmes de surveillance et de mesure utilisés pour la collecte et l'analyse de données", dans le cadre d'une exploitation industrielle, commerciale et analogue, et présentant des caractéristiques assignées inférieures ou égales à 1 kV en courant alternatif et à 1,5 kV en courant continu.<br/>
    Ces dispositifs sont fixes et sont destinés à une utilisation en intérieur comme les dispositifs montés sur panneau, les dispositifs modulaires fixés sur un rail DIN, les dispositifs en boîtier fixés sur un rail DIN ou les dispositifs fixés par un autre moyen à l'intérieur d'une armoire.<br/>
    Ces dispositifs permettent de charger ou de télécharger des informations (énergie mesurée sur les charges, données de mesure et de surveillance de la puissance, informations relatives à la température…) essentiellement à des fins d'efficacité énergétique. Ces dispositifs sont des serveurs d'énergie, des enregistreurs de données d'énergie, des passerelles de données et des concentrateurs de données d'E/S.
