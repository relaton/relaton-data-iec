  script: Latn
  content: IEC 62868-2-2:2020 specifies the safety requirements for integrated organic light-emitting diode (OLED) modules for use on ripple free DC supplies up to 1000 V or AC supplies up to 1 000 V RMS at 50 Hz or 60Hz.
