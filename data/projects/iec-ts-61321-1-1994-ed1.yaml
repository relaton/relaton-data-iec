abstract:
- language: en
  script: Latn
  content: |-
    Is applicable to devices and to complete measuring systems used for
    the measurement of very-fast front overvoltages generated by
    switching or due to disruptive discharge within gas-insulated
    metal-enclosed substations (GIS).

    This publication has the status of a report.
- language: fr
  script: Latn
  content: |-
    S'applique aux dispositifs et aux systèmes de mesure complets
    utilisés pour la mesure des surtensions à front très raide
    produites par les manoeuvres ou en raison de décharge disruptive
    dans les postes sous enveloppe métallique à isolation gazeuse
    (PSEM).

    Cette publication a le statut d'un rapport.
