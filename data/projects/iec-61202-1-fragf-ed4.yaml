abstract:
- language: en
  script: Latn
  content: |-
    <p class="PARAGRAPH">
    	IEC 61202-1: 2016  applies to isolators used in the field of fibre optics, all exhibiting the following features:<br/>
    	- they are non-reciprocal optical devices, in which each port is either an optical fibre or fibre optic connector;<br/>
    	- they are passive devices containing no opto-electronic or other transducing elements;<br/>
    	- they have two optical ports for directionally transmitting optical power. This fourth edition cancels and replaces the third edition published in 2009. It constitutes a technical revision. This edition includes the following significant technical changes with respect to the previous edition:<br/>
    	- the terms and definitions were reconsidered;<br/>
    	- quality assessment level was deleted from classification;<br/>
    	- the clause numbers of Annexes A and B have been rearranged.<br/>
    	<br/>
    	Keywords: isolators used in the field of fibre optics</p>
    <p class="PARAGRAPH">
    	 </p>
- language: fr
  script: Latn
  content: |-
    <p style="margin: 5pt 0in 10pt;">
    	IEC 61202-1: 2016  s’applique aux isolateurs utilisés dans le domaine fibronique, possédant tous les caractéristiques suivantes: </p>

    	
    		<p style="font-style: normal; font-weight: normal; margin-top: 0in; margin-bottom: 5pt; mso-list: l0 level1 lfo1;">
    			ce sont des dispositifs optiques non réciproques, dans lesquels chaque port est soit une fibre optique soit un connecteur fibronique;</p>
    	
    	
    		<p style="color: rgb(0, 0, 0); font-family: &quot;Arial&quot;,&quot;sans-serif&quot;; font-size: 10pt; font-style: normal; font-weight: normal; margin-top: 0in; margin-bottom: 5pt; mso-list: l0 level1 lfo1;">
    			ce sont des dispositifs passifs qui ne contiennent pas d’éléments optoélectroniques ou d’autres éléments transducteurs;</p>
    	
    	
    		<p style="color: rgb(0, 0, 0); font-family: &quot;Arial&quot;,&quot;sans-serif&quot;; font-size: 10pt; font-style: normal; font-weight: normal; margin-top: 0in; margin-bottom: 5pt; mso-list: l0 level1 lfo1;">
    			ils ont deux ports optiques pour les puissances optiques à émission directionnelle.</p>
    	

    <p style="margin: 5pt 0in 10pt;">
    	Cette quatrième édition annule et remplace la troisième édition parue en 2009. Cette édition constitue une révision technique. Cette édition inclut les modifications techniques majeures suivantes par rapport à l'édition précédente:</p>

    	
    		<p style="font-style: normal; font-weight: normal; margin-top: 0in; margin-bottom: 5pt; mso-list: l1 level1 lfo3; tab-stops: .5in;">
    			les termes et les définitions ont été revus;</p>
    	
    	
    		<p style="color: rgb(0, 0, 0); font-family: &quot;Arial&quot;,&quot;sans-serif&quot;; font-size: 10pt; font-style: normal; font-weight: normal; margin-top: 0in; margin-bottom: 5pt; mso-list: l1 level1 lfo3; tab-stops: .5in;">
    			le niveau d’évaluation de la qualité a été supprimé de la classification;</p>
    	
    	
    		<p style="color: rgb(0, 0, 0); font-family: &quot;Arial&quot;,&quot;sans-serif&quot;; font-size: 10pt; font-style: normal; font-weight: normal; margin-top: 0in; margin-bottom: 5pt; mso-list: l1 level1 lfo3; tab-stops: .5in;">
    			les numéros d'article des Annexes A et B ont été réagencés.</p>
    	

    <p style="margin: 0in 0in 5pt; text-indent: 0in; mso-list: none; tab-stops: .5in;">
    	Mots clés :  isolateurs utilisés dans le domaine fibronique</p>
