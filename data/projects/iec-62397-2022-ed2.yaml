abstract:
- language: en
  script: Latn
  content: |-
    IEC 62397:2022 describes the requirements for resistance temperature detectors (RTDs) suitable for applications in I&amp;C systems important to safety of nuclear power plants. The requirements of RTDs include design, materials, manufacturing, testing, calibration, procurement, and inspection. RTDs used for safety applications in Nuclear Power Plants can be categorized into direct-immersed and thermowell-mounted RTDs.<br/>
    This standard describes the requirements for the design, material selection, procurement, construction, and testing of resistance temperature detectors (RTDs) used in nuclear power plants (NPPs). These RTDs may be used in both the nuclear safety I&amp;C systems and/or in the non-safety-related instrumentation systems.<br/>
    This second edition cancels and replaces the first edition, published in 2007; it also cancels and replaces the first edition of IEC 61224:1993. This edition includes the following significant technical changes with respect to the previous edition.
- language: fr
  script: Latn
  content: |-
    IEC 62397:2022 describes the requirements for resistance temperature detectors (RTDs) suitable for applications in I&amp;C systems important to safety of nuclear power plants. The requirements of RTDs include design, materials, manufacturing, testing, calibration, procurement, and inspection. RTDs used for safety applications in Nuclear Power Plants can be categorized into direct-immersed and thermowell-mounted RTDs.<br/>
    La présente norme décrit les exigences pour la conception, le choix des matériaux, l'approvisionnement, la fabrication et les essais des sondes à résistance (SR) utilisées dans les centrales nucléaires de puissance (CNP). Ces SR peuvent être utilisées dans les systèmes d'instrumentation et de contrôle-commande (systèmes d'I&amp;C) liés à la sûreté nucléaire et/ou dans les systèmes d'instrumentation non liés à la sûreté.<br/>
    Cette deuxième édition annule et remplace la première édition parue en 2007. Elle annule et remplace également la première édition de l'IEC 61224:1993. Cette édition inclut les modifications techniques majeures suivantes par rapport à l'édition précédente.
