abstract:
- language: en
  script: Latn
  content: IEC 60721-2-1:2013 presents classifications of open-air climates in terms of temperature and humidity. It is intended to be used as part of the background material when selecting appropriate temperature and humidity severities for product testing and application. This second edition cancels and replaces the first edition, published in 1982, and constitutes a technical revision. The main changes with respect to the previous edition are in the definitions of climate types.
- language: fr
  script: Latn
  content: La CEI 60721-2-1:2013 présente des classifications de climats à l'air libre d'après la température et l'humidité. Elle est destinée à fournir une partie des informations de base dont on a besoin pour choisir les sévérités appropriées de température et d'humidité en vue d'essais de produits et de leur application. Cette deuxième édition annule et remplace la première édition, publiée en 1982, et constitue une révision technique. Les modifications principales par rapport à l'édition précédente figurent dans les définitions des types de climat des types de climats.
