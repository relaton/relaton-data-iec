abstract:
- language: en
  script: Latn
  content: |-
    IEC 61804-2:2018 specifies FB (function blocks)  by using the result of a harmonization work as regards several elements.<br/>
    a) The device model which defines the components of an IEC 61804-2 conformant device.<br/>
    b) Conceptual specifications of FBs for measurement, actuation and processing. This includes general rules for the essential features to support control, whilst avoiding details which stop innovation as well as specialization for different industrial sectors.<br/>
    c) The electronic device description (EDD) technology, which enables the integration of real product details using the tools of the engineering life cycle.<br/>
    This third edition cancels and replaces the second edition published in 2006 and integrates parts of IEC 61804-1 which was withdrawn in January 2013. This edition constitutes a technical revision.<br/>
    This edition includes the following significant technical changes with respect to the previous edition:<br/>
    a) added command communication mapping in Clause 8;<br/>
    b) moved and reword compatibility level definition from IEC 62804-1 to new Annex B and terms and definitions;<br/>
    c) added proxy concept in new Annex C.
- language: fr
  script: Latn
  content: |-
    L'IEC 61804-2:2018 spécifie les blocs fonctionnels sur la base des résultats d'un travail d'harmonisation concernant plusieurs éléments.<br/>
    a) Le modèle pour un appareil qui définit les composants d'un appareil conforme à l'IEC 61804-2.<br/>
    b) Les spécifications conceptuelles des blocs fonctionnels pour le mesurage, l'activation et le traitement. Ceci inclut des règles générales applicables aux caractéristiques essentielles à l'appui du processus de commande, tout en évitant les informations détaillées qui mettent un terme tant à l'innovation qu'à la spécialisation pour différents secteurs industriels.<br/>
    c) La technologie de description électronique de produit (EDD - electronic device description), qui permet, en utilisant les outils d’ingénierie, l’intégration de produits réels dans les systèmes tout au long du cycle de vie.<br/>
    Cette troisième édition annule et remplace la deuxième édition parue en 2006 et comprend des parties de l’IEC 61804-1, qui a été supprimée en janvier 2013. Cette édition constitue une révision technique.<br/>
    Cette édition inclut les modifications techniques majeures suivantes par rapport à l'édition précédente:<br/>
    a) ajout de la commande mapping avec la communication à l'Article 8;<br/>
    b) déplacement et reformulation de la définition du niveau de compatibilité de l’IEC 62804-1 dans la nouvelle Annexe B et dans les termes et définitions;<br/>
    c) ajout du concept de mandataire dans la nouvelle Annexe C.
