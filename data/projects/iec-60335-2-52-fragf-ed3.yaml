- language: en
  script: Latn
  content: Deals with the safety of electric oral hygiene appliances for households and similar purposes, their rated voltage being not more than 250 V. Examples of appliances covered by this standard are oral irrigators and toothbrushes.
- language: fr
  script: Latn
  content: Traite de la sécurité des appareils d'hygiène buccale électriques pour usages domestiques et analogues, dont la tension assignée n'est pas supérieure à 250 V.  Comme exemples d'appareils couverts par cette norme, on peut citer les jets dentaires et les brosses à dents
