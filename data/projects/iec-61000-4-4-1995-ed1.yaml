abstract:
- language: en
  script: Latn
  content: |-
    Relates to the immunity requirements and test methods for
    electrical and electronic equipment to repetitive electrical fast
    transients. Additionally defines ranges of test levels and
    establishes test procedures. 
    The object of this standard is to establish a common and
    reproducible basis for evaluating the performance of electrical and
    electronic equipment when subjected to repetitive fast transients
    (bursts), on supply, signal and control ports. 
    The test is intended to demonstrate the immunity of electrical and
    electronic equipment when subjected to types of transient
    disturbances such as those originating from switching transients
    (interruption of inductive loads, relay contact bounce, etc.). The
    standard defines:

    - test voltage waveform;

    - range of test levels;

    - test equipment;

    - test set-up;

    - test procedure.
- language: fr
  script: Latn
  content: |-
    Concerne les prescriptions et méthodes d'essai relatives à
    l'immunité des matériels électriques et électroniques, aux
    transitoires rapides répétitifs. Définit en outre des gammes de
    niveaux d'essais et établit les procédures d'essai.
    Cette norme a pour objet d'établir une base commune et
    reproductible pour l'évaluation des performances des matériels
    électriques et électroniques lorsqu'ils sont soumis à des
    transitoires rapides répétitifs (salves), que ce soit sur les accès
    d'alimentation, de signaux ou de commande.
    L'essai est destiné à démontrer l'immunité des matériels
    électriques et électroniques lorsqu'ils sont soumis à des
    perturbations transitoires du type de celles provenant de
    transitoires de commutation (coupure de charges inductives,
    rebondissements de contacts de relais, etc.).
    Cette norme définit:

    - la forme d'onde de l'essai en tension;

    - la gamme des niveaux d'essais;

    - le matériel d'essai;

    - l'installation d'essai;

    - la procédure d'essai.
