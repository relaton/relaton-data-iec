abstract:
- language: en
  script: Latn
  content: |-
    IEC 63116:2026 specifies general requirements for design, installation and maintenance of a lighting system.<br/>
    A lighting system comprises a set of products. Requirements of the products are specified in product standards. For the general requirements of lighting systems, this document prevails.<br/>
    Construction of lighting systems can vary in applications. This document is not intended to provide detailed technical specifications for the construction of lighting systems but to specify requirements in general that are applicable to lighting systems.<br/>
    This document is applicable to outdoor and indoor lighting systems.<br/>
    This document does not cover stage and studio lighting systems.<br/>
    For emergency lighting systems additional requirements can be applicable.<br/>
    This first edition cancels and replaces IEC TS 63116:2021 and Amendment 1:2023. This edition constitutes a technical revision.<br/>
    This edition includes the following significant technical changes with respect to IEC TS 63116:2021:<br/>
    a) clarifying applicability of this document for outdoor and indoor lighting systems in scope;<br/>
    b) reordering of clauses, placing former Clause 11 ʺClassification of lighting systemsʺ as Clause 5, and shifting all other clauses, Clause 5 to Clause 10 one position to Clause 6 to Clause 11;<br/>
    c) renaming Clause 8 ʺInformation securityʺ to ʺInformation security and cybersecurityʺ and amending its contents;<br/>
    d) adding informative Annex A ʺPublished documents for evaluating information security and cybersecurity needsʺ;<br/>
    e) adding the listed publications to the Bibliography;<br/>
    f) shifting the original Annex A to become Annex B.
