abstract:
- language: en
  script: Latn
  content: |-
    IEC 60079-7:2025 (E) specifies the requirements for the design, construction, testing and marking of electrical Ex Equipment and Ex Components with Type of Protection increased safety "e" intended for use in explosive gas atmospheres.<br/>
    Electrical Ex Equipment and Ex Components of Type of Protection increased safety "e" are either:<br/>
    a) Level of Protection "eb" (EPL "Mb" or "Gb"); or<br/>
    b) Level of Protection "ec" (EPL "Gc")<br/>
    Level of Protection "eb" applies to Ex Equipment or Ex Components, including their connections, conductors, windings, lamps, and batteries; but not including semiconductor devices or electrolytic capacitors.<br/>
    The requirements of this document apply to both Levels of Protection unless otherwise stated.<br/>
    For Level of Protection "eb", this document applies to electrical equipment where the rated voltage does not exceed 11 kV ACRMS or DC.<br/>
    For Level of Protection "ec", this document applies to electrical equipment where the rated voltage does not exceed 15 kV ACRMS or DC.<br/>
    This document supplements and modifies the general requirements of IEC 60079-0. Where a requirement of this document conflicts with a requirement of IEC 60079-0, the requirement of this document takes precedence.<br/>
    This sixth edition cancels and replaces the fifth edition published in 2015, and constitutes a technical revision.<br/>
    This edition includes the significant technical changes as described in the table in the foreword of this document.
