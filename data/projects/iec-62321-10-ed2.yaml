abstract:
- language: en
  script: Latn
  content: |-
    IEC 62321-10 ED2 specifies a technique for the determination of polycyclic aromatic hydrocarbons (PAHs) in polymers including rubber of electrotechnical products. These PAHs can especially be found in the plastic and rubber parts of a wide range of consumer articles. They are present as impurities in some of the raw materials used in the production of such articles, in particular in extender oils and in carbon black. They are not added intentionally to the articles and do not perform any specific function as constituents of the plastic or rubber parts.<br/>
    The gas chromatography-mass spectrometry (GC‑MS) test method is suitable for the determination of polycyclic aromatic hydrocarbons (PAHs).<br/>
    This test method has been evaluated for use with plastics and rubbers. This test method has been evaluated for use with high impact polystyrene (HIPS) containing individual PAH less than 0,5 mg/kg and rubbers containing individual PAH ranging from 8 mg/kg to 221 mg/kg.<br/>
    This document is a basic environment horizontal publication focusing on a test method and is primarily intended for use by committees in the preparation of publications within the area of environment in accordance with the principles laid down in IEC Guide 123 [2]. Wherever applicable, it is the responsibility of committees to make use of environment basic publications in the preparation of their environment group and product publications.<br/>
    WARNING – Persons using this document should be familiar with normal laboratory practice. This document does not purport to address all of the safety problems, if any, associated with its use. It is the responsibility of the user to establish appropriate safety and health practices and to ensure compliance with any national regulatory conditions.<br/>
    This edition includes the following significant technical changes with respect to the previous edition:<br/>
    a) The extraction solvent was changed from "DCM (dichloromethane)", which is harmful to the human body internally, to "toluene", which is a relatively safe extraction solvent.
