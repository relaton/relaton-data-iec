abstract:
- language: en
  script: Latn
  content: "IEC 60512-8-3:2018 Lorsque la spécification particulière (de produit) l’exige, la présente partie de l&#x27;IEC 60512 est utilisée pour les essais des connecteurs qui entrent dans le domaine d’application du comité d’études 48 de l&#x27;IEC. Elle peut aussi être utilisée pour des dispositifs similaires, lorsqu’une spécification particulière (de produit) le spécifie.</br>\r\nL’objet de ce document est de détailler une méthode d’essai normalisée pour évaluer la robustesse de l’ergot d’activation d’un mécanisme d’accouplement ou de relâchement de la connexion.</br>\r\nCette deuxième édition annule et remplace la première édition parue en 2011. La présente édition constitue une révision technique.</br>\r\nCette édition inclut les modifications techniques majeures suivantes par rapport à l&#x27;édition précédente: La présente édition reflète l&#x27;IEC 60512-1-101, Spécification particulière cadre et le paragraphe 4.2 (Préparation du spécimen) est amélioré.</br>\r\nMots clés: connecteurs, Essais de charge statique (embases)"
- language: fr
  script: Latn
