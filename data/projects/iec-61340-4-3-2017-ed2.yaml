abstract:
- language: en
  script: Latn
  content: |-
    IEC 61340-4-3:2017 describes a test method for determining the electrical resistance of footwear (shoes, slippers or booties) used in the control of electrostatic potential on people. This document is suitable for use by the manufacturer of footwear as well as the end user. A method for measuring the electrical resistance of footwear alone is described and serves as a qualification test or an acceptance test for new footwear, or as a periodic test of in-use footwear.<br/>
    Although this document does not include requirements for personal safety, footwear used within the scope of this document in all places of work is regulated by the relevant local statutory requirements regarding the health and safety of all persons.<br/>
    Insulating footwear is not included within the scope of this document although the electrical resistance measurement techniques can be applicable.<br/>
    This edition includes the following significant technical changes with respect to the previous edition:<br/>
    a) classification of footwear as electrostatic conductive or electrostatic dissipative has been removed – classification is not specified;<br/>
    b) environmental classes for laboratory testing have been removed – one set of conditions for pre-conditioning, conditioning and testing is specified;<br/>
    c) reference to IEC 61340-2-3 for measuring the resistance of the counter electrode inserted inside footwear has been removed.<br/>
    <p class="PARAGRAPH">
    	<p/></p>
- language: fr
  script: Latn
  content: |-
    L'IEC 61340-4-3:2017 décrit une méthode d'essai employée pour déterminer la résistance électrique des articles chaussants (chaussures, chaussons ou bottillons) utilisés pour la maîtrise du potentiel électrostatique du personnel. Le présent document est utilisable aussi bien par les fabricants de chaussures que par les utilisateurs finaux. Une méthode de mesure de la résistance électrique de la chaussure seule est décrite et sert d'essai de qualification ou d'acceptation pour de nouvelles chaussures, ou d'essai périodique des chaussures en cours d'utilisation.<br/>
    Bien que le présent document ne comporte aucune exigence relative à la sécurité des personnes, l'attention est attirée sur le fait que toutes les parties concernées sont tenues de se conformer aux exigences légales locales relatives à la santé et à la sécurité des personnes à tous les postes de travail où sont utilisées des chaussures relevant du domaine d'application du présent document.<br/>
    Les chaussures isolantes ne sont pas incluses dans le domaine d'application du présent document, bien que les techniques de mesure de la résistance électrique puissent leur être appliquées.<br/>
    Cette édition inclut les modifications techniques majeures suivantes par rapport à l'édition précédente:<br/>
    a) la classification des chaussures comme électrostatiquement conductrices ou dissipatrices a été supprimée; elle n'est pas spécifiée;<br/>
    b) les classes d'environnement pour les essais en laboratoire ont été supprimées; un seul ensemble de conditions pour le préconditionnement, le conditionnement et les essais est spécifié;<br/>
    c) la référence à l'IEC 61340-2-3 pour mesurer la résistance de la contre-électrode insérée à l'intérieur de la chaussure a été supprimée.
