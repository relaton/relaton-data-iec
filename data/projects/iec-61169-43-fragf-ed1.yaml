abstract:
- language: fr
  script: Latn
  content: La CEI 61169-43:2013, qui est une spécification intermédiaire, fournit des informations et des règles en vue de l'établissement de spécifications particulières (SP) de connecteurs coaxiaux RF de série RBMA d'une impédance de 50 &Omega;, doté d'un couplage fileté et d'une limite de fréquence de fonctionnement de 12,4 GHz, utilisés dans les domaines des appareils communiquant sans fil, en hyperfréquences, de télécommunications, ainsi que dans d'autres domaines, permettant la connexion avec des câbles RF ou des micro-rubans. Elle prescrit également les dimensions des éléments d'accouplement pour des connecteurs d'usage général - classe 2, les détails dimensionnels des connecteurs d essai normalisés - classe 0, les informations concernant les calibres et les essais choisis dans la CEI 61169-1 applicables à toutes les spécifications particulières ayant trait aux connecteurs de la série RBMA. La présente spécification indique les caractéristiques de performance recommandées à prendre en compte pour la rédaction d'une spécification particulière, et elle couvre les programmes d'essais et les exigences de contrôle pour les niveaux d'assurance de qualité M et H (voir Tableaux 8 et 9).
