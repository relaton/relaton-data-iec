abstract:
- language: en
  script: Latn
  content: |-
    IEC 60335-2-90:2015 deals with:<br/>
    - the safety of microwave ovens with a cavity door intended for commercial use, their rated voltage being not more than 250 V for single-phase appliances connected between one phase and neutral and 480 V for other appliances;<br/>
    - the safety of combination microwave ovens with a cavity door, the requirements for which are contained in Annex AA;<br/>
    - the safety of microwave ovens without a cavity door and with transportation means that are intended for commercial use only, for the heating of food and beverages, the requirements for which are contained in Annex BB.<br/>
    Microwave ovens covered by Annex BB have transportation means for moving the load through the microwave oven. Requirements for tunnel microwave ovens and several types of microwave vending machines are covered.<br/>
    This standard also deals with microwave ovens intended to be used on board ships, for which Annex EE is applicable.<br/>
    In Annex BB, a microwave oven without a cavity door and with transportation means is described as a microwave oven. All clauses of this standard apply to these appliances unless otherwise specified in Annex BB.<br/>
    This international standard also takes into account ordinary persons having access to the removing area of the vending machine.<br/>
    The appliance may be built into a vending machine, in which case IEC 60335-2-75 may also be applicable.<br/>
    Appliances that use non-electrical energy are within the scope of this standard.<br/>
    In general, this standard does not take into account<br/>
    - the use of appliances by young children or infirm persons without supervision;<br/>
    - playing with the appliance by young children.<br/>
    This international standard does not take into account the use of a microwave oven without a cavity door and with transportation means by ordinary persons except in the vicinity of entrance and exit ports.<br/>
    The rationales for particular microwave exposure conditions and measures related to microwave energy being confined by an open structure are in Annex BB.<br/>
    Attention is drawn to the fact that<br/>
    - for appliances intended to be used in vehicles or on board ships or aircraft, additional requirements may be necessary;<br/>
    - for appliances intended to be used in tropical countries, special requirements may be necessary;<br/>
    - in many countries, the national health authorities, the national authorities responsible for the protection of labour and similar authorities specify additional requirements;<br/>
    - in many countries, national authorities specify additional requirements to BB.22.119.1.<br/>
    This standard does not apply to<br/>
    - household microwave ovens including combination microwave ovens (IEC 60335-2-25);<br/>
    - industrial microwave heating equipment (IEC 60519-6);<br/>
    - appliances for medical purposes (IEC 60601);<br/>
    - appliances intended to be used in locations where special conditions prevail, such as the presence of a corrosive or explosive atmosphere (dust, vapour or gas).
- language: fr
  script: Latn
  content: |-
    L'IEC 60335-2-90:2015 traite de la sécurité:<br/>
    - des fours à micro-ondes à usage commercial avec une porte de cavité dont la tension assignée n'est pas supérieure à 250 V pour les appareils monophasés raccordés entre phase et neutre et 480 V pour les autres appareils;<br/>
    - des fours à micro-ondes combinés avec une porte de cavité, dont les exigences sont contenues à l'Annexe AA;<br/>
    - des fours à micro-ondes sans porte de cavité et avec moyen de transport qui sont destinés à un usage commercial uniquement, pour le chauffage des aliments et des boissons, dont les exigences sont contenues à l'Annexe BB.<br/>
    Les fours à micro-ondes couverts par l'Annexe BB comportent un moyen de transport pour déplacer la charge micro-ondes à travers le four à micro-ondes. Les exigences pour les tunnels à micro-ondes et pour plusieurs types de distributeurs à micro-ondes sont couvertes.<br/>
    La présente norme traite également des fours à micro-ondes destinés à être utilisés à bord de navires et pour lesquels l'Annexe EE est applicable.<br/>
    Dans l'Annexe BB, un four à micro-ondes sans porte de cavité et avec moyen de transport est décrit en tant que four à micro-ondes. Tous les articles de cette norme s'appliquent à ces appareils sauf spécification contraire dans l'Annexe BB.<br/>
    La présente Norme internationale prend également en compte les personnes ordinaires ayant accès à la zone de retrait du distributeur automatique.<br/>
    L'appareil peut être construit dans un distributeur automatique, auquel cas l'IEC 60335-2-75 peut aussi s'appliquer.<br/>
    Les appareils qui utilisent une énergie non électrique sont compris dans le domaine d'application de la présente norme.<br/>
    La présente norme ne tient en général pas compte:<br/>
    - de l'utilisation des appareils par de jeunes enfants ou des personnes handicapées sans surveillance;<br/>
    - de l'emploi de l'appareil comme jouet par de jeunes enfants.<br/>
    La présente Norme internationale ne prend pas en compte l'utilisation d'un four à micro-ondes sans porte de cavité et avec moyen de transport par des personnes ordinaires, sauf à proximité des orifices d'entrée et de sortie.<br/>
    Dans l'Annexe BB figurent les justifications pour des conditions particulières d'exposition aux micro-ondes et des mesures liées à l'énergie micro-ondes confinée par une structure ouverte.<br/>
    L'attention est attirée sur le fait que:<br/>
    - pour les appareils destinés à être utilisés dans des véhicules ou à bord de navires ou d'avions, des exigences supplémentaires peuvent être nécessaires;<br/>
    - pour les appareils destinés à être utilisés dans les pays tropicaux, des exigences spéciales peuvent être nécessaires;<br/>
    - dans de nombreux pays, des exigences supplémentaires sont spécifiées par les organismes nationaux de la santé publique, par les organismes nationaux responsables de la protection des travailleurs et par des organismes similaires;<br/>
    - dans de nombreux pays, les organismes nationaux responsables spécifient des exigences supplémentaires à celles de BB.22.119.1.<br/>
    La présente norme ne s'applique pas:<br/>
    - aux fours à micro-ondes à usage domestique, y compris les fours à micro-ondes combinés (IEC 60335-2-25);<br/>
    - au matériel industriel de chauffage à micro-ondes (IEC 60519-6);<br/>
    - aux appareils à but médical (IEC 60601);<br/>
    - aux appareils destinés à être utilisés dans des locaux présentant des conditions particulières, telles que la présence d'une atmosphère corrosive ou explosive (poussière, vapeur ou gaz).<br/>
    Cette quatrième édition annule et remplace la troisième édition parue en 2006, y compris ses Amendements 1 (2010) et 2 (2014). Elle constitue une révision technique.<br/>
    Par rapport à l'édition précédente, les modifications majeures sont les suivantes (les modifications mineures et éditoriales ne sont pas répertoriées):<br/>
    - un énoncé en 7.12 est exigé pour les appareils destinés à un usage sur les véhicules routiers commerciaux;<br/>
    - un énoncé en 7.12 est exigé concernant le nettoyage de l'appareil au jet d'eau;<br/>
    - le remplacement de 22.103, 22.104 et 22.105 autorise les systèmes de verrouillage présentant au moins un verrouillage de porte dissimulé ainsi que d'autres systèmes de verrouillage sans verrouillage de porte dissimulé;<br/>
    - des exigences sont ajoutées pour les appareils destinés à être installés dans des véhicules routiers commerciaux;<br/>
    - une annexe est ajoutée, qui traite des essais individuels de série.<br/>
    La présente Partie 2 doit être utilisée conjointement avec la dernière édition de l'IEC 60335-1 et ses amendements. Elle a été établie sur la base de la quatrième édition (2001) de cette norme.<br/>
    La présente Partie 2 complète ou modifie les articles correspondants de l'IEC 60335-1, de façon à transformer cette publication en Norme IEC: Exigences de sécurité pour les fours à micro-ondes à usage commercial.
