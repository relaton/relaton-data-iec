abstract:
- language: en
  script: Latn
  content: |-
    IEC 61643-341:2020 specifies standard test circuits and methods for thyristor surge suppressor (TSS) components. These surge protective components, SPCs, are specially formulated thyristors designed to limit overvoltages and divert surge currents by clamping and switching actions. These SPCs are used in the construction of surge protective devices (SPDs) and equipment used in Information &amp; Communications Technologies (ICT) networks with voltages up to AC 1 000 V and DC 1 500 V. This document is applicable to gated or non-gated TSS components with third quadrant (-v and –i) characteristics of blocking, conducting or switching. This document contains information on<br/>
    - terminology;<br/>
    - letter symbols;<br/>
    - essential ratings and characteristics;<br/>
    - rating verification and characteristic measurement;<br/>
    This document does not apply to the conventional three-terminal thyristors as covered by IEC 60747-6. This second edition of IEC 61643-341 cancels and replaces the first edition published in 2001. This edition constitutes a technical revision.This edition includes the following significant technical changes with respect to the previous edition: Addition of performance values.
- language: fr
  script: Latn
  content: |-
    IEC 61643-341:2020 spécifie les circuits d'essai et les méthodes normalisés pour les composants de parafoudre à thyristor (TSS, Thyristor Surge Suppressor). Ces composants de protection contre les surtensions (SPC, Surge Protective Components) sont des thyristors spécialement conçus pour limiter les surtensions et écouler les courants de surcharge par des actions d'écrêtage et de commutation. Ces SPC sont utilisés dans la construction de parafoudres (SPD, Surge Protective Devices) et d'équipements utilisés dans les réseaux de technologies de l'information et de la communication (TIC) dont les tensions atteignent 1 000 V CA et 1 500 V CC. Le présent document s'applique aux composants TSS à gâchette ou non, équipés d'un troisième quadrant (-v et –i) ayant des caractéristiques de blocage, de conduction ou de commutation. Le présent document contient des indications sur:<br/>
    - la terminologie;<br/>
    - les symboles littéraux;<br/>
    - les valeurs assignées et les caractéristiques essentielles;<br/>
    - la vérification des valeurs assignées et la mesure des caractéristiques.<br/>
    Le présent document ne s'applique pas aux thyristors conventionnels à trois bornes couverts dans l'IEC 60747-6. Cette deuxième édition de l'IEC 61643-341 annule et remplace la première édition parue en 2001. Cette édition constitue une révision technique. Cette édition inclut la modification technique majeure suivante par rapport à l'édition précédente: Ajout de valeurs de performances.
