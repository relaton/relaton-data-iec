- language: en
  script: Latn
  content: Describes test methods to measure impedance, reflection coefficient, and voltage standing wave ratio in the time and frequency domains. Applies to interconnect assemblies, such as electrical connectors and cable assemblies, within the scope of IEC technical committee 48.
