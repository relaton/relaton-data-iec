abstract:
- language: en
  script: Latn
  content: |-
    IEC 62541-6:2015 specifies the OPC Unified Architecture (OPC UA) mapping between the security model described in IEC TR 62541-2, the abstract service definitions, described in IEC 62541-4, the data structures defined in IEC 62541-5 and the physical network protocols that can be used to implement the OPC UA specification. This second edition cancels and replaces the first edition published in 2011 and constitutes a technical revision. This edition includes the following changes:<br/>
    - A new HTTPS transport has been defined;<br/>
    - Added an additional padding byte to handle asymmetric key sizes larger than 2048 bits. Fixed errors in SOAP action URIs;<br/>
    - Needed a standard way to serialize nodes in an address space. Added the UANodeSet schema defined in Annex F.
- language: fr
  script: Latn
  content: |-
    L'IEC 62541-6:2015 spécifie les correspondances de l'architecture unifiée OPC (OPC UA) entre le modèle de sécurité décrit dans l'IEC TR 62541-2, les définitions de services abstraits décrites dans l'IEC 62541-4, les structures de données définies dans l'IEC 62541-5 et les protocoles de réseaux physiques qui peuvent être utilisés pour mettre en oeuvre la spécification OPC UA. Cette deuxième édition annule et remplace la première édition parue en 2011. Elle constitue une révision technique. Elle inclut les modifications suivantes:<br/>
    - Un nouveau protocole de transport HTTPS;<br/>
    - Ajout d'un octet de remplissage supplémentaire pour gérer les tailles des clés asymétriques de longueur supérieure à 2048 bits. Définition des erreurs fixes dans les URI d'action SOAP;<br/>
    - Ajout du schéma de l'Ensemble de Noeuds UA (UANodeSet) défini à l'Annexe F.
