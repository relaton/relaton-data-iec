abstract:
- language: en
  script: Latn
  content: Specifies tests and requirements for primary lithium batteries to ensure their safe operation under intended use and reasonably foreseeable misuse.  The major technical changes, with regard to the previous edition, concern the harmonisation with IEC 62281.
- language: fr
  script: Latn
  content: Spécifie les essais et les exigences pour les piles au lithium afin d'assurer leur fonctionnement en toute sécurité dans des conditions d'utilisation prévue et d'un mauvais usage raisonnablement prévisible.  Les principales modifications techniques par rapport à l'édition précédente, concernent l'harmonisation avec la CEI 62281.
