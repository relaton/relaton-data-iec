abstract:
- language: en
  script: Latn
  content: |-
    IEC 60335-2-35:2026 deals with the safety of electric instantaneous water heaters for household and similar purposes and intended for heating water below boiling temperature, their rated voltage being not more than 250 V for single-phase appliances and 480 V for other appliances including DC supplied appliances.<br/>
    Instantaneous water heaters incorporating bare heating elements are within the scope of this standard.<br/>
    Appliances not intended for normal household use but which nevertheless can be a source of danger to the public, such as appliances intended for use in shops, in light industry and on farms, are within the scope of this standard.<br/>
    As far as is practicable, this standard deals with the common hazards presented by appliances which are encountered by all persons in and around the home. However, in general, it does not take into account<br/>
    – persons (including children) whose physical, sensory or mental capabilities; or lack of experience and knowledge prevents them from using the appliance safely without supervision or instruction;<br/>
    – children playing with the appliance.<br/>
    Attention is drawn to the fact that<br/>
    – for appliances intended to be used in vehicles or on board ships or aircraft, additional requirements can be necessary;<br/>
    – in many countries, additional requirements are specified by the national health authorities, the national authorities responsible for the protection of labour and similar authorities;<br/>
    – in many countries regulations exist for the installation of equipment connected to the water mains.<br/>
    This standard does not apply to<br/>
    – appliances for heating liquids (IEC 60335-2-15);<br/>
    – storage water heaters (IEC 60335-2-21);<br/>
    – appliances intended exclusively for industrial purposes;<br/>
    – appliances intended to be used in locations where special conditions prevail, such as the presence of a corrosive or explosive atmosphere (dust, vapour or gas);<br/>
    – commercial dispensing appliances and vending machines (IEC 60335-2-75).<br/>
    This sixth edition cancels and replaces the fifth edition published in 2012, Amendment 1:2016 and Amendment 2:2020. This edition constitutes a technical revision.<br/>
    This edition includes the following significant technical changes with respect to the previous edition:<br/>
    a) alignment with IEC 60335-1:2020;<br/>
    b) conversion of some notes to normative text (Clause 1, 19.4);<br/>
    c) clarification of requirements for remote operations (22.40, 22.49).<br/>
    This part 2 is to be used in conjunction with the latest edition of IEC 60335-1 and its amendments unless that edition precludes it; in that case, the latest edition that does not preclude it is used. It was established on the basis of the sixth edition (2020) of that standard.
