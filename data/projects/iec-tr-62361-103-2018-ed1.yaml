abstract:
- language: en
  script: Latn
  content: IEC TR 62361-103:2018(E), which is a technical report, describes the concepts of standard profiling for Common Information Model (CIM – IEC 61970, IEC 61968, IEC 62325) and IEC 61850 standard series. It serves as an introduction to profiling concepts and methodologies for the development of profiles for providing interoperability. It describes the specific needs and requirements of the standard application domains and derives profiling concepts respectively. Moreover the document defines the foundation for more detailed descriptions in the respective standard series.
