abstract:
- language: en
  script: Latn
  content: |-
    IEC 60947-4-1:2009 applies to the types of equipment whose main contacts are intended to be connected to circuits the rated voltage of which does not exceed 1 000 V a.c. or 1 500 V d.c. Starters and/or contactors dealt with in this standard are not normally designed to interrupt short-circuit currents. Therefore, suitable short-circuit protection forms part of the installation but not necessarily of the contactor or the starter. This third edition replaces the second edition published in 2000 and its Amendments 1 (2002) and 2 (2005). It is a technical revision. This edition includes the following significant technical changes with respect to the previous edition (2000) and its Amendments 1 (2002) and 2 (2005):<br/>
    - deletion of the test at -5 °C and +20 °C for thermal overload relays that are not compensated for ambient air temperature;<br/>
    - addition of conditions of the tests according to Annex Q of IEC 60947-1;<br/>
    - EMC tests: clarification of acceptance criteria and alignment with IEC 60947-1 for fast transient severity level;<br/>
    - Annex B, test for Icd: modification of the duration of the dielectric test voltage from 5 s to 60 s;<br/>
    - Annex B, electrical durability: improvement of the statistical aspects;<br/>
    - Annex H: clarification and introduction of new extended functions within electronic overload relays;<br/>
    - Annex K, procedure to determine data for electromechanical contactors used in functional safety applications: creation of this new annex. This standard shall be read in conjunction with IEC 60947-1, Low voltage switchgear and controlgear - Part 1: General rules. The provisions of the general rules are applicable to this standard, where specifically called for.<br/>
    <br/>
    This publication shall be read in conjunction with IEC 60947-1 :2007.
- language: fr
  script: Latn
  content: |-
    La CEI 60947-4-1:2009 est applicable aux types de matériels dont les contacts principaux sont destinés à être reliés à des circuits dont la tension assignée ne dépasse pas 1 000 V en courant alternatif ou 1 500 V en courant continu. Les démarreurs et/ou contacteurs traités dans la présente norme ne sont pas normalement conçus pour interrompre les courants de court-circuit. En conséquence, une protection appropriée contre les courts-circuits fait partie de l'installation, mais pas nécessairement du contacteur ou du démarreur. Cette troisième édition annule et remplace la deuxième édition parue en 2000 et ses Amendements 1 (2002) et 2 (2005). Elle constitue une révision technique. Cette édition inclut les modifications techniques majeures suivantes par rapport à l'édition précédente (2000) et ses Amendements 1 (2002) et 2 (2005):<br/>
    - suppression de l'essai à -5 °C et +20 °C pour les relais de surcharge thermiques qui ne sont pas compensés pour la température de l'air ambiant;<br/>
    - ajout de conditions d'essai conformes à l'Annexe Q de la CEI 60947-1;<br/>
    - essais CEM: clarification des critères d'acceptation et alignement sur la CEI 60947-1 pour le niveau de sécurité pour les transitoires rapides;<br/>
    - Annexe B, essai pour Icd: modification de la durée de la tension de l'essai diélectrique de 5 s à 60 s;<br/>
    - Annexe B: amélioration des aspects statistiques de la durabilité électrique;<br/>
    - Annexe H: clarification et introduction de nouvelles fonctions étendues dans les relais électroniques de surcharge;<br/>
    - Annexe K, procédure pour déterminer les données des contacteurs électromécaniques utilisés pour les applications de sécurité fonctionnelle: création de cette nouvelle annexe. La présente norme doit être lue conjointement avec la CEI 60947-1, Appareillage à basse tension - Partie 1: Règles générales. Les dispositions des règles générales sont applicables à la présente norme, lorsque cela est spécifiquement mentionné.<br/>
    <br/>
    Cette publication doit être lue conjointement avec la CEI 60947-1 :2007.
