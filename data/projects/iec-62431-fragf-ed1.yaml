abstract:
- language: fr
  script: Latn
  content: |-
    La CEI 62431:2008 spécifie les méthodes de mesure de la réflectivité des absorbeurs d'ondes électromagnétiques (EMA: Electromagnetic Wave Absorber) pour une onde incidente normale, une onde incidente oblique et toute onde polarisée dans la plage des ondes millimétriques. En outre, ces méthodes sont aussi valables pour la mesure de réflectivité d'autres matériaux:<br/>
    - plage des fréquences de mesure: 30 GHz à 300 GHz;<br/>
    - réflectivité: 0 dB à -50 dB;<br/>
    - angle d'incidence: 0° à 80°. La norme CEI 62431 annule et remplace le IEC/PAS. La présente version bilingue correspond à la version anglaise monolingue publiée en 2008-07.
