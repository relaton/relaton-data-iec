abstract:
- language: en
  script: Latn
  content: IEC 61747-40-1:2013 is a mechanical performance testing guideline for cover glass used in electronic flat panel displays in mobile devices. This document focuses on key mechanical testing performance parameters and covers mainly strength and damage resistance attributes. The test methods will focus on the cover glass level testing only.
- language: fr
  script: Latn
  content: La CEI 61747-40-1:2013 constitue les lignes directrices des essais de performances mécaniques pour les verres protecteurs utilisés dans les dispositifs d'affichages électroniques à écran plat des dispositifs mobiles. Ce document porte essentiellement sur les paramètres clés des performances d'essais mécaniques et il couvre principalement les attributs de résistance et de résistance aux dommages. Les méthodes d'essais seront axées sur les essais du niveau des verres protecteurs uniquement.
