  content: IEC 60384-18-1:2008 est une spécification particulière cadre et un document annexe à la spécification intermédiaire qui contient des exigences pour le modèle, la disposition et le contenu minimum des spécifications particulières. Les spécifications particulières qui ne satisfont pas aux exigences peuvent ne pas être considérées comme conformes aux spécifications de la CEI et ne doivent pas être décrites comme telles. Cette seconde édition annule et remplace la première édition publiée en 1993, ainsi que son amendement (1998) et elle constitue une révision technique. Cette édition constitue une révision mineure des tableaux, valeurs et références.
