abstract:
- language: en
  script: Latn
  content: |-
    IEC 62862-4-2:2026 specifies the technical requirements and test methods for the heliostat field control system of solar power tower plants.<br/>
    This document provides the technical requirements of function, performance, and safety constraints of the heliostat field control system, and is applicable to the heliostat field control system of solar power tower plants.<br/>
    This document includes procedures for testing the functionality and performance requirements of the heliostat field control system. It describes the test methods, steps, conditions, and required instruments.
