abstract:
- language: en
  script: Latn
  content: |-
    Applies to assemblies protected against pollution by the use of coating, potting or moulding, thus allowing a reduction of clearance and creepage distances as described in Part 1 or Part 5. 
    This standard describes the requirements and test procedures for two methods of protection:
    - type 1 protection improves the microenvironment of the parts under the protection;
    - type 2 protection is considered to be similar to solid insulation. 
    This standard also applies to all kinds of protected printed boards, including the surface of inner layers of multi-layer boards, substrates and similarly protected assemblies. In the case of multi-layer printed boards, the distances through an inner layer are covered by the requirements for solid insulation in Part 1.
    This standard refers only to permanent protection. It does not cover assemblies that are subjected to mechanical adjustment or repair.
    The principles of this standard are applicable to functional, basic, supplementary and reinforced insulation.
    Has the status of a basic safety publication in accirdance with IEC Guide 104.
    The major changes made during the revision of IEC 60664-3 were the following:
    - Part 3 has been exactly aligned with Part 1 (including amendments 1 and 2). It has been made clear that Part 3 can only be used as a whole document together with Part 1 of IEC 60664.
    - The scope of Part 3 has been greatly extended including now also potting and moulding and similar procedures providing protection against pollution. The standard also applies to all kinds of coated printed boards including the surface of inner-layers of multi-layer boards, substrates and similar protected assemblies. The distances through an inner layer of multi-layer boards however are covered by the requirements for solid insulation in Part 1.
    - The difference between the two types of protection has been clarified. Type 1 (formerly type A) protection leads to a reduction of the pollution degree present beyond the protection to pollution degree 1. Type 2 (formerly type B) protection introduces protection systems which can be considered similar to solid insulation. Consequently the dimensioning and test requirements have been aligned more correctly.
    - The area of application has been extended including now functional, basic, supplementary and reinforced insulation.
    - Type 1 and type 2 protection now can both be used under the conditions of pollution degree 3 (formerly only type B).
    - Not only type 2 protection but also type 1 protection requires that between two conductive parts 100 % of the distance across the spacing shall be covered by the protection.
    - For type 2 protection minimum distances have been introduced. In any case the spacings shall not be lower than the minimum value of 10 µm.
    - Also the new Part 5 of IEC 60664 is referred to.
    - The tests follow much more closely the different requirements for type 1 and type 2 protection. The protected assembly shall withstand the electrical tests for solid insulation in 4.1.2 of IEC 60664-1. For type 1 protection, the partial discharge test is not applicable. For type 2 protection, the partial discharge test is required. The required partial discharge extinction voltage and the test method are specified in 4.1.2.4 of IEC 60664-1.
    - The requirements for the test specimen have been aligned with the extended scope.
    - The tests for the "adhesion of coating" and the "scratch resistance test" have been updated.
- language: fr
  script: Latn
  content: |-
    Applicable aux ensembles protégés contre la pollution au moyen de revêtement, d'empotage ou de moulage, permettant ainsi une réduction des distances d'isolement et des lignes de fuite décrites dans la Partie 1 ou la Partie 5. 
    Cette norme décrit les prescriptions et procédures d'essai pour deux méthodes de protection:
    - la protection de type 1 améliore le micro-environnement des parties sous protection;
    - la protection de type 2 est considérée comme similaire à l'isolation solide. 
    La présente norme s'applique également à toutes sortes de cartes imprimées protégées, y compris la surface de couches internes de cartes multicouches, de substrats et d'ensembles protégés de manière similaire. Dans le cas de cartes imprimées multicouches, les distances à travers une couche interne sont couvertes par les prescriptions pour l'isolation solide dans la Partie 1.
    La présente norme fait uniquement référence à une protection permanente. Elle n'englobe pas les ensembles soumis à une mise au point mécanique ou à des réparations.
    Les principes de cette norme sont applicables à l'isolation fonctionnelle, principale, supplé-mentaire et renforcée.
    A le statut d'une publication fondamentale de sécurité conformément au Guide 104 de la CEI.
    Les modifications majeures effectuées au cours de la révision de la CEI 60664-3 ont été les suivantes:
    - La Partie 3 a été alignée exactement à la Partie 1 (y compris les amendements 1 et 2). Il a été précisé que la Partie 3 ne peut être utilisée que comme un document entier ainsi que la Partie 1 de la CEI 60664.
    - Le domaine d'application de la Partie 3 a été considérablement élargi, en incluant à présent le moulage et l'empotage et les procédures similaires fournissant une protection contre la pollution. La norme s'applique également à toutes sortes de cartes imprimées enduites, y compris la surface de couches internes de cartes multicouches, de substrats et d'ensembles protégés similaires. Les distances à travers une couche interne de cartes multicouches sont cependant couvertes par les prescriptions pour l'isolation solide de la Partie 1.
    - La différence entre les deux types de protection a été clarifiée. La protection de type 1 (précédemment type A) aboutit à une réduction du degré de pollution présente au-delà de la protection pour le degré 1 de pollution. La protection de type 2 (précédemment type B) introduit des systèmes de protection qui peuvent être considérés comme similaires à l'isolation solide. Par conséquent, les prescriptions de dimensionnement et d'essais ont été alignées d'une meilleure façon.
    - Le domaine d'application a été élargi, en incluant à présent l'isolation fonctionnelle, principale, supplémentaire et renforcée.
    - Les protections de type 1 et type 2 peuvent maintenant être utilisées dans des conditions de degré 3 de pollution (précédemment type B).
    - Non seulement la protection de type 2 mais également la protection de type 1 nécessitent que, entre les deux parties conductrices, 100 % de la distance à travers l'espacement soient couverts par la protection. 
    - Pour la protection de type 2, des distances minimales ont été introduites. Dans tous les cas, les espacements ne doivent pas être inférieurs à la valeur minimale de 10 µm.
    - Il est également fait référence à la nouvelle Partie 5 de la CEI 60664.
    - Les essais suivent de beaucoup plus près les différentes prescriptions pour les protections de type 1 et type 2. L'ensemble protégé doit résister aux essais électriques concernant l'isolation solide de 4.1.2 de la CEI 60664-1. Pour la protection de type 1, l'essai de décharge partielle n'est pas applicable. Pour la protection de type 2, l'essai de décharge partielle est exigé. La tension d'extinction de décharge partielle prescrite et la méthode d'essai sont spécifiées en 4.1.2.4 de la CEI 60664-1.
    - Les prescriptions pour l'éprouvette d'essai ont été alignées en élargissant le domaine d'application.
    - Les essais concernant «l'adhérence du revêtement» et «l'essai de résistance aux éraflures» ont été mis à jour.
