abstract:
- language: en
  script: Latn
  content: IEC 62817:2014 is a design qualification standard applicable to solar trackers for photovoltaic systems, but may be used for trackers in other solar applications. The standard defines test procedures for both key components and for the complete tracker system. In some cases, test procedures describe methods to measure and/or calculate parameters to be reported in the defined tracker specification sheet. In other cases, the test procedure results in a pass/fail criterion. This standard ensures the user of the said tracker that parameters reported in the specification sheet were measured by consistent and accepted industry procedures. The tests with pass/fail criteria are engineered with the purpose of separating tracker designs that are likely to have early failures from those designs that are sound and suitable for use as specified by the manufacturer.
- language: fr
  script: Latn
  content: L'IEC 62817:2014 est une norme de qualification de conception applicable aux suiveurs solaires pour systèmes photovoltaïques, mais peut servir aux suiveurs dans d'autres applications solaires. La norme définit les procédures d'essai destinées aussi bien aux composants clés qu'au système suiveur complet. Dans certains cas, les procédures d'essai décrivent des procédés servant à mesurer et/ou calculer des paramètres à rapporter dans la feuille de spécification définie pour le suiveur. Dans d'autres cas, le mode opératoire d'essai se conclut par des critères d'acceptation et de refus. Cette norme donne à l'utilisateur dudit suiveur la garantie que les paramètres rapportés dans la feuille de spécification ont été mesurés par des procédures industrielles cohérentes et acceptées. Les essais basés sur des critères d'acceptation et de rejet ont pour objet de distinguer les conceptions de suiveur susceptibles de présenter des défaillances prématurément de celles présentant la robustesse nécessaire et correspondant à l'usage spécifié par le fabricant.
