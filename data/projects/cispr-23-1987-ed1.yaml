abstract:
- language: en
  script: Latn
  content: |-
    Reviews the position of CISPR limits for the protection of         
    telecommunications from interference from ISM equipment, clarifies 
    the roles of the CCIR and the CISPR in their collaboration in      
    studies on the limits required for this purpose, summarizes the    
    various proposals for methods of specifying limits and derives from
    these a recommended method which will meet the objectives of CISPR 
    and CCIR. Deals only with radiation which occurs outside the bands 
    designated by ITU for ISM use and does not include consideration of
    data-processing equipment.
- language: fr
  script: Latn
  content: |-
    A pour objet d'examiner la position adoptée par le CISPR quant aux 
    valeurs limites imposées aux appareils ISM pour la protection des  
    télécommunications, de clarifier les rôles du CCIR et du CISPR dans
    le cadre de leur étude conjointe portant sur les valeurs limites   
    nécessaires aux fins de cette protection, de résumer les diverses  
    propositions de méthodes d'établissement des valeurs limites et de 
    constituer à partir de ces propositions une méthode recommandée qui
    satisfera aux objectifs du CISPR et du CCIR. Ne traite que des     
    rayonnements qui se produisent à l'extérieur des bandes désignées  
    par l'UIT à l'usage des appareils ISM et ne couvre pas les         
    appareils de traitement de l'information.
