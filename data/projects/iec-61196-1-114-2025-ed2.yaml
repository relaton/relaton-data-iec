abstract:
- language: en
  script: Latn
  content: |-
    IEC 61196-1-114:2025 specifies a test method to determine the inductance characteristics of coaxial communication cables. This second edition cancels and replaces the first edition published in 2015. This edition constitutes a technical revision.<br/>
    This edition includes the following significant technical changes with respect to the previous edition:<br/>
    a) the term "inductance" has been revised;<br/>
    b) the necessary abbreviated term is added;<br/>
    c) the length and layout of the test sample have been revised;<br/>
    d) the measuring procedure has been revised;<br/>
    e) the additional information for the bending effect on coaxial cable inductance test is provided in Annex A.
