abstract:
- language: en
  script: Latn
  content: |-
    Covers d.c. metal-enclosed and non-metallic enclosed switchgear assemblies used in indoor stationary installations of traction systems, with nominal voltage not exceeding 3 000 V.<br/>
    The content of the corrigendum 1 (2025-05) has been included in this copy.
- language: fr
  script: Latn
  content: |-
    Couvre les ensembles d'appareillage à courant continu sous enveloppe métallique et non métallique utilisés en intérieur dans les systèmes d'installations fixes de traction, avec une tension nominale ne dépassant pas 3 000 V.<br/>
    Le contenu du corrigendum 1 (2025-05) a été pris en considération dans cet exemplaire.
