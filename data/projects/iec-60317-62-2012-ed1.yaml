abstract:
- language: en
  script: Latn
  content: |-
    IEC 60317-62:2012 specifies the requirements of polyester glass fibre wound, resin or varnish impregnated, bare or enamelled rectangular copper winding wire, temperature index 200. The range of nominal conductor dimensions covered by this standard is:<br/>
    - width: min. 2,0 mm; max.16,0 mm;<br/>
    - thickness: min. 0,80 mm; max. 5,60 mm. Keywords: copper winding wire<br/>
    <br/>
    This publication is to be read in conjunction with IEC 60317-0-8:2012.
- language: fr
  script: Latn
  content: |-
    La CEI 60317-62:2012 spécifie les exigences relatives au fil de bobinage en cuivre nu ou émaillé, guipé de fibres de verre polyester imprégnées de vernis ou de résine, d'indice de température 200. La gamme des dimensions nominales des conducteurs couverte par la présente norme est:<br/>
    - largeur: min. 2,0 mm; max. 16,0 mm;<br/>
    - épaisseur: min. 0,80 mm; max. 5,60 mm. Mots clé: fil de bobinage en cuivre<br/>
    <br/>
    Cette publication doit être lue conjointement avec la CEI 60317-0-8:2012.
