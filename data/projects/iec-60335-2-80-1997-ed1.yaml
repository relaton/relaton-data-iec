abstract:
- language: en
  script: Latn
  content: 'Deals with the safety of electric fans for household and similar purposes. Examples are ceiling, table and pedestal fans. This standard replaces IEC 60342-1: 1981 and its amendment 1 (1982) and IEC 60342-3: 1982.'
- language: fr
  script: Latn
  content: 'Traire de la sécurité des ventilateurs électriques pour usages domestiques et analogues. Comme exemples, on peut citer, les ventilateurs de table, de colonne et de cloison. Cette norme remplace la CEI 60342-1: 1981 et sa modification 1 (1982) et la CEI 60342-3: 1982.'
