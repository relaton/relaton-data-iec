abstract:
- language: en
  script: Latn
  content: |-
    IEC 63418: 2026 applies to fixed accessories designed to supply power at extra low voltage through a USB port, connected to a circuit having a voltage not exceeding 250 V AC or to an extra low voltage DC local / private distribution system not exceeding 60 V, intended for household and similar purposes, either indoors or outdoors.<br/>
    This document covers only those requirements for mounting boxes which are necessary for the tests on the accessory.<br/>
    This document defines the safety and EMC requirements for accessories that supply power through an interface.<br/>
    Specifications, performance or dimensional requirements of the USB technology are not covered by this document; these are defined in the relevant part(s) of IEC 62680 (all parts).
