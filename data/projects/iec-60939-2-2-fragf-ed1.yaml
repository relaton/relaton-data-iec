abstract:
- language: fr
  script: Latn
  content: La CEI 60939-2-2:2004 constitue la base d'une procédure uniforme de marquage de sécurité commun. Elle met en oeuvre le programme d'homologation pour l'essai de sécurité décrit dans la CEI 60939-2, nécessite une déclaration de conception pour les paramètres relatifs à la sécurité et indique les essais de conformité à réaliser sur tous les lots avant leur livraison et les essais de requalification en fonction des modifications apportées à la conception déclarée.
