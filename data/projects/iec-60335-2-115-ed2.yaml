abstract:
- language: en
  script: Latn
  content: |-
    IEC 60335-2-115:2026 deals with the safety of electric appliances for skin care of persons and intended for household, commercial and similar purposes, their rated voltage being not more than 250 V including direct current (DC) supplied appliances and battery-operated appliances.<br/>
    Examples of appliances that are within the scope of this standard are<br/>
    – appliances with high frequency outputs including equipment for heat-producing effects on the skin;<br/>
    – appliances with medium frequency outputs including interferential outputs, for skin stimulation or muscle stimulation;<br/>
    – appliances with low frequency outputs (e.g. faradic currents) for application such as skin stimulation or muscle stimulation;<br/>
    – appliances with extra-low voltage DC outputs (e.g. galvanic currents), such as electro-epilation (hair removal);<br/>
    – skin care appliances with ultrasonic outputs;<br/>
    – appliances having vacuum-pressure functions;<br/>
    – wax-melting appliances;<br/>
    – appliances intended to produce surface cooling effect on the skin;<br/>
    – facial cleaning appliances and facial saunas;<br/>
    – micro-needling appliances;<br/>
    – plasma pens;<br/>
    – water filled foot care appliances without massage function.<br/>
    A water filled foot care appliance with water jets is not considered to have a massage function.<br/>
    Appliances covered by this standard can incorporate vapour-producing devices or spray-producing devices.<br/>
    This standard deals with the reasonably foreseeable hazards presented by appliances that are encountered by all persons. However, in general, it does not take into account<br/>
    – persons (including children) whose physical, sensory or mental capabilities; or lack of experience and knowledge prevents them from using the appliance safely without supervision or instruction;<br/>
    – children playing with the appliance.<br/>
    Attention is drawn to the fact that<br/>
    – it is recognized that persons having very extensive and complex disabilities can have needs beyond the level addressed in this standard;<br/>
    – for appliances intended to be used in vehicles or on board ships or aircraft, additional requirements can be necessary;<br/>
    – in many countries, additional requirements can be specified by the national health authorities, the national authorities responsible for the protection of labour and similar authorities, including the use of certain types of appliances by appropriately trained persons only.<br/>
    This standard does not apply to<br/>
    – appliances intended exclusively for industrial purposes;<br/>
    – appliances intended to be used in locations where special conditions prevail, such as the presence of a corrosive or explosive atmosphere (dust, vapour or gas);<br/>
    – shavers, hair clippers and similar appliances (IEC 60335-2-8);<br/>
    – blankets, pads, clothing and similar flexible heating appliances (IEC 60335-2-17);<br/>
    – appliances for hair care and similar such as hand dryers (IEC 60335-2-23);<br/>
    – spray tanning appliances;<br/>
    – appliances for whole/partial body skin exposure to functional optical radiation (IEC 60335-2-27);<br/>
    – water filled foot massagers (IEC 60335-2-32);<br/>
    – sauna heating appliances and infrared cabins (IEC 60335-2-53);<br/>
    – beauty care appliances incorporating lasers and intense light sources (IEC 60335-2-113);<br/>
    – appliances intended for medical purposes (IEC 60601);<br/>
    – radio frequency appliances without contact to the skin;<br/>
    – ultrasound appliances provided with focusing ultrasound transducers.<br/>
    This second edition cancels and replaces the first edition published in 2021. This edition constitutes a technical revision.<br/>
    This edition includes the following significant technical changes with respect to the previous edition:<br/>
    a) alignment with IEC 60335-1:2020;<br/>
    b) standard title updated: skin care appliances like facial saunas and foot care devices moved from IEC 60335 2 23 to this standard (Clause 1, 3.1.9, 3.5.107, 3.5.108, 6.1, 7.12, 8.1.4, 11.8, 15.2, 21.1);<br/>
    c) clarification regarding the skin care appliances covered by this standard, including those incorporating emitters for exposing the skin to optical radiation (Clause 1);<br/>
    d) clarification regarding the test specifications (5.2, 10.1, 10.2, 10.101, 10.102);<br/>
    e) introduction of requirements for washable appliances (7.1, 7.6, 7.12, 22.26, 22.115, 25.24);<br/>
    f) clarification of the application of test probe 18 for use in beauty parlours or similar premises only (8.1.1, 20.2, B.22.3, B.22.4);<br/>
    g) improvement on definitions for electrical stimulator and radio frequency appliance (3.5.101, 3.5.103);<br/>
    h) replace "applied part" with "applicator" in the definition and throughout the standard;<br/>
    i) revision of output limitations for electrical stimulators applied to the human body from the neck and above (22.102);<br/>
    j) modify remote operation requirements (22.40, 22.49, 22.51);<br/>
    k) delete the requirements for pressurised appliances (3.5.102, 19.4, 20.101, 22.7, 22.102).<br/>
    l) modify the requirements for negative pressurised appliances (22.105).<br/>
    This part 2 is to be used in conjunction with the latest edition of IEC 60335-1 and its amendments unless that edition precludes it; in that case, the latest edition that does not preclude it is used. It was established on the basis of the sixth edition (2020) of that standard.
