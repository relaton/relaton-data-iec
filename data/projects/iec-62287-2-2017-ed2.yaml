abstract:
- language: en
  script: Latn
  content: |-
    IEC 62287-2:2017 specifies operational and performance requirements, methods of testing and required test results for Class B "SO" shipborne automatic identifications system (AIS) equipment using self-organising time division multiple access (SOTDMA) techniques as described in Recommendation ITU-R M.1371. This document takes into account other associated IEC International Standards and existing national standards, as applicable.<br/>
    This edition includes the following significant technical change with respect to the previous edition: the introduction of transmission of Message 27 on channels 75 and 76 for the long range application by broadcast.
- language: fr
  script: Latn
  content: L’IEC 62287-2:2017 spécifie les exigences opérationnelles et de performance, les méthodes d’essai et les résultats d’essai exigés pour le transpondeur embarqué du système d’identification automatique (AIS) "AO" de classe B utilisant les techniques d’accès multiple par répartition dans le temps auto-organisé (AMRTAO) telles qu’elles sont décrites dans la Recommandation UIT-R M.1371. Le présent document prend en compte d’autres Normes internationales IEC associées et des normes nationales existantes, selon le cas.
