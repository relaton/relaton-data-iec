abstract:
- language: en
  script: Latn
  content: |-
    Gives standards for the following subcategories of bipolar
    transistors:
    -low power signal transistors (excluding switching applications);
    -power transistors (excluding switching and high-frequency
    applications);
    -high-frequency power transistors for amplifier and oscillator
    applications;
    -switching transistors.
- language: fr
  script: Latn
  content: |-
    Donne les normes pour les sous-catégories suivantes des 
    transistors bipolaires:
    - transistors pour signaux de faible puissance (à l'exclusion des
    applications en commutation);
    - transistors de puissance (à l'exclusion des applications en
    commutation et en haute fréquence);
    - transistors de puissance haute fréquence pour applications en
    amplificateurs et en oscillateurs;
    - transistors de commutation.
