abstract:
- language: en
  script: Latn
  content: |-
    IEC 60533:2026 contains requirements and guidelines to ensure electromagnetic compatibility on board all types and sizes of ships unless more specific standards are applicable for specific types or sizes of ships. These requirements and guidelines can be applied during the building process but also when maintenance or upgrades are required.<br/>
    This fourth edition cancels and replaces the third edition, published in 2015. This edition constitutes a technical revision.<br/>
    This edition includes the following significant technical changes with respect to the previous edition:<br/>
    a) It is recognised that in the ship building process different parties are involved with each its specific role. In this edition requirements are linked to the different roles.<br/>
    b) It is recognised that not all equipment onboard a ship is specifically designed for the maritime environment. For that reason, the risk-based approach is introduced to minimise risks on interference from non-maritime equipment.<br/>
    c) The number of EMC zones has been increased, and the zones have been divided into two groups: spatial zones (separated by steel bulkheads, decks and distance) and power grid zones (separated by transformers, converters and filters). This was done to cover risk areas, such as those near antennas, and to allow dealing with the fact that the boundaries of EMC spatial zones and EMC power grid zones usually not align.<br/>
    d) The upper frequency limit has been increased to match new technological developments.<br/>
    e) The requirements from IEC 62742 have been integrated in this document, where applicable, since there are more and more ships where composite and metal construction materials are combined.
