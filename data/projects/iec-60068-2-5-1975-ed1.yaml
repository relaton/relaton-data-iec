abstract:
- language: en
  script: Latn
  content: |-
    Determines the thermal, mechanical, chemical, electrical, and other effects on equipment and components as a result of exposure to solar radiation at the surface of the earth.

    Has the status of a basic safety publication in accordance with IEC Guide 104.
- language: fr
  script: Latn
  content: |-
    Détermine sur équipements et composants les effets (thermiques, mécaniques, chimiques, électriques, etc.) résultant d'une exposition au rayonnement solaire dans les conditions rencontrées à la surface de la terre.

    Has the status of a basic safety publication in accordance with IEC Guide 104.
