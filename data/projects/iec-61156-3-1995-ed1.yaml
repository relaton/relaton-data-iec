- language: en
  script: Latn
  content: Covers individually unscreened pairs in cables for work area wiring. The cables may be provided with a common screen over the cable core. These cables are suitable for the various communciation systems for which the references is given in the appropriate detail specification.
- language: fr
  script: Latn
  content: Couvre les câbles à paires sans écran individuel destinés aux raccordements. Les câbles peuvent être pourvus d'un écran extérieur commun. Ces câbles conviennent aux communications diverses dont la référence est donnée dans la spécification particulière appropriée.
