abstract:
- language: en
  script: Latn
  content: |-
    IEC Guide 118:2024 is addressed to all TCs and intends to support their work on energy efficiency publications within their specific scope.<br/>
    This document defines procedures for the preparation and revision of basic and group energy efficiency (EE) publications including energy efficiency aspects (EEAs).<br/>
    This second edition cancels and replaces the first edition published in 2017. This second edition also replaces the first edition of IEC Guide 119 published in 2017.<br/>
    The main changes with respect to the previous edition are as follows:<br/>
    a) merging of IEC Guide 118 edition 1 with IEC Guide 119 edition 1;<br/>
    b) elimination of duplication;<br/>
    c) addition of definitions.
- language: fr
  script: Latn
  content: |-
    L'IEC Guide 118:2024 s'adresse à l'ensemble des CE et a pour objet de leur fournir un appui dans l'élaboration des publications sur l'efficacité énergétique qui relèvent de leur domaine d'application spécifique.<br/>
    Le présent document définit les procédures pour l'élaboration et la révision des publications fondamentales et de groupe sur l'efficacité énergétique (EE), y compris les aspects d'efficacité énergétique (EEA, energy efficiency aspects).<br/>
    Cette deuxième édition annule et remplace la première édition parue en 2017. Cette deuxième édition remplace également la première édition du Guide 119 de l'IEC parue en 2017.<br/>
    Les modifications majeures par rapport à l'édition précédente sont les suivantes:<br/>
    a) fusion des éditions 1 du Guide IEC 118 et du Guide IEC 119;<br/>
    b) élimination des travaux dupliqués;<br/>
    c) ajout de définitions.
