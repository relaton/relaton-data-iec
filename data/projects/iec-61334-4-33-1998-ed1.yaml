abstract:
- language: en
  script: Latn
  content: |-
    Covers the services required by the data communication protocol (DCP) logical link control (LLC) sublayer entity at the logical interfaces with the LLC -user layer and the MAC sublayer, using the connection-oriented LLC procedures.<br/>
    <br/>
    This publication is of high relevance for Smart Grid.
- language: fr
  script: Latn
  content: Couvre les services exigés par l'entité de la sous-couche contrôle de liaison logique (LLC) du protocole de communication de données, aux interfaces logiques entre la couche utilisateur LLC et la sous-couche MAC, en utilisant les procédures LLC en mode orienté connexion.
