abstract:
- language: en
  script: Latn
  content: Specifies requirements for the dosemeter and, if supplied, for its associated readout system. Specifies general characteristics, general test procedures, radiation characteristics as well as electrical, mechanical, safety and environmental characteristics. Also specifies classes of personal dose equivalent meters in relation to retention of stored information.
- language: fr
  script: Latn
  content: Précise les exigences pour les dosimètres et, s'ils sont fournis, pour leurs systèmes de lecture associés. Spécifie leurs caractéristiques générales, leurs procédures générales d'essai, leurs caractéristiques sous rayonnement ainsi que leurs caractéristiques électriques, mécaniques, de sécurité et environnementales. Spécifie aussi les classes des appareils de mesure de l'équivalent de dose individuel en fonction de la conservation des informations.
