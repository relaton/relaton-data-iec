abstract:
- language: fr
  script: Latn
  content: Traite de la sécurité des machines à laver le linge électriques pour usages domestiques et analogues destinées à laver des vêtements et des textiles, dont la tension assignée n'est pas supérieure à 250 V pour les appareils monophasés et à 480 V pour les autres appareils. Les machines à laver mises à la disposition commune des utilisateurs dans des immeubles d'habitation ou dans les laveries automatiques sont couvertes par cette norme.
