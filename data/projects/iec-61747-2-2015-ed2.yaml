abstract:
- language: en
  script: Latn
  content: |-
    IEC 61747-2:2015(E) applies to liquid crystal display modules such as the following:<br/>
    - static/segment type liquid crystal display modules;<br/>
    - passive matrix monochrome liquid crystal display modules;<br/>
    - passive matrix colour liquid crystal display modules;<br/>
    - active matrix monochrome liquid crystal display modules;<br/>
    - active matrix colour liquid crystal display modules.<br/>
    It gives details of the quality assessment procedures, inspection requirements, screening sequences, sampling requirements, and test and measurement procedures required for the assessment of liquid crystal display modules. This edition includes the following significant technical changes with respect to the previous edition:<br/>
    a) This version is applicable only for liquid crystal displays.<br/>
    b) All the references to IECQ and QC were removed in accordance with ISO/IEC Directives.<br/>
    c) The normative references were updated.<br/>
    <br/>
    This publication is to be read in conjunction with IEC 61747-1-1:2014.
