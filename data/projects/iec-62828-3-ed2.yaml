abstract:
- language: en
  script: Latn
  content: |-
    IEC 62828-3:2026  establishes specific procedures for testing temperature transmitters used in measuring and control systems for industrial process and for machinery control systems.<br/>
    When the process measurement transmitter features an assembly with dismountable temperature transmitter electronics electrically disconnectable from the sensing element (resistance temperature detectors (RTD), thermocouples (TC), etc.), the standard applies only to the temperature transmitter electronics without the sensing element. In case of devices where the sensing element is fully integrated with the temperature transmitter electronics, the standard applies to the complete device.<br/>
    The sensing element itself is excluded from the scope of this document, provided that separate standards exist, such as e.g. for RTD and TC.<br/>
    Radiation temperature transmitters are different in the type of measuring method and most often include the sensing element, which is typically not standardized. Therefore, additional requirements and test procedures are defined for this type of transmitter within this document.<br/>
    For general test procedures, reference is made to IEC 62828‑1, which is applicable to all types of industrial and process measurement transmitters (PMT).<br/>
    NOTE 1 In the industrial and process applications, to indicate the process measurement transmitters, it is common also to use the terms "industrial transmitters", or "process transmitters".<br/>
    NOTE 2 Infrared ear thermometers are not in the scope of this document.<br/>
    This second edition cancels and replaces the first edition published in 2018. This edition constitutes a technical revision.<br/>
    This edition includes the following significant technical changes with respect to the previous edition:<br/>
    a) alignment to those changes made within the new revision of IEC 62828‑1;<br/>
    b) addition of terms, definitions, test conditions and procedures needed for radiation temperature transmitters.
