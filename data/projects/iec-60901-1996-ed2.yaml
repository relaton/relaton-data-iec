abstract:
- language: en
  script: Latn
  content: Specifies the performance requirements for single-capped fluorescent lamps for general lighting service. The requirements of this standard relate only to type testing. Conditions of compliance, including methods of statistical assessment, are under consideration.
- language: fr
  script: Latn
  content: Fournit les prescriptions de performances des lampes à fluorescence à culot unique pour usage général. Les prescriptions de la présente norme concernent uniquement les essais de type. Les conditions de conformité ainsi que les méthodes d'évaluation statistique sont à l'étude.
