abstract:
- language: en
  script: Latn
  content: |-
    IEC TS 62607-6-34:2027, which is a Technical Specification, establishes a standardized method to determine the key control characteristic<br/>
    • C/O ratio<br/>
    of reduced graphene oxide (rGO) by<br/>
    • Raman spectroscopy.<br/>
    The C/O ratio of rGO is derived from the intensity ratio of the D* band to the G band in the Raman spectrum, <em>I</em>(D*)/<em>I</em>(G).<br/>
    • This method is applicable to reduced graphene oxide (rGO).<br/>
    • It is especially useful for evaluating the quality of rGO synthesized via various reduction methods, helping users determine whether the material is suitable for specific applications.<br/>
    • This document is intended for rGO manufacturers and downstream users to support material design, production, and quality control.
