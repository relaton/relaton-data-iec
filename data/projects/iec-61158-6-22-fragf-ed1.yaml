abstract:
- language: fr
  script: Latn
  content: |-
    La CEI 61158-6-22:2010 définit de manière abstraite le comportement, visible par un observateur externe, assuré par les différents Types de la couche application de bus de terrain. Elle vise à définir le protocole mis en place pour:<br/>
    - définir la représentation filaire des primitives de service définies dans la norme CEI 61158-5-22:2010, et<br/>
    - définir le comportement visible de l'extérieur associé à leur transfert.<br/>
    La présente norme spécifie le protocole de la couche application de bus de terrain de la CEI, en conformité avec le modèle de référence de base OSI (ISO/CEI 7498) et avec la structure de la couche application OSI (ISO/CEI 9545). Cette norme annule et remplace la norme CEI/PAS 61158-6-22 publiée en 2009. Elle constitue une révision technique. La présente version bilingue (2012-07) correspond à la version anglaise monolingue publiée en 2010-08.
