abstract:
- language: en
  script: Latn
  content: IEC 61400-11:2012 presents measurement procedures that enable noise emissions of a wind turbine to be characterised. This involves using measurement methods appropriate to noise emission assessment at locations close to the machine, in order to avoid errors due to sound propagation, but far away enough to allow for the finite source size. The procedures described are different in some respects from those that would be adopted for noise assessment in community noise studies. They are intended to facilitate characterisation of wind turbine noise with respect to a range of wind speeds and directions. Standardisation of measurement procedures will also facilitate comparisons between different wind turbines. This new edition constitutes a technical revision, introducing new principles for data reduction procedures.
- language: fr
  script: Latn
  content: l’IEC 61400-11:2012 spécifie les procédures de mesure qui permettent de caractériser les émissions sonores d’une éolienne. Cette démarche implique l’utilisation de méthodes de mesure appropriées à l’évaluation des émissions sonores à des emplacements proches de la machine, afin d’éviter les erreurs dues à la propagation du son, mais toutefois suffisamment éloignés pour permettre de déterminer la dimension des sources finies. Les procédures décrites sont différentes à certains égards de celles qui seraient adoptées pour l’évaluation du bruit dans le cadre des études portant sur le bruit ambiant. Ces procédures sont destinées à faciliter la caractérisation du bruit émis par une éolienne par rapport à une plage donnée de vitesses et de directions du vent. La normalisation des procédures de mesure facilite également les comparaisons entre différentes éoliennes. Cette nouvelle édition constitue une révision technique, introduisant de nouveaux principes concernant les procédures de traitement des données.
