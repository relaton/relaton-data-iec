abstract:
- language: en
  script: Latn
  content: |-
    IEC SRD 63417:2025 provides guidance and a plan to develop smart energy ontologies and other domain-based ontologies within smart energy to achieve semantic interoperability through various standards, generic and specific ontologies projects. This includes but is not limited to the following.<br/>
    • Assessment of a selection of existing ontologies for the purpose of smart energy applications:<br/>
    – identification of developed ontologies within the energy sectors;<br/>
    – limitations, best practices, and lessons learned;<br/>
    – use and reuse of existing ontologies in the smart energy domain;<br/>
    – cross-domain semantic interoperability support and link to other ontologies.<br/>
    • Guidance and plan for smart energy ontologies development and usage including:<br/>
    – key principles to map or transform existing reference models to the IEC ontology framework;<br/>
    – definition of governance best practices for ontologies applied to process the smart energy domain;<br/>
    – guidance for developing or extending a smart energy ontology.<br/>
    Domain-based ontologies have been developed for semantic interoperability in a specific domain but the interaction of semantically equivalent objects in different ontologies has not been defined. This document helps users and ontology developers to define the complete relationship in different domains and different ontologies for the purpose of smart energy applications.
