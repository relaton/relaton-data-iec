abstract:
- language: en
  script: Latn
  content: IEC 60050-904:2015 gives the general terminology used in the field of environmental standardization for electrical and electronic products and systems. It has the status of a horizontal standard in accordance with IEC Guide 108. This terminology is consistent with the terminology developed in the other specialized parts of the IEV.
- language: fr
  script: Latn
  content: IEC 60050-904:2015 donne la terminologie générale utilisée dans le domaine de l appréciation de la normalisation environnementale pour les produits et les systèmes électriques et électroniques. Elle a le statut de norme horizontale conformément au Guide IEC 108. Cette terminologie est en accord avec la terminologie figurant dans les autres parties spécialisées de l'IEV.
