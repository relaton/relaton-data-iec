abstract:
- language: en
  script: Latn
  content: Applies to hedge trimmers which are designed for use by one operator for trimming hedges and bushes, utilizing one or more linear reciprocating cutter blades. This standard is not applicable to hedge trimmers with a rotating blade.
- language: fr
  script: Latn
  content: S'applique aux taille-haies conçus pour être utilisés par un opérateur, pour tailler les haies et les arbustes et comportant une ou plusieurs lames de coupe droites à va-et-vient. La présente norme n'est pas applicable aux taille-haies à lames rotatives.
