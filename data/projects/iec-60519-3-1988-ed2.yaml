abstract:
- language: en
  script: Latn
  content: |-
    Applies to:
    -installations for induction and conduction heating of solids. at low, medium and high frequencies (for conduction
    heating, use of direct current is also included);
    -installations for induction melting, holding and superheating at low, medium and high frequencies;
    -those parts of the conveying or handling equipment of the electroheat installation which are within the influence of the heating section.
- language: fr
  script: Latn
  content: S'applique aux installations de chauffage des solides par induction et par conduction à basse, moyenne et haute fréquence (l'utilisation du courant continu est également prévue pour le chauffage par conduction) aux installations de fusion, maintien en température ou surchauffe par induction à basse, moyenne et haute fréquence, et aux parties de l'installation électrothermique servant au transport ou au déplacement et susceptibles d'être soumises à l'influence de la section de chauffage.
