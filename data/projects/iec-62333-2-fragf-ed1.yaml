  content: La CEI 62333-2:2006 spécifie les méthodes de mesure des caractéristiques électromagnétiques d'une plaque réduisant le bruit. Ces méthodes sont destinées à fournir des mesures utiles et reproductibles pour caractériser les performances des plaques réduisant le bruit, de sorte que les fabricants et leurs clients puissent obtenir les mêmes résultats.
