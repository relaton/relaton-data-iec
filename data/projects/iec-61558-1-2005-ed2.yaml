abstract:
- language: en
  script: Latn
  content: This International Standard deals with safety aspects of power transformers, power supplies, reactors and similar products such as electrical, thermal and mechanical safety. This standard covers the following types of dry-type transformers, power supplies, including switch mode power supplies, and reactors, the windings of which may be encapsulated or non-encapsulated It has the status of a group safety publication in accordance with IEC Guide 104. The contents of the corrigenda of March 2008, March 2010 and April 2011 have been included in this copy.
- language: fr
  script: Latn
  content: La présente Norme internationale traite des aspects relatifs à la sécurité des transformateurs, alimentations, bobines d'inductance, et produits analogues, tels que la sécurité électrique, la sécurité thermique et la sécurité mécanique. La présente norme couvre les transformateurs secs et les alimentations ci-dessous, incluant les alimentations à découpage et bobines d'inductance, dont les enroulements peuvent être enrobés ou non enrobes Elle a le statut de publication groupée de sécurité conformément au guide CEI 104. Le contenu des corrigendas de mars 2008, mars 2010 et abril 2011 a été pris en considération dans cet exemplaire.
