abstract:
- language: en
  script: Latn
  content: |-
    <p>IEC/IEEE 65700-19-03:2025 applies to outdoor and indoor bushings of any voltage used on DC systems, of capacitance graded or gas insulated types for use as components of liquid-filled converter transformers and smoothing reactors, as well as air-to-air DC bushings. It applies to both line commutated converter (LCC), as well as voltage source converter (VSC) technologies. This document does not apply to the following:<br/>
    - cable terminations (potheads);<br/>
    - bushings for instrument transformers;<br/>
    - bushings for test power supplies;<br/>
    - bushings applied with gaseous insulation (other than air at atmospheric pressure) external to the bushing;<br/>
    - bushings for industrial application;<br/>
    - bushings for traction application;<br/>
    - bushings for distribution class transformers.<br/>
    This second edition cancels and replaces the first edition published in 2014. This edition constitutes a technical revision and includes the following significant technical changes with respect to the previous edition:<br/>
    - service experiences as well as established market requirements have been harmonized with existing IEC and IEEE standards, primarily IEC 60137, Insulated bushings for alternating voltages above 1 000 V, and IEEE Std C57.19.00™, IEEE Standard General Requirements and Test Procedures for Outdoor Power Apparatus Bushings;<br/>
    - inclusion of voltage source converter (VSC) technologies.</p>
