abstract:
- language: en
  script: Latn
  content: |-
    IEC/ISO/IEEE 80005-1:2012(E) describes high voltage shore connection (HVSC) systems, on board the ship and on shore, to supply the ship with electrical power from shore. This standard is applicable to the design, installation and testing of HVSC systems and addresses:<br/>
    - HV shore distribution systems;<br/>
    - shore-to-ship connection and interface equipment;<br/>
    - transformers/reactors;<br/>
    - semiconductor/rotating convertors;<br/>
    - ship distribution systems; and<br/>
    - control, monitoring, interlocking and power management systems.<br/>
    It does not apply to the electrical power supply during docking periods, e.g. dry docking and other out of service maintenance and repair.
