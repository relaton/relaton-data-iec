abstract:
- language: en
  script: Latn
  content: IEC 60994:1991 applies to any type of reaction or impulse turbine, as well as to any type of pump-turbine and storage pump, coupled to an electric generator or motor. It covers the field of vibration and pulsation tests referred to as standard tests. The contents of the corrigendum of April 1997 have been included in this copy.
- language: fr
  script: Latn
  content: S'applique à tout type de turbine à réaction ou à action, ainsi qu'à tout type de pompe-turbine et de pompe d'accumulation, couplée à un alternateur ou à un moteur. Couvre le domaine des essais de vibrations et de fluctuations qualifiés d'essais standards. Le contenu du corrigendum d'avril 1997 a été pris en considération dans cet exemplaire.
