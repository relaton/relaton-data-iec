abstract:
- language: en
  script: Latn
  content: |-
    IEC/IEEE 60880:2026 provides requirements for the software of computer-based systems of nuclear power plants performing functions of safety category A as defined by IEC 61226. As an IEC/IEEE standard developed according to the Dual Logo Agreement, when used within the context of IEEE, this document is considered to provide an acceptable set of requirements for achieving the quality and dependability objectives for the software used in IEEE Class 1E safety systems, subsystems and components.<br/>
    According to the definition in IEC 61513, I&amp;C systems of safety class 1 are intended to support category A functions, but can also support functions of lower categories. However the system requirements are always determined by the functions of the highest category implemented.<br/>
    For software of I&amp;C system performing only category B and C functions in NPP as defined by IEC 61226, the requirements and guidance of IEC 62138 are applicable.<br/>
    This document provides requirements for the purpose of achieving highly dependable software. It addresses each stage of software generation and documentation, including requirements specification, design, implementation, verification and validation testing.<br/>
    <br/>
    This is the first edition developed according to the IEC/IEEE Dual Logo Agreement. This edition cancels and replaces the second IEC edition published in 2006. It constitutes a technical revision.<br/>
    The revision of the standard is intended to accomplish the following:<br/>
    - To take into account the fact that software engineering techniques advanced significantly in the intervening years.<br/>
    - To align the standard with the new IAEA document SSG-39.<br/>
    - To align as far as possible the definitions in the standard with the International Atomic Energy Agency, IAEA Nuclear Safety and Security Glossary, 2022 (Interim) Edition, IAEA, Vienna (2022).<br/>
    - To adapt the requirements associated with standards published or revised since the second edition of IEC 60880, especially IEC 61513, IEC 61226, IEC 62138, IEC 60987, IEC 62340, IEC 62645 and IEC 62671.<br/>
    - To review the existing requirements.
