abstract:
- language: en
  script: Latn
  content: IEC 60120:2020 define the dimensions of a series of standard ball and socket couplings using the standard locking devices (see IEC 60372) in order to permit the assembly of insulators or metal fittings supplied by different manufacturers. This document applies to string insulator units of the cap and pin and long rod types and their associated metal fittings. For the pin ball and the socket, dimensions apply to the finished product after any surface treatment. Extreme positions of the pin ball in the socket are given in annex. Typical examples of gauges for checking the dimensions of pin balls and sockets are given in annex.
- language: fr
  script: Latn
  content: l’IEC 60120:2020 définir les dimensions d’une série d’assemblages à rotule normalisés utilisant les dispositifs de verrouillage normalisés (voir l’IEC 60372) afin de permettre l’assemblage d’isolateurs ou d’accessoires métalliques fournis par différents fabricants. Le présent document s’applique aux éléments de chaînes d’isolateurs du type à capot, et tige et du type à long fût et aux accessoires métalliques qui leur sont associés. Les dimensions de la tige à rotule et du logement s’appliquent au produit fini après tout traitement de surface. Les positions extrêmes de la tige à rotule dans le logement sont présentées en annexe. Des exemples types de calibres utilisés pour vérifier les dimensions des tiges à rotules et des logements sont présentés en annexe.
