abstract:
- language: en
  script: Latn
  content: |-
    IEC 60335-2-104:2027 deals with the safety of electrical recovery and/or recycle equipment incorporating open drive or motor-compressors and intended to recover and/or recycle refrigerant from air conditioning and refrigeration equipment with a maximum rated voltage of 300 V for single phase equipment and 600 V for all other equipment.<br/>
    Recovery and/or recycle equipment that can be a source of danger to the public, such as equipment intended to be used by service personnel in shops, in light industry and on farms, are within the scope of this standard.<br/>
    This third edition cancels and replaces the second edition published in 2021. This edition constitutes a technical revision.<br/>
    This edition includes the following technical changes with respect to the previous edition:<br/>
    a) Clause 1 - The scope has been modified to reflect that "appliance" in this document means recovery and/or recycle equipment to recover and/or recycle refrigerant from air-conditioning and refrigeration equipment;<br/>
    b) All other clauses were updated to reflect alignment with IEC 60335-1:2020 edition.<br/>
    This part 2 is to be used in conjunction with the latest edition of IEC 60335-1 and its amendments unless that edition precludes it; in that case, the latest edition that does not preclude it is used. It was established on the basis of the sixth edition (2020) of that standard and its Amendment 1.
