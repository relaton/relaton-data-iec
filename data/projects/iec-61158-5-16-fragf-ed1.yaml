abstract:
- language: fr
  script: Latn
  content: 'L''IEC 61158-5-16:2007 définit les services fournis à l''utilisateur de FAL à la frontière entre l''utilisateur et la couche application du modèle de référence du bus de terrain, et la gestion des systèmes au niveau de la frontière entre la couche application et la gestion des systèmes selon le modèle de référence de bus de terrain. Elle spécifie la structure et les services de la couche application des bus de terrain, en conformité avec le Modèle de référence de base de l''OSI (ISO/CEI 7498) et la Structure de la couche application de l''OSI (ISO/CEI 9545). Cette première édition et les autres normes de la sous-série CEI 61158-5 annulent et remplacent la CEI 61158 5:2003. La présente édition de cette partie constitue un supplément technique. Cette partie et ses parties compagnes Type 16 remplacent aussi partiellement la CEI 61491:2002 qui est actuellement en cours de révision. La CEI 61491 sera éditée sous la forme d''un rapport technique. Elle comprend les changements suivants: suppression du précédent bus de terrain Type 6 en raison du manque de pertinence commerciale; ajout de nouveaux types de bus de terrain; division de la partie 5 de la troisième édition en parties multiples numérotées  5 2,  5 3,  La présente version bilingue (2014-06) correspond à la version anglaise monolingue publiée en 2007-12.'
