abstract:
- language: en
  script: Latn
  content: |-
    Specifies test methods and requirements for primary and secondary (rechargeable) lithium cells and batteries to ensure their safety during transport other than for recycling or disposal. 
    Has the status of a group safety publication in accordance with IEC Guide 104.
- language: fr
  script: Latn
  content: |-
    Spécifie les méthodes d'essai et les exigences pour les éléments et les batteries de piles et d'accumulateurs au lithium afin de s'assurer de leur sécurité pendant les opérations de transport autres que celles relatives à leur recyclage ou leur mise au rebut.
    A la statut d'une publication groupée de sécurité conformément au Guide 104 de la CEI.
