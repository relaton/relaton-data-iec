abstract:
- language: en
  script: Latn
  content: |-
    IEC/TS 60034-27-2:2012(E) provides a common basis for:<br/>
    - measuring techniques and instruments;<br/>
    - the arrangement of the installation;<br/>
    - normalization and sensitivity assessment;<br/>
    - measuring procedures;<br/>
    - noise reduction;<br/>
    - the documentation of results;<br/>
    - the interpretation of results with respect to partial discharge on-line measurements on the stator winding insulation of non-converter driven rotating electrical machines with rated voltage of 3 kV and up. Keywords: rotating electrical machines
