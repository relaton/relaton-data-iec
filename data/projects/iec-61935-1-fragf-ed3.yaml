abstract:
- language: fr
  script: Latn
  content: La CEI 61935-1:2010 spécifie les procédures des mesures de référence pour les paramètres de câblage et les exigences pour la précision des appareils de contrôle sur le terrain pour mesurer les paramètres de câblage identifiés dans l'ISO/CEI 11801. Les références faites dans la présente norme à l'ISO/CEI 11801 renvoient à l'ISO/CEI 11801 ou à des normes de câblage équivalentes. Elle s'applique quand les câbles équipés sont constitués de câbles conformes à la famille des normes CEI 61156 et de matériel de connexion spécifié dans la famille de normes CEI 60603-7 ou dans la CEI 61076-3-104 et la CEI 61076-3-110. Cette troisième édition annule et remplace la deuxième édition parue en 2005, dont elle constitue une révision technique. Elle diffère de la deuxième édition en ce qu'elle contient des méthodes d'essai pour la diaphonie exogène (étrangère). Elle contient aussi une nouvelle annexe concernant l'incertitude et la variabilité des résultats d'essai sur le terrain. La présente version bilingue, publiée en 2010-07, correspond à la version anglaise.
