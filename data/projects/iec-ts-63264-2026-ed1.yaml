abstract:
- language: en
  script: Latn
  content: |-
    IEC TS 63264:2026 applies to composite insulators equipped with optical fibres (fibre optic element), consisting of a load-bearing insulating core or tube, a housing (surrounding the insulating core) made of polymeric material, a fibre optic element integrated into the core or housing, or embedded in a filling media inside the inner volume of a hollow core, and end fittings permanently attached to the insulating core.<br/>
    The object of this document is to<br/>
    - define the terms used,<br/>
    - specify additional test methods and provide additions and modifications to tests referred,<br/>
    - specify acceptance criteria.<br/>
    This document is to be used in addition to the respective product standard applicable to the product, application and design to which the fibre optic element has been added. Furthermore, this document does not include requirements dealing with the choice of insulators for specific operating conditions or environments.
