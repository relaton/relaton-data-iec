abstract:
- language: en
  script: Latn
  content: |-
    Specifies requirements for the safety of multifunction patient monitoring equipment.

    The scope of this standard is restricted to equipment having either more than one applied part or more than one single function, intended for connection to a single patient.

    This is the bilingual version of the English version published in July 2001.
- language: fr
  script: Latn
  content: |-
    Spécifie des exigences de sécurité pour les appareils de surveillance multifonction des patients.

    Le domaine d'application de la présente norme est restreint aux appareils qui comportent soit plusieurs parties appliquées, soit plusieurs fonctions uniques, destinés à la connexion à un patient unique.

    C'est la version bilingue de la version anglaise publiée en Juillet 2001.
