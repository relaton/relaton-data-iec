- language: en
  script: Latn
  content: IEC 62629-1-2:2013 provides a list of the terminologies that are frequently used in describing 3D display technologies in the IEC 62629 series. Terms for various 3D display technologies on stereoscopic, autostereoscopic, volumetric, and holographic displays are included.
- language: fr
  script: Latn
  content: La CEI 62629-1-2:2013 fournit une liste des terminologies fréquemment utilisées pour décrire les technologies d'affichage 3D dans la série CEI 62629. Les termes relatifs aux diverses technologies d'affichage 3D portant sur les écrans stéréoscopiques, autostéréoscopiques, volumétriques et holographiques sont inclus.
