abstract:
- language: en
  script: Latn
  content: |-
    IEC 60715:2017 specifies dimensional and functional requirements for the compatible mounting of switchgear, controlgear and accessories on some types of rails.<br/>
    This second edition cancels and replaces the first edition published in 1981 and Amendment 1:1995. This edition constitutes a technical revision.<br/>
    This edition includes the following significant technical changes with respect to the previous edition:<br/>
    a) the electrical function of the rail for protective earthing is covered by the relevant product standard.<br/>
    b) the document has been editorially updated to bring it into compliance with the ISO/IEC Directives, Part 2:2016, and drawings have been updated to bring them in compliance with ISO tolerancing and drawing standards.<br/>
    It has the status of a horizontal standard in accordance with IEC Guide 108.
- language: fr
  script: Latn
  content: |-
    IEC 60715:2017 spécifie les exigences dimensionnelles et fonctionnelles destinées à assurer la compatibilité du montage des appareillages et de leurs accessoires sur certains types de profilés-supports.<br/>
    Cette deuxième édition annule et remplace la première édition parue en 1981 et l'Amendement 1:1995. Cette édition constitue une révision technique.<br/>
    Cette édition inclut les modifications techniques majeures suivantes par rapport à l'édition précédente:<br/>
    a) la fonction électrique de conducteur de protection du profilé-support est couverte par la norme de produit correspondante.<br/>
    b) Le document a fait l’objet d’une mise à jour éditoriale visant à le rendre conforme aux Directives ISO/IEC, Partie 2:2016 et les dessins ont fait l’objet d’une mise à jour afin d’être conformes aux normes ISO de tolérancement et de dessin.<br/>
    Elle a le statut de norme horizontale conformément au Guide IEC 108.
