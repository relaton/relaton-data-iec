abstract:
- language: en
  script: Latn
  content: |-
    Describes a method for calculating the minimum approach distances for live working, at maximum voltages between 72,5 kV and 800 kV. This standard addresses system overvoltages, and the working air distances between parts and/or workers at different potentials.

    The required withstand voltage and minimum approach distances calculated by the method described in this standard are evaluated taking into consideration the following:

    - workers are trained for, and skilled in, working in the live working zone;

    - the anticipated overvoltages do not exceed the value selected for the determination of the required minimum approach distance;

    - transient overvoltages are the determining overvoltages;

    - tool insulation has no continuous film of moisture present on the surface;

    - no lightning is seen or heard within 10 km of the work site;

    - allowance is made for the effect of conducting components of tools;

    - the effect of altitude on the electric strength is taken into consideration.

    For conditions other than the above, the evaluation of the minimum approach distances may require specific data, derived by other calculation or obtained from additional laboratory investigations on the actual situation.

    The contents of the corrigenda of May 2005 and November 2006 have been included in this copy.
- language: fr
  script: Latn
  content: |-
    Décrit une méthode de calcul des distances minimales d'approche pour des travaux sous tension réalisés à des tensions maximales comprises entre 72,5 kV et 800 kV. Cette norme traite des surtensions de réseau et des distances de travail dans l'air entre des pièces et/ou des travailleurs à des potentiels différents. 

    La tension de tenue requise et les distances minimales d'approche calculées suivant la méthode décrite dans cette norme sont évaluées en prenant en compte ce qui suit:

    - les travailleurs sont formés et qualifiés pour travailler dans la zone de travail sous tension;

    - les surtensions attendues ne dépassent pas la valeur choisie pour la détermination de la distance minimale d'approche requise;

    - les surtensions transitoires sont les surtensions déterminantes;

    - l'isolation des outils ne présente pas sur la surface un film continu d'humidité;

    - aucun éclair n'est vu ni entendu à moins de 10 km du lieu de travail;

    - l'influence des parties conductrices des outils est prise en compte;

    - l'effet de l'altitude sur la tenue électrique est pris en compte.

    Pour des conditions autres que celles ci-dessus, l'évaluation des distances minimales d'approche peut exiger des données spécifiques, provenant d'autres calculs ou obtenues à partir d'études additionnelles en laboratoire sur la situation concrète.

    Le contenu des corrigenda de mai 2005 et novembre 2006 a été pris en considération dans cet exemplaire.
