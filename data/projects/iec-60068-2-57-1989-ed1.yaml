  content: Décrit une méthode d'essai applicable aux composants, matériels et autres produits électrotechniques qui peuvent, pendant leur utilisation, être soumis à des sollicitations dynamiques de caractère aléatoire et de durée brève, comme celles qui résultent d'un séisme, d'une explosion, de certaines phases de transport.
