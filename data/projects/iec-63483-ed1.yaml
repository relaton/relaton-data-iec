abstract:
- language: en
  script: Latn
  content: |-
    IEC 60601-2-44:2026 is applicable to spectral image types based on data provided by a CT scanner that conforms to IEC 60601-2-44 . The spectral images can be generated either on the CT scanner or with separate software.<br/>
    The purpose of this document is to provide selected methods and metrics for evaluation of imaging performance associated with the following spectral image type (if available):<br/>
    – conventional image;<br/>
    – virtual monoenergetic image;<br/>
    – virtual non contrast image;<br/>
    – iodine image;<br/>
    – electron density image.<br/>
    NOTE The methods presented in this document do not provide comprehensive technical performance evaluation of CT spectral imaging.<br/>
    The results obtained using the methods of this document do not replace CT spectral imaging performance specifications and testing protocols as provided by the manufacturer.<br/>
    This document does not specify performance criteria for acceptance testing or constancy testing, nor does it specify requirements for manufacturers to provide such criteria. However, manufacturers can provide performance data, quality assurance test criteria, or both according to the methods described in this document.<br/>
    Additionally, phantom requirements are specified accordingly.<br/>
    Spectral image types not listed above are not covered by this document, as explained in Annex D.
