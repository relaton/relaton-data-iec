abstract:
- language: en
  script: Latn
  content: |-
    IEC 62645:2019 establishes requirements and provides guidance for the development and management of effective computer security programmes for I&amp;C programmable digital systems. Inherent to these requirements and guidance is the criterion that the power plant I&amp;C programmable digital system security programme complies with the applicable country’s requirements.<br/>
    This document defines adequate measures for the prevention of, detection of and reaction to malicious acts by digital means (cyberattacks) on I&amp;C programmable digital systems. This includes any unsafe situation, equipment damage or plant performance degradation.<br/>
    This second edition cancels and replaces the first edition published in 2014. This edition includes the following significant technical changes with respect to the previous edition:<br/>
    a) to align the standard with the new revisions of ISO/IEC 27001;<br/>
    b) to review the existing requirements and to update the terminology and definitions;<br/>
    c) to take account of, as far as possible, requirements associated with standards published since the first edition;<br/>
    d) to take into account the fact that cybersecurity techniques, but also national practices evolve.
- language: fr
  script: Latn
  content: |-
    L’IEC 62645:2019 établit des exigences et fournit des recommandations pour le développement et la gestion des programmes de sécurité informatique des systèmes numériques programmables d’I&amp;C. Le critère de conformité du programme de sécurité des systèmes numériques programmables d’I&amp;C de la centrale nucléaire aux exigences nationales applicables est inhérent aux exigences et recommandations du présent document.<br/>
    Le présent document définit les mesures adéquates pour ce qui concerne la prévention, la détection et la réaction à des actes malveillants, réalisés en utilisant des moyens informatiques (cyberattaques), portant atteinte aux systèmes numériques programmables d’I&amp;C. Ceci comprend les situations non sûres, les endommagements d’équipements ou la dégradation des performances.<br/>
    Cette deuxième édition annule et remplace la première édition parue en 2014. Cette édition inclut les modifications techniques majeures suivantes par rapport à l'édition précédente:<br/>
    a) aligner la norme sur les nouvelles révisions de l’ISO/IEC 27001;<br/>
    b) passer en revue les exigences existantes et mettre à jour la terminologie et les définitions;<br/>
    c) prendre en compte, autant que possible, les exigences associées aux normes publiées depuis la parution de la première édition;<br/>
    d) prendre en compte le fait que les techniques de cybersécurité, mais aussi les pratiques nationales évoluent.
