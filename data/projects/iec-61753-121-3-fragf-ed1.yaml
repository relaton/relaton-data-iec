abstract:
- language: fr
  script: Latn
  content: La CEI 61753-121-3 :2010 spécifie les exigences relatives aux essais appliqués aux cordons finis utilisés en tant que cordons de brassage, cordons de zone de travail et cordons d'équipement, en vue d'applications dans un environnement non contrôlé (U) conformément à la CEI 61753-1, là où les connecteurs sont déjà conformes, conjointement avec les exigences de la catégorie U de la CEI 61753-1. Les ensembles sont constitués de câbles à fibres optiques simplex ou duplex munis à chaque extrémité du câble de connecteurs à fibres optiques unimodales polies sans angle (PC) ou à angle (APC), comportant des férules cylindriques. La longueur d'onde de fonctionnement est comprise entre 1 260 nm et 1 625 nm.
