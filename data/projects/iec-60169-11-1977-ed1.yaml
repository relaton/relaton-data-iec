abstract:
- language: en
  script: Latn
  content: This standard concerns r.f. coaxial connectors for use with r.f. cables, both flexible and semi-rigid, with air dielectric interface and high mechanical stability to withstand severe environmental exposure. The connectors provide low reflection in the microwave region up to 14 GHz and they are watertight and air-tight against a pressure difference of 3 bar.
- language: fr
  script: Latn
  content: Concerne les connecteurs coaxiaux pour fréquences radioélectriques pouvant être utilisés avec des câbles pour fréquences radioélectriques, soit souples, soit semi-rigides, et ayant des interfaces à diélectrique air et une haute stabilité mécanique pour résister à des conditions d'environnement sévères. Les connecteurs ont un coefficient de réflexion faible dans la région des hyperfréquences jusqu'à 14 GHz et ils sont étanches à l'eau et à l'air jusqu'à une différerice de pression de 3 bar.
