abstract:
- language: en
  script: Latn
  content: |-
    Applies to dielectric tests with direct voltage, dielectric tests with alternating voltage; dielectric tests with impulse voltage and impulse current, and tests with combinations of these.

    The contents of the corrigendum of March 1992 have been included in this copy.
- language: fr
  script: Latn
  content: |-
    S'applique aux essais diélectriques en tension continue, aux essais diélectriques en tension alternative, aux essais diélectriques en tension de choc, aux essais en courant de choc et aux essais combinant les essais ci-dessus.

    Le contenu du corrigendum de mars 1992 a été pris en considération dans cet exemplaire.
