abstract:
- language: en
  script: Latn
  content: |-
    Instrumentation and control (I&amp;C) systems important to safety may be implemented using conventional hard-wired equipment, computer-based (CB) equipment or by using a combination of both types of equipment (see Note 1). IEC 61513:2011 provides requirements and recommendations for the overall I&amp;C architecture which may contain either or both technologies. The main technical changes with regard to the previous edition are as follows:<br/>
    - alignment with the latest revisions of IAEA documents;<br/>
    - alignment with new editions of IEC 60880, IEC 61226, IEC 62138, IEC 62340 and IEC 60987;<br/>
    - alignment with significant advances of software engineering techniques;<br/>
    - integration of requirements for staff training.
- language: fr
  script: Latn
  content: |-
    Les systèmes d'I&amp;C importants pour la sûreté peuvent être réalisés à l'aide de composants traditionnels câblés, de composants informatiques ou d'une combinaison des deux. La CEI 61513:2011 fait état des exigences et des recommandations relatives à l'architecture d'ensemble de l'I&amp;C incluant l'une ou l'autre de ces technologies ou les deux. Les principaux changements techniques par rapport à l'édition précédente sont les suivants:<br/>
    - mise en cohérence avec les nouvelles éditions des documents de l'AIEA;<br/>
    - prise en compte des dernières éditions des normes CEI 60880, CEI 61226, CEI 62138, CEI 62340 et CEI 60987;<br/>
    - prise en compte de progrès significatifs des techniques de génie logiciel;<br/>
    - intégration des exigences relatives à la formation du personnel.
