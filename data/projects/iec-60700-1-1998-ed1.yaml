abstract:
- language: en
  script: Latn
  content: |-
    Applies to thyristor valves with metal oxide surge arresters 
    directly connected between the valve terminals, for use in a line 
    commuted commutated converter for high voltage d.c. power 
    transmission or as part of a back-to-back link. Retricted to 
    electrical type and production tests. Tests are based on air
    insulated valves.
- language: fr
  script: Latn
  content: |-
    S'applique aux valves à thyristors équipées de parafoudres à oxyde 
    métallique directement connectés entre les bornes des valves, qui 
    sont destinées à être utilisées au niveau d'un convertisseur commuté par le réseau pour le transport d'énergie en courant continu à haute tension ou dans une liaison en opposition. Limitée aux essais de type électrique et de série. Les essais sont basés sur des valves isolées par l'air.
