- language: en
  script: Latn
  content: Specifies the general requirements for the measurement of radio-frequency emissions emanating from measuring relays and protection equipment for power system protection, including the control, monitoring and process interface equipment used with such systems. Is based on CISPR 22.
- language: fr
  script: Latn
  content: Spécifie les prescriptions générales pour la mesure des émissions de fréquence radio provenant des relais de mesure et dispositifs de protection des systèmes électriques comprenant les équipements de commande, de contrôle et d'interface utilisés dans ces systèmes. Est basée sur le CISPR 22.
