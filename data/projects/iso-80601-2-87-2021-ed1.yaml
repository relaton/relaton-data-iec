    Le présent document s'applique à la sécurité de base et aux performances essentielles d'un ventilateur à haute fréquence (HFV) associé à ses accessoires, ci-après désignés par appareil EM:<br/>
    - prévu pour une utilisation dans un environnement qui fournit des soins spécialisés aux patients dont l'état de santé peut mettre leur vie en danger et qui peuvent exiger des soins complets et une surveillance constante dans un établissement de soins professionnel;<br/>
    NOTE 1 Pour les besoins du présent document, un environnement de cette nature est appelé «environnement de soins intensifs». Les ventilateurs à haute fréquence pour un tel environnement sont considérés comme essentiels au maintien de la vie.<br/>
    NOTE 2 Pour les besoins du présent document, un tel ventilateur à haute fréquence peut être associé au transport à l'intérieur d'un établissement de soins professionnel (c'est-à-dire être un ventilateur opérationnel en déplacement).<br/>
    NOTE 3 Un ventilateur à haute fréquence destiné à être utilisé lors de transports à l'intérieur d'un établissement de soins professionnel n'est pas considéré comme un ventilateur pour l'environnement des services médicaux d'urgence.<br/>
    - prévu pour être utilisé par un opérateur professionnel de soins de santé;<br/>
    - prévu pour les patients qui nécessitent différents niveaux d'aide par ventilation artificielle, y compris les patients ventilo-dépendants; et<br/>
    - capable d'assurer plus de 150 insufflations/min.<br/>
    Il existe trois dénominations principales pour désigner les systèmes HFV:<br/>
    - ventilation à haute fréquence par percussion [HFPV, avec une fréquence HFV type de (60 à 1 000) insufflations HFV/min];<br/>
    - jet-ventilation à haute fréquence [HFJV, avec une fréquence HFV type de (100 à 1 500) insufflations HFV/min]; et<br/>
    - ventilation par oscillations à haute fréquence [HFOV, avec une fréquence HFV type de (180 à 1 200) insufflations HFV/min et généralement dotée d'une phase expiratoire active].<br/>
    En outre, les dénominations des systèmes HFV peuvent être associées ensemble ou avec une ventilation à des fréquences inférieures à 150 insufflations/min.<br/>
    * Un ventilateur à haute fréquence n'est pas considéré comme un système physiologique de commande en boucle fermée, à moins qu'il n'utilise une variable physiologique du patient pour ajuster les paramètres de traitement par ventilation.<br/>
    Le présent document s'applique également aux accessoires conçus par leur fabricant pour être raccordés à un système respiratoire HFV ou à un ventilateur à haute fréquence, lorsque les caractéristiques de ces accessoires peuvent affecter la sécurité de base ou les performances essentielles du ventilateur à haute fréquence.<br/>
    Si un article ou un paragraphe est spécifiquement destiné à être applicable uniquement aux appareils EM ou uniquement aux systèmes EM, le titre et le contenu de cet article ou de ce paragraphe l'indiquent. Si cela n'est pas le cas, l'article ou le paragraphe s'applique à la fois aux appareils EM et aux systèmes EM, selon le cas.<br/>
    Les dangers inhérents à la fonction physiologique prévue des appareils EM ou des systèmes EM dans le cadre du domaine d'application du présent document ne sont pas couverts par des exigences spécifiques contenues dans le présent document, à l'exception des alinéas 7.2.13 et 8.4.1 de l'IEC 60601-1:2005.<br/>
    NOTE 4 Des informations supplémentaires sont disponibles en 4.2 de l'IEC 60601-1:2005+AMD1:2012.<br/>
    Le présent document ne s'applique pas aux appareils EM uniquement destinés à augmenter la ventilation des patients respirant spontanément au sein d'un établissement de soins professionnel.<br/>
    Le présent document ne spécifie pas les exigences relatives aux:<br/>
    - ventilateurs n'offrant pas de fonction à haute fréquence, ni à leurs accessoires, qui assurent une ventilation classique dans un environnement de soins intensifs, car ces exigences sont données dans l'ISO 80601-2-12 [23];<br/>
    NOTE 5 Un système HFV peut proposer des modes de fonctionnement de ventilateur classiques en soins intensifs, l'ISO 80601-2-12 s'appliquant à ces modes.<br/>
    - ventilateurs ou accessoires prévus pour les applications en anesthésie, car ces exigences sont données dans l'ISO 80601-2-13 [24];<br/>
    - ventilateurs ou accessoires destinés à être utilisés dans l'environnement des services médicaux d'urgence, car ces exigences sont données dans l'ISO 80601-2-84 qui remplace l'ISO 10651-3 [13];<br/>
    NOTE 6 Un système HFV peut comprendre des fonctions de ventilateur SMU.<br/>
    - ventilateurs ou accessoires pour patients ventilo-dépendants dans l'environnement des soins à domicile, car ces exigences sont données dans l'ISO 80601-2-72 [26];<br/>
    - ventilateurs ou accessoires prévus pour les dispositifs d'assistance respiratoire à domicile, car ces exigences sont données dans l'ISO 80601-2-79 [27] et l'ISO 80601-2-80 [28] qui remplacent l'ISO 10651-6 [15];<br/>
    - appareils EM de traitement respiratoire de l'apnée du sommeil, car ces exigences sont données dans l'ISO 80601-2-70 [25];<br/>
    - appareils EM délivrant une pression positive bidirectionnelle des voies aériennes (bi-PAP);<br/>
    - appareils EM délivrant une pression positive continue des voies aériennes (PPC);<br/>
    - appareils EM de traitement respiratoire à haut débit, indiqués dans l'ISO 80601-2-90:1); et<br/>
    - appareils de ventilation de type «cuirasse» ou «poumon d'acier».<br/>
    Le présent document est une norme particulière des séries IEC 60601, IEC 80601 et ISO 80601.<br/>
