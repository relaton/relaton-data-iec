- language: en
  script: Latn
  content: IEC/TS 60815-3:2008(E) is applicable to the selection of polymer insulators for a.c. systems, and the determination of their relevant dimensions, to be used in high voltage systems with respect to pollution. This part of IEC/TS 60815 gives specific guidelines and principles to arrive at an informed judgement on the probable behaviour of a given insulator in certain pollution environments.
