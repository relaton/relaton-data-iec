abstract:
- language: en
  script: Latn
  content: |-
    IEC 62656-1:2014 specifies the logical structure for a set of spreadsheets, used as "data parcels", to define, transfer and register product ontologies. The spreadsheet interface structure defined in this part of IEC 62656 contains the following:<br/>
    - Definition and specification of the logical structure and layout of the spreadsheet interface for definition, transfer, and registering of a reference dictionary;<br/>
    - Definition and specification of library instance data belonging to a class of a reference dictionary described by a set of spreadsheets conformant to this part of IEC 62656;<br/>
    - Definition and specification of the meta dictionary that enables the definition and transfer of a reference dictionary as a set of instance data conforming to the meta dictionary;<br/>
    - Definition and specification of the meta-model as data that enables the definition and transfer of a reference dictionary as a set of instance data conforming to the meta-meta-dictionary;<br/>
    - Specification of the mapping between the dictionary data expressed in the spreadsheet format and the EXPRESS model specified by IEC 61360-2/ISO 13584-42 (with some elements of ISO 13584-25);<br/>
    - Description of the basic semantic mapping between the dictionary data expressed in the spreadsheet formats defined in this part of IEC 62656 and that of DIN 4002.
- language: fr
  script: Latn
  content: |-
    L'IEC 62656-1:2014 spécifie la structure logique pour un ensemble de tableurs, utilisés comme "paquets de données", pour définir, transférer et enregistrer les ontologies de produits. La structure de l'interface du tableur définie dans la présente partie de l'IEC 62656 contient les éléments suivants:<br/>
    - la définition et la spécification de la structure logique et la mise en page de l'interface du tableur pour la définition, le transfert et l'enregistrement d'un dictionnaire de référence;<br/>
    - la définition et la spécification des données d'instances des bibliothèques appartenant à une classe d'un dictionnaire de référence qui est décrite par un ensemble de tableurs conformément à la présente partie de l'IEC 62656;<br/>
    - la définition et la spécification d'un méta-dictionnaire qui permet la définition et le transfert d'un dictionnaire de référence en tant qu'ensemble de données d'instances conforme au méta-dictionnaire;<br/>
    - la définition et la spécification du méta-modèle en tant que données et qui permet la définition et le transfert d'un dictionnaire de référence en tant qu'ensemble de données d'instances conforme au méta-méta-dictionnaire;<br/>
    - la spécification de la correspondance entre les données du dictionnaire exprimées en format tableur et le modèle EXPRESS spécifié par les normes IEC 61360-2/ISO 13584-42 (avec quelques éléments de l'ISO 13584-25);<br/>
    - la description de la correspondance sémantique de base entre les données du dictionnaire exprimées en formats de tableur définies dans la présente partie de l'IEC 62656 et celles définies dans la DIN 4002.
