abstract:
- language: en
  script: Latn
  content: |-
    IEC 61158-6-21:2019 is one of a series produced to facilitate the interconnection of automation system components. It is related to other standards in the set as defined by the three-layer fieldbus reference model described in IEC 61158-1.<br/>
    This International Standard contains material specific to the Type 21 communication protocol.
- language: fr
  script: Latn
  content: |-
    L’IEC 61158-6-21:2019 appartient à une série élaborée pour faciliter l’interconnexion des composants des systèmes d’automatisation. Elle est liée à d'autres normes de la série telle que définie par le modèle de référence des bus de terrain "à trois couches" décrit dans l’IEC 61158‑1.<br/>
    La présente Norme internationale contient des éléments spécifiques au protocole de communication de Type 21.
