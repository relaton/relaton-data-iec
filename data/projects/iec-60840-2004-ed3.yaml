abstract:
- language: en
  script: Latn
  content: |-
    Specifies test methods and requirements for power cable systems for fixed installations, for rated voltages above 30 kV (Um = 36 kV) up to and including 150 kV (Um = 170 kV). It also separately covers cables and accessories.
    The requirements apply to single-core cables and to individually screened three-core cables and to their accessories for usual conditions of installation and operation, but not to special cables and their accessories, such as submarine cables, for which modifications to the standard tests may be necessary or special test conditions may need to be devised.
    This standard does not cover transition joints between cables with extruded insulation and paper insulated cables.
    Some countries have suggested that a better discrimination be made between systems, cables and accessories, particularly for the lower voltages of the scope, e.g. 45 kV. This has been taken into account in this revision, which gives the type approval requirements and the range of approvals for
    a) cable systems; 
    b) cables alone; 
    c) accessories alone.
    Manufacturers and users may choose the most appropriate option for type approval.
- language: fr
  script: Latn
  content: |-
    Spécifie les exigences et méthodes d'essai applicables aux systèmes de câbles d'énergie pour installations fixes, pour des tensions assignées supérieures à 30 kV (Um = 36 kV) et jusqu'à 150 kV (Um = 170 kV) compris. Elle couvre aussi séparément câbles et accessoires.
    Les exigences sont applicables aux câbles unipolaires, aux câbles tripolaires à écran individuel et à leurs accessoires, pour des conditions habituelles d'installation et de fonctionnement, mais ne le sont pas à des câbles spéciaux et à leurs accessoires, comme les câbles sous-marins, pour lesquels il peut être nécessaire d'apporter des modifications aux essais normaux ou d'élaborer des conditions d'essai particulières.
    Les jonctions assurant le raccordement des câbles à isolant extrudé aux câbles isolés au papier ne sont pas couvertes par la présente norme. 
    Certains pays ont suggéré qu'une meilleure distinction devrait être faite entre système, câbles, et accessoires, plus particulièrement pour les tensions les plus basses du domaine d'application, par exemple 45 kV. Cela a été pris en considération dans cette révision, qui donne les exigences d'acceptation de type et l'étendue de celle-ci pour
    a) les systèmes de câble,
    b) les câbles seuls,
    c) les accessoires seuls.
    Les fabricants et utilisateurs sont invités à choisir l'option la plus appropriée pour l'acceptation de type.
