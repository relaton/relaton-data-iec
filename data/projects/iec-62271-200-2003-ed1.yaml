abstract:
- language: en
  script: Latn
  content: |-
    Specifies requirements for factory-assembled metal-enclosed switchgear and controlgear for alternating current of rated voltages above 1 kV and up to and including 52 kV for indoor and outdoor installation, and for service frequencies up to and including 60 Hz. Enclosures may include fixed and removable components and may be filled with fluid (liquid or gas) to provide insulation.
    This standard defines several types of metal enclosed switchgear and controlgear which differ due to
    - the consequences on network service continuity in case of maintenance on the switchgear and controlgear;
    - the need and convenience of maintenance of the equipment.
    For metal-enclosed switchgear and controlgear containing gas-filled compartments, the design pressure is limited to a maximum of 300 kPa (relative pressure). 
    Metal-enclosed switchgear and controlgear for special use, for example, in flammable atmospheres, in mines or on board ships, may be subject to additional requirements.
    Components contained in metal-enclosed switchgear and controlgear are to be designed and tested in accordance with their various relevant standards. This standard supplements the standards for the individual components regarding their installation in switchgear and controlgear assemblies. 
    This standard does not preclude that other equipment may be included in the same enclosure. In such a case, any possible influence of that equipment on the switchgear and controlgear is to be taken into account.
    This first edition of IEC 62271-200 cancels and replaces the third edition of IEC 60298, published in 1990, and constitutes a technical revision.
    Significant technical changes from the third edition of IEC 60298 are as follows:
    This revised document has been basically changed to be updated to today's use of high- voltage switchgear and controlgear up to 52 kV. The main changes are: new definitions and classification of equipment, introduction of internal arc classes (IAC) and its testing.
    This standard is to be read in conjunction with IEC 60694 published in 1996. Clause numbering follows the clause numbering of that standard. Additional subclauses, as they relate to a particular clause or subclause from IEC 60694, are numbered 101, 102, etc.
- language: fr
  script: Latn
  content: |-
    Spécifie les exigences pour l'appareillage préfabriqué sous enveloppe métallique pour courant alternatif, prévu pour être installé à l'intérieur et à l'extérieur, pour des tensions assignées supérieures à 1 kV et inférieures ou égales à 52 kV et pour des fréquences de service inférieures ou égales à 60 Hz. Les enveloppes peuvent contenir des composants fixes et amovibles et peuvent être remplies de fluide (liquide ou gaz) pour assurer l'isolation.
    Cette norme définit plusieurs types d'appareillage sous enveloppe métallique qui diffèrent par
    - les conséquences sur la continuité de service en cas de maintenance sur l'appareillage;
    - les besoins et la facilité de maintenance des équipements.
    Pour l'appareillage sous enveloppe métallique comprenant des compartiments à remplissage de gaz, la pression effective de calcul est limitée à un maximum de 300 kPa (pression relative). 
    L'appareillage sous enveloppe métallique destiné à une utilisation spéciale, par exemple pour atmosphères inflammables, dans les mines ou à bord des navires, peut faire l'objet d'exigences complémentaires.
    Il faut que les matériels compris dans l'appareillage sous enveloppe métallique soient conçus et essayés suivant leurs différentes normes respectives. La présente norme complète les normes des matériels spécifiques, concernant leur installation dans les ensembles d'appareillage.
    Cette norme n'interdit pas que d'autres équipements puissent être incorporés dans la même enveloppe. Dans de tels cas, il faut tenir compte de l'influence de ces équipements sur l'appareillage. 
    Cette première édition de la CEI 62271-200 annule et remplace la troisième édition de la CEI 60298 parue en 1990 dont elle constitue une révision technique.
    Cette édition inclut les modifications techniques majeures suivantes par rapport à la troisième édition de la CEI 60298:
    Le fondement des modifications de ce document révisé consiste en la prise en compte du mode d'utilisation actuel de l'appareillage haute tension de moins de 52 kV. Les changements principaux sont les nouvelles définitions et la classification des équipements, l'introduction d'une classification arc interne (IAC) avec les essais correspondants.
    Cette norme doit être lue avec la CEI 60694 parue en 1996. La numérotation des articles suit celle de cette norme. Les paragraphes supplémentaires, qui traitent d'articles ou de paragraphes particuliers de la CEI 60694, sont numérotés 101, 102, etc.
