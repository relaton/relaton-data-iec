  content: L'IEC 60738-1-3:2008 est un document annexe à la spécification générique qui contient des exigences pour le modèle, la disposition et le contenu minimal des spécifications particulières. Les spécifications particulières ne répondant pas à ces règles ne doivent pas être considérées conformes aux spécifications de la CEI et ne doivent pas  être déclarées comme telles. Dans la préparation de la spécification particulière, le contenu de 1.4 de la CEI 60738-1:2006, doit être pris en compte. Cette édition contient des modifications des paragraphes référencés de la spécification générique révisée CEI 60738-1.
