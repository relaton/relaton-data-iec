abstract:
- language: en
  script: Latn
  content: Specifies safety and construction requirements for liquid cooling systems intended to cool torches. These liquid cooling systems can be internal or external to power sources for arc welding and allied processes.
- language: fr
  script: Latn
  content: Spécifie les exigences de sécurité et de construction des systèmes de refroidissement par liquide destinés à refroidir des torches. Ces systèmes de refroidissement par liquide peuvent être positionnés de manière interne ou externe aux sources de courant de soudage pour le soudage à l'arc et les techniques connexes.
