abstract:
- language: en
  script: Latn
  content: IEC 60940:2015 provides guidance applicable to information on application of capacitors, resistors, inductors, and complete filter units for electromagnetic interference suppression. This second edition cancels and replaces the first edition published in 1988. This second edition is a result of maintenance activities related to the previous edition. All changes that have been agreed upon can be categorized as minor revisions.
- language: fr
  script: Latn
  content: L'IEC 60940:2015 constitue un guide d'emploi des condensateurs, résistances, inductances et filtres complets d'antiparasitage. Cette deuxième édition annule et remplace la première édition parue en 1988. Cette deuxième édition est le résultat des activités de maintenance relatives à l'édition précédente. Toutes les modifications ayant fait l'objet d'un accord peuvent être considérées comme des révisions mineures.
