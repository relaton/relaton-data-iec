abstract:
- language: fr
  script: Latn
  content: La CEI 60794-3-40:2008 est une spécification de famille qui s'applique aux câbles en égouts et aux conduites, installés par soufflage et/ou tirage dans les évacuations d'eaux pluviales et sanitaires non accessibles par l'homme, elle s'applique également aux égouts et aux conduits secondaires accessibles par l'homme. Les systèmes intégrant des éléments couverts par la présente norme sont soumis aux exigences de la spécification intermédiaire CEI 60794-3. La présente norme doit être utilisée conjointement à la CEI 60794-1-1, la CEI 60794-1-2 et la CEI 60794-3.
