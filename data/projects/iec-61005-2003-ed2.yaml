abstract:
- language: en
  script: Latn
  content: Specifies requirements for the performance characteristics of neutron ambient dose equivalent (rate) meters, and prescribes the methods of testing in order to determine compliance with this standard. Specifies general characteristics, general test procedures, radiation characteristics, electrical, mechanical, safety and environmental characteristics, and also the identification certificate
- language: fr
  script: Latn
  content: Spécifie les caractéristiques exigées pour les instruments de mesure de l'équivalent de dose ambiant neutron (ou du débit) et décrit les méthodes d'essai mises en oeuvre pour démontrer la conformité à cette norme. Spécifie les caractéristiques générales, les procédures générales d'essai, les caractéristiques sous rayonnement, électriques, mécaniques, les caractéristiques de sécurité et environnementales et le certificat d'identification
