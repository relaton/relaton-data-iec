abstract:
- language: fr
  script: Latn
  content: La CEI 62453-309:2009 fournit des informations sur l'intégration de la technologie HART® dans l'interface du FDT (CEI 62453-2). Elle spécifie la communication et d'autres services. La présente partie, conjointement aux autres parties de la première édition de la série CEI 62453, annule et remplace la CEI/PAS 62453-1, la CEI/PAS 62453-2, la CEI/PAS 62453-3, la CEI/PAS 62453-4 et la CEI/PAS 62453-5 publiées en 2006, et constitue une révision technique. La présente version bilingue (2013-07) correspond à la version anglaise monolingue publiée en 2009-06.
