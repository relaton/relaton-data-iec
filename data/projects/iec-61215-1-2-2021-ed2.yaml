abstract:
- language: en
  script: Latn
  content: |-
    IEC 61215-1-2:2021 lays down requirements for the design qualification of terrestrial photovoltaic modules suitable for long-term operation in open-air climates. The useful service life of modules so qualified will depend on their design, their environment and the conditions under which they are operated. Test results are not construed as a quantitative prediction of module lifetime. This document is intended to apply to all thin-film CdTe based terrestrial flat plate modules. As such, it addresses special requirements for testing of this technology supplementing IEC 61215-1:2021 and IEC 61215-2:2021 requirements for testing. This document defines PV technology dependent modifications to the testing procedures and requirements per IEC 61215-1:2021 and IEC 61215-2:2021. This second edition cancels and replaces the first edition of IEC 61215-1-2, issued in 2016. This edition includes the following significant technical changes with respect to the previous edition:<br/>
    a. A cyclic (dynamic) mechanical load test (MQT 20) added.<br/>
    b. A test for detection of potential-induced degradation (MQT 21) added.<br/>
    c. A bending test (MQT 22) for flexible modules added.
- language: fr
  script: Latn
  content: |-
    IEC 61215-1-2:2021 établit les exigences pour la qualification de la conception des modules photovoltaïques (PV) pour applications terrestres adaptés à une utilisation de longue durée dans les climats à l'air libre. La durée de vie utile des modules ainsi qualifiés dépend de leur conception, de leur environnement et de leurs conditions de fonctionnement. Les résultats d’essai ne sont pas considérés comme une prévision quantitative de la durée de vie des modules. Le présent document est destiné à s'appliquer à tous les modules à plaque plane au tellurure de cadmium (CdTe) à couches minces pour applications terrestres. À ce titre, il spécifie des exigences d'essai particulières à cette technologie en complément des exigences d'essai données dans l'IEC 61215-1:2021 et l'IEC 61215-2:2021. Le présent document définit les modifications dépendantes de la technologie photovoltaïque, apportées aux exigences et procédures d'essai de l'IEC 61215-1:2021 et de l'IEC 61215 2:2021. Cette deuxième édition annule et remplace la première édition de l'IEC 61215-1-2, parue en 2016. Cette édition inclut les modifications techniques majeures suivantes par rapport à l'édition précédente:<br/>
    a. Ajout d'un essai de charge mécanique (dynamique) cyclique (MQT 20).<br/>
    b. Ajout d'un essai de dégradation induite par le potentiel (MQT 21)<br/>
    c. Ajout d'un essai de flexion (MQT 22) dédié aux modules souples
