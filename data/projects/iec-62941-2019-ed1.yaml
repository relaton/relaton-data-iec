abstract:
- language: en
  script: Latn
  content: |-
    IEC 62941:2019 is applicable to organizations manufacturing photovoltaic (PV) modules certified to IEC 61215 series and IEC 62108 for design qualification and type approval and IEC 61730 for safety qualification and type approval. The design qualification and type approval of PV modules depend on appropriate methods for product and process design, as well as appropriate control of materials and processes used to manufacture the product. This document lays out best practices for product design, manufacturing processes, and selection and control of materials used in the manufacture of PV modules that have met the requirements of IEC 61215 series, IEC 61730, or IEC 62108. These standards also form the basis for factory audit criteria of such sites by various certifying and auditory bodies.<br/>
    The object of this document is to provide a framework for the improved confidence in the ongoing consistency of performance and reliability of certified PV modules. The requirements of this document are defined with the assumption that the quality management system of the organization has already fulfilled the requirements of ISO 9001 or equivalent quality management system. This document is not intended to replace or remove any requirements of ISO9001 or equivalent quality management system. By maintaining a manufacturing system in accordance with this document, PV modules are expected to maintain their performance as determined from the test sequences in IEC 61215 series, IEC 62108, or IEC 61730.
- language: fr
  script: Latn
  content: |-
    IEC 62941:2019 que aux organismes fabriquant des modules photovoltaïques (PV) certifiés au titre de la série IEC 61215 et de l'IEC 62108 pour la qualification de la conception et l'homologation et de l'IEC 61730 pour la qualification de la sûreté de fonctionnement et l'homologation. La qualification de la conception et l'homologation des modules PV reposent sur des méthodes appropriées de conception du produit et des processus, ainsi que sur une maîtrise adéquate des matériaux et procédés employés lors de la fabrication du produit. Le présent document établit les meilleures pratiques en ce qui concerne la conception des produits, les processus de fabrication, le choix et la maîtrise des matériaux utilisés dans la fabrication des modules PV satisfaisant aux exigences de la série IEC 61215, de l'IEC 61730 ou de l'IEC 62108. Ces normes constituent également la base des critères pour l'audit d'usine de ces sites par différents organismes de certification et d'audit.<br/>
    Le présent document a pour objectif de fournir un cadre en vue de renforcer la confiance en ce qui concerne la cohérence constante des performances et la fiabilité des modules PV certifiés. Les exigences du présent document sont définies en partant de l'hypothèse que le système de management de la qualité de l'organisme satisfait d'ores et déjà aux exigences de l'ISO 9001 ou d'un système de management de la qualité équivalent. Le présent document n'est pas destiné à remplacer ou à supprimer les exigences de d'ISO 9001 ou d'un système de management de la qualité équivalent. En respectant un système de fabrication conforme au présent document, il est attendu que les modules PV conservent leurs performances telles que déterminées par les séquences d'essais de la série IEC 61215, l'IEC 62108 ou l'IEC 61730.
