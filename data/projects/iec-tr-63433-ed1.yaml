  content: The standards mapping provides the relationship between communication standards and the necessary list of communication features of industrial networks that are aligned with the Communications Use Cases and Requirements TS (IEC 63539 ED1). The standards mapping could be used as the basis for a visual mapping tool that illustrates how communication standards are mapped on the communication features.
