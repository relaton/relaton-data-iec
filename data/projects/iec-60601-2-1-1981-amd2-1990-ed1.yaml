  script: Latn
  content: La première publication établissait des règles particulières pour la protection contre les rayonnements des accélérateurs en pratique médicale. Cette deuxième modification indique des méthodes d'essai pour les points pour lesquels un essai de sécurité radiologique est prescrit.
