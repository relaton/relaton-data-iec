abstract:
- language: en
  script: Latn
  content: |-
    The data-link layer provides basic time-critical messaging communications between devices in an automation environment.<br/>
    This protocol provides a means of connecting devices through a partial mesh network, such that most failures of an interconnection between two devices can be circumvented. In common practice the devices are interconnected in a non-redundant hierarchical manner reflecting application needs
- language: fr
  script: Latn
  content: |-
    La couche de liaison de données assure les communications de messagerie à contrainte de temps de base entre les appareils d'un environnement d'automatisation.<br/>
    Ce protocole fournit un moyen de connecter des appareils par le biais d'un réseau maillé partiel, de sorte que la plupart des défaillances d'une interconnexion entre deux appareils peuvent être contournées. Les appareils sont généralement interconnectés d'une manière hiérarchique non redondante qui reflète les besoins de l'application.
