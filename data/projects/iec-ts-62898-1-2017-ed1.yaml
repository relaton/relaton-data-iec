abstract:
- language: en
  script: Latn
  content: |-
    IEC TS 62898-1:2017(E) provides guidelines for microgrid projects planning and specification. Microgrids considered in this document are alternating current (AC) electrical systems with loads and distributed energy resources (DER) at low or medium voltage level. This document does not cover direct current (DC) microgrids.<br/>
    Microgrids are classified into isolated microgrids and non-isolated microgrids. Isolated microgrids have no electrical connection to a wider electric power system. Non-isolated microgrids can act as controllable units to the electric power system and can operate in the following two modes:<br/>
    - grid-connected mode;<br/>
    - island mode.<br/>
    This document will cover the following areas:<br/>
    - microgrid application, resource analysis, generation forecast, and load forecast;<br/>
    - DER planning and microgrid power system planning;<br/>
    - high level technical requirements for DER in microgrids, for microgrid connection to the distribution system, and for control, protection and communication systems;<br/>
    - evaluation of microgrid projects.
