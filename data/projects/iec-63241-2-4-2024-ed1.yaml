abstract:
- language: en
  script: Latn
  content: |-
    IEC 63241-2-4:2024 supplements or modifies the corresponding clauses in IEC 63241-1, so as to convert it into the IEC Standard: Electric motor-operated tools – Dust measurement procedure - Particular requirements for hand-held sanders.<br/>
    Where a particular subclause of IEC 63241-1 is not mentioned in this document, that subclause applies as far as relevant. Where this document states "addition", "modification" or "replacement", the relevant text in IEC 63241-1 is to be adapted accordingly.<br/>
    This document applies to sanders with the exception of all types of rotating disc-type sanders, which are covered by IEC 63241-2-3.
- language: fr
  script: Latn
  content: |-
    IEC 63241-2-4:2024 complète ou modifie les articles correspondants de l'IEC 63241-1 de façon à la transformer en norme IEC: Outils électroportatifs à moteur – Procédure de mesure de la poussière – Exigences particulières pour les ponceuses portatives.<br/>
    Lorsqu'un paragraphe particulier de l'IEC 63241-1 n'est pas mentionné dans le présent document, ce paragraphe s'applique pour autant que cela soit pertinent. Lorsque le présent document mentionne "addition", "modification" ou "remplacement", le texte correspondant de l'IEC 63241-1 doit être adapté en conséquence.<br/>
    Le présent document s'applique aux ponceuses à l'exception de tous les types de ponceuses à disque portatives, qui sont couverts par l'IEC 63241-2-3.
