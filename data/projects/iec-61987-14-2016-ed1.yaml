abstract:
- language: en
  script: Latn
  content: IEC 61987-14:2016 provides an operating list of properties (OLOP) for the description of the operating parameters and the collection of requirements for temperature measuring equipment and device lists of properties (DLOP) for the description of a range of contact and non-contact temperature measuring equipment types.
- language: fr
  script: Latn
  content: L'IEC 61987-14:2016 fournit une liste de propriétés fonctionnelles (OLOP) pour la description des paramètres fonctionnels et la collecte des exigences relatives aux équipements de mesure de température, et les listes de propriétés d'appareil (DLOP) pour la description des différents types d'équipements de mesure de température à RTD ou sans RTD.
