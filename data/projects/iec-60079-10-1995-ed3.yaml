  script: Latn
  content: Is concerned with the classification of hazardous areas where flammable gas or vapour risks may arise, in order to permit the proper selection and installation of apparatus for use in such hazardous areas. The contents of the corrigendum of May 1996 have been included in this copy.
- language: fr
  script: Latn
  content: Est relative au classement des régions dangereuses dans lesquelles des risques dus à des gaz, ou vapeurs, inflammables peuvent apparaître, afin de permettre le choix et l'installation corrects du matériel à utiliser dans de telles régions dangereuses. Le contenu du corrigendum de mai 1996 a été pris en considération dans cet exemplaire.
