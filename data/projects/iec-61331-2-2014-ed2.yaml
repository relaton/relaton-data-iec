abstract:
- language: en
  script: Latn
  content: |-
    IEC 61331-2:2014 applies to translucent protective plates used for radiation protection in X-ray diagnosis and in X-ray therapy. It also applies to translucent protective plates used for protection against gamma radiation in nuclear medicine and brachytherapy with automatically-controlled afterloading equipment. It does not cover other translucent radiation protection materials, e.g. leaded glasses or goggles for protection of the operator's eyes (eye spectacles); leaded face shields, which cover the entire face of the operator; patient eye protection; and thyroid/neck protective devices. This Part 2 deals with the requirements on:<br/>
    - geometrical accuracy;<br/>
    - optical quality of the material;<br/>
    - spectral transmittance;<br/>
    - radiation attenuation properties;<br/>
    - marking; and<br/>
    - statement of compliance with this standard. This second edition cancels and replaces the first edition of IEC 61331-2, published in 1994. It constitutes a technical revision. This second edition has been adapted to apply to the present technology. The essential changes and extensions are:<br/>
    - extension of scope to cover all kinds of translucent protective plates and all kinds of radiation qualities and gamma radiation;<br/>
    - removal of definition and requirements for translucent protective plates for visual imaging;<br/>
    - changes of requirements concerning geometrical accuracy and optical quality;<br/>
    - changes of requirements concerning determination of lead equivalent and minimal thickness; and<br/>
    - changes of requirements concerning information and marking.
- language: fr
  script: Latn
  content: |-
    L'IEC 61331-2:2014 s'applique aux plaques translucides de protection radiologique utilisées pour la radioprotection dans le cadre du diagnostic médical et de la radiothérapie par rayonnement X. Elle s'applique également aux plaques translucides de protection radiologique utilisées pour la protection contre le rayonnement gamma en médecine nucléaire et en curiethérapie avec des appareils de projection de sources à contrôles automatiques. Elle ne couvre pas d'autres matériaux translucides de radioprotection, par exemple:<br/>
    - les verres ou lunettes protectrices au plomb pour les yeux des opérateurs (lunettes oculaires);<br/>
    - les écrans au plomb couvrant tout le visage de l'operateur;<br/>
    - les protections pour les yeux du patient; et<br/>
    - les dispositifs de protection radiologique pour la thyroïde ou le cou. La présente Partie 2 traite des exigences relatives:<br/>
    - à la précision géométrique;<br/>
    - à la qualité optique du matériau;<br/>
    - au facteur de transmission spectrale;<br/>
    - aux propriétés d'atténuation du rayonnement;<br/>
    - au marquage; et<br/>
    - à la déclaration de conformité à la présente norme. Cette deuxième édition annule et remplace la première édition de l'IEC 61331-2, parue en 1994. Elle constitue une révision technique. Cette deuxième édition a été adaptée pour s'appliquer à la technologie actuelle. Les principales modifications et extensions sont les suivantes:<br/>
    - extension du domaine d'application pour couvrir tous les types de plaques translucides de protection radiologique et tous les types de qualités de rayonnement et de rayonnement gamma;<br/>
    - suppression de la définition et des exigences pour les plaques translucides de protection radiologique en imagerie visuelle;<br/>
    - modification des exigences concernant la précision géométrique et la qualité optique;<br/>
    - modification des exigences concernant la détermination de L'équivalent plomb et de l'épaisseur minimale; et<br/>
    - modification des exigences concernant les informations et le marquage.
