abstract:
- language: en
  script: Latn
  content: |-
    IEC 60068-3-6:2026 provides a standardized method of establishing whether temperature as well as temperature/humidity chambers, without specimens, are able to achieve the requirements of the relevant climatic test procedures of the IEC 60068-2 series.<br/>
    This document is intended for users when conducting regular chamber performance monitoring and chamber manufacturers when providing technical specifications on performance. It is intended to be used in conjunction with IEC 60068-3-7 and IEC 60068-3-11, depending on the specific requirements of the user. When considering temperature chambers without humidity control, the passages in this document related to humidity do not apply.<br/>
    This third edition cancels and replaces the second edition published in 2018 and the second edition of IEC 60068‑3‑5 published in 2018. This edition constitutes a technical revision.<br/>
    This edition includes the following significant technical changes with respect to the previous edition and IEC 60068-3-5:2018:<br/>
    a) merge of the contents of IEC 60068-3-5 and IEC 60068-3-6 into this document due to the significant overlap between the two;<br/>
    b) addition of new terms and definitions for temperature and humidity uniformity;<br/>
    c) significant editorial re-writing for clarity;<br/>
    d) clarification of mandatory versus non-mandatory information;<br/>
    e) updates to several figures;<br/>
    f) new information in bibliography and removal of listings from the normative references clause deemed non-mandatory in this new edition.
