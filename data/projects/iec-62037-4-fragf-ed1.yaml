abstract:
- language: fr
  script: Latn
  content: La CEI 62037-4:2012 définit les dispositifs et les procédures d'essai recommandés pour mesurer les niveaux d'intermodulation passive générés par les câbles coaxiaux. Deux méthodes d'essais dynamiques et une méthode d'essai statique sont définies. Tous les câbles coaxiaux sont soumis à l'essai statique et à l'essai dynamique d'une boucle de câble fixée. Les câbles classés comme souples ou semi-souples sont en plus soumis à l'essai dynamique avec outil de flexion.
