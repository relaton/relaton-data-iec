abstract:
- language: fr
  script: Latn
  content: L'IEC 62282-3-100:2012 s'applique aux systèmes à piles à combustibles stationnaires destinés à un usage à l'intérieur et à l'extérieur, commercial, industriel ou d'habitation, dans des zones non dangereuses (non classées). Elle traite de tous les dangers importants, situations et évènements dangereux, à l'exception de ceux associés à la compatibilité environnementale (conditions d'installation), relatifs aux systèmes à piles à combustible, lorsqu'ils sont utilisés comme prévu et selon les conditions prévues par le fabricant.
