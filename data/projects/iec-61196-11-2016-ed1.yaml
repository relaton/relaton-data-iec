  content: |-
    IEC 61196-11:2016 applies to semi-rigid coaxial communication cables with polyethylene (PE) dielectric and tubular outer conductor. These cables are intended for use in microwave and wireless equipments or other signal transmission equipments or units at frequencies above 500 MHz.<br/>
