abstract:
- language: en
  script: Latn
  content: Deals with methods of measurement of the characteristics which may be of importance for the transmission performance of microwave systems with digital modulation. The need to carry out any particular measurement and the limits to be met depend, for example, on the bit rate and the method of modulation.
- language: fr
  script: Latn
  content: Traite des méthodes de mesure des caractéristiques importantes pour la transmission numérique en hyperfréquence. La nécessité d'effectuer telle ou telle mesure et les valeurs limites des mesures dépendent, par exemple, du débit numérique et de la méthode de modulation.
