abstract:
- language: en
  script: Latn
  content: |-
    IEC TS 61980-2:2019 applies to communication between electric road vehicle (EV) and wireless power transfer (WPT) systems when connected to the supply network, at standard supply voltages per IEC 60038 up to 1000 V AC and up to 1500 V DC.<br/>
    This document also applies to wireless power transfer equipment supplied from on-site storage systems (e.g. buffer batteries) at standard supply voltages per IEC 60038 up to 1000 V AC and up to 1500 V DC.<br/>
    The aspects covered in this document include<br/>
    – standards for operational characteristics and functional characteristics of the WPT communication subsystem,<br/>
    – communication requirements for WPT system while driving, which are under consideration,<br/>
    – communication requirements for two- and three-wheel vehicles, which are under consideration, and<br/>
    – communication requirements for bidirectional power transfer are under consideration<br/>
    This document does not apply to<br/>
    – safety aspects related to maintenance, and<br/>
    – trolley buses, rail vehicles and vehicles designed primarily for use off-road.
