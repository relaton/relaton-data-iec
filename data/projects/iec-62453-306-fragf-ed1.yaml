abstract:
- language: fr
  script: Latn
  content: La CEI 62453-306:2009 fournit des informations pour intégrer la technologie INTERBUS® dans la norme de FDT (CEI 62453-2). La Famille de Profils de Communication 6 (généralement connue sous le nom de INTERBUS®) définit les profils de communication basés sur la CEI 61158-2 Type 8, la CEI 61158-3-8, la CEI 61158-4-8, la CEI 61158-5-8, et sur la CEI 61158-6-8. Les profils de base CP 6/1 (INTERBUS) et CP 6/3 (sous-ensemble minimal d'INTERBUS) sont définis dans la CEI 61784-1. Cette partie, conjointement avec les autres parties de la première édition de la série CEI 62453 annule et remplace la CEI/PAS 62453-1, la CEI/PAS 62453-2, la CEI/PAS 62453-3, la CEI/PAS 62453-4 et la CEI/PAS 62453-5 publiées en 2006, et constitue une révision technique. La présente version bilingue (2013-09) correspond à la version anglaise monolingue publiée en 2009-06.
