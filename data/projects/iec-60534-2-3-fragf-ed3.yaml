abstract:
- language: en
  script: Latn
  content: |-
    IEC 60534 is applicable to industrial-process control valves and provides the flow capacity test procedures for determining the following variables used in the equations given in IEC 60534-2-1:<br/>
    a) flow coefficient C;<br/>
    b) liquid pressure recovery factor without attached fittings FL;<br/>
    c) combined liquid pressure recovery factor and piping geometry factor of a control valve with attached fittings FLP;<br/>
    d) piping geometry factor FP;<br/>
    e) pressure differential ratio factors xT and xTP;<br/>
    f) valve style modifier Fd;<br/>
    g) Reynolds number factor FR.
- language: fr
  script: Latn
  content: |-
    L’IEC 60534 est applicable aux vannes de régulation des processus industriels. Elle donne les procédures d'essai relatives à la capacité d'écoulement pour la détermination des variables énoncées ci-après, utilisées dans les équations de<br/>
    l’IEC 60534-2-1:<br/>
    a) coefficient de débit C;<br/>
    b) facteur de récupération de pression du liquide sans raccords adjacents FL;<br/>
    c) facteur combiné de récupération de pression du liquide et de géométrie de la tuyauterie d’une vanne de régulation avec raccords adjacents FLP;<br/>
    d) facteur résultant de la géométrie de la tuyauterie FP;<br/>
    e) facteurs de rapport de pression différentielle xT et xTP;<br/>
    f) coefficient de correction générique de vanne Fd;<br/>
    g) facteur du nombre de Reynolds FR.
