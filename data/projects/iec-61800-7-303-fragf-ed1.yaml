abstract:
- language: fr
  script: Latn
  content: 'La CEI 61800-7-303:2007 spécifie les profils dédiés aux entraînements électriques de puissance (PDS) et leur mise en correspondance avec les systèmes de communication existants grâce à un modèle d''interface générique. Il spécifie aussi la méthode de mise en correspondance du profil de type 3 (PROFIdrive), défini dans la CEI 61800-7-203 avec différentes technologies de réseaux: PROFIBUS DP, PROFINET IO.'
