abstract:
- language: en
  script: Latn
  content: IEC 60601-1:2005 contains requirements concerning basic safety and essential performance that are generally applicable to medical electrical equipment. For certain types of medical electrical equipment, these requirements are either supplemented or modified by the special requirements of a collateral or particular standard. Where particular standards exist, this standard should not be used alone. The contents of the corrigenda of December 2006, December 2007 and December 2022, the interpretation sheets of April 2008, January 2009 and May 2013 have been included in this copy.
- language: fr
  script: Latn
  content: IEC 60601-1:2005 contient les exigences concernant la sécurité de base et les performances essentielles qui sont généralement applicables aux appareils électromédicaux. Pour certains types d'appareil électromédicaux, ces exigences sont soit complétées soit modifiées par des exigences spécifiques données dans une norme collatérale ou une norme particulière. Lorsqu'il existe une norme particulière, il est recommandé de ne pas utiliser la présente norme générale seule. Le contenu des corrigenda de décembre 2006, décembre 2007 et décembre 2022, les feuilles d'interprétation d'avril 2008, janvier 2009 et mai 2013 a été pris en considération dans cet exemplaire.
