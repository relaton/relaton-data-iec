abstract:
- language: en
  script: Latn
  content: |-
    IEC TS 62257-341:2026 proposes simple, inexpensive, comparative tests to determine which types of flooded lead-acid automobile batteries are acceptable for use in PV electrification systems.<br/>
    It could be particularly useful for project implementers to test in laboratories of developing countries the capability of locally made car or truck batteries to be used for their project.<br/>
    The tests provided in this document allow assessment of the batteries' performances according to the general specification and batteries associated with their smart battery charging systems (SBCS) in a short time and with common technical means. They can be performed locally, as close as possible to the operating conditions of the real site.<br/>
    The document also provides recommendations and installation conditions to ensure the life and proper operation of the installations as well as the safety of people living in proximity to the installation.<br/>
    This document offers guidelines and does not replace any existing IEC Standard on batteries.<br/>
    This first edition cancels and replaces the second edition of IEC TS 62257-8-1 published in 2018. This edition includes the following significant technical changes with respect to IEC 62257‑8‑1:2018:<br/>
    - increase of the applicable voltage levels and removal of the 100 kW power limit;<br/>
    - removal of the word "small" from the description of these systems.
