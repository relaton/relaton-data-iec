abstract:
- language: en
  script: Latn
  content: |-
    Determines the measuring methods for characterizing the performance of colour plasma display modules in the following areas: 
    4 % window luminance; luminance uniformity; dark-room contrast ratio; white chromaticity and chromatic uniformity; colour gamut in the centre box.
- language: fr
  script: Latn
  content: |-
    Définit les méthodes de mesure de caractérisation de la performance des modules d'affichage couleur à plasma dans les domaines suivants:
    Luminance d'une zone d'essai de 4 % de surface d'écran; uniformité de luminance; rapport de contraste en chambre noire; chromaticité du blanc et uniformité chromatique; étendue chromatique dans la zone d'essai centrale.
