abstract:
- language: fr
  script: Latn
  content: 'La CEI 62273-1:2007 définit les conditions permettant de mesurer les performances des émetteurs numériques terrestres et de faciliter la comparaison de mesures réalisées par différentes personnes. Elle détaille des méthodes plus particulièrement choisies pour déterminer les caractéristiques de performance principales des émetteurs numériques. Les méthodes de mesure décrites s''appliquent à un nombre limité de caractéristiques, comme par exemple, celles qui donneraient lieu à une interprétation ambiguë de par l''utilisation de différentes méthodes et conditions de mise en application. Elles ne sont ni restrictives, ni obligatoires: il est permis de choisir la méthode d''évaluation en fonction du cas se présentant. Il est envisageable de compléter les essais réalisés; dans ce cas, ils doivent respecter les normes établies par d''autres groupes d''étude, par des sous-comités de la CEI ou d''autres organismes internationaux ou accrédités. La présente version bilingue (2012-03) correspond à la version anglaise monolingue publiée en 2007-02.'
