abstract:
- language: en
  script: Latn
  content: IEC 60034-18-41:2014 defines criteria for assessing the insulation system of stator/rotor windings which are subjected to voltage-source pulse-width-modulation drives. It applies to stator/rotor windings of single or polyphase AC machines with insulation systems for converter operation. It describes qualification tests and quality control (type and routine) tests on representative samples or on completed machines which verify fitness for operation with voltage source converters.
- language: fr
  script: Latn
  content: L'IEC 60034-18-41:2014 définit des critères pour évaluer le système d'isolation dans des enroulements de stator/de rotor liés à des entraînements à modulation de largeur d'impulsion (PWM) due à la tension. Elle s'applique à des enroulements de stator/de rotor dans des machines à CA monophasés ou polyphasés comportant des systèmes d'isolation pour le fonctionnement du convertisseur. Elle décrit les essais de qualification et les essais de contrôle qualité (essais de type et individuels de série) sur des échantillons représentatifs ou sur des machines finies pour vérifier qu'ils sont en mesure de fonctionner avec des convertisseurs de source de tension.
