abstract:
- language: en
  script: Latn
  content: |-
    This document specifies the minimum performance requirements, technical characteristics and test methods, and required test results, for a bridge navigational watch alarm system (BNWAS) as required by Chapter V of the International Convention for the Safety of Life at Sea (SOLAS), as amended. It takes account of the general requirements given in IMO Resolution A.694(17) and is associated with IEC 60945. It also takes into account IMO Resolution MSC.302(87), to which IEC 62923-1 and IEC 62923-2 are associated.<br/>
    This document incorporates the performance standards included in IMO Resolution MSC.128(75).<br/>
    This second edition cancels and replaces the first edition published in 2010. This edition constitutes a technical revision.<br/>
    This edition includes the following significant technical changes with respect to the previous edition:<br/>
    a) introduction of bridge alert management [MSC.302(87), IEC 62923-1, IEC 62923-2];<br/>
    b) updating to IMO Resolution A.1021(26) and MSC.333(90);<br/>
    c) addition of a new Clause 3, Terms, definitions and abbreviated terms;<br/>
    d) addition of a new Annex B, Classification of alerts;<br/>
    e) reduction of the period of operation of the battery maintained supply from 6 h to 0,5 h to align with SOLAS II-1.
