abstract:
- language: en
  script: Latn
  content: |-
    IEC 60749-10:2022 is intended to evaluate devices in the free state and assembled to printed wiring boards for use in electrical equipment. The method is intended to determine the compatibility of devices and subassemblies to withstand moderately severe shocks. The use of subassemblies is a means to test devices in usage conditions as assembled to printed wiring boards. Mechanical shock due to suddenly applied forces, or abrupt change in motion produced by handling, transportation or field operation can disturb operating characteristics, particularly if the shock pulses are repetitive. This is a destructive test intended for device qualification.<br/>
    This edition cancels and replaces the first edition published in 2002. This edition includes the following significant technical changes with respect to the previous edition:<br/>
    covers both unattached components and components attached to printed wiring boards;<br/>
    tolerance limits modified for peak acceleration and pulse duration;<br/>
    mathematical formulae added for velocity change and equivalent drop height.
- language: fr
  script: Latn
  content: |-
    L’IEC 60749-10:2022 est destinée à évaluer les dispositifs à l’état libre et ceux qui sont assemblés à des cartes à câblage imprimé pour être utilisés dans des matériels électriques. Cette méthode est destinée à déterminer la capacité des dispositifs et des sous‑ensembles à résister à des chocs d’une sévérité modérée. L’utilisation de sous‑ensembles est un moyen de soumettre aux essais des dispositifs dans des conditions d’utilisation identiques à celles des dispositifs montés sur des cartes à câblage imprimé. Les chocs mécaniques dus à l’application soudaine de forces ou à de brusques modifications de déplacements au cours de manipulations, du transport ou du fonctionnement sur le terrain peuvent perturber les caractéristiques de fonctionnement, en particulier si les impulsions de choc sont répétitives. Il s’agit ici d’un essai destructif destiné à la qualification des dispositifs.<br/>
    Cette édition annule et remplace la première édition parue en 2002. Cette édition inclut les modifications techniques majeures suivantes par rapport à l'édition précédente:<br/>
    a) Elle couvre à la fois les composants qui sont fixés sur des cartes à câblage imprimé et ceux qui ne le sont pas;<br/>
    b) les limites des tolérances ont été modifiées pour l'accélération de crête et la durée d’impulsion;<br/>
    c) des formules mathématiques ont été ajoutées concernant la variation de vitesse et la hauteur de chute équivalente.
