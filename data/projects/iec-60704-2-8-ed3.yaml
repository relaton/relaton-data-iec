abstract:
- language: en
  script: Latn
  content: |-
    IEC 60704-2-8:2026 applies to electric shavers, hair clippers or trimmers for domestic and similar use.<br/>
    This document does not apply to shavers, hair clippers or trimmers that are powered by means other than electrical, for example by a spring-device.<br/>
    If possible, this document can also be applied to analogous electrically operated devices, such as depilating devices.<br/>
    This third edition cancels and replaces the second edition published in 2020. This edition constitutes a technical revision.<br/>
    This edition includes the following significant technical changes with respect to the previous edition:<br/>
    a) alignment with IEC 60704-1:2021;<br/>
    b) stabilizing period and check of the battery status has been redefined;<br/>
    c) position of the appliance during test has been redefined.<br/>
    This Part 2-8 is intended to be used in conjunction with fourth edition of IEC 60704-1:2021, Household and similar electrical appliances - Test code for the determination of airborne acoustical noise - Part 1: General requirements.
- language: fr
  script: Latn
  content: |-
    L'IEC 60704-2-8:2026 s'applique aux rasoirs et aux tondeuses à barbe ou à cheveux électriques pour usages domestiques et analogues.<br/>
    Le présent document ne s'applique pas aux rasoirs et aux tondeuses à barbe ou à cheveux qui ne sont pas alimentés par des moyens électriques (mais par un dispositif à ressort, par exemple).<br/>
    Si possible, le présent document peut également être appliqué aux appareils électriques analogues tels que les appareils d'épilation.<br/>
    Cette troisième édition annule et remplace la deuxième édition parue en 2020. Cette édition constitue une révision technique.<br/>
    Cette édition inclut les modifications techniques majeures suivantes par rapport à l'édition précédente:<br/>
    a) alignement avec l'IEC 60704-1:2021;<br/>
    b) la période de stabilisation et le contrôle de l'état des piles ont été redéfinis;<br/>
    c) la position de l'appareil lors des essais a été redéfinie.<br/>
    La présente Partie 2-8 est destinée à être utilisée conjointement avec la quatrième édition de l'IEC 60704-1:2021, Appareils électrodomestiques et analogues - Code d'essai pour la détermination du bruit aérien - Partie 1: Exigences générales.
