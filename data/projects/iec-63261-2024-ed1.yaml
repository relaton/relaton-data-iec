abstract:
- language: en
  script: Latn
  content: |-
    CORRECTED VERSION 2025-09<br/>
    <br/>
    IEC 63261:2024 provides requirements for the E&amp;I objects of a digital 3D plant model, used in the engineering phase to design and construct a process plant and its instrumentation. It provides guidance how to model plants and their electrical and instrumentation equipment.<br/>
    This document also specifies the content and the possible output of the 3D plant model at project milestones.<br/>
    This document can be used by the contractual partners to agree upon the content of the 3D plant model to be delivered at specified milestones.<br/>
    This document does not specify the transfer and format of digital 3D plant models.<br/>
    This document does not specify definitions or instructions to equipment representations and details of elements in the 3D plant model not belonging to electrical and instrumentation domains.<br/>
    The content of the corrigendum 1 (2025-09) has been included in this copy.
- language: fr
  script: Latn
  content: |-
    VERSION CORRIGEE 2025-09<br/>
    <br/>
    IEC 63261:2024 fournit des exigences pour les objets E &amp; I d’un modèle d’installation numérique 3D, utilisé dans la phase d’ingénierie pour concevoir et construire une installation de traitement et son instrumentation. Elle fournit des recommandations sur la façon de modéliser les installations et leurs équipements électriques et d’instrumentation.<br/>
    Le présent document spécifie également le contenu, ainsi que la sortie possible du modèle d’installation 3D aux jalons du projet.<br/>
    Le présent document peut être utilisé par les partenaires contractuels pour convenir du contenu du modèle d’installation 3D à livrer à des jalons spécifiés.<br/>
    Le présent document ne spécifie pas le transfert et le format des modèles d’installation numérique 3D.<br/>
    Le présent document ne précise pas de définitions ou d’instructions pour les représentations d’équipements et les informations détaillées des éléments du modèle d’installation 3D qui ne relèvent pas des domaines électriques et d’instrumentation.<br/>
    Le contenu du corrigendum 1 (2025-09) a été pris en considération dans cet exemplaire.
