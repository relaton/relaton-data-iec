- language: en
  script: Latn
  content: Specifies the requirements for standard interfaces between the control and indicating equipment (CIE) of an alarm system and an alarm system transceiver where the alarm system transceiver is intended to plug into a standard space inside the CIE of the alarm system.
- language: fr
  script: Latn
  content: Spécifie les exigences des interfaces normalisées existant entre la centrale d'un système d'alarme et un transmetteur de système d'alarme dans lequel ce transmetteur est destiné à être enfiché dans un espace normalisé situé à l'intérieur de la centrale du système d'alarme.
