abstract:
- language: en
  script: Latn
  content: |-
    Applies to power electronic capacitors according to IEC 61071-1 and gives the requirements for:

    - disconnecting test on fuses,

    - destruction test,

    - self-healing test,

    - endurance test

    of these capacitors.

    Has the status of a technical report, type 2.
