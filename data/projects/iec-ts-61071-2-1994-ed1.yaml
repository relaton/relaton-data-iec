  content: |-
    S'applique aux condensateurs pour l'électronique de puissance conformes à la CEI 61071-1 et donne les prescriptions pour:

    - l'essai de déconnexion des coupe-circuit,

    - l'essai de destruction,

    - l'essai d'autorégénération,

    - l'essai d'endurance.


