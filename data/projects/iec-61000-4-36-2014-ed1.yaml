- language: en
  script: Latn
  content: 'IEC 61000-4-36:2014(E) provides methods to determine test levels for the assessment of the immunity of equipment and systems to intentional electromagnetic interference (IEMI) sources. It introduces the general IEMI problem, IEMI source parameters, derivation of test limits and summarises practical test methods. Keywords: EMC, electromagnetic compatibility'
