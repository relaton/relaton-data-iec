abstract:
- language: fr
  script: Latn
  content: |-
    L'IEC 60371-3-2:2006 fournit des exigences pour les matériaux isolants électriques réalisés en papier de mica qui est utilisé pour la fabrication de matériaux à base de mica conformément à la CEI 60371-1-1, tels que des plaques rigides de matériaux à base de mica, des matériaux souples à base de mica, des matériaux souples durcissables à base de mica et des pièces de forme. Cette seconde édition annule et remplace la première édition parue en 1991 dont elle constitue une révision technique. Les principales modifications par rapport à l'édition antérieure incluent des ajustements pour faire correspondre la présente norme aux modifications de la dernière édition de la CEI 60371-2.
    Mots clés: matériaux isolants électriques, papier de mica
