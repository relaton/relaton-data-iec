- language: en
  script: Latn
  content: This document identifies two basic measurement methods for characterising the spectral transfer functions of DWDM filter components as defined in IEC 62074-1. The transfer functions can be used to produce measurements of attenuation (A), polarisation dependent loss (PDL), isolation, centre wavelength, and bandwidth (BW).
