abstract:
- language: en
  script: Latn
  content: |-
    IEC 60079-29-2:2015 is available as IEC 60079-29-2:2015 RLV which contains the International Standard and its Redline version, showing all changes of the technical content compared to the previous edition.<br/>
    <br/>
    IEC 60079-29-2:2015 gives guidance on, and recommended practice for, the selection, installation, safe use and maintenance of electrically operated Group II equipment intended for use in industrial and commercial safety applications and Group I equipment in underground coal mines for the detection and measurement of flammable gases complying with the requirements of IEC 60079-29-1 or IEC 60079-29-4. This second edition cancels and replaces the first edition published in 2007.<br/>
    <br/>
    This edition constitutes a technical revision.<br/>
    This edition includes the following significant changes with respect to the previous edition:<br/>
    1) Addition of group 1 to scope<br/>
    2) Addition of Open Path Gas Detection<br/>
    3) Addition of specific applications<br/>
    4) Improvements to sampling systems<br/>
    <br/>
    Keywords: gas detectors, flammable gases, vapours
- language: fr
  script: Latn
  content: |-2
    
    	IEC 60079-29-2: 2015 donne des lignes directrices et des recommandations pratiques pour la sélection, l’installation, l’utilisation en toute sécurité et la maintenance des matériels électriques de groupe II destinés à une utilisation dans des applications de sécurité sur des sites industriels et commerciaux, et des matériels de groupe I utilisés dans les mines de charbon souterraines pour la détection et le mesurage des gaz inflammables conformément aux exigences de l'IEC 60079-29-1 ou de l'IEC 60079-29-4

    	La présente version bilingue (2017-12) correspond à la version anglaise monolingue publiée en 2015-03.<br/>
    	<br/>
    	Cette deuxième édition annule et remplace la première édition parue en 2007. Cette édition constitue une révision technique.<br/>
    	 

    	Cette édition inclut les modifications majeures suivantes par rapport à l'édition précédente:<br/>
    	1) Ajout du Groupe 1 au Domaine d’application<br/>
    	2) Ajout de la Détection de gaz à chemin ouvert<br/>
    	3) Ajout d’applications spécifiques<br/>
    	4) Améliorations apportées aux systèmes d’échantillonnage

    	<br/>
    	Mots-clés: détecteurs de gaz, gaz inflammables, vapeurs
