abstract:
- language: en
  script: Latn
  content: |-
    IEC 60747-6:2025 specifies product specific standards for terminology, letter symbols, essential ratings and characteristics (properties), measuring and test methods, requirements for type tests, routine tests, endurance tests and marking for the following discrete semiconductor devices:<br/>
    - reverse blocking triode thyristors;<br/>
    - reverse conducting (triode) thyristors;<br/>
    - bidirectional triode thyristors (triacs);<br/>
    - turn-off thyristors.<br/>
    If no ambiguity is likely to result, any of the above will be referred to as thyristors.<br/>
    This edition includes the following significant technical changes with respect to the previous edition:<br/>
    a) the terms and definitions for partial thermal resistance junction-to-case and voltages related to ratings and characteristics (properties) have been added;<br/>
    b) Clauses 3, 4, 5, 6 and 7 were amended with some deletions of information no longer in use and with some necessary additions.
