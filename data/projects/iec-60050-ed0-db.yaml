  content: |-
    IEC 60050:2024 DB - Electropedia is produced by the IEC, the world’s leading organization that prepares and publishes International Standards for all electrical, electronic and related technologies – collectively known as “electrotechnology”. Electropedia (also known as the "IEV Online") contains all the terms and definitions in the International Electrotechnical Vocabulary or IEV which is published also as a set of publications in the IEC 60050 series that can be ordered separately from the IEC webstore.<br/>
    Maintenance of IEC 60050 through the IEV maintenance portal. See report on change requests processed<br/>
    <br/>
    Electropedia is available online at https://www.electropedia.org/
