abstract:
- language: en
  script: Latn
  content: Applies to switches for appliances actuated by hand, by foot or by other human activity for use in, on or with appliances and other equipment for household and similar purposes, with a rated voltage not exceeding 440 V and a rated current not exceeding 63 A. Also covers the indirect actuation of the switch when the function of the actuating member is provided by a part of an appliance or equipment. Replaces IEC 60328 (1972). The contents of the corrigendum of January 2009 have been included in this copy.
