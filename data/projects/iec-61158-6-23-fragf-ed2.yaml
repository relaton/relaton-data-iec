abstract:
- language: en
  script: Latn
  content: |-
    IEC 61158-6-23:2019 (EN) provides common elements for basic time-critical and non-time-critical messaging communications between application programs in an automation environment and material specific to Type 2 fieldbus. The term “time-critical” is used to represent the presence of a time-window, within which one or more specified actions are required to be completed with some defined level of certainty. Failure to complete specified actions within the time window risks failure of the applications requesting the actions, with attendant risk to equipment, plant and possibly human life.<br/>
    The purpose of this document is to define the protocol provided to:<br/>
    a) define the wire-representation of the service primitives defined in IEC 61158 5 23, and<br/>
    b) define the externally visible behavior associated with their transfer.
- language: fr
  script: Latn
  content: |-
    L’IEC 61158-6-23:2019 (FR) fournit des éléments communs pour les communications de messagerie prioritaires et non prioritaires élémentaires entre les programmes d’application des environnements d’automatisation et le matériel spécifique au bus de terrain de type 23. On utilise le terme "prioritaire" pour traduire la présence d’une fenêtre temporelle, à l’intérieur de laquelle il est exigé qu’une ou plusieurs actions spécifiées soient terminées avec un niveau de certitude défini. Si les actions spécifiées ne sont pas réalisées dans la fenêtre temporelle, les applications demandant les actions risquent de connaître une défaillance, avec les risques que cela comporte pour les équipements, les installations et éventuellement la vie humaine.<br/>
    Le présent document vise à définir le protocole mis en place pour:<br/>
    a) définir la représentation câblée des primitives de service définies dans l’IEC 61158 5 23, et<br/>
    b) définir le comportement visible de l’extérieur associé à leur transfert.
