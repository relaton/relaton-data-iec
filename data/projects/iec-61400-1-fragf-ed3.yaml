abstract:
- language: fr
  script: Latn
  content: Spécifie les exigences de conception essentielles pour assurer l'intégrité technique des éoliennes. A pour objet de fournir un niveau de protection approprié contre les dommages causés par tous les risques pendant la durée de vie prévue. Concerne tous les sous-systèmes des éoliennes tels que les mécanismes de commande et de protection, les systèmes électriques internes, les systèmes mécaniques et les structures de soutien. Pour les petites éoliennes, la CEI 61400-2 s'applique.
