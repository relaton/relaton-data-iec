  content: IEC 60068-2-11:1981 A pour objet de comparer la résistance à la détérioration due au brouillard salin sur des spécimens de conception analogue. Est utile pour évaluer la qualité et l'uniformité des revêtements de protection. Le contenu du corrigendum de décembre 1999 a été pris en considération dans cet exemplaire.
