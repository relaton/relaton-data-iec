abstract:
- language: fr
  script: Latn
  content: |-
    L'IEC 62135-1:2015 s'applique aux matériels de soudage par résistance et aux procédés connexes et comprend les stations de soudage simples et multiples qui peuvent être alimentées manuellement ou automatiquement et/ou mises en route. Cette deuxième édition annule et remplace la première édition parue en 2008. Cette édition constitue une résivion technique. Cette édition inclut les modifications techniques majeures suivantes par rapport à l'édition précédente:<br/>
    - les lignes de fuite pour le degré de pollution 4 ne sont plus valables (voir le Tableau 2);<br/>
    - les exigences relatives à l'isolement pour le matériel de classe II sont définies (voir le Tableau 3);<br/>
    - la limite inférieure de restriction d'interpolation de la tension d'essai diélectrique est modifiée à 220 V et l'interpolation des circuits de commande et de soudage est clarifiée (voir le Tableau 4);<br/>
    - la température maximale pour les systèmes d'isolation est revue conformément à l'actuelle édition de l'IEC 60085 (voir le Tableau 7);<br/>
    - le marquage des bornes est défini (voir 10.3);<br/>
    - le tableau des tensions nominales des réseaux d'alimentation est modifié: les valeurs du Tableau B.2 de l'IEC 60664-1:2007 sont prises en compte à la place des valeurs du Tableau B.1, référencées dans la précédente édition pour le matériel à connecter aux systèmes mis à la terre et non mis à la terre. Cette modification influence les exigences relatives aux lignes de fuite et aux distances d'isolement dans l'air pour certaines caractéristiques assignées de tension d'alimentation (voir l'Annexe A);<br/>
    - les informations relatives au courant de contact en cas de défaut et les procédures de mesure sont clarifiées (voir 6.4.4 et l'Annexe C);<br/>
    - le courant de contact du circuit de soudage est défini (voir 6.2.6);<br/>
    - les informations relatives au courant de contact en condition normale sont clarifiées et déplacées dans la partie protection contre les chocs électriques en service normal (voir 6.3.7);<br/>
    - les conditions d'essai d'échauffement sont clarifiées (voir 7.1.1);<br/>
    - la limite d'échauffement de la surface externe est modifiée (voir 7.3.2).
