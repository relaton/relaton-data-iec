abstract:
- language: fr
  script: Latn
  content: |-
    La CEI 60728-3:2010 présente les méthodes de mesure, les exigences de performance et les exigences de publication des données caractéristiques des matériels actifs à large bande des réseaux de distribution par câbles pour signaux de télévision, signaux de radiodiffusion sonore et services interactifs. Cette quatrième édition annule et remplace la troisième édition parue en 2005, dont elle constitue une révision technique. Elle contient les modifications techniques significatives suivantes par rapport à l'édition précédente:<br/>
    - extension de la limite supérieure de la gamme de fréquences pour les matériels de réseaux de distribution par câbles de 862 MHz à 1 000 MHz;<br/>
    - méthode de mesure et exigences pour l'immunité aux tensions de choc;<br/>
    - extension du domaine d'application aux matériels à accès symétriques;<br/>
    - références normatives supplémentaires;<br/>
    - termes, définitions et abréviations supplémentaires. La version française de cette norme n'a pas été soumise au vote.
