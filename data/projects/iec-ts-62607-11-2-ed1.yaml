abstract:
- language: en
  script: Latn
  content: |-
    IEC TS 62607-11-2:2026, which is a Technical Specification, establishes a method to determine the key control characteristic<br/>
    • electromagnetic shielding effectiveness<br/>
    for single-wall carbon nanotubes by<br/>
    • far-field measurement in the frequency range of 30 MHz to 8 GHz.<br/>
    Since SWCNTs are typically provided as a dispersion or dry powder and cannot be measured directly, this document specifies specimen preparation procedures to ensure accurate and repeatable measurements, and provides guidelines to minimize and evaluate measurement errors.
