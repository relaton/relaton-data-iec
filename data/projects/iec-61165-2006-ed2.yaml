abstract:
- language: en
  script: Latn
  content: This International Standard provides guidance on the application of Markov techniques to model and analyze a system and estimate reliability, availability, maintainability and safety measures. This standard is applicable to all industries where systems, which exhibit state-dependent behaviour, have to be analyzed. The Markov techniques covered by this standard assume constant time-independent state transition rates. Such techniques are often called homogeneous Markov techniques.
- language: fr
  script: Latn
  content: Cette Norme internationale fournit un guide sur l'application des techniques de Markov pour analyser et modéliser un système, et estimer la fiabilité, la disponibilité, la maintenabilité et les mesures de sécurité. Cette norme est applicable à toutes les industries où les systèmes, qui présentent un comportement dépendant de leur état, doivent être analysés. Les techniques de Markov couvertes par cette norme supposent des fréquences de changement d'état constantes, indépendantes du temps. De telles techniques sont souvent appelées globalement "techniques de Markov".
