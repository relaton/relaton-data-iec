abstract:
- language: en
  script: Latn
  content: |-
    IEC 63413:2026 provides guidance and establishes requirements for the qualification of I&amp;C platforms, according to IEC nuclear standards, aimed to be used in nuclear applications important to safety. Qualification of an I&amp;C platform (also called pre-qualification or generic qualification) is performed as a generic activity outside the framework of a plant-specific application project. Platform qualification aims to fulfil in an anticipated manner all requirements leading to an I&amp;C platform fully suitable for the implementation of a plant-specific application project.<br/>
    The platform qualification covers consequently all I&amp;C platform specific aspects including hardware, software, HPD, engineering tools, environmental qualification, quality and the applied safety life cycle supporting these activities. Platform qualification also considers interaction of platform assemblies. This document applies to I&amp;C platforms under development, as well as to pre-existing I&amp;C platforms.<br/>
    This document provides guidance on what is relevant to I&amp;C platform qualification and what is relevant to the implementation of an I&amp;C system design based on a qualified I&amp;C platform.<br/>
    The objective of this document is to identify those requirements that relate closely to an I&amp;C platform qualification and aims to support a two-step approach for the licensing of I&amp;C systems based on this I&amp;C platform. If the complete qualification of an I&amp;C system is performed in the framework of a plant-specific application, this document does not apply.
- language: fr
  script: Latn
  content: |-
    IEC 63413:2026 fournit des recommandations et établit les exigences de qualification des plateformes d'I&amp;C, conformément aux normes nucléaires de l'IEC, destinées à être utilisées dans les applications nucléaires importantes pour la sûreté. La qualification d'une plateforme d'I&amp;C (également appelée préqualification ou qualification générique) est réalisée en tant qu'activité générique en dehors du cadre d'un projet d'application spécifique à la centrale. La qualification des plateformes vise à satisfaire de manière anticipée à toutes les exigences qui conduisent à une plateforme d'I&amp;C entièrement adaptée à la mise en œuvre d'un projet d'application spécifique à la centrale. Elle permet à un processus d'obtention de licence de se concentrer sur deux étapes distinctes: l'une concerne l'adéquation de la plateforme d'I&amp;C, en tenant compte des caractéristiques de sûreté et des processus de développement, et l'autre concerne la mise en œuvre spécifique à la centrale, en tenant compte des fonctions de sûreté.<br/>
    La qualification des plateformes couvre par conséquent tous les aspects spécifiques aux plateformes d'I&amp;C, y compris le matériel, les logiciels, les HPD, les outils d'ingénierie, la qualification environnementale, la qualité et le cycle de vie de sûreté appliqué à l'appui de ces activités. La qualification des plateformes tient également compte de l'interaction des assemblages de plateformes. Le présent document s'applique aux plateformes d'I&amp;C en cours de développement ainsi qu'aux plateformes d'I&amp;C préexistantes.<br/>
    L'objectif du présent document est d'identifier les exigences qui sont étroitement liées à la qualification d'une plateforme d'I&amp;C et de soutenir une approche en deux étapes pour l'obtention d'une licence pour les systèmes d'I&amp;C qui reposent sur cette plateforme d'I&amp;C. Si la qualification complète d'un système d'I&amp;C est effectuée dans le cadre d'une application spécifique à la centrale, le présent document ne s'applique pas. Le présent document fournit des exigences relatives à la qualification des plateformes d'instrumentation et de contrôle-commande (I&amp;C) destinées à être utilisées dans les systèmes d'I&amp;C importants pour la sûreté dans le cadre des normes du SC 45A de l'IEC. Il fournit des recommandations relatives à la manière dont les normes du SC 45A de l'IEC doivent être appliquées aux plateformes d'I&amp;C en tenant compte de tous les constituants possibles d'une plateforme d'I&amp;C (par exemple, le matériel, les logiciels, la logique programmable, son architecture, y compris les interfaces internes et externes et les outils d'ingénierie). Le présent document couvre à la fois les aspects des processus relatifs au produit et au cycle de vie, conformément à l'IEC 61513.
