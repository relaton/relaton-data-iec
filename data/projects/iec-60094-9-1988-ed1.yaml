  script: Latn
  content: S'applique à un système de cartouche pour bandes magnétiques à usage professionnel. Offre soit une piste de programme et une piste d'ordres pour les programmes monophoniques, soit deux pistes de programme et une piste d'ordres pour les programmes stéréophoniques.
