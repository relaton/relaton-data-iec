  content: L'IEC 61131-3:2003 spécifie la syntaxe et la sémantique des langages de programmation utilisés pour les automates programmables tels que définis dans la Partie 1 de la CEI 61131. Cette seconde édition de la CEI 61131-3 annule et remplace la première édition publiée en 1993, dont elle constitue une révision technique. La présente version bilingue (2015-06) correspond à la version anglaise monolingue publiée en 2003-01.
