abstract:
- language: en
  script: Latn
  content: |-
    IEC 60268-3:2013 applies to analogue amplifiers, and the analogue parts of analogue/digital amplifiers, which form part of a sound system for professional or household applications. It specifies the characteristics which should be included in specifications of amplifiers and the corresponding methods of measurement. This fourth edition cancels and replaces the third edition published in 2000 and constitutes a technical revision. It includes the following technical changes:<br/>
    - rated condition of multi-channel amplifier is expanded;<br/>
    - arrangement for the D-class amplifier is added;<br/>
    - method of measurement for output power (distortion-limited) is expanded;<br/>
    - Annex B is newly added.

    <br/><br/>This publication is to be read in conjunction with IEC 60268-1:1985 and IEC 60268-2:1987
- language: fr
  script: Latn
  content: |-
    La CEI 60268-3:2013 s'applique aux amplificateurs analogiques et aux parties analogiques des amplificateurs analogiques/numériques, qui font partie d'un système électroacoustique destiné à des applications professionnelles ou grand public. Elle spécifie les caractéristiques qu'il convient d'inclure dans les spécifications des amplificateurs, ainsi que les méthodes de mesure correspondantes. Cette quatrième édition annule et remplace la troisième édition parue en 2000 et constitue une révision technique. Elle inclut les modifications techniques suivantes:<br/>
    - la condition assignée des amplificateurs multivoies a été étendue;<br/>
    - un montage pour les amplificateurs de la classe D a été ajouté;<br/>
    - la méthode de mesure de la puissance de sortie (limitée par la distorsion) a été étendue;<br/>
    - une Annexe B a été ajoutée.

    <br/><br/>Cette publication doit être lue conjointement avec la CEI 60268-1:1985 et la CEI 60268-2:1987.
