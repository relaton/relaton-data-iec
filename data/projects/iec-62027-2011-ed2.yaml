abstract:
- language: en
  script: Latn
  content: "IEC 62027:2011 provides rules and guidelines for the presentation of information in object lists, and specific rules for such documents. It is applicable to object lists such as parts lists, function lists and location lists used in the design and engineering process intended to be supplied with the documentation. This edition includes the following substantial changes with respect to the previous edition:&lt;br &#x2F;&gt;\r\n- the terminology used in the publication has been adapted to the one used in IEC 81346-1:2009, IEC 62507-1:2010 and IEC PAS 62569-1:2009;&lt;br &#x2F;&gt;\r\n- the term &quot;object list&quot; has been introduced as the generic term, and &quot;parts list&quot; used as a specific term for object lists associated with the product structure;&lt;br &#x2F;&gt;\r\n- Annex A of the previous edition has been taken away and partly replaced by 6.2 and a reference to IEC 61355 DB;&lt;br &#x2F;&gt;\r\n- a new Annex A providing guidance on the presentation of subsets of characteristic properties has been introduced;&lt;br &#x2F;&gt;\r\n- a new Annex B providing source definitions and references to used data element types has been introduced;&lt;br &#x2F;&gt;\r\n- the examples in the annexes C, D and E (corresponding to B, C and D in the previous edition) have been provided with comments.&lt;br &#x2F;&gt;\r\nIEC 62027:2011 has the status of a horizontal standard in accordance with &lt;a href=&quot;https:&#x2F;&#x2F;webstore.iec.ch&#x2F;advsearchform?&amp;amp;RefNbr=108&amp;amp;typepub=GUIDE&quot;&gt;IEC Guide 108&lt;&#x2F;a&gt;."
- language: fr
  script: Latn
  content: "L&#x27;IEC 62027:2011 donne les règles et les lignes directrices pour la présentation de l&#x27;information dans les listes d&#x27;objets ainsi que les règles spécifiques pour ces documents. Elle est applicable aux listes d&#x27;objets telles que les nomenclatures de composants, les listes de fonctions et les listes d&#x27;emplacements utilisées lors du processus de conception et d&#x27;ingénierie, destinées à être fournies avec la documentation. Cette deuxième édition annule et remplace la première édition parue en 2000. Cette édition constitue une révision technique. Cette édition inclut les modifications importantes suivantes par rapport à l&#x27;édition précédente:&lt;br &#x2F;&gt;\r\n- la terminologie utilisée dans la publication a été adaptée à celle utilisée dans les normes IEC 81346-1:2009, IEC 62507-1:2010 et IEC PAS 62569-1:2009;&lt;br &#x2F;&gt;\r\n- le terme &quot;liste d&#x27;objets&quot; a été introduit comme terme générique et le terme &quot;nomenclature de composants&quot; est utilisé comme terme spécifique pour les listes d&#x27;objets associées à la structure du produit;&lt;br &#x2F;&gt;\r\n- l&#x27;Annexe A de l&#x27;édition précédente a été retirée et en partie remplacée par le paragraphe 6.2 et une référence à l&#x27;IEC 61355 DB;&lt;br &#x2F;&gt;\r\n- une nouvelle Annexe A donnant des directives sur la présentation des sous-ensembles de propriétés caractéristiques a été introduite;&lt;br &#x2F;&gt;\r\n- une nouvelle Annexe B donnant des définitions sources et des références aux types d&#x27;éléments de données utilisés a été introduite;&lt;br &#x2F;&gt;\r\n- les exemples des Annexes C, D et E (correspondant aux B, C et D de l&#x27;édition précédente) ont été pourvus de commentaires.&lt;br &#x2F;&gt;\r\nL&#x27;IEC 62027:2011 a le statut de norme horizontale conformément au &lt;a href=&quot;https:&#x2F;&#x2F;webstore.iec.ch&#x2F;advsearchform?&amp;amp;RefNbr=108&amp;amp;typepub=GUIDE&quot;&gt;Guide IEC 108&lt;&#x2F;a&gt;."
