abstract:
- language: en
  script: Latn
  content: Specifies test procedures for in-service inspection and, after repair, to ensure electrical safety. These test procedures are also applicable for maintenance. Is applicable to power sources together with ancillary equipment for arc welding, cutting and allied processes built in conformity with IEC 60974-1.
- language: fr
  script: Latn
  content: Spécifie les procédures d'essai pour l'inspection en service et après réparation afin de garantir la sécurité électrique. Ces procédures d'essai s'appliquent également à la maintenance. S'applique aux sources de courant ainsi que leurs équipements auxiliaires pour le soudage à l'arc, le coupage et les techniques connexes construits conformément à la CEI 60974-1.
