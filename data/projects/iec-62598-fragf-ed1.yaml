abstract:
- language: fr
  script: Latn
  content: La CEI 62598:2011 s'applique à la fabrication et à l'installation des systèmes et appareils de mesure électriques utilisant des sources radioactives (jauges radiométriques, ci-après désignées par jauges, en abrégé). Elle s'applique également aux boîtiers des sources destinées à être utilisées dans les systèmes de mesure mentionnés ci-dessus. Cette Norme s'applique à un équipement, qui n'est pas relié à la production d'électricité nucléaire ou au cycle du combustible nucléaire. Cette Norme spécifie les exigences de construction concernant la conception des instruments utilisant des sources radioactives, eu égard à la protection contre le rayonnement. Cette norme annule et remplace la CEI 60405.
