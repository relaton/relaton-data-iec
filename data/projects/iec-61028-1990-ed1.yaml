abstract:
- language: en
  script: Latn
  content: Applies to X-Y recorders used for recording analogue electrical signals of another electrical quantity or a non-electrical quantity. Applies also to accessories which are not covered by a separate standard. Safety requirements are part of IEC 61010.
- language: fr
  script: Latn
  content: S'applique aux enregistreurs X-Y utilisés pour l'en-registrement de signaux électriques analogiques de grandeurs électriques ou non électriques. S'applique également aux accessoires (par exemples shunts) pour autant que ceux-ci n'aient pas fait l'objet d'une norme séparée. Les prescriptions de sécurité font l'objet de la CEI 61010.
