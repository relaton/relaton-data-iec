abstract:
- language: en
  script: Latn
  content: IEC PAS 63267-3-30:2021 which is a publicly available specification, certain dimensional limits of an 16F MM angled PC rectangular polyphenylene sulphide (PPS) ferrule optical interface in order to meet specific longitudinal offset requirements for fibre-to-fibre interconnection. Ferrules made from the material specified in this document are suitable for use in categories C, OP, OP+, I and E as defined in IEC 61753‑1. Ferrule interface dimensions and features are contained in IEC 61754 (all parts), which deals with fibre optic connector interfaces.
