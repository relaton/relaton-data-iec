abstract:
- language: en
  script: Latn
  content: IEC 62463:2010 lays down standard requirements and also specifies general characteristics, general test procedures, radiation characteristics, electrical characteristics, environmental influences, mechanical characteristics, safety requirements; provides examples of acceptable methods in terms of dose to the whole or part of the body for each screening procedure and the time taken for each screening procedure.
- language: fr
  script: Latn
  content: La CEI 62463:2010 spécifie des exigences normalisées, et également des caractéristiques générales, des procédures générales d'essai, des caractéristiques de rayonnement, des caractéristiques électriques, des influences environnementales, des caractéristiques mécaniques, des exigences de sécurité; fournit des exemples de méthodes acceptables en termes de dose pour le corps humain ou des parties du corps dans le cadre des procédures de contrôle, ainsi que le temps nécessaire à chaque procédure de contrôle.
