abstract:
- language: en
  script: Latn
  content: Applies to electrically operated oil valves for use in, on or in association with equipment for household and similar use that use electricity, in combination with fuel in the liquid state such as distillates, residual fuels, etc. This part 2 also applies to electrically operated oil valves using NTC or PTC thermistors.
- language: fr
  script: Latn
  content: s'applique aux électrovannes de combustible liquide destinées à être utilisées dans, ou en association avec des appareils domestiques et à usage analogue utilisant l'électricité, en combinaison avec des combustibles liquides, tels que des distillats, des combustibles résiduels, etc. La présente partie 2 s'applique également aux électrovannes de combustible liquide utilisant des thermistances NTC ou PTC
