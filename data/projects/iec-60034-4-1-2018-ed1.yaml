abstract:
- language: en
  script: Latn
  content: IEC 60034-4-1:2018 applies to three-phase synchronous machines of 1 kVA rating and larger and describes methods intended to be used for machines having an excitation winding with slip-rings and brushes for their supply. Synchronous machines with brushless excitation require special effort for some of the tests. For machines with permanent magnet excitation, there is a limited applicability of the described tests, and special precautions should be taken against irreversible demagnetization.
- language: fr
  script: Latn
  content: L’IEC 60034-4-1:2018 est applicable aux machines synchrones triphasées dont la puissance assignée est supérieure ou égale à 1 kVA et décrit des méthodes destinées à être utilisées avec des machines ayant un enroulement d’excitation avec des bagues collectrices et des balais pour leur alimentation. Les machines synchrones sans balai d’excitation exigent un investissement particulier pour certains des essais. Pour les machines dont l’excitation est assurée par des aimants permanents, les essais décrits ont une applicabilité limitée et il convient de prendre des précautions particulières contre une démagnétisation irréversible.
