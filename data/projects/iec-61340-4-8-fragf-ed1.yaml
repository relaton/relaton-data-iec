abstract:
- language: fr
  script: Latn
  content: La CEI 61340-4-8:2010 fournit une méthode d'essai pour l'évaluation des performances des sacs de blindage contre les décharges électrostatiques. La tension de conception de l'appareillage d'essai est de 1 000 V. La présente norme est destinée à assurer que les laboratoires d'essai qui utilisent cette méthode d'essai pour évaluer un matériau d'emballage donné obtiendront des résultats similaires.
