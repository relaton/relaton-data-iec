  content: IEC TR 61431:2020 is an informative document relating to aspects of automatic monitor systems as utilized in lead-acid traction battery applications. It lists the characteristics and features that need to be monitored and evaluated to properly assess the operative status of a traction battery. Guidance concerning the accuracy and reliability of the generated information is also provided.
