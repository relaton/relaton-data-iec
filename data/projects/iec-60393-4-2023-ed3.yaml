abstract:
- language: en
  script: Latn
  content: |-
    IEC 60393-4:2023 is applicable to single-turn rotary power potentiometers wire-wound technology. Enamelled, cemented, moulded, enclosed.<br/>
    This specification is applicable to rotary potentiometers with nominal dissipation in excess of 10 W, the resistive element of which consists of a wire or a wound tape. All the potentiometers specified by this specification are slider-driven without reduction. Their stroke less than 360° is limited by stops.<br/>
    This document specifies preferred ratings and characteristics and selects from IEC 60393-1, appropriate quality assessment procedures, tests and measuring methods. It provides general performance requirements for this type of potentiometer.<br/>
    This document gives the minimum performance requirements and test severities. Annex A lists the letters and symbols used in the clauses of this document.<br/>
    This edition includes the following significant technical changes with respect to the previous edition:<br/>
    a) the document structure has been organized to follow new sectional specification structure decided in TC 40;<br/>
    b) the information on the assessment level EZ and FZ (zero nonconforming) has been revised.
- language: fr
  script: Latn
  content: |-
    L’IEC 60393-4:2023 s’applique à la technologie bobinée des potentiomètres rotatifs monotours à forte dissipation (potentiomètres émaillés, cémentés, moulés ou sous enveloppe).<br/>
    La présente spécification s’applique aux potentiomètres rotatifs de dissipation nominale supérieure à 10 W, dont l’élément résistif est constitué d’un fil ou d’une bande enroulée. Tous les potentiomètres spécifiés par la présente spécification sont entraînés par coulisseau sans réduction. Leur course inférieure à 360° est limitée par des butées.<br/>
    Le présent document spécifie des valeurs assignées et des caractéristiques préférentielles et choisit, à partir de l’IEC 60393-1, des procédures d’assurance de la qualité, des essais et des méthodes de mesure appropriés. Il donne des exigences générales de performance pour ce type de potentiomètre.<br/>
    Le présent document fixe les exigences minimales de performance et les sévérités des essais.<br/>
    L’Annexe A liste les lettres et symboles utilisés dans les articles du présent document.<br/>
    Cette édition inclut les modifications techniques majeures suivantes par rapport à l’édition précédente:<br/>
    a) l’organisation de la structure du document suit la nouvelle structure de spécification intermédiaire décidée au sein du TC 40;<br/>
    b) les informations sur le niveau d’évaluation EZ et FZ (zéro non conforme) ont été révisées.
