abstract:
- language: fr
  script: Latn
  content: La CEI 61169-2:2007 est une spécification intermédiaire qui fournit des informations et des règles pour l'élaboration des spécifications particulières relatives aux connecteurs coaxiaux pour fréquences radioélectriques de type 9,52. Elle décrit les dimensions de l'interface pour les connecteurs d'usage général de classe 2, les détails dimensionnels des connecteurs d'essai standard de classe 0, et les informations sur les calibres et les essais obligatoires, sélectionnés dans la CEI 61169-1, applicables à toutes les spécifications particulières relatives aux connecteurs de série 9,52. Cette spécification indique les caractéristiques de performance recommandées à considérer lors de la rédaction d'une spécification particulière, et couvre les programmes d'essais et les exigences de contrôle.
