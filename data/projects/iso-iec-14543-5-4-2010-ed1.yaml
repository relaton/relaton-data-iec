abstract:
- language: en
  script: Latn
  content: "ISO&#x2F;IEC 14543-5-4:2010(E) specifies device validation methods for information devices that implement ISO&#x2F;IEC 14543-5-1. It defines an architecture framework for a device validation system used by test devices and devices under test. Also, it describes and specifies the device interaction process, message exchange requirements and conformance rules. It is applicable to resource sharing and service collaboration among computers, consumer electronics, and communication devices in a Local Area Network (LAN) or Personal Area Network (PAN) environment, especially in a wireless dynamic network.</br>\r\n</br>\r\nThis publication is to be read in conjunction with &lt;a href=&quot;http:&#x2F;&#x2F;webstore.iec.ch&#x2F;webstore&#x2F;webstore.nsf&#x2F;ArtNum_PK&#x2F;43763&quot;&gt;ISO&#x2F;IEC 14543-5-1:2010&lt;&#x2F;a&gt;."
