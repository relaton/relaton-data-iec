abstract:
- language: en
  script: Latn
  content: |-
    IEC TR 6356:2025 describes the impact of various visual display terminal products on the visual fatigue of human beings and describes an evaluation system.<br/>
    This document applies to evaluate the level of visual comfort for users of display terminals (including TV, smart phone, tablet and other electronic display terminals) used in a variety of scenarios.
