abstract:
- language: en
  script: Latn
  content: |-
    IEC 61804-5:2020 specifies the EDDL builtin library and provides the profiles of the various fieldbuses.<br/>
    This second edition cancels and replaces the first edition published in 2015. This edition constitutes a technical revision.<br/>
    This edition was developed by merging material from multiple variants of existing EDDL specifications including those from FieldComm Group (Foundation™ Fieldbus , HART® ), PROFIBUS™ Nutzerorganisation e.V. (PNO), and ISA100_Wireless™ Compliance Institute (ISA100 WCI). As a result, the formatting and numbering of this edition may be different from any of the individual specifications from which this edition was derived.<br/>
    This edition includes the following significant technical changes with respect to the previous edition:<br/>
    • Communication profiles ISA100 and GPE were added.<br/>
    • The following builtins have been deprecated:<br/>
    – ABORT_ON_NO_DEVICE<br/>
    – IGNORE_NO_DEVICE<br/>
    – RETRY_ON_NO_DEVICE<br/>
    – XMTR_ABORT_ON_NO_DEVICE<br/>
    – XMTR_IGNORE_NO_DEVICE<br/>
    – XMTR_RETRY_ON_NO_DEVICE<br/>
    – get_status_code_string
- language: fr
  script: Latn
  content: |-
    IEC 61804-5:2020 spécifie la bibliothèque de builtin EDDL et fournit les profils des différents bus de terrain.<br/>
    Cette deuxième édition annule et remplace la première édition parue en 2015. Cette édition constitue une révision technique.<br/>
    La présente édition a été élaborée en fusionnant le contenu de plusieurs variantes des spécifications de l'EDDL existantes, y compris celles du FieldComm Group (Foundation™ Fieldbus , HART® ), du PROFIBUS™ Nutzerorganisation e.V. (PNO), et de l'ISA100_Wireless™ Compliance Institute (ISA100 WCI). Par conséquent, le formatage et la numérotation de la présente édition peuvent différer des spécifications individuelles desquelles elle est issue.<br/>
    Cette édition inclut les modifications techniques majeures suivantes par rapport à l'édition précédente:<br/>
    • ajout des profils de communication ISA100 et GPE;<br/>
    • les builtins suivants ne sont plus conseillés:<br/>
    – ABORT_ON_NO_DEVICE<br/>
    – IGNORE_NO_DEVICE<br/>
    – RETRY_ON_NO_DEVICE<br/>
    – XMTR_ABORT_ON_NO_DEVICE<br/>
    – XMTR_IGNORE_NO_DEVICE<br/>
    – XMTR_RETRY_ON_NO_DEVICE<br/>
    – get_status_code_string
