abstract:
- language: fr
  script: Latn
  content: |-
    La CEI 62026-3 : 2008 spécifie un système d'interfaces entre un ou plusieurs appareils de commande d'une part, et des appareils ou éléments de commutation pour circuits de commande, d'autre part. Le système d'interfaces utilise deux paires conductrices torsadées blindées, réunies dans un câble - l'une des paires fournit un support de communication différentiel et l'autre alimente les appareils. Cette partie définit des exigences permettant l'interchangeabilité des composants incluant de telles interfaces.
    Cette deuxième édition de la CEI 62026-3 annule et remplace la première édition parue en 2000. Cette deuxième édition constitue une révision technique.
    La version française de cette norme n'a pas été soumise au vote.
    Les principales modifications effectuées par rapport à l'édition antérieure sont indiquées ci-dessous:-ajout de nouveaux services au protocole de messagerie de base de 5.2;-remplacement des exigences détaillées relatives à la couche d'application dans les annexes antérieures par des références en 5.3 aux spécifications correspondantes dans la nouvelle édition de la CEI 61158 (2007);-ajout d'exigences pour un protocole de sécurité correspondant en 5.6 (par référence à la CEI 61784-3);-présentation modifiée des spécifications de câbles et de connecteurs en 8.2 et 8.4, et ajout d'un nouveau type;-ajout de références pour les essais de sécurité à la fois pour les essais de CEM et les essais logiques de 8.10 et 9.3.
