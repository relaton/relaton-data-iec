abstract:
- language: fr
  script: Latn
  content: La CEI 61360-5:2004 est l'extension du schéma du dictionnaire commun ISO/CEI à la définition des concepts utilisés dans la CEI 61360-1 mais qui ne sont pas traités par les modèles d'information spécifiés dans la CEI 61360-2. Elle fournit un modèle formel pour les données conformément au domaine d'application mentionné ci-dessus et ainsi, de fournir, avec la CEI 61360-2, un moyen de représentation interprétable par l'ordinateur et d'échange de toutes les données en conformité avec la CEI 61360-1.
