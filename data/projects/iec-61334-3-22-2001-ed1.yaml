- language: en
  script: Latn
  content: |-
    Establishes definitions, requirements, methods of testing and rated values for phase-to-earth capacitive and screen-to-earth intrusive inductive coupling devices to be used in medium voltage DLC systems.<br/>
    <br/>
    This publication is of high relevance for Smart Grid.
