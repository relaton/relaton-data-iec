abstract:
- language: en
  script: Latn
  content: |-
    Deals with the safety of electric clocks having a rated voltage not more than 250 V.
    Examples of appliances which are within the scope;
    - alarm clocks;
    - spring-driven clocks with an electrically operated winding mechanism.
    - clocks incorporating driving means other than motors. 
    It is to be used in conjunction with IEC 335-1, third edition.
