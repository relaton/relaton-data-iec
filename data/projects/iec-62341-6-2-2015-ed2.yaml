abstract:
- language: en
  script: Latn
  content: |-
    IEC 62341-6-2:2015(E) specifies the standard measurement conditions and measurement methods for determining the visual quality and ambient performance of organic light emitting diode (OLED) display modules and panels. This document mainly applies to colour display modules. This edition includes the following significant technical changes with respect to the previous edition:<br/>
    a) Contents of 7.4 are changed.<br/>
    b) Contents and items of Annex C are changed.<br/>
    c) Annex B is added.
