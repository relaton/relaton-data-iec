abstract:
- language: en
  script: Latn
  content: |-
    IEC 61071:2017 applies to capacitors for power electronics applications. The operating frequency of the systems in which these capacitors are used is usually up to 15 kHz, while the pulse frequencies may be up to 5 to 10 times the operating frequency. The document distinguishes between AC and DC capacitors which are considered as components when mounted in enclosures. This document covers an extremely wide range of capacitor technologies for numerous applications, e.g. overvoltage protection, DC and filtering, switching circuits, energy storage, auxiliary inverters, etc. This second edition cancels and replaces the first edition published in 2007. This edition constitutes a technical revision. This edition includes the following significant technical changes with respect to the previous edition:<br/>
    - Introduction of new terms and definitions;<br/>
    - clarifications for surge discharge test;<br/>
    - indications for measuring procedure during thermal stability test;<br/>
    - clarifications for self-healing test;<br/>
    - clarifications for endurance test;<br/>
    - clarifications for destruction test;<br/>
    - update of normative references;<br/>
    - general editorial review.
- language: fr
  script: Latn
  content: |-
    IEC 61071:2017 s’applique aux condensateurs pour les applications de l’électronique de puissance. La fréquence de fonctionnement des systèmes utilisant ces condensateurs atteint généralement 15 kHz, mais les fréquences d'impulsions peuvent atteindre 5 à 10 fois la fréquence de fonctionnement. Une distinction est faite dans le présent document entre les condensateurs à courant alternatif et les condensateurs à courant continu qui sont considérés comme des composants lorsqu’ils sont montés dans un boîtier fermé. Le présent document couvre une très grande variété de technologies de condensateurs pour répondre à de nombreuses applications, par exemple la protection contre les surtensions, le filtrage à courant continu et à courant alternatif, les circuits de commutation, le stockage d’énergie à courant continu, les inverseurs auxiliaires, etc Cette deuxième édition annule et remplace la première édition publiée en 2007. Cette édition constitue une révision technique. Cette édition inclut les modifications techniques majeures suivantes par rapport à l'édition précédente:<br/>
    - introduction de nouveaux termes et définitions;<br/>
    - clarifications des essais de décharge;<br/>
    - indications sur la procédure de mesure pendant l'essai de stabilité thermique;<br/>
    - clarifications des essais d'autorégénération;<br/>
    - clarifications des essais d'endurance;<br/>
    - clarifications des essais de destruction;<br/>
    - mise à jour des références normatives;<br/>
    - révision éditoriale générale<br/>
    Mots clés: applications de l’électronique de puissance
