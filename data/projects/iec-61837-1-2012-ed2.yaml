abstract:
- language: en
  script: Latn
  content: |-
    IEC 61837-1:2012 deals with standard outlines and terminal lead connections as they apply to SMDs for frequency control and selection in plastic moulded enclosures and is based on IEC 61240.<br/>
    <br/>
    This publication is to be read in conjunction with IEC 61240:1994.
- language: fr
  script: Latn
  content: |-
    La CEI 61837-1:2012 traite des encombrements normalisés et connexions des sorties des dispositifs à montage en surface pour la commande et le choix de la fréquence, applicables aux enveloppes en plastique moulées, et elle est basée sur la CEI 61240.<br/>
    <br/>
    Cette publication doit être lue conjointement avec la CEI 61240:1994.
