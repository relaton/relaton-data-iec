  script: Latn
  content: S'applique aux hottes de cuisine électriques destinées à recycler l'air de la pièce ou à évacuer l'air hors de la pièce. Ne s'applique pas aux appareils industriels. Ne s'applique pas aux ventilateurs situés dans une unité séparée de la hotte de cuisine.
