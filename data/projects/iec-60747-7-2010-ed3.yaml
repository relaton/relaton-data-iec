abstract:
- language: en
  script: Latn
  content: |-
    IEC 60747-7:2010 gives the requirements applicable to the following sub-categories of bipolar transistors excluding microwave transistors.<br/>
    - Small signal transistors (excluding switching and microwave applications);<br/>
    - Linear power transistors (excluding switching, high-frequency, and microwave applications);<br/>
    - High-frequency power transistors for amplifier and oscillator applications;<br/>
    - Switching transistors for high speed switching and power switching applications;<br/>
    - Resistor biased transistors. The main changes with respect to previous edition are listed below.<br/>
    a) Clause 1 was amended by adding an item that should be included.<br/>
    b) Clauses 3, 4, 5, 6 and 7 were amended by adding terms, definitions, suitable additions and deletions those should be included.<br/>
    c) The text of the second edition was combined with that of IEC 60747-7-5.<br/>
    <br/>
    This publication is to be read in conjunction with IEC 60747-1:2006.
- language: fr
  script: Latn
  content: |-
    La CEI 60747-7:2010 donne les exigences applicables aux sous-catégories suivantes de transistors bipolaires, à l'exclusion des transistors micro-ondes.<br/>
    - Transistors petits signaux (à l'exclusion des applications en commutation et en micro-ondes);<br/>
    - Transistors de puissance linéaire (à l'exclusion des applications en commutation, à haute fréquence et en micro-ondes);<br/>
    - Transistors de puissance haute fréquence pour applications en amplificateurs et en oscillateurs;<br/>
    - Transistors de commutation pour applications en commutation à grande vitesse et en commutation de puissance;<br/>
    - Transistors à résistances de polarisation. Les principaux changements par rapport à l'édition précédente sont énumérés ci-dessous.<br/>
    a) L'article 1 a été amendé par l'ajout d'un élément qu'il convient d'inclure.<br/>
    b) Les articles 3, 4, 5, 6 et 7 ont été amendés en ajoutant des termes et des définitions, ainsi que des ajouts et suppressions adaptés qu'il convient d'inclure.<br/>
    c) Le texte de la deuxième édition a été combiné à la CEI 60747-7-5.<br/>
    <br/>
    Cette publication doit être lue conjointement avec la CEI 60747-1:2006.
