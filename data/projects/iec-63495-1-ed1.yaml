abstract:
- language: en
  script: Latn
  content: 'IEC 63495-1: 2026 specifies the definition and general requirements for
    the interoperability and safety of dynamic wireless power transfer for railways
    via magnetic field to electric railway rolling stock in motion or stationary for
    the purpose of supplying electric energy to motor or energy storage systems. Interoperability
    requirements include the capacity, efficiency, frequency and communication of
    wireless power transfer. Safety requirements include electrical safety and electromagnetic
    safety. Electrical safety includes the stored energy, touch current and insulation
    resistance. Electromagnetic safety includes electromagnetic field safety with
    human bodies and electromagnetic interference to devices. Other parts include
    the specific requirements.'
