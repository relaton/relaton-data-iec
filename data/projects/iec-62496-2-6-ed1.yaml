abstract:
- language: en
  script: Latn
  content: |-
    This document defines the procedure of NFP (near field pattern) analysis of a multimode optical waveguide with rectangular core(s) with use of EF (encircled flux) analysis methodology. Circular optical fibres are out of the scope of this document.<br/>
    Optical waveguides that can be connected to graded index multimode fibres (e.g. OM3, A4i, etc.) are applicable.
