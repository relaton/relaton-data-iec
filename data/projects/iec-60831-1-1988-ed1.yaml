abstract:
- language: en
  script: Latn
  content: Applies to self-healing capacitor units and banks intended to be used, in particular, for power-factor correction of a.c. power systems of up to and including 660 V rated voltage and frequency 15 Hz to 60 Hz.
- language: fr
  script: Latn
  content: |-
    S'applique aux condensateurs unitaires et aux batteries de
    condensateurs autorégénérateurs devant servir plus particulièrement
    à la correction du facteur de puissance des réseaux à courant
    alternatif à tension assignée égale ou inférieure à 660 V et à
    fréquence comprise entre 15 et 60 Hz.

    Cette publication remplace la CEI 70.
