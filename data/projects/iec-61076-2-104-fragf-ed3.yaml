abstract:
- language: en
  script: Latn
  content: This part of IEC 61076 describes 3-way to 12-way circular connectors with M8 screw-locking or with nominal  8 mm snap-locking, for connection of automation devices, for signal and power transmission up to 50 V AC / 60 V DC rated voltage and up to 4 A rated current.
- language: fr
  script: Latn
  content: La présente partie de l’IEC 61076 décrit les connecteurs circulaires de 3 à 12 voies à vis M8 ou à encliquetage de 8 mm de  nominal, destinés à la connexion d’appareils d’automatisme, pour la transmission de signaux et de puissance, sous une tension assignée allant jusqu’à 50 V en courant alternatif ou 60 V en courant continu et jusqu’à un courant assigné de 4 A.
