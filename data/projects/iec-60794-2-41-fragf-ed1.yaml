abstract:
- language: fr
  script: Latn
  content: |-
    L'IEC 60794-2-41:2008 couvre les fibres A4a à A4g simplex et duplex pour utilisation à l'intérieur. Celles-ci peuvent être coupées pour obtenir de faibles longueurs qui peuvent être utilisées dans les cordons de brassage assemblés. Les exigences de la spécification intermédiaire CEI 60794-2 sont applicables aux câbles couverts par la présente norme.
    Mots clés: fibres A4a à A4g, les cordons de brassage assemblés
