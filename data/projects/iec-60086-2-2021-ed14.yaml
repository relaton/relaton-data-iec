abstract:
- language: en
  script: Latn
  content: |-
    CORRECTED VERSION 2026-03<br/>
    <br/>
    IEC 60086-2:2021 is applicable to primary batteries which are based on standardised electrochemical systems.<br/>
    It specifies<br/>
    – the physical dimensions,<br/>
    – the discharge test conditions and discharge performance requirements.<br/>
    The contents of the corrigenda 1 (2022-06) and 2 (2026-03) have been included in this copy.
- language: fr
  script: Latn
  content: |-
    VERSION CORRIGEE 2026-03<br/>
    <br/>
    L'IEC 60086-2:2021 s’applique aux piles électriques qui ont recours à des systèmes électrochimiques normalisés.<br/>
    Elle spécifie:<br/>
    – les dimensions physiques,<br/>
    – les conditions d’essai de décharge et les exigences de performance en décharge.<br/>
    Le contenu des corrigenda 1 (2022-06) et 2 (2026-03) ont été pris en considération dans cet exemplaire.
