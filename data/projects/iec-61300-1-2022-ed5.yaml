abstract:
- language: en
  script: Latn
  content: |-
    IEC 61300-1:2022 provides general information and guidance for the basic test and measurement procedures defined in IEC 61300-2 (all parts) and IEC 61300-3 (all parts) for interconnecting devices, passive components, mechanical splices, fusion splice protectors, fibre management systems and protective housings. This document is used in combination with the relevant specification which defines the tests to be used, the required degree of severity for each of them, their sequence, if relevant, and the permissible performance limits. In the event of conflict between this document and the relevant specification, the latter takes precedence. This fifth edition cancels and replaces the fourth edition published in 2016. This edition constitutes a technical revision. This edition includes the following significant technical changes with respect to the previous edition:<br/>
    - addition of the information of measurement uncertainties in 4.2.1;<br/>
    - change of the requirements for attenuation variation in 4.2.2;<br/>
    - addition of the multimode launch conditions of other fibres than A1-OM2, A1-OM3, A1-OM4, A1-OM5 and A3e in 10.4;<br/>
    - addition of the multimode launch conditions of the planer waveguide in 10.6;<br/>
    - splitting Annex A for EF and Annex B for EAF;<br/>
    - correction of errors in the definitions of encircled flux and encircled angular flux.
- language: fr
  script: Latn
  content: |-
    L'IEC 61300-1:2022 donne des informations d'ordre général et des recommandations concernant les procédures fondamentales d’essai et de mesure définies dans l'IEC 61300-2 (toutes les parties) et l'IEC 61300-3 (toutes les parties) et applicables aux dispositifs d'interconnexion, aux composants passifs, aux épissures mécaniques, aux protecteurs d'épissures par fusion, aux systèmes de gestion des fibres et aux boîtiers de protection. Le présent document est utilisé avec la spécification applicable qui définit les essais à réaliser, le degré de sévérité exigé pour chacun d’eux, l'ordre dans lequel ils sont effectués, le cas échéant, et les limites des performances admissibles. Si le présent document et la spécification applicable sont en contradiction, c’est cette dernière qui prévaut. Cette édition inclut les modifications techniques majeures suivantes par rapport à l'édition précédente:<br/>
    - ajout d'informations sur les incertitudes de mesure en 4.2.1;<br/>
    - modification des exigences pour la variation d'affaiblissement en 4.2.2;<br/>
    - ajout des conditions d’injection en multimodal des fibres autres que A1-OM2, A1-OM3,<br/>
    - A1-OM4, A1-OM5 et A3e en 10.4;<br/>
    - ajout des conditions d’injection en multimodal du guide d'onde plan en 10.6;<br/>
    - séparation de l'Annexe A pour l’EF et de l'Annexe B pour l’EAF;<br/>
    - correction d'erreurs dans les définitions du flux inscrit et du flux angulaire inscrit.
