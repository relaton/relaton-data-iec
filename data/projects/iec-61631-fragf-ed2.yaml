abstract:
- language: en
  script: Latn
  content: |
    <!-- NEW! -->IEC 61631:2020 is available as IEC 61631:2020 RLV which contains the International Standard and its Redline version, showing all changes of the technical content compared to the previous edition.<br/>
    <br/>
    IEC 61631:2020 specifies a test method for the mechanical strength of cores made of magnetic oxides. This test method is suitable for most of the E-cores, ETD-cores, I-cores and ring-cores but other core types such as U-cores could be tested according to a derived method agreed by the parties concerned. This document is also applicable to the mechanical strength measurement of magnetic powder cores.<br/>
    This edition includes the following significant technical changes with respect to the previous edition:

    	the phrase: "This document is also applicable to the mechanical strength measurement of magnetic powder cores" has been added in the scope;
    	IEC 61246 has been replaced by IEC 63093-8; EN 1002-2 has been replaced by ISO 7500-1; ISO 4677-1 and ISO 4677-2 have been withdrawn;
    	dimensions D and F in Figure A.1 and Table A.1 have been changed to be consistent with Figure 1 of IEC 63093-8:2018;
    	addition of the content of ring-cores test;
    	addition of Annex B;
    	the location of the jig is amended in Figure 3;
    	in Figure 5, the roller bars are moved to the edge of the I-core, aligned with the core.
- language: fr
  script: Latn
  content: |
    <!-- NEW! -->IEC 61631:2020 est disponible sous forme de IEC 61631:2020 RLV qui contient la Norme internationale et sa version Redline, illustrant les modifications du contenu technique depuis l'édition précédente.<br/>
    <br/>
    IEC 61631:2020 spécifie une méthode d'essai pour la résistance mécanique des noyaux en oxydes magnétiques. Cette méthode d'essai est adaptée à la plupart des noyaux E, noyaux ETD, noyaux I et noyaux toriques, mais d'autres types de noyaux tels que les noyaux en U peuvent être soumis aux essais selon une méthode dérivée convenue par les parties concernées. Le présent document est également applicable au mesurage de la résistance mécanique des noyaux en poudre magnétique.<br/>
    Cette édition inclut les modifications techniques majeures suivantes par rapport à l'édition précédente:

    	la phrase "Le présent document est également applicable au mesurage de la résistance mécanique des noyaux en poudre magnétique" a été ajoutée au domaine d’application;
    	l’IEC 61246 a été remplacée par l’IEC 63093-8; l’EN 1002-2 a été remplacée par l’ISO 7500-1; l’ISO 4677-1 et l’ISO 4677-2 ont été supprimées;
    	les dimensions D et F dans la Figure A.1 et le Tableau A.1 ont été modifiées pour se conformer à la Figure 1 de l’IEC 63093-8:2018;
    	ajout du contenu de l’essai des noyaux toriques;
    	ajout de l’Annexe B;
    	l’emplacement du gabarit est modifié dans la Figure 3;
    	dans la Figure 5, les barres de roulement sont déplacées au bord du noyau I, alignées avec le noyau.
