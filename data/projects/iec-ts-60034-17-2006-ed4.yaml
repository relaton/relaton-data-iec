  script: Latn
  content: Traite du fonctionnement en régime établi des moteurs à induction à cage, compris dans le domaine d'application de la CEI 60034-12, lorsqu'ils sont alimentés par convertisseurs. Couvre le fonctionnement dans toute la plage de réglage de vitesse, mais ne traite ni du démarrage ni des phénomènes transitoires.
