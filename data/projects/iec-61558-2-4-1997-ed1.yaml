abstract:
- language: en
  script: Latn
  content: |-
    This part 2 of IEC 61558 applies to stationary or portable,
    single-phase or polyphase, air-cooled isolating transformers,
    associated or otherwise.


    It has the status of a group safety publication in accordance with
    IEC Guide 104.


    This part 2 supplements or modifies the corresponding clauses in
    IEC 61558-1,


    This Standard replaces Chapter I of IEC 742.
- language: fr
  script: Latn
  content: |-
    La présente partie 2 de la CEI 61558 est applicable aux
    transformateurs de séparation des circuits, fixes ou mobiles,
    monophasés ou polyphasés, à refroidissement par air, associés ou
    non.


    Elle a le statut de publication groupée de sécurité conformément au
    guide CEI 104.


    La présente partie 2 complète ou modifie les articles
    correspondants de la CEI 61558-1


    La présente norme remplace le Chapitre I de la CEI 742.
