abstract:
- language: en
  script: Latn
  content: |-
    IEC 60984:2014 is applicable to electrical insulating sleeves for the protection of workers from accidental contact with live electrical conductors, apparatus or circuits. The products designed and manufactured according to this standard contribute to the safety of the users provided they are used by skilled persons, in accordance with safe methods of work and the instructions for use. Unless otherwise stated, in this standard the term "sleeve" is used for "electrical insulating sleeve". This second edition cancels and replaces the first edition, published in 1990 and its Amendment 1 published in 2002. It constitutes a technical revision which includes the following major changes:<br/>
    - removal of the requirement for an area to mark the date of inspection;<br/>
    - only the straight mounting method with water electrodes is specified for the dielectric type test;<br/>
    - the d.c. electric tests are no longer included in the normative part of the document, but a new informative Annex E is added;<br/>
    - preparation of the elements of evaluation of defects, and general application of IEC 61318:2007;<br/>
    - in the new normative Annex F, updating of the characteristics of the liquid specified for tests on sleeves of category H, according to the latest edition of ISO 1817;<br/>
    - introduction of a new normative Annex G on classification of defects;<br/>
    - introduction of a new informative Annex H on the rationale for the classification of defects;<br/>
    - and for periodic electrical retesting, recommended voltage limit of the dielectric test methods to 10 kV except in case of the test method with water electrodes and straight mounting.
- language: fr
  script: Latn
  content: |-
    L'IEC 60984:2014 est applicable aux protège-bras isolants électriques destinés à protéger les travailleurs contre les contacts accidentels avec des conducteurs, des appareils ou des circuits sous tension. Les produits conçus et fabriqués conformément à la présente norme contribuent à la sécurité des utilisateurs, pourvu qu'ils soient utilisés par des personnes qualifiées, conformément à des méthodes de travail sûres et aux instructions d'emploi. Sauf indication contraire, dans la présente norme le terme "protège-bras" est utilisé pour "protège-bras isolant électrique". Cette deuxième édition annule et remplace la première édition parue en 1990 et son Amendement publié en 2002. Elle constitue une révision technique qui inclut les modifications majeures suivantes:<br/>
    - le retrait de l'exigence pour une bande permettant l'inscription de la date de vérification;<br/>
    - la spécification unique de la méthode de montage droit des protège-bras avec électrodes liquides pour l'essai de type diélectrique;<br/>
    - la disparition de la partie normative du document des essais électriques en courant continu, mais l'introduction d'une nouvelle Annexe E informative;<br/>
    - la préparation des éléments d'évaluation des défauts et de l'application générale de l'IEC 61318:2007;<br/>
    - dans la nouvelle Annexe F normative, la mise à jour des caractéristiques du liquide spécifié pour la réalisation des essais des protège-bras de catégorie H, selon la dernière édition de l'ISO 1817;<br/>
    - l'introduction d'une nouvelle Annexe G normative traitant de la classification des défauts;<br/>
    - l'introduction d'une nouvelle Annexe H informative présentant le raisonnement ayant conduit à la classification des défauts;<br/>
    - et en ce qui a trait aux essais électriques périodiques, une limite recommandée de la tension d'essai diélectrique de 10 kV, sauf dans le cas de la méthode avec montage droit et électrodes liquides.
