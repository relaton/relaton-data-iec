abstract:
- language: en
  script: Latn
  content: |-
    IEC 63507-2026 specifies the general requirements and test methods of 200 MeV to 400 MeV superconducting proton cyclotron as nuclear instrument for applications in many fields, such as, but not limited to, scientific research, industry, non-destructive testing and medicine.<br/>
     <br/>
    It specifies the structure, performance, technical requirements, test methods, inspection, identification, packing, transportation, storage and accompanying documents for such cyclotrons.
