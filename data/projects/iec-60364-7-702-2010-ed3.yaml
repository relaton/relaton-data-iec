abstract:
- language: en
  script: Latn
  content: |-
    IEC 60364-7-702:2010 applies to electrical installations of:<br/>
    - basins of swimming pools and paddling pools and their surrounding zones;<br/>
    - areas in natural waters, lakes in gravel pits and coastal and similar areas, specially intended to be occupied by persons for swimming, paddling and similar purposes, and their surrounding zones. Such areas in natural waters, lakes in gravel pits and coastal and similar areas, are considered as swimming pools;<br/>
    - basins of fountains and their surrounding zones.<br/>
    For swimming pools for medical use, special requirements may apply. This third edition cancels and replaces the second edition published in 1997 and constitutes a technical revision. The main changes with respect to the previous edition are as follows:<br/>
    - the scope has been improved, including natural areas in natural waters;<br/>
    - the description of zones has been improved;<br/>
    - all figures have been updated.<br/>
    This publication contains colours which are considered to be useful for the correct understanding of its contents.
- language: fr
  script: Latn
  content: |-
    La CEI 60364-7-702:2010 les exigences particulières sont applicables aux installations électriques des:<br/>
    - bassins des piscines et des pataugeoires, et des volumes les entourant;<br/>
    - volumes situés dans des eaux naturelles, lacs de gravières et zones côtières et analogues, destinés tout particulièrement à être occupés par des personnes pratiquant la natation, le canotage et autres activités similaires, et des volumes les entourant. Ces volumes situés dans des eaux naturelles, lacs de gravières et zones côtières et analogues, sont considérés comme étant des piscines;<br/>
    - bassins de fontaines et des volumes les entourant.<br/>
    Pour les piscines à usage médical, des exigences particulières peuvent s'appliquer. Cette troisième édition annule et remplace la seconde édition publiée en 1997 et constitue une révision technique. Les principales modifications par rapport à l'édition précédente sont les suivantes:<br/>
    - le domaine d'application a été amélioré en y ajoutant les aires naturelles dans les eaux naturelles;<br/>
    - la description des volumes a été améliorée;<br/>
    - toutes les figures ont été mises à jour.<br/>
    Cette publication indique qu'elle contient des couleurs qui sont considérées comme utiles à une bonne compréhension de son contenu.
