abstract:
- language: en
  script: Latn
  content: |-
    IEC 60794-1-128:2026 defines the test procedures used to establish uniform requirements for testing cable performance under tension combined with 90 degree bend over a rod. It applies to optical fibre cables for use with telecommunication equipment and devices employing similar techniques, and to cables having a combination of both optical fibres and electrical conductors.<br/>
    This first edition cancels and replaces Method E28 of IEC 60794-1-21 published in 2015. It constitutes an editorial revision arising from the adoption of a new structure and numbering system for the series of standards.
