abstract:
- language: en
  script: Latn
  content: Establishes general principles for describing the structure of information about systems and of systems themselves. These principles are general and are intended to be applicable to all technical areas. It has the status of a horizontal standard in accordance with IEC Guide 108.
- language: fr
  script: Latn
  content: Etablit les principes généraux applicables à la structuration des informations concernant les systèmes et des systèmes eux-mêmes. Ces principes sont généraux et sont destinés à s'appliquer à tous les domaines techniques. Elle a le statut d'une norme horizontale conformément au Guide 108 de la CEI.
