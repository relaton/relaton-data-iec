abstract:
- language: fr
  script: Latn
  content: |-
    L'IEC 61754-7:2008 définit les dimensions d'interface normalisées pour la famille de connecteurs de type MPO. Cette troisième édition annule et remplace la deuxième édition parue en 2004. Cette troisième édition constitue une révision technique. Les modifications techniques spécifiques incluent l'ajout de la définition d'une interface de raccord à détrompeur aligné pour couvrir l'ensemble des applications MPO existantes.
    Mots clés: dimensions d'interface normalisées pour la famille de connecteurs de type MPO
