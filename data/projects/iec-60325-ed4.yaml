abstract:
- language: en
  script: Latn
  content: |-
    IEC 60325-2026 focuses on alpha, beta and alpha-beta (maximum beta energy &gt; 60 keV) contamination meters and monitors. They are widely used for measuring or detecting surface contamination of various targets such as floors and walls of radiation facilities, equipment, personnel, items to be removed from a radiation control area. They are also used for measuring or detecting surface contamination outside the facilities.<br/>
    <br/>
    This fourth edition cancels and replaces the third edition published in 2002. This edition constitutes a technical revision.<br/>
    <br/>
    This edition includes the following significant technical changes with respect to the previous edition:<br/>
    <br/>
    a)    Measurement traceability to the national metrological standard of activity is required.<br/>
    b)    Introduction of uncertainty of measurement according to ISO/IEC GUIDE 98 3.<br/>
    c)    Addition of light protection requirements.<br/>
    d)    Update of environmental, mechanical and electromagnetic compatibility requirements according to IEC 62706.<br/>
    e)    Replacement of the relative intrinsic error with a linearity test.
