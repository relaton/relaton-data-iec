- language: en
  script: Latn
  content: Provides a guide for HAZOP studies of systems utilizing the specific set of guide words defined in this standard. Also gives guidance on application of the technique and on the HAZOP study procedure, including definition, preparation, examination sessions and resulting documentation and follow-up.
