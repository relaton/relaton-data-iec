  script: Latn
  content: Constitue un guide d'application des études HAZOP aux systèmes qui utilisent l'ensemble spécifique de mots-guides définis dans cette norme. Donne également des indications sur l'application de la technique et sur la procédure de l'étude HAZOP, y compris la définition, la préparation, les sessions d'examen ainsi que les documents et le suivi qui en résultent.
