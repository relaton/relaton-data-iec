abstract:
- language: fr
  script: Latn
  content: |-
    L'IEC 61169-16:2006 est une spécification intermédiaire qui fournit des informations et des règles pour la préparation des spécifications particulières pour les connecteurs coaxiaux mâles et femelles pour fréquences radioélectriques avec verrouillage à vis, pour des applications de puissance basse à moyenne. Ce connecteur est communément connu comme étant du "type N". Cette partie de l'IEC 61169 annule et remplace l'IEC 60169-16 publiée en 1982, ainsi que son Amendement 1 (1996). Cette édition constitue une révision technique. Cette édition contient les modifications techniques significatives suivantes par rapport à l'IEC 60169-16:<br/>
    - Les Articles 7 et 8 ont été entièrement réécrits et l'Article 9 a été supprimé.<br/>
    - l'Article 7 contient actuellement les programmes d'essai et<br/>
    - l'Article 8 donne des indications pour remplir une spécification particulière cadre (BDS).
