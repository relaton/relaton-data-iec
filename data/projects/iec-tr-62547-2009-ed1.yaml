abstract:
- language: en
  script: Latn
  content: |-
    IEC/TR 62547:2009(E) is a technical report that describes two methods for the measurement of the sensitivity of single-mode optical fibres to high-power damage at bends.<br/> 
    - Method 1 - Failure time characterization as a function of the launch power and bend conditions (bend angle and bend diameter).<br/>
    - Method 2 - Equilibrium temperature measurement.
