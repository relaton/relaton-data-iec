abstract:
- language: en
  script: Latn
  content: Specifies additional or replacement requirements for performance which extend the scope of IEC 731 to include dosimeters with ionization chambers intended for use in radiotherapy for the measurement of absorbed dose in photon beams at energies above 3 MeV and in electron beams.
- language: fr
  script: Latn
  content: Spécifie des prescriptions de performance complémentaires ou de remplacement, afin d'étendre le domaine d'application de la CEI 731 pour inclure les dosimètres à chambre d'ionisation utilisés en radiothérapie pour le mesurage de la dose absorbée dans les faisceaux de photons d'énergie supérieure à 3 MeV et dans les faisceaux d'électrons.
