abstract:
- language: en
  script: Latn
  content: |-
    IEC 62629-22-1:2016(E) specifies optical measuring methods for autostereoscopic display devices. It defines general measuring procedures for optical characteristics of two-view and multi-view displays and integral imaging displays. This edition includes the following significant technical changes with respect to the previous edition:<br/>
    a) addition of offset crosstalk and 3D pixel crosstalk as 3D crosstalk related property.
