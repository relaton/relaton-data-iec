abstract:
- language: fr
  script: Latn
  content: La CEI 60384-18:2008 s'applique aux condensateurs fixes électrolytiques à l'aluminium pour montage en surface à électrolyte solide (MnO<sub>2</sub>) destinés principalement aux applications en courant continu dans des équipements électroniques. Elle prescrit les caractéristiques et valeurs nominales préférentielles, de sélectionner, en se référant à la norme CEI 60384-1, les procédures d'assurance qualité appropriées, les essais et les méthodes de mesure et de donner les exigences de performances générales pour ce type de condensateur. Il convient que les sévérités et les exigences d'essai prescrites dans les spécifications particulières se rapportant à cette spécification intermédiaire présentent des niveaux performances supérieurs ou égaux, parce que les niveaux de performance inférieurs ne sont pas autorisés. Cette deuxième édition annule et remplace la première édition publiée en 1993, ainsi que son Amendement 1 (1998). Cette édition constitue une révision mineure des tableaux, valeurs et références.
