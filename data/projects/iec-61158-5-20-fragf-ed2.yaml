abstract:
- language: fr
  script: Latn
  content: 'La CEI 61158-5-20:2010 spécifie la structure et les services de la couche application des bus de terrain de Type 20, en conformité avec le Modèle de référence de base de l''OSI (ISO/CEI 7498-1) et la structure de la couche application de l''OSI (ISO/CEI 9545). Cette seconde édition annule et remplace la première édition, parue en 2007 et constitue une révision technique. Les principales modifications par rapport à l''édition précédente sont: VFD ASE révisée. La présente version bilingue publiée en 2012-01 correspond à la version anglaise monolingue publiée en 2010-08.'
