  content: "<!-- NEW -->IEC 60335-2-86:2018 est disponible sous forme de IEC 60335-2-86:2018 RLV qui contient la Norme internationale et sa version Redline, illustrant les modifications du contenu technique depuis l'édition précédente."
- language: fr
  script: Latn
  content: |-
    <!-- NEW -->L'IEC 60335-2-86:2018 traite de la sécurité des équipements électriques de pêche au moyen desquels l’eau peut être électrifiée afin de pêcher des poissons ou de constituer des barrières pour tous les animaux vivant dans l’eau.<br/>
    La tension assignée des équipements électriques de pêche n’est pas supérieure à 250 V pour les équipements monophasés et à 480 V pour les autres machines, mais la tension assignée des équipements électriques de pêche pour raccordement permanent aux canalisations fixes n’est pas supérieure à 1 000 V.<br/>
    Les équipements électriques de pêche sont des appareils à usage scientifique et commercial.<br/>
    Des exigences supplémentaires relatives aux équipements électriques de pêche montés sur un bateau sont données à l'Annexe AA.<br/>
    Exemples d’équipements électriques de pêche entrant dans le domaine d’application de la présente norme:<br/>
    – les équipements électriques de pêche alimentés par le réseau, y compris ceux qui sont alimentés par des générateurs mobiles ou fixes;<br/>
    – équipement électrique de pêche alimenté par piles ou accumulateurs.<br/>
    L'attention est attirée sur le fait que:<br/>
    – pour les appareils destinés à être utilisés à bord de navires ou de bateaux, des exigences supplémentaires peuvent être nécessaires;<br/>
    – dans de nombreux pays, des exigences supplémentaires sont spécifiées par les organismes nationaux de la santé, par les organismes nationaux responsables de la protection des travailleurs, par les organismes nationaux responsables de l'alimentation en eau et par des organismes similaires.<br/>
    La présente Norme ne s’applique pas<br/>
    – aux électrificateurs de clôtures (IEC 60335-2-76);<br/>
    – aux appareils électriques d'insensibilisation des animaux (IEC 60335-2-87);<br/>
    – aux dispositifs de défense contre les requins qui sont portés par l'utilisateur.<br/>
    Cette troisième édition annule et remplace la deuxième édition publiée en 2002, son Amendement 1 (2005) et son Amendement 2 (2012). Cette édition constitue une révision technique.<br/>
    Cette édition inclut les modifications techniques significatives suivantes par rapport à l'édition précédente:<br/>
    – le texte a été aligné sur l'IEC 60335-1, Ed 5, son Amendement 1 et son Amendement 2;<br/>
    – certaines notes ont été converties en texte normatif (22.102, 22.113, 26.106);<br/>
    – les exigences relatives aux équipements électriques de pêche alimentés par batterie ou accumulateurs ont été déplacées à l'Annexe S.
