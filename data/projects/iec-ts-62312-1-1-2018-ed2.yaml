abstract:
- language: en
  script: Latn
  content: |-
    IEC TS 62312-1-1:2018 gives guidelines for methods of synchronization of audio and video and describes general measurement methods for the synchronization of audio and video equipment. IEC TS 62312-1-1:2018 cancels and replaces the first edition published in 2008. This edition constitutes a technical revision. This edition includes the following significant technical changes with respect to the previous edition:<br/>
    a) new Annex B informs of general measurement and test method of audio latency;<br/>
    b) comments from SMPTE (including small technical issues).
