abstract:
- language: en
  script: Latn
  content: |-
    Specifies requirements for audiometric equipment designed
    for use in pure tone audiometry in the frequency range from
    8 000 Hz to 16 000 Hz, in addition to those that are applicable and specified in IEC 645-1.
- language: fr
  script: Latn
  content: Donne des spécifications concernant les équipments audiométriques conçus pour une utilisation en audiométrie tonale dans un domaine de fréquences compris entre 8 000 Hz et 16 000 Hz, en plus des prescriptions qui sont spécifiées dans la CEI 645-1 et qui sont également applicables.
