abstract:
- language: en
  script: Latn
  content: |-
    IEC TS 62607-4-6:2018(E) provides a method for determination of carbon content of nano electrode materials by infrared absorption spectroscopy method. The method is applicable to carbon contents of mass fraction between 0,001 % and 100 %.<br/>
    This method will enable customers to:<br/>
    a) decide whether or not a nano electrode material is usable, and<br/>
    b) select a nano electrode material with suitable carbon content for its application.<br/>
    This document includes:  <br/>
    - recommendations for sample preparation,  <br/>
    - outlines of the experimental procedures used to measure electrode nanomaterial properties,  <br/>
    - methods of interpretation of results and discussion of data analysis, and<br/>
    - case studies.
