  script: Latn
  content: Traite de la sécurité des appareils électriques comportant des émetteurs pour l'exposition de la peau aux rayonnements ultraviolets ou infrarouges, destinés à des usages domestiques et analogues et dont la tension assignée n'est pas supérieure à 250 V pour les appareils monophasés et à 480 V pour les autres appareils.
