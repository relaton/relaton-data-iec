abstract:
- language: fr
  script: Latn
  content: |-
    La CEI 61784-1:2010 définit un jeu de profils de communication spécifiques au protocole, principalement fondé sur la série de normes CEI 61158, qui doit être utilisé pour la conception de dispositifs employés en communication dans le cadre du contrôle de la fabrication et du processus en usine. Chaque profil choisit des spécifications pour la pile du protocole de communication au niveau du dispositif. Il comporte un jeu minimal de services exigés au niveau de la couche application et la spécification d'options dans les couches intermédiaires définies par le biais de références. Si aucune couche application n'est incluse, il est spécifié un jeu minimal de services exigés au niveau de la couche liaison de données. Les références appropriées aux types spécifiques au protocole sont données dans chaque famille de profils de communication ou dans des profils associés Cette troisième édition annule et remplace la seconde édition parue en 2007. et constitue une révision technique. Les principales modifications effectuées par rapport à l'édition précédente sont:<br/>
    - la mise à jour des références datées à la série de normes CEI 61158, à la CEI 61784-2, à la série de normes CEI 61784-3, à la série de normes CEI 61784-5 et à la CEI 61918 dans l'ensemble du document;<br/>
    - la mise à jour des titres des documents cités et des références, si nécessaire;<br/>
    - la mise à jour des tableaux de sélection pour CPF 1, CPF 2, CPF 5 et CPF 8.<br/>
    La présente version bilingue, correspond à la version anglaise monolingue publiée en 2010-07.
