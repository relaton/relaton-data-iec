abstract:
- language: en
  script: Latn
  content: This part of the IEC 61557 series specifies the requirements for DC electric vehicle supply equipment monitoring devices, hereinafter abbreviated to DC EVSE MD, that provide insulation monitoring in DC EVSE in accordance with the requirements of IEC 61851, all parts. This standard does not cover general purpose insulation monitoring devices (IMD) in accordance with IEC 61557-8. This standard does not cover protective devices used to provide automatic disconnection of the supply.
