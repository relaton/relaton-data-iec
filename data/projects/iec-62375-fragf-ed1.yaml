abstract:
- language: fr
  script: Latn
  content: La CEI 62375:2004 spécifie la méthode de transfert du code d'information de format, du code d'information prévu pour copier un enregistrement numérique, ainsi que d'autres codes dans l'intervalle de suppression de trame du signal de luminance. Elle s'applique au transfert des informations vidéo avec le signal vidéo par l'intermédiaire du signal analogique en bande de base des systèmes vidéo 625 lignes/50 trames à balayage progressif entre des matériels vidéo numériques et analogiques. La présente version bilingue (2012-08) correspond à la version anglaise monolingue publiée en 2004-02.
