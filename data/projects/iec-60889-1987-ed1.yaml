abstract:
- language: en
  script: Latn
  content: Applies to hand-drawn aluminium wires for the manufacture of stranded conductors for overhead power transmission purposes. Specifies the mechanical and electrical properties of wires in the diameter rank 1.25 mm to 5.00 mm. This publication supersedes IEC 60111 (1983).
- language: fr
  script: Latn
  content: S'applique aux fils en aluminium écroui dur pour la fabrication de conducteurs câblés pour lignes aériennes de transport d'énergie électrique. Spécifie les propriétés mécaniques et électriques des fils dans la gamme de diamètres de 1,25 mm à 5,00 mm. Cette publication remplace la CEI 60111 (1983).
