abstract:
- language: en
  script: Latn
  content: Applies to static convertors using semiconductor rectifying elements, such as diodes, reverse blocking triode thyristors, etc. Applies to a.c./d.c., d.c./a.c., d.c./d.c. and a.c./a.c. conversions.
- language: fr
  script: Latn
  content: 'S''applique aux convertisseurs statiques faisant appel à des éléments redresseurs à semiconducteurs tels que diodes, thyristors triodes de blocage inverse, etc. S''applique à tous les types de conversion: courant alternatif/courant continu, courant continu/courant alternatif, courant continu/courant continu et courant alternatif/courant alternatif.'
