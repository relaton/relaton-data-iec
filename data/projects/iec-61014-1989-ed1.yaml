abstract:
- language: en
  script: Latn
  content: Gives guidelines for the exposure and removal of weaknesses in hardware and software items for the purpose of reliability growth. Applies when the specification calls for a reliability growth programme of equipment. A statement of the basic concepts is followed by descriptions of the management, planning, testing and failure analysis. Mathematical modelling, to estimate the level of reliability achieved, is outlined briefly.
- language: fr
  script: Latn
  content: Fournit des directives pour la détection et l'élimination des fragilités du matériel et du logiciel afin d'accroître la fiabilité. S'applique lorsque la spécification réclame un programme de croissance de fiabilité de l'équipement. Un exposé des concepts de base est suivi des descriptions de l'organisation de la planification, des essais et de l'analyse des défaillances. Les modèles mathématiques qui permettent d'estimer le niveau de fiabilité atteint sont brièvement exposés.
