abstract:
- language: en
  script: Latn
  content: |-
    IEC 60371-3-1:2006 applies to several types of rigid materials based on mica splittings or mica paper for commutator separators. These products shall be made from muscovite or phlogopite mica, built up from mica splittings or mica paper by the use of a suitable bonding medium. They are supplied in the following forms:<br/>
    - sheets in the dimensions in which they are pressed or after trimming;<br/>
    - strips cut from sheets;<br/>
    - commutator separators having the shapes and dimensions and in the conditions ordered by the user. The normal manufacturing thicknesses lie between 0,3 mm and 2 mm. This third edition of IEC 60371-3-1 replaces the second edition, published in 1984, and constitutes a technical revision. The main changes with regard to the previous edition concern the modification of clause numbers to align with clause numbering in the latest edition of IEC 60371-2:2004. Keywords: mica splittings or mica paper for commutator separators, muscovite or phlogopite mica
- language: fr
  script: Latn
  content: |-
    L'IEC 60371-3-1:2006 s'applique à divers types de matériaux rigides à base de clivures de mica ou de papier de mica utilisés pour réaliser des entrelames de collecteurs. Ces matériaux doivent être réalisés en mica muscovite ou en mica phlogopite à partir de clivures ou de papier de mica agglomérés à l'aide d'un agglomérant approprié. Ils sont fournis dans les formes suivantes:<br/>
    - feuilles aux dimensions de pressage ou après rectification;<br/>
    - bandes découpées dans ces feuilles;<br/>
    - entrelames de collecteurs réalisés aux dimensions, formes et conditions de la commande de l'utilisateur. L'épaisseur normale de fabrication se situe entre 0,3 mm et 2 mm. Cette troisième édition de la CEI 60371-3-1 remplace la deuxième édition parue en 1984, dont elle constitue une révision technique. Les principales modifications par rapport à l'édition antérieure portent sur les numéros des articles pour correspondre à la numérotation des articles de la dernière édition de la CEI 60371-2:2004. Mots clés: clivures de mica ou de papier de mica utilisés pour réaliser des entrelames de collecteurs, muscovite ou en mica phlogopite
