abstract:
- language: en
  script: Latn
  content: IEC 61000-1-2:2016 establishes a methodology for the achievement of functional safety only with regard to electromagnetic phenomena. This methodology includes the implication it has on equipment used in such systems and installations. This first edition cancels and replaces the second edition of IEC TS 61000-1-2 published in 2008. This edition constitutes a technical revision.
- language: fr
  script: Latn
  content: L'IEC 61000-1-2:2016 établit une méthodologie pour la réalisation de la sécurité fonctionnelle uniquement du point de vue des phénomènes électromagnétiques. Cette méthodologie inclut les conséquences qu'elle a sur les équipements utilisés dans ce type de systèmes et d'installations. Cette première édition annule et remplace la deuxième édition de l'IEC TS 61000-1-2 parue en 2008. Cette édition constitue une révision technique.
