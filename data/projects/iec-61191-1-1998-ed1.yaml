- language: en
  script: Latn
  content: Prescribes requirements for materials, methods and verification criteria for producing quality soldered interconnections and assemblies using surface mounted and related assembly technologies. Also included are recommendations for good manufacturing processes.
- language: fr
  script: Latn
  content: Etablit les exigences relatives aux matériaux, méthodes et critères de vérification utilisés dans le cadre de la production d'interconnexions et d'ensembles brasés de qualité faisant appel à la technique de montage en surface ainsi qu'à des techniques de montage associées. La présente spécification comprend également des recommandations concernant la qualité des processus de fabrication.
