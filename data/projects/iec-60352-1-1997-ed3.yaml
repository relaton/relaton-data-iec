abstract:
- language: en
  script: Latn
  content: Determines the suitability of wrapped connections under specified mechanical, electrical and atmospheric conditions, and provides a means of comparing test results when the tools used to make the connections are of different design. The contents of the corrigendum of October 1998 have been included in this copy.
- language: fr
  script: Latn
  content: Détermine la conformité des connexions enroulées dans des conditions mécaniques, électriques et atmosphériques spécifiées. Fournit un moyen de comparaison des résultats d&#x27;essai quand les outils utilisés pour faire les connexions sont de conception différente. Le contenu du corrigendum d&#x27;octobre 1998 a été pris en considération dans cet exemplaire.
