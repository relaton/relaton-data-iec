abstract:
- language: fr
  script: Latn
  content: |-
    Donne des exigences et des directives spécifiques pour l'exploitation et la maintenance en toute sécurité des systèmes de télécommunication par fibres optiques (STFO. OFCS en Anglais). Dans ces systèmes, la puissance optique peut être accessible en dehors des confinements des équipements d'émission ou à grande distance de la source optique. 

    Cette Partie 2 nécessite l'évaluation des niveaux de risque dans les zones accessibles en remplacement de la classification selon la CEI 60825-1. Elle s'applique à l'intégralité du STFO complet tel qu'il est installé, y compris à ses composants et à ses sous-ensembles qui génèrent ou amplifient le rayonnement optique. Les composants individuels et les sous-ensembles qui sont vendus aux seuls vendeurs OEM en vue de leur incorporation dans un STFO complet installé n'ont pas besoin d'être évalués selon cette norme dans la mesure où le STFO devrait l'être lui-même.

    L'objectif de cette Partie 2 de la CEI 60825 est de:

    - protéger les personnes contre le rayonnement optique provenant d'un STFO.

    - fournir des exigences à l'usage des fabricants, des organismes d'installation, d'entretien et d'exploitation, dans le but d'établir des procédures et de fournir des informations, de telle sorte que des précautions appropriées puissent être prises;

    - garantir que des mises en garde adaptées, concernant les risques potentiels liés au STFO, sont données aux individus par le biais d'une signalisation, d'étiquettes et d'instructions.
