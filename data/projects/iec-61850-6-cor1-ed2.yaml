abstract:
- language: en
  script: Latn
  content: |-
    IEC 61850-6:2009(E) specifies a file format for describing communication-related IED (Intelligent Electronic Device) configurations and IED parameters, communication system configurations, switch yard (function) structures, and the relations between them. The main purpose of this format is to exchange IED capability descriptions, and SA system descriptions between IED engineering tools and the system engineering tool(s) of different manufacturers in a compatible way. The main changes with respect to the previous edition are as follows:<br/>
    - functional extensions added based on changes in other Parts of IEC 61850, especially in IEC 61850-7-2 and IEC 61850-7-3;<br/>
    - functional extensions concerning the engineering process, especially for configuration data exchange between system configuration tools, added;<br/>
    - clarifications and corrections.<br/>
    <br/>
    This publication is of core relevance for Smart Grid.
