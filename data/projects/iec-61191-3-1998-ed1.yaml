abstract:
- language: en
  script: Latn
  content: Prescribes requirements for lead and hole solder assembly. The requirements pertain to those assemblies that are totally lead and hole, through-hole mounting technology (THT), or the THT portions of those assemblies that include other related technologies (i.e. surface mount, chip mounting, terminal mounting).
- language: fr
  script: Latn
  content: Décrit les exigences relatives aux ensembles de composants à trous traversants (broches et trous) montés par brasage. Les exigences s'appliquent aux ensembles entièrement constitués d'après une technique de montage par trous traversants (THT) et aux portions THT d'ensembles incluant d'autres techniques associées (par exemple montage en surface, montage à puce, montage à borne).
