abstract:
- language: en
  script: Latn
  content: |-
    IEC TS 63406:2025 addresses the generic root-mean-square (RMS) simulation models of inverter-based generators for power system dynamic analysis. The scope of the document covers the grid-connected IBGs for photovoltaic power generation systems, wind turbine generation systems with full-scale converters (i.e. Type-4 wind turbine systems), wave energy generation systems, fuel cell energy generation systems, battery energy storage systems, supercapacitor energy storage systems, flywheel energy storage systems, AC- or DC-coupled hybrid energy generation or storage systems, etc.<br/>
    This document is to specify generic dynamic models for various types of IBGs, which can be applied in power system stability studies.<br/>
    This document addresses the generic root-mean-square (RMS) simulation models of inverter-based generators (IBGs) for power system dynamic analysis. The scope of the document covers the grid-connected IBGs for photovoltaic power generation systems, wind turbine generation systems with full-scale converters, wave energy generation systems, fuel cell energy generation systems, battery energy storage systems, supercapacitor energy storage systems, flywheel energy storage systems, AC- or DC-coupled hybrid energy generation or storage systems, etc. The models specified in this document can be primarily used for power system RMS dynamic simulation analysis in the electromechanical time scale.
