abstract:
- language: en
  script: Latn
  content: This Technical Report covers the opportunity charging of lead-acid traction batteries, i.e. the use of free time during a working period to top up the charge and thus extend the working day of a battery whilst avoiding excessive discharge. The object of this report is to lay down rules or recommendations for the use of opportunity- charging of lead-acid traction batteries of vented and valve-regulated types, when the battery manufacturer has not recommended the required operating procedures. When the battery manufacturer's recommendations are available, they take precedence over these rules and guidelines.
- language: fr
  script: Latn
  content: Le présent rapport technique traite de la «charge opportune» des batteries de traction au plomb, c'est-à-dire de l'utilisation du temps de repos durant une période de travail pour optimiser la charge et, par conséquent, allonger la journée de travail de la batterie tout en évitant une décharge excessive. L'objet de ce rapport est d'établir des règles ou des recommandations pour l'utilisation de la charge opportune des batteries de traction au plomb de types ouverte et à soupape, quand le fabricant de batteries n'a pas recommandé de procédure de fonctionnement particulière. Lorsque des recommandations du fabricant de batteries sont disponibles, elles prévalent sur ces règles et recommandations.
