abstract:
- language: fr
  script: Latn
  content: La CEI 61209:1999 spécifie les exigences minimales pour la conception, la fabrication, l'intégration et les essais des systèmes de navigation intégrés (IBS) pour qu'ils soient conformes à la résolution MSC.64(67), annexe 1, de l'Organisation Maritime Internationale (OMI) et les autres normes de performance de l'OMI, afin de répondre aux exigences de fonctionnement contenues dans les instruments applicables de l'OMI, sans écarter l'utilisation multiple du matériel et des modules ou le besoin de reproduction.
