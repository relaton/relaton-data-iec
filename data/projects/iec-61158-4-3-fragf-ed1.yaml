abstract:
- language: fr
  script: Latn
  content: |-
    L'IEC 61158-4-3:2007 spécifie des procédures de transfert en temps opportun de données et d'informations de commande d'une entité utilisateur de liaison de données à une entité utilisateur homologue ainsi qu'entre entités de liaison de données qui constituent le fournisseur de services distribués de la liaison et la structure des DLPDU de bus de terrain utilisées pour le transfert des données et les des informations de commande par le protocole objet de la présente norme, ainsi que leur représentation en tant qu'unité de données d'interface de couche physique. Cette première édition et ses parties d'accompagnement de la sous-série CEI 61158-4 annulent et remplacent la CEI 61158-4:2003. Elle constitue une révision éditoriale. Cette édition de la CEI 61158-4 inclut les modifications suivantes:<br/>
    - suppression du précédent bus de terrain de Type 6 et de la référence à une couche de liaison de données de bus de terrain de Type 5, en raison du manque d'adéquation au marché;<br/>
    - ajout de nouveaux types de bus de terrain;<br/>
    - division de cette partie en parties multiples numérotées -4 1, -4 2,  , -4-19. La présente version bilingue (2014-08) correspond à la version anglaise monolingue publiée en 2007-12.
