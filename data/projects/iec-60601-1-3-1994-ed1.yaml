  script: Latn
  content: Etablit des prescription générales pour la protection contre les  rayonnements ionisants dans les équipements à rayonnement X de diagnostic afin que l'éauivalent de dose rapporté au patient, à l'opérateur et aux autres membres de l'équipe médicale puisse être maintenu à un niveau aussi bas que possible.
