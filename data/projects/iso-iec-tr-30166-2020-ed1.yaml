abstract:
- language: en
  script: Latn
  content: |-
    ISO/IEC TR 30166:2020 (E) describes the following:<br/>
    • general Industrial IoT (IIoT) systems and landscapes which outline characteristics, technical aspects and functional as well as non-functional elements of the IIoT structure and a listing of standardizing organisations, consortia and open-source communities with work on all aspects on IIoT;<br/>
    • considerations for the future standardization perspective of IIoT including risk analysis, new technologies and identified collaboration
