abstract:
- language: en
  script: Latn
  content: |-
    La CEI 60512-9-4:2011 lorsque la spécification particulière l'exige, est utilisée pour les essais des connecteurs qui entrent dans le domaine d'application du comité d'etudes 48 de la CEI. Ces essais peuvent aussi être utilisés sur des composants similaires lorsqu'une spécification particulière le prescrit. L'objet du présent norme est de définir une méthode d'essai normalisée pour évaluer l'aptitude d'un connecteur à résister à des contraintes causées par l'extraction et l'insertion répétées des contacts au cours des opérations d'entretien. La présente norme annule et remplace l'Essai 9d de la CEI 60512-5, publiée en 1992 et constitue une révision technique.<br/>
    <br/>
    Cette publication doit être lue conjointement avec la  CEI 60512-1:2001 et la CEI 60512-1-100:2006.
