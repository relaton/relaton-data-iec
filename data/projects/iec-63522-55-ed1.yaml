abstract:
- language: en
  script: Latn
  content: |-
    This part of IEC 63522 is used for testing all kinds of electrical relays and for evaluating their ability to perform under expected conditions of transportation, storage and all aspects of operational use.<br/>
    The object of this document is to define a standard test method to verify the maximum load breaking capacity on resistive and inductive loads, typically in DC but also, in special cases, on high AC loads.
