abstract:
- language: fr
  script: Latn
  content: |-
    La CEI 61966-9:2003 définit les méthodes de mesure pour permettre l'évaluation objective de la performance et la caractérisation de la reproduction des couleurs des appareils numériques de prise de vue qui peuvent prendre des images en couleur fixes et animées, et des informations de couleur en sortie correspondant aux données numériques d'images rouge, vert et bleu. Les résultats mesurés sont destinés à être utilisés pour la gestion de la couleur dans les systèmes multimédia, généralement sur Internet. Cette deuxième édition annule et remplace la première édition parue en 2000. Elle contient les modifications techniques significatives suivantes:<br/>
    - Compte tenu de la publication de la CEI 61966-2-2, la référence correspondante, à la CEI 61966-2-1 de l'Annexe C, a été remplacé par CEI 61966-2-2 et sRVB par scRVB.<br/>
    - L'ancienne Annexe C a été remplacée par la nouvelle Annexe C, dans laquelle l'ancienne Figure C.1 a été supprimée. La présente version bilingue (2013-03) correspond à la version anglaise monolingue publiée en 2003-11.
