abstract:
- language: en
  script: Latn
  content: |-
    IEC 62386-333:2018 specifies a bus system for control by digital signals of electronic lighting equipment which is in line with the requirements of IEC 61347 (all parts).
    <p>This bilingual version (2019-02) corresponds to the monolingual English version, published in 2018-04.</p>

    <p>The French version of this standard has not been voted upon.</p>
- language: fr
  script: Latn
  content: |-
    <p>L'IEC 62386-333:2018 spécifie un système à bus pour la commande par signaux numériques des appareils d’éclairage électroniques conformes aux exigences de l'IEC 61347 (toutes les parties).</p>

    <p>La présente version bilingue (2019-02) correspond à la version anglaise monolingue publiée en 2018-04.</p>
    La version française de cette norme n'a pas été soumise au vote.  
