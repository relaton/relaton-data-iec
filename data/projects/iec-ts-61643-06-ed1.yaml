abstract:
- language: en
  script: Latn
  content: |-
    This TS applies to SPD Specific Disconnectors (SSD) having an appropriate impulse current capability and intended for operation in systems rated up to 1000 V RMS AC and 1500V DC.<br/>
    DC is under consideration.<br/>
    SSDs are intended to safely disconnect an SPD from the power system in the event of end-of-life of the SPD based on e.g. leakage current, fault current, over current, short circuit current, temperature, etc.<br/>
    SSDs are expected to withstand the SPD’s impulse rating.<br/>
    SSDs covered by this standard are stand-alone devices which include the requested switching capability, external to the SPD.
