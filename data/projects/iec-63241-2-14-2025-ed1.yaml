  content: |-
    IEC 63241-2-14:2025 applies to planers.<br/>
    This document is to be used in conjunction with the first edition of IEC 63241-1:2023.<br/>
    This document supplements or modifies the corresponding clauses in IEC 63241-1, so as to convert it into the IEC Standard: Particular requirements for hand-held planers.<br/>
    Where a particular subclause of IEC 63241-1 is not mentioned in this document, that subclause applies as far as reasonable. Where this document states "addition", "modification" or "replacement", the relevant text in IEC 63241-1 is to be adapted accordingly.
