- language: en
  script: Latn
  content: |-
    IEC 62386-210:2011 specifies a protocol and test procedures for the control by digital signals of electronic control gear working as automatic sequencers.
    <br/><br/>This publication is to be read in conjunction with IEC 62386-101:2009 and IEC 62386-102:2009.
