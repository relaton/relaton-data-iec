  content: IEC Guide 112:2008 contains guidelines for using the current editions of IEC 60065 and IEC 60950-1 in evaluating the safety of multimedia equipment. This new edition of IEC Guide 112 refers to the latest editions of IEC 60065 and IEC 60950-1.
- language: fr
  script: Latn
