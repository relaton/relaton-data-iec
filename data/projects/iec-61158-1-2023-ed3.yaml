abstract:
- language: en
  script: Latn
  content: |-
    IEC 61158-1:2023 specifies the generic concept of fieldbuses. This document also presents an overview and guidance for the IEC 61158 eries by:<br/>
    explaining the structure and content of the IEC 61158 series;<br/>
    relating the structure of the IEC 61158 series to the ISO/IEC 7498-1 OSI Basic Reference Model;<br/>
    showing the logical structure of the IEC 61784 series;<br/>
    showing how to use parts of the IEC 61158 series in combination with the IEC 61784 series;<br/>
    providing explanations of some aspects of the IEC 61158 series that are common to the type specific parts of the IEC 61158‑5 series including the application layer service description concepts and the generic fieldbus data types.
- language: fr
  script: Latn
  content: |-
    l'IEC 61158-1:2023 précise le concept générique de bus de terrain. Le présent document donne également une vue d’ensemble et des recommandations relatives à la série IEC 61158 en:<br/>
    expliquant la structure et le contenu de la série IEC 61158;<br/>
    associant la structure de la série IEC 61158 à l’ISO/IEC 7498-1 Modèle de référence de base OSI;<br/>
    présentant la structure logique de la série IEC 61784;<br/>
    présentant la manière d’utiliser les parties de la série IEC 61158 en combinaison avec la série IEC 61784;<br/>
    donnant des explications relatives à certains aspects de la série IEC 61158 communs aux parties spécifiques au type de la série IEC 61158‑5, y compris les concepts de description de la couche d’application de service et les types de données de bus de terrain génériques.
