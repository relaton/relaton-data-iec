abstract:
- language: en
  script: Latn
  content: |-
    Applies to electrodynamic, electromagnetic and composite
    braking systems of d.c., a.c. and multi-system locomotives and motor coaches, and of vehicles powered by heat engines used on rail systems. It is also valid for tramcars, trolleybuses and vehicles for underground railways.
- language: fr
  script: Latn
  content: S'applique aux systèmes de freinage électrodynamiques, électromagnétiques et mixtes employés sur les locomotives et automotrices à courant continu, à courant alternatif, ou polycourant et sur les véhicules à moteur thermique utilisés sur les véhicules ferroviaires. Est également valable pour les tramways, trolleybus et véhicules des chemins de fer souterrains.
