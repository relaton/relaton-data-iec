abstract:
- language: en
  script: Latn
  content: |-
    IEC 61747-2-2:2014(E) serves as a blank detail specification (BDS) for testing and contains requirements for style and layout and minimum content of detail specifications. These requirements are applicable when the detail specification is published (e.g. for a standard product). This edition includes the following significant technical changes with respect to the previous edition:<br/> 
    1) The new edition was editorially changed to follow the current ISO/IEC Directives, for example:<br/>
    - added the scope;<br/>
    - re-arranged the numbering scheme;<br/>
    - added titles to the tables;<br/> 
    - added an Annex A, and put some text from Clause 4 and Clause 10 in it;<br/> 
    - removed IECQ reference;<br/>
    - deleted some unnecessary text.<br/> 
    2) Several words and test conditions were added in Clause 7 and Clause 8.
