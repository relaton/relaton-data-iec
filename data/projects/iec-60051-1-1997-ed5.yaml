abstract:
- language: en
  script: Latn
  content: 'Applies to direct indicating electrical measuring instruments having analogue display, such as: ammeters, voltmeters, wattmeters, varmeters, phasemeters, frequency meters, synchroscopes and ohmmeters. Also applies to certain accessories used with such apparatus, e.g., shunts, series resistors and impedance elements.'
- language: fr
  script: Latn
  content: 'S''applique aux appareils mesureurs électriques indicateurs à action directe à affichage analogique, à savoir: ampèremètres, voltmètres, wattmètres, varmètres, phase-mètres, fréquencemètres, synchronoscopes et ohmmètres. S''applique également à certains accessoires utilisés avec ces appareils tels que: shunts, résistances et impédances additionnelles.'
