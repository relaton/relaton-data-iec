abstract:
- language: en
  script: Latn
  content: IEC 63011-2:2018 provides specifications of initial alignment and alignment maintenance between multiple stacked integrated circuits during the die bonding process. These specifications define the alignment keys and operating procedures of the keys. These specifications apply only if electrical coupling method of die-to-die alignment is used in the die stacking.
- language: fr
  script: Latn
  content: L'IEC 63011-2:2018 donne des spécifications d'alignement initial et de maintien d'alignement entre plusieurs circuits intégrés empilés pendant le processus de liaison de puces. Ces spécifications définissent les clés d'alignement et les procédures de fonctionnement de ces clés. Ces spécifications s'appliquent uniquement si une méthode de couplage électrique d'alignement de puces les unes sur les autres est utilisée dans l'empilement des puces.
