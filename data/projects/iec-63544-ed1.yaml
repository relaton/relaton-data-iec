abstract:
- language: en
  script: Latn
  content: |-
    IEC 63544:2026 specifies the performance requirements together with the measurement method and conditions for horticultural luminaires incorporating LED light sources.<br/>
    The lifetime of horticultural luminaires incorporating LED light sources is in most cases much longer than practical test times. Consequently, the verification of the manufacturer’s lifetime claim is out of the scope of this document.<br/>
    This document does not contain requirements on action spectra, which are dependent on plant species and growth stages.
