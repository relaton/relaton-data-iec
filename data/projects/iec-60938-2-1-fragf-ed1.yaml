abstract:
- language: fr
  script: Latn
  content: L'IEC 60938-2-1:1999 est un document annexe à la spécification intermédiaire qui contient des exigences pour le modèle, la disposition et le contenu minimal des spécifications particulières. Les spécifications particulières qui ne satisfont pas aux exigences peuvent ne pas être considérées comme conformes aux spécifications de la CEI et ne doivent pas être décrites comme telles. Dans la préparation des spécifications particulières, le contenu de 1.4 de la spécification intermédiaire doit être pris en compte.
