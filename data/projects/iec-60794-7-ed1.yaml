abstract:
- language: en
  script: Latn
  content: |-
    This part of IEC 60794 refers to cables as described in IEC 60794 Parts 2, 3, 4, 5 or 6 or IEC 62087-1 (hybrid cables containing elements that are cables as described in IEC 60794) which are required to maintain both circuit integrity and data transmission capability when subjected to fire under specified conditions.<br/>
    <br/>
    The cables covered by this document are intended to operate with light sources and nominal wavelengths normally encountered in communication systems. For the purpose of this standard, fire conditions are as currently listed in IEC 60331-25 Ed. 1.0 and basic test apparatus are as per IEC 60331-1 and IEC 60331-11.
