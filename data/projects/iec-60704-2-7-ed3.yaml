abstract:
- language: en
  script: Latn
  content: |-
    IEC 60704-2-7:2026 applies to electrical fans (including their accessories and their component parts) for household and similar use, designed for AC or DC supply.<br/>
    The motor, the impeller and their housing, if any, form a single unit.<br/>
    These particular requirements apply to:<br/>
    – comfort fans (conventional and bladeless),<br/>
    – table fans,<br/>
    – pedestal fans,<br/>
    – ceiling fans,<br/>
    – wall bracket fans,<br/>
    – ceiling bracket fans,<br/>
    – louvre fans,<br/>
    – tower fans,<br/>
    – handheld fans,<br/>
    – neckband fans,<br/>
    – embedded fans,<br/>
    – ventilating fans.<br/>
    This document does not apply to:<br/>
    – fans that are part of a central ventilation system,<br/>
    – fans that are part of an appliance (for example cooling fans),<br/>
    – fans with additional functions (for example heating, humidifying).<br/>
    This third edition cancels and replaces the second edition published in 2020. This edition constitutes a technical revision.<br/>
    This edition includes the following significant technical changes with respect to the previous edition:<br/>
    a) alignment with IEC 60704-1:2021;<br/>
    b) scope has been expanded to handheld, neckband and embedded fans;<br/>
    c) positioning and mounting have been reworked;<br/>
    d) test concept of partition ventilating fans has changed to measure both inlet and outlet side together.<br/>
    This Part 2-7 is to be used in conjunction with IEC 60704-1:2021, Household and similar electrical appliances - Test code for the determination of airborne acoustical noise – Part 1: General requirements.
- language: fr
  script: Latn
  content: |-
    L'IEC 60704-2-7:2026 s'applique aux ventilateurs électriques (y compris leurs accessoires et composants) destinés à des usages domestiques et analogues, conçus pour une alimentation en courant alternatif ou en courant continu.<br/>
    Le moteur, les pales et leur boîtier, le cas échéant, constituent un bloc.<br/>
    Ces exigences particulières s'appliquent aux:<br/>
    – ventilateurs de confort (conventionnels et sans pales);<br/>
    – ventilateurs de table;<br/>
    – ventilateurs sur pied;<br/>
    – ventilateurs de plafond;<br/>
    – ventilateurs à applique murale;<br/>
    – ventilateurs à applique au plafond;<br/>
    – ventilateurs rotatifs;<br/>
    – ventilateurs à colonne;<br/>
    – ventilateurs portatifs;<br/>
    – ventilateurs de cou;<br/>
    – ventilateurs encastrés;<br/>
    – aérateurs.<br/>
    Le présent document ne s'applique pas aux:<br/>
    – ventilateurs qui font partie intégrante d'une installation de ventilation centrale;<br/>
    – ventilateurs qui font partie d'un appareil (par exemple les ventilateurs de refroidissement);<br/>
    – ventilateurs avec des fonctions supplémentaires (par exemple chauffage, humidification).<br/>
    Cette troisième édition annule et remplace la deuxième édition parue en 2020. Cette édition constitue une révision technique.<br/>
    Cette édition inclut les modifications techniques majeures suivantes par rapport à l'édition précédente:<br/>
    a) alignement sur l'IEC 60704-1:2021;<br/>
    b) le domaine d'application a été étendu aux ventilateurs portatifs, aux ventilateurs de cou et aux ventilateurs encastrés;<br/>
    c) le positionnement et le montage ont été revus;<br/>
    d) le concept d'essai des aérateurs de cloison a été modifié pour mesurer à la fois les côtés entrée et sortie.<br/>
    La présente Partie 2-7 doit être utilisée conjointement avec l'IEC 60704-1:2021, Appareils électrodomestiques et analogues - Code d'essai pour la détermination du bruit aérien – Partie 1: Exigences générales.
