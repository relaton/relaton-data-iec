abstract:
- language: en
  script: Latn
  content: |-
    IEC 61784-5-10:2010 specifies the installation profiles for CPF 10 (Vnet/IP ).The installation profiles are specified in the annex. This second edition cancels and replaces the first edition published in 2007. It constitutes an editorial revision. This edition does not include technical changes with respect to the previous edition. This bilingual version (2012-02) corresponds to the monolingual English version, published in 2010-07.<br/>
    <br/>
    This publication is to be read in conjunction with IEC 61918:2013.
- language: fr
  script: Latn
  content: |-
    La CEI 61784-5-10:2010 spécifie les profils d'installation applicables à la CPF 10 (Vnet/IP). Les profils d'installation sont spécifiés dans l'annexe. Elle annule et remplace la première édition publiée en 2007, dont elle constitue une révision éditoriale. Cette édition ne comporte pas de modifications techniques par rapport à l'édition précédente. La présente version bilingue (2012-02) correspond à la version anglaise monolingue publiée en 2010-07.<br/>
    <br/>
    Cette publication doit être lue conjointement avec la IEC 61918:2013.
