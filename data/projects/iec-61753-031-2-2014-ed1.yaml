abstract:
- language: en
  script: Latn
  content: |-
    IEC 61753-031-2:2014 contains the minimum initial tests and measurement requirements and severities which a non-wavelength selective branching device (NWBD) should satisfy in order to be categorized as meeting the requirement of this IEC standard. The requirements cover balanced bidirectional non-connectorized single-mode 1 x N and 2 x N non wavelength-selective branching devices for use in an IEC Category C environment (N is the number of branching ports), especially but not exclusively used for PON application. For balanced NWBD two attenuation and uniformity performance classes are considered:<br/>
    - class A (premium class) which meets more restrictive requirements (i.e. for extended reach PON application) and<br/>
    - class B (standard class) for standard application (i.e. normal reach PON application). The requirements also cover unbalanced bidirectional non-connectorized single-mode, non-wavelength-selective branching devices; however, the specifications of unbalanced branching devices are limited to 1 x 2 and 2 x 2 devices because they are the most commonly used. Keywords: non-wavelength selective branching device (NWBD), IEC Category C environment
- language: fr
  script: Latn
  content: |-
    L'IEC 61753-031-2:2014 contient les exigences et les sévérités initiales minimales d'essais et de mesures auxquelles il convient qu'un dispositif de couplage indépendant de la longueur d'onde (NWBD) satisfasse afin d'être classé comme conforme aux exigences de la présente norme IEC.Ces exigences couvrent les dispositifs de couplage indépendants de la longueur d'onde 1 x N et 2 x N en unimodal, non connectorisés, bidirectionnels symétriques destinés à être utilisés dans un environnement de catégorie C selon l'IEC (N correspond au nombre de ports pouvant être connectés), utilisés en particulier, mais pas de manière exclusive, pour les applications PON. Dans le cas des NWBD symétriques, deux classes d'affaiblissement et d'uniformité sont prises en compte:<br/>
    - La classe A (classe de première qualité) qui satisfait aux exigences les plus restrictives (à savoir pour les applications PON de portée étendue) et<br/>
    - la classe B (classe normale) pour les applications normales (à savoir les applications PON de portée normale). Ces exigences couvrent aussi les dispositifs de couplage indépendants de la longueur d'onde en unimodal non-connectorisés bidirectionnels asymétriques; toutefois les spécifications des dispositifs de couplage asymétriques sont limitées aux dispositifs 1 x 2 et 2 x 2 car ce sont eux qui sont les plus couramment utilisés. Mots clés: dispositif de couplage indépendant de la longueur d'onde (NWBD), environnement de catégorie C selon l'IEC
