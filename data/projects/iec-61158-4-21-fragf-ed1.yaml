abstract:
- language: fr
  script: Latn
  content: La CEI 61158-4-21:2010 décrit des procédures de transfert en temps opportun de données et d'informations de commande d'une entité utilisateur de liaison de données à une entité utilisateur homologue ainsi qu'entre entités de liaison de données qui constituent le fournisseur de services distribués de la liaison; des procédures offrant des moyens de communication fondées sur le MAC de l'ISO/CEI 8802-3, ainsi que des dispositions permettant d'ajouter et de retirer des noeuds au cours du fonctionnement normal; la structure des unités de données de protocole de liaison de données (DLPDU) de bus de terrain utilisées pour le transfert des données et les informations de commande par le protocole objet de la présente norme, ainsi que leur représentation en tant qu'unité de données d'interface de couche physique. La présente norme annule et remplace la CEI/PAS 62573 publiée en 2008. La présente version bilingue publiée en 2012-01 correspond à la version anglaise monolingue publiée en 2010-08.
