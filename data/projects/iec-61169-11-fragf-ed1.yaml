abstract:
- language: en
  script: Latn
  content: |-
    IEC 61169-11:2017, which is a sectional specification (SS), provides information and rules for the preparation of detail specifications (DS) for RF coaxial connectors with threaded coupling, typically for use in 50 Ohms cable networks (type 4,1-9,5).<br/>
    This document prescribes mating face dimensions for general purpose connectors – grade 2, dimensional details of standard test connectors-grade 0, gauging information and tests selected from IEC 61169-1, applicable to all detail specifications relating to series 4,1-9,5 RF connectors.<br/>
    This specification indicates recommended performance characteristics to be considered when writing a detail specification and it covers test schedules and inspection requirements for assessment levels M and H.<br/>
    The 4,1-9,5 types RF coaxial connectors with nominal impedance 50 Ohms are threaded coupling units which are used with all kinds of RF cables and microstrips in microwave transmission systems. And the working frequency is up to 14 GHz.
- language: fr
  script: Latn
  content: |-
    L'IEC 61169-11:2017, qui est une spécification intermédiaire (SI), fournit des informations et des règles en vue de l'établissement de spécifications particulières (SP) relatives aux connecteurs coaxiaux pour fréquences radioélectriques avec couplage par enclenchement, typiquement utilisés dans des réseaux câblés 50 Ω (type MMCX).<br/>
    Elle prescrit les dimensions des faces d'accouplement pour des connecteurs d'usage général de classe 2, des informations détaillées sur les dimensions de connecteurs d'essais normalisés de classe 0, des informations concernant les calibres et les essais choisis dans l'IEC 61169-1, applicables à toutes les spécifications particulières ayant trait aux connecteurs pour fréquences radioélectriques série de type MMCX.<br/>
    La présente spécification indique les caractéristiques de performance recommandées à prendre en compte pour la rédaction d’une spécification particulière et elle couvre les programmes d'essais et les exigences de contrôle pour les niveaux d'assurance M et H.<br/>
    Les connecteurs coaxiaux pour fréquences radioélectriques série ayant une structure de couplage par enclenchement miniature de type MMCX, avec une impédance normative de 50 W, sont utilisés avec divers types de bandes et de câbles pour fréquences radioélectriques. La limite de fréquence de fonctionnement est 6 GHz.
