abstract:
- language: en
  script: Latn
  content: |-
    IEC 63552:2026 applies to switching device for islanding, hereafter referred to as SDFI, for household and similar uses, primarily intended to be used for energy efficiency (EE) purposes with local production or local storage of energy, or with both.<br/>
    SDFI are intended to be installed in low voltage prosumer electrical installations (PEI) able to operate in island mode as defined in IEC 60364-8-82, so called islandable PEI.<br/>
    SDFI are used to disconnect the PEI from the grid to allow operating the PEI in island mode and further reconnect the PEI to the grid.
- language: fr
  script: Latn
  content: |-
    L'IEC 63552:2026 s'applique à l'appareil de connexion pour le passage en réseau séparé, ci-après appelé SDFI, à usages domestiques et analogues, principalement destiné à être utilisé à des fins d'efficacité énergétique (EE) avec production locale ou stockage local de l'énergie, ou les deux.<br/>
    Les SDFI sont destinés à être installés dans les installations électriques du prosommateur (PEI) à basse tension capables de fonctionner en mode réseau séparé comme cela est défini dans l'IEC 60364‑8‑82, appelées PEI séparables.<br/>
    Les SDFI sont utilisés pour déconnecter la PEI du réseau afin de permettre le fonctionnement de celle-ci en mode réseau séparé, puis pour reconnecter la PEI au réseau.
