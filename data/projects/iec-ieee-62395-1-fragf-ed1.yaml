abstract:
- language: en
  script: Latn
  content: |-
    IEC/IEEE 62395-1 :2024 specifies requirements for electrical resistance trace heating systems and includes general test requirements.<br/>
    This first edition cancels and replaces the second edition published in 2013. This edition constitutes a technical revision.<br/>
    This edition includes the following significant technical changes, apart from general revisions of IEC 62395-1 and harmonization with IEEE 515 [1][1] and IEEE 515.1 [2], with respect to the previous edition:<br/>
    a) Added control and monitoring requirements for fire sprinkler systems and safety showers.<br/>
    b) Provided a supplemental ice bath method for verification of rated output.<br/>
    c0 Provided constructional and type test requirements for glands used to terminate heating devices to an exposed enclosure.
- language: fr
  script: Latn
  content: |-
    IEC/IEEE 62395-1: 2024 spécifie les exigences relatives aux systèmes de traçage par résistance électrique et comprend les exigences générales d'essai. A) Cette première édition annule et remplace la deuxième édition parue en 2013. Cette édition constitue une révision technique.<br/>
    Cette édition inclut les modifications techniques majeures suivantes, à l'exception des révisions générales de l'IEC 62395-1 et de l'harmonisation avec l'IEEE 515 [1][1] et l'IEEE 515.1 [2], par rapport à l'édition précédente:<br/>
    a) Ajout d'exigences de régulation et de surveillance pour les installations d'arrosage contre les incendies et les douches de sécurité.<br/>
    b) Fourniture d'une méthode de bain de glace supplémentaire pour la vérification de la puissance assignée.<br/>
    c) Fourniture d'exigences d'essai de construction et de type pour les presse-étoupes utilisés pour arrêter les dispositifs chauffants dans une enveloppe exposée.
