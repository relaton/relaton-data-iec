abstract:
- language: en
  script: Latn
  content: |-
    Describes hardware and protocol specifications for local meter data
    exchange. In such systems, a hand-held unit (HHU) or a unit with equivalent functions is connected to a tariff device or a group of devices.
    <br /><br />This publication is of high relevance for Smart Grid</a>.
- language: fr
  script: Latn
  content: |-
    Décrit le matériel et les protocoles des échanges de
    données de compteurs effectués en local. Dans ces systèmes, un terminal de saisie portable (TSP) ou un appareil aux fonctions équivalentes est connecté à un ou plusieurs appareils de
    tarification.
