abstract:
- language: en
  script: Latn
  content: Applies to insulating blankets for the protection of workers from accidental contact with live or earthed electrical conductors, apparatus or circuits and avoidance of short circuits on a.c. and d.c. installations.
- language: fr
  script: Latn
  content: S'applique aux nappes isolantes pour la protection des travailleurs contre un contact accidentel avec des conducteurs électriques sous tension ou mis à la terre, des appareils ou des circuits, et contre les court-circuits dans des installations à courant alternatif ou continu.
