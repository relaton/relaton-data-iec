abstract:
- language: en
  script: Latn
  content: |-
    Applies to linearly polarized aerials for domestic use, for the
    reception of sound and television broadcasting in the frequency 
    range 30 MHz to 1 GHz. Specifies the conditions and the methods of
    measurement and calculation of mechanical properties of aerials, and
    the relevant methods and procedures of environmental tests.
- language: fr
  script: Latn
  content: |-
    S'applique aux antennes à polarisation rectiligne pour usage
    domestique destinées à la réception des émissions de radiodiffusion,
    sonores ou de télévision, dans la gamme des fréquences comprises
    entre 30 MHz et 1 GHz. Spécifie les conditions et les méthodes de
    mesure et de calcul des caractéristiques mécaniques des antennes
    ainsi que les essais climatiques de robustesse.
    (1962).
