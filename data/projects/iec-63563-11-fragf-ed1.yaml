abstract:
- language: en
  script: Latn
  content: |-
    IEC 63563-11:2025 provides a protocol extension that provides additional messages, new power states/modes, new power transfer contract elements, and aims to provide the following functionalities:<br/>
    • Operating Frequency Negotiation<br/>
    • Cloaking (Power Pause)<br/>
    • Generic Information Exchange<br/>
    • Simultaneous Data Stream Transactions<br/>
    • Fast PTx to PRx communication<br/>
    • Maximum Power and Power Control Profiles Determination<br/>
    • Extended Power Negotiation<br/>
    • Extended PTx/PRx Identification and Capabilities<br/>
    • Extended Control Error Packets and Received Power Packets<br/>
    • Power Transmitter Battery Level Reporting<br/>
    • Ecosystem Scalability<br/>
    <br/>
    MPP extension allows devices to operate under Restricted mode (no PTx communication) at 360kHz without performing any explicit negotiation with the Power Transmitter. This flexibility enables devices with limited resources (e.g., devices with no FSK support) to take advantage of the frequency change feature.
- language: fr
  script: Latn
  content: |-
    IEC 63563-11:2025 fournit une extension de protocole qui fournit des messages supplémentaires, de nouveaux états/modes de puissance, de nouveaux éléments de contrat de transfert de puissance, et vise à fournir les fonctionnalités suivantes:<br/>
    • Négociation de la fréquence de fonctionnement<br/>
    • Occultation (pause de puissance)<br/>
    • Échange d'informations génériques<br/>
    • Transactions simultanées de flux de données<br/>
    • Communication rapide de PTx à PRx<br/>
    • Détermination de la puissance maximale et des profils de contrôle de la puissance<br/>
    • Négociation de pouvoir élargie<br/>
    • Identification et capacités PTx/PRx étendues<br/>
    • Paquets d'erreurs de contrôle étendus et paquets de puissance reçus<br/>
    • Rapport sur le niveau de la batterie de l'émetteur de puissance<br/>
    • Évolutivité de l'écosystème<br/>
    <br/>
    L'extension MPP permet aux appareils de fonctionner en mode restreint (pas de communication PTx) à 360 kHz sans effectuer de négociation explicite avec l'émetteur de puissance. Cette flexibilité permet aux appareils disposant de ressources limitées (par exemple, les appareils ne prenant pas en charge la MDF) de tirer parti du phénomène de changement de fréquence.
