abstract:
- language: en
  script: Latn
  content: Defines technical requirements for equipment for monitoring of alpha-, beta- or gamma-emitting radionuclides in liquid effluents and surface waters, provides general guidance as to the possible detection capability of such equipment and indicates when and where its uses may be practicable.
- language: fr
  script: Latn
  content: Définit les exigences techniques pour les appareils de surveillance des radionucléides émetteurs alpha, bêta ou gamma dans les effluents liquides et dans les eaux de surface. Donne des directives générales sur les aptitudes de tels équipements et indique où et quand ils peuvent être utilisés.
