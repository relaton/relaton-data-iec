abstract:
- language: en
  script: Latn
  content: |-
    Provides a guide for IEC equipment technical committees to
    assist them when developing functional evaluation procedures for
    insulation systems of their particular equipment with respect to
    the effects of environment.

    This publication has the status of a technical report - type 2.
- language: fr
  script: Latn
  content: |-
    Fournit un guide pour les comités d'études de matériel afin de
    les assister dans leur développement de méthodes d'évaluation
    fonctionnelle pour les systèmes d'isolation de leur matériel
    particulier en relation avec les effets de l'environnement. 

    Cette publication a le statut d'un rapport technique - type 2.
