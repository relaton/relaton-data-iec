abstract:
- language: fr
  script: Latn
  content: |-
    La présente partie de la CEI 61010 est applicable aux appareils de laboratoire électriques et à leurs accessoires, destinés à mélanger et à agiter, et qui, par l'énergie mécanique dispensée, modifient la forme, la taille, ou l'homogénéité des matériaux.  De tels appareils peuvent contenir des éléments de chauffage.


    Cette norme a le statut de publication groupée de sécurité, conformément au Guide 104 de la CEI
