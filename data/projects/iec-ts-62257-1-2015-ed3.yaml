abstract:
- language: en
  script: Latn
  content: |-
    IEC TS 62257-1:2015(E) introduces a methodology for implementing rural electrification using autonomous hybrid renewable energy systems. It also provides a guide for facilitating the reading and the use of the IEC 62257 series for setting up decentralized rural electrification in developing countries or in developed countries. The IEC 62257 series is designed as follows:<br/>
    - Parts 2 to 6 are methodological supports for the management and implementation of projects;<br/>
    - Parts 7 to 12 are technical specifications for individual or collective systems and associated components.<br/>
    <br/>
    This publication is to be read in conjunction with IEC 62257 series.
