abstract:
- language: en
  script: Latn
  content: |-
    IEC 60987:2021 provides requirements and recommendations for the hardware aspects of I&amp;C systems whatever the technology and applies for all safety classes in a graded manner (as defined by IEC 61513). The requirements defined within this document guide, in particular, the selection of pre-existing components, hardware aspects of system detailed design and implementation and equipment manufacturing.<br/>
    This third edition cancels and replaces the second edition published in 2007. This edition includes the following significant technical changes with respect to the previous edition:<br/>
    a) Title modified;<br/>
    b) Take account of the fact that hardware requirements apply to all I&amp;C technologies, including conventional hardwired equipment, programmable digital equipment or by using a combination of both types of equipment;<br/>
    c) Align the standard with the new revisions of IAEA documents SSR-2/1, which include as far as possible an adaptation of the definitions;<br/>
    d) Replace, as far as possible, the requirements associated with standards published since the edition 2.1, especially IEC 61513, IEC 60880, IEC 62138, IEC 62566 and IEC 62566‑2;<br/>
    e) Review the existing requirements and update the terminology and definitions;<br/>
    f) Extend the scope of the standard to all hardware (computerized and non-computerized) and to all safety classes 1, 2 and 3;<br/>
    g) Complete, update the IEC and IAEA references and vocabulary;<br/>
    h) Check possible impact of other IAEA requirements and recommendations considering extension of the scope of SC 45A;<br/>
    i) Highlight the use of IEC 62566 and IEC 62566-2 for HPD development;<br/>
    j) Introduce specific activities for pre-existing items (selection, acceptability and/or mitigation);<br/>
    k) Introduce clearer requirements for electronic module-level design, manufacturing and control;<br/>
    l) Complete reliability assessment methods;<br/>
    m) Introduce requirements when using automated tests or control activities;<br/>
    n) Complete description of manufacturing control activities (control process, assessment of manufactured equipment, preservation of products);<br/>
    o) Define and ensure the inclusion of a graded approach for dealing with the 3 different classes of equipment and related requirements.
- language: fr
  script: Latn
  content: |-
    IEC 60987:2021 fournit des exigences et des recommandations pour les aspects matériels des systèmes d'I&amp;C, quelle que soit la technologie, et s'applique à toutes les classes de sûreté de manière graduelle (comme cela est défini par l’IEC 61513). Les exigences définies dans le présent document guident en particulier la sélection des composants préexistants, les aspects matériels de la conception détaillée et de la mise en œuvre du système et la fabrication des équipements.<br/>
    Cette troisième édition annule et remplace la deuxième édition parue en 2007. Cette édition inclut les modifications techniques majeures suivantes par rapport à l'édition précédente:<br/>
    a) Modification du titre;<br/>
    b) Prise en compte du fait que les exigences en matière de matériel s'appliquent à toutes les technologies d'I&amp;C, y compris des équipements câblés conventionnels, des équipements numériques programmables ou une combinaison de ces deux types d'équipements;<br/>
    c) Alignement de la norme sur les nouvelles révisions des documents de l’AIEA SSR-2/1, incluant autant que possible une adaptation des définitions;<br/>
    d) Remplacement, autant que possible, des exigences associées aux normes publiées depuis la parution de l’édition 2.1, plus particulièrement l’IEC 61513, l’IEC 60880, l’IEC 62138, l’IEC 62566 et l’IEC 62566-2;<br/>
    e) Révision des exigences existantes et mise à jour des définitions et de la terminologie;<br/>
    f) Élargissement du domaine d'application de la norme à tout le matériel (informatisé et non informatisé) et à toutes les classes de sûreté 1, 2 et 3;<br/>
    g) Complément et mise à jour des références et du vocabulaire de l’IEC et de l'AIEA;<br/>
    h) Vérification de l'impact éventuel d'autres exigences et recommandations de l'AIEA envisageant l'extension du domaine d'application du SC 45A;<br/>
    i) Mise en évidence de l'utilisation de l’IEC 62566 et de l’IEC 62566-2 pour le développement du HPD;<br/>
    j) Introduction d’activités spécifiques pour les constituants prédéveloppés (sélection, acceptabilité et/ou compensation);<br/>
    k) Introduction d’exigences plus claires pour la conception, la fabrication et le contrôle au niveau des modules électroniques;<br/>
    l) Méthodes complètes d'évaluation de la fiabilité;<br/>
    m) Introduction d’exigences lors de l'utilisation d’essais automatisés ou d'activités de contrôle;<br/>
    n) Complément concernant les activités de contrôle de la fabrication (processus de contrôle, évaluation des équipements fabriqués, préservation des produits);<br/>
    o) Définition et incorporation d'une approche graduelle pour traiter les 3 différentes classes d'équipements et les exigences qui s'y rapportent.
