abstract:
- language: fr
  script: Latn
  content: |-
    La CEI 60793-1-32:2010 est destinée principalement aux essais des fibres, dès leur production par un fabricant de fibres, ou après revêtement ultérieur (revêtement protecteur serré) au moyen de divers polymères. L'essai peut être effectué soit sur des fibres issues de production, soit après exposition à divers environnements. Le présent essai s'applique aux fibres de type A1, A2, A3, B et C. Cette édition a été modifiée pour inclure les pratiques utilisées actuellement sur le marché.
    Cette publication contient des couleurs qui sont considérés comme étant utile pour une bonne compréhension de son contenu.
