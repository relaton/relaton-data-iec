abstract:
- language: fr
  script: Latn
  content: |-
    La CEI 60974-9:2010 est applicable à l'installation et à l'utilisation du matériel pour le soudage à l'arc et les procédés connexes conçus selon les exigences de sécurité de la CEI 60974-1, de la CEI 60974-6 ou équivalent. La présente partie de la CEI 60974 est applicable pour guider les instructeurs, les opérateurs, les soudeurs, les gestionnaires, et les superviseurs pour obtenir une installation et une utilisation sûres du matériel pour le soudage à l'arc et les techniques connexes et obtenir des performances sûres dans les opérations de soudage et de coupage. Cette première édition constitue une révision technique. Les modifications majeures par rapport à la CEI/TS 62081:1999 sont les suivantes:<br/> 
    - 4.3.3 Câbles de soudage: les dimensions sont maintenant recommandées;<br/>
    - 5 Compatibilité électromagnétique (CEM): nouvel article;<br/>
    - 6 Champs électromagnétiques (CEM): nouvel article;<br/>
    - 7.3 Examen et maintenance de l'installation de soudage: on maintenant fait la différence entre examen périodique et examen quotidien.
