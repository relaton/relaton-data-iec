- language: en
  script: Latn
  content: Establishes classes of environmental parameters and their severities, covering the extreme (short-term) conditions to which a product may be subjected when being transported, installed, stored and used. Separate groups of classes are given for different product applications.
- language: fr
  script: Latn
  content: Définit les catégories des agents d'environnement et de leurs degrés de sévérité, couvrant les conditions extrêmes (de courte durée) auxquelles un produit peut être exposé lorsqu'il est transporté, installé, mis en stock et utilisé. Ces catégories dépendent des applications du produit.
