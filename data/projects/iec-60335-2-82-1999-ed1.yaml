abstract:
- language: en
  script: Latn
  content: 'Deals with the safety of electric personal service machines and amusement machines for commercial use. The standard deals with the common hazards encountered by users and maintenance persons. Examples of personal service machines are: shoe shining appliances, luggage lockers, currency dispensers. Examples of amusement machines are: gaming machines, pinball machines, bowling machines, kiddie rides and driving simulators.'
