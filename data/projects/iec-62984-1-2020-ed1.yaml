abstract:
- language: en
  script: Latn
  content: |-
    IEC 62984-1:2020 specifies general aspects, definitions and tests for high-temperature secondary batteries for mobile and/or stationary use and whose nominal voltage does not exceed 1 500 V.<br/>
    This document does not cover aircraft batteries, which are covered by IEC 60952 (all parts), or batteries for the propulsion of electric road vehicles, covered by IEC 61982 (all parts).
- language: fr
  script: Latn
  content: |-
    L'IEC 62984-1:2020 spécifie les aspects généraux, les définitions et les essais relatifs aux batteries d'accumulateurs à haute température pour usage mobile et/ou fixe et dont la tension nominale ne dépasse pas 1 500 V.<br/>
    Le présent document ne couvre pas les batteries d'aéronefs, qui sont couvertes par l'IEC 60952 (toutes les parties), ou les batteries pour la propulsion des véhicules routiers électriques, couvertes par l'IEC 61982 (toutes les parties).
