abstract:
- language: en
  script: Latn
  content: |-
    IEC/IEEE 62704-1:2026 defines the methodology for the application of the finite-difference time domain (FDTD) technique when used for determining the peak spatial-average specific absorption rate (psSAR) in the human body exposed to wireless communication devices with known uncertainty. It defines methods to validate the computational model of the device under test (DUT) and to assess its uncertainty when used in SAR simulations. Moreover, it defines procedures to determine the psSAR in a cubical volume and to verify the correct implementation of the FDTD simulation software. The applicable frequency range is 100 kHz to 10 GHz.<br/>
    This document does not recommend specific SAR limits; these are found elsewhere, for example, in the guidelines published by the International Commission on Non-Ionizing Radiation Protection (ICNIRP) or in IEEE Std C95.1.<br/>
    This second edition cancels and replaces the first edition published in 2017. This edition constitutes a technical revision.<br/>
    This edition includes the following significant technical changes with respect to the previous edition:<br/>
    a) specification of a SAR averaging algorithm for the calculation of the psSAR from computational results for arbitrarily shaped homogeneous phantoms, which avoids inconsistencies with respect to the algorithm for SAR averaging algorithm specified in IEC/IEEE 62209-1528 for SAR measurement methods;<br/>
    b) provision of SHA-256 checksums for all supplemental files;<br/>
    c) addition of brief informative discussion on developmental stages of IEC and IEEE computational modelling standards for SAR evaluations.
