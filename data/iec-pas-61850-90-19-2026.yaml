abstract:
- language: en
  script: Latn
  content: |-
    IEC PAS 61850-90-19:2026 document takes over the IEC 61850 data model specific definitions such as the definition of permissions and their assignment to roles from IEC 62351-8.<br/>
    The general requirements for Role-Based Access Control (RBAC) are defined in IEC 62351-8. This part of IEC 61850, which is a Publicly Available Specification, applies those requirements to the IEC 61850 environment, including the RBAC modelling considerations, the impacts on IEC 61850 models and protocols, and the resulting engineering process requirements.<br/>
    Additionally, the binding of permissions to objects is defined to allow an interoperable implementation regarding the semantic of roles. This is achieved by an assignment to unique data objects based on the SCL description. Note that for this, IEC 61850-6:2009+AMD1:2018+AMD2:2024 is a prerequisite as it defined a unique identification of objects in SCL.
