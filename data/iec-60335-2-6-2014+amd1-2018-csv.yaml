abstract:
- language: en
  script: Latn
  content: |-
    IEC 60335-2-6:2014+A1:2018 deals with the safety of stationary electric cooking ranges, hobs, ovens and similar appliances for household use, their rated voltage being not more than 250 V for single-phase appliances connected between one phase and neutral, and 480 V for other appliances. This International Standard also includes some requirements for ovens that are intended to be used on board ships. Examples of appliances that are within the scope of this standard are:<br/>
    - griddles;<br/>
    - grills;<br/>
    - induction hobs;<br/>
    - induction wok elements;<br/>
    - pyrolytic self-cleaning ovens and steam ovens. As far as is practicable, this standard deals with the common hazards presented by appliances that are encountered by all persons in and around the home. However, in general, it does not take into account; persons (including children) whose physical, sensory or mental capabilities; or lack of experience and knowledge prevents them from using the appliance safely without supervision or instruction. It also does not take into account children playing with the appliance. This sixth edition cancels and replaces the fifth edition published in 2002 including its Amendment 1 (2004) and its Amendment 2 (2008). It constitutes a technical revision. The principal changes in this edition as compared with the fifth edition of IEC 60335-2-6 are as follows (minor changes are not listed):<br/>
    - introduction of requirements for steam ovens;<br/>
    - introduction of requirements for ovens intended for use on ships;<br/>
    - clarified requirements for oven shelve construction and test;<br/>
    - introduction of optional values for the accessible surface temperatures of ovens;<br/>
    - introduction of stabilising means including warnings;<br/>
    - clarified representative periods for various appliances (Clause 10);<br/>
    - introduction of a spillage test for built-in under-bench ovens. It was established on the basis of the fifth edition (2010) of that standard. This publication is to be read in conjunction with IEC 60335-1:2010. This consolidated version consists of the sixth edition (2014) and its amendment 1 (2018).<br/>
    <br/>
    Key words: Stationary cooking, Hobs, Ranges, Ovens, Induction, Pyrolytic self-cleaning
- language: fr
  script: Latn
  content: |-
    L'IEC 60335-2-6:2014+A1:2018 traite de la sécurité des cuisinières, tables de cuisson, fours électriques fixes et appareils analogues pour usages domestiques, dont la tension assignée n'est pas supérieure à 250 V pour les appareils monophasés raccordés entre une phase et le neutre et à 480 V pour les autres appareils. La présente Norme internationale inclut aussi des exigences relatives aux fours destinés à être utilisés à bord de navires. Comme exemples d'appareils entrant dans le domaine d'application de la présente Norme, on peut citer:<br/>
    - les grils par contact;<br/>
    - les grils;<br/>
    - les tables de cuisson à induction;<br/>
    - les éléments woks à induction;<br/>
    - les fours autonettoyants par pyrolyse;<br/>
    - les fours à vapeur. Dans la mesure du possible, la présente Norme traite des dangers ordinaires présentés par les appareils, encourus par tous les individus à l'intérieur et autour de l'habitation. Cependant, la présente Norme ne tient pas compte en général des personnes (y compris des enfants) dont les capacités physiques, ensorielles ou mentales; ou le manque d'expérience et de connaissance les empêchent d'utiliser l'appareil en toute sécurité sans surveillance ou instruction; de l'utilisation de l'appareil comme jouet par des enfants. Cette sixième édition annule et remplace la cinquième édition parue en 2002, son Amendement 1 (2004) et son Amendement 2 (2008). Cette édition constitue une révision technique. Les modifications principales apportées dans la présente édition par rapport à la cinquième édition de l'IEC 60335-2-6 sont les suivantes (les modifications mineures ne sont pas énumérées ci-dessous):<br/>
    - introduction d'exigences relatives aux fours à vapeur;<br/>
    - introduction d'exigences relatives aux fours destinés à être utilisés à bord de navires;<br/>
    - clarification des exigences relatives à la construction et à l'essai des étagères de four;<br/>
    - introduction de valeurs facultatives pour les températures des surfaces accessibles des fours;<br/>
    - introduction d'un dispositif de stabilisation comportant des mises en garde;<br/>
    - clarification des périodes de référence pour différents appareils (Article 10);<br/>
    - ajout d'un agent de rinçage aux solutions d'essai de débordement;<br/>
    - introduction d'un essai de débordement pour les fours encastrés sous plan. Elle a été établie sur la base de la cinquième édition (2010) de cette norme.<br/>
    Cette version consolidée comprend la sixième édition (2014) et son amendement 1 (2018).<br/>
    Mots-clés: cuisinières, tables de cuisson, fours, induction, autonettoyants par pyrolyse<br/>
    Cette publication doit être lue conjointement avec l'IEC 60335-1:2010.
