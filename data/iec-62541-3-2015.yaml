abstract:
- language: en
  script: Latn
  content: |-
    IEC 62541-3:2015 describes the OPC Unified Architecture (OPC UA) AddressSpace and its Objects. It is the OPC UA meta model on which OPC UA information models are based. This second edition cancels and replaces the first edition published in 2010 and constitutes a technical revision. It includes the following changes:<br/>
    - Added rules for subtyping enumerations;<br/>
    - Added Property EnumValues;<br/>
    - Added Property ValueAsText;<br/>
    - Added EventType SystemStatusChangeEventType;<br/>
    - Added Properties MaxArrayLength and MaxStringLength;<br/>
    - Removed the concept of ModelParent;<br/>
    - Added EventType ProgressEventType;<br/>
    - Stated that it is allowed to use TAI in all places where UTC time is used;<br/>
    - Added Property EngineeringUnits;<br/>
    - Added ModellingRules OptionalPlaceholder and MandatoryPlaceholder.
- language: fr
  script: Latn
  content: |-
    L'IEC 62541-3:2015 décrit l'Espace d'Adressage (AddressSpace) de l'Architecture Unifiée OPC (OPC UA) ainsi que les Objets correspondants. Elle est le métamodèle OPC UA sur lequel se fondent les modèles d'informations OPC UA. Cette deuxième édition annule et remplace la première édition parue en 2010 et constitue une révision technique. Cette édition inclut les modifications suivantes:<br/>
    - Ajout de règles de sous-typage pour les énumérations;<br/>
    - Ajout de la Propriété EnumValues (Valeurs d'Énumération);<br/>
    - Ajout de la Propriété ValueAsText (Valeur comme Texte);<br/>
    - Ajout du Type d'Événement SystemStatusChange (Changement de Statut du Système);<br/>
    - Ajout des Propriétés MaxArrayLength (Longueur de Matrice Maximale) et MaxStringLength (Longueur de Chaîne Maximale);<br/>
    - Suppression du concept de Modèle Parent (ModelParent);<br/>
    - Ajout du Type d'Événement ProgressEventType (Type d'Événement de Progrès);<br/>
    - Indication qu'il est admis d'utiliser le TAI (Temps Atomique International - International Atomic Time) au lieu du temps UTC;<br/>
    - Ajout de la Propriété EngineeringUnits (Unités Techniques);<br/>
    - Ajout des Règles de Modélisation OptionalPlaceholder (Espace Réservé Facultatif) et MandatoryPlaceholder (Espace Réservé Obligatoire).
