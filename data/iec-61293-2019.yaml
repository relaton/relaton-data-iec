abstract:
- language: en
  script: Latn
  content: |-
    IEC 61293:2019 establishes minimum requirements and general rules on marking electric equipment with ratings and other characteristics to enable the proper and safe selection and installation of electric equipment related to any supply of electricity.<br/>
    The object of this document is to:<br/>
    • provide general requirements for the marking of the characteristics related to any supply system, such as voltage, current, frequency and power, without any restrictions;<br/>
    • provide technical committees with uniform methods for the marking of electrical ratings of products.<br/>
    This document is primarily intended for application by technical committees when specifying minimum markings of ratings related to any electrical supply of equipment, sub-assemblies and components, but it is also for application by product manufacturers for marking their products.<br/>
    This horizontal standard is primarily intended for use by technical committees in the preparation of standards in accordance with the principles laid down in IEC Guide 108.<br/>
    One of the responsibilities of a technical committee is, wherever applicable, to make use of horizontal standards in the preparation of its publications. The contents of this horizontal standard will not apply unless specifically referred to or included in the relevant publications.<br/>
    IEC 61293:2019 cancels and replaces the first edition published in 1994. This edition constitutes a technical revision.<br/>
    This edition includes the following significant technical changes with respect to the previous edition:<br/>
    a) its status as a basic safety publication has been removed;<br/>
    b) the scope is extended to include the applicability of this document to product manufacturers;<br/>
    c) the addition of a provision that the visibility of the marking during normal operation should be considered;<br/>
    d) more detailed requirements where equipment has a set or range of rated values for a given characteristic;<br/>
    e) requirements regarding the provision of the markings also in the technical documentation have been added;<br/>
    f) some notes have been converted to normative text;<br/>
    g) normative references and references to other standards have been updated.<br/>
    It has the status of a horizontal standard in accordance with IEC Guide 108.
- language: fr
  script: Latn
  content: |-
    L'IEC 61293:2019 établit les exigences minimales et les règles générales pour le marquage des matériels électriques avec des caractéristiques assignées et autres caractéristiques, afin de pouvoir choisir et installer, de manière adéquate et sûre, les matériels électriques associés à toute source d'alimentation électrique.<br/>
    L'objet de ce document est de:<br/>
    • fournir les exigences générales concernant le marquage, sans aucune restriction, des caractéristiques relatives à toute alimentation, telle que la tension, le courant, la fréquence et la puissance;<br/>
    • fournir aux comités d'études des méthodes uniformes concernant le marquage des caractéristiques assignées électriques des produits.<br/>
    Ce document est destiné principalement à être appliqué par les comités d'études lors de la spécification des marquages minimaux des caractéristiques assignées relatives à toute alimentation électrique de matériels, sous-ensembles et composants. Il est également destiné à être appliqué par les fabricants de produits pour le marquage de leurs produits.<br/>
    Cette norme horizontale est essentiellement destinée à l'usage des comités d'études dans la préparation des normes, conformément aux principes établis dans le Guide 108 de l'IEC.<br/>
    Une des responsabilités d'un comité d'études est, partout où cela est possible, de se servir des normes horizontales lors de la préparation de ses publications. Le contenu de cette norme horizontale ne s'appliquera pas, à moins qu'il ne soit spécifiquement désigné ou inclus dans les publications concernées.<br/>
    L'IEC 61293:2019 annule et remplace la première édition parue en 1994. Cette édition constitue une révision technique.<br/>
    Cette édition inclut les modifications techniques majeures suivantes par rapport à l'édition précédente:<br/>
    a) son statut de publication fondamentale de sécurité a été supprimé;<br/>
    b) le domaine d'application est étendu afin d'inclure également l'applicabilité du présent document aux fabricants de produits;<br/>
    c) l'ajout d'une provision pour prendre en compte la visibilité du marquage en fonctionnement normal;<br/>
    d) des exigences plus détaillées ont été ajoutées lorsqu'un matériel comporte un ensemble ou une plage de valeurs assignées pour une caractéristique donnée;<br/>
    e) des exigences concernant l'intégration des marquages également dans la documentation technique ont été ajoutées;<br/>
    f) certaines notes ont été transformées en texte normatif;<br/>
    g) les références normatives et les références à d'autres normes ont été actualisées.<br/>
    Elle a le statut de norme horizontale conformément au Guide IEC 108.
