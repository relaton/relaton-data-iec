abstract:
- language: en
  script: Latn
  content: |-
    <p>This document provides accompanying reference software for ISO/IEC 23090-30. The software is an integral part of this document.</p>
    <p>The use of this reference software is not required to make an implementation of an encoder or decoder in conformance to ISO/IEC 23090-30. Requirements established in ISO/IEC 23090-30 take precedence over the behaviour of the reference software.</p>
    <p>This document also specifies a set of tests and procedures designed to indicate whether encoders or decoders meet the normative requirements specified in ISO/IEC 23090-30.</p>
