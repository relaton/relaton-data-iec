abstract:
- language: en
  script: Latn
  content: |-
    IEC 61753-021-03:2026 defines minimum initial test and measurement requirements and severities which single-mode fibre optic connectors terminated as a pigtail or a patchcord satisfy in order to be categorized as meeting the IEC standard category OP (outdoor protected environment), as defined in IEC 61753-1. If tests are performed on the connectors terminated as pigtails or patchcords for category OPHD, OP+ or OP+HD and the product passes these tests, the product will be automatically qualified or categorized as meeting the IEC standard for category OP. If tests are performed on the connectors terminated as pigtails or patchcords for category OP, and the product passes these tests, the product will be automatically qualified or categorized as meeting the IEC standard for category C or CHD.<br/>
    This first edition cancels and replaces the first edition of IEC 61753-021-3 published in 2012.<br/>
    This edition constitutes a technical revision. This edition includes the following significant technical changes with respect to the previous edition:<br/>
    a) update of environmental categories (from U to OP), tests and their severities in accordance with IEC 61753‑1;<br/>
    b) changes in the terms and definitions of the different types of test samples (pigtail test samples and patchcord test samples) used in the various tests to avoid confusion;<br/>
    c) update of fibre naming conventions in accordance with IEC 60793‑2‑50 and addition of provisions for B‑657 fibres;<br/>
    d) addition of all the attenuation and return loss grades defined in IEC 61753‑1;<br/>
    e) deletion of the static side load test;<br/>
    f) addition of provisions for rectangular ferrule connectors;<br/>
    g) addition of the fibre optic connector proof test with static load – side pull;<br/>
    h) update of the flexing of the strain relief test to use change of attenuation instead of transient loss;<br/>
    i) addition of Annex B for visual examination of the outer cable sheath movement of reinforced cables as an additional requirement for change of temperature, cable retention and flexing of the strain relief tests.
- language: fr
  script: Latn
  content: |-
    L’IEC 61753-021-03:2026 définit les exigences minimales d’essai et de mesures initiales et les sévérités auxquelles les connecteurs fibroniques unimodaux raccordés à des fibres amorces et des cordons de brassage satisfont pour être classés comme répondant à la catégorie OP (environnement extérieur protégé) de la norme IEC, telle qu’elle est définie dans l’IEC 61753-1.<br/>
    Si les essais sont effectués sur les connecteurs raccordés à des fibres amorces et des cordons de brassage pour la catégorie OPHD, OP+ ou OP+HD et que le produit satisfait aux essais, il est automatiquement qualifié ou classé comme répondant à la catégorie OP de la norme IEC. Si les essais sont effectués sur les connecteurs raccordés à des fibres amorces et des cordons de brassage pour la catégorie OP, et que le produit satisfait aux essais, il est automatiquement qualifié ou classé comme répondant à la catégorie C ou CHD de la norme IEC.<br/>
    Cette première édition annule et remplace la première édition de l'IEC 61753-021-3 parue en 2012.<br/>
    Cette édition constitue une révision technique.Cette édition inclut les modifications techniques significatives suivantes par rapport à l'édition précédente:<br/>
    a) mise à jour des catégories d’environnement (de U à OP), des essais et de leurs sévérités conformément à l’IEC 61753-1;<br/>
    b) modification des termes et définitions des différents types d’échantillons d’essai (échantillons d’essai de fibres amorces et échantillons d’essai de cordons de brassage) utilisés dans les différents essais afin d’éviter toute confusion;<br/>
    c) mise à jour des conventions de nommage des fibres, conformément à l’IEC 60793­2­50 et ajout de dispositions pour les fibres B-657;<br/>
    d) ajout de toutes les classes d’affaiblissement et d’affaiblissement de réflexion définies dans l’IEC 61753-1;<br/>
    suppression de l’essai de charge latérale statique;<br/>
    f) ajout de dispositions pour les connecteurs à férule rectangulaire;<br/>
    g) ajout de l’essai de résistance des connecteurs fibroniques avec charge statique – traction latérale;<br/>
    h) mise à jour de la flexion de l'essai des serre-câbles pour utiliser les variations d'affaiblissement à la place des pertes transitoires;<br/>
    i) ajout de l’Annexe B relative à l’examen visuel du mouvement de la gaine extérieure du câble des câbles renforcés comme exigence supplémentaire pour les essais de variations de température, de rétention du câble et de flexion des serre-câbles.
