abstract:
- language: en
  script: Latn
  content: |-
    IEC 60350-1:2023 specifies methods for measuring the performance of electric cooking ranges, ovens, steam ovens, and grills for household use. This document is also applicable to portable appliances with similar functionalities that were previously covered by the withdrawn IEC 61817. The ovens covered by this document can be with or without microwave function. Manufacturers are expected to define the primary cooking function of the appliance – microwave function or thermal heat. The primary cooking function is measured with an existing method according to energy consumption. If the primary cooking function is declared in the instruction manual as a microwave function, IEC 60705 is applied for energy consumption measurement. If the primary cooking function is declared as a thermal heat, then IEC 60350-1 is applied for energy consumption measurement. If the primary function is not declared by the manufacturer, the performance of the microwave function and thermal heat is measured as far as it is possible. For measurement of energy consumption and time for heating a load (see Clause 8), this document is furthermore not applicable to:<br/>
    - microwave combination function;<br/>
    - ovens with reciprocating trays or turntable;<br/>
    - small cavity ovens (see 3.16);<br/>
    - ovens without adjustable temperature control;<br/>
    - heating functions and eco functions other than defined in this document;<br/>
    - appliances with only solo steam function.<br/>
    This document does not apply to microwave ovens (IEC 60705). This document defines the main performance characteristics of these appliances that are of interest to the user and specifies methods for measuring these characteristics.<br/>
    This document does not specify a classification or ranking for performance. This document does not deal with safety requirements (IEC 60335-2-6 and IEC 60335-2-9). Appliances covered by this document can be built-in or for placing on a working surface or the floor. There is no measurement method for the energy consumption for grilling and steam functions available. This third edition cancels and replaces the second edition published in 2016 and Interpretation Sheet 1:2021. This edition constitutes a technical revision. This edition includes the following significant technical changes with respect to the previous edition:<br/>
    a) new definitions for heating function, eco function and definitions relevant for low power mode considerations are amended in Clause 3;<br/>
    b) order of clauses is changed;<br/>
    c) revision of 5.3;<br/>
    d) update of 6.2 in order to improve the reliability of volume measurement;<br/>
    e) removal of 6.7, Level of shelf;<br/>
    f) revision of Clause 7 concerning the accuracy of eco functions with residual heat use;<br/>
    g) revision of Clause 8 in order to improve the reliability of the method for measuring the energy consumption, especially regarding anti-circumvention;<br/>
    h) unique energy consumption measurement for all heating functions and eco functions with an indication of the energy consumption for a temperature increase of 165 K (compared to 155 K currently for forced air circulation function, for example), which results in higher energy consumption values compared to the previous edition;<br/>
    i) Ry replaced by L* in Clause 9 and reference to IEC TS 63350;<br/>
    j) cooking time for reference measurement introduced for broccoli in Clause 10;<br/>
    k) yellow part replaced by hue angle value in Clause 10;<br/>
    l) requirements for digital assessment (see former 7.5.3.6.3) are obsolete as specified in IEC TS 63350;<br/>
    m) revision of Clause 14 (Consumption measurement of low power modes, previous Clause 12);<br/>
    n) former Annex G (informative) is cancelled due to the fact that this method for measuring an associated activity has been not applied;<br/>
    o) former Annexes B and F are obsolete, up-to-date shade charts are specified in IEC TS 63350;<br/>
    p) former Annex E will be substituted by a supporting document located on the IEC's website.
- language: fr
  script: Latn
  content: |-
    L'IEC 60350-1:2023 spécifie les méthodes de mesure de l'aptitude à la fonction des cuisinières, des fours, des fours à vapeur et des grils électriques à usage domestique. Le présent document s'applique également aux appareils mobiles équipés de fonctionnalités similaires, qui étaient auparavant couverts par l'IEC 61817 aujourd'hui supprimée. Les fours couverts par le présent document peuvent disposer ou non d'une fonction micro ondes. Les fabricants sont présumés définir la fonction de cuisson principale de l'appareil: micro-ondes ou chaleur thermique. La fonction de cuisson principale est mesurée au moyen d'une méthode existante en fonction de la consommation d'énergie. Si la fonction de cuisson principale est déclarée dans le manuel d'instruction comme étant la fonction micro-ondes, l'IEC 60705 s'applique pour le mesurage de la consommation d'énergie. Si la fonction de cuisson principale est déclarée comme étant la chaleur thermique, l'IEC 60350-1 s'applique pour le mesurage de la consommation d'énergie. Si la fonction principale n'est pas déclarée par le fabricant, l'aptitude à la fonction micro-ondes et à la fonction chaleur thermique est mesurée autant que possible. Pour le mesurage de la consommation d'énergie et du temps de chauffage d'une charge (voir l'Article 8), le présent document ne s'applique pas non plus aux:<br/>
    - fonctions micro-ondes combinées;<br/>
    - fours avec plateau coulissant ou plateau tournant;<br/>
    - fours à petite cavité (voir le 3.16);<br/>
    - fours sans commande de température réglable;<br/>
    - fonctions de chauffage et fonctions éco autres que celles définies dans le présent document;<br/>
    - appareils avec fonction de vapeur uniquement.<br/>
    Le présent document ne s'applique pas aux fours à micro-ondes (IEC 60705).<br/>
    Le présent document définit les caractéristiques de performance principales de ces appareils qui sont pertinentes pour l'utilisateur et spécifie les méthodes de mesure de ces caractéristiques. Le présent document ne spécifie pas un système de classement pour l'aptitude à la fonction de ces appareils. Le présent document ne traite pas des exigences de sécurité (IEC 60335-2-6 et IEC 60335-2-9). Les appareils couverts par le présent document peuvent être posés sur le sol, encastrés ou placés sur un plan de travail. Aucune méthode de mesure de la consommation d'énergie n'est disponible pour les fonctions de vapeur et de grill. Cette troisième édition annule et remplace la deuxième édition parue en 2016 et la Fiche d'interprétation 1:2021. Cette édition constitue une révision technique. Cette édition inclut les modifications techniques majeures suivantes par rapport à l'édition précédente:<br/>
    a) ajout de nouvelles définitions pour la fonction de chauffage et la fonction éco, avec un amendement concernant les considérations relatives au mode faible puissance à l'Article 3;<br/>
    b) modification de l'ordre des articles;<br/>
    c) révision du 5.3;<br/>
    d) mise à jour du 6.2 afin d'améliorer la fiabilité de la mesure du volume;<br/>
    e) suppression du 6.7, Horizontalité de l'étagère;<br/>
    f) révision de l'Article 7 relatif à l'exactitude des fonctions éco avec utilisation de la chaleur résiduelle;<br/>
    g) révision de l'Article 8 afin d'améliorer la fiabilité de la méthode de mesure de la consommation d'énergie, en particulier en ce qui concerne l'anticontournement;<br/>
    h) mesurage de la consommation d'énergie unique pour l'ensemble des fonctions de chauffage et des fonctions éco avec indication de la consommation d'énergie pour une augmentation de la température de 165 K (comparée à 155 K actuellement pour une fonction de circulation forcée de l'air, par exemple), ce qui donne des valeurs de consommation d'énergie supérieures à celles de l'édition précédente;<br/>
    i) remplacement de Ry par L* dans l'Article 9 et référence à l'IEC TS 63350;<br/>
    j) introduction du temps de cuisson pour la mesure de référence des brocolis à l'Article 10;<br/>
    k) remplacement du terme "partie jaune" par le terme "valeur d'angle de teinte" à l'Article 10;<br/>
    l) les exigences relatives à la vérification numérique (voir l'ancien 7.5.3.6.3) sont obsolètes, comme cela est spécifié dans l'IEC TS 63350;<br/>
    m) révision de l'Article 14 (Mesurage de la consommation des modes faible puissance, ancien Article 12);<br/>
    n) annulation de l'ancienne Annexe G (informative) en raison de l'absence d'application de cette méthode de mesure d'une activité associée;<br/>
    o) les anciennes Annexes B et F sont obsolètes, car des nuanciers plus récents sont spécifiés dans l'IEC TS 63350;<br/>
    p) l'ancienne Annexe E sera remplacée par un document de support disponible sur le site web de l'IEC.
