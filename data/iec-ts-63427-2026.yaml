abstract:
- language: en
  script: Latn
  content: |-
    IEC TS 63427:2026 provides principles and technical requirements for the adjustment potential of demand side resources in demand side management. Demand side resources include dispatchable loads, electrical energy storage, grid-connected microgrids, and distributed energy resources, which are connected to power distribution systems and capable of adjusting their operating state and exchanging information with grid control systems. It includes the DSR characteristics, system requirements, data preparation and evaluation process.<br/>
    The adjustments of demand side resources can be subject to relevant local regulations or specifications. Electricity market mechanisms, user behaviour and data privacy are excluded from the scope of this document.
