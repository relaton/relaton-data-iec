abstract:
- language: en
  script: Latn
  content: |-
    IEC 61290-1:2014 applies to all commercially available optical amplifiers (OAs) and optically amplified subsystems. It applies to OAs using optically pumped fibres (OFAs based on either rare-earth doped fibres or on the Raman effect), semiconductors (SOAs), and waveguides (POWAs). The object of this standard is to establish uniform requirements for accurate and reliable measurements of the following OA parameters, as defined in Clause 3 of IEC 61291-1:2012:<br/>
    - nominal output signal power;<br/>
    - gain;<br/>
    - reverse gain;<br/>
    - maximum gain;<br/>
    - maximum gain wavelength;<br/>
    - maximum gain variation with temperature;<br/>
    - gain wavelength band;<br/>
    - gain wavelength variation;<br/>
    - gain stability;<br/>
    - polarization-dependent gain;<br/>
    - large-signal output stability;<br/>
    - saturation output power;<br/>
    - maximum output signal power;<br/>
    - maximum total output power. The object of this standard is specifically directed to single-channel amplifiers. For multichannel amplifiers, one should refer to the IEC 61290-10 series. Keywords: optical amplifiers (OAs), optically pumped fibres (OFAs), semiconductors (SOAs), and waveguides (POWAs)
- language: fr
  script: Latn
  content: |-
    L'IEC 61290-1:2014 s'applique à tous les amplificateurs optiques (AO) et sous-systèmes à amplification optique disponibles sur le marché. Elle s'applique aux AO utilisant des fibres pompées optiquement (AFO basés sur des fibres dopées aux terres rares ou sur l'effet Raman), à semiconducteurs (AOS), et à guides d'ondes (POWA). L'objet de la présente norme est d'établir des exigences uniformes pour des mesures précises et fiables des paramètres d'AO donnés ci-dessous, tels qu'ils sont définis dans l'Article 3 de l'IEC 61291-1:2012:<br/>
    - puissance nominale du signal de sortie;<br/>
    - gain;<br/>
    - gain inverse;<br/>
    - gain maximal;<br/>
    - longueur d'onde du gain maximal;<br/>
    - variation maximale du gain en fonction de la température;<br/>
    - bande de longueur d'onde du gain;<br/>
    - variation du gain en fonction de la longueur d'onde;<br/>
    - stabilité du gain;<br/>
    - gain dépendant de la polarisation;<br/>
    - stabilité de sortie grands signaux;<br/>
    - puissance de sortie en saturation;<br/>
    - puissance maximale du signal de sortie;<br/>
    - puissance totale de sortie maximale. L'objet de la présente norme est spécifiquement centré sur les amplificateurs à un seul canal. Pour les amplificateurs à canaux multiples, il convient de se reporter à la série IEC 61290-10. Mots clés: amplificateurs optiques (AO), fibres pompées optiquement (AFO), semiconducteurs (AOS), guides d'ondes (POWA)
