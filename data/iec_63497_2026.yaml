- content: "L'IEC 63497:2026, qui est une norme de produit destinée à spécifier les
    exigences de compatibilité électromagnétique (CEM), de performance et de sécurité
    relatives aux dispositifs de correction active (ACD) à connexion shunt dont les
    tensions système assignées ne dépassent pas 1 000 V en courant alternatif ou 1
    500 V en courant continu.<br />\r\nCes dispositifs peuvent être des dispositifs
    à cordon amovible, ou être raccordés de manière permanente. Ils peuvent être des
    dispositifs mobiles, stationnaires ou fixes.<br />\r\nLes ACD englobent les générateurs
    de puissance réactive statiques (SVG) et les filtres d’harmoniques actifs (AHF).<br
    />\r\nLa fonction principale d’un ACD à connexion shunt est de réaliser une ou
    plusieurs des tâches suivantes:<br />\r\n- filtrage actif des harmoniques;<br
    />\r\n- compensation de puissance réactive;<br />\r\n- compensation des charges
    non équilibrées.<br />\r\nLes fonctions supplémentaires d’un ACD à connexion shunt,
    non abordées dans le présent document, peuvent être les suivantes:<br />\r\n-
    compensation du papillotement (\"flicker\");<br />\r\n- filtrage des composantes
    interharmoniques.<br />\r\nDans le cas de dispositifs hybrides, qui combinent
    un filtre d’harmoniques passif et un ACD, le présent document couvre uniquement
    la partie active.<br />\r\nLe présent document ne couvre pas<br />\r\n- les fonctions
    d’atténuation active d’un autre dispositif (variateur, alimentation sans interruption,
    correcteur dynamique de tension, etc.),<br />\r\n- les condensateurs de puissance
    commutés,<br />\r\n- les inductances commutées,<br />\r\n- les filtres d’harmoniques
    passifs,<br />\r\n- les convertisseurs de stockage d’énergie, et<br />\r\n- les
    dispositifs de correction active à connexion série."
