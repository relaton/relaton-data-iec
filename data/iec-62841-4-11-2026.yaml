abstract:
- language: en
  script: Latn
  content: |-
    IEC 62841-4-11:2026 applies to the following types of edgers<br/>
    - hand-held edgers having at least one ground-support;<br/>
    - walk-behind edgers and walk-beside edgers, where the plane of the blade-tip circle is designed to operate at not more than 15° from the vertical.<br/>
    The edgers to which this document applies have a blade-tip circle diameter of not more than 305 mm, and are equipped with a<br/>
    - cutting accessory; or<br/>
    - cutting means with one or more cutting elements pivotally mounted on a generally circular drive unit and have a kinetic energy for each single cutting element of greater than 10 J.<br/>
    NOTE 101 Machines having cutting elements with a kinetic energy not exceeding 10 J are considered to be lawn edge trimmers and are covered by IEC 62841-4-4.<br/>
    This document does not apply to<br/>
    - lawn trimmers, lawn edge trimmers, grass trimmers, brush cutters and brush saws;<br/>
    - scissor type edgers and brush cutters; and<br/>
    - machines equipped with metallic cutting accessories consisting of more than one piece, e.g. pivoting chains or flail blades.<br/>
    NOTE 102 Lawn trimmers, lawn edge trimmers, brush cutters and brush saws are covered by IEC 62841-4-4.<br/>
    NOTE 103 Scissor type edgers and brush cutters will be covered by a future part of IEC 62841.<br/>
    NOTE 104 In Europe (EN IEC 62841-4-11), this document does not apply to edgers equipped with integral batteries.<br/>
    This document is to be used in conjunction with the first edition of IEC 62841-1:2014 and IEC 62841-1:2014/AMD1:2025.<br/>
    NOTE The attention of National Committees is drawn to the fact that equipment manufacturers and testing organizations can need a transitional period following publication of a new, amended or revised IEC publication in which to make products in accordance with the new requirements and to equip themselves for conducting new or revised tests.<br/>
    It is the recommendation of the committee that the content of this publication be adopted for implementation nationally not earlier than 36 months from the date of publication.
- language: fr
  script: Latn
  content: |-
    IEC 62841-4-11:2026 s'applique aux types de coupe‑bordures suivants:<br/>
    coupe‑bordures portatifs qui comportent au moins un support au sol;<br/>
    coupe‑bordures actionnés par un opérateur et coupe‑bordures à pied dont le plan de la circonférence de coupe est conçu pour fonctionner à un angle qui ne dépasse pas 15° par rapport à la verticale.<br/>
    Les coupe‑bordures relevant du domaine d'application du présent document ont un diamètre de circonférence de coupe de diamètre ne dépassant pas 305 mm et sont équipés<br/>
    d'un accessoire de coupe; ou<br/>
    d'un organe de coupe qui comporte un ou plusieurs éléments de coupe pivotants sur une unité d'entraînement généralement circulaire et ayant une énergie cinétique supérieure à 10 J pour chaque élément de coupe unique.<br/>
    NOTE 101 Les machines dont les éléments de coupe ont une énergie cinétique qui ne dépasse pas 10 J sont considérées comme des coupe‑bordures et sont couvertes par l'IEC 62841‑4‑4.<br/>
    Le présent document ne s'applique pas aux<br/>
    taille‑gazon, coupe‑bordures, coupe‑herbes, débroussailleuses et débroussailleuses à lame de scie;<br/>
    coupe‑bordures de type ciseaux et aux débroussailleuses; et<br/>
    machines équipées d'accessoires de coupe métalliques composés de deux éléments ou plus, par exemple, chaînes pivotantes ou lames de fléau.<br/>
    NOTE 102 Les taille‑gazon, coupe‑bordures, débroussailleuses et débroussailleuses à lame de scie sont couverts par l'IEC 62841‑4‑4.<br/>
    NOTE 103 Les coupe‑bordures de type ciseaux et les débroussailleuses seront couverts par une partie ultérieure de l'IEC 62841.<br/>
    NOTE 104 En Europe (EN IEC 62841‑4‑11), le présent document ne s'applique pas aux coupe‑bordures équipés de batteries non amovibles.<br/>
    Le présent document doit être utilisé conjointement avec la première édition de l'IEC 62841‑1:2014 et de l'IEC 62841‑1:2014/AMD1:2025.<br/>
    NOTE L'attention des Comités nationaux est attirée sur le fait que les fabricants d'appareils et les organismes d'essai peuvent avoir besoin d'une période transitoire après la publication d'une nouvelle publication IEC, ou d'une publication amendée ou révisée, pour fabriquer des produits conformes aux nouvelles exigences et pour adapter leurs équipements aux nouveaux essais ou aux essais révisés.<br/>
    Le comité recommande que le contenu de cette publication soit adopté pour application nationale au plus tôt 36 mois après la date de publication.
