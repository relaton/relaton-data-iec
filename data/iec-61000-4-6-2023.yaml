abstract:
- language: en
  script: Latn
  content: |-
    IEC 61000-4-6: 2023 relates to the conducted immunity requirements of electrical and electronic equipment to electromagnetic disturbances coming from intended radio-frequency (RF) transmitters in the frequency range 150 kHz up to 80 MHz.<br/>
    NOTE 1 Product committees might decide to use the methods described in this document also for frequencies up to 230 MHz (see Annex B) although the methods and test instrumentation are intended to be used in the frequency range up to 80 MHz.<br/>
    Equipment not having at least one conducting wire or cable (such as mains supply, signal line or earth connection) which can couple the equipment to the disturbing RF fields is excluded from the scope of this document.<br/>
    NOTE 2 Test methods are specified in this part of IEC 61000 to assess the effect that conducted disturbing signals, induced by electromagnetic radiation, have on the equipment concerned. The simulation and measurement of these conducted disturbances are not adequately exact for the quantitative determination of effects. The test methods specified are structured for the primary objective of establishing adequate repeatability of results at various facilities for quantitative analysis of effects.<br/>
    The object of this document is to establish a common reference for evaluating the functional immunity of electrical and electronic equipment when subjected to conducted disturbances induced by RF fields. The test method in this document describes a consistent method to assess the immunity of an equipment or system against a specified phenomenon.<br/>
    NOTE 3 As described in IEC Guide 107, this document is a basic EMC publication for use by product committees of the IEC. As also stated in Guide 107, the IEC product committees are responsible for determining whether this immunity test standard should be applied or not, and if applied, they are responsible for determining the appropriate test levels and performance criteria.<br/>
    This fifth edition cancels and replaces the fourth edition published in 2013. This edition constitutes a technical revision. This edition includes the following significant technical changes with respect to the previous edition:<br/>
    a) selection of injection devices revised;<br/>
    b) need of AE impedance check for clamp injection removed and Annex H deleted;<br/>
    c) saturation check revised;<br/>
    d) new Annex H on testing with multiple signals;<br/>
    e) level-setting only with feedback loop.
- language: fr
  script: Latn
  content: |-
    IEC 61000-4-6: 2023 traite des exigences relatives à l'immunité en conduction des matériels électriques et électroniques aux perturbations électromagnétiques provoquées par des émetteurs radioélectriques (RF) dans la plage de fréquences de 150 kHz à 80 MHz.<br/>
    NOTE 1 Les comités de produits peuvent également choisir d'utiliser les méthodes décrites dans le présent document pour les fréquences inférieures ou égales à 230 MHz (voir Annexe B) même si ces méthodes et les appareils d'essai sont destinés à être utilisés dans la plage de fréquences inférieures ou égales à 80 MHz.<br/>
    Les matériels qui ne comportent pas au moins un câble conducteur (cordon d'alimentation, ligne de transmission ou connexion de mise à la terre, par exemple) capable de coupler les matériels aux champs perturbateurs aux fréquences radioélectriques ne relèvent pas du domaine d'application du présent document.<br/>
    NOTE 2 Les méthodes d'essai sont spécifiées dans la présente partie de l'IEC 61000 afin d'évaluer l'incidence des signaux perturbateurs conduits, induits par les rayonnements électromagnétiques, sur le matériel concerné. La simulation et le mesurage de ces perturbations conduites ne sont pas parfaitement exacts pour la détermination quantitative des effets. Les méthodes d'essai spécifiées sont structurées dans l'objectif principal d'établir une reproductibilité appropriée des résultats dans différentes installations à des fins d'analyse quantitative des effets.<br/>
    L'objet du présent document est d'établir une référence commune dans le but d'évaluer l'immunité fonctionnelle des matériels électriques et électroniques, lorsqu'ils sont soumis aux perturbations conduites induites par les champs aux fréquences radioélectriques. La méthode d'essai du présent document décrit une méthode cohérente dans le but d'évaluer l'immunité d'un matériel ou d'un système vis-à-vis d'un phénomène spécifié.<br/>
    NOTE 3 Comme cela est décrit dans le Guide 107 de l'IEC, le présent document est une publication fondamentale en CEM destinée à être utilisée par les comités de produits de l'IEC. Comme cela est également indiqué dans le Guide 107, il incombe aux comités de produits de l'IEC de déterminer s'il convient d'appliquer ou non la présente norme d'essai d'immunité. Si tel est le cas, ils ont la responsabilité de déterminer les niveaux d'essai et les critères de performance appropriés.<br/>
    Elle constitue la Partie 4-6 de l'IEC 61000. Il a le statut d'une publication fondamentale en CEM conformément au Guide 107 de l'IEC.<br/>
    Cette cinquième édition annule et remplace la quatrième édition parue en 2013. Cette édition constitue une révision technique.<br/>
    Cette édition inclut les modifications techniques majeures suivantes par rapport à l'édition précédente:<br/>
    a) le choix des dispositifs d'injection a été révisé;<br/>
    b) la nécessité de vérifier l'impédance de l'AE pour l'injection par pince a été supprimée, et l'Annexe H a été supprimée;<br/>
    c) la procédure de contrôle de la saturation a été révisée;<br/>
    d) une nouvelle Annexe H a été ajoutée pour les essais avec plusieurs signaux;<br/>
    e) le réglage du niveau s'applique avec une boucle de rétroaction uniquement.
