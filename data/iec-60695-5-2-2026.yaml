abstract:
- language: en
  script: Latn
  content: "IEC 60695-5-2:2026 summarises the test methods that are used in the assessment of the corrosivity of fire effluent. It presents a brief summary of test methods in common use, either as international standards, national or industry standards. It includes special observations on their relevance, for electrotechnical products and their materials, to real fire scenarios and gives recommendations on their use.<br/>\nThis first edition cancels and replaces the third edition of IEC TS 60695-5-2 published in 2021. This edition constitutes a technical revision. This edition includes the following significant technical changes with respect to IEC TS 60695-5-2:<br/>\na) 4.4, The nature of the corrosivity measurement, has been added to follow recent technological developments;<br/>\nb) 5.2, Tests for the determination of halogen acid in combustion gases, has been updated following the recent development of IEC 60754."
- language: fr
  script: Latn
  content: "L'IEC 60695-5-2:2026 récapitule les méthodes d'essai utilisées pour évaluer la corrosivité des effluents du feu. Elle fournit un bref récapitulatif des méthodes d'essai couramment utilisées, qu'il s'agisse de normes internationales, de normes nationales ou de normes industrielles. Elle comprend des observations spéciales sur leur pertinence, pour les produits électrotechniques et leurs matériaux, dans des scénarios d'incendie réels et fournit des recommandations sur leur utilisation.<br/>\nCette première édition annule et remplace la troisième édition de l'IEC TS 60695‑5‑2 parue en 2021. Cette édition constitue une révision technique. Cette édition inclut les modifications techniques majeures suivantes par rapport à l'IEC TS 60695‑5‑2:<br/>\na) 4.4: la méthode de mesure de la corrosivité a été ajoutée afin de suivre les dernières évolutions technologiques;<br/>\nb) 5.2, Essais pour la détermination des acides halogénés dans les gaz de combustion: ce paragraphe a été mis à jour à la suite des récentes évolutions de l'IEC 60754."
