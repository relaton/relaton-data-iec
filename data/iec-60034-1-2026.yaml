abstract:
- language: en
  script: Latn
  content: "<!-- NEW! -->IEC 60034-1:2026 is available as <a href=\"https://webstore.iec.ch/publication/112762\">IEC
    60034-1:2026 RLV</a> which contains the International Standard and its Redline
    version, showing all changes of the technical content compared to the previous
    edition.</br></br>IEC 60034-1:2026 is applicable to all rotating electric machines,
    except rotating electric machines for rail and road vehicles, which are covered
    by the IEC 60349 series of standards. Machines with integrated EMC-active components
    such as a variable frequency converter are considered being a power drive system
    (see the IEC 61800 series of standards). In such cases, this document applies
    to the motor component of the power drive system only. Machines within the scope
    of this document can also be subject to superseding, modifying or additional requirements
    in other standards, for example, IEC 60079 and IEC 60092.<br />\r\nNOTE If particular
    clauses of this document are modified to meet special applications, for example
    machines subject to radioactivity or machines for aerospace, all other clauses
    apply insofar as they are compatible. This fifteenth edition cancels and replaces
    the fourteenth edition published in 2022. This edition constitutes a technical
    revision.<br />\r\nThis edition includes the following significant technical changes
    with respect to the previous edition:<br />\r\nClause 1: Clarification with respect
    to machines with integrated EMC-active components added<br />\r\nClause 2: Normative
    references updated<br />\r\nClause 3: Note on meaning of “agreement” deleted;
    list of abbreviations added<br />\r\nClause 4.2.9, 4.2.10: References to IEC TS
    60034-25 deleted, as converter duty is now defined in 3.36<br />\r\nClause 5.1:
    Reference to IEC TS 60034-25 converted into note<br />\r\nClause 6.6 Clarification
    of requirements<br />\r\nClause 7.2.1: Reference to IEC TS 60034-25 converted
    into note<br />\r\nClause 7.5: Clarification of requirements<br />\r\nClause 7.6:
    Reference to IEC TS 60034-25 converted into note<br />\r\nClause 8.1: Clarification
    of references<br />\r\nClause 8.6.1: Clarification on choice of method for large
    machines<br />\r\nTable 11: Updated values for thermal class 200 (N)<br />\r\nClause
    8.10.3: Clarification of requirements<br />\r\nClause 9.2: Clarification on test
    voltage for old machines after rewinding<br />\r\nTable 17: Items 9 and 10 merged
    and clarified<br />\r\nClause 9.7: Clarification on overspeed test for machines
    held at stock added<br />\r\nTable 20: Clarification on test speed for converter
    duty machines<br />\r\nClause 10.2: Clarification of term ‘digital form’<br />\r\nClause
    :10.3 Note on QR code deleted<br />\r\nClause 11.1: Reference to protective earth
    test added<br />\r\nClause 13.1: Clarifying flowchart added<br />\r\nClause 13.2.2:
    Clarification on motors with integrated VSD added<br />\r\nClause 13.3: Clarification
    of requirements after consultation with ACEC<br />\r\nClause 13.5: Clarification
    of requirements after consultation with ACEC<br />\r\nClause 14: Note on safety
    converted to normal text"
- language: fr
  script: Latn
  content: "<!-- NEW! -->IEC 60034-1:2026 est disponible sous forme de <a href=\"https://webstore.iec.ch/publication/112762\">IEC
    60034-1:2026 RLV</a> qui contient la Norme internationale et sa version Redline,
    illustrant les modifications du contenu technique depuis l'édition précédente.</br></br>L'IEC
    60034-1:2026 s'applique à toutes les machines électriques tournantes à l'exception
    des machines destinées aux véhicules ferroviaires et routiers, qui sont couvertes
    par la série de normes IEC 60349. Les machines avec composants CEM actifs intégrés
    comme un convertisseur à fréquence variable sont considérées comme un entraînement
    électrique de puissance (voir la série de normes IEC 61800). Dans ce cas, le présent
    document s'applique uniquement au composant moteur de l'entraînement électrique
    de puissance. Les machines comprises dans le domaine d'application du présent
    document peuvent également être soumises à des exigences nouvelles, modifiées
    ou complémentaires figurant dans d'autres normes, par exemple l'IEC 60079 et l'IEC
    60092.<br />\r\nNOTE Si certains articles du présent document sont modifiés afin
    de permettre des applications spéciales, par exemple pour les machines soumises
    à la radioactivité ou les machines aérospatiales, tous les autres articles s'appliquent
    dans la mesure où ils sont compatibles.<br />\r\nCette quinzième édition annule
    et remplace la quatorzième édition parue en 2022. Cette édition constitue une
    révision technique.<br />\r\nCette édition inclut les modifications techniques
    majeures suivantes par rapport à l'édition précédente:<br />\r\nParagraphe 1:
    Clarification ajoutée en ce qui concerne les machines avec composants CEM actifs
    intégrés<br />\r\nParagraphe 2: Références normatives mises à jour<br />\r\nParagraphe
    3: Note sur la signification du terme \"accord\" supprimée, liste des abréviations
    ajoutée<br />\r\nParagraphe 4.2.9, 4.1.10: Références à l'IEC TS 60034-25 supprimées,
    le terme \"machine fonctionnant exclusivement sur convertisseur\" étant désormais
    défini en 3.36<br />\r\nParagraphe 5.1: Référence à l'IEC TS 60034-25 convertie
    en note<br />\r\nParagraphe 6.6: Clarification des exigences<br />\r\nParagraphe
    7.2.1: Référence à l'IEC TS 60034-25 convertie en note<br />\r\nParagraphe 7.5:
    Clarification des exigences<br />\r\nParagraphe 7.6: Référence à l'IEC TS 60034-25
    convertie en note<br />\r\nParagraphe 8.1: Clarification des références<br />\r\nParagraphe
    8.6.1: Clarification du choix de la méthode pour les machines de grande taille<br
    />\r\nTableau 11: Valeurs mises à jour pour la classe thermique 200 (N)<br />\r\nParagraphe
    8.10.3: Clarification des exigences<br />\r\nParagraphe 9.2: Clarification de
    la tension d'essai des anciennes machines après rebobinage<br />\r\nTableau 17:
    Points 9 et 10 fusionnés et clarifiés<br />\r\nParagraphe 9.7: Clarification ajoutée
    en ce qui concerne l'essai de survitesse des machines stockées<br />\r\nTableau
    20: Clarification de la vitesse d'essai pour les machines fonctionnant exclusivement
    sur convertisseur<br />\r\nParagraphe 10.2: Clarification du terme \"forme numérique\"<br
    />\r\nParagraphe 10.3: Note sur le QR code supprimée<br />\r\nParagraphe 11.!:
    Référence à l'essai de mise à la terre de protection ajoutée<br />\r\nParagraphe
    13.1: Ajout d'un organigramme explicatif<br />\r\nParagraphe 13.2.2: Clarification
    ajoutée en ce qui concerne les moteurs avec variateur de vitesse intégré<br />\r\nParagraphe
    13.3: Clarification des exigences après consultation de l'ACEC<br />\r\nParagraphe
    13.5:Clarification des exigences après consultation de l'ACEC<br />\r\nParagraphe
    14: Note sur la sécurité convertie en texte normal"
