abstract:
- language: en
  script: Latn
  content: |-
    IEC TS 62607-3-5:2026, which is a Technical Specification, establishes a standardized method to determine the optical key control characteristic<br/>
    • light conversion efficiency<br/>
    for quantum dot enabled light conversion films (Q-LCFs) by<br/>
    • luminance meter.<br/>
    The light conversion efficiency is derived by the photoluminescence spectrum.<br/>
    The typical application areas of this standardized measurement method are the nano-photoelectric display devices using Q-LCF as key component, and other relevant optical conversion devices.<br/>
