abstract:
- language: en
  script: Latn
  content: |-
    IEC 60335-2-45:2024 deals with the safety of portable electric heating tools and similar appliances, their rated voltage being not more than 250 V including direct current (DC) supplied appliances and battery-operated appliances.<br/>
    Appliances not intended for normal household use, but which nevertheless can be a source of danger to the public, such as appliances intended to be used by laypersons in shops, in light industry and on farms, are within the scope of this standard. Appliances that can also be used when mounted on a support are within the scope of this standard.<br/>
    Examples of appliances that are within the scope of this standard are<br/>
    – branding tools;<br/>
    – burning-in pens;<br/>
    – conduit-soldering tools;<br/>
    – dehorning tools;<br/>
    – desoldering irons;<br/>
    – firelighters;<br/>
    – glue guns;<br/>
    – heat guns;<br/>
    – household film-welding appliances;<br/>
    – paint strippers;<br/>
    – plastic-cutting tools;<br/>
    – soldering guns;<br/>
    – soldering irons;<br/>
    – stripping pliers;<br/>
    – thermoplastic conduit-welding tools.<br/>
    As far as is practicable, this standard deals with the common hazards presented by appliances which are encountered by all persons in and around the home. However, in general, it does not in general take into account<br/>
    – persons (including children) whose physical, sensory or mental capabilities; or lack of experience and knowledge prevents them from using the appliance safely without supervision or instruction;<br/>
    – children playing with the appliance.<br/>
    Attention is drawn to the fact that<br/>
    – for appliances intended to be used in vehicles or on board ships or aircraft, additional requirements can be necessary;<br/>
    – in many countries additional requirements are specified by the national health authorities, the national authorities responsible for the protection of labour and similar authorities.<br/>
    This standard does not apply to<br/>
    – hand-held motor-operated electric tools (IEC 60745 series, IEC 62841 series);<br/>
    – transportable motor-operated electric tools (IEC 61029 series, IEC 62841 series);<br/>
    – appliances intended exclusively for industrial purposes;<br/>
    – appliances intended to be used in locations where special conditions prevail, such as the presence of a corrosive or explosive atmosphere (dust, vapour or gas);<br/>
    – tools using high-frequency heating other than induction soldering irons;<br/>
    – arc-welding equipment.<br/>
    This fourth edition cancels and replaces the third edition published in 2002, Amendment 1:2008 and Amendment 2:2011. This edition constitutes a technical revision.<br/>
    This edition includes the following significant technical changes with respect to the previous edition:<br/>
    a) alignment with IEC 60335-1:2020;<br/>
    b) deletion or conversion of some notes to normative text (Clause 1, 5.2, 15.101, 22.105, 25.7);<br/>
    c) introduction of external accessible surfaces temperature limits, including addition of functional surface and hot surface requirements (3.6.101, 7.1, 7.6, 7.12, 7.14, 7.15, 11.3, 11.8);<br/>
    This part 2 is to be used in conjunction with the latest edition of IEC 60335-1 and its amendments unless that edition precludes it; in that case, the latest edition that does not preclude it is used. It was established on the basis of the sixth edition (2020) of that standard.
- language: fr
  script: Latn
  content: |-
    L'IEC 60335-2-45:2024 traite de la sécurité des outils électriques chauffants mobiles et appareils analogues dont la tension assignée est inférieure ou égale à 250 V, y compris les appareils alimentés en courant continu et les appareils alimentés par batteries. Les appareils non destinés à un usage domestique normal, mais qui peuvent néanmoins constituer une source de danger pour le public, tels que les appareils destinés à être utilisés par des usagers non avertis dans des magasins, chez des artisans et dans des fermes, sont compris dans le domaine d'application de la présente norme. Les appareils qui peuvent également être utilisés lorsqu’ils sont montés sur un support sont compris dans le domaine d'application de la présente norme.<br/>
    La liste suivante répertorie les exemples d'appareils qui relèvent du domaine d'application de la présente norme<br/>
    – Les fers à marquer.<br/>
    – Les pyrograveurs.<br/>
    – Les outils à souder les conduits.<br/>
    – Les appareils à décorner les animaux.<br/>
    – Les fers à dessouder.<br/>
    – Les appareils à allumer le feu.<br/>
    – Les pistolets à colle.<br/>
    – Les pistolets à air chaud.<br/>
    – Les appareils à souder les films à usage domestique.<br/>
    – Les appareils de décapage de la peinture.<br/>
    – Les outils à couper le plastique.<br/>
    – Les fers instantanés.<br/>
    – Les fers à souder.<br/>
    – Les pinces à dénuder.<br/>
    – Les outils à souder les conduits thermoplastiques.<br/>
    Dans la mesure du possible, la présente norme traite des dangers courants présentés par les appareils, encourus par tous les individus à l'intérieur et autour de l'habitation. Cependant, elle ne tient en général pas compte<br/>
    – Des personnes (y compris des enfants) dont les capacités physiques, sensorielles ou mentales ou le manque d'expérience et de connaissance les empêchent d'utiliser l'appareil en toute sécurité sans surveillance ou instruction.<br/>
    – De l’utilisation de l’appareil comme jouet par des enfants.<br/>
    L'attention est attirée sur le fait que<br/>
    – Pour les appareils destinés à être utilisés dans des véhicules ou à bord de navires ou d'avions, des exigences supplémentaires peuvent être nécessaires.<br/>
    – Dans de nombreux pays, des exigences supplémentaires sont spécifiées par les organismes nationaux de la santé, par les organismes nationaux responsables de la protection des travailleurs et par des organismes analogues.<br/>
    La présente norme ne s'applique pas:<br/>
    – Aux outils électroportatifs à moteur (série IEC 60745, série IEC 62841).<br/>
    – Aux machines-outils électriques semi-fixes (série IEC 61029, série IEC 62841).<br/>
    – Aux appareils prévus exclusivement pour des usages industriels.<br/>
    – Aux appareils destinés à être utilisés dans des locaux qui présentent des conditions particulières, telles que la présence d’une atmosphère corrosive ou explosive (poussière, vapeur ou gaz).<br/>
    – Aux outils qui utilisent du chauffage haute fréquence autres que les fers à souder à induction.<br/>
    – Aux matériels de soudage à l'arc.<br/>
    Cette quatrième édition annule et remplace la troisième édition parue en 2002, l’Amendement 1:2008 et l’Amendement 2:2011. Cette édition constitue une révision technique.<br/>
    Cette édition inclut les modifications techniques majeures suivantes par rapport à l'édition précédente:<br/>
    a) texte aligné sur l'IEC 60335-1:2020;<br/>
    b) suppression ou transformation de certaines notes en texte normatif (Article 1 et paragraphes 5.2, 15.101, 22.105, 25.7);<br/>
    c) des limites de température ont été introduites pour les surfaces accessibles extérieures, notamment par l'ajout d'exigences pour les surfaces fonctionnelles et les surfaces chaudes (3.6.101, 7.1, 7.6, 7.12, 7.14, 7.15, 11.3, 11.8).<br/>
    La présente partie 2 doit être utilisée conjointement avec la dernière édition de l'IEC 60335-1 et ses amendements sauf si cette édition l'exclut; dans ce cas, la dernière édition qui n'exclut pas la présente partie 2 est utilisée. Elle a été établie sur la base de la sixième édition (2020) de cette norme.
