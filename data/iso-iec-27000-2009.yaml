abstract:
- language: en
  script: Latn
  content: "<p>ISO/IEC 27000:2009 provides an overview of information security management
    systems, which form the subject of the information security management system
    (ISMS) family of standards, and defines related terms. As a result of implementing
    ISO/IEC 27000:2009, all types of organization (e.g. commercial enterprises, government
    agencies and non-profit organizations) are expected to obtain: </p>\n\nan overview
    of the ISMS family of standards; \nan introduction to information security management
    systems (ISMS); \na brief description of the Plan-Do-Check-Act (PDCA) process;
    and \nan understanding of terms and definitions in use throughout the ISMS family
    of standards. \n\n<p>The objectives of ISO/IEC 27000:2009 are to provide terms
    and definitions, and an introduction to the ISMS family of standards that: </p>\n\ndefine
    requirements for an ISMS and for those certifying such systems; \nprovide direct
    support, detailed guidance and/or interpretation for the overall Plan-Do-Check-Act
    (PDCA) processes and requirements; \naddress sector-specific guidelines for ISMS;
    and \naddress conformity assessment for ISMS. \n"
- language: fr
  script: Latn
  content: |
    <p>L'ISO/CEI 27000:2009 fournit une vue d'ensemble des systèmes de management de la sécurité de l'information (SMSI); cette vue d'ensemble constitue l'objet de la famille des normes SMSI et définit les termes qui s'y rattachent. Suite à la mise en oeuvre de l'ISO/CEI 27000:2009, tous les types d'organismes (par exemple entreprises commerciales, organismes publics et organismes à but non lucratif) sont censés obtenir</p>

    une vue d'ensemble de la famille des normes SMSI,
    une introduction aux SMSI,
    une brève description du processus Planifier-Déployer-Contrôler-Agir (PDCA), et
    les termes et définitions utilisés dans la famille des normes SMSI.

    <p>Les objectifs de l'ISO/CEI 27000:2009 sont la fourniture de termes et définitions, et une introduction à la famille des normes SMSI qui</p>

    définissent les exigences pour un SMSI et pour les organismes certifiant de tels systèmes,
    apportent un soutien direct, des recommandations détaillées et/ou une interprétation des processus et des exigences générales selon le modèle Planifier-Déployer-Contrôler-Agir (PDCA),
    traitent des lignes directrices propres à des secteurs particuliers en matière de SMSI, et
    traitent de l'évaluation de la conformité d'un SMSI.
