abstract:
- language: en
  script: Latn
  content: |-
    IEC 60793-1-44:2023 establishes uniform requirements for measuring the cut-off wavelength of single-mode optical fibre, thereby assisting in the inspection of fibres and cables for commercial purposes. This document gives methods for measuring the cut-off wavelength for uncabled or cabled single mode telecom fibre. These procedures apply to all category B and C fibre types. There are three methods of deployment for measuring the cut-off wavelength:<br/>
    - method A: cable cut-off using uncabled fibre 22 m long sample, lcc;<br/>
    - method B: cable cut-off using cabled fibre 22 m long sample, lcc;<br/>
    - method C: fibre cut-off using uncabled fibre 2 m long sample, lc.<br/>
    All methods require a reference measurement. There are two reference-scan techniques, either or both of which can be used with all methods:<br/>
    - bend-reference technique;<br/>
    - multimode-reference technique using category A1(OM1-OM5) multimode fibre.<br/>
    This third edition cancels and replaces the second edition published in 2011. This edition constitutes a technical revision. This edition includes the following significant technical changes with respect to the previous edition:<br/>
    a) used the diameter of the fibre loops to describe deployment;<br/>
    b) added Annex D related to cut-off curve artifacts;<br/>
    c) reorganized information and added more figures to clarify concepts.
- language: fr
  script: Latn
  content: |-
    IEC 60793-1-44: 2023 établit des exigences uniformes pour mesurer la longueur d’onde de coupure des fibres optiques unimodales, contribuant ainsi au contrôle des fibres et câbles dans des relations commerciales. Le présent document donne des méthodes de mesure de la longueur d’onde de coupure pour les fibres de télécommunications unimodales câblées ou non câblées. Ces procédures s’appliquent à tous les types de fibres de catégories B et C (voir Références normatives). Il existe trois méthodes de déploiement pour mesurer la longueur d’onde de coupure.<br/>
    - méthode A: coupure en câble utilisant un échantillon de fibre non câblée de longueur 22 m, lcc;<br/>
    - méthode B: coupure en câble utilisant un échantillon de fibre câblée de longueur 22 m, lcc;<br/>
    - méthode C: coupure de fibre utilisant un échantillon de fibre non câblée de longueur 2 m, lc.<br/>
    Toutes les méthodes exigent une mesure de référence. Il existe deux techniques d’exploration de référence, l’une et/ou l’autre peuvent être utilisées avec toutes les méthodes:<br/>
    - technique de la fibre de référence par courbure;<br/>
    - technique de la fibre de référence multimodale utilisant la fibre multimodale de catégorie A1 (OM1-OM5).<br/>
    Cette troisième édition annule et remplace la deuxième édition parue en 2011. Cette édition constitue une révision technique. Cette édition inclut les modifications techniques majeures suivantes par rapport à l'édition précédente:<br/>
    a) utilisation du diamètre des boucles de fibres pour décrire le déploiement<br/>
    b) ajout de l’Annexe D, relative aux artefacts de courbe de coupure<br/>
    c) réorganisation des informations et ajout de figures supplémentaires pour clarifier les concepts.
