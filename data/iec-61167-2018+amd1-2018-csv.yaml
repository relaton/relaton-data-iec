abstract:
- language: en
  script: Latn
  content: |-
    IEC 61167:2018+A1:2018 specifies the performance requirements for metal halide lamps for general lighting purposes.<br/>
    This fourth edition cancels and replaces the third edition published in 2015. This edition constitutes a technical revision.<br/>
    This edition includes the following significant technical changes with respect to the previous edition.<br/>
    a) A set of new lamp data sheets has been introduced for lamp types designed for replacing high pressure sodium lamps.<br/>
    b) A set of new lamp data sheets has been introduced for 4 200 K versions of 3 000 K lamp types already in the standard.<br/>
    c) A set of new lamp data sheets has been introduced for new lamp types where high frequency ignition data is important.<br/>
    d) Annex G has been revised to incorporate high frequency ignition. As a consequence of this change, all data sheets in the standard have been revised to a new format.<br/>
    e) A new informative Annex K has been introduced, giving recommended methods of making lamp temperature measurements.<br/>
    The contents of the corrigendum of April 2019 have been included in this copy.<br/>
    This consolidated version consists of the fourth edition (2018) and its amendment 1 (2018). Therefore, no need to order amendment in addition to this publication.
- language: fr
  script: Latn
  content: |-
    L'IEC 61167:2018+A1:2018 spécifie les exigences de performances applicables aux lampes aux halogénures métalliques pour les applications d'éclairage générales.<br/>
    Cette quatrième édition annule et remplace la troisième édition parue en 2015. Cette édition constitue une révision technique.<br/>
    Cette édition inclut les modifications techniques majeures suivantes par rapport à l'édition précédente.<br/>
    a) Un ensemble de nouvelles fiches techniques sur les lampes a été introduit pour les types de lampes conçus pour remplacer les lampes à vapeur de sodium à haute pression.<br/>
    b) Un ensemble de nouvelles fiches techniques sur les lampes a été introduit pour les versions 4 200 K des types de lampes à 3 000 K déjà présents dans la norme.<br/>
    c) Un ensemble de nouvelles fiches techniques sur les lampes a été introduit pour les nouveaux types de lampes pour lesquels les données d'amorçage à haute fréquence sont importantes.<br/>
    d) L'Annexe G a été révisée pour intégrer l'amorçage à haute fréquence. A la suite de cette modification, toutes les fiches techniques de la norme ont été révisées et ont reçu un nouveau format.<br/>
    e) Une nouvelle annexe informative, l'Annexe K, a été introduite pour indiquer des méthodes recommandées de mesurage de la température des lampes.<br/>
    Le contenu du corrigendum d'avril 2019 a été pris en considération dans cet exemplaire.<br/>
    Cette version consolidée comprend la quatrième édition (2018) et son amendement 1 (2018). Il n'est donc pas nécessaire de commander l'amendement avec cette publication.
