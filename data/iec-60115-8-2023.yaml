abstract:
- language: en
  script: Latn
  content: |-
    IEC 60115-8:2023 is applicable to fixed surface mount resistors for use in electronic equipment. These resistors are typically described according to types (different geometric shapes) and styles (different dimensions) and product technology. These resistors have metallized terminations and are primarily intended to be mounted directly onto a circuit board.<br/>
    The object of this document is to specify preferred ratings and characteristics and to select from IEC 60115-1, the appropriate quality assessment procedures, tests and measuring methods and to give general performance requirements for this type of resistor.<br/>
    This edition includes the following significant technical changes with respect to the previous edition:<br/>
    a) definitions of product technologies and product classification levels of the generic specification, IEC 60115-1:2020, have been adopted;<br/>
    b) new style of transverse (RT) resistors has been added in 3.1.5 and 4.2.2 to cover resistors with wide terminals, which have become common in market;<br/>
    c) recommended test boards in 5.2.2 have been revised to fit the demands from the market for higher rated dissipation in resistors;<br/>
    d) test boards have been revised so that they can be set vertically instead of horizontally during specified tests to optimize the temperature rise stability, area and spacing inside the test chamber;<br/>
    e) 'Periodic-pulse high-voltage overload test' of IEC 60115‑1:2020, 8.3 has been added to the default test method in 5.3.8, however, the legacy test 'periodic-pulse overload test' of IEC 60115‑1:2020, 8.4 is still maintained for historical products;<br/>
    and more. Please see the foreword for the list of changes.
- language: fr
  script: Latn
  content: |-
    L’IEC 60115-8:2023 s’applique aux résistances fixes pour montage en surface utilisées dans les équipements électroniques.<br/>
    Ces résistances sont généralement décrites selon des types (différentes formes géométriques), des modèles (différentes dimensions) et des technologies de produits. Ces résistances comportent des sorties métalliques et sont conçues principalement pour être montées directement sur un circuit imprimé.<br/>
    Le présent document a pour objet de spécifier les caractéristiques assignées et les caractéristiques préférentielles, de choisir dans l’IEC 60115-1 les procédures d’assurance de la qualité et les méthodes d’essai et de mesure appropriées, et de fixer les exigences de performance générales pour ce type de résistance.<br/>
    Cette édition inclut les modifications techniques majeures suivantes par rapport à l’édition précédente:<br/>
    a) adoption des définitions des technologies de produits et des niveaux de classification des produits de la spécification générique, IEC 60115-1:2020;<br/>
    b) ajout d’un nouveau modèle de résistances transversales (RT) en 3.1.5 et 4.2.2 afin de couvrir les résistances à larges sorties qui sont devenues courantes sur le marché;<br/>
    c) révision des cartes d’essai recommandées en 5.2.2 pour répondre aux demandes du marché d’une dissipation assignée supérieure dans les résistances;<br/>
    d) révision des cartes d’essai pour pouvoir les placer à la verticale et non pas à l’horizontale pendant les essais spécifiés dans le but d’optimiser la stabilité de l’augmentation de température, la surface et l’espacement à l’intérieur de la chambre d’essai;<br/>
    e) ajout de "l’essai de surcharge haute tension à impulsions périodiques" de l’IEC 60115‑1:2020, 8.3 à la méthode d’essai par défaut en 5.3.8, toutefois l’ancienne méthode d’essai, "essai de surcharge à impulsions périodiques" de l’IEC 60115‑1:2020, 8.4, est maintenue pour les produits historiques;<br/>
    et plus. Veuillez consulter l'avant-propos pour la liste des modifications.
