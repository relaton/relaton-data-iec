abstract:
- language: en
  script: Latn
  content: "CORRECTED VERSION 2026-03<br />\r\n<br />\r\nIEC 63563-6:2025 defines
    the messaging between a Power Transmitter and a Power Receiver. The primary purpose
    of this messaging is to set up and control the power transfer. As a secondary
    purpose, it provides a transport mechanism for higher-level applications such
    as Authentication. The communications protocol comprises both the required order
    and timing relations of successive messages.<br />\r\n<br />\r\nThis corrected
    version of IEC 63563-6:2025 incorporates the following correction:<br />\r\n-
    correction of the publication date on the cover page."
- language: fr
  script: Latn
  content: "VERSION CORRIGEE 2026-03<br />\r\n<br />\r\nIEC 63563-6:2025 définit la
    messagerie entre un émetteur de puissance et un récepteur de puissance. L'objectif
    principal de cette messagerie est de mettre en place et de contrôler le transfert
    de puissance. En tant qu'objectif secondaire, il fournit un mécanisme de transport
    pour des applications de niveau supérieur telles que l'authentification. Le protocole
    de communication comprend à la fois l'ordre requis et les relations temporelles
    des messages successifs.<br />\r\n<br />\r\nCette version corrigée de l’IEC 63563-6:2025
    contient la correction suivante:<br />\r\n- correction de la date de publication
    sur la page de couverture."
