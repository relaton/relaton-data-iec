abstract:
- language: en
  script: Latn
  content: |-
    IEC 60079-29-0:2025 specifies general requirements, test methods and acceptance criteria that apply to flammable, oxygen and toxic gas detection equipment intended to detect gases and vapours and to provide an indication, alarm or other output function for personnel or property protection in industrial and commercial applications.<br/>
    This document applies to the following gas detection equipment:<br/>
    – Gas detection equipment Type "FL" intended for the detection of flammable gases:<br/>
    • Type FL-Group I, in mines susceptible to firedamp;<br/>
    • Type FL-Group II, in locations other than mines susceptible to firedamp; and<br/>
    • Type FL-OP, open path gas detection equipment for flammable gases.<br/>
    – Gas detection equipment Type "O2" intended for the detection of Oxygen:<br/>
    • Type O2-DE, detection of oxygen deficiency or oxygen enrichment; and<br/>
    • Type O2-IN, inertisation as measuring function for explosion protection.<br/>
    – Gas detection equipment Type "TX" intended for the detection of toxic gases:<br/>
    • Type TX-SM, detection in areas for safety monitoring applications and typically using alarm signalling;<br/>
    • Type TX-HM, occupational exposure measurement in the region of occupational exposure limit values; and<br/>
    • Type TX-OP, open path gas detection equipment for toxic gases.<br/>
    This document is not applicable to equipment:<br/>
    – used for medical applications;<br/>
    – used only in laboratories for analysis or measurement;<br/>
    – used only for process monitoring or control purposes (such as a gas analyser);<br/>
    – used in the domestic environment;<br/>
    – used in environmental air pollution monitoring;<br/>
    – used for flue gas analysis;<br/>
    – used for sampling systems external to the gas detection equipment;<br/>
    – with samplers and concentrators such as sorbents or paper tape having an irreversible indication;<br/>
    – consisting of a passive optical receiver without a dedicated optical source;<br/>
    – equipment within the scope of IEC 60335-2-40 and IEC 60335-2-89.<br/>
    This first edition of IEC 60079-29-0 cancels and replaces the second edition of 60079-29-1 published in 2016 and its Amendment 1:2020, and the first edition of IEC 60079-29-4 published in 2009. In addition, IEC 60079-29-0 Type TX-SM cancels and replaces Type SM of the first edition of IEC 62990-1.
- language: fr
  script: Latn
  content: |-
    IEC 60079-29-0:2025 spécifie les exigences générales, les méthodes d’essai et les critères d’acceptation qui s’appliquent aux appareils de détection de gaz inflammables, d’oxygène et de gaz toxiques destinés à détecter des gaz et des vapeurs et à fournir une indication, une alarme ou une autre fonction de sortie pour assurer la protection du personnel ou des biens dans les applications industrielles et commerciales.<br/>
    Le présent document s’applique aux appareils de détection de gaz suivants:<br/>
    – type "FL": appareil destiné à la détection des gaz inflammables:<br/>
    • type FL du groupe I, dans les mines grisouteuses;<br/>
    • type FL du groupe II, dans les lieux autres que les mines grisouteuses; et<br/>
    • type FL-OP: appareil de détection de gaz à chemin ouvert pour les gaz inflammables;<br/>
    – type "O2": appareil destiné à la détection de l’oxygène:<br/>
    • type O2-DE, détection de l’appauvrissement ou de l’enrichissement en oxygène; et<br/>
    • type O2-IN, inertage comme fonction de mesure pour la protection contre l’explosion;<br/>
    – type "TX": appareil destiné à la détection des gaz toxiques:<br/>
    • type TX-SM, détection dans les zones d’applications de surveillance de la sécurité et utilisant généralement des signaux d’alarme;<br/>
    • type TX-HM, mesurage de l’exposition professionnelle dans la région des valeurs limites d’exposition professionnelle; et<br/>
    • type TX-OP: appareil de détection de gaz à chemin ouvert pour les gaz toxiques.<br/>
    Le présent document ne s’applique pas aux appareils:<br/>
    – utilisés pour les applications médicales;<br/>
    – uniquement utilisés pour les analyses ou le mesurage en laboratoire;<br/>
    – uniquement utilisés à des fins de surveillance ou de contrôle des processus (tel qu’un analyseur de gaz);<br/>
    – utilisés dans l’environnement domestique;<br/>
    – utilisés pour surveiller la pollution de l’air environnemental;<br/>
    – utilisés pour l’analyse des effluents gazeux;<br/>
    – utilisés pour les systèmes d’échantillonnage externes à l’appareil de détection de gaz;<br/>
    – équipés d’échantillonneurs et de concentrateurs tels que des sorbants ou une bande de papier portant une indication irréversible;<br/>
    – constitués d’un récepteur optique passif sans source optique spécifique;<br/>
    – entrant dans le domaine d’application de l’IEC 60335-2-40 et de l’IEC 60335-2-89<br/>
    Cette première édition de l’IEC 60079-29-0 annule et remplace la seconde édition de l’IEC 60079-29-1 parue en 2016 et son Amendement 1:2020, ainsi que la première édition de l’IEC 60079-29-4 parue en 2009. De plus, le type TX-SM de l’IEC 60079-29-0 annule et remplace le type SM de la première édition de l’IEC 62990-1; cependant, le type TX-HM restera dans le norme.
