abstract:
- language: en
  script: Latn
  content: |-
    IEC 62271-201:2026 EXV contains both the international standard and its extended version (EXV). This extended version of the official IEC Standard is available in English only and provides the user with a comprehensive content of the Standard. IEC 62271-201:2026 EXV includes the content of the references made to IEC 62271-1:2017+AMD1:2021.<br/>
    <br/>
    IEC 62271-201:2026 is applicable to prefabricated solid-insulation enclosed switchgear and controlgear assemblies designed for:<br/>
    – alternating current;<br/>
    – rated voltages above 1 kV and up to and including 52 kV;<br/>
    – service frequencies up to and including 60 Hz;<br/>
    – indoor installation;<br/>
    – areas limited to authorized personnel.<br/>
    The assembly can include either air-insulated or fluid-filled compartments, or both.<br/>
    For components installed in a solid-insulation enclosed switchgear and controlgear, this document supplements or even replaces in some cases, the requirements as stated by the individual product standards. The list of components which can be inside the solid-insulation enclosed switchgear and controlgear is not limited to the ones explicitly cited in this document. This third edition cancels and replaces the second edition published in 2014. This edition constitutes a technical revision.<br/>
    This edition includes the following significant technical changes with respect to the previous edition:<br/>
    a) aligned with the third edition of IEC 62271-200 published in 2021 and its Amendment 1 published in 2024, for structure, definitions, classifications, ratings and testing procedures, where appropriate;<br/>
    b) clause numbering aligned with IEC 62271-1:2017, including the adoption of the subclause names of Clause 3;<br/>
    c) in Clause 3 specific terms and definitions are added for "in service", "normal operating condition" and "normal use";<br/>
    d) earthing circuit is more precisely described, including ratings and test requirements;<br/>
    e) number of mechanical tests on interlocks is reduced for type testing;<br/>
    f) forces to apply during type testing are better prescribed (refer to 7.102);<br/>
    g) resistance measuring on main circuit is only needed before continuous current tests (as reference for routine tests) and not anymore needed after this continuous current test. Rationale for this deletion is that this measured resistance does not mean anything; as the temperature rise test was just finished, a new temperature rise test will not give new information;<br/>
    h) IEC 62271-100:2021 has been taken into account in 7.101.2;<br/>
    i) IEC 62271-107:2019 and IEC IEEE 62271-37-013:2021 are also considered in 7.101.2;<br/>
    j) LSC category is more precisely described, including an explaining flowchart (Annex G);<br/>
    k) examples not covered by the IAC test are transferred from Clause 6 to 9.103;<br/>
    l) the term "assembly" is defined in Clause 3 and used as synonym for "solid-insulation enclosed switchgear and controlgear" in this document;<br/>
    m) "metallic" is replaced by "metal" where applicable;<br/>
    n) a 1 s rule was introduced for Criterion 4 during IAC tests regarding hot gases versus glowing particles as cause of ignition;<br/>
    o) internal arc tests for switchgear with protrusions are more precisely described in Annex A;<br/>
    p) partitions accessible in normal use are now PA, PB1 or PB2 instead of PI which has been removed (refer to 6.103.3)
