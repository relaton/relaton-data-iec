abstract:
- language: en
  script: Latn
  content: |-
    IEC 60364-7-718:2011 provides additional requirements for electrical installations applicable to communal facilities and workplaces. Typical examples of communal facilities and workplaces are:<br/>
    - assembly halls,<br/>
    - assembly rooms,<br/>
    - exhibition halls,<br/>
    - theatres,<br/>
    - cinemas,<br/>
    - sport arenas,<br/>
    - sales areas,<br/>
    - restaurants,<br/>
    - hotels,<br/>
    - guest houses,<br/>
    - residential care homes,<br/>
    - schools,<br/>
    - enclosed car parks,<br/>
    - meeting places,<br/>
    - swimming halls,<br/>
    - airports,<br/>
    - railway stations,<br/>
    - high-rise buildings,<br/>
    - workshops,<br/>
    - factories and<br/>
    - industrial plants.<br/>
    Access routes and escape routes are part of the above-mentioned examples. The necessity of providing safety services in special buildings and areas may be governed by national regulations which may contain more stringent requirements.
- language: fr
  script: Latn
  content: |-
    La CEI 60364-7-718:2011 donne des exigences supplémentaires pour les installations électriques applicables aux établissements recevant du public et aux lieux de travail. Des exemples types d'établissements recevant du public et de lieux de travail sont:<br/>
    - salles de conférences,<br/>
    - salles de réunion,<br/>
    - halls d'exposition,<br/>
    - théâtres,<br/>
    - cinémas,<br/>
    - stades,<br/>
    - magasins,<br/>
    - restaurants,<br/>
    - hôtels,<br/>
    - hôtel de petite taille,<br/>
    - établissements d'hébergement collectif,<br/>
    - établissements scolaires,<br/>
    - parcs de stationnement couverts,<br/>
    - palais des congrès,<br/>
    - centres nautiques,<br/>
    - aéroports,<br/>
    - gares ferroviaires,<br/>
    - immeubles de grande hauteur,<br/>
    - ateliers,<br/>
    - usines et<br/>
    - établissements industriels.<br/>
    Les voies d'accès et les voies d'évacuation font partie intégrante des exemples donnés ci-dessus. La nécessité d'assurer des services de sécurité dans des bâtiments et des zones de type particulier peut être stipulée dans des réglementations nationales qui peuvent prévoir des exigences plus sévères.
