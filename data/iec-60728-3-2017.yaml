abstract:
- language: en
  script: Latn
  content: |-
    IEC 60728-3:2017 specifies the measuring methods, performance requirements and data publication requirements for active wideband equipment of cable networks for television signals, sound signals and interactive services. This fifth edition cancels and replaces the fourth edition published in 2010. This edition constitutes a technical revision. This edition includes the following significant technical changes with respect to the previous edition:<br/>
    a) extension of upper frequency range limit for cable network equipment in the forward path from 1000 MHz to 1218 MHz (optional up to 1794 MHz);<br/>
    b) extension of upper frequency range limit for cable network equipment in the return path from 85 MHz to 204 MHz;<br/>
    c) integration and update of IEC 60728-3-1 content;<br/>
    d) integration and update of the Technical Specification CLC/TS 50083-3-3 content;<br/>
    e) deletion of specifications and test methods for obsolete analogue parameters;<br/>
    f) additional normative references;<br/>
    g) additional terms and definitions and abbreviations.
- language: fr
  script: Latn
  content: |-
    L'IEC 60728-3:2017 spécifie les méthodes de mesurage, les exigences de performance et les exigences de publication des données caractéristiques des matériels actifs à large bande des réseaux de distribution par câbles pour signaux de télévision, signaux de radiodiffusion sonore et services interactifs.<br/>
    Le présent document<br/>
    • s'applique à tous les amplificateurs utilisés dans les réseaux de distribution par câbles;<br/>
    • couvre la plage de fréquences de 5 MHz à 3 000 MHz;<br/>
    • s'applique aux matériels unidirectionnels et bidirectionnels;<br/>
    • spécifie les méthodes de mesurage de base des caractéristiques fonctionnelles du matériel actif qui permettent d'évaluer la performance de ces matériels;<br/>
    • identifie les spécifications de performance qui doivent être publiées par les fabricants;<br/>
    • définit les exigences de performance minimales pour certains paramètres.<br/>
    <br/>
    L'IEC 60728-3:2017 annule et remplace la quatrième édition parue en 2010. Cette édition constitue une révision technique.<br/>
    Cette édition inclut les modifications techniques majeures suivantes par rapport à l'édition précédente:<br/>
    a) extension de la limite supérieure de la plage de fréquences pour les matériels de réseaux de distribution par câbles dans la voie descendante de 1 000 MHz à 1 218 MHz (en option jusqu'à 1 794 MHz);<br/>
    b) extension de la limite supérieure de la plage de fréquences pour les matériels de réseaux de distribution par câbles dans la voie de retour de 85 MHz à 204 MHz;<br/>
    c) intégration et mise à jour du contenu de l'IEC 60728-3-1;<br/>
    d) intégration et mise à jour du contenu de la spécification technique CLC/TS 50083-3-3;<br/>
    e) suppression des spécifications et des méthodes d'essai pour les paramètres analogiques obsolètes;<br/>
    f) références normatives supplémentaires;<br/>
    g) termes, définitions et abréviations supplémentaires.
