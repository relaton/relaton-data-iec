abstract:
- language: en
  script: Latn
  content: |-
    IEC 61307:2026 specifies test methods for the determination of the efficiency of frequency conversion from the electrical input, and of the available and workload microwave output power in industrial microwave heating installations, as well as operational flexibility. This document is in principle applicable to industrial microwave heating equipment and installations in the frequency range from 300 MHz to 300 GHz but focused on the microwave ISM frequencies below 6 GHz. This document relates to industrial microwave heating equipment operating as intended by the manufacturer's specifications for normal operation. This document does not apply to appliances for household and similar use (covered by IEC 60335‑2‑25), commercial use (covered by IEC 60335-2-90 and IEC 60335‑2-110) or laboratory use (covered by IEC 61010-2-010). This fourth edition cancels and replaces the third edition published in 2011. This edition constitutes a technical revision.<br/>
    This edition includes the following significant technical changes with respect to the previous edition:<br/>
    a) it covers not only the standby and hibernation modes, but also start-up, standby and holding power consumption, as well as other aspects of operation flexibility;<br/>
    b) more detailed descriptions of the aspects of microwave power, and handling of the A and B types of equipment.
- language: fr
  script: Latn
  content: |-
    L'IEC 61307:2026 spécifie des méthodes d'essai pour la détermination du rendement de conversion de fréquence à partir de l'entrée électrique, et de la puissance de sortie hyperfréquence disponible et de la charge de travail dans les installations industrielles de chauffage à hyperfréquences, ainsi que de la flexibilité opérationnelle. Le présent document est en principe applicable aux équipements et installations industriels de chauffage par micro-ondes dans la gamme de fréquences de 300 MHz à 300 GHz, mais il est axé sur les fréquences ISM à micro-ondes inférieures à 6 GHz. Le présent document concerne les équipements industriels de chauffage par micro‑ondes fonctionnant comme prévu par les spécifications du fabricant pour un fonctionnement normal. Le présent document ne s'applique pas aux appareils à usage domestique et analogue (couverts par l'IEC 60335-2-25, usage commercial (couvert par l'IEC 60335-2-90 et l'IEC 60335-2-110) ou usage en laboratoire (couvert par l'IEC 61010-2-010). Cette quatrième édition annule et remplace la troisième édition parue en 2011.<br/>
    Cette édition inclut les modifications techniques significatives suivantes par rapport à l'édition précédente:<br/>
    a) elle couvre non seulement les modes veille et veille, mais également la consommation de puissance de démarrage, veille et maintien, ainsi que d'autres aspects de la flexibilité de fonctionnement;<br/>
    b) des descriptions plus détaillées des aspects de la puissance hyperfréquence et de la manipulation des types d'équipements A et B.
