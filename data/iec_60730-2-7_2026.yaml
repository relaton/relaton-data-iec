abstract:
- content: "IEC 60730-2-7:2026 applies to timers and time switches:<br />\r\n- for
    use in, on, or in association with equipment for household appliance and similar
    use;<br />\r\nNOTE 1 Throughout this document, the word \"equipment\" means \"appliance
    and equipment\" and \"controls\" means \"timer or time switches\".<br />\r\nNOTE
    2 Throughout this document, the word \"timers\" means timers and time switches,
    unless the type is specifically mentioned.<br />\r\n- for building automation
    within the scope of ISO 16484 series and IEC 63044 series (HBES/BACS);<br />\r\n-
    or equipment that is used by the public, such as equipment intended to be used
    in shops, offices, hospitals, farms and commercial and industrial applications;<br
    />\r\n- that are smart enabled controls;<br />\r\n- that are AC or DC powered
    controls with a rated voltage not exceeding 690 V AC or 600 V DC;<br />\r\n- utilized
    as part of a control system or controls which are mechanically integral with multifunctional
    controls having non-electrical outputs;<br />\r\n- as well as manual controls
    when such are electrically and/or mechanically integral with automatic controls.<br
    />\r\nNOTE 3 Requirements for manually actuated mechanical switches not forming
    part of an automatic control are contained in IEC 61058-1-1.<br />\r\nThis document
    applies to<br />\r\n- the inherent safety of timers and time switches, and<br
    />\r\n- functional safety of timers and time switches and safety related systems,<br
    />\r\n- timers and time switches where the performance (for example the effect
    of EMC phenomena) of the product can impair the overall safety and performance
    of the controlled system,<br />\r\n- the operating values, operating times, and
    operating sequences where such are associated with equipment safety,<br />\r\n-
    timers for appliances within the scope of IEC 60335 series.<br />\r\n- manual
    controls when such are electrically and/or mechanically integral with timers.<br
    />\r\nThis document specifies the requirements for construction, operation and
    testing of timers and time switches used in, on, or in association with an equipment.<br
    />\r\nThis document does not<br />\r\n- apply to time-delay switches (TDS) within
    the scope of IEC 60669-2-3;<br />\r\n- include devices which only indicate time
    or passage of time;<br />\r\n- apply to multi-functional controls having an integrated
    timing function which is not capable of being tested as a separate timing device.<br
    />\r\nThis fourth edition cancels and replaces the third edition published in
    2015. This edition constitutes a technical revision.<br />\r\nThis edition includes
    the following significant technical changes with respect to the previous edition:<br
    />\r\nadoption of IEC 60730-1:2022 (Ed.6.0) with all of its significant changes
    to IEC 60730 1:2010 (Ed.4).<br />\r\nThis part 2-7 is intended to be used in conjunction
    with IEC 60730-1. It was established on the basis of the sixth edition of that
    standard (2022). Consideration can be given to future editions of, or amendments
    to, IEC 60730 1.<br />\r\nThis part 2-7 supplements or modifies the corresponding
    clauses in IEC 60730-1, so as to convert that publication into the IEC standard:
    Particular requirements for timers and time switches.<br />\r\nWhere this part
    2-7 states \"addition\", \"modification\" or \"replacement\", the relevant requirement,
    test specification or explanatory matter in part 1 should be adapted accordingly.<br
    />\r\nWhere no change is necessary, part 2-7 indicates that the relevant clause
    or subclause applies"
