- content: "L'IEC 60730-2-7:2026 s'applique aux minuteries et aux minuteries cycliques:<br
    />\r\n- utilisées dans, sur ou avec des matériels pour appareils domestiques et
    à usage analogue;<br />\r\nNOTE 1 Dans le présent document, le terme \"matériel\"
    signifie \"appareil et matériel\" et le terme \"dispositifs de commande\" signifie
    \"minuteries ou minuteries cycliques\".<br />\r\nNOTE 2 Partout où il est utilisé
    dans le présent document, le terme \"minuteries\" signifie minuteries et minuteries
    cycliques, sauf si le type est clairement précisé.<br />\r\n- pour l'automatisation
    des bâtiments qui relèvent du domaine d'application de la série ISO 16484 et de
    la série IEC 63044 (HBES/BACS);<br />\r\n- pour des matériels utilisés par le
    public, tels que les matériels destinés à être utilisés dans des magasins, des
    bureaux, des hôpitaux, des fermes et des applications commerciales et industrielles;<br
    />\r\n- qui sont des dispositifs de commande activés intelligents;<br />\r\n-
    qui sont des dispositifs de commande à courant alternatif ou continu dont la tension
    assignée ne dépasse pas 690 V en courant alternatif ou 600 V en courant continu;<br
    />\r\n- qui sont utilisés dans le cadre d'un système de commande ou de dispositifs
    de commande qui sont mécaniquement intégrés à des dispositifs de commande multifonctions
    comportant des sorties non électriques;<br />\r\nainsi qu'aux dispositifs de commande
    manuels qui sont électriquement et/ou mécaniquement intégrés à des dispositifs
    de commande automatique.<br />\r\nNOTE 3 Les exigences relatives aux interrupteurs
    mécaniques à action manuelle qui ne font pas partie d'un dispositif de commande
    automatique sont contenues dans l'IEC 61058-1-1.<br />\r\nLe présent document
    s'applique<br />\r\n- à la sécurité intrinsèque des minuteries et des minuteries
    cycliques, et<br />\r\n- à la sécurité fonctionnelle des minuteries et des minuteries
    cycliques et aux systèmes de sécurité,<br />\r\n- aux minuteries et minuteries
    cycliques pour lesquelles les performances (par exemple, l'effet des phénomènes
    CEM) du produit peuvent compromettre la sécurité et les performances globales
    du système commandé,<br />\r\n- aux valeurs de fonctionnement, aux temps de fonctionnement
    et aux séquences de fonctionnement lorsque ces éléments interviennent dans la
    sécurité du matériel,<br />\r\n- aux minuteries destinées aux appareils relevant
    du domaine d'application de la série IEC 60335.<br />\r\n- aux dispositifs de
    commande manuels qui sont électriquement et/ou mécaniquement intégrés à des minuteries.<br
    />\r\nLe présent document spécifie les exigences relatives à la construction,
    au fonctionnement et aux essais des minuteries et minuteries cycliques utilisées
    dans, sur ou avec des matériels.<br />\r\nLe présent document<br />\r\n- ne s'applique
    pas aux interrupteurs temporisés (TDS, Time-Delay Switches) qui relèvent du domaine
    d'application de l'IEC 60669-2-3;<br />\r\n- ne couvre pas les appareils qui n'indiquent
    que le temps ou le temps écoulé;<br />\r\n- ne s'applique pas aux dispositifs
    de commande multifonctions dont la fonction de minuterie intégrée ne peut pas
    être soumise aux essais comme un dispositif de minuterie séparé.<br />\r\nCette
    quatrième édition annule et remplace la troisième édition parue en 2015. Cette
    édition constitue une révision technique.<br />\r\nCette édition inclut modifications
    techniques significatives suivantes par rapport à l'édition précédente:<br />\r\na)
    adoption de l'IEC 60730-1:2022 (Ed.6.0) avec toutes ses modifications significatives
    apportées à l'IEC 60730‑1:2010 (Ed.4).<br />\r\nLa présente partie 2-7 est destinée
    à être utilisée conjointement avec l'IEC 60730-1. Elle a été établie sur la base
    de la sixième édition de cette norme (2022). Les futures éditions de l'IEC 60730‑1
    ou de ses amendements pourront être pris en considération.<br />\r\nLa présente
    partie 2-7 complète ou modifie les articles correspondants de l'IEC 60730-1, de
    façon à transformer cette publication en norme IEC: Exigences particulières pour
    les minuteries et les minuteries cycliques.<br />\r\nLorsque la présente partie
    2-7 spécifie \"addition\", \"modification\" ou \"remplacement\", il convient d'adapter
    l'exigence, la modalité d'essai ou les commentaires correspondants de la Partie
    1 en conséquence.<br />\r\nLorsqu'aucune modification n'est nécessaire, la partie
    2-7 indique que l'article ou le paragraphe approprié s'applique."
