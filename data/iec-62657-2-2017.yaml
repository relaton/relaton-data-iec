abstract:
- language: en
  script: Latn
  content: |-
    IEC 62657-2:2017,<br/>
    - specifies the fundamental assumptions, concepts, parameters, and procedures for wireless communication coexistence;<br/>
    - specifies coexistence parameters and how they are used in an application requiring wireless coexistence;<br/>
    - provides guidelines, requirements, and best practices for wireless communication's availability and performance in an industrial automation plant; it covers the life‑cycle of wireless communication coexistence;<br/>
    - helps the work of all persons involved with the relevant responsibilities to cope with the critical aspects at each phase of life-cycle of the wireless communication coexistence management in an industrial automation plant. Life-cycle aspects include: planning, design, installation, implementation, operation, maintenance, administration and training;<br/>
    - provides a common point of reference for wireless communication coexistence for industrial automation sites as a homogeneous guideline to help the users assess and gauge their plant efforts;<br/>
    - deals with the operational aspects of wireless communication coexistence regarding both the static human/tool-organization and the dynamic network self-organization.<br/>
    This second edition cancels and replaces the first edition published in 2013. This edition constitutes a technical revision.<br/>
    This second edition includes the following significant technical changes with respect to the previous edition:<br/>
    a) update of the normative references, terms, definitions, symbols and abbreviations;<br/>
    b) addition of terms;<br/>
    c) checking of the life-cycle terms of this document versus the terms used in IEC 62890: and addition of explanations;<br/>
    d) addition and modification of text to make the text more readable;<br/>
    e) alignment of some definitions and specifications of coexistence parameters in order to facilitate their future inclusion in the IEC Common Data Dictionary (IEC CDD) maintained by the IEC.
- language: fr
  script: Latn
  content: |-
    L'IEC 62657-2:2017,<br/>
    - spécifie les hypothèses, concepts, paramètres et procédures de base permettant la coexistence de communications sans fil;<br/>
    - spécifie les paramètres de coexistence et la façon de les utiliser dans une application exigeant une coexistence de communications sans fil;<br/>
    - fournit les lignes directrices, exigences et meilleures pratiques en matière de disponibilité et de performance des communications sans fil, dans une installation d'automatisation industrielle. Il couvre le cycle de vie de la coexistence de communications sans fil;<br/>
    - facilite la tâche des personnes appelées à faire face aux aspects critiques à chaque phase du cycle de vie de la gestion de coexistence de communications sans fil dans une installation d'automatisation industrielle. Les aspects du cycle de vie incluent: la planification, la conception, l'installation, la mise en œuvre, le fonctionnement, la maintenance, l'administration et la formation;<br/>
    - fournit une référence commune sur la coexistence de communications sans fil pour des sites d'automatisation industrielle sous forme de recommandation homogène aidant les utilisateurs à évaluer et mesurer les efforts de leur installation;<br/>
    - aborde les aspects fonctionnels de la coexistence de communications sans fil concernant tant l'organisation statique homme-outil que l'auto-organisation dynamique du réseau.<br/>
    Cette deuxième édition annule et remplace la première édition parue en 2013. Cette édition constitue une révision technique.<br/>
    Cette deuxième édition inclut les modifications techniques suivantes par rapport à l'édition précédente:<br/>
    a) mise à jour des références normatives, termes, définitions, symboles et abréviations;<br/>
    b) ajout de termes;<br/>
    c) vérification des termes relatifs au cycle de vie par rapport aux termes utilisés dans l'IEC 62890 et ajout d'explications;<br/>
    d) ajout et modification du texte pour le rendre plus lisible;<br/>
    e) alignement de certaines définitions et spécifications des paramètres de coexistence afin de faciliter leur inclusion future dans le dictionnaire de données communes de l'IEC (IEC CDD) géré par l'IEC.
