abstract:
- content: "IEC 63458-2:2026 applies to hoses, hose lines and connectors intended
    to be used with high-pressure water jet units within the scope of IEC 63458-1.
    This document deals with all significant hazards, hazardous situations and events
    relevant to the equipment in the scope, when it is used as intended and under
    conditions of misuse which are reasonably foreseeable by the manufacturer. This
    document deals with safety requirements to minimize the significant hazards which
    can arise from assembling, operating and servicing of hoses, hose lines and connectors
    for use with high pressure water jet machines. The hazard due to scalding from
    hot liquid or from irritation / burning of any added chemicals is not covered
    in this document.<br />\r\nCompliance with IEC 63458-1, IEC 63458-2 and IEC 63458-3
    provides the full requirements for high pressure water jet machines."
  language:
  - en
  script:
  - Latn
  format: text/html
- content: "L'IEC 63458-2:2026 s'applique aux flexibles, tuyauteries flexibles et
    connecteurs destinés à être utilisés avec des unités à jet d'eau à haute pression
    qui relèvent du domaine d'application de l'IEC 63458-1.<br />\r\nLe présent document
    traite de l'ensemble des phénomènes dangereux significatifs, situations dangereuses
    et événements dangereux pertinents pour les équipements couverts par le domaine
    d'application, lorsque ceux-ci sont utilisés dans les conditions prévues et dans
    les conditions de mauvais usage raisonnablement prévisible établies par le fabricant.<br
    />\r\nLe présent document traite des exigences de sécurité qui visent à réduire
    le plus possible les phénomènes dangereux significatifs qui peuvent être impliqués
    par l'assemblage, le fonctionnement et l'entretien des flexibles, tuyauteries
    flexibles et connecteurs destinés à être utilisés avec des machines à jet d'eau
    à haute pression.<br />\r\nLe danger d'ébouillantage par un liquide chaud ou le
    danger d'irritation/brûlure par des produits chimiques ajoutés ne sont pas couverts
    par le présent document.<br />\r\nLa conformité à l'IEC 63458-1, à l'IEC 63458-2
    et à l'IEC 63458-3 fournit les exigences complètes pour les machines à jet d'eau
    à haute pression."
