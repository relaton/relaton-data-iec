abstract:
- language: en
  script: Latn
  content: |-
    IEC 61753-021-02:2023 defines the minimum initial test and measurement requirements and severities which single-mode fibre optic connectors terminated as a pigtail or a patchcord satisfy in order to be categorized as meeting the IEC standard category C (controlled environment), as defined in IEC 61753-1. If tests were performed on the connectors terminated as pigtails or patchcords for categories OP+HD, OP+, OP, OPHD, or CHD and the product passed, the product will be automatically qualified or categorized as meeting the IEC standard for category C. This first edition cancels and replaces the second edition of IEC 61753-021-2 published in 2007. This edition constitutes a technical revision. This edition includes the following significant technical changes with respect to IEC 61753-021-2:2007:<br/>
    a) changed scope to remove restrictions on attenuation and return loss grades;<br/>
    b) included provisions for rectangular ferrule connectors;<br/>
    c) changed the terms and definitions of the different types of test samples (pigtail test samples and patchcord test samples) used in the various tests to avoid confusion;<br/>
    d) updated fibre naming conventions according to IEC 60793-2-50 and added provisions for B-657 fibres;<br/>
    e) added all the attenuation and return loss grades defined in IEC 61753-1;<br/>
    f) test severities updated according to IEC 61753-1;<br/>
    g) reduced flexing of strain relief cycles from 100 cycles to 50 cycles;<br/>
    h) added the torsion test;<br/>
    i) reduced the duration of the fibre/cable retention test on reinforced cables from 120 s to 60 s minimum;<br/>
    j) removed the static side load test;<br/>
    k) reduced the number of mating durability cycles from 500 cycles to 200 cycles and added provisions for rectangular ferrule connectors;<br/>
    l) added Annex B for visual examination of the outer cable sheath movement of reinforced cables as an additional requirement for change of temperature, cable retention and flexing of the strain relief tests.
- language: fr
  script: Latn
  content: |-
    IEC 61753-021-02:2023 définit les exigences minimales initiales d’essai et de mesure, ainsi que les sévérités auxquelles les connecteurs à fibres optiques unimodales raccordés comme des fibres amorces ou des cordons de brassage satisfont afin d’être considérés comme satisfaisant aux critères de la catégorie C (environnement contrôlé) des normes IEC, telle que définie dans l’IEC 61753-1. Si des essais ont été réalisés sur les connecteurs raccordés comme des fibres amorces ou des cordons de brassage pour les catégories OP+HD, OP+, OP, OPHD ou CHD et que le produit a satisfait aux exigences, le produit est automatiquement qualifié ou classé comme satisfaisant à la norme IEC pour la catégorie C. Cette première édition annule et remplace la deuxième édition de l’IEC 61753-021-2 parue en 2007. Cette édition constitue une révision technique.<br/>
    Cette édition inclut les modifications techniques majeures suivantes par rapport à l’IEC 61753-021-2:2007:<br/>
    a) le domaine d’application a été modifié afin de lever les restrictions concernant les classes d’affaiblissement et d’affaiblissement de réflexion;<br/>
    b) des dispositions ont été ajoutées pour les connecteurs à férules rectangulaires;<br/>
    c) les termes et définitions des différents types d’échantillons d’essai (échantillon d’essai de fibre amorce et échantillon d’essai de cordon de brassage) utilisés dans les différents essais ont été changés afin d’éviter toute confusion;<br/>
    d) les conventions de désignation des fibres ont été mises à jour conformément à l’IEC 60793-2-50 et des dispositions ont été ajoutées pour les fibres B‑657;<br/>
    e) toutes les classes d’affaiblissement et d’affaiblissement de réflexion définies dans l’IEC 61753-1 ont été ajoutées;<br/>
    f) les sévérités d’essai ont été mises à jour conformément à l’IEC 61753-1;<br/>
    g) pour la flexion des cycles du serre-câble, la durée de l’essai a été réduite de 100 cycles à 50 cycles;<br/>
    h) l’essai de torsion a été ajouté;<br/>
    i) pour les câbles renforcés, la durée de l’essai de rétention de la fibre ou du câble a été réduite de 120 s à 60 s au minimum;<br/>
    j) l’essai de charge latérale statique a été supprimé;<br/>
    k) le nombre de cycles de durabilité de l’accouplement a été réduit de 500 à 200 et des dispositions ont été ajoutées pour les connecteurs à férules rectangulaires;<br/>
    l) l’Annexe B a été ajoutée pour l’examen visuel du mouvement de la gaine extérieure des câbles renforcés, en tant qu’exigence supplémentaire pour les essais de variations de température, de rétention de câble et de flexion du serre-câble.
