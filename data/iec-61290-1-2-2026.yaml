abstract:
- language: en
  script: Latn
  content: |-
    IEC 61290-1-2:2026 applies to all commercially available optical amplifiers (OAs) and optically amplified sub-systems. It applies to OAs using optically pumped fibres (OFAs based on either rare-earth doped fibres or on the Raman effect), semiconductors (SOAs), and planar optical waveguides (POWAs). This document does not apply to polarization-maintaining optical amplifiers. This document defines uniform requirements for accurate and reliable measurements, by means of the electrical spectrum analyzer test method, of the following OA parameters, as defined in IEC 61291-1, Clause 3:<br/>
    a) nominal output signal power;<br/>
    b) gain;<br/>
    c) reverse gain;<br/>
    d) maximum gain;<br/>
    e) polarization-dependent gain.<br/>
    In addition, this test method provides a means for measuring the following parameters:<br/>
    - maximum gain wavelength;<br/>
    - gain wavelength band.<br/>
    This document specifically covers single-channel amplifiers. For multichannel amplifiers, the IEC 61290-10 series applies.<br/>
    NOTE 1 The applicability of the test methods described in this document to distributed Raman amplifiers is for further study.<br/>
    NOTE 2 A test method for polarization-maintaining optical amplifiers is for further study.<br/>
    This third edition cancels and replaces the second edition published in 2005. This edition constitutes a technical revision. This edition includes the following significant technical changes with respect to the previous edition:<br/>
    a) addition of information on the applicability of this document to the scope;<br/>
    b) harmonization of the scope with the IEC 61290-1 series;<br/>
    c) addition of safety recommendations to Clause 4 and Clause 5;<br/>
    d) correction of an error in Clause 7, item e);<br/>
    e) replacement of the term "wavelength measurement accuracy" with "wavelength accuracy".
- language: fr
  script: Latn
  content: |-
    IEC 61290-1-2:2016 s'applique à tous les amplificateurs optiques (OA) disponibles dans le commerce et aux sous-systèmes amplifiés optiquement. Elle s'applique aux OA utilisant des fibres optiquement pompées (AFO basées soit sur des fibres dopées de terres rares, soit sur l'effet Raman), des semi-conducteurs (SOA) et des guides d'ondes optiques planaires (POWA). Le présent document ne s'applique pas aux amplificateurs optiques à maintien de polarisation.<br/>
    Le présent document définit des exigences uniformes pour des mesures précises et fiables, au moyen de la méthode d'essai de l'analyseur de spectre électrique, des paramètres OA suivants, tels que définis dans l'IEC 61291-1, Article 3:<br/>
    a) puissance nominale du signal de sortie;<br/>
    b) gain;<br/>
    c) le gain inverse;<br/>
    d) gain maximal;<br/>
    e) gain dépendant de la polarisation.<br/>
    En outre, cette méthode d'essai fournit un moyen pour mesurer les paramètres suivants:<br/>
    - longueur d'onde de gain maximal;<br/>
    - bande de longueur d'onde de gain.<br/>
    Le présent document couvre spécifiquement les amplificateurs monovoies. Pour les amplificateurs multicanaux, la série IEC 61290-10 s'applique.<br/>
    NOTE 1 L'applicabilité des méthodes d'essai décrites dans le présent document aux amplificateurs Raman distribués doit faire l'objet d'études complémentaires.<br/>
    NOTE 2 Une méthode d'essai pour les amplificateurs optiques à maintien de polarisation fait l'objet d'études complémentaires.<br/>
    Cette troisième édition annule et remplace la deuxième édition parue en 2005. Cette édition constitue une révision technique. Cette édition inclut les modifications techniques majeures suivantes par rapport à l'édition précédente:<br/>
    a) ajout d'informations sur l'applicabilité du présent document au domaine d'application;<br/>
    b) harmonisation du domaine d'application avec la série IEC 61290-1;<br/>
    c) ajout de recommandations de sécurité à l'Article 4 et à l'Article 5;<br/>
    d) correction d'une erreur de l'Article7, point e);<br/>
    e) remplacement du terme "précision de mesure de longueur d'onde" par "précision de longueur d'onde".
