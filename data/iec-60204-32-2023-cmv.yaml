abstract:
- language: en
  script: Latn
  content: |-
    IEC 60204-32:2023 CMV contains both the official standard and its commented version. The commented version provides you with a quick and easy way to compare all the changes between IEC 60204-32:2023 edition 3.0 and the previous IEC 60204-32:2023:2008 edition 2.0. Furthermore, comments from IEC TC 44 experts are provided to explain the reasons of the most relevant changes, or to clarify any part of the content.<br/>
    <br/>
    IEC 60204-32:2023 applies to electrical, electronic, programmable electronic equipment and systems to hoisting machines and related equipment, including a group of hoisting machines working together in a co-ordinated manner. The equipment covered by this document commences at the point of connection of the supply to the electrical equipment of the hoisting machine (crane-supply-switch) and includes systems for power supply and control feeders situated outside of the hoisting machine, for example, flexible cables or conductor wires or conductor bars. This document is applicable to equipment or parts of equipment not exceeding 1 000 V AC or 1 500 V DC between lines and with nominal frequencies not exceeding 200 Hz. This document does not cover all the requirements (for example guarding, interlocking, or control) that are needed or required by other standards or regulations in order to protect persons from hazards other than electrical hazards. Each type of hoisting machine has unique requirements to be accommodated to provide adequate safety. This document does not cover noise risks. Additional and special requirements can apply to the electrical equipment of hoisting machines including those that<br/>
    – handle or transport potentially explosive material (e.g. paint or sawdust);<br/>
    – are intended for use in potentially explosive and/or flammable atmospheres;<br/>
    – have special risks when transporting or moving certain materials;<br/>
    – are intended for use in mines.<br/>
    For the purposes of this document, hoisting machines include cranes of all types, winches of all types and storage and retrieval machines. The following product groups are included:<br/>
    – overhead travelling cranes;<br/>
    – mobile cranes;<br/>
    – tower cranes;<br/>
    – slewing luffing cranes;<br/>
    – gantry cranes;<br/>
    – offshore cranes;<br/>
    – floating cranes;<br/>
    – winches of all types;<br/>
    – hoists and accessories;<br/>
    – loader cranes;<br/>
    – cable cranes;<br/>
    – load holding devices;<br/>
    – storage and retrieval machines;<br/>
    – monorail hoists;<br/>
    – straddle carriers;<br/>
    – rubber tyred gantry cranes (RTGs).<br/>
    This document does not cover individual items of electrical equipment other than their selection for use and their erection.<br/>
    IEC 60204-32:2023 cancels and replaces the second edition published in 2008. This edition constitutes a technical revision.<br/>
    This edition includes the following significant technical changes with respect to the previous edition:<br/>
    a) alignment to the IEC 60204-1 sixth edition (2016) especially for:<br/>
    – requirements for earthing and bonding;<br/>
    – requirements for circuit protection;<br/>
    – consideration of use of Power Drive Systems;<br/>
    – protective bonding requirements and terminology;<br/>
    – requirements pertaining to safe torque off for PDS, emergency stop, and control circuit protection;<br/>
    – symbols for actuators of control devices;<br/>
    b) reference for high voltage electrical equipment;<br/>
    c) cableless control system requirements;<br/>
    d) EMC requirements;<br/>
    e) technical documentation requirements;<br/>
    f) general updating to current special national conditions, normative standards, and bibliographical references.
