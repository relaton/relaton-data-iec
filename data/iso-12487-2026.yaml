abstract:
- language: en
  script: Latn
  content: |-
    ISO 12487:2026 This document specifies the requirements and methods for the clinical investigation of medical electrical (ME) equipment used to measure the body temperature in indirect measurement mode.<br/>
    This document covers both intermittently and continuously measuring clinical thermometers.<br/>
    NOTE 1 This document does not apply to clinical thermometers measuring the body temperature in direct measurement mode.<br/>
    NOTE 2 For clinical thermometers in direct measurement mode determining the technical accuracy in accordance with ISO 80601-2-56:—1) is considered sufficient.<br/>
    This document is applicable to clinical thermometers with claimed measurement time shorter than 60 seconds (for methods such as oral or rectal measurement), or shorter than 5 minutes (for methods such as axillary measurement), and which are treated as predictive type thermometers and fall under the scope of this document.<br/>
    This document specifies additional disclosure requirements.<br/>
    This document does not apply to the clinical investigation of a screening thermographs for human febrile temperature screening whose laboratory accuracy requirements are described in IEC 80601-2-59.<br/>
    This document does not apply to pulmonary artery catheter for the determination of cardiac output by thermodilution.<br/>
    NOTE 3 ISO 80601-2-56:—1) does include pulmonary artery catheter for the determination of cardiac output by thermodilution.
- language: fr
  script: Latn
  content: |-
    ISO 12487:2026 Le présent document spécifie les exigences et les méthodes relatives à l'investigation clinique d'appareils électromédicaux (EM) utilisé pour mesurer la température du corps en mode de mesurage indirect.<br/>
    Le présent document couvre à la fois les thermomètres médicaux intermittents et continus.<br/>
    NOTE 1 Le présent document ne s'applique pas aux thermomètres médicaux mesurant la température du corps en mode de mesurage direct.<br/>
    NOTE 2 Pour les thermomètres médicaux en mode de mesurage direct, la détermination de l'exactitude technique conformément à l'ISO 80601-2-56:—1) est considérée suffisante.<br/>
    Ce document s'applique aux thermomètres médicaux dont le temps de mesurage déclaré est inférieur à 60 secondes (pour les méthodes telles que le mesurage oral ou rectal), ou inférieur à 5 minutes (pour les méthodes telles que le mesurage axillaire), et qui sont traités en tant que thermomètres à extrapolation et relèvent du domaine d'application du présent document.<br/>
    Le présent document spécifie des exigences de publications supplémentaires.<br/>
    Le présent document ne s'applique pas à l'investigation clinique d'un imageur thermique pour le dépistage de la température de fébrilité humaine dont les exigences en termes d'exactitude de laboratoire sont décrites dans l'IEC 80601-2-59.<br/>
    Le présent document ne s'applique pas au cathéter de l'artère pulmonaire pour la détermination du débit cardiaque par thermodilution.<br/>
    NOTE 3 L'ISO 80601-2-56:—1) comprend le cathéter de l'artère pulmonaire pour la détermination du débit cardiaque par thermodilution.
