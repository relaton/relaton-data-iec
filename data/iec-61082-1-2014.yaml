abstract:
- language: en
  script: Latn
  content: |-
    IEC 61082-1:2014 establishes general rules and guidelines for the presentation of information in documents, and specific rules for diagrams, drawings and tables used in electrotechnology. This third edition cancels and replaces the second edition published in 2006. It constitutes a technical revision and includes the following changes:<br/>
    - inclusion of presentation rules for wireless interconnections;<br/>
    - description of exceptional cases for the application of rules for positioning of reference designations in diagrams;<br/>
    - correction of errors and update of the normative references;<br/>
    - harmonization of definitions with respect to referenced publications.<br/>
    It has the status of a horizontal standard in accordance with IEC Guide 108.
- language: fr
  script: Latn
  content: |-
    IEC 61082-1:2014 définit des règles générales et sert de guide pour la présentation des informations dans les documents et définit des règles particulières pour les schémas, les dessins et les tableaux utilisés en électrotechnique. Cette troisième édition annule et remplace la deuxième édition parue en 2006. Elle constitue une révision technique et inclut les modifications suivantes:<br/>
    - inclusion de règles de présentation pour les interconnexions sans fil;<br/>
    - description de cas exceptionnels pour l'application de règles pour le positionnement des désignations de référence dans les schémas;<br/>
    - correction d'erreurs et mise à jour des références normatives;<br/>
    - harmonisation des définitions par rapport aux publications référencées.<br/>
    Elle a le statut de norme horizontale conformément au Guide IEC 108.
