abstract:
- language: en
  script: Latn
  content: |-
    IEC 62368-1:2018 is applicable to the safety of electrical and electronic equipment within the field of audio, video, information and communication technology, and business and office machines with a rated voltage not exceeding 600 V. This document does not include requirements for performance or functional characteristics of equipment.<br/>
    This is a product safety standard that classifies energy sources, prescribes safeguards against those energy sources, and provides guidance on the application of, and requirements for, those safeguards.<br/>
    The prescribed safeguards are intended to reduce the likelihood of pain, injury and, in the case of fire, property damage.<br/>
    This third edition cancels and replaces the second edition published in 2014. This edition constitutes a technical revision.<br/>
    This edition includes the following significant technical changes with respect to the previous edition:<br/>
    – addition of requirements for outdoor equipment;<br/>
    – new requirements for optical radiation;<br/>
    – addition of requirements for insulating liquids;<br/>
    – addition of requirements for work cells;<br/>
    – addition of requirements for wireless power transmitters;<br/>
    – addition of requirements for fully insulated winding wire (FIW);<br/>
    – alternative method for determination of top, bottom and side openings for fire enclosures;<br/>
    – alternative requirements for sound pressure.<br/>
    This group safety publication is primarily intended to be used as a product safety standard for the products mentioned in the scope, but shall also be used by technical committees in the preparation of standards for products similar to those mentioned in the scope of this standard, in accordance with the principles laid down in IEC Guide 104 and lSO/lEC Guide 51.<br/>
    The contents of the corrigendum of April 2020 have been included in this copy.<br/>
    Key words: Audio, Video, Communication, Safety
- language: fr
  script: Latn
  content: |-
    L'IEC 62368-1:2018 s'applique à la sécurité de l'équipement électrique et électronique dans le domaine des technologies audio, vidéo, d'information et de communication, et des machines commerciales ou de bureau dont la tension assignée est inférieure ou égale à 600 V. La présente norme ne contient ni les exigences de performances ni les caractéristiques fonctionnelles de l'équipement. Elle est une norme relative à la sécurité des produits qui classifie les sources d’énergie, spécifie des protections contre ces sources d’énergie, et fournit des recommandations concernant leur application et leurs exigences. Les protections spécifiées sont prévues pour réduire la probabilité de douleur, blessure et, en cas d'incendie, de dommage matériel. Cette troisième édition annule et remplace la deuxième édition parue en 2014. Cette édition constitue une révision technique. Cette édition inclut les modifications techniques majeures suivantes par rapport à l'édition précédente:<br/>
    – ajout des exigences relatives au matériel pour installation extérieure;<br/>
    – nouvelles exigences relatives au rayonnement optique;<br/>
    – ajout des exigences relatives à l'isolant liquide;<br/>
    – ajout des exigences relatives aux cellules de travail;<br/>
    – ajout d'exigences relatives aux émetteurs de puissance sans fil;<br/>
    – ajout d'exigences relatives aux fils de bobinage totalement isolés (FIW, fully insulated winding wire);<br/>
    – méthode alternative de détermination des ouvertures supérieures, inférieures et latérales des enveloppes ignifuges;<br/>
    – autres exigences relatives à la pression acoustique.<br/>
    La présente publication groupée de sécurité est avant tout destinée à être utilisée en tant que norme en matière de sécurité des produits pour les produits cités dans le domaine d’application, mais elle doit également être utilisée par les comités d’études dans le cadre de l’élaboration de normes pour des produits similaires à ceux cités dans le domaine d’application de la présente norme, conformément aux principes établis dans le Guide IEC 104 et le Guide ISO/IEC 51.<br/>
    Le contenu du corrigendum d'avril 2020 a été pris en considération dans cet exemplaire.<br/>
    Mots-clés: Audio, Vidéo, Communication, Sécurité
