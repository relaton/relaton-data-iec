abstract:
- language: en
  script: Latn
  content: |-
    IEC 61591:2023+AMD1:2026 CSV applies to cooking fume extractors incorporating a fan for the recirculation or extraction mode situated in a household kitchen. It can also be used for cooking fume extractors where the fan is mounted separately from the appliance, but controlled by the appliance when the fan is defined in the technical documentation (e.g. name plate data) and instructions for installation. This document deals also with down-draft systems arranged beside, behind or under the cooking appliance. This document defines the main performance characteristics of these appliances, which are of interest to the user, and specifies methods for measuring these characteristics. This document does not specify a classification or ranking for performance. This document does not deal with safety requirements that are in accordance with IEC 60335-1 and IEC 60335-2-31. Cooking fume extractors without fans operated by a central ventilation system are covered in EN 13141-3. This third edition cancels and replaces the second edition published in 2019. This edition constitutes a technical revision.<br/>
    This edition includes the following significant technical changes with respect to the previous edition:<br/>
    a) new definition of working point, see 3.19;<br/>
    b) new definition for lowest setting and automatic setting, see 3.17 and 3.18;<br/>
    c) revised requirements for installation and positioning, see 6.2;<br/>
    d) added a normative reference ISO 5801 for the specification of the pressure compensation chamber, see Clause 10;<br/>
    e) separate clauses for determining the volumetric airflow and fluid dynamic efficiency, see Clauses 10 and 11;<br/>
    f) new approach for determining the fluid dynamic efficiency ("9-point calculation");<br/>
    g) new definitions, new clause and new Annex B regarding the measurement of low-power modes;<br/>
    h) new Annex A: assumption for the parameter b.
