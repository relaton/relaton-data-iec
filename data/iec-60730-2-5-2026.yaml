abstract:
- language: en
  script: Latn
  content: |-
    IEC 60730-2-5:2026 applies to automatic electrical burner control systems for the automatic control of burners for oil, gas, coal or other combustibles intended to be used<br/>
    - for household and similar use;<br/>
    - in shops, offices, hospitals, farms and commercial and industrial applications;<br/>
    NOTE 1 Throughout this document, where it can be used unambiguously, the word "system" means "burner control system" and "systems" means "burner control systems".<br/>
    - for equipment that is used by the public, such as equipment intended to be used in shops, offices, hospitals, farms and commercial and industrial applications;<br/>
    NOTE 2 Throughout this document, the word "equipment" means "appliance and equipment."<br/>
    EXAMPLE 1 Controls for commercial catering, heating and air-conditioning equipment.<br/>
    - that are smart enabled controls;<br/>
    EXAMPLE 2 Remote interfaces/control of burner operations.<br/>
    - that are AC or DC powered controls with a rated voltage not exceeding 690 V AC or 600 V DC;<br/>
    - used in, on, or in association with equipment that use electricity, gas, oil, solid fuel, solar thermal energy, etc., or a combination thereof;<br/>
    - utilized as part of a control system or controls which are mechanically integral with multifunctional controls having non-electrical outputs;<br/>
    - using NTC or PTC thermistors and to discrete thermistors, requirements for which are contained in Annex J;<br/>
    - that are mechanically or electrically operated, responsive to or controlling such characteristics as temperature, pressure, passage of time, humidity, light, electrostatic effects, flow, or liquid level, current, voltage, acceleration, or combinations thereof;<br/>
    - as well as manual controls when such are electrically and/or mechanically integral with automatic controls.<br/>
    NOTE 3 Requirements for manually actuated mechanical switches not forming part of an automatic control are contained in IEC 61058-1-1.<br/>
    This document is applicable<br/>
    - to a complete burner control system;<br/>
    - to a separate programming unit;<br/>
    - to a separate electronic high-voltage ignition source;<br/>
    - to a separate flame detector, and<br/>
    - to a separate high-temperature operation (HTO) detector.<br/>
    - to a burner control system intended to be used in warm air heating appliances (furnaces) where the appliance is equipped with an electromechanical differential pressure control to monitor the difference of the combustion air pressure (Type 2.AL). This pressure control provides a switch as an alternative to one of the two switching elements to directly de-energize the safety relevant terminals.<br/>
    This document does not apply to thermoelectric flame supervision controls; thermoelectric flame supervision controls are covered by ISO 23551-6:2021.<br/>
    This document also applies to electrical burner control systems intended exclusively for industrial process applications e.g. those applications covered by ISO TC 244 (ISO 13577 series).<br/>
    This document applies to controls powered by primary or secondary batteries, requirements for which are contained within the standard.<br/>
    This document applies to<br/>
    - the inherent safety of automatic electrical burner control systems, and<br/>
    - functional safety of automatic electrical burner control systems,<br/>
    - automatic electrical burner control systems where the performance (for example the effect of EMC phenomena) of the product can impair the overall safety and performance of the controlled system,<br/>
    - the operating values, operating times, and operating sequences where such are associated with burner safety and to the testing of automatic electrical burner control systems used in, on, or in association with, burners.<br/>
    NOTE 4 Requirements for specific operating values, operating times and operating sequences are given in the standards for appliances and equipment.<br/>
    This document specifies the requirements for construction, operation and testing of automatic electrical burner control systems used in, on, or in association with an equipment.<br/>
    This document applies also to systems<br/>
    - incorporating electronic devices,<br/>
    - using NTC or PTC thermistors, additional requirements for which are contained in Annex J,<br/>
    - to the electrical and functional safety of controls capable of receiving and responding to communications signals. The signals can be transmitted to or received from external units, connected wired or wireless, that can or can not be part of the burner control system.<br/>
    This document does not<br/>
    - take into account the response value of an automatic action of a control, if such a response value is dependent upon the method of mounting the control in the equipment. Where a response value is of significant purpose for the protection of the user, or surroundings, the value defined in the appropriate equipment standard or as determined by the manufacturer will apply;<br/>
    - address the integrity of the output signal to the network devices, such as interoperability with other devices unless it has been evaluated as part of the control system.<br/>
    This part 2-5 is intended to be used in conjunction with IEC 60730-1. It was established on the basis of the sixth edition of that standard. Consideration may be given to future editions of, or amendments to, IEC 60730‑1.<br/>
    This fifth edition cancels and replaces the fourth edition published in 2013, Amendment 1:2017 and Amendment 2:2021. This edition constitutes a technical revision.<br/>
    This edition includes the following significant technical changes with respect to the previous edition:<br/>
    Adoption of IEC 60730-1:2022 with all of its significant changes to IEC 60730-1:2013, including Amendment 1:2015 and Amendment 2:2020
- language: fr
  script: Latn
  content: |-
    L'IEC 60730-2-5:2026 s'applique aux systèmes de commande électrique automatiques de brûleurs pour la commande automatique de brûleurs pour fioul, gaz, charbon ou autres combustibles destinés à<br/>
    - un usage domestique et analogue;<br/>
    - être utilisés dans des magasins, bureaux, hôpitaux, fermes et applications commerciales et industrielles;<br/>
    NOTE 1 Tout au long du présent document, lorsqu'ils peuvent être utilisés sans ambiguïté, le terme "système" signifie "système de commande de brûleur" et le terme "systèmes" signifie "systèmes de commande de brûleur".<br/>
    - pour des matériels utilisés par le public, tels que les matériels destinés à être utilisés dans des magasins, des bureaux, des hôpitaux, des fermes et des applications commerciales et industrielles;<br/>
    NOTE 2 Partout où il est utilisé dans le présent document, le terme "matériel" signifie "appareil et équipement".<br/>
    EXEMPLE 1 Les dispositifs de commande pour les installations de restauration, de chauffage et d'air conditionné.<br/>
    - qui sont des dispositifs de commande activés intelligents;<br/>
    EXEMPLE 2 Les interfaces/contrôles distants des opérations du brûleur.<br/>
    - qui sont des dispositifs de commande à courant alternatif ou continu dont la tension assignée ne dépasse pas 690 V en courant alternatif ou 600 V en courant continu;<br/>
    - qui sont utilisés dans, sur ou avec des matériels qui utilisent l'électricité, le gaz, le pétrole, des combustibles solides, l'énergie thermique solaire, etc. ou une combinaison de ces sources d'énergie;<br/>
    - qui sont utilisés dans le cadre d'un système de commande ou de dispositifs de commande qui sont mécaniquement intégrés à des dispositifs de commande multifonctions comportant des sorties non électriques;<br/>
    - qui utilisent des thermistances CTN ou CTP ainsi qu'aux dispositifs à thermistances discrètes, dont les exigences sont fournies à l'Annexe J;<br/>
    - à commande mécanique ou électrique, qui réagissent à des caractéristiques telles que la température, la pression, le passage du temps, l'humidité, la lumière, les effets électrostatiques, le débit ou le niveau d'un liquide, le courant, la tension, l'accélération, ou une combinaison de ces caractéristiques, ou qui les régulent;<br/>
    - ainsi qu'aux dispositifs de commande manuels qui sont électriquement et/ou mécaniquement intégrés à des dispositifs de commande automatique.<br/>
    NOTE 3 Les exigences relatives aux interrupteurs mécaniques à action manuelle qui ne font pas partie d'un dispositif de commande automatique sont contenues dans l'IEC 61058-1-1.<br/>
    Le présent document est applicable à<br/>
    - un système de commande de brûleur complet;<br/>
    - une unité de programmation séparée;<br/>
    - une source d'allumage électronique à haute tension séparée;<br/>
    - un détecteur de flamme séparé et<br/>
    - un détecteur de fonctionnement à haute température (HTO, High Temperature Operation) séparé,<br/>
    - un système de commande de brûleur destiné à être utilisé dans les appareils de chauffage à air chaud (chaudières) lorsque l'appareil est équipé d'un dispositif de commande de pression différentielle électromécanique pour réguler la différence de pression de l'air de combustion (type 2.AL). Ce dispositif de commande de pression prévoit un commutateur comme alternative à l'un des deux éléments de commutation pour mettre directement hors tension les bornes relatives à la sécurité.<br/>
    Le présent document ne s'applique pas aux équipements thermoélectriques de surveillance de flamme, ceux-ci sont couverts par l'ISO 23551-6:2021.<br/>
    Le présent document s'applique également aux systèmes de commande électrique des brûleurs destinés exclusivement aux applications de procédés industriels, par exemple, les applications couvertes par le TC 244 de l'ISO (série ISO 13577).<br/>
    Le présent document s'applique aux dispositifs de commande alimentés par des piles ou des accumulateurs; les exigences qui leur sont applicables sont contenues dans la norme.<br/>
    Le présent document s'applique<br/>
    - à la sécurité intrinsèque des systèmes de commande électrique automatiques des brûleurs, et<br/>
    - à la sécurité fonctionnelle des systèmes de commande électrique automatiques des brûleurs,<br/>
    - aux systèmes de commande électrique automatiques des brûleurs pour lesquels les performances (par exemple, l'effet des phénomènes CEM) du produit peuvent compromettre la sécurité et les performances globales du système commandé,<br/>
    - aux valeurs de fonctionnement, aux temps de fonctionnement et aux séquences de fonctionnement dans la mesure où ils interviennent dans la sécurité du brûleur, ainsi qu'aux essais des systèmes de commande électrique automatiques des brûleurs utilisés dans, sur ou avec les brûleurs.<br/>
    NOTE 4 Les exigences relatives aux valeurs de fonctionnement, temps de fonctionnement et séquences de fonctionnement spécifiques sont données dans les normes relatives aux appareils et matériels.<br/>
    Le présent document spécifie les exigences relatives à la construction, au fonctionnement et aux essais des systèmes de commande électrique automatiques des brûleurs utilisés dans, sur ou avec du matériel.<br/>
    Le présent document s'applique également aux systèmes<br/>
    - qui comportent des dispositifs électroniques,<br/>
    - qui utilisent des thermistances CTN ou CTP, dont les exigences supplémentaires sont fournies à l'Annexe J,<br/>
    - à la sécurité électrique et fonctionnelle des dispositifs de commande capables de recevoir et de répondre à des signaux de communication. Les signaux peuvent être transmis par des unités externes ou reçus de telles unités connectées en étant câblées ou non câblées, pouvant faire partie ou non du système de commande de brûleur.<br/>
    Le présent document<br/>
    - ne prend pas en compte la valeur de réponse d'une action automatique d'un dispositif de commande, lorsque cette valeur de réponse dépend de la méthode de montage du dispositif de commande dans le matériel. Lorsqu'une valeur de réponse est importante du point de vue de la protection de l'utilisateur ou de l'environnement, la valeur définie dans la norme de matériel pertinente ou déterminée par le fabricant s'applique;<br/>
    - ne traite pas de l'intégrité du signal de sortie transmis aux dispositifs de réseau, comme l'interopérabilité avec d'autres dispositifs, à moins qu'elle n'ait été évaluée comme partie intégrante du système de commande.<br/>
    La présente partie 2-5 est destinée à être utilisée conjointement avec l'IEC 60730-1. Elle a été établie sur la base de la sixième édition de cette norme. Les éditions futures de l'IEC 60730-1 ou ses amendements pourront être pris en considération.<br/>
    Cette cinquième édition annule et remplace la quatrième édition parue en 2013, l'Amendement 1:2017 et l'Amendement 2:2021. Cette édition constitue une révision technique.<br/>
    Cette édition inclut les modifications techniques majeures suivantes par rapport à l'édition précédente:<br/>
    adoption de l'IEC 60730-1:2022 avec toutes les modifications majeures par rapport à l'IEC 60730 1:2013, y compris l'Amendement 1:2015 et l'Amendement 2:2020.
