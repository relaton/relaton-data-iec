abstract:
- language: en
  script: Latn
  content: |-
    IEC 60336:2020 applies to FOCAL SPOTS in medical diagnostic X-RAY TUBE ASSEMBLIES for medical use, operating at X-RAY TUBE VOLTAGES up to and including 150 kV.<br/>
    This document describes the test methods employing digital detectors for determining:<br/>
    a) FOCAL SPOT dimensions in terms of NOMINAL FOCAL SPOT VALUES, ranging from 0,1 to 3,0;<br/>
    b) LINE SPREAD FUNCTIONS;<br/>
    c) one-dimensional MODULATION TRANSFER FUNCTIONS;<br/>
    d) FOCAL SPOT PINHOLE RADIOGRAMS,<br/>
    and the means for indicating compliance.<br/>
    In informative annexes, STAR PATTERN imaging and BLOOMING VALUE are described.<br/>
    IEC 60336:2020 cancels and replaces the fourth edition published in 2005. This edition constitutes a technical revision.<br/>
    The significant changes of this fifth edition with respect to the previous edition are detailed in Clause E.6. These changes are:<br/>
    a) introduction of digital detectors and discretization errors;<br/>
    b) fewer normative requirements;<br/>
    c) support for both SLIT CAMERA and PINHOLE CAMERA;<br/>
    d) reintroduction of distorted (skewed) FOCAL SPOT;<br/>
    e) keeping of STAR PATTERNS and BLOOMING VALUE as informative.<br/>
    The contents of the corrigendum of June 2022 have been included in this copy.
- language: fr
  script: Latn
  content: |-
    L'IEC 60336:2020 s’applique aux FOYERS des GAINES EQUIPEES à usage médical, pour diagnostic médical, fonctionnant à des POTENTIELS D’ACCELERATION DE TUBES RADIOGENES inférieurs ou égaux à 150 kV.<br/>
    Le présent document décrit les méthodes d’essai ayant recours à des détecteurs numériques dans la détermination des:<br/>
    a) dimensions des FOYERS en matière de VALEURS NOMINALES DE FOYER, variant de 0,1 à 3,0;<br/>
    b) FONCTIONS DE DISTRIBUTION LINEAIRE;<br/>
    c) FONCTIONS DE TRANSFERT DE MODULATION suivant une dimension;<br/>
    d) RADIOGRAMMES A STENOPE,<br/>
    et des moyens d’indiquer la conformité.<br/>
    Les annexes informatives décrivent la MIRE ETOILE et la VALEUR DE DISPERSION.<br/>
    L'IEC 60336:2020 annule et remplace la quatrième édition parue en 2005. Cette édition constitue une révision technique.<br/>
    Les modifications majeures présentées dans cette cinquième édition par rapport à l’édition précédente sont énumérées dans l’Article E.6. Ces modifications sont:<br/>
    a) introduction des détecteurs numériques et des erreurs de discrétisation;<br/>
    b) exigences normatives moins nombreuses;<br/>
    c) informations d’accompagnement relatives aux CAMERAS A FENTE et aux CAMERAS A STENOPE;<br/>
    d) réintroduction de FOYER déformé (non linéaire);<br/>
    e) conservation des MIRES ETOILES et de la VALEUR DE DISPERSION comme documents informatifs.<br/>
    Le contenu du corrigendum de juin 2022 a été pris en considération dans cet exemplaire.
