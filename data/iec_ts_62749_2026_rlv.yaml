abstract:
- content: "IEC TS 62749:2026 RLV contains both the official IEC International Standard
    and its Redline version. The Redline version is available in English only and
    provides you with a quick and easy way to compare all the changes between the
    official IEC Standard and its previous edition.<p>IEC TS 62749:2026 specifies
    the expected characteristics of electricity at the point of supply of public low,
    medium and high voltage, 50 Hz or 60 Hz, networks, as well as power quality assessment
    methods. This document does not apply for systems operated above 230 kV.<br />\r\nThe
    boundaries between the various voltage levels can be different for different countries
    or regions. In the context of this document, the following terms for system voltage
    are used:<br />\r\n- low voltage (LV) refers to UN ≤ 1 kV;<br />\r\n- medium voltage
    (MV) refers to 1 kV< UN ≤ 35 kV;<br />\r\n- high voltage (HV) refers to 35 kV<
    UN ≤ 230 kV.<br />\r\nBecause of existing network structures, in some countries
    or regions, the boundary between medium and high voltage can be different. While
    power quality is related to EMC in a number of ways, especially because compliance
    with power quality requirements depends on the control of cumulative effect of
    electromagnetic emission from all or multiple equipment and installations, this
    document is not an EMC publication (see also Annex E).<br />\r\nThis third edition
    cancels and replaces the second edition published in 2020. This edition includes
    the following significant technical changes with respect to the previous edition:<br
    />\r\n- clarification that harmonic orders recommended in this document are up
    to 40th;<br />\r\n- 4.6 is modified accordingly;<br />\r\n- iteration that this
    document does not apply for systems operated above 230 kV;<br />\r\n- deletion
    of Annex C;<br />\r\n- improvement of 4.10;<br />\r\n- update of profiles and
    addition of new profiles;<br />\r\n- modifications to align with EN 50160:2022
    and EN 50160:2022/AMD1:2025.</p>"
