abstract:
- language: en
  script: Latn
  content: |-
    IEC 60728-11:2023 deals with the safety requirements applicable to fixed sited systems and equipment. As far as applicable, it is also valid for mobile and temporarily installed systems, for example, caravans. Additional requirements may be applied, for example, referring to:<br/>
    - electrical installations of buildings and overhead lines,<br/>
    - other telecommunication services distribution systems,<br/>
    - water distribution systems,<br/>
    - gas distribution systems,<br/>
    - lightning systems.<br/>
    This document is intended to provide requirements specifically for the safety of the system, personnel working on it, subscribers and subscriber equipment. It deals only with safety aspects and is not intended to define a standard for the protection of the equipment used in the system. IEC 60728-11:2023 cancels and replaces the fourth edition published in 2016. This edition constitutes a technical revision. This edition includes the following significant technical changes with respect to the previous edition.<br/>
    a) Replacement of references to IEC 60065 and IEC 60950-1 with references to IEC 62368-1.<br/>
    b) Addition of subclauses 4.4 to 4.6.<br/>
    c) Revised definition of class I equipment, class II equipment, main earthing terminal, see 3.1.6, 3.1.8 and 3.1.31.<br/>
    d) Addition of definitions for harm, hazard, ordinary person, instructed person, skilled person, see 3.1.22, 3.1.23, 3.1.39, 3.1.40 and 3.1.41.<br/>
    e) Additional requirement to provide details on the equipment installed, see 4.1.<br/>
    f) Additional mechanical, design and construction requirements, see 4.2.2.<br/>
    g) Changes to the accessible part requirements, see 4.2.3.<br/>
    h) The current carrying capacity and dielectric strength of components is now obligatory, see 8.1.3.<br/>
    i) The assessment of the risk of lightning strike is now obligatory, see Figure 10.<br/>
    j) Extension of remote feeding voltage on subscriber feeder, see Table 1.
- language: fr
  script: Latn
  content: |-
    L'IEC 60728-11:2023 traite des exigences de sécurité applicables aux systèmes et matériels fixes. S'il y a lieu, elle couvre également les systèmes mobiles et provisoires, par exemple les caravanes.<br/>
    Des exigences supplémentaires peuvent s'appliquer, par exemple, pour:<br/>
    • les installations électriques des bâtiments et les lignes aériennes;<br/>
    • les autres réseaux de distribution de services de télécommunications;<br/>
    • les réseaux de distribution d'eau;<br/>
    • les réseaux de distribution de gaz;<br/>
    • les systèmes de protection contre la foudre.<br/>
    Le présent document a pour objet de fournir des exigences spécifiques à la sécurité du système, du personnel qui travaille sur celui-ci, ainsi que des abonnés et des équipements de l'abonné. Il traite uniquement des aspects de sécurité et n'a pas pour objet de définir une norme pour la protection des matériels utilisés dans le système.<br/>
    L'IEC 60728-11:2023 annule et remplace la quatrième édition parue en 2016. Cette édition constitue une révision technique.<br/>
    Cette édition inclut les modifications techniques majeures suivantes par rapport à l'édition précédente:<br/>
    a) les références à l'IEC 60065 et à l'IEC 60950-1 ont été remplacées par des références à l'IEC 62368-1;<br/>
    b) des paragraphes ont été ajoutés (4.4 à 4.6);<br/>
    c) les définitions pour les termes matériel de classe I, matériel de classe II et borne principale de terre ont été révisées (voir le 3.1.6, le 3.1.8 et le 3.1.31);<br/>
    d) des définitions ont été ajoutées pour les termes dommage, danger, personne ordinaire, personne avertie et personne qualifiée (voir le 3.1.22, le 3.1.23, le 3.1.39, le 3.1.40 et le 3.1.41);<br/>
    e) des exigences ont été ajoutées pour fournir des détails sur le matériel installé (voir le 4.1);<br/>
    f) des exigences mécaniques, de conception et de construction ont été ajoutées (voir le 4.2.2);<br/>
    g) les exigences relatives aux parties accessibles ont été modifiées (voir le 4.2.3);<br/>
    h) le courant admissible et la rigidité diélectrique des composants sont désormais obligatoires (voir le 8.1.3);<br/>
    i) l'appréciation du risque de foudre est désormais obligatoire (voir la Figure 10);<br/>
    j) la tension de téléalimentation sur la liaison de connexion d'abonné a été étendue (voir le Tableau 1).
