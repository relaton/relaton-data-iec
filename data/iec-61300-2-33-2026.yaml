abstract:
- language: en
  script: Latn
  content: |-
    IEC 61300-2-33:2026 evaluates the behaviour of a fibre optic mechanical splice, a fibre management system, a protective housing or a hardened connector after being subjected to a specified number of assembly and disassembly operations.<br/>
    The test procedures described in this document simulate conditions that the component can encounter during its service lifetime to check the following performance characteristics:<br/>
    - capability of an optical mechanical splice to be reinstalled after being disassembled;<br/>
    - capability to reintroduce fibre management systems and protective housings, accessing fibres and optical components and making reconfigurations without disturbing transmission in adjacent fibre circuits;<br/>
    - sealing performance of the protective housing after frequent opening and closing operations;<br/>
    - sealing performance of the hardened connector after frequent mating and demating operations.<br/>
    This fourth edition cancels and replaces the third edition published in 2012. This edition constitutes a technical revision. This edition includes the following significant technical changes with respect to the previous edition:<br/>
    a) update of the terms and definitions according to IEC 61753-1:2018 and IEC 61756‑1:2019;<br/>
    b) update of the test severities according to the new edition of IEC 61753-1:2018;<br/>
    c) addition of procedure D to verify the sealing performance after frequent mating and demating of a hardened connector.
- language: fr
  script: Latn
  content: |-
    L’IEC 61300-2-33:2026 permet d’évaluer le comportement d’une épissure mécanique fibronique, d’un système de gestion des fibres, d’un boîtier de protection ou d’un connecteur renforcé, après avoir été soumis à un nombre spécifié d'opérations de montage et de démontage.<br/>
    Les procédures d'essai décrites dans le présent document simulent les conditions que le composant peut rencontrer au cours de sa durée de vie afin de vérifier les caractéristiques de performance suivantes:<br/>
    - la capacité d’une épissure mécanique optique à être réinstallée après avoir été démontée;<br/>
    - la capacité à réintroduire des systèmes de gestion de fibres et des boîtiers de protection, en accédant aux fibres et composants optiques et en réalisant de nouvelles configurations sans perturber la transmission dans les circuits de fibres adjacents;<br/>
    - la performance d'étanchéité du boîtier de protection après des opérations fréquentes d'ouverture et de fermeture;<br/>
    - la performance d'étanchéité du connecteur renforcé après des opérations fréquentes d'accouplement et de désaccouplement.<br/>
    Cette quatrième édition annule et remplace la troisième édition parue en 2012. Elle constitue une révision technique.<br/>
    Cette édition inclut les modifications techniques majeures suivantes par rapport à l'édition précédente:<br/>
    a) mise à jour des termes et définitions conformément à l’IEC 61753-1:2018 et à l’IEC 61756‑1:2019;<br/>
    b) mise à jour des sévérités d’essai conformément à la nouvelle édition de l’IEC 61753-1:2018;<br/>
    c) ajout de la procédure D pour la vérification de la performance d’étanchéité après accouplements et désaccouplements fréquents d’un connecteur renforcé.
