abstract:
- content: "IEC 61643-361:2026 applies to surge isolation transformers (SITs) dedicated
    to surge mitigation and for connection to 50/60 Hz power circuits and equipment
    rated up to 1 000 V RMS. This document covers the surge and mitigation performance
    of SITs with an impulse withstand voltage performance of at least 30 kV, and provides
    standard methods for testing and rating.<br />\r\nThis document covers surge-related
    parameters but does not address typical transformer tests and parameters covered
    by the IEC 61558 series [13][1]. This document also does not cover SIT operation
    under differential mode lightning surge conditions.<br />\r\n[1] Numbers in square
    brackets refer to the Bibliography."
  language:
  - en
  script:
  - Latn
  format: text/html
- content: "IEC 61643-361: 2026 s’applique aux transformateurs d’isolement contre
    les surtensions (SIT) destinés à atténuer les surtensions et à être connectés
    à des circuits d’alimentation 50/60 Hz et à des équipements d’une tension assignée
    allant jusqu’à 1 000 V en valeur efficace. Le présent document couvre les performances
    en matière de surtension et d’atténuation des SIT dont la tension de tenue aux
    chocs atteint au moins 30 kV, et fournit des méthodes normalisées d’essai et d’évaluation.<br
    />\r\nLe présent document couvre les paramètres liés aux surtensions, mais ne
    traite pas des essais et paramètres types des transformateurs couverts par la
    série IEC 61558 [13][1]. Le présent document ne couvre pas non plus le fonctionnement
    d’un SIT dans des conditions de surtension due à la foudre en mode différentiel.<br
    />\r\n[1] Les chiffres entre crochets renvoient à la Bibliographie."
