abstract:
- language: en
  script: Latn
  content: |-
    IEC 62282-2-100:2020 provides safety related requirements for construction, operation under normal and abnormal conditions and the testing of fuel cell modules. This document deals with conditions that can yield hazards to persons and cause damage outside the fuel cell modules. Protection against damage inside the fuel cell modules is not addressed in this document, provided it does not lead to hazards outside the module. These requirements can be superseded by other standards for equipment containing fuel cell modules as required for particular applications.<br/>
    This first edition cancels and replaces IEC 62282-2, published in 2012. This edition includes the following significant technical changes with respect to IEC 62282­2:2012:<br/>
    • update of definitions, in particular fuel cell module for normal operation;<br/>
    • leakage values under normal and abnormal operation have been addressed;<br/>
    • a delayed ignition test has been included;<br/>
    • protective measures to limit gas leakage have been included;<br/>
    • the requirements for insulation between live parts and SELV have been updated;<br/>
    • the general safety strategy has been modified to reflect the needs for different application standards; the modifications are in line with similar modifications made to IEC 62282­-3-­100;<br/>
    • the electrical components clause has been modified to reflect the needs for different application standards; the modifications are in line with similar modifications made to IEC 62282-3-100;<br/>
    • protective earthing as part of the module or bonding as a measure within the installation has been introduced;<br/>
    • a dielectric strength test has been completely updated by referring to IEC 62744-1 for voltages up to 1 000 V AC/1 500 V DC;<br/>
    • a new “pressure drop method” leakage test method has been included;<br/>
    • a new Annex addressing significant hazards, hazardous situations and events dealt with in this document, and linked to 4.1 (General safety strategy) has been added.<br/>
    The contents of the corrigendum of November 2023 have been included in this copy.
- language: fr
  script: Latn
  content: |-
    l’IEC 62282-2-100:2020 fournit des exigences relatives à la sécurité concernant la construction, le fonctionnement dans des conditions normales et anormales, et l’essai des modules à piles à combustible. Le présent document couvre les conditions qui peuvent générer des dangers pour les personnes et des dommages à l'extérieur des modules à piles à combustible. La protection contre les dommages affectant l'intérieur des modules à piles à combustible n'est pas traitée dans le présent document, à condition que ceux-ci ne suscitent pas de dangers à l'extérieur du module. Ces exigences peuvent être remplacées par d'autres normes applicables aux équipements contenant des modules à piles à combustible comme l’exigent les applications spécifiques.<br/>
    Cette première édition annule et remplace l’IEC 62282-2 parue en 2012. Cette édition inclut les modifications techniques majeures suivantes par rapport à l’IEC 62282-2:2012:<br/>
    • mise à jour des définitions, notamment celle du module à pile à combustible pour fonctionnement normal;<br/>
    • traitement des valeurs de fuite en fonctionnement normal et anormal;<br/>
    • introduction d’un essai d'allumage retardé;<br/>
    • introduction de mesures de protection destinées à limiter les fuites de gaz;<br/>
    • mise à jour des exigences d’isolation entre les parties actives et la TBTS;<br/>
    • la stratégie générale de sécurité a été modifiée afin de prendre en compte les besoins concernant différentes normes d’application; ces modifications s’alignent sur les modifications similaires effectuées au niveau de l’IEC 62282-3-100;<br/>
    • l’article relatif aux composants électriques a été modifié afin de prendre en compte les besoins concernant différentes normes d’application; ces modifications s’alignent sur les modifications similaires effectuées au niveau de l’IEC 62282-3-100;<br/>
    • installation d’une mise à la terre de protection comme partie intégrante du module ou d’une liaison comme mesure interne à l’installation;<br/>
    • mise à jour exhaustive de l’essai de rigidité diélectrique par référence à l’IEC 62744-1 pour les tensions jusqu’à 1 000 V en courant alternatif/1 500 V en courant continu;<br/>
    • introduction d'une nouvelle méthode d’essai de fuite par "chute de pression"<br/>
    • une nouvelle Annexe relative aux dangers, situations et événements dangereux traités dans le présent document et associée à 4.1 (Stratégie de sécurité générale) a été ajoutée.<br/>
    Le contenu du corrigendum de novembre 2023 a été pris en considération dans cet exemplaire.
