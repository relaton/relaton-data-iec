abstract:
- language: en
  script: Latn
  content: |-
    IEC 61000-3-2:2018 deals with the limitation of harmonic currents injected into the public supply system. It specifies limits of harmonic components of the input current which can be produced by equipment tested under specified conditions. It is applicable to electrical and electronic equipment having a rated input current up to and including 16 A per phase, and intended to be connected to public low-voltage distribution systems. Arc welding equipment which is not professional equipment, with a rated input current up to and including 16 A per phase, is included in this document. Arc welding equipment intended for professional use, as specified in IEC 60974-1, is excluded from this document and can be subject to installation restrictions as indicated in IEC 61000-3-12. The tests according to this document are type tests. For systems with nominal voltages less than but not equal to 220 V (line-to-neutral), the limits have not yet been considered.<br/>
    This fifth edition cancels and replaces the fourth edition published in 2014. This edition constitutes a technical revision.<br/>
    This edition includes the following significant technical changes with respect to the previous edition:<br/>
    a) an update of the emission limits for lighting equipment with a rated power = 25 W to take into account new types of lighting equipment;<br/>
    b) the addition of a threshold of 5 W under which no emission limits apply to all lighting equipment;<br/>
    c) the modification of the requirements applying to the dimmers when operating non-incandescent lamps;<br/>
    d) the addition of test conditions for digital load side transmission control devices;<br/>
    e) the removal of the use of reference lamps and reference ballasts for the tests of lighting equipment;<br/>
    f) the simplification and clarification of the terminology used for lighting equipment;<br/>
    g) the classification of professional luminaires for stage lighting and studios under Class A;<br/>
    h) a clarification about the classification of emergency lighting equipment;<br/>
    i) a clarification for lighting equipment including one control module with an active input power = 2 W;<br/>
    j) an update of the test conditions for television receivers;<br/>
    k) an update of the test conditions for induction hobs, taking also into account the other types of cooking appliances;<br/>
    l) for consistency with IEC 61000-3-12, a change of the scope of IEC 61000-3-2 from equipment with an input current = 16 A to equipment with a rated input current = 16 A.
- language: fr
  script: Latn
  content: |-
    L’IEC 61000-3-2:2018 traite de la limitation des courants harmoniques injectés dans le réseau public d’alimentation. Elle définit les limites des harmoniques du courant d’entrée qui peuvent être produits par les matériels soumis à l’essai dans des conditions spécifiées. La présente partie de l’IEC 61000 est applicable aux appareils électriques et électroniques ayant un courant d’entrée assigné dont la valeur est inférieure ou égale à 16 A par phase et qui sont destinés à être raccordés à des réseaux publics de distribution à basse tension. Le matériel de soudage à l'arc qui n’est pas du matériel professionnel, dont le courant d’entrée assigné est inférieur ou égal à 16 A par phase, relève du présent document. Le matériel de soudage à l'arc destiné à un usage professionnel, tel que spécifié dans l’IEC 60974-1, est exclu du domaine d'application du présent document et peut être sujet à des restrictions d'installation comme indiqué dans l'IEC 61000-3-12. Les essais effectués conformément au présent document sont des essais de type. Les limites applicables aux réseaux dont la tension nominale est strictement inférieure à 220 V (entre phase et neutre) n'ont pas encore été envisagées.<br/>
    Cette cinquième édition annule et remplace la quatrième édition parue en 2014. Cette édition constitute une révision technique.<br/>
    Cette édition inclut les modifications techniques majeures suivantes par rapport à l'édition précédente:<br/>
    a) une mise à jour des limites d’émission pour les appareils d'éclairage ayant une puissance assignée ≤ 25 W afin de tenir compte des nouveaux types d’appareils d'éclairage;<br/>
    b) l’ajout d'un seuil de 5 W en dessous duquel aucune limite d’émission ne s’applique à l’ensemble des appareils d'éclairage;<br/>
    c) la modification des exigences qui s’appliquent aux variateurs de lumière lorsqu'ils font fonctionner des lampes qui ne sont pas à incandescence;<br/>
    d) l’ajout de conditions d'essai applicables aux dispositifs de commande d'éclairage par transmission numérique côté charge;<br/>
    e) la suppression de l'emploi de lampes de référence et de ballasts de référence pour les essais des appareils d'éclairage;<br/>
    f) la simplification et la clarification de la terminologie employée pour les appareils d'éclairage;<br/>
    g) la classification en classe A des luminaires professionnels pour l'éclairage des scènes de théâtre et pour les studios;<br/>
    h) une clarification de la classification des appareils d'éclairage de secours;<br/>
    i) une clarification pour les appareils d'éclairage comportant un module de commande ayant une puissance active d’entrée ≤ 2 W;<br/>
    j) une mise à jour des conditions d’essai des récepteurs de télévision;<br/>
    k) une mise à jour des conditions d’essai des tables de cuisson à induction, tenant compte également des autres types d’appareils de cuisson;<br/>
    l) en cohérence avec l’IEC 61000-3-12, une modification du domaine d’application de l’IEC 61000-3-2, qui couvrait les appareils ayant un courant d’entrée ≤ 16 A, et qui couvre maintenant les appareils ayant un courant d’entrée assigné ≤ 16 A.<br/>
    Mots-clés: courants harmoniques
