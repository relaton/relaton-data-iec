abstract:
- language: en
  script: Latn
  content: |-
    IEC 60404-8-3:2023+AMD1:2026 CSV defines the grades of cold-rolled non-oriented electrical steel strip and sheet delivered in the semi-processed state in nominal thicknesses of 0,47 mm, 0,50 mm, 0,64 mm, 0,65 mm and 0,79 mm. It gives general requirements, magnetic properties, geometric characteristics, tolerances and technical characteristics as well as inspection procedures. The nominal thicknesses of 0,47 mm, 0,64 mm and 0,79 mm apply to the grades for use at 60 Hz only. This document applies to cold-rolled non-oriented electrical steel strip and sheet delivered in the semi-processed state, i.e. without final heat treatment, in coils or sheets, and intended for the construction of magnetic circuits. This document does not apply to materials supplied in the fully-processed state. These materials correspond respectively to classes B2 and C21 of IEC 60404-1.<br/>
    This edition includes the following significant technical changes with respect to the previous edition:<br/>
    a) modification of terms and technical requirements concerning geometrical characteristics to be consistent with IEC 60404-9:2018;<br/>
    b) insertion of Table 3 - Tolerances on nominal thickness;<br/>
    c) change of the length of the test specimen for determination of geometrical characteristics from 2 m to 1 m;<br/>
    d) deletion of Annex A with the European numerical system of designation of steels.
