abstract:
- language: en
  script: Latn
  content: |-
    IEC 61223-3-6:2020 applies to the performance of MAMMOGRAPHIC X-RAY EQUIPMENT when used in MAMMOGRAPHIC TOMOSYNTHESIS modes of operation, with respect to image quality and dose.<br/>
    Excluded from the scope of this document are:<br/>
    - MAMMOGRAPHIC X-RAY EQUIPMENT modes of operation other than MAMMOGRAPHIC TOMOSYNTHESIS;<br/>
    - 2D images synthesised from the tomosynthesis images;<br/>
    - reconstructive TOMOGRAPHY other than MAMMOGRAPHIC TOMOSYNTHESIS;<br/>
    - CT SCANNERS covered by IEC 61223-3-5.<br/>
    IEC 61223-3-6:2020 defines<br/>
    a) the essential parameters which describe the acceptability criteria of MAMMOGRAPHIC TOMOSYNTHESIS modes of operation of MAMMOGRAPHIC X-RAY EQUIPMENT with regard to image quality and dose,<br/>
    b) the methods of testing whether measured quantities related to those parameters comply with specified tolerances, and<br/>
    c) CONSTANCY TEST frequency when required.<br/>
    This document is intended to be applied along with the acceptability criteria included in IEC 61223-3-2 or equivalent protocol for 2D mammography which are also relevant for MAMMOGRAPHIC TOMOSYNTHESIS modes of operation.<br/>
    These methods mainly rely on non-invasive measurements that use appropriate test equipment and are performed during or after the installation. Signed statements covering steps in the installation procedure can be used as part of the ACCEPTANCE TEST. Tests required by a higher level of compliance take precedence over similar tests with a lower level of compliance.<br/>
    When the results of the ACCEPTANCE TEST are in compliance with the expected values, the BASELINE VALUES for the subsequent CONSTANCY TESTS are established.
- language: fr
  script: Latn
  content: |-
    L'IEC 61223-3-6:2020 s'applique aux performances des APPAREILS DE MAMMOGRAPHIE A RAYONNEMENT X utilisés en mode TOMOSYNTHESE EN MAMMOGRAPHIE, en matière de qualité d'image et de dose.<br/>
    Sont exclus du domaine d'application du présent document:<br/>
    - les modes de fonctionnement des APPAREILS DE MAMMOGRAPHIE A RAYONNEMENT X autres que la TOMOSYNTHESE EN MAMMOGRAPHIE;<br/>
    - les images 2D synthétisées à partir d'images de tomosynthèse;<br/>
    - la TOMOGRAPHIE reconstructrice autre que la TOMOSYNTHESE EN MAMMOGRAPHIE;<br/>
    - les TOMODENSITOMETRES couverts par l'IEC 61223-3-5.<br/>
    L'IEC 61223-3-6:2020 définit:<br/>
    a) les paramètres essentiels qui décrivent les critères d'acceptabilité des modes TOMOSYNTHESE EN MAMMOGRAPHIE des APPAREILS DE MAMMOGRAPHIE A RAYONNEMENT X en matière de qualité d'image et de dose;<br/>
    b) les méthodes d'essai visant à déterminer si les grandeurs mesurées liées à ces paramètres sont conformes aux tolérances spécifiées; et<br/>
    c) la fréquence d'ESSAI DE CONSTANCE, le cas échéant.<br/>
    Le présent document est destiné à s'appliquer avec les critères d'acceptabilité inclus dans l'IEC 61223-3-2 ou un protocole de mammographie 2D équivalent, lesquels s'appliquent également aux modes TOMOSYNTHESE EN MAMMOGRAPHIE.<br/>
    Ces méthodes reposent principalement sur des mesures non invasives, exécutées pendant ou après l'installation, en utilisant des équipements d'essai appropriés. Des déclarations signées couvrant des étapes de la procédure d'installation peuvent être utilisées dans le cadre de l'ESSAI D'ACCEPTATION. Les essais exigés par un niveau de conformité plus élevé prévalent sur les essais similaires associés à un niveau de conformité plus faible.<br/>
    Lorsque les résultats de l'ESSAI D'ACCEPTATION sont conformes aux valeurs attendues, les VALEURS DE BASE des ESSAIS DE CONSTANCE ultérieurs sont établies.
