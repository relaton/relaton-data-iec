abstract:
- language: en
  script: Latn
  content: |-
    IEC 60947-6-1:2021 applies to transfer switching equipment (TSE), to be used in power systems for ensuring the continuity of the supply and allowing the energy management of the installation, by transferring a load between power supply sources, the rated voltage of which does not exceed 1 000 V AC or 1 500 V DC.<br/>
    This third edition cancels and replaces the second edition published in 2005, and its Amendment 1:2013. This edition constitutes a technical revision.<br/>
    This edition includes the following significant technical changes with respect to the previous edition:<br/>
    – clarification of scope and object;<br/>
    – clarification of terms and definitions;<br/>
    – removal of unnecessary definitions;<br/>
    – modification of characteristics;<br/>
    – modification of utilization categories definitions;<br/>
    – introduction of new markings requirements;<br/>
    – addition of new requirements for clearances and creepage distances;<br/>
    – addition of new requirements and tests for mechanical and electrical interlocks;<br/>
    – clarification of transfer sequences;<br/>
    – modification of requirements for rated short-time withstand currents;<br/>
    – modification of new requirements for electromagnetic compatibility;<br/>
    – clarification of performance requirements for CB type TSE, in alignment with requirements stated in IEC 60947-2;<br/>
    – addition of new test sequence V: Critical load current performance of equipment with DC ratings.
- language: fr
  script: Latn
  content: |-
    L'IEC 60947-6-1:2021 s’applique aux équipements de transfert de source (TSE) destinés à des installations qui assurent la continuité de l’alimentation et permettent la gestion de l’énergie de l’installation, en transférant une charge entre des sources d’alimentation dont la tension assignée ne dépasse pas 1 000 V en courant alternatif ou 1 500 V en courant continu.<br/>
    Cette troisième édition annule et remplace la deuxième édition parue en 2005, et l'Amendement 1:2013. Cette édition constitue une révision technique.<br/>
    Cette édition inclut les modifications techniques majeures suivantes par rapport à l'édition précédente:<br/>
    – clarification du domaine d’application et de l’objet;<br/>
    – clarification des termes et définitions;<br/>
    – retrait des définitions non nécessaires;<br/>
    – modification des caractéristiques;<br/>
    – modification des définitions de catégorie d’emploi;<br/>
    – introduction de nouvelles exigences de marquage;<br/>
    – ajout de nouvelles exigences relatives aux distances d’isolement et lignes de fuite;<br/>
    – ajout de nouvelles exigences et de nouveaux essais relatifs aux interverrouillages mécaniques et électriques;<br/>
    – clarification des séquences de transfert;<br/>
    – modification des exigences relatives aux courants assignés de courte durée admissibles;<br/>
    – modification des nouvelles exigences relatives à la compatibilité électromagnétique;<br/>
    – clarification des exigences relatives aux performances d’un TSE de type CB, en conformité avec les exigences contenues dans l’IEC 60947-2;<br/>
    – ajout d’une nouvelle séquence d’essais V: fonctionnement au courant critique du matériel ayant des caractéristiques en courant continu.
