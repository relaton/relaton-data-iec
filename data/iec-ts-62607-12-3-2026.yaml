abstract:
- language: en
  script: Latn
  content: |-
    IEC TS 62607-12-3:2026, which is a Technical Specification, establishes a standardized method to determine the key control characteristic<br/>
    • Schottky barrier height (SBH)<br/>
    from the temperature-dependent current–voltage characterization results obtained from two-dimensional (2D) material-based electronic devices.<br/>
    This document<br/>
    • defines the Schottky barrier formed from the interface between a 2D material and a metal;<br/>
    • specifies a 2D device sample for the measurement of the Schottky barrier;<br/>
    • specifies the measurement procedure for the Schottky barrier formed at the interface within 2D devices;<br/>
    • provides proper mathematical formulas used to extract the Schottky barrier formed from 2D-materials-based devices;<br/>
    • provides relevant case studies; and<br/>
    • provides relevant references
