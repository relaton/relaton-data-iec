abstract:
- language: en
  script: Latn
  content: |-
    IEC 63584-201:2026 The Open Charge Point Protocol (OCPP) provides the communication between a Charging Station and a Charging Station Management System (CSMS) and is designed to accommodate any type of charging technique. It is based on OCPP 2.0.1 and was submitted as a Fast-Track document.<br/>
    This second edition cancels and replaces IEC 63584 published in 2024. This edition constitutes a technical revision.<br/>
    This edition includes the following significant technical changes with respect to IEC 63584:2024:<br/>
    a) introduced clarifications/improvements to requirements, use cases and sequence diagrams based on member feedback and TWG taskgroup meetings;<br/>
    b) renamed all "OCTT" references in part 5 and 6 to "Test System" based on IEC feedback;<br/>
    c) structural changes to the part 6 testcase descriptions to improve readability;<br/>
    d) continuous improvements to part 6 testcase descriptions based on feedback from active certification program and CWG taskgroup meetings.
