abstract:
- language: en
  script: Latn
  content: |-
    IEC TR 62271-321:2026 relates to high-voltage switchgear and controlgear for all rated voltage levels above 1 kV AC and 1,5 kV DC and assemblies thereof and provides materials for the reference dictionary for all products covered by the IEC 62271 series.<br/>
    This dictionary is a preliminary work which can be used to facilitate exchanges in digital format of data related to high-voltage switchgear and controlgear components, devices, equipment, and assemblies of the power systems.<br/>
    Such a dictionary improves the interoperability of the power systems required for these data exchanges along the power system lifetime and over its life cycle.<br/>
    Each property has an unambiguously defined meaning and name, and where relevant, a defined value list, a defined format, and a defined unit.<br/>
    This document defines, digitalizes and then summarizes the properties related to high-voltage switchgear and controlgear nameplates and information usually exchanged during the enquiries, tenders, and orders life phases defined by IEC TC 17 standards of physical elements.<br/>
    The intention is not to cover manufacturer specific features.<br/>
    The intention is not to cover IEC TC 17 standards dealing only with assessment methodology (calculation, tests, rules, etc.).
