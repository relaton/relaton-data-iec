abstract:
- language: en
  script: Latn
  content: |-
    IEC 63066:2026 applies to docking connectors (hereinafter referred to as accessories) incorporated in or fixed to electrical equipment, intended to connect energy storage units, either removable or swappable, or both, to a dedicated electric power conversion unit, to an energy consuming unit or to another energy storage unit.<br/>
    These accessories are intended for DC and can include either a protective earth contact or optional auxiliary contacts for signalling and data transmission, or both. These accessories have a rated current of up to 2 000 A and rated operating voltages not exceeding 1 500 V DC.<br/>
    This first edition cancels and replaces the first edition of IEC TS 63066 published in 2017. This edition constitutes a technical revision.<br/>
    This edition includes the following significant technical changes with respect to the previous edition:<br/>
    a) introduction of standard sheets;<br/>
    b) alignment with IEC 60309‑1:2021;<br/>
    c) technical improvements, e.g. short circuit tests according the I2t- methodology.
- language: fr
  script: Latn
  content: |-
    L'IEC 63066:2026 s'applique aux connecteurs de raccordement (ci-après désignés par le terme "appareils") intégrés ou fixés à des matériels électriques, destinés à connecter des unités de stockage d'énergie amovibles ou interchangeables, ou les deux, à une unité de conversion de l'alimentation électrique spécifique, à une unité de consommation d'énergie ou à une autre unité de stockage d'énergie.<br/>
    Ces appareils sont prévus pour un courant continu et peuvent inclure un contact de terre de protection ou des contacts auxiliaires facultatifs, ou les deux, pour les signaux et la transmission de données. Ces appareils ont un courant assigné inférieur ou égal à 2 000 A et des tensions d'emploi assignées inférieures ou égales à 1 500 V en courant continu.<br/>
    Cette première édition annule et remplace la première édition de l'IEC TS 63066 parue en 2017. Cette édition constitue une révision technique.<br/>
    Cette édition inclut les modifications techniques majeures suivantes par rapport à l'édition précédente:<br/>
    a) ajout de feuilles de normes;<br/>
    b) alignement sur l'IEC 60309‑1:2021;<br/>
    c) améliorations techniques, par exemple essais de court-circuit selon la méthodologie I2t.
