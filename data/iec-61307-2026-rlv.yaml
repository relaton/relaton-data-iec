abstract:
- language: en
  script: Latn
  content: |-
    IEC 61307:2026 RLV contains both the official IEC International Standard and its Redline version. The Redline version is available in English only and provides you with a quick and easy way to compare all the changes between the official IEC Standard and its previous edition.<br/>
    <br/>
    IEC 61307:2026 specifies test methods for the determination of the efficiency of frequency conversion from the electrical input, and of the available and workload microwave output power in industrial microwave heating installations, as well as operational flexibility. This document is in principle applicable to industrial microwave heating equipment and installations in the frequency range from 300 MHz to 300 GHz but focused on the microwave ISM frequencies below 6 GHz. This document relates to industrial microwave heating equipment operating as intended by the manufacturer's specifications for normal operation. This document does not apply to appliances for household and similar use (covered by IEC 60335‑2‑25), commercial use (covered by IEC 60335-2-90 and IEC 60335‑2-110) or laboratory use (covered by IEC 61010-2-010). This fourth edition cancels and replaces the third edition published in 2011. This edition constitutes a technical revision.<br/>
    This edition includes the following significant technical changes with respect to the previous edition:<br/>
    a) it covers not only the standby and hibernation modes, but also start-up, standby and holding power consumption, as well as other aspects of operation flexibility;<br/>
    b) more detailed descriptions of the aspects of microwave power, and handling of the A and B types of equipment.
