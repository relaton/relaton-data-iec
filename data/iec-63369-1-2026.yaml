abstract:
- language: en
  script: Latn
  content: |-
    IEC 63369-1:2026 addresses general requirements and methodology, whereas intended IEC 63369-2 and intended IEC 63369-3 address applications of the methodology and default values of the CFF parameters by geographic area (see Annex B).<br/>
    This document provides a comprehensive methodology for the calculation of carbon footprint of industrial type Li-ion battery systems from cradle to grave.<br/>
    Second life and/or usage that was not intended when the battery was put on the market is not taken into account in this document.<br/>
    This document, along with the other parts of this series, does not apply to batteries for portable, SLI and electric road vehicle traction applications. The definition of the parameters used for the carbon footprint calculation allows for comparability of results for all rechargeable Li-ion chemistries.<br/>
    Classes of representative products are defined in this document to allow comparison inside each class.<br/>
    This methodology, based on the data provided by the battery manufacturer, is mainly intended to allow a carbon footprint assessment of several battery solutions over the Cumulated Requested Service (CRS). This assessment can be used in the selection process of the battery purchaser.<br/>
    The methodology can also be used for a variety of purposes such as battery system development, eco-design and participation in voluntary or mandatory programs.<br/>
    The methodology in this document is based exclusively on attributional life cycle assessment (LCA).<br/>
    The carbon footprint calculation of charging equipment and power conversion equipment not necessary for battery functions is not covered in this document.
- language: fr
  script: Latn
  content: |-
    IEC 63369-1:2026 traite des exigences générales et de la méthodologie, tandis que l’IEC 63369-2 et l’IEC 63369-3 prévues traitent des applications de la méthodologie et des valeurs par défaut des paramètres de la FEC par zone géographique (voir Annexe B).<br/>
    Le présent document fournit une méthodologie complète permettant de calculer l’empreinte carbone pour des batteries Li-ion de type industriel, "du berceau à la tombe".<br/>
    Le présent document ne tient toutefois pas compte d’une éventuelle seconde vie et/ou de toute utilisation qui n’était pas prévue lors de la mise sur le marché de la batterie.<br/>
    Le présent document, ainsi que les autres parties de cette série, ne s’applique pas aux batteries pour applications portables, SLI et de traction de véhicules routiers électriques. La définition des paramètres utilisés pour le calcul permet la comparabilité des résultats pour toutes les chimies Li-ion rechargeables. Des classes de produits représentatifs sont définies dans le présent document pour permettre une comparaison à l’intérieur de chaque classe.<br/>
    Cette méthodologie, basée sur les données fournies par les fabricants de batteries, vise principalement à permettre une évaluation de l’empreinte carbone de différentes solutions de batterie pendant tout le service demandé cumulé (SDC). Cette évaluation peut être utilisée par l’acheteur de la batterie durant son processus de sélection.<br/>
    La méthodologie peut également être utilisée à d’autres fins telles que le développement et l’écoconception de systèmes de batterie, ainsi que la participation à des programmes volontaires ou obligatoires.<br/>
    La méthodologie du présent document repose exclusivement sur l’analyse du cycle de vie attributionnelle (ACV-A).<br/>
    Le calcul de l’empreinte carbone des équipements de recharge et des équipements de conversion de puissance non nécessaires pour les fonctions d’une batterie n’est pas couvert par le présent document.
