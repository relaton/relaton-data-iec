abstract:
- language: en
  script: Latn
  content: |-
    IEC 61514:2026 RLV contains both the official IEC International Standard and its Redline version. The Redline version is available in English only and provides you with a quick and easy way to compare all the changes between the official IEC Standard and its previous edition.<br/>
    <br/>
    IEC 61514:2026 specifies tests designed to determine the static and dynamic performance of single-acting or double-acting analogue positioners. The tests apply to positioners which receive standard analogue input signals (as specified in IEC 60381-1, IEC 60381-2 and IEC 60382) and have a pneumatic output. Positioners with pulsed or digital input signals, positioners with digital controllers and positioners with pulsed outputs are outside the scope of this document. Testing is conducted either on a positioner alone, independently of an actuator, or on a positioner mounted and connected to a specific actuator, as a combined unit. The text makes clear where different approaches are required. The methods of evaluation given in this document are intended for use by manufacturers to determine the performance of their products, and by users, or independent testing establishments, to verify manufacturers' performance specifications. The closest liaison between the evaluating body and the manufacturer is indispensable during the tests, including the possibility for the manufacturer to influence the test programme based on the manufacturer's specifications for the instrument and comment on both the test programme and the results. This document is intended to provide definitions of positioner elements, actions, and characteristics, to specify uniform methods of measuring performance errors and effects of influence quantities on those characteristics, and to describe methods of reporting and evaluating the results of the measurement data obtained. The test conditions described in this publication (for example range of ambient temperatures and power supply) relate to conditions which commonly arise in use. Consequently, the values specified are used where no other values are specified by the manufacturer or user. If other values are used, they will be stated. It is recognized that the manufacturer's specifications and instructions for installation and operation apply during all steps. The tests specified in this document are not necessarily sufficient for instruments specifically designed for unusually arduous conditions. Conversely, a reduced series of tests can serve adequately for instruments designed to perform within a more limited range of conditions. When a full evaluation, in accordance with this document, is not required or possible, only the tests which are required are performed and the results reported in accordance with the relevant parts of this document. In such cases, the test report will state that it does not cover the full number of tests specified herein. This second edition cancels and replaces the first edition published in 2000. This edition constitutes a technical revision.<br/>
    This edition includes the following significant technical changes with respect to the previous edition:<br/>
    a) in 6.6.8 and Table 5, the magnetic field has been changed from 100 A/m to of 30 A/m (Mean Root Square);<br/>
    b) 6.10.4 and Figure 9 have been modified for better understandability;<br/>
    c) in 7.4, the reference to IEC 61187 has been deleted and replaced with a new Table 4: Document information.
