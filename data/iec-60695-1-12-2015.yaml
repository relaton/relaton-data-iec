abstract:
- language: en
  script: Latn
  content: |-
    IEC 60695-1-12:2015 is intended as a general guideline for IEC Product Committees and provides:<br/>
    - an explanation of the principles and uses of fire safety engineering;<br/>
    - guidance on the use of fire safety engineering in the design of electrotechnical products;<br/>
    - fire safety engineering terminology and concepts;<br/>
    - an indication of properties, data and tests needed for input into fire safety engineering assessments and<br/>
    - informative references. This international standard is not intended to be a detailed technical design guide, but is intended to provide guidance for product committees on fire safety engineering methods and performance based test information needs for use in performance based designs and fire hazard assessments of electrotechnical materials, assemblies, products and systems.<br/>
    Key words: Fire Hazard, Fire Test Method, Fire Safety Engineering<br/>
    This publication is to be read in conjunction with IEC 60695-1-10:2009 and IEC 60695-1-11:2014.
- language: fr
  script: Latn
  content: |-
    L'IEC 60695-1-12:2015 est destinée à indiquer des lignes directrices générales pour les comités de produits de l'IEC et fournit:<br/>
    - une explication des principes et des usages de l'ingénierie de la sécurité incendie;<br/>
    - des lignes directrices relatives à l'utilisation de l'ingénierie de la sécurité incendie dans la conception des produits électrotechniques;<br/>
    - la terminologie et les concepts relatifs à l'ingénierie de la sécurité incendie;<br/>
    - une indication des propriétés, données et essais nécessaires pour alimenter les évaluations d'ingénierie de la sécurité incendie et<br/>
    - des références informatives. La présente Norme internationale n'est pas destinée à constituer un guide de conception technique détaillé, mais elle vise à fournir des lignes directrices aux comités de produits concernant les méthodes d'ingénierie de la sécurité incendie et les besoins d'informations d'essais axés sur la performance utilisables pour les conceptions axées sur la performance et les évaluations du danger du feu des matériaux, ensembles, produits et systèmes électrotechniques.<br/>
    Mots-clés: Risques du feu, méthodes d'essai au feu, Ingénierie de la sécurité du feu<br/>
    Cette publication doit être lue conjointement avec la CEI 60695-1-10:2009 et la CEI 60695-1-11:2014.
