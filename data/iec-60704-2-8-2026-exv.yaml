abstract:
- language: en
  script: Latn
  content: |-
    IEC 60704-2-8:2026 EXV contains both the international standard and its extended version (EXV). This extended version of the official IEC Standard is available in English only and provides the user with a comprehensive content of the Standard. IEC 60704-2-8:2026 EXV includes the content of the references made to IEC 60704-1:2021.<br/>
    <br/>
    IEC 60704-2-8:2026 applies to electric shavers, hair clippers or trimmers for domestic and similar use. This document does not apply to shavers, hair clippers or trimmers that are powered by means other than electrical, for example by a spring-device. If possible, this document can also be applied to analogous electrically operated devices, such as depilating devices. This third edition cancels and replaces the second edition published in 2020. This edition constitutes a technical revision.<br/>
    This edition includes the following significant technical changes with respect to the previous edition:<br/>
    a) alignment with IEC 60704-1:2021;<br/>
    b) stabilizing period and check of the battery status has been redefined;<br/>
    c) position of the appliance during test has been redefined.<br/>
    This Part 2-8 is intended to be used in conjunction with fourth edition of IEC 60704-1:2021, Household and similar electrical appliances - Test code for the determination of airborne acoustical noise - Part 1: General requirements.
