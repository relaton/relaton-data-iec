abstract:
- language: en
  script: Latn
  content: |-
    <p>This document provides guidelines for the implementation of the specific space profiles for VSEs through a set of development processes.</p>
    <p>This document is applicable to small suppliers, developers, managers and quality assurance managers of software products in the space domain.</p>
    <p>The document can also be applied by a single party through a self-imposed set of processes.</p>
    <p>This document does not prescribe a specific system or software life cycle model, development methodology, model or technique.</p>
