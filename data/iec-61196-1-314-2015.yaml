abstract:
- language: en
  script: Latn
  content: |-
    IEC 61196-1-314:2015(E) applies to coaxial communications cables. It specifies test methods to determine the bending tests for cables:<br/>
    - bending around a test mandrel;<br/>
    - repeated bending;<br/>
    - repeated flexing in service;<br/>
    - flexing in service;<br/>
    - bending around rollers or bows during installation;<br/>
    and for<br/>
    - measuring the stiffness of such a cable;<br/>
    - kink test.<br/>
    This edition includes the following significant technical change with respect to the previous edition:<br/>
    - Clause 4 (single bending test) was completely revised.
