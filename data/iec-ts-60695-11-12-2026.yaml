abstract:
- language: en
  script: Latn
  content: |-
    IEC TS 60695-11-12:2026 describes a test method intended to investigate whether the bottom part of an enclosure having openings is able to contain the burning droplets inside the enclosure if ignition occurs inside a finished unit.<br/>
    The purpose of the test is to verify whether the size of the openings in the bottom part of an enclosure are of such a size that reduces the risk of propagation of a flame outside the enclosure of a finished unit .<br/>
    This technical specification is intended to be used by technical committees in the preparation of documents in accordance with the principles laid down in IEC GUIDE 104 and ISO/IEC Guide 51. While this document currently does not have the status of a horizontal safety publication, it is intended to become one if the document is transformed into an International Standard.
