abstract:
- language: en
  script: Latn
  content: |-
    IEC 60335-2-110:2024 deals with the safety of microwave appliances intended for commercial use, their rated voltage being not more than 250 V for single-phase appliances connected between one phase and neutral and 480 V for other appliances.<br/>
    As far as is practicable, this standard deals with the common hazards presented by these types of appliances.<br/>
    Appliances covered by this standard incorporate an open-ended applicator for treatment of the load. They are divided into three types:<br/>
    - with insertion applicator, typically for moisture removal by insertion into holes in floors, walls or ceilings;<br/>
    - with large area contacting applicator, typically for drying of floors, walls or ceilings;<br/>
    - with small area contacting applicator, typically for paint removal and spot-heating.<br/>
    Microwave appliances with insertion applicator, large area contacting applicator or small area contacting applicator are using electromagnetic energy in one or several of the ISM frequency bands between 300 MHz and 30 GHz, for supplying energy to an external load which is heated so that a resulting process of drying, moisture transport which can result in forces due to formation of steam, decomposition or chemical modification, melting, or termination of organisms such as bacteria or fungus occurs.<br/>
    Appliances with insertion applicator and with large area contacting applicator are portable appliances. Appliances with small area contacting applicator are handheld appliances.<br/>
    Appliances that use non-electrical energy are within the scope of this standard. The microwave-related portion is considered motor-operated.<br/>
    The rationales for the microwave barrier and associated leakage tests are described in informative Annex AA.<br/>
    Attention is drawn to the fact that<br/>
    - these appliances can radiate microwave energy outside a restricted area where they are used. The additional requirements specified by national authorities responsible for the protection for non-ionising radiation that the limit of power flux density is 10 W/m2, averaged over any time period of 6 min, outside this restricted area is taken into consideration in this standard;<br/>
    - these appliances are intended to exclusively treat the load in normal operation, i.e. this standard does not apply to appliances or systems employing free space microwave propagation;<br/>
    - for appliances intended to be used in tropical countries, special requirements can be necessary;<br/>
    - in many countries, additional requirements are specified by the national health authorities, and national authorities responsible for the protection of labour and for non-ionising radiation protection.<br/>
    This standard does not apply to<br/>
    - household microwave ovens, including combination microwave ovens (IEC 60335-2-25);<br/>
    - commercial microwave ovens with a cavity door, commercial combination microwave ovens with a cavity door and commercial microwave ovens without a cavity door and with transportation means (IEC 60335-2-90);<br/>
    - industrial microwave heating equipment (IEC 60519-6);<br/>
    - appliances for medical purposes (IEC 60601-1);<br/>
    - appliances and equipment for laboratory use (IEC 61010 series);<br/>
    - appliances intended to be used in locations where special conditions prevail, such as the presence of a corrosive or explosive atmosphere (dust, vapour or gas);<br/>
    Some of the specifications and tests in this standard are not applicable for other than 2 450 MHz appliances.<br/>
    This second edition cancels and replaces the first edition published in 2013 and Amendment 1:2019. This edition constitutes a technical revision.<br/>
    This edition includes the following significant technical changes with respect to the previous edition:<br/>
    - Subclause 7.1 has been improved in clarity.<br/>
    - Subclauses 19.11.2 and 19.103 have been improved in clarity.<br/>
    - Clause 28 has been modified to add screw requirements.<br/>
    This part 2 is to be used in conjunction with the latest edition of IEC 60335-1 and its amendments unless that edition precludes it; in that case, the latest edition that does not preclude it is used. It was established on the basis of the sixth edition (2020) of that standard.
- language: fr
  script: Latn
  content: |-
    L'IEC 60335-2-110:2024 traite de la sécurité des appareils à micro-ondes à usage commercial dont la tension assignée est inférieure ou égale à 250 V pour les appareils monophasés raccordés entre un conducteur de phase et le conducteur de neutre, et à 480 V pour les autres appareils.<br/>
    Dans la mesure du possible, la présente norme traite des dangers courants que présentent ces types d'appareils.<br/>
    Les appareils couverts par la présente norme comportent un applicateur ouvert destiné au traitement de la charge. Ils sont classés en trois types:<br/>
    - les appareils avec applicateur par insertion, généralement destinés à l'élimination de l'humidité par insertion dans des trous au plancher, au mur ou au plafond;<br/>
    - les appareils avec applicateur par contact de grande surface, généralement destinés au séchage de planchers, murs ou plafonds;<br/>
    - les appareils avec applicateur par contact de petite surface, généralement destinés au décapage de peinture et au chauffage localisé.<br/>
    Les appareils à micro-ondes avec applicateur par insertion, applicateur par contact de grande surface ou applicateur par contact de petite surface utilisent l'énergie électromagnétique sur une ou plusieurs bandes de fréquences ISM comprises entre 300 MHz et 30 GHz pour fournir de l'énergie à une charge externe qui est chauffée de manière à assurer le séchage, où le transport d'humidité peut conduire à la génération de forces causée par la formation de vapeur, la décomposition ou la modification chimique, la fusion ou la destruction d'organismes tels que les bactéries ou les champignons.<br/>
    Les appareils avec applicateur par insertion et avec applicateur par contact de grande surface sont des appareils mobiles. Les appareils avec applicateur par contact de petite surface sont des appareils portatifs.<br/>
    Les appareils qui utilisent une énergie non électrique relèvent du domaine d'application de la présente norme. La section à micro-ondes est considérée comme un appareil à moteur.<br/>
    La justification de la barrière micro-ondes et des essais de fuite associés est décrite dans l'Annexe AA informative.<br/>
    L'attention est attirée sur le fait que<br/>
    - ces appareils peuvent rayonner de l'énergie micro-ondes à l'extérieur d'une zone restreinte, où ils sont utilisés. La présente norme prend en compte les exigences supplémentaires spécifiées par les organismes nationaux responsables de la protection contre les rayonnements non ionisants, selon lesquelles la puissance surfacique à l'extérieur de cette zone restreinte est limitée à une moyenne de 10 W/m2 par période de 6 min;<br/>
    - ces appareils sont exclusivement destinés à traiter la charge dans les conditions de fonctionnement normal; autrement dit, la présente norme ne s'applique pas aux appareils ou systèmes qui ont recours à la propagation de micro-ondes en espace libre;<br/>
    - pour les appareils destinés à être utilisés dans des pays tropicaux, des exigences particulières peuvent être nécessaires;<br/>
    - dans de nombreux pays, des exigences complémentaires sont spécifiées par les organismes nationaux de la santé publique et par les organismes nationaux responsables de la protection des travailleurs et de la protection contre les rayonnements non ionisants.<br/>
    La présente norme ne s'applique pas<br/>
    - aux fours à micro-ondes domestiques, y compris les fours à micro-ondes combinés (IEC 60335-2-25);<br/>
    - aux fours à micro-ondes à usage commercial avec porte de cavité, aux fours à micro-ondes combinés à usage commercial avec porte de cavité et aux fours à micro-ondes combinés à usage commercial sans porte de cavité et avec moyen de transport (IEC 60335-2-90);<br/>
    - aux installations de chauffage industriel à hyperfréquences (IEC 60519-6);<br/>
    - aux appareils destinés à des usages médicaux (IEC 60601-1);<br/>
    - aux appareils et équipements destinés à un usage en laboratoire (série IEC 61010);<br/>
    - aux appareils destinés à être utilisés dans des locaux qui présentent des conditions particulières, telles que la présence d'une atmosphère corrosive ou explosive (poussière, vapeur ou gaz).<br/>
    Certains des essais et spécifications cités dans la présente norme ne s'appliquent pas aux appareils qui fonctionnent à d'autres fréquences que 2 450 MHz.<br/>
    Cette deuxième édition annule et remplace la première édition parue en 2013 et l'Amendement 1:2019. Cette édition constitue une révision technique.<br/>
    Cette édition inclut les modifications techniques majeures suivantes par rapport à l'édition précédente:<br/>
    - le Paragraphe 7.1 a été amélioré pour plus de clarté;<br/>
    - les Paragraphes 19.11.2 et 19.103 ont été améliorés pour plus de clarté;<br/>
    - l'Article 28 a été modifié afin d'ajouter des exigences pour les vis.<br/>
    La présente partie 2 doit être utilisée conjointement avec la dernière édition de l'IEC 60335-1 et ses amendements sauf si cette édition l'exclut. Dans ce cas, la dernière édition qui n'exclut pas la présente partie 2 est utilisée. Elle a été établie sur la base de la sixième édition (2020) de cette norme.
