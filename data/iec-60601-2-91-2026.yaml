abstract:
- language: en
  script: Latn
  content: |-
    IEC 60601-2-91:2026 applies to the BASIC SAFETY and ESSENTIAL PERFORMANCE of NON-THERMAL PLASMA WOUND TREATMENT EQUIPMENT and NON-THERMAL PLASMA WOUND TREATMENT ACCESSORIES.<br/>
    NON-THERMAL PLASMA WOUND TREATMENT EQUIPMENT and NON-THERMAL PLASMA WOUND TREATMENT ACCESSORIES are not intended to supply heat to the PATIENT. They are used to treat chronic and acute wounds and biological tissue as well as diverse skin and itching diseases.<br/>
    HAZARDS inherent in the intended physiological function of PLASMA WOUND TREATMENT EQUIPMENT and NON-THERMAL PLASMA WOUND TREATMENT ACCESSORIES within the scope of this document are covered by specific requirements in 7.2.13 of IEC 60601-1:2005, IEC 60601-1:2005/AMD1:2012 and IEC 60601-1:2005/AMD2:2020.<br/>
    This document does not apply to ME EQUIPMENT intended for the haemostasis of biological tissue (see IEC 60601-2-2 and IEC 60601-2-76).
- language: fr
  script: Latn
  content: |-
    L'IEC 60601-2-91:2026 s'applique à la SECURITE DE BASE et aux PERFORMANCES ESSENTIELLES des APPAREILS DE TRAITEMENT DES PLAIES PAR PLASMA NON THERMIQUE et des ACCESSOIRES DE TRAITEMENT DES PLAIES PAR PLASMA NON THERMIQUE.<br/>
    Les APPAREILS DE TRAITEMENT DES PLAIES PAR PLASMA NON THERMIQUE et les ACCESSOIRES DE TRAITEMENT DES PLAIES PAR PLASMA NON THERMIQUE ne sont pas destinés à fournir de la chaleur au PATIENT. Ils sont utilisés pour traiter les plaies aiguës et chroniques, ainsi que les tissus biologiques, mais aussi différentes maladies de la peau et démangeaisons.<br/>
    Les DANGERS inhérents à la fonction physiologique prévue des appareils de traitement des plaies par plasma et des ACCESSOIRES DE TRAITEMENT DES PLAIES PAR PLASMA NON THERMIQUE compris dans le domaine d'application du présent document sont couverts par des exigences spécifiques dans le 7.2.13 de l'IEC 60601-1:2005, l'IEC 60601-1:2005/AMD1:2012 et l'IEC 60601-1:2005/AMD2:2020.<br/>
    Le présent document ne s'applique pas aux APPAREILS EM destinés à l'hémostase des tissus biologiques (voir l'IEC 60601-2-2 et l'IEC 60601-2-76).
