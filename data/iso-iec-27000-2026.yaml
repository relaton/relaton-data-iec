abstract:
- language: en
  script: Latn
  content: |-
    <p class="MsoBodyText">This document gives an overview of the concepts and principles used in the documents related to information security management systems (ISMS), including ISO/IEC 27001.</p>
    <p class="MsoBodyText">This document is considered to be a horizontal document as it provides an explanation of the concepts and principles that underpin information security and ISMS.</p>
- language: fr
  script: Latn
  content: |-
    <p>Le présent document donne une vue d'ensemble des concepts et des principes utilisés dans des documents relatifs aux systèmes de management de la sécurité de l'information (SMSI), y compris l'ISO/IEC 27001.</p>
    <p>Le présent document est pris en considération comme un document transversal, car il explique les concepts et les principes qui sous-tendent la sécurité de l'information et le SMSI.</p>
