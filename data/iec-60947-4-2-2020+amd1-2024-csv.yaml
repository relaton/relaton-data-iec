abstract:
- language: en
  script: Latn
  content: |-
    CORRECTED VERSION 2026-03<br/>
    <br/>
    IEC 60947-4-2:2020+AMD1:2024 CSV applies to semiconductor motor controllers, starters and soft-starters which can include a series mechanical switching device, intended to be connected to circuits the rated voltage of which does not exceed 1 000 V AC. This fourth edition cancels and replaces the third edition published in 2011. This edition constitutes a technical revision.<br/>
    This edition includes the following significant technical changes with respect to the previous edition:<br/>
    - scope exclusions;<br/>
    - editorial correction of notes and hanging paragraphs;<br/>
    - reference to IEC 62683-1;<br/>
    - safety aspects related to:<br/>
    - general aspects;<br/>
    - limited energy circuits;<br/>
    - electronic circuits;<br/>
    - mention of dedicated wiring accessories;<br/>
    - power consumption measurement;<br/>
    - alignment to IEC 60947-1:2020.<br/>
    The content of the corrigendum 1 (2026-03) has been included in this copy.
