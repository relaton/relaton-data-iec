abstract:
- language: en
  script: Latn
  content: |-
    IEC 60794‑1:2026 describes test procedures used to establish uniform requirements for optical fibre cables for the environmental property - underwater cable resistance to hydrostatic pressure.<br/>
    This document applies to optical fibre cables for use with telecommunication equipment and devices employing similar techniques, and to cables having a combination of both optical fibres and electrical conductors.<br/>
    See IEC 60794‑1‑2 for a reference guide to test methods of all types and for general requirements.<br/>
    This first edition cancels and replaces Method F10 of the second edition of IEC 60794‑1‑22 published in 2017. This edition constitutes a technical revision.<br/>
    This edition includes the following significant technical changes with respect to the previous edition:<br/>
    a) modification of original method F10 which becomes F10A with modification of the detailed content of apparatus, procedure and details to be specified and addition of set-up;<br/>
    b) addition of two test methods F10B and F10C to cover the different test object and procedure.
- language: fr
  script: Latn
  content: |-
    L'IEC 60794‑1:2026 décrit les procédures d’essais utilisées afin d'établir des exigences uniformes relatives aux câbles à fibres optiques pour ce qui concerne la résistance des câbles immergés à la pression hydrostatique caractéristique dans l'environnement.<br/>
    Le présent document s’applique aux câbles à fibres optiques destinés à être utilisés dans les équipements de télécommunications et les dispositifs qui utilisent des techniques analogues, ainsi qu'aux câbles constitués de fibres optiques d'une part et de conducteurs électriques d'autre part.<br/>
    Voir l’IEC 60794‑1‑2 à titre de guide de référence pour les méthodes d'essai de tous les types et concernant les exigences générales.<br/>
    Cette première édition annule et remplace la Méthode F10 de la deuxième édition de l'IEC 60794‑1‑22 parue en 2017. Cette édition constitue une révision technique.<br/>
    Cette édition inclut les modifications techniques significatives suivantes par rapport à l'édition précédente:<br/>
    a) modification de la méthode originale F10 qui devient F10A avec modification du contenu détaillé de l'appareillage, procédure et informations détaillées à spécifier et ajout du montage;<br/>
    b) ajout de deux méthodes d'essai F10B et F10C pour couvrir les différents objets d'essai et procédure d'essai.
