abstract:
- language: en
  script: Latn
  content: |-
    IEC 60947-6-2:2020 This document applies to control and protective switching devices (or equipment) (CPS), the main contacts of which are intended to be connected to circuits of rated voltage not exceeding 1 000 V AC or 1 500 V DC.<br/>
    It covers control and protective switching device (CPS):<br/>
    - which provides protective and control functions for circuits and motors;<br/>
    - where its control function is operated exclusively otherwise than by hand;<br/>
    - which provides continuity of service after over-current conditions; and<br/>
    - which can have additional functions, such as isolation or communication.<br/>
    This third edition cancels and replaces the second edition published in 2002 and its Amendment 1:2007. This edition constitutes a technical revision.<br/>
    This edition includes the following significant technical changes with respect to the previous edition:<br/>
    - editorial changes according to ISO/IEC directives Part 2,<br/>
    - alignments with IEC 60947-1:2020:<br/>
    - markings ("s", "sol", "r" or "f");<br/>
    - constructional requirements including material requirements;<br/>
    - requirements for screwless terminals;<br/>
    - measurement method of the pole impedance;<br/>
    - EMC requirement and testing;<br/>
    - procedure to determine data for electromechanical CPS’s used in functional safety applications;<br/>
    <br/>
    harmonisation with IEC 60947-2:2016:<br/>
    - operation tests of under-voltage relays and shunt releases;<br/>
    - CPS for IT systems (Annex G);<br/>
    - coordination with other short-circuit protective devices;<br/>
    <br/>
    alignments with IEC 60947-4-1:2018:<br/>
    - test at the rated conditional short-circuit current Iq of protected switching devices;<br/>
    - short-circuit tests harmonisation with North America;<br/>
    - reliability data for functional safety applications (new Annex K);<br/>
    - safety aspects related to electronic circuits and protective impedance (new Annex N);<br/>
    - introduction of provisions covering the impact of higher locked rotor current to achieve high efficiency class;<br/>
    - mention of dedicated wiring accessories;<br/>
    - definitions and measurement method of the power consumption of the control circuit during holding and pick-up operations;<br/>
    - load monitoring indicators (new Annex M).<br/>
    The contents of the corrigenda of December 2021 and June 2023 have been included in this copy.
- language: fr
  script: Latn
  content: |-
    IEC 60947-6-2:2020 s’applique aux appareils (ou au matériel) de connexion de commande et de protection (ACP), dont les contacts principaux sont destinés à être reliés à des circuits dont la tension assignée n’est pas supérieure à 1 000 V en courant alternatif ou 1 500 V en courant continu.<br/>
    Il traite des appareils de connexion de commande de protection (ACP):<br/>
    qui offrent des fonctions de protection et de commande pour les circuits et les moteurs;<br/>
    dont la fonction de commande est manœuvrée exclusivement autrement que manuellement;<br/>
    qui permettent la continuité de service après des conditions de surintensité; et<br/>
    qui peuvent avoir d’autres fonctions, telles que le sectionnement ou la communication.<br/>
    Cette troisième édition annule et remplace la deuxième édition parue en 2002 et l’Amendement 1:2007. Cette édition constitue une révision technique.<br/>
    La présente édition inclut les modifications techniques majeures suivantes par rapport à l’édition précédente:<br/>
    modifications rédactionnelles conformément à la Partie 2 des Directives ISO/IEC;<br/>
    alignements sur l’IEC 60947-1:2020:<br/>
    marquages ("s", "sol", "r" ou "f");<br/>
    exigences relatives à la construction, dont exigences relatives aux matériaux;<br/>
    exigences pour les bornes sans vis;<br/>
    méthode de mesurage de l’impédance de pôle;<br/>
    exigence et essais pour la compatibilité électromagnétique (CEM);<br/>
    procédure pour déterminer les données pour les ACP électromécaniques utilisés dans les applications de sécurité fonctionnelle;<br/>
    <br/>
    harmonisation avec l’IEC 60947-2:2016:<br/>
    essais de fonctionnement des relais et déclencheurs à bobine en dérivation à minimum de tension;<br/>
    ACP pour les schémas de mise à la terre de type IT (Annexe G);<br/>
    coordination avec les autres dispositifs de protection contre les courts-circuits;<br/>
    <br/>
    alignements sur l’IEC 60947-4-1:2018:<br/>
    essai au courant conditionnel de court-circuit assigné Iq des appareils de connexion protégés;<br/>
    harmonisation des essais de court-circuit avec l’Amérique du Nord;<br/>
    données de fiabilité pour les applications de sécurité fonctionnelle (nouvelle Annexe K);<br/>
    aspects de sécurité relatifs aux circuits électroniques et à l’impédance de protection (nouvelle Annexe N);<br/>
    introduction de dispositions traitant de l’impact des moteurs utilisant des valeurs étendues du courant de rotor bloqué pour atteindre une classe de rendement élevée;<br/>
    mention des accessoires de câblage dédiés;<br/>
    définitions et méthode de mesurage de la consommation d’énergie du circuit de commande pendant les opérations de maintien et d’appel;<br/>
    indicateurs de surveillance de la charge (nouvelle Annexe M).<br/>
    <br/>
    Le contenu du corrigendum de décembre 2021 et juin 2023 a été pris en considération dans cet exemplaire.
