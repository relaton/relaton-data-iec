- content: "L'IEC 60730-2-5:2026 s'applique aux systèmes de commande électrique automatiques
    de brûleurs pour la commande automatique de brûleurs pour fioul, gaz, charbon
    ou autres combustibles destinés à<br />\r\n- un usage domestique et analogue;<br
    />\r\n- être utilisés dans des magasins, bureaux, hôpitaux, fermes et applications
    commerciales et industrielles;<br />\r\nNOTE 1 Tout au long du présent document,
    lorsqu'ils peuvent être utilisés sans ambiguïté, le terme \"système\" signifie
    \"système de commande de brûleur\" et le terme \"systèmes\" signifie \"systèmes
    de commande de brûleur\".<br />\r\n- pour des matériels utilisés par le public,
    tels que les matériels destinés à être utilisés dans des magasins, des bureaux,
    des hôpitaux, des fermes et des applications commerciales et industrielles;<br
    />\r\nNOTE 2 Partout où il est utilisé dans le présent document, le terme \"matériel\"
    signifie \"appareil et équipement\".<br />\r\nEXEMPLE 1 Les dispositifs de commande
    pour les installations de restauration, de chauffage et d'air conditionné.<br
    />\r\n- qui sont des dispositifs de commande activés intelligents;<br />\r\nEXEMPLE 2 Les
    interfaces/contrôles distants des opérations du brûleur.<br />\r\n- qui sont des
    dispositifs de commande à courant alternatif ou continu dont la tension assignée
    ne dépasse pas 690 V en courant alternatif ou 600 V en courant continu;<br />\r\n-
    qui sont utilisés dans, sur ou avec des matériels qui utilisent l'électricité,
    le gaz, le pétrole, des combustibles solides, l'énergie thermique solaire, etc.
    ou une combinaison de ces sources d'énergie;<br />\r\n- qui sont utilisés dans
    le cadre d'un système de commande ou de dispositifs de commande qui sont mécaniquement
    intégrés à des dispositifs de commande multifonctions comportant des sorties non
    électriques;<br />\r\n- qui utilisent des thermistances CTN ou CTP ainsi qu'aux
    dispositifs à thermistances discrètes, dont les exigences sont fournies à l'Annexe
    J;<br />\r\n- à commande mécanique ou électrique, qui réagissent à des caractéristiques
    telles que la température, la pression, le passage du temps, l'humidité, la lumière,
    les effets électrostatiques, le débit ou le niveau d'un liquide, le courant, la
    tension, l'accélération, ou une combinaison de ces caractéristiques, ou qui les
    régulent;<br />\r\n- ainsi qu'aux dispositifs de commande manuels qui sont électriquement
    et/ou mécaniquement intégrés à des dispositifs de commande automatique.<br />\r\nNOTE
    3 Les exigences relatives aux interrupteurs mécaniques à action manuelle qui ne
    font pas partie d'un dispositif de commande automatique sont contenues dans l'IEC
    61058-1-1.<br />\r\nLe présent document est applicable à<br />\r\n- un système
    de commande de brûleur complet;<br />\r\n- une unité de programmation séparée;<br
    />\r\n- une source d'allumage électronique à haute tension séparée;<br />\r\n-
    un détecteur de flamme séparé et<br />\r\n- un détecteur de fonctionnement à haute
    température (HTO, High Temperature Operation) séparé,<br />\r\n- un système de
    commande de brûleur destiné à être utilisé dans les appareils de chauffage à air
    chaud (chaudières) lorsque l'appareil est équipé d'un dispositif de commande de
    pression différentielle électromécanique pour réguler la différence de pression
    de l'air de combustion (type 2.AL). Ce dispositif de commande de pression prévoit
    un commutateur comme alternative à l'un des deux éléments de commutation pour
    mettre directement hors tension les bornes relatives à la sécurité.<br />\r\nLe
    présent document ne s'applique pas aux équipements thermoélectriques de surveillance
    de flamme, ceux-ci sont couverts par l'ISO 23551-6:2021.<br />\r\nLe présent document
    s'applique également aux systèmes de commande électrique des brûleurs destinés
    exclusivement aux applications de procédés industriels, par exemple, les applications
    couvertes par le TC 244 de l'ISO (série ISO 13577).<br />\r\nLe présent document
    s'applique aux dispositifs de commande alimentés par des piles ou des accumulateurs;
    les exigences qui leur sont applicables sont contenues dans la norme.<br />\r\nLe
    présent document s'applique<br />\r\n- à la sécurité intrinsèque des systèmes
    de commande électrique automatiques des brûleurs, et<br />\r\n- à la sécurité
    fonctionnelle des systèmes de commande électrique automatiques des brûleurs,<br
    />\r\n- aux systèmes de commande électrique automatiques des brûleurs pour lesquels
    les performances (par exemple, l'effet des phénomènes CEM) du produit peuvent
    compromettre la sécurité et les performances globales du système commandé,<br
    />\r\n- aux valeurs de fonctionnement, aux temps de fonctionnement et aux séquences
    de fonctionnement dans la mesure où ils interviennent dans la sécurité du brûleur,
    ainsi qu'aux essais des systèmes de commande électrique automatiques des brûleurs
    utilisés dans, sur ou avec les brûleurs.<br />\r\nNOTE 4 Les exigences relatives
    aux valeurs de fonctionnement, temps de fonctionnement et séquences de fonctionnement
    spécifiques sont données dans les normes relatives aux appareils et matériels.<br
    />\r\nLe présent document spécifie les exigences relatives à la construction,
    au fonctionnement et aux essais des systèmes de commande électrique automatiques
    des brûleurs utilisés dans, sur ou avec du matériel.<br />\r\nLe présent document
    s'applique également aux systèmes<br />\r\n- qui comportent des dispositifs électroniques,<br
    />\r\n- qui utilisent des thermistances CTN ou CTP, dont les exigences supplémentaires
    sont fournies à l'Annexe J,<br />\r\n- à la sécurité électrique et fonctionnelle
    des dispositifs de commande capables de recevoir et de répondre à des signaux
    de communication. Les signaux peuvent être transmis par des unités externes ou
    reçus de telles unités connectées en étant câblées ou non câblées, pouvant faire
    partie ou non du système de commande de brûleur.<br />\r\nLe présent document<br
    />\r\n- ne prend pas en compte la valeur de réponse d'une action automatique d'un
    dispositif de commande, lorsque cette valeur de réponse dépend de la méthode de
    montage du dispositif de commande dans le matériel. Lorsqu'une valeur de réponse
    est importante du point de vue de la protection de l'utilisateur ou de l'environnement,
    la valeur définie dans la norme de matériel pertinente ou déterminée par le fabricant
    s'applique;<br />\r\n- ne traite pas de l'intégrité du signal de sortie transmis
    aux dispositifs de réseau, comme l'interopérabilité avec d'autres dispositifs,
    à moins qu'elle n'ait été évaluée comme partie intégrante du système de commande.<br
    />\r\nLa présente partie 2-5 est destinée à être utilisée conjointement avec l'IEC
    60730-1. Elle a été établie sur la base de la sixième édition de cette norme.
    Les éditions futures de l'IEC 60730-1 ou ses amendements pourront être pris en
    considération.<br />\r\nCette cinquième édition annule et remplace la quatrième
    édition parue en 2013, l'Amendement 1:2017 et l'Amendement 2:2021. Cette édition
    constitue une révision technique.<br />\r\nCette édition inclut les modifications
    techniques majeures suivantes par rapport à l'édition précédente:<br />\r\nadoption
    de l'IEC 60730-1:2022 avec toutes les modifications majeures par rapport à l'IEC
    60730 1:2013, y compris l'Amendement 1:2015 et l'Amendement 2:2020."
