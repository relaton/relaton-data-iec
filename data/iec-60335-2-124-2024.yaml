abstract:
- language: en
  script: Latn
  content: |-
    IEC 60335-2-124:2024 deals with the safety of dry ice blasting machines intended for commercial indoor or outdoor use for the hand-guided cleaning, decoating and stripping of surfaces. The blasting machines are either equipped with containers for storage of dry ice or produce dry ice internally. These machines are not equipped with a traction drive.<br/>
    The following power systems are covered:<br/>
    - mains powered motors up to a rated voltage of 250 V for single-phase appliances and 480 V for other appliances,<br/>
    - battery-operated machines.<br/>
    This standard does not apply to<br/>
    - dry ice blasting machines with integrated generation of compressed air;<br/>
    - dry ice blasting machines using other transport gases besides compressed air or nitrogen;<br/>
    - dry ice blasting machines with nozzles being controlled by robotic arms;<br/>
    - spray extraction machines for commercial use (IEC 60335-2-68);<br/>
    - high pressure cleaners (IEC 60335-2-79);<br/>
    - sand blasting equipment (abrasive blasting);<br/>
    - hand-held and transportable motor-operated electric tools (IEC 60745 series, IEC 61029 series, IEC 62841 series);<br/>
    - machines designed for use in corrosive or explosive environments (dust, vapour or gas);<br/>
    - machines designed for use in vehicles in non-ventilated environment;<br/>
    - machines designed for use on board of ships or aircraft.
- language: fr
  script: Latn
  content: |-
    L'IEC 60335-2-124:2024 traite de la sécurité des machines de projection de glace carbonique destinées à un usage commercial en intérieur ou en extérieur pour les applications guidées à la main suivantes: nettoyage, délaquage et décapage des surfaces. Les machines de projection sont soit équipées de réservoirs pour le stockage de la glace carbonique, soit d'un dispositif interne de production de glace carbonique. Ces machines ne sont pas équipées d'une commande de dispositif de déplacement.<br/>
    Les systèmes d'alimentation suivants sont couverts:<br/>
    - moteurs alimentés par le réseau dont la tension assignée est inférieure ou égale à 250 V pour les appareils monophasés et à 480 V pour les autres appareils;<br/>
    - machines alimentées par batteries.<br/>
    La présente norme ne s'applique pas<br/>
    - aux machines de projection de glace carbonique équipées d'un système intégré de production d'air comprimé;<br/>
    - aux machines de projection de glace carbonique qui utilisent d'autres gaz de transport que l'air comprimé ou l'azote;<br/>
    - aux machines de projection de glace carbonique équipées de buses commandées par des bras robotiques;<br/>
    - aux machines de nettoyage par pulvérisation et aspiration à usage commercial (IEC 60335 2-68);<br/>
    - aux appareils de nettoyage à haute pression (IEC 60335-2-79);<br/>
    - aux matériels de sablage (projection d'abrasif);<br/>
    - aux outils électroportatifs et portables à moteur (série IEC 60745, série IEC 61029, série IEC 62841);<br/>
    - aux machines destinées à être utilisées dans des environnements corrosifs ou explosifs (poussière, vapeur ou gaz);<br/>
    - aux machines destinées à être utilisées dans des véhicules non ventilés;<br/>
    - aux machines destinées à être utilisées à bord de navires ou d'avions.<br/>
    La présente partie 2 doit être utilisée conjointement avec la dernière édition de l'IEC 60335-1 et ses amendements sauf si cette édition l'exclut. Dans ce cas, la dernière édition qui n'exclut pas la présente partie 2 est utilisée. Elle a été établie sur la base de la sixième édition (2020) de cette norme.
