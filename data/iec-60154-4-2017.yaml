abstract:
- language: en
  script: Latn
  content: |-
    IEC 60154-4:2017 specifies the dimensions of flanges for circular waveguides for use in electronic equipment.<br/>
    It covers requirements for flanges drilled before or after mounting on waveguides.<br/>
    The aim of this document is to specify for waveguide flanges the mechanical requirements necessary to ensure compatibility and, as far as practicable, interchangeability as well as to ensure adequate electrical performance.<br/>
    This edition includes the following significant technical changes with respect to the previous edition:<br/>
    - revise the estimation for return loss at connection interface of waveguides;<br/>
    - add two type of waveguide flange for high frequency application, i.e. over 50 GHz;<br/>
    - expand the operation frequency range up to 3,3 THz;<br/>
    - rename the frequency band over R1200, i.e. R1.2K.
- language: fr
  script: Latn
  content: |-
    L'IEC 60154-4:2017 spécifie les dimensions des brides pour guides d'ondes circulaires pour utilisation dans les équipements électroniques.<br/>
    Elle couvre les exigences applicables aux brides percées avant ou après montage sur les guides d'ondes.<br/>
    Le présent document a pour but de spécifier des exigences mécaniques applicables aux brides pour guides d'ondes qui sont nécessaires pour assurer la compatibilité et, autant que possible, l'interchangeabilité, mais aussi pour assurer des performances électriques suffisantes.<br/>
    Cette édition inclut les modifications techniques majeures suivantes par rapport à l'édition précédente:<br/>
    - révision de l'estimation de l'affaiblissement de réflexion au niveau de l'interface de connexion de guides d'ondes;<br/>
    - ajout de deux types de brides de guides d'ondes pour les applications à haute fréquence, c'est-à-dire au-delà de 50 GHz;<br/>
    - extension de la plage de fréquences de travail jusqu'à 3,3 THz;<br/>
    - attribution d'un nouveau nom à la bande de fréquences R1200, à savoir R1.2K.
