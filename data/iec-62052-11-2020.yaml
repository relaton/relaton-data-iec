abstract:
- language: en
  script: Latn
  content: |-
    IEC 62052-11:2020 specifies requirements and associated tests, with their appropriate conditions for type testing of AC and DC electricity meters. This document details functional, mechanical, electrical and marking requirements, test methods, and test conditions, including immunity to external influences covering electromagnetic and climatic environments.<br/>
    This document applies to electricity metering equipment designed to:<br/>
    • measure and control electrical energy on electrical networks (mains) with voltage up to 1 000 V AC, or 1 500 V DC;<br/>
    • have all functional elements, including add-on modules, enclosed in, or forming a single meter case with exception of indicating displays;<br/>
    • operate with integrated displays (electromechanical or static meters);<br/>
    • operate with detached indicating displays, or without an indicating display (static meters only);<br/>
    • be installed in a specified matching sockets or racks;<br/>
    • optionally, provide additional functions other than those for measurement of electrical energy.<br/>
    Meters designed for operation with Low Power Instrument Transformers (LPITs as defined in the IEC 61869 series) may be tested for compliance with this document and the relevant IEC 62053 series documents only if such meters and their LPITs are tested together as directly connected meters.<br/>
    This document is also applicable to auxiliary input and output circuits, operation indicators, and test outputs of equipment for electrical energy measurement.<br/>
    This document also covers the common aspects of accuracy testing such as reference conditions, repeatability and measurement of uncertainty.<br/>
    This document does not apply to:<br/>
    • meters for which the voltage line-to-neutral derived from nominal voltages exceeds 1 000 V AC, or 1 500 V DC;<br/>
    • meters intended for connection with low power instrument transformers (LPITs as defined in the IEC 61869 series of standards) when tested without such transformers;<br/>
    • metering systems comprising multiple devices (except of LPITs) physically remote from one another;<br/>
    • portable meters;<br/>
    • meters used in rolling stock, vehicles, ships and airplanes;<br/>
    • laboratory and meter test equipment;<br/>
    • reference standard meters;<br/>
    • data interfaces to the register of the meter;<br/>
    • matching sockets or racks used for installation of electricity metering equipment;<br/>
    • any additional functions provided in electrical energy meters.<br/>
    This document does not cover measures for the detection and prevention of fraudulent attempts to compromise a meter’s performance (tampering).<br/>
    This second edition cancels and replaces the first edition published in 2003, and its amendment 1:2016. This edition constitutes a technical revision.<br/>
    This edition includes the following significant technical changes with respect to the previous edition:<br/>
    a) Removed all meter safety requirements; the meter safety requirements are covered in IEC 62052-31:2015;<br/>
    b) Included requirements for meter power consumption and voltage requirements from IEC 62053-61; IEC 62053-61 is withdrawn;<br/>
    c) Included requirements for meter symbols from IEC 62053-52; IEC 62053-52 is withdrawn;<br/>
    d) Included requirements for meter pulse output devices from IEC 62053-31; IEC 62053-31 is withdrawn;<br/>
    e) Added new requirements and tests including: meters with detached indicating displays, and meters without indicating displays, meter sealing provisions; measurement uncertainty and repeatability; time-keeping accuracy; type test report<br/>
    f) Updated and clarified acceptance criteria for testing of external influences;<br/>
    g) Revised and updated tests for immunity to electromagnetic influences and disturbances as per the latest editions of the basic EMC publications.
- language: fr
  script: Latn
  content: |-
    IEC 62052-11:2020 spécifie les exigences et essais correspondants, ainsi que leurs conditions appro-priées, pour les essais de type des compteurs d'électricité en courant alternatif et en courant continu. Le présent document décrit les exigences fonctionnelles, mécaniques, électriques et de marquage, les méthodes d'essai et les conditions d'essai, y compris en ce qui concerne l'immunité aux influences externes, couvrant les environnements électromagnétiques et climatiques.<br/>
    Le présent document s'applique aux équipements de comptage de l'électricité conçus pour:<br/>
    • mesurer et piloter l'énergie électrique sur les réseaux électriques (secteur) de tension jusqu'à 1 000 V en courant alternatif ou 1 500 V en courant continu;<br/>
    • avoir tous les éléments fonctionnels, y compris les modules complémentaires, incorporés dans ou formant un boîtier de compteur unique, à l'exception des af-ficheurs;<br/>
    • fonctionner avec des afficheurs intégrés (compteurs électromécaniques ou sta-tiques);<br/>
    • fonctionner avec des afficheurs séparés ou sans afficheur (compteurs sta-tiques);<br/>
    • être installés dans une embase ou un bâti correspondant spécifié;<br/>
    • assurer, en option, des fonctions autres que celles relatives au comptage de l'énergie électrique.<br/>
    Les compteurs conçus pour être utilisés avec des transformateurs de mesure de faible puissance (LPIT, Low Power Instrument Transformer, définis dans la série IEC 61869) ne peuvent être soumis à des essais de conformité au présent document et aux docu-ments pertinents de la série IEC 62053 que si ces compteurs et leurs LPIT sont soumis à l'essai ensemble comme des compteurs à branchement direct.<br/>
    Le présent document ne s'applique pas:<br/>
    • aux compteurs dont la tension phase-neutre déduite des tensions nominales dé-passe 1 000 V en courant alternatif ou 1 500 V en courant continu;<br/>
    • aux compteurs destinés à être connectés à des transformateurs de mesure de faible puissance (LPIT, définis dans la série de normes IEC 61869) lorsqu'ils sont soumis à l'essai sans ces transformateurs;<br/>
    • aux systèmes de comptage comprenant plusieurs dispositifs (sauf des LPIT) physi-quement éloignés les uns des autres;<br/>
    • aux compteurs portatifs;<br/>
    • aux compteurs utilisés dans le matériel roulant, les véhicules, les navires et les avions;<br/>
    • aux équipements de laboratoire et d'essai des compteurs;<br/>
    • aux compteurs étalons de référence;<br/>
    • aux interfaces de communication avec l'élément indicateur du compteur;<br/>
    • aux embases ou bâtis correspondants utilisés pour l'installation des équipements de comptage de l'électricité;<br/>
    • à toute fonction complémentaire assurée par les compteurs d'énergie électrique.<br/>
    Le présent document ne couvre pas les mesures de détection et de prévention des ten-tatives frauduleuses visant à compromettre les performances du compteur (falsification)<br/>
    Cette deuxième édition annule et remplace la première édition parue en 2003, ainsi que son amendement 1:2016. Cette édition constitue une révision technique.<br/>
    Cette édition inclut les modifications techniques majeures suivantes par rapport à l'édition précédente: voir Annex O.
