abstract:
- language: en
  script: Latn
  content: |-
    IEC 60674-3-1:2026 RLV contains both the official IEC International Standard and its Redline version. The Redline version is available in English only and provides you with a quick and easy way to compare all the changes between the official IEC Standard and its previous edition.
    <p>IEC 60674-3-1:2026 gives the requirements for biaxially oriented polypropylene film having a smooth or rough surface, corona treated when required for vacuum metallization. The films are for use as dielectric in capacitors. Materials which conform to this specification meet established levels of performance. However, the selection of a material by a user for a specific application is based on the actual requirements necessary for adequate performance in that application and not based on this specification alone. Safety warning: It is the responsibility of the user of the methods contained or referred to in this document to ensure that they are used in a safe manner.<br/>
    This third edition includes the following significant technical changes with respect to the previous edition:<br/>
    a) this document has been completely revised editorially and technically;<br/>
    b) the ranges of film thickness have been expanded;<br/>
    c) the requirements of characteristics with the films of expanded thickness have been added.</p>
