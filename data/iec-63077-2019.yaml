abstract:
- language: en
  script: Latn
  content: |-
    IEC 63077:2019 describes and defines the PROCESS of REFURBISHMENT of USED MEDICAL IMAGING EQUIPMENT and applies to the restoring of USED MEDICAL IMAGING EQUIPMENT to a condition of safety and performance comparable to that of new MEDICAL IMAGING EQUIPMENT i.e. MEDICAL IMAGING EQUIPMENT that was not in use. This restoration includes actions such as REPAIR, REWORK, software/hardware updates, and the replacement of worn parts with original parts. This document enumerates the actions, that are performed, and the manner consistent, with relevant specifications and service procedures required to ensure that the REFURBISHMENT of MEDICAL IMAGING EQUIPMENT is done without changing the finished MEDICAL IMAGING EQUIPMENT’s performance, safety specifications, or INTENDED USE according to its original or applicable valid registration.<br/>
    The MEDICAL IMAGING EQUIPMENT and systems covered by this document include:<br/>
    – X-RAY EQUIPMENT;<br/>
    – X-RAY EQUIPMENT for RADIOSCOPICALLY GUIDED INTERVENTIONAL PROCEDURES;<br/>
    – X-RAY EQUIPMENT FOR COMPUTED TOMOGRAPHY;<br/>
    – MAGNETIC RESONANCE EQUIPMENT;<br/>
    – ULTRASONIC DIAGNOSTIC EQUIPMENT;<br/>
    – GAMMA CAMERAS;<br/>
    – PLANAR WHOLEBODY IMAGING EQUIPMENT;<br/>
    – equipment for SINGLE PHOTON EMISSION COMPUTED TOMOGRAPHY (SPECT);<br/>
    – SPECT/CT hybrid systems, combining a GAMMA CAMERA with X-RAY EQUIPMENT FOR COMPUTED TOMOGRAPHY (CT);<br/>
    – POSITRON EMISSION TOMOGRAPHS (PET);<br/>
    – PET/CT hybrid systems combining a POSITRON EMISSION TOMOGRAPH with X-RAY EQUIPMENT FOR COMPUTED TOMOGRAPHY (CT);<br/>
    – PET/MRI hybrid systems combining a POSITRON EMISSION TOMOGRAPH with MAGNETIC RESONANCE EQUIPMENT: and<br/>
    – other combinations of the MEDICAL IMAGING EQUIPMENT or systems listed above.<br/>
    This document does not apply to endoscopic equipment, funduscopic equipment, radiation therapy equipment, nor associated systems.<br/>
    IEC 63077:2019 includes the following significant technical changes with respect to IEC PAS 63077:2016:<br/>
    a) the scope was delineated more clearly;<br/>
    b) an informative cross reference list of IEC 63077 vs ISO 13485 (Annex A) was added;<br/>
    c) smaller corrections were performed.
- language: fr
  script: Latn
  content: |-
    L'IEC 63077:2019 décrit et définit le PROCESSUS de RECONDITIONNEMENT des APPAREILS D’IMAGERIE MEDICALE USAGES et s’applique à redonner aux APPAREILS D’IMAGERIE MEDICALE USAGES une condition de sécurité et de performances comparable à celle d’un appareil neuf, c’est-à-dire un APPAREIL D’IMAGERIE MEDICALE qui n’a pas été utilisé. Cette restauration inclut des actions telles que la REPARATION, la RETOUCHE, les mises à jour logiciel/matériel ainsi que le remplacement des pièces usagées par des pièces d’origine. Le présent document énumère les actions qui sont réalisées en cohérence avec les spécifications et les procédures d’entretien applicables, exigées pour garantir que le RECONDITIONNEMENT d’un APPAREIL D’IMAGERIE MEDICALE est effectué sans modification des performances de l’APPAREIL D’IMAGERIE MÉDICALE fini, des spécifications de sécurité ni de l’UTILISATION PREVUE selon son enregistrement valide d’origine ou applicable.<br/>
    Les APPAREILS et systèmes D’IMAGERIE MEDICALE couverts par le présent document incluent les éléments suivants:<br/>
    – APPAREILS À RAYONNEMENT X;<br/>
    – APPAREILS A RAYONNEMENT X pour INTERVENTIONS GUIDEES PAR RADIOSCOPIE;<br/>
    – APPAREILS A RAYONNEMENT X POUR TOMODENSITOMETRIE;<br/>
    – APPAREILS À RÉSONANCE MAGNÉTIQUE;<br/>
    – APPAREILS DE DIAGNOSTIC A ULTRASONS;<br/>
    – CAMÉRAS GAMMA;<br/>
    – EQUIPEMENTS D’IMAGERIE PLANAIRE DU CORPS ENTIER;<br/>
    – appareils pour TOMODENSITOMETRIE PAR EMISSION DE PHOTONS SIMPLES (SPECT);<br/>
    – systèmes hybrides SPECT/CT, combinant une CAMERA GAMMA et un EQUIPEMENT A RAYONNEMENT X POUR TOMODENSITOMETRIE (CT);<br/>
    – TOMOGRAPHES A EMISSION DE POSITRONS (PET);<br/>
    – systèmes hybrides SPECT/CT combinant un TOMOGRAPHE A EMISSION DE POSITRONS et un EQUIPEMENT A RAYONNEMENT X POUR TOMODENSITOMETRIE (CT);<br/>
    – systèmes hybrides PET/MRI combinant un TOMOGRAPHE A EMISSION DE POSITRONS et un APPAREIL A RESONANCE MAGNETIQUE: et<br/>
    – autres combinaisons des APPAREILS ou systèmes énumérés ci-dessus.<br/>
    Le présent document ne s’applique pas aux appareils d’endoscopie, aux appareils pour fond d’œil, aux appareils de radiothérapie ni aux systèmes associés.<br/>
    L'IEC 63077:2019 inclut les modifications techniques majeures suivantes par rapport à l'édition précédente:<br/>
    a) le domaine d'application a été défini plus précisément;<br/>
    b) une liste informative des références croisées du contenu de l'IEC 63077 en regard de l'ISO 13485 a été ajoutée (Annexe A);<br/>
    c) de petites corrections ont été faites.
