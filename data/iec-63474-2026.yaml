abstract:
- language: en
  script: Latn
  content: |-
    IEC 63474:2026 specifies methods of measurement of electrical power in networked standby mode and the reporting of the results for edge equipment.<br/>
    The measurement of power and energy use in non-active mode, other than networked standby mode, is covered by IEC 62301, including the input voltage range.<br/>
    This document applies to edge equipment that is powered by:<br/>
    – low voltage mains AC power (LV ≤ 1 000 V AC), or<br/>
    – an external power supply that provides low voltage (LV ≤ 1 000 V) or extra low voltage (ELV ≤ 50 V) AC or DC power, or<br/>
    – a separate source of extra low voltage DC power (ELV ≤ 50 V DC), or<br/>
    – an internal main battery<br/>
    Conditions that are outside the scope of this document are as follows:<br/>
    – active modes (primary function)<br/>
    – other non-active modes (which are either covered by IEC 62301 or by specific product group standards),<br/>
    – conditions where main batteries are being charged other than in maintenance mode,<br/>
    – disconnected condition of the equipment.<br/>
    This document applies to the following product groups where a networked standby mode present:<br/>
    – edge equipment with a network reactivation function, such as household appliances, information technology equipment, audio, video and multimedia systems and equipment,<br/>
    – digital radio receivers with an emergency warning function,<br/>
    – gas burning equipment with electrical components.<br/>
    NOTE 1 The measurements of power, energy use and performance of products during their intended use (when performing their primary functions) are generally specified in product standards and are not covered by this document.<br/>
    NOTE 2 Interconnecting equipment (equipment that provides network infrastructure and function) is outside the scope of this document. Measurement of electrical power in networked standby mode for interconnecting equipment is the subject of ETSI standard EN 303 423.<br/>
    This document also provides a method to test power management and to test whether it is possible to deactivate wireless network connection(s).<br/>
    NOTE 4 Edge equipment can also include auxiliary batteries.<br/>
    This document has the status of a horizontal publication in accordance with IEC GUIDE 108.<br/>
    This second edition cancels and replaces the first edition published in 2023. This edition constitutes a technical revision. This edition includes the following significant technical changes with respect to the previous edition:<br/>
    - the scope and the measurement method were extended to battery operated products;<br/>
    - terms and definitions, and measurement conditions have been updated and aligned for both IEC 62301 (ED3) and this document, IEC 63474 (ED2)
