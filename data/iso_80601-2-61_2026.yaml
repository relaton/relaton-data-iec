- content: "ISO 80601-2-61:2026 Le présent document s’applique à la sécurité de base
    et aux performances essentielles des oxymètres de pouls conçus pour une utilisation
    chez les êtres humains, ci-après dénommés appareils EM. Sont inclus tous les éléments
    de l’appareil nécessaires pour une utilisation normale, y compris le moniteur
    de l’oxymètre de pouls, le capteur de l’oxymètre de pouls et le câble de raccordement
    du capteur.<br />\r\nCes exigences s’appliquent aux oxymètres de pouls, y compris
    aux moniteurs de l'oxymètre de pouls, aux capteurs de l'oxymètre de pouls et aux
    câbles de raccordement du capteur, quelle que soit leur origine (c'est-à-dire
    y compris les produits remis à neuf).<br />\r\nL’utilisation prévue des oxymètres
    de pouls inclut notamment, sans toutefois s’y limiter, l’estimation de la saturation
    en oxygène de l’hémoglobine artérielle et de la fréquence du pouls chez des patients
    en établissement de soins professionnel ainsi que chez les patients dans l’environnement
    des soins à domicile et dans l’environnement des services médicaux d’urgence.<br
    />\r\nSi un article ou un paragraphe est spécifiquement destiné à être appliqué
    uniquement aux appareils EM ou uniquement aux systèmes EM, le titre et le contenu
    dudit article ou paragraphe l'indiqueront. Si cela n'est pas le cas, l'article
    ou le paragraphe s'applique à la fois aux appareils EM et aux systèmes EM, selon
    le cas.<br />\r\nLes dangers inhérents à la fonction physiologique prévue des
    appareils EM ou des systèmes EM dans le cadre du domaine d'application du présent
    document ne sont pas couverts par des exigences spécifiques contenues dans le
    présent document, à l'exception de 201.11.1.2.2, l'IEC 60601‑1:2005+AMD1:2012+AMD2:2020,
    7.2.13 et 8.4.1.<br />\r\nNOTE 2 Voir également l'IEC 60601‑1:2005+AMD1:2012+AMD2:2020,
    4.2.<br />\r\nLe présent document peut également être appliqué aux appareils EM
    et à leurs accessoires utilisés pour l'atténuation d'une maladie, la compensation
    ou l'atténuation d'une blessure ou d'une incapacité.<br />\r\nLe présent document
    ne s’applique pas aux oxymètres de pouls destinés à être utilisés dans le cadre
    de recherches en laboratoire, de même qu’aux oxymètres nécessitant un échantillon
    de sang du patient.<br />\r\nLe présent document ne s’applique pas aux oxymètres
    de pouls destinés uniquement à la surveillance de fœtus.<br />\r\nLe présent document
    ne s'applique pas aux appareils à distance ou asservis (secondaires) qui affichent
    les valeurs de SpO2 et qui sont situés en dehors de l'environnement du patient.<br
    />\r\nNOTE 3 Il est attendu que les appareils EM qui offrent le choix entre des
    fonctions de diagnostic et de surveillance respectent les exigences appropriées
    du présent document lorsqu'ils sont configurés pour cette fonction.<br />\r\nLe
    présent document est applicable aux oxymètres de pouls destinés à être utilisés
    dans des conditions environnementales extrêmes ou non maîtrisées à l’extérieur
    de l’environnement hospitalier ou d’un cabinet de médecin, telles que dans des
    ambulances ou dans les transports aériens. Des normes supplémentaires peuvent
    s’appliquer aux oxymètres de pouls pour ces environnements d’utilisation.<br />\r\nLe
    présent document est une norme particulière de la série de normes IEC 60601-1
    et ISO et IEC 80601."
