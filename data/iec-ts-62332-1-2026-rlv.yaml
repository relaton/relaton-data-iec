abstract:
- language: en
  script: Latn
  content: |-
    IEC TS 62332-1:2026 RLV contains both the official IEC International Standard and its Redline version. The Redline version is available in English only and provides you with a quick and easy way to compare all the changes between the official IEC Standard and its previous edition.
    <p>IEC TS 62332-1:2026 specifies a dual-temperature test procedure for the thermal evaluation and qualification of electrical insulation systems (EISs). This document is applicable to EISs containing solid and liquid components where the thermal ageing factor is dominant, without restriction to voltage class. This third edition cancels and replaces the second edition published in 2011. This edition constitutes a technical revision.<br/>
    This edition includes the following significant technical changes with respect to the previous edition:<br/>
    - Modifications have been made based on an extensive test series conducted using this methodology based on the first edition. This included updating expected times and temperatures to use in order to get useful results, as well as making the range of equipment covered more broad. The method now covers electrotechnical devices using different sealing systems, as well as devices using enamel covered wires.</p>
