abstract:
- language: en
  script: Latn
  content: |-
    IEC 61300-2-50: 2026 describes a test to quantitatively assess the capability of a connector terminating a reinforced cable of any diameter or a buffered fibre, both single-mode and multimode, to withstand static loads without uncoupling of the connector, physical damage to the assembly or permanent degradation of optical performance.<br/>
    This edition includes the following significant technical changes with respect to the previous edition:<br/>
    a) addition of normative references to Clause 2;<br/>
    b) addition of the terms and definitions clause;<br/>
    c) addition of the straight pull test of pulling cap – plug – cable configuration;<br/>
    d) modification of the test procedure including provisions for hardened connectors;<br/>
    e) update of the severity of the test according to the component and performance category;<br/>
    f) addition of the details to be specified and reported clause.
- language: fr
  script: Latn
  content: |-
    L’IEC 61300-2-50:2026 décrit un essai destiné à évaluer de façon quantitative la capacité d’un connecteur raccordé à un câble renforcé de tout diamètre ou à une fibre sous revêtement protecteur, unimodale et multimodale, à supporter des charges statiques sans désaccouplement du connecteur, sans détérioration physique de l’ensemble, et sans dégradation permanente des performances optiques.<br/>
    Cette édition inclut les modifications techniques significatives suivantes par rapport à l'édition précédente:<br/>
    a) ajout de références normatives à l'Article 2;<br/>
    b) ajout de l'article relatif aux termes et définitions;<br/>
    c) ajout de l’essai de traction droite de la configuration tire-connecteur – fiche – câble;<br/>
    d) modification de la procédure d'essai, y compris des dispositions pour les connecteurs durcis;<br/>
    e) mise à jour de la sévérité de l’essai en fonction du composant et des catégories de performance;<br/>
    f) ajout d’un article sur les informations détaillées à spécifier et à consigner.
