abstract:
- language: en
  script: Latn
  content: |-
    IEC TR 62271-322: 2026 describes trends and the state-of-the-art of digital technologies enabling their use in switchgear and controlgear along their life cycle. The report is a guidance for the IEC TC17 and supported by use cases or by emerging technologies, able to be implemented in power grids. The report can be used by designers, asset managers and any stakeholder dealing with interoperable and digital technologies for a switchgear and controlgear over their whole life cycle. The document consists of three main parts.<br/>
    Clause 4 describes the trends in user exploitation of digital technologies within the switchgear and controlgear. Clause 5 focuses on trends regarding technology and consequences for system architectures. Clause 6 gives guidance for use of new technologies in substations.<br/>
    This edition includes the following significant technical changes with respect to the previous edition:<br/>
    a) IEC numbering has been modified;<br/>
    b) title has been modified;<br/>
    c) updates in the field of digital technologies, like Internet of Things, cloud and edge computing, digital twins, artificial intelligence and cybersecurity have been added; in accordance with the IEC strategy themes and goals;<br/>
    d) synchronization and updates in the context of the latest standards of TC 17: IEC 62271-1 and IEC 62271-3;<br/>
    e) Bibliography has been added.
