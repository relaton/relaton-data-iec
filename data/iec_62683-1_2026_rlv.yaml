abstract:
- content: "IEC 62683-1:2026 RLV contains both the official IEC International Standard
    and its Redline version. The Redline version is available in English only and
    provides you with a quick and easy way to compare all the changes between the
    official IEC Standard and its previous edition.<br /><br />\r\nIEC 62683-1:2026
    establishes the reference dictionary of the general description of classes of
    low-voltage switchgear and controlgear and their assemblies based on defined properties.
    This dictionary is used to facilitate the exchange in electronic format of data
    describing low voltage switchgear and controlgear, their accessories and their
    assemblies. This document provides clear and unambiguous definitions of a limited
    number of properties and classes which are mainly used for presentation, selection
    and identification of products particularly in electronic catalogues. Each property
    has an unambiguously defined meaning and name, and where relevant, a defined value
    list, a defined format, and a defined unit. Manufacturer specific features are
    not covered. This second edition cancels and replaces the first edition published
    in 2017. This edition constitutes a technical revision.<br />\r\nThis edition
    includes the following significant technical changes with respect to the previous
    edition for reflecting the content of the IEC CDD 62683DB which has been updated
    with the change requests C00073, C00074, C00081, C00087, C00089, C00098, C00100,
    C00107, C00111, C00116, C00119, C00122, C00146, C00148, C00159, C00167, C00174
    and C00135:<br />\r\na) New device class descriptions: ACC304, ACC305, ACC413,
    ACC417, ACC503, ACC504, ACC505, ACC512, ACC516, ACC536, ACC537, ACC538, ACC540,
    ACC541, ACC542, ACC543, ACC544, ACC545, ACC546, ACC547, ACC548.<br />\r\nb) New
    associated properties.<br />\r\nc) New assembly class structure: ACC101, ACC102,
    ACC103, ACC104, ACC106, ACC110, ACC111, ACC112, ACC113, ACC114, ACC115, ACC116,
    ACC117, ACC118, ACC119, ACC120, ACC121, ACC123, ACC124, ACC125, ACC126, ACC127,
    ACC131, ACC132, ACC133, ACC135, ACC141, ACC142, ACC143, ACC144, ACC145, ACC146,
    ACC147, ACC148, ACC150, ACC151, ACC152, ACC153, ACC154, ACC155, ACC156, ACC157,
    ACC158, ACC159, ACC160, ACC161, ACC162, ACC163, ACC164, ACC165, ACC166, ACC167,
    ACC170, ACC171, ACC172, ACC173, ACC174, ACC175."
