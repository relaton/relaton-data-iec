abstract:
- language: en
  script: Latn
  content: |-
    IEC 60335-2-26:2024 EXV contains both the international standard and its extended version (EXV). This extended version of the official IEC Standard is available in English only and provides the user with a comprehensive content of the Standard. IEC 60335-2-26:2024 EXV includes the content of the references made to IEC 60335-1:2020.<br/>
    <br/>
    IEC 60335-2-26:2024 deals with the safety of electric clocks having a rated voltage not more than 250 V including direct current (DC) supplied appliances and battery-operated appliances.<br/>
    Examples of appliances that are within the scope of this standard are<br/>
    – alarm clocks;<br/>
    – spring-driven clocks with an electrically operated winding mechanism;<br/>
    – clocks incorporating driving means other than motors.<br/>
    As far as is practicable, this standard deals with the common hazards presented by appliances that are encountered by all persons in and around the home.<br/>
    Attention is drawn to the fact that<br/>
    – for appliances intended to be used in vehicles or on board ships or aircraft, additional requirements can be necessary;<br/>
    – in many countries additional requirements are specified by the national health authorities, the national authorities responsible for the protection of labour and similar authorities.<br/>
    This standard does not apply to<br/>
    – appliances intended exclusively for industrial purposes;<br/>
    – appliances intended to be used in locations where special conditions prevail, such as the presence of a corrosive or explosive atmosphere (dust, vapour or gas);<br/>
    – clocks having other functions, whether or not in combination with time indication, such as master control clocks and timers for cooking ranges, washing machines and similar appliances;<br/>
    – clocks for "clocking-in" purposes;<br/>
    – clocks incorporating electronic circuits only (IEC 60065, IEC 62368-1);<br/>
    – watches.<br/>
    This fifth edition cancels and replaces the fourth edition published in 2002 and Amendment 1: 2008. This edition constitutes a technical revision.<br/>
    This edition includes the following significant technical changes with respect to the previous edition:<br/>
    a) alignment with IEC 60335-1:2020;<br/>
    b) conversion of some notes to normative text (Clause 1);<br/>
    c) application of test probe 19 (8.1.1, 20.2, B.22.3, B.22.4);<br/>
    d) introduction of limits on the temperature rise of external accessible surfaces (Clause 11).<br/>
    This part 2 is to be used in conjunction with the latest edition of IEC 60335-1 and its amendments unless that edition precludes it; in that case, the latest edition that does not preclude it is used. It was established on the basis of the sixth edition (2020) of that standard.
