abstract:
- language: en
  script: Latn
  content: |-
    IEC 60730-2-7:2026 EXV contains both the international standard and its extended version (EXV). This extended version of the official IEC Standard is available in English only and provides the user with a comprehensive content of the Standard. IEC 60730-2-7:2026 EXV includes the content of the references made to IEC 60730-1:2022.<br/>
    <br/>
    IEC 60730-2-7:2026 applies to timers and time switches:<br/>
    - for use in, on, or in association with equipment for household appliance and similar use;<br/>
    NOTE 1 Throughout this document, the word "equipment" means "appliance and equipment" and "controls" means "timer or time switches".<br/>
    NOTE 2 Throughout this document, the word "timers" means timers and time switches, unless the type is specifically mentioned.<br/>
    - for building automation within the scope of ISO 16484 series and IEC 63044 series (HBES/BACS);<br/>
    - or equipment that is used by the public, such as equipment intended to be used in shops, offices, hospitals, farms and commercial and industrial applications;<br/>
    - that are smart enabled controls;<br/>
    - that are AC or DC powered controls with a rated voltage not exceeding 690 V AC or 600 V DC;<br/>
    - utilized as part of a control system or controls which are mechanically integral with multifunctional controls having non-electrical outputs;<br/>
    - as well as manual controls when such are electrically and/or mechanically integral with automatic controls.<br/>
    NOTE 3 Requirements for manually actuated mechanical switches not forming part of an automatic control are contained in IEC 61058-1-1.<br/>
    This document applies to<br/>
    - the inherent safety of timers and time switches, and<br/>
    - functional safety of timers and time switches and safety related systems,<br/>
    - timers and time switches where the performance (for example the effect of EMC phenomena) of the product can impair the overall safety and performance of the controlled system,<br/>
    - the operating values, operating times, and operating sequences where such are associated with equipment safety,<br/>
    - timers for appliances within the scope of IEC 60335 series.<br/>
    - manual controls when such are electrically and/or mechanically integral with timers.<br/>
    This document specifies the requirements for construction, operation and testing of timers and time switches used in, on, or in association with an equipment.<br/>
    This document does not<br/>
    - apply to time-delay switches (TDS) within the scope of IEC 60669-2-3;<br/>
    - include devices which only indicate time or passage of time;<br/>
    - apply to multi-functional controls having an integrated timing function which is not capable of being tested as a separate timing device.<br/>
    This fourth edition cancels and replaces the third edition published in 2015. This edition constitutes a technical revision.<br/>
    This edition includes the following significant technical changes with respect to the previous edition:<br/>
    adoption of IEC 60730-1:2022 (Ed.6.0) with all of its significant changes to IEC 60730 1:2010 (Ed.4).<br/>
    This part 2-7 is intended to be used in conjunction with IEC 60730-1. It was established on the basis of the sixth edition of that standard (2022). Consideration can be given to future editions of, or amendments to, IEC 60730 1.<br/>
    This part 2-7 supplements or modifies the corresponding clauses in IEC 60730-1, so as to convert that publication into the IEC standard: Particular requirements for timers and time switches.<br/>
    Where this part 2-7 states "addition", "modification" or "replacement", the relevant requirement, test specification or explanatory matter in part 1 should be adapted accordingly.<br/>
    Where no change is necessary, part 2-7 indicates that the relevant clause or subclause applies
