abstract:
- language: en
  script: Latn
  content: |-
    <p>This document specifies a standard set of services that are made available by a browser so that an author can access the scene graph while it is running. Such access is designed to support inspection and modification of the scene graph.</p>
    <p>The X3D Scene Access Interface (SAI) is an abstract reference that complements the X3D Architecture by defining programming interfaces for X3D language bindings.</p>
