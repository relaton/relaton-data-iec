abstract:
- language: en
  script: Latn
  content: |-
    IEC 60704-2-1:2026 EXV contains both the international standard and its extended version (EXV). This extended version of the official IEC Standard is available in English only and provides the user with a comprehensive content of the Standard. IEC 60704-2-1:2026 EXV includes the content of the references made to IEC 60704-1:2021.<br/>
    <br/>
    IEC 60704-2-1:2026 specifies the determination of airborne acoustical noise of mains operated and cordless dry vacuum cleaners including their accessories and docking stations for household use or under conditions similar to those in households. For wet and dry vacuum cleaners, the dry cleaning function applies. The wet cleaning function is measured in accordance with IEC 60704-2-20. Particular requirements for floor cleaning robots are specified in IEC 60704-2-17 . This document describes the determination of the noise emission of dry vacuum cleaners under normal operating conditions on carpet and hard floor in accordance with IEC 62885-2. This fifth edition cancels and replaces the fourth edition published in 2020. This edition constitutes a technical revision.<br/>
    This edition includes the following significant technical changes with respect to the previous edition:<br/>
    a) alignment with IEC 60704 1:2021;<br/>
    b) addressing consumer relevant testing aspects;<br/>
    c) robustness of standards and closing potential loopholes<br/>
    d) enlarged scope to include noise measurement on docking stations.<br/>
    This document is intended to be used in conjunction with IEC 60704-1:2021, Household and similar electrical appliances - Test code for the determination of airborne acoustical noise - Part 1: General requirements.
