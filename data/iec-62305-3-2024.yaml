abstract:
- language: en
  script: Latn
  content: |-
    IEC 62305-3:2024 provides the requirements for protection of a structure against physical damage by means of a lightning protection system (LPS), and for protection against injury to human beings due to touch and step voltages in the vicinity of an LPS (see IEC 62305-1).<br/>
    This document is applicable to the:<br/>
    a) design, installation, inspection and maintenance of an LPS for structures without limitation of their height,<br/>
    b) establishment of measures for protection against injury to human beings primarily due to touch and step voltages.<br/>
    This third edition cancels and replaces the second edition published in 2010. This edition constitutes a technical revision.<br/>
    This edition includes the following significant technical changes with respect to the previous edition:<br/>
    a) Minimum thicknesses of metal sheets or metal pipes are given in Table 4 for air-termination systems where it is necessary to prevent hot-spot problems. Maximum temperature rises ΔT (K) and time duration t50 (s) for different thicknesses and long strokes are also given.<br/>
    b) Cross-reference to the IEC 62561 series is made for the use of reliable, stable, safe and appropriate LPS components.<br/>
    c) The application of two methods – general and simplified – for separation distance calculation is clarified.<br/>
    d) Some changes to the requirements for continuity of steel reinforcement are made.<br/>
    e) Annex C is revised to address comments from IEC subcommittee 31J.<br/>
    f) Revision of positioning of air-termination conductors are modified according to the three accepted methods. A more precise description of the methods for positioning of the air-termination systems are made according to the complexity of structures to be protected. The main text has been simplified, Annex A has been deleted and all detailed information has been moved to Annex D.<br/>
    g) Information on the protection of green roofs is introduced in Annex D.<br/>
    h) Information on the protection of protruding parts on facades of tall buildings is introduced in Annex D.<br/>
    i) a new definition of “electrically insulated LPS” has been introduced to distinguish it from an LPS both electrically and physically isolated from the structure, with a slight modification of the other LPS definitions.
- language: fr
  script: Latn
  content: |-
    L'IEC 62305-3:2024 spécifie les exigences pour la protection d'une structure contre les dommages physiques par un système de protection contre la foudre (SPF) et pour la protection contre les blessures d'êtres humains dues aux tensions de contact et de pas à proximité d'un SPF (voir l'IEC 62305-1).<br/>
    Le présent document s'applique:<br/>
    a) à la conception, l'installation, l'inspection et la maintenance d'un SPF pour des structures, sans limitation de leur hauteur;<br/>
    b) à la mise en œuvre de mesures pour la protection contre les blessures d'êtres humains essentiellement dues aux tensions de contact et de pas.<br/>
    Cette troisième édition annule et remplace la deuxième édition parue en 2010. Cette édition constitue une révision technique.<br/>
    Cette édition inclut les modifications techniques majeures suivantes par rapport à l'édition précédente:<br/>
    a) les épaisseurs minimales des tôles ou canalisations métalliques sont indiquées dans le Tableau 4 pour les dispositifs de capture à utiliser si des mesures de prévention contre les problèmes de points chauds se révèlent nécessaires. Les échauffements maximaux ΔT (K) et la durée t50 (s) pour différentes épaisseurs et pour des coups de longue durée sont également donnés;<br/>
    b) un renvoi à la série IEC 62561 est établi en ce qui concerne l'utilisation de composants appropriés fiables, stables et sûrs du système de protection contre la foudre (SPF);<br/>
    c) l'application de deux méthodes (générale et simplifiée) de calcul de la distance de séparation est clarifiée;<br/>
    d) certaines exigences relatives à la continuité des armatures en acier ont été modifiées;<br/>
    e) l'Annexe C est révisée pour tenir compte des remarques formulées par le sous-comité 31J de l'IEC;<br/>
    f) Le positionnement des conducteurs de capture a été révisé en fonction des trois méthodes admises. Les méthodes de positionnement des dispositifs de capture sont décrites avec davantage de précision compte tenu de la complexité des structures à protéger. Le texte principal a été simplifié, l'Annexe A a été supprimée et toutes les informations supplémentaires ont été déplacées à l'Annexe D;<br/>
    g) des informations relatives à la protection de toitures végétalisées ont été ajoutées à l'Annexe D;<br/>
    h) des informations relatives à la protection des parties saillantes sur les façades de bâtiments hauts ont été ajoutées à l'Annexe D;<br/>
    i) une nouvelle définition de la “SPF isolée électriquement” a été introduite pour la distinguer de la SPF isolée électriquement et physiquement de la structure, avec une légère modification des autres définitions de la SPF.
