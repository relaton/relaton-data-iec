abstract:
- language: en
  script: Latn
  content: |-
    IEC 60364-7-717:2026 applies to electrical installations of mobile units or transportable units.<br/>
    The requirements of this document are not applicable to:<br/>
    – generating sets;<br/>
    – pleasure craft;<br/>
    – caravans and motor caravans;<br/>
    – electrical circuits and equipment for automotive purposes.<br/>
    This third edition cancels and replaces the second edition published in 2009. This edition constitutes a technical revision. This edition includes the following significant technical changes with respect to the previous edition:<br/>
    a) The scope has been improved, providing more detail.<br/>
    b) The content of Clause 717.41 has been updated following the publication of IEC 60364-4-41:2005/AMD1:2017.<br/>
    c) Clauses concerning protection by automatic disconnection of the supply and additional protection have been added.<br/>
    d) Figures have been simplified, updated or deleted.<br/>
    e) Designation of SPD has been updated to use Tx SPD instead of Class x tested SPD.
- language: fr
  script: Latn
  content: |-
    IEC 60364-7-717:2026 s'appliquent aux installations électriques des unités mobiles ou transportables.<br/>
    Les exigences du présent document ne s'appliquent pas:<br/>
    – aux groupes générateurs;<br/>
    – aux navires de plaisance;<br/>
    – aux caravanes et camping-cars;<br/>
    – aux circuits et aux matériels électriques pour la propulsion.<br/>
    Cette troisième édition annule et remplace la deuxième édition parue en 2009 et constitue une révision technique.<br/>
    Cette édition inclut les modifications techniques majeures suivantes par rapport à l'édition précédente:<br/>
    a) le domaine d’application a été amélioré et précisé;<br/>
    b) le contenu du 717.41 a été mis à jour, suite à la publication de l'IEC 60364-4-41:2005/AMD1:2017;<br/>
    c) des articles concernant la protection par coupure automatique de l’alimentation et la protection complémentaire ont été ajoutés;<br/>
    d) les figures ont été simplifiées, mises à jour ou supprimées;<br/>
    e) la désignation du parafoudre a été mise à jour pour utiliser "parafoudre Tx" à la place de "parafoudre vérifié de classe x".
