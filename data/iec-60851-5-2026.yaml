abstract:
- language: en
  script: Latn
  content: |-
    <p>IEC 60851-5:2026 specifies the following tests:<br/>
    Test 5: Electrical resistance;<br/>
    Test 13: Breakdown voltage;<br/>
    Test 14: Continuity of insulation;<br/>
    Test 19: Dielectric dissipation factor;<br/>
    Test 23: Pin hole.<br/>
    For definitions and general notes on methods of test, Clause 3 of IEC 60851-1:2021 applies. This IEC 60851-5:2026 also specifies methods for determining the dissipation factor of enamelled winding wire, provided in Annex A. This fifth edition cancels and replaces the fourth edition published in 2008, Amendment 1:2011 and Amendment 2:2019. This edition constitutes a technical revision.<br/>
    This edition includes the following significant technical changes with respect to the previous edition:<br/>
    a) Subclauses 5.3.1 and 5.3.2 modified to expand the conductor size range for the loads applied during cylinder method testing for dielectric breakdown voltage of enameled wires and for fully insulated wires.<br/>
    b) Addition of subclause 6.5 for inline continuity testing of rectangular wire (under consideration).</p>
- language: fr
  script: Latn
  content: |-
    <p>L'IEC 60851-5:2026 spécifie les essais suivants:<br/>
    essai 5: Résistance électrique;<br/>
    essai 13: Tension de claquage;<br/>
    essai 14: Continuité de l'isolant;<br/>
    essai 19: Facteur de dissipation diélectrique;<br/>
    essai 23: Détection des microfissures en immersion.<br/>
    Pour les définitions et les remarques générales sur les méthodes d'essai, l’Article 3 de l'IEC 60851-1:2021 s’applique. L'IEC 60851-5:2026 spécifie aussi des méthodes pour la détermination du facteur de dissipation du fil de bobinage émaillé, qui sont données à l'Annexe A. Cette cinquième édition annule et remplace la quatrième édition parue en 2008, l'Amendement 1:2011 et l'Amendement 2:2019. Cette édition constitue une révision technique.<br/>
    Cette édition inclut les modifications techniques significatives suivantes par rapport à l'édition précédente:<br/>
    a) Les 5.3.1 et 5.3.2 ont été modifiés afin de couvrir la gamme de tailles de conducteur pour les charges appliquées lors des essais par la méthode du cylindre visant à évaluer la tension de claquage diélectrique des fils émaillés, ainsi que pour les fils entièrement isolés;<br/>
    b) le 6.5 a été ajouté pour les essais de continuité en ligne des fils de section rectangulaire (à l'étude).</p>
