abstract:
- language: en
  script: Latn
  content: |-
    CORRECTED VERSION 2025-11<br/><br/>IEC 60601-2-2:2017+AMD1:2023 CSV applies to the basic safety and essential performance of HF surgical equipment and HF surgical accessories.<br/>
    HF surgical equipment having a rated output power not exceeding 50 W (for example for micro-coagulation, or for use in dentistry or ophthalmology) is exempt from certain of the requirements of this particular standard. These exemptions are indicated in the relevant requirements.<br/>
    The object of this particular standard is to establish particular basic safety and essential performance requirements for HF surgical equipment and HF surgical accessories. This sixth edition cancels and replaces the fifth edition published in 2009. This edition constitutes a technical revision.<br/>
    This edition includes the following significant technical changes with respect to the previous edition:<br/>
    - refinement and additions to the defined terms;<br/>
    - additional separation of the requirements for HF surgical equipment and HF surgical accessories;<br/>
    - a new requirement for adult neutral electrodes to be contact quality monitoring neutral electrodes;<br/>
    - new requirements for devices that have or use a high current mode.<br/>
    The content of the interpretation sheet 1 of the amendment 1 (2025-11) has been included in this copy.
- language: fr
  script: Latn
  content: |-
    VERSION CORRIGEE 2025-11<br/><br/>L'IEC 60601-2-2:2017+AMD1:2023 CSV s’applique à la sécurité de base et aux performances essentielles des appareils d’électrochirurgie HF et des accessoires d'électrochirurgie HF. Les appareils d’électrochirurgie HF dont la puissance de sortie assignée est inférieure ou égale à 50 W (destinés, par exemple, à la micro coagulation, à l’ophtalmologie ou à l’usage dentaire) sont exemptés de certaines exigences de la présente norme particulière. Ces exemptions sont indiquées dans les exigences correspondantes.<br/>
    La présente norme particulière a pour objet d’établir des exigences particulières relatives à la sécurité de base et aux performances essentielles des appareils d’électrochirurgie HF et des accessoires d’électrochirurgie HF.<br/>
    Cette sixième édition annule et remplace la cinquième édition parue en 2009. Cette édition constitue une révision technique. Cette édition inclut les modifications techniques majeures suivantes par rapport à l'édition précédente:<br/>
    - des précisions et des ajouts aux termes définis;<br/>
    - une séparation supplémentaire des exigences relatives aux appareils d'électrochirurgie à courant haute fréquence (HF) et aux accessoires d'électrochirurgie à courant haute fréquence (HF);<br/>
    - une nouvelle exigence concernant les électrodes neutres adultes devant servir d'électrodes neutres de surveillance de la qualité du contact;<br/>
    - de nouvelles exigences relatives aux appareils ayant ou utilisant un mode de courant élevé.<br/>
    Le contenu de la feuille d’interprétation 1 de l'amendement 1 (2025-11) a été pris en considération dans cet exemplaire.
