abstract:
- language: en
  script: Latn
  content: |-
    IEC 62841-1:2014, Clause 1 is applicable, except as follows:<br/>
    Addition:<br/>
    This document applies to hand-held and backpack<br/>
    garden blowers;<br/>
    garden vacuums; and<br/>
    garden blower/vacuums.<br/>
    This document does not apply to<br/>
    walk-behind garden blowers, walk-behind garden vacuums and walk-behind garden blower/vacuums;<br/>
    robotic garden blowers, robotic garden vacuums and robotic garden blower/vacuums;<br/>
    vacuum cleaners intended primarily for use indoors, for water suction cleaning or animal grooming; and<br/>
    blowers intended primarily for use indoors, or animal grooming.
- language: fr
  script: Latn
  content: |-
    La clause 1 de la IEC 62841-1:2014 est applicable, sauf dans les cas suivants:<br/>
    Ajout:<br/>
    Le présent document s’applique aux appareils portatifs et aux sacs à dos<br/>
    souffleurs de jardin;<br/>
    aspirateurs de jardin; et<br/>
    souffleur/aspirateurs de jardin.<br/>
    Le présent document ne s’applique pas aux<br/>
    souffleurs de jardin à pied, aspirateurs de jardin à pied derrière et souffleurs de jardin à pied;<br/>
    souffleurs de jardin robotisés, aspirateurs de jardin robotisés et souffleurs/aspirateurs de jardin robotisés;<br/>
    les aspirateurs destinés principalement à être utilisés à l’intérieur, pour le nettoyage par aspiration d’eau ou le toilettage des animaux; et<br/>
    soufflantes destinées principalement à une utilisation à l’intérieur ou au toilettage des animaux.
