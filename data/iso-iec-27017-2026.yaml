abstract:
- language: en
  script: Latn
  content: |-
    <p>This document provides guidance for information security controls, based on ISO/IEC 27002, applicable to the provision and use of cloud services. This document provides:</p>

    additional guidance for relevant controls specified in ISO/IEC 27002:2022;
    additional controls with guidance that specifically relate to cloud services.

    <p>This document provides controls and guidance for cloud service customers (CSCs) and cloud service providers (CSPs).</p>
    <p>This document is considered to be a horizontal document as it provides a foundation and a common understanding of security regarding the provision and use of cloud services.</p>
    <p>NOTE            This document applies to all types of cloud deployment models including the private cloud. When applying this document to the private cloud, the controls and guidance of this document are applicable, although adjustments can be necessary to adapt to the relationships and abilities of an organization’s internal departments.</p>
- language: fr
  script: Latn
  content: |-
    <p>Le présent document fournit des recommandations pour les mesures de sécurité de l'information, fondées sur l'ISO/IEC 27002, qui sont applicables à la fourniture et à l'utilisation des services en nuage. Le présent document fournit:</p>

    des recommandations supplémentaires concernant les mesures de sécurité pertinentes spécifiées dans l'ISO/IEC 27002:2022;
    des mesures de sécurité supplémentaires avec des recommandations spécifiquement liées aux services d'informatique en nuage.

    <p>Le présent document fournit des mesures de sécurité et des recommandations destinées aux clients de services en nuage (CSC) et aux fournisseurs de services en nuage (CSP).</p>
    <p>Le présent document est pris en considération comme un document transversal, car il fournit une base et une vision commune de la sécurité en matière de disposition et d'utilisation des services en nuage.</p>
    <p>NOTE            Le présent document s'applique à tous les types de modèles de déploiement dans le nuage, y compris le nuage privé. Lors de l'application du présent document au nuage privé, les mesures et les recommandations du présent document sont applicables, bien que des ajustements puissent être nécessaires pour s'adapter aux relations et aux aptitudes des services internes d'un organisme.</p>
