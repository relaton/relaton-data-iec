abstract:
- language: en
  script: Latn
  content: |-
    IEC 60728-103:2026 specifies the measuring methods, performance requirements and data publication requirements for active wideband equipment of cable networks for television signals, sound signals and interactive services with digital signals only.<br/>
    This document:<br/>
    - applies to all amplifiers used in cable networks;<br/>
    - covers the frequency range 5 MHz to 3 000 MHz;<br/>
    NOTE The upper limit of 3 000 MHz is an example, but not a strict value.<br/>
    - applies to one-way and two-way equipment;<br/>
    - specifies the basic methods of measurement of the operational characteristics of the active equipment in order to assess the performance of this equipment;<br/>
    - identifies the performance specifications to be published by the manufacturers;<br/>
    - states the minimum performance requirements of certain parameters.<br/>
    While IEC 60728-3:2017 has served as a basis for its development, this document describes the methods of measurement for digital modulated signals only. It also covers the Data Over Cable Service Interface Specification (DOCSIS) 4.0 requirements with additional digital modulation schemes as well as for the extended frequency ranges:<br/>
    - up to 1 794 MHz for the forward path;<br/>
    - up to 684 MHz for the return path.<br/>
    IEC 60728-3:2017, fifth edition, has served as a basis for the development of this document.
