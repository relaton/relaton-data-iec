abstract:
- language: en
  script: Latn
  content: "IEC 60947-10:2026 applies to semiconductor circuit-breakers with a rated
    voltage up to 1 000 V AC or 1 500 V DC, intended to be installed and operated
    by instructed or skilled persons.<br />\r\nThis document covers the following
    different types:<br />\r\n- semiconductor circuit-breakers (SCCBs) having semiconductor
    switching elements and, for isolation function, mechanical isolation contacts
    connected in series;<br />\r\n- semiconductor hybrid circuit-breakers (SCHCBs)
    having semiconductor switching elements and mechanical switching elements in parallel
    and in addition, for isolation function, mechanical isolation contacts connected
    in series.<br />\r\nIn this document, where the term \"circuit-breaker\" only
    is used, it applies to both types.<br />\r\nThis document applies regardless of
    the rated currents, the method of construction or the proposed applications of
    the circuit-breakers.<br />\r\nThe object of this document is to state:<br />\r\na)
    the characteristics of circuit-breakers;<br />\r\nb) the conditions with which
    circuit-breakers shall comply with reference to:<br />\r\n1) operation and behaviour
    in normal service;<br />\r\n2) operation and behaviour under specific abnormal
    circuit conditions (e.g. overload or short-circuit);<br />\r\n3) dielectric properties;<br
    />\r\n4) requirements on electromagnetic compatibility;<br />\r\nc) tests intended
    for confirming that these conditions have been met and the methods to be adopted
    for these tests;<br />\r\nd) information to be marked on or given with the circuit-breakers."
- language: fr
  script: Latn
  content: "IEC 60947-10:2026 s'applique aux disjoncteurs à semiconducteurs dont la
    tension assignée ne dépasse pas 1 000 V en courant alternatif ou 1 500 V en courant
    continu, et qui sont destinés à être installés et utilisés par des personnes qualifiées
    ou compétentes.<br />\r\nLe présent document couvre les différents types suivants:<br
    />\r\n- les disjoncteurs à semiconducteurs (SCCB, Semiconductor Circuit-Breakers),
    qui comportent des éléments de commutation à semiconducteurs et, pour la fonction
    de sectionnement, des contacts de sectionnement mécaniques raccordés en série;<br
    />\r\n- les disjoncteurs hybrides à semiconducteurs (SCHCB, Semiconductor Hybrid
    Circuit Breakers), qui comportent des éléments de commutation à semiconducteurs
    et des éléments de commutation mécaniques en parallèle, auxquels s'ajoutent, pour
    la fonction de sectionnement, des contacts de sectionnement mécaniques raccordés
    en série.<br />\r\nDans le présent document, lorsque le terme \"disjoncteur\"
    est utilisé seul, il s'applique à ces deux types.<br />\r\nLe présent document
    s'applique indépendamment des courants assignés, les méthodes de construction
    et l'emploi prévu des disjoncteurs.<br />\r\nLe présent document a pour objet
    de spécifier:<br />\r\na) les caractéristiques des disjoncteurs;<br />\r\nb) les
    conditions auxquelles doivent satisfaire les disjoncteurs concernant:<br />\r\n1)
    leur fonctionnement et leur tenue en service normal;<br />\r\n2) leur fonctionnement
    et leur tenue dans des conditions de circuit anormales spécifiques (par exemple,
    surcharge ou court circuit);<br />\r\n3) leurs propriétés diélectriques;<br />\r\n4)
    leurs exigences de compatibilité électromagnétique;<br />\r\nc) les essais destinés
    à vérifier si ces conditions sont remplies et les méthodes à adopter pour ces
    essais;<br />\r\nd) les informations à marquer sur les disjoncteurs ou à fournir
    avec ceux-ci."
