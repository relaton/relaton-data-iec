abstract:
- language: en
  script: Latn
  content: |-
    IEC 63580:2026 provides guidance to manufacturers of measuring equipment for electrical and electromagnetic quantities (ME3Q) in evaluating and improving the environmental impact of their products, and in enabling effective communication using common references for environmental information throughout the supply chain.<br/>
    This document covers only the below fixed installed measuring equipment:<br/>
    IEC 61557-12, power metering and monitoring devices (PMD);<br/>
    IEC 62586-1, power quality instruments (PQI);<br/>
    IEC 60688, transducers (TRD);<br/>
    IEC 62974-1, devices for data management (DDM).
- language: fr
  script: Latn
  content: |-
    L'IEC 63580:2026 donne des recommandations aux fabricants d’équipements de mesure des grandeurs électriques et électromagnétiques (ME3Q), pour qu’ils puissent évaluer et améliorer l’impact environnemental de leurs produits, et pour qu’ils puissent mettre en œuvre une communication efficace des informations environnementales, qui exploite des références communes, à l’échelle de l’ensemble de la chaîne logistique.<br/>
    Le présent document couvre uniquement les équipements de mesure installés de manière permanente, énumérés ci-après:<br/>
    IEC 61557-12, dispositifs de comptage et de surveillance du réseau électrique (PMD);<br/>
    IEC 62586-1, instruments de qualité de l’alimentation (PQI);<br/>
    IEC 60688, transducteurs (TRD);<br/>
    IEC 62974-1, dispositifs de gestion de données (DDM).
