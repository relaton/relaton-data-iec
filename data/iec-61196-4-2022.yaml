abstract:
- language: en
  script: Latn
  content: |-
    IEC 61196-4:2022 applies to radiating coaxial communication cables, and specifies the terms and definitions, material and construction, IEC type designation, standard rating and characteristics, identification, marking and labelling, requirements of finished cables, quality assessment, delivery and storage, etc.<br/>
    <br/>
    This fourth edition cancels and replaces the third edition published in 2015 This edition includes the following significant technical changes with respect to the previous edition:<br/>
    a. rewrote "1 Scope" to be consistent with other blank detail specifications of coaxial cables;
    b. updated different standards in "Clause 2 Normative references";

    c. added the definitions of uniformly radiating type cable, stop frequency band and link loss;

    d. added different materials and constructions in 4.2 to 4.5;

    e. added "Clause 5 IEC type designation";

    f. added a detailed rated temperature range of different materials in "6.2 Rated temperature range";

    g. added detailed frequencies in "6.3 Operating frequency range";

    h. added "6.4 Stop frequency band" and "6.5 Radiating characteristics";

    i. added different detail requirements or typical values in 8.2.4, 8.2.7, 8.2.8, 8.4.3 to 8.4.8;

    j. deleted "7.4.4 Ovality of outer conductor";

    k. added "8.2.11 Link loss", "8.4.9 Adhesion of dielectric", "8.4.10 Shrinkage for insulations", "8.4.11 Maximum pulling force of cable";<br/>
    i. used IEC 61196-1-123 and IEC 61196-1-124 in the electrical requirements to replace Annex A and Annex B respectively and deleted Annex A and Annex B;

    m. added "Figure A.1 Example of testing coupling loss around circumferential orientation of radiating cable (Y-Z)" in Annex A.
- language: fr
  script: Latn
  content: |-
    IEC 61196-4:2022 s’applique aux câbles de communication coaxiaux rayonnants et spécifie les termes et définitions, les matériaux et la construction, la désignation de type IEC, les valeurs normalisées et les caractéristiques, l’identification, le marquage et l’étiquetage, les exigences des câbles finis, l’évaluation de la qualité, la livraison et le stockage, etc.<br/>
    <br/>
    Cette quatrième édition annule et remplace la troisième édition parue en 2015. Cette édition inclut les modifications techniques majeures suivantes par rapport à l’édition précédente:<br/>
    a. réécriture de "1 Domaine d’application" pour assurer la cohérence avec les autres spécifications particulières-cadres des câbles coaxiaux;
    b. mise à jour de différentes normes à l’Article "2 Références normatives";

    c. ajout des définitions de câble de type uniformément rayonnant, bande de fréquences d’arrêt et perte de liaison;

    d. ajout de différents matériaux et de différentes constructions en 4.2 à 4.5;

    e. ajout de l’Article "5 Désignation de type IEC";

    f. ajout d’une plage de températures assignée détaillée de différents matériaux en "6.2 Plage de températures assignée";

    g. ajout de fréquences détaillées en "6.3 Bande de fréquences opérationnelles";

    h. ajout de "6.4 Bande de fréquences d’arrêt" et "6.5 Caractéristiques de rayonnement";

    i. ajout de différentes exigences détaillées ou de valeurs types en 8.2.4, 8.2.7, 8.2.8, 8.4.3 à 8.4.8;

    j. suppression de "7.4.4 Ovalité du conducteur extérieur";

    k. ajout de "8.2.11 Perte de liaison", "8.4.9 Adhérence du diélectrique", "8.4.10 Rétraction des enveloppes isolantes", "8.4.11 Force de traction maximale du câble";<br/>
    l. utilisation de l’IEC 61196-1-123 et de l’IEC 61196-1-124 dans les exigences électriques pour remplacer les Annexes A et B, respectivement, et suppression des Annexes A et B;

    m. ajout de la "Figure A.1 Exemple d’essai d’affaiblissement de couplage autour de l’orientation circonférentielle du câble rayonnant (Y-Z)" dans l’Annexe A.
