abstract:
- language: en
  script: Latn
  content: |-
    IEC 62933-3-1:2025 is applicable to EES systems designed for grid-connected indoor or outdoor installation and operation. This document considers:<br/>
    necessary functions and capabilities of EES systems; sizing and design of EES system; operation of EES system; test items and performance assessment methods for EES systems; requirements for monitoring and acquisition of EES system operating parameters; exchange of system information and control capabilities required; maintenance of EES system. Stakeholders of this document comprise personnel involved with EES systems, which include:<br/>
    - planners of electric power systems and EES systems;<br/>
    - owners of EES systems;<br/>
    - operators of electric power systems and EES systems;<br/>
    - constructors;<br/>
    - suppliers of EES systems and its equipment;<br/>
    - aggregators.<br/>
    Use-case-specific technical documentation, including planning and installation specific tasks such as system design, monitoring, measurement, tests, operation and maintenance, are very important and can be found throughout this document.
- language: fr
  script: Latn
  content: |-
    IEC 62933-3-1:2025 s'applique aux systèmes EES connectés au réseau et conçus être installés et fonctionner en intérieur ou en extérieur. Le présent document examine:<br/>
    - les fonctions et les capacités nécessaires des systèmes EES;<br/>
    - le dimensionnement et la conception des systèmes EES;<br/>
    - le fonctionnement des systèmes EES;<br/>
    - les éléments d'essai et les méthodes d'évaluation des performances des systèmes EES;<br/>
    - les exigences pour la surveillance et l'acquisition des paramètres de fonctionnement des systèmes EES;<br/>
    - l’échange d'informations entre les systèmes et les capacités de commande exigées;<br/>
    - la maintenance des systèmes EES.<br/>
    Les parties prenantes du présent document sont le personnel impliqué dans les systèmes EES, notamment:<br/>
    - les planificateurs de réseaux d’énergie électrique et de systèmes EES;<br/>
    - les propriétaires de systèmes EES;<br/>
    - les opérateurs de réseaux d’énergie électrique et de systèmes EES;<br/>
    - les constructeurs;<br/>
    - les fournisseurs de systèmes EES et des équipements associés;<br/>
    - les agrégateurs.<br/>
    La documentation technique spécifique à chaque cas d'utilisation, y compris les tâches spécifiques à la planification et à l'installation telles que la conception, la surveillance, le mesurage, les essais, le fonctionnement et la maintenance du système, est très importante et est spécifiée tout au long du présent document
