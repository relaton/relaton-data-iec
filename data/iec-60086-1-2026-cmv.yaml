  content: |-
    <!--StartFragment -->
    <p>IEC 60086-1:2026 CMV contains both the official standard and its commented version. The commented version provides you with a quick and easy way to compare all the changes between IEC 60086-1:2026 edition 14.0 and the previous IEC 60086-1:2021 edition 13.0. Furthermore, comments from IEC TC 35 experts are provided to explain the reasons of the most relevant changes, or to clarify any part of the content.<br/>
    <br/>
    IEC 60086-1:2026 is intended to standardize primary batteries with respect to dimensions, nomenclature, terminal configurations, markings, test methods, typical performance, safety and environmental aspects. This document on one side specifies requirements for primary cells and batteries. On the other side, this document also specifies procedures of how requirements for these batteries are to be standardized. As a classification tool for primary batteries, this document specifies system letters, electrodes, electrolytes, and nominal as well as maximum open circuit voltage of electrochemical systems. The object of this part of IEC 60086 is to benefit primary battery users, device designers and battery manufacturers by ensuring that batteries from different manufacturers are interchangeable according to standard form, fit and function. Furthermore, to ensure compliance with the above, this document specifies standard test methods for testing primary cells and batteries. This document also contains requirements in Annex A of this document justifying the inclusion or the ongoing retention of batteries in the IEC 60086 series. This fourteenth edition cancels and replaces the thirteenth edition published in 2021. This edition constitutes a technical revision.<br/>
    This edition includes the following significant technical changes with respect to the previous edition:<br/>
    a) In Clause 3, terms were reordered according to their functions: basic terms, electrochemical systems, battery shapes, electrical characteristics, specifications, failure modes;<br/>
    b) New letter "T" was added in Table 1, Standardized electrochemical systems of 4.1.4 classification;<br/>
    c) Maximum open circuit voltage of letter "F" was changed from 1,83 to 1,90 V;<br/>
    d) Drawing of pulse tests with multiple load was moved from IEC 60086-2 to 5.2.2.2, Application tests with multiple loads;<br/>
    e) Annex F, Guidance for proposing value of minimum average duration was modified;<br/>
    f) Annex D of IEC 60086-2:2021, Common designation, has been transferred to Annex H of this document;<br/>
    g) Table H.1, Common designation index, was modified to provide reference to IEC 60086 2 1 and IEC 60086-2-2 for each battery;<br/>
    h) Annex I identifies the batteries of general use and the applicable tests to compare their performance, in support of Regulation (EU) 2023/1542 (Batteries Regulation).</p>
