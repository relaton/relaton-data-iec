abstract:
- language: en
  script: Latn
  content: |-
    IEC 60335-2-9:2019 deals with the safety of electric portable appliances for household and similar purposes that have a cooking function such as baking, roasting and grilling, their rated voltage being not more than 250 V.<br/>
    Examples of appliances that are within the scope of this standard are:<br/>
    – barbecues for indoor use;<br/>
    – breadmakers;<br/>
    – candy floss appliances;<br/>
    – contact grills (griddles);<br/>
    – cookers;<br/>
    – food dehydrators;<br/>
    – hotplates;<br/>
    – induction wok hotplates;<br/>
    – pop-corn makers;<br/>
    – portable ovens;<br/>
    – raclette grills;<br/>
    – radiant grills;<br/>
    – roasters;<br/>
    – rotary grills;<br/>
    – rotisseries;<br/>
    – toasters;<br/>
    – waffle irons;<br/>
    Appliances intended for normal household and similar use and that may also be used by laymen in shops, in light industry and on farms, are within the scope of this standard. However, if the appliance is intended to be used professionally to process food for commercial consumption, the appliance is not considered to be for household and similar use only.<br/>
    As far as is practicable, this standard deals with the common hazards presented by appliances that are encountered by all persons in and around the home.<br/>
    However, in general, it does not take into account<br/>
    – persons (including children) whose physical, sensory or mental capabilities or lack of experience and knowledge prevents them from using the appliance safely without supervision or instruction;<br/>
    – children playing with the appliance.<br/>
    Attention is drawn to the fact that:<br/>
    – for appliances intended to be used in vehicles or on board ships or aircraft, additional requirements could be necessary;<br/>
    – in many countries, additional requirements are specified by the national health authorities, the national authorities responsible for the protection of labour and similar authorities.<br/>
    This standard does not apply to:<br/>
    – stationary ovens and stationary grills (IEC 60335-2-6);<br/>
    – warming plates (IEC 60335-2-12);<br/>
    – frying pans and deep fat fryers (IEC 60335-2-13);<br/>
    – microwave ovens (IEC 60335-2-25);<br/>
    – barbecues for outdoor use (IEC 60335-2-78);<br/>
    – appliances intended to burn charcoal or similar combustible fuels;<br/>
    – appliances intended for commercial catering;<br/>
    – appliances intended to be used in locations where special conditions prevail, such as the presence of a corrosive or explosive atmosphere (dust, vapour or gas).<br/>
    This seventh edition cancels and replaces the sixth edition published in 2008, Amendment 1:2012 and Amendment 2:2016. This edition constitutes a technical revision.<br/>
    This edition includes the following significant technical changes with respect to the previous edition:<br/>
    – aligns the text with IEC 60335-1, Ed 5, and its Amendments 1 and 2;<br/>
    – revises the abnormal tests for a toaster (19.11.2, 19.102).<br/>
    This part 2 is to be used in conjunction with the latest edition of IEC 60335-1 and its amendments. It was established on the basis of the fifth edition (2010) of that standard.
- language: fr
  script: Latn
  content: |-
    L'IEC 60335-2-9:2019 traite de la sécurité des appareils mobiles électriques à usages domestiques et analogues ayant une fonction de cuisson telle que cuisson au four, rôtissage et grillage, et dont la tension assignée n'est pas supérieure à 250 V.<br/>
    Les appareils suivants sont des exemples d'appareils relevant du domaine d'application de la présente norme:<br/>
    – les barbecues pour utilisation à l'intérieur;<br/>
    – les machines à pain;<br/>
    – les appareils à barbe à papa;<br/>
    – les grils par contact (plaques à griller);<br/>
    – les réchauds-fours;<br/>
    – les déshydrateurs d'aliments;<br/>
    – les réchauds;<br/>
    – les réchauds wok à induction;<br/>
    – les appareils à popcorn;<br/>
    – les fours mobiles;<br/>
    – les grils à raclette;<br/>
    – les grils par rayonnement;<br/>
    – les cocottes;<br/>
    – les grils tournants;<br/>
    – les rôtissoires;<br/>
    – les grille-pain;<br/>
    – les gaufriers.<br/>
    Les appareils destinés à un usage domestique et analogue normal et qui peuvent également être utilisés par des utilisateurs non avertis dans des magasins, chez des artisans et dans des fermes, sont compris dans le domaine d'application de la présente norme. Toutefois, si l'appareil est destiné à être utilisé par des professionnels pour la préparation d'aliments à des fins commerciales, l'appareil n'est pas considéré comme étant uniquement à usage domestique et analogue.<br/>
    Dans la mesure du possible, la présente norme traite des dangers ordinaires présentés par les appareils qui sont encourus par tous les individus à l'intérieur et autour de l'habitation. Cependant, la présente norme ne tient pas compte en général<br/>
    – des personnes (y compris des enfants) dont les capacités physiques, sensorielles ou mentales ou le manque d'expérience et de connaissance les empêchent d'utiliser l'appareil en toute sécurité sans surveillance ou instruction;<br/>
    – de l'utilisation de l'appareil comme jouet par des enfants.<br/>
    L'attention est attirée sur le fait que:<br/>
    – pour les appareils destinés à être utilisés dans des véhicules ou à bord de navires ou d'avions, des exigences supplémentaires peuvent être nécessaires;<br/>
    – dans de nombreux pays, des exigences supplémentaires sont spécifiées par les organismes nationaux de la santé, par les organismes nationaux responsables de la protection des travailleurs et par des organismes similaires.<br/>
    La présente norme ne s'applique pas:<br/>
    – aux fours fixes et grils fixes (IEC 60335-2-6);<br/>
    – aux chauffe-plats (IEC 60335-2-12);<br/>
    – aux poêles à frire et aux friteuses (IEC 60335-2-13);<br/>
    – aux fours à micro-ondes (IEC 60335-2-25);<br/>
    – aux barbecues pour extérieur (IEC 60335-2-78);<br/>
    – aux appareils destinés à brûler du charbon de bois ou des combustibles similaires;<br/>
    – aux appareils à usage des collectivités;<br/>
    – aux appareils destinés à être utilisés dans des locaux présentant des conditions particulières telles que la présence d'une atmosphère corrosive ou explosive (poussière, vapeur ou gaz).<br/>
    Cette septième édition annule et remplace la sixième édition parue en 2008, l'Amendement 1:2012 et l'Amendement 2:2016. Cette édition constitue une révision technique.<br/>
    Cette édition inclut les modifications techniques majeures suivantes par rapport à l'édition précédente:<br/>
    – aligne le texte sur l'IEC 60335-1, Éd 5, et ses Amendements 1 et 2;<br/>
    – révise les essais anormaux pour les grille-pain (19.11.2, 19.102).<br/>
    La présente partie 2 doit être utilisée conjointement avec la dernière édition de l'IEC 60335-1 et ses amendements. Elle a été établie sur la base de la cinquième édition (2010) de cette norme.
