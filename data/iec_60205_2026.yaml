abstract:
- content: "IEC 60205:2026 specifies uniform rules for the calculation of the effective
    parameters of closed circuits of ferromagnetic material.<br />\r\nThis edition
    includes the following significant technical changes with respect to the previous
    edition:<br />\r\na) addition, in 5.1, of the drawing and the formulae of pair
    of URS-cores of rectangular-circular section;<br />\r\nb) using, in 5.9, 5.10,
    5.11 and 5.13, the conventional calculation formula that includes \"B1‑D\" is
    limited for the x-x cores (x is EL, ER, PQ or E) and addition new formulae for
    x‑PLT cores that replaces \"B1-D\" with \"(B1-D+B2)/2\";<br />\r\nc) addition,
    in 5.9, 5.10, 5.11 and 5.13, of formulae of l1 and l3 for x-PLT cores (x is EL,
    ER, PQ or E) which is different from the l1 and l3 of x-x cores;<br />\r\nd) addition
    of formula Amin in each subclause from 5.2.1 to 5.14."
