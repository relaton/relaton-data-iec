abstract:
- language: en
  script: Latn
  content: |-
    <p class="MsoBodyText">This document specifies a standardized method of optimizing facility provisioning within data centres by utilizing KPIs that enable the development of facility profiles for individual systems or platforms. The combination of the system and platform KPIs are used to establish a facility provisioning profile, establishing standard forecasting methods to optimize data centre resource effectiveness.</p>
    <p class="MsoBodyText">This document:</p>
    <p class="ListNumber1" style="mso-list: l0 level1 lfo1;"><!-- [if !supportLists]-->a)       <!--[endif]-->defines a method for identifying benchmarks and trends in facility provisioning;</p>
    <p class="ListNumber1" style="mso-list: l0 level1 lfo1;"><!-- [if !supportLists]-->b)       <!--[endif]-->provides capability assessment/indicators of facility infrastructure over the infrastructure life-cycle including preparatory, commissioning, expansion/contraction and/or retirement of IT equipment;</p>
    <p class="ListNumber1" style="mso-list: l0 level1 lfo1;"><!-- [if !supportLists]-->c)        <!--[endif]-->describes the relationship of DCfP to dPUE (ISO/IEC 30134-2), providing a common methodology to base dPUE.</p>
