abstract:
- language: en
  script: Latn
  content: |-
    IEC 60884-3-2:2026 applies to plugs and fixed or portable socket-outlets for AC only, incorporating electronic components to perform additional functions, with or without earthing contact, with a rated voltage greater than 50 V but not exceeding 440 V and a rated current not exceeding 32 A, intended for household and similar purposes, for use either indoors or outdoors.<br/>
    This document covers safety and Electromagnetic Compatibility (EMC) requirements for plugs and socket-outlets incorporating electronic components to perform additional functions.
