abstract:
- language: en
  script: Latn
  content: |-
    IEC TS 62607-4-9:2026, which is a Technical Specification, establishes a standardized method for assembling<br/>
    • coin-cell EDLCs<br/>
    in order to characterize the electrochemical key control characteristic of carbon nanomaterials.<br/>
    The coin-cell EDLC is fabricated through sequential steps: electrode slurry preparation (mixing), coating, rolling, cutting, weighing, and final assembly.<br/>
    • The document specifies the assembly process and data recording.<br/>
    • The document is applicable for carbon nanomaterials used in EDLC as active material or conductive agents, such as nanoporous activated carbon, carbon aerogel, carbon nanotube, carbon black, graphene, nano graphite sheet, vapour-grown carbon fibre and so on.<br/>
    • Typical application areas of this method are research, manufacturer and downstream user to guide material processing and quality control
