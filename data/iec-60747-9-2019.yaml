abstract:
- language: en
  script: Latn
  content: "IEC 60747-9:2019 specifies product specific standards for terminology,
    letter symbols, essential ratings and characteristics, verification of ratings
    and methods of measurement for insulated-gate bipolar transistors (IGBTs).<br/>\nThis
    third edition includes the following significant technical changes with respect
    to the previous edition:\n\n\treverse-blocking IGBT and its related technical
    contents have been added;\n\treverse-conducting IGBT and its related technical
    contents have been added;\n\tsome parts of the previous edition have been amended,
    combined or deleted.\n"
- language: fr
  script: Latn
  content: "L’IEC 60747-9:2019 ED3 spécifie la terminologie, les symboles littéraux,
    les valeurs assignées et caractéristiques essentielles, la vérification des valeurs
    assignées ainsi que les méthodes de mesure pour les transistors bipolaires à grille
    isolée (IGBT, <em>insulated-gate bipolar transistors</em>).<br/>\nCette édition
    inclut les modifications techniques majeures suivantes par rapport à l’édition
    précédente:\n\n\tajout de transistor bipolaire à grille isolée bloqué en inverse
    et du contenu technique associé;\n\tajout de transistor bipolaire à grille isolée
    passant en inverse et du contenu technique associé;\n\tmodification, combinaison
    ou suppression de certaines parties de l’édition précédente.\n"
