abstract:
- language: en
  script: Latn
  content: |-
    IEC 60444-11:2026 defines the standard method of measuring load resonance frequency fL at the nominal value of CL, and the determination of the effective load capacitance CLeff at the nominal frequency for crystals with the figure of merit M &gt; 4.<br/>
    This edition includes the following significant technical changes with respect to the previous edition:<br/>
    a) key content of withdrawn IEC TR 60444-4 is reproduced as Annex A;<br/>
    b) some formulae in the first edition have been corrected.
- language: fr
  script: Latn
  content: |-
    L'IEC 60444-11:2026 définit la méthode normalisée de mesure de la fréquence de résonance à la charge fL à la valeur nominale de CL et la détermination de la capacité de charge efficace CLeff à la fréquence nominale pour des résonateurs de facteur de mérite M &gt; 4.<br/>
    Cette édition inclut les modifications techniques majeures suivantes par rapport à l'édition précédente:<br/>
    a) l'essentiel du contenu de l'IEC TR 60444-4 qui a été annulé est reproduit dans l'Annexe A;<br/>
    b) certaines formules de la première édition ont été corrigées.
