abstract:
- language: en
  script: Latn
  content: |-
    IEC 60086-2-1:2026 CMV provides the user with comments from IEC TC 35 experts explaining the reasons for the most relevant changes made to IEC 60086-2:2021. These changes are listed in the Foreword.<br/>
    <br/>
    IEC 60086-2-1:2026 is applicable to primary batteries which are based on standardised electrochemical systems using aqueous electrolytes.<br/>
    It specifies:<br/>
    - the physical dimensions,<br/>
    - the discharge test conditions and discharge performance requirements.<br/>
    IEC 60086-2-1: 2026 cancels and replaces the fourteenth edition of IEC 60086 2 published in 2021. This edition constitutes a technical revision.<br/>
    This edition includes the following significant technical changes with respect to the previous edition:<br/>
    a) separation of lithium batteries into IEC 60086-2-2: Physical and electrical specifications;<br/>
    b) in Clause 3, terms were reordered according to their functions: electrochemical systems, electrical characteristics and specifications;<br/>
    c) TR03 and TR6 were added in Category 1, Round batteries;<br/>
    d) load of digital audio test for LR03, TR03 and R03 was changed from 50 mA to 75 mA and MAD was modified;<br/>
    e) personal grooming test of LR6 was added instead of high drain application test;<br/>
    f) high drain application test was added for TR6;<br/>
    g) radio /clock /remote control test was added for R6S;<br/>
    h) CD, digital audio, wireless gaming and accessories test was removed for LR6, R6P and R6S;<br/>
    i) 4,5 V of common designation was added for 3LR12, 3R12P and 3R12S;<br/>
    j) Annex D for common designation of IEC 60086 2:2021 was moved to IEC 60086 1:2026, as Annex H;<br/>
    k) Annex E for Compliance checklist of IEC 60086 2:2021 was removed and merged into Annex J of IEC 60086 1:2026.
