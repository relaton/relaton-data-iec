abstract:
- language: en
  script: Latn
  content: |-
    IEC 60704-2-7:2020 applies to electrical fans (including their accessories and their component parts) for household and similar use, designed for AC or DC supply. The motor, the impeller and their housing, if any, form a single unit. These particular requirements apply to:<br/>
    – conventional fans,<br/>
    – table fans,<br/>
    – pedestal fans,<br/>
    – ceiling fans,<br/>
    – bladeless fans,<br/>
    – wall bracket fans,<br/>
    – ceiling bracket fans,<br/>
    – louver fans,<br/>
    – tower fans,<br/>
    – ventilating and partition ventilating fans.<br/>
    This standard does not apply to:<br/>
    – fans that are part of a ventilation system,<br/>
    – fans designed exclusively for industrial purposes,<br/>
    – fans that are part of an appliance (for example cooling fans),<br/>
    – fans with additional functions (for example heating, humidifying).<br/>
    Limitations for the use of this test code are given in the scope of IEC 60704-1.<br/>
    This second edition cancels and replaces the first edition published in 1997. This edition constitutes a technical revision.<br/>
    This edition includes the following significant changes with respect to the previous edition:<br/>
    a) it includes additional fan categories as defined in IEC 60879:2019 and IEC 60665:2018;<br/>
    b) it includes standard deviations of sound power levels in 1.3;<br/>
    c) a comparison method has been added;<br/>
    d) the normative references have been updated (ISO 3744:2010 and ISO 3743-1:2010);<br/>
    e) it has been adjusted with regard to IEC 60704-1:2010.<br/>
    This International Standard is to be used in conjunction with IEC 60704 1:2010, Household and similar electrical appliances – Test code for the determination of airborne acoustical noise – Part 1: General requirements. This Part 2-7 supplements or modifies the corresponding clauses in IEC 60704-1:2010, so as to establish the test code for fans.
- language: fr
  script: Latn
  content: |-
    L'IEC 60704-2-7:2020 s'applique aux ventilateurs électriques (y compris leurs accessoires et composants) qui sont destinés à des usages domestiques et analogues et conçus pour une alimentation en courant alternatif ou en courant continu. Le moteur, les pales et leur boîtier, le cas échéant, constituent un bloc. Ces exigences particulières s'appliquent aux:<br/>
    – ventilateurs conventionnels;<br/>
    – ventilateurs de table;<br/>
    – ventilateurs sur pied;<br/>
    – ventilateurs de plafond;<br/>
    – ventilateurs sans pales;<br/>
    – ventilateurs à applique murale;<br/>
    – ventilateurs à applique au plafond;<br/>
    – ventilateurs rotatifs;<br/>
    – ventilateurs à colonne;<br/>
    – aérateurs et aérateurs de cloison.<br/>
    La présente norme ne s'applique pas aux:<br/>
    – ventilateurs qui font partie intégrante d'un système de ventilation;<br/>
    – ventilateurs conçus exclusivement pour des usages industriels;<br/>
    – ventilateurs qui font partie d'un appareil (par exemple les ventilateurs de refroidissement);<br/>
    – ventilateurs avec des fonctions supplémentaires (par exemple chauffage, humidification).<br/>
    Les limites d'utilisation de ce code d'essai sont données dans le domaine d'application de l'IEC 60704-1.<br/>
    Cette deuxième édition annule et remplace la première édition parue en 1997. Cette édition constitue une révision technique.<br/>
    Cette édition inclut les modifications majeures suivantes par rapport à l'édition précédente:<br/>
    a) elle inclut des catégories de ventilateurs supplémentaires, définies dans l'IEC 60879:2019 et l'IEC 60665:2018;<br/>
    b) des écarts-types sont fournis pour les niveaux de puissance acoustique en 1.3;<br/>
    c) une méthode comparative a été ajoutée;<br/>
    d) les références normatives ont été mises à jour (ISO 3744:2010 et ISO 3743-1:2010);<br/>
    e) le présent document a fait l'objet de réajustements par rapport à l'IEC 60704-1:2010.<br/>
    Cette Norme Internationale doit être utilisée conjointement avec l'IEC 60704-1:2010, Appareils électrodomestiques et analogues – Code d'essai pour la détermination du bruit aérien – Partie 1: Règles générales. La présente Partie 2-7 complète ou modifie les articles correspondants de l'IEC 60704-1:2010 de façon à établir le code d'essai pour les ventilateurs.
