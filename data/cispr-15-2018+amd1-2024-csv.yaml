abstract:
- language: en
  script: Latn
  content: |-
    CORRECTED VERSION 2026-05<br/>
    <br/>
    CISPR 15:2018+AMD1:2024 CSV applies to the emission (radiated and conducted) of radiofrequency disturbances from:<br/>
    - lighting equipment (3.3.16);<br/>
    - the lighting part of multi-function equipment where this lighting part is a primary function;<br/>
    - UV and IR radiation equipment for residential and non-industrial applications;<br/>
    - advertising signs;<br/>
    - decorative lighting;<br/>
    - emergency signs.<br/>
    Excluded from the scope of this document are:<br/>
    - components or modules intended to be built into lighting equipment and which are not user-replaceable;<br/>
    - lighting equipment operating in the ISM frequency bands (as defined in Resolution 63 (1979) of the ITU Radio Regulation);<br/>
    - lighting equipment for aircraft and airfield facilities (runways, service facilities, platforms);<br/>
    - video signs;<br/>
    - installations;<br/>
    - equipment for which the electromagnetic compatibility requirements in the radio-frequency range are explicitly formulated in other CISPR standards, even if they incorporate a built-in lighting function.<br/>
    The frequency range covered is 9 kHz to 400 GHz. No measurements need to be performed at frequencies where no limits are specified in this document.<br/>
    Multi-function equipment which is subjected simultaneously to different clauses of this document and/or other standards need to meet the provisions of each clause/standard with the relevant functions in operation.<br/>
    For equipment outside the scope of this document and which includes lighting as a secondary function, there is no need to separately assess the lighting function against this document, provided that the lighting function was operative during the assessment in accordance with the applicable standard. The radiated emission requirements in this document are not intended to be applicable to the intentional transmissions from a radio transmitter as defined by the ITU, nor to any spurious emissions related to these intentional transmissions.<br/>
    Within the remainder of this document, wherever the term "lighting equipment" or "EUT" is used, it is meant to be the electrical lighting and similar equipment falling in the scope of this document as specified in this clause. This ninth edition cancels and replaces the eighth edition published in 2013 and its Amendment 1:2015. This edition constitutes a technical revision. This edition includes the following significant technical changes with respect to the previous edition:<br/>
    a) full editorial revision and restructuring;<br/>
    b) the restriction to mains and battery operation is deleted in the scope;<br/>
    c) radiated disturbance limits in the frequency range 300 MHz to 1 GHz have been introduced;<br/>
    d) the load terminals limits and the CDNE (alternative to radiated emissions) limits have changed;<br/>
    e) deletion of the insertion-loss requirements and the associated Annex A;<br/>
    f) introduction of three basic ports: wired network ports, local wired ports and the enclosure port;<br/>
    g) introduction of a more technology-independent approach;<br/>
    h) replacement of Annex B (CDNE) by appropriate references to CISPR 16-series of standards;<br/>
    i) modified requirements for the metal holes of the conical housing;<br/>
    j) new conducted disturbance measurement method for GU10 self-ballasted lamp;<br/>
    k) addition of current probe measurement method and limits for various types of ports (in addition to voltage limits and measurement methods);<br/>
    l) introduction of the term ‘module’ (instead of independent auxiliary) and requirements for measurement of modules using a host (reference) system;<br/>
    m) modified specifications for stabilization times of EUTs;<br/>
    n) for large EUT (&gt; 1,6 m), addition of the magnetic field measurement method using a 60 cm loop antenna at 3 m distance (method from CISPR 14-1) as an alternative to the 3 m and 4 m LAS.<br/>
    Keywords: emission (radiated and conducted) of radiofrequency disturbance<br/>
    The contents of the Interpretation sheet 1 (2026-05) and Interpretation sheet (2026-05) of amendment 1 have been included in this copy.
