abstract:
- language: en
  script: Latn
  content: |-
    IEC 62674-1:2026 applies to fixed surface mount inductors and fixed surface mount ferrite beads. The object of this document is to define the terms necessary to describe the inductors covered by this document, provide recommendations for preferred characteristics, recommended performance, test methods and general guidance.<br/>
    This edition includes the following significant technical changes with respect to the previous edition:<br/>
    a) addition of dimensions for shape D;<br/>
    b) addition of upper temperature for operating temperature ranges.
- language: fr
  script: Latn
  content: |-
    L'IEC 62674-1:2026 s'applique aux bobines d'inductance fixes à montage en surface et aux perles de ferrite fixes à montage en surface. Le présent document a pour objet de définir les termes nécessaires pour décrire les bobines d'inductance couvertes par le présent document, donner les recommandations pour les caractéristiques préférentielles, les performances recommandées, les méthodes d'essai et les lignes directrices générales.<br/>
    Cette édition inclut les modifications techniques majeures suivantes par rapport à l'édition précédente:<br/>
    a) ajout de dimensions pour la forme D;<br/>
    b) ajout d'une température supérieure pour les gammes de températures de fonctionnement.
