abstract:
- language: en
  script: Latn
  content: |-
    IEC 62443-4-2:2019 provides detailed technical control system component requirements (CRs) associated with the seven foundational requirements (FRs) described in IEC TS 62443-1-1 including defining the requirements for control system capability security levels and their components, SL-C(component).<br/>
    As defined in IEC TS 62443-1-1 there are a total of seven foundational requirements (FRs):<br/>
    a) identification and authentication control (IAC),<br/>
    b) use control (UC),<br/>
    c) system integrity (SI),<br/>
    d) data confidentiality (DC),<br/>
    e) restricted data flow (RDF),<br/>
    f) timely response to events (TRE), and<br/>
    g) resource availability (RA).<br/>
    These seven FRs are the foundation for defining control system security capability levels. Defining security capability levels for the control system component is the goal and objective of this document as opposed to SL-T or achieved SLs (SL-A), which are out of scope.<br/>
    The contents of the corrigendum of August 2022 have been included in this copy.
- language: fr
  script: Latn
  content: |-
    IEC 62443-4-2:2019 indique les exigences relatives au composant (CR) d'un système de commande technique ainsi que les sept exigences fondamentales (FR) décrites dans l'IEC TS 62443-1-1, y compris la définition des exigences relatives aux niveaux de sécurité de capacité des systèmes de commande et à leurs composants, SL-C(composant).<br/>
    Comme l'indique l'IEC TS 62443-1-1, il existe en tout sept exigences fondamentales (FR):<br/>
    a) contrôle d'identification et d'authentification (IAC),<br/>
    b) contrôle d'utilisation (UC),<br/>
    c) intégrité du système (SI),<br/>
    d) confidentialité des données (DC),<br/>
    e) transfert de données limité (RDF),<br/>
    f) réponse appropriée aux événements (TRE), et<br/>
    g) disponibilité des ressources (RA).<br/>
    Ces sept exigences fondamentales sont à la base de la définition des niveaux de capacité de sécurité des systèmes de commande. Le présent document a pour objet de définir les niveaux de capacité de sécurité du composant du système de commande, par opposition au SL-T ou aux niveaux de sécurité atteints (SL-A), qui n'entrent pas dans le domaine d'application.<br/>
    Le contenu du corrigendum d'août 2022 a été pris en considération dans cet exemplaire.
