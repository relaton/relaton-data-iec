abstract:
- language: en
  script: Latn
  content: |-
    IEC 61892-7:2019 provides requirements for hazardous area classification and selection of electrical equipment and installation in hazardous areas in mobile and fixed offshore units, including pipeline, pumping or "pigging" stations, compressor stations and single buoy moorings, used in the offshore petroleum industry for drilling, production, accommodation, processing, storage and offloading purposes.<br/>
    It applies to all installations, whether permanent, temporary, transportable or personal, to AC installations and DC installations without any voltage level limitation. Referenced equipment standards may give voltage level limitations.<br/>
    This document is based on the requirements of International Standards developed by IEC TC 31 regarding area classification and requirements as to installations in hazardous areas and gives additional requirements for installations on mobile and fixed offshore units.<br/>
    This document specifies requirements such as those concerning<br/>
    – area classification,<br/>
    – electrical systems,<br/>
    – selection of electrical equipment,<br/>
    – cables and wiring systems,<br/>
    – ventilation,<br/>
    – ventilation requirement for battery compartments, and<br/>
    – inspection, maintenance, repair and overhaul.<br/>
    This document gives information on topics such as<br/>
    – gas detection systems, and<br/>
    – electrical installations in extremely low ambient temperatures.<br/>
    This document does not apply to<br/>
    – fixed equipment for medical purposes,<br/>
    – electrical installations of tankers, and<br/>
    – control of ignition sources other than those created by electrical equipment.<br/>
    This fourth edition cancels and replaces the third edition published in 2014. This edition constitutes a technical revision.<br/>
    This edition includes the following significant technical changes with respect to the previous edition:<br/>
    a) the document has been completely rewritten. References are, to the extent possible, made to IEC 60079-14 and to other relevant standards, as appropriate, from IEC TC 31; only requirements concerning offshore installations that deviate from the general requirements for installations in hazardous areas are given;<br/>
    b) requirements as to gas detection have been transferred to an informative annex;<br/>
    c) requirements concerning emergency shutdown (ignition source control) have been transferred to IEC 61892-1.
- language: fr
  script: Latn
  content: |-
    L'IEC 61892-7:2019 donne les exigences relatives à la classification des espaces dangereux et au choix des équipements et installations électriques dans les emplacements dangereux dans les unités mobiles et fixes en mer, y compris les canalisations, les stations de pompage ou de raclage, les stations de compression et les systèmes d'amarrage à point unique, qui sont utilisés dans l'industrie pétrolière en mer (offshore) pour le forage, la production, les lieux d'habitation, le traitement, le stockage et le déchargement.<br/>
    Elle s'applique à toutes les installations, qu'elles soient permanentes ou provisoires, transportables ou personnelles, aux installations en courant alternatif et aux installations en courant continu sans aucune limitation du niveau de tension. Les normes des équipements référencés peuvent fournir des limites de niveau de tension.<br/>
    Le présent document s'appuie sur les exigences issues de normes développées par le Comité d'études 31 de l'IEC relatives à la classification des emplacements et aux exigences en matière d'installations dans les emplacements dangereux. Il donne des exigences supplémentaires relatives aux installations sur des unités mobiles et fixes en mer.<br/>
    Le présent document spécifie des exigences pour<br/>
    – la classification des espaces,<br/>
    – les systèmes électriques,<br/>
    – le choix des équipements électriques,<br/>
    – les câbles et les systèmes de câblage,<br/>
    – la ventilation,<br/>
    – les exigences de ventilation pour compartiments à batteries, et<br/>
    – l'inspection, la maintenance, la réparation et la révision.<br/>
    Le présent document donne des informations sur des sujets tels que<br/>
    – les systèmes de détection de gaz, et<br/>
    – les installations électriques à des températures ambiantes extrêmement basses.<br/>
    Le présent document ne s'applique pas<br/>
    – aux équipements fixes destinés aux applications médicales,<br/>
    – aux installations électriques des navires-citernes, et<br/>
    – au contrôle des sources d'incendie autres que celles générées par l'équipement électrique.<br/>
    Cette quatrième édition annule et remplace la troisième édition parue en 2014. Cette édition constitue une révision technique.<br/>
    Cette édition inclut les modifications techniques majeures suivantes par rapport à l'édition précédente:<br/>
    a) le document a été intégralement réécrit; dans toute la mesure du possible, il est fait référence à l'IEC 60079-14 et à d'autres normes pertinentes du Comité d'études 31 de l'IEC; seules les exigences relatives aux installations en mer qui s'écartent des exigences générales relatives aux installations dans des emplacements dangereux sont données;<br/>
    b) les exigences en matière de détection de gaz ont été déplacées dans une annexe informative;<br/>
    c) les exigences en matière d'arrêt d'urgence (gestion des sources d'inflammation) ont été déplacées vers l'IEC 61892-1.
