abstract:
- language: en
  script: Latn
  content: |-
    IEC 62828-1:2026 RLV contains both the official IEC International Standard and its Redline version. The Redline version is available in English only and provides you with a quick and easy way to compare all the changes between the official IEC Standard and its previous edition.<br/>
    <br/>
    IEC 62828-1:2026 establishes a general framework for defining reference conditions and test procedures applicable for assessing the measurement performances of all types of industrial and process measurement transmitters (PMTs) used in measuring and control systems for industrial process and machinery. For the purpose of this document, an analogue PMT is a process measurement transmitter with only analogue current and/or voltage output(s), irrespective the technology adopted and the complexity of the circuitry. All the other process measurement transmitters, with digital output(s) only or with hybrid analogue and digital output(s), are considered to be digital PMTs. This document constitutes a common reference for the other parts of the IEC 62828 series. Specific test procedures and additional requirements for given types of PMTs (pressure, temperature, level, flow, etc.) are covered by other parts of this series. Sensing devices according to the IEC 60947 series are excluded from the scope of this document.<br/>
    NOTE 1 In industrial and process applications, to indicate the process measurement transmitters, it is common also to use the terms "industrial transmitters", or "process transmitters".<br/>
    NOTE 2 For better clarity, when the complete definition "industrial and process measurement transmitter" makes the sentence too long in this document, the short term "transmitter", or PMT, is used instead.<br/>
    This second edition cancels and replaces the first edition published in 2017. This edition constitutes a technical revision.<br/>
    This edition includes the following significant technical changes with respect to the previous edition:<br/>
    a) informative Annexes E, F, G and H have been removed;<br/>
    b) a new informative Annex G “Example of signal current for a 4 mA to 20 mA PMT” has been introduced (it has been moved from IEC 62828-2:2017 to this document);<br/>
    c) the definitions of warm-up time, settling time and output signal have been moved from IEC 62828-4:2020 to this document;<br/>
    d) The definitions of “inaccuracy” and “accuracy” have been reworked;<br/>
    e) The clause regarding test report has been reworked.
