abstract:
- language: en
  script: Latn
  content: |-
    IEC 60947-6-1:2026 RLV contains both the official IEC International Standard and its Redline version. The Redline version is available in English only and provides you with a quick and easy way to compare all the changes between the official IEC Standard and its previous edition.
    <p>IEC 60947-6-1:2026 applies to transfer switching equipment (TSE), to be used in power systems for ensuring the continuity of the supply and allowing the energy management of the installation, by transferring a load between power supply sources, the rated voltage of which does not exceed 1 000 V AC or 1 500 V DC. Specific requirements for bypass/isolation transfer switch equipment are given in Annex C, ATSE having closed transition capability are given in Annex D, stand-alone ATS controllers are given in Annex E, and TSE for electric driven fire pump controllers are given in Annex F.<br/>
    It covers:<br/>
    - manually operated transfer switching equipment (MTSE);<br/>
    - remotely operated transfer switching equipment (RTSE);<br/>
    - automatic transfer switching equipment (ATSE), including the controller;<br/>
    - stand-alone ATS controllers;<br/>
    - bypass/isolation transfer switch equipment (BTSE);<br/>
    - ATSE having closed transition capability;<br/>
    - fire pump TSE.<br/>
    It does not cover:<br/>
    - TSE configurations that are not fully manufacturer type tested or marked according to this document as a complete transfer switch;<br/>
    - auxiliary contacts (for guidance, see IEC 60947-5-1);<br/>
    - transfer switches used in explosive atmospheres (for guidance, see IEC 60079 (all parts));<br/>
    - embedded software design (for guidance, see IEC TR 63201);<br/>
    - cybersecurity aspects (for guidance, see IEC 63208);<br/>
    - TSE rated for direct-on-line starting asynchronous motor of design NE and HE, according to IEC 60034-12. (for guidance, see AC-3e utilisation category according to IEC 60947 4 1);<br/>
    - other types of TSE under consideration including overlapping neutral TSE, multi-source TSE (i.e. TSE with more than two sources of supply), TSE with load-shedding functions, bus-tie TSE, and hybrid TSE;<br/>
    - static transfer switches covered by IEC 62310 series.<br/>
    This fourth edition cancels and replaces the third edition published in 2021. This edition constitutes a technical revision.<br/>
    This edition includes the following significant technical changes with respect to the previous edition:<br/>
    - clarification of scope;<br/>
    - clarification of terms and definitions;<br/>
    - Annex C for Bypass/Isolation Transfer Switch Equipment;<br/>
    - Annex D for ATSE having closed transition capability;<br/>
    - Annex E for Stand-alone ATS controller;<br/>
    - Annex F for TSE used with electric driven fire pump control equipment.</p>
