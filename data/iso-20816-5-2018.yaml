abstract:
- language: en
  script: Latn
  content: |-
    ISO 20816-5:2018 This document provides guidelines for evaluating the vibration measurements made at the bearings, bearing pedestals or bearing housings and also for evaluating relative shaft vibration measurements made on machine sets in hydraulic power generating and pump-storage plants when the machine is operating within its normal operating range. The normal operating ranges for each type of turbine covered by this document are defined in Annex A.<br/>
    This document is applicable to machine sets in hydraulic power generating plants and in pump-storage plants with typical rotational speeds of 60 r/min to 1 000 r/min fitted with shell or pad (shoe) type oil-lubricated bearings.<br/>
    NOTE The current database includes machine speeds ranging from 60 r/min to 750 r/min (with a very small sample of 1 000 r/min machines).<br/>
    This document defines different limit values of bearing housing and shaft vibration depending on the type of turbine, the orientation of the shaft (i.e. horizontal or vertical) and for each of the bearing locations.<br/>
    This document is based on statistical analysis and provides criteria for the most common types of turbines, pump-turbines and pumps. For specific information on which types of units are covered in this document, see Annex A.<br/>
    Machine sets covered by this document can have the following configurations:<br/>
    a) generators driven by hydraulic turbines;<br/>
    b) motor-generators driven by pump-turbines;<br/>
    c) motor-generators driven by hydraulic turbines and separate pumps;<br/>
    d) pumps driven by electric motors.<br/>
    This document is not applicable to the following unit configurations, parameters and operating conditions:<br/>
    — hydraulic machines with water-lubricated bearings;<br/>
    — hydraulic machines or machine sets having rolling element bearings (for these machines, see IEC 62006 and/or ISO 10816‑3);<br/>
    — pumps in thermal power plants or industrial installations (for these machines, see ISO 10816‑7);<br/>
    — electrical machines operating as motors except for the use of these machines in pump-storage applications;<br/>
    — hydro generators operating as synchronous condensers (with the water in the turbine depressed by compressed air);<br/>
    — assessment of absolute bearing housing vibration displacement;<br/>
    — assessment of axial vibration;<br/>
    — assessment of transient conditions;<br/>
    — non-synchronous operation;<br/>
    — assessment of vibration of the generator stator core or the stator frame level.<br/>
    Measurements made of the bearing housing vibration and shaft vibration occurring in machine sets in hydraulic power generating and pump-storage plants can be used for the following purposes:<br/>
    1) Purpose A: to prevent damage arising from excessive vibration magnitudes;<br/>
    2) Purpose B: to monitor changes in vibrational behaviour in order to allow diagnosis and/or prognosis.<br/>
    The criteria are applicable for the vibration produced by the machine set itself. Special investigation is needed for vibration transmitted to the machine set from external sources, e.g. transmitted to the machine via the station foundations.
- language: fr
  script: Latn
  content: |-
    ISO 20816-5:2018 Le présent document donne des lignes directrices pour l'évaluation des mesurages de vibrations réalisés au niveau des paliers, des chaises de palier ou des carters de palier, ainsi que pour l'évaluation des mesurages de vibrations relatives de l'arbre réalisés sur des groupes de machines équipant des centrales hydroélectriques et des stations de pompage et de stockage lorsque la machine est exploitée dans sa plage de fonctionnement normal. Les plages de fonctionnement normal pour chaque type de turbine couvert par le présent document sont définies en Annexe A.<br/>
    Le présent document est applicable aux groupes de machines équipant des centrales hydroélectriques et des stations de pompage et de stockage dont les vitesses de rotation typiques vont de 60 tr/min à 1 000 tr/min et qui sont équipées de paliers à demi-coussinets ou à coussinets lubrifiés à l'huile.<br/>
    NOTE La base de données actuelle inclut des vitesses de machine allant de 60 tr/min à 750 tr/min (avec un très petit échantillon de machines fonctionnant à 1 000 tr/min).<br/>
    Le présent document définit différentes valeurs limites de vibrations de carters de palier et d'arbres en fonction du type de turbine, de l'orientation de l'arbre (horizontale ou verticale) et de chaque emplacement des paliers.<br/>
    Le présent document est basé sur une analyse statistique et fournit des critères pour les types de turbines, turbines-pompes et pompes les plus courants. Pour des informations spécifiques sur les types d'unités couverts par le présent document, voir l'Annexe A.<br/>
    Les groupes de machines couverts par le présent document peuvent présenter les configurations suivantes:<br/>
    a) générateurs entraînés par des turbines hydrauliques;<br/>
    b) groupes convertisseurs entraînés par des turbines-pompes;<br/>
    c) groupes convertisseurs entraînés par des turbines hydrauliques et des pompes séparées;<br/>
    d) pompes entraînées par des moteurs électriques.<br/>
    Le présent document n'est pas applicable aux configurations d'unités, paramètres et conditions de fonctionnement suivants:<br/>
    — machines hydrauliques comportant des paliers à lubrification à eau;<br/>
    — machines hydrauliques ou groupes de machines possédant des paliers à roulement (pour ces machines, voir l'IEC 62006 et/ou l'ISO 10816‑3);<br/>
    — pompes dans les centrales thermiques ou les installations industrielles (pour ces machines, voir l'ISO 10816‑7);<br/>
    — machines électriques utilisées comme moteurs, sauf pour l'utilisation de ces machines dans des applications de pompage et de stockage;<br/>
    — générateurs hydrauliques utilisés comme compensateurs synchrones (avec l'eau de la turbine dépressurisée par de l'air comprimé);<br/>
    — évaluation du déplacement vibratoire absolu des carters de palier;<br/>
    — évaluation des vibrations axiales;<br/>
    — évaluation des conditions transitoires;<br/>
    — fonctionnement non synchrone;<br/>
    — évaluation des vibrations du noyau du stator du générateur ou du bâti du stator.<br/>
    Les mesurages des vibrations sur les carters de palier et les arbres qui se produisent dans les groupes de machines équipant des centrales hydroélectriques et des stations de pompage et de stockage peuvent être utilisés aux fins suivantes:<br/>
    1) objectif A: éviter les dommages émanant d'amplitudes de vibrations excessives;<br/>
    2) objectif B: surveiller les changements dans le comportement des vibrations afin de pouvoir réaliser un diagnostic et/ou un pronostic.<br/>
    Les critères sont applicables aux vibrations produites par le groupe de machines même. Un examen spécial est nécessaire pour les vibrations transmises au groupe de machines et provenant de sources externes, par exemple les vibrations transmises via les fondations de la station.
