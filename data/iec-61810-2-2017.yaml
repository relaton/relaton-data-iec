abstract:
- language: en
  script: Latn
  content: |-
    IEC 61810-2:2017 covers test conditions and provisions for the evaluation of endurance tests using appropriate statistical methods to obtain reliability characteristics for relays.<br/>
    This document applies to electromechanical elementary relays considered as non-repaired items (i.e. items which are not repaired after failure).<br/>
    This document does not cover procedures for electromechanical elementary relays where enhanced requirements for the verification of reliability apply.<br/>
    This edition includes the following significant technical changes with respect to the previous edition:<br/>
    - not only graphical but also numerical methods are added;<br/>
    - reduction of number of samples in specified cases;<br/>
    - new subclauses of confidence intervals are added;<br/>
    - the WeiBayes approach is added to facilitate compliance tests (routine test) with lower effort;<br/>
    - annexes have been restructured into an Annex A for data analysis (normative) and Annex B (informative) where various examples of the data analysis are given;<br/>
    - the former Annex C has been incorporated into the modified Annex B;<br/>
    - a new Annex C replaces the old Annex D.
- language: fr
  script: Latn
  content: |-
    L’IEC 61810-2:2017 couvre les conditions d’essai et les dispositions pour l’évaluation des essais d’endurance utilisant les méthodes statistiques appropriées pour obtenir les caractéristiques de fiabilité pour les relais.<br/>
    Le présent document s’applique aux relais électromécaniques élémentaires considérés comme des entités non réparées (c’est-à-dire des entités qui ne sont pas réparées après défaillance).<br/>
    Le présent document ne couvre pas les procédures d’essai relatives aux relais électromécaniques élémentaires lorsque des exigences renforcées pour la vérification de la fiabilité s’appliquent.<br/>
    Cette édition inclut les modifications techniques majeures suivantes par rapport à l'édition précédente:<br/>
    - ajout de méthodes non seulement graphiques mais aussi numériques;<br/>
    - réduction du nombre d’échantillons dans des cas spécifiés;<br/>
    - ajout de nouveaux paragraphes relatifs aux intervalles de confiance;<br/>
    - ajout de l’approche WeiBayes pour permettre une réalisation efficiente des essais de conformité (essai individuel de série);<br/>
    - réorganisation des annexes en Annexe A (normative), dédiée à l’analyse des données et en Annexe B (informative), dans laquelle plusieurs exemples d’analyse des données sont présentés;<br/>
    - insertion de l’ancienne Annexe C dans l’Annexe B modifiée;<br/>
    - remplacement de l’ancienne Annexe D par une nouvelle Annexe C.
