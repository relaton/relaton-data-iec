abstract:
- language: en
  script: Latn
  content: |-
    IEC 61076-3-122:2021 covers 8-way, shielded, free and fixed rectangular connectors for I/O and data transmission with frequencies up to 500 MHz. It is intended to specify the common dimensions, mechanical, electrical and environmental characteristics and tests for this family of connectors.<br/>
    Connectors complying with this document provide an ingress protection level of IP20; however, they are particularly suited for industrial environments with a high level of vibration.<br/>
    There are two classes of connectors defined in this document, indicated by "class A" and "class B" which are distinguished by some electrical and mechanical characteristics to meet the particular sets of requirements of some industrial applications.<br/>
    Class A meets the requirements defined in Ed.1 of this document.<br/>
    With the two classes A and B, the two codings Type I and II, and the two sets of transmission requirements according to the component categories Cat 5 and Cat 6A as defined in ISO/IEC 11801-1, this document specifies 2 × 2 × 2 = 8 variants.<br/>
    All connectors covered by this document feature a current-carrying capacity beyond the minimum requirement of 0,75 A per pin for an ambient temperature of 60° C as defined in ISO/IEC 11801 1.<br/>
    This second edition cancels and replaces the first edition published in 2017. This edition constitutes a technical revision.<br/>
    This edition includes the following significant technical changes with respect to the previous edition:<br/>
    a) Title modified.<br/>
    b) Introduction of two sets of requirements for connectors of "class A" and "class B" where class A matches the requirements defined in the previous edition.<br/>
    c) Definition of new performance requirements for frequencies up to 500 MHz in addition to the performance requirements up to 100 MHz provided with the previous edition.<br/>
    d) Re-structuring to reflect the commonalities of and differences between connector Type I and Type II.<br/>
    e) Revision of drawings to clarify some dimensions.<br/>
    e) The derating diagram has been corrected to align it with the upper limiting temperature in the climatic category, with no reduction of performance for the target applications.
- language: fr
  script: Latn
  content: |-
    IEC 61076-3-122:2021 couvre les connecteurs rectangulaires à 8 sens, blindés, libres et fixes pour i/o et transmission de données avec des fréquences jusqu’à 500 MHz. Il est destiné à préciser les dimensions communes, les caractéristiques mécaniques, électriques et environnementales et les tests pour cette famille de connecteurs.<br/>
    Les connecteurs qui se conforment à ce document offrent un niveau de protection contre les entrées d’IP20; cependant, ils sont particulièrement adaptés aux environnements industriels avec un niveau élevé de vibration.<br/>
    Il existe deux catégories de connecteurs définies dans ce document, indiquées par « classe A » et « classe B » qui se distinguent par certaines caractéristiques électriques et mécaniques pour répondre aux exigences particulières de certaines applications industrielles.<br/>
    La classe A répond aux exigences définies dans l’Ed.1 de ce document.<br/>
    Avec les deux catégories A et B, les deux codages de type I et II, et les deux ensembles d’exigences de transmission selon les catégories de composants Cat 5 et Cat 6A telles que définies dans ISO/IEC 11801-1, ce document spécifie 2 × 2 × 2 = 8 variantes.<br/>
    Tous les connecteurs couverts par ce document disposent d’une capacité de transport de courant au-delà de l’exigence minimale de 0,75 A par goupille pour une température ambiante de 60°C telle que définie dans ISO/IEC 11801 1.<br/>
    Cette deuxième édition annule et remplace la première édition publiée en 2017. Cette édition constitue une révision technique.<br/>
    Cette édition comprend les changements techniques importants suivants par rapport à l’édition précédente :<br/>
    a) Titre modifié.<br/>
    b) Introduction de deux ensembles d’exigences pour les connecteurs de « classe A » et de « classe B » où la classe A correspond aux exigences définies dans l’édition précédente.<br/>
    c) Définition des nouvelles exigences de performance pour les fréquences jusqu’à 500 MHz en plus des exigences de performance jusqu’à 100 MHz fournies avec l’édition précédente.<br/>
    d) Restructuration pour refléter les points communs et les différences entre le connecteur de type I et le type II.<br/>
    e) Révision des dessins pour clarifier certaines dimensions.<br/>
    e) Le diagramme de dentation a été corrigé pour l’aligner sur la température limite supérieure dans la catégorie climatique, sans réduction des performances pour les applications cibles.
