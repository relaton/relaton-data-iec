abstract:
- language: en
  script: Latn
  content: "<p>The purpose is to specify the characteristics of a conceptual Physical
    service and thus supplement the OSI Basic Reference Model in guiding the development
    of Physical Layer protocols.</p>"
- language: fr
  script: Latn
  content: "La présente Recommandation | Norme internationale définit le service de
    couche physique OSI en utilisant les éléments suivants: \na) les actions et événements
    primitifs du service; \nb) le paramètre associé à chaque action et événement primitifs,
    et la forme qu'il prend; \nc) la relation qui existe entre ces événements et actions,
    et leur ordre de succession logique.\n\nLa présente Recommandation | Norme internationale
    a pour objectif principal\nde spécifier les caractéristiques d'un service de couche
    physique\nconceptuel, et donc de compléter le modèle de référence\nOSI en aidant
    à l'élaboration de protocoles de couche physique.\nLa présente Recommandation
    | Norme internationale ne spécifie pas\nde forme particulière de réalisations
    ou de produits, et n'impose\naucune contrainte de réalisation pour les entités
    et interfaces\ndans le cadre d'un système de traitement de l'information. Il n'est
    donc\npas spécifié de conditions de conformité d'équipements\nà la présente Recommandation
    | Norme internationale. Par contre,\nla conformité est obtenue par la mise en
    oeuvre de protocoles de couche\nphysique conformes à l'OSI, qui assurent le service
    de couche physique\ndéfini dans la présente Recommandation | Norme internationale."
