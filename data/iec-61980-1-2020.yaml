abstract:
- language: en
  script: Latn
  content: |-
    IEC 61980-1:2020 applies to the supply device for charging electric road vehicles using wireless methods at standard supply voltages per IEC 60038 up to 1 000 V AC and up to 1 500 V DC.<br/>
    Electric road vehicles (EV) covers road vehicles, including plug-in hybrid road vehicles (PHEV) that derive all or part of their energy from on-board rechargeable energy storage systems (RESS).<br/>
    This document also applies to wireless power transfer (WPT) equipment supplied from on-site storage systems (e.g. buffer batteries).<br/>
    The aspects covered in this document include<br/>
    • the characteristics and operating conditions of a supply device,<br/>
    • the specification for required level of electrical safety of a supply device,<br/>
    • communication between EV device and vehicle to enable and control WPT,<br/>
    • efficiency, alignment and other activities to enable WPT, and<br/>
    • specific EMC requirements for a supply device.<br/>
    The following aspects are under consideration for future documents:<br/>
    • requirements for MF-WPT systems supplying power to EVs in motion;<br/>
    • requirements for bidirectional power transfer.<br/>
    This document does not apply to:<br/>
    • safety aspects related to maintenance,<br/>
    • WPT system for trolley buses, rail vehicles and vehicles designed primarily for use off‑road, and<br/>
    • any safety or EMC requirements for the vehicle side.<br/>
    IEC 61980-1:2020 cancels and replaces the first edition published in 2015. This edition constitutes a technical revision.<br/>
    This edition includes the following significant technical changes with respect to the previous edition:<br/>
    a) the contents of IEC 61980-1:2015 have been re-organized so that this document is generally applicable to any WPT technologies;<br/>
    b) technology specific requirements, mostly for MF-WPT in the main text of IEC 61980-1:2015, have been transferred to IEC 61980-2 and IEC 61980-3;<br/>
    c) Annex A, Annex B and Annex C have been removed and contents of these annexes have been transferred to the relevant technology specific parts of the IEC 61980 series;<br/>
    d) duplications and overlaps of the requirements within IEC 61980-1:2015 have been resolved;<br/>
    e) terms and definitions which are specified in IEC 61851-1:2017 and are applicable for WPT system have been directly described in this document, with modification for some terms. The reference to IEC 61851-1 is withdrawn.
- language: fr
  script: Latn
  content: |-
    L'IEC 61980-1:2020 s'applique aux dispositifs d'alimentation pour la charge des véhicules électriques routiers au moyen de technologies sans fil, à des tensions d'alimentation normalisées conformément à l'IEC 60038, jusqu'à des tensions alternatives de 1 000 V et des tensions continues de 1 500 V.<br/>
    Les véhicules électriques (VE) routiers couvrent les véhicules routiers, y compris les véhicules routiers hybrides rechargeables (VEHR), qui tirent tout ou partie de leur énergie de systèmes rechargeables de stockage d'énergie (RESS) embarqués.<br/>
    Le présent document s'applique également aux matériels de transfert de puissance sans fil (WPT) qui équipent les systèmes de stockage sur site (par exemple, batteries tampons).<br/>
    Le présent document couvre les aspects suivants:<br/>
    • les caractéristiques et conditions de fonctionnement d'un dispositif d'alimentation;<br/>
    • la spécification concernant le niveau exigé de sécurité électrique d'un dispositif d'alimentation;<br/>
    • la communication entre le dispositif du VE et le véhicule pour permettre et contrôler le WPT;<br/>
    • le rendement, l'alignement et autres activités pour permettre le WPT; et<br/>
    • les exigences de CEM spécifiques pour un dispositif d'alimentation.<br/>
    Les aspects suivants sont à l'étude pour de futurs documents:<br/>
    • les exigences concernant les systèmes MF-WPT qui alimentent les VE en mouvement;<br/>
    • les exigences concernant le transfert de puissance bidirectionnel.<br/>
    Le présent document ne s'applique pas:<br/>
    • aux aspects de sécurité relatifs à la maintenance;<br/>
    • aux systèmes WPT pour trolleybus, véhicules ferroviaires et véhicules conçus principalement pour une exploitation non routière;<br/>
    • aux exigences de sécurité ou de CEM côté véhicule.<br/>
    L'IEC 61980-1:2020 annule et remplace la première édition parue en 2015. Cette édition constitue une révision technique.<br/>
    Cette édition inclut les modifications techniques majeures suivantes par rapport à l'édition précédente:<br/>
    a) le contenu de l'IEC 61980-1:2015 a été réorganisé de sorte que le présent document soit généralement applicable à toutes les technologies WPT;<br/>
    b) les exigences spécifiques à la technologie, principalement pour le transfert de puissance sans fil par champ magnétique, dans le texte principal de l'IEC 61980-1:2015 ont été transférées dans l'IEC 61980-2 et l'IEC 61980-3;<br/>
    c) les Annexes A, B et C ont été supprimées et le contenu de ces annexes a été transféré dans les parties spécifiques à la technologie pertinentes de la série IEC 61980;<br/>
    d) les redondances et les chevauchements des exigences de l'IEC 61980-1:2015 ont été résolus;<br/>
    e) les termes et définitions qui sont spécifiés dans l'IEC 61851-1:2017 et qui sont applicables au système WPT sont directement décrits dans le présent document, avec des modifications pour certains termes; la référence à l'IEC 61851-1 a été supprimée.
