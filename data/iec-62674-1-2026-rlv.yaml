abstract:
- language: en
  script: Latn
  content: |-
    IEC 62674-1:2026 RLV contains both the official IEC International Standard and its Redline version. The Redline version is available in English only and provides you with a quick and easy way to compare all the changes between the official IEC Standard and its previous edition.<br/>
    <br/>
    IEC 62674-1:2026 applies to fixed surface mount inductors and fixed surface mount ferrite beads. The object of this document is to define the terms necessary to describe the inductors covered by this document, provide recommendations for preferred characteristics, recommended performance, test methods and general guidance.<br/>
    This edition includes the following significant technical changes with respect to the previous edition:<br/>
    a) addition of dimensions for shape D;<br/>
    b) addition of upper temperature for operating temperature ranges.
