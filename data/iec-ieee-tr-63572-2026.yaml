abstract:
- language: en
  script: Latn
  content: |-
    IEC/IEEE TR 63572:2026 describes the computation and measurement techniques and test approaches for evaluating the local peak absorbed power density (pAPD) and peak spatial average absorbed (epithelial) power density (psAPD) induced in a human body from a wireless device transmitting in close proximity to the user at frequencies between 6 GHz and 300 GHz.<br/>
    This document provides information on the testing of portable devices transmitting at distances close to the human body, such as mobile phones, tablets, wearable devices, etc. The information in this document is also relevant to exposure in the close proximity of base stations.
