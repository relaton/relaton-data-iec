abstract:
- language: en
  script: Latn
  content: |-
    IEC 61804-3:2020 specifies the electronic device description language (EDDL) technology, which enables the integration of real product details using the tools of the engineering life cycle.<br/>
    This document specifies EDDL as a generic language for describing the properties of automation system components. EDDL is capable of describing<br/>
    • device parameters and their dependencies;<br/>
    • device functions, for example, simulation mode, calibration;<br/>
    • graphical representations, for example, menus;<br/>
    • interactions with control devices;<br/>
    • graphical representations:<br/>
    – enhanced user interface,<br/>
    – graphing system;<br/>
    • persistent data store.<br/>
    EDDL is used to create electronic device description (EDD) for e.g. concrete devices, common usable profiles or libraries. This EDD is used with appropriate tools to generate an interpretative code to support parameter handling, operation, and monitoring of automation system components such as remote I/Os, controllers, sensors, and programmable controllers. Tool implementation is outside the scope of this document.<br/>
    This document specifies the semantic and lexical structure in a syntax-independent manner. A specific syntax is defined in Annex A, but it is possible to use the semantic model also with different syntaxes.<br/>
    IEC 61804-4 specifies EDD interpretation for EDD applications and EDDs to support EDD interoperability.<br/>
    IEC 61804-5 specifies the EDDL builtin library and provides the profiles of the various fieldbuses.<br/>
    This fourth edition cancels and replaces the third edition published in 2015. This edition constitutes a technical revision.<br/>
    This edition was developed by merging material from multiple variants of existing EDDL specifications including those from FieldComm Group (FOUNDATION™ Fieldbus , HART® ), PROFIBUS™ Nutzerorganisation e.V. (PNO), and ISA100_Wireless™ Compliance Institute (ISA100 WCI). Any places where there may be a profile deviation are now indicated in the context where the related deviation is found. As a result, the formatting and numbering of this edition may be different from any of the individual specifications from which this edition was derived.<br/>
    This edition includes the following significant technical changes with respect to the previous edition:<br/>
    • Communication profiles ISA100 and GPE were added.<br/>
    • EDD Identification Information has a new LAYOUT_TYPE attribute.<br/>
    • New construct SEMANTIC_MAP was added.<br/>
    • CLASS attribute values LOCAL_A and LOCAL_B were added.<br/>
    • Extended LIST functionality to support device managed lists.
- language: fr
  script: Latn
  content: |-
    IEC 61804-3:2020 spécifie la technologie du langage de description électronique de produit (EDDL), laquelle permet l'intégration d'informations de produits réels à l'aide des outils du cycle de vie d'ingénierie.<br/>
    Le présent document spécifie l'EDDL en tant que langage générique pour décrire les propriétés des composants de systèmes d'automatisation. L'EDDL est capable de décrire<br/>
    • les paramètres des équipements et leurs dépendances;<br/>
    • les fonctions des équipements, par exemple le mode de simulation, l'étalonnage;<br/>
    • les représentations graphiques, par exemple les menus;<br/>
    • les interactions avec les équipements de commande;<br/>
    • les représentations graphiques:<br/>
    – interface utilisateur avancée;<br/>
    – système graphique;<br/>
    • le répertoire des données persistantes.<br/>
    L'EDDL est utilisé pour créer une description électronique de produit (EDD) pour, par exemple, des équipements concrets, des profils communs ou des bibliothèques. Cette EDD est utilisée avec des outils appropriés pour générer un code interprétatif qui prend en charge la gestion des paramètres, l'exploitation et la surveillance de composants de système d'automatisation, tels que des E/S, des contrôleurs, des capteurs et des contrôleurs programmables à distance. La mise en œuvre des outils ne fait pas partie du domaine d'application du présent document.<br/>
    Le présent document spécifie la sémantique et la structure lexicale indépendamment de la syntaxe. Une syntaxe spécifique est définie à l'Annexe A, mais il est possible d'utiliser également le modèle sémantique avec d'autres syntaxes.<br/>
    L'IEC 61804-4 spécifie l'interprétation EDD pour les applications EDD et les EDD afin d'assurer l'interopérabilité EDD.<br/>
    L'IEC 61804-5 spécifie la bibliothèque de builtin EDDL et fournit les profils des différents bus de terrain.<br/>
    Cette quatrième édition annule et remplace la troisième édition parue en 2015. Cette édition constitue une révision technique.<br/>
    Cette édition a été développée en fusionnant le contenu de plusieurs variantes des spécifications de l'EDDL existantes, y compris celles du FieldComm Group (FOUNDATION™ Fieldbus , HART® ), du PROFIBUS™ Nutzerorganisation e.V. (PNO), et de l'ISA100_Wireless™ Compliance Institute (ISA100 WCI). Les endroits pouvant comporter une déviation de profil sont désormais indiqués dans le contexte où la déviation en question a été identifiée. Par conséquent, le formatage et la numérotation de la présente édition peuvent différer des spécifications individuelles desquelles elle est issue.<br/>
    Cette édition inclut les modifications techniques majeures suivantes par rapport à l'édition précédente:<br/>
    • ajout des profils de communication ISA100 et GPE;<br/>
    • ajout du nouvel attribut LAYOUT_TYPE aux informations d'identification de l'EDD;<br/>
    • ajout de la nouvelle construction SEMANTIC_MAP;<br/>
    • ajout des valeurs LOCAL_A et LOCAL_B de l'attribut CLASS;<br/>
    • extension de la fonctionnalité LIST pour prendre en charge les listes d'équipements gérées.
