abstract:
- language: en
  script: Latn
  content: |-
    IEC 62083:2025, with the inclusion of type tests and site tests, applies to the design, manufacture, installation, and maintenance of the radiotherapy treatment planning system.<br/>
    This document applies to the communication of the radiotherapy treatment planning system with other devices<br/>
    – used in medical practice,<br/>
    – that imports data either through input by the operator or from other devices,<br/>
    – that outputs data to other devices, and<br/>
    – that is intended to be<br/>
    - for normal use, under the authority of appropriately qualified persons, by operators having the required skills and training,<br/>
    - used and maintained in accordance with the recommendations given in the instructions for use, and<br/>
    – used within the environmental conditions specified in the technical description.<br/>
    This document applies to any software application that is used for the development, evaluation, or approval of a treatment plan, whether stand-alone or part of another system.<br/>
    IEC 62083:2025 cancels and replaces the second edition published in 2009. This edition constitutes a technical revision.<br/>
    This edition includes the following significant technical changes with respect to the previous edition:<br/>
    – modification of the title from Medical electrical system - Requirements for the safety of radiotherapy treatment planning systems, to Medical device software - Requirements for the safety of radiotherapy treatment planning systems;<br/>
    – Adaptive radiotherapy is added with Clause 16;<br/>
    – The title reflects different implementations of radiotherapy treatment planning systems.
- language: fr
  script: Latn
  content: |-
    L'IEC 62083:2025, avec l'inclusion des essais de type et des essais sur le site, s'applique à la conception, à la fabrication, à l'installation et à la maintenance du système de planification de traitement en radiothérapie.<br/>
    Le présent document s'applique à la communication du système de planification de traitement en radiothérapie avec d'autres dispositifs<br/>
    – utilisés dans la pratique médicale,<br/>
    – qui utilisent des données entrées par l'opérateur ou importées depuis d'autres dispositifs,<br/>
    – qui produisent des données de sortie vers d'autres dispositifs, et<br/>
    – qui sont destinés à<br/>
    • une utilisation normale, sous la responsabilité de personnes qualifiées de façon appropriée, par des opérateurs (3.45) ayant les compétences et la formation exigées,<br/>
    • être utilisés et entretenus selon les recommandations données dans les instructions d'utilisation, et<br/>
    • être utilisés dans les conditions d'environnement spécifiées dans la description technique.<br/>
    Le présent document s'applique à toute application logicielle utilisée pour le développement, l'évaluation ou l'approbation d'un plan de traitement, autonome ou qui fait partie d'un autre système.<br/>
    L'IEC 62083:2025 annule et remplace la deuxième édition parue en 2009. Cette édition constitue une révision technique.<br/>
    Cette édition inclut les modifications techniques majeures suivantes par rapport à l'édition précédente:<br/>
    – remplacement du titre Appareils électromédicaux – Exigences de sécurité pour les systèmes de planification de traitement en radiothérapie par Logiciels de dispositifs médicaux – Exigences de sécurité pour les systèmes de planification de traitement en radiothérapie;<br/>
    – ajout de la radiothérapie adaptative à l'Article 16;<br/>
    – le titre reflète différentes mises en œuvre des systèmes de planification de traitement en radiothérapie.
