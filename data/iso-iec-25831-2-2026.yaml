abstract:
- language: en
  script: Latn
  content: |2

    <p class="MsoNormal" style="line-height: 115%; background: white; mso-shading: transparent; border: none; mso-border-alt: none black 0cm; padding: 0cm; mso-padding-alt: 0cm 0cm 0cm 0cm; mso-border-between: 0cm none black; mso-padding-between: 0cm;">This document defines the schema of JSON objects used to describe identity assurance relating to a natural person. It consists of the definition of a new claim called verified_claims that will be registered with the IANA "JSON Web Token Claims Registry" established by [RFC 7519]. As part of the definition of the verified_claims claim there is also an element defined called verification that provides a flexible container for identity assurance metadata. It is anticipated that the verification element may be used by other spec authors and implementers where the verification metadata is needed independently of the end-user verified claims.</p>
