abstract:
- language: en
  script: Latn
  content: |-
    IEC 60245-1:2026 applies to rigid and flexible cables with insulation, and sheath if any, based on vulcanized rubber of rated voltages Uo/U up to and including 450/750 V used in power installations of nominal voltage not exceeding 450/750 V AC. Particular types of cables are specified in IEC 60245-3, IEC 60245-4, IEC 60245-6, IEC 60245-7, IEC 60245-8. The code designations of these types of cables are provided in Annex A of this document. The test methods specified in Part 1 to Part 8 of the IEC 60245 series are given in IEC 63294 and in the relevant parts of IEC 60811.<br/>
    IEC 60245-1:2026 includes the following significant technical changes with respect to the previous edition:<br/>
    a) reference to IEC 60245-2 for the tests has been deleted and replaced by IEC 63294;<br/>
    b) reference to lift cable according to IEC 60245-5 has been deleted;<br/>
    c) normative references have been updated.
