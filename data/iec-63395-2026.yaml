abstract:
- language: en
  script: Latn
  content: |-
    IEC 63395:2026 specifies requirements and provides guidance for the sustainable management of waste electrical and electronic equipment (e-waste) for all process steps, from collection to returning recovered products, components, materials or energy to the value chain. It includes traceability, monitoring and evaluation of the e-waste flow, recovery rate and recovery quality.<br/>
    The document is intended for use by an organization involved in e-waste management seeking to manage its responsibilities in a systematic manner.<br/>
    The requirements set by this document will help an organization to achieve sustainability outcomes within the context of e-waste management, including:<br/>
    - enhancement of organizations’ performance in relation to quality, environment and occupational health and safety;<br/>
    - fulfilment of compliance obligations.<br/>
    The document is applicable to any organization, regardless of its size, type and nature.<br/>
    This document applies to the environmental, health and safety, and quality aspects of e-waste management activities that the organization determines it can either control or influence, from a lifecycle perspective.<br/>
    NOTE 1 Social aspects – e.g. employment creation, conflict minerals, employment conditions – are not addressed directly but indirectly through the benefits of sustainable management of e-waste.<br/>
    NOTE 2 Additional local requirements or regulations can apply.<br/>
    This document is a basic environment horizontal publication focusing on essential requirements and is primarily intended for use by committees in the preparation of publications within the area of environment in accordance with the principles laid down in IEC Guide 123. Wherever applicable, it is the responsibility of committees to make use of environment basic publications in the preparation of their environment group and product publications. Committees can apply this document directly to products when they do not develop a product publication in the area of environment.
- language: fr
  script: Latn
  content: |-
    L'IEC 63395:2026 spécifie les exigences et fournit des recommandations pour la gestion durable des déchets d'équipements électriques et électroniques (e-déchets) pour toutes les étapes du processus, depuis la collecte jusqu'au retour des produits, des composants, des matériaux ou de l'énergie revalorisés dans la chaîne de valeur. Cela inclut la traçabilité, la surveillance et l'évaluation du flux de déchets électroniques, du taux de revalorisation et de la qualité de revalorisation.<br/>
    Le présent document est destiné à être utilisé par tout organisme impliqué dans la gestion des déchets électroniques et qui cherche à gérer ses responsabilités de manière systématique.<br/>
    Les exigences définies dans le présent document permettent à un organisme d'obtenir des résultats en matière de développement durable dans le contexte de la gestion des déchets électroniques, notamment:<br/>
    - l'amélioration des performances des organismes en matière de qualité, d'environnement, de santé et de sécurité au travail;<br/>
    - le respect des obligations de conformité.<br/>
    Le présent document s'applique à tout organisme, indépendamment de sa taille, de son type et de sa nature.<br/>
    Le présent document s'applique aux aspects des activités de gestion des déchets électroniques liés à l'environnement, à la santé et à la sécurité des personnes, ainsi qu'à la qualité, que l'organisme estime pouvoir maîtriser ou influencer, en prenant en considération la réflexion cycle de vie.<br/>
    NOTE 1 Les aspects sociaux, tels que la création d'emplois, les minerais de conflit ou les conditions d'emploi, ne sont pas abordés directement, mais indirectement par le biais des avantages de la gestion durable des déchets électroniques.<br/>
    NOTE 2 Des exigences ou réglementations locales supplémentaires peuvent s'appliquer.<br/>
    Le présent document est une publication horizontale environnementale fondamentale qui met l'accent sur les exigences essentielles et est principalement destiné à être utilisé par les comités pour l'élaboration de publications relevant du domaine de l'environnement, conformément aux principes énoncés dans le Guide 123 de l'IEC. Le cas échéant, il incombe aux comités d'utiliser les publications environnementales fondamentales dans le cadre de l'élaboration de leurs publications environnementales et leurs publications de produits. Les comités peuvent appliquer le présent document directement aux produits lorsqu'ils n'élaborent pas de publication de produit dans le domaine de l'environnement.
