abstract:
- language: en
  script: Latn
  content: "<p>This document provides information about optimizations for encoders
    and receiving systems for conducting machine analysis tasks on coded video content.
    It provides a concept-level overview of recent practices and provides comments
    on technical aspects and cautions to be taken when interpreting the results. This
    document describes technologies that have recently been studied and have demonstrated
    benefits to coding efficiency for some machine analysis tasks.</p>"
