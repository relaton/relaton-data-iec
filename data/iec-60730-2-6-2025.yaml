abstract:
- language: en
  script: Latn
  content: |-
    IEC 60730-2-6:2025 applies to automatic electrical pressure sensing controls<br/>
    • for use in, on, or in association with equipment for household appliance and similar use;<br/>
    NOTE 1 Throughout this document, the word "equipment" means "appliance and equipment" and "controls" means "pressure sensing controls".<br/>
    • for building automation within the scope of ISO 16484 series and IEC 63044 series (HBES/BACS);<br/>
    EXAMPLE 1 Independently mounted automatic electrical pressure sensing controls, controls in smart grid systems and controls for building automation systems within the scope of ISO 16484-2.<br/>
    • for equipment that is used by the public, such as equipment intended to be used in shops, offices, hospitals, farms and commercial and industrial applications;<br/>
    EXAMPLE 2 Automatic electrical pressure sensing controls for commercial catering, heating and air-conditioning equipment.<br/>
    • that are smart enabled automatic electrical pressure sensing controls;<br/>
    EXAMPLE 3 Smart grid automatic electrical pressure sensing controls, remote interfaces/control of energy-consuming equipment including computer or smart phone.<br/>
    • that are AC or DC powered controls with a rated voltage not exceeding 690 V AC or 600 V DC;<br/>
    • used in, on, or in association with equipment that use electricity, gas, oil, solid fuel, solar thermal energy, etc., or a combination thereof;<br/>
    • utilized as part of a control system or controls which are mechanically integral with multifunctional controls having non-electrical outputs;<br/>
    • using NTC or PTC thermistors and to discrete thermistors, requirements for which are contained in Annex J;<br/>
    • that are mechanically or electrically operated, responsive to or controlling a pressure or vacuum;<br/>
    • as well as manual controls when such are electrically and/or mechanically integral with automatic controls.<br/>
    NOTE 2 Requirements for manually actuated mechanical switches not forming part of an automatic control are contained in IEC 61058-1-1.<br/>
    This document is also applicable to individual pressure sensing controls utilized as part of a control system or pressure sensing controls which are mechanically integral with multi-functional controls having non-electrical outputs.<br/>
    This document is also applicable to pressure sensing controls for appliances within the scope of IEC 60335-1.<br/>
    This document applies to<br/>
    - the inherent safety of pressure sensing controls, and<br/>
    - functional safety of pressure sensing controls and safety related systems,<br/>
    - pressure sensing controls where the performance (for example the effect of EMC phenomena) of the product can impair the overall safety and performance of the controlled system,<br/>
    - the operating values, operating times, and operating sequences where such are associated with equipment safety.<br/>
    This document specifies the requirements for construction, operation and testing of automatic electrical controls used in, on, or in association with an equipment.<br/>
    This document does not<br/>
    • apply to pressure sensing controls intended exclusively for industrial process applications unless explicitly mentioned in the relevant part 2 or the equipment standard. However, this document can be applied to evaluate automatic electrical controls intended specifically for industrial applications in cases where no relevant safety standard exists;<br/>
    • take into account the response value of an automatic action of a pressure sensing control, if such a response value is dependent upon the method of mounting the control in the equipment. Where a response value is of significant purpose for the protection of the user, or surroundings, the value defined in the appropriate equipment standard or as determined by the manufacturer will apply;<br/>
    • address the integrity of the output signal to the network devices, such as interoperability with other devices unless it has been evaluated as part of the control system.<br/>
    This document contains requirements for electrical features of pressure sensing controls and requirements for mechanical features that affect their intended operation.<br/>
    NOTE Subclause 20.101, as it pertains to gas and/or oil controls, is under consideration pending review or revision of ISO 22967, ISO 22968 and ISO 23550, if applicable.<br/>
    In general, these pressure sensing controls are integrated or incorporated with the equipment or are intended to be integrated in, or on the equipment. This document also covers these controls when they are independently mounted. In-line cord controls are not covered by this document.<br/>
    This fourth edition cancels and replaces the third edition published in 2015 and its Amendment 1:2019. This edition constitutes a technical revision.<br/>
    This edition includes the following significant technical changes with respect to the previous edition:<br/>
    Adoption of IEC 60730-1:2022 with all of its significant changes to IEC 60730-1:2013, IEC 60730-1:2013/AMD 1:2015 and IEC 60730-1:2013/AMD2:2020.
- language: fr
  script: Latn
  content: |-
    L'IEC 60730-2-6:2025 s'applique aux dispositifs de commande électrique automatiques sensibles à la pression<br/>
    − utilisés dans, sur ou avec des matériels pour appareil domestique et usage analogue;<br/>
    NOTE 1 Dans le présent document, le terme "matériel" signifie "appareil et matériel" et "dispositifs de commande" signifie "dispositifs de commande sensibles à la pression".<br/>
    − pour l'automatisation des bâtiments qui relèvent du domaine d'application de la série ISO 16484 et de la série IEC 63044 (HBES/BACS);<br/>
    EXEMPLE 1 Les dispositifs de commande électrique automatiques sensibles à la pression montés indépendamment, les dispositifs de commande des systèmes de réseau intelligent et les dispositifs de commande des systèmes d'automatisation des bâtiments qui relèvent du domaine d'application de l'ISO 16484-2.<br/>
    − pour des matériels utilisés par le public, tels que les matériels destinés à être utilisés dans des magasins, des bureaux, des hôpitaux, des fermes et des applications commerciales et industrielles;<br/>
    EXEMPLE 2 Les dispositifs de commande électrique automatiques sensibles à la pression pour les installations de restauration, de chauffage et d'air conditionné.<br/>
    − qui sont des dispositifs de commande électrique automatiques activés intelligents sensibles à la pression;<br/>
    EXEMPLE 3 Les dispositifs de commande électrique automatiques sensibles à la pression de réseau intelligent, les interfaces distantes/dispositifs de commande de matériels utilisateurs d'énergie électrique, y compris les ordinateurs ou les mobiles multifonctions.<br/>
    − qui sont des dispositifs de commande à courant alternatif ou continu dont la tension assignée ne dépasse pas 690 V en courant alternatif ou 600 V en courant continu;<br/>
    − qui sont utilisés dans, sur ou avec des matériels qui utilisent l'électricité, le gaz, le pétrole, des combustibles solides, l'énergie thermique solaire, etc. ou une combinaison de ces sources d'énergie;<br/>
    − qui sont utilisés dans le cadre d'un système de commande ou de dispositifs de commande qui sont mécaniquement intégrés à des dispositifs de commande multifonctions comportant des sorties non électriques;<br/>
    − qui utilisent des thermistances CTN ou CTP ainsi qu'aux dispositifs à thermistances discrètes, dont les exigences sont fournies à l'Annexe J;<br/>
    − qui sont actionnés mécaniquement ou électriquement, qui commandent ou sont sensibles à la pression ou au vide;<br/>
    − ainsi qu'aux dispositifs de commande manuels qui sont électriquement et/ou mécaniquement intégrés à des dispositifs de commande automatique.<br/>
    NOTE 2 Les exigences relatives aux interrupteurs mécaniques à action manuelle qui ne font pas partie d'un dispositif de commande automatique sont contenues dans l'IEC 61058-1-1.<br/>
    Le présent document s'applique également aux différents dispositifs de commande sensibles à la pression qui sont utilisés dans le cadre d'un système de commande ou aux dispositifs de commande sensibles à la pression qui sont mécaniquement intégrés à des dispositifs de commande multifonctions comportant des sorties non électriques.<br/>
    Le présent document s'applique également aux dispositifs de commande sensibles à la pression pour appareils qui relèvent du domaine d'application de l'IEC 60335-1.<br/>
    Le présent document s'applique<br/>
    − à la sécurité intrinsèque des dispositifs de commande sensibles à la pression; et<br/>
    − à la sécurité fonctionnelle des dispositifs de commande sensibles à la pression et des systèmes de sécurité;<br/>
    − aux dispositifs de commande sensibles à la pression pour lesquels les performances (par exemple, l'effet des phénomènes CEM) du produit peuvent compromettre la sécurité et les performances globales du système commandé;<br/>
    − aux valeurs de fonctionnement, aux temps de fonctionnement et aux séquences de fonctionnement lorsque ces éléments interviennent dans la sécurité du matériel.<br/>
    Le présent document spécifie les exigences relatives à la construction, au fonctionnement et aux essais des dispositifs de commande électrique automatiques utilisés dans, sur ou avec du matériel.<br/>
    Le présent document<br/>
    − ne s'applique pas aux dispositifs de commande sensibles à la pression destinés exclusivement à des applications de processus industriels, sauf mention particulière dans la partie 2 applicable ou la norme du matériel. Toutefois, le présent document peut être utilisé pour évaluer les dispositifs de commande électrique automatiques destinés spécifiquement aux applications industrielles lorsqu'il n'existe aucune norme de sécurité pertinente;<br/>
    − ne prend pas en compte la valeur de réponse d'une action automatique d'un dispositif de commande sensible à la pression, lorsque cette valeur de réponse dépend de la méthode de montage du dispositif de commande dans le matériel. Lorsqu'une valeur de réponse est importante du point de vue de la protection de l'utilisateur ou de l'environnement, la valeur définie dans la norme de matériel pertinente ou déterminée par le fabricant s'applique;<br/>
    − ne traite pas de l'intégrité du signal de sortie transmis aux dispositifs de réseau, comme l'interopérabilité avec d'autres dispositifs, à moins qu'elle ait été évaluée comme partie intégrante du système de commande.<br/>
    Le présent document établit les exigences relatives aux caractéristiques électriques des dispositifs de commande sensibles à la pression et aux caractéristiques mécaniques qui ont une incidence sur leur fonctionnement prévu.<br/>
    NOTE Le 20.101 relatif aux dispositifs de commande pour gaz et/ou fioul est à l'étude en attendant la revue ou la révision de l'ISO 22967, l'ISO 22968 et l'ISO 23550, selon le cas.<br/>
    En règle générale, ces dispositifs de commande sensibles à la pression sont intégrés ou incorporés au matériel ou prévus pour être intégrés dans ou montés sur le matériel. Le présent document couvre également ces dispositifs de commande lorsqu'ils sont montés de manière indépendante. Les dispositifs de commande intercalés dans un câble souple ne sont pas couverts par le présent document.<br/>
    Cette quatrième édition annule et remplace la troisième édition parue en 2015 et l'Amendement 1:2019. Cette édition constitue une révision technique.<br/>
    Cette édition inclut les modifications techniques majeures suivantes par rapport à l'édition précédente:<br/>
    adoption de l'IEC 60730-1:2022 avec toutes les modifications majeures par rapport à l'IEC 60730‑1:2013, l'IEC 60730-1:2013/AMD1:2015 et l'IEC 60730-1:2013/AMD2:2020.
