abstract:
- language: en
  script: Latn
  content: "IEC 60721-3-3:2019+AMD1:2026 CSV classifies groups of environmental parameters and their severities to which products are subjected when installed for stationary use at weatherprotected locations.<br/>\nThis third edition cancels and replaces the second edition published in 1994, Amendment 1: 1995 and Amendment 2:1996. This edition constitutes a technical revision.<br/>\nThis edition includes the following significant technical changes with respect to the previous edition:<br/>\na) Clause 3: definitions aligned with IEC 60721-3-1.<br/>\nb) Clause 4: aligned with IEC 60721-3-1.<br/>\nc) Clause 5: Clause A.3 has been incorporated into Clause 5.<br/>\nd) Subclause 5.2: all existing climate classes have been replaced by completely new classes. The new classes are divided into two groups. The reason for the new classes is the latest revision of IEC 60721-2-1 which incorporates new climate types.<br/>\ne) Subclause 5.3: addition of a new class for low air pressure.<br/>\nf) Defined values of chemically active substances are now by reference to ISO 9223.<br/>\ng) Subclause 5.6: all existing classes for mechanically active substances have been replaced by completely new classes, in alignment with IEC 60721-3-1.<br/>\nh) Subclause 5.7: all existing classes for mechanical conditions have been replaced by completely new classes, in alignment with IEC 60721-3-1.<br/>\ni) Table 1: new climatic classes with new severities.<br/>\nj) Table 2: new class for low air pressure.<br/>\nk) Table 4: new mechanically active substances classes.<br/>\nl) Table 5: new mechanical conditions classes.<br/>\nm) Annex A: revised and includes a clean climatogram.<br/>\nn) Annex B: revised and includes the definition of seismic environment.<br/>\no) All classes regarding fire, all combined classes, all chemically active substances classes, Clause A.2, Annexes C, D and E have been removed."
