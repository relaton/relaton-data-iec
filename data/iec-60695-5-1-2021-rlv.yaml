abstract:
- language: en
  script: Latn
  content: |-
    IEC 60695-5-1:2021 RLV contains both the official IEC International Standard and its Redline version. The Redline version is available in English only and provides you with a quick and easy way to compare all the changes between the official IEC Standard and its previous edition.<br/>
    <br/>
    IEC 60695-5-1:2021 provides guidance on the following:<br/>
    a) general aspects of corrosion damage test methods;<br/>
    b) methods of measurement of corrosion damage;<br/>
    c) consideration of test methods;<br/>
    d) relevance of corrosion damage data to hazard assessment.<br/>
    This basic safety publication is primarily intended for use by technical committees in the preparation of standards in accordance with the principles laid down in IEC Guide 104 and ISO/IEC Guide 51. It is not intended for use by manufacturers or certification bodies. One of the responsibilities of a technical committee is, wherever applicable, to make use of basic safety publications in the preparation of its publications. The requirements, test methods or test conditions of this basic safety publication will not apply unless specifically referred to or included in the relevant publications. This standard is to be read in conjunction with IEC TS 60695-5-2.<br/>
    This third edition cancels and replaces the second edition, published in 2002, and constitutes a technical revision. This edition includes the following significant technical changes with respect to the previous edition:<br/>
    a) References to IEC TS 60695-5-3 (withdrawn in 2014) have been removed.<br/>
    b) References to IEC 60695-1-1 are now to its replacements: IEC 60695-1-10 and IEC 60695-1-11.<br/>
    c) ISO/TR 9122-1 has been revised by ISO 19706.<br/>
    d) Table 1 has been updated.<br/>
    e) References to ISO 11907-2 and ISO 11907-3 have been removed.<br/>
    f) Terms and definitions have been updated.<br/>
    g) Text in 6.4 has been updated.<br/>
    h) Bibliographic references have been updated.
