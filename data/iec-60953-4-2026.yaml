abstract:
- language: en
  script: Latn
  content: |-
    IEC 60953-4:2026 is intended to establish a Supplementary Standard for routine test of steam turbines. The rules given in this document follow the guidance given in IEC 60953-0, but contain amendments and supplements regarding the analysis and supervision of relative performance by routine testing of steam turbine.<br/>
    General principles for the preparation, performance evaluation, trends of performance parameters and the determination of the measurement uncertainty of periodic routine tests are given in this document.<br/>
    This document is applicable to routine testing covering a wide range of accuracy on steam turbines of every type, rating and application, operating with superheated or saturated steam.<br/>
    This document is not intended for application in acceptance tests of new units or retrofits and its application for such is strongly not recommended.<br/>
    The purpose of this document is to cover the existing steam turbine components which influence the efficiency of the power plant. This document helps the parties determine the most appropriate parameters that characterize the relative performance change and that could be used as long-term performance monitoring and analysis.
- language: fr
  script: Latn
  content: |-
    IEC 60953-4:2026 établit une norme supplémentaire pour les essais individuels de série des turbines à vapeur. Les règles établies dans le présent document suivent les recommandations de l'IEC 60953-0, mais contiennent des amendements et des ajouts qui concernent l'analyse et le contrôle des performances relatives par des essais individuels de série réalisés sur les turbines à vapeur.<br/>
    Le présent document établit les principes généraux pour la préparation, l'évaluation des performances, les tendances des paramètres de performance et la détermination de l'incertitude de mesure lors des essais individuels de série.<br/>
    Le présent document s'applique aux essais individuels de série qui couvrent une large plage d'exactitude sur les turbines à vapeur de chaque type, débit et application, fonctionnant avec de la vapeur surchauffée ou saturée.<br/>
    Le présent document n'est pas destiné à être appliqué dans le cadre des essais de réception des nouvelles unités ou des rénovations, et l'application du présent document dans un tel cadre est fortement déconseillée.<br/>
    Le présent document a pour objet de traiter les composants existants des turbines à vapeur qui ont une incidence sur le rendement de la centrale thermique. Il aide les parties à déterminer les paramètres les plus appropriés qui caractérisent la variation relative des performances et qui peuvent être utilisés pour la surveillance et l'analyse des performances à long terme.
