abstract:
- content: "IEC 60310:2026 RLV contains both the official IEC International Standard
    and its Redline version. The Redline version is available in English only and
    provides you with a quick and easy way to compare all the changes between the
    official IEC Standard and its previous edition.<p>IEC 60310:2026 specifies the
    terms and definitions, classification, service conditions, characteristics and
    test methods for transformers and inductors on board rolling stock. This document
    is applicable to traction and auxiliary power transformers installed on board
    rolling stock and to the various types of power inductors inserted in the traction
    and auxiliary circuits of rolling stock, of dry or liquid-immersed design. This
    document is also applicable to the traction transformers of three-phase AC line-side
    powered vehicles and to the transformers inserted in the single-phase or polyphase
    auxiliary circuits of vehicles, after agreement between purchaser and manufacturer.
    This document does not apply to instrument transformers, transformers of a rated
    output below 1 kVA single-phase or 5 kVA poly-phase, and inductors of a rated
    output below 1 kVAR single-phase or 5 kVAR poly-phase on board rolling stock.
    This document does not cover accessories such as tap changers, resistors, heat
    exchangers, fans, etc., intended for mounting on transformers or inductors, which
    are tested separately according to the relevant rules. This fifth edition cancels
    and replaces the fourth edition published in 2016. This edition constitutes a
    technical revision.<br />\r\nThis edition includes the following significant technical
    changes with respect to the previous edition:<br />\r\na) typical circuits for
    transformer and inductors are added;<br />\r\nb) letter symbols for cooling methods
    are added;<br />\r\nc) dielectric test table is modified;<br />\r\nd) subclauses
    for the tests of transformers and inductors are restructured;<br />\r\ne) temperature
    test for dry type transformer and dry type inductors are separated in different
    subclauses;<br />\r\nf) requirements for shock and vibration tests are updated
    according to IEC 61373:20.</p>"
