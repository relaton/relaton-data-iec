abstract:
- language: en
  script: Latn
  content: |-
    IEC 60800:2009 is applicable to, and specifies requirements for, resistive heating cables for low temperature applications such as comfort heating and the prevention of ice formation. These cables and cable sets may comprise either factory fabricated or field (work-site) assembled units, and which are heating cables assembled in accordance with manufacturer's instructions. Bare conductors and protected conductors to be supplied at voltages equal to, or less than, 50 V are excluded from the scope of this standard. Typical applications include, but are not limited to<br/>
    - surface heating installed in or under surfaces<br/>
    - direct and storage heating<br/>
    - snow melting and frost protection of roofs, gutters, pipes, etc.<br/>
    Heating cables for industrial and commercial applications are specified in the IEC 62395 series as are mineral insulated heating cables. Applications in which the operating sheath temperature exceeds 100 °C are outside the scope of this standard. The object of this standard is to ensure that electrical resistance heating cables operate safely under their normal defined conditions of use. This is achieved by:<br/>
    - employing heating cables of the appropriate construction that meet the test criteria detailed in this standard<br/>
    - including, for cables with an electrical protective component, a metallic braid, concentric wires or sheath, or other suitable electrically conductive material for protective purposes in case of fault<br/>
    - ensuring that the cables operate at safe temperatures with respect to the materials used in the construction of the cables and their installations according to national regulations.<br/>
    The significant technical changes with respect to the previous edition are as follows<br/>
    - introduction of heating cable sets<br/>
    - testing of heating cable sets, including the integrated cold-lead, cold-lead splice and end-termination in twin and multicore cable sets, in addition to the heating cable<br/>
    - introduction of requirements for installation instructions<br/>
    - reduction to two, instead of three, mechanical classes, one for cables intended for installation with a low risk of mechanical damage (M1) and one for cables intended for installation with a higher risk of mechanical damage (M2)<br/>
    - elimination of reference to specific materials to be used as insulation and sheath<br/>
    - introduction of routine and sample tests.
- language: fr
  script: Latn
  content: |-
    La CEI 60800:2009 s'applique et spécifie les exigences pour les systèmes de câbles chauffants résistants utilisés dans des applications basse température telles que le chauffage des locaux ou la protection contre le gel. Ces câbles et ces câbles équipés peuvent comprendre soit des unités fabriquées en usine ou assemblées sur, le terrain (site de travail) et qui sont des câbles chauffants assemblés conformément aux instructions du fabricant. Les conducteurs nus ou protégés qui sont alimentés à une tension inférieure ou égale à 50 V sont exclus du domaine d'application de la présente norme. Les applications typiques comprennent entre autre:<br/>
    - les surfaces chauffantes installées dans ou sous le sol fini;<br/>
    - le chauffage direct ou à accumulation;<br/>
    - le dégivrage des toits, gouttières, chénaux, etc.<br/>
    Les câbles chauffants pour les applications commerciales et industrielles sont spécifiés dans la série CEI 62395 en tant que câbles chauffants à isolation minérale. Les applications pour lesquelles la température de la gaine dépasse 100 °C sont hors du domaine s'application de cette norme. L'objet de cette norme est de s'en assurer que les câbles chauffants résistants électriques fonctionnent de façon sûre dans leurs conditions normales d'utilisation. Ce but est atteint en:<br/>
    - utilisant de câbles chauffants de construction approprié qui répondent aux critères d'essais détaillés dans cette norme;<br/>
    - incluant pour les câbles comprenant un élément de protection électrique tel que une tresse métallique, des fils concentriques, une gaine ou tout autre élément conducteur métallique adapté dans un but de protection en cas de défaut;<br/>
    - s'assurant que les câbles fonctionnent à une température sûre en respectant, conformément aux règlements nationaux, les types de matériaux utilisés dans la construction des câbles et leur installation.<br/>
    Les principales modifications techniques par rapport à l'édition antérieure sont indiquées ci-dessous:<br/>
    - introduction des câbles chauffants équipés;<br/>
    - essais, en plus des câbles chauffants, des câbles chauffants équipés comprenant les liaisons froides intégrées, les jonctions de liaisons froides et les terminaisons d'extrémité pour les paires et les unités de câbles multiconducteurs;<br/>
    - introduction des exigences relatives aux instructions d'installation;<br/>
    - réduction des classes mécaniques de trois à deux: une pour les câbles destinés à des installations comportant des risques de dommages mécaniques faibles (M1) et une pour les câbles destinés à des installations comportant des risques de dommages mécaniques élevés (M2);<br/>
    - disparition des références pour les matériaux spécifiques étant utilisés comme isolant et gaine;<br/>
    - introduction des essais de série et des essais d'échantillonnage. Le contenu du corrigendum de août 2009 a été pris en considération dans cet exemplaire.
