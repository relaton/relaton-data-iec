abstract:
- language: en
  script: Latn
  content: |-
    <p class="MsoBodyText">This standard gives guidance on establishing a decision-making framework for sharing data and information services in smart cities.</p>
    <p class="MsoBodyText">It covers:</p>
    <p class="LetterList" style="mso-list: l0 level1 lfo1;"><!-- [if !supportLists]-->a)       <!--[endif]-->types of data in smart cities;</p>
    <p class="LetterList" style="mso-list: l0 level1 lfo1;"><!-- [if !supportLists]-->b)       <!--[endif]-->establishing a data sharing culture;</p>
    <p class="LetterList" style="mso-list: l0 level1 lfo1;"><!-- [if !supportLists]-->c)       <!--[endif]-->data value chain – roles and responsibilities;</p>
    <p class="LetterList" style="mso-list: l0 level1 lfo1;"><!-- [if !supportLists]-->d)       <!--[endif]-->purposes for data use;</p>
    <p class="LetterList" style="mso-list: l0 level1 lfo1;"><!-- [if !supportLists]-->e)       <!--[endif]-->assessing data states;</p>
    <p class="LetterList" style="mso-list: l0 level1 lfo1;"><!-- [if !supportLists]-->f)        <!--[endif]-->defining access rights for data; and</p>
    <p class="LetterList" style="mso-list: l0 level1 lfo1;"><!-- [if !supportLists]-->g)       <!--[endif]-->data formats/format of transportation.</p>
    <p class="MsoBodyText">This standard aims to support the sharing of data and information services within cities. For some cities there will also be a need to establish specific data sharing agreements, particularly where data is being shared by multiple organizations at once.</p>
    <p class="MsoBodyText">This standard supports a transparent approach to making decisions and creating specific data sharing agreements in order to fully realise the benefits and value of data and information services in a city.</p>
    <p class="MsoBodyText">Missing data or misinterpretation of data can lead to the wrong actions being taken by city decision-makers. A decision-making framework for sharing data can help ensure that they have the best overall data on which to base decisions.</p>
    <p class="MsoBodyText">This standard does not cover:</p>
    <p class="LetterList" style="mso-list: l0 level1 lfo2;"><!-- [if !supportLists]-->a)       <!--[endif]-->national security issues;</p>
    <p class="LetterList" style="mso-list: l0 level1 lfo2;"><!-- [if !supportLists]-->b)       <!--[endif]-->good practice for use of data by the citizen;</p>
    <p class="LetterList" style="mso-list: l0 level1 lfo2;"><!-- [if !supportLists]-->c)       <!--[endif]-->existing interoperability agreements between cities;</p>
    <p class="LetterList" style="mso-list: l0 level1 lfo2;"><!-- [if !supportLists]-->d)       <!--[endif]-->defining application programming interfaces (API) networks; or</p>
    <p class="LetterList" style="mso-list: l0 level1 lfo2;"><!-- [if !supportLists]-->e)       <!--[endif]-->any data sharing rules and regulations specific to a particular jurisdiction. It is assumed that a security-minded approach to data sharing is used by cities.</p>
    <p class="MsoBodyText">
      <em>NOTE 1 Further details on the areas not covered in this standard, including information on</em>
      <em> relevant standards publications, are given in Annex A.</em>
    </p>
    <p class="MsoBodyText">This standard is for use by decision-makers in smart cities from the public, private and third sectors. It is also of interest to any city organization wishing to share data.</p>
