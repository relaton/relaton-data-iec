abstract:
- language: en
  script: Latn
  content: |-
    IEC 61855:2022 applies to electrical appliances for household and similar use for drying and styling hair (including their accessories).<br/>
    This document defines the main performance characteristics that are of interest to the user and specifies methods of measuring these characteristics.<br/>
    Appliances to which this document applies include:<br/>
    – Hair dryers;<br/>
    – Hair curlers;<br/>
    – Hair straighteners.<br/>
    This document does not specify the requirements for performance.<br/>
    This document does not deal with safety requirements (IEC 60335-2-23).<br/>
    This document does not apply to electric hair clippers or trimmers.<br/>
    This second edition cancels and replaces the first edition published in 2003. This edition constitutes a technical revision.<br/>
    This edition includes the following significant technical changes with respect to the previous edition:<br/>
    a) the definitions of hair dryers, hair curlers and hair straighteners are updated;<br/>
    b) the measurement of temperature profile of the outlet air of hair dryers is added;<br/>
    c) the measurement of temperature profile of the whole work area of hair curlers is added;<br/>
    d) the measurement of temperature profile of the heating plate of hair straighteners is added;<br/>
    e) the measurement method for air flow of hair dryers is introduced;<br/>
    f) the measurement method for anion emission concentration of anion hair dryers is introduced;<br/>
    g) the measurement method for tension of hair straighteners is introduced;<br/>
    h) the service life test for hair dryers, hair curlers and hair straighteners is introduced.<br/>
    The contents of the corrigendum of January 2024 have been included in this copy.
- language: fr
  script: Latn
  content: |-
    L'IEC 61855:2022 s'applique aux appareils électriques pour usages domestiques et analogues destinés au séchage et au coiffage des cheveux (y compris leurs accessoires).<br/>
    Le présent document définit les caractéristiques de performance principales qui sont pertinentes pour l'utilisateur et spécifie les méthodes de mesure de ces caractéristiques.<br/>
    Le présent document couvre les appareils suivants:<br/>
    – sèche-cheveux;<br/>
    – fers à boucler;<br/>
    – fers à lisser.<br/>
    Le présent document ne spécifie pas les exigences pour l'aptitude à la fonction de ces appareils.<br/>
    Le présent document ne traite pas des exigences de sécurité (IEC 60335-2-23).<br/>
    Le présent document ne s'applique pas aux tondeuses à barbe ou à cheveux électriques.<br/>
    Pour la méthode de mesure de l'aptitude à la fonction des tondeuses pour usages domestiques, consulter l'IEC 62863.<br/>
    Cette deuxième édition annule et remplace la première édition parue en 2003. Cette édition constitue une révision technique.<br/>
    Cette édition inclut les modifications techniques majeures suivantes par rapport à l'édition précédente:<br/>
    a) les définitions des sèche-cheveux, des fers à boucler et des fers à lisser ont été mises à jour;<br/>
    b) le mesurage du profil de température de l'air de sortie des sèche-cheveux a été ajouté;<br/>
    c) le mesurage du profil de température de la surface de travail totale des fers à boucler a été ajouté;<br/>
    d) le mesurage du profil de température de la plaque chauffante des fers à lisser a été ajouté;<br/>
    e) la méthode de mesure du débit d'air des sèche-cheveux a été ajoutée;<br/>
    f) la méthode de mesure de la concentration en anions émise par les sèche-cheveux à anions a été ajoutée;<br/>
    g) la méthode de mesure de la tension des fers à lisser a été ajoutée;<br/>
    h) l'essai de durée en service des sèche-cheveux, des fers à boucler et des fers à lisser a été ajouté.<br/>
    Le contenu du corrigendum de janvier 2024 a été pris en considération dans cet exemplaire.
