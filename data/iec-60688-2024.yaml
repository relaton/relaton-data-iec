abstract:
- language: en
  script: Latn
  content: |-
    IEC 60688:2024 applies to transducers (TRD) with electrical inputs and outputs for making measurements of AC or DC electrical quantities. The output signal can be in the form of an analogue or digital signal.<br/>
    This document applies to measuring transducers used for converting electrical quantities such as:<br/>
    – current,<br/>
    – voltage,<br/>
    – active power,<br/>
    – reactive power,<br/>
    – power factor,<br/>
    – phase angle,<br/>
    – frequency,<br/>
    – harmonics or total harmonic distortion,<br/>
    – apparent power, and<br/>
    – DC power<br/>
    to an output signal.<br/>
    This document applies<br/>
    a) if the fundamental frequency of the input(s) lies between 0 Hz and 1 500 Hz,<br/>
    b) to the electrical measuring transducer if it is part of a system for the measurement of an electrical or non-electrical quantity,<br/>
    c) to transducers for use in a variety of applications such as telemetry and process control and in one of a number of defined environments.<br/>
    This document is not applicable for:<br/>
    – instrument transformers that comply with IEC 61869 (all parts),<br/>
    – transmitters for use in an industrial process application that comply with IEC 60770 (all parts),<br/>
    – power metering and monitoring devices (PMD) that comply with IEC 61557-12,<br/>
    – meters that comply with the IEC 62053 series,<br/>
    – handheld sensors,<br/>
    – residual current monitoring devices (RCMs) that comply with IEC 62020-1,<br/>
    – residual current detecting devices (RDC-DD) that comply with IEC 62955,<br/>
    – in-cable control and protection devices (IC-CPDs) that comply with IEC 62752,<br/>
    – modular residual current devices (MRCDs) that comply with IEC 60947 2:2016/AMD1:2019, Annex M.<br/>
    Within the measuring range, the output signal is a function of the measurand. An auxiliary supply can be required.<br/>
    This document is intended:<br/>
    – to specify the terminology and definitions relating to transducers whose main application is in industry,<br/>
    – to unify the test methods used in evaluating transducer performance,<br/>
    – to specify accuracy limits and output values for transducers.<br/>
    IEC 60688:2024 cancels and replaces the fourth edition published in 2021. This edition constitutes a technical revision.<br/>
    This edition includes the following significant technical changes with respect to the previous edition:<br/>
    a) updating normative references;<br/>
    b) updating definitions;<br/>
    c) updating structure;<br/>
    d) adding DC power measurement.
- language: fr
  script: Latn
  content: |-
    L'IEC 60688:2024 s’applique aux transducteurs (TRD) à grandeurs d’entrées et de sorties électriques destinés à mesurer des grandeurs électriques alternatives ou continues. Le signal de sortie peut être sous la forme d’un signal analogique ou numérique.<br/>
    Le présent document s’applique aux transducteurs de mesure destinés à convertir des grandeurs électriques, telles que:<br/>
    – le courant;<br/>
    – la tension;<br/>
    – la puissance active;<br/>
    – la puissance réactive;<br/>
    – le facteur de puissance;<br/>
    – le déphasage;<br/>
    – la fréquence;<br/>
    – les harmoniques ou la distorsion harmonique totale;<br/>
    – la puissance apparente; et<br/>
    – la puissance en courant continu,<br/>
    en signal de sortie.<br/>
    Le présent document s’applique:<br/>
    a) si la fréquence fondamentale de la ou des grandeurs d’entrée est comprise entre 0 Hz et 1 500 Hz;<br/>
    b) à un transducteur de mesure électrique appartenant à une chaîne de mesure d’une grandeur électrique ou non électrique;<br/>
    c) aux transducteurs destinés à une utilisation générale, par exemple à la télémesure, à la commande de processus et dans un des nombreux environnements spécifiés.<br/>
    Le présent document ne s’applique pas:<br/>
    – aux transformateurs de mesure conformes à la série IEC 61869;<br/>
    – aux transmetteurs utilisés dans un processus industriel conforme à la série IEC 60770;<br/>
    – aux dispositifs de comptage et de surveillance du réseau électrique (PMD) conformes à l’IEC 61557-12;<br/>
    – aux compteurs conformes à la série IEC 62053;<br/>
    – aux capteurs portatifs;<br/>
    – aux contrôleurs d’isolement à courant différentiel résiduel (RCM) conformes à l’IEC 62020-1;<br/>
    – aux dispositifs de détection de courant résiduel (RDC-DD) conformes à la série IEC 62955;<br/>
    – aux dispositifs de contrôle et de protection intégrés au câble (IC-CPD) conformes à la série IEC 62752;<br/>
    – aux dispositifs modulaires à courant résiduel (MRCD) conformes à l’IEC 60947-2:2016/AMD1:2019, Annexe M.<br/>
    Dans l’étendue de mesure, le signal de sortie varie en fonction du mesurande. Une alimentation auxiliaire peut être exigée.<br/>
    Le présent document a pour objet:<br/>
    – de spécifier la terminologie et les définitions relatives aux transducteurs dont l’application principale relève du domaine de l’industrie;<br/>
    – d’unifier les méthodes d’essai utilisées pour évaluer les performances des transducteurs;<br/>
    – de spécifier les limites de précision et les valeurs de sortie des transducteurs.<br/>
    L'IEC 60688:2024 annule et remplace la quatrième édition parue en 2021. Cette édition constitue une révision technique.<br/>
    Cette édition inclut les modifications techniques majeures suivantes par rapport à l’édition précédente:<br/>
    a) mise à jour des références normatives;<br/>
    b) mise à jour des définitions;<br/>
    c) mise à jour de la structure;<br/>
    d) ajout du mesurage de la puissance en courant continu.
