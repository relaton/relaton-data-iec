abstract:
- language: en
  script: Latn
  content: |-
    IEC 61753-022-02: 2026 defines the minimum initial test and measurement requirements and severities which multimode fibre optic connectors terminated as a pigtail or patchcord satisfy in order to be categorized as meeting the IEC standard category C (controlled environment), as defined in IEC 61753‑1. This first edition cancels and replaces the second edition of IEC 61753-022-2 published in 2012. This edition constitutes a technical revision. This edition includes the following significant technical changes with respect to the previous edition:<br/>
    a) addition of provisions for rectangular ferrule connectors;<br/>
    b) additions of terms and definitions;<br/>
    c) update of the fibre naming conventions in accordance with IEC 60793-2-10;<br/>
    d) update of test severities in accordance with IEC 61753‑1;<br/>
    e) addition of the torsion test;<br/>
    f) reduction of the duration of the fibre/cable retention test on reinforced cables from 120 s to 60 s minimum;<br/>
    g) deletion of the static side load test;<br/>
    h) update of the flexing of the strain relief test to use the change in attenuation instead of the transient loss;<br/>
    i) reduction of the number of mating durability cycles for cylindrical ferrule connectors from 500 cycles to 200 cycles;<br/>
    j) addition of the mating durability for rectangular ferrule connectors with 50 cycles;<br/>
    k) addition of Annex B for visual examination of the outer cable sheath movement of reinforced cables as an additional requirement for change of temperature, cable retention and flexing of the strain relief tests.
- language: fr
  script: Latn
  content: |-
    IEC 61753-022-02:2026 définit les exigences minimales d’essai et de mesures initiales et les sévérités auxquelles les connecteurs fibroniques multimodaux raccordés à des fibres amorces ou des cordons de brassage satisfont pour être classés comme répondant à la catégorie C (environnement contrôlé) de la norme IEC, telle qu’elle est définie dans l’IEC 61753-1. L’IEC 61753-022-02 a été établie par le sous-comité 86B: Dispositifs d'interconnexion et composants passifs fibroniques, du comité d'études 86 de l'IEC: Fibronique. Il s'agit d'une Norme internationale.<br/>
    Cette première édition annule et remplace la deuxième édition de l'IEC 61753-022-2 parue en 2012. Cette édition constitue une révision technique.<br/>
    Cette édition inclut les modifications techniques significatives suivantes par rapport à l'édition précédente:<br/>
    a) ajout de dispositions pour les connecteurs à férule rectangulaire;<br/>
    b) ajouts de termes et définition;<br/>
    c) mise à jour des conventions de nommage des fibres conformément à l'IEC 60793-2-10;<br/>
    d) mise à jour des sévérités conformément à l’IEC 61753-1;<br/>
    e) ajout de l'essai de torsion;<br/>
    f) réduction de la durée de l'essai de rétention de la fibre ou du câble réalisé sur les câbles renforcés de 120 s à 60 s au minimum;<br/>
    g) suppression de l’essai de charge latérale statique;<br/>
    h) mise à jour de la flexion de l'essai des serre-câbles pour utiliser les variations d'affaiblissement à la place des pertes transitoires;<br/>
    i) réduction du nombre de cycles de durabilité d'accouplement pour les connecteurs à férule cylindrique de 500 cycles à 200 cycles;<br/>
    j) ajout de la durabilité d’accouplement pour les connecteurs à férule rectangulaire avec 50 cycles;<br/>
    k) ajout de l’Annexe B relative à l’examen visuel du mouvement de la gaine extérieure du câble des câbles renforcés comme exigence supplémentaire pour les essais de variations de température, de rétention du câble et de flexion des serre-câbles.
