abstract:
- language: en
  script: Latn
  content: "IEC 60761-2:2026 is applicable to equipment intended for simultaneous,
    delayed or discrete sequential measurement of aerosols in gaseous effluents discharged
    into the environment.<br />\r\nIt is applicable to equipment designed to fulfil
    the following functions:<br />\r\n- the measurement of the volumetric activity
    (Bq/m3) of the aerosols in either gaseous effluents or the released total activity
    of aerosols (Bq), or both;<br />\r\n- the actuation of an alarm signal when either
    a predetermined volumetric activity or a predetermined total released activity
    of aerosols is exceeded.<br />\r\nThis equipment is intended for measurement over
    a wide range of activity, including very small quantities in the presence of a
    much larger natural background. The daughters of 222Rn (radon) and 220Rn (thoron)
    are naturally occurring aerosols contributing to the natural background.<br />\r\nThe
    objective of this document is to establish specific standard requirements, including
    technical characteristics and general test conditions, and to give examples of
    acceptable methods for aerosol effluent monitors.<br />\r\nThe general requirements,
    technical characteristics, test procedures, radiation characteristics, electrical,
    mechanical, safety and environmental characteristics are given in IEC 60761-1.
    Unless otherwise stated, these requirements apply to this document.<br />\r\nThis
    International Standard is to be used in conjunction with IEC 60761-1:2002. This
    third edition cancels and replaces the second edition published in 2002. This
    edition includes the following significant technical changes with respect to the
    previous edition:<br />\r\n- more precise tests for air-flow were added:<br />\r\n-
    sampled volume correctness;<br />\r\n- flow-rate robustness;<br />\r\n- uncertainties
    have been taken into account for the reference response test;<br />\r\n- addition
    of tests against aerosol granulometry variation;<br />\r\n- creating a uniform
    functionality test for all environmental, electromagnetic and mechanical tests
    and a requirement for the coefficient of variation of each nominal mean reading."
- language: fr
  script: Latn
  content: "IEC 60761-2:2026 s'applique aux équipements destinés au mesurage simultané,
    au mesurage en différé ou au mesurage séquentiel discret des aérosols dans les
    effluents gazeux rejetés dans l'environnement.<br />\r\nElle s'applique aux équipements
    conçus pour remplir les fonctions suivantes:<br />\r\n- le mesurage de l'activité
    volumique (Bq/m3) des aérosols dans les effluents gazeux ou de l'activité totale
    des aérosols rejetés (Bq), ou les deux;<br />\r\n- le déclenchement d'un signal
    d'alarme lorsqu'un niveau d'activité volumique ou d'activité totale prédéterminées
    des aérosols rejetés est dépassé.<br />\r\nCes équipements sont destinés au mesurage
    sur une large plage d'activité, y compris de très petites grandeurs en présence
    d'un bruit de fond naturel beaucoup plus important. À ce bruit de fond naturel
    contribuent en particulier les produits de filiation du 222Rn (radon) et 220Rn
    (thoron), qui sont des aérosols d'origine naturelle.<br />\r\nL'objectif du présent
    document est de définir des exigences normatives spécifiques, et notamment les
    caractéristiques techniques et les conditions générales d'essai, et de donner
    des exemples de méthodes acceptables pour les moniteurs d'effluents d'aérosols.<br
    />\r\nLes exigences générales, les caractéristiques techniques, les procédures
    d'essai, les caractéristiques des rayonnements, les caractéristiques électriques,
    mécaniques, de sécurité et d'environnement sont définies dans l'IEC 60761-1. Sauf
    indication contraire, ces exigences s'appliquent au présent document.<br />\r\nLa
    présente Norme internationale doit être utilisée conjointement avec l'IEC 60761-1:2002.
    Cette troisième édition annule et remplace la deuxième édition parue en 2002.<br
    />\r\nCette édition inclut les modifications techniques significatives suivantes
    par rapport à l'édition précédente:<br />\r\n- ajout d'essais plus précis pour
    le débit d'air;<br />\r\n- exactitude du volume échantillonné;<br />\r\n- robustesse
    du débit;<br />\r\n- prise en compte des incertitudes pour l'essai de réponse
    de référence;<br />\r\n- ajout d'essais contre la variation granulométrique de
    l'aérosol;<br />\r\n- création d'un essai de fonctionnalité uniforme pour tous
    les essais environnementaux, électromagnétiques et mécaniques, et d'une exigence
    relative au coefficient de variation de chaque valeur moyenne nominale lue."
