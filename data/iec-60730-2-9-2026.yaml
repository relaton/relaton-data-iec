abstract:
- language: en
  script: Latn
  content: |-
    IEC 60730-2-9:2026 applies to temperature sensing controls:<br/>
    - for use in, on, or in association with equipment for household appliance and similar use, including equipment for heating, air-conditioning and similar applications. The equipment can use electricity, gas, oil, solid fuel, solar thermal energy, etc., or a combination thereof.<br/>
    NOTE 1 Throughout this document, the word "equipment" means "appliance and equipment" and "controls" means "temperature sensing controls".<br/>
    - for building automation within the scope of ISO 16484 series and IEC 63044 series (HBES/BACS);<br/>
    EXAMPLE 1 Independently mounted temperature sensing controls, controls in smart grid systems and controls for building automation systems within the scope of ISO 16484-2.<br/>
    - for equipment that is used by the public, such as equipment intended to be used in shops, offices, hospitals, farms and commercial and industrial applications;<br/>
    EXAMPLE 2 Controls for commercial catering, heating and air-conditioning equipment.<br/>
    - that are smart enabled controls;<br/>
    EXAMPLE 3 Smart grid control, remote interfaces/control of energy-consuming equipment including computer or smart phone.<br/>
    - that are AC or DC powered controls with a rated voltage not exceeding 690 V AC or 600 V DC;<br/>
    - used in, on, or in association with equipment that use electricity, gas, oil, solid fuel, solar thermal energy, etc., or a combination thereof;<br/>
    - utilized as part of a control system or controls which are mechanically integral with multifunctional controls having non-electrical outputs;<br/>
    - using NTC or PTC thermistors and to discrete thermistors, requirements for which are contained in Annex J;<br/>
    - that have electrical circuits and control circuits which are, for example, operated by bimetals, magnet coils, memory metals, pressure elements, temperature-sensitive expansion elements or electronic elements.<br/>
    - as well as manual controls when such are electrically and/or mechanically integral with automatic controls.<br/>
    NOTE 2 Requirements for manually actuated mechanical switches not forming part of an automatic control are contained in IEC 61058-1-1.<br/>
    This document applies to<br/>
    - the inherent safety of automatic electrical controls, and<br/>
    - functional safety of temperature sensing controls and safety related systems,<br/>
    - controls where the performance (for example the effect of EMC phenomena) of the product can impair the overall safety and performance of the controlled system,<br/>
    - the operating values, operating times, and operating sequences where such are associated with equipment safety and to the testing of automatic electrical temperature sensing control devices used in, or in association with, equipment,<br/>
    EXAMPLE 4 Boiler thermostats, fan controls, temperature limiters and thermal cut-outs.<br/>
    - electrical safety of temperature sensing controls with non-electrical outputs such as refrigerant flow and gas controls,<br/>
    - single-operation devices as defined in this document.<br/>
    This document specifies the requirements for construction, operation and testing of automatic electrical controls used in, on, or in association with an equipment.<br/>
    This document does not<br/>
    - apply to automatic electrical temperature sensing controls intended exclusively for industrial process applications unless explicitly mentioned in the relevant part 2 or the equipment standard. However, this document can be applied to evaluate automatic electrical controls intended specifically for industrial applications in cases where no relevant safety standard exists.<br/>
    - take into account the response value of an automatic action of a control, if such a response value is dependent upon the method of mounting the control in the equipment. Where a response value is of significant purpose for the protection of the user, or surroundings, the value defined in the appropriate equipment standard or as determined by the manufacturer will apply.<br/>
    - address the integrity of the output signal to the network devices, such as interoperability with other devices unless it has been evaluated as part of the control system.<br/>
    This fifth edition cancels and replaces the fourth edition published in 2015, Amendment 1:2018 and Amendment 2:2020. This edition constitutes a technical revision.<br/>
    This edition includes the following significant technical changes with respect to the previous edition:<br/>
    a) adoption of IEC 60730-1:2022 with all of its significant changes to IEC 60730-1:2013, IEC 60730-1:2013/AMD1:2015 and IEC 60730-1:2013/AMD2:2020.
- language: fr
  script: Latn
  content: |-
    L'IEC 60730-2-9:2026 s'applique aux dispositifs de commande thermosensibles:<br/>
    - pour usage dans, sur ou en association avec des matériels à usage domestique ou analogue, y compris les matériels pour le chauffage, l'air conditionné et les applications analogues. Le matériel peut utiliser l'électricité, le gaz, le pétrole, des combustibles solides, l'énergie thermique solaire, etc., ou une combinaison de ces sources d'énergie;<br/>
    NOTE 1 Dans le présent document, le terme "matériel" signifie "appareil et matériel" et "dispositif de commande" signifie "dispositif de commande thermosensible".<br/>
    - pour l'automatisation des bâtiments qui relèvent du domaine d'application de la série ISO 16484 et de la série IEC 63044 (HBES/BACS);<br/>
    EXEMPLE 1 Les dispositifs de commande thermosensibles montés indépendamment, les dispositifs de commande des systèmes de réseau intelligent et les dispositifs de commande des systèmes d'automatisation des bâtiments qui relèvent du domaine d'application de l'ISO 16484 2.<br/>
    - pour des matériels utilisés par le public, tels que les matériels destinés à être utilisés dans des magasins, des bureaux, des hôpitaux, des fermes et des applications commerciales et industrielles;<br/>
    EXEMPLE 2 Les dispositifs de commande pour les installations de restauration, de chauffage et d'air conditionné.<br/>
    - qui sont des dispositifs de commande activés intelligents;<br/>
    EXEMPLE 3 Les dispositifs de commande de réseau intelligent, les interfaces distantes/dispositifs de commande de matériels utilisateurs d'énergie électrique, y compris les ordinateurs ou les mobiles multifonctions.<br/>
    - qui sont des dispositifs de commande à courant alternatif ou continu dont la tension assignée ne dépasse pas 690 V en courant alternatif ou 600 V en courant continu;<br/>
    - qui sont utilisés dans, sur ou avec des matériels qui utilisent l'électricité, le gaz, le pétrole, des combustibles solides, l'énergie thermique solaire, etc. ou une combinaison de ces sources d'énergie;<br/>
    - qui sont utilisés dans le cadre d'un système de commande ou de dispositifs de commande qui sont mécaniquement intégrés à des dispositifs de commande multifonctions comportant des sorties non électriques;<br/>
    - qui utilisent des thermistances CTN ou CTP ainsi qu'aux dispositifs à thermistances discrètes, dont les exigences sont fournies à l'Annexe J;<br/>
    - qui comportent des circuits électriques et circuits de commande mis en œuvre, par exemple, par bilames, enroulements magnétiques, mémoires métalliques, détecteurs de pression, dispositifs thermosensibles à expansion ou éléments électroniques;<br/>
    - ainsi qu'aux dispositifs de commande manuels qui sont électriquement et/ou mécaniquement intégrés à des dispositifs de commande automatique.<br/>
    NOTE 2 Les exigences relatives aux interrupteurs mécaniques à action manuelle qui ne font pas partie d'un dispositif de commande automatique sont contenues dans l'IEC 61058 1 1.<br/>
    Le présent document s'applique<br/>
    - à la sécurité intrinsèque des dispositifs de commande électrique automatiques; et<br/>
    - à la sécurité fonctionnelle des dispositifs de commande thermosensibles et des systèmes de sécurité;<br/>
    - aux dispositifs de commande pour lesquels les performances (par exemple, l'effet des phénomènes CEM) du produit peuvent compromettre la sécurité et les performances globales du système commandé;<br/>
    - aux valeurs de fonctionnement, aux temps de fonctionnement et aux séquences de fonctionnement dans la mesure où ils interviennent dans la sécurité du matériel, ainsi qu'aux essais des dispositifs de commande électrique automatiques thermosensibles utilisés dans ou avec le matériel;<br/>
    EXEMPLE 4 Les thermostats de chaudière, les commandes de ventilation, les limiteurs de température et les coupe circuit thermiques.<br/>
    - à la sécurité électrique des dispositifs de commande thermosensibles non équipés de sorties électriques, tels que les dispositifs de commande de flux réfrigérant et de gaz;<br/>
    - aux dispositifs monocoups définis dans le présent document.<br/>
    Le présent document spécifie les exigences relatives à la construction, au fonctionnement et aux essais des dispositifs de commande électrique automatiques utilisés dans, sur ou avec du matériel.<br/>
    Le présent document<br/>
    - ne s'applique pas aux dispositifs de commande électrique automatiques thermosensibles destinés exclusivement à des applications de processus industriels, sauf mention particulière dans la partie 2 applicable ou la norme du matériel. Toutefois, le présent document peut être utilisé pour évaluer les dispositifs de commande électrique automatiques destinés spécifiquement aux applications industrielles lorsqu'il n'existe aucune norme de sécurité pertinente;<br/>
    - ne prend pas en compte la valeur de réponse d'une action automatique d'un dispositif de commande, lorsque cette valeur de réponse dépend de la méthode de montage du dispositif de commande dans le matériel. Lorsqu'une valeur de réponse est importante du point de vue de la protection de l'utilisateur ou de l'environnement, la valeur définie dans la norme de matériel pertinente ou déterminée par le fabricant s'applique;<br/>
    - ne traite pas de l'intégrité du signal de sortie transmis aux dispositifs de réseau, comme l'interopérabilité avec d'autres dispositifs, à moins qu'elle n'ait été évaluée comme partie intégrante du système de commande.<br/>
    Cette cinquième édition annule et remplace la quatrième édition parue en 2015, l'Amendement 1:2018 et l'Amendement 2:2020. Cette édition constitue une révision technique.<br/>
    Cette édition inclut les modifications techniques majeures suivantes par rapport à l'édition précédente:<br/>
    a) adoption de l'IEC 60730 1:2022 avec toutes les modifications majeures par rapport à l'IEC 60730 1:2013, l'IEC 60730 1:2013/AMD1:2015 et l'IEC 60730 1:2013/AMD2:2020.
