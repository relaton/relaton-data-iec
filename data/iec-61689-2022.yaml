abstract:
- language: en
  script: Latn
  content: |-
    IEC 61689:2022 is applicable to ultrasonic equipment designed for physiotherapy containing an ultrasonic transducer generating continuous or quasi-continuous (e.g. tone burst) wave ultrasound in the frequency range 0,5 MHz to 5 MHz. This document only relates to ultrasonic physiotherapy equipment employing a single plane non-focusing circular transducer per treatment head, producing static beams perpendicular to the face of the treatment head. This document specifies:<br/>
    - methods of measurement and characterization of the output of ultrasonic physiotherapy equipment based on reference testing methods;<br/>
    - characteristics to be specified by manufacturers of ultrasonic physiotherapy equipment based on reference testing methods;<br/>
    - guidelines for safety of the ultrasonic field generated by ultrasonic physiotherapy equipment;<br/>
    - methods of measurement and characterization of the output of ultrasonic physiotherapy equipment based on routine testing methods;<br/>
    - acceptance criteria for aspects of the output of ultrasonic physiotherapy equipment based on routine testing methods.<br/>
    Therapeutic value and methods of use of ultrasonic physiotherapy equipment are not within the scope of this document.<br/>
    Ultrasonic physiotherapy equipment using ultrasound in the frequency range from 20 kHz to 500 kHz is dealt with in IEC 63009.<br/>
    IEC 61689:2022 cancels and replaces the third edition published in 2013. This edition constitutes a technical revision.<br/>
    This edition includes the following significant technical changes with respect to the previous edition.<br/>
    a) The requirement on water oxygen content is specified in 6.1.<br/>
    b) Former recommendations in 6.2 have been changed to become requirements.<br/>
    c) Several definitions in Clause 3 have been updated in line with other TC 87 documents.<br/>
    d) The formerly informative Annex A has been changed to become normative, and now contains details on how conformance with IEC 60601-2-5 requirements is checked.<br/>
    e) Annex D has been considerably shortened and reference to a now withdrawn regulatory document has been removed.
- language: fr
  script: Latn
  content: |-
    L'IEC 61689:2022 est applicable aux appareils à ultrasons, conçus pour la physiothérapie, qui comprennent un transducteur ultrasonique fournissant des ultrasons à onde entretenue ou quasi entretenue (par exemple, salve d’impulsions) dans la plage de fréquences de 0,5 MHz à 5 MHz. Le présent document ne traite que des appareils à ultrasons pour physiothérapie qui emploient un seul transducteur circulaire plan sans focalisation par transducteur, produisant des faisceaux statiques perpendiculaires à la face de ce même transducteur.<br/>
    Le présent document spécifie:<br/>
    - les méthodes de mesure et la caractérisation de la sortie des appareils à ultrasons pour physiothérapie, qui reposent sur des méthodes d’essai de référence;<br/>
    - les caractéristiques à spécifier par les fabricants des appareils à ultrasons pour physiothérapie qui reposent sur des méthodes d’essai de référence;<br/>
    - les lignes directrices de sécurité du champ ultrasonique créé par les appareils à ultrasons pour physiothérapie;<br/>
    - les méthodes de mesure et la caractérisation de la sortie des appareils à ultrasons pour physiothérapie, qui reposent sur des méthodes d’essai individuel de série;<br/>
    - les critères d’aptitude relatifs aux aspects de la sortie des appareils à ultrasons pour physiothérapie, qui reposent sur des méthodes d’essai individuel de série.<br/>
    La valeur thérapeutique et les modes d’utilisation des appareils à ultrasons pour physiothérapie n’entrent pas dans le domaine d’application du présent document.<br/>
    Les appareils à ultrasons pour physiothérapie qui utilisent des ultrasons dont la plage de fréquences est comprise entre 20 kHz et 500 kHz sont couverts par l’IEC 63009.<br/>
    L'IEC 61689:2022 annule et remplace la troisième édition parue en 2013. Cette édition constitue une révision technique.<br/>
    Cette édition inclut les modifications techniques majeures suivantes par rapport à l'édition précédente.<br/>
    a) L’exigence relative à la teneur en oxygène de l’eau est spécifiée en 6.1.<br/>
    b) Les anciennes recommandations spécifiées en 6.2 ont été modifiées pour constituer des exigences.<br/>
    c) Plusieurs définitions de l’Article 3 ont été actualisées conformément à d’autres documents qui relèvent du CE 87.<br/>
    d) L’ancienne Annexe A informative a été modifiée en annexe normative, et contient désormais des informations détaillées sur la méthode selon laquelle la conformité aux exigences de l’IEC 60601-2-5 est vérifiée.<br/>
    e) L’Annexe D a été raccourcie de manière importante et la référence à un document réglementaire désormais supprimé a été retirée.
