abstract:
- language: en
  script: Latn
  content: |-
    IEC 61131-2:2017 specifies functional and electromagnetic compatibility requirements and related verification tests for any product where the primary purpose is performing the function of industrial control equipment, including PLC and/or PAC, and/or their associated peripherals which have as their intended use the control and command of machines, automated manufacturing and industrial processes, e.g. discrete, batch  and continuous control.<br/>
    This fourth edition cancels and replaces the third edition published in 2007. This edition constitutes a technical revision.<br/>
    This edition includes the following significant technical changes with respect to the previous edition:<br/>
    a) removal of safety requirements and instead pointing to IEC 61010-2-201;<br/>
    b) addition of negative logic digital inputs and outputs;<br/>
    c) addition of Type 3-d digital input;<br/>
    d) addition of 2,7 GHz to 6 GHz requirement for Radio-frequency electro-magnetic amplitude modulated immunity;<br/>
    e) clarification of temperature testing;<br/>
    f) clarification of type testing;<br/>
    g) deprecation of certain technologies;<br/>
    h) general update of multiple aspects of functionality and EMC;<br/>
    i) reorganization of clauses to associate requirements and verifications more closely.
- language: fr
  script: Latn
  content: |-
    Ll'IEC 61131-2:2017 spécifie les exigences de fonctionnement et de compatibilité électromagnétique, ainsi que les essais de vérification associés pour tout produit dont l'objectif principal est de remplir la fonction d'équipement de commande industriel, y compris les AP et/ou les PAC, et/ou ses périphériques associés qui sont prévus pour être utilisés comme dispositifs de contrôle et de commande de machines et de procédés de fabrication et autres processus industriels automatisés, par exemple, la commande pas à pas, le contrôle par lots et la régulation continue.<br/>
    Cette quatrième édition annule et remplace la troisième édition parue en 2007. Cette édition constitue une révision technique.<br/>
    Cette édition inclut les modifications techniques majeures suivantes par rapport à l'édition précédente:<br/>
    a) retrait des exigences de sécurité remplacées par des références à l'IEC 61010-2-201;<br/>
    b) ajout d'entrées et de sorties numériques logiques négatives;<br/>
    c) ajout d'une entrée numérique de type 3-d;<br/>
    d) ajout d'une exigence de 2,7 GHz à 6 GHz pour l'immunité modulée en amplitude électromagnétique à fréquence radioélectrique;<br/>
    e) clarification des essais de température;<br/>
    f) clarification des essais de type;<br/>
    g) abandon de certaines technologies;<br/>
    h) actualisation générale de plusieurs aspects de la fonctionnalité et de la CEM;<br/>
    i) réorganisation des articles pour une association plus étroite entre les exigences et les vérifications.
