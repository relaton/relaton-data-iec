abstract:
- language: en
  script: Latn
  content: |-
    IEC 60072-3: 2026 applies to small built-in motors with a pitch circle diameter of the flange between 10 mm and 50 mm. It provides a table with fixing dimensions, shaft extension dimensions and their tolerances.<br/>
    This second edition cancels and replaces the firstedition published in 1994. This edition constitutes a technical revision. This edition includes the following significant technical changes with respect to the previous edition:<br/>
    a) clarification of the scope.
- language: fr
  script: Latn
  content: |-
    IEC 60072-3:2026 s'applique aux petits moteurs incorporés dont la bride a un diamètre du cercle primitif compris entre 10 mm et 50 mm. Elle donne un tableau des dimensions de fixation, des dimensions du bout d'arbre et leurs tolérances.<br/>
    Cette deuxième édition annule et remplace la première édition parue en 1994. Cette édition constitue une révision technique. Cette édition inclut les modifications techniques majeures suivantes par rapport à l'édition précédente:<br/>
    a) clarification du domaine d'application.
