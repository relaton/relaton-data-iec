abstract:
- language: en
  script: Latn
  content: |-
    IEC 60335-2-118:2020 deals with the safety of appliances for making ice cream and artisan gelato.<br/>
    Appliances taken into account are those intended for commercial use and similar appliances not intended for normal household use but which may nevertheless be a source of danger to the public, such as appliances intended to be used by laymen in shops, stores, by artisans or on farms, which rated voltage is not more than 250 V for single-phase appliances and 480 V for other appliances.<br/>
    Appliances covered by this standard are provided with a refrigerant condensing unit which is usually incorporated, but for some appliances may be remote.<br/>
    This standard also applies to following types of appliances:<br/>
    - mixers to make ice cream and similar pastry products in which, for the preparation of the product, an heating process is made within the appliance before the cooling process;<br/>
    - appliances for storing whipping cream mix in a refrigerated tank and for whipping the cream for the delivery process.<br/>
    Attention is drawn to the fact that:<br/>
    – for appliances intended to be used in vehicles or on board ships or aircraft, additional requirements can be necessary;<br/>
    – in many countries, additional requirements are specified by the national health authorities, the national authorities responsible for the protection of labour, the national water supply authorities and similar authorities.<br/>
    This standard does not apply to:<br/>
    – appliances with a refrigerating system operating with flammable refrigerant;<br/>
    – ice cream appliances for household use (IEC 60335-2-24);<br/>
    – appliances intended exclusively for industrial purposes;<br/>
    – appliances intended to be used in locations where special conditions prevail, such as the presence of a corrosive or explosive atmosphere (dust, vapour or gas).<br/>
    This part 2 is to be used in conjunction with the latest edition of IEC 60335-1 and its amendments. It was established on the basis of the fifth edition (2010) of that standard.<br/>
    The contents of the corrigendum of August 2021 have been included in this copy.
- language: fr
  script: Latn
  content: |-
    L'IEC 60335-2-118:2020 traite de la sécurité des appareils qui permettent de fabriquer de la crème glacée et des glaces artisanales.<br/>
    Les appareils dont il est question sont ceux destinés à un usage commercial et analogues non destinés à un usage domestique normal, mais qui peuvent néanmoins constituer une source de danger pour le public, tels que les appareils destinés à être utilisés par des personnes inexpérimentées dans les ateliers ou les magasins, par les artisans ou sur des exploitations agricoles, dont la tension assignée ne dépasse pas 250 V pour les appareils monophasés et 480 V pour les autres appareils.<br/>
    Les appareils couverts par la présente norme sont équipés d'un groupe de condensation frigorifique qui est habituellement intégré, mais cela peut ne pas être le cas pour certains appareils.<br/>
    La présente norme s'applique également aux types d'appareils suivants:<br/>
    - les mélangeurs pour la fabrication de crème glacée et de produits pâtissiers similaires dans lesquels, pour la préparation du produit, un procédé de chauffage est appliqué dans l'appareil avant le procédé de refroidissement;<br/>
    - les appareils pour le stockage du mélange de crème à fouetter dans un réservoir réfrigéré et pour le fouettage de la crème avant le procédé de livraison.<br/>
    L'attention est attirée sur le fait que:<br/>
    – pour les appareils destinés à être utilisés dans des véhicules ou à bord de navires ou d'avions, des exigences supplémentaires peuvent être nécessaires;<br/>
    – dans de nombreux pays, des exigences supplémentaires sont spécifiées par les autorités sanitaires nationales, les organismes nationaux en charge de la protection des travailleurs, les organismes nationaux responsables de l'alimentation en eau et des organismes analogues.<br/>
    La présente norme ne s'applique pas:<br/>
    – aux appareils équipés d'un système de réfrigération fonctionnant avec un fluide frigorigène inflammable;<br/>
    – aux sorbetières destinées à un usage domestique (IEC 60335-2-24);<br/>
    – aux appareils prévus exclusivement pour des usages industriels;<br/>
    – aux appareils destinés à être utilisés dans des locaux présentant des conditions particulières, telles que la présence d'une atmosphère corrosive ou explosive (poussière, vapeur ou gaz).<br/>
    La présente partie 2 doit être utilisée conjointement avec la dernière édition de l'IEC 60335-1 et ses amendements. Elle a été établie sur la base de la cinquième édition (2010) de cette norme.<br/>
    Le contenu du corrigendum d'août 2021 a été pris en considération dans cet exemplaire.
