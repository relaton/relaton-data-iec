abstract:
- language: en
  script: Latn
  content: IEC 61111:2026 is applicable to electrical insulating matting made of flexible
    insulating material for use as a covering of the surface on which the worker is
    positioned and for worker´s electrical protection on electrical installations
    up to 36 000 V AC for AC use or 36 000 V AC and 54 000 V DC for AC/DC use.
- language: fr
  script: Latn
  content: L'IEC 61111:2026 s’applique aux tapis isolants électriques en matériau
    isolant souple utilisés comme revêtement de la surface sur laquelle se tient le
    travailleur et comme protection électrique du travailleur sur des installations
    électriques allant jusqu’à 36 000 V en courant alternatif pour une utilisation
    en courant alternatif ou 36 000 V en courant alternatif et 54 000 V en courant
    continu pour une utilisation en courant alternatif/continu.
