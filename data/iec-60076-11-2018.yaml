abstract:
- language: en
  script: Latn
  content: |-
    IEC 60076-11:2018 applies to dry-type power transformers (including auto-transformers) having values of highest voltage for equipment up to and including 72,5 kV and at least one winding operating at greater than 1,1 kV. This document does not apply to:<br/>
    - gas-filled dry-type transformers where the gas is not air;<br/>
    - single-phase transformers rated at less than 5 kVA;<br/>
    - polyphase transformers rated at less than 15 kVA;<br/>
    - instrument transformers;<br/>
    - starting transformers;<br/>
    - testing transformers;<br/>
    - traction transformers mounted on rolling stock;<br/>
    - flameproof and mining transformers;<br/>
    - welding transformers;<br/>
    - voltage regulating transformers;<br/>
    - small power transformers in which safety is a special consideration.<br/>
    Where IEC standards do not exist for the transformers mentioned above or for other special transformers, this document may be applicable as a whole or in parts. This second edition cancels and replaces the first edition published in 2004 and constitutes a technical revision. The main changes with regard to the previous edition are as follows:<br/>
    - Extension of the scope up to 72,5kV<br/>
    - Enclosure management in regards of the performance<br/>
    - Management of the dielectric and thermal features with altitude<br/>
    - New climatic classes for a better adaptation of customers’ need<br/>
    - Establishment of the relation between location and environmental classes<br/>
    - For fire behaviour classes, limitation at 1000kVA and process of test more robust<br/>
    - Introduction of Seismic class<br/>
    - Recommendations for amorphous transformers<br/>
    Keywords: dry-type transformers<br/>
    The contents of the corrigendum of March 2019 and the Interpretation sheet 1 of July 2020 have been included in this copy.
- language: fr
  script: Latn
  content: |-
    L'IEC 60076-11:2018 applique aux transformateurs de type sec (y compris les autotransformateurs) dont les valeurs de tension la plus élevée pour le matériel sont inférieures ou égales à 72,5 kV avec au moins un enroulement fonctionnant à plus de 1,1 kV. Le présent document ne s'applique pas aux:<br/>
    - transformateurs de type sec avec un diélectrique gazeux autre que l'air;<br/>
    - transformateurs monophasés de moins de 5 kVA;<br/>
    - transformateurs polyphasés de moins de 15 kVA;<br/>
    - transformateurs de mesure;<br/>
    - transformateurs de démarrage;<br/>
    - transformateurs d'essai;<br/>
    - transformateurs de traction montés sur matériel roulant;<br/>
    - transformateurs antidéflagrants et de mines;<br/>
    - transformateurs de soudure;<br/>
    - transformateurs de réglage de tension;<br/>
    - petitstransformateurs de puissance pour lesquels la sécurité est spécialement à prendre en compte.<br/>
    Lorsqu'il n'existe pas de norme IEC pour les transformateurs mentionnés ci-dessus ou pour d'autres transformateurs spéciaux, le présent document peut être appliquée en tout ou en partie. Cette deuxième édition annule et remplace la première édition publiée en 2004 dont elle constitue une révision technique.<br/>
    Les principales modifications par rapport à l'édition précédente sont les suivantes:<br/>
    - Extension du domaine d'application jusqu'à 72,5 kV<br/>
    - Prise en compte des enveloppes en ce qui concerne les performances<br/>
    - Prise en compte des caractéristiques diélectriques et thermiques en fonction de l'altitude<br/>
    - Nouvelles classes climatiques pour une meilleure adaptation des besoins des clients<br/>
    - Établissement de la relation entre l'emplacement et les classes d'environnement<br/>
    - Pour les classes de comportement au feu, limitation à 1 000 kVA et processus d'essai plus robuste<br/>
    - Introduction d'une classe sismique<br/>
    - Recommandations pour les transformateurs amorphes<br/>
    Mots-clés: transformateurs de type sec<br/>
    Le contenu du corrigendum de mars 2019 et la feuille d'interprétation 1 de juillet 2020 (seulement en anglais) a été pris en considération dans cet exemplaire.
