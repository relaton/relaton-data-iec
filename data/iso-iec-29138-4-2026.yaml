abstract:
- language: en
  script: Latn
  content: |-
    <p>This document provides guidance on applying the set of user accessibility needs (UANs) to the procurement, development and evaluation of ICT products and services. This includes guidance on documenting the application of user accessibility needs.</p>
    <p>Applying user accessibility needs helps improve accessibility for all users and in particular for users with special needs that might otherwise be overlooked.</p>
