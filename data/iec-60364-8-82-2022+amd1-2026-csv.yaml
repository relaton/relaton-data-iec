abstract:
- language: en
  script: Latn
  content: |-
    IEC 60364-8-82:2022+AMD1:2026 CSV provides requirements and recommendations that apply to low-voltage electrical installations connected or not to a distribution network able to operate:<br/>
    - with local power supplies, and/or<br/>
    - with local storage units,<br/>
    and that monitors and controls the energy from the locally connected sources delivering it to:<br/>
    - current-using equipment, and/or<br/>
    - local storage units, and/or<br/>
    - distribution networks.<br/>
    Such electrical installations are designated as prosumer's electrical installations (PEIs). These requirements and recommendations apply to new installations and modifications of existing installations. This document also provides requirements and recommendations for the safe, efficient and correct behaviour of these installations when integrated into a smart grid. Information related to grid interaction to ensure the stability of the electrical system for grid connected PEIs is given in Annex B. This document covers the requirements related to stability of islanded and stand-alone PEIs. This first edition cancels and replaces IEC 60364-8-2 published in 2018. This edition constitutes a technical revision.<br/>
    This edition includes the following significant technical changes with respect to IEC 60364­-8-­2:2018:<br/>
    a) the vocabulary and concepts have been aligned as much as possible with those used by TC 8 and SC 8B, taking notably into account the IEC 62898 and IEC 62786 series, still respecting the installers mindset (installers being the first users of the IEC 60364 series and being used to only refer to the IEC 60364 series);<br/>
    b) the type of system earthing and the change of type of system earthing (sequencing) when there is a change of mode of the prosuming installation, have been clarified;<br/>
    c) the conditions of connection and disconnection from the DSO network have also been described, both from the safety point of view and the proper functioning point of view;<br/>
    d) additional requirements have been introduced;<br/>
    e) the figures have been updated;<br/>
    f) a new normative Annex D on single dwelling or similar application islandable PEIs has been added;<br/>
    g) the numbering has also been reviewed to follow the updated numbering system of the IEC 60364 series, in line with the IEC Directives and compatible with Parts 7.
