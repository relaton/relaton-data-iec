abstract:
- language: en
  script: Latn
  content: |-
    IEC 60335-2-49:2021 deals with the safety of electrically operated commercial appliances for keeping food and crockery warm, their rated voltage being not more than 250 V for single-phase appliances connected between one phase and neutral, and 480 V for other appliances.<br/>
    Examples of appliances that are within the scope of this standard are:<br/>
    – hot cupboards, with or without heated tops;<br/>
    – heated tops;<br/>
    – heated display cases;<br/>
    – heated crockery dispensers;<br/>
    – heated tables;<br/>
    – radiant heaters.<br/>
    These appliances are not intended for household and similar purposes. They are used for commercial purposes, processing of food, also in areas open to the public, for example in kitchens of restaurants, canteens, hospitals and in commercial enterprises, such as bakeries and butcheries.<br/>
    The electrical part of appliances making use of other forms of energy is also within the scope of this standard.<br/>
    As far as is practicable, this standard deals with the common hazards presented by these types of appliances.<br/>
    Attention is drawn to the fact that:<br/>
    – for appliances intended to be used in vehicles or on board ships or aircraft, additional requirements can be necessary;<br/>
    – in many countries, additional requirements are specified by the national health authorities, the national authorities responsible for the protection of labour, the national water supply authorities and similar authorities;<br/>
    – in many countries, additional requirements are specified for pressure appliances.<br/>
    This standard does not apply to:<br/>
    – appliances designed exclusively for industrial purposes;<br/>
    – appliances intended to be used in locations where special conditions prevail, such as the presence of a corrosive or explosive atmosphere (dust, vapour or gas);<br/>
    – appliances for continuous mass production of food;<br/>
    – commercial electric bains-marie (IEC 60335-2-50);<br/>
    – battery-operated appliances;<br/>
    – warming plates and similar appliances for household use covered by IEC 60335-2-12 used in the following environments by laymen: staff kitchen areas in shops, offices and other working environments, farm houses, hotels, motels and other residential type environments, bed and breakfast type environments.<br/>
    This fifth edition cancels and replaces the fourth edition published in 2002, Amendment 1:2008 and Amendment 2:2017. This edition constitutes a technical revision.<br/>
    This edition includes the following significant technical changes with respect to the previous edition:<br/>
    a) the text has been aligned with IEC 60335-1:2020;<br/>
    b) introduction of requirements for appliances intended for use in areas open to the public, including external accessible surface temperatures (Clause 1, 7.12, 11.8, Table 102);<br/>
    c) exclusion of battery-operated appliances (Clause 1);<br/>
    d) clarification of applicable standard for appliances for use by laymen (Clause 1, 7.12);<br/>
    e) relocation of cleaning instructions from 7.12.1 to 7.12;<br/>
    f) relocation of 24.101 to 22.106;<br/>
    g) conciliation of the text of IEC 60335-2-49 with other standards under IEC/TC61/MT32;<br/>
    h) some notes have been converted to normative text, modified or deleted (Clause 1, 7.1, 7.15, 11.3, 11.7, 15.2, 19.2, 22.101, 23.3);<br/>
    i) additional requirements for measurement of input current;<br/>
    j) clarification of the testing procedure in 15.1.1;<br/>
    k) clarification of the test conditions in 20.1 and 23.3;<br/>
    l) clarifications of the requirements in 25.3.<br/>
    This Part 2 is to be used in conjunction with the latest edition of IEC 60335-1 and its amendments unless that edition precludes it; in that case, the latest edition that does not preclude it is used. It was established on the basis of the sixth edition (2020) of that standard.
- language: fr
  script: Latn
  content: |-
    L'IEC 60335-2-49:2021 traite de la sécurité des appareils électriques à usage commercial destinés à maintenir au chaud les aliments et la vaisselle, dont la tension assignée est inférieure ou égale à 250 V pour les appareils monophasés raccordés entre un conducteur de phase et le conducteur de neutre, et à 480 V pour les autres appareils.<br/>
    La liste suivante répertorie les exemples d'appareils qui relèvent du domaine d'application de la présente norme:<br/>
    – les armoires chauffantes, avec ou sans dessus chauffants;<br/>
    – les dessus chauffants;<br/>
    – les comptoirs de distribution chauffants;<br/>
    – les distributeurs de vaisselle chaude;<br/>
    – les tables chauffantes;<br/>
    – les appareils de chauffage rayonnants.<br/>
    Ces appareils ne sont pas destinés à un usage domestique ou analogue. Ils sont destinés à un usage commercial pour le traitement des aliments dans des lieux ouverts au public, par exemple dans les cuisines de restaurants, les cantines, les hôpitaux et les entreprises commerciales, telles que les boulangeries et les boucheries.<br/>
    La partie électrique des appareils qui utilisent d'autres formes d'énergie est également comprise dans le domaine d'application de la présente norme.<br/>
    Dans la mesure du possible, la présente norme traite des dangers courants que présentent ces types d'appareils.<br/>
    L'attention est attirée sur le fait que:<br/>
    – pour les appareils destinés à être utilisés dans des véhicules ou à bord de navires ou d'avions, des exigences supplémentaires peuvent être nécessaires;<br/>
    – dans de nombreux pays, des exigences supplémentaires sont spécifiées par les organismes nationaux de la santé, par les organismes nationaux responsables de la protection des travailleurs, par les organismes nationaux responsables de l'alimentation en eau et par des organismes similaires;<br/>
    – dans de nombreux pays, des exigences supplémentaires sont spécifiées pour les appareils sous pression.<br/>
    La présente norme ne s'applique pas:<br/>
    – aux appareils prévus exclusivement pour des usages industriels;<br/>
    – aux appareils destinés à être utilisés dans des locaux qui présentent des conditions particulières, telles que la présence d'une atmosphère corrosive ou explosive (poussière, vapeur ou gaz);<br/>
    – aux appareils conçus pour la production continue en masse d'aliments;<br/>
    – aux bains-marie électriques à usage commercial (IEC 60335-2-50);<br/>
    – aux appareils alimentés par batteries;<br/>
    – aux plaques chauffantes et appareils analogues destinés à un usage domestique couverts par l'IEC 60335-2-12 et utilisés par des usagers non avertis dans les environnements suivants:<br/>
    • les coins cuisines réservés au personnel des magasins, bureaux et autres environnements professionnels;<br/>
    • les fermes;<br/>
    • les hôtels, les motels et autres environnements résidentiels;<br/>
    • les environnements de type chambres d'hôtes.<br/>
    Cette cinquième édition annule et remplace la quatrième édition parue en 2002, l'Amendement 1:2008 et l'Amendement 2:2017. Cette édition constitue une révision technique.<br/>
    Cette édition inclut les modifications techniques majeures suivantes par rapport à l'édition précédente:<br/>
    a) alignement du texte sur l'IEC 60335-1:2020;<br/>
    b) introduction d'exigences pour les appareils destinés à être utilisés dans des lieux ouverts au public, y compris les températures des surfaces accessibles extérieures (Article 1, 7.12, 11.8, Tableau 102);<br/>
    c) exclusion des appareils alimentés par batteries (Article 1);<br/>
    d) clarification de la norme applicable aux appareils destinés à être utilisés par des usagers non avertis (Article 1, 7.12);<br/>
    e) déplacement des instructions pour le nettoyage du 7.12.1 au 7.12;<br/>
    f) déplacement du 24.101 au 22.106;<br/>
    g) alignement du texte de l'IEC 60335-2-49 sur d'autres normes sous l'IEC/TC61/MT32;<br/>
    h) conversion en texte normatif, modification ou suppression de certaines notes (Article 1, 7.1, 7.15, 11.3, 11.7, 15.2, 19.2, 22.101, 23.3);<br/>
    i) ajout d'exigences pour le mesurage du courant d'entrée;<br/>
    j) clarification de la procédure d'essai en 15.1.1;<br/>
    k) clarification des conditions d'essai en 20.1 et en 23.3;<br/>
    l) clarification des exigences du 25.3.<br/>
    La présente Partie 2 doit être utilisée conjointement avec la dernière édition de l'IEC 60335-1 et ses amendements, sauf si cette édition l'exclut. Dans ce cas, la dernière édition qui n'exclut pas la présente Partie 2 est utilisée. Elle a été établie sur la base de la sixième édition (2020) de cette norme.
