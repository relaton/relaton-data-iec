abstract:
- language: en
  script: Latn
  content: |-
    IEC 62541-6:2020 RLV contains both the official IEC International Standard and its Redline version. The Redline version is available in English only and provides you with a quick and easy way to compare all the changes between the official IEC Standard and its previous edition.<br/>
    IEC 62541-6:2020 specifies the OPC Unified Architecture (OPC UA) mapping between the security model described in IEC TR 62541-2, the abstract service definitions specified in IEC 62541-4, the data structures defined in IEC 62541-5 and the physical network protocols that can be used to implement the OPC UA specification. This third edition cancels and replaces the second edition published in 2015. This edition constitutes a technical revision. This edition includes the following significant technical changes with respect to the previous edition:<br/>
    a) Encodings:<br/>
    • added JSON encoding for PubSub (non-reversible);<br/>
    • added JSON encoding for Client/Server (reversible);<br/>
    • added support for optional fields in structures;<br/>
    • added support for Unions.<br/>
    b) Transport mappings:<br/>
    • added WebSocket secure connection – WSS;<br/>
    • added support for reverse connectivity;<br/>
    • added support for session-less service invocation in HTTPS.<br/>
    c) Deprecated Transport (missing support on most platforms):<br/>
    • SOAP/HTTP with WS-SecureConversation (all encodings).<br/>
    d) Added mapping for JSON Web Token.<br/>
    e) Added support for Unions to NodeSet Schema.<br/>
    f) Added batch operations to add/delete nodes to/from NodeSet Schema.<br/>
    g) Added support for multi-dimensional arrays outside of Variants.<br/>
    h) Added binary representation for Decimal data types.<br/>
    i) Added mapping for an OAuth2 Authorization Framework.
