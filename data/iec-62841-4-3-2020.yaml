abstract:
- language: en
  script: Latn
  content: |-
    IEC 62841-4-3:2020 This document applies to the design of pedestrian controlled walk-behind<br/>
    - cylinder lawnmowers;<br/>
    and<br/>
    - rotary lawnmowers<br/>
    equipped with<br/>
    - metallic cutting means; and/or<br/>
    - rigid non-metallic cutting means; and/or<br/>
    - non-metallic cutting means with one or more cutting elements pivotally mounted on a generally circular drive unit, where these cutting elements rely on centrifugal force to achieve cutting, and have a kinetic energy for each single cutting element of greater than 10 J.<br/>
    This document does not apply to<br/>
    - robotic lawnmowers;<br/>
    - remote-controlled lawnmowers;<br/>
    - flail mowers or flail-type attachments;<br/>
    - scissors type lawnmowers;<br/>
    - grassland mowers;<br/>
    - sickle bar mowers;<br/>
    - towed/semi-mounted grass-cutting machines;<br/>
    - scrub-clearing machines;<br/>
    - lawn trimmers and lawn edge trimmers;<br/>
    - lawn edgers;<br/>
    - grass trimmers;<br/>
    - brush cutters;<br/>
    - brush saws;<br/>
    - agricultural mowers;<br/>
    - trailing seat/sulky units;<br/>
    - ride-on machines;<br/>
    - non-powered lawnmowers;<br/>
    - combustion engine powered lawnmowers;<br/>
    - hybrid and fuel cell powered machines and associated charging systems; and<br/>
    - garden tractors or their attachments.<br/>
    Robotic lawnmowers are covered by IEC 60335-2-107, and will be covered by a future part of IEC 62841.
- language: fr
  script: Latn
  content: |-
    IEC 62841-4-3:2020 Le présent document s’applique à la conception des<br/>
    - tondeuses à lames hélicoïdales;<br/>
    et<br/>
    - tondeuses à axe vertical<br/>
    à conducteur à pied équipées<br/>
    - d'un organe de coupe métallique; et/ou<br/>
    - d’un organe de coupe non métallique rigide; et/ou<br/>
    - d’un organe de coupe non métallique avec un ou plusieurs éléments de coupe montés de façon pivotante sur une unité centrale, en général circulaire, l’action de coupe de ces éléments dépendant de la force centrifuge et l’énergie cinétique de chaque élément de coupe unique étant supérieure à 10 J.<br/>
    Le présent document ne s’applique pas aux:<br/>
    - tondeuses à gazon robotisées;<br/>
    - tondeuses télécommandées;<br/>
    - tondeuses à fléaux ou équipements à fléaux;<br/>
    - tondeuses à cisailles;<br/>
    - faucheuses;<br/>
    - tondeuses à barre de coupe;<br/>
    - tondeuses remorquées/semi-portées;<br/>
    - débroussailleuses;<br/>
    - coupe-gazon et coupe-bordures;<br/>
    - taille-bordures;<br/>
    - coupe-herbes;<br/>
    - débroussailleuses;<br/>
    - débroussailleuses à lame de scie;<br/>
    - tondeuses agricoles;<br/>
    - sièges tirés/sulkys;<br/>
    - machines à conducteur porté;<br/>
    - tondeuses non motorisées;<br/>
    - tondeuses à gazon à moteur à combustion interne;<br/>
    - machines à moteur hybride et à pile à combustible et systèmes de charge associés; et<br/>
    - tracteurs de jardin ou leurs équipements.<br/>
    Les tondeuses à gazon robotisées sont traitées par l’IEC 60335-2-107, et seront traitées par une future partie de l’IEC 62841.
