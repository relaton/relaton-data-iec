abstract:
- language: en
  script: Latn
  content: |-
    IEC 60730-2-10:2026 applies to automatic electrical motor-starting relays<br/>
    - intended to control the start windings of single phase motors;<br/>
    - for use in, on, or in association with equipment for household appliance and similar use;<br/>
    NOTE 1 Throughout this document, the word "equipment" means "appliance and equipment" and "control" means "motor-starting relays".<br/>
    - intended for appliances within the scope of IEC 60335;<br/>
    - for equipment that is used in building automation within the scope of ISO 16484 series and IEC 63044 series (HBES/BACS);<br/>
    - for equipment that is used by the public, such as equipment intended to be used in shops, offices, hospitals, farms and commercial and industrial applications;<br/>
    EXAMPLE 1 Controls for commercial catering, heating and air-conditioning equipment.<br/>
    - used in, on, or in association with equipment that are smart enabled;<br/>
    EXAMPLE 2 Smart grid control, remote interfaces/control of energy-consuming equipment.<br/>
    - that are AC or DC powered with a rated voltage not exceeding 690 V AC or 600 V DC;<br/>
    - used in, on, or in association with equipment that use electricity, gas, oil, solid fuel, solar thermal energy, etc., or a combination thereof;<br/>
    - utilized as part of a control system or controls which are mechanically integral with multifunctional controls having non-electrical outputs;<br/>
    - using NTC or PTC thermistors, requirements for which are contained in Annex J;<br/>
    - that are mechanically or electrically operated, responsive to or controlling such characteristics as current and voltage, or combinations thereof;<br/>
    EXAMPLE 3 Centrifugal motor-starting devices.<br/>
    - as well as manual controls when such are electrically and/or mechanically integral with automatic controls.<br/>
    NOTE 2 Requirements for manually actuated mechanical switches not forming part of an automatic control are contained in IEC 61058‑1‑1.<br/>
    This document applies to<br/>
    - the inherent safety of motor-starting control, and<br/>
    - functional safety of motor-starting control and safety related systems (when required),<br/>
    - controls where the performance (for example the effect of EMC phenomena) of the product can impair the overall safety and performance of the controlled system,<br/>
    - the operating values, operating times, and operating sequences where such are associated with equipment safety,<br/>
    - motor-starting controls incorporating electronic devices, thermistor elements, thermal elements or magnetic elements.<br/>
    This document specifies the requirements for construction, operation and testing of automatic electrical motor-starting relays used in, on, or in association with an equipment.<br/>
    This document does not<br/>
    - apply to motor-starting relays designed exclusively for industrial process applications unless explicitly mentioned in the relevant equipment standard. However, this document can be applied to motor-start relays for equipment intended specifically for industrial applications in cases where no relevant safety standard exists;<br/>
    - take into account the response value of an automatic action of a control, if such a response value is dependent upon the method of mounting the control in the equipment. Where a response value is of significant purpose for the protection of the user, or surroundings, the value defined in the appropriate equipment standard or as determined by the manufacturer will apply;<br/>
    - apply to general purpose relays or to contactors and motor starters of the type covered by IEC 60947 series;<br/>
    apply to mechanically operated motor-starting devices<br/>
    This part 2‑10 is intended to be used in conjunction with IEC 60730‑1. It was established on the basis of the sixth edition of that standard (2022). Consideration may be given to future editions of, or amendments to, IEC 60730‑1.<br/>
    This part 2‑10 supplements or modifies the corresponding clauses in IEC 60730‑1, so as to convert that publication into the IEC standard: Particular requirements for motor-starting relays.<br/>
    Where this part 2‑10 states "addition", "modification" or "replacement", the relevant require­ment, test specification or explanatory matter in Part 1 should be adapted accordingly.<br/>
    When a particular subclause of Part 1 is not mentioned in this part 2, that subclause applies.<br/>
    This third edition cancels and replaces the second edition published in 2006. This edition constitutes a technical revision.<br/>
    This edition includes the following significant technical changes with respect to the previous edition:<br/>
    a) adoption of IEC 60730‑1:2022 with all of its significant changes.
- language: fr
  script: Latn
  content: |-
    L'IEC 60730-2-10:2026 s'applique aux relais électriques automatiques de démarrage de moteur<br/>
    - destinés à commander les enroulements de démarrage des moteurs monophasés;<br/>
    - destinés à être utilisés dans, sur ou avec des matériels pour appareils domestiques et à usage analogue;<br/>
    NOTE 1 Dans le présent document, le terme "matériel" signifie "appareil et matériel" et le terme "dispositif de commande" signifie "relais de démarrage de moteur".<br/>
    - destinés aux appareils relevant du domaine d'application de l'IEC 60335;<br/>
    - pour les matériels utilisés dans l'automatisation des bâtiments relevant du domaine d'application de la série ISO 16484 et de la série IEC 63044 (HBES/SGTB);<br/>
    - pour des matériels utilisés par le public, tels que les matériels destinés à être utilisés dans des magasins, des bureaux, des hôpitaux, des fermes et des applications commerciales et industrielles;<br/>
    EXEMPLE 1 Dispositifs de commande pour les installations de restauration, de chauffage et d'air conditionné.<br/>
    - utilisés dans, sur ou avec des matériels activés intelligents;<br/>
    EXEMPLE 2 Dispositif de commande de réseau électrique intelligent, interfaces à distance/dispositif de commande de matériels consommateurs d'énergie.<br/>
    - qui sont alimentés en courant alternatif ou en courant continu avec une tension assignée qui ne dépasse pas 690 V en courant alternatif ou 600 V en courant continu;<br/>
    - qui sont utilisés dans, sur ou avec des matériels qui utilisent l'électricité, le gaz, le pétrole, des combustibles solides, l'énergie thermique solaire, etc. ou une combinaison de ces sources d'énergie;<br/>
    - qui sont utilisés comme partie d'un système de commande ou de dispositifs de commande qui sont mécaniquement intégrés à des dispositifs de commande multifonctions comportant des sorties non électriques;<br/>
    - qui utilisent des thermistances CTP ou CTN dont les exigences sont fournies à l'Annexe J;<br/>
    - qui sont actionnés mécaniquement ou électriquement, qui commandent ou sont sensibles à des caractéristiques telles que le courant et la tension, ou leurs combinaisons;<br/>
    EXEMPLE 3 Dispositifs d'amorçage de moteur centrifuge.<br/>
    - ainsi qu'aux dispositifs de commande manuels qui sont électriquement et/ou mécaniquement intégrés à des dispositifs de commande automatique.<br/>
    NOTE 2 Les exigences relatives aux interrupteurs mécaniques à action manuelle qui ne font pas partie d'un dispositif de commande automatique sont contenues dans l'IEC 61058‑1‑1.<br/>
    Le présent document s'applique<br/>
    - à la sécurité intrinsèque des dispositifs de commande de démarrage,<br/>
    - à la sécurité fonctionnelle des systèmes de commande de démarrage de moteur et des systèmes de sécurité (si nécessaire),<br/>
    - aux dispositifs de commande pour lesquels les performances (par exemple, l'effet des phénomènes de CEM) du produit peuvent compromettre la sécurité et les performances globales du système commandé,<br/>
    - aux valeurs de fonctionnement, aux temps de fonctionnement et aux séquences de fonctionnement lorsque ces éléments interviennent dans la sécurité du matériel,<br/>
    - aux dispositifs de commande de démarrage de moteur qui incorporent des dispositifs électroniques, des éléments de thermistance, des éléments thermiques ou des éléments magnétiques.<br/>
    Le présent document spécifie les exigences relatives à la construction, au fonctionnement et aux essais des relais électriques automatiques de démarrage de moteur utilisés dans, sur ou avec du matériel.<br/>
    Le présent document<br/>
    - ne s'applique pas aux relais de démarrage de moteur conçus exclusivement pour des applications de processus industriels, sauf si cela est explicitement mentionné dans la norme correspondante du matériel concerné. Toutefois, le présent document peut s'appliquer aux relais de démarrage de moteur pour des matériels destinés spécifiquement à des applications industrielles, lorsqu'il n'existe aucune norme de sécurité pertinente;<br/>
    - ne prend pas en considération la valeur de réponse d'une action automatique d'un dispositif de commande lorsqu'elle est influencée par la méthode de montage du dispositif de commande dans le matériel. Lorsqu'une telle valeur de réponse est importante du point de vue de la protection de l'utilisateur ou de l'environnement, la valeur définie dans la norme particulière du matériel ou déterminée par le fabricant s'applique;<br/>
    - ne s'applique pas aux relais ou aux contacteurs à usage général et aux démarreurs de moteurs du type couvert par la série IEC 60947;<br/>
    ne s'applique pas aux dispositifs de démarrage de moteur à commande mécanique.<br/>
    La présente partie 2‑10 est destinée à être utilisée conjointement avec l'IEC 60730‑1. Elle a été établie sur la base de la sixième édition de cette norme (2022). Les futures éditions de l'IEC 60730‑1, ou de ses amendements, pourront être prises en compte.<br/>
    La présente partie 2‑10 complète ou modifie les articles correspondants de l'IEC 60730‑1, de façon à transformer cette publication en norme IEC: Exigences particulières pour les relais de démarrage de moteur.<br/>
    Lorsque la présente partie 2‑10 spécifie "addition", "modification" ou "remplacement", il convient d'adapter l'exigence, la modalité d'essai ou les notes correspondantes de la Partie 1 en conséquence.<br/>
    Lorsqu'un paragraphe particulier de la Partie 1 n'est pas mentionné dans cette partie 2, ce paragraphe s'applique.<br/>
    Cette troisième édition annule et remplace la deuxième édition parue en 2006. Cette édition constitue une révision technique.<br/>
    Cette édition inclut les modifications techniques significatives suivantes par rapport à l'édition précédente:<br/>
    a) adoption du contenu de l'IEC 60730‑1:2022 avec toutes ses modifications significatives.
