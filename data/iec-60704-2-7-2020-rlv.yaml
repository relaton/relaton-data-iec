abstract:
- language: en
  script: Latn
  content: |-
    IEC 60704-2-7:2020 RLV contains both the official IEC International Standard and its Redline version. The Redline version is available in English only and provides you with a quick and easy way to compare all the changes between the official IEC Standard and its previous edition.
    <p>IEC 60704-2-7:2020 applies to electrical fans (including their accessories and their component parts) for household and similar use, designed for AC or DC supply. The motor, the impeller and their housing, if any, form a single unit. These particular requirements apply to:<br/>
    – conventional fans,<br/>
    – table fans,<br/>
    – pedestal fans,<br/>
    – ceiling fans,<br/>
    – bladeless fans,<br/>
    – wall bracket fans,<br/>
    – ceiling bracket fans,<br/>
    – louver fans,<br/>
    – tower fans,<br/>
    – ventilating and partition ventilating fans.<br/>
    This standard does not apply to:<br/>
    – fans that are part of a ventilation system,<br/>
    – fans designed exclusively for industrial purposes,<br/>
    – fans that are part of an appliance (for example cooling fans),<br/>
    – fans with additional functions (for example heating, humidifying).<br/>
    Limitations for the use of this test code are given in the scope of IEC 60704-1.<br/>
    This second edition cancels and replaces the first edition published in 1997. This edition constitutes a technical revision.<br/>
    This edition includes the following significant changes with respect to the previous edition:<br/>
    a) it includes additional fan categories as defined in IEC 60879:2019 and IEC 60665:2018;<br/>
    b) it includes standard deviations of sound power levels in 1.3;<br/>
    c) a comparison method has been added;<br/>
    d) the normative references have been updated (ISO 3744:2010 and ISO 3743-1:2010);<br/>
    e) it has been adjusted with regard to IEC 60704-1:2010.<br/>
    This International Standard is to be used in conjunction with IEC 60704 1:2010, Household and similar electrical appliances – Test code for the determination of airborne acoustical noise – Part 1: General requirements. This Part 2-7 supplements or modifies the corresponding clauses in IEC 60704-1:2010, so as to establish the test code for fans.</p>
