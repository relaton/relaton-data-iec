abstract:
- language: en
  script: Latn
  content: |-
    IEC 61000-4-2: 2025 relates to the immunity requirements and test methods for electrical and electronic equipment subjected to static electricity discharges from operators directly and from personnel to adjacent objects. It additionally specifies ranges of test levels which relate to different environmental, and installation conditions and establishes test procedures. The objective of this document is to establish a common and reproducible basis for evaluating the performance of electrical and electronic equipment when subjected to electrostatic discharges. In addition, it includes electrostatic discharges which can occur from personnel to objects near the equipment. This document specifies:<br/>
    - ideal waveform of the discharge current;<br/>
    - range of test levels;<br/>
    - test equipment;<br/>
    - test setup;<br/>
    - test procedure;<br/>
    - calibration procedure;<br/>
    - measurement uncertainty.<br/>
    This document gives specifications for tests performed in laboratories and guidance to post-installation tests. This document is not intended to specify the tests to be applied to particular apparatus or systems. The main aim is to give a general basic reference to all concerned product committees. The product committees remain responsible for the appropriate choice of the tests and the severity level to be applied to their equipment. This document excludes tests intended to evaluate the ESD sensitivity of devices during handling and packaging. It is not intended for use in characterizing the performance of ESD protection circuit IEC Guide 107.<br/>
    This document forms Part 4-2 of IEC 61000. It has the status of a basic EMC publication in accordance with IEC Guide 107. This third edition cancels and replaces the second edition published in 2008. This edition constitutes a technical revision.<br/>
    This edition includes the following significant technical changes with respect to the previous edition:<br/>
    a) added a calibration requirement for ESD generators with air discharge tip;<br/>
    b) added a normative annex for test setups for particular kind of equipment (see Annex I);<br/>
    c) added an informative annex for wearable devices (see Annex J);<br/>
    d) added an informative annex on how to select test points and give guidance on how to specify the number of pulses for direct contact discharges (see Annex E);<br/>
    e) moved Clause 9 into a new informative annex (see Annex K);<br/>
    f) improvement of the current calibration procedure;<br/>
    g) improvement of the measurement uncertainty considerations with examples of uncertainty budgets;<br/>
    h) because post-installation tests cannot be performed in a controlled environment, this test method has been moved into a new informative Annex G.
- language: fr
  script: Latn
  content: |-
    IEC 61000-4-2: 2025 se rapporte aux exigences et méthodes d'essais relatives à l'immunité des matériels électriques et électroniques, soumis à des décharges d'électricité statique produites directement par les opérateurs, et entre le personnel et des objets situés à proximité. Elle spécifie en outre des plages de niveaux d'essais, qui correspondent à différentes conditions d'environnement et d'installation et elle établit des procédures d'essai.<br/>
    Le présent document a pour objectif d'établir une base commune et reproductible pour l'évaluation des performances des matériels électriques et électroniques lorsqu'ils sont soumis à des décharges électrostatiques. Il intègre également les décharges électrostatiques qui peuvent se produire entre le personnel et des objets situés à proximité des matériels. Le présent document spécifie:<br/>
    - la forme d'onde idéale du courant de décharge;<br/>
    - la plage des niveaux d'essais;<br/>
    - le matériel d'essai;<br/>
    - le montage d'essai;<br/>
    - la procédure d'essai;<br/>
    - la procédure d'étalonnage;<br/>
    - l'incertitude de mesure.<br/>
    Le présent document donne des spécifications pour les essais réalisés en laboratoire et des recommandations pour les essais après installation.<br/>
    Le présent document ne vise pas à spécifier les essais à appliquer à des appareils ou systèmes particuliers. L'objet principal est de donner une référence principale générale à tous les comités de produits concernés. Les comités des produits restent responsables du choix approprié des essais et du niveau de sévérité à appliquer à leur matériel.<br/>
    Le présent document exclut les essais destinés à évaluer la sensibilité aux DES des dispositifs au cours de la manipulation et de l'emballage. Il n'est pas destiné à caractériser les performances des circuits de protection contre les DES.<br/>
    Cette troisième édition annule et remplace la deuxième édition parue en 2008. Cette édition constitue une révision technique.<br/>
    Cette édition inclut les modifications techniques majeures suivantes par rapport à l'édition précédente:<br/>
    a) ajout d'une exigence d'étalonnage pour les générateurs de DES à tête de décharge dans l'air;<br/>
    b) ajout d'une annexe normative pour les montages d'essai pour un type de matériel particulier (voir l'Annexe I)<br/>
    c) ajout d'une annexe informative pour les dispositifs portables (voir l'Annexe J);<br/>
    d) ajout d'une annexe informative qui décrit comment choisir les points d'essai et donne des recommandations sur la manière de spécifier le nombre d'impulsions pour les décharges au contact direct (voir l'Annexe E);<br/>
    e) transfert de l'Article 9 dans une nouvelle annexe informative (voir l'Annexe K);<br/>
    f) amélioration de la procédure d'étalonnage actuelle;<br/>
    g) amélioration des considérations relatives à l'incertitude de mesure par des exemples de bilans d'incertitude;<br/>
    h) les essais après installation ont été déplacés dans une nouvelle Annexe G informative car ils ne peuvent pas être réalisés dans un environnement maît
