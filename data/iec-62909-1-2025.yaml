abstract:
- language: en
  script: Latn
  content: |-
    IEC 62909-1:2025 specifies general and safety aspects of bi-directional grid-connected power converters (GCPC), consisting of a grid-side inverter with two or more types of DC power ports on the application side with system voltages not exceeding 1 000 V AC or 1 500 V DC.<br/>
    This document can also be used for the special case of a multiple DC power port GCPC used in an application requiring only one DC power port.<br/>
    This document considers general aspects such as terminology, specifications, performance, system architecture, as well as safety requirements.<br/>
    This document does not cover:<br/>
    - uninterruptible power supply (UPS) systems, which fall under the scope of the IEC 62040 series,<br/>
    - power conversion equipment for use in photovoltaic systems, which fall under the scope of the IEC 62109 series, and<br/>
    - bi-directional power converters to charge or discharge the batteries located within electric vehicles or in the charging station, which fall under the scope of the IEC 61851 series.<br/>
    NOTE 1 The external system (e.g. energy management system, utility operations system) is not defined in this document.<br/>
    NOTE 2 The power converter sub-system case for use in electrical energy storage systems is currently covered by this document but will be covered by the IEC 63285 series (under preparation).<br/>
    NOTE 3 Annex A provides examples of GCPCs. These examples contain GCPCs covered and not covered by this document.<br/>
    This second edition includes the following significant technical changes with respect to the previous edition:<br/>
    a) the title has been changed by adding the wording "and safety";<br/>
    b) the scope has been changed in order to clarify the bi-directional grid-connected power converters (GCPCs) covered by this document.
- language: fr
  script: Latn
  content: |-
    L'IEC 62909-1:2025 spécifie les aspects généraux et les aspects de sécurité des convertisseurs de puissance connectés aux réseaux bidirectionnels (GCPC), composés d'un onduleur côté réseau avec plusieurs types d'accès d'alimentation en courant continu côté application avec des tensions systèmes qui ne dépassent pas 1 000 V en courant alternatif ou 1 500 V en courant continu.<br/>
    Le présent document peut également être utilisé dans le cas particulier qui consiste à utiliser un GCPC équipé de plusieurs accès d'alimentation en courant continu dans une application qui ne nécessite qu'un seul accès d'alimentation en courant continu.<br/>
    Le présent document traite des aspects généraux tels que la terminologie, les spécifications, les performances, l'architecture système ainsi que les exigences de sécurité.<br/>
    Le présent document ne couvre pas<br/>
    - les systèmes d'alimentation sans interruption (ASI), qui relèvent du domaine d'application de la série IEC 62040,<br/>
    - les équipements de conversion de puissance utilisés dans les systèmes photovoltaïques, qui relèvent du domaine d'application de la série IEC 62109, ni<br/>
    - les convertisseurs de puissance bidirectionnels avec un seul accès utilisés pour la charge et la décharge de batteries installées dans des véhicules électriques ou dans la borne de charge, qui relèvent du domaine d'application de la série IEC 61851.<br/>
    NOTE 1 Le système externe (par exemple, système de gestion de l'énergie, système d'exploitation des services publics) n'est pas défini dans le présent document.<br/>
    NOTE 2 Le cas du sous-système de convertisseur de puissance utilisé dans les systèmes de stockage de l'énergie électrique est actuellement couvert par le présent document, mais il relèvera de la série IEC 63285 (en cours d’élaboration).<br/>
    NOTE 3 L'Annexe A présente des exemples de GCPC. Ces exemples comprennent des GCPC couverts et des GCPC non couverts par le présent document.<br/>
    Cette deuxième édition inclut les modifications techniques majeures suivantes par rapport à l'édition précédente:<br/>
    a) le titre a été modifié par l'ajout de la mention "et exigences de sécurité";<br/>
    b) le domaine d'application a été modifié afin de préciser les convertisseurs de puissance connectés aux réseaux bidirectionnels (GCPC) couverts par le présent document.
