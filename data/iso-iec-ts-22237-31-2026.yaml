abstract:
- language: en
  script: Latn
  content: |
    <p>This document:</p>

    <!-- [if !supportLists]-->defines metrics as key performance indicators (KPIs) for resilience, dependability, fault tolerance and availability tolerance for data centres;
    <!-- [if !supportLists]-->covers the data centre infrastructure (DCI) of power distribution and supply, and environmental control;
    <!-- [if !supportLists]-->can be referred to for covering further infrastructures, e.g. telecommunications cabling;
    <!-- [if !supportLists]-->defines the measurement and calculation of the KPIs and resilience levels (RLs);
    <!-- [if !supportLists]-->targets maintainability, recoverability and vulnerability;
    <!-- [if !supportLists]-->provides examples for calculating these KPIs for the purpose of analytical comparison of different DCIs.
    This document does not apply to IT equipment, cloud services, software or business applications.
