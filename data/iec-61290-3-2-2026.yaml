abstract:
- language: en
  script: Latn
  content: |-
    IEC 61290-3-2:2026 applies to all commercially available optical amplifiers (OAs), including OAs using optically pumped fibres (i.e. optical fibre amplifiers (OFAs) based on either rare-earth doped fibres or on the Raman effect), semiconductor optical amplifiers (SOAs), and planar waveguide optical amplifiers (PWOAs).<br/>
    This document defines requirements for accurate and reliable measurements of the noise figure parameters of OAs by means of the electrical spectrum analyser (ESA) method. The noise figure parameters of OAs are defined in IEC 61291-1.<br/>
    This edition includes the following significant technical changes with respect to the previous edition:<br/>
    a) shortening and clarification of the scope in Clause 1;<br/>
    b) update of the normative references in Clause 2;<br/>
    c) deletion of duplicate instructions in 7.2 to measure the time-average input power;<br/>
    d) deletion of unused symbols in 3.3 and addition of new symbol.
- language: fr
  script: Latn
  content: |-
    L'IEC 61290-3-2:2026 s’applique aux amplificateurs optiques (OA) disponibles sur le marché, y compris les OA qui utilisent des fibres pompées optiquement, (c’est-à-dire des amplificateurs à fibres optiques (OFA) basés soit sur des fibres dopées aux terres rares, soit sur l’effet Raman), les amplificateurs optiques à semiconducteurs (SOA), ainsi que les amplificateurs optiques à guide d’onde planaire (PWOA).<br/>
    Le présent document définit les exigences relatives à des mesures exactes et fiables des paramètres du facteur de bruit associés aux OA, par l’intermédiaire de la méthode de l’analyseur de spectre électrique (ESA). Les paramètres du facteur de bruit associé aux OA sont définis dans l’IEC 61291-1.<br/>
    Cette édition inclut les modifications techniques majeures suivantes par rapport à l’édition précédente:<br/>
    a) le domaine d’application à l’Article 1 a été raccourci et clarifié;<br/>
    b) les références normatives à l’Article 2 ont été actualisées;<br/>
    c) les instructions en doublon en 7.2, consistant à mesurer la puissance d’entrée continue équivalente, ont été supprimées;<br/>
    d) les symboles non utilisés en 3.3 ont été supprimés et un nouveau symbole a été ajouté.
