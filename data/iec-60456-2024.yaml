abstract:
- language: en
  script: Latn
  content: |-
    IEC 60456:2024 specifies methods for measuring the performance of electric washing machines for household use, with or without heating devices, and utilising cold and/or hot water supply, including those which specify the use of no detergent for normal use. It is also applicable to washing machines for communal use in blocks of flats or in launderettes and to electrical household appliances for both washing and drying textiles (household washer-dryers) with respect only to their washing related functions. It also deals with electrical appliances for water extraction by centrifugal force (spin extractors).<br/>
    Household washer-dryer combined performance is assessed to IEC 62512.<br/>
    Household tumble dryer performance is assessed to IEC 61121.<br/>
    The object is to state and define the performance characteristics of household washing machines, the washing related functions of washer-dryers and water extraction function of spin extractors, and to describe the test methods for measuring these characteristics.<br/>
    This document does not apply to washing machines for commercial use such as in commercial laundries.<br/>
    The preparation of methods for measuring the performance of washing machines for commercial use is under evaluation.<br/>
    This document does not specify the acoustical noise measurement for household washing machines.<br/>
    Acoustical noise measurements and evaluation for household washing machines are specified in IEC 60704-1, IEC 60704-2-4 and IEC 60704-3.<br/>
    This document is not intended to be used for the comparative evaluation of detergents.<br/>
    This sixth edition cancels and replaces the fifth edition published in 2010 and its Amendment 1:2022. This edition constitutes a technical revision.<br/>
    This edition includes the following significant technical changes with respect to the previous edition:<br/>
    a) Title changed from previous edition to more accurately describe application: "Washing machines for household use – Methods for measuring the performance".<br/>
    b) Separation of the test method results from the number of test runs in a test series, with the independence of each test run or test series, allowing different test classes to be evaluated.<br/>
    c) Introduction of a new standard powder detergent IEC-P, that substitutes the standard powder detergent IEC-A* by replacing sodium perborate with sodium percarbonate, for a better correlation with market offerings and in line with health/safety recommendations. Introduction of the new standard liquid detergents IEC-L and of the new wool standard detergent IEC-W with associated dosage instructions.<br/>
    d) Introduction of new measurement and evaluation methods for:<br/>
    - wool cleaning performance,<br/>
    - LAS rinsing performance,<br/>
    - gentleness of action,<br/>
    - low power mode consumption,<br/>
    - temperature inside the washload,<br/>
    - intermittently recurring functions,<br/>
    - cold water washing machines,<br/>
    - replacing washing performance by cleaning performance.<br/>
    e) Addition of alternative ambient conditions for conditioning of the test load with associated correction factors.<br/>
    f) Extension of the description of the washing machine loading, up to and beyond 25 kg of cotton test load, and introduction of a new mixed polyester-cotton load.<br/>
    g) Addition of the necessary definitions, measurement, and calculation methods for the evaluation of multi-compartment washing machines.<br/>
    h) Relocation of supplementary information to the IEC free-access supporting documents dashboard: reference machine maintenance information, test materials supplier information, expanded uncertainty values and any other pertinent information for the general public.
- language: fr
  script: Latn
  content: |-
    L'IEC 60456:2024 spécifie les méthodes de mesure de l'aptitude à la fonction des machines à laver électriques à usage domestique, avec ou sans dispositif de chauffage, et alimentées en eau froide et/ou en eau chaude, y compris celles qui spécifient une utilisation normale sans détergent. Elle s'applique également aux machines à laver à usage collectif dans les immeubles ou les laveries automatiques et aux appareils électrodomestiques destinés au lavage et au séchage des textiles (machines lavantes-séchantes à usage domestique) en ce qui concerne leurs fonctions liées au lavage uniquement. Elle traite également des appareils électriques destinés à l'essorage par la force centrifuge (essoreuses centrifuges).<br/>
    L'aptitude à la fonction combinée des machines lavantes-séchantes à usage domestique est évaluée selon l'IEC 62512.<br/>
    L'aptitude à la fonction des sèche-linge à usage domestique est évaluée selon l'IEC 61121.<br/>
    L'objet est d'établir et de définir les caractéristiques d'aptitude à la fonction des machines à laver électriques à usage domestique, les fonctions liées au lavage des machines lavantes-séchantes et la fonction d'essorage des essoreuses centrifuges, et de décrire les méthodes d'essai pour le mesurage de ces caractéristiques.<br/>
    Le présent document ne s'applique pas aux machines à laver à usage commercial, par exemple dans les blanchisseries.<br/>
    L'établissement de méthodes de mesure de l'aptitude à la fonction des machines à laver à usage commercial est à l'étude.<br/>
    Le présent document ne spécifie pas le mesurage du bruit des machines à laver à usage domestique.<br/>
    Le mesurage et l'évaluation du bruit acoustique des machines à laver à usage domestique sont spécifiés dans l'IEC 60704-1, l'IEC 60704-2-4 et l'IEC 60704-3.<br/>
    Le présent document n'est pas destiné à être utilisé dans le cadre d'une évaluation comparative de détergents.<br/>
    Cette sixième édition annule et remplace la cinquième édition parue en 2010 et son Amendement 1:2022. Cette édition constitue une révision technique.<br/>
    Cette édition inclut les modifications techniques majeures suivantes par rapport à l'édition précédente:<br/>
    a) le titre a été modifié par rapport à l'édition précédente pour décrire plus précisément l'application: "Machines à laver pour usage domestique – Méthodes de mesure de l'aptitude à la fonction";<br/>
    b) la séparation de la méthode d'essai résulte du nombre de sessions d'essai dans une série d'essais, l'indépendance de chaque session d'essai ou série d'essais permettant d'évaluer différentes classes d'essai;<br/>
    c) introduction d'un nouveau détergent en poudre normalisé IEC-P, qui se substitue au détergent en poudre normalisé IEC-A* par le remplacement du perborate de sodium par du percarbonate de sodium, pour une meilleure corrélation avec les offres du marché et conformément aux recommandations en matière de santé/sécurité. Introduction des nouveaux détergents liquides normalisés IEC-L et du nouveau détergent normalisé pour la laine IEC-W, avec les instructions de dosage correspondantes;<br/>
    d) introduction de nouvelles méthodes de mesure et d'évaluation pour:<br/>
    - la performance de nettoyage de la laine;<br/>
    - la performance de rinçage LAS;<br/>
    - la douceur d'action;<br/>
    - la consommation en mode basse puissance;<br/>
    - la température à l'intérieur de la charge de lavage;<br/>
    - les fonctions récurrentes intermittentes;<br/>
    - les machines à laver à eau froide;<br/>
    - le remplacement de la performance de lavage par la performance de nettoyage;<br/>
    e) ajout de conditions ambiantes alternatives pour le conditionnement de la charge d'essai, avec les facteurs de correction correspondants;<br/>
    f) extension de la description du chargement des machines à laver, jusqu'à 25 kg et plus pour la charge d'essai de coton, et introduction d'une nouvelle charge mixte polyester-coton;<br/>
    g) ajout des définitions et des méthodes de mesure et de calcul nécessaires à l'évaluation des machines à laver à compartiments multiples;<br/>
    h) déplacement d'informations complémentaires vers le tableau de bord des documents de support en accès libre de l'IEC: informations relatives à la maintenance des machines de référence, informations relatives aux fournisseurs des matériaux d'essai, valeurs d'incertitude élargie et toute autre information pertinente pour le grand public.
