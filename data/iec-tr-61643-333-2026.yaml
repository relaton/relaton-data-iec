abstract:
- language: en
  script: Latn
  content: |-
    IEC TR 61643-333:2026 presents the U-I/R-I characteristic equations and the life evaluation method for MOVs, which are used for applications up to 1 000 V AC or 1 500 V DC in power line, or telecommunication, or signalling circuits. They are designed to protect apparatus or personnel, or both, from high transient voltages.<br/>
    This document specifically addresses the zinc-oxide type of MOVs.
