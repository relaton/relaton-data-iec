abstract:
- language: en
  script: Latn
  content: |-
    <!--StartFragment -->
    <p>IEC 60086-1:2026 is intended to standardize primary batteries with respect to dimensions, nomenclature, terminal configurations, markings, test methods, typical performance, safety and environmental aspects. This document on one side specifies requirements for primary cells and batteries. On the other side, this document also specifies procedures of how requirements for these batteries are to be standardized. As a classification tool for primary batteries, this document specifies system letters, electrodes, electrolytes, and nominal as well as maximum open circuit voltage of electrochemical systems. The object of this part of IEC 60086 is to benefit primary battery users, device designers and battery manufacturers by ensuring that batteries from different manufacturers are interchangeable according to standard form, fit and function. Furthermore, to ensure compliance with the above, this document specifies standard test methods for testing primary cells and batteries. This document also contains requirements in Annex A of this document justifying the inclusion or the ongoing retention of batteries in the IEC 60086 series. This fourteenth edition cancels and replaces the thirteenth edition published in 2021. This edition constitutes a technical revision.<br/>
    This edition includes the following significant technical changes with respect to the previous edition:<br/>
    a) In Clause 3, terms were reordered according to their functions: basic terms, electrochemical systems, battery shapes, electrical characteristics, specifications, failure modes;<br/>
    b) New letter "T" was added in Table 1, Standardized electrochemical systems of 4.1.4 classification;<br/>
    c) Maximum open circuit voltage of letter "F" was changed from 1,83 to 1,90 V;<br/>
    d) Drawing of pulse tests with multiple load was moved from IEC 60086-2 to 5.2.2.2, Application tests with multiple loads;<br/>
    e) Annex F, Guidance for proposing value of minimum average duration was modified;<br/>
    f) Annex D of IEC 60086-2:2021, Common designation, has been transferred to Annex H of this document;<br/>
    g) Table H.1, Common designation index, was modified to provide reference to IEC 60086 2 1 and IEC 60086-2-2 for each battery;<br/>
    h) Annex I identifies the batteries of general use and the applicable tests to compare their performance, in support of Regulation (EU) 2023/1542 (Batteries Regulation).</p>
    <!--EndFragment --><!--StartFragment -->
- language: fr
  script: Latn
  content: |-
    L'IEC 60086-1:2026 est destinée à normaliser les piles électriques en ce qui concerne les dimensions, la nomenclature, les configurations des bornes, les marquages, les méthodes d’essai, la performance type, la sécurité et les aspects environnementaux. Le présent document spécifie d’une part les exigences pour les piles électriques. D’autre part, le présent document spécifie également des procédures de normalisation des exigences relatives à ces piles. En tant qu’outil de classification des piles électriques, le présent document spécifie les lettres des systèmes, les électrodes, les électrolytes et les tensions nominales, ainsi que maximales en circuit ouvert, des systèmes électrochimiques. L’objectif de la présente partie de l’IEC 60086 est d’assurer aux utilisateurs, aux concepteurs de dispositifs et aux fabricants de piles que les piles de différents fabricants sont interchangeables par leur forme, leur montage et leur fonction. De plus, pour assurer la conformité avec ce qui précède, le présent document spécifie des méthodes d’essai normalisées pour les piles électriques. Le présent document contient également des exigences à l’Annexe A du présent document qui justifient l’introduction ou le maintien de piles dans la série IEC 60086. Cette quatorzième édition annule et remplace la treizième édition parue en 2021. Cette édition constitue une révision technique. Cette édition inclut les modifications techniques majeures suivantes par rapport à l’édition précédente:<br/>
    a) à l’Article 3, les termes ont été réordonnés en fonction de leurs fonctions: termes de base, systèmes électrochimiques, formes des piles, caractéristiques électriques, spécifications, modes de défaillance;<br/>
    b) la nouvelle lettre "T" a été ajoutée dans le Tableau 1, Systèmes électrochimiques normalisés, de 4.1.4 classification;<br/>
    c) la tension maximale en circuit ouvert de la lettre "F" a été modifiée de 1,83 V à 1,90 V;<br/>
    d) le schéma des essais d’impulsions à charges multiples a été déplacé de l’IEC 60086 2 à 5.2.2.2, Essais d’application avec plusieurs décharges;<br/>
    e) l’Annexe F, Recommandations pour la valeur proposée de durée moyenne minimale, a été modifiée;<br/>
    f) l’Annexe D de l’IEC 60086-2:2021, Désignation commune, a été transférée à l’Annexe H du présent document;<br/>
    g) le Tableau H.1, Index de désignation commune, a été modifié pour fournir une référence à l’IEC 60086 2 1 et à l’IEC 60086-2-2 pour chaque pile;<br/>
    h) l’Annexe I identifie les piles d’utilisation courante et les essais applicables pour comparer leur performance, à l’appui du règlement (UE) 2023/1542 (règlement relatif aux batteries).
