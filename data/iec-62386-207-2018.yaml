abstract:
- language: en
  script: Latn
  content: "IEC 62386-207:2018 specifies a bus system for control by digital signals
    of electronic ligthing equipment which is in line with the requirements of IEC
    61347 (all parts), with the addition of DC supplies.<br/>\nThis second edition
    cancels and replaces the first edition published in 2009. This edition constitutes
    a technical revision.<br/>\nThis edition includes the following significant technical
    changes with respect to the previous edition:\n\n\tfast fade time has been redefined;\n\tshort
    circuit and open circuit have been deleted;\n\tphysical selection has been deleted;\n\tdimming
    curve selection has been moved to a separate part;\n\tload increase, load decrease
    and reference measurement have been moved to a separate part;\n\tthermal gear
    and lamp protection have been moved to separate parts;\n\tLED module integrated
    has been moved to a separate part;\n\tlink to IEC 62386-102 error bits has been
    clarified;\n\tthe following commands have been deleted:\n\n\n\n\tENABLE CURRENT
    PROTECTOR\n\tDISABLE CURRENT PROTECTOR\n\tQUERY POSSIBLE OPERATING MODES\n\tQUERY
    SHORT CIRCUIT\n\tQUERY OPEN CIRCUIT\n\tQUERY CURRENT PROTECTOR ACTIVE\n\tQUERY
    CURRENT PROTECTOR ENABLED\n\tQUERY OPERATING MODE\n"
- language: fr
  script: Latn
  content: "L’IEC 62386-207:2018 spécifie un système à bus pour la commande par des
    signaux numériques des appareils d'éclairage électroniques conformes aux exigences
    de l'IEC 61347 (toutes les parties), en ajoutant les alimentations en courant
    continu.<br/>\nCette deuxième édition annule et remplace la première édition parue
    en 2009. Cette édition constitue une révision technique.<br/>\nCette édition inclut
    les modifications techniques majeures suivantes par rapport à l'édition précédente:\n\n\tle
    temps de variation rapide a été redéfini;\n\tles courts-circuits et les circuits
    ouverts ont été supprimés;\n\tla sélection physique a été supprimée;\n\tla sélection
    de la courbe de gradation a été déplacée dans une autre partie;\n\tl’augmentation
    de charge, la chute de charge et le mesurage de référence ont été déplacés dans
    une autre partie;\n\tla protection thermique de l'appareillage et la protection
    thermique de la lampe ont été déplacées dans d’autres parties;\n\tles modules
    de LED intégrés ont été déplacés dans une autre partie;\n\tle lien avec les bits
    d’erreur décrits dans l’IEC 62386-102 a été clarifié;\n\tles commandes suivantes
    ont été supprimées:\n\n\n\n\tENABLE CURRENT PROTECTOR\n\tDISABLE CURRENT PROTECTOR\n\tQUERY
    POSSIBLE OPERATING MODES\n\tQUERY SHORT CIRCUIT\n\tQUERY OPEN CIRCUIT\n\tQUERY
    CURRENT PROTECTOR ACTIVE\n\tQUERY CURRENT PROTECTOR ENABLED\n\tQUERY OPERATING
    MODE\n"
