abstract:
- language: en
  script: Latn
  content: |-
    IEC 60127-6:2023+AMD1:2026 CSV is applicable to fuse-holders for miniature cartridge fuse-links according to IEC 60127-2, sub-miniature fuse-links according to IEC 60127-3, universal modular fuse-links to IEC 60127-4 and miniature fuse-links for special applications to IEC 60127-7 for the protection of electric appliances, electronic equipment and component parts thereof, normally intended for use indoors.<br/>
    NOTE Requirements for fuse-holders for miniature fuse-links complying with IEC 60127-4 and IEC 60127-7 are under consideration. It does not apply to fuse holders for fuses completely covered by the subsequent parts of IEC 60269-1.
