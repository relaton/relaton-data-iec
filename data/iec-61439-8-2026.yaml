abstract:
- language: en
  script: Latn
  content: |-
    <!--StartFragment -->
    <p>IEC 61439-8:2026 specifies requirements for the design and verification of low voltage switchgear and controlgear assemblies for use in photovoltaic installations.<br/>
    PVAs have the following characteristics:<br/>
    - assemblies used for the combination of electrical energy in DC systems for which the input and output voltage does not exceed 1 500 V DC;<br/>
    - assemblies supplied from an AC network where the voltage does not exceed 1 000 V AC for auxiliary and control purposes;<br/>
    - stationary assemblies with an enclosure;<br/>
    - assemblies intended for operation by authorised persons (see IEC 61439 1:2020, 3.7.17), but can be located in an area accessible to ordinary persons (see IEC 61439 1:2020, 3.7.16);<br/>
    - suitable for indoor or outdoor installation.<br/>
    This document identifies definitions, specifies the service conditions, details the construction requirements, defines the technical characteristics, and provides verifications for PVAs. PVAs can also include control or signalling devices, or both, associated with the distribution of electrical energy. This document applies to all PVAs whether they are designed and manufactured on a one-off basis or fully standardized and manufactured in quantity. Either the manufacture or assembly, or both, can be carried out by an entity other than the original manufacturer (see IEC 61439 1:2020, 3.10.1).<br/>
    This document does not apply to:<br/>
    - individual devices, for example, circuit-breakers, fuse switches and self-contained components such as, motor starters, switch mode power supplies (SMPS), uninterruptable power supplies (UPS), basic drive modules (BDM), complete drive modules (CDM), adjustable speed power drives systems (PDS), stand-alone energy storage systems (battery and capacitor systems), other electronic equipment which comply with their relevant product standards, such as junction boxes of photovoltaic modules. This document describes their integration into a PVA or an empty enclosure used as a part of a PVA;<br/>
    - photovoltaic power conversion equipment (PCE) incorporating DC combination sub-systems, covered by the IEC 62109 series.<br/>
    Some applications, such as either explosive atmospheres or functional safety, or both, can be subject to the requirements of other standards or local installation rules in addition to those specified in the IEC 61439 series. This document does not apply to the specific types of assemblies covered by other parts of the IEC 61439 series.</p>
    <!--EndFragment -->
- language: fr
  script: Latn
  content: |-
    L'IEC 61439-8:2026 spécifie les exigences relatives à la conception et à la vérification des ensembles d'appareillage à basse tension destinés à être utilisés dans les applications photovoltaïques.<br/>
    Les EPV présentent les caractéristiques suivantes:<br/>
    - ensembles utilisés pour la combinaison de l'énergie électrique des réseaux en courant continu, où les tensions d'entrée et de sortie ne dépassent pas 1 500 V en courant continu;<br/>
    - ensembles alimentés à partir d'un réseau en courant alternatif dont la tension ne dépasse pas 1 000 V en courant alternatif pour les applications auxiliaires et de commande;<br/>
    - ensembles fixes avec une enveloppe;<br/>
    - ensembles destinés à être utilisés par des personnes autorisées (voir l'IEC 61439 1:2020, 3.7.17), mais qui peuvent être situés dans une zone accessible aux personnes ordinaires (voir l'IEC 61439 1:2020, 3.7.16);<br/>
    - ensembles conçus pour une utilisation intérieure ou extérieure.<br/>
    Le présent document identifie les définitions, spécifie les conditions d'emploi, décrit les exigences de construction, définit les caractéristiques techniques et fournit des vérifications pour les EPV. Les EPV peuvent également inclure des dispositifs de commande ou de signalisation, ou les deux, associés à la distribution de l'énergie électrique. Le présent document s'applique à tous les EPV, qu'ils soient conçus et fabriqués à l'unité ou qu'ils soient complètement normalisés et fabriqués en quantité. La fabrication ou l'assemblage, ou les deux, peuvent être réalisés par une entité qui n'est pas le constructeur d'origine (voir l'IEC 61439 1:2020, 3.10.1).<br/>
    Le présent document ne s'applique pas:<br/>
    - aux dispositifs considérés séparément, par exemple les disjoncteurs, les fusibles-interrupteurs et les composants indépendants, comme les démarreurs de moteurs, les alimentations à découpage (SMPS), les alimentations sans interruption (ASI), les modules d'entraînement principaux (MEP), les modules d'entraînement complets (MEC), les entraînements électriques de puissance (EEP) à vitesse variable, les systèmes autonomes de stockage d'énergie (systèmes à batteries et condensateurs) et autres matériels électroniques qui sont conformes aux normes de produits pertinentes, comme les boîtes de jonction de modules photovoltaïques. Le présent document décrit leur intégration dans un EPV ou dans une enveloppe vide utilisée en tant que partie d'un EPV;<br/>
    - aux équipements de conversion de puissance (PCE) photovoltaïque qui comprennent des sous-systèmes à combinaison de courant continu, couverts par la série IEC 62109.<br/>
    Certaines applications, comme les atmosphères explosives ou la sécurité fonctionnelle, ou les deux, peuvent être soumises aux exigences d'autres normes ou de règles d'installation locales, en plus de celles spécifiées dans la série IEC 61439. Le présent document ne s'applique pas aux types d'ensembles spécifiques couverts par d'autres parties de la série IEC 61439.
