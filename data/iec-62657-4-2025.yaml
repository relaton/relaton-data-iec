abstract:
- language: en
  script: Latn
  content: |-
    IEC 62657-4:2025 specifies a concept and methods for central coordination (CC) of automation applications using wireless communications to extend the coexistence management according to IEC 62657-2. It establishes system elements, interfaces and relationships for a central coordination. Functions, data, and data exchange for assessing and maintaining the coexistence state are specified.<br/>
    This document specifies the central coordination point (CCP) approach as one example of the usage of the formal description given in IEC 62657-3. This document is applicable to develop, implement, or modify procedures or solutions.<br/>
    This document provides requirements for automated coexistence management systems.<br/>
    This document provides requirements for:<br/>
    – determination of the coexistence state,<br/>
    – automated coexistence management procedures,<br/>
    – CC amendments for existing wireless communication solutions,<br/>
    – CC functions that coordinate legacy and new wireless communication systems,<br/>
    – CC sequences and message formats for data exchange.<br/>
    This document is not restricted to a specific radio frequency range nor is it restricted to a specific wireless communication technology.<br/>
    This edition includes the following significant technical changes with respect to the previous edition:<br/>
    a) The data item (parameter) to be exchanged between CCP and CMWCA and CMWD to ensure interoperability between CCP providers and device providers.<br/>
    b) The sequence of services conducted between CCP and CMWCA and CMWD are now defined. When the CCP providers and the device providers implement similar process, clearly defined sequence and unified execution specifications ensure interoperability as expected.<br/>
    c) The message formats of sequence diagram to be exchanged between CCP and CMWCA and CMWD are defined. By defining the message formats, the hierarchical structure of each data (parameter), and implementing the same message format by the CCP provider and the device provider, enables to exchange data correctly and ensure interoperability.
- language: fr
  script: Latn
  content: |-
    L'IEC 62657-4:2025 spécifie un concept et des méthodes de coordination centrale (CC) des applications d'automatisation à l'aide de communications sans fil, afin d'étendre la gestion de coexistence selon l'IEC 62657-2. Elle établit les éléments de système, les interfaces et les relations permettant d'assurer une coordination centrale. Les fonctions, les données et l'échange de données pour l'évaluation et le maintien de l'état de coexistence sont spécifiés. Le présent document spécifie l'approche du point de coordination central (CCP, Central Coordination Point) comme exemple d'utilisation de la description formelle donnée dans l'IEC 62657-3.<br/>
    Le présent document vise à développer, mettre en œuvre ou modifier des procédures ou solutions.<br/>
    Le présent document fournit les exigences relatives aux systèmes de gestion automatisée de la coexistence.<br/>
    Il fournit les exigences relatives:<br/>
    – à la détermination de l'état de coexistence;<br/>
    – aux procédures de gestion automatisée de la coexistence;<br/>
    – aux amendements de la coordination centrale pour les solutions de communication sans fil existantes;<br/>
    – aux fonctions de coordination centrale qui coordonnent les systèmes de communication sans fil existants et nouveaux;<br/>
    – aux séquences de coordination centrale et aux formats de messages pour l'échange de données.<br/>
    Le présent document ne se limite pas à une plage de radiofréquences particulière ni à une technologie de communication sans fil spécifique.<br/>
    Cette édition inclut les modifications techniques majeures suivantes par rapport à l'édition précédente:<br/>
    a) l'élément de données (paramètre) à échanger entre le CCP et la CMWCA et le CMWD pour assurer l'interopérabilité entre les fournisseurs de CCP et les fournisseurs d'appareils;<br/>
    b) la séquence des services exécutés entre le CCP et la CMWCA et le CMWD est désormais définie. Lorsque les fournisseurs de CCP et les fournisseurs d'appareils mettent en œuvre un processus similaire, une séquence clairement définie et des spécifications d'exécution unifiées assurent l'interopérabilité comme prévu;<br/>
    c) les formats de messages du diagramme de séquence à échanger entre le CCP et la CMWCA et le CMWD sont définis. En définissant les formats de messages, la structure hiérarchique de chaque donnée (paramètre) et la mise en œuvre du même format de message par le fournisseur de CCP et le fournisseur d'appareil permettent d'échanger les données correctement et d'assurer l'interopérabilité.
