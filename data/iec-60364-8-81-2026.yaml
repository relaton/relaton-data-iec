abstract:
- language: en
  script: Latn
  content: |-
    IEC 60364-8-81:2026 provides additional requirements, measures and recommendations for the design, erection, operation and verification of all types of low-voltage electrical installation including local production and storage of energy for optimizing the overall efficient use of electricity.<br/>
    It introduces requirements, recommendations and methods for the design and the energy efficiency (EE) assessment of an electrical installation within the framework of an energy efficiency management approach in order to get the best permanent functionally equivalent service for the lowest electrical energy consumption and the optimal availability and acceptable cost-effectiveness.<br/>
    These requirements, recommendations and methods apply, within the scope of the IEC 60364 series, for new installations and modification of existing installations.<br/>
    This document is applicable to the electrical installation of a building or system and does not apply to products. The energy efficiency of products and their operational requirements are covered by the relevant product standards.<br/>
    It is possible that another standard provides specific requirements for a particular system or installation application (e.g. manufacturing system covered by ISO 20140 series).<br/>
    This document does not specifically provide requirements for building automation systems. The contribution of building automation systems to improve energy efficiency of the installation is considered.<br/>
    This group energy efficiency publication is primarily intended to be used as an energy efficiency standard for the low-voltage electrical installations mentioned in the scope, but is also intended to be used by technical committees in the preparation of publications, in accordance with the principles laid down in IEC Guide 118<br/>
    This first edition cancels and replaces the second edition of IEC 60364-8-1 published in 2019. This edition constitutes a technical revision.<br/>
    This edition includes the following significant technical changes with respect to the previous edition:<br/>
    a) modified numbering that allows IEC 60364-7 subparts to amend this document;<br/>
    b) alignment of the definitions with IEC 60050-826;<br/>
    c) introduction of minimum energy moment method in Annex A;<br/>
    d) improvements in Annex B
- language: fr
  script: Latn
  content: |-
    IEC 60364-8-81:2026 fournit des exigences, des mesures et des recommandations supplémentaires pour la conception, la mise en œuvre, le fonctionnement et la vérification de tous types d'installations électriques à basse tension comportant la production locale et le stockage local de l'énergie pour optimiser l'utilisation efficace globale de l'électricité.<br/>
    Elle fournit les exigences, les recommandations et les méthodes applicables à la conception et à l'évaluation de l'efficacité énergétique (EE) d'une installation électrique dans le cadre d'une approche de gestion de l'efficacité énergétique afin d'obtenir la meilleure qualité de service permanente fonctionnellement équivalente pour la consommation d'énergie électrique la plus faible, ainsi que la disponibilité optimale et une rentabilité acceptable.<br/>
    Ces exigences, recommandations et méthodes s'appliquent, dans les limites du domaine d'application de la série IEC 60364, aux nouvelles installations et à la modification des installations existantes.<br/>
    Le présent document s'applique à l'installation électrique d'un bâtiment ou d'un système, mais ne s'applique pas aux produits. L'efficacité énergétique et les exigences opérationnelles des produits sont couvertes par les normes de produits pertinentes.<br/>
    Il est possible qu'une autre norme fournisse des exigences spécifiques à un système particulier ou à une application d'installation particulière (par exemple, le système de fabrication couvert par la série ISO 20140).<br/>
    Le présent document ne traite pas spécifiquement des systèmes d'automatisation de bâtiments. La contribution des systèmes d'automatisation de bâtiments à l'amélioration de l'efficacité énergétique de l'installation est prise en compte.<br/>
    La présente publication de groupe sur l'efficacité énergétique est principalement destinée à être utilisée comme une norme d'efficacité énergétique pour les installations électriques à basse tension citées dans le domaine d'application, mais elle est également destinée à être utilisée par les comités d'études lors de l'élaboration de publications, conformément aux principes fixés dans le Guide 118 de l'IEC.<br/>
    Cette première édition annule et remplace la deuxième édition de l'IEC 60364-8-1 parue en 2019. Cette édition constitue une révision technique.<br/>
    Cette édition inclut les modifications techniques majeures suivantes par rapport à l'édition précédente:<br/>
    a) numérotation révisée pour permettre l'amendement du présent document avec les sous parties de l'IEC 60364-7;<br/>
    b) alignement des définitions sur l'IEC 60050-826;<br/>
    c) ajout de la méthode du moment d'énergie minimal à l'Annexe A;<br/>
    d) améliorations de l'Annexe B.
