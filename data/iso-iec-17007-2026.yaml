abstract:
- language: en
  script: Latn
  content: |
    <p class="MsoBodyText">This document specifies principles and gives guidance for developing normative documents that contain:</p>

    specified requirements for the object of conformity assessment;
    specific methods and procedures for an individual conformity assessment activity (e.g. test methods);
    rules and methodology for conformity assessment (as part of conformity assessment schemes, including provisions for organizations that perform conformity assessment activities).

    <p class="MsoBodyText">This document is intended for the following users:</p>

    standards developers;
    regulatory authorities;
    conformity assessment scheme owners;
    industry associations and consortia;
    conformity assessment bodies;
    accreditation bodies;
    purchasers;
    consumers and non-governmental groups;
    other interested parties, e.g. insurance organizations.
- language: fr
  script: Latn
  content: |
    <p>Le présent document spécifie des principes et donne des recommandations pour l’élaboration de documents normatifs qui contiennent:</p>

    des exigences spécifiées pour l’objet de l’évaluation de la conformité;
    des méthodes et procédures spécifiques pour une activité d’évaluation de la conformité individuelle (par exemple, des méthodes d’essai);
    des règles et une méthodologie pour l’évaluation de la conformité (dans le cadre de systèmes particuliers d’évaluation de la conformité, y compris des dispositions pour les organisations qui effectuent des activités d’évaluation de la conformité).

    <p>Le présent document est destiné aux utilisateurs suivants:</p>

    les rédacteurs de normes;
    les autorités réglementaires;
    les propriétaires de systèmes particuliers d’évaluation de la conformité;
    les associations et consortiums industriels;
    les organismes d’évaluation de la conformité;
    les organismes d’accréditation;
    les acheteurs;
    les consommateurs et les organisations non gouvernementales;
    d’autres parties intéressées, par exemple les organismes d’assurance.
