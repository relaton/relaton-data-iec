abstract:
- language: en
  script: Latn
  content: |-
    IEC 60335-2-72:2021 deals with the safety of powered ride-on and powered walk-behind machines intended for commercial indoor or outdoor use for the following applications:<br/>
    - sweeping,<br/>
    - scrubbing,<br/>
    - wet or dry pick-up,<br/>
    - polishing,<br/>
    - application of wax, sealing products and powder-based detergents,<br/>
    - shampooing<br/>
    of floors.<br/>
    These machines have a cleaning motion which is more linear than lateral or periodic. This standard applies to machines for commercial use. The following list, although not comprehensive, gives an indication of locations that are included in the scope:<br/>
    - public use areas such as hotels, schools, hospitals;<br/>
    - industrial locations, for example factories and manufacturing shops;<br/>
    - retail outlets, for example shops and supermarkets;<br/>
    - business premises, for example offices and banks;<br/>
    - all uses other than normal housekeeping purposes.<br/>
    These machines may be equipped with a traction drive system. The following power systems are covered:<br/>
    - internal combustion engines,<br/>
    - mains powered motors up to a rated voltage of 250 V for single-phase appliances and 480 V for other appliances,<br/>
    - battery-operated machines.<br/>
    Battery-operated machines may be equipped with a built-in battery charger.<br/>
    This standard does not apply to<br/>
    - floor treatment appliances for household use (IEC 60335-2-10);<br/>
    - floor treatment machines for commercial use (IEC 60335-2-67);<br/>
    - spray extraction machines for commercial use (IEC 60335-2-68);<br/>
    - wet and dry vacuum cleaners, including power brush, for commercial use (IEC 60335-2-69);<br/>
    - road sweepers;<br/>
    - machines designed for use on slopes with a gradient exceeding 20 %;<br/>
    - machines equipped with a power take-off (PTO);<br/>
    - machines designed for use in corrosive or explosive environments (dust, vapour or gas);<br/>
    - machines designed for picking up hazardous dusts (as defined in IEC 60335-2-69), inflammable substances, or glowing particles;<br/>
    - machines designed for use in vehicles or on board of ships or aircraft.<br/>
    Attention is drawn to the fact that<br/>
    - in many countries additional requirements on the safe use of the equipment covered can be specified by the national health authorities, the national authorities responsible for the protection of labour, the national water supply authorities and similar authorities;<br/>
    - ride-on machines designed for transport over public roads can be subject to additional requirements (e.g. lighting, license plate etc.).<br/>
    Requirements for fuel-cells are under consideration. This fifth edition cancels and replaces the fourth edition published in 2016. It constitutes a technical revision.<br/>
    This edition includes the following significant technical changes with respect to the previous edition (minor changes are not listed):<br/>
    - editorial and technical alignment with IEC 60335-1:2020;<br/>
    - rearrangement of subclauses to consistent numbering 22.101 to 22.113.<br/>
    This part 2 is to be used in conjunction with the latest edition of IEC 60335-1 and its amendments. It was established on the basis of the sixth edition (2020) of that standard.
- language: fr
  script: Latn
  content: |-
    L'IEC 60335-2-72:2021 concerne la sécurité des machines à conducteur à pied et des machines à conducteur porté à moteur, conçues pour l'utilisation commerciale en extérieur ou en intérieur pour les applications suivantes:<br/>
    – le balayage,<br/>
    – le brossage,<br/>
    – le ramassage à sec ou en présence d'eau,<br/>
    – le polissage,<br/>
    – l'application de cire, de produits d'étanchéité et de détergents à base de poudre,<br/>
    – le nettoyage par shampouineuse<br/>
    des sols.<br/>
    Ces machines ont un mouvement de nettoyage plus linéaire que latéral ou périodique.<br/>
    Le mouvement de nettoyage des machines couvertes par l'IEC 60335-2-67 est au contraire plus latéral ou périodique que linéaire.<br/>
    La présente norme s'applique aux machines destinées à un usage commercial. La liste suivante, bien que non exhaustive, fournit une indication des lieux inclus dans le domaine d'application:<br/>
    – lieux publics tels que des hôtels, des écoles, des hôpitaux;<br/>
    – lieux industriels, par exemple des usines et des ateliers de fabrication;<br/>
    – commerces de détail, tels que des boutiques et des supermarchés;<br/>
    – locaux commerciaux, tels que des bureaux et des banques;<br/>
    – toutes utilisations autres que l'entretien domestique normal.<br/>
    Ces machines peuvent être équipées d'un système de commande de dispositif de déplacement. Les systèmes d'alimentation suivants sont couverts:<br/>
    – les moteurs à combustion interne,<br/>
    – les moteurs alimentés par le réseau avec une tension assignée maximale de 250 V pour les appareils monophasés et de 480 V pour les autres appareils,<br/>
    – les machines alimentées par batteries.<br/>
    Les machines alimentées par batteries peuvent être équipées d'un chargeur de batterie intégré.<br/>
    La présente norme ne s'applique pas<br/>
    – aux appareils de traitement des sols à usage domestique (IEC 60335-2-10);<br/>
    – aux machines de traitement des sols à usage commercial (IEC 60335-2-67);<br/>
    – aux machines de nettoyage par pulvérisation et aspiration à usage commercial (IEC 60335-2-68);<br/>
    – aux aspirateurs fonctionnant en présence d'eau ou à sec, y compris les brosses motorisées, à usage commercial (IEC 60335-2-69);<br/>
    – aux balayeuses de chaussée;<br/>
    – aux machines conçues pour être utilisées sur des surfaces en pente dont l'inclinaison dépasse 20 %;<br/>
    – aux machines équipées d'une prise de force;<br/>
    – aux machines destinées à être utilisées dans des environnements corrosifs ou explosifs (poussière, vapeur ou gaz);<br/>
    – aux machines conçues pour prélever des poussières dangereuses (au sens de l'IEC 60335-2-69), des substances inflammables ou des particules incandescentes;<br/>
    – aux machines destinées à être utilisées dans des véhicules ou à bord de navires ou d'avions.<br/>
    L'attention est attirée sur le fait que<br/>
    – dans de nombreux pays, de nombreux pays, des exigences supplémentaires relatives à l'utilisation en toute sécurité de l'équipement couvert peuvent être spécifiées par les organismes nationaux de la santé, par les organismes nationaux responsables de la protection des travailleurs, par les organismes nationaux responsables de l'alimentation en eau et par des organismes similaires.<br/>
    – les machines à conducteur porté conçues pour pouvoir être transportées sur la voie publique peuvent être soumises à des exigences supplémentaires (p. ex. relatives à l'éclairage, aux plaques d'immatriculation, etc.).<br/>
    Cette cinquième édition annule et remplace la quatrième édition parue en 2016. Elle constitue une révision technique.<br/>
    Cette édition inclut les modifications techniques majeures suivantes par rapport à l'édition précédente (les modifications mineures ne sont pas répertoriées):<br/>
    – alignement rédactionnel et technique sur l'IEC 60335-1:2020;<br/>
    – réorganisation des paragraphes afin d'assurer une numérotation cohérente du 22.101 au 22.113.<br/>
    La présente Partie 2 doit être utilisée conjointement avec la dernière édition de l'IEC 60335-1 et ses amendements. Elle a été établie sur la base de la sixième édition (2020) de cette norme.
