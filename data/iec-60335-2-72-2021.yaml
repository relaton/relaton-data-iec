abstract:
- language: en
  script: Latn
  content: |-
    IEC 60335-2-72:2021 deals with the safety of powered ride-on and powered walk-behind machines intended for commercial indoor or outdoor use for the following applications:<br/>
    - sweeping,<br/>
    - scrubbing,<br/>
    - wet or dry pick-up,<br/>
    - polishing,<br/>
    - application of wax, sealing products and powder-based detergents,<br/>
    - shampooing<br/>
    of floors.<br/>
    These machines have a cleaning motion which is more linear than lateral or periodic. This standard applies to machines for commercial use. The following list, although not comprehensive, gives an indication of locations that are included in the scope:<br/>
    - public use areas such as hotels, schools, hospitals;<br/>
    - industrial locations, for example factories and manufacturing shops;<br/>
    - retail outlets, for example shops and supermarkets;<br/>
    - business premises, for example offices and banks;<br/>
    - all uses other than normal housekeeping purposes.<br/>
    These machines may be equipped with a traction drive system. The following power systems are covered:<br/>
    - internal combustion engines,<br/>
    - mains powered motors up to a rated voltage of 250 V for single-phase appliances and 480 V for other appliances,<br/>
    - battery-operated machines.<br/>
    Battery-operated machines may be equipped with a built-in battery charger.<br/>
    This standard does not apply to<br/>
    - floor treatment appliances for household use (IEC 60335-2-10);<br/>
    - floor treatment machines for commercial use (IEC 60335-2-67);<br/>
    - spray extraction machines for commercial use (IEC 60335-2-68);<br/>
    - wet and dry vacuum cleaners, including power brush, for commercial use (IEC 60335-2-69);<br/>
    - road sweepers;<br/>
    - machines designed for use on slopes with a gradient exceeding 20 %;<br/>
    - machines equipped with a power take-off (PTO);<br/>
    - machines designed for use in corrosive or explosive environments (dust, vapour or gas);<br/>
    - machines designed for picking up hazardous dusts (as defined in IEC 60335-2-69), inflammable substances, or glowing particles;<br/>
    - machines designed for use in vehicles or on board of ships or aircraft.<br/>
    Attention is drawn to the fact that<br/>
    - in many countries additional requirements on the safe use of the equipment covered can be specified by the national health authorities, the national authorities responsible for the protection of labour, the national water supply authorities and similar authorities;<br/>
    - ride-on machines designed for transport over public roads can be subject to additional requirements (e.g. lighting, license plate etc.).<br/>
    Requirements for fuel-cells are under consideration. This fifth edition cancels and replaces the fourth edition published in 2016. It constitutes a technical revision.<br/>
    This edition includes the following significant technical changes with respect to the previous edition (minor changes are not listed):<br/>
    - editorial and technical alignment with IEC 60335-1:2020;<br/>
    - rearrangement of subclauses to consistent numbering 22.101 to 22.113.<br/>
    This part 2 is to be used in conjunction with the latest edition of IEC 60335-1 and its amendments. It was established on the basis of the sixth edition (2020) of that standard.
