abstract:
- language: en
  script: Latn
  content: |-
    IEC 60947-4-2:2020 applies to semiconductor motor controllers, starters and soft-starters which can include a series mechanical switching device, intended to be connected to circuits the rated voltage of which does not exceed 1 000 V AC.<br/>
    This fourth edition cancels and replaces the third edition published in 2011. This edition constitutes a technical revision.<br/>
    This edition includes the following significant technical changes with respect to the previous edition:<br/>
    - scope exclusions;<br/>
    - editorial correction of notes and hanging paragraphs;<br/>
    - reference to IEC 62683-1;<br/>
    - safety aspects related to:<br/>
    - general aspects;<br/>
    - limited energy circuits;<br/>
    - electronic circuits;<br/>
    - mention of dedicated wiring accessories;<br/>
    - power consumption measurement;<br/>
    - alignment to IEC 60947-1:2020.
- language: fr
  script: Latn
  content: |-
    L’IEC 60947-4-2:2020 s’applique aux gradateurs, démarreurs et démarreurs progressifs à semiconducteurs de moteurs qui peuvent comprendre un appareil mécanique de connexion en série, destiné à être relié à des circuits dont la tension assignée ne dépasse pas 1 000 V en courant alternatif.<br/>
    Cette quatrième édition annule et remplace la troisième édition parue en 2011. Cette édition constitue une révision technique.<br/>
    La présente édition inclut les modifications techniques majeures suivantes par rapport à l’édition précédente:<br/>
    - exclusions du domaine d’application;<br/>
    - correction rédactionnelle des notes et des alinéas en suspens;<br/>
    - référence à l’IEC 62683-1;<br/>
    - aspects de sécurité relatifs aux points suivants:<br/>
    - aspects généraux;<br/>
    - circuits à énergie limitée;<br/>
    - circuits électroniques;<br/>
    - mention des accessoires de câblage dédiés;<br/>
    - mesure de la puissance consommée;<br/>
    - alignement sur l’IEC 60947-1:2020.<br/>
    La version française de la norme n’a pas été soumise au vote.
