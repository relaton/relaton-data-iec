abstract:
- language: en
  script: Latn
  content: |-
    IEC 62053-24:2020 applies only to static var-hour meters of accuracy classes 0,5S, 1S, 1, 2 and 3 for the measurement of alternating current electrical reactive energy in 50 Hz or 60 Hz networks and it applies to their type tests only.<br/>
    This document uses a conventional definition of reactive energy where the reactive power and energy is calculated from the fundamental frequency components of the currents and voltages only.<br/>
    This document applies to electricity metering equipment designed to:<br/>
    • measure and control electrical energy on electrical networks (mains) with voltage up to 1 000 V AC;<br/>
    • have all functional elements, including add-on modules, enclosed in, or forming a single meter case with exception of indicating displays;<br/>
    • operate with integrated or detached indicating displays, or without an indicating display;<br/>
    • be installed in a specified matching socket or rack;<br/>
    • optionally, provide additional functions other than those for measurement of electrical energy.<br/>
    Meters designed for operation with low power instrument transformers (LPITs as defined in the IEC 61869 series) may be considered as compliant with this document only if such meters and their LPITs are tested together and meet the requirements for directly connected meters.<br/>
    This document does not apply to:<br/>
    • meters for which the voltage line-to-neutral derived from nominal voltages exceeds 1 000 V AC;<br/>
    • meters intended for connection with low power instrument transformers (LPITs as defined in the IEC 61869 series) when tested without such transformers;<br/>
    • metering systems comprising multiple devices (except LPITs) physically remote from one another;<br/>
    • portable meters;<br/>
    • meters used in rolling stock, vehicles, ships and airplanes;<br/>
    • laboratory and meter test equipment;<br/>
    • reference standard meters;<br/>
    • data interfaces to the register of the meter;<br/>
    • matching sockets or racks used for installation of electricity metering equipment;<br/>
    • any additional functions provided in electrical energy meters.<br/>
    This document does not cover measures for the detection and prevention of fraudulent attempts to compromise a meter’s performance (tampering).<br/>
    This second edition cancels and replaces the first edition published in 2014 and its amendment 1:2016. This edition constitutes a technical revision.<br/>
    This edition includes the following significant technical changes with respect to the previous edition: see Annex E
- language: fr
  script: Latn
  content: |-
    IEC 62053-24:2020 est applicable uniquement aux compteurs statiques d'énergie réactive des classes de précision 0,5S, 1S, 1, 2 et 3, destinés à la mesure de l'énergie électrique réactive en courant alternatif sur les réseaux électriques en 50 Hz et 60 Hz, et à leurs essais de type.<br/>
    Le présent document est fondé sur une définition conventionnelle de l'énergie réactive pour laquelle la puissance et l'énergie réactives ne sont calculées qu'à partir des composantes de fréquence fondamentale des courants et des tensions (voir Article 3).<br/>
    Le présent document s'applique aux appareils de comptage de l'électricité conçus pour:<br/>
    • mesurer et piloter l'énergie électrique sur les réseaux électriques (secteur) avec une tension allant jusqu'à 1 000 V en courant alternatif;<br/>
    • avoir tous les éléments fonctionnels, y compris les modules complémentaires, incorporés dans ou formant un boîtier de compteur unique, à l'exception des afficheurs;<br/>
    • fonctionner avec des afficheurs intégrés ou séparés, ou sans afficheur;<br/>
    • être installés dans une embase ou un bâti correspondant spécifié;<br/>
    • (facultatif) assurer des fonctions autres que celles relatives au comptage de l'énergie électrique.<br/>
    Les compteurs conçus pour être utilisés avec des transformateurs de mesure de faible puissance (LPIT – Low Power Instrument Transformers, définis dans la série IEC 61869) ne peuvent être jugés conformes au présent document que si ces compteurs et leurs LPIT sont soumis à l'essai ensemble et satisfont aux exigences relatives aux compteurs à branchement direct. Le présent document ne s'applique pas:<br/>
    • aux compteurs dont la tension phase-neutre déduite des tensions nominales dépasse 1 000 V en courant alternatif;<br/>
    • aux compteurs destinés à être connectés à des transformateurs de mesure de faible puissance (LPIT, définis dans la série IEC 61869) lorsqu'ils sont soumis à l'essai sans ces transformateurs;<br/>
    • aux systèmes de comptage comprenant plusieurs dispositifs (à l'exception des LPIT) physiquement éloignés les uns des autres;<br/>
    • aux compteurs portatifs;<br/>
    • aux compteurs utilisés dans le matériel roulant, les véhicules, les navires et les avions;<br/>
    • aux équipements de laboratoire et d'essai des compteurs;<br/>
    • aux compteurs étalons de référence;<br/>
    • aux interfaces de communication avec l'élément indicateur du compteur;<br/>
    • aux embases ou bâtis correspondants utilisés pour l'installation des équipements de comptage de l'électricité;<br/>
    • à toute fonction complémentaire assurée par les compteurs d'énergie électrique.<br/>
    Le présent document ne couvre pas les mesures de détection et de prévention des tentatives frauduleuses de compromettre la performance du compteur (falsification).<br/>
    Cette deuxième édition annule et remplace la première édition parue en 2014 et son amendement 1:2016. Cette édition constitue une révision technique.<br/>
    Cette édition inclut les modifications techniques majeures suivantes par rapport à l'édition précédente: voir Annexe E
