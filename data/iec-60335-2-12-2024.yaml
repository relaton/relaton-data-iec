abstract:
- language: en
  script: Latn
  content: |-
    IEC 60335-2-12:2024 deals with the safety of electric warming plates, warming trays and similar appliances intended to keep food or vessels warm, for household and similar purposes, their rated voltage being not more than 250 V including direct current (DC) supplied appliances and battery-operated appliances.<br/>
    Appliances intended for normal household and similar use and that can also be used by laypersons in shops, in light industry and on farms are within the scope of this standard. However, if the appliance is intended to be used professionally to keep vessels warm or to process food for commercial consumption, the appliance is not considered to be for household and similar use only.<br/>
    As far as is practicable, this standard deals with the common hazards presented by appliances that are encountered by all persons in and around the home.<br/>
    Attention is drawn to the fact that<br/>
    – for appliances intended to be used in vehicles or on board ships or in aircraft, additional requirements can be necessary;<br/>
    – in many countries additional requirements are specified by the national health authorities, the national authorities responsible for the protection of labour and similar authorities.<br/>
    This standard does not apply to<br/>
    – appliances made of flexible material, such as textile material;<br/>
    – appliances intended exclusively to be used in locations where special conditions prevail, such as the presence of a corrosive or explosive atmosphere (dust, vapour or gas);<br/>
    – appliances intended exclusively for commercial catering (IEC 60335 2 49, IEC 60335 2 50);<br/>
    – appliances intended exclusively industrial purposes;<br/>
    – warming cabinets.<br/>
    This sixth edition cancels and replaces the fifth edition published in 2002, Amendment 1:2008 and Amendment 2:2017. This edition constitutes a technical revision.<br/>
    This edition includes the following significant technical changes with respect to the previous edition:<br/>
    a) alignment with IEC 60335-1:2020;<br/>
    b) conversion of some notes to normative text (Clause 1, 5.2, 7.12, 15.2, 15.101, 24.1.5);<br/>
    c) application of test probe 19 (8.1.1, 20.2, B.22.3, B.22.4);<br/>
    d) clarification of applicability of requirements for remote operation (22.40, 22.49, 22.51).<br/>
    This part 2 is to be used in conjunction with the latest edition of IEC 60335-1 and its amendments unless that edition precludes it; in that case, the latest edition that does not preclude it is used. It was established on the basis of the sixth edition (2020) of that standard.
- language: fr
  script: Latn
  content: |-
    L’IEC 60335-2-12:2024 traite de la sécurité des chauffe-plats électriques et appareils analogues destinés à maintenir au chaud des aliments ou des récipients, pour usages domestiques et analogues, dont la tension assignée est inférieure ou égale à 250 V, y compris les appareils alimentés en courant continu et les appareils alimentés par batteries.<br/>
    Les appareils destinés à un usage domestique et analogue normal et qui peuvent être également utilisés par des usagers non avertis dans des magasins, chez des artisans et dans des fermes sont compris dans le domaine d'application de la présente norme. Toutefois, si l’appareil est destiné à être utilisé professionnellement pour garder des récipients au chaud ou pour préparer des aliments à des fins commerciales, l’appareil n’est pas considéré comme étant seulement à usage domestique et analogue.<br/>
    Dans la mesure du possible, la présente norme traite des dangers courants que présentent les appareils et auxquels sont exposés tous les individus à l'intérieur et autour de l'habitation.<br/>
    Cependant, elle ne tient en général pas compte<br/>
    – des personnes (y compris des enfants) dont les capacités physiques, sensorielles ou mentales; ou le manque d'expérience et de connaissance les empêchent d'utiliser l'appareil en toute sécurité sans surveillance ou instruction;<br/>
    – de l'utilisation de l'appareil comme jouet par des enfants.<br/>
    L’attention est attirée sur le fait que<br/>
    – pour les appareils destinés à être utilisés dans des véhicules ou à bord de navires ou d’aéronefs, des exigences supplémentaires peuvent être nécessaires;<br/>
    – dans de nombreux pays, des exigences supplémentaires sont spécifiées par les organismes nationaux de la santé publique, par les organismes nationaux responsables de la protection des travailleurs et par des organismes analogues.<br/>
    La présente norme ne s'applique pas<br/>
    – aux appareils constitués de matériaux souples tels que le tissu;<br/>
    – aux appareils destinés à être utilisés exclusivement dans des locaux qui présentent des conditions particulières, telles que la présence d'une atmosphère corrosive ou explosive (poussière, vapeur ou gaz);<br/>
    – aux appareils prévus exclusivement pour la restauration commerciale (IEC 60335 2 49, IEC 60335 2 50);<br/>
    – aux appareils prévus exclusivement pour des usages industriels;<br/>
    – aux meubles de maintien au chaud.<br/>
    Cette sixième édition annule et remplace la cinquième édition parue en 2002, son Amendement 1:2008 et son Amendement 2:2017. Cette édition constitue une révision technique.<br/>
    Cette édition inclut les modifications techniques majeures suivantes par rapport à l'édition précédente:<br/>
    a) texte aligné sur l'IEC 60335-1:2020;<br/>
    b) transformation de certaines notes en texte normatif (Articles et paragraphes 1, 5.2, 7.12, 15.2, 15.101, 24.1.5);<br/>
    c) application du calibre d’essai 19 (8.1.1, 20.2, B.22.3, B.22.4);<br/>
    d) clarification de l'applicabilité des exigences pour la commande à distance (22.40, 22.49, 22.51).<br/>
    La présente partie 2 doit être utilisée conjointement avec la dernière édition de l'IEC 60335-1 et ses amendements sauf si cette édition l'exclut; dans ce cas, la dernière édition qui n'exclut pas la présente partie 2 est utilisée. Elle a été établie sur la base de la sixième édition (2020) de cette norme.
