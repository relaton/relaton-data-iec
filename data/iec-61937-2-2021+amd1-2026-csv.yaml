abstract:
- language: en
  script: Latn
  content: |-
    IEC 61937-2:2021+AMD1:2026 CSV specifies the digital audio interface to convey non-linear PCM encoded audio bitstreams applying IEC 60958-1 and IEC 60958-3. This document specifies burst-info, which defines content information about the data contained in the burst-payload. IEC 61937-2:2021 cancels and replaces the second edition published in 2007, Amendment 1:2011 and Amendment 2:2018. This edition constitutes a technical revision. This edition includes the following significant technical changes with respect to the previous edition:<br/>
    a) new audio data-types of MPEG-D USAC, ACX, ACX HBR2, ACX HBR4 and ACX HBR8 have been added;<br/>
    b) extended data-type field in Pe has been activated.
