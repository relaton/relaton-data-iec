abstract:
- language: en
  script: Latn
  content: |-
    IEC 62290‑3:2025 specifies the system architecture for urban guided transport management and command/control systems (UGTMS) as defined in IEC 62290‑1 and IEC 62290‑2, and the allocation of functions and requirements defined in IEC 62290‑2 to the different UGTMS subsystems (designated as system constituents in IEC 62290‑1 and IEC 62290‑2), for use in urban guided passenger transport lines and networks.<br/>
    The IEC 62290 series specifies the functional, system and interface requirements for the command, control, and management systems intended to be used on urban, guided passenger transport lines and networks.<br/>
    These systems are designated herein as urban guided transport management and command/control systems (UGTMS). UGTMS cover a wide range of operations needs from non-automated (GOA1) to unattended (GOA4) operation. A line may be equipped with UGTMS on its full length or only partly equipped.<br/>
    The IEC 62290 series does not specifically address security issues. However, aspects of safety requirements may apply to ensuring security within the urban guided transit system.<br/>
    The main objectives of this series are as follows:<br/>
    * to provide a baseline system description and functional requirements specification for a transport authority to use in a request for proposal,<br/>
    * to provide recommendations for those transport authorities wishing to acquire an interoperable or interchangeable system.<br/>
    It is the responsibility of the transport authority concerned to decide on how to apply the IEC 62290 series and to take into account their particular needs.<br/>
    The IEC 62290 series is also intended to support applications for upgrading existing signalling and command control systems. In this case, interchangeability and compatibility could be ensured only for the additional UGTMS equipment. Checking the possibility for upgrading existing equipment and the level of interoperability is the responsibility of the transport authority concerned.<br/>
    This document is applicable for new lines or for upgrading existing signalling and command control systems.<br/>
    This document is applicable to applications using<br/>
    * continuous data transmission,<br/>
    * continuous supervision of train movements by train protection profile, and<br/>
    * localisation by onboard UGTMS equipment (reporting trains), and optionally by external wayside (and optionally onboard) device.<br/>
    The functional allocations of the UGTMS subsystems are mandatory (forming a sort of core system) or optional, according to the mandatory/optional functions and requirements defined in IEC 62290‑2.<br/>
    This document is applicable as a basis to define FIS and FFFIS. For specific applications, some elements can be added to meet the requirements coming from additional functions or equipment.<br/>
    This second edition cancels and replaces the first edition published in 2019. This edition constitutes a technical revision.<br/>
    This edition includes the following significant technical changes with respect to the previous edition:<br/>
    a) the last maintenance of IEC 62290‑1 is taken into account, in particular the changes made for describing the external environment of UGTMS;<br/>
    b) the last maintenance of IEC 62290‑2 is taken into account, as IEC 62290‑3 is using the requirements defined in the latter. Therefore, the document reflects the deleted functions and requirements in IEC 62290‑2, and also the new functions and requirements.
- language: fr
  script: Latn
  content: |-
    IEC 62290‑3: 2025 spécifie l'architecture des Systèmes de contrôle/commande et de gestion des transports guidés urbains (UGTMS) définie dans l’IEC 62290-1 et l’IEC 62290-2, ainsi que l'allocation des fonctions et exigences définies dans l’IEC 62290-2 des différents sous‑systèmes UGTMS (désignés comme constituants du système dans l’IEC 62290-1 et l’IEC 62290-2), utilisées par les lignes et les réseaux de transports guidés urbains de voyageurs.<br/>
    La série de normes IEC 62290 spécifie les exigences fonctionnelles, système et d'interface des systèmes de contrôle/commande et de gestion destinés à être utilisés sur les lignes et les réseaux de transports guidés urbains de voyageurs.<br/>
    Ces systèmes sont identifiés ici par “systèmes de contrôle/commande et de gestion des transports guidés urbains” (UGTMS – Urban Guided Transport Management and Command/Control Systems). Les systèmes UGTMS recouvrent de fait une large gamme de besoins d'exploitation depuis l'exploitation non automatisée des trains (GOA1) jusqu'à l'exploitation sans personnel à bord des trains (GOA4). Une ligne peut être équipée d'UGTMS sur toute sa longueur ou seulement sur une partie.<br/>
    La présente série ne traite pas de façon spécifique les problèmes de sécurité publique. Toutefois, certains aspects des exigences de sécurité technique peuvent s’appliquer pour contribuer à la garantie de la sécurité publique à l'intérieur des transports guidés urbains.<br/>
    Les objectifs principaux de la présente série sont les suivants:<br/>
    * fournir une description de base du système et une spécification des exigences fonctionnelles qu'une autorité en charge du transport pourra utiliser dans un appel d’offres,<br/>
    * fournir des recommandations à ces autorités en charge du transport qui souhaitent acquérir un système interopérable ou interchangeable.<br/>
    Il est de la responsabilité des autorités concernées en charge du transport de décider de la manière d'appliquer cette série de normes et de prendre en compte leurs besoins spécifiques.<br/>
    La série IEC 62290 a aussi pour objet de fournir un support aux applications qui sont des évolutions de systèmes existants de signalisation et de contrôle/commande. Dans ce cas, l'interchangeabilité et la compatibilité peuvent n'être réalisées que pour les équipements additionnels UGTMS. Il est de la responsabilité de l'autorité concernée en charge du transport de vérifier la possibilité de faire évoluer les équipements existants et de choisir le degré d'interopérabilité.<br/>
    Le présent document est applicable aux lignes nouvelles ou à l'évolution des systèmes de signalisation et de contrôle/commande existants.<br/>
    Le présent document est applicable aux applications utilisant:<br/>
    * une transmission continue de données<br/>
    * une supervision continue du mouvement des trains par courbe de contrôle de vitesse<br/>
    * la localisation des trains par l’équipement embarqué UGTMS (trains communicants), et optionnellement par un dispositif externe au sol (et en option au bord)<br/>
    Le présent document n'est pas applicable aux systèmes de contrôle/commande existants ou aux projets déjà en cours de développement avant la date d'entrée en vigueur du présent document.<br/>
    L'allocation des fonctions des sous-systèmes UGTMS est obligatoire (formant une sorte de noyau système) ou optionnelle, conformément aux fonctions et exigences obligatoires/optionnelles définies dans l’IEC 62290-2.<br/>
    Le présent document est applicable et sert de base pour la définition d'une FIS ou d'une FFFIS. Pour les applications spécifiques, certains éléments peuvent être ajoutés pour répondre aux exigences résultant de fonctions ou d'équipements supplémentaires.<br/>
    Cette deuxième édition annule et remplace la première édition parue en 2019, dont elle constitue une révision technique.<br/>
    Les principales modifications techniques par rapport à l'édition précédente sont les suivantes:<br/>
    la dernière maintenance de l’IEC 62290-1 est prise en compte, notamment les modifications apportées pour la description de l'environnement externe de l'UGTMS,<br/>
    la dernière maintenance de l’IEC 62290-2 est prise en compte, l’IEC 62290-3 utilisant les exigences définies dans cette dernière. Par conséquent, le document reflète les fonctions et exigences supprimées dans l’IEC 62290-2, ainsi que les nouvelles fonctions et exigences
