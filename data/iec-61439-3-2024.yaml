abstract:
- language: en
  script: Latn
  content: |-
    IEC 61439-3:2024 defines the specific requirements for distribution boards intended to be operated by ordinary persons (abbreviated DBO throughout this document, see 3.1.101) as follows:<br/>
    - assemblies intended to be operated by ordinary persons (e.g. switching operations and replacing fuse-links), e.g. in domestic (household) applications;<br/>
    - assemblies containing outgoing circuits with protective devices intended to be operated by ordinary persons, complying e.g. with IEC 60898-1, the IEC 61008 series, the IEC 61009 series, IEC 62606, IEC 62423 and IEC 60269-3;<br/>
    - assemblies for applications where the nominal voltage to earth does not exceed 300 V AC (see Table G.1 of IEC 61439-1:2020);<br/>
    NOTE The voltage limits for DC applications are under consideration.<br/>
    - assemblies with a rated current (Inc) of the outgoing circuits not exceeding 125 A and a rated current (InA) not exceeding 250 A;<br/>
    - assemblies intended for use in connection with the generation, transmission, distribution and conversion of electrical energy, and for the control of equipment consuming electrical energy and for associated data processing;<br/>
    - enclosed, stationary assemblies;<br/>
    - assemblies for indoor or outdoor use.<br/>
    This second edition cancels and replaces the first edition published in 2012. This edition constitutes a technical revision.<br/>
    This edition includes the following significant technical changes with respect to the previous edition:<br/>
    a) alignment with the structure of IEC 61439-1:2020;<br/>
    b) inclusion in the scope of more examples of the type of protection and control devices;<br/>
    c) deletion of type A and Type B DBOs;<br/>
    d) addition of a new Annex BB related to DBOs used in a prosumer’s electrical installation (PEI);<br/>
    e) addition of a new Annex CC related to rated current of a DBO with additional source of supply in parallel/simultaneously with another source that is connected to the DBO e.g. PV.
- language: fr
  script: Latn
  content: |-
    L'IEC 61439-3:2024 définit les exigences spécifiques pour les tableaux de répartition destinés à être utilisés par des personnes ordinaires (abrégés DBO dans l'ensemble du présent document, voir 3.1.101) ci-après:<br/>
    - ensembles destinés à être utilisés par des personnes ordinaires (par exemple, pour manœuvrer des appareils de commande et remplacer des éléments de fusible), par exemple dans des applications domestiques;<br/>
    - ensembles qui contiennent des circuits de départ avec des dispositifs de protection, destinés à être utilisés par des personnes ordinaires, qui satisfont par exemple à l'IEC 60898-1, à la série IEC 61008, à la série IEC 61009, à l'IEC 62606, à l'IEC 62423 et à l'IEC 60269-3;<br/>
    - ensembles destinés à des applications pour lesquelles la tension nominale à la terre ne dépasse pas 300 V en courant alternatif (voir Tableau G.1 de l'IEC 61439-1:2020);<br/>
    NOTE Les limites de tension pour les applications en courant continu sont à l'étude.<br/>
    - ensembles dans lesquels le courant assigné (Inc) des circuits de départ est inférieur ou égal à 125 A et dont le courant assigné (InA) est inférieur ou égal à 250 A;<br/>
    - ensembles destinés à être utilisés avec des équipements conçus pour la production, le transport, la distribution et la conversion de l'énergie électrique, la commande des matériels qui consomment de l'énergie électrique et le traitement des données associées;<br/>
    - ensembles fixes sous enveloppe;<br/>
    - ensembles pour utilisation en intérieure ou en extérieur.<br/>
    Cette seconde édition annule et remplace la première édition parue en 2012. Cette édition constitue une révision technique.<br/>
    Cette édition inclut les modifications techniques majeures suivantes par rapport à l'édition précédente:<br/>
    a) alignement sur la structure de l'IEC 61439-1:2020;<br/>
    b) inclusion dans le domaine d'application de plus d'exemples de types de dispositifs de protection et de commande;<br/>
    c) suppression des DBO de type A et de type B;<br/>
    d) ajout d'une nouvelle Annexe BB relative aux DBO utilisés dans une installation électrique de prosommateur (PEI);<br/>
    e) ajout d'une nouvelle Annexe CC relative au courant assigné d'un DBO avec une source d'alimentation supplémentaire parallèlement/simultanément avec une autre source reliée au DBO, par exemple un panneau photovoltaïque (PV).
