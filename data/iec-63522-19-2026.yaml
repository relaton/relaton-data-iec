abstract:
- language: en
  script: Latn
  content: IEC 63522-19:2026 This part defines a test method to measure electrical
    endurance of electrical relays and provides the appropriate severities and conditions
    for measurements designed to assess the ability of DUTs to perform under expected
    conditions of transportation, storage and all aspects of operational use.
- language: fr
  script: Latn
  content: IEC 63522-19:2026 La présente partie définit une méthode d'essai pour mesurer
    l'endurance électrique des relais électriques, et fournit les sévérités et conditions
    appropriées pour les mesurages destinés à évaluer l'aptitude de tous les types
    de relais électriques à fonctionner dans des conditions prévues de transport,
    de stockage et tous les aspects d'utilisation opérationnelle.
