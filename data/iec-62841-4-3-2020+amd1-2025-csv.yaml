abstract:
- language: en
  script: Latn
  content: |-
    CORRECTED VERSION 2026-08<br/>
    <br/>
    IEC 62841-4-3:2020+AMD1:2025 CSV This document applies to the design of pedestrian controlled walk-behind<br/>
    - cylinder lawnmowers;<br/>
    and<br/>
    - rotary lawnmowers<br/>
    equipped with<br/>
    - metallic cutting means; and/or<br/>
    - rigid non-metallic cutting means; and/or<br/>
    - non-metallic cutting means with one or more cutting elements pivotally mounted on a generally circular drive unit, where these cutting elements rely on centrifugal force to achieve cutting, and have a kinetic energy for each single cutting element of greater than 10 J.<br/>
    This document does not apply to<br/>
    - robotic lawnmowers;<br/>
    - remote-controlled lawnmowers;<br/>
    - flail mowers or flail-type attachments;<br/>
    - scissors type lawnmowers;<br/>
    - grassland mowers;<br/>
    - sickle bar mowers;<br/>
    - towed/semi-mounted grass-cutting machines;<br/>
    - scrub-clearing machines;<br/>
    - lawn trimmers and lawn edge trimmers;<br/>
    - lawn edgers;<br/>
    - grass trimmers;<br/>
    - brush cutters;<br/>
    - brush saws;<br/>
    - agricultural mowers;<br/>
    - trailing seat/sulky units;<br/>
    - ride-on machines;<br/>
    - non-powered lawnmowers;<br/>
    - combustion engine powered lawnmowers;<br/>
    - hybrid and fuel cell powered machines and associated charging systems; and<br/>
    - garden tractors or their attachments.<br/>
    Robotic lawnmowers are covered by IEC 60335-2-107, and will be covered by a future part of IEC 62841.<br/>
    The content of the corrigendum 1 (2026-08) has been included in this copy.
