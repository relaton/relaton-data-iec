abstract:
- language: en
  script: Latn
  content: |-
    IEC/ASTM 62885-6:2023 is applicable for measurements of the performance of mains-operated and cordless wet hard floor cleaning appliances for household or similar use. In the case of appliances with combined functionality, this document only addresses the wet cleaning functionality.<br/>
    The purpose of this document is to specify essential performance characteristics of wet hard floor cleaning appliances that are of interest to users and to describe methods for measuring these characteristics.<br/>
    This document is not intended for cleaning appliances according to IEC 60335-2-79 and robotic wet hard floor cleaning appliances.<br/>
    For safety requirements, reference is made to IEC 60335-1, IEC 60335-2-2, IEC 60335-2-10, and IEC 60335-2-54.<br/>
    This second edition cancels and replaces the first edition published in 2018. This edition constitutes a technical revision.<br/>
    This edition includes the following significant technical changes with respect to the previous edition:<br/>
    a) Expanded the Scope to include cordless cleaners.<br/>
    b) Changed definition for "cleaning width" to "track cleaning width" in 3.7 and provided instructions for determining "track cleaning width" in 4.7.4.<br/>
    c) Changed "runtime" definition to "battery runtime" in 3.22.<br/>
    d) Added IKW soil instructions, and also a penalty factor calculation with correction examples for products designed with cleaning gaps to section 5.1 "Stain cleaning efficiency of hard flat floors".<br/>
    e) Retitled 5.2 "Dirt pickup test" to "Soil cleaning efficacy of hard flat floors" and added comprehensive instructions for executing the method.<br/>
    f) Added section 5.3 "Battery runtime" procedure patterned after IEC 62885-4 cordless standard.<br/>
    g) Modified Test soils in 7.2.2. to add IKW and Akzo-Nobel soils.<br/>
    The content of the corrigendum 1 (2024-11) has been included in this copy.
- language: fr
  script: Latn
  content: |-
    L'IEC/ASTM 62885-6:2023 s'applique aux mesurages de l'aptitude à la fonction des appareils de nettoyage des sols durs et mouillés sur secteur et sans cordon destinés à un usage domestique ou analogue. Dans le cas des appareils dont les fonctions sont combinées, le présent document traite uniquement de la fonction de nettoyage par voie humide.<br/>
    Le présent document a pour objet de spécifier les caractéristiques essentielles d'aptitude à la fonction des appareils de nettoyage des sols durs et mouillés qui sont pertinentes pour les utilisateurs et de décrire les méthodes de mesure de ces caractéristiques.<br/>
    Le présent document n'est pas destiné aux appareils de nettoyage selon l'IEC 60335-2-79 ni aux appareils de nettoyage des sols durs et mouillés robotisés.<br/>
    Pour les exigences de sécurité, l'IEC 60335-1, l'IEC 60335-2-2, l'IEC 60335-2-10 et l'IEC 60335-2-54 sont citées en références.<br/>
    Cette deuxième édition annule et remplace la première édition parue en 2018. Cette édition constitue une révision technique.<br/>
    Cette édition inclut les modifications techniques majeures suivantes par rapport à l'édition précédente:<br/>
    a) Extension du Domaine d'application pour inclure les appareils de nettoyage sans cordon;<br/>
    b) Remplacement de la définition de "largeur de nettoyage" par "largeur de nettoyage au sol" en 3.7 et fourniture d'instructions pour la détermination de la "largeur de nettoyage au sol" en 4.7.4;<br/>
    c) Remplacement de la définition de "temps de fonctionnement" par "temps de fonctionnement de la batterie" en 3.22;<br/>
    d) Ajout d'instructions pour les salissures IKW ainsi que d'un calcul de facteur de pénalité avec des exemples de corrections pour les produits conçus avec des vides de nettoyage en 5.1 "Efficacité de nettoyage des taches sur des sols plats et durs";<br/>
    e) Renommage du 5.2 "Essai de ramassage de la saleté" en "Efficacité de nettoyage des salissures sur sols plats et durs" et ajout d'instructions complètes pour l'exécution de la méthode;<br/>
    f) Ajout en 5.3 "Temps de fonctionnement de la batterie" d'une procédure établie d'après la norme sans fil IEC 62885-4;<br/>
    g) Modification des salissures d'essai en 7.2.2 pour ajouter les salissures IKW et Akzo-Nobel.<br/>
    Le contenu du corrigendum 1 (2024-11) a été pris en considération dans cet exemplaire.
