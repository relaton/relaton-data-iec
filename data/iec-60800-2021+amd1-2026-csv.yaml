abstract:
- language: en
  script: Latn
  content: |-
    IEC 60800:2021+AMD1:2026 CSV is applicable to, and specifies requirements for resistive heating cables for low temperature applications such as comfort heating and the prevention of ice formation. These heating cables and heating cable sets can comprise either factory assembled or field (work-site) assembled units, and are heating cables assembled in accordance with manufacturer’s instructions. Bare conductors and protected conductors to be supplied at voltages equal to, or less than, 50 V are excluded from the scope of this document.<br/>
    Typical applications include, but are not limited to:<br/>
    - surface heating installed in or under surfaces;<br/>
    - direct and storage heating;<br/>
    - snow melting and frost protection of roofs, gutters, pipes, etc.<br/>
    Electrical resistance trace heating systems for industrial and commercial applications are specified in the IEC 62395 series [1] and for explosive atmospheres applications in the IEC/IEEE 60079-30 series [2], as are mineral insulated heating cables. Applications in which the sheath temperature exceeds 100 °C are outside the scope of this document.
