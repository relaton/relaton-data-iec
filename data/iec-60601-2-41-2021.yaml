abstract:
- language: en
  script: Latn
  content: |-
    IEC 60601-2-41:2021 applies to the BASIC SAFETY and ESSENTIAL PERFORMANCE of SURGICAL LUMINAIRES and LUMINAIRES FOR DIAGNOSIS, hereafter referred to as ME EQUIPMENT.<br/>
    If a clause or subclause is specifically intended to be applicable to ME EQUIPMENT only, or to ME SYSTEMS only, the title and content of that clause or subclause will say so. If that is not the case, the clause or subclause applies both to ME EQUIPMENT and to ME SYSTEMS, as relevant.<br/>
    This particular standard does not apply to<br/>
    – headlights;<br/>
    – endoscopes, laparoscopes and their light sources, which are covered by IEC 60601-2-18;<br/>
    – luminaires used in dentistry, which are covered by ISO 9680;<br/>
    – luminaires for general purposes, which are covered by IEC 60598-2-1 and IEC 60598-2-4;<br/>
    – luminaires dedicated to therapeutic purposes;<br/>
    – special purpose lights with different conditions of use such as light sources intended solely for decontamination of air and surfaces, UV lights for dermatological diagnosis, slit lamps for ophthalmology, lights for surgical microscopes and lights for surgical navigation systems;<br/>
    – lights connected to surgical instruments, such as luminous retractors;<br/>
    – luminaires for emergency lighting, which are covered by IEC 60598-2-22.<br/>
    SURGICAL LUMINAIRES and LUMINAIRES FOR DIAGNOSIS are medical devices and not general lighting equipment.<br/>
    IEC 60601-2-41:2021 cancels and replaces the second edition published in 2009 and Amendment 1:2013. This edition constitutes a technical revision.<br/>
    This edition includes the following significant technical changes with respect to the previous edition:<br/>
    a) revised the statement of essential performance;<br/>
    b) added exposure limits, test conditions, calculation methods and safety warnings related to photobiological hazards;<br/>
    c) removed the terms “MINOR SURGICAL LUMINAIRES” and “MAJOR SURGICAL LUMINAIRES”;<br/>
    d) added definitions of MAXIMUM ILLUMINANCE DISTANCE and REFERENCE DISTANCE and allowed MANUFACTURERS to measure some performance characteristics at the REFERENCE DISTANCE that they specify;<br/>
    e) replaced the region of acceptable chromaticity in (x,y) colour space with a requirement for Du,v;<br/>
    f) added a requirement for acceptable drift of the lighthead when attached to the suspension system;<br/>
    g) added a requirement for fluid ingress protection;<br/>
    h) revised Table 201.101 of IEC 60601-2-41:2009 and IEC 60601-2-41:2009/AMD1:2013 and moved it to Annex BB;<br/>
    i) specified a new device for measuring SHADOW DILUTION in a simulated cavity;<br/>
    j) specified test conditions for luminaires equipped with distance sensors.
- language: fr
  script: Latn
  content: |-
    L'IEC 60601-2-41:2021 s’applique à la SECURITE DE BASE et aux PERFORMANCES ESSENTIELLES des ECLAIRAGES CHIRURGICAUX et des ECLAIRAGES DE DIAGNOSTIC, désignés ci-après sous le terme APPAREILS EM.<br/>
    Dans le cas où un article ou un paragraphe est spécifiquement prévu pour s’appliquer aux APPAREILS EM uniquement ou aux SYSTEMES EM uniquement, le titre et le contenu de cet article ou de ce paragraphe le mentionnent. Lorsque ce n’est pas le cas, l’article ou le paragraphe s’applique aux APPAREILS EM et aux SYSTEMES EM, le cas échéant.<br/>
    La présente norme particulière ne s’applique pas aux<br/>
    – lampes frontales;<br/>
    – endoscopes, laparoscopes et à leurs sources de lumière, qui sont couverts par<br/>
    l’IEC 60601-2-18;<br/>
    – éclairages utilisés pour les soins dentaires, qui sont couverts par l’ISO 9680;<br/>
    – luminaires à usage général, qui sont couverts par l’IEC 60598-2-1 et l’IEC 60598-2-4;<br/>
    – éclairages à usage thérapeutique;<br/>
    – lampes à usages spéciaux avec différentes conditions d’utilisation comme les sources de lumière destinées uniquement à la décontamination de l’air et des surfaces, lampes à ultraviolets pour diagnostic dermatologique, les lampes à fente pour l’ophtalmologie, les lampes pour microscopes chirurgicaux et les lampes pour systèmes de navigation chirurgicale;<br/>
    – lampes montées sur des instruments chirurgicaux, tels que les écarteurs lumineux;<br/>
    – luminaires pour éclairage de secours, qui sont couverts par l’IEC 60598-2-22.<br/>
    Les ECLAIRAGES CHIRURGICAUX et les ECLAIRAGES DE DIAGNOSTIC sont des dispositifs médicaux et non des appareils d’éclairage général.<br/>
    L'IEC 60601-2-41:2021 annule et remplace la deuxième édition parue en 2009 et l'Amendement 1:2013. Cette édition constitue une révision technique.<br/>
    Cette édition inclut les modifications techniques majeures suivantes par rapport à l'édition précédente:<br/>
    a) révision des énoncés relatifs aux performances essentielles;<br/>
    b) ajout des limites d’exposition, des conditions d’essai, des méthodes de calcul et des avertissements de sécurité relatifs aux dangers photobiologiques;<br/>
    c) suppression des termes "ECLAIRAGES CHIRURGICAUX MINEURS" et "ECLAIRAGES CHIRURGICAUX MAJEURS";<br/>
    d) ajout des définitions des termes DISTANCE D’ECLAIREMENT MAXIMAL et DISTANCE DE REFERENCE et permission aux FABRICANTS de mesurer certaines caractéristiques de performance à la distance de référence qu’ils spécifient;<br/>
    e) remplacement de la zone de chromaticité acceptable dans l’espace de couleur (x, y) par une exigence relative à Du,v;<br/>
    f) ajout d’une exigence relative à la dérive acceptable du projecteur lorsque celui-ci est fixé au système de suspension;<br/>
    g) ajout d’une exigence relative à la protection contre la pénétration d’un liquide;<br/>
    h) révision et déplacement à l’Annexe BB du Tableau 201.101 de l’IEC 60601-2-41:2009 et de l’IEC 60601-2-41:2009/AMD1:2013;<br/>
    i) spécification d’un nouvel appareil de mesure de l’ATTENUATION DE L’OMBRE dans une cavité simulée;<br/>
    j) spécification des conditions d’essai pour les éclairages équipés de capteurs de distance.
