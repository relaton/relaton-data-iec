abstract:
- language: en
  script: Latn
  content: |-
    IEC 63553:2026 specifies performance requirements of fully flexible organic light emitting diode (OLED) tiles and panels whose configurations are twisted, wavy or helical for use on supplies up to 120 V ripple free DC for indoor and similar general lighting purposes and designed for being bent during the manufacturing process of curved luminaires.<br/>
    The requirements of this document relate only to type testing.
- language: fr
  script: Latn
  content: |-
    L'IEC 63553:2026 spécifie les exigences de performance des dalles et panneaux à diodes électroluminescentes organiques (OLED, Organic Light Emitting Diode) entièrement flexibles dont les configurations sont torsadées, ondulées ou hélicoïdales et qui sont destinés à être utilisés avec des alimentations jusqu'à 120 V en courant continu lissé pour l'éclairage général intérieur ou similaire, et conçus pour être pliés pendant le processus de fabrication de luminaires incurvés.<br/>
    Les exigences du présent document s'appliquent uniquement aux essais de type.
