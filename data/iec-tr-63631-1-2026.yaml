abstract:
- language: en
  script: Latn
  content: IEC TR 63631-1:2026 presents general features, typical cases, and key technologies
    related to DMES. It analyses the existing standards and identifies the gaps and
    needs for DMES development from the perspectives of the equipment layer, the communication
    layer, the information layer, the management system layer, and the application
    layer. This document also provides information on future standardization needs
    in the area.
