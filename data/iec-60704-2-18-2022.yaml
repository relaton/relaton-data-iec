abstract:
- language: en
  script: Latn
  content: |-
    IEC 60704-2-18:2022 applies to single-unit electric water heaters for household and similar use intended for placing on the floor against a wall, for building-in or placing under a counter, a kitchen worktop or under a sink, for wall-mounting or on a counter.<br/>
    This document does not apply to:<br/>
    – combustion water heaters;<br/>
    – water kettles;<br/>
    – heat pump water heaters;<br/>
    – conventional electric storage water heaters as defined in IEC 60335-2-21:2012, Clause 1;<br/>
    – instantaneous electric water heaters without any noise-producing components such as motors and pumps.<br/>
    This document is intended to be used in conjunction with IEC 60704‑1:2021.
- language: fr
  script: Latn
  content: |-
    L'IEC 60704-2-18:2022 s'applique aux chauffe-eau électriques à une seule unité à usage domestique et analogue, destinés à être placés sur le sol contre un mur, intégrés ou placés sous un comptoir, un plan de travail de cuisine ou un évier, montés au mur ou sur un comptoir.<br/>
    Le présent document ne s'applique pas:<br/>
    – aux chauffe-eau à combustion;<br/>
    – aux bouilloires;<br/>
    – aux chauffe-eau à pompe à chaleur;<br/>
    – aux chauffe-eau électriques à accumulation ordinaires, définis à l'Article 1 de l'IEC 60335-2-21:2012;<br/>
    – aux chauffe-eau instantanés électriques sans composants générateurs de bruit tels que des moteurs ou des pompes.<br/>
    Le présent document est destiné à être utilisé conjointement avec l'IEC 60704-1:2021.
