abstract:
- language: en
  script: Latn
  content: |-
    IEC 61850-80-5:2026, which is a Technical Report, specifies the mapping framework for building and configuring a system using both IEC 61850 and IEC 61158-6-15 (Industrial communication networks – Fieldbus specification, CPF Type 15, Modbus) protocols by utilizing gateways between IEC 61850 and IEC 61158-6-15 IEDs / subsystems. The objective is to enable operational run-time data exchange among these IEDs / subsystems, and to automate the configuration of a gateway as much as possible.<br/>
    Please note that for the purposes of this document, "Modbus" is used to represent both serial Modbus (Modbus RTU) and IEC 61158-6-15 (Modbus TCP).<br/>
    Within the capability of each protocol, some configuration attributes (IEC 61850-7-3:2010 and IEC 61850-7-3:2010/AMD1:2020 attributes with functional constraint CF) are also mapped in addition to the operational real-time data.<br/>
    The frameworks specified in this document are based on the published standards and do not make any proposed changes to IEC 61850 or 61158-6-15. This standard does not specify any framework for an IEC 61850 IED to directly communicate with a Modbus IED and vice versa, except through a gateway.<br/>
    This document does not mandate which data items that a particular IED will be supporting, regardless of whether the implementation uses Modbus or IEC 61850. Instead, this document provides a framework specifying how a gateway maps any given data item from Modbus into an IEC 61850 substation, including the control direction.<br/>
    Similarly, this document does not mandate which mapping framework a given gateway will be supporting. When this document is republished as a Technical Specification, conformance requirements will be identified.<br/>
    This document recognizes that there will be situations in which a user will require that a gateway perform non-standard protocol mappings. Non-standard mappings are outside the scope of this document.<br/>
    This document also recognizes that gateways typically manipulate the data passing through them in a variety of ways. Some of these functions include alarm trigger grouping, data suppression, interlocking and command blocking. Conformance to this document does not preclude a gateway from performing such functions, even though this document primarily specifies "straight through" mapping of Modbus data to IEC 61850-7-3:2010 and IEC 61850-7-3:2010/AMD1:2020 data. Subclause 7.5 of this document describes how some of these functions can be specified to a gateway by a mapping tool using XML representations of conversion functions.<br/>
    The mapping architecture for the exchange of the run-time information consists of four parts:<br/>
    a) Conceptual architecture of a gateway and associated use case<br/>
    b) Mapping of the information model (Assign semantic to the Modbus data)<br/>
    c) Mapping of the data (which is in fact part of the information model)<br/>
    d) Mapping of the services (out of scope for this document)<br/>
    This second edition cancels and replaces the first edition published in 2024. This edition constitutes a technical revision.<br/>
    This edition includes the following significant technical changes with respect to the previous edition:<br/>
    a) deficiencies / missing text in Edition 1 corrected.
