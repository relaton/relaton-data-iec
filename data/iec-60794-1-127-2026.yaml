abstract:
- language: en
  script: Latn
  content: |-
    IEC 60794-1-127: 2026 defines the test procedures used to establish uniform requirements for mechanical performance - Indoor simulated installation test. It applies to optical fibre cables for use with telecommunication equipment and devices employing similar techniques, and to cables having a combination of both optical fibres and electrical conductors.<br/>
    Throughout this document the wording “optical cable” can also include optical fibre units, microduct fibre units, etc.<br/>
    This edition includes the following significant technical changes with respect to Method E27 of IEC 60794-1-21:2015, and 60794-1-21:2015/AMD1:2020:<br/>
    a) addition of a new Clause “11 Details to be reported.”
- language: fr
  script: Latn
  content: |-
    L'IEC 60794-1-127:2026 définit les procédures d’essai utilisées pour établir des exigences uniformes pour les performances mécaniques – Essai d'installation simulée en intérieur. Elle s'applique aux câbles à fibres optiques destinés à être utilisés dans les équipements de télécommunications et les dispositifs qui utilisent des techniques analogues, ainsi qu'aux câbles constitués de fibres optiques d'une part et de conducteurs électriques d'autre part.<br/>
    Dans le présent document, l'expression "câble optique" peut également inclure des assemblages de fibres optiques, des assemblages de fibres en microconduits, etc.<br/>
    Cette édition inclut les modifications techniques significatives suivantes par rapport à la méthode E27 de l'IEC 60794-1-21:2015, et 60794-1-21:2015/AMD1:2020:<br/>
    a) ajout d’un nouvel Article 11 "Informations détaillées à consigner".
