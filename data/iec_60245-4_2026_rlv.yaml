abstract:
- content: "IEC 60245-4:2026 RLV contains both the official IEC International Standard
    and its Redline version. The Redline version is available in English only and
    provides you with a quick and easy way to compare all the changes between the
    official IEC Standard and its previous edition.<br /><br />\r\nIEC 60245-4:2026
    defines the particular requirements for rubber insulated and braided cords and
    for rubber insulated and rubber or polychloroprene or other equivalent synthetic
    elastomer sheathed cords and flexible cables of rated voltages up to and including
    450/750 V which apply in addition to the general requirements specified in IEC
    60245-1, which apply to all cables.<br />\r\nIEC 60245-4:2026 includes the following
    significant technical changes with respect to the previous edition:<br />\r\na)
    reference to tests according to IEC 60245-2 has been deleted and replaced by IEC
    63294;<br />\r\nb) normative references have been updated.<br />\r\nThis document
    is to be used in conjunction with IEC 60245-1."
