abstract:
- language: en
  script: Latn
  content: |-
    IEC 61892-1:2019 RLV contains both the official IEC International Standard and its Redline version. The Redline version is available in English only and provides you with a quick and easy way to compare all the changes between the official IEC Standard and its previous edition.<br/>
    <br/>
    IEC 61892-1:2019 is applicable to electrical installations and equipment in mobile and fixed offshore units, including pipeline, pumping or "pigging" stations, compressor stations and single buoy moorings, used in the offshore petroleum industry for drilling, production, accommodation, processing, storage and offloading purposes.<br/>
    It applies to all installations, whether permanent, temporary, transportable or hand-held, to AC installations and DC installations without any voltage level limitation. Referenced equipment standards may give voltage level limitations.<br/>
    This document specifies requirements such as those concerning<br/>
    – environmental conditions,<br/>
    – power supply characteristics,<br/>
    – location of electrical equipment in units,<br/>
    – protection against external influences,<br/>
    – protection against electrical shock, and<br/>
    – ignition source control.<br/>
    This document gives information and guidance on topics such as<br/>
    – cold climate protection, and<br/>
    – surface treatment and protective painting system.<br/>
    This document does not apply to<br/>
    – fixed equipment for medical purposes,<br/>
    – electrical installations of tankers, and<br/>
    – control of ignition sources other than those created by electrical equipment.<br/>
    This fourth edition cancels and replaces the third edition published in 2015. This edition constitutes a technical revision.<br/>
    This edition includes the following significant technical changes with respect to the previous edition:<br/>
    a) voltage limitations have been removed;<br/>
    b) definitions for fixed offshore units and mobile offshore units have been included;<br/>
    c) tables for ambient air temperature and relative humidity have been removed, as this information will normally be given in owner's/operator's documentation for specific projects;<br/>
    d) the requirement as to ignition source control has been moved from IEC 61892-7 to this document;<br/>
    e) tables for voltage characteristics have been updated;<br/>
    f) requirements for a minimum degree of protection for equipment have been moved from IEC 61892-2 to this document.
