abstract:
- language: en
  script: Latn
  content: |-
    IEC 62841-2-25:2026 applies to hand-held chain beam saws for cutting wood or similar material and designed for use by one person. This document does not apply to chain beam saw attachments that convert a circular saw or a chain saw into a chain beam saw. This document does not apply to chain saws, chain saws for tree service, and pole-mounted pruners.<br/>
    NOTE 101 Chain saws are covered by IEC 62841-4-1.<br/>
    NOTE 102 Chain saws for tree service will be covered by a future part of IEC 62841.<br/>
    NOTE 103 Pole-mounted pruners will be covered by a future part of IEC 62841.<br/>
    This document is to be used in conjunction with IEC 62841-1:2014 and IEC 62841-1:2014/AMD1:2025.<br/>
    This document supplements or modifies the corresponding clauses in IEC 62841-1, so as to convert it into the IEC Standard: Particular requirements for hand-held chain beam saws. Where a particular subclause of IEC 62841-1 is not mentioned in this document, that subclause applies as far as reasonable. Where this document states "addition", "modification" or "replacement", the relevant text in IEC 62841-1 is to be adapted accordingly. Subclauses, notes, tables and figures which are additional to those in IEC 62841-1 are numbered starting from 101. Subclauses, notes, tables and figures in Annex K and Annex L which are additional to those in the main body of this document are numbered starting from 301.<br/>
    NOTE The attention of National Committees is drawn to the fact that equipment manufacturers and testing organizations may need a transitional period following publication of a new, amended or revised IEC publication in which to make products in accordance with the new requirements and to equip themselves for conducting new or revised tests. It is the recommendation of the committee that the content of this publication be adopted for implementation nationally not earlier than 36 months from the date of publication.
- language: fr
  script: Latn
  content: |-
    IEC 62841-2-25:2026 s'applique aux scies à chaîne de poutre portatives destinées à couper du bois ou des matériaux similaires et conçues pour être utilisées par une seule personne. Le présent document ne s'applique pas aux fixations pour scies à chaîne de poutre qui permettent de transformer une scie circulaire ou une scie à chaîne en une scie à chaîne de poutre. Le présent document ne s'applique pas aux scies à chaîne, aux scies à chaîne d'élagage, et aux élagueuses sur perche.<br/>
    NOTE 101 Les scies à chaîne sont couvertes par l'IEC 62841‑4‑1.<br/>
    NOTE 102 Les scies à chaîne d'élagage seront traitées dans une future partie de l'IEC 62841.<br/>
    NOTE 103 Les élagueuses sur perche seront traitées dans une future partie de l'IEC 62841.<br/>
    Le présent document doit être utilisé conjointement avec l'IEC 62841‑1:2014 et l'IEC 62841‑1:2014/AMD1:2025. Le présent document complète ou modifie les articles correspondants de l'IEC 62841‑1 de façon à la transformer en norme IEC: Exigences particulières pour les scies à chaîne de poutre portatives. Lorsqu'un paragraphe particulier de l'IEC 62841‑1 n'est pas mentionné dans le présent document, ce paragraphe s'applique pour autant que cela soit raisonnable. Lorsque le présent document mentionne "addition", "modification" ou "remplacement", le texte correspondant de l'IEC 62841‑1 doit être adapté en conséquence.<br/>
    NOTE L'attention des Comités nationaux est attirée sur le fait que les fabricants d'appareils et les organismes d'essai peuvent avoir besoin d'une période transitoire après la publication d'une nouvelle publication IEC, ou d'une publication amendée ou révisée, pour fabriquer des produits conformes aux nouvelles exigences et pour adapter leurs équipements aux nouveaux essais ou aux essais révisés. Le comité recommande que le contenu de cette publication soit adopté pour application nationale au plus tôt 36 mois après la date de publication.
