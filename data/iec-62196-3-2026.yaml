abstract:
- language: en
  script: Latn
  content: "IEC 62196-3:2026 is applicable to vehicle couplers with pins and contact
    tubes of standardized configuration, herein also referred to as \"accessories\",
    intended for use in electric vehicle conductive charging systems which incorporate
    control means, with rated operating voltage and current in accordance with IEC
    62196-1:2025.<br />\r\nThis document applies to high power DC interfaces and combined
    AC/DC interfaces of vehicle couplers that are intended for use in conductive charging
    systems for circuits specified in IEC 61851-1 and IEC 61851-23.<br />\r\nThis
    third edition cancels and replaces the second edition published in 2022. This
    edition constitutes a technical revision.<br />\r\nThis edition includes the following
    significant technical changes with respect to the previous edition:<br />\r\na)
    The content of IEC TS 62196-3-1 has been integrated into this document as normative
    Annex AA.<br />\r\nb) increased ratings for all configurations;<br />\r\nc) reference
    to new tests in IEC 62196-1:2025 (Clauses 34, 35, 36 and 37)."
- language: fr
  script: Latn
  content: "l'IEC 62196-3:2026 s'applique aux prises de courant de véhicule à broches
    et alvéoles de configurations normalisées, ci-après dénommés \"appareils\", destinés
    à être utilisés dans les systèmes de charge conductive pour véhicules électriques
    qui intègrent un dispositif de commande, avec une tension d'emploi assignée et
    un courant assigné conformes à l'IEC 62196-1:2025.<br />\r\nLe présent document
    s'applique aux interfaces forte puissance en courant continu et aux interfaces
    combinées en courant alternatif/continu des connecteurs de véhicule qui sont destinées
    à être utilisées dans les systèmes de charge conductive pour les circuits spécifiés
    dans l'IEC 61851-1 et l'IEC 61851­-23.<br />\r\nCette troisième édition annule
    et remplace la deuxième édition parue en 2022. Cette édition constitue une révision
    technique.<br />\r\nCette édition inclut les modifications techniques majeures
    suivantes par rapport à l'édition précédente:<br />\r\na) intégration du contenu
    de l'IEC TS 62196-3-1 à l'Annexe normative AA du présent document;<br />\r\nb)
    augmentation des caractéristiques assignées pour toutes les configurations;<br
    />\r\nc) référence aux nouveaux essais de l'IEC 62196-1:2025 (Articles 34, 35,
    36 et 37)."
