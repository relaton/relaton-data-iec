abstract:
- language: en
  script: Latn
  content: |-
    IEC 60688:2021 RLV contains both the official IEC International Standard and its Redline version. The Redline version is available in English only and provides you with a quick and easy way to compare all the changes between the official IEC Standard and its previous edition.<br/>
    <br/>
    IEC 60688:2021 applies to transducers with electrical inputs and outputs for making measurements of AC or DC electrical quantities. The output signal can be in the form of an analogue direct current, an analog direct voltage or in digital form.<br/>
    This document applies to measuring transducers used for converting electrical quantities such as<br/>
    – current,<br/>
    – voltage,<br/>
    – active power,<br/>
    – reactive power,<br/>
    – power factor,<br/>
    – phase angle,<br/>
    – frequency,<br/>
    – harmonics or total harmonic distortion, and<br/>
    – apparent power<br/>
    to an output signal.<br/>
    This document is not applicable for<br/>
    – instrument transformers that complies with IEC 61869 (all parts),<br/>
    – transmitters for use in industrial process application that complies with IEC 60770 (all parts), and<br/>
    – performance measuring and monitoring devices (PMD) that comply with IEC 61557 12:2018.<br/>
    Within the measuring range, the output signal is a function of the measurand. An auxiliary supply can be needed.<br/>
    This document applies<br/>
    a) if the nominal frequency of the input(s) lies between 0 Hz and 1 500 Hz,<br/>
    b) to the electrical measuring transducer if it is part of a system for the measurement of a non-electrical quantity, and if it otherwise falls within the scope of this document, and<br/>
    c) to transducers for use in a variety of applications such as telemetry and process control and in one of a number of defined environments.<br/>
    This document is intended:<br/>
    – to specify the terminology and definitions relating to transducers whose main application is in industry,<br/>
    – to unify the test methods used in evaluating transducer performance, and<br/>
    – to specify accuracy limits and output values for transducers.<br/>
    IEC 60688:2021 cancels and replaces the third edition published in 2012. This edition constitutes a technical revision.<br/>
    This edition includes the following significant technical changes with respect to the previous edition:<br/>
    a) updating normative references;<br/>
    b) additional requirements for specific transducers used for LV monitoring applications;<br/>
    c) creation of interface coding to ease selection by the end-user.
