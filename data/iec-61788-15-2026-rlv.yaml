abstract:
- language: en
  script: Latn
  content: "IEC 61788-15:2026 RLV contains both the official IEC International Standard
    and its Redline version. The Redline version is available in English only and
    provides you with a quick and easy way to compare all the changes between the
    official IEC Standard and its previous edition.<br />\r\n<br />\r\nIEC 61788-15:2026
    describes measurements of the intrinsic surface impedance (Zs) of HTS films at
    microwave frequencies by a modified two-resonance mode dielectric resonator method.
    The object of measurement is to obtain the temperature dependence of the intrinsic
    Zs at the resonant frequency f0.<br />\r\nThe frequency and thickness range and
    the measurement resolution for the Zs of HTS films are as follows:<br />\r\n-
    frequency: up to 40 GHz;<br />\r\n- film thickness: greater than 50 nm;<br />\r\n-
    measurement resolution: 0,01 mΩ at 10 GHz.<br />\r\nIt is crucial that the Zs
    data at the measured frequency, and that scaled to 10 GHz be reported for comparison,
    assuming the f2 rule for the intrinsic surface resistance, Rs (f < 40 GHz), and
    the f rule for the intrinsic surface reactance, Xs. This second edition cancels
    and replaces the first edition published in 2011. This edition constitutes a technical
    revision.<br />\r\nThis edition includes the following significant technical changes
    with respect to the previous edition:<br />\r\n- informative Annex B, combined
    relative standard uncertainty in the intrinsic surface impedance is added;<br
    />\r\n- the terms, ‘precision and accuracy’, are replaced with uncertainty;<br
    />\r\n- results from a round robin test are added."
