abstract:
- language: en
  script: Latn
  content: |-
    IEC TR 60479-4:2020 (E) summarizes the basic parameters for lightning and its variability insofar as they apply to human beings and livestock.<br/>
    The possible direct and indirect interactions of strikes with bodies of living beings are indicated. The resulting effects caused by lightning currents for the organism are described.<br/>
    This document shows the differences of effects on human beings and livestock due to lightning strokes versus those effects of electric shocks derived from electrical systems.<br/>
    This third edition cancels and replaces the second edition published in 2011. This edition constitutes a technical revision.<br/>
    This edition includes the following significant technical changes with respect to the previous edition:<br/>
    a) lightning occurence and climatory effects around the world are depicted;<br/>
    b) direct strike description is extended;<br/>
    c) step voltage effects are expanded;<br/>
    d) upward streamer explanation is enhanced;<br/>
    e) other direct or indirect related effects to lightning injuries to the human body are specified;<br/>
    f) various safety procedures and related possibilities with respect to the personsal danger of lightning are presented.
