abstract:
- language: en
  script: Latn
  content: |-
    IEC 60721-3-6:2025 classifies the groups of environmental parameters and their severities to which a product is subjected when installed aboard a ship.<br/>
    Ships where electrotechnical products may be permanently or temporarily installed include<br/>
    - ships propelled by mechanical means, including mobile offshore units, and<br/>
    - ships not propelled by mechanical means, including sailing boats and life rafts.<br/>
    The classes defined apply to all sizes of ship from pleasure craft to trawlers, ferry boats, icebreakers, cargo ships including tankers.<br/>
    The areas in which ships normally navigate are<br/>
    - inland waterways (canals, rivers, lakes etc.),<br/>
    - coastal waters, and<br/>
    - oceans.<br/>
    Areas where ships navigate in ice are also included.<br/>
    This second edition cancels and replaces the first edition, published in 1987, and constitutes a technical revision.<br/>
    This edition includes the following significant changes with respect to the previous edition:<br/>
    a) most classes have been replaced by completely new classes based on the use of new information obtained from referenced Technical Reports;<br/>
    b) Table 1 through to Table 5 have been updated;<br/>
    c) the content of Annex A and Annex B has either been incorporated into main body text or deleted.
- language: fr
  script: Latn
  content: |-
    L'IEC 60721-3-6:2025 classifie les groupements des agents d'environnement et leurs sévérités, auxquels est soumis un produit lorsqu'il est installé à bord d'un navire.<br/>
    Les navires à bord desquels des produits électrotechniques peuvent être installés de façon permanente ou temporaire comprennent:<br/>
    - les navires à propulsion mécanique, y compris les unités mobiles en mer; et<br/>
    - les navires non propulsés par des moyens mécaniques, y compris les bateaux à voile et les radeaux de survie.<br/>
    Les classes définies s'appliquent aux navires de toutes tailles, depuis les embarcations de plaisance jusqu'aux chalutiers, transbordeurs, brise-glaces, cargos y compris les navires‑citernes.<br/>
    Les zones dans lesquelles les navires naviguent normalement sont:<br/>
    - les eaux intérieures (canaux, rivières, lacs, etc);<br/>
    - les eaux côtières; et<br/>
    - les océans.<br/>
    Les zones où les navires naviguent dans les glaces sont aussi comprises.<br/>
    Cette deuxième édition annule et remplace la première édition parue en 1987, et constitue une révision technique.<br/>
    Cette édition inclut les modifications majeures suivantes par rapport à l'édition précédente:<br/>
    a) la plupart des classes ont été remplacées par des classes totalement nouvelles, établies en fonction de l'utilisation de nouvelles informations obtenues dans les Rapports techniques référencés;<br/>
    b) les Tableau 1 à Tableau 5 ont été mis à jour;<br/>
    c) le contenu de l'Annexe A et de l'Annexe B a été soit incorporé dans le corps principal du texte, soit supprimé.
