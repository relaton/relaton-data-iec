abstract:
- language: en
  script: Latn
  content: <p class="MsoNormal">This document specifies a subset of the syntax specified
    in Rec. ITU-T T.840.1 | ISO/IEC 6048-1 via one Main stream profile and three decoder
    tool subsets as three decoder profiles. It also defines higher bounds on tile
    and picture sizes via levels of a decoder profile that a conforming decoder implementation
    shall support, and specifies profiles, each being tailored to certain application
    domains, and defines the levels of the profiles.</p>
