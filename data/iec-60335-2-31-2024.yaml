abstract:
- language: en
  script: Latn
  content: |-
    IEC 60335-2-31:2024 deals with the safety of electric range hoods and other cooking fume extractors intended for installing above, beside, behind or under household cooking ranges, hobs and similar cooking appliances, their rated voltage being not more than 250 V including direct current (DC) supplied appliances. The cooking appliance can be supplied by electricity or other fuels, such as gas. Appliances not intended for normal household use but that nevertheless can be a source of danger to the public, such as appliances intended to be used by laymen in shops, in light industry and on farms, are within the scope of this standard. As far as is practicable, this standard deals with the common hazards presented by appliances that are encountered by all persons in and around the home. However, in general, it does not take into account<br/>
    - persons (including children) whose physical, sensory or mental capabilities; or lack of experience and knowledge prevents them from using the appliance safely without supervision or instruction;<br/>
    - children playing with the appliance.<br/>
    Attention is drawn to the fact that<br/>
    - for appliances incorporating electrostatic air filters, IEC 60335-2-65 also applies;<br/>
    - for appliances intended to be used in vehicles or on board ships or aircraft, additional requirements can be necessary;<br/>
    - in many countries additional requirements are specified by the national health authorities, the national authorities responsible for the protection of labour, the national authorities responsible for buildings and similar authorities.<br/>
    This standard does not apply to<br/>
    - appliances intended for commercial purposes (IEC 60335-2-99);<br/>
    - appliances intended to be used in locations where special conditions prevail, such as the presence of a corrosive or explosive atmosphere (dust, vapour or gas).<br/>
    This sixth edition cancels and replaces the fifth edition published in 2012, Amendment 1:2016 and Amendment 2:2018. This edition constitutes a technical revision.<br/>
    This edition includes the following significant technical changes with respect to the previous edition:<br/>
    a) alignment with IEC 60335-1:2020;<br/>
    b) conversion of some notes to normative text (Clause 1, 22.8, 22.101, 22.102);<br/>
    c) update of the installation requirements for the heating test to include down-draft systems (11.2);<br/>
    d) addition of accessible surface temperature limits (11.3, 11.8);<br/>
    e) introduction of IEC TR 62854 to determine compliance in case of doubt (22.14);<br/>
    f) clarification of remote operation requirements for range hoods and other cooking fume extraction appliances (22.40, 22.49, 22.51);<br/>
    g) clarification of 30.101 with respect to grease filters and odour extraction filters.<br/>
    This part 2 is to be used in conjunction with the latest edition of IEC 60335-1 and its amendments. unless that edition precludes it; in that case, the latest edition that does not preclude it is used. It was established on the basis of the sixth edition (2020) of that standard.
- language: fr
  script: Latn
  content: |-
    L'IEC 60335-2-31:2024 traite de la sécurité des hottes de cuisine électriques et autres extracteurs électriques de fumées de cuisson destinés à être installés au-dessus, à côté, derrière ou sous des cuisinières, tables de cuisson ou appareils de cuisson analogues, dont la tension assignée est inférieure ou égale à 250 V, y compris les appareils alimentés en courant continu. Les appareils de cuisson peuvent être alimentés à l'électricité ou avec d'autres combustibles, tels que le gaz. Les appareils non destinés à un usage domestique normal, mais qui peuvent néanmoins constituer une source de danger pour le public, tels que les appareils destinés à être utilisés par des utilisateurs non avertis dans des magasins, chez des artisans et dans des fermes, sont compris dans le domaine d'application de la présente norme. Dans la mesure du possible, la présente norme traite des dangers courants que présentent les appareils et auxquels sont exposés tous les individus situés à l'intérieur et autour de l'habitation. Cependant, elle ne tient en général pas compte:<br/>
    - des personnes (y compris des enfants) dont les capacités physiques, sensorielles ou mentales; ou le manque d'expérience et de connaissance les empêchent d'utiliser l'appareil en toute sécurité sans surveillance ou instruction;<br/>
    - des enfants qui jouent avec l'appareil.<br/>
    L'attention est attirée sur le fait que<br/>
    - pour les appareils qui comportent des filtres à air électrostatiques, l'IEC 60335-2-65 s'applique également;<br/>
    - pour les appareils destinés à être utilisés dans des véhicules ou à bord de navires ou d'avions, des exigences supplémentaires peuvent être nécessaires;<br/>
    - dans de nombreux pays, des exigences supplémentaires sont spécifiées par les organismes nationaux de la santé, par les organismes nationaux responsables de la protection des travailleurs, par les organismes nationaux responsables du bâtiment et par des organismes similaires.<br/>
    La présente norme ne s'applique pas:<br/>
    - aux appareils destinés à des usages commerciaux (IEC 60335-2-99);<br/>
    - aux appareils destinés à être utilisés dans des locaux qui présentent des conditions particulières, telles que la présence d'une atmosphère corrosive ou explosive (poussière, vapeur ou gaz).<br/>
    Cette sixième édition annule et remplace la cinquième édition parue en 2012, l'Amendement 1:2016 et l'Amendement 2:2018. Cette édition constitue une révision technique.<br/>
    Cette édition inclut les modifications techniques majeures suivantes par rapport à l'édition précédente:<br/>
    a) le texte a été aligné sur l'IEC 60335-1:2020;<br/>
    b) certaines notes ont été converties en texte normatif (Article 1, 22.8, 22.101, 22.102);<br/>
    c) les exigences d’installation pour l’essai de chauffage ont été mises à jour afin d’inclure les systèmes d'extraction à flux descendant (11.2) ;<br/>
    d) des limites de température ont été ajoutées pour les surfaces accessibles (11.3, 11.8);<br/>
    e) une référence à l'IEC TR 62854 a été ajoutée afin de déterminer la conformité en cas de doute (22.14) ;<br/>
    f) les exigences de fonctionnement à distance des hottes de cuisine et autres appareils d’extraction des fumées de cuisson ont été clarifées (22.40, 22.49, 22.51) ;<br/>
    g) la vérification des filtres à graisse et des filtres pour l’extraction des odeurs a été clarifiée (30.101).<br/>
    La présente partie 2 doit être utilisée conjointement avec la dernière édition de l'IEC 60335-1 et ses amendements sauf si cette édition l'exclut. Dans ce cas, la dernière édition qui n'exclut pas la présente partie 2 est utilisée. Elle a été établie sur la base de la sixième édition (2020) de cette norme.
