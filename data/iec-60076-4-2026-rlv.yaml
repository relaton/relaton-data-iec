  content: |-
    IEC 60076-4:2026 RLV contains both the official IEC International Standard and its Redline version. The Redline version is available in English only and provides you with a quick and easy way to compare all the changes between the official IEC Standard and its previous edition.<br/>
    <br/>
    IEC 60076-4:2026 applies to lightning and switching impulse tests on power transformers and reactors. Information is given on waveforms, test circuits including test connections, earthing practices, failure detection methods, test procedures, measuring techniques and interpretation of results.
