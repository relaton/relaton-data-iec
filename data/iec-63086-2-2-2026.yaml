abstract:
- language: en
  script: Latn
  content: |-
    IEC 63086-2-2:2026 specifies test methods for measuring the performance of electrically powered household and similar air cleaners intended for the reduction of gas-phase pollutants.<br/>
    This document is intended for measuring the reduction of the concentration of specific gas-phase pollutants. This does not necessarily correlate with the reduction of odour intensity in the case of odorous gas-phase pollutants. Such a reduction can only be tested by olfactory tests, which are not part of this document.
- language: fr
  script: Latn
  content: |-
    L'IEC 63086-2-2:2026 spécifie des méthodes d'essai pour mesurer l'aptitude à la fonction des épurateurs d'air électrodomestiques et analogues destinés à la réduction des polluants en phase gazeuse.<br/>
    Le présent document est destiné à mesurer la réduction de la concentration de certains polluants en phase gazeuse. Dans le cas des polluants olfactifs en phase gazeuse, la réduction de leur concentration ne coïncide pas nécessairement avec une réduction de l'intensité de leur odeur. Cet aspect peut uniquement être soumis à des essais olfactifs, ce qui ne relève pas du présent document.
