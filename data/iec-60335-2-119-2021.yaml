abstract:
- language: en
  script: Latn
  content: |-
    IEC 60335-2-119:2021 deals with the safety of commercial electric packaging appliances using vacuum conditions for food preservation, their rated voltage being not more than 250 V for single-phase appliances and 480 V for other appliances.<br/>
    These appliances are not intended for household and similar purposes. They are used for commercial preservation of food in areas not open to the public, for example in kitchens of restaurants, canteens, hospitals and in commercial enterprises such as bakeries and butcheries.<br/>
    Examples of appliances that are within the scope of this standard are:<br/>
    – chamber vacuum packaging appliances;<br/>
    – vacuum packaging appliances.<br/>
    These appliances may be provided with a film-sealing function.<br/>
    This standard also deals with the hygiene aspects of appliances.<br/>
    As far as is practicable, this standard deals with the common hazards presented by appliances that are encountered by users. However, in general, it does not consider young children playing with the appliance.<br/>
    Attention is drawn to the fact that:<br/>
    – for appliances intended to be used in vehicles or onboard ships or aircraft, additional requirements may be necessary;<br/>
    – in many countries, additional requirements for appliances incorporating pressure vessels are specified;<br/>
    – in many countries, additional requirements are specified by the national health authorities, the national authorities responsible for the protection of labour, the national water supply authorities and similar authorities.<br/>
    This standard does not apply to:<br/>
    – appliances which operate with injection in the vacuum chamber of inert gas with an oxygen content exceeding 21 %;<br/>
    – appliances intended to be used in locations where special conditions prevail, such as the presence of a corrosive or explosive atmosphere (dust, vapour or gas);<br/>
    – vacuum packaging appliances for household and similar use (IEC 60335-2-45);<br/>
    – battery-operated appliances.<br/>
    This Part 2 is to be used in conjunction with the latest edition of IEC 60335-1 and its amendments unless that edition precludes it; in that case, the latest edition that does not preclude it is used. It was established on the basis of the sixth edition (2020) of that standard.
- language: fr
  script: Latn
  content: |-
    L'IEC 60335-2-119:2021 traite de la sécurité des emballeuses électriques à usage commercial qui utilisent la mise sous vide pour la conservation des aliments, et dont la tension assignée est inférieure ou égale à 250 V pour les appareils monophasés et à 480 V pour les autres appareils.<br/>
    Ces appareils ne sont pas destinés à un usage domestique ou analogue. Ils sont destinés à un usage commercial pour la conservation des aliments dans des zones non ouvertes au public, par exemple dans les cuisines de restaurants, les cantines, les hôpitaux et les entreprises commerciales, telles que les boulangeries et les boucheries.<br/>
    La liste suivante répertorie les exemples d'appareils qui relèvent du domaine d'application de la présente norme:<br/>
    – emballeuses sous vide à cloche;<br/>
    – emballeuses sous vide.<br/>
    Ces appareils peuvent comporter une fonction de scellage sous film.<br/>
    La présente norme traite également des aspects liés à hygiène de ces appareils.<br/>
    Dans la mesure du possible, la présente norme traite des dangers courants que présentent ces appareils pour les usagers. Toutefois, en général, elle ne couvre pas les jeunes enfants qui jouent avec l'appareil.<br/>
    L'attention est attirée sur le fait que:<br/>
    – pour les appareils destinés à être utilisés dans des véhicules ou à bord de navires ou d'avions, des exigences supplémentaires peuvent être nécessaires;<br/>
    – dans de nombreux pays, des exigences supplémentaires sont spécifiées pour les appareils qui comportent des récipients sous pression;<br/>
    – dans de nombreux pays, des exigences supplémentaires sont spécifiées par les organismes nationaux de la santé, par les organismes nationaux responsables de la protection des travailleurs, par les organismes nationaux responsables de l'alimentation en eau et par des organismes similaires.<br/>
    La présente norme ne s'applique pas:<br/>
    – aux appareils qui injectent dans la cloche sous vide un gaz inerte dont la teneur en oxygène est supérieure à 21 %;<br/>
    – aux appareils destinés à être utilisés dans des locaux qui présentent des conditions particulières, telles que la présence d'une atmosphère corrosive ou explosive (poussière, vapeur ou gaz);<br/>
    – aux emballeuses sous vide à usage domestique et analogue (IEC 60335-2-45);<br/>
    – aux appareils alimentés par batteries.<br/>
    La présente Partie 2 doit être utilisée conjointement avec la dernière édition de l'IEC 60335-1 et ses amendements sauf si cette édition l'exclut. Dans ce cas, la dernière édition qui n'exclut pas la présente Partie 2 est utilisée. Elle a été établie sur la base de la sixième édition (2020) de cette norme.
