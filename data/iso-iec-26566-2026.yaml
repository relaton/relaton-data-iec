abstract:
- language: en
  script: Latn
  content: |-
    <p>This document, within the context of methods’ and tools’ capability for supporting product line texture, defines:</p>

    processes for product line texture management, operationalization, and support; those processes are described in terms of purpose, inputs, tasks, and outcomes;
    method capabilities to support the defined tasks of each process;
    tool capabilities that automate or semi-automate tasks and methods.

    <p>This document does not concern the processes and capabilities of tools and methods for a single system but rather deals with those for a family of products.</p>
