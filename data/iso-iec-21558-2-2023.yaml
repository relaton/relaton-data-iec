  content: |-
    <p class="MsoBodyText" style="mso-layout-grid-align: none; text-autospace: none;">This document describes the architectural aspects of Future Network (FN) Quality of Service (QoS) based on an FNProxy model, taking into account the requirements described on ISO/IEC TR 29181-8. It describes:</p>
    <p class="ListContinue1" style="tab-stops: 19.85pt 39.7pt 59.55pt 79.4pt 99.25pt 119.05pt 138.9pt 158.75pt 178.6pt 198.45pt; mso-layout-grid-align: none; text-autospace: none;">—    the concept of future network QoS (FNQoS),</p>
    <p class="ListContinue1" style="tab-stops: 19.85pt 39.7pt 59.55pt 79.4pt 99.25pt 119.05pt 138.9pt 158.75pt 178.6pt 198.45pt; mso-layout-grid-align: none; text-autospace: none;">—    the architectural model of FNQoS system,</p>
    <p class="ListContinue1" style="tab-stops: 19.85pt 39.7pt 59.55pt 79.4pt 99.25pt 119.05pt 138.9pt 158.75pt 178.6pt 198.45pt; mso-layout-grid-align: none; text-autospace: none;">—    the usage of FNQoS system.</p>
