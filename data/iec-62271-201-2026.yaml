abstract:
- language: en
  script: Latn
  content: |-
    IEC 62271-201:2026 is applicable to prefabricated solid-insulation enclosed switchgear and controlgear assemblies designed for:<br/>
    – alternating current;<br/>
    – rated voltages above 1 kV and up to and including 52 kV;<br/>
    – service frequencies up to and including 60 Hz;<br/>
    – indoor installation;<br/>
    – areas limited to authorized personnel.<br/>
    The assembly can include either air-insulated or fluid-filled compartments, or both.<br/>
    For components installed in a solid-insulation enclosed switchgear and controlgear, this document supplements or even replaces in some cases, the requirements as stated by the individual product standards. The list of components which can be inside the solid-insulation enclosed switchgear and controlgear is not limited to the ones explicitly cited in this document. This third edition cancels and replaces the second edition published in 2014. This edition constitutes a technical revision.<br/>
    This edition includes the following significant technical changes with respect to the previous edition:<br/>
    a) aligned with the third edition of IEC 62271-200 published in 2021 and its Amendment 1 published in 2024, for structure, definitions, classifications, ratings and testing procedures, where appropriate;<br/>
    b) clause numbering aligned with IEC 62271-1:2017, including the adoption of the subclause names of Clause 3;<br/>
    c) in Clause 3 specific terms and definitions are added for "in service", "normal operating condition" and "normal use";<br/>
    d) earthing circuit is more precisely described, including ratings and test requirements;<br/>
    e) number of mechanical tests on interlocks is reduced for type testing;<br/>
    f) forces to apply during type testing are better prescribed (refer to 7.102);<br/>
    g) resistance measuring on main circuit is only needed before continuous current tests (as reference for routine tests) and not anymore needed after this continuous current test. Rationale for this deletion is that this measured resistance does not mean anything; as the temperature rise test was just finished, a new temperature rise test will not give new information;<br/>
    h) IEC 62271-100:2021 has been taken into account in 7.101.2;<br/>
    i) IEC 62271-107:2019 and IEC IEEE 62271-37-013:2021 are also considered in 7.101.2;<br/>
    j) LSC category is more precisely described, including an explaining flowchart (Annex G);<br/>
    k) examples not covered by the IAC test are transferred from Clause 6 to 9.103;<br/>
    l) the term "assembly" is defined in Clause 3 and used as synonym for "solid-insulation enclosed switchgear and controlgear" in this document;<br/>
    m) "metallic" is replaced by "metal" where applicable;<br/>
    n) a 1 s rule was introduced for Criterion 4 during IAC tests regarding hot gases versus glowing particles as cause of ignition;<br/>
    o) internal arc tests for switchgear with protrusions are more precisely described in Annex A;<br/>
    p) partitions accessible in normal use are now PA, PB1 or PB2 instead of PI which has been removed (refer to 6.103.3)
- language: fr
  script: Latn
  content: |-
    L'IEC 62271-201:2026 s'applique aux ensembles d'appareillages préfabriqués sous enveloppe isolante solide conçus pour:<br/>
    – le courant alternatif;<br/>
    – des tensions assignées supérieures à 1 kV et inférieures ou égales à 52 kV;<br/>
    – des fréquences de service inférieures ou égales à 60 Hz;<br/>
    – être installés à l'intérieur;<br/>
    – les zones limitées au personnel autorisé.<br/>
    L'ensemble peut inclure des compartiments isolés dans l'air ou à remplissage de fluide, ou les deux.<br/>
    Pour les composants installés dans un appareillage sous enveloppe isolante solide, le présent document complète, voire remplace dans certains cas, les exigences indiquées dans les différentes normes de produit. La liste des composants qui peuvent se trouver à l'intérieur de l'appareillage sous enveloppe isolante solide n'est pas limitée à ceux explicitement cités dans le présent document. Cette troisième édition annule et remplace la deuxième édition parue en 2014. Cette édition constitue une révision technique.<br/>
    Cette édition inclut les modifications techniques majeures suivantes par rapport à l'édition précédente:<br/>
    a) alignement sur la troisième édition de l'IEC 62271-200 publiée en 2021 et sur son Amendement 1 publié en 2024 pour la structure, les définitions, les classifications, les caractéristiques assignées et les procédures d'essai, le cas échéant;<br/>
    b) alignement des numéros d'articles et de paragraphes sur l'IEC 62271-1:2017, y compris l'adoption des intitulés de paragraphes de l'Article 3;<br/>
    c) à l'Article 3, des termes et définitions spécifiques ont été ajoutés pour "en service", "condition normale de fonctionnement" et "utilisation normale";<br/>
    d) le circuit de mise à la terre est décrit de manière plus précise, y compris les caractéristiques assignées et les exigences d'essai;<br/>
    e) le nombre d'essais mécaniques sur les verrouillages a été réduit pour les essais de type;<br/>
    f) les forces à appliquer pendant les essais de type sont mieux spécifiées (voir le 7.102);<br/>
    g) un mesurage de résistance sur le circuit principal n'est nécessaire qu'avant des essais au courant permanent (comme référence pour des essais individuels de série) et n'est plus nécessaire après cet essai au courant permanent. Cette suppression est justifiée par le fait que la résistance ainsi mesurée ne constitue pas une donnée pertinente; comme l'essai d'échauffement vient de s'achever, un nouvel essai d'échauffement ne donnera pas de nouvelles informations;<br/>
    h) l'IEC 62271-100:2021 a été prise en compte dans le 7.101.2;<br/>
    i) l'IEC 62271-107:2019 et l'IEC IEEE 62271-37-013:2021 sont également prises en compte dans le 7.101.2;<br/>
    j) la catégorie LSC est décrite de manière plus précise, avec un logigramme explicatif (Annexe G);<br/>
    k) les exemples qui ne sont pas couverts par l'essai IAC ont été transférés de l'Article 6 au 9.103;<br/>
    l) le terme "ensemble" est défini à l'Article 3 et est utilisé comme synonyme d'"appareillage sous enveloppe isolante solide" dans le présent document;<br/>
    m) l'adjectif "métallique" a été remplacé par "en métal", le cas échéant;<br/>
    n) une règle de 1 s a été adoptée pour le Critère 4 pendant les essais IAC concernant les gaz chauds plutôt que les particules incandescentes comme cause d'inflammation;<br/>
    o) les essais d'arc interne pour un appareillage ayant des saillies sont décrits de manière plus précise à l'Annexe A;<br/>
    p) les cloisons accessibles en utilisation normale relèvent désormais de la catégorie PA, PB1 ou PB2, au lieu de la catégorie PI qui a été supprimée (voir le 6.103.3).
