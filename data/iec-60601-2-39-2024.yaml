abstract:
- language: en
  script: Latn
  content: |-
    IEC 60601-2-39:2024 applies to the BASIC SAFETY and ESSENTIAL PERFORMANCE of PERITONEAL DIALYSIS ME EQUIPMENT, hereafter referred to as PD EQUIPMENT. It applies to PD EQUIPMENT intended for use either by medical staff or under the supervision of medical experts, including PD EQUIPMENT operated by the PATIENT, regardless of whether the PD EQUIPMENT is used in a hospital or domestic environment.<br/>
    If a clause or subclause is specifically intended to be applicable to ME EQUIPMENT only, or to ME SYSTEMS only, the title and content of that clause or subclause will say so. If that is not the case, the clause or subclause applies both to ME EQUIPMENT and to ME SYSTEMS, as relevant.<br/>
    This document does not take into consideration specific safety details of the DIALYSING SOLUTION control system of PD EQUIPMENT using regeneration of DIALYSING SOLUTION or CENTRAL DELIVERY SYSTEMS for DIALYSING SOLUTION. It does, however, take into consideration the specific safety requirements of such PD EQUIPMENT concerning electrical safety and PATIENT safety.<br/>
    This document specifies the minimum safety requirements for PD EQUIPMENT. These PD EQUIPMENT are intended for use either by medical staff or for use by the PATIENT or other trained personnel under medical supervision.<br/>
    This document includes all ME EQUIPMENT that is intended to deliver a PERITONEAL DIALYSIS treatment to a PATIENT, independent of the treatment duration and location.<br/>
    These particular requirements do not apply to:<br/>
    – PRE-MANUFACTURED DIALYSING SOLUTION bags,<br/>
    – DIALYSING SOLUTION CIRCUITS,<br/>
    – DIALYSING SOLUTION CONCENTRATE,<br/>
    – DIALYSIS WATER supply systems (see ISO 23500-2) ,<br/>
    – CENTRAL DELIVERY SYSTEMS for DIALYSING SOLUTION CONCENTRATES, described as systems for bulk mixing concentrate at a dialysis facility,<br/>
    – equipment used to perform HAEMODIALYSIS (see IEC 60601-2-16).<br/>
    IEC 60601-2-39:2024 cancels and replaces the third edition published in 2018. This edition constitutes a technical revision.<br/>
    This edition includes the following significant technical changes with respect to the previous edition:<br/>
    a) update of references to IEC 60601-1:2005, IEC 60601-1:2005/AMD1:2012 and IEC 60601 1:2005/AMD2:2020, of references to IEC 60601 1 2:2014 and IEC 60601 1 2:2014/AMD1:2020, of references to IEC 60601-1-8:2006, IEC 60601 1 8:2006/AMD1:2012 and IEC 60601 1 8:2006/AMD2:2020, of references to IEC 60601 1 9:2007, IEC 60601 1 9:2007/AMD1:2013 and IEC 60601 1 9:2007/AMD2:2020, of references to IEC 60601 1 10:2007, IEC 60601 1 10:2007/AMD1:2013 and IEC 60601 1 10:2007/AMD2:2020 and of references to IEC 60601 1 11:2015 and IEC 60601 1 11:2015/AMD1:2020;<br/>
    b) consideration of ESSENTIAL PERFORMANCE in SINGLE FAULT CONDITION regarding IEC 60601 1:2005/AMD1:2012/ISH1:2021;<br/>
    c) including the information given in the document 62D/1771A/INF regarding 201.11.8;<br/>
    d) including the information given in the document 62D/1734/INF regarding technical issues of the previous edition;<br/>
    e) including SECURITY (CYBERSECURITY) requirements;<br/>
    f) additions related to online PD SOLUTION generation (ONLINE PD);<br/>
    g) improvements regarding the definition of the APPLIED PART;<br/>
    h) improvement of the essential performance requirements clause/subclauses;<br/>
    i) improvements for labelling;<br/>
    j) other minor technical improvements;<br/>
    k) editorial improvements.
- language: fr
  script: Latn
  content: |-
    L'IEC 60601-2-39:2024 s’applique à la SECURITE DE BASE et aux PERFORMANCES ESSENTIELLES des APPAREILS EM DE DIALYSE PERITONEALE, désignés ci-après sous le terme d’APPAREILS DP. Elle s’applique aux APPAREILS DP destinés à être utilisés soit par le personnel médical soit sous la surveillance d’experts médicaux, y compris les APPAREILS DP mis en fonctionnement par le PATIENT, que les APPAREILS DP soient utilisés dans un hôpital ou dans un environnement domestique.<br/>
    Si un article ou un paragraphe est spécifiquement destiné à être applicable uniquement aux APPAREILS EM ou uniquement aux SYSTEMES EM, le titre et le contenu de cet article ou de ce paragraphe l’indiquent. Si cela n’est pas le cas, l’article ou le paragraphe s’applique à la fois aux APPAREILS EM et aux SYSTEMES EM, selon le cas.<br/>
    Le présent document ne prend pas en considération les informations spécifiques de sécurité du système de contrôle de la SOLUTION DE DIALYSE des APPAREILS DP qui utilise la régénération de la SOLUTION DE DIALYSE ou des SYSTEMES DE TRANSMISSION CENTRALISES pour la SOLUTION DE DIALYSE. Il prend cependant en considération les exigences spécifiques de sécurité de ces APPAREILS DP relatives à la sécurité électrique et la sécurité du PATIENT.<br/>
    Le présent document spécifie les exigences minimales de sécurité des APPAREILS DP. Les APPAREILS DP sont destinés à être utilisés par le personnel médical ou le PATIENT ou tout personnel formé et sous surveillance médicale.<br/>
    Le présent document s’applique à tous les APPAREILS EM destinés à fournir un traitement par DIALYSE PERITONEALE au PATIENT, indépendamment de la durée et du lieu de traitement.<br/>
    Ces exigences particulières ne s’appliquent pas:<br/>
    – aux SACS POUR SOLUTION DE DIALYSE préproduite,<br/>
    – aux CIRCUITS DE LA SOLUTION DE DIALYSE,<br/>
    – au CONCENTRE DE SOLUTION DE DIALYSE,<br/>
    – aux systèmes d’alimentation en EAU DE DIALYSE (voir l’ISO 23500-2 [1]) ,<br/>
    – aux SYSTEMES DE TRANSMISSION CENTRALISES pour CONCENTRES DE SOLUTION DE DIALYSE, décrits comme des systèmes de mélange en vrac de concentrés dans un centre de dialyse,<br/>
    – aux appareils utilisés pour l’HEMODIALYSE (voir l’IEC 60601-2-16 [2]).<br/>
    L'IEC 60601-2-39:2024 annule et remplace la troisième édition parue en 2018. Cette édition constitue une révision technique.<br/>
    Cette édition inclut les modifications techniques majeures suivantes par rapport à l’édition précédente:<br/>
    a) mise à jour des références à l’IEC 60601-1:2005, l’IEC 60601-1:2005/AMD1:2012 et l’IEC 60601 1:2005/AMD2:2020, des références à l’IEC 60601 1 2:2014 et l’IEC 60601 1 2:2014/AMD1:2020, des références à l’IEC 60601-1-8:2006, l’IEC 60601 1 8:2006/AMD1:2012 et l’IEC 60601 1 8:2006/AMD2:2020,des références à l’IEC 60601 1 9:2007, l’IEC 60601 1 9:2007/AMD1:2013 et l’IEC 60601 1 9:2007/AMD2:2020, des références à l’IEC 60601 1 10:2007, l’IEC 60601 1 10:2007/AMD1:2013 et l’IEC 60601 1 10:2007/AMD2:2020 et des références à l’IEC 60601 1 11:2015 et l’IEC 60601 1 11:2015/AMD1:2020;<br/>
    b) prise en considération des PERFORMANCES ESSENTIELLES en CONDITION DE PREMIER DEFAUT concernant l’IEC 60601 1:2005/AMD1:2012/ISH1:2021;<br/>
    c) inclusion des informations données dans le document 62D/1771A/INF concernant le 201.11.8;<br/>
    d) inclusion des informations données dans le document 62D/1734/INF concernant les questions techniques de l’édition précédente;<br/>
    e) inclusion des exigences de SECURITE (CYBERSECURITE);<br/>
    f) ajouts liés à la préparation en ligne de la SOLUTION DP (DP EN LIGNE);<br/>
    g) améliorations apportées à la définition de la PARTIE APPLIQUEE;<br/>
    h) amélioration des articles/paragraphes traitant des exigences relatives aux performances essentielles;<br/>
    i) améliorations en matière d’étiquetage;<br/>
    j) autres améliorations techniques mineures;<br/>
    k) améliorations d’ordre rédactionnel.
