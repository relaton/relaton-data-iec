abstract:
- language: en
  script: Latn
  content: |-
    <p class="MsoBodyText" style="mso-layout-grid-align: none; text-autospace: none;">The concept of this document considers the FNQoS related to the FNProxy based in ISO/IEC TR 29181-8.</p>
    <p class="MsoBodyText" style="mso-layout-grid-align: none; text-autospace: none;">The protocol mechanism given in this document supports both the interaction between two FNProxies of a basic FNQoS system (BFS) and the interaction among multiple FNProxies in a synthetic FNQoS system (SFS).</p>
