abstract:
- language: en
  script: Latn
  content: |-
    IEC 60079-10-2 is concerned with the identification and classification of areas where explosive dust atmospheres and combustible dust layers are present in order to permit the proper assessment of ignition sources in such areas. In this document, explosive dust atmospheres and combustible dust layers are treated separately. In Clause 4, area classification for explosive dust clouds is described, with dust layers acting as one of the possible sources of release. In Clause 7, other general considerations for dust layers are described. The examples in this document are based on a system of effective housekeeping being implemented in the plant to prevent dust layers from accumulating. Where effective housekeeping is not present, the area classification includes the possible formation of explosive dust clouds from dust layers. The principles of this document can also be followed when combustible fibres or flyings might cause a hazard.<br/>
    Atmospheric conditions include variations in pressure and temperature above and below reference levels of 101,3 kPa (1 013 mbar) and 20 °C (293 K), provided that the variations have a negligible effect on the explosive properties of the combustible material. For air with normal oxygen content, typically a volume fraction of 21 % is assumed.<br/>
    It does not apply to:<br/>
    a) underground mining areas;<br/>
    b) dusts of explosives that do not require atmospheric oxygen for combustion such as pyrophoric substances, propellants, pyrotechnics, munitions, peroxides, oxidizers, water‑reactive elements or compounds, or other similar materials;<br/>
    c) catastrophic failures or rare malfunctions which are outside the conditions dealt with in this document;<br/>
    d) rooms used for medical purposes;<br/>
    e) domestic premises;<br/>
    f) where a hazard is due to the presence of flammable gas or vapour, but the principles can be used in the assessment of a hybrid mixture (see also IEC 60079-10-1).<br/>
    This document does not consider the effects of consequential damage following a fire or an explosion. Please refer to the foreword of the document for a detailed listing of the significant technical changes from the previous edition.
- language: fr
  script: Latn
  content: |-
    <p>L’IEC 60079-10-2:2026 traite de l’identification et de la classification des emplacements où des atmosphères explosives poussiéreuses et des couches de poussières combustibles sont présentes afin de permettre une évaluation appropriée des sources d’inflammation à utiliser dans de tels emplacements. Dans le présent document, les atmosphères explosives poussiéreuses et les couches de poussières combustibles sont traitées séparément. La classification des emplacements de nuages de poussières explosives où les couches de poussière agissent comme l’une des sources possibles de dégagement est décrit dans l’Article 4. Une description des autres considérations d’ordre général relatives aux couches de poussière est présentée dans l’Article 7. Les exemples donnés dans le présent document sont basés sur un système d’entretien efficace à mettre en œuvre dans les locaux afin d’empêcher la formation de couches de poussière par accumulation. En l’absence d’entretien efficace, la classification des emplacements prend en compte la formation possible de nuages de poussières explosives à partir des couches de poussière. Les principes du présent document peuvent également être suivis lorsque des fibres ou particules volatiles et combustibles sont une source de danger. Les conditions atmosphériques incluent les variations de pression et de température au-dessus et au-dessous des niveaux de référence de 101,3 kPa (1 013 mbar) et 20 °C (293 K) à condition que les variations aient un effet négligeable sur les propriétés explosives de la matière combustible. Pour l’air présentant une teneur normale en oxygène, un titre volumique de 21 % est généralement présumé.<br/>
    Elle ne s’applique pas:<br/>
    a) aux parties souterraines des mines;<br/>
    b) aux poussières d’explosifs dont les substances pyrophoriques de combustion telles que les gaz de propulsion, les artifices, les munitions, les peroxydes d’hydrogène, les oxydants, les éléments ou composés qui réagissent avec l’eau, ou autres matières similaires, n’exigent pas l’oxygène atmosphérique;<br/>
    c) aux défaillances catastrophiques ou aux dysfonctionnements rares, qui dépassent les conditions indiquées dans le présent document;<br/>
    d) aux salles utilisées à des fins médicales;<br/>
    e) locaux à usage domestique;<br/>
    f) aux emplacements où un danger est dû à la présence de gaz ou de vapeurs inflammables, mais les principes peuvent être utilisés pour l’évaluation d’un mélange hybride (voir également l’IEC 60079-10-1).<br/>
    Le présent document ne tient pas compte des effets des dommages causés par un feu ou une explosion. S'il vous plaît se référer à la avant-propos du document pour obtenir une liste détaillée des modifications techniques majeures par rapport à l'édition précédente.</p>
