abstract:
- content: "IEC 63058:2026 is to describe product classes and properties, representing
    the miniature circuit-breaker (MCB), to become a part of the IEC 61360-4: IEC
    Common Data Dictionary (IEC CDD). It includes data required for product selection
    as well as data required for engineering.<br />\r\nThis document intends, as a
    contribution to the IEC Common Data Dictionary, to be used by catalogue consortia,
    other database standards and software as a data reference for circuit‑breakers
    and similar equipment for household use."
  language:
  - en
  script:
  - Latn
  format: text/html
- content: "L'IEC 63058:2026 a pour objet de décrire des classes de produits et des
    propriétés représentant les disjoncteurs miniatures (MCB, Miniature Circuit-Breaker)
    qui font partie intégrante de l'IEC 61360-4: Dictionnaire de données commun de
    l'IEC (IEC CDD). Il comprend les données exigées pour le choix des produits ainsi
    que les données exigées pour l'ingénierie.<br />\r\nLe présent document a pour
    but, à titre de contribution au Dictionnaire de données commun de l'IEC, d'être
    utilisé par des catalogues de consortiums, d'autres normes de bases de données
    et des logiciels comme référence de données pour les disjoncteurs et les appareillages
    similaires pour usage domestique."
