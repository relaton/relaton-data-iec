abstract:
- language: en
  script: Latn
  content: |-
    IEC 60695-6-1:2005 Gives guidance on:<br/>
    a) optical measurement of smoke obscuration;<br/>
    b) general aspects of optical smoke test methods;<br/>
    c) consideration of test methods;<br/>
    d) expression of smoke test data;<br/>
    e) relevance of optical smoke data to hazard assessment.<br/>
    The main changes with respect to the previous edition are listed below:<br/>
    - Modified title.<br/>
    - Updated normative references.<br/>
    - Expanded terms and definitions.<br/>
    - Numerous editorial changes of a technical nature throughout the publication.<br/>
    - A flowchart has been added for the evaluation and consideration of smoke test methods.
- language: fr
  script: Latn
  content: |-
    IEC 60695-6-1:2005 Fournit des lignes directrices sur:<br/>
    a) la mesure optique de l'obscurcissement par la fumée;<br/>
    b) les aspects généraux des méthodes d'essais optiques de la fumée;<br/>
    c) des considérations concernant les méthodes d'essais;<br/>
    d) l'expression des résultats d'essais;<br/>
    e) la pertinence des résultats des mesures optiques de la fumée pour l'évaluation des risques.<br/>
    Les principales modifications par rapport à l'édition antérieure sont indiquées ci-dessous:<br/>
    - Titre modifié.<br/>
    - Mise à jour des références normatives.<br/>
    - Ajout de termes et de définitions.<br/>
    - Nombreuses modifications rédactionnelles de nature technique dans toute la publication.<br/>
    - Ajout d'un logigramme pour l'évaluation et la considération des méthodes d'essais de fumée.
