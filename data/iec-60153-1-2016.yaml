abstract:
- language: en
  script: Latn
  content: |-
    IEC 60153-1:2016 specifies straight hollow metallic tubing for use as waveguides in electronic equipment. It covers:<br/>
    a) the details necessary to ensure compatibility and, as far as essential, interchangeability;<br/>
    b) test methods;<br/>
    c) uniform requirements for the electrical and mechanical properties.<br/>
    It should be noted that no recommendations are made for the materials to be used for waveguides. The choice of material is agreed between customer and manufacturer. This edition includes the following significant technical changes with respect to the previous edition:<br/>
    a) expand the operation frequency range;<br/>
    b) revise the equation of attenuation.<br/>
    <br/>
    This publication is to be read in conjunction with IEC 60154 series .
- language: fr
  script: Latn
  content: |-
    L'IEC 60153-1:2016 spécifie des tubes métalliques creux droits destinés à être utilisés comme guides d'ondes dans les équipements électroniques. Elle couvre:<br/>
    a) les détails nécessaires pour assurer la compatibilité et, dès lors que c'est essentiel, l'interchangeabilité;<br/>
    b) les méthodes d essai;<br/>
    c) les exigences uniformes pour les propriétés électriques et mécaniques.<br/>
    Il convient de noter qu'aucune recommandation n'est faite en ce qui concerne les matériaux à utiliser pour les guides d'ondes. Le choix des matériaux fait l'objet d'un accord entre le client et le fabricant. Cette édition inclut les modifications techniques majeures suivantes par rapport à l'édition précédente:<br/>
    a) extension de la plage de fréquences de fonctionnement;<br/>
    b) révision des équations d'affaiblissement.<br/>
    <br/>
    Cette publication doit être lue conjointement avec la série IEC 60154 .
