abstract:
- content: "IEC 61000-6-3:2026 RLV contains both the official IEC International Standard
    and its Redline version. The Redline version is available in English only and
    provides you with a quick and easy way to compare all the changes between the
    official IEC Standard and its previous edition.<br /><br />\r\nIEC 61000-6-3:2026
    is applicable only if no relevant dedicated product or product family EMC emission
    standard has been published. This part of IEC 61000 for emission requirements
    applies to electrical and electronic equipment intended for use at residential
    (see 3.1.21) locations. This part of IEC 61000 also applies to electrical and
    electronic equipment intended for use at other locations that do not fall within
    the scope of IEC 61000-6-8 or IEC 61000-6-4. The intention is that all equipment
    used in the residential, commercial and light-industrial locations are covered
    by IEC 61000-6-3 or IEC 61000-6-8. If there is any doubt the requirements in IEC
    61000-6-3 apply. Equipment that has a radio function (3.1.20) are included in
    the scope of this document. However, the emission requirements in this document
    are not intended to be applicable to the intentional transmissions from these
    radio transmitters, their harmonics and their out of band emissions. Not all disturbance
    phenomena have been included for testing purposes but only those considered relevant
    for the equipment intended to operate within the locations included within this
    document.<br />\r\nThe objectives of this document are:<br />\r\n- to establish
    requirements that provide an adequate level of protection of radio reception in
    the frequency range 9 kHz to 400 GHz;<br />\r\n- to establish requirements that
    provide an adequate level of protection against conducted and radiated electromagnetic
    disturbances emitted by equipment in the scope of this document;<br />\r\n- to
    support the reproducibility of measurement and the repeatability of results.<br
    />\r\nNOTE 1 In special cases, situations will arise where the levels specified
    in this document will not offer adequate protection; for example, where a sensitive
    receiver is used in close proximity to an equipment. In these instances, special
    mitigation measures can be employed.<br />\r\nNOTE 2 Disturbances generated in
    fault conditions of equipment are not covered by this document.<br />\r\nNOTE
    3 The requirements in this document are more stringent or equivalent to the requirements
    specified in IEC 61000-6-4 and IEC 61000-6-8.<br />\r\nThis fourth edition cancels
    and replaces the third edition published in 2020. This edition constitutes a technical
    revision. This edition includes the following significant technical changes with
    respect to the previous edition:<br />\r\na) the addition of magnetic field emission
    requirements, including the measurement of WPT function;<br />\r\nb) the extension
    of low-voltage AC mains power requirements to cover the range 9 kHz to 150 kHz;<br
    />\r\nc) products with a radio function have been added to the scope;<br />\r\nd)
    limits in a FAR for rack mounted equipment have been added."
