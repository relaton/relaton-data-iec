abstract:
- language: en
  script: Latn
  content: |-
    <p>This document specifies the structure of ISO/IEC 11179-3:2013 representation in W3C XML Schema suitable for communication of content between compliant registries. The schema described in this document will implement a class and attribute vocabulary that matches the conceptual model presented in ISO/IEC 11179-3:2013 in W3C XML Schema format. The purpose of the schema is for the exchange of compliant metadata, and to support the validation of messages exchanged between registries. It is not intended for the communication of data element metadata alongside the data to which the metadata refers.</p>
    <p>The document specifes the schema and the principles and conventions that were followed to map classes, attributes, and associations of the conceptual model into an acyclic, directed graph suitable for an unambiguous document-based representation.</p>
