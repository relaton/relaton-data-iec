abstract:
- language: en
  script: Latn
  content: |-
    IEC 60969:2016 specifies performance requirements together with test methods and conditions required to show compliance of self-ballasted compact fluorescent lamps intended for general lighting services. This second edition cancels and replaces the first edition published in 1988, Amendment 1:1991 and Amendment 2:2000. This edition constitutes a technical revision. This edition includes the following significant technical changes with respect to the previous edition:<br/>
    a) title change;<br/>
    b) scope is now limited to compact fluorescent lamps, but expanded to cover all lamps of voltages greater than 50 V and all power ratings;<br/>
    c) introduction of requirements for lamp equivalency claims, switching withstand, starting time;<br/>
    d) low temperature, run up time, treatment of claims for different operating conditions;<br/>
    e) enhanced assessment and compliance criteria especially for lifetime;<br/>
    f) introduction in-rush test conditions and displacement factor.<br/>
    The contents of the corrigendum of January 2017 have been included in this copy.
- language: fr
  script: Latn
  content: |-
    L'IEC 60969:2016 spécifie les exigences de performances, les méthodes d'essais et les conditions exigées pour démontrer la conformité des lampes à fluorescence compactes à ballast intégré destinées à l'éclairage général. Cette deuxième édition annule et remplace la première édition parue en 1988, l'Amendement 1:1991 et l'Amendement 2:2000. Cette édition constitue une révision technique. Cette édition inclut les modifications techniques majeures suivantes par rapport à l'édition précédente:<br/>
    a) modification du titre;<br/>
    b) le domaine d'application se limite désormais aux lampes à fluorescence compactes, mais a été élargi pour couvrir toutes les lampes présentant des tensions supérieures à 50 V et toutes les puissances;<br/>
    c) ajout d'exigences pour les déclarations d'équivalence de lampe, la résistance aux cycles de commutation, le temps d'amorçage, la basse température, le temps de stabilisation, le traitement des déclarations concernant des conditions de fonctionnement différentes;<br/>
    d) amélioration des critères d'évaluation et de conformité, en particulier concernant la durée de vie;<br/>
    e) ajout de conditions d'essais de courant d'appel et facteur de déphasage.<br/>
    Le contenu du corrigendum de janvier 2017 a été pris en considération dans cet exemplaire.
