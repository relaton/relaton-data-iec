abstract:
- language: en
  script: Latn
  content: |-
    IEC 62341-5-3:2019 specifies the standard measuring methods for determining the image sticking and lifetime of organic light emitting diode (OLED) display panels and modules, except finalized display products for end customers, such as TV sets, monitor sets and mobile phones. The measuring method for the lifetime mainly applies to modules.<br/>
    This edition includes the following significant technical changes with respect to the previous edition:<br/>
    a) the measurement vehicle for lifetime is only for the module;<br/>
    b) the measurement method for monitor or TV devices is modified;<br/>
    c) the digital signage display is included as an example of OLED devices;<br/>
    d) the measurement method with HDR (high dynamic range) for image sticking is added;<br/>
    e) the analysis method with CIEDE 2000 is added for image sticking;<br/>
    f) the information method for evaluating image sticking is modified.
