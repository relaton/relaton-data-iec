abstract:
- language: en
  script: Latn
  content: |-
    CORRECTED VERSION 2026-08<br/>
    <br/>
    IEC 62127-1:2022 RLV contains both the official IEC International Standard and its Redline version. The Redline version is available in English only and provides you with a quick and easy way to compare all the changes between the official IEC Standard and its previous edition.<br/>
    <br/>
    IEC 62127-1:2022 specifies methods of use of calibrated hydrophones for the measurement in liquids of acoustic fields generated by ultrasonic medical equipment including bandwidth criteria and calibration frequency range requirements in dependence on the spectral content of the fields to be characterized.<br/>
    This document:<br/>
    - defines a group of acoustic parameters that can be measured on a physically sound basis;<br/>
    - defines a second group of parameters that can be derived under certain assumptions from these measurements, and called derived intensity parameters;<br/>
    - defines a measurement procedure that can be used for the determination of acoustic pressure parameters;<br/>
    - defines the conditions under which the measurements of acoustic parameters can be made using calibrated hydrophones;<br/>
    - defines procedures for correcting for limitations caused by the use of hydrophones with finite bandwidth and finite active element size, and for estimating the corresponding uncertainties.<br/>
    IEC 62127-1:2022 cancels and replaces the first edition published in 2007 and Amendment 1:2013. This edition constitutes a technical revision.<br/>
    This edition includes the following significant technical changes with respect to the previous edition.<br/>
    a) The upper frequency limit of 40 MHz has been removed.<br/>
    b) Hydrophone sensitivity definitions have been changed to recognize sensitivities as complex-valued quantities.<br/>
    c) Procedures and requirements for narrow-band approximation and broadband measurements have been modified; details on waveform deconvolution have been added.<br/>
    d) Procedures for spatial averaging correction have been amended.<br/>
    e) Annex D, Annex E and bibliography have been updated to support the changes of the normative parts.<br/>
    The contents of the Interpretation sheet 1 (2026-08) have been included in this copy.
