abstract:
- language: en
  script: Latn
  content: |-
    <p>The primary purpose of the ISO/IEC 19763 series is to specify a metamodel framework for interoperability. This document specifies a metamodel for registering administrative and evolution information of models of services, facilitating interoperability through the reuse of services.</p>
    <p>This document is only applicable to web services whose capabilities are described by some web service description language (see Annex A for examples of such languages). Figure 1 shows the scope of this document.</p>
