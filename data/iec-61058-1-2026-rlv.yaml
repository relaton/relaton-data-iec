abstract:
- language: en
  script: Latn
  content: |-
    IEC 61058-1:2026 RLV contains both the official IEC International Standard and its Redline version. The Redline version is available in English only and provides you with a quick and easy way to compare all the changes between the official IEC Standard and its previous edition.<br/>
    <br/>
    IEC 61058-1:2026 applies to switches or switching devices for appliances. The switches are intended to control electrical appliances and other equipment for household or similar purposes with a rated voltage not exceeding 600 V and a rated current not exceeding 63 A. This fifth edition cancels and replaces the fourth edition published in 2016. This edition constitutes a technical revision.<br/>
    This edition includes the following significant technical changes with respect to the previous edition:<br/>
    a) Extension to 600 V in the scope;<br/>
    b) Add requirements on ground-fuse (Clause 17);<br/>
    c) DC arc extinction test (Annex P and Clause 17);<br/>
    d) Table 5 re-arranged to line-up with classifications;<br/>
    e) Table 6 correction due to inhomogeneous values;<br/>
    f) Deletion of X3 capacitors in classification and in Table 19.
