abstract:
- language: en
  script: Latn
  content: |-
    IEC 61298-2:2026 specifies general methods and procedures for conducting tests and reporting on the functional and performance characteristics of process instrumentation except process measurement transmitters (PMT) which are standardized by IEC 62828 series. The tests are applicable to any such devices characterized by their own specific input and output variables, and by the specific relationship (transfer function) between the inputs and outputs and include analogue and digital devices. For devices that require special tests, this standard can be used, together with any product specific standard specifying special tests. This document covers tests made under reference conditions.<br/>
    This third edition cancels and replaces the second edition published in 2008. This edition constitutes a technical revision.<br/>
    This edition includes the following significant technical changes with respect to the previous edition:<br/>
    a) Process measurement transmitters (PMT) have been removed from the scope of this standard
- language: fr
  script: Latn
  content: |-
    L'IEC 61298-2:2026 spécifie les méthodes et procédures générales pour la conduite des essais et la production de rapports sur les caractéristiques fonctionnelles et de performance des instruments de processus à l’exception des émetteurs de mesure de processus (PMT) qui sont normalisés par la série IEC 62828. Ces essais sont applicables à tout dispositif à condition que ce dispositif soit caractérisé par ses propres variables d’entrée et de sortie et par la relation spécifique (fonction de transfert) entre les entrées et les sorties. Ils concernent les dispositifs analogiques et numériques. Pour les dispositifs qui exigent des essais spéciaux, la présente norme peut être utilisée en conjonction avec la norme particulière de produit spécifiant ces essais spéciaux. Le présent document couvre les essais effectués dans les conditions de référence.<br/>
    Cette troisième édition annule et remplace la deuxième édition parue en 2008. Cette édition constitue une révision technique.<br/>
    Cette édition inclut les modifications techniques significatives suivantes par rapport à l'édition précédente:<br/>
    a) Les émetteurs de mesure de processus (PMT, process measurement transmitters) ont été retirés du domaine d'application de la présente norme.
