abstract:
- language: en
  script: Latn
  content: |-
    IEC 60747-8:2010 gives standards for the following categories of field-effect transistors:<br/>
    - type A: junction-gate type;<br/>
    - type B: insulated-gate depletion (normally on) type;<br/>
    - type C: insulated-gate enhancement (normally off) type.<br/>
    The main changes with respect to the previous edition are listed below.<br/>
    a) "Clause 3 Classification" was moved and added to Clause 1.<br/>
    b) "Clause 4 Terminology and letter symbols" was divided into "Clause 3 Terms and definitions" and "Clause 4 Letter symbols" was amended with additions and deletions.<br/>
    c) Clause 5, 6 and 7 were amended with necessary additions and deletions.<br/>
    <br/>
    This publication is to be read in conjunction with IEC 60747-1:2006.
- language: fr
  script: Latn
  content: |-
    La CEI 60747-8:2010 donne les normes pour les catégories suivantes de transistors à effets de champ:<br/>
    - type A: type à jonction de grille;<br/>
    - type B: type à grille isolée à déplétion (appauvrissement) (normalement à l'état passant);<br/>
    - type C: type à grille isolée à enrichissement (normalement à l'état bloqué).<br/>
    Les principaux changements par rapport à l'édition précédente sont énumérés ci-dessous.<br/>
    a) L'Article 3 "Classification" a été déplacé et ajouté à l'Article 1.<br/>
    b) L'Article 4 "Terminologie et symboles littéraux" a été divisé en Article 3 "Termes et définitions" et Article 4 "Symboles littéraux", ce dernier a été amendé avec des additions et des suppressions.<br/>
    c) Les Articles 5, 6 et 7 ont été amendés avec les nécessaires additions et suppressions.<br/>
    <br/>
    Cette publication doit être lue conjointement avec la CEI 60747-1:2006.
