abstract:
- language: en
  script: Latn
  content: |-
    IEC 60335-2-14:2025 EXV contains both the international standard and its extended version (EXV). This extended version of the official IEC Standard is available in English only and provides the user with a comprehensive content of the Standard. IEC 60335-2-14:2025 EXV includes the content of the references made to IEC 60335-1:2020.<br/>
    <br/>
    IEC 60335-2-14:2025 deals with the safety of electric kitchen machines for household and similar purposes, their rated voltage being not more than 250 V including direct current (DC) supplied appliances and battery-operated appliances.<br/>
    Examples of appliances that are within the scope of this standard are<br/>
    – bean slicers;<br/>
    – auger juicers;<br/>
    – blenders;<br/>
    – can openers;<br/>
    – centrifugal juicers;<br/>
    – churns;<br/>
    – citrus-fruit squeezers;<br/>
    – coffee mills not exceeding a hopper rated capacity of 500 g;<br/>
    – cream whippers;<br/>
    – egg beaters;<br/>
    – food mixers;<br/>
    – food processors;<br/>
    – grain grinders not exceeding a hopper rated capacity of 3 l;<br/>
    – graters;<br/>
    – ice-cream machines, including those for use in refrigerators and freezers;<br/>
    – knife sharpeners;<br/>
    – knives;<br/>
    – mincers;<br/>
    – noodle makers;<br/>
    – peelers;<br/>
    – shredders;<br/>
    – sieving machines;<br/>
    – slicing machines.<br/>
    Appliances intended for normal household and similar use and that can also be used by laypersons in shops, in light industry, bed and breakfast and on farms, are within the scope of this standard. However, if the appliance is intended to be used professionally to process food for commercial consumption, the appliance is not considered to be for household and similar use only.<br/>
    As far as is practicable, this standard deals with the common hazards presented by appliances which are encountered by all persons in and around the home. However, in general, it does not take into account<br/>
    – persons (including children) whose physical, sensory or mental capabilities; or lack of experience and knowledge prevents them from using the appliance safely without supervision or instruction;<br/>
    – children playing with the appliance.<br/>
    It does not take into account the use of the following appliances by children:<br/>
    – bean slicers;<br/>
    – blenders including hand-held blenders;<br/>
    – juicers other than citrus-fruit squeezers;<br/>
    – food mixers;<br/>
    – food processors;<br/>
    – knives;<br/>
    – mincers;<br/>
    – noodle makers;<br/>
    – lathe-type or hand-held peelers;<br/>
    – vegetable graters/shredders;<br/>
    – slicing machines.<br/>
    Attention is drawn to the fact that<br/>
    – for appliances intended to be used in vehicles or on board ships or aircraft, additional requirements can be necessary;<br/>
    – in many countries, additional requirements are specified by the national health authorities, the national authorities responsible for the protection of labour and similar authorities.<br/>
    This standard does not apply to<br/>
    – slicing machines having a circular knife the blade of which is inclined at an angle exceeding 45° to the vertical;<br/>
    – breadmakers (IEC 60335 2 9);<br/>
    – soy milk makers (IEC 60335 2 15);<br/>
    – food waste disposers (IEC 60335 2 16);<br/>
    – ice-cream appliances with incorporated motor compressors (IEC 60335-2 24);<br/>
    – kitchen machines intended for commercial purposes (IEC 60335 2 64);<br/>
    – kitchen machines intended for industrial purposes;<br/>
    – kitchen machines intended to be used in locations where special conditions prevail, such as the presence of a corrosive or explosive atmosphere (dust, vapour or gas).<br/>
    This seventh edition cancels and replaces the sixth edition published in 2016 and Amendment 1:2019. This edition constitutes a technical revision.<br/>
    This edition includes the following significant technical changes with respect to the previous edition:<br/>
    a) alignment with IEC 60335-1:2020;<br/>
    b) conversion of some notes to normative text (Clause 1, 3.1.9.111, 3.1.9.112, 3.1.9.114, 3.1.9.115, 11.7.3, 20.2, 20.107, 20.108);<br/>
    c) modification to replace berry juice extractor with auger juicer and addition of a defined term (Clause 1, 3.1.9.101, 3.5.107, 11.7.102, 19.1, 19.7);<br/>
    d) addition of requirements for appliances not intended for use by children (Clause 1, 7.12, 20.2, 20.106, 20.117);<br/>
    e) modifications to clarify the testing under normal operating conditions (3.1.9, 3.1.9.111, 5.9, 7.12, 10.1, 11.5, 11.6, 11.7, 11.7.1 to 11.7.3, 11.7.101 to 11.7.118);<br/>
    f) addition of surface temperatures for external accessible surfaces (11.3, 11.8);<br/>
    g) modification of the spillage test of 15.2 to address leakage from the liquid container;<br/>
    h) clarification of requirements for remote operation of kitchen machines (11.7, 19.7, 22.40, 22.49, 22.51);<br/>
    i) modification of the operating period for juicers with respect to the 0,5 kg carrot load and the operating time (11.7.105);<br/>
    j) clarification of overfill testing with detachable gaskets and addition of gasket leakage test (15.2, 15.102);<br/>
    k) clarification of the feed opening dimension limits in 20.2;<br/>
    l) addition of requirements when compliance with the standard relies on an electronic circuit for the interlock function (20.2, 20.104, 20.108, 20.113);<br/>
    m) addition of test probe 18 where test probe B is applied and clarification of forces applied to test probes (20.2, 20.104, 20.106, 20.108, 20.113, 20.114, 20.117);<br/>
    n) update and combine requirements for inadvertent operation of hand-held blenders and knives to cover alternative switch constructions on the market (20.103 and deletion of previous 20.115);<br/>
    o) clarification of the test of 20.104;<br/>
    p) update of interlock requirements to be applicable for all appliances where the interlock is required for compliance with the standard (20.113, 20.114);<br/>
    q) update of the detergent used for centrifugal juicer conditioning (Annex AA).<br/>
    This part 2 is to be used in conjunction with the latest edition of IEC 60335-1 and its amendments unless that edition precludes it; in that case, the latest edition that does not preclude it is used. It was established on the basis of the sixth edition (2020) of that standard.
