abstract:
- language: en
  script: Latn
  content: IEC 63522-41:2026 provides guidelines for the insulation coordination of
    electromechanical elementary, solid state, time, forcibility guided and reed relays
    as well reed contacts and hybrid switching solutions. This document can also be
    used for similar devices when specified in a detail specification.
- language: fr
  script: Latn
  content: IEC 63522-41:2026 La présente partie fournit des lignes directrices pour
    la coordination de l'isolement des relais électromécaniques élémentaires, des
    relais statiques, des relais temporisés, des relais à contacts guidés et des relais
    à lames souples, ainsi que des contacts à lames souples et des solutions de commutation
    hybrides. Le présent document peut également être utilisé pour des dispositifs
    analogues lorsque cela est indiqué dans une spécification particulière.
