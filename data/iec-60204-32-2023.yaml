abstract:
- language: en
  script: Latn
  content: |-
    IEC 60204-32:2023 applies to electrical, electronic, programmable electronic equipment and systems to hoisting machines and related equipment, including a group of hoisting machines working together in a co-ordinated manner. The equipment covered by this document commences at the point of connection of the supply to the electrical equipment of the hoisting machine (crane-supply-switch) and includes systems for power supply and control feeders situated outside of the hoisting machine, for example, flexible cables or conductor wires or conductor bars. This document is applicable to equipment or parts of equipment not exceeding 1 000 V AC or 1 500 V DC between lines and with nominal frequencies not exceeding 200 Hz. This document does not cover all the requirements (for example guarding, interlocking, or control) that are needed or required by other standards or regulations in order to protect persons from hazards other than electrical hazards. Each type of hoisting machine has unique requirements to be accommodated to provide adequate safety. This document does not cover noise risks. Additional and special requirements can apply to the electrical equipment of hoisting machines including those that<br/>
    – handle or transport potentially explosive material (e.g. paint or sawdust);<br/>
    – are intended for use in potentially explosive and/or flammable atmospheres;<br/>
    – have special risks when transporting or moving certain materials;<br/>
    – are intended for use in mines.<br/>
    For the purposes of this document, hoisting machines include cranes of all types, winches of all types and storage and retrieval machines. The following product groups are included:<br/>
    – overhead travelling cranes;<br/>
    – mobile cranes;<br/>
    – tower cranes;<br/>
    – slewing luffing cranes;<br/>
    – gantry cranes;<br/>
    – offshore cranes;<br/>
    – floating cranes;<br/>
    – winches of all types;<br/>
    – hoists and accessories;<br/>
    – loader cranes;<br/>
    – cable cranes;<br/>
    – load holding devices;<br/>
    – storage and retrieval machines;<br/>
    – monorail hoists;<br/>
    – straddle carriers;<br/>
    – rubber tyred gantry cranes (RTGs).<br/>
    This document does not cover individual items of electrical equipment other than their selection for use and their erection.<br/>
    IEC 60204-32:2023 cancels and replaces the second edition published in 2008. This edition constitutes a technical revision.<br/>
    This edition includes the following significant technical changes with respect to the previous edition:<br/>
    a) alignment to the IEC 60204-1 sixth edition (2016) especially for:<br/>
    – requirements for earthing and bonding;<br/>
    – requirements for circuit protection;<br/>
    – consideration of use of Power Drive Systems;<br/>
    – protective bonding requirements and terminology;<br/>
    – requirements pertaining to safe torque off for PDS, emergency stop, and control circuit protection;<br/>
    – symbols for actuators of control devices;<br/>
    b) reference for high voltage electrical equipment;<br/>
    c) cableless control system requirements;<br/>
    d) EMC requirements;<br/>
    e) technical documentation requirements;<br/>
    f) general updating to current special national conditions, normative standards, and bibliographical references.
- language: fr
  script: Latn
  content: |-
    L'IEC 60204-32:2023 s’applique aux équipements et systèmes électriques, électroniques et électroniques programmables des appareils de levage et à leurs équipements associés, y compris un groupe d’appareils de levage travaillant ensemble de manière coordonnée. L'équipement traité dans le présent document a pour origine le point de connexion de l'alimentation à l'équipement électrique de l'appareil de levage (sectionneur d'alimentation de l'appareil de levage), y compris l'alimentation de puissance et les alimentations de commande situées à l'extérieur de l'appareil de levage, par exemple, les câbles souples, les câbles conducteurs ou les barres conductrices. Le présent document s’applique aux équipements ou parties d'équipements dont la tension n'excède pas 1 000 V en courant alternatif et 1 500 V en courant continu entre phases, et dont la fréquence nominale n'excède pas 200 Hz.. Le présent document ne couvre pas toutes les exigences (par exemple, la protection, le verrouillage ou la commande) qui sont nécessaires ou exigées par d'autres normes ou règlements afin de protéger les personnes contre les dangers autres que les dangers électriques. Chaque type d'appareil de levage a des exigences uniques auxquelles il faut répondre pour assurer une sécurité adéquate. Le présent document ne couvre pas les risques liés au bruit. Des exigences complémentaires et particulières peuvent s’appliquer aux équipements électriques des appareils de levage, y compris ceux qui:<br/>
    – manipulent ou transportent des matériaux potentiellement explosifs (par exemple, de la peinture ou de la sciure);<br/>
    – sont destinés à être utilisés dans des atmosphères potentiellement explosives et/ou inflammables;<br/>
    – présentent des risques particuliers lors du transport ou du déplacement de certains matériaux;<br/>
    – sont destinés à être utilisés dans des mines.<br/>
    Pour les besoins du présent document, les appareils de levage comprennent les grues de tous types, les treuils de tous types et les machines de stockage et d'extraction. Les familles de produits suivantes sont incluses:<br/>
    – ponts roulants;<br/>
    – grues mobiles;<br/>
    – grues à tour;<br/>
    – grues pivotantes à flèche relevable;<br/>
    – portiques;<br/>
    – grues offshore;<br/>
    – grues flottantes;<br/>
    – treuils de tous types;<br/>
    – palans et accessoires;<br/>
    – grues de chargement;<br/>
    – grues à câble (blondins);<br/>
    – accessoires de suspension de charge;<br/>
    – machines de stockage et d'extraction;<br/>
    – treuils suspendus avec rail de translation fixe;<br/>
    – enjambeurs;<br/>
    – portiques sur pneus.<br/>
    Le présent document ne traite pas les éléments particuliers de l'équipement électrique, sauf pour leur choix et leur mise en œuvre.<br/>
    L'IEC 60204-32:2023 annule et remplace la deuxième édition parue en 2008. Cette édition constitue une révision technique.<br/>
    Cette édition inclut les modifications techniques majeures suivantes par rapport à l’édition précédente:<br/>
    a) L'alignement sur la sixième édition de l’IEC 60204-1 (2016) notamment pour:<br/>
    – les exigences relatives à la mise à la terre et à la liaison;<br/>
    – les exigences en matière de protection des circuits;<br/>
    – l'examen de l'utilisation des entraînements électriques de puissance (PDS);<br/>
    – les exigences et la terminologie relatives aux liaisons de protection;<br/>
    – les exigences relatives au couple de sécurité pour les PDS, l'arrêt d'urgence et la protection des circuits de commande;<br/>
    – les symboles des organes de commande des appareils de commande;<br/>
    b) la référence pour les équipements électriques à haute tension;<br/>
    c) les exigences relatives aux systèmes de commande sans fil;<br/>
    d) les exigences relatives à la CEM;<br/>
    e) les exigences en matière de documentation technique;<br/>
    f) la mise à jour générale des conditions spéciales nationales actuelles, des normes et des références bibliographiques.
