abstract:
- language: en
  script: Latn
  content: |-
    IEC 60034-27-1:2017 provides a common basis for:<br/>
    - measuring techniques and instruments;<br/>
    - the arrangement of test circuits;<br/>
    - normalization and testing procedures;<br/>
    - noise reduction;<br/>
    - the documentation of test results;<br/>
    - the interpretation of test results,<br/>
    with respect to partial discharge off-line measurements on the winding insulation of rotating electrical machines.<br/>
    This International Standard cancels and replaces IEC TS 60034-27 (2006). It constitutes a technical revision and reflects numerous improvements and corrections with respect to the previous publication.
- language: fr
  script: Latn
  content: |-
    L’IEC 60034-27-1:2017 présente des modalités communes concernant:<br/>
    - les techniques et les appareils de mesure;<br/>
    - la mise en place des circuits d'essai;<br/>
    - les procédures de normalisation et d'essai;<br/>
    - la réduction du bruit;<br/>
    - la documentation des résultats des essais;<br/>
    - l'interprétation des résultats des essais;<br/>
    pour les besoins des mesurages à l’arrêt des décharges partielles dans les systèmes d'isolation des enroulements des machines électriques tournantes.<br/>
    Cette Norme internationale annule et remplace l’IEC TS 60034-27, publiée en 2006. Elle constitue une révision technique avec de nombreuses améliorations et corrections par rapport à la publication précédente.
