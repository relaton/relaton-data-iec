abstract:
- language: en
  script: Latn
  content: |-
    IEC 61326-2-7:2025 specifies the EMC test requirements for process automation equipment using at least one Ethernet APL (Ethernet ADVANCED PHYSICAL LAYER) compliant port according IEC TS 63444. The type of equipment covered by this document includes INFRASTRUCTURE DEVICES such as switches as well as measurement and control devices. This document provides requirements for the EMC test setups of the APL interface for devices intended for use in process control and process measurement.<br/>
    The other functions of the equipment remain covered by other parts of the IEC 61326 series.<br/>
    NOTE Ethernet-APL uses IEEE Std. 802.3 2022 Ethernet Physical Layer 10BASE-T1L, suitable to be used for full-duplex communication over a single balanced pair of conductors.<br/>
    The test levels are based on the intended environment as stated in the product’s specification or user documentation and selected appropriately from IEC 61326-1.
- language: fr
  script: Latn
  content: |-
    IEC 61326-2-7:2025 spécifie les exigences d'essai en matière de CEM pour les équipements d'automatisation de processus utilisant au moins un accès Ethernet‑APL (couche physique avancée Ethernet) conforme à l'IEC TS 63444. Le type d'équipement couvert par le présent document comprend les dispositifs d'infrastructure tels que les commutateurs ainsi que les dispositifs de mesure et de commande. Le présent document fournit des exigences relatives aux montages d'essai de CEM de l'interface APL pour les dispositifs destinés à être utilisés pour la commande et la mesure des processus.<br/>
    Les autres fonctions du matériel sont toujours couvertes par les autres parties de la série IEC 61326.<br/>
    NOTE Ethernet-APL utilise la couche physique Ethernet 10BASE‑T1L de l'IEEE Std. 802.3‑2022, adaptée à une utilisation dans le cadre de la communication en duplex intégral sur une seule paire équilibrée de conducteurs.<br/>
    Les niveaux d'essai sont fondés sur l'environnement prévu, tel qu'indiqué dans la spécification du produit ou la documentation d'utilisation, et choisis de manière appropriée dans l'IEC 61326 ‑1.
