abstract:
- language: en
  script: Latn
  content: IEC SRD 63347-2:2026 describes and analyses a comprehensive set of high-level
    scenarios of how smart cities can best respond to public health emergencies, and
    strengthen their “Urban Immune System”, using evidence from as many countries
    as possible. It covers use cases related to the prevention, the control and the
    successful ending of public health emergencies, and to dealing with the longer-term
    harm that these may cause. It considers a wide range of different scenarios and
    reviews both the management challenges and the range of technology solutions,
    including the use of IoT, 5G, AI, Big Data, and Cloud Computing, available in
    each of them, in order to provide a comprehensive outline of the standardization
    requirements to develop an effective Urban Immune System. The public health emergencies
    envisaged are those relating to pandemics resulting from novel forms of disease,
    for which there is no natural immunity within the population and no tried and
    tested treatment. However, some of its provisions will be helpful to dealing with
    pandemics of existing diseases such as typhoid and cholera brought on through
    natural disasters or war. This document will provide useful information to International
    and national Standards Development Organizations and thus facilitate and promote
    the development of the smart city standards required.
