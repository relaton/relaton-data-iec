abstract:
- language: en
  script: Latn
  content: |-
    IEC 60730-2-24:2026 applies to automatic displacement electrical controls<br/>
    - for use in, on, or in association with appliances for household and similar use;<br/>
    NOTE 1 Through this document, the word "control" means "displacement electrical control".<br/>
    EXAMPLE 1 Displacement electrical controls used in electrical pressure cookers with gross volume up to 25 l, with working pressure over 4 kPa and less than 150 kPa.<br/>
    - that are AC or DC powered controls with a rated voltage not exceeding 690 V AC or 600 V DC;<br/>
    - used in, on, or in association with equipment that use electricity;<br/>
    - that are mechanically or electrically operated, responsive to change of position of point of action.<br/>
    NOTE 2 Requirements for manual switches not forming part of an automatic control are covered in IEC 61058‑1‑1.<br/>
    This document applies to<br/>
    - inherent safety of automatic electro-mechanical displacement electrical controls;<br/>
    - functional safety of automatic electro-mechanical displacement electrical controls;<br/>
    - the operating values, operating times, and operating sequences where such are associated with equipment safety;<br/>
    - displacement electrical controls having temperature sensing element(s), in which cases additional requirements can be considered to be necessary. Requirements for temperature sensing controls are included in IEC 60730-2-9.<br/>
    This document specifies the requirements for construction, operation and testing of automatic displacement electrical controls used in, on, or in association with equipment.<br/>
    This document does not<br/>
    - apply to automatic electronic controls;<br/>
    - take into account the response value of an automatic action of a control, if such a response value is dependent upon the method of mounting the control in the equipment. Where a response value is of significant purpose for the protection of the user, or surroundings, the value defined in the appropriate equipment standard or as determined by the manufacturer applies.<br/>
    NOTE 3 For more information about guidance to the application of displacement electrical controls, see Annex AA.<br/>
    This part 2-24 is intended to be used in conjunction with IEC 60730-1. It was established on the basis of the sixth edition of that standard (2022). Consideration may be given to future editions of, or amendments to, IEC 60730‑1. This part 2-24 supplements or modifies the corresponding clauses in IEC 60730-1, so as to convert that publication into the IEC standard: Particular requirements for displacement electrical controls. Where this part 2-24 states "addition", "modification" or "replacement", the relevant require­ment, test specification or explanatory matter in Part 1 should be adapted accordingly. Where no change is necessary, part 2-24 indicates that the relevant clause or subclause applies.
- language: fr
  script: Latn
  content: |-
    L'IEC 60730-2-24:2026 s'applique aux dispositifs de commande électrique de déplacement automatiques<br/>
    - destinés à être utilisés dans, sur, ou avec des appareils domestiques et à usage analogue;<br/>
    NOTE 1 Dans le présent document, le terme "dispositif de commande" signifie "dispositif de commande électrique de déplacement".<br/>
    EXEMPLE 1 Dispositifs de commande électrique de déplacement utilisés dans les autocuiseurs électriques dont le volume brut atteint 25 l et dont la pression de service est supérieure à 4 kPa et inférieure à 150 kPa.<br/>
    - en courant alternatif et en courant continu dont la tension assignée ne dépasse pas 690 V en courant alternatif ou 600 V en courant continu;<br/>
    - utilisés dans, sur ou avec un matériel électrique;<br/>
    - à fonctionnement mécanique ou électrique, en réponse à un changement de position du point d'action.<br/>
    NOTE 2 Les exigences pour les interrupteurs manuels ne faisant pas partie d'un dispositif de commande automatique sont couverts par l'IEC 61058-1-1.<br/>
    Le présent document s'applique:<br/>
    - à la sécurité intrinsèque des dispositifs de commande électrique de déplacement électromécaniques automatiques;<br/>
    - à la sécurité fonctionnelle des dispositifs de commande électrique de déplacement électromécaniques automatiques;<br/>
    - aux valeurs de fonctionnement, aux temps de fonctionnement et aux séquences de fonctionnement dans la mesure où ils interviennent dans la sécurité du matériel;<br/>
    - aux dispositifs de commande électrique de déplacement dotés de dispositifs thermosensibles, auquel cas des exigences supplémentaires peuvent s'avérer nécessaires. Les exigences relatives aux dispositifs de commande thermosensibles sont incluses dans l'IEC 60730-2-9.<br/>
    Le présent document spécifie les exigences de construction, de fonctionnement et d'essai des dispositifs de commande électrique de déplacement automatiques utilisés dans, sur ou en association avec un matériel.<br/>
    Le présent document:<br/>
    - ne s'applique pas aux dispositifs de commande automatique;<br/>
    - ne prend pas en considération la valeur de réponse d'une action automatique d'un dispositif de commande lorsqu'elle est influencée par la méthode de montage du dispositif de commande dans le matériel. Dans les cas où une telle valeur de réponse est importante du point de vue de la protection de l'utilisateur ou de l'environnement, la valeur spécifiée dans la norme particulière du matériel ou déterminée par le fabricant s'applique.<br/>
    NOTE 3 Pour plus d'informations sur l'application des dispositifs de commande électrique de déplacement, voir l'Annexe AA.<br/>
    Cette partie 2-24 est destinée à être utilisée conjointement avec l'IEC 60730-1. Elle a été établie sur la base de la sixième édition de cette norme (2022). Les futures éditions de l'IEC 60730-1 ou de ses amendements pourront être prises en considération. La présente Partie 2-24 complète ou modifie les articles correspondants de l'IEC 60730-1, de manière à transformer cette publication en norme IEC: Exigences particulières pour les dispositifs de commande électriques de déplacement. Lorsque la présente Partie 2-24 spécifie "addition", "modification" ou "remplacement", il convient d'adapter l'exigence, la modalité d'essai ou la note correspondante de la Partie 1 en conséquence. Lorsqu'aucune modification n'est nécessaire, la Partie 2-24 indique que l'article ou le paragraphe approprié s'applique.
