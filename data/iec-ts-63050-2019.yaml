abstract:
- language: en
  script: Latn
  content: "IEC TS 63050:2019 applies to all types of dosemeters, irrespective of
    the type of radiation intended to be measured. Tests according to this document
    determine whether a single radiation pulse can be measured correctly even if the
    dosemeter is in the internal state relevant for measuring background or environmental
    radiation.<br/>\nThe annex in the document gives some parameter values for typical
    workplaces where pulsed radiation occurs.<br/>\nThis document considers the pulsation
    of the radiation field as an additional influence quantity like particle energy
    and direction of radiation incidence. Therefore, the tests described are additional
    to all the tests in the instrument specific standards. This document describes
    methods to determine the following characteristic parameters of the dosemeters:\n\n\tthe
    maximum measurable dose rate in the pulse, Hmeas,max\n\tthe maximum measurable
    dose in the pulse, Hmeas,max\n\tthe minimal pulse duration, tmeas,min and\n\tthe
    range for the pulse repetition frequency, fmeas,min  to fmeas,max\n"
