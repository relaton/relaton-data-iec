abstract:
- content: <p class="MsoBodyText">This document specifies the requirements and provides
    guidance for establishing, implementing, maintaining and continually improving
    an AI (artificial intelligence) management system within the context of an organization.</p><p
    class="MsoBodyText">This document is intended for use by an organization providing
    or using products or services that utilize AI systems. This document is intended
    to help the organization develop, provide or use AI systems responsibly in pursuing
    its objectives and meet applicable requirements, obligations related to interested
    parties and expectations from them.</p><p class="MsoBodyText">This document is
    applicable to any organization, regardless of size, type and nature, that provides
    or uses products or services that utilize AI systems.</p>
  language:
  - en
  script:
  - Latn
  format: text/html
- content: <p class="MsoBodyText">Le présent document spécifie les exigences et les
    recommandations relatives à l'établissement, à la mise en œuvre, à la mise à jour
    et à l'amélioration continue d'un système de management de l'IA (intelligence
    artificielle) dans le contexte d'un organisme.</p><p class="MsoBodyText">Le présent
    document est destiné à être utilisé par un organisme qui fournit ou utilise des
    produits ou services utilisant des systèmes d'IA. Le présent document vise à aider
    l'organisme à développer, à fournir ou à utiliser des systèmes d'IA de manière
    responsable dans la poursuite de ses objectifs et à satisfaire aux exigences applicables,
    aux obligations liées aux parties intéressées et aux attentes vis-à-vis desdites
    parties intéressées.</p><p class="MsoBodyText">Le présent document s'applique
    à tout organisme, quels que soient sa taille, son type et sa nature, qui fournit
    ou utilise des produits ou services utilisant des systèmes d'IA.</p>
