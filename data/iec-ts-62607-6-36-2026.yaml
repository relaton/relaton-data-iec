abstract:
- language: en
  script: Latn
  content: |-
    IEC TS 62607-6-36:2026, which is a Technical Specification, establishes a standardized method to determine the key control characteristic<br/>
    • reduction status<br/>
    for graphene oxide (GO) and reduced graphene oxide (rGO) by<br/>
    • ultraviolet-visible spectroscopy (UV-Vis).<br/>
    The reduction status is not a quantitative value, but rather a compilation (table) of six parameters extracted from UV-Vis absorption spectra. These six parameters can be obtained from GO and rGO as follows:<br/>
    (1) the peak location of GO, (2) the shoulder peak of GO, (3) the full width at half maximum (FWHM) of the main absorption peak of GO, (4) the peak location of rGO, (5) FWHM of the main absorption peak of rGO and (6) the spectral peak shifts between GO and rGO.<br/>
    • The method is applicable to the characterization of GO and rGO materials (where rGO is obtained from the corresponding GO) produced by different reduction techniques, as well as to commercial products in solution or film form.<br/>
    • Individual GO or rGO materials can also be characterized, but only partial parameters can be obtained. Specifically, peak location, FWHM, and shoulder peak can be measured from each GO or rGO material, while peak shift requires both GO and its corresponding rGO for comparison.<br/>
    • The method is suitable for quality assurance and for monitoring the reduction process during the production of rGO.<br/>
    • The method does not provide full chemical analysis. Complementary techniques can be required beyond the UV-Vis spectral features.
