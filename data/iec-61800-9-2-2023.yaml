abstract:
- language: en
  script: Latn
  content: |-
    CORRECTED VERSION 2025-11<br/><br/>IEC 61800-9-2:2023 specifies energy efficiency indicators of power electronics (complete drive modules (CDM), input or output sub drive modules (SDM), power drive systems (PDS) and motor starters, all used for motor driven equipment.<br/>
    It defines IE and IES classes, their limit values and provides test procedures for the classification of the overall losses of the motor system.<br/>
    Furthermore, this document proposes a methodology for the implementation of the best energy efficiency solution of drive systems. This depends on the architecture of the motor driven system, on the speed/torque profile and on the operating points over time of the driven load equipment. It provides a link for the energy efficiency evaluation and classification of the extended product.<br/>
    This edition includes the following significant technical changes with respect to the previous edition:<br/>
    a) Additional IES Classes defined to IES5;<br/>
    b) Removed reference motor loss data and now point to IEC 60034-30-2;<br/>
    c) Expanded and modified factors in Clause 6 for CDMs;<br/>
    d) Annex C is now the Mathematical Model for CDM Losses;<br/>
    e) Moved the mathematical model for the CDM to Annex C;<br/>
    f) Added Sub Drive Input Module and Sub Drive Output Modules to Annex B;<br/>
    g) Annex D is now the Converter Topology (old Annex C);<br/>
    h) Annex E is now the Interpolation of Motor Losses (Old Annex D);<br/>
    i) Annex E expanded to include various motor connections and updated interpolation method;<br/>
    j) New Annex E for determination of Interpolation Coefficients;<br/>
    k) Annex F is the old Annex E;<br/>
    l) New Annex J Explanation of Correction Factors for the Reference Losses in Table 8.
- language: fr
  script: Latn
  content: |-
    VERSION CORRIGEE 2025-11<br/><br/>L’IEC 61800-9-2:2023 spécifie les indicateurs d’efficacité énergétique pour l’électronique de puissance (modules d’entraînement complets (CDM), sous-modules d’entrée ou de sortie d’entraînement (SDM), les entraînements électriques de puissance (PDS) et les démarreurs de moteurs), utilisés avec les équipements entraînés par moteur.<br/>
    Il définit les classes IE et IES et établit leurs valeurs limites ainsi que les procédures d’essai pour la classification des pertes globales du système moteur.<br/>
    De plus, le présent document propose une méthodologie pour la mise en œuvre de la solution d’entraînement électrique la plus économe en énergie, qui dépend de l’architecture du système entraîné par moteur, du profil vitesse/couple et des points de fonctionnement dans le temps de l’équipement entraîné. Il établit une base pour l’évaluation et la classification de l’efficacité énergétique du produit étendu.<br/>
    Cette édition inclut les modifications techniques majeures suivantes par rapport à l’édition précédente:<br/>
    a) définition des classes IES supplémentaires, jusqu’à la classe IES5;<br/>
    b) suppression des données relatives aux pertes du moteur de référence et référence désormais à la norme IEC 60034-30-2;<br/>
    c) facteurs étendus et modifiés dans l’Article 6 pour les CDM;<br/>
    d) l’Annexe C couvre désormais le modèle mathématique des pertes du CDM;<br/>
    e) déplacement du modèle mathématique du CDM à l’Annexe C;<br/>
    f) ajout du sous-module d’entrée d’entraînement et des sous-modules de sortie d’entraînement à l’Annexe B;<br/>
    g) l’Annexe D couvre désormais la topologie du convertisseur (qui correspond à l’ancienne Annexe C);<br/>
    h) l’Annexe E couvre désormais l’interpolation des pertes de moteur (qui correspond à l’ancienne Annexe D);<br/>
    i) l’Annexe E a été étendue pour inclure diverses connexions de moteur et une méthode d’interpolation mise à jour;<br/>
    j) nouvelle Annexe E pour la détermination des coefficients d’interpolation;<br/>
    k) l’annexe F correspond à l’ancienne Annexe E;<br/>
    l) nouvelle Annexe J, Explication des facteurs de correction pour les pertes de référence dans le Tableau 8.
