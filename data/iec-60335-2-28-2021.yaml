abstract:
- language: en
  script: Latn
  content: |-
    IEC 60335-2-28:2021 deals with the safety of electric sewing machines for household and similar use, their rated voltage being not more than 250 V for single-phase appliances and 480 V for other appliances, including direct current (DC) supplied appliances and battery-operated appliances.<br/>
    Overlock machines and electrical sets are within the scope of this standard.<br/>
    Appliances not intended for normal household use, but that nevertheless can be a source of danger to the public, such as sewing machines intended to be used by laymen in shops and in light industry, are within the scope of this standard.<br/>
    As far as is practicable, this standard deals with the common hazards presented by appliances that are encountered by all persons in and around the home. However, in general, it does not take into account<br/>
    - persons (including children) whose physical, sensory or mental capabilities; or lack of experience and knowledge prevents them from using the appliance safely without supervision or instruction;<br/>
    - children playing with the appliance.<br/>
    Attention is drawn to the fact that<br/>
    - for appliances intended to be used in vehicles or on board ships or aircraft, additional requirements can be necessary;<br/>
    - in many countries additional requirements are specified by the national health authorities, the national authorities responsible for the protection of labour and similar authorities.<br/>
    This standard does not apply to<br/>
    - appliances intended exclusively for industrial purposes;<br/>
    - appliances intended to be used in locations where special conditions prevail, such as the presence of a corrosive or explosive atmosphere (dust, vapour or gas).<br/>
    This fifth edition cancels and replaces the fourth edition published in 2002 and Amendment 1:2008. This edition constitutes a technical revision.<br/>
    This edition includes the following significant technical changes with respect to the previous edition:<br/>
    a) the text has been aligned with IEC 60335-1:2020;<br/>
    b) some notes have been converted to normative text (Clause 1, 11.7, 22.14, 22.101);<br/>
    c) clarification of requirements for battery-operated appliances (Clause 1, 3.1.9, 11.7, B.11.1);<br/>
    d) introduction of limits on the temperature rise of external accessible surfaces (Clause 11);<br/>
    e) application of test probe 19 has been introduced (8.1.1, 20.2).<br/>
    This Part 2 is to be used in conjunction with the latest edition of IEC 60335-1 and its amendments unless that edition precludes it; in that case, the latest edition that does not preclude it is used. It was established on the basis of the sixth edition (2020) of that standard.
- language: fr
  script: Latn
  content: |-
    L'IEC 60335-2-28:2021 traite de la sécurité des machines à coudre électriques destinées à un usage domestique et analogue, dont la tension assignée est inférieure ou égale à 250 V pour les appareils monophasés et à 480 V pour les autres appareils, y compris les appareils alimentés en courant continu et les appareils alimentés par batteries.<br/>
    Les surjeteuses-raseuses et les ensembles électriques relèvent du domaine d'application de la présente norme.<br/>
    Les appareils non destinés à un usage domestique normal, mais qui peuvent néanmoins constituer une source de danger pour le public, tels que les machines à coudre destinées à être utilisées par des usagers non avertis dans des magasins et chez des artisans, sont compris dans le domaine d'application de la présente norme.<br/>
    Dans la mesure du possible, la présente norme traite des dangers courants que présentent les appareils et auxquels sont exposés tous les individus situés à l'intérieur et autour de l'habitation. Cependant, cette norme ne tient pas compte en général:<br/>
    - des personnes (y compris des enfants) dont les capacités physiques, sensorielles ou mentales; ou le manque d'expérience et de connaissance les empêchent d'utiliser l'appareil en toute sécurité sans surveillance ou instruction;<br/>
    - de l'utilisation de l'appareil comme jouet par des enfants.<br/>
    L'attention est attirée sur le fait que:<br/>
    - pour les appareils destinés à être utilisés dans des véhicules ou à bord de navires ou d'avions, des exigences supplémentaires peuvent être nécessaires;<br/>
    - dans de nombreux pays, des exigences supplémentaires sont spécifiées par les organismes nationaux de la santé, par les organismes nationaux responsables de la protection des travailleurs et par des organismes similaires.<br/>
    La présente norme ne s'applique pas<br/>
    - aux appareils prévus exclusivement pour des usages industriels;<br/>
    - aux appareils destinés à être utilisés dans des locaux qui présentent des conditions particulières, telles que la présence d'une atmosphère corrosive ou explosive (poussière, vapeur ou gaz).<br/>
    Cette cinquième édition annule et remplace la quatrième édition parue en 2002 et l'Amendement 1:2008. Cette édition constitue une révision technique.<br/>
    Cette édition inclut les modifications techniques majeures suivantes par rapport à l'édition précédente:<br/>
    a) alignement du texte sur l'IEC 60335-1:2020;<br/>
    b) conversion en texte normatif de certaines notes (Article 1, 11.7, 22.14, 22.101);<br/>
    c) clarification des exigences relatives aux appareils alimentés par batteries (Article 1, 3.1.9, 11.7, B.11.1);<br/>
    d) introduction des limites d'échauffement des surfaces accessibles extérieures (Article 11);<br/>
    e) introduction de l'application du calibre d'essai 19 (8.1.1, 20.2).<br/>
    La présente Partie 2 doit être utilisée conjointement avec la dernière édition de l'IEC 60335-1 et ses amendements, sauf si cette édition l'exclut. Dans ce cas, la dernière édition qui n'exclut pas la présente Partie 2 est utilisée. Elle a été établie sur la base de la sixième édition (2020) de cette norme.
