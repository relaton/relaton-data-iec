abstract:
- language: en
  script: Latn
  content: |-
    ISO 10079-1:2015 specifies safety and performance requirements for electrically powered medical and surgical suction equipment. It applies to equipment used in health care facilities such as hospitals, for domiciliary care of patients and for field and transport use.<br/>
    ISO 10079-1:2015 does not apply to the following:<br/>
    a) central power supply (by vacuum/compressed air generation), piping systems of vehicles and buildings, and wall connectors;<br/>
    b) end-pieces such as suction catheters, drains, curettes, Yankauer suckers and suction tips;<br/>
    c) syringes;<br/>
    d) dental suction equipment;<br/>
    e) anaesthetic gas scavenging systems;<br/>
    f) laboratory suction;<br/>
    g) autotransfusion systems;<br/>
    h) mucus extractors including neonatal mucus extractors;<br/>
    i) suction equipment where the collection container is downstream of the vacuum pump;<br/>
    j) ventouse (obstetric) equipment;<br/>
    k) suction equipment marked for endoscopic use only;<br/>
    l) plume evacuation systems.
- language: fr
  script: Latn
  content: |-
    ISO 10079-1:2015 spécifie les exigences de sécurité et de performance pour les appareils électriques d'aspiration médicale et chirurgicale. Elle s'applique aux appareils utilisés dans les établissements de soins tels que les hôpitaux, pour les soins des patients à domicile, ainsi que pour une utilisation sur le terrain et lors d'un transport.<br/>
    ISO 10079-1:2015 ne s'applique pas aux éléments énumérés ci-après:<br/>
    a) les alimentations motrices à partir d'une centrale (air comprimé/aspiration), les systèmes de canalisations des véhicules et bâtiments, ainsi que les raccords muraux;<br/>
    b) les pièces d'extrémité, telles que les sondes d'aspiration, les drains, les curettes, les « Yankauer » et les embouts d'aspiration;<br/>
    c) les seringues;<br/>
    d) les appareils dentaires d'aspiration;<br/>
    e) les systèmes d'évacuation des gaz d'anesthésie;<br/>
    f) l'aspiration en laboratoire;<br/>
    g) les systèmes d'autotransfusion;<br/>
    h) les extracteurs de mucosités, y compris ceux pour nouveau-nés;<br/>
    i) les appareils d'aspiration dont le bocal de recueil est en aval de la pompe à vide;<br/>
    j) les appareils avec ventouse (obstétrique);<br/>
    k) les appareils d'aspiration à usage endoscopique uniquement (marqués comme tels);<br/>
    l) les systèmes d'évacuation de fumée.
