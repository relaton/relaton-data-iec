abstract:
- language: en
  script: Latn
  content: |-
    IEC 63223-1:2026 provides an overview of asset management, its principles and value creation options for the management of network assets in power systems.<br/>
    This document can be applied to all types of network assets and by all types and sizes of power network companies. The term power network company does not necessarily refer to legally structured companies.<br/>
    In this document, network assets refer mainly to the physical assets of the electrical energy network, meaning items, equipment, or systems that have potential or actual value for the electric company and are part of the power lines and substations responsible for the transmission and distribution of electrical energy. Examples of network assets that can be included in the asset portfolio of a power network company are presented in IEC 63223-2:2026, 4.2.2.
- language: fr
  script: Latn
  content: |-
    L'IEC 63223-1: 2026 fournit un aperçu général de la gestion d’actifs, de ses principes et des options de création de valeur pour la gestion des actifs des réseaux d’énergie électrique.<br/>
    Le présent document peut s’appliquer à tous les types de réseaux et à tous les types et tailles de gestionnaires de réseaux d’énergie électrique. Le terme gestionnaire de réseaux d’énergie électrique ne désigne pas nécessairement des sociétés qui possèdent une structure juridique.<br/>
    Dans le présent document, les actifs de réseau désignent principalement les actifs physiques du réseau d’énergie électrique, c’est-à-dire les éléments, équipements ou systèmes qui ont une valeur potentielle ou réelle pour la compagnie d’électricité et qui font partie des lignes électriques et des postes responsables du transport et de la distribution de l’énergie électrique. Des exemples d’actifs de réseau pouvant être inclus dans le portefeuille d’actifs d’un gestionnaire de réseaux d’énergie électrique sont présentés dans l’IEC 63223-2:2026, 4.2.2.
