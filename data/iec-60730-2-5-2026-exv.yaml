abstract:
- language: en
  script: Latn
  content: |-
    IEC 60730-2-5:2026 EXV contains both the international standard and its extended version (EXV). This extended version of the official IEC Standard is available in English only and provides the user with a comprehensive content of the Standard. IEC 60730-2-5:2026 EXV includes the content of the references made to IEC 60730-1:2022.<br/>
    <br/>
    IEC 60730-2-5:2026 applies to automatic electrical burner control systems for the automatic control of burners for oil, gas, coal or other combustibles intended to be used<br/>
    - for household and similar use;<br/>
    - in shops, offices, hospitals, farms and commercial and industrial applications;<br/>
    NOTE 1 Throughout this document, where it can be used unambiguously, the word "system" means "burner control system" and "systems" means "burner control systems".<br/>
    - for equipment that is used by the public, such as equipment intended to be used in shops, offices, hospitals, farms and commercial and industrial applications;<br/>
    NOTE 2 Throughout this document, the word "equipment" means "appliance and equipment."<br/>
    EXAMPLE 1 Controls for commercial catering, heating and air-conditioning equipment.<br/>
    - that are smart enabled controls;<br/>
    EXAMPLE 2 Remote interfaces/control of burner operations.<br/>
    - that are AC or DC powered controls with a rated voltage not exceeding 690 V AC or 600 V DC;<br/>
    - used in, on, or in association with equipment that use electricity, gas, oil, solid fuel, solar thermal energy, etc., or a combination thereof;<br/>
    - utilized as part of a control system or controls which are mechanically integral with multifunctional controls having non-electrical outputs;<br/>
    - using NTC or PTC thermistors and to discrete thermistors, requirements for which are contained in Annex J;<br/>
    - that are mechanically or electrically operated, responsive to or controlling such characteristics as temperature, pressure, passage of time, humidity, light, electrostatic effects, flow, or liquid level, current, voltage, acceleration, or combinations thereof;<br/>
    - as well as manual controls when such are electrically and/or mechanically integral with automatic controls.<br/>
    NOTE 3 Requirements for manually actuated mechanical switches not forming part of an automatic control are contained in IEC 61058-1-1.<br/>
    This document is applicable<br/>
    - to a complete burner control system;<br/>
    - to a separate programming unit;<br/>
    - to a separate electronic high-voltage ignition source;<br/>
    - to a separate flame detector, and<br/>
    - to a separate high-temperature operation (HTO) detector.<br/>
    - to a burner control system intended to be used in warm air heating appliances (furnaces) where the appliance is equipped with an electromechanical differential pressure control to monitor the difference of the combustion air pressure (Type 2.AL). This pressure control provides a switch as an alternative to one of the two switching elements to directly de-energize the safety relevant terminals.<br/>
    This document does not apply to thermoelectric flame supervision controls; thermoelectric flame supervision controls are covered by ISO 23551-6:2021.<br/>
    This document also applies to electrical burner control systems intended exclusively for industrial process applications e.g. those applications covered by ISO TC 244 (ISO 13577 series).<br/>
    This document applies to controls powered by primary or secondary batteries, requirements for which are contained within the standard.<br/>
    This document applies to<br/>
    - the inherent safety of automatic electrical burner control systems, and<br/>
    - functional safety of automatic electrical burner control systems,<br/>
    - automatic electrical burner control systems where the performance (for example the effect of EMC phenomena) of the product can impair the overall safety and performance of the controlled system,<br/>
    - the operating values, operating times, and operating sequences where such are associated with burner safety and to the testing of automatic electrical burner control systems used in, on, or in association with, burners.<br/>
    NOTE 4 Requirements for specific operating values, operating times and operating sequences are given in the standards for appliances and equipment.<br/>
    This document specifies the requirements for construction, operation and testing of automatic electrical burner control systems used in, on, or in association with an equipment.<br/>
    This document applies also to systems<br/>
    - incorporating electronic devices,<br/>
    - using NTC or PTC thermistors, additional requirements for which are contained in Annex J,<br/>
    - to the electrical and functional safety of controls capable of receiving and responding to communications signals. The signals can be transmitted to or received from external units, connected wired or wireless, that can or can not be part of the burner control system.<br/>
    This document does not<br/>
    - take into account the response value of an automatic action of a control, if such a response value is dependent upon the method of mounting the control in the equipment. Where a response value is of significant purpose for the protection of the user, or surroundings, the value defined in the appropriate equipment standard or as determined by the manufacturer will apply;<br/>
    - address the integrity of the output signal to the network devices, such as interoperability with other devices unless it has been evaluated as part of the control system.<br/>
    This part 2-5 is intended to be used in conjunction with IEC 60730-1. It was established on the basis of the sixth edition of that standard. Consideration may be given to future editions of, or amendments to, IEC 60730‑1.<br/>
    This fifth edition cancels and replaces the fourth edition published in 2013, Amendment 1:2017 and Amendment 2:2021. This edition constitutes a technical revision.<br/>
    This edition includes the following significant technical changes with respect to the previous edition:<br/>
    Adoption of IEC 60730-1:2022 with all of its significant changes to IEC 60730-1:2013, including Amendment 1:2015 and Amendment 2:2020
