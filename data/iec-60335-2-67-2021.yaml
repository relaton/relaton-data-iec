abstract:
- language: en
  script: Latn
  content: |-
    IEC 60335-2-67:2021 deals with the safety of powered floor treatment machines intended for commercial indoor or outdoor use for the following applications:<br/>
    - scrubbing,<br/>
    - wet or dry pick-up,<br/>
    - polishing and dry buffing,<br/>
    - application of wax, sealing products and powder based detergents,<br/>
    - shampooing,<br/>
    - stripping, grinding and scarifying<br/>
    of floors with an artificial surface.<br/>
    These machines have a cleaning motion which is more lateral or periodic than linear.<br/>
    By contrast, the cleaning motion of machines covered by IEC 60335-2-72 is more linear than lateral or periodic.<br/>
    This standard applies to machines for commercial use. The following list, although not comprehensive, gives an indication of locations that are included in the scope:<br/>
    - public use areas such as hotels, schools, hospitals;<br/>
    - industrial locations, for example factories and manufacturing shops;<br/>
    - retail outlets, for example shops and supermarkets;<br/>
    - business premises, for example offices and banks;<br/>
    - all uses other than normal housekeeping purposes.<br/>
    These machines are not equipped with a traction drive.<br/>
    Machines for the same intended function but equipped with a traction drive are covered by IEC 60335 2-72.<br/>
    The following power systems are covered:<br/>
    - internal combustion engines,<br/>
    - mains powered motors up to a rated voltage of 250 V for single-phase appliances and 480 V for other appliances,<br/>
    - battery-operated machines.<br/>
    Battery-operated machines may be equipped with a built-in battery charger.<br/>
    This standard does not apply to<br/>
    - vacuum cleaners and water-suction cleaning appliances for household use (IEC 60335 2 2);<br/>
    - floor treatment appliances for household use (IEC 60335-2-10);<br/>
    - spray extraction machines for commercial use (IEC 60335-2-68);<br/>
    - wet and dry vacuum cleaners, including power brush, for commercial use (IEC 60335 2 69);<br/>
    IEC 60335-2-68 and IEC 60335-2-69 cover only machines without traction drive.<br/>
    - floor treatment machines with or without traction drive, for commercial use (IEC 60335 2 72);<br/>
    - hand-held and transportable motor-operated electric tools (IEC 60745 series, IEC 61029 series, IEC 62841 series);<br/>
    - machines designed for use in corrosive or explosive environments (dust, vapour or gas);<br/>
    - machines designed for picking up hazardous dusts (as defined in IEC 60335-2-69), inflammable substances, or glowing particles;<br/>
    - machines designed for use in vehicles or on board of ships or aircraft.<br/>
    This fifth edition cancels and replaces the fourth edition published in 2012 and its Amendment 1: 2016. It constitutes a technical revision.<br/>
    This edition includes the following significant technical changes with respect to the previous edition:<br/>
    - editorial and technical alignment with IEC 60335-1:2020.<br/>
    This part 2 is to be used in conjunction with the latest edition of IEC 60335-1 and its amendments. It was established on the basis of the sixth edition (2020) of that standard.
- language: fr
  script: Latn
  content: |-
    L'IEC 60335-2-67:2021 traite de la sécurité des machines de traitement des sols destinées à un usage commercial en intérieur ou en extérieur pour les applications suivantes:<br/>
    - le brossage,<br/>
    - le ramassage à sec ou en présence d'eau,<br/>
    - le polissage et le polissage à sec,<br/>
    - l'application de cire, de produits d'étanchéité et de détergents à base de poudre,<br/>
    - le nettoyage par shampouineuse,<br/>
    - le décapage, l'abrasion et la scarification<br/>
    des sols avec une surface artificielle.<br/>
    Ces machines présentent un mouvement de nettoyage plus latéral ou périodique que linéaire.<br/>
    En revanche, le mouvement de nettoyage des machines couvertes par l'IEC 60335-2-72 est plus linéaire que latéral ou périodique.<br/>
    La présente norme s'applique aux machines à usage commercial. La liste suivante, bien que non exhaustive, donne une indication des endroits inclus dans le domaine d'application:<br/>
    - zones ouvertes au public, telles que les hôtels, les écoles, les hôpitaux;<br/>
    - sites industriels, par exemple usines et ateliers de fabrication;<br/>
    - commerces de détail, par exemple magasins et supermarchés;<br/>
    - locaux commerciaux, par exemples bureaux et banques;<br/>
    - tous les usages autres que l'utilisation domestique normale.<br/>
    Ces machines ne sont pas équipées d'une commande de dispositif de déplacement.<br/>
    Les machines conçues pour la même fonction prévue mais équipées d'une commande de dispositif de déplacement sont couvertes par l'IEC 60335-2-72.<br/>
    Les systèmes d'alimentation suivants sont couverts:<br/>
    - moteurs à combustion interne,<br/>
    - moteurs alimentés par le réseau de tension assignée inférieure ou égale à 250 V pour les appareils monophasés et à 480 V pour les autres appareils,<br/>
    - machines alimentées par batteries.<br/>
    Les machines alimentées par batteries peuvent être équipées d'un chargeur de batterie intégré.<br/>
    La présente norme ne s'applique pas:<br/>
    - aux aspirateurs et aux appareils de nettoyage à aspiration d'eau à usage domestique (IEC 60335 2 2);<br/>
    - aux appareils de traitement des sols à usage domestique (IEC 60335-2-10);<br/>
    - aux machines de nettoyage par pulvérisation et aspiration à usage commercial (IEC 60335-2-68);<br/>
    - aux aspirateurs qui fonctionnent en présence d'eau ou à sec, y compris les brosses motorisées, à usage commercial (IEC 60335 2 69);<br/>
    L'IEC 60335-2-68 et l'IEC 60335-2-69 couvrent uniquement les machines sans commande de dispositif de déplacement.<br/>
    - aux machines de traitement des sols avec ou sans commande de dispositif de déplacement, à usage commercial (IEC 60335 2 72);<br/>
    - aux outils électroportatifs et portables à moteur (série IEC 60745, série IEC 61029, série IEC 62841);<br/>
    - aux machines destinées à être utilisées dans des environnements corrosifs ou explosifs (poussière, vapeur ou gaz);<br/>
    - aux machines destinées à aspirer de la poussière dangereuse (comme défini dans l'IEC 60335-2-69), des substances inflammables ou des particules incandescentes;<br/>
    - aux machines destinées à être utilisées dans des véhicules ou à bord de navires ou d'avions.<br/>
    Cette cinquième édition annule et remplace la quatrième édition parue en 2012 et son Amendement 1:2016. Elle constitue une révision technique.<br/>
    Cette édition inclut les modifications techniques majeures suivantes par rapport à l'édition précédente:<br/>
    - alignement rédactionnel et technique sur l'IEC 60335-1:2020.<br/>
    La présente partie 2 doit être utilisée conjointement avec la dernière édition de l'IEC 60335-1 et ses amendements. Elle a été établie sur la base de la sixième édition (2020) de cette norme.
