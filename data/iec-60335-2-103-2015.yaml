abstract:
- language: en
  script: Latn
  content: |-
    IEC 60335-2-103:2015 deals with the safety of electric drives for horizontally and vertically moving gates, doors, garage doors and windows for household and similar purposes, their rated voltage being not more than 250 V for single-phase drives and 480 V for other drives. It also covers the hazards associated with the movement of the driven part.<br/>
    Battery-operated drives and other d.c. supplied drives are within the scope of this standard. Dual supply drives, either mains-supplied or battery-operated, are regarded as battery-operated drives when operated in the battery mode.<br/>
    Drives not intended for normal household use but which nevertheless may be a source of danger to the public, such as drives intended to be used by laymen in shops, offices, hotels, restaurants, hospitals, in industry and on farms, are within the scope of this standard.<br/>
    Requirements for drives for doors that may be used in emergency routes and exits are given in Annex AA.<br/>
    Examples of drives within the scope of this standard are drives for:<br/>
    - folding doors;<br/>
    - revolving doors;<br/>
    - rolling doors;<br/>
    - roof windows;<br/>
    - sectional overhead doors;<br/>
    - swinging and sliding gates or doors.<br/>
    Drives may be supplied with a driven part.<br/>
    As far as is practicable, this standard deals with the common hazards presented by drives that are encountered by all persons in and around the home. However, in general, it does not take into account<br/>
    - persons (including children) whose<br/>
    - physical, sensory or mental capabilities; or<br/>
    - lack of experience and knowledge<br/>
    prevents them from using the drive safely without supervision or instruction;<br/>
    - children playing with the drive.<br/>
    Attention is drawn to the fact that in many countries additional requirements are specified by the national authorities responsible for the protection of labour and similar authorities.<br/>
    This standard does not apply to drives<br/>
    - for vertically moving garage doors for residential use (60335-2-95);<br/>
    - for shutters covering doors and windows (including locations where the door is set back from the shutter), awnings, blinds and similar equipment (60335-2-97);<br/>
    - intended exclusively to be used by trained persons in commercial and industrial premises;<br/>
    - for specific purposes, such as fire doors;<br/>
    - for natural smoke exhaust ventilators not used as windows (ISO 21927-2);<br/>
    - intended to be used in locations where special conditions prevail, such as the presence of a corrosive or explosive atmosphere (dust, vapour or gas).<br/>
    This standard does not apply to movement of a pedestrian door where such movement is based solely on stored energy.<br/>
    This third edition cancels and replaces the second edition published in 2006 and its Amendment 1 (2010). It constitutes a technical revision.<br/>
    The principal changes in this edition as compared with the second edition of IEC 60335 2 103 are as follows:<br/>
    - modification of requirements in Clause 20 by introduction of new annexes.<br/>
    This part 2 is to be used in conjunction with the latest edition of IEC 60335-1 and its amendments. It was established on the basis of the fifth edition (2010) of that standard.<br/>
    This part 2 supplements or modifies the corresponding clauses in IEC 60335-1, so as to convert that publication into the IEC standard: Safety requirements for electric drives for gates, doors and windows.<br/>
    This publication is to be read in conjunction with IEC 60335-1:2010.
- language: fr
  script: Latn
  content: |-
    L'IEC 60335-2-103:2015 traite de la sécurité des motorisations électriques de portails, portes, portes de garage et fenêtres, à déplacement horizontal ou vertical, pour usages domestiques et analogues, dont la tension assignée n'est pas supérieure à 250 V pour les motorisations monophasées et à 480 V pour les autres motorisations. Elle couvre également les dangers liés au mouvement de la partie entraînée.<br/>
    Les motorisations alimentées par batteries et les autres motorisations alimentées en courant continu sont comprises dans le domaine d'application de la présente norme. Les motorisations à double alimentation, alimentées soit par le réseau soit par batteries, sont considérées comme des motorisations alimentées par batteries lorsqu'elles fonctionnent en mode batterie.<br/>
    Les motorisations non destinées à un usage domestique normal mais qui néanmoins peuvent constituer une source de danger pour le public, telles que les motorisations destinées à être utilisées par des usagers non avertis dans des magasins, des bureaux, des hôtels, des restaurants, des hôpitaux, dans l'industrie et dans des fermes, sont comprises dans le domaine d'application de la présente norme.<br/>
    Les exigences pour les motorisations des portes qui peuvent être utilisées en cas d'urgence sont données à l'Annexe AA.<br/>
    Les motorisations applicables aux éléments suivants sont des exemples de motorisations entrant dans le domaine d'application de la présente norme:<br/>
    - portes pliantes;<br/>
    - portes tournantes;<br/>
    - portes à enroulement;<br/>
    - fenêtres de toit;<br/>
    - portes sectionnelles relevantes;<br/>
    - portails ou portes de type battant et coulissant.<br/>
    Les motorisations peuvent être livrées avec une partie entraînée.<br/>
    Dans la mesure du possible, la présente norme traite des dangers ordinaires présentés par les motorisations, encourus par tous les individus à l'intérieur et autour de l'habitation. Cependant, la présente norme ne tient pas compte en général<br/>
    - des personnes (y compris des enfants) dont<br/>
    - les capacités physiques, sensorielles ou mentales; ou<br/>
    - le manque d'expérience et de connaissance<br/>
    les empêchent d'utiliser la motorisation en toute sécurité sans surveillance ou instruction;<br/>
    - de l'utilisation de la motorisation comme jouet par des enfants.<br/>
    L'attention est attirée sur le fait que dans de nombreux pays, des exigences supplémentaires sont spécifiées par les organismes nationaux responsables de la protection des travailleurs et par des organismes similaires.<br/>
    La présente norme ne s'applique pas aux motorisations<br/>
    - des portes de garage à ouverture verticale pour usage résidentiel (IEC 60335-2-95);<br/>
    - des volets couvrant les portes et les fenêtres (y compris dans les cas où la porte est en retrait par rapport au volet), les stores, les rideaux et les équipements analogues (IEC 60335-2-97);<br/>
    - destinées exclusivement à une utilisation par des personnes averties dans des locaux à usage commercial et industriel;<br/>
    - pour des usages spécifiques, comme les portes coupe-feu;<br/>
    - pour des dispositifs d'évacuation naturelle des fumées non utilisés comme fenêtres (ISO 21927-2);<br/>
    - destinées à être utilisées dans des locaux présentant des conditions particulières, telles que la présence d'une atmosphère corrosive ou explosive (poussière, vapeur ou gaz).<br/>
    La présente norme ne s'applique pas au mouvement d'une porte piétonne lorsque ce mouvement est basé uniquement sur l'énergie stockée.<br/>
    Cette troisième édition annule et remplace la deuxième édition parue en 2006 et son Amendement 1 (2010). Cette édition constitue une révision technique.<br/>
    Par rapport à la deuxième édition de l'IEC 60335-2-103, les principales modifications indiquées ci-après ont été apportées dans la présente édition:<br/>
    - modification des exigences de l'Article 20 par l'introduction de nouvelles annexes.<br/>
    La présente partie 2 doit être utilisée conjointement avec la dernière édition de l'IEC 60335-1 et ses amendements. Elle a été établie sur la base de la cinquième édition (2010) de cette norme.<br/>
    La présente partie 2 complète ou modifie les articles correspondants de l'IEC 60335-1 de façon à transformer cette publication en norme IEC: Exigences de sécurité pour les motorisations électriques de portails, portes et fenêtres.
