abstract:
- language: en
  script: Latn
  content: |-
    IEC 62504:2014 is of assistance in the common understanding of terms and definitions, relevant for general lighting with LED technology. The terms included are those already available in IEC LED standards or used in manufacturers' literature. This standard provides descriptive terms (like "LED light sources") and measurable terms when modified from IEC 60050-845 (like "colour rendering index"). This first edition cancels and replaces the IEC TS 62504 published in 2011. The significant changes with respect to IEC TS 62504 are as follows:<br/>
    a) Terms from the International Electrotechnical Vocabulary that have not been modified are deleted;<br/>
    b) Alignment with the CIE has been done;<br/>
    c) An introduction has been added.
- language: fr
  script: Latn
  content: |-
    L'IEC 62504:2014 doit aider à une compréhension partagée des termes et des définitions pertinents concernant l'éclairage général avec la technologie à LED. Les termes inclus sont ceux qui sont déjà disponibles dans les normes IEC relatives aux LED ou utilisés dans les ouvrages de référence des fabricants. La présente norme donne des termes descriptifs (comme "sources lumineuses à LED") et des termes mesurables modifiés par rapport à l'IEC 60050-845 (comme "indice général de rendu des couleurs"). Cette première édition annule et remplace l'IEC TS 62504 parue en 2011. Les améliorations importantes par rapport à l'IEC TS 62504 sont comme suit:<br/>
    a) Les termes du Vocabulaire International Electrotechnique qui n'ont pas été modifiés ont été supprimés;<br/>
    b) L'alignement avec la CIE a été réalisé;<br/>
    c) Une introduction a été ajoutée.
