abstract:
- language: en
  script: Latn
  content: |-
    ISO 80601-2-90:2026 This document applies to the basic safety and essential performance of respiratory high-flow therapy equipment, as defined in ‎201.3.262, hereafter also referred to as ME equipment or ME system, in combination with its accessories:<br/>
    - intended for use with patients who can breathe spontaneously; and<br/>
    - intended for patients who would benefit from improved alveolar gas exchange; and who would benefit from receiving high-flow humidified respiratory gases, which can include a patient whose upper airway is bypassed.<br/>
    EXAMPLE 1 Patients with Type 1 Respiratory Failure who exhibit a reduction in arterial blood oxygenation.<br/>
    EXAMPLE 2 Patients who would benefit from reduced work of breathing, as needed in Type 2 Respiratory Failure, where arterial carbon dioxide is high.<br/>
    EXAMPLE 3 Patients requiring humidification to improve mucociliary clearance.<br/>
    Respiratory high-flow therapy equipment is utilized in both professional healthcare facilities and the home healthcare environment. This standard specifically addresses respiratory high-flow therapy equipment for acute or infant care, predominantly found in hospitals. A separate document for long term high-flow therapy in the home healthcare environment is expected to be forthcoming.<br/>
    Respiratory high-flow therapy equipment can be:<br/>
    - fully integrated ME equipment; or<br/>
    - a combination of separate items forming a ME system.<br/>
    This document also applies to other types of respiratory equipment when that equipment includes a respiratory high-flow therapy mode.<br/>
    NOTE 2 This document and ISO 80601-2-12 are applicable to a critical care ventilator with a high-flow therapy mode.<br/>
    NOTE 3 This document and ISO 80601-2-72 are applicable to ventilator for ventilator-dependent patients in the home healthcare environment with a high-flow therapy mode.<br/>
    NOTE 4 This document and ISO 80601-2-13 are applicable to an anaesthetic workstation with a high-flow therapy mode.<br/>
    Respiratory high-flow therapy equipment can be transit-operable.<br/>
    This document is also applicable to those accessories intended by their manufacturer to be connected to the respiratory high-flow therapy equipment, where the characteristics of those accessories can affect the basic safety or essential performance of the respiratory high-flow therapy equipment.<br/>
    EXAMPLE 4 Breathing sets, connectors, humidifier, breathing system filter, external electrical power source, distributed alarm system, high-flow nasal cannula, tracheal tube, tracheostomy tube, face mask and supra-laryngeal airway.<br/>
    NOTE 5 Accessories are assessed with the relevant clauses of this document when configured as part of respiratory high-flow therapy equipment.<br/>
    If a clause or subclause is specifically intended to be applicable to ME equipment only, or to ME systems only, the title and content of that clause or subclause will say so. If that is not the case, the clause or subclause applies both to ME equipment and to ME systems, as relevant.<br/>
    Hazards inherent in the intended physiological function of ME equipment or ME systems within the scope of this document are not covered by specific requirements in this document except in the general standard, 7.2.13 and 8.4.1.<br/>
    NOTE 6 Additional information can be found in the general standard, 4.2.<br/>
    This document does not specify the requirements for:<br/>
    - ventilators or accessories for ventilator-dependent patients intended for critical care applications, which are given in ISO 80601‑2‑12;<br/>
    - ventilators or accessories intended for anaesthetic applications, which are given in ISO 80601‑2‑13;<br/>
    - ventilators or accessories intended for the emergency medical services environment, which are given in ISO 80601‑2‑84;<br/>
    - ventilators or accessories intended for ventilator-dependent patients in the home healthcare environment, which are given in ISO 80601‑2‑72;<br/>
    - ventilatory support equipment or accessories intended for patients with ventilatory impairment, which are given in ISO 80601‑2‑79;<br/>
    - ventilatory support equipment or accessories intended for patients with ventilatory insufficiency, which are given in ISO 80601‑2‑80;<br/>
    - sleep apnoea therapy ME equipment, which are given in ISO 80601‑2‑70;<br/>
    - continuous positive airway pressure (CPAP) ME equipment;<br/>
    - high-frequency jet ventilators (HFJVs)‎[31], which are given in ISO 80601‑2‑87;<br/>
    - gas mixers for medical use, which are given in ISO 11195;<br/>
    - flowmeters, which are given in ISO 15002;<br/>
    - high-frequency oscillatory ventilators (HFOVs), which are given in ISO 80601‑2‑87; and<br/>
    cuirass or “iron-lung” ventilation equipment.<br/>
    This document is a particular standard in the IEC 60601 series, the IEC 80601 series and the ISO 80601 series.
- language: fr
  script: Latn
  content: |-
    ISO 80601-2-90:2026 Le présent document s'applique à la sécurité de base et aux performances essentielles des équipements de thérapie respiratoire à haut débit, tels que définis en 201.3.262, ci-après également désignés par appareils EM ou systèmes EM, en association avec leurs accessoires:<br/>
    - destinés à être utilisés sur des patients qui peuvent respirer spontanément; et<br/>
    - destinés à être utilisés chez des patients, dont ceux qui ont une dérivation des voies aériennes supérieures, pour qui un meilleur échange gazeux alvéolaire et une administration de gaz respiratoires humidifiés à haut débit seraient bénéfiques.<br/>
    EXEMPLE 1 Patients atteints d'insuffisance respiratoire de type 1, c'est-à-dire présentant des signes d'hypoxémie artérielle<br/>
    EXEMPLE 2 Patients qui gagneraient à réduire leur travail respiratoire, comme c'est le cas pour une insuffisance respiratoire de type 2, où le patient souffre d'hypercapnie.<br/>
    EXEMPLE 3 Patients nécessitant une humidification pour améliorer la clairance mucociliaire.<br/>
    L'équipement de thérapie respiratoire à haut débit est utilisé à la fois dans les établissements de soins de santé professionnels et dans l'environnement de soins à domicile. La présente norme traite spécifiquement de l'équipement de thérapie respiratoire à haut débit destiné aux soins intensifs ou aux soins néonatals, principalement utilisés dans les hôpitaux. Un document distinct pour la thérapie à haut débit à long terme dans l'environnement de soins à domicile est attendu.<br/>
    Les équipements de thérapie respiratoire à haut débit peuvent être:<br/>
    - des équipements EM entièrement intégrés; ou<br/>
    - une combinaison d'éléments séparés formant un système EM.<br/>
    Le présent document s'applique également à d'autres types d'équipements respiratoires lorsque ces équipements comportent un mode de thérapie respiratoire à haut débit.<br/>
    NOTE 2 Le présent document et l'ISO 80601-2-12 s'appliquent à un ventilateur de soins intensifs disposant d'un mode de thérapie à haut débit.<br/>
    NOTE 3 Le présent document et l'ISO 80601-2-72 s'appliquent à un ventilateur pour les patients ventilo‑dépendants dans un environnement des soins à domicile disposant d'un mode de thérapie à haut débit.<br/>
    NOTE 4 Le présent document et l'ISO 80601-2-13 s'appliquent à un poste de travail d'anesthésie disposant d'un mode de thérapie à haut débit.<br/>
    Les équipements de thérapie respiratoire à haut débit peuvent être opérationnels en déplacement.<br/>
    Le présent document s'applique également aux accessoires destinés par leur fabricant à être raccordés à un équipement de thérapie respiratoire à haut débit, les caractéristiques de ces accessoires pouvant avoir une incidence sur la sécurité de base ou sur les performances essentielles de l'équipement de thérapie respiratoire à haut débit.<br/>
    EXEMPLE 4 Systèmes respiratoires, raccords, humidificateur, filtre pour système respiratoire, source d'énergie électrique externe, système d'alarme réparti, canule nasale à débit élevé, sonde trachéale, canule de trachéotomie, masque facial et canule supralaryngée.<br/>
    NOTE 5 Les accessoires sont évalués dans les articles pertinents du présent document lorsqu'ils sont configurés dans le cadre d'un équipement de thérapie respiratoire à haut débit.<br/>
    Si un article ou un paragraphe est spécifiquement destiné à être appliqué uniquement aux appareils EM ou uniquement aux systèmes EM, le titre et le contenu dudit article ou paragraphe l'indiqueront. Si cela n'est pas le cas, l'article ou le paragraphe s'applique à la fois aux appareils EM et aux systèmes EM, selon le cas.<br/>
    Les dangers inhérents à la fonction physiologique prévue des appareils EM ou des systèmes EM dans le cadre du domaine d'application du présent document ne sont pas couverts par des exigences spécifiques contenues dans le présent document, à l'exception de la norme générale, 7.2.13 et 8.4.1.<br/>
    NOTE 6 Des informations supplémentaires sont disponibles dans la norme générale, 4.2.<br/>
    Le présent document ne spécifie pas les exigences relatives aux:<br/>
    - ventilateurs ou accessoires pour patients ventilo-dépendants prévus pour les applications en soins intensifs, qui sont données dans l'ISO 80601‑2‑12;<br/>
    - ventilateurs ou accessoires prévus pour les applications en anesthésie, qui sont données dans l'ISO 80601‑2‑13;<br/>
    - ventilateurs ou accessoires destinés à l'environnement des services médicaux d'urgence, qui sont données dans l'ISO 80601‑2‑84;<br/>
    - ventilateurs ou accessoires pour patients ventilo-dépendants dans l'environnement des soins à domicile, qui sont données dans l'ISO 80601‑2‑72;<br/>
    - équipements d'assistance ventilatoire ou accessoires destinés aux patients souffrant de troubles ventilatoires, qui sont données dans l'ISO 80601‑2‑79;<br/>
    - équipements d'assistance ventilatoire ou accessoires destinés aux patients souffrant d'insuffisance ventilatoire, qui sont données dans l'ISO 80601‑2‑80;<br/>
    - appareils EM de traitement de l'apnée du sommeil, qui sont données dans l'ISO 80601‑2‑70;<br/>
    - appareils EM délivrant une pression positive continue des voies aériennes (PPC);<br/>
    - ventilateurs à jet haute fréquence (VJHF)[31], qui sont données dans l'ISO 80601‑2‑87;<br/>
    - mélangeurs de gaz à usage médical, qui sont données dans l'ISO 11195;<br/>
    - débitmètres, qui sont données dans l'ISO 15002;<br/>
    - ventilateurs à oscillation haute fréquence (VOHF), qui sont données dans l'ISO 80601‑2‑87; et aux<br/>
    - équipements de ventilation de type cuirasse ou «poumon d'acier».<br/>
    Le présent document est une norme particulière dans les séries de normes IEC 60601, IEC 80601 et ISO 80601.
