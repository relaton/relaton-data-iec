abstract:
- language: en
  script: Latn
  content: |-
    IEC 60730-2-7:2026 applies to timers and time switches:<br/>
    - for use in, on, or in association with equipment for household appliance and similar use;<br/>
    NOTE 1 Throughout this document, the word "equipment" means "appliance and equipment" and "controls" means "timer or time switches".<br/>
    NOTE 2 Throughout this document, the word "timers" means timers and time switches, unless the type is specifically mentioned.<br/>
    - for building automation within the scope of ISO 16484 series and IEC 63044 series (HBES/BACS);<br/>
    - or equipment that is used by the public, such as equipment intended to be used in shops, offices, hospitals, farms and commercial and industrial applications;<br/>
    - that are smart enabled controls;<br/>
    - that are AC or DC powered controls with a rated voltage not exceeding 690 V AC or 600 V DC;<br/>
    - utilized as part of a control system or controls which are mechanically integral with multifunctional controls having non-electrical outputs;<br/>
    - as well as manual controls when such are electrically and/or mechanically integral with automatic controls.<br/>
    NOTE 3 Requirements for manually actuated mechanical switches not forming part of an automatic control are contained in IEC 61058-1-1.<br/>
    This document applies to<br/>
    - the inherent safety of timers and time switches, and<br/>
    - functional safety of timers and time switches and safety related systems,<br/>
    - timers and time switches where the performance (for example the effect of EMC phenomena) of the product can impair the overall safety and performance of the controlled system,<br/>
    - the operating values, operating times, and operating sequences where such are associated with equipment safety,<br/>
    - timers for appliances within the scope of IEC 60335 series.<br/>
    - manual controls when such are electrically and/or mechanically integral with timers.<br/>
    This document specifies the requirements for construction, operation and testing of timers and time switches used in, on, or in association with an equipment.<br/>
    This document does not<br/>
    - apply to time-delay switches (TDS) within the scope of IEC 60669-2-3;<br/>
    - include devices which only indicate time or passage of time;<br/>
    - apply to multi-functional controls having an integrated timing function which is not capable of being tested as a separate timing device.<br/>
    This fourth edition cancels and replaces the third edition published in 2015. This edition constitutes a technical revision.<br/>
    This edition includes the following significant technical changes with respect to the previous edition:<br/>
    adoption of IEC 60730-1:2022 (Ed.6.0) with all of its significant changes to IEC 60730 1:2010 (Ed.4).<br/>
    This part 2-7 is intended to be used in conjunction with IEC 60730-1. It was established on the basis of the sixth edition of that standard (2022). Consideration can be given to future editions of, or amendments to, IEC 60730 1.<br/>
    This part 2-7 supplements or modifies the corresponding clauses in IEC 60730-1, so as to convert that publication into the IEC standard: Particular requirements for timers and time switches.<br/>
    Where this part 2-7 states "addition", "modification" or "replacement", the relevant requirement, test specification or explanatory matter in part 1 should be adapted accordingly.<br/>
    Where no change is necessary, part 2-7 indicates that the relevant clause or subclause applies
- language: fr
  script: Latn
  content: |-
    L'IEC 60730-2-7:2026 s'applique aux minuteries et aux minuteries cycliques:<br/>
    - utilisées dans, sur ou avec des matériels pour appareils domestiques et à usage analogue;<br/>
    NOTE 1 Dans le présent document, le terme "matériel" signifie "appareil et matériel" et le terme "dispositifs de commande" signifie "minuteries ou minuteries cycliques".<br/>
    NOTE 2 Partout où il est utilisé dans le présent document, le terme "minuteries" signifie minuteries et minuteries cycliques, sauf si le type est clairement précisé.<br/>
    - pour l'automatisation des bâtiments qui relèvent du domaine d'application de la série ISO 16484 et de la série IEC 63044 (HBES/BACS);<br/>
    - pour des matériels utilisés par le public, tels que les matériels destinés à être utilisés dans des magasins, des bureaux, des hôpitaux, des fermes et des applications commerciales et industrielles;<br/>
    - qui sont des dispositifs de commande activés intelligents;<br/>
    - qui sont des dispositifs de commande à courant alternatif ou continu dont la tension assignée ne dépasse pas 690 V en courant alternatif ou 600 V en courant continu;<br/>
    - qui sont utilisés dans le cadre d'un système de commande ou de dispositifs de commande qui sont mécaniquement intégrés à des dispositifs de commande multifonctions comportant des sorties non électriques;<br/>
    ainsi qu'aux dispositifs de commande manuels qui sont électriquement et/ou mécaniquement intégrés à des dispositifs de commande automatique.<br/>
    NOTE 3 Les exigences relatives aux interrupteurs mécaniques à action manuelle qui ne font pas partie d'un dispositif de commande automatique sont contenues dans l'IEC 61058-1-1.<br/>
    Le présent document s'applique<br/>
    - à la sécurité intrinsèque des minuteries et des minuteries cycliques, et<br/>
    - à la sécurité fonctionnelle des minuteries et des minuteries cycliques et aux systèmes de sécurité,<br/>
    - aux minuteries et minuteries cycliques pour lesquelles les performances (par exemple, l'effet des phénomènes CEM) du produit peuvent compromettre la sécurité et les performances globales du système commandé,<br/>
    - aux valeurs de fonctionnement, aux temps de fonctionnement et aux séquences de fonctionnement lorsque ces éléments interviennent dans la sécurité du matériel,<br/>
    - aux minuteries destinées aux appareils relevant du domaine d'application de la série IEC 60335.<br/>
    - aux dispositifs de commande manuels qui sont électriquement et/ou mécaniquement intégrés à des minuteries.<br/>
    Le présent document spécifie les exigences relatives à la construction, au fonctionnement et aux essais des minuteries et minuteries cycliques utilisées dans, sur ou avec des matériels.<br/>
    Le présent document<br/>
    - ne s'applique pas aux interrupteurs temporisés (TDS, Time-Delay Switches) qui relèvent du domaine d'application de l'IEC 60669-2-3;<br/>
    - ne couvre pas les appareils qui n'indiquent que le temps ou le temps écoulé;<br/>
    - ne s'applique pas aux dispositifs de commande multifonctions dont la fonction de minuterie intégrée ne peut pas être soumise aux essais comme un dispositif de minuterie séparé.<br/>
    Cette quatrième édition annule et remplace la troisième édition parue en 2015. Cette édition constitue une révision technique.<br/>
    Cette édition inclut modifications techniques significatives suivantes par rapport à l'édition précédente:<br/>
    a) adoption de l'IEC 60730-1:2022 (Ed.6.0) avec toutes ses modifications significatives apportées à l'IEC 60730‑1:2010 (Ed.4).<br/>
    La présente partie 2-7 est destinée à être utilisée conjointement avec l'IEC 60730-1. Elle a été établie sur la base de la sixième édition de cette norme (2022). Les futures éditions de l'IEC 60730‑1 ou de ses amendements pourront être pris en considération.<br/>
    La présente partie 2-7 complète ou modifie les articles correspondants de l'IEC 60730-1, de façon à transformer cette publication en norme IEC: Exigences particulières pour les minuteries et les minuteries cycliques.<br/>
    Lorsque la présente partie 2-7 spécifie "addition", "modification" ou "remplacement", il convient d'adapter l'exigence, la modalité d'essai ou les commentaires correspondants de la Partie 1 en conséquence.<br/>
    Lorsqu'aucune modification n'est nécessaire, la partie 2-7 indique que l'article ou le paragraphe approprié s'applique.
