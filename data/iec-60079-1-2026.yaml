abstract:
- language: en
  script: Latn
  content: |-
    IEC 60079-1:2026 contains specific requirements for the construction and testing of Ex Equipment and Ex Components with the Type of Protection flameproof enclosure "d", intended for use in explosive gas atmospheres.<br/>
    This document supplements and modifies the general requirements of IEC 60079‑0. Where a requirement of this document conflicts with a requirement of IEC 60079‑0, the requirement of this document takes precedence.<br/>
    This eighth edition constitutes a technical revision. Refer to the Foreword of the document for a complete listing of the technical changes between edition 8.0 and the previous edition of the document.<br/>
    Users of this document are advised that interpretation sheets clarifying the interpretation of this document can be published. Interpretation sheets are available from the IEC webstore and can be found in the "history" tab of the page for each document.
- language: fr
  script: Latn
  content: |-
    L’IEC 60079-1:2026 contient les exigences spécifiques de construction et d’essai des appareils Ex et des composants Ex du mode de protection "d", destinés à être utilisé dans les atmosphères explosives gazeuses.<br/>
    Le présent document complète et modifie les exigences générales de l’IEC 60079-0. Si une exigence du présent document est en conflit avec une exigence de l’IEC 60079-0, l’exigence du présent document prévaut.<br/>
    Cette huitième édition constitue une révision technique. Reportez-vous à l'avant-propos du document pour une liste complète des modifications techniques entre l'édition 8.0 et édition précédente du document.<br/>
    Les utilisateurs du présent document sont informés que des fiches d’interprétation clarifiant son interprétation peuvent être publiées. Les fiches d’interprétation sont disponibles sur la boutique en ligne de l’IEC et peuvent être trouvées dans l’onglet "historique" sur la page de chaque document.
