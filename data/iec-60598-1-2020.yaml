abstract:
- language: en
  script: Latn
  content: |-
    IEC 60598-1:2020 specifies general requirements for luminaires, incorporating electric light sources for operation from supply voltages up to 1 000 V. The requirements and related tests of this document cover: classification, marking, mechanical construction, electrical construction and photobiological safety. This ninth edition cancels and replaces the eighth edition published in 2014 and Amendment 1:2017. This edition constitutes a technical revision. This edition includes the following significant technical changes with respect to the previous edition:<br/>
    - Revision of Clause 4.30, Fixing cover live parts of non-user replaceable light source;<br/>
    - Subclause 4.24.2, Blue Light Hazard: removal of Risk Group 0;<br/>
    - Subclause 5.2.16: additional requirements for AC mains appliance inlets related to IEC 61984;<br/>
    - Addition of Subclause 3.3.25, UV protection of cable;<br/>
    - Addition of Clause 4.34, Inclusion of EMF safety requirements (IEC 62493);<br/>
    - Revision of the requirements for functional earth and protective earth;<br/>
    - Addition of Clause 4.35, Protection against fast rotating parts;<br/>
    - Revision of Clause 3.2, Rated voltage marking;<br/>
    - Revision of Subclause 5.2.10, Cord anchorage;<br/>
    - Revision of Annex G for touch current and protective conductor current test set-up;<br/>
    - Addition of requirements for constant light output function and programmable current output;<br/>
    - Revision of Subclause 8.2.3 c), touch voltage limits for interrupted DC voltage;<br/>
    - Introduction of PELV;<br/>
    - Introduction of Ethernet power supply connection for luminaires (PoE);<br/>
    - Section 9, Introduction of IPX9;<br/>
    - Addition of Subclause 3.3.26 for wall mounted luminaires;<br/>
    - Revision of Annex D introducing alternative thermal tests for luminaires with ta marking higher than 25°C;<br/>
    - Revision of Table 10.3 and Subclause 3.3.19 for protective conductor current limits;<br/>
    - Track-mounted luminaires: cross reference to Annex A of IEC 60570:2003/AMD2:2019;<br/>
    - Revision of Subclause 10.2.2, alternative DC electric strength test;<br/>
    - Revision of Annex D for recessed luminaires;<br/>
    - Subclause 4.12.5: revision of Table 4.2 for torque test on metal glands;<br/>
    - Revision of use of bridging capacitors in luminaires;<br/>
    - Revision of electrical connection to class III plugs.<br/>
    The contents of the Interpretation sheet 1 (2023-08) have been included in this copy.
- language: fr
  script: Latn
  content: |-
    IEC 60598-1:2020, La présente Partie 1 de l’IEC 60598 spécifie pour les luminaires incorporant des sources lumineuses électriques, les exigences générales pour le fonctionnement à des tensions d'alimentation jusqu'à 1 000 V. Les exigences et les essais correspondants de ce document concernent: la classification, le marquage, la construction mécanique et électrique, ainsi que la sécurité photobiologique.<br/>
    Cette neuvième édition annule et remplace la huitième édition parue en 2014 et l'Amendement 1:2017. Cette édition constitue une révision technique.<br/>
    Cette édition inclut les modifications techniques majeures suivantes par rapport à l'édition précédente:<br/>
    a) Révision du Paragraphe 4.30 concernant la fixation d’une vasque au-dessus des parties actives d’une source lumineuse non remplaçable par l’utilisateur;<br/>
    b) Paragraphe 4.24.2, Danger rétinien lié à la lumière bleue: suppression du Groupe de risque 0;<br/>
    c) Paragraphe 5.2.16: ajout d’exigences relatives aux socles de connecteur réseau en courant alternatif conformes à l’IEC 61984;<br/>
    d) Ajout du Paragraphe 3.3.25 traitant de la protection anti-UV des câbles;<br/>
    e) Ajout du Paragraphe 4.34, Inclusion d’exigences de sécurité relatives aux EMF (electromagnetic fields – champs électromagnétiques) (IEC 62493);<br/>
    f) Révision des exigences relatives à la terre fonctionnelle et à la terre de protection;<br/>
    g) Ajout du Paragraphe 4.35, Protection contre les éléments en rotation rapide;<br/>
    h) Révision du Paragraphe 3.2 en ce qui concerne le marquage de la tension assignée;<br/>
    i) Révision du Paragraphe 5.2.10 concernant le dispositif d’arrêt de traction;<br/>
    j) Révision de l’Annexe G concernant le montage d’essai de courant de contact et de courant dans le conducteur de protection;<br/>
    k) Ajout d’exigences relatives à la fonction de flux lumineux constant et de courant de sortie programmable;<br/>
    l) Révision du Paragraphe 8.2.3 c) en ce qui concerne les limites de tension de contact pour la tension en courant continu interrompu;<br/>
    m) Inclusion de TBTP;<br/>
    n) Inclusion de la connexion des luminaires à l’alimentation électrique par câble Ethernet<br/>
    (PoE – Power over Ethernet)<br/>
    o) Section 9: inclusion de IPX9;<br/>
    p) Ajout du Paragraphe 3.3.26 pour les appliques murales;<br/>
    q) Révision de l’Annexe D introduisant des essais alternatifs d’échauffement pour luminaires ayant un marquage ta supérieur à 25 °C;<br/>
    r) Révision du Tableau 10.3 et du Paragraphe 3.3.19 relatifs aux limites de courant dans le conducteur de protection;<br/>
    s) Luminaires montés sur rail: renvoi à l’Annexe A de l’IEC 60570:2003/AMD2:2019;<br/>
    t) Révision du Paragraphe 10.2.2 pour l’essai alternatif de rigidité diélectrique en courant continu;<br/>
    u) Révision de l’Annexe D pour les luminaires encastrés;<br/>
    v) Paragraphe 4.12.5: révision du Tableau 4.2 relatif à l’essai de torsion sur les presse-étoupes métalliques;<br/>
    w) Révision de l’utilisation de condensateurs de pontage dans les luminaires;<br/>
    x) Révision de la connexion électrique à des fiches de classe III.<br/>
    La présente version bilingue (2021-07) correspond à la version anglaise monolingue publiée en 2020-08.<br/>
    Le contenu de la feuille d'interprétation 1 (2023-08) a été pris en considération dans cet exemplaire.
