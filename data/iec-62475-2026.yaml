abstract:
- language: en
  script: Latn
  content: |-
    IEC 62475:2026 is applicable to high-current testing and measurements on both high-voltage and low-voltage equipment. It deals with steady-state and short-time direct current (as e.g. encountered in high-power DC testing), steady-state and short-time alternating current (as e.g. encountered in high-power AC testing), and impulse-current. In general, currents above 100 A are considered in this International Standard, although currents less than this can occur in tests.<br/>
    This standard:<br/>
    • defines the terms used;<br/>
    • defines parameters and their tolerances;<br/>
    • describes methods to estimate uncertainties of high-current measurements;<br/>
    • states the requirements applicable to a complete measuring system;<br/>
    • describes the methods for approving a measuring system and checking its components;<br/>
    • describes the procedure by which the user shows that a measuring system meets the requirements of this document, including limits set for uncertainty of measurement.<br/>
    This standard also covers fault detection during, for example, lightning impulse testing.<br/>
    This second edition cancels and replaces the first edition published in 2010. This edition constitutes a technical revision.<br/>
    This edition includes the following significant technical changes with respect to the previous edition:<br/>
    • minor errors in edition 1 have corrected;<br/>
    • terms and definitions have been modified to achieve best possible adherence to IEC 60060‑2:2025 and have been ascribed appropriate [SOURCE];<br/>
    • terms and definitions which in edition 1 were presented in clauses other than Clause 3 have been moved into Clause 3.<br/>
    • Annex B, Clause B.4 has been amended to provide an example of uncertainty calculation for the use of an approved measuring system;<br/>
    • Clause C.2 has been deleted since the definitions given there are not referred to, with the exception of the origin of the step, which is used in Annex D. The applicable information has been added to Annex D as Note 1.<br/>
    • Annex G, Clause G.8 has been amended to replace “peak factor” by “a factor”. Texts have been clarified. Equations for relation between factor κ and cos ϕ have been developed to a simplified form.<br/>
    • Annex G, Clause G.9 has been added.
- language: fr
  script: Latn
  content: |-
    L'IEC 62475:2026 s'applique aux essais et mesures à haute intensité sur des matériels haute et basse tensions. Il couvre les essais à haute intensité en courant continu et courant alternatif en régime établi et de courte durée, ainsi que des essais de courant de choc. De manière générale, le présent document prend en compte des courants de plus de 100 A, même si des courantes d'intensité moindre peuvent être rencontrés lors des essais.<br/>
    La présente norme:<br/>
    • définit les termes utilisés;<br/>
    • définit les paramètres et leurs tolérances;<br/>
    • décrit des méthodes d'estimation des incertitudes de mesures à haute intensité;<br/>
    • détermine les exigences applicables à un système de mesure complet;<br/>
    • décrit les méthodes à utiliser pour qualifier un système de mesure et pour en contrôler les différents constituants;<br/>
    • décrit la procédure permettant à l'utilisateur de démontrer qu'un système de mesure respecte les exigences du présent document, y compris les limites établies pour l'incertitude de mesure.<br/>
    La présente norme couvre également la détection de défauts, par exemple dans le cadre d'essais aux chocs de foudre.<br/>
    Cette deuxième édition annule et remplace la première édition parue en 2010. Cette édition constitue une révision technique.<br/>
    Cette édition inclut les modifications techniques majeures suivantes par rapport à l'édition précédente:<br/>
    • des erreurs mineures dans l'édition 1 ont été corrigées;<br/>
    • les termes et définitions ont été modifiés afin de refléter au mieux l'IEC 60060‑2:2025 et la [SOURCE] correspondante leur a été attribuée;<br/>
    • les termes et définitions qui, dans l'édition 1, figuraient dans d'autres articles que l'Article 3 ont été déplacés à l'Article 3;<br/>
    • l'Article B.4 de l'Annexe B a été modifié pour fournir un exemple de calcul de l'incertitude pour l'utilisation d'un système de mesure approuvé;<br/>
    • l'Article C.2 a été supprimé, car les définitions qui y figuraient ne sont pas mentionnées, à l'exception de l'origine de l'échelon, qui est utilisée à l'Annexe D; les informations applicables ont été ajoutées à l'Annexe D sous la Note 1;<br/>
    • l'Article G.8 de l'Annexe G a été modifié pour remplacer "le facteur de crête" par "un facteur". Les textes ont été clarifiés. Les équations relatives à la relation entre le facteur κ et cos ϕ ont été développées sous une forme simplifiée;<br/>
    • l'Article G.9 a été ajouté à l'Annexe G.
