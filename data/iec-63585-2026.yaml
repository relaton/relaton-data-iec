abstract:
- language: en
  script: Latn
  content: |-
    IEC 63585:2026 This document gives guidelines to the transformer operator in evaluating dissolved gas analysis (DGA) data obtained from natural ester according to IEC 62770 and synthetic ester according to IEC 61099 in liquid filled transformers and similar equipment.<br/>
    This document includes the following:<br/>
    - gas generation in a natural and synthetic ester-filled transformer;<br/>
    - DGA interpretation methods;<br/>
    - gas concentration guide values valid for the use of DGA interpretation tools;<br/>
    - nterpretation of the dissolved gas analysis results;<br/>
    - recommended actions based on the interpretation of dissolved gas analysis results;<br/>
    - examples of faulty equipment.
- language: fr
  script: Latn
  content: |-
    IEC 63585:2026 Le présent document fournit des lignes directrices à l'opérateur de transformateur pour évaluer les données d'analyse des gaz dissous (AGD) obtenues à partir de transformateurs remplis de liquides à base d'ester naturel selon l'IEC 62770 et d'ester synthétique selon l'IEC 61099 et de matériels analogues.<br/>
    Le présent document comprend les éléments suivants:<br/>
    - production de gaz dans un transformateur rempli d'esters naturels ou synthétiques;<br/>
    - valeurs indicatives de concentration de gaz valables pour l'utilisation d'outils d'interprétation de l'AGD;<br/>
    - méthodes pour l’interprétation des résultats des gaz dissous;<br/>
    - actions recommandées en fonction de l'interprétation des résultats de l'analyse des gaz dissous;<br/>
    - exemples de matériels défectueux.
