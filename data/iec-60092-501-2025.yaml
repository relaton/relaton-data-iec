abstract:
- language: en
  script: Latn
  content: |-
    IEC 60092-501:2025 applies to electric propulsion plants and specifies system design, installation and testing for equipment such as:<br/>
    - generators and their prime movers or other power sources (fuel cell, battery, …);<br/>
    - switchboards;<br/>
    -transformers/reactors;<br/>
    - semiconductor converters;<br/>
    - propulsion motors;<br/>
    - excitation systems;<br/>
    - control, monitoring and safety systems;<br/>
    - wires, cables, busbars or trunking systems;<br/>
    - podded drives including azimuth.<br/>
    Thrusters intended either as auxiliary steering or auxiliary propulsion devices or both and booster equipment are excluded.<br/>
    This sixth edition cancels and replaces the fifth edition published in 2013. This edition constitutes a technical revision.<br/>
    This edition includes the following significant technical changes with respect to the previous edition:<br/>
    a) addition of podded drives including azimuth in the scope;<br/>
    b) addition of alternative power sources;<br/>
    c) modification of the special requirements for ships with only one propulsion motor;<br/>
    d) new definition for test of slip ring units;<br/>
    e) modification of Figure 2 and description;<br/>
    f) addition of a description of power management functions;<br/>
    g) addition of emergency stop at control stations;<br/>
    h) clearer start blockings;<br/>
    i) deletion of Table A.2, Table A.3 and Table A.4 in Annex A. Their content has been moved to Table 1.
