abstract:
- language: en
  script: Latn
  content: IEC 61076-2-117:2026 This part covers shielded and unshielded, free and
    fixed circular connectors without breaking capacity (COC) for power, signal and
    data transmission, and specifies the common dimensions, mechanical, electrical
    and transmission characteristics and environmental requirements as well as test
    specifications, respectively.
- language: fr
  script: Latn
  content: IEC 61076-2-117:2026 La présente partie couvre les fiches et embases circulaires
    écrantées et non écrantées sans pouvoir de coupure (COC) pour la transmission
    de puissance, de signaux et de données et spécifie respectivement les dimensions
    communes, les caractéristiques mécaniques, électriques et de transmission, les
    exigences environnementales, ainsi que les spécifications d’essai.
