abstract:
- language: en
  script: Latn
  content: |-
    IEC 60704-2-13:2023 applies to cooking fume extractors for household and similar use intended for filtering the air of a room or for exhausting the air out of a room, including their accessories and their component parts. It also applies to cooking fume extractors where the fan is mounted separately from the appliance inside or outside of the room where the appliance is located, but controlled by the appliance when the fan is defined in the technical documentation. This document deals also with down-draft systems that are arranged beside, behind or under the cooking appliance.<br/>
    Measurements carried out in accordance with this document determine the noise emission into the room, from which cooking fumes are extracted. Noise emission to the outside (e.g. through air ducts) are not considered.<br/>
    This fourth edition cancels and replaces the third edition published in 2016. This edition constitutes a technical revision.<br/>
    This edition includes the following significant technical changes with respect to the previous edition:<br/>
    a) alignment with IEC 61591:2023;<br/>
    b) change of title, scope and definitions 3.103 and 3.104: this document deals with cooking fume extractors (this covers range hoods and down-draft systems);<br/>
    c) exhaust pipe of down-draft systems specified;<br/>
    d) built-in range hoods in recirculation mode with an air outlet device specified;<br/>
    e) alignment with IEC 60704-1:2021.<br/>
    This document is to be used in conjunction with IEC 60704-1:2021.
- language: fr
  script: Latn
  content: |-
    L'IEC 60704-2-13:2023 s'applique aux extracteurs de fumée de cuisine pour usages domestiques et analogues, destinés à recycler l'air de la pièce ou à évacuer l'air hors de la pièce, y compris leurs accessoires et leurs composants. Elles s'appliquent également aux extracteurs de fumée de cuisine dans lesquels le ventilateur est monté séparément de l'appareil, à l'intérieur ou à l'extérieur de la pièce dans laquelle est installé l'appareil, mais est commandé par l'appareil lorsque le ventilateur est défini dans la documentation technique. Le présent document couvre également les extracteurs verticaux qui sont installés à côté, à l'arrière ou au-dessous de l'appareil de cuisson.<br/>
    Les mesurages effectués conformément au présent document permettent de déterminer les émissions sonores dans la pièce à partir de laquelle sont extraites les fumées de cuisson. Les émissions sonores vers l'extérieur (à travers les conduits d'air, par exemple) ne sont pas prises en compte.<br/>
    Cette quatrième édition annule et remplace la troisième édition parue en 2016. Cette édition constitue une révision technique.<br/>
    Cette édition inclut les modifications techniques majeures suivantes par rapport à l'édition précédente:<br/>
    a) alignement sur l'IEC 61591:2023;<br/>
    b) modification du titre, du domaine d'application et des définitions 3.103 et 3.104: le présent document traite des extracteurs de fumée de cuisine (ce qui comprend les hottes de cuisine et les extracteurs verticaux);<br/>
    c) spécification du tuyau d'évacuation des extracteurs verticaux;<br/>
    d) hottes intégrées en mode recyclage, équipées d'un dispositif de sortie d'air spécifié ;<br/>
    e) alignement sur l’IEC 60704-1:2021.<br/>
    La présente Norme internationale doit être utilisée conjointement avec l'IEC 60704-1:2021.
