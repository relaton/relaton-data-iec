abstract:
- language: en
  script: Latn
  content: |-
    This pack contains IEC 60335-2-97:2023 EXV and IEC 60355-2-97:2023 CMV.<br/>
    <br/>
    IEC 60335-2-97:2023 deals with the safety of electric drives for shutters, blinds and awnings, intended for household and similar purposes, their rated voltage being not more than 250 V for single-phase drives and 480 V for other drives, including direct current (DC) supplied appliances and battery-operated appliances.<br/>
    Examples of equipment that can be driven are<br/>
    – spring controlled folding arm awnings;<br/>
    – curtains;<br/>
    – grilles covering doors and windows;<br/>
    – projection screens;<br/>
    – shutters covering doors and windows;<br/>
    – draperies.<br/>
    Drives can be supplied with a driven part.<br/>
    Drives not intended for normal household use but that nevertheless can be a source of danger to the public, such as drives intended to be used by laymen in shops, in light industry, on farms and on industrial premises, are within the scope of this standard.<br/>
    As far as is practicable, this standard deals with the common hazards presented by drives that are encountered by all persons in and around the home. However, in general, it does not take into account<br/>
    – persons (including children) whose physical, sensory or mental capabilities; or lack of experience and knowledge prevents them from using the drive safely without supervision or instruction;<br/>
    – children playing with the drive.<br/>
    For appliances intended to be used in vehicles or on board ships or aircraft, additional requirements can be necessary. In many countries, additional requirements are specified by the national health authorities, the national authorities responsible for the protection of labour, the national water supply authorities and similar authorities.<br/>
    This standard does not apply to<br/>
    – drives intended to be used in locations where special conditions prevail, such as the presence of a corrosive or explosive atmosphere (dust, vapour or gas);<br/>
    – drives for vertically moving garage doors for residential use (IEC 60335-2-95);<br/>
    – drives for gates, doors and windows (IEC 60335-2-103);<br/>
    – drives used in premises such as hangars or in heavy industry;<br/>
    – drives for theatre curtains.<br/>
    This fourth edition cancels and replaces the third edition published in 2016 and Amendment 1: 2019. This edition constitutes a technical revision.<br/>
    This edition includes the following significant technical changes with respect to the previous edition:<br/>
    a) the text has been aligned with IEC 60335-1:2020;<br/>
    b) scope includes DC-supplied appliances and battery-operated appliances (Clause 1);<br/>
    c) some notes have been converted to normative text (Clause 1, 5.10, 20.101, 20.103);<br/>
    d) use of artificial loads is introduced (5.10);<br/>
    e) application of test probe 19 has been introduced (8.1.1, 20.2);<br/>
    f) addition of surface temperatures for external accessible surfaces (11.3, 11.8);<br/>
    g) requirements are added for drives intended for permanent connection delivered with a connector to ease the installation (22.102, 24.1.101, 25.3);<br/>
    h) clarification for connectors that are non-detachable once engaged (24.1.5).<br/>
    i) added requirements for instructions for parts of class III construction supplied from a detachable power supply part (7.12, 7.12.1).<br/>
    This part 2 is to be used in conjunction with the latest edition of IEC 60335-1 and its amendments unless that edition precludes it; in that case, the latest edition that does not preclude it is used. It was established on the basis of the sixth edition (2020) of that standard.
