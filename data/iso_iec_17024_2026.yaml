abstract:
- content: <p>This document specifies principles and requirements for a body operating
    certification of persons and includes the development and maintenance of a scheme
    for certification of persons.</p><p>NOTE 1 For the purposes of this document,
    the term "certification body" is used in place of the full term " body operating
    certification of persons", and the term "certification scheme" is used in place
    of the full term “scheme for certification of persons”.</p><p>NOTE 2 Annex A contains
    principles for certification of persons.</p>
  language:
  - en
  script:
  - Latn
  format: text/html
- content: <p>Le présent document spécifie des principes et des exigences destinés
    à un organisme qui procède à la certification de personnes et relatifs à l’élaboration
    et au maintien d’un système particulier de certification de personnes.</p><p>NOTE
    1 Pour les besoins du présent document, le terme «organisme de certification»
    est utilisé à la place du terme complet «organisme procédant à la certification
    de personnes» et le terme «système particulier de certification» est utilisé à
    la place du terme complet «système particulier de certification de personnes».</p><p
    class="Note">NOTE 2 L’Annexe A contient les principes de certification des personnes.</p>
