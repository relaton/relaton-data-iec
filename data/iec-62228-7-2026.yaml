abstract:
- language: en
  script: Latn
  content: |-
    IEC 62228-7:2026 specifies test and measurement methods for the EMC evaluation of CXPI transceiver ICs under network condition. It defines test configurations, test conditions, test signals, failure criteria, test procedures, test setups and test boards. This specification is applicable for standard CXPI transceiver ICs and ICs with embedded CXPI transceiver and covers:<br/>
    - the emission of RF disturbances;<br/>
    - the immunity against RF disturbances;<br/>
    - the immunity against impulses;<br/>
    - the immunity against electrostatic discharges (ESD).<br/>
    This edition includes the following significant technical changes with respect to the previous edition:<br/>
    a) change transceiver terms and definitions from master to commander and slave to responder in 3.1.5 and 3.1.6.<br/>
    b) change test configuration for embedded transceiver in 5.3.1 and add on Figure A.4 accordingly.<br/>
    c) change the definition of TX2 test signal for Type-B transceiver in 5.4.2.<br/>
    d) add examples for test limits in Annex C.
- language: fr
  script: Latn
  content: |-
    L'IEC 62228-7:2026 spécifie les méthodes d'essai et de mesure pour l'évaluation de la compatibilité électromagnétique (CEM) des circuits intégrés émetteurs-récepteurs CXPI placés en réseau. Elle définit les configurations d'essai, les conditions d'essai, les signaux d'essai, les critères de défaillance, les modes opératoires d'essai, les montages d'essai et les cartes d'essai. La présente spécification s'applique aux circuits intégrés émetteurs-récepteurs CXPI standard et aux circuits intégrés avec émetteur-récepteur CXPI intégré, et couvre:<br/>
    - l'émission de perturbations radioélectriques,<br/>
    - l'immunité aux perturbations radioélectriques,<br/>
    - l'immunité aux transitoires électriques,<br/>
    - l'immunité aux décharges électrostatiques (DES).<br/>
    Cette édition inclut les modifications techniques majeures suivantes par rapport à l'édition précédente:<br/>
    a) modification des termes et définitions de l'émetteur-récepteur de "principal" à "de commande" et de "subordonné" à "de réponse" en 3.1.5 et 3.1.6,<br/>
    b) modification de la configuration d'essai pour l'émetteur-récepteur intégré en 5.3.1 et ajout dans la Figure A.4 en conséquence,<br/>
    c) modification de la définition du signal d'essai TX2 pour l'émetteur-récepteur de type B en 5.4.2,<br/>
    d) ajout d'exemples de limites d'essai à l'Annexe C.
