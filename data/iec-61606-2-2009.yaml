abstract:
- language: en
  script: Latn
  content: |-
    IEC 61606-2:2009 is applicable to the basic measurement methods of the audio characteristics of the digital audio part of audio and audiovisual equipment for consumer use. It specify conditions and methods of measurement for consumer equipment.The common measuring conditions and methods are described in IEC 61606-1. It constitutes a technical revision. The significant technical changes with respect to the first edition are the following:<br/>
    - changed the period of preconditioning;<br/>
    - add A weighting filter in measuring instruments;<br/>
    - correct the wrong reference number;<br/>
    - some inappropriate descriptions have been improved.<br/>
    This publication is to be read in conjunction with IEC 61606-1:2009.
- language: fr
  script: Latn
  content: |-
    L'IEC 61606-2:2009 est applicable aux méthodes fondamentales pour la mesure des caractéristiques audio de la partie audionumérique des équipements audio et audiovisuels destinés à l'usage grand public.<br/>
    Les conditions et les méthodes de mesure communes sont décrites par l’IEC 61606-1. La présente Norme internationale spécifie les conditions et les méthodes de mesure relatives aux équipements grand public.<br/>
    L'IEC 61606-2:2009 annule et remplace la première édition publiée en 2003. Elle constitue une révision technique.<br/>
    Les modifications techniques majeures par rapport à la première édition sont les suivantes:<br/>
    - modification de la période de préconditionnement;<br/>
    - adjonction d'un filtre de pondération A dans les appareils de mesure;<br/>
    - correction du numéro de référence erroné;<br/>
    - certaines descriptions inadaptées ont été améliorées.
