abstract:
- language: en
  script: Latn
  content: IEC 60076-4:2026 applies to lightning and switching impulse tests on power
    transformers and reactors. Information is given on waveforms, test circuits including
    test connections, earthing practices, failure detection methods, test procedures,
    measuring techniques and interpretation of results.
- language: fr
  script: Latn
  content: L'IEC 60076-4:2026 s'applique aux essais au choc de foudre et au choc de
    manœuvre des transformateurs de puissance et des bobines d'inductance. Des informations
    sont données sur les formes d'onde, les circuits d'essai comprenant les connexions
    d'essai, les pratiques de mise à la terre, les méthodes de détection de défaillance,
    les méthodes d'essai, les techniques de mesure et l'interprétation des résultats.
