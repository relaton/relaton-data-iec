abstract:
- language: en
  script: Latn
  content: |-
    <p>The document specifies doctype, namespace and a set of data elements for digital UAS or drone licences (or training certificates) supporting mdoc data model specified in ISO/IEC 18013-5 and ISO/IEC TS 23220-2. This document is also applicable for any remote pilot licences or training certificates issued by aviation authorities.</p>
    <p>This document does not specify either licence categories and licence conditions and is designed to define any domestic licences and training certificates by defining domestic namespaces in accordance with each region and/or state’s regulations.</p>
    <p>The digital UAS or drone licence data specified in this document is applicable to mdoc application as defined in ISO/IEC 23220-1 and transmission protocol specified in ISO/IEC 18013-5, ISO/IEC TS 18013-7 and ISO/IEC TS 23220-4.</p>
