abstract:
- language: en
  script: Latn
  content: |-
    IEC 61300-2-2:2026 evaluates the effects of a number of successive cycles of mating and un-mating of fibre optic connectors or other interconnecting devices on optical performance and mechanical degradation of the component under normal usage conditions.<br/>
    This edition includes the following significant technical changes with respect to the previous edition:<br/>
    a) definition of the mating durability test also for a plug-receptacle configuration of the device under test (DUT);<br/>
    b) deletion of measurement condition B;<br/>
    c) definition of a unique measurement condition;<br/>
    d) addition of performance categories in the severities;<br/>
    e) introduction of new severity levels for connectors and hardened connectors;<br/>
    f) definition of new cleaning criteria during mating durability test;<br/>
    g) deletion of performance category E in the severities.
- language: fr
  script: Latn
  content: |-
    L’IEC 61300 est d'évaluer les effets d'un certain nombre de cycles successifs d'accouplements et de désaccouplements de connecteurs ou d'autres dispositifs d'interconnexion fibroniques sur les performances optiques et la dégradation mécanique d'un composant dans des conditions d'utilisation normales.<br/>
    Cette édition inclut les modifications techniques significatives suivantes par rapport à l'édition précédente:<br/>
    a) définition de l'essai de durabilité de l'accouplement également pour une configuration fiche - embase du dispositif en essai (DUT);<br/>
    b) suppression de la condition de mesure B;<br/>
    c) définition d'une condition de mesure unique;<br/>
    d) ajout de catégories de performance dans les sévérités;<br/>
    e) introduction de nouveaux niveaux de sévérité pour les connecteurs et les connecteurs durcis;<br/>
    f) définition de nouveaux critères de nettoyage pendant l'essai de durabilité de l'accouplement;<br/>
    g) suppression de la catégorie de performance E dans les sévérités.
