abstract:
- language: en
  script: Latn
  content: |-
    IEC 61760-1:2026 defines requirements for component specifications of electronic components that are intended for usage in surface mounting technology. To this end, it specifies a reference set of process conditions and related test conditions to be considered when compiling component specifications. The objective of this document is to ensure that a wide variety of SMDs can be subjected to the same placement, mounting and subsequent processes (e.g. cleaning, inspection) during assembly. This document defines tests and requirements that are included in any SMD component’s general, sectional or detail specification. In addition, this document provides component users and manufacturers with a reference set of typical process conditions used in surface mounting technology. Some of the requirements for component specifications in this document are also applicable to components with leads intended for mounting on a circuit board, including solderless interconnection technology. Cases for which this is appropriate are indicated in the relevant subclauses.<br/>
    NOTE Solderless interconnection technology refers to a mounting method which is not part of the surface-mounting process and the components do not undergo a soldering operation. Such components are included in this document because the mounting of components for solderless interconnection commonly occurs after the mounting of SMDs.<br/>
    This edition includes the following significant technical changes with respect to the previous edition:<br/>
    a) added new subclause 4.2 - Classification of electronic assemblies;<br/>
    b) added new subclause 4.4.8 - Creepage and clearance distances - Insulation coordination;<br/>
    c) added new subclause 4.9 - Thermal and electrical performance;<br/>
    d) updated Clause 6 - Soldering: now including requirements related to application of low temperature solders;<br/>
    e) added new subclause 6.2.2 - Commonly used solder alloys;<br/>
    f) updated subclause 6.3.6 - Resistance to vacuum during soldering;<br/>
    g) updated subclause 6.3.7 - Resistance to cleaning media and processes - now includes the tests in IEC 60068-2-88, Tests - Test XD: Resistance of components and assemblies to liquid cleaning media;<br/>
    h) added new subclause 6.3.9 - Rework of soldered components;<br/>
    i) added new Annex B - Sustainability.
- language: fr
  script: Latn
  content: |-
    L'IEC 61760-1:2026 définit les exigences relatives aux spécifications des composants électroniques destinés à être utilisés dans la technologie de montage en surface. À cette fin, elle spécifie un ensemble de référence de conditions de procédé et de conditions d'essai associées à prendre en compte lors de l'élaboration des spécifications des composants. L'objectif du présent document est de s'assurer qu'une grande variété de CMS peut être soumise au même placement, au même montage et aux mêmes processus ultérieurs (par exemple, nettoyage, inspection) pendant l'assemblage. Le présent document définit les essais et les exigences qui sont inclus dans la spécification générale, intermédiaire ou particulière d'un composant de CMS. En outre, le présent document fournit aux utilisateurs et aux fabricants de composants un ensemble de référence de conditions de processus types utilisées dans la technologie de montage en surface. Certaines des exigences relatives aux spécifications des composants du présent document sont également applicables aux composants avec des sorties destinées à être montées sur une carte de circuit imprimé, y compris la technologie d'interconnexion sans soudure. Les cas pour lesquels cela est approprié sont indiqués dans les paragraphes correspondants.<br/>
    NOTE La technologie d'interconnexion sans soudure fait référence à une méthode de montage qui ne fait pas partie du processus de montage en surface et les composants ne subissent pas d'opération de brasage. Ces composants sont inclus dans le présent document car le montage des composants pour l'interconnexion sans soudure se produit généralement après le montage des CMS.<br/>
    Cette édition inclut les modifications techniques majeures suivantes par rapport à l'édition précédente:<br/>
    a) ajout d’un nouveau paragraphe 4.2 - Classification des ensembles électroniques;<br/>
    b) ajout d’un nouveau paragraphe 4.4.8 - Lignes de fuite et distances d’isolement - Coordination de l’isolement;<br/>
    c) ajout d’un nouveau paragraphe 4.9 - Performances thermiques et électriques;<br/>
    d) mise à jour de l’article 6 - Brasage (contient désormais des exigences concernant l’application de brasage à basse température);<br/>
    e) ajout d’un nouveau paragraphe 6.2.2 - Alliages à braser couramment utilisés;<br/>
    f) mise à jour du paragraphe 6.3.6 - Résistance au vide pendant le brasage;<br/>
    g) mise à jour du paragraphe 6.3.7 - Résistance aux produits et procédés de nettoyage (contient désormais les tests décrits dans l’IEC 60068-2-88, Essais - Essai XD: résistance des composants et des assemblages aux produits de nettoyage liquides);<br/>
    h) ajout d’un nouveau paragraphe 6.3.9 - Reprise des composants brasés;<br/>
    i) ajout d’une nouvelle Annexe B - Durabilité.
