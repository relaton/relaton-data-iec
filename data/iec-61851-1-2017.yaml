abstract:
- language: en
  script: Latn
  content: |-
    IEC 61851-1:2017 applies to EV supply equipment for charging electric road vehicles, with a rated supply voltage up to 1 000 V AC or up to 1 500 V DC and a rated output voltage up to 1 000 V AC or up to 1 500 V DC. Electric road vehicles (EV) cover all road vehicles, including plug-in hybrid road vehicles (PHEV), that derive all or part of their energy from on-board rechargeable energy storage systems (RESS). The aspects covered in this standard include:<br/>
    - the characteristics and operating conditions of the EV supply equipment;<br/>
    - the specification of the connection between the EV supply equipment and the EV;<br/>
    - the requirements for electrical safety for the EV supply equipment.<br/>
    This third edition cancels and replaces the second edition published in 2010. It constitutes a technical revision.<br/>
    This edition includes the following significant technical changes with respect to the previous edition:<br/>
    a) The contents of IEC 61851-1:2010 have been re-ordered. Numbering of clauses has changed as new clauses were introduced and some contents moved for easy reading. The following lines give an insight to the new ordering in addition to the main technical changes.<br/>
    b) All requirements from IEC 61851-22 have been moved to this standard, as work on IEC 61851-22 has ceased.<br/>
    c) Any requirements that concern EMC have been removed from the text and are expected to be part of the future version of 61851-21-2.<br/>
    d) Clause 4 contains the original text from IEC 61851-1:2010 and all general requirements from Clause 6 of IEC 61851-1:2010.<br/>
    e) Clause 5 has been introduced to provide classifications for EV supply equipment.<br/>
    f) Previous general requirements of Clause 6 have been integrated into Clause 4. Clause 6 contains all Mode descriptions and control requirements. Specific requirements for the combined use of AC and DC on the same contacts are included.<br/>
    g) Clause 9 is derived from previous Clause 8. Adaptation of the description of DC accessories to allow for the DC charging modes that have only recently been proposed by industry and based on the standards IEC 61851-23, IEC 61851-24 as well as IEC 62196-1, IEC 62196-2 and IEC 62196-3. Information and tables contained in the IEC 62196 series standards have been removed from this standard.<br/>
    h) Clause 10 specifically concerns the requirements for adaptors, initially in Clause 6.<br/>
    i) Clause 11 includes new requirements for the protection of the cable.<br/>
    j) Specific requirements for equipment that is not covered in the IEC 62752 remain in the present document.<br/>
    k) Previous Clause 11 is now treated in Clauses 12 to 13. The requirements in 61851-1 cover the EV supply equipment of both mode 2 and mode 3 types, with the exception in-cable control and protection devices for mode 2 charging of electric road vehicles (IC-CPD) which are covered by IEC 62752.<br/>
    l) Clause 14 gives requirements on automatic reclosing of protection equipment.<br/>
    m) Clause 16 gives requirements for the marking of equipment and the contents of the installation and user manual. This makes specific mention of the need to maintain coherence with the standards for the fixed installation. It also contains an important text on the markings for temperature ratings.<br/>
    n) Annex A has been reviewed to introduce complete sequences and tests and to make the exact cycles explicit. Annex A in this edition supersedes IEC TS 62763 (Edition 1).<br/>
    o) Annex B is normative and has requirements for proximity circuits with and without current coding.<br/>
    p) Previous Annex C has been removed and informative descriptions of pilot function and proximity function implementations initially in Annex B are moved to Annex C.<br/>
    q) New informative Annex D describing an alternative pilot function system has been introduced.<br/>
    r) Dimensional requirements for free space to be left around socket-outlets used for EV energy supply are given in the informative Annex E.<br/>
    s) The inclusion of protection devices within the EV supply equipment could, in some cases, contribute to the protection against electric shock as required by the installation. This is covered by the information required for the installation of EV supply equipment in Clause 16 (Marking).<br/>
    The contents of the corrigendum of November 2023 have been included in this copy.
- language: fr
  script: Latn
  content: |-
    L'IEC 61851-1:2017 s'applique au système d’alimentation pour VE destiné à charger les véhicules routiers électriques, avec une tension assignée d’alimentation jusqu'à 1 000 V en courant alternatif ou 1 500 V en courant continu, et une tension de sortie assignée jusqu'à 1 000 V en courant alternatif ou 1 500 V en courant continu. Les véhicules routiers électriques (VE) couvrent l'ensemble des véhicules routiers, y compris les véhicules routiers hybrides rechargeables (PHEV), qui tirent tout ou partie de leur énergie des systèmes de stockage d'énergie rechargeable à bord du véhicule (RESS). La présente Norme couvre les aspects suivants:<br/>
    - les caractéristiques et conditions de fonctionnement du système d'alimentation pour VE;<br/>
    - la spécification de la connexion entre le système d'alimentation pour VE et le VE;<br/>
    - les exigences relatives à la sécurité électrique du système d'alimentation pour VE.<br/>
    Cette troisième édition annule et remplace la deuxième édition parue en 2010. Cette édition constitue une révision technique. Cette édition inclut les modifications techniques majeures suivantes par rapport à l'édition précédente:<br/>
    a) Le contenu de l'IEC 61851-1:2010 a été réorganisé. La numérotation des articles a été modifiée, de nouveaux articles ayant été introduits et du contenu ayant été retiré pour faciliter la lecture. Les lignes suivantes donnent un aperçu de la nouvelle organisation en plus des modifications techniques majeures apportées.<br/>
    b) Toutes les exigences de l'IEC 61851-22 ont été reprises dans la présente Norme, le travail sur l'IEC 61851-22 ayant cessé.<br/>
    c) Toutes les exigences relatives à la compatibilité électromagnétique (CEM) ont été supprimées et font partie intégrante de la future version de l'IEC 61851-21-2.<br/>
    d) L'Article 4 contient le texte original de l'IEC 61851-1:2010 et toutes les exigences générales de l'Article 6 de l'IEC 61851-1:2010.<br/>
    e) L'Article 5 a été introduit pour fournir les classifications du système d’alimentation pour VE.<br/>
    f) Les exigences générales précédentes de l'Article 6 ont été intégrées dans l'Article 4. L'Article 6 contient toutes les descriptions de mode et exigences de commande. Les exigences spécifiques relatives à l'utilisation combinée du courant alternatif et du courant continu sur les mêmes contacts sont incluses.<br/>
    g) L'Article 9 est déduit du précédent Article 8. Adaptation de la description des accessoires en courant continu afin d'autoriser les modes de charge en courant continu qui n'ont été que récemment proposés par le secteur industriel et qui s'appuient sur les Normes IEC 61851-23, IEC 61851-24, IEC 62196-1, IEC 62196-2 et IEC 62196-3. Les informations et tableaux de la série IEC 62196 ont été supprimés de la présente norme.<br/>
    h) L'Article 10 concerne particulièrement les exigences relatives aux adaptateurs, spécifiées à l'origine à l'Article 6.<br/>
    i) L'Article 11 contient de nouvelles exigences relatives à la protection du câble.<br/>
    j) Les exigences spécifiques relatives aux équipements non couverts par l'IEC 62752 sont conservées dans le présent document.<br/>
    k) Le précédent Article 11 est désormais traité dans les Articles 12 à 13. Les exigences spécifiées dans l'IEC 61851-1 portent sur les systèmes d'alimentation pour VE Mode 2 et Mode 3, à l'exception des appareils de contrôle et de protection intégrés au câble pour la charge en mode 2 des véhicules routiers électriques (IC-CPD), qui sont couverts par l'IEC 62752.<br/>
    l) L'Article 14 donne les exigences relatives au réenclenchement automatique des dispositifs de protection.<br/>
    m) L'Article 16 donne les exigences relatives au marquage des équipements et au contenu du manuel d'installation et de l'utilisateur. Il souligne particulièrement la nécessité de maintenir la cohérence avec les normes relatives aux installations fixes. Il contient également un texte important sur les marquages des caractéristiques assignées de température.<br/>
    n) L'Annexe A a été révisée de manière à introduire les séquences et essais complets et expliciter les cycles exacts.L'Annexe A de cette édition templace l'IEC TS 62736 (Edition 1).<br/>
    o) L'Annexe B est normative. Elle contient des exigences relatives aux circuits de proximité avec et sans codage de courant.<br/>
    p) La précédente Annexe C a été supprimée, les descriptions informatives des mises en œuvre de la fonction pilote et de fonction de proximité de l'Annexe B ayant été déplacées vers l'Annexe C.<br/>
    q) Une nouvelle Annexe D informative a été introduite. Elle décrit un autre système de fonction pilote.<br/>
    r) Les exigences de dimension de l'espace libre à prévoir autour des socles de prise de courant utilisés pour l'alimentation du VE sont données à l'Annexe E informative.<br/>
    s) L'introduction de dispositifs de protection dans le système d’alimentation pour VE peut, dans certains cas, contribuer à la protection contre les chocs électriques, comme exigé par l'installation. Ce sujet est couvert par les informations exigées pour l'installation du système d'alimentation pour VE à l'Article 17 (Marquage).<br/>
    Le contenu du corrigendum de novembre 2023 a été pris en considération dans cet exemplaire.
