abstract:
- language: en
  script: Latn
  content: |-
    IEC 61892-5:2019 specifies additional characteristics for electrical installations in mobile units.<br/>
    It applies to installations that depend on buoyancy, such as column-stabilized units (semi­submersible units), ship- or barge-type units as well as self-elevating units. It specifies additional characteristics for such units, used during transfer from one location to another and for drilling, production, accommodation, processing, storage and offloading purposes.<br/>
    It applies to all installations, whether permanent, temporary, transportable or hand-held, to AC installations and DC installations without any limitation on voltage level. Referenced equipment standards may give voltage level limitations.<br/>
    This document specifies requirements such as those concerning<br/>
    – environmental conditions,<br/>
    – limits of inclination for the unit where the equipment is required to operate,<br/>
    – bilge pumps,<br/>
    – navigation and obstruction lights,<br/>
    – steering gear,<br/>
    – ballast system,<br/>
    – jacking systems, and<br/>
    – anchoring systems.<br/>
    For electric propulsion, reference is made to IEC 60092-501.<br/>
    For dynamic positioning systems, reference is made to relevant IMO requirements.<br/>
    This document does not apply to<br/>
    – fixed equipment for medical purposes,<br/>
    – electrical installations of tankers, and<br/>
    – control of ignition sources other than those created by electrical equipment.<br/>
    This fourth edition cancels and replaces the third edition published in 2014. This edition constitutes a technical revision.<br/>
    This edition includes the following significant technical change with respect to the previous edition:<br/>
    a) the technical requirements as to electric propulsion have been replaced with a reference to IEC 60092-501:2013;<br/>
    b) the requirement for handrails on main and emergency switchboards has been added;<br/>
    c) requirements as to control systems and indicators for watertight doors and hatch covers have been made more specific;<br/>
    d) requirements concerning the holding capacity for jacking systems have been rewritten;<br/>
    e) requirements as to thruster-assisted mooring system have been rewritten;<br/>
    f) the annex regarding enhanced system verification (HIL test) for dynamic positioned mobile units has been relocated to IEC 61892-2:2019.
- language: fr
  script: Latn
  content: |-
    L'IEC 61892-5:2019 spécifie des caractéristiques supplémentaires pour les installations électriques dans les unités mobiles.<br/>
    Elle s'applique aux installations pour lesquelles la flottabilité est essentielle, comme les unités stabilisées de type colonnes (unités semi-submersibles), les unités de type navire ou barge, ainsi que les unités autoélévatrices. Elle spécifie les caractéristiques supplémentaires pour ce type d'unités, utilisées lors du transfert d'un lieu à un autre et pour le forage, la production, les lieux d'habitation, le traitement, le stockage et le déchargement.<br/>
    Elle s'applique à toutes les installations, qu'elles soient permanentes ou provisoires, transportables ou portatives, aux installations en courant alternatif et aux installations en courant continu sans limitation du niveau de tension. Les normes des équipements référencés peuvent fournir des limites de niveau de tension.<br/>
    Le présent document spécifie des exigences pour<br/>
    – les conditions d'environnement,<br/>
    – les limites d'inclinaison de l'unité sur laquelle l'équipement doit fonctionner,<br/>
    – les pompes de cale,<br/>
    – les feux de navigation et d'obstacle,<br/>
    – l'appareil à gouverner,<br/>
    – le système de ballast,<br/>
    – les systèmes de levage, et<br/>
    – les systèmes d'ancrage.<br/>
    Pour la propulsion électrique, il est fait référence à l'IEC 60092-501.<br/>
    Pour le système de positionnement dynamique, il est fait référence aux exigences correspondantes de l'OMI.<br/>
    Le présent document ne s'applique pas<br/>
    – aux équipements fixes destinés aux applications médicales,<br/>
    – aux installations électriques des navires-citernes, et<br/>
    – au contrôle des sources d'incendie autres que celles générées par l'équipement électrique.<br/>
    Cette quatrième édition annule et remplace la troisième édition parue en 2014. Cette édition constitue une révision technique.<br/>
    Cette édition inclut les modifications techniques majeures suivantes par rapport à l'édition précédente:<br/>
    a) les exigences techniques relatives à la propulsion électrique ont été remplacées par une référence à l'IEC 60092-501:2013;<br/>
    b) les exigences relatives aux tableaux principaux et aux tableaux d'urgence ont été ajoutées;<br/>
    c) les exigences relatives aux systèmes de contrôle et aux indicateurs des portes étanches et des couvercles d'écoutille ont été précisées;<br/>
    d) les exigences relatives à la capacité de maintien des systèmes de connexion ont été réécrites;<br/>
    e) les exigences relatives au système de mouillage assisté par propulseur ont été réécrites;<br/>
    f) l'annexe relative à l'essai de vérification de système amélioré (essai de matériel incorporé) pour unités mobiles à positionnement dynamique a été placée dans l'IEC 61892-2:2019.
