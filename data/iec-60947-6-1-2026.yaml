abstract:
- language: en
  script: Latn
  content: "<!-- NEW! -->IEC 60947-6-1:2026 is available as <a href=\"https://webstore.iec.ch/publication/112958\">IEC
    60947-6-1:2026 RLV</a> which contains the International Standard and its Redline
    version, showing all changes of the technical content compared to the previous
    edition.</br></br><!--StartFragment -->\r\n<p>IEC 60947-6-1:2026 applies to transfer
    switching equipment (TSE), to be used in power systems for ensuring the continuity
    of the supply and allowing the energy management of the installation, by transferring
    a load between power supply sources, the rated voltage of which does not exceed
    1 000 V AC or 1 500 V DC. Specific requirements for bypass/isolation transfer
    switch equipment are given in Annex C, ATSE having closed transition capability
    are given in Annex D, stand-alone ATS controllers are given in Annex E, and TSE
    for electric driven fire pump controllers are given in Annex F.<br />\r\nIt covers:<br
    />\r\n- manually operated transfer switching equipment (MTSE);<br />\r\n- remotely
    operated transfer switching equipment (RTSE);<br />\r\n- automatic transfer switching
    equipment (ATSE), including the controller;<br />\r\n- stand-alone ATS controllers;<br
    />\r\n- bypass/isolation transfer switch equipment (BTSE);<br />\r\n- ATSE having
    closed transition capability;<br />\r\n- fire pump TSE.<br />\r\nIt does not cover:<br
    />\r\n- TSE configurations that are not fully manufacturer type tested or marked
    according to this document as a complete transfer switch;<br />\r\n- auxiliary
    contacts (for guidance, see IEC 60947-5-1);<br />\r\n- transfer switches used
    in explosive atmospheres (for guidance, see IEC 60079 (all parts));<br />\r\n-
    embedded software design (for guidance, see IEC TR 63201);<br />\r\n- cybersecurity
    aspects (for guidance, see IEC 63208);<br />\r\n- TSE rated for direct-on-line
    starting asynchronous motor of design NE and HE, according to IEC 60034-12. (for
    guidance, see AC-3e utilisation category according to IEC 60947 4 1);<br />\r\n-
    other types of TSE under consideration including overlapping neutral TSE, multi-source
    TSE (i.e. TSE with more than two sources of supply), TSE with load-shedding functions,
    bus-tie TSE, and hybrid TSE;<br />\r\n- static transfer switches covered by IEC
    62310 series.<br />\r\nThis fourth edition cancels and replaces the third edition
    published in 2021. This edition constitutes a technical revision.<br />\r\nThis
    edition includes the following significant technical changes with respect to the
    previous edition:<br />\r\n- clarification of scope;<br />\r\n- clarification
    of terms and definitions;<br />\r\n- Annex C for Bypass/Isolation Transfer Switch
    Equipment;<br />\r\n- Annex D for ATSE having closed transition capability;<br
    />\r\n- Annex E for Stand-alone ATS controller;<br />\r\n- Annex F for TSE used
    with electric driven fire pump control equipment.</p>"
- language: fr
  script: Latn
  content: "<!-- NEW! -->IEC 60947-6-1:2026 est disponible sous forme de <a href=\"https://webstore.iec.ch/publication/112958\">IEC
    60947-6-1:2026 RLV</a> qui contient la Norme internationale et sa version Redline,
    illustrant les modifications du contenu technique depuis l'édition précédente.</br></br>L'IEC
    60947-6-1:2026 s'applique aux équipements de transfert de source (TSE) destinés
    à être utilisés au sein de réseaux d'énergie qui assurent la continuité de l'alimentation
    et permettent la gestion de l'énergie de l'installation, en transférant une charge
    entre des sources d'alimentation dont la tension assignée ne dépasse pas 1 000
    V en courant alternatif ou 1 500 V en courant continu. Les exigences spécifiques
    aux équipements de transfert de source à shuntage/sectionnement sont fournies
    à l'Annexe C. Les exigences spécifiques aux ATSE sans coupure sont fournies à
    l'Annexe D. Les exigences spécifiques aux contrôleurs ATS autonomes sont fournies
    à l'Annexe E. Les exigences spécifiques aux TSE pour appareils de commande de
    pompe à incendie à entraînement électrique sont fournies à l'Annexe F.<br />\r\nLe
    présent document couvre:<br />\r\n- les équipements de transfert de source manœuvrés
    manuellement (MTSE);<br />\r\n- les équipements de transfert de source manœuvrés
    à distance (RTSE);<br />\r\n- les équipements de transfert de source automatiques
    (ATSE), y compris le contrôleur;<br />\r\n- les contrôleurs ATS autonomes;<br
    />\r\n- les équipements de transfert de source à shuntage/sectionnement (BTSE);<br
    />\r\n- les ATSE sans coupure;<br />\r\n- les TSE pour pompe à incendie.<br />\r\nLe
    présent document ne couvre pas:<br />\r\n- les configurations de TSE qui ne sont
    pas complètement soumises aux essais de type ou marquées par le fabricant conformément
    au présent document pour le transfert de source complet;<br />\r\n- les contacts
    auxiliaires (voir les recommandations de l'IEC 60947 5-1);<br />\r\n- les transferts
    de source utilisés en atmosphères explosives (voir les recommandations de l'IEC
    60079 (toutes les parties));<br />\r\n- la conception des logiciels embarqués
    (voir les recommandations de l'IEC TR 63201);<br />\r\n- les aspects liés à la
    cybersécurité (voir les recommandations de l'IEC 63208);<br />\r\n- les TSE conçus
    pour les moteurs asynchrones à démarrage direct de types NE et HE selon l'IEC
    60034-12 (voir les recommandations pour la catégorie d'emploi AC-3e selon l'IEC
    60947 4 1);<br />\r\n- les autres types de TSE à l'étude, notamment les TSE à
    transition avec recouvrement du neutre, les TSE multisources (c'est-à-dire les
    TSE comportant plus de deux sources d'alimentation), les TSE comportant des fonctions
    de délestage, les TSE comportant un jeu de barres de couplage et les TSE hybrides;<br
    />\r\n- les commutateurs de transfert statique couverts par la série IEC 62310.<br
    />\r\nCette quatrième édition annule et remplace la troisième édition parue en
    2021. Cette édition constitue une révision technique.<br />\r\nCette édition inclut
    les modifications techniques majeures suivantes par rapport à l'édition précédente:<br
    />\r\n- clarification du domaine d'application;<br />\r\n- clarification des termes
    et définitions;<br />\r\n- Annexe C, pour les équipements de transfert de source
    à shuntage/sectionnement;<br />\r\n- Annexe D, pour les ATSE sans coupure;<br
    />\r\n- Annexe E, pour les contrôleurs ATS autonomes;<br />\r\n- Annexe F, pour
    les TSE utilisés avec un appareil de commande de pompe à incendie à entraînement
    électrique."
