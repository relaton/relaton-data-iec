abstract:
- language: en
  script: Latn
  content: |-
    IEC 61851-23-1:2026 provides the requirements for DC EV supply equipment with an automated connection device (ACD) for conductive connection to the vehicle, with a rated maximum voltage at side A of up to 1 000 V AC or up to 1 500 V DC and a rated maximum voltage at side B up to 1 500 V DC.<br/>
    This document specifies the DC EV supply equipment with an automated connection device based on<br/>
    – system B described in IEC 61851-23:2023, Annex BB, and<br/>
    – system C described in IEC 61851-23:2023, Annex CC.<br/>
    The requirements for reverse power transfer (RPT) and bidirectional power transfer (BPT) are under consideration and are not specified in this document.<br/>
    EMC requirements for DC EV supply equipment are defined in IEC 61851-21-2:2018.<br/>
    This document provides the general requirements for the control communication between a DC EV supply equipment and an EV.<br/>
    The requirements for digital communication between DC EV supply equipment and electric vehicle for control of DC energy transfer are defined in ISO 15118-20:2022 and IEC 61851-24:2023.<br/>
    This document only applies to automatic couplers of category 2, i.e. using an electro-mechanical interface: automatic coupler for an automated charging system according to IEC 63407.<br/>
    This document does not apply to automatic coupler of category 1 as described in IEC TS 61851-27 .<br/>
    This document does not apply to automatic coupler of category 3 as described in IEC TS 61851-26 .<br/>
    This document does not cover all safety aspects related to maintenance.<br/>
    Requirements for systems not providing simple separation or protective separation between side A and side B are under consideration.<br/>
    Requirements for EV supply equipment without control of current, voltage or power are under consideration.<br/>
    EV supply equipment in compliance with this document are not intended to provide energy transfer to a single EV with<br/>
    – multiple vehicle connectors of the same EV supply equipment, or<br/>
    – multiple EV supply equipment.
- language: fr
  script: Latn
  content: |-
    IEC 61851-23-1:2026 fournit les exigences relatives aux systèmes d’alimentation à courant continu pour VE équipés de dispositif de connexion automatique (DCA) pour la connexion automatique au véhicule par conduction, avec une tension assignée maximale du côté A allant jusqu’à 1 000 V en courant alternatif ou jusqu’à 1 500 V en courant continu, et une tension assignée maximale du côté B allant jusqu’à 1 500 V en courant continu.<br/>
    Le présent document spécifie les systèmes d’alimentation à courant continu pour VE équipés de dispositif de connexion automatique reposant sur<br/>
    – le système B décrit dans l’IEC 61851-23:2023, Annexe BB, et<br/>
    – le système C décrit dans l’IEC 61851-23:2023, Annexe CC.<br/>
    Les exigences relatives au transfert de puissance inverse (RPT) et au transfert de puissance bidirectionnel (TPB) sont à l’étude et ne sont pas spécifiées dans le présent document.<br/>
    Les exigences en matière de CEM des systèmes d’alimentation à courant continu pour VE sont définies dans l’IEC 61851-21-2:2018.<br/>
    Le présent document fournit les exigences générales relatives à la communication de contrôle entre un système d’alimentation à courant continu pour VE et un VE.<br/>
    Les exigences relatives à la communication numérique entre le système d’alimentation à courant continu pour VE et le véhicule électrique à des fins de contrôle du transfert d’énergie en courant continu sont définies dans l’ISO 15118-20:2022 et l’IEC 61851-24:2023.<br/>
    Le présent document s’applique uniquement aux connecteurs automatiques de catégorie 2, c’est-à-dire utilisant une interface électromécanique: connecteur automatique pour un système de charge automatisé conforme à l’IEC 63407.<br/>
    Le présent document ne s’applique pas aux connecteurs automatiques de catégorie 1 tels que décrits dans l’IEC TS 61851-27.<br/>
    Le présent document ne s’applique pas aux connecteurs automatiques de catégorie 3 tels que décrits dans l’IEC TS 61851-26.<br/>
    Le présent document ne couvre pas tous les aspects de sécurité relatifs à la maintenance.<br/>
    Les exigences relatives aux systèmes n’assurant pas une séparation simple ou une séparation de protection entre les côtés A et B sont à l’étude.<br/>
    Les exigences relatives aux systèmes d’alimentation pour VE sans contrôle du courant, de la tension ou de la puissance sont à l’étude.<br/>
    Les systèmes d’alimentation pour VE conformes au présent document ne sont pas destinés à fournir un transfert d’énergie à un seul VE avec<br/>
    – plusieurs prises mobiles de véhicule du même système d’alimentation pour VE, ou<br/>
    – plusieurs systèmes d’alimentation pour VE
