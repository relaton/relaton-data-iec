abstract:
- language: en
  script: Latn
  content: |-
    IEC 62841-3-17:2026 applies to transportable type 1 table masonry saws and type 2 table masonry saws that are equipped with one or more diamond cutting wheels with peripheral gaps, if any, not exceeding 10 mm and having no positive rake angle, having a diameter not exceeding 600 mm and used for cutting tile, bricks, stone, concrete block or other similar material.<br/>
    This document also applies to transportable type 4 masonry saws intended only for use with continuous rim diamond cutting wheels having a diameter not exceeding 260 mm and used for cutting tile, bricks, stone, concrete block or other similar material.<br/>
    This document does not apply to tools equipped with bonded abrasive wheels.<br/>
    This document does not apply to transportable cut-off machines.<br/>
    NOTE 101  Transportable cut-off machines are covered by IEC 62841-3-10.<br/>
    This document does not apply to type-3 cutting off machines in accordance with EN 12418:2021.<br/>
    This document is to be used in conjunction with IEC 62841-1:2014 and IEC 62841‑1:2014/AMD1:2025.<br/>
    This document supplements or modifies the corresponding clauses in IEC 62841-1:2014, so as to convert it into the IEC Standard: Particular requirements for transportable table masonry saws.<br/>
    NOTE The attention of National Committees is drawn to the fact that equipment manufacturers and testing organizations can need a transitional period following publication of a new, amended or revised IEC publication in which to make products in accordance with the new requirements and to equip themselves for conducting new or revised tests.<br/>
    It is the recommendation of the committee that the content of this publication be adopted for implementation nationally not earlier than 36 months from the date of publication.
- language: fr
  script: Latn
  content: |-
    IEC 62841-3-17:2026 s'applique aux scies circulaires à table de maçonnerie de type 1 et de type 2 transportables équipées d'une ou de plusieurs meules à tronçonner diamantées avec des écarts périphériques, le cas échéant, qui ne dépassent pas 10 mm et ne comportent pas d'angle de coupe positif, de diamètre inférieur ou égal à 600 mm et qui sont utilisées pour la découpe de carrelage, de briques, de pierres, de blocs en béton ou d'autres matériaux analogues.<br/>
    Le présent document s'applique également aux scies de maçonnerie de type 4 transportables destinées à être utilisées uniquement avec des meules à tronçonner diamantées à couronne continue de diamètre inférieur ou égal à 260 mm et qui sont utilisées pour la découpe de carrelage, de briques, de pierres, de blocs en béton ou d'autres matériaux analogues.<br/>
    Le présent document ne s'applique pas aux outils équipés de meules abrasives agglomérées.<br/>
    Le présent document ne s'applique pas aux tronçonneuses à disque transportables.<br/>
    NOTE 101 Les tronçonneuses à disque transportables sont couvertes par l'IEC 62841‑3‑10.<br/>
    Le présent document ne s'applique pas aux scies de chantier de type 3 selon l'EN 12418:2021.<br/>
    Le présent document doit être utilisé conjointement avec l'IEC 62841‑1:2014 et l'IEC 62841‑1:2014/AMD1:2025.<br/>
    NOTE L'attention des Comités nationaux est attirée sur le fait que les fabricants d'appareils et les organismes d'essai peuvent avoir besoin d'une période transitoire après la publication d'une nouvelle publication IEC, ou d'une publication amendée ou révisée, pour fabriquer des produits conformes aux nouvelles exigences et pour adapter leurs équipements aux nouveaux essais ou aux essais révisés.<br/>
    Le comité recommande que le contenu de cette publication soit adopté pour application nationale au plus tôt 36 mois après la date de publication.
