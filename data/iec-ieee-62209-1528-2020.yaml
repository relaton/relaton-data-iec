abstract:
- language: en
  script: Latn
  content: |-
    IEC/IEEE 62209-1528:2020 specifies protocols and test procedures for the reproducible and repeatable measurement of the conservative exposure peak spatial average SAR (psSAR) induced inside a simplified model of the head and the body by radio-frequency (RF) transmitting devices, with a defined measurement uncertainty. These protocols and procedures apply to a significant majority of the population, including children, during the use of hand-held and body-worn wireless communication devices. These devices include single or multiple transmitters or antennas, and are operated with their radiating structure(s) at distances up to 200 mm from a human head or body. This document is employed to evaluate SAR compliance of different types of wireless communication devices used next to the ear, in front of the face, mounted on the body, operating in conjunction with other RF-transmitting, non-transmitting devices or accessories (e.g. belt-clips), or embedded in garments. The applicable frequency range is from 4 MHz to 10 GHz. Devices operating in the applicable frequency range can be tested using the phantoms and other requirements defined in this document.<br/>
    The device categories covered include, but are not limited to, mobile telephones, cordless microphones, and radio transmitters in personal, desktop and laptop computers, for multi band operations using single or multiple antennas, including push-to-talk devices. This document can also be applied for wireless power transfer devices operating above 4 MHz.<br/>
    This document does not apply to implanted medical devices.<br/>
    This first edition of IEC/IEEE 62209-1528 cancels and replaces IEC 62209-1:2016, IEC 62209-2:2010, IEC 62209 2:2010/AMD1:2019 and IEEE Std 1528:2013. This edition constitutes a technical revision.<br/>
    This edition includes the following significant technical changes with respect to the previous edition:<br/>
    a) extension of the frequency range down to 4 MHz and up to 10 GHz;<br/>
    b) testing of devices with proximity sensors;<br/>
    c) application specific phantoms;<br/>
    d) device holder specifications;<br/>
    e) fast SAR testing procedures;<br/>
    f) test reduction procedures;<br/>
    g) LTE assessment procedure;<br/>
    h) revision of validation clause, including validation antennas;<br/>
    i) revision of SAR assessment procedure;<br/>
    j) time-average SAR measurement procedure;<br/>
    k) uncertainty analysis;<br/>
    This publication is published as an IEC/IEEE Dual Logo standard.
- language: fr
  script: Latn
  content: |-
    L’IEC/IEEE 62209-1528:2020 précise les protocoles et procédures d’essai pour la mesure reproductible et reproductible du pic d’exposition conservateur sar moyenne spatiale (PSSAR) induit à l’intérieur d’un modèle simplifié de la tête et du corps par radiofréquence (RF) dispositifs de transmission, avec une incertitude de mesure définie. Ces protocoles et procédures s’appliquent à une grande majorité de la population, y compris les enfants, lors de l’utilisation d’appareils de communication sans fil portables et portés par le corps. Ces dispositifs comprennent des émetteurs ou antennes simples ou multiples, et sont actionnés avec leur structure rayonnante (s) à des distances allant jusqu’à 200 mm d’une tête ou d’un corps humain. Ce document est utilisé pour évaluer la conformité SAR des différents types d’appareils de communication sans fil utilisés à côté de l’oreille, devant le visage, montés sur le corps, fonctionnant conjointement avec d’autres appareils ou accessoires de transmission RF et non transmissibles (p. ex. pinces à courroie), ou intégrés dans des vêtements. La plage de fréquence applicable est de 4 MHz à 10 GHz. Les appareils fonctionnant dans la plage de fréquences applicable peuvent être testés à l’aide des fantômes et d’autres exigences définies dans ce document.<br/>
    Les catégories d’appareils couvertes comprennent, sans s’y limiter, les téléphones mobiles, les microphones sans fil et les émetteurs radio dans les ordinateurs personnels, de bureau et les ordinateurs portables, pour les opérations multi-bandes utilisant des antennes simples ou multiples, y compris les appareils push-to-talk. Ce document peut également être appliqué pour les appareils de transfert d’énergie sans fil fonctionnant au-dessus de 4 MHz.<br/>
    Ce document ne s’applique pas aux dispositifs médicaux implantés.<br/>
    Cette première édition de l’IEC/IEEE 62209-1528 annule et remplace iEC 62209-1:2016, IEC 62209-2:2010, IEC 62209 2:2010/AMD1:2019 et IEEE Std 1528:2013. Cette édition constitue une révision technique.<br/>
    Cette édition comprend les changements techniques importants suivants par rapport à l’édition précédente :<br/>
    a) l’extension de la plage de fréquences jusqu’à 4 MHz et jusqu’à 10 GHz;<br/>
    b) l’essai d’appareils à capteurs de proximité;<br/>
    c) l’application de fantômes spécifiques;<br/>
    d) spécifications du support de l’appareil;<br/>
    e) des procédures d’essai sar rapides;<br/>
    f) les procédures de réduction des tests;<br/>
    g) procédure d’évaluation du LTE;<br/>
    h) révision de la clause de validation, y compris les antennes de validation;<br/>
    i) révision de la procédure d’évaluation sar;<br/>
    j) procédure de mesure SAR moyenne dans le temps;<br/>
    k) l’analyse de l’incertitude;<br/>
    Cette publication est publiée sous la forme d’une norme IEC/IEEE Dual Logo.
