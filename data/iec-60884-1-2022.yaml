abstract:
- language: en
  script: Latn
  content: |-
    CORRECTED VERSION 2026-07<br/>
    <br/>
    IEC 60884-1:2022 applies to plugs and fixed or portable socket-outlets for AC only, with or without earthing contact, with a rated voltage greater than 50 V but not exceeding 440 V and a rated current not exceeding 32 A, intended for household and similar purposes, either indoors or outdoors.<br/>
    Compatible plugs and socket-outlets, when combined, form a plug and socket-outlet system. Standardized systems used around the world are reported in IEC/TR 60083.<br/>
    The rated current is limited to 16 A maximum for accessories provided with screwless-type terminals.<br/>
    This fourth edition cancels and replaces the third edition published in 2002, Amendment 1:2006 and Amendment 2:2013. This edition constitutes a technical revision.<br/>
    This edition includes the following significant technical changes with respect to the previous edition:<br/>
    plugs and socket-outlets incorporating pilot lights;<br/>
    crimped connections in accessories;<br/>
    insulation piercing terminals (IPT);<br/>
    accessories to be used with American Wire Gauge (AWG) cables;<br/>
    accessories used in T° below −5 °C down to and including −45 °C;<br/>
    accessories used in T° above +40 °C up to and including +70 °C;<br/>
    plugs and socket-outlets for high load (HL);<br/>
    clarification of some definitions;<br/>
    durability of markings test;<br/>
    introduction of thermal monitoring in the plug;<br/>
    requirements for shutters in portable socket-outlets;<br/>
    test walls for the verification of ingress of water;<br/>
    rewriting of the temperature rise clause.<br/>
    The contents of the corrigendum of November 2023 have been included in this copy.
- language: fr
  script: Latn
  content: |-
    VERSION CORRIGEE 2026-07<br/>
    <br/>
    L'IEC 60884-1:2022 s'applique aux fiches et aux socles fixes ou mobiles pour courant alternatif seulement, avec ou sans contact de terre, de tension assignée supérieure à 50 V, mais inférieure ou égale à 440 V et de courant assigné inférieur ou égal 32 A, destinés aux usages domestiques et usages analogues, à l'intérieur ou à l'extérieur des bâtiments.<br/>
    Les fiches et socles compatibles, lorsqu'ils sont combinés, forment un système de prise de courant. Les systèmes normalisés utilisés dans le monde sont indiqués dans l'IEC/TR 60083.<br/>
    Le courant assigné est limité à 16 A au maximum pour les appareils équipés de bornes sans vis.<br/>
    Cette quatrième édition annule et remplace la troisième édition parue en 2002, l'Amendement 1:2006 et l'Amendement 2:2013. Cette édition constitue une révision technique.<br/>
    Cette édition inclut les modifications techniques majeures suivantes par rapport à l'édition précédente:<br/>
    fiches et socles qui comportent des lampes indicatrices;<br/>
    raccordements par sertissage dans les appareils;<br/>
    bornes à perçage d'isolant (IPT);<br/>
    appareils à utiliser avec des câbles American Wire Gauge (AWG);<br/>
    appareils utilisés à des températures inférieures à −5 °C jusqu'à −45 °C inclus;<br/>
    appareils utilisés à des températures supérieures à +40 °C jusqu'à +70 °C inclus;<br/>
    fiches et socles pour charge élevée (HL);<br/>
    clarification de certaines définitions;<br/>
    essai de durabilité des marquages;<br/>
    introduction du monitorage thermique dans la fiche;<br/>
    exigences relatives aux obturateurs dans les socles mobiles;<br/>
    murs d'essai pour la vérification de la pénétration de l'eau;<br/>
    réécriture de l'article relatif à l'échauffement.<br/>
    La présente version bilingue (2022-12) correspond à la version anglaise monolingue publiée en 2022-08.<br/>
    La version française de cette norme n'a pas été soumise au vote.<br/>
    Le contenu du corrigendum de décembre 2023 a été pris en considération dans cet exemplaire.
