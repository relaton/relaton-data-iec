abstract:
- language: en
  script: Latn
  content: |-
    IEC 61892-2:2019 is applicable to system design of electrical installations and equipment in mobile and fixed offshore units including pipeline, pumping or "pigging" stations, compressor stations and single buoy moorings, used in the offshore petroleum industry for drilling, production, accommodation, processing, storage and offloading purposes.<br/>
    It applies to all installations, whether permanent, temporary, transportable or hand-held, to AC installations and DC installations, without any voltage level limitation. Referenced equipment standards may give voltage level limitations.<br/>
    This document specifies requirements such as those concerning<br/>
    – sources of electrical power for manned and unmanned units,<br/>
    – system earthing, both for low-voltage and high-voltage installations,<br/>
    – interface for electric transmission systems with power supplied from shore, between interconnected offshore units, and with power supplied by offshore units to subsea installations,<br/>
    – distribution systems,<br/>
    – cables and wiring systems,<br/>
    – system studies and calculations,<br/>
    – protection against electrical faults,<br/>
    – lighting,<br/>
    – energy control, monitoring and alarm systems, and<br/>
    – turret/swivel.<br/>
    This document gives information and guidance on topics such as<br/>
    – applicable examples of HVDC VSC technology, and<br/>
    – guidelines for illumination level.<br/>
    This document does not apply to<br/>
    – fixed equipment for medical purposes,<br/>
    – electrical installations of tankers, and<br/>
    – control of ignition sources other than those created by electrical equipment.<br/>
    This third edition cancels and replaces the second edition published in 2012. This edition constitutes a technical revision.<br/>
    This edition includes the following significant technical changes with respect to the previous edition:<br/>
    a) the requirement for sources of electrical power has been rewritten. Requirements both for manned and unmanned units are given. Requirements for essential services of electrical power have been added;<br/>
    b) the requirement in relation to dead start has been added;<br/>
    c) the requirement for emergency stop for motor-driven fuel-oil transfer and fuel-oil pressure pumps has been added;<br/>
    d) general requirements regarding cables and wiring systems have been added;<br/>
    e) the description of unit interfaces to electrical transmission systems has been included;<br/>
    f) requirements in relation to energy control, monitoring and alarm system have been rewritten;<br/>
    g) new clauses regarding swivel/turret and unmanned facilities have been added;<br/>
    h) informative annexes regarding the following have been added:<br/>
    – essential source of electrical power;<br/>
    – emergency source of electrical power;<br/>
    – applicable examples of HVDC VSC technologies;<br/>
    – swivel/turret;<br/>
    – power sources for unmanned units, with separate or combined main and emergency switchboard;<br/>
    – alternative power sources of electrical power – general requirements;<br/>
    – illumination level;<br/>
    – enhanced software simulation;<br/>
    – architecture for energy control, monitoring and alarm system.
- language: fr
  script: Latn
  content: |-
    L'IEC 61892-2:2019 s'applique à la conception de systèmes concernant les installations et équipements électriques des unités mobiles et fixes en mer, y compris les canalisations, les stations de pompage ou de raclage, les stations de compression et les systèmes d'amarrage à point unique, qui sont utilisés dans l'industrie pétrolière en mer (offshore) pour le forage, la production, les lieux d'habitation, le traitement, le stockage et le déchargement.<br/>
    Elle s'applique à toutes les installations, qu'elles soient permanentes ou provisoires, transportables ou portatives, aux installations en courant alternatif et aux installations en courant continu sans aucune limitation du niveau de tension. Les normes des équipements référencés peuvent fournir des limites de niveau de tension.<br/>
    Le présent document spécifie des exigences pour<br/>
    – les sources d'énergie électrique pour les unités habitées ou inhabitées,<br/>
    – la mise à la terre du système, à la fois pour les installations à basse et à haute tension,<br/>
    – l'interface des systèmes de transmission électrique pour l'alimentation électrique depuis la côte, entre les unités en mer interconnectées et pour l'alimentation électrique des installations sous-marines depuis les unités en mer,<br/>
    – les systèmes de distribution,<br/>
    – les câbles et les systèmes de câblage,<br/>
    – les études et les calculs relatifs aux systèmes,<br/>
    – la protection contre les défauts d'origine électrique,<br/>
    – l'éclairage,<br/>
    – les systèmes de contrôle de l'énergie, de surveillance et d'alarme, et<br/>
    – la tourelle/les joints tournants.<br/>
    Le présent document fournit des informations et des recommandations à propos de sujets tels que:<br/>
    – des exemples applicables de convertisseur de source de tension CCHT, et<br/>
    – des recommandations concernant le niveau d'éclairement.<br/>
    Le présent document ne s'applique pas<br/>
    – aux équipements fixes destinés aux applications médicales,<br/>
    – aux installations électriques des navires-citernes, et<br/>
    – au contrôle des sources d'incendie autres que celles générées par l'équipement électrique.<br/>
    Cette troisième édition annule et remplace la deuxième édition parue en 2012. Cette édition constitue une révision technique.<br/>
    Cette édition inclut les modifications techniques majeures suivantes par rapport à l'édition précédente:<br/>
    a) l'exigence relative aux sources d'énergie électrique a été réécrite; les exigences sont données à la fois pour les unités habitées et inhabitées; des exigences relatives aux services essentiels de l'énergie électrique ont été ajoutées;<br/>
    b) une exigence relative au démarrage depuis l'arrêt complet a été ajoutée;<br/>
    c) l'exigence relative à l'arrêt d'urgence des pompes à moteur pour le transfert et la pression du mazout a été ajoutée;<br/>
    d) des exigences générales relatives aux câbles et aux systèmes de câblage ont été ajoutées;<br/>
    e) la description des interfaces entre l'unité et le système de transmission électrique a été incluse;<br/>
    f) les exigences relatives aux systèmes de contrôle de l'énergie, de surveillance et d'alarme ont été réécrites;<br/>
    g) de nouveaux articles concernant les joints tournants et la tourelle, ainsi que les installations inhabitées, ont été ajoutés;<br/>
    h) des annexes informatives concernant les points suivants ont été ajoutées:<br/>
    – source d'alimentation électrique essentielle;<br/>
    – source d'alimentation électrique d'urgence;<br/>
    – exemples applicables de convertisseur de source de tension CCHT;<br/>
    – joints tournants/tourelle;<br/>
    – alimentations électriques pour les unités inhabitées, avec tableau principal et tableau d'urgence séparés ou combinés;<br/>
    – autres sources d'alimentation électrique – exigences générales;<br/>
    – niveau d'éclairement;<br/>
    – simulation informatique renforcée;<br/>
    – architecture du système de contrôle de l'énergie, de surveillance et d'alarme.
