abstract:
- language: en
  script: Latn
  content: |-
    IEC 60947-1:2020 applies, when required by the relevant product standard, to low-voltage switchgear and controlgear hereinafter referred to as "equipment" or “device” and intended to be connected to circuits, the rated voltage of which does not exceed 1 000 V AC or 1 500 V DC.<br/>
    This document states the general rules and common safety requirements for low-voltage switchgear and controlgear, including:<br/>
    - definitions;<br/>
    - characteristics;<br/>
    - information supplied with the equipment;<br/>
    - normal service, mounting and transport conditions, decommissioning and dismantling;<br/>
    - constructional and performance requirements;<br/>
    - verification of characteristics and performance;<br/>
    - energy efficiency aspects (see Annex V);<br/>
    - environmental aspects.<br/>
    This sixth edition cancels and replaces the fifth edition published in 2007, Amendment 1:2010 and Amendment 2:2014. This edition constitutes a technical revision.<br/>
    This edition includes the following significant technical changes with respect to the previous edition:<br/>
    – DC values testing improvement;<br/>
    – update of EMC tests;<br/>
    – Annex B deletion;<br/>
    – update of requirements for environmental tests (Table Q.1);<br/>
    – improvement of Annex R (new examples);<br/>
    – deletion of digital input Type 2, and introduction of Type 3 in Annex S;<br/>
    – example for materials declaration (Annex W);<br/>
    – new Annex X (co-ordination between short-circuit protective devices associated in the same circuit) created.<br/>
    The contents of the corrigendum of December 2022 and April 2024 have been included in this copy.
- language: fr
  script: Latn
  content: |-
    IEC 60947-1:2020 Lorsque la norme de produit correspondante l’exige, le présent document s’applique à l’appareillage basse tension ci-après désigné comme le “matériel” ou le “dispositif”, et destiné à être relié à des circuits dont la tension assignée ne dépasse pas 1 000 V en courant alternatif. ou 1 500 V en courant continu.<br/>
    Le présent document a pour objet de fixer les règles générales et exigences de sécurité communes des appareillages basse tension, y compris:<br/>
    – les définitions,<br/>
    – les caractéristiques,<br/>
    – les informations fournies avec le matériel,<br/>
    – les conditions normales de service, de montage, de transport, de mise hors service et de démontage,<br/>
    – les exigences relatives à la construction et au fonctionnement,<br/>
    – la vérification des caractéristiques et du fonctionnement,<br/>
    – les aspects liés à l’efficacité énergétique (voir Annexe V),<br/>
    – les aspects environnementaux.<br/>
    Cette sixième édition annule et remplace la cinquième édition parue en 2007, l'Amendement 1:2010 et l'Amendement 2:2014. Cette édition constitue une révision technique.<br/>
    Cette édition inclut les modifications techniques majeures suivantes par rapport à l'édition précédente:<br/>
    – amélioration des essais relatifs aux valeurs en courant continu,<br/>
    – mise à jour des essais de CEM,<br/>
    – suppression de l’Annexe B,<br/>
    – mise à jour des exigences des essais d’environnement (Tableau Q.1),<br/>
    – amélioration de l’Annexe R (nouveaux exemples),<br/>
    – suppression du type d’entrée numérique 2 et insertion du type 3 dans l’Annexe S,<br/>
    – insertion d’un exemple de déclaration de matière dans l’Annexe W,<br/>
    – création d’une nouvelle Annexe X (coordination des dispositifs de protection contre les courts-circuits associés dans un même circuit).<br/>
    Le contenu du corrigendum de décembre 2022 et d'abril 2024 a été pris en considération dans cet exemplaire.
