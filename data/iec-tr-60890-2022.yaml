abstract:
- language: en
  script: Latn
  content: |-
    IEC TR 60890:2022 specifies a method of air temperature-rise calculation inside enclosures for low-voltage switchgear and controlgear assemblies or similar products in accordance with their respective standard. The method is primarily applicable to enclosed assemblies or partitioned sections of assemblies without forced ventilation. This third edition cancels and replaces the second edition published in 2014. This edition constitutes a technical revision. This edition includes the following significant technical changes with respect to the previous edition:<br/>
    - alignment with IEC 61439-1:2020;<br/>
    - addition of individual annexes for guidance of technical explanations related to:<br/>
    --- effect of an uneven power distribution;<br/>
    --- additional temperature-rise due to solar radiation;<br/>
    --- effect of different enclosure materials;<br/>
    --- effect of different natural ventilation management;<br/>
    --- forced ventilation management;<br/>
    --- power losses calculation;<br/>
    --- impact of an adjacent wall can have on the assembly cooling surface(s);<br/>
    - maximum internal ambient temperature limit into an assembly;<br/>
    - validity area of the calculation extended from 3 150 A to 3 200 A;<br/>
    - addition of an algebraic equation to the different curves included in the document.
- language: fr
  script: Latn
  content: |-
    L'IEC TR 60890:2022 spécifie une méthode de calcul des échauffements de l'air à l'intérieur d'une enveloppe pour les ensembles d'appareillages à basse tension ou produits analogues selon leur norme respective.<br/>
    La méthode s'applique principalement aux ensembles sous enveloppe ou aux sections compartimentées des ensembles sans ventilation forcée.<br/>
    Cette troisième édition annule et remplace la deuxième édition parue en 2014. Cette édition constitue une révision technique.<br/>
    Cette édition inclut les modifications techniques majeures suivantes par rapport à l'édition précédente:<br/>
    alignement sur l'IEC 61439-1:2020;<br/>
    ajout d'annexes spécifiques qui contiennent à titre de recommandations des explications techniques concernant:<br/>
    l'effet d'une répartition de puissance non uniforme;<br/>
    l'échauffement supplémentaire dû au rayonnement solaire;<br/>
    l'effet des différents matériaux d'enveloppe;<br/>
    l'effet des différents moyens de gestion par ventilation naturelle;<br/>
    la gestion par ventilation forcée;<br/>
    le calcul des puissances dissipées;<br/>
    l'impact que peut avoir une paroi adjacente sur la ou les surfaces de refroidissement de l'ensemble;<br/>
    ajout d'une limite maximale pour la température ambiante interne d'un ensemble;<br/>
    extension du domaine de validité du calcul de 3 150 A à 3 200 A;<br/>
    ajout d'une équation algébrique pour les différentes courbes incluses dans le document.<br/>
    La présente version bilingue (2023-01) correspond à la version anglaise monolingue publiée en 2022-09.<br/>
    La version française de cette norme n'a pas été soumise au vote.
