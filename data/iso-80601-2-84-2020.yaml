abstract:
- language: en
  script: Latn
  content: |-
    This document applies to the basic safety and essential performance of an EMS ventilator in combination with its accessories, hereafter also referred to as ME equipment:<br/>
    - intended for patients who need differing levels of support from artificial ventilation including ventilator-dependent patients;<br/>
    - intended to be operated by a healthcare professional operator;<br/>
    - intended for use in the EMS environment; and<br/>
    - intended for invasive or non-invasive ventilation.<br/>
    NOTE 1 An EMS ventilator can also be used for transport within a professional healthcare facility.<br/>
    * An EMS ventilator is not considered to utilize a physiologic closed loop-control system unless it uses a physiological patient variable to adjust the ventilation therapy settings.<br/>
    This document is also applicable to those accessories intended by their manufacturer to be connected to the ventilator breathing system, or to an EMS ventilator, where the characteristics of those accessories can affect the basic safety or essential performance of the EMS ventilator.<br/>
    NOTE 2 If a clause or subclause is specifically intended to be applicable to ME equipment only, or to ME systems only, the title and content of that clause or subclause will say so. If that is not the case, the clause or subclause applies both to ME equipment and to ME systems, as relevant.<br/>
    Hazards inherent in the intended physiological function of ME equipment or ME systems within the scope of this document are not covered by specific requirements in this document except in IEC 60601-1:2005, 7.2.13 and 8.4.1.<br/>
    NOTE 3 Additional information can be found in IEC 60601-1:2005+AMD1:2012, 4.2.<br/>
    This document does not specify the requirements for the following:<br/>
    - ventilators or accessories intended for ventilator-dependent patients in critical care applications, which are given in ISO 80601-2-12.<br/>
    - ventilators or accessories intended for ventilator-dependent patients in the home healthcare environment, which are given in ISO 80601-2-72[3].<br/>
    - ventilators or accessories intended for anaesthetic applications, which are given in ISO 80601‐2‐13[4].<br/>
    - ventilators or accessories intended for ventilatory support equipment (intended only to augment the ventilation of spontaneously breathing patients), which are given in ISO 80601‑2-79[5] and ISO 80601-2-80[6] [1].<br/>
    - obstructive sleep apnoea therapy ME equipment, which are given in ISO 80601‐2‐70[7].<br/>
    - operator-powered resuscitators, which are given in ISO 10651‐4[8].<br/>
    - gas-powered emergency resuscitators, which are given in ISO 10651‐5[9].<br/>
    - continuous positive airway pressure (CPAP) ME equipment .<br/>
    - high‐frequency jet ventilators (HFJVs), which are given in ISO 80601-2-87[11].<br/>
    - high‐frequency oscillatory ventilators (HFOVs)[10], which are given in ISO 80601-2-87[11].<br/>
    NOTE 4 An EMS ventilator can incorporate high-frequency jet or high-frequency oscillatory ventilation-modes.<br/>
    - cuirass or "iron‐lung" ventilators.<br/>
    [1] ISO 80601-2-79 and ISO 80601-2-80 replace ISO 10651-6, which has been withdrawn.
- language: fr
  script: Latn
  content: |-
    Le présent document s'applique à la sécurité de base et aux performances essentielles d'un ventilateur SMU associé à ses accessoires, appelés ci-après appareil EM:<br/>
    - destinés aux patients ayant besoin de différents niveaux d'assistance respiratoire artificielle, y compris aux patients ventilo-dépendants;<br/>
    - destinés à être utilisés par un opérateur professionnel de soins de santé;<br/>
    - destinés à être utilisés dans l'environnement SMU; et<br/>
    - destinés à la ventilation invasive ou non invasive.<br/>
    NOTE 1 Un ventilateur SMU peut également être utilisé lors d'un transport dans un établissement de santé.<br/>
    * Un ventilateur SMU n'est pas censé utiliser de système physiologique de commande en boucle fermée, sauf s'il utilise une variable physiologique du patient pour ajuster les paramètres de thérapie respiratoire.<br/>
    Le présent document s'applique également aux accessoires conçus par leur fabricant pour être connectés au système respiratoire du ventilateur, ou à un ventilateur SMU, lorsque les caractéristiques de ces accessoires peuvent affecter la sécurité de base et les performances essentielles du ventilateur SMU.<br/>
    NOTE 2 Si un article ou un paragraphe est spécifiquement destiné à être appliqué uniquement aux appareils EM ou aux systèmes EM, le titre et le contenu dudit article ou paragraphe l'indiqueront. Si cela n'est pas le cas, l'article ou le paragraphe s'applique à la fois aux appareils EM et aux systèmes EM, selon le cas.<br/>
    Les dangers inhérents à la fonction physiologique prévue des appareils EM ou des systèmes EM dans le cadre du domaine d'application du présent document ne sont pas couverts par des exigences spécifiques contenues dans le présent document, à l'exception de l'IEC 60601-1:2005, 7.2.13 et 8.4.1.<br/>
    NOTE 3 Des informations supplémentaires peuvent être trouvées dans l'IEC 60601-1:2005+AMD1:2012, 4.2.<br/>
    Le présent document ne spécifie pas les exigences applicables:<br/>
    - aux ventilateurs ou accessoires prévus pour les patients ventilo-dépendants dans les applications de soins intensifs. Celles-ci sont données dans l'ISO 80601-2-12;<br/>
    - aux ventilateurs ou accessoires prévus pour les patients ventilo-dépendants dans l'environnement des soins à domicile. Celles-ci sont données dans l'ISO 80601-2-72[3];<br/>
    - aux ventilateurs ou accessoires prévus pour des applications anesthésiques. Celles-ci sont données dans l'ISO 80601‐2‐13[4];<br/>
    - aux ventilateurs ou accessoires prévus pour les équipements d'assistance respiratoire (uniquement destinés à augmenter la ventilation des patients respirant spontanément). Celles-ci sont données dans l'ISO 80601‑2-79[5] et dans l'ISO 80601-2-80[6] [1]);<br/>
    - aux appareils EM de traitement de l'apnée du sommeil. Celles-ci sont données dans l'ISO 80601‑2‑70[7];<br/>
    - aux ressuscitateurs à puissance motrice manuelle. Celles-ci sont données dans l'ISO 10651‐4[8];<br/>
    - aux appareils de réanimation d'urgence alimentés par gaz. Celles-ci sont données dans l'ISO 10651‑5[9];<br/>
    - aux appareils EM délivrant une pression continue (CPAP);<br/>
    - aux ventilateurs de jet haute fréquence (VJHF). Celles-ci sont données dans l'ISO 80601-2-87[11];<br/>
    - aux ventilateurs à oscillation haute fréquence (VOHF)[10]. Celles-ci sont données dans l'ISO 80601‑2‑87[11];<br/>
    NOTE 4 Un ventilateur SMU peut incorporer des modes de ventilation à jet haute fréquence ou à oscillation haute fréquence.<br/>
    - aux cuirasses ou «poumons d'acier».<br/>
    [1]) L'ISO 80601-2-79 et l'ISO 80601-2-80 remplacent l'ISO 10651-6, qui a été retirée.
