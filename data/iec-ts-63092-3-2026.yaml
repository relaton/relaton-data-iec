abstract:
- language: en
  script: Latn
  content: |-
    IEC TS 63092-3:2026 is intended to provide a versatile method to determine the solar heat gain coefficient (SHGC or g value) of BIPV modules with a variety of designs.<br/>
    It addresses the calorimetric determination of the g value for BIPV modules by using the hot box method or the cooled plate method in accordance with ISO 19467 and ISO 19467‑2. The method takes into account the effect on the g value of extracting photovoltaically generated electricity from the BIPV module in the maximum power point state.<br/>
    This document applies to BIPV modules as defined in IEC 63092‑1 and specifically to BIPV modules with different effective cell area ratios but consisting of identical components such as cells, interconnects, encapsulation and front/back sheets. This evaluation method is applicable to all PV cell technologies and includes coloured BIPV modules.<br/>
    It is published as a double logo Technical Specification with ISO technical committee 160: Glass in building.
