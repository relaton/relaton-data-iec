abstract:
- language: en
  script: Latn
  content: |-
    IEC 60076-11:2018 RLV contains both the official IEC International Standard and its Redline version. The Redline version is available in English only and provides you with a quick and easy way to compare all the changes between the official IEC Standard and its previous edition.<br/>
    <br/>
    IEC 60076-11:2018 applies to dry-type power transformers (including auto-transformers) having values of highest voltage for equipment up to and including 72,5 kV and at least one winding operating at greater than 1,1 kV. This document does not apply to:<br/>
    - gas-filled dry-type transformers where the gas is not air;<br/>
    - single-phase transformers rated at less than 5 kVA;<br/>
    - polyphase transformers rated at less than 15 kVA;<br/>
    - instrument transformers;<br/>
    - starting transformers;<br/>
    - testing transformers;<br/>
    - traction transformers mounted on rolling stock;<br/>
    - flameproof and mining transformers;<br/>
    - welding transformers;<br/>
    - voltage regulating transformers;<br/>
    - small power transformers in which safety is a special consideration.<br/>
    Where IEC standards do not exist for the transformers mentioned above or for other special transformers, this document may be applicable as a whole or in parts. This second edition cancels and replaces the first edition published in 2004 and constitutes a technical revision. The main changes with regard to the previous edition are as follows:<br/>
    - Extension of the scope up to 72,5kV<br/>
    - Enclosure management in regards of the performance<br/>
    - Management of the dielectric and thermal features with altitude<br/>
    - New climatic classes for a better adaptation of customers’ need<br/>
    - Establishment of the relation between location and environmental classes<br/>
    - For fire behaviour classes, limitation at 1000kVA and process of test more robust<br/>
    - Introduction of Seismic class<br/>
    - Recommendations for amorphous transformers<br/>
    Keywords: dry-type transformers<br/>
    The contents of the corrigendum of March 2019 and the Interpretation sheet 1 of July 2020 have been included in this copy.
