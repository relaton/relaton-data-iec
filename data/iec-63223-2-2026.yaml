abstract:
- language: en
  script: Latn
  content: |-
    IEC 63223-2:2026 specifies requirements, recommendations, and examples for implementing a risk-informed decision-making (RIDM) process for managing existing network assets in power systems. The intended audience concerns power network organizations' stakeholders and decision makers, such as asset managers, risk managers, regulators, asset owners, and service providers. The RIDM process details the steps to ensure transparency, consistency, and traceability of the decision by:<br/>
    - specifying the risk decision-making context depending on asset management objectives, available knowledge, and risk stakeholders' concerns;<br/>
    - identifying the appropriate risk management strategies and the knowledge supporting the analyses;<br/>
    - detailing the essential steps for conducting a risk analysis and justifying investments, regardless of the calculation methods used;<br/>
    - providing essential information and warnings to decision makers;<br/>
    - implementing performance evaluation and continuous improvement.<br/>
    The document is based on the asset management principles from ISO 55000:2024 and is aligned with ISO 55001:2024. Compliance with the requirements of this document is independent of compliance with ISO 55001:2024.
- language: fr
  script: Latn
  content: |-
    L'IEC 63223-2:2026 spécifie les exigences, les recommandations et donne des exemples pour la mise en œuvre d’un processus de prise de décision éclairée par les risques (RIDM) pour la gestion des actifs existants des réseaux d’énergie électrique. Les parties prenantes et les décideurs des organismes de réseaux d’énergie électrique, tels que les gestionnaires des actifs, les gestionnaires des risques, les autorités de régulation, les propriétaires des actifs et les fournisseurs de services, constituent le public concerné. Le processus RIDM décrit en détail les étapes qui permettent d’assurer la transparence, la cohérence et la traçabilité de la décision:<br/>
    - en spécifiant le contexte de prise de décision lié aux risques en fonction des objectifs de gestion d’actifs, des connaissances disponibles et des préoccupations des parties prenantes concernées par le risque;<br/>
    - en identifiant les stratégies appropriées de management du risque et les connaissances à l’appui des analyses;<br/>
    - en décrivant les étapes essentielles pour réaliser une analyse du risque et justifier les investissements, quelles que soient les méthodes de calcul utilisées;<br/>
    - en fournissant des informations essentielles et des avertissements aux décideurs;<br/>
    - en mettant en œuvre une évaluation des performances et une amélioration continue.<br/>
    Le présent document s’appuie sur les principes de la gestion d’actifs de l’ISO 55000:2024 et est aligné sur l’ISO 55001:2024. La conformité aux exigences du présent document est indépendante de la conformité à l’ISO 55001:2024.
