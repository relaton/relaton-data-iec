abstract:
- language: en
  script: Latn
  content: |-
    IEC 62133-1:2026 CMV contains both the official standard and its commented version. The commented version provides you with a quick and easy way to compare all the changes between IEC 62133-1:2026 edition 2.0 and the previous IEC 62133-1:2017 edition 1.0. Furthermore, comments from IEC SC 21A experts are provided to explain the reasons of the most relevant changes, or to clarify any part of the content.<br/>
    <br/>
    IEC 62133-1:2026 specifies requirements and tests for the safe operation of portable sealed secondary nickel cells and batteries containing alkaline electrolyte, under intended use and reasonably foreseeable misuse. This second edition cancels and replaces the first edition of IEC 62133-1 published in 2017. It constitutes a technical revision.<br/>
    This edition includes the following significant technical changes with respect to IEC 62133 1:2017:<br/>
    a) removal of the definition "secondary battery";<br/>
    b) removal of the definition "portable battery";<br/>
    c) "removal of the definition "portable cell";<br/>
    d) replacement of the single term "room temperature" with 20 °C ± 5 °C in 7.2.3;<br/>
    e) modification of Figure 1.
