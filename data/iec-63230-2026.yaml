abstract:
- language: en
  script: Latn
  content: |-
    IEC 63230:2026 applies to runners of reaction turbines, regardless of their size and capacity. These can include radial turbines such as Francis turbines, axial turbines such as Kaplan and propeller turbines, as well as diagonal turbines, in all possible configurations. In the case of turbine runners with adjustable blades, the internal mechanical components of the blades' adjustment mechanism are excluded from this document. Pelton turbines, storage pumps and pump-turbines are not covered in this first edition, even though several topics are applicable to these types of hydraulic machines. Specificities and applicability to Pelton turbine and pump-turbines will be discussed in a later revision of the standard<br/>
    This document outlines the methodologies for conducting a fatigue assessment of turbine runners. It encompasses several key aspects, such as defining the load events to be considered during the assessment, determining stresses for each of these load events, as well as the detailed approaches for assessing fatigue of new and existing runners. Additionally, it includes manufacturing and quality assurance requirements to be complied with to achieve the desired material fatigue properties and effectively apply the proposed fatigue assessment methodologies. This document also contains best practices for performing and analysing on-site strain gauge measurements performed on existing runners to evaluate their fatigue life.<br/>
    The purpose of this document is to provide guidelines to assess fatigue in new and existing turbine runners. It does not specify if a fatigue assessment should be performed or not for a given runner. However, Annex B provides guidance to evaluate the necessity of realizing a fatigue assessment or not for a given new runner. The methods described in this document can also be used for remaining life assessments of in-service runners
- language: fr
  script: Latn
  content: |-
    IEC 63230:2026 s'applique aux roues de turbines à réaction, quelles que soient leur taille et leur capacité. Elle peut couvrir les turbines radiales comme les turbines Francis, les turbines axiales comme les turbines Kaplan et les turbines hélices, ainsi que les turbines diagonales, dans toutes les configurations géométriques possibles. Dans le cas des turbines à pales orientables, les composants mécaniques internes du mécanisme de commande des pales sont exclus du présent document. Les turbines Pelton, les pompes d'accumulation et les pompes‑turbines ne sont pas couvertes dans cette première édition, même si plusieurs aspects s'appliquent à ces types de machines hydrauliques. Les spécificités et les aspects relatifs aux turbines Pelton et aux pompes‑turbines seront traités dans une révision ultérieure de la norme.<br/>
    Le présent document décrit les méthodologies pour effectuer une évaluation de la fatigue des roues de turbines. Il couvre plusieurs aspects clés, notamment la définition des événements‑charge à prendre en compte, la détermination des contraintes pour chacun de ces événements‑charge, ainsi que les approches détaillées pour effectuer cette évaluation à la fatigue de roues neuves et existantes. En outre, il définit les exigences de fabrication et d'assurance qualité à respecter pour obtenir les propriétés de fatigue souhaitées sur les matériaux considérés de sorte à se conformer efficacement aux méthodologies d'évaluation en fatigue proposées. Le présent document fournit également les meilleures pratiques pour effectuer et analyser des mesures de jauges extensométriques sur des roues existantes afin d'évaluer leur durée de vie en fatigue.<br/>
    Le présent document a pour objet de fournir des lignes directrices pour effectuer une évaluation de la fatigue des roues neuves et existantes. Il ne spécifie pas s'il convient d'effectuer une évaluation en fatigue ou non pour une roue donnée. Cependant, l'Annexe B propose des recommandations pour évaluer la nécessité ou non de procéder à une évaluation en fatigue d'une roue neuve donnée. Les méthodes décrites dans le présent document peuvent également être utilisées pour les évaluations de durée de vie résiduelles de roues en service
