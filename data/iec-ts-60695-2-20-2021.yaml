abstract:
- language: en
  script: Latn
  content: |-
    IEC TS 60695-2-20:2021 describes a test method that applies to solid electrical insulating materials of which test specimens can be provided. The test measures the time required to ignite a test specimen when it is affected by heat from an electrically heated wire wound around the test specimen. If the test specimen drips, the time at which this occurs is also recorded.<br/>
    The test method can be used to provide classifications which can be used for quality assurance, the preselection of materials of products as described in IEC 60695-1-30, or to verify the required minimum classification of materials used in end products.<br/>
    This basic safety publication is intended for use by technical committees in the preparation of standards in accordance with the principles laid down in IEC Guide 104 and ISO/IEC Guide 51.<br/>
    One of the responsibilities of a technical committee is, wherever applicable, to make use of basic safety publications in the preparation of its publications. The requirements, test methods or test conditions of this basic safety publication will not apply unless specifically referred to or included in the relevant publications.<br/>
    This third edition of IEC TS 60695-2-20 cancels and replaces the second edition of IEC TS 60695-2-20 published in 2004. This edition constitutes a technical revision.<br/>
    This edition includes the following significant technical changes with respect to the previous edition:<br/>
    – Contents page added<br/>
    – Updated Scope (Clause 1)<br/>
    – Updated Terms and Definitions, added new relevant terms (Clause 3)<br/>
    – Updated Principle (Clause 4)<br/>
    – Updated Apparatus (Clause 5; recommendation to change the power source from a.c. to d.c. with a constant current output. Reason for this recommendation: d.c. technology is easier to obtain and to handle, which has been found to improve the Repeatability and Reproducibility of the test.<br/>
    – Updated Test specimen dimensions (6.2)<br/>
    – Revised Test procedure (Clause 8)<br/>
    – Revised Observations and measurements (Clause 9)<br/>
    – Revised Evaluation of test results (Clause 10)<br/>
    – Revised Test report (Clause 11)<br/>
    – Revised Annex A: Deletion of conformational test; Guidance on verification of the heater wire winding before testing<br/>
    – Addition of normative Annex B: HWCT PLC Classes<br/>
    – Addition of informative Annex C: Calibration curve to determine test current (Ic) in a spreadsheet program<br/>
    – Addition of informative Annex D: Precision data<br/>
    It has the status of a basic safety publication in accordance with IEC Guide 104 and ISO/IEC Guide 51.<br/>
