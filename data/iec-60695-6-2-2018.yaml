abstract:
- language: en
  script: Latn
  content: |-
    IEC 60695-6-2:2018 provides a summary of commonly used test methods for the assessment of smoke obscuration. It presents a brief summary of static and dynamic test methods in common use, either as international standards or national or industry standards. It includes special observations on their relevance to electrotechnical products and their materials and to fire scenarios, and gives recommendations on their use.<br/>
    This basic safety publication is primarily intended for use by technical committees in the preparation of standards in accordance with the principles laid down in IEC Guide 104 and ISO/IEC Guide 51. It is not intended for use by manufacturers or certification bodies.<br/>
    It has the status of a basic safety publication in accordance with IEC Guide 104 and ISO/IEC Guide 51.<br/>
    This standard is to be used in conjunction with IEC 60695-6-1.<br/>
    This standard cancels and replaces IEC 60695-6-2 published in 2011. This second edition constitutes a technical revision.<br/>
    This edition includes the following significant technical changes with respect to the previous edition:<br/>
    a) updated introduction;<br/>
    b) updated normative references;<br/>
    c) new text in 4.1;<br/>
    d) deletion of references to IEC 60695-6-30 and -31 (withdrawn)<br/>
    e) updates with respect to ISO 5659-2;<br/>
    f) deletion of references to BS 6853 and CEI 20-37-3 (superseded);<br/>
    g) deletion of references to ISO/TR 5924 (withdrawn);<br/>
    h) updated text with respect to EN 50399;<br/>
    i) updated text with respect to ISO 5660-1;<br/>
    j) addition of new Subclause 7.5<br/>
    k) deletion of Annex B;<br/>
    l) deletion of Annex E;<br/>
    m) additional bibliographic references.<br/>
    Key words: Fire Hazard, Smoke Obscuration
- language: fr
  script: Latn
  content: |-
    IEC 60695-6-2:2018 La présente partie de l’IEC 60695 donne un résumé des méthodes d'essais couramment utilisées pour évaluer l’obscurcissement par la fumée. Elle présente un résumé des méthodes d'essais dynamiques et statiques communément utilisées, aussi bien comme normes internationales que nationales ou en tant que normes industrielles. Elle inclut des observations particulières relatives à leur pertinence par rapport aux produits électrotechniques et leurs matériaux et à des scénarios d’incendie, et donne des recommandations pour leur utilisation.<br/>
    Cette publication fondamentale de sécurité doit être utilisée par les comités d’études pour l’établissement de leurs normes conformément aux principes exposés dans le Guide 104 de l’IEC et dans le Guide ISO/IEC 51.<br/>
    Elle a le statut d’une publication fondamentale de sécurité conformément au Guide IEC 104 et au Guide ISO/IEC 51.<br/>
    Cette norme doit être utilisée conjointement avec l’IEC 60695-6-1.<br/>
    Cette norme annule et remplace l’IEC 60695-6-2 parue en 2011. Cette deuxième édition constitue une révision technique.<br/>
    Cette édition inclut les modifications techniques majeures suivantes par rapport à l'édition précédente:<br/>
    a) mise à jour de l’introduction;<br/>
    b) mise à jour des références normatives;<br/>
    c) nouveau texte au 4.1;<br/>
    d) suppression des références aux IEC 60695-6-30 et -31 (supprimées)<br/>
    e) mises à jour en fonction de l’ISO 5659-2;<br/>
    f) suppression des références à la BS 6853 et la CEI 20-37-3 (remplacées);<br/>
    g) suppression des références à l’ISO/TR 5924 (supprimée);<br/>
    h) mise à jour du texte en fonction de l’EN 50399;<br/>
    i) mise à jour du texte en fonction de l’ISO 5660-1;<br/>
    j) ajout d’un nouveau Paragraphe 7.5<br/>
    k) suppression de l’Annexe B;<br/>
    l) suppression de l’Annexe E;<br/>
    m) ajout de références bibliographiques.<br/>
    Mots clés: risques du feu, Opacité des fumées
