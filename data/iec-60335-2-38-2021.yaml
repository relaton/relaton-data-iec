abstract:
- language: en
  script: Latn
  content: |-
    IEC 60335-2-38:2021 deals with the safety of electrically operated commercial griddles and griddle grills, their rated voltage being not more than 250 V for single-phase appliances connected between one phase and neutral and 480 V for other appliances.<br/>
    These appliances are not intended for household and similar purposes. They are used for commercial processing of food in areas not open to the public, for example in kitchens of restaurants, canteens, hospitals and in commercial enterprises such as bakeries and butcheries.<br/>
    The electrical part of appliances making use of other forms of energy is also within the scope of this standard.<br/>
    As far as is practicable, this standard deals with the common hazards presented by these types of appliances.<br/>
    Attention is drawn to the fact that<br/>
    - for appliances intended to be used in vehicles or on board ships or aircraft, additional requirements can be necessary;<br/>
    - in many countries additional requirements are specified by the national health authorities, the national authorities responsible for the protection of labour, the national water supply authorities and similar authorities.<br/>
    This standard does not apply to<br/>
    - appliances designed exclusively for industrial purposes;<br/>
    - appliances intended to be used in locations where special conditions prevail, such as the presence of a corrosive or explosive atmosphere (dust, vapour or gas);<br/>
    - appliances for continuous mass production of food;<br/>
    - grillers and toasters (IEC 60335-2-48);<br/>
    - appliances incorporating induction heating sources;<br/>
    - battery-operated appliances.<br/>
    This sixth edition cancels and replaces the fifth edition published in 2002, Amendment 1: 2008 and Amendment 2:2017. This edition constitutes a technical revision.<br/>
    This edition includes the following significant technical changes with respect to the previous edition:<br/>
    a) the text has been aligned with IEC 60335-1:2020;<br/>
    b) some notes have been converted to normative text, modified or deleted (Clause 1, 7.15, 9.101, 10.1, 11.7, 13.3, 15.102, 16.2, 22.101, 22.104, 27.2, 30.101);<br/>
    c) relocation of cleaning instructions from 7.12.1 to 7.12;<br/>
    d) relocation of 24.101 to 22.105;<br/>
    e) exclusion of battery-operated appliances and appliances used in areas open to the public (Clause 1)<br/>
    f) conciliation of the text of IEC 60335-2-38 with other standards under IEC/TC61/MT32;<br/>
    g) clarifications to some test specifications have been made (9.101, 15.1.1, 15.102, 18.101, 20.1, 22.101, 22.102).<br/>
    This Part 2 is to be used in conjunction with the latest edition of IEC 60335-1 and its amendments unless that edition precludes it; in that case, the latest edition that does not preclude it is used. It was established on the basis of the sixth edition (2020) of that standard.
- language: fr
  script: Latn
  content: |-
    L'IEC 60335-2-38:2021 traite de la sécurité des plaques à griller électriques à usage commercial dont la tension assignée est inférieure ou égale à 250 V pour les appareils monophasés raccordés entre un conducteur de phase et le conducteur de neutre, et à 480 V pour les autres appareils.<br/>
    Ces appareils ne sont pas destinés à un usage domestique ou analogue. Ils sont destinés à un usage commercial pour le traitement des aliments dans des zones non ouvertes au public, par exemple dans les cuisines de restaurants, les cantines, les hôpitaux et les entreprises commerciales, telles que les boulangeries et les boucheries.<br/>
    La partie électrique des appareils qui utilise d'autres formes d'énergie est également comprise dans le domaine d'application de la présente norme.<br/>
    Dans la mesure du possible, la présente norme traite des dangers courants que présentent ces types d'appareils.<br/>
    L'attention est attirée sur le fait que<br/>
    - pour les appareils destinés à être utilisés dans des véhicules ou à bord de navires ou d'avions, des exigences supplémentaires peuvent être nécessaires;<br/>
    - dans de nombreux pays, des exigences supplémentaires sont spécifiées par les organismes nationaux de la santé, par les organismes nationaux responsables de la protection des travailleurs, par les organismes nationaux responsables de l'alimentation en eau et par des organismes similaires.<br/>
    La présente norme ne s'applique pas<br/>
    - aux appareils prévus exclusivement pour des usages industriels;<br/>
    - aux appareils destinés à être utilisés dans des locaux qui présentent des conditions particulières, telles que la présence d'une atmosphère corrosive ou explosive (poussière, vapeur ou gaz);<br/>
    - aux appareils conçus pour la production continue en masse d'aliments;<br/>
    - aux grills et grille-pain (IEC 60335-2-48);<br/>
    - aux appareils qui incorporent des sources de chauffage à induction;<br/>
    - aux appareils alimentés par batteries.<br/>
    Cette sixième édition annule et remplace la cinquième édition parue en 2002, l'Amendement 1:2008 et l'Amendement 2:2017. Cette édition constitue une révision technique.<br/>
    Cette édition inclut les modifications techniques majeures suivantes par rapport à l'édition précédente:<br/>
    a) alignement du texte sur l'IEC 60335-1:2020;<br/>
    b) conversion en texte normatif, modification ou suppression de certaines notes (Article 1, 7.15, 9.101, 10.1, 11.7, 13.3, 15.102, 16.2, 22.101, 22.104, 27.2, 30.101);<br/>
    c) déplacement des instructions pour le nettoyage du 7.12.1 au 7.12;<br/>
    d) déplacement du 24.101 au 22.105;<br/>
    e) exclusion des appareils alimentés par batteries et des appareils utilisés dans des lieux ouverts au public (Article 1);<br/>
    f) alignement du texte de l'IEC 60335-2-38 sur d'autres normes sous l'IEC/TC61/MT32;<br/>
    g) clarification de certaines modalités d'essais (9.101, 15.1.1, 15.102, 18.101, 20.1, 22.101, 22.102).<br/>
    La présente Partie 2 doit être utilisée conjointement avec la dernière édition de l'IEC 60335-1 et ses amendements, sauf si cette édition l'exclut. Dans ce cas, la dernière édition qui n'exclut pas la présente Partie 2 est utilisée. Elle a été établie sur la base de la sixième édition (2020) de cette norme.
