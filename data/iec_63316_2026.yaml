- content: "IEC 63316:2026 spécifie les protections, les méthodes d'essai et les exigences
    de conformité destinées à réduire le risque de choc électrique et d'incendie associé
    aux tensions et aux courants à des tensions supérieures à 60 V en courant continu
    et à 60 V en courant alternatif.<br />\r\nLe présent document s'applique aux accès
    d'équipements destinés à fournir et à recevoir la puissance de fonctionnement
    par des accès d'équipements de communication au moyen de fils et câbles de communication.
    Il couvre les exigences particulières relatives aux circuits conçus pour transférer
    la puissance en courant alternatif ou continu d'un équipement source d'alimentation
    (PSE, Power Sourcing Equipment) (3.1.2) vers un dispositif alimenté (PD, Powered
    Device) (3.1.3), y compris les répéteurs, amplificateurs, unités de réseaux optiques,
    multiplexeurs d'accès de ligne d'abonné (DSLAM, Digital Subscriber Line Access
    Multiplexer) à distance, équipements de terminaison des fournisseurs de services,
    armoires et équipements de télécommunication à distance, ainsi que les équipements
    passifs de jonction connectés au PSE (3.1.2) et au PD (3.1.3).<br />\r\nLe transfert
    de puissance des accès d'équipements couverts par le présent document utilise
    une tension alternative qui ne provient pas du réseau d'alimentation ou une tension
    continue qui ne provient pas du réseau d'alimentation supérieure à 60 V en courant
    continu, classée ES2 conformément au 5.2.1.2 de l'IEC 62368‑1:2023 ou, dans certains
    cas très contrôlés, classée ES3 conformément à l'IEC 62368‑1:2023.<br />\r\nEXEMPLES<br
    />\r\n− Transfert de puissance en courant continu à des tensions supérieures à
    60 V en courant continu, mais ≤ 120 V en courant continu, classé ES2.<br />\r\n−
    Certains réseaux de télécommunication où la tension était auparavant appelée TRT-3
    (voir l'IEC 62368‑1:2023, Tableau W.3), couramment utilisés pour l'alimentation
    en ligne, de tronçon ou expresse en dehors de l'Amérique du Nord, l'alimentation
    inverse (RPF, Reverse Power Feeding) longue distance, l'alimentation en ligne
    HDSLx RNIS, l'alimentation en ligne à débit primaire E1.<br />\r\n− Certains réseaux
    de télécommunication en Amérique du Nord entre le PSE (3.1.2) du fournisseur de
    services publics et le côté fournisseur de services du PD (3.1.3) à l'interface
    du réseau public (PNI) (3.1.8).<br />\r\n− Pour le transfert de puissance en courant
    continu à des tensions ≥ 120 V en courant continu à ES3: circuits RFT et équipements
    et câblages de réseau de télécommunication associés utilisés par les fournisseurs
    de services de communication et les services publics de communication (par exemple,
    E1/T1, HDSLx, SHDSLx, xDSL, répéteurs et convertisseurs abaisseurs d'alimentation
    ou élévateurs d'alimentation de télécommunication, selon le cas), unités de réseaux
    optiques, DSLAM à distance, etc. Ces circuits RFT sont utilisés entre le PSE (3.1.2)
    du fournisseur de services publics et le côté fournisseur de services du PD (3.1.3)
    à la PNI (3.1.8). Les accès orientés clients de ces équipements sont à une tension
    qui ne dépasse pas 60 V en courant continu et sont couverts par l'IEC 62368-1:2023,
    voir l'Annexe A pour les topologies de déploiement.<br />\r\n− Pour une tension
    de téléalimentation en courant alternatif/en courant continu supérieure à ES1
    sur un câble coaxial dans les circuits utilisés par les fournisseurs de services
    publics de télévision par câble pour les répéteurs, les amplificateurs, les unités
    de réseaux optiques. Les accès orientés clients de ces équipements sont à une
    tension qui ne dépasse pas 60 V en courant continu et sont couverts par l'IEC
    62368-1:2023.<br />\r\nNOTE 1 Tout câble de communication qui permet le transfert
    de puissance entre des équipements de communication est considéré comme un câble
    de communication, même si la communication n'a pas lieu. Par exemple, un convertisseur
    abaisseur d'alimentation ou élévateur d'alimentation, selon le cas, utilisé pour
    alimenter des équipements de télécommunication à distance peut fournir une puissance
    RFT de communication limitée et pas nécessairement des données ou signalisations
    superposées.<br />\r\nLe présent document ne couvre pas les interfaces d'équipements
    relevant du domaine d'application de l'IEC 63315.<br />\r\nNOTE 2 L'IEC 63315
    traite des équipements destinés à fournir ou à recevoir une puissance de charge
    ou de fonctionnement à partir d'interfaces ICT utilisant des fils et des câbles
    ICT, tels que PoE, USB, HDMI, etc., ou l'un quelconque de ces éléments combinés.<br
    />\r\nLe présent document ne couvre pas les signaux de sonnerie relevant du domaine
    d'application de l'IEC 62368-1 ou du domaine d'application de l'IEC 62949:2017.<br
    />\r\nLe présent document ne couvre pas les technologies de télécommunication
    traditionnelles qui fonctionnent à des tensions ne dépassant pas 60 V en courant
    continu (circuits classés ES1 conformément au 5.2.1.1 de l'IEC 62368‑1:2023 et
    identifiés ID 1a, 1b, ou 1c dans le Tableau 13 de l'IEC 62368-1:2023) avec ou
    sans signaux de sonnerie (classés ES2 conformément au 5.2.1.1 de l'IEC 62368-1:2023
    et circuits externes identifiés ID 1a, 1b, ou 1c dans le Tableau 13 de l'IEC 62368-1:2023).
    La téléphonie analogique, RNIS, T1, E1, VDSL, SHDSL, DDS, etc. sont des exemples
    de technologies de communication traditionnelles.<br />\r\nLe présent document
    ne couvre pas les communications sur les lignes du réseau d'alimentation et les
    lignes de transmission et de distribution d'énergie à haute tension.<br />\r\nCette
    première édition annule et remplace l'Article 6 de l'IEC 62368-3 parue en 2017.
    Cette édition constitue une révision technique.<br />\r\nCette édition inclut
    les modifications techniques majeures suivantes par rapport à l'Article 6 de l'IEC
    62368-3 parue en 2017:<br />\r\na) transfert de puissance en courant continu à
    des tensions supérieures à 60 V mais ≤ 120 V en courant continu (ES2), y compris
    les réseaux de télécommunication anciennement désignés par TRT-3;<br />\r\nb)
    transfert de puissance en courant continu à des tensions ≥ 120 V en courant continu
    (ES3), comme les circuits RFT et les équipements de télécommunication associés;<br
    />\r\nc) téléalimentation en courant alternatif/en courant continu supérieure
    à ES1 sur un câble coaxial dans les circuits de fournisseurs de services publics
    de télévision par câble pour les répéteurs, les amplificateurs et les unités de
    réseaux optiques (ONU, Optical Network Unit);<br />\r\nd) clarification concernant
    le câble de communication permettant le transfert de puissance, indépendamment
    de la présence d'une transmission de données."
