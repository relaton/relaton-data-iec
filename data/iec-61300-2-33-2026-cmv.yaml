abstract:
- language: en
  script: Latn
  content: |-
    IEC 61300-2-33:2026 CMV contains both the official standard and its commented version. The commented version provides you with a quick and easy way to compare all the changes between IEC 61300-2-33:2026 edition 4.0 and the previous IEC 61300-2-33:2012 edition 3.0. Furthermore, comments from IEC TC SC 86B experts are provided to explain the reasons of the most relevant changes, or to clarify any part of the content.<br/>
    <br/>
    IEC 61300-2-33:2026 evaluates the behaviour of a fibre optic mechanical splice, a fibre management system, a protective housing or a hardened connector after being subjected to a specified number of assembly and disassembly operations.<br/>
    The test procedures described in this document simulate conditions that the component can encounter during its service lifetime to check the following performance characteristics:<br/>
    - capability of an optical mechanical splice to be reinstalled after being disassembled;<br/>
    - capability to reintroduce fibre management systems and protective housings, accessing fibres and optical components and making reconfigurations without disturbing transmission in adjacent fibre circuits;<br/>
    - sealing performance of the protective housing after frequent opening and closing operations;<br/>
    - sealing performance of the hardened connector after frequent mating and demating operations.<br/>
    This fourth edition cancels and replaces the third edition published in 2012. This edition constitutes a technical revision. This edition includes the following significant technical changes with respect to the previous edition:<br/>
    a) update of the terms and definitions according to IEC 61753-1:2018 and IEC 61756‑1:2019;<br/>
    b) update of the test severities according to the new edition of IEC 61753-1:2018;<br/>
    c) addition of procedure D to verify the sealing performance after frequent mating and demating of a hardened connector.
