abstract:
- language: en
  script: Latn
  content: |-
    IEC 61847:2025 specifies:<br/>
    – the essential non-thermal output characteristics of ultrasonic surgical units;<br/>
    – methods of measurement of these output characteristics;<br/>
    – those characteristics to be declared by the manufacturers of such equipment.<br/>
    This document is applicable to equipment which meets the criteria of a), b) and c) below:<br/>
    a) ultrasonic surgical systems operating in the frequency range 20 kHz to 120 kHz; and<br/>
    b) ultrasonic surgical systems whose use is the fragmentation, emulsification, debridement, or cutting of human tissue, whether or not those effects are delivered in conjunction with tissue removal or coagulation; and<br/>
    c) ultrasonic surgical systems in which an acoustic wave is conducted by means of a specifically designed wave guide to deliver energy to the surgical site.<br/>
    This document is not applicable to:<br/>
    – lithotripsy equipment which uses extracorporeally induced pressure pulses, focused through liquid conducting media and the soft tissues of the body;<br/>
    – surgical systems used as part of the therapeutic process (hyperthermia systems);<br/>
    – surgical systems whose mechanism of action is through frictional heat generated by tissue in contact with the wave guide, e.g. clamp coagulators or clamping vibrational cutters;<br/>
    – surgical systems whose mechanism of action is through focused ultrasound for either thermal degradation (high intensity focused ultrasound – HIFU or HITU) or cavitation erosion (Histotripsy) of tissue remote from the ultrasound transducer;<br/>
    – surgical systems whose mechanism of action is through erosion of hard tissues in contact with the applicator tip, e.g. bone cutting or drilling.<br/>
    This document does not deal with the effectiveness or safety of ultrasonic surgical systems. This document does not deal with airborne noise from the systems, which can affect operators and patients.<br/>
    IEC 61847:2025 cancels and replaces the first edition published in 1998. This edition constitutes a technical revision.<br/>
    This edition includes the following significant technical changes with respect to the previous edition:<br/>
    a) The upper frequency covered by this document has been raised from 60 kHz to 120 kHz.<br/>
    b) The hydrophone method of measuring ultrasound power is now normative. Because of difficulties in using the calorimetry method of measuring ultrasound power, it is no longer the primary approach.<br/>
    c) It is recognised that some systems can have more than one mode of vibration under user control, and the measurement techniques and declarations have been updated to address this.<br/>
    d) The high-frequency component, which relates to cavitation developed at the applicator tip and the vibration amplitude at which cavitation occurs is addressed.<br/>
    e) Specific requirements for measurement at excursion levels where no cavitation is present, and extrapolation to maximum excursion level(s) are described.<br/>
    f) Guidance is provided to adapt the methodology described to more complex designs and vibration patterns, excursion directions, and their output characteristics.<br/>
    g) Guidance is provided with respect to measurement tank arrangements for different types of systems.<br/>
    h) The list of ultrasound methods and systems not covered by this document was extended to incorporate recent developments.<br/>
    i) Definitions for cavitation related terms were added.<br/>
    j) Requirements for the measurement of directivity characteristics of the applicator tip were changed.<br/>
    k) Annex A was modified and Figure A.1 was added.<br/>
    l) New literature was added, and the references to other standards were updated.
- language: fr
  script: Latn
  content: |-
    IEC 61847:2025 spécifie:<br/>
    – les caractéristiques d'émission non thermiques essentielles des unités chirurgicales à ultrasons;<br/>
    – les méthodes de mesure de ces caractéristiques d'émission;<br/>
    – les caractéristiques de ces appareils que les fabricants doivent déclarer.<br/>
    Le présent document s'applique aux appareils qui respectent les critères a), b) et c) ci-dessous:<br/>
    a) systèmes chirurgicaux à ultrasons fonctionnant dans la plage de fréquences de 20 kHz à 120 kHz; et<br/>
    b) systèmes à ultrasons appliqués à la fragmentation, à l'émulsification, au débridement ou à la découpe de tissus humains, ces effets étant ou non utilisés conjointement avec l'élimination ou la coagulation des tissus; et<br/>
    c) systèmes chirurgicaux à ultrasons dans lesquels une onde acoustique est guidée par un guide d'onde spécial afin d'apporter de l'énergie au site chirurgical.<br/>
    Le présent document ne s'applique pas:<br/>
    – aux appareils de lithotripsie employant des pulsations de pression induites par voie extracorporelle, focalisées à travers un liquide conducteur et dans les tissus mous du corps;<br/>
    – aux systèmes chirurgicaux utilisés dans des procédés thérapeutiques (systèmes d'hyperthermie);<br/>
    – aux systèmes chirurgicaux dont le mécanisme d'action repose sur la chaleur de friction générée par les tissus en contact avec le guide d'onde, par exemple pinces à coagulation ou pinces de coupe vibratoires;<br/>
    – aux systèmes chirurgicaux dont le mécanisme d'action repose sur l'application d'ultrasons pour assurer la dégradation thermique (ultrasons focalisés de haute intensité – UFHI) ou l'érosion par cavitation (histotripsie) des tissus à distance du transducteur à ultrasons;<br/>
    – aux systèmes chirurgicaux dont le mécanisme d'action repose sur l'érosion des tissus durs en contact avec l'embout applicateur, par exemple pour découper ou percer des os.<br/>
    Le présent document ne traite pas de l'efficacité ou de la sécurité des systèmes chirurgicaux à ultrasons. Le présent document ne traite pas non plus du bruit aérien émis par les systèmes, qui peut affecter les opérateurs et les patients.<br/>
    IEC 61847:2025 annule et remplace la première édition parue en 1998. Cette édition constitue une révision technique.<br/>
    Cette édition inclut les modifications techniques majeures suivantes par rapport à l'édition précédente:<br/>
    a) la fréquence supérieure couverte par le présent document a été portée de 60 kHz à 120 kHz;<br/>
    b) la méthode de l'hydrophone pour mesurer la puissance des ultrasons a désormais une valeur normative. En raison des difficultés liées à l'utilisation de la méthode de mesurage de la puissance des ultrasons par calorimétrie, celle-ci n'est plus l'approche principale;<br/>
    c) il est reconnu que certains systèmes peuvent disposer de plusieurs modes de vibration sous le contrôle de l'utilisateur, et les techniques de mesurage et les déclarations ont été mises à jour en ce sens;<br/>
    d) la composante à haute fréquence, qui est liée à l'apparition de cavitation au niveau de l'embout applicateur, et l'amplitude vibratoire à laquelle la cavitation apparaît sont étudiées;<br/>
    e) des exigences spécifiques pour le mesurage à des niveaux de déplacement auxquels il n'y a pas de phénomène de cavitation ainsi que l'extrapolation aux niveaux de déplacement maximaux sont définies;<br/>
    f) des recommandations sont fournies pour adapter la méthodologie décrite à des conceptions et des motifs vibratoires plus complexes, aux directions de déplacement et à leurs caractéristiques d'émission;<br/>
    g) des recommandations relatives à la configuration des réservoirs de mesure pour différents types de systèmes sont également fournies;<br/>
    h) la liste des méthodes et systèmes à ultrasons non couverts par le présent document a été étendue afin d'intégrer les récents développements;<br/>
    i) les définitions des termes liés à la cavitation ont été ajoutées;<br/>
    j) les exigences relatives au mesurage des caractéristiques directionnelles de l'embout applicateur ont été modifiées;<br/>
    k) l'Annexe A a été modifiée et la Figure A.1 a été ajoutée;<br/>
    l) de nouveaux ouvrages de référence ont été ajoutés, et les références à d'autres normes ont été mises à jour.
