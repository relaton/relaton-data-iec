abstract:
- language: en
  script: Latn
  content: |-
    IEC 60728-114:2026 describes the system and equipment specification of FTTH/FTTB (fibre to the home/fibre to the building) networks where information is transmitted in both forward and return path directions using RF subcarrier multiplexing technology, and where the return path transmission uses additionally time division multiple access technique imposed by the transmission of the return path signals using a TDMA (e.g. TDMA mode of DOCSIS) protocol. Such systems are called RF over glass (RFoG) and consist of an RFoG optical network unit (R-ONU), an optical distribution network based on xPON structure, and an RFoG optical return path receiver. This document specifies the basic system parameters and methods of measurement for RFoG systems in order to assess the system performance and its performance limits.<br/>
    The detailed description of physical layer is out of the scope of this document and it does not include IP transport technologies.
- language: fr
  script: Latn
  content: |-
    L'IEC 60728-114:2026 décrit les spécifications des systèmes et matériels des réseaux DFA/DFI (desserte par fibre de l'abonné/desserte par fibre de l'immeuble), où les informations sont transmises dans les deux sens, en voie directe et en voie de retour, à l'aide de la technologie de multiplexage des sous‑porteuses RF, et où la transmission en voie de retour utilise en outre la technique d'accès multiple à répartition temporelle, imposée par la transmission des signaux en voie de retour à l'aide d'un protocole TDMA (mode TDMA de la DOCSIS, par exemple). Ces systèmes dits RF sur verre (RFoG) se composent d'une unité de réseau optique RFoG (R‑ONU), d'un réseau de distribution optique fondé sur la structure xPON et d'un récepteur optique à voie de retour RFoG. Le présent document spécifie les paramètres de base du système et les méthodes de mesurage des systèmes RFoG, afin d'évaluer les performances du système et ses limites de performances.<br/>
    La description précise de la couche physique ne fait pas partie du domaine d'application du présent document et n'inclut pas les technologies de transport IP.
