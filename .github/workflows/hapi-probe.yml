name: hapi-surface-probe

on:
  workflow_dispatch:

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: "3.3"
      - env:
          K: ${{ secrets.IEC_HAPI_PROJ_PUBS_KEY }}
          S: ${{ secrets.IEC_HAPI_PROJ_PUBS_SECRET }}
        run: |
          ruby <<'RUBY'
          require "net/http"
          require "json"
          require "uri"

          def http
            Net::HTTP.new("api.iec.ch", 443).tap { |h| h.use_ssl = true }
          end

          tok_uri = URI("https://api.iec.ch/oauth/client_credential/accesstoken?grant_type=client_credentials")
          tok_req = Net::HTTP::Post.new(tok_uri)
          tok_req.basic_auth ENV["K"], ENV["S"]
          tok_req.set_form_data("grant_type" => "client_credentials")
          tok_res = http.request(tok_req)
          puts "token: #{tok_res.code}"
          tok_body = (JSON.parse(tok_res.body) rescue {})
          token = tok_body["token"] || tok_body["access_token"]
          puts "token keys: #{tok_body.keys.inspect}; acquired=#{!token.to_s.empty?}"
          exit 1 if token.to_s.empty?

          get = lambda do |path|
            u = URI("https://api.iec.ch#{path}")
            g = Net::HTTP::Get.new(u)
            g["Authorization"] = "Bearer #{token}"
            http.request(g)
          end

          paths = %w[
            /harmonized/openapi.json
            /harmonized/publications?size=2
            /harmonized/projects?size=2
            /harmonized/projects?size=2&lastChangeTimestampFrom=2026-09-01
            /harmonized/newdocs?size=2
            /harmonized/corrigenda?size=2
            /harmonized/tcsc?size=2
            /harmonized/technical-committees?size=2
            /harmonized/committees?size=2
            /harmonized/price-codes?size=2
            /harmonized/ics?size=2
            /harmonized/stages?size=2
            /harmonized/withdrawn?size=2
          ]
          paths.each do |p|
            r = get.call(p)
            puts "== #{p.sub('?size=2', '')} -> #{r.code}"
            next unless r.code == "200"
            j = JSON.parse(r.body) rescue nil
            unless j
              puts "   non-JSON: #{r.body.to_s[0, 120]}"
              next
            end
            puts "   keys: #{j.keys.inspect}"
            arr = j.values.find { |v| v.is_a?(Array) } || []
            puts "   entries: #{arr.size}"
            if (f = arr.first)
              puts "   fields: #{f.keys.inspect}"
              snippet = f.slice("reference", "projectReference", "urn", "stage", "status",
                                "stdType", "releaseDate", "lastChangeTimestamp", "title")
              puts "   sample: #{snippet.inspect[0, 400]}"
            end
          end
          RUBY
